<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MED421 learn — ร่างหน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* ร่าง: MED421 learn ในธีม Teaching Round v3 — พื้นเทาอ่อน การ์ดขาวมุมมน สีเน้น lime */
:root{
  --desk:#eff0ec; --sheet:#ffffff; --well:#f6f7f3; --ink:#151a14; --muted:#6b7268; --rule:#e2e5de; --line:#eceee8;
  --pen:#3d7a17; --red:#c2372c; --red-bg:#fdecea; --lo:#2c68b0;
  --lime:#d5f0a6; --lime-2:#a8dc5c; --lime-3:#86c43c; --on-lime:#1b2e0b;
  --s-bg:#e6effa; --s-fg:#2f62a0; --o-bg:#e5f3e0; --o-fg:#3d7a17; --a-bg:#fbf0d9; --a-fg:#94600f;
  --shadow:0 12px 32px -12px rgba(20,30,10,.35);
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.3,1.4,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0f110e; --sheet:#1a1d18; --well:#141712; --ink:#e9ede5; --muted:#9aa294; --rule:#2b3027; --line:#23271f;
  --pen:#a8dc5c; --red:#ff8b7c; --red-bg:#3a201d; --lo:#7fb2f0;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --shadow:0 12px 32px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f110e; --sheet:#1a1d18; --well:#141712; --ink:#e9ede5; --muted:#9aa294; --rule:#2b3027; --line:#23271f;
  --pen:#a8dc5c; --red:#ff8b7c; --red-bg:#3a201d; --lo:#7fb2f0;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --shadow:0 12px 32px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;text-wrap:pretty;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding:16px 16px calc(132px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.top>div{min-width:0}h1{overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted);line-height:1.6}

/* หัวหน้า */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:14px;color:var(--muted);line-height:1.6}
h1{font-size:30px;line-height:1.3;letter-spacing:-.01em}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--sheet);font-size:14px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--lime-3)}

/* แถบชุดวิชา (แทน tabs เดิม) */
.rail{position:sticky;top:0;z-index:5;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--desk) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:999px;background:var(--sheet);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-current="true"]{background:var(--lime);border-color:var(--lime-3);color:var(--on-lime)}

/* การ์ดใหญ่สีเขียว + วงแหวน */
.hero{display:grid;gap:16px;background:var(--lime);color:var(--on-lime);border-radius:24px;padding:20px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-t{display:grid;gap:4px;min-width:0}
.kicker{font-size:14px;font-weight:500;opacity:.8}
.hero h2{font-size:24px;line-height:1.35}
.hero p{margin:0;font-size:14px;opacity:.85}
.ring{--p:0;flex:0 0 auto;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime-3) calc(var(--p)*360deg),color-mix(in srgb,var(--sheet) 55%,transparent) 0);transition:--p .6s}
.ring-in{width:66px;height:66px;border-radius:50%;background:var(--sheet);color:var(--ink);display:grid;place-content:center;text-align:center}
.ring-in b{font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.ring-in small{font-size:12px;color:var(--muted);line-height:1.3}
.next{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 8px 8px 16px;border:0;border-radius:999px;background:var(--sheet);color:var(--ink);text-align:left}
.next span{flex:1;min-width:0;display:grid;line-height:1.4}
.next small{font-size:12px;color:var(--muted)}
.next b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next i{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime-2);color:#14200a;font-style:normal;font-weight:600}

/* ไทล์สรุป */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:grid;gap:4px;align-content:start;text-align:left;min-height:104px;padding:16px;border:0;border-radius:20px;background:var(--sheet);min-width:0}
.tile small{font-size:12px;font-weight:600;color:var(--muted);line-height:1.5}
.tile b{font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile b em{font-style:normal;font-size:14px;font-weight:500;color:var(--muted)}
.tile.warn b{color:var(--red)}

/* กริดการ์ดคาบ */
.w-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.w-head h3{font-size:20px;line-height:1.4}
.w-count{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;text-align:left;min-width:0;min-height:184px;padding:16px;border:0;border-radius:20px;background:var(--sheet);color:var(--ink);overflow:hidden}
.card.done{box-shadow:inset 0 4px 0 var(--lime-3)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-no{font-size:24px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.c-day{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:2px 8px;white-space:nowrap}
.c-t{font-size:16px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.c-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:auto}
.c-bar i{display:block;height:100%;background:var(--lime-3);border-radius:6px}
.c-foot{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--well);color:var(--muted);white-space:nowrap}
.tag.go{background:var(--s-bg);color:var(--s-fg)}
.tag.ok{background:var(--o-bg);color:var(--o-fg)}
.tag.bad{background:var(--red-bg);color:var(--red)}
.empty{grid-column:1/-1;border:2px dashed var(--rule);border-radius:20px;padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ปุ่มเด้งตอนกด */
.press{transition:transform .15s var(--spring)}
.press:active{transform:scale(.96)}
.pop{animation:pop .32s var(--spring)}
@keyframes pop{40%{transform:scale(1.06)}100%{transform:none}}

/* แถบล่างลอย 5 ปุ่ม */
.bnav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--sheet);border-radius:28px;padding:8px 4px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.bn{position:relative;display:grid;justify-items:center;gap:2px;min-height:52px;padding:4px 0;background:none;border:0;color:var(--muted);font-size:12px;line-height:1.4;font-weight:500}
.bn-ic{display:grid;place-items:center;width:28px;height:28px;transition:transform .15s var(--spring)}
.bn:active .bn-ic{transform:scale(.88)}
.bn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bn[aria-current="page"]{color:var(--ink);font-weight:600}
.bn[aria-current="page"] svg{stroke-width:2.1}
.bn-main .bn-ic{width:60px;height:60px;margin-top:-30px;border-radius:50%;background:var(--lime-2);color:#14200a;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--lime-3) 80%,transparent),0 0 0 6px var(--sheet)}
.bn-main svg{width:28px;height:28px;stroke-width:2;transition:transform .22s var(--spring)}
.bn-main.rm-on .bn-ic{background:var(--ink);color:var(--lime-2)}
.bn-main.rm-on svg{transform:rotate(135deg)}
.bn .n{position:absolute;top:-6px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:20px;font-weight:600;text-align:center;box-shadow:0 0 0 2px var(--sheet)}
.bn-main{touch-action:none}

/* วงล้อทางลัด */
.rmenu{position:fixed;inset:0;z-index:19;touch-action:none;-webkit-user-select:none;user-select:none;background:color-mix(in srgb,#0b0f0a 46%,transparent);-webkit-backdrop-filter:blur(10px) saturate(.9);backdrop-filter:blur(10px) saturate(.9);opacity:0;transition:opacity .2s ease}
.rmenu.on{opacity:1}.rmenu.out{opacity:0;transition-duration:.16s}
.rm-ring{position:absolute;width:340px;height:340px;margin:-170px 0 0 -170px}
.rm-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rm-seg{transform-box:view-box;transform-origin:0 0;transition:transform .18s var(--spring);animation:rmIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d)}
.rm-seg path{fill:color-mix(in srgb,#1d2a1a 86%,transparent);stroke:color-mix(in srgb,var(--lime-2) 55%,transparent);stroke-width:1.2;transition:fill .15s,stroke .15s}
.rm-seg.hl{transform:translate(var(--tx),var(--ty))}
.rm-seg.hl path{fill:color-mix(in srgb,var(--lime-2) 88%,#1d2a1a);stroke:var(--lime);stroke-width:2}
.rm-seg.pick{animation:rmPick .26s ease-out}
.rm-hubc{fill:color-mix(in srgb,#141c12 90%,transparent);stroke:color-mix(in srgb,var(--lime-2) 45%,transparent);stroke-width:1.2;transform-box:view-box;transform-origin:0 0;animation:rmHub .32s var(--spring) backwards}
.rm-glow{fill:none;stroke:var(--lime-2);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .15s}
.rm-glow.on{opacity:.9}
@keyframes rmIn{from{opacity:0;transform:rotate(-28deg) scale(.55)}to{opacity:1;transform:none}}
@keyframes rmHub{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes rmPick{50%{transform:translate(calc(var(--tx)*2.2),calc(var(--ty)*2.2)) scale(1.04)}}
.rm-it{position:absolute;left:50%;top:50%;width:76px;margin:-32px 0 0 -38px;display:grid;justify-items:center;gap:2px;padding:4px 0;border:0;background:none;color:#e6f2dc;text-align:center;transform:translate(var(--x),var(--y));transition:transform .18s var(--spring),color .15s;animation:rmItIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d);pointer-events:none}
.rm-it svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rm-it span{font-size:12px;line-height:1.3;font-weight:600;white-space:nowrap}
.rm-it .n{position:absolute;top:-2px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:18px}
.rm-it.hl{color:#14200a;transform:translate(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty)))}
@keyframes rmItIn{from{opacity:0;transform:translate(calc(var(--x)*.4),calc(var(--y)*.4)) scale(.5)}to{opacity:1}}
.rm-hub{position:absolute;left:50%;top:50%;width:132px;margin-left:-66px;transform:translateY(-50%);display:grid;justify-items:center;gap:2px;text-align:center;color:#e6f2dc;pointer-events:none;animation:rmHubT .3s .08s ease-out backwards}
.rm-hub b{font-size:16px;line-height:1.35;font-weight:600}
.rm-hub small{font-size:12px;line-height:1.45;color:#b6c7aa}
.rm-hub .tagc{font-size:12px;font-weight:600;color:#14200a;background:var(--lime-2);border-radius:999px;padding:1px 8px;margin-bottom:4px}
@keyframes rmHubT{from{opacity:0;transform:translateY(-50%) scale(.8)}}
.rm-tip{position:absolute;left:16px;right:16px;text-align:center;font-size:14px;color:#dfe9d6;opacity:.85}

/* หน้าต่างเลื่อนขึ้นจากด้านล่าง */
.sheet-dlg{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(640px,100%);max-width:none;max-height:min(86vh,760px);padding:0;border:0;border-radius:24px 24px 0 0;background:var(--sheet);color:var(--ink);box-shadow:0 -12px 40px -16px rgba(10,20,5,.45);overflow:hidden}
.sheet-dlg[open]{display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.25,1)}
.sheet-dlg.out{animation:down .18s ease-in forwards}
.sheet-dlg::backdrop{background:rgba(12,16,10,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s ease}
@media (min-width:720px){.sheet-dlg{inset:0;margin:auto;border-radius:24px}}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(30%);opacity:0}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule);margin:8px auto 0;flex:0 0 auto}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 8px}
.sh-ht{flex:1;min-width:0;display:grid;gap:2px}
.sh-ht small{font-size:14px;color:var(--muted)}
.sh-ht h3{font-size:20px;line-height:1.4}
.x{flex:0 0 auto;width:44px;height:44px;border-radius:999px;border:0;background:var(--well);font-size:18px}
.sh-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 8px;overscroll-behavior:contain}
.sh-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.sh-list li{counter-increment:s}
.sh-list button{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:16px;background:var(--well);text-align:left}
.sh-list .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--sheet);color:var(--muted);font-family:var(--f-mono)}
.sh-list .num::before{content:counter(s)}
.sh-list .ok .num{background:var(--lime-2);color:#14200a}
.sh-list .ok .num::before{content:"✓"}
.sh-list .part .num{box-shadow:inset 0 0 0 2px var(--lime-3);color:var(--ink)}
.sh-list .tt{font-size:14px;font-weight:500;line-height:1.5;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-list .qq{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-foot{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font-size:14px;font-weight:500}
.btn.primary{width:100%;min-height:52px;background:var(--lime-2);border-color:var(--lime-2);color:#14200a;font-weight:600;font-size:16px}

/* toast */
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);max-width:min(88vw,420px);background:var(--ink);color:var(--sheet);padding:12px 16px;border-radius:16px;font-size:16px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:70}
.toast.on{opacity:.94;transform:translate(-50%,-50%) scale(1)}
.mocknote{font-size:12px;color:var(--muted);text-align:center;margin:0}
.slide-l{animation:sl .26s cubic-bezier(.2,.9,.25,1)}.slide-r{animation:sr .26s cubic-bezier(.2,.9,.25,1)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div><div class="eyebrow">MED421 · Internal medicine</div><h1 id="title">Heme/Onc</h1><div class="sub" id="thai"></div></div>
    <span class="sync"><i></i>บันทึกในบัญชี</span>
  </header>
  <div class="rail"><div class="chips" id="chips" role="tablist" aria-label="ชุดวิชา"></div></div>
  <main id="main"></main>
  <p class="mocknote">ร่างหน้าตา · ชื่อคาบและหัวข้อเป็นข้อมูลจริงของชุด Heme/Onc และ AIR · ตัวเลขความคืบหน้าเป็นตัวอย่าง</p>
</div>

<nav class="bnav" id="bnav" aria-label="หน้าหลักของแอป"></nav>
<dialog class="sheet-dlg" id="sheet" aria-labelledby="shT"></dialog>

    else if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();setHl((hl+1+N)%N);its[hl].focus({preventScroll:true})}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();setHl(hl<0?N-1:(hl-1+N)%N);its[hl].focus({preventScroll:true})}
    else if((e.key==="Enter"||e.key===" ")&&hl>=0&&document.activeElement!==mb){e.preventDefault();pick(hl)}}
  var dragging=!!drag,moved=false,sx2=drag?drag.x:0,sy2=drag?drag.y:0;
  function mv(e){var r=at(e.clientX,e.clientY);if(dragging&&(Math.abs(e.clientX-sx2)>10||Math.abs(e.clientY-sy2)>10))moved=true;if(e.pointerType==="mouse"||dragging)setHl(r.i)}
  function up(e){if(!dragging)return;dragging=false;if(moved){var r=at(e.clientX,e.clientY);if(r.i>=0)pick(r.i);else setHl(-1)}}
  window.addEventListener("pointermove",mv,true);window.addEventListener("pointerup",up,true);window.addEventListener("pointercancel",up,true);
  ov.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".rm-it"))return;var r=at(e.clientX,e.clientY);if(r.i>=0)pick(r.i);else close()});
  document.addEventListener("keydown",key,true);window.addEventListener("resize",place);
  place();requestAnimationFrame(function(){if(!closing)ov.classList.add("on")});
  if(!drag)setTimeout(function(){if(!closing)try{its[0].focus({preventScroll:true});setHl(0)}catch(_){}},RM?0:120);
  M={close:close};
}
var lastPD=0;
mb.addEventListener("pointerdown",function(e){if(e.button>0)return;lastPD=Date.now();e.preventDefault();if(M){M.close();return}openMenu({x:e.clientX,y:e.clientY})});
mb.addEventListener("click",function(){if(Date.now()-lastPD>800){if(M)M.close();else openMenu(null)}});
window.openQuickMenu=function(){openMenu(null)};

renderChips();render(0);
})();
</script>
