<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MED421 learn — ร่างหน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* ร่าง: MED421 learn ในธีม Teaching Round v3 — พื้นเทาอ่อน การ์ดขาวมุมมน สีเน้น lime */
:root{
  --desk:#eff0ec; --sheet:#ffffff; --well:#f6f7f3; --ink:#151a14; --muted:#6b7268; --rule:#e2e5de; --line:#eceee8;
  --pen:#3d7a17; --red:#c2372c; --red-bg:#fdecea; --lo:#2c68b0;
  --lime:#d5f0a6; --lime-2:#a8dc5c; --lime-3:#86c43c; --on-lime:#1b2e0b;
  --s-bg:#e6effa; --s-fg:#2f62a0; --o-bg:#e5f3e0; --o-fg:#3d7a17; --a-bg:#fbf0d9; --a-fg:#94600f;
  --shadow:0 12px 32px -12px rgba(20,30,10,.35);
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.3,1.4,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0f110e; --sheet:#1a1d18; --well:#141712; --ink:#e9ede5; --muted:#9aa294; --rule:#2b3027; --line:#23271f;
  --pen:#a8dc5c; --red:#ff8b7c; --red-bg:#3a201d; --lo:#7fb2f0;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --shadow:0 12px 32px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f110e; --sheet:#1a1d18; --well:#141712; --ink:#e9ede5; --muted:#9aa294; --rule:#2b3027; --line:#23271f;
  --pen:#a8dc5c; --red:#ff8b7c; --red-bg:#3a201d; --lo:#7fb2f0;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --shadow:0 12px 32px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;text-wrap:pretty;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding:16px 16px calc(132px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.top>div{min-width:0}h1{overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted);line-height:1.6}

/* หัวหน้า */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:14px;color:var(--muted);line-height:1.6}
h1{font-size:30px;line-height:1.3;letter-spacing:-.01em}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--sheet);font-size:14px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--lime-3)}

/* แถบชุดวิชา (แทน tabs เดิม) */
.rail{position:sticky;top:0;z-index:5;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--desk) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:999px;background:var(--sheet);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-current="true"]{background:var(--lime);border-color:var(--lime-3);color:var(--on-lime)}

/* การ์ดใหญ่สีเขียว + วงแหวน */
.hero{display:grid;gap:16px;background:var(--lime);color:var(--on-lime);border-radius:24px;padding:20px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-t{display:grid;gap:4px;min-width:0}
.kicker{font-size:14px;font-weight:500;opacity:.8}
.hero h2{font-size:24px;line-height:1.35}
.hero p{margin:0;font-size:14px;opacity:.85}
.ring{--p:0;flex:0 0 auto;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime-3) calc(var(--p)*360deg),color-mix(in srgb,var(--sheet) 55%,transparent) 0);transition:--p .6s}
.ring-in{width:66px;height:66px;border-radius:50%;background:var(--sheet);color:var(--ink);display:grid;place-content:center;text-align:center}
.ring-in b{font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.ring-in small{font-size:12px;color:var(--muted);line-height:1.3}
.next{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 8px 8px 16px;border:0;border-radius:999px;background:var(--sheet);color:var(--ink);text-align:left}
.next span{flex:1;min-width:0;display:grid;line-height:1.4}
.next small{font-size:12px;color:var(--muted)}
.next b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next i{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime-2);color:#14200a;font-style:normal;font-weight:600}

/* ไทล์สรุป */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:grid;gap:4px;align-content:start;text-align:left;min-height:104px;padding:16px;border:0;border-radius:20px;background:var(--sheet);min-width:0}
.tile small{font-size:12px;font-weight:600;color:var(--muted);line-height:1.5}
.tile b{font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile b em{font-style:normal;font-size:14px;font-weight:500;color:var(--muted)}
.tile.warn b{color:var(--red)}

/* กริดการ์ดคาบ */
.w-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.w-head h3{font-size:20px;line-height:1.4}
.w-count{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;text-align:left;min-width:0;min-height:184px;padding:16px;border:0;border-radius:20px;background:var(--sheet);color:var(--ink);overflow:hidden}
.card.done{box-shadow:inset 0 4px 0 var(--lime-3)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-no{font-size:24px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.c-day{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:2px 8px;white-space:nowrap}
.c-t{font-size:16px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.c-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:auto}
.c-bar i{display:block;height:100%;background:var(--lime-3);border-radius:6px}
.c-foot{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--well);color:var(--muted);white-space:nowrap}
.tag.go{background:var(--s-bg);color:var(--s-fg)}
.tag.ok{background:var(--o-bg);color:var(--o-fg)}
.tag.bad{background:var(--red-bg);color:var(--red)}
.empty{grid-column:1/-1;border:2px dashed var(--rule);border-radius:20px;padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ปุ่มเด้งตอนกด */
.press{transition:transform .15s var(--spring)}
.press:active{transform:scale(.96)}
.pop{animation:pop .32s var(--spring)}
@keyframes pop{40%{transform:scale(1.06)}100%{transform:none}}

/* แถบล่างลอย 5 ปุ่ม */
.bnav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--sheet);border-radius:28px;padding:8px 4px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.bn{position:relative;display:grid;justify-items:center;gap:2px;min-height:52px;padding:4px 0;background:none;border:0;color:var(--muted);font-size:12px;line-height:1.4;font-weight:500}
.bn-ic{display:grid;place-items:center;width:28px;height:28px;transition:transform .15s var(--spring)}
.bn:active .bn-ic{transform:scale(.88)}
.bn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bn[aria-current="page"]{color:var(--ink);font-weight:600}
.bn[aria-current="page"] svg{stroke-width:2.1}
.bn-main .bn-ic{width:60px;height:60px;margin-top:-30px;border-radius:50%;background:var(--lime-2);color:#14200a;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--lime-3) 80%,transparent),0 0 0 6px var(--sheet)}
.bn-main svg{width:28px;height:28px;stroke-width:2;transition:transform .22s var(--spring)}
.bn-main.rm-on .bn-ic{background:var(--ink);color:var(--lime-2)}
.bn-main.rm-on svg{transform:rotate(135deg)}
.bn .n{position:absolute;top:-6px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:20px;font-weight:600;text-align:center;box-shadow:0 0 0 2px var(--sheet)}
.bn-main{touch-action:none}

/* วงล้อทางลัด */
.rmenu{position:fixed;inset:0;z-index:19;touch-action:none;-webkit-user-select:none;user-select:none;background:color-mix(in srgb,#0b0f0a 46%,transparent);-webkit-backdrop-filter:blur(10px) saturate(.9);backdrop-filter:blur(10px) saturate(.9);opacity:0;transition:opacity .2s ease}
.rmenu.on{opacity:1}.rmenu.out{opacity:0;transition-duration:.16s}
.rm-ring{position:absolute;width:340px;height:340px;margin:-170px 0 0 -170px}
.rm-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rm-seg{transform-box:view-box;transform-origin:0 0;transition:transform .18s var(--spring);animation:rmIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d)}
.rm-seg path{fill:color-mix(in srgb,#1d2a1a 86%,transparent);stroke:color-mix(in srgb,var(--lime-2) 55%,transparent);stroke-width:1.2;transition:fill .15s,stroke .15s}
.rm-seg.hl{transform:translate(var(--tx),var(--ty))}
.rm-seg.hl path{fill:color-mix(in srgb,var(--lime-2) 88%,#1d2a1a);stroke:var(--lime);stroke-width:2}
.rm-seg.pick{animation:rmPick .26s ease-out}
.rm-hubc{fill:color-mix(in srgb,#141c12 90%,transparent);stroke:color-mix(in srgb,var(--lime-2) 45%,transparent);stroke-width:1.2;transform-box:view-box;transform-origin:0 0;animation:rmHub .32s var(--spring) backwards}
.rm-glow{fill:none;stroke:var(--lime-2);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .15s}
.rm-glow.on{opacity:.9}
@keyframes rmIn{from{opacity:0;transform:rotate(-28deg) scale(.55)}to{opacity:1;transform:none}}
@keyframes rmHub{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes rmPick{50%{transform:translate(calc(var(--tx)*2.2),calc(var(--ty)*2.2)) scale(1.04)}}
.rm-it{position:absolute;left:50%;top:50%;width:76px;margin:-32px 0 0 -38px;display:grid;justify-items:center;gap:2px;padding:4px 0;border:0;background:none;color:#e6f2dc;text-align:center;transform:translate(var(--x),var(--y));transition:transform .18s var(--spring),color .15s;animation:rmItIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d);pointer-events:none}
.rm-it svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rm-it span{font-size:12px;line-height:1.3;font-weight:600;white-space:nowrap}
.rm-it .n{position:absolute;top:-2px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:18px}
.rm-it.hl{color:#14200a;transform:translate(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty)))}
@keyframes rmItIn{from{opacity:0;transform:translate(calc(var(--x)*.4),calc(var(--y)*.4)) scale(.5)}to{opacity:1}}
.rm-hub{position:absolute;left:50%;top:50%;width:132px;margin-left:-66px;transform:translateY(-50%);display:grid;justify-items:center;gap:2px;text-align:center;color:#e6f2dc;pointer-events:none;animation:rmHubT .3s .08s ease-out backwards}
.rm-hub b{font-size:16px;line-height:1.35;font-weight:600}
.rm-hub small{font-size:12px;line-height:1.45;color:#b6c7aa}
.rm-hub .tagc{font-size:12px;font-weight:600;color:#14200a;background:var(--lime-2);border-radius:999px;padding:1px 8px;margin-bottom:4px}
@keyframes rmHubT{from{opacity:0;transform:translateY(-50%) scale(.8)}}
.rm-tip{position:absolute;left:16px;right:16px;text-align:center;font-size:14px;color:#dfe9d6;opacity:.85}

/* หน้าต่างเลื่อนขึ้นจากด้านล่าง */
.sheet-dlg{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(640px,100%);max-width:none;max-height:min(86vh,760px);padding:0;border:0;border-radius:24px 24px 0 0;background:var(--sheet);color:var(--ink);box-shadow:0 -12px 40px -16px rgba(10,20,5,.45);overflow:hidden}
.sheet-dlg[open]{display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.25,1)}
.sheet-dlg.out{animation:down .18s ease-in forwards}
.sheet-dlg::backdrop{background:rgba(12,16,10,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s ease}
@media (min-width:720px){.sheet-dlg{inset:0;margin:auto;border-radius:24px}}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(30%);opacity:0}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule);margin:8px auto 0;flex:0 0 auto}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 8px}
.sh-ht{flex:1;min-width:0;display:grid;gap:2px}
.sh-ht small{font-size:14px;color:var(--muted)}
.sh-ht h3{font-size:20px;line-height:1.4}
.x{flex:0 0 auto;width:44px;height:44px;border-radius:999px;border:0;background:var(--well);font-size:18px}
.sh-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 8px;overscroll-behavior:contain}
.sh-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.sh-list li{counter-increment:s}
.sh-list button{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:16px;background:var(--well);text-align:left}
.sh-list .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--sheet);color:var(--muted);font-family:var(--f-mono)}
.sh-list .num::before{content:counter(s)}
.sh-list .ok .num{background:var(--lime-2);color:#14200a}
.sh-list .ok .num::before{content:"✓"}
.sh-list .part .num{box-shadow:inset 0 0 0 2px var(--lime-3);color:var(--ink)}
.sh-list .tt{font-size:14px;font-weight:500;line-height:1.5;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-list .qq{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-foot{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font-size:14px;font-weight:500}
.btn.primary{width:100%;min-height:52px;background:var(--lime-2);border-color:var(--lime-2);color:#14200a;font-weight:600;font-size:16px}

/* toast */
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);max-width:min(88vw,420px);background:var(--ink);color:var(--sheet);padding:12px 16px;border-radius:16px;font-size:16px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:70}
.toast.on{opacity:.94;transform:translate(-50%,-50%) scale(1)}
.mocknote{font-size:12px;color:var(--muted);text-align:center;margin:0}
.slide-l{animation:sl .26s cubic-bezier(.2,.9,.25,1)}.slide-r{animation:sr .26s cubic-bezier(.2,.9,.25,1)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}

/* วงล้อสลับคาบ: ดับเบิลคลิก (เมาส์) หรือกดค้าง 2 วิ (นิ้ว) — ต้นแบบจากวงล้อสลับเตียงของ Teaching Round */
.wheel{position:fixed;inset:0;z-index:60;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:color-mix(in srgb,var(--desk) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .2s ease}
.wheel.on{opacity:1}.wheel.out{opacity:0;transition-duration:.18s}
.wh-stage{position:absolute;top:0;bottom:0;left:50%;width:min(100%,460px);transform:translateX(-50%)}
.wh-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wh-arc circle{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1) .05s}
.wheel.on .wh-arc circle{stroke-dashoffset:0}
.wh-knob{position:absolute;width:52px;height:22px;margin:-11px 0 0 -26px;border-radius:999px;background:var(--ink);transform:scale(.3);opacity:0;transition:transform .3s var(--spring) .15s,opacity .2s .15s}
.wheel.on .wh-knob{transform:none;opacity:1}
.wh-it{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;transform-origin:calc(100% - 36px) 50%;will-change:transform,opacity}
.wh-in{display:flex;align-items:center;gap:12px;animation:whIn .42s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d,0ms)}
.wheel.out .wh-in{animation:whOut .18s ease-in both}
@keyframes whIn{from{opacity:0;transform:translateX(56px) scale(.7)}to{opacity:1;transform:none}}
@keyframes whOut{to{opacity:0;transform:translateX(40px) scale(.85)}}
.wh-lbl{display:grid;justify-items:end;text-align:right;max-width:min(52vw,230px);color:var(--muted);transition:color .15s}
.wh-lbl b{font-size:18px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:2px 12px;border-radius:999px;border:1px solid transparent;transition:background .15s,border-color .15s}
.wh-lbl small{font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 12px;opacity:0;transition:opacity .2s}
.wh-chip{position:relative;flex:0 0 auto;width:72px;height:56px;border-radius:999px;border:2px solid transparent;background:var(--sheet);color:var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px -10px rgba(20,30,10,.35);transition:background .15s,border-color .15s,box-shadow .2s}

itle":"สไลด์ อ.Kunapa ⑤ — Thalassemia: genotype–phenotype, TDT/NTDT, เหล็กเกิน และยาขับเหล็ก 3 ตัว","summary":"HbA 97% · A2 2–3% · F < 1% · Hb Bart's (γ₄) O₂ affinity สูง · Hb H (β₄) ตกตะกอน → hemolysis · α-thal 1 trait --/αα MCV < 80 Hb typing ผู้ใหญ่ปกติ · LIC > 7 · ferritin > 2,500 · T2∗ < 10 ms · เริ่มขับเหล็ก: ได้เลือด > 1 ปี/> 10 ครั้งต่อปี · ferritin > 1,000 · LIC > 7 · DFO 1:1 SC (หู ตา Yersinia) · DFX 2:1 กินวันละครั้ง (ไต) · DFP 3:1 กินวันละ 3 ครั้ง (agranulocytosis, หัวใจดีสุด)","minutes":15,"md":"### Hemoglobin ปกติของผู้ใหญ่\n| ชนิด | โครงสร้าง | สัดส่วน |\n|---|---|---|\n| **HbA** | α₂β₂ | **97%** |\n| **HbA2** | α₂δ₂ | **2–3%** |\n| **HbF** | α₂γ₂ | **< 1%** |\nThalassemia = โรคกรรมพันธุ์ที่สร้าง globin chain ได้ลดลงบางส่วนหรือไม่ได้เลย\n\n### Pathophysiology ในสไลด์\n- **β-thalassemia** — β-chain ขาด → **α-chain เกิน ตกตะกอนในเซลล์ตัวอ่อน** → ineffective erythropoiesis + hemolysis\n- **α-thalassemia** — α-chain ขาด → chain ที่เหลือจับกันเอง\n  - ทารก: **γ₄ = Hb Bart's** — **O₂ affinity สูงมาก ปล่อย O₂ ไม่ได้** (\"physiologically useless\") → tissue hypoxia\n  - ผู้ใหญ่: **β₄ = Hb H** — ไม่มีประโยชน์ทางสรีระ **ตกตะกอนใน RBC** → hemolytic anemia\n\n### Genotype–phenotype ของ α-thalassemia (ตารางในสไลด์)\n| ชนิด | Genotype | ความรุนแรง | Hb typing |\n|---|---|---|---|\n| ปกติ | αα/αα | ปกติ | A2A (HbA ~97.5% · A2 2.5–3.5%) |\n| **α-thal 2 trait** (α⁺) | -α/αα | ปกติ · **MCV > 80** | A2A ปกติ |\n| **α-thal 1 trait** (α⁰) | --/αα | ไม่มีอาการ · **MCV < 80** | cord blood: **Hb Bart's 2–10%** · ผู้ใหญ่ A2A ปกติ |\n| Homozygous Hb CS | αᶜˢα/αᶜˢα | เล็กน้อย | A A2 CS (Hb CS ~5%) |\n| **Hb H–Constant Spring** | --/αᶜˢα | **รุนแรงกว่า Hb H** | A A2 H CS (CS 2–3% · H 10–15%) |\n| **Hb H disease** | --/-α | ปานกลาง (NTDT) | cord blood: Bart's 10–30% · ผู้ใหญ่ **A A2 H** |\n| **Hb Bart's hydrops** | --/-- | **เสียชีวิตในครรภ์/แรกคลอด** | Hb Bart's > 80% + Hb Portland |\n- **α-thal 1 trait และ α-thal 2 trait ตรวจ Hb typing ผู้ใหญ่ได้ปกติ** → ต้องใช้ **DNA analysis** (โดยเฉพาะคัดกรองคู่สมรส)","more":5,"pearls":["Hb Bart's (γ₄) จับ O₂ แน่นจนปล่อยไม่ได้ · Hb H (β₄) ตกตะกอนใน RBC → hemolysis","α-thal 1 trait (--/αα) MCV < 80 แต่ Hb typing ผู้ใหญ่ปกติ → ต้อง DNA","เหล็กเกิน: LIC > 7 ปานกลาง (> 15 รุนแรง) · ferritin > 2,500 เสี่ยงหัวใจ · T2∗ < 10 ms รุนแรง","เริ่มขับเหล็กใน TDT: ได้เลือด > 1 ปี หรือ > 10 ครั้ง/ปี · ferritin > 1,000 สองครั้ง · LIC > 7"],"mnem":[{"name":"O · X · P = 1 · 2 · 3","what":"ยาขับเหล็กเรียงตามสัดส่วน chelator : iron และจำนวนมื้อ","lines":[["1","DF**O** — 1:1 · **ฉีด** SC 8–12 ชม. · พิษ **หู ตา กระดูก · Yersinia**"],["2","DF**X** (deferasirox) — 2:1 · กิน **วันละ 1 ครั้ง** · พิษ **ไต ตับ** ผื่น"],["3","DF**P** (deferiprone) — 3:1 · กิน **วันละ 3 ครั้ง** · พิษ **agranulocytosis** ปวดข้อ · **หัวใจ +++**"]],"note":"P = PMN หาย (agranulocytosis) และ P = Pump (หัวใจ) — DFP ขับเหล็กหัวใจดีที่สุด","src":"เรียบเรียงจากตารางในสไลด์ อ.Kunapa"}],"items":[{"id":"HON-ANM-MCQ-K13","kind":"mcq","topic":"Iron chelators — adverse effects","stem":"A 24-year-old man with transfusion-dependent β-thalassemia/HbE starts an oral iron chelator taken three times a day. Six weeks later he develops fever and sore throat; his absolute neutrophil count is 0.3 × 10⁹/L. Which drug is he most likely taking, and what monitoring should have been in place?","choices":["Deferasirox — monthly serum creatinine","Desferrioxamine — annual audiogram","Deferiprone — weekly CBC during the first months of therapy","Deferasirox — weekly CBC","Desferrioxamine — monthly urinalysis"],"answer":2,"explain":"**กินวันละ 3 ครั้ง = Deferiprone (DFP)** (half-life สั้น 3–4 ชม.) · ผลข้างเคียงสำคัญ = **neutropenia/agranulocytosis** → สไลด์ให้ตรวจ **CBC ทุกสัปดาห์ช่วง 2 เดือนแรก** แล้วทุก 3–4 สัปดาห์ · มีไข้ + ANC ต่ำ → **หยุดยาทันที** รักษาแบบ febrile neutropenia\n\n- Deferasirox **กินวันละครั้ง** — เด่นเรื่อง **ไต (Cr ขึ้น)** ตับ ผื่น ทางเดินอาหาร → ตรวจ BUN/Cr U/A บ่อย\n- Desferrioxamine **ฉีด SC/IV** — เด่นเรื่อง **ototoxicity ตา กระดูก ติดเชื้อ Yersinia** → audiogram/ตรวจตาทุกปี\n- (เสริม) DFP ขับเหล็กที่ **หัวใจ** ได้ดีที่สุด (+++)","pearl":"DFP กินวันละ 3 ครั้ง → agranulocytosis → CBC ทุกสัปดาห์ · DFX วันละครั้ง → ไต · DFO ฉีด → หู ตา Yersinia","src":"","ref":["สไลด์ อ.Kunapa Lam-arunthai — Approach to anemia (MED421 · 9 พ.ย. 2569)","TIF Guidelines for the management of transfusion dependent thalassaemia, 4th ed. (2021)"],"nl":["2.3.3(8)","B2.4(2)","B2.2.1(2)"]},{"id":"HON-ANM-MCQ-K14","kind":"mcq","topic":"Iron overload — assessment and when to chelate","stem":"A 12-year-old boy with β-thalassemia major has received monthly transfusions for 3 years without chelation. Serum ferritin is 2,800 ng/mL on two occasions, liver iron concentration (MRI) is 16 mg Fe/g dry weight, and cardiac MRI T2∗ is 8 ms. Which interpretation is correct?","choices":["Iron overload is mild; recheck in a year before starting chelation","Severe hepatic and severe cardiac iron loading; start intensive chelation that includes an agent effective at removing cardiac iron","Severe hepatic iron loading only; cardiac T2∗ of 8 ms is normal","Cardiac T2∗ of 8 ms is normal because a lower T2∗ means less iron","Chelation is not indicated because the liver iron is below 20 mg/g"],"answer":1,"explain":"เกณฑ์ในสไลด์\n- **LIC > 15 mg/g = severe** (7–15 ปานกลาง เสี่ยงตับพังผืดและเบาหวาน)\n- **Ferritin > 2,500 ng/mL** = เสี่ยงภาวะแทรกซ้อนทางหัวใจ\n- **T2∗ < 10 ms = severe cardiac iron** (> 20 ปกติ · 10–20 ปานกลาง) — **T2∗ ยิ่งสั้นยิ่งเหล็กมาก**\n\nข้อบ่งชี้ขับเหล็กครบทุกข้อ (ได้เลือด > 1 ปี · > 10 ครั้ง/ปี · ferritin > 1,000 สองครั้ง · LIC > 7) → ต้อง **chelation เข้มข้น** และเพราะหัวใจรุนแรงต้องใช้ยาที่ขับเหล็กหัวใจได้ดี — (เสริม) มักใช้ **DFO ร่วมกับ deferiprone** (DFP หัวใจ +++)\n\nตัวลวงเข้าใจทิศทางของ T2∗ กลับด้าน หรือใช้เกณฑ์ LIC ผิด","pearl":"LIC > 15 · ferritin > 2,500 · T2∗ < 10 ms = เหล็กเกินรุนแรง (หัวใจ) — T2∗ ยิ่งต่ำยิ่งแย่","src":"","ref":["สไลด์ อ.Kunapa Lam-arunthai — Approach to anemia (MED421 · 9 พ.ย. 2569)","TIF Guidelines for the management of transfusion dependent thalassaemia, 4th ed. (2021)"],"nl":["2.3.3(8)","B2.2.1(1)","B2.4(2)"]}],"nl":["2.3.3(8)","B2.2.1(1)","B2.2.1(2)","3.3.5","B2.3(4)","B2.4(1)","B2.4(2)"]},"nlTitles":{"2.3.3(8)":"Thalassemia and hemoglobinopathies","B2.2.1(1)":"Thalassemia","B2.2.1(2)":"Hemoglobinopathies (e.g., hemoglobin E, hemoglobin S)","3.3.5":"Hemoglobin typing","B2.3(4)":"Hemoglobin typing","B2.4(1)":"Whole blood and blood products","B2.4(2)":"Drugs used in anemia — Vitamins and mineral supplements · Iron chelating agents · Erythropoietin"},"nlCount":{"hemonc":157}};

  var P=DATA.pv,c=el("section","study");c.setAttribute("aria-label","เรียนต่อจากที่ค้าง");
  var hd=el("div","st-head");

  var ac=el("div","st-acts");
  [["โหมดทวน","hide"],["▶ พรีเซนต์","pres"],["ปักหัวข้อใน Post-it","pinsec"]].forEach(function(x){var b=el("button","btn press",x[0]);b.type="button";

  var meta=el("div","st-meta");P.nl.slice(0,4).forEach(function(k){meta.appendChild(el("span","nl","นล. "+esc(k)+(DATA.nlTitles[k]?" · "+esc(DATA.nlTitles[k]):"")))});
  if(P.nl.length>4)meta.appendChild(el("span","tag","อีก "+(P.nl.length-4)+" รหัส"));c.appendChild(meta);
  var body=el("div","st-body");

  if(P.more)left.appendChild(el("p","hint","อีก "+P.more+" หัวข้อย่อยในบทเรียนเต็ม"));
  (P.mnem||[]).forEach(function(m){var mn=el("div","mn");
    var mh=el("div","mn-h","<div><small>หลักจำ</small><b>"+esc(m.name)+"</b></div>");var pb=el("button","btn press","ปักใน Post-it");pb.type="button";pb.addEventListener("click",function(){addPin(m.name,m.what)});mh.appendChild(pb);mn.appendChild(mh);
    mn.appendChild(el("ul",null,(m.lines||[]).map(function(r){return "<li><b>"+esc(r[0])+"</b><span>"+inl(r[1])+"</span></li>"}).join("")));
    if(m.note)mn.appendChild(el("p",null,inl(m.note)));left.appendChild(mn)});
  body.appendChild(left);
  var n=P.items.length,gate=el("div","gate");gate.innerHTML="<div><b>อ่านจบแล้ว ลองตอบ "+n+" ข้อของหัวข้อนี้</b><span>ข้อสอบจะขึ้นต่อด้านล่าง ตอบแล้วเฉลยพร้อมคำอธิบายทันที</span></div>";
  var gb=el("button","btn primary press","ทำข้อสอบท้ายหัวข้อ");gb.type="button";gate.appendChild(gb);left.appendChild(gate);
  var qz=el("div","quiz");qz.hidden=true;qz.appendChild(el("div","q-head","<h4>เช็คความเข้าใจ</h4><small>"+n+" ข้อ · กดเลข 1–5 เพื่อตอบ</small>"));
  gb.addEventListener("click",function(){gate.hidden=true;qz.hidden=false;QOPEN=true;qz.classList.add("in");
    setTimeout(function(){try{qz.scrollIntoView({block:"start",behavior:RM?"auto":"smooth"})}catch(_){}},40)});
  P.items.forEach(function(it,qi){var q=el("div","qz");q.dataset.qi=qi;renderQ(q,it,qi);qz.appendChild(q)});
  body.appendChild(qz);c.appendChild(body);
  var ft=el("div","st-foot");ft.appendChild(el("span","hint","ตอบครบทุกข้อแล้วหัวข้อนี้จะนับว่าเรียนจบ"));
  var nx=el("button","btn press","เปิดบทเรียนเต็มหัวข้อนี้");nx.type="button";nx.addEventListener("click",function(){toast("ในเว็บจริง: เปิดหน้าหัวข้อเต็ม")});ft.appendChild(nx);c.appendChild(ft);
  c.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-tq")){var tw=b.parentNode.nextElementSibling,on=!tw.classList.contains("cov");tw.classList.toggle("cov",on);
      tw.querySelectorAll("td+td").forEach(function(td){td.classList.remove("op");td.dataset.h=grs(td.textContent.trim()).slice(0,2).join("")+"…"});b.textContent=on?"เลิกปิด":"ปิดเพื่อทวน";return}
    if(b.getAttribute("data-pin")==="t"){var t2=b.parentNode.nextElementSibling,hh=t2.previousElementSibling.previousElementSibling;var ttl=(hh&&hh.tagName==="H3"?hh.textContent:"ตาราง");
      addPin(ttl,t2.querySelectorAll("tbody tr").length+" แถว · แถวละใบ");return}
  });
  c.addEventListener("click",function(e){var td=e.target.closest&&e.target.closest(".twrap.cov td+td");if(td)td.classList.toggle("op")});
  /* ลากคลุมข้อความแล้วถาม AI */
  pr.addEventListener("mouseup",function(){setTimeout(function(){var s=window.getSelection(),t=s&&String(s).trim();
    if(!t||t.length<2){selask.classList.remove("on");return}var r=s.getRangeAt(0).getBoundingClientRect();
    selask.style.left=(r.right+window.scrollX-60)+"px";selask.style.top=(r.bottom+window.scrollY+8)+"px";selask.classList.add("on");selask._t=t},10)});
  return c}
function renderQ(q,it,qi){
  var a=ANS[it.id];q.innerHTML="";
  q.appendChild(el("small",null,"ข้อ "+(qi+1)+" · "+esc(it.topic||"")));
  q.appendChild(el("div","stem",inl(it.stem)));
  it.choices.forEach(function(ch,i){var b=el("button","ch press","<span class='k'>"+"ABCDE"[i]+"</span><span>"+inl(ch)+"</span>");b.type="button";
    if(a!=null){b.disabled=true;if(i===it.answer)b.classList.add("right");else if(i===a)b.classList.add("wrong")}
    b.addEventListener("click",function(){answer(qi,i)});q.appendChild(b)});
  if(a!=null){var ok=a===it.answer;q.appendChild(el("div","ver "+(ok?"ok":"no"),ok?"✓ ถูกต้อง":"✗ ยังไม่ใช่ — เฉลยคือข้อ "+"ABCDE"[it.answer]));
    q.appendChild(el("div","ex prose",mdr(it.explain)));if(it.pearl)q.appendChild(el("div","pearl","<b>Pearl · </b>"+inl(it.pearl)))}
  else q.appendChild(el("div","kh","กดเลข 1–5 บนคีย์บอร์ดเพื่อตอบได้"))}
function answer(qi,i){var it=DATA.pv.items[qi];if(ANS[it.id]!=null)return;ANS[it.id]=i;var q=document.querySelector('.qz[data-qi="'+qi+'"]');if(q){renderQ(q,it,qi);pop(q)}}
function addPin(t,b){PINS.push({t:t,b:b,r:(Math.random()*4-2).toFixed(1)+"deg",fresh:true});renderDock();toast("ปักลง Post-it แล้ว")}
var selask=el("button","selask","ถาม AI ↗");selask.type="button";document.body.appendChild(selask);
selask.addEventListener("mousedown",function(e){e.preventDefault()});
selask.addEventListener("click",function(){AIQ=selask._t||"";selask.classList.remove("on");try{window.getSelection().removeAllRanges()}catch(_){}
  if(!matchMedia("(min-width:1400px)").matches){toast("ในเว็บจริง: เปิดแชตถาม AI พร้อมข้อความที่เลือก");return}
  AILOG.push({r:"me",t:"อธิบายตรงนี้ให้เข้าใจง่าย ๆ",q:AIQ});AILOG.push({r:"ai",t:"(ร่าง) ในเว็บจริง Claude จะอธิบายข้อความที่เลือกในบริบทของหัวข้อนี้"});AIQ="";renderDock()});
document.addEventListener("mousedown",function(e){if(e.target!==selask)selask.classList.remove("on")});

/* ---------- ค้นหาหัวข้อทุกวิชา (Ctrl K) ---------- */
var PAL=null;
function openPal(){
  if(PAL)return;var idx=[];
  Object.keys(DATA.lec).forEach(function(set){var c=DATA.courses.filter(function(x){return x.set===set})[0];
    DATA.lec[set].forEach(function(l){idx.push({k:"คาบ",c:c.label,t:l.title,s:"คาบ "+l.lec,set:set,l:l});l.secs.forEach(function(s){idx.push({k:"หัวข้อ",c:c.label,t:s.t,s:"คาบ "+l.lec+" · "+l.title,set:set,l:l})})})});
  var ov=el("div","pal"),box=el("div","pal-box");ov.appendChild(box);ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-label","ค้นหาหัวข้อ");
  var iw=el("div","pal-in",SV+'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>');var inp=el("input");inp.placeholder="ค้นหาหัวข้อ คาบ หรือคำสำคัญ เช่น retic, thalassemia, gout";inp.setAttribute("aria-label","ค้นหา");iw.appendChild(inp);box.appendChild(iw);
  var ul=el("ul","pal-list");ul.setAttribute("role","listbox");box.appendChild(ul);
  box.appendChild(el("div","pal-foot","<span><span class='kbd'>↑ ↓</span> เลือก</span><span><span class='kbd'>Enter</span> เปิด</span><span><span class='kbd'>Esc</span> ปิด</span><span>ร่างนี้ค้นได้ในชุด Heme/Onc และ AIR</span>"));
  document.body.appendChild(ov);var sel=0,res=[];
  function hl(t,q){if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
  function draw(){var q=inp.value.trim();res=(q?idx.filter(function(x){return (x.t+" "+x.s).toLowerCase().indexOf(q.toLowerCase())>=0}):idx.filter(function(x){return x.k==="คาบ"})).slice(0,8);
    sel=Math.min(sel,Math.max(0,res.length-1));ul.innerHTML="";
    if(!res.length){ul.appendChild(el("li","pal-empty","ไม่พบ ลองคำอื่น"));return}
    res.forEach(function(x,i){var li=el("li"),b=el("button",i===sel?"on":"","<span class='pc'>"+esc(x.c)+" · "+x.k+"</span><span class='pt'>"+hl(x.t,q)+"<small>"+esc(x.s)+"</small></span><span class='kbd'>↵</span>");b.type="button";b.setAttribute("role","option");
      b.addEventListener("mousemove",function(){if(sel!==i){sel=i;draw()}});b.addEventListener("click",function(){choose(i)});li.appendChild(b);ul.appendChild(li)})}
  function choose(i){var x=res[i];if(!x)return;close();if(x.set!==cur)go(x.set);setTimeout(function(){openLec(x.l)},x.set!==cur?300:0)}
  function close(){if(!PAL)return;PAL=null;ov.remove()}
  inp.addEventListener("input",function(){sel=0;draw()});
  inp.addEventListener("keydown",function(e){if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(res.length-1,sel+1);draw()}else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw()}else if(e.key==="Enter"){e.preventDefault();choose(sel)}else if(e.key==="Escape"){e.preventDefault();close()}});
  ov.addEventListener("mousedown",function(e){if(e.target===ov)close()});
  PAL={close:close};draw();inp.focus()}
document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA")return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();openPal();return}
  if(e.key==="/"&&DESK.matches){e.preventDefault();openPal();return}
  if(PAL||W||M||sh.open)return;
  if(DESK.matches&&QOPEN&&/^[1-5]$/.test(e.key)){var its=DATA.pv.items;for(var q=0;q<its.length;q++){if(ANS[its[q].id]==null){answer(q,+e.key-1);break}}return}
  if(DESK.matches&&(e.key==="p"||e.key==="P")&&!e.ctrlKey&&!e.metaKey){toast("ในเว็บจริง: เปิดโหมดพรีเซนต์")}
});

document.getElementById('searchBtn').addEventListener('click',openPal);
renderChips();render(0);
