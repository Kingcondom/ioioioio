<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องสอบจำลอง MED422</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one light glass world after the user's reference: frosted cards floating over soft blue blobs, a blue gradient pill for the main action, orange glow for scores and time pressure. Single theme by choice. */
:root{
  --sky:#dfe7f7; --ink:#1b2740; --muted:#6b7a96; --blue:#4f7cff; --blue-2:#2f55e6;
  --orange:#ff9f43; --red:#e5484d; --green:#1f9d63;
  --glass:rgba(255,255,255,.42); --glass-2:rgba(255,255,255,.62); --edge:rgba(255,255,255,.78);
  --f-display:"Prompt","Noto Sans Thai",system-ui,sans-serif; --f-body:"Noto Sans Thai","Prompt",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh;background:transparent}
html{background-color:#e6ebf8;background:
  radial-gradient(60% 50% at 85% 5%,#c9d6ff 0,transparent 70%),
  radial-gradient(50% 45% at 0% 35%,#d8d0ff 0,transparent 70%),
  radial-gradient(70% 60% at 30% 100%,#c3d9ff 0,transparent 70%),
  linear-gradient(160deg,#eef2fb,#dfe6f6 60%,#e8e6f8);background-attachment:fixed}
body{padding-bottom:120px}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
body::before{width:46vmax;height:46vmax;right:-14vmax;top:-12vmax;background:linear-gradient(135deg,#ffffff,#a9c1ff)}
body::after{width:40vmax;height:40vmax;left:-16vmax;bottom:-10vmax;background:linear-gradient(135deg,#b7c8ff,#ffffff)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;line-height:1.3;margin:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 36px rgba(70,100,170,.16);border-radius:28px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
/* top bar */
header.top{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;z-index:6}
header.top .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#7aa2ff,var(--blue-2));box-shadow:0 6px 16px rgba(47,85,230,.35),inset 0 1px 0 rgba(255,255,255,.5);color:#fff;flex:none}
.tile svg{width:20px;height:20px}
.tile.soft{background:var(--glass-2);color:var(--blue-2);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(70,100,170,.12);border:1px solid var(--edge)}
header.top .sp{flex:1}
.where{font-size:.82rem;color:var(--muted);background:var(--glass-2);border:1px solid var(--edge);padding:2px 12px;border-radius:999px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 16px;border-radius:999px;background:var(--glass-2);border:1px solid var(--edge);box-shadow:inset 0 1px 0 #fff}
.clock.low{color:#c96a00;box-shadow:0 0 0 2px rgba(255,159,67,.5),0 0 22px rgba(255,159,67,.45)}
.clock.out{color:var(--red);box-shadow:0 0 0 2px rgba(229,72,77,.5),0 0 22px rgba(229,72,77,.35)}
/* buttons */
.btn{border:1px solid var(--edge);background:var(--glass-2);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:500;box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(70,100,170,.10);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:linear-gradient(145deg,#6f95ff,var(--blue-2));color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 8px 20px rgba(47,85,230,.32),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,.seg button:focus-visible,.nav button:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--edge);cursor:pointer}
.chip{display:inline-block;background:var(--glass-2);border:1px solid var(--edge);border-radius:999px;padding:1px 11px;font-size:.8rem;color:var(--muted)}
.chip.k-hx,.chip.k-pe,.chip.k-counsel,.chip.k-proc{color:var(--blue-2);background:rgba(79,124,255,.12);border-color:rgba(79,124,255,.25)}
.muted{color:var(--muted)}
/* home */
.hello{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;margin:10px 4px 22px}
.hello .date{color:var(--muted);font-size:.95rem}
.hello h2{font-size:1.75rem;margin:2px 0}
.hello p{margin:0;color:var(--muted)}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.9rem;font-weight:600;color:var(--blue-2);background:radial-gradient(circle at 35% 30%,#fff,#dbe5ff);border:4px solid rgba(255,255,255,.8);box-shadow:0 0 0 6px rgba(255,255,255,.35),0 10px 30px rgba(70,100,170,.22)}
.goal{padding:22px 24px}
.goal-h{display:flex;align-items:center;gap:12px}
.goal-h .lbl{color:var(--muted);font-size:1rem}
.goal-h .sp{flex:1}
.goal .num{font-family:var(--f-display);font-weight:700;font-size:3.4rem;line-height:1.1;margin:10px 0 14px 4px;font-variant-numeric:tabular-nums}
.goal .num small{font-size:1.6rem;font-weight:500;margin-left:6px}
.chartbox{border-radius:22px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.7);padding:14px 14px 8px;display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center}
.chartbox svg{width:100%;height:150px;display:block;overflow:visible}
.side-stat{font-size:.95rem;color:var(--muted);line-height:1.5}
.side-stat b{display:block;color:var(--orange);font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin-top:4px}
.section-h{display:flex;align-items:center;gap:10px;margin:26px 4px 12px}
.section-h h3{font-size:1.1rem}
.sets{display:grid;gap:12px}
.setrow{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-radius:24px}
.setrow .d{font-family:var(--f-display);text-align:center;color:var(--muted);font-size:.85rem;line-height:1.2}
.setrow .d b{display:block;font-size:1.6rem;color:var(--ink);font-weight:600}
.setrow.today{box-shadow:0 0 0 2px rgba(79,124,255,.55),0 12px 36px rgba(47,85,230,.2)}
.setrow h3{font-size:1.02rem}
.meta{font-size:.84rem;color:var(--muted);margin:2px 0 0;padding-left:1.2em}
.meta li{margin:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.score-pill{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.82rem;border-radius:999px;padding:0 9px;font-weight:600}
.score-pill.good{color:var(--green);background:rgba(31,157,99,.12)}.score-pill.mid{color:#c96a00;background:rgba(255,159,67,.16)}.score-pill.bad{color:var(--red);background:rgba(229,72,77,.12)}
.panel{padding:18px 20px}
.panel h3{font-size:1rem;margin-bottom:10px}
.bar{height:10px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.8)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc27a,var(--orange));box-shadow:0 0 10px rgba(255,159,67,.6)}
.weak{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;font-size:.92rem;margin:7px 0}
.weak .n{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.hist{display:grid;grid-template-columns:70px 1fr 48px auto;gap:10px;align-items:center;font-size:.9rem;margin:8px 0}
.hist .t small{display:block;color:var(--muted)}
/* หน้าประวัติข้อสอบ (ผู้ใช้ขอ 7 พ.ย.) */
.hx-sum{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.hx-day{font-family:var(--f-display);font-size:.95rem;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.hx-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;margin:0 0 8px;border-radius:18px}
.hx-row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.86rem}
.hx-row .t{min-width:0}.hx-row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.hx-row .t small{display:block;color:var(--muted);font-size:.8rem}
.hx-row .nog{font-size:.78rem;color:var(--muted);white-space:nowrap}
.hx-filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.hx-filter button{font:inherit;font-size:.85rem;border:1px solid var(--edge);background:var(--glass-2);border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--muted)}
.hx-filter button.on{color:#fff;background:var(--blue-2);border-color:var(--blue-2)}
@media (max-width:520px){.hx-row{grid-template-columns:44px minmax(0,1fr) auto;}.hx-row .btn{grid-column:2/-1;justify-self:start}}
nav#nav.nav{grid-template-columns:repeat(6,1fr)}
html .aiw-fab{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 104px)}
.rules{padding-left:1.4em;margin:0}
.rules li{margin:4px 0}
.credits{font-size:.8rem;color:var(--muted);padding-left:1.4em;margin:6px 0 0}
.credits a{color:inherit}
/* bottom nav */
.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:10px 8px;z-index:8;border-radius:32px}
.nav button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);position:relative;padding:0}
.nav button .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--edge);box-shadow:inset 0 1px 0 #fff;color:#5b6b8c}
.nav button .ic svg{width:21px;height:21px}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on .ic{background:linear-gradient(145deg,#7aa2ff,var(--blue-2));color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 8px 18px rgba(47,85,230,.35)}
.nav button.on::after{content:"";position:absolute;bottom:-8px;width:6px;height:6px;border-radius:50%;background:var(--blue-2)}
.nav .plus .ic{width:64px;height:64px;border-radius:50%;margin-top:-26px;background:linear-gradient(145deg,#79a0ff,var(--blue-2));color:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.45),0 12px 28px rgba(47,85,230,.45);border:1px solid rgba(255,255,255,.5)}
.nav .plus .ic svg{width:28px;height:28px}
body.running .nav{display:none}
body.running{padding-bottom:30px}
/* station strip */
.strip{display:flex;gap:5px;margin:4px 0 14px;flex-wrap:wrap}
.strip span{min-width:36px;height:30px;padding:0 6px;display:grid;place-items:center;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-family:var(--f-display);font-size:.78rem;color:var(--muted)}
.strip span.cur{background:linear-gradient(145deg,#7aa2ff,var(--blue-2));color:#fff;box-shadow:0 6px 14px rgba(47,85,230,.35)}
.strip span.done{background:rgba(79,124,255,.14);color:var(--blue-2)}
/* station sheet */
.sheet{padding:22px}
.sheet-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sheet-h h2{font-size:1.25rem}
.stem{white-space:pre-line;font-size:1.03rem;background:rgba(255,255,255,.5);border:1px solid var(--edge);border-radius:18px;padding:12px 16px;margin:6px 0 14px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.figs{display:flex;gap:10px;flex-wrap:wrap}
.figs img{max-width:100%;max-height:420px;border-radius:18px;border:1px solid var(--edge);cursor:zoom-in;background:#000;box-shadow:0 8px 22px rgba(40,60,110,.18)}
.figs .noimg{border:2px dashed rgba(107,122,150,.4);border-radius:18px;padding:28px;color:var(--muted);text-align:center;width:100%;background:rgba(255,255,255,.3)}
table.lab{border-collapse:separate;border-spacing:0;width:100%;font-size:.95rem;margin:4px 0 12px;background:rgba(255,255,255,.45);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
table.lab td{border-bottom:1px solid rgba(255,255,255,.8);padding:6px 12px;font-variant-numeric:tabular-nums}
table.lab tr:last-child td{border-bottom:0}
table.lab td:first-child{color:var(--muted);width:42%}
.task{margin-bottom:14px}
.task label{display:block;font-weight:600;margin-bottom:5px}
.task .pts{font-size:.8rem;color:var(--muted);font-weight:500}
textarea{width:100%;min-height:96px;border:1px solid var(--edge);border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.62);resize:vertical;box-shadow:inset 0 1px 3px rgba(40,60,110,.08)}
textarea:disabled{opacity:.6}
.chat{border:1px solid var(--edge);border-radius:22px;display:flex;flex-direction:column;height:390px;margin-top:6px;background:rgba(255,255,255,.35);overflow:hidden}
.chat .log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:7px 13px;border-radius:18px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(145deg,#6f95ff,var(--blue-2));color:#fff;border-bottom-right-radius:6px}
.msg.sp{align-self:flex-start;background:rgba(255,255,255,.8);border:1px solid var(--edge);border-bottom-left-radius:6px}
.msg.sys{align-self:center;font-size:.82rem;color:var(--muted)}
.chat form{display:flex;gap:6px;border-top:1px solid var(--edge);padding:8px;background:rgba(255,255,255,.4)}
.chat input{flex:1;border:1px solid var(--edge);border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.75)}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.lockmsg{color:#c96a00;font-weight:600}
details.prev{margin:4px 0 12px;font-size:.92rem}
details.prev div{white-space:pre-line;color:var(--muted);margin:4px 0 4px 12px}
/* results */
.res-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:20px 24px;margin-bottom:14px}
.big{font-family:var(--f-display);font-size:2.8rem;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.1}
.ritem{margin-bottom:12px;border-radius:24px}
.ritem>summary{cursor:pointer;padding:12px 18px;display:flex;gap:10px;align-items:center;list-style:none;flex-wrap:wrap}
.ritem>summary::-webkit-details-marker{display:none}
.ritem .body{padding:0 18px 16px}
.ritem .sc{margin-left:auto}
.ans{white-space:pre-wrap;background:rgba(255,255,255,.55);border:1px solid var(--edge);border-radius:14px;padding:8px 12px;font-size:.93rem}
.key{white-space:pre-wrap;border-left:3px solid var(--green);padding:4px 12px;font-size:.93rem;margin:8px 0}
.rub{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.92rem;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.55)}
.seg button{border:0;background:none;padding:3px 11px;cursor:pointer;font-size:.82rem}
.seg button.on{background:linear-gradient(145deg,#6f95ff,var(--blue-2));color:#fff}
.fb{font-size:.9rem;color:var(--blue-2);margin:4px 0}
.transcript{font-size:.86rem;max-height:220px;overflow:auto;border:1px solid var(--edge);border-radius:14px;padding:8px 12px;margin:6px 0;background:rgba(255,255,255,.45)}
.lightbox{position:fixed;inset:0;background:rgba(20,30,60,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;place-items:center;z-index:20;padding:12px}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(27,39,64,.9);color:#fff;padding:9px 18px;border-radius:999px;z-index:30;display:none}
.toast.on{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.appr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 8px;font-size:.88rem}
.appr a.chip{text-decoration:none}
.appr a.chip.ok{color:var(--green);background:rgba(31,157,99,.1);border-color:rgba(31,157,99,.3)}
.appr a.chip.todo{color:#a5520a;background:rgba(255,159,67,.12);border-color:rgba(255,159,67,.35)}
.patgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.patcard{text-align:left;cursor:pointer;padding:16px 18px;border-radius:24px;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.patcard:hover{transform:translateY(-2px)}
.patcard .pn{font-family:var(--f-display);font-weight:700;color:var(--blue-2);font-size:1.3rem}
.patcard .muted{font-size:.85rem;line-height:1.45}
.patcard .pm{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
h3.sub{font-size:1.02rem;margin:20px 0 8px}
ol.steps{padding-left:1.4em;margin:6px 0}
ol.steps li{margin:6px 0}
ol.steps li b{display:block}
ol.steps li span{color:var(--muted);font-size:.93rem;white-space:pre-line}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bankcard{padding:16px 18px;border-radius:24px;display:flex;flex-direction:column;gap:6px}
.bankcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.osce-sys{margin:18px 0 8px;font-size:1rem;color:var(--blue-2)}
ol.steps.warn li span{color:#a5520a}
.drill{margin:12px 0 18px}
.rub input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue-2)}
/* report */
.rep-send{background:rgba(255,255,255,.5);border:1px solid var(--edge);border-radius:20px;padding:12px 16px;margin:6px 0 4px}
.rep-send .acts{margin-top:8px}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
a.btn.pri{color:#fff}
.rep-sc{padding-left:1.6em;margin:0}
.rep-sc li{margin:6px 0}
.rep-sc li>div{display:grid;grid-template-columns:1fr 110px 56px;gap:10px;align-items:center;font-size:.93rem}
.rep-sc li b{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rep-u{background:rgba(255,255,255,.45);border:1px solid var(--edge);border-radius:20px;padding:12px 16px;margin:0 0 12px}
.rep-uh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rep-u .lbl{font-family:var(--f-display);font-weight:600;font-size:.88rem;margin:8px 0 2px;color:var(--muted)}
.rep-u .lbl.bad{color:var(--red)}
.rep-u ol{padding-left:1.4em;margin:0;font-size:.93rem}
.rep-u ol li{margin:2px 0}
.rep-key{border-left:3px solid var(--green);padding:2px 0 2px 12px;margin-top:8px}
.rep-key .lbl{color:var(--green)}
.rep-txt{min-height:220px;font-size:.85rem;margin-top:10px}
@media (max-width:820px){.grid2,.two{grid-template-columns:1fr}.setrow{grid-template-columns:56px 1fr}.setrow .acts{grid-column:1/-1;justify-content:flex-start}.chartbox{grid-template-columns:1fr}.goal .num{font-size:2.8rem}.hello h2{font-size:1.4rem}.avatar{width:64px;height:64px;font-size:1.5rem}.chat{height:330px}.where{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top glass" style="border-radius:0 0 26px 26px;border-top:0">
  <div class="brand"><span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/></svg></span>ห้องสอบ MED422</div>
  <span class="where" id="where">หน้าแรก</span>
  <span class="sp"></span>
  <span class="clock" id="clock" hidden>05:00</span>
  <button class="btn sm" id="homeBtn" hidden>ออกจากห้องสอบ</button>
</header>

<script>
const EXAM = new Date("2026-11-17T08:00:00+07:00");
const ME = "Nutthaphat";
const KIND = {hx:"OSCE ซักประวัติ", pe:"OSCE ตรวจร่างกาย", counsel:"OSCE ให้คำแนะนำ", proc:"OSCE หัตถการ", saq:"SAQ"};
const RULES = `กฎการตรวจของอาจารย์ (จากฟีดแบ็ก MED35):
- ซักประวัติ/ตรวจร่างกาย: ให้คะแนนเฉพาะสิ่งที่นักศึกษาถามหรือตรวจจริงในบทสนทนา/คำตอบ ห้ามเดาแทน
- คำถามตรวจร่างกาย: ถ้าตอบเป็น lab/investigation แทนการตรวจร่างกาย ได้ 0
- DDx: ตรวจเฉพาะ 3 ข้อแรกที่เขียน ข้อที่เกินไม่อ่าน; โรคกลุ่มเดียวกัน (UA/NSTEMI/STEMI = ACS) นับเป็นข้อเดียว
- การวินิจฉัยต้องระบุความรุนแรง/ชนิดให้เจาะจง ถ้ากว้างเกินได้ราว 30% ของข้อนั้น (เช่น ตอบ DF แทน DHF)
- สั่งสารน้ำต้องระบุชนิดและ rate; ยาควรระบุขนาด/ทางให้เมื่อโจทย์ขอ แต่ตอบกลุ่มยาถูกให้คะแนนบางส่วน
- แปลผล CBC/PBS ต้องครบ 3 series
- ชื่อเชื้อเมื่อโจทย์สั่งให้เขียนเต็ม ต้องสะกดถูก
- รับคำตอบไทยหรืออังกฤษ คำพ้องความหมายได้คะแนน ให้คะแนนครึ่งได้`;

let PATS=[], SETS=[], CREDITS=[], BANK=null, QB=[], db=null, uid=null, sample=null, ATT=[], TAB="home";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t,ms=2600){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function pct(a,b){return b?Math.round(a*100/b):0}
function pill(p){return `<span class="score-pill ${p>=70?"good":p>=50?"mid":"bad"}">${p}%</span>`}
const todayStr=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Bangkok"});

let AC=null;
function bell(n=1){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.35;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)}}catch(e){}}

(async function boot(){
  try{const r=await fetch("data/sets.json"); SETS=(await r.json()).sort((a,b)=>a.order-b.order);}
  catch(e){$("#app").innerHTML=`<p>โหลดชุดข้อสอบไม่สำเร็จ ลองรีเฟรชหน้า</p>`;return}
  try{CREDITS=await (await fetch("data/credits.json")).json()}catch(e){CREDITS=[]}
  try{PATS=await (await fetch("data/patterns.json")).json()}catch(e){PATS=[]}
  try{BANK=await (await fetch("data/bank.json")).json()}catch(e){BANK=null}
  try{const qb=await (await fetch("data/saqbank.json")).json();QB=qb.map(c=>({...c,bank:true,meq:[],stations:c.items.map((it,i)=>({...it,n:i+1,kind:"saq"}))}));
    const all=[];QB.forEach(c=>c.items.forEach(it=>all.push({...it,kind:"saq",title:c.short+" · "+it.title})));all.sort((a,b)=>(b.freq||1)-(a.freq||1));
    QB.push({id:"q-all",title:"คลัง SAQ: ทุกหมวด",short:"ทุกหมวด",sub:"รวมทุกหมวดจากโพย",bank:true,meq:[],stations:all.map((it,i)=>({...it,n:i+1}))});}catch(e){QB=[]}
  renderHome();
  (async()=>{try{
    const [d,u,s]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
    sample=s||null;
    claude.use("downloads").then(x=>{dl=x||null}).catch(()=>{});
    claude.use("mcp").then(x=>{mcp=x||null;if(mcp&&repCur&&$("#repCopy"))renderReport(repCur,repFrom)}).catch(()=>{});
    if(d&&u){uid=await u.id(); if(uid){db=d; await loadAttempts();}}
    if(!run) renderHome(TAB);
  }catch(e){ if(!run) renderHome(TAB); }})();
})();
async function loadAttempts(){
  if(!db)return;
  const timer=setTimeout(()=>toast("ยังดึงประวัติการสอบไม่ได้ ลองใหม่ภายหลัง"),10000);
  try{const q=await db.collection("data/users/"+uid).get();ATT=q.docs.map(d=>({id:d.id,...d.data()})).filter(a=>a.setId);}catch(e){}
  clearTimeout(timer);
}
document.querySelectorAll(".nav [data-tab]").forEach(b=>b.onclick=()=>renderHome(b.dataset.tab));
$("#plusBtn").onclick=()=>{const s=todaySet(); if(s) startRun(s.id,s.stations.length?"full":"pick")};
function todaySet(){const t=todayStr(),D=SETS.filter(s=>s.stations.length);return D.find(s=>s.date===t)||D.find(s=>s.date>t)||D[D.length-1]}
function chrome(running){document.body.classList.toggle("running",running)}

/* ---------- home tabs ---------- */
function setRow(s,best){
  const d=new Date(s.date+"T00:00:00+07:00");
  const dd=d.toLocaleDateString("th-TH",{day:"numeric",timeZone:"Asia/Bangkok"}), mm=d.toLocaleDateString("th-TH",{month:"short",timeZone:"Asia/Bangkok"});
  return `<div class="setrow glass ${s.date===todayStr()?"today":""}">
    <div class="d"><b>${dd}</b>${mm}</div>
    <div><h3>${esc(s.title)} ${best!=null?pill(best):""}</h3>
      <ol class="meta"><li>${esc(s.sub)}</li>${s.stations.length?`<li>OSCE+SAQ ${s.stations.length} สถานี สถานีละ 5 นาที</li>`:""}<li>MEQ ${s.meq.length} ข้อ${s.stations.length?"":" เลือกทำทีละเคส"}</li></ol></div>
    <div class="acts">${s.stations.length?`
      <button class="btn pri" data-go="full" data-s="${s.id}">จำลองวันจริง</button>
      <button class="btn" data-go="osce" data-s="${s.id}">OSCE+SAQ</button>
      <button class="btn" data-go="meq" data-s="${s.id}">MEQ</button>
      <button class="btn" data-go="pick" data-s="${s.id}">เลือกสถานี</button>`:`
      <button class="btn pri" data-go="pick" data-s="${s.id}">เลือกเคส</button>
      <button class="btn" data-go="meq" data-s="${s.id}">ทำทุกเคสต่อกัน</button>`}
      ${lastAtt(s.id)?`<button class="btn" data-rep="${s.id}">ส่ง report</button>`:""}
    </div></div>`;
}
function scoreChart(){
  const pts=ATT.filter(a=>a.max).sort((a,b)=>(a.finishedAt||"").localeCompare(b.finishedAt||"")).map(a=>pct(a.score,a.max));
  const W=600,H=150,P=8;
  const ticks=Array.from({length:40},(_,i)=>`<line x1="${P+i*(W-2*P)/39}" y1="${H-2}" x2="${P+i*(W-2*P)/39}" y2="${H+6}" stroke="#9aa8c4" stroke-width="1.2"/>`).join("");
  const goalY=H-(70/100)*(H-20);
  if(!pts.length) return `<svg viewBox="0 0 ${W} ${H+8}" role="img" aria-label="ยังไม่มีกราฟคะแนน"><line x1="${P}" x2="${W-P}" y1="${goalY}" y2="${goalY}" stroke="#ff9f43" stroke-dasharray="6 6" opacity=".7"/><text x="${P}" y="${goalY-8}" fill="#c96a00" font-size="13">เป้า 70%</text><text x="${W/2}" y="${H/2+30}" text-anchor="middle" fill="#6b7a96" font-size="15">ทำชุดแรกแล้วเส้นคะแนนจะขึ้นตรงนี้</text>${ticks}</svg>`;
  const xs=pts.length===1?[W/2]:pts.map((_,i)=>P+i*(W-2*P)/(pts.length-1));
  const ys=pts.map(p=>H-(p/100)*(H-20));
  const line=xs.map((x,i)=>`${i?"L":"M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join("");
  const area=line+`L${xs[xs.length-1]},${H}L${xs[0]},${H}Z`;
  const lx=xs[xs.length-1],ly=ys[ys.length-1];
  return `<svg viewBox="0 0 ${W} ${H+8}" role="img" aria-label="กราฟคะแนนการซ้อม ${pts.length} ครั้ง ล่าสุด ${pts[pts.length-1]}%">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f43" stop-opacity=".45"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <line x1="${P}" x2="${W-P}" y1="${goalY}" y2="${goalY}" stroke="#ff9f43" stroke-dasharray="6 6" opacity=".5"/>
    <path d="${area}" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="#ff9f43" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="${lx}" cy="${ly}" r="7" fill="#ffe2bd" stroke="#fff" stroke-width="3" filter="url(#glow)"/>${ticks}</svg>`;
}
function bestMap(){const best={};ATT.forEach(a=>{if(a.max){const p=pct(a.score,a.max);best[a.setId]=Math.max(best[a.setId]??0,p)}});return best}
function renderHome(tab="home"){
  run=null; stopClock(); chrome(false); $("#clock").hidden=true; $("#homeBtn").hidden=true; TAB=tab;
  document.querySelectorAll(".nav [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const labels={home:"หน้าแรก",analyze:"จุดอ่อน",hist:"ประวัติข้อสอบ",sets:"ชุดสอบ",pat:"แพทเทิร์นคำตอบ"};$("#where").textContent=labels[tab];
  const best=bestMap(), A=$("#app");
  if(tab==="home"){
    const days=Math.max(0,Math.ceil((EXAM-new Date())/864e5));
    const t=todayStr(); const left=SETS.filter(s=>s.date>=t&&best[s.id]==null).length;
    const scored=ATT.filter(a=>a.max).sort((a,b)=>(a.finishedAt||"").localeCompare(b.finishedAt||""));
    const last=scored.length?pct(scored[scored.length-1].score,scored[scored.length-1].max):null;
    const ts=todaySet(); const next=SETS.filter(s=>s.stations.length&&s.date>(ts?ts.date:t)).slice(0,2); const always=SETS.filter(s=>!s.stations.length);
    A.innerHTML=`<section class="hello"><div>
        <div class="date">${new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Bangkok"})}</div>
        <h2>สวัสดี ${ME}</h2><p>ทีละสถานี ไปถึงวันสอบ</p></div>
        <div class="avatar" aria-hidden="true">${ME[0]}</div></section>
      <section class="goal glass">
        <div class="goal-h"><span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span><span class="lbl">ถึงวันสอบ MEQ + OSCE (17 พ.ย.)</span><span class="sp"></span>
          <button class="iconbtn" id="goSets" aria-label="ดูชุดสอบทั้งหมด"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button></div>
        <div class="num">${days}<small>วัน</small></div>
        <div class="chartbox">${scoreChart()}
          <div class="side-stat">เหลือ ${left} ชุดที่ยังไม่ได้ซ้อม<b>${last!=null?"ล่าสุด "+last+"%":"ยังไม่มีคะแนน"}</b></div></div>
      </section>
      ${ts?`<div class="section-h"><span class="tile soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><h3>${ts.date===t?"ชุดของวันนี้":"ชุดถัดไป"}</h3></div><div class="sets">${setRow(ts,best[ts.id])}</div>`:""}
      ${always.length?`<div class="section-h"><h3 class="muted" style="font-size:.98rem">ฝึกได้ทุกวัน</h3></div><div class="sets">${always.map(s=>setRow(s,best[s.id])).join("")}</div>`:""}
      ${QB.length?`<div class="sets" style="margin-top:10px"><div class="setrow glass"><div class="d"><b>SAQ</b>คลัง</div><div><h3>คลัง SAQ จากโพย</h3><ol class="meta"><li>${QB.find(q=>q.id==="q-all").stations.length} ข้อ แยก ${QB.length-1} หมวด เขียนตอบแล้วให้ Claude ตรวจ</li></ol></div><div class="acts"><button class="btn pri" data-qr="q-all">สุ่ม 10 ข้อ</button><button class="btn" id="goBank">เลือกหมวด</button></div></div></div>`:""}
      ${next.length?`<div class="section-h"><h3 class="muted" style="font-size:.98rem">ต่อจากนั้น</h3></div><div class="sets">${next.map(s=>setRow(s,best[s.id])).join("")}</div>`:""}`;
    $("#goSets").onclick=()=>renderHome("sets");
    A.querySelectorAll("[data-qr]").forEach(b=>b.onclick=()=>qbRandom(b.dataset.qr));
    if($("#goBank"))$("#goBank").onclick=()=>renderHome("sets");
  } else if(tab==="sets"){
    A.innerHTML=`${qbPanel(best)}<div class="section-h"><span class="tile soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 10h6M9 14h6"/></svg></span><h3>ชุดสอบทั้งหมด (เรียงตามวันในปฏิทิน)</h3></div><div class="sets">${SETS.map(s=>setRow(s,best[s.id])).join("")}</div>`;
    A.querySelectorAll("[data-qr]").forEach(b=>b.onclick=()=>qbRandom(b.dataset.qr));
  } else if(tab==="analyze"){
    const tag={};ATT.forEach(a=>Object.entries(a.byTag||{}).forEach(([k,[g,m]])=>{tag[k]=tag[k]||[0,0];tag[k][0]+=g;tag[k][1]+=m}));
    const weak=Object.entries(tag).filter(([,v])=>v[1]>0).map(([k,[g,m]])=>[k,pct(g,m)]).sort((a,b)=>a[1]-b[1]).slice(0,12);
    const hist=ATT.slice().sort((a,b)=>(b.finishedAt||"").localeCompare(a.finishedAt||"")).slice(0,10);
    A.innerHTML=`<div class="section-h"><span class="tile soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-7"/></svg></span><h3>จุดอ่อนและประวัติการซ้อม</h3></div>
      <div class="two"><div class="panel glass"><h3>หัวข้อที่คะแนนต่ำสุด</h3>
        ${weak.length?weak.map(([k,p])=>`<div class="weak"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.max(p,3)}%"></i></div><span class="n">${p}%</span></div>`).join(""):`<p class="muted">${db?"ยังไม่มีผลสอบที่บันทึก ทำชุดแรกแล้วกลับมาดูหัวข้อที่ต้องทวน":"ประวัติคะแนนเก็บได้เมื่อเปิดหน้านี้ขณะลงชื่อเข้าใช้ claude.ai"}</p>`}</div>
      <div class="panel glass"><h3>ซ้อมล่าสุด</h3>
        ${hist.filter(a=>a.max).length?hist.filter(a=>a.max).map(a=>`<div class="hist"><span class="muted">${new Date(a.finishedAt).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}</span><span class="t">${esc(a.setTitle)}<small>${esc(a.modeLabel||"")}</small></span><span>${pill(pct(a.score,a.max))}</span><button class="btn sm" data-ra="${esc(a.id)}">report</button></div>`).join(""):`<p class="muted">ยังไม่มี</p>`}</div></div>
      <div class="panel glass" style="margin-top:14px"><h3>ลำดับอ่าน approach จาก Symptomatology (ตามจำนวนข้อสอบที่ใช้)</h3>
        <ol class="steps">${AP_ORDER.map(([k,why])=>`<li><b>${esc(AP[k][0])} · ${esc(AP[k][1])} <span class="muted" style="font-weight:400">มหิดล บท ${k} น.${AP[k][2]}</span></b><span>${esc(why)}</span></li>`).join("")}</ol>
        <p class="muted" style="font-size:.88rem;margin:.4em 0 0">บทที่สรุปแล้วและใช้บ่อยที่สุด ทบทวนซ้ำ: ไข้ (11 ข้อ), เหนื่อย (10), เลือดออกผิดปกติ (7)<br><a href="${SYM}" target="_blank" rel="noopener">เปิด Symptomatology</a></p></div>`;
  } else if(tab==="hist"){
    /* ประวัติข้อสอบที่เคยทำทั้งหมด ใหม่สุดก่อน · บันทึกเมื่อทำเสร็จหรือกดตรวจ (รอบที่ค้างกลางทางไม่ถูกบันทึก) */
    const F=renderHome.hxF||"all";
    const all=ATT.filter(a=>a.setId&&a.setId!=="pat").map(a=>({a,at:a.finishedAt||a.startedAt||""})).sort((x,y)=>y.at.localeCompare(x.at));
    const isQB=a=>/^q-/.test(a.setId);
    const list=all.filter(x=>F==="all"||(F==="qb"?isQB(x.a):!isQB(x.a)));
    const graded=all.filter(x=>x.a.max);
    const avg=graded.length?Math.round(graded.reduce((s,x)=>s+pct(x.a.score,x.a.max),0)/graded.length):null;

function drawDrill(P,i){
  const d=P.drills[i],g=PG[P.id][i]||{s:[]};let got=0;d.rubric.forEach((r,j)=>got+=g.s[j]||0);
  const box=$("#dres"+i);
  box.innerHTML=`${g.fb?`<p class="fb">Claude: ${esc(g.fb)}</p>`:""}<div class="rub">${d.rubric.map((r,j)=>{const v=g.s[j]||0;return `<span>${esc(r[0])} <span class="muted">(${r[1]})</span></span><span class="seg" data-j="${j}">${[0,r[1]/2,r[1]].map((x,z)=>`<button type="button" class="${v===x?"on":""}" data-v="${x}" aria-label="ให้ ${x} คะแนน">${["0","½","เต็ม"][z]}</button>`).join("")}</span>`}).join("")}</div>
    <p class="muted" style="margin:4px 0 0">ได้ ${+got.toFixed(1)} / ${d.pts}</p>`;
  box.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const j=+b.parentElement.dataset.j;PG[P.id][i]=PG[P.id][i]||{s:[]};PG[P.id][i].s[j]=+b.dataset.v;drawDrill(P,i);savePat()});
}
async function gradeDrill(P,i){
  const d=P.drills[i],ans=$("#dr"+i).value.trim()||"(ไม่ได้ตอบ)";
  const prompt=`คุณเป็นอาจารย์อายุรศาสตร์ตรวจคำตอบฝึกหัดของนักศึกษาแพทย์ปี 4 เรื่อง "${P.title}"
${RULES}
โจทย์: ${d.q}
โครงคำตอบที่ต้องมี: ${P.steps.map(s=>s[0]).join(", ")}
rubric (JSON): ${JSON.stringify(d.rubric.map((r,j)=>({id:j,หัวข้อ:r[0],คะแนนเต็ม:r[1]})))}
คำตอบนักศึกษา: ${ans}
ให้คะแนนแต่ละหัวข้อ 0 ถึงคะแนนเต็ม (ครึ่งได้) และฟีดแบ็กภาษาไทย 1-2 ประโยคว่าขาดหัวข้อไหนของโครง
ตอบเป็น JSON เท่านั้น: {"s":[คะแนนตาม id],"fb":"..."}`;
  try{const v=await sample.json(prompt,{modelTier:"default"});PG[P.id][i]={s:(v.s||[]).map((n,j)=>Math.max(0,Math.min(+n||0,d.rubric[j]?d.rubric[j][1]:0))),fb:v.fb||""};savePat()}
  catch(e){toast(e&&e.code==="rate_limited"?"Claude ตรวจถี่เกินไป รอสักครู่":"ตรวจไม่สำเร็จ ลองใหม่หรือให้คะแนนเอง")}
}
let patSaving=false;
async function savePat(){
  if(!db||patSaving)return;patSaving=true;
  const pat={},byTag={};PATS.forEach(P=>{const g=PG[P.id];if(!g)return;let G=0,M=0;P.drills.forEach((d,i)=>{if(!g[i])return;M+=d.pts;d.rubric.forEach((r,j)=>G+=g[i].s[j]||0)});if(M){pat[P.id]=pct(G,M);byTag["แพทเทิร์น: "+P.title]=[G,M]}});
  const prev=ATT.find(a=>a.id==="pat-latest");const merged={...(prev&&prev.pat||{}),...pat},mt={...(prev&&prev.byTag||{}),...byTag};
  const body={setId:"pat",setTitle:"แพทเทิร์นคำตอบ",modeLabel:"ฝึกแพทเทิร์น",pat:merged,byTag:mt,finishedAt:new Date().toISOString()};
  try{await db.collection("data/users/"+uid).doc("pat-latest").set(body);const i=ATT.findIndex(a=>a.id==="pat-latest");const row={id:"pat-latest",...body};i<0?ATT.push(row):ATT[i]=row}catch(e){}
  patSaving=false;
}

/* ---------- run model ---------- */
let run=null, clockT=null;
function getSet(id){return SETS.find(s=>s.id===id)||QB.find(s=>s.id===id)}
function buildQueue(set,mode,only){
  const q=[];
  if(mode!=="meq") set.stations.forEach(st=>{if(!only||only===st.n||(Array.isArray(only)&&only.includes(st.n)))q.push({t:"st",n:st.n,sec:300})});
  if(mode==="full"||mode==="meq") set.meq.forEach((c,ci)=>c.pages.forEach((p,pi)=>q.push({t:"mp",ci,pi,sec:(p.min||3)*60})));
  return q;
}
function startRun(sid,mode,only){
  const set=getSet(sid);
  if(mode==="pick") return renderPick(set);
  bell(0);
  run={set,mode,only,queue:buildQueue(set,mode,only),idx:0,ans:{},chat:{},grade:{},started:new Date().toISOString(),strict:true};
  $("#homeBtn").hidden=false;
  openItem();
}
function renderPick(set){
  chrome(true);$("#where").textContent=set.title;$("#homeBtn").hidden=false;
  $("#app").innerHTML=`<h2 style="margin:6px 0 12px">${set.stations.length?"เลือกสถานี":"เลือกเคส"}จาก ${esc(set.title)}</h2>
   <div class="sets">${set.stations.map(st=>`<div class="setrow glass"><div class="d"><b>${st.n}</b>${set.bank?"ข้อ":"สถานี"}</div>
     <div><h3>${esc(st.title)}</h3><span class="chip k-${st.kind}">${KIND[st.kind]}${st.link?" ต่อจากสถานี "+st.link:""}</span>${st.freq>1?` <span class="chip">ออกในโพย ${st.freq} ครั้ง</span>`:""}</div>
     <div class="acts"><button class="btn" data-n="${st.n}">ทำสถานีนี้</button></div></div>`).join("")}
   ${set.meq.map((c,i)=>`<div class="setrow glass"><div class="d"><b>M${i+1}</b>MEQ</div><div><h3>${esc(c.title)}</h3><span class="chip">${c.pages.length} หน้า</span> <span class="chip">${c.pages.reduce((t,p)=>t+(p.min||3),0)} นาที</span></div><div class="acts"><button class="btn" data-m="${i}">ทำ MEQ นี้</button></div></div>`).join("")}</div>`;
  $("#app").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>startRun(set.id,"osce",+b.dataset.n));
  $("#app").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{bell(0);run={set,mode:"meq",queue:set.meq[+b.dataset.m].pages.map((p,pi)=>({t:"mp",ci:+b.dataset.m,pi,sec:(p.min||3)*60})),idx:0,ans:{},chat:{},grade:{},started:new Date().toISOString(),strict:true};openItem()});
}
const stOf=n=>run.set.stations.find(s=>s.n===n);
const keyOf=it=>it.t==="st"?"s"+it.n:"m"+it.ci+"p"+it.pi;

function stopClock(){clearInterval(clockT);clockT=null}
function startClock(sec,onOut){
  stopClock();const end=Date.now()+sec*1000;const c=$("#clock");c.hidden=false;let warned=false;
  const tick=()=>{const left=(end-Date.now())/1000;c.textContent=fmt(left);
    c.classList.toggle("low",left<=60&&left>0);c.classList.toggle("out",left<=0);
    if(left<=60&&!warned){warned=true;bell(1)}
    if(left<=0){stopClock();bell(3);onOut()}};
  tick();clockT=setInterval(tick,250);
}

function openItem(){
  chrome(true);
  const it=run.queue[run.idx]; if(!it) return finishRun();
  it.t==="st"?renderStation(it):renderMeqPage(it);
  window.scrollTo(0,0);
}
function stripHtml(){
  return `<div class="strip">${run.queue.map((q,i)=>`<span class="${i===run.idx?"cur":i<run.idx?"done":""}" title="${q.t==="st"?"สถานี "+q.n:"MEQ"}">${q.t==="st"?q.n:"M"+(q.ci+1)+"."+(q.pi+1)}</span>`).join("")}</div>`;
}
function figHtml(src,alt){return src?`<img src="${esc(src)}" alt="${esc(alt||"ภาพประกอบโจทย์")}" onerror="this.outerHTML='<div class=noimg>ภาพนี้ยังไม่มีในชุด (${esc(src.split('/').pop())})</div>'">`:""}
function labHtml(rows){return rows?`<table class="lab">${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`:""}
function bindZoom(){document.querySelectorAll(".figs img").forEach(i=>i.onclick=()=>{$("#lbimg").src=i.src;$("#lb").classList.add("on")})}
$("#lb").onclick=()=>$("#lb").classList.remove("on");
$("#homeBtn").onclick=()=>{ if(run&&!run.finished&&!confirmLeave())return; renderHome(); };
function confirmLeave(){ // inline confirm (window.confirm is blocked)
  const b=$("#homeBtn"); if(b.dataset.arm){delete b.dataset.arm;b.textContent="ออกจากห้องสอบ";return true}
  b.dataset.arm=1;b.textContent="กดอีกครั้งเพื่อออก (คำตอบชุดนี้จะหาย)";setTimeout(()=>{delete b.dataset.arm;b.textContent="ออกจากห้องสอบ"},4000);return false;
}

/* ---------- station ---------- */
function renderStation(it){

  $("#where").textContent=`${run.set.title} · สถานี ${st.n}`;
  const hasChat=!!st.sp;
  const chatUI=hasChat?(sample?`<div class="chat"><div class="log" id="log"></div>
      <form id="chatf"><input id="chatin" autocomplete="off" placeholder="${st.sp.role==="examiner"?"เช่น ตรวจ neck stiffness":"พิมพ์คำถามถึงผู้ป่วย"}" aria-label="ข้อความถึง${st.sp.role==="examiner"?"ผู้คุมสอบ":"ผู้ป่วย"}"><button class="btn pri" id="chatsend">ส่ง</button></form></div>
      <p class="muted" style="font-size:.8rem;margin:.3em 0 0">${esc(st.sp.who)} · ${st.sp.role==="examiner"?"ผู้คุมสอบจะบอกผลเฉพาะสิ่งที่คุณระบุว่าตรวจ":"คุยภาษาธรรมดาได้ ผู้ป่วยตอบเฉพาะที่ถูกถาม"}</p>`
     :`<div class="task"><label for="nochat">เขียนสิ่งที่จะ${st.sp.role==="examiner"?"ตรวจ":"ถาม/แนะนำ"} เรียงตามลำดับ <span class="pts">(Claude ไม่พร้อมในหน้านี้)</span></label><textarea id="nochat" style="min-height:220px"></textarea></div>`):"";
  let qn=0;const tasks=st.tasks.map((t,i)=>t.chat?"":`<div class="task"><label for="t${i}">${++qn}. ${esc(t.q)} <span class="pts">${t.pts} คะแนน</span></label><textarea id="t${i}" data-i="${i}">${esc(run.ans[k][i]||"")}</textarea></div>`).join("");
  $("#app").innerHTML=`${stripHtml()}
   <section class="sheet glass"><div class="sheet-h"><span class="chip k-${st.kind}">${KIND[st.kind]}</span>${st.link?`<span class="chip">ต่อจากสถานี ${st.link}</span>`:""}<h2>${run.set.bank?"ข้อ":"สถานีที่"} ${st.n}</h2><span class="muted">${run.idx+1}/${run.queue.length}</span></div>
   <div class="grid2"><div>
     <div class="stem">${esc(st.stem)}</div>
     <div class="figs">${figHtml(st.img)}${figHtml(st.img2)}</div>${labHtml(st.data)}
     ${chatUI}
   </div><div>${tasks||'<p class="muted">สถานีนี้ประเมินจากการซักประวัติ/ตรวจในบทสนทนา</p>'}${hasChat&&st.tasks.some(t=>!t.chat)?"":""}</div></div>
   <div class="foot"><span class="lockmsg" id="lockmsg"></span><button class="btn pri" id="next">${run.idx+1<run.queue.length?"ส่งและไปสถานีถัดไป":"ส่งและดูผล"}</button></div></section>`;
  bindZoom();
  document.querySelectorAll("textarea[data-i]").forEach(ta=>ta.oninput=()=>run.ans[k][ta.dataset.i]=ta.value);
  const nc=$("#nochat"); if(nc){nc.value=run.ans[k].notes||"";nc.oninput=()=>run.ans[k].notes=nc.value}
  if(hasChat&&sample) setupChat(st,k);
  $("#next").onclick=()=>advance();
  startClock(it.sec,()=>{lockInputs("หมดเวลา — ไปสถานีถัดไปใน 5 วินาที");setTimeout(()=>{if(run&&run.queue[run.idx]===it)advance()},5000)});

function lockInputs(msg){document.querySelectorAll("#app textarea,#app input,#chatsend").forEach(e=>e.disabled=true);const m=$("#lockmsg");if(m)m.textContent=msg}
function advance(){stopClock();run.idx++;openItem()}

function setupChat(st,k){
  const log=$("#log"), f=$("#chatf"), inp=$("#chatin");
  const draw=()=>{log.innerHTML=run.chat[k].map(m=>`<div class="msg ${m.r}">${esc(m.x)}</div>`).join("");log.scrollTop=log.scrollHeight};
  if(!run.chat[k].length) run.chat[k].push({r:"sp",x:st.sp.opening});
  draw();
  let busy=false;
  f.onsubmit=async e=>{e.preventDefault();const t=inp.value.trim();if(!t||busy)return;busy=true;inp.value="";
    run.chat[k].push({r:"me",x:t});const sp={r:"sp",x:"…"};run.chat[k].push(sp);draw();
    try{
      const res=await sample(spPrompt(st,run.chat[k].slice(0,-1)),{modelTier:"quick",cache:false,onText:({text})=>{sp.x=text||"…";draw()}});
      sp.x=(res.text||"").trim()||"(ผู้ป่วยไม่ตอบ ลองถามใหม่)";
    }catch(err){sp.x=err&&err.code==="rate_limited"?"(Claude ตอบถี่เกินไป รอสักครู่แล้วถามใหม่)":"(เชื่อมต่อผู้ป่วยจำลองไม่ได้ เขียนคำถามต่อในช่องนี้ได้ ระบบจะเก็บเป็นบันทึก)";sp.r="sys"}
    busy=false;draw();inp.focus()};
}
function spPrompt(st,hist){

  return `คุณกำลังแสดงบท${ex?"ผู้คุมสอบ OSCE ที่บอกผลการตรวจร่างกาย":"ผู้ป่วยจำลอง (standardized patient)"} ในการสอบ OSCE อายุรศาสตร์ของนักศึกษาแพทย์ไทยปี 4
สถานการณ์: ${st.stem}
ตัวตน: ${st.sp.who}
ข้อมูลลับของเคส (ใช้ตอบ ห้ามเปิดเผยเองถ้าไม่ถูกถาม): ${st.sp.facts}
กติกา:
${ex?`- บอกผลเฉพาะการตรวจที่นักศึกษาระบุชัดเจน ถ้าพูดกว้างเช่น "ตรวจปอด" ให้ถามกลับว่าจะดู คลำ เคาะ หรือฟังอะไร

- ตอบสั้น ภาษาไทยปนศัพท์แพทย์ ห้ามบอกการวินิจฉัย ห้ามแนะนำว่าควรตรวจอะไรต่อ`:`- ตอบเป็นภาษาพูดแบบชาวบ้าน 1-2 ประโยค ตอบเฉพาะสิ่งที่ถูกถาม ห้ามเล่าข้อมูลอื่นเพิ่ม

- ห้ามใช้ศัพท์แพทย์ ห้ามบอกการวินิจฉัย ห้ามช่วยนักศึกษา
- ถ้านักศึกษาอธิบายโรคหรือให้คำแนะนำ ให้ตอบสนองแบบผู้ป่วยจริง และถามคำถามที่ข้อมูลลับระบุว่าผู้ป่วยจะถาม เมื่อเหมาะ`}
บทสนทนาจนถึงตอนนี้:
${conv}
ตอบเฉพาะคำพูดถัดไปของ${ex?"ผู้คุมสอบ":"ผู้ป่วย"} โดยไม่ใส่ชื่อผู้พูดนำหน้า`;

function itemsOf(r){ // gradable units
  return r.queue.map(it=>{
    if(it.t==="st"){const st=stOf(it.n);return {k:keyOf(it),title:`สถานี ${st.n} · ${st.title}`,kind:KIND[st.kind],tags:st.tags,tasks:st.tasks,st,appr:apprOf(r.set.id,"s"+st.n)}}
    const c=r.set.meq[it.ci],p=c.pages[it.pi];return {k:keyOf(it),title:`MEQ ${it.ci+1} หน้า ${it.pi+1} · ${c.title}`,kind:"MEQ",tags:c.tags,tasks:[{q:p.q,pts:p.pts,key:p.key,rubric:p.rubric}],info:p.info,meq:true,appr:apprOf(r.set.id,c.id)}
  });
}
function answerText(r,u,i,t){
  const a=r.ans[u.k]||{};
  if(t.chat){const c=(r.chat[u.k]||[]).filter(m=>m.r!=="sys");return c.length>1?c.map(m=>(m.r==="me"?"นศพ: ":"ตอบ: ")+m.x).join("\n"):(a.notes||"")}
  return a[i]||"";
}
function scoreOf(u){const g=run.grade[u.k]||{};let got=0,max=0;u.tasks.forEach((t,i)=>t.rubric.forEach((rb,j)=>{max+=rb[1];got+=(g[i]&&g[i].s&&g[i].s[j])||0}));return [got,max]}
function finishRun(){
  stopClock();$("#clock").hidden=true;run.finished=new Date().toISOString();
  renderResults(); saveAttempt();
}
function renderResults(){
  $("#where").textContent=`${run.set.title} · ผลสอบ`;
  const U=itemsOf(run);let G=0,M=0;U.forEach(u=>{const[g,m]=scoreOf(u);G+=g;M+=m});
  $("#app").innerHTML=`<div class="res-sum glass"><div><div class="muted">${esc(run.set.title)}</div><div class="big">${G.toFixed(1).replace(/\.0$/,"")}<span class="muted" style="font-size:1.2rem"> / ${M}</span></div></div>
     <div style="flex:1"></div>
     <button class="btn pri" id="gradeAll" ${sample?"":"disabled"}>${sample?"ให้ Claude ตรวจทั้งหมด":"Claude ไม่พร้อม: ตรวจเองตามเฉลย"}</button>
     <button class="btn" id="repBtn">ส่ง report ทางอีเมล</button><button class="btn" id="retry">ทำชุดนี้อีกครั้ง</button><button class="btn" id="back">หน้าแรก</button></div>
   <p class="muted" style="font-size:.88rem;margin-top:-6px">กดแต่ละข้อเพื่อดูคำตอบ เฉลย และให้คะแนน (0 / ½ / เต็ม ต่อหัวข้อ) คะแนนบันทึกอัตโนมัติ</p>
   <div id="ritems">${U.map((u,ix)=>ritemHtml(u,ix)).join("")}</div>`;
  bindRes(U);
  $("#gradeAll").onclick=()=>gradeAll(U);
  $("#retry").onclick=()=>startRun(run.set.id,run.mode,run.only);
  $("#repBtn").onclick=()=>{queueSave();renderReport(runAtt(),"results")};
  $("#back").onclick=()=>renderHome("home");
}
function ritemHtml(u,ix){
  const[g,m]=scoreOf(u);const gr=run.grade[u.k]||{};
  return `<details class="ritem glass" data-ix="${ix}"><summary><span class="chip">${esc(u.kind)}</span><b>${esc(u.title)}</b><span class="sc">${pill(pct(g,m))} <span class="muted" style="font-family:var(--f-mono);font-size:.85rem">${+g.toFixed(1)}/${m}</span></span></summary><div class="body">
   ${u.tasks.map((t,i)=>{const a=answerText(run,u,i,t);return `<div style="margin-top:10px"><b>${i+1}. ${esc(t.q)}</b> <span class="pts muted">${t.pts}</span>
     ${t.chat?`<div class="transcript">${esc(a||"(ไม่มีบทสนทนา)").replace(/\n/g,"<br>")}</div>`:`<div class="ans">${esc(a||"(ไม่ได้ตอบ)")}</div>`}
     ${t.key?`<div class="key"><b>เฉลย:</b> ${esc(t.key)}</div>`:""}
     ${gr[i]&&gr[i].fb?`<div class="fb">Claude: ${esc(gr[i].fb)}</div>`:""}
     <div class="rub">${t.rubric.map((rb,j)=>{const v=(gr[i]&&gr[i].s&&gr[i].s[j])||0;return `<span>${esc(rb[0])} <span class="muted">(${rb[1]})</span></span><span class="seg" data-i="${i}" data-j="${j}" data-max="${rb[1]}">${[0,rb[1]/2,rb[1]].map((x,z)=>`<button type="button" class="${v===x?"on":""}" data-v="${x}" aria-label="ให้ ${x} คะแนน">${["0","½","เต็ม"][z]}</button>`).join("")}</span>`}).join("")}</div></div>`}).join("")}
   ${u.st&&u.st.sp?`<details style="margin-top:8px"><summary class="muted">ข้อมูลผู้ป่วยทั้งหมด (สำหรับทบทวน)</summary><p class="muted" style="font-size:.88rem">${esc(u.st.sp.facts)}</p></details>`:""}
   ${run.grade[u.k]&&run.grade[u.k].sum?`<p class="fb">สรุป: ${esc(run.grade[u.k].sum)}</p>`:""}
   ${apprChips(u.appr||[])}
   <button class="btn sm" data-g="${ix}" ${sample?"":"hidden"}>ให้ Claude ตรวจข้อนี้</button></div></details>`;
}
function bindRes(U){
  document.querySelectorAll(".ritem").forEach(d=>{
    const u=U[+d.dataset.ix];
    d.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const s=b.parentElement,i=+s.dataset.i,j=+s.dataset.j;
      run.grade[u.k]=run.grade[u.k]||{};run.grade[u.k][i]=run.grade[u.k][i]||{s:[]};run.grade[u.k][i].s[j]=+b.dataset.v;
      refreshItem(U,+d.dataset.ix);queueSave()});
    const gb=d.querySelector("[data-g]");if(gb)gb.onclick=async()=>{gb.disabled=true;gb.textContent="กำลังตรวจ…";await gradeItem(u);refreshItem(U,+d.dataset.ix,true);queueSave()};
  });
}
function refreshItem(U,ix,open){
  const old=document.querySelector(`.ritem[data-ix="${ix}"]`);const wasOpen=old.open||open;
  old.outerHTML=ritemHtml(U[ix],ix);const n=document.querySelector(`.ritem[data-ix="${ix}"]`);n.open=wasOpen;bindRes(U);
  let G=0,M=0;U.forEach(u=>{const[g,m]=scoreOf(u);G+=g;M+=m});
  document.querySelector(".big").innerHTML=`${+G.toFixed(1)}<span class="muted" style="font-size:1.2rem"> / ${M}</span>`;
}
async function gradeAll(U){
  const b=$("#gradeAll");b.disabled=true;
  for(let ix=0;ix<U.length;ix++){b.textContent=`กำลังตรวจ ${ix+1}/${U.length}…`;const ok=await gradeItem(U[ix]);refreshItem(U,ix);if(ok==="stop")break}
  b.textContent="ตรวจครบแล้ว";queueSave();
}
async function gradeItem(u){
  const tasks=u.tasks.map((t,i)=>({ข้อ:i,คำถาม:t.q,เฉลย:t.key||"",rubric:t.rubric.map((r,j)=>({id:j,หัวข้อ:r[0],คะแนนเต็ม:r[1]})),คำตอบนักศึกษา:answerText(run,u,i,t)||"(ไม่ได้ตอบ)",เป็นบทสนทนา:!!t.chat}));
  const prompt=`คุณเป็นอาจารย์อายุรศาสตร์ตรวจข้อสอบ ${u.kind} ของนักศึกษาแพทย์ปี 4 อย่างเข้มงวดแต่ยุติธรรม
${RULES}
${u.st?`โจทย์: ${u.st.stem}`:`ข้อมูลหน้านี้: ${u.info||"-"}`}
ข้อที่ต้องตรวจ (JSON): ${JSON.stringify(tasks)}
ให้คะแนนแต่ละหัวข้อของ rubric เป็นตัวเลข 0 ถึงคะแนนเต็ม (ขั้นละครึ่งของคะแนนเต็มหรือเป็นทศนิยม .5) และฟีดแบ็กสั้นภาษาไทย 1-2 ประโยคต่อข้อ บอกสิ่งที่ขาดที่สำคัญที่สุด
ตอบเป็น JSON เท่านั้น รูปแบบ {"t":[{"s":[คะแนนตาม id ของ rubric],"fb":"..."}],"sum":"สรุปภาพรวม 1 ประโยค"} โดย t เรียงตามข้อ`;
  try{
    const v=await sample.json(prompt,{modelTier:"default"});
    run.grade[u.k]=run.grade[u.k]||{};
    (v.t||[]).forEach((x,i)=>{if(!u.tasks[i])return;const s=(x.s||[]).map((n,j)=>Math.max(0,Math.min(+n||0,u.tasks[i].rubric[j]?u.tasks[i].rubric[j][1]:0)));run.grade[u.k][i]={s,fb:x.fb||""}});
    run.grade[u.k].sum=v.sum||"";return true;
  }catch(e){
    if(e&&e.code==="not_granted"){sample=null;toast("ไม่ได้รับอนุญาตให้ใช้ Claude ตรวจเองตามเฉลยได้");return "stop"}
    if(e&&e.code==="rate_limited"){toast("Claude ตรวจถี่เกินไป หยุดรอสักครู่แล้วกดตรวจข้อที่เหลือ");return "stop"}
    toast("ตรวจข้อนี้ไม่สำเร็จ ลองกดตรวจข้อนี้อีกครั้ง");return false}
}

const nfmt=n=>String(+(+n||0).toFixed(1));

function lastAtt(sid){return ATT.filter(a=>a.setId===sid&&a.max).sort((x,y)=>(y.finishedAt||"").localeCompare(x.finishedAt||""))[0]||null}
function runAtt(){

  return {id:run.docId,setId:run.set.id,setTitle:run.set.title,modeLabel:{full:"วันจริง",osce:"OSCE+SAQ",meq:"MEQ"}[run.mode]||run.mode,
    startedAt:run.started,finishedAt:run.finished||new Date().toISOString(),score:+G.toFixed(1),max:M,ans:run.ans,chat:run.chat,grade:run.grade,keys:run.queue.map(keyOf)};

function attUnits(a){
  const set=getSet(a.setId); if(!set) return [];
  return (a.keys||[]).map(k=>{
    let m=/^s(\d+)$/.exec(k);
    if(m){const st=set.stations.find(s=>s.n===+m[1]);return st?{k,title:`สถานี ${st.n} · ${st.title}`,tasks:st.tasks}:null}
    m=/^m(\d+)p(\d+)$/.exec(k);
    if(m){const c=set.meq[+m[1]],p=c&&c.pages[+m[2]];return p?{k,title:`MEQ ${+m[1]+1} หน้า ${+m[2]+1} · ${c.title}`,tasks:[{q:p.q,pts:p.pts,key:p.key,rubric:p.rubric||[]}]}:null}
    return null}).filter(Boolean);
}
function buildReport(a){
  const src={ans:a.ans||{},chat:a.chat||{}};
  const units=attUnits(a).map(u=>{
    const g=(a.grade||{})[u.k]||null;let got=0,max=0;const miss=[],fb=[],keys=[],said=[];
    u.tasks.forEach((t,i)=>{const gi=(g&&g[i])||{};let lost=false;
      (t.rubric||[]).forEach((rb,j)=>{const v=+((gi.s||[])[j])||0;got+=v;max+=rb[1];if(v<rb[1]){lost=true;miss.push(`${rb[0]} (ได้ ${nfmt(v)}/${rb[1]})`)}});
      if(gi.fb)fb.push(gi.fb);
      if(lost&&t.key)keys.push(t.key);
      if(!t.chat)said.push(`${t.q} → ${(answerText(src,u,i,t)||"(ไม่ได้ตอบ)").replace(/\s*\n\s*/g," / ")}`);
    });
    return {title:u.title,got,max,graded:!!g,miss,fb,keys,said,sum:(g&&g.sum)||""};
  });
  let G=0,M=0;units.forEach(u=>{G+=u.got;M+=u.max});
  const when=new Date(a.finishedAt||a.startedAt||Date.now()).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Bangkok"});
  return {a,units,bad:units.filter(u=>u.got<u.max),G,M,p:pct(G,M),when};
}
function reportText(R,short){
  const L=[`${REPORT_SUBJ} — รายงานผลซ้อม`,`${R.a.setTitle} · ${R.a.modeLabel||""} · ${R.when}`,`คะแนนรวม ${nfmt(R.G)}/${R.M} (${R.p}%)`,"","คะแนนรายข้อ",numList(R.units.map(u=>`${u.title} — ${nfmt(u.got)}/${u.max}`)),"",`ข้อผิดและสิ่งที่ต้องจำ (${R.bad.length} ข้อ)`];
  R.bad.forEach(u=>{
    L.push("",`■ ${u.title} — ${nfmt(u.got)}/${u.max}${u.graded?"":" (ยังไม่ได้ให้คะแนน)"}`);
    if(!short&&u.said.length)L.push("ตอบไป:",numList(u.said));
    L.push("ที่พลาด:",numList(u.miss));
    if(!short&&u.fb.length)L.push("ความเห็นผู้ตรวจ:",numList(u.fb));
    if(u.keys.length)L.push("ต้องจำ (เฉลย):",numList(u.keys));
  });
  return L.join("\n");
}

}

const PDF_W=794,PDF_H=1123,PDF_S=1.5,PDF_M=52;
const pdfName=(a,R)=>`${REPORT_SUBJ} - ${a.setTitle} - ${R.when}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
async function reportPdf(R,S=PDF_S,Q=0.78){

  const col=p=>p>=70?C.grn:p>=50?C.org:C.red;
  const F=(w,s,d)=>`${w} ${s}px ${d?'"Prompt","Noto Sans Thai"':'"Noto Sans Thai","Prompt"'},Tahoma,sans-serif`;
  const L=PDF_M,RX=PDF_W-PDF_M,W=RX-L,BOT=PDF_H-PDF_M-16;
  const pages=[];let ctx,y;
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=Math.round(PDF_W*S);cv.height=Math.round(PDF_H*S);ctx=cv.getContext("2d");ctx.scale(S,S);ctx.fillStyle="#fff";ctx.fillRect(0,0,PDF_W,PDF_H);pages.push(cv);y=PDF_M};

  const wseg=IS?new Intl.Segmenter("th",{granularity:"word"}):null,gseg=IS?new Intl.Segmenter("th",{granularity:"grapheme"}):null;

    for(const p of pieces(String(t))){

      if(line.trim())out.push(line.trimEnd());line=p.trimStart();
      while(line&&ctx.measureText(line).width>max){let a="";for(const g of graphemes(line)){if(a&&ctx.measureText(a+g).width>max)break;a+=g}out.push(a);line=line.slice(a.length)}

    wrap(t,font,RX-x-(o.bg?6:0)).forEach((ln,i)=>{ensure(lh);band(lh,o.bg);if(i===0&&o.num!=null)txt(o.num+".",nx+18,y+lh-5,font,color,"right");txt(ln,x,y+lh-5,font,color);y+=lh})};

  const label=(t,color,bg)=>{ensure(46);band(6,bg);y+=6;para(t,{font:F(600,12,true),color,bg,lh:20})};
  const list=(arr,color,bg)=>arr.forEach((x,i)=>para(x,{num:i+1,color,bg}));
  const heading=t=>{ensure(60);y+=10;ctx.fillStyle=C.blue;ctx.fillRect(L,y+3,4,19);txt(t,L+12,y+19,F(600,15.5,true),C.ink);y+=34};
  newPage();
  txt(`${REPORT_SUBJ} — รายงานผลซ้อม`,L,y+24,F(700,22,true),C.ink);y+=34;
  para(`${R.a.setTitle} · ${R.a.modeLabel||""} · ${R.when}`,{color:C.mut});
  y+=4;ctx.font=F(700,34,true);const sw=ctx.measureText(`${nfmt(R.G)} / ${R.M}`).width;

  heading("คะแนนรายข้อ");
  R.units.forEach((u,i)=>{const ls=wrap(`${i+1}. ${u.title}`,F(400,12.5),W-80);const h=ls.length*19+6;ensure(h);
    ls.forEach((ln,j)=>txt(ln,L,y+15+j*19,F(400,12.5),C.ink));txt(`${nfmt(u.got)}/${u.max}`,RX,y+15,F(600,12.5,true),col(pct(u.got,u.max)),"right");
    y+=h;ctx.fillStyle=C.line;ctx.fillRect(L,y-3,W,1)});
  heading(`ข้อผิดและสิ่งที่ต้องจำ (${R.bad.length} ข้อ)`);
  if(!R.bad.length)para("ได้เต็มทุกข้อ");
  R.bad.forEach(u=>{
    const ls=wrap(u.title,F(600,13.5,true),W-110),hh=ls.length*21+10;ensure(hh+70);
    ctx.fillStyle=C.hbg;ctx.fillRect(L-8,y,W+16,hh);ls.forEach((ln,j)=>txt(ln,L+2,y+20+j*21,F(600,13.5,true),C.ink));

    if(u.fb.length){label("ความเห็นผู้ตรวจ",C.mut);list(u.fb,C.ink)}

  });
  pages.forEach((cv,i)=>{const c=cv.getContext("2d");c.font=F(400,9.5);c.fillStyle="#8a96ad";c.textAlign="left";c.fillText(`${REPORT_SUBJ} · ${R.a.setTitle}`,L,PDF_H-PDF_M+12);c.textAlign="right";c.fillText(`${i+1} / ${pages.length}`,RX,PDF_H-PDF_M+12);c.textAlign="left"});
  const imgs=[];for(const cv of pages){const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",Q));if(!b)throw new Error("canvas");imgs.push(new Uint8Array(await b.arrayBuffer()))}
  return pdfFromJpegs(imgs,pages[0].width,pages[0].height);
}
function pdfFromJpegs(imgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,head,stream)=>{offs[id]=len;put(`${id} 0 obj\n${head}\n`);if(stream){put("stream\n");put(stream);put("\nendstream\n")}put("endobj\n")};
  put("%PDF-1.4\n");put(new Uint8Array([37,226,227,207,211,10]));
  const n=imgs.length,kids=imgs.map((_,i)=>`${3+3*i} 0 R`).join(" ");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  imgs.forEach((img,i)=>{const p=3+3*i,c=p+1,im=p+2,cs=enc.encode("q 595.28 0 0 841.89 0 0 cm /Im0 Do Q");
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>`);
    obj(c,`<< /Length ${cs.length} >>`,cs);
    obj(im,`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>`,img)});
  const N=3+3*n,xref=len;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let i=1;i<N;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  put(x+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

.aiw-sel{position:fixed;z-index:2147483002;font-size:13px;font-weight:700;line-height:1;color:var(--aiw-on);background:var(--aiw-acc);border:0;border-radius:999px;padding:8px 13px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);white-space:nowrap}
.aiw-fab[hidden],.aiw-sel[hidden],.aiw-panel[hidden],.aiw-quote[hidden],.aiw-quick[hidden]{display:none!important}
.aiw-panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:2147483001;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 100px));display:flex;flex-direction:column;background:var(--aiw-bg);color:var(--aiw-ink);border:1px solid var(--aiw-rule);border-radius:20px;box-shadow:0 18px 50px -18px rgba(0,0,0,.55);overflow:hidden;font-size:14.4px;line-height:1.6;text-align:left}
@media (max-width:560px){.aiw-panel{right:8px;left:8px;width:auto;bottom:8px;height:min(78vh,620px)}}
.aiw-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--aiw-rule);background:var(--aiw-sunk)}
.aiw-hd b{font-size:14.5px;margin-right:auto;min-width:0}
.aiw-ctx{display:block;font-size:11.5px;font-weight:500;color:var(--aiw-ink3);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiw-hd button{font-size:12.5px;font-weight:600;color:var(--aiw-ink2);background:var(--aiw-bg);border:1px solid var(--aiw-rule);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap;flex:none}
.aiw-log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.aiw-m{max-width:92%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere}
.aiw-m.u{align-self:flex-end;background:var(--aiw-acc-soft);border-bottom-right-radius:4px}
.aiw-m.a{align-self:flex-start;background:var(--aiw-sunk);border-bottom-left-radius:4px}
.aiw-m.err{color:var(--aiw-bad)}
.aiw-m p{margin:0 0 6px}.aiw-m p:last-child{margin:0}.aiw-m ul{margin:4px 0;padding-left:20px}.aiw-m li{margin:2px 0}
.aiw-m code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--aiw-bg);padding:0 4px;border-radius:4px}
.aiw-q{margin:0 0 6px;padding:4px 9px;border-left:3px solid var(--aiw-acc);color:var(--aiw-ink2);font-size:13px;background:var(--aiw-bg);border-radius:0 8px 8px 0;white-space:pre-wrap}
.aiw-dim{color:var(--aiw-ink3);font-size:13.5px;line-height:1.7}
.aiw-quote{display:flex;gap:8px;align-items:flex-start;margin:0 14px;padding:7px 9px;border-left:3px solid var(--aiw-acc);background:var(--aiw-acc-soft);border-radius:0 8px 8px 0;font-size:12.8px;color:var(--aiw-ink2)}
.aiw-quote span{flex:1;max-height:4.6em;overflow:hidden;white-space:pre-wrap}
.aiw-quote button{border:0;background:transparent;color:var(--aiw-ink3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.aiw-quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.aiw-quick button{font-size:12.5px;font-weight:600;color:var(--aiw-acc);background:var(--aiw-bg);border:1px solid var(--aiw-acc);border-radius:999px;padding:4px 10px;cursor:pointer}
.aiw-in{display:flex;gap:8px;padding:10px 14px 12px;align-items:flex-end}
.aiw-in textarea{flex:1;min-height:42px;max-height:140px;font-size:14.5px;line-height:1.5;color:var(--aiw-ink);background:var(--aiw-bg);border:1px solid var(--aiw-rule);padding:9px 11px;border-radius:12px;resize:none;margin:0}
.aiw-in button{font-size:14px;font-weight:700;line-height:1;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--aiw-acc);color:var(--aiw-on)}
.aiw-in button.stop{background:var(--aiw-sunk);color:var(--aiw-ink);border:1px solid var(--aiw-rule)}
.aiw-note{font-size:11.5px;color:var(--aiw-ink3);padding:0 14px 10px}
@media print{.aiw-fab,.aiw-sel,.aiw-panel{display:none!important}}
</style>
<script id="aiw-script">
(function(){
  "use strict";
  if(window.__aiw)return;window.__aiw=1;
  var MODEL="claude-sonnet-5-5",PAGE=(document.title||"หน้านี้").trim();
  var AI={sample:null,turns:[],ctl:null,quote:"",open:false},root=document.documentElement,el={};
  function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function inl(t){return esc(t).replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");}
  function md(t){
    var out=[],list=null,para=[];
    function fp(){if(para.length){out.push("<p>"+para.join("<br>")+"</p>");para=[];}}
    function fl(){if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;}}
    String(t||"").replace(/\r/g,"").split("\n").forEach(function(L){
      var m=/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(L);
      if(m){fp();(list=list||[]).push("<li>"+inl(m[1])+"</li>");return;}
      if(!L.trim()){fp();fl();return;}
      fl();para.push(inl(L.replace(/^\s*#{1,6}\s+/,"").replace(/^\s*>\s?/,"")));
    });
    fp();fl();return out.join("");
  }
  function mk(tag,cls,html){var x=document.createElement(tag);if(cls)x.className=cls;if(html!=null)x.innerHTML=html;return x;}
  el.fab=mk("button","aiw-fab","ถาม AI");el.fab.type="button";el.fab.hidden=true;el.fab.title="ถาม Claude เรื่องที่กำลังอ่าน";
  el.sel=mk("button","aiw-sel","ถาม AI ↗");el.sel.type="button";el.sel.hidden=true;
  el.panel=mk("div","aiw-panel");el.panel.hidden=true;el.panel.setAttribute("role","dialog");el.panel.setAttribute("aria-label","ถาม AI");
  el.panel.innerHTML="<div class='aiw-hd'><b>ถาม AI<span class='aiw-ctx'></span></b><button type='button' data-aiw='clear'>ล้างแชท</button><button type='button' data-aiw='close'>ปิด</button></div>"+
    "<div class='aiw-log' aria-live='polite'></div><div class='aiw-quote' hidden><span></span><button type='button' data-aiw='unquote' aria-label='เอาข้อความที่เลือกออก'>×</button></div>"+
    "<div class='aiw-quick' hidden><button type='button' data-aiq='อธิบายตรงนี้ให้เข้าใจง่าย ๆ'>อธิบาย</button><button type='button' data-aiq='ทำไมถึงเป็นแบบนี้ (กลไก)'>ทำไม</button><button type='button' data-aiq='ขอเคสตัวอย่างสั้น ๆ ที่ข้อสอบชอบออก'>เคสข้อสอบ</button><button type='button' data-aiq='มีวิธีจำง่าย ๆ ไหม'>วิธีจำ</button></div>"+
    "<div class='aiw-in'><textarea rows='1' placeholder='พิมพ์คำถาม… (Enter ส่ง)'></textarea><button type='button' data-aiw='send'>ส่ง</button></div>"+
    "<div class='aiw-note'>ตอบโดย Claude (Sonnet) จากบัญชีของคุณ · อิงสิ่งที่อยู่บนจอ ตรวจกับตำราก่อนใช้จริง</div>";
  function mount(){[el.fab,el.sel,el.panel].forEach(function(x){root.appendChild(x);});}
  mount();
  var log=el.panel.querySelector(".aiw-log"),ta=el.panel.querySelector("textarea"),sendB=el.panel.querySelector("[data-aiw='send']"),
      qBox=el.panel.querySelector(".aiw-quote"),quick=el.panel.querySelector(".aiw-quick"),ctxEl=el.panel.querySelector(".aiw-ctx");
  var ERR={not_granted:"ไม่ได้อนุญาตให้หน้านี้ใช้ Claude",sampling_disabled:"บัญชีนี้ใช้ Claude จากหน้านี้ไม่ได้",not_declared:"หน้านี้ยังไม่ได้เปิดสิทธิ์ใช้ Claude",
    capability_disabled:"ใช้ Claude ในหน้านี้ไม่ได้ตอนนี้",capability_removed:"แอปที่เปิดอยู่ยังไม่รองรับ",rate_limited:"ถามถี่เกินไปหรือโควตาเต็ม ลองใหม่อีกสักพัก",
    session_expired:"ต้องเข้าสู่ระบบใหม่",refused:"Claude ไม่ตอบคำถามนี้ ลองถามแบบอื่น",empty_completion:"ไม่ได้คำตอบ ลองถามให้สั้นลง",
    prompt_too_large:"คำถามหรือข้อความที่เลือกยาวเกินไป",upstream_error:"เชื่อมต่อขัดข้อง กดส่งอีกครั้งได้"};
  var OFF={not_granted:1,sampling_disabled:1,not_declared:1,capability_disabled:1,capability_removed:1};
  function mine(n){return n&&(n===el.panel||n===el.sel||n===el.fab||el.panel.contains(n));}
  /* บริบท = ข้อความที่อยู่บนจอตอนนี้ (บล็อกที่มองเห็น) ไม่เกิน ~6,000 ตัว */
  function screenText(){
    var vh=root.clientHeight,seen=[],total=0,
        nodes=document.body?document.body.querySelectorAll("h1,h2,h3,h4,h5,p,li,td,th,dt,dd,blockquote,figcaption,label,summary,pre,.stem,.q,.choice"):[];
    for(var i=0;i<nodes.length&&total<6000;i++){
      var n=nodes[i];if(mine(n))continue;
      if(n.parentElement&&n.parentElement.closest("li,td,th,p,blockquote,dd,pre")&&n.parentElement.closest("li,td,th,p,blockquote,dd,pre")!==n)continue;
      var r=n.getBoundingClientRect();if(r.bottom<0||r.top>vh||r.width<1||r.height<1)continue;
      var t=String(n.innerText||"").replace(/\s+\n/g,"\n").replace(/[ \t]+/g," ").trim();if(!t)continue;
      if(t.length>1500)t=t.slice(0,1500)+"…";
      seen.push(t);total+=t.length;
    }
    return seen.join("\n");
  }
  function heading(){
    var hs=document.body?document.body.querySelectorAll("h1,h2,h3"):[],best="";
    for(var i=0;i<hs.length;i++){if(mine(hs[i]))continue;var r=hs[i].getBoundingClientRect();if(r.height<1)continue;if(r.top<root.clientHeight*0.6)best=String(hs[i].innerText||"").trim();}
    return best.slice(0,120);
  }
  function rules(scr,hd){
    return "คุณเป็นติวเตอร์อายุรศาสตร์ของนักศึกษาแพทย์ปี 4 (MED421/422) ที่กำลังใช้หน้าเว็บ \""+PAGE+"\"\n"+
      "- ตอบภาษาไทย กระชับ ตรงคำถาม ใช้ศัพท์แพทย์ภาษาอังกฤษตามที่ใช้จริง\n"+
      "- อิงข้อความบนจอด้านล่างก่อน ถ้าต้องใช้ความรู้นอกจากนั้นให้บอกว่าเป็นความรู้ทั่วไป ห้ามแต่งตัวเลข ขนาดยา หรือเกณฑ์ที่ไม่แน่ใจ\n"+
      "- จัดรูปแบบง่าย ๆ: **ตัวหนา** กับคำสำคัญ, รายการขึ้นต้นด้วย \"- \", ย่อหน้าสั้น ไม่ใช้หัวเรื่อง # และไม่ใช้ตาราง\n"+
      "- ถ้าผู้ใช้ยกข้อความมา (บรรทัดที่ขึ้นต้นด้วย >) ให้อธิบายข้อความนั้นในบริบทของหน้า\n\n"+
      (hd?"หัวข้อที่เปิดอยู่: "+hd+"\n\n":"")+"ข้อความบนจอตอนกดถาม:\n"+(scr||"(ไม่มี)");
  }
  function bubble(cls,html){var b=mk("div","aiw-m "+cls,html);log.appendChild(b);log.scrollTop=log.scrollHeight;return b;}
  function empty(){if(!log.children.length)log.innerHTML="<div class='aiw-dim'>ถามอะไรก็ได้เกี่ยวกับสิ่งที่อยู่บนจอ<br>หรือ <b>ลากคลุมข้อความ</b> แล้วกดปุ่ม <b>ถาม AI ↗</b> ที่ขึ้นมา</div>";}
  function setQuote(t){AI.quote=String(t||"").replace(/\s+\n/g,"\n").trim().slice(0,1500);qBox.hidden=!AI.quote;quick.hidden=!AI.quote;qBox.querySelector("span").textContent=AI.quote;}
  var snap="",snapHd="";
  function openPanel(){
    snap=screenText();snapHd=heading();          /* จับข้อความบนจอก่อนแผงบังเนื้อหา */
    AI.open=true;el.panel.hidden=false;el.fab.hidden=true;el.sel.hidden=true;
    ctxEl.textContent=snapHd||PAGE;empty();setTimeout(function(){try{ta.focus();}catch(e){}},30);
  }
  function closePanel(){AI.open=false;el.panel.hidden=true;el.fab.hidden=!AI.sample;}
  function busy(on){sendB.textContent=on?"หยุด":"ส่ง";sendB.classList.toggle("stop",on);}
  function send(text){
    if(AI.ctl){AI.ctl.abort();return;}
    text=String(text==null?ta.value:text).trim();
    if(!text&&!AI.quote)return;
    if(!text)text="อธิบายตรงนี้ให้เข้าใจง่าย ๆ";
    var q=AI.quote,content=(q?q.split("\n").map(function(x){return "> "+x;}).join("\n")+"\n\n":"")+text;
    var d=log.querySelector(".aiw-dim");if(d&&d.parentNode===log)d.remove();
    bubble("u",(q?"<div class='aiw-q'>"+esc(q)+"</div>":"")+esc(text).replace(/\n/g,"<br>"));
    ta.value="";ta.style.height="";setQuote("");
    AI.turns.push({role:"user",content:content});
    while(AI.turns.length>12)AI.turns.splice(0,2);
    var msgs=[{role:"user",content:rules(snap,snapHd)},{role:"assistant",content:"รับทราบ พร้อมตอบ"}].concat(AI.turns);
    var out=bubble("a","<span class='aiw-dim'>กำลังคิด…</span>"),ctl=new AbortController();AI.ctl=ctl;busy(true);
    AI.sample(msgs,{model:MODEL,modelTier:"default",cache:false,signal:ctl.signal,
      onText:function(u){out.innerHTML=md(u.text);log.scrollTop=log.scrollHeight;}}).then(function(r){
      out.innerHTML=md(r.text)+(r.truncated?"<p class='aiw-dim'>(คำตอบถูกตัด ลองถามให้แคบลง)</p>":"");
      AI.turns.push({role:"assistant",content:r.text});
    },function(e){
      var c=e&&e.code,keep=e&&e.text;AI.turns.pop();
      if(c==="cancelled"){out.innerHTML=keep?md(keep)+"<p class='aiw-dim'>(หยุดแล้ว)</p>":"<span class='aiw-dim'>หยุดแล้ว</span>";return;}
      out.classList.add("err");out.innerHTML=(keep&&c!=="refused"?md(keep):"")+"<p>"+esc(ERR[c]||ERR.upstream_error)+"</p>";
      if(OFF[c]){AI.sample=null;el.fab.hidden=true;el.sel.hidden=true;}
    }).then(function(){if(AI.ctl===ctl)AI.ctl=null;busy(false);log.scrollTop=log.scrollHeight;});
  }
  /* ลากคลุมข้อความ → ปุ่ม "ถาม AI ↗" */
  var selT=null;
  function selText(){
    var s=window.getSelection&&window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return null;
    var r=s.getRangeAt(0),c=r.commonAncestorContainer;if(c&&c.nodeType!==1)c=c.parentNode;
    if(!c||mine(c)||(c.closest&&c.closest("input,textarea,[contenteditable='true']")))return null;
    var t=String(s.toString()||"").trim();if(t.length<2)return null;
    return {t:t,r:r};
  }
  function placeSel(){
    selT=null;if(!AI.sample){el.sel.hidden=true;return;}
    var x=selText();if(!x){el.sel.hidden=true;return;}
    var rs=x.r.getClientRects(),b=rs.length?rs[rs.length-1]:x.r.getBoundingClientRect();
    el.sel.hidden=false;
    var w=el.sel.offsetWidth,h=el.sel.offsetHeight,vw=root.clientWidth,vh=root.clientHeight;
    var left=Math.max(8,Math.min(b.right-w/2,vw-w-8)),top=b.bottom+8;
    if(top+h>vh-8)top=b.top-h-8;
    top=Math.max(8,Math.min(top,vh-h-8));
    el.sel.style.left=left+"px";el.sel.style.top=top+"px";
  }
  document.addEventListener("selectionchange",function(){clearTimeout(selT);selT=setTimeout(placeSel,220);});
  window.addEventListener("scroll",function(){if(!el.sel.hidden)placeSel();},{passive:true,capture:true});
  el.sel.addEventListener("mousedown",function(e){e.preventDefault();});
  el.sel.addEventListener("click",function(){
    var x=selText();if(!x)return;
    setQuote(x.t);openPanel();
    try{window.getSelection().removeAllRanges();}catch(e){}
  });
  el.fab.addEventListener("click",openPanel);
  el.panel.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("button");if(!b)return;
    var a=b.getAttribute("data-aiw");
    if(a==="close")closePanel();
    else if(a==="clear"){if(AI.ctl)AI.ctl.abort();AI.turns=[];log.innerHTML="";setQuote("");empty();}
    else if(a==="unquote")setQuote("");
    else if(a==="send")send();
    else if(b.hasAttribute("data-aiq"))send(b.getAttribute("data-aiq"));
  });
  /* กันปุ่มลัดของหน้า (เช่น ตัวเลือก A–E หรือ Space) ทำงานตอนพิมพ์ในแชท */
  ["keydown","keyup","keypress"].forEach(function(t){el.panel.addEventListener(t,function(e){e.stopPropagation();});});
  ta.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!AI.ctl)send();}
    else if(e.key==="Escape")closePanel();
  });
  ta.addEventListener("input",function(){ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";});
  /* ถ้าหน้าเขียน <html> ใหม่ทั้งก้อน ให้แขวนกลับ */
  if("MutationObserver" in window)new MutationObserver(function(){if(!root.contains(el.panel))mount();}).observe(root,{childList:true});
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("sample").then(function(s){if(!s)return;AI.sample=s;if(!AI.open)el.fab.hidden=false;}).catch(function(){});
  }
})();
</script>
