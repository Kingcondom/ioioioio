/* ---------- ปิดตารางเพื่อทวน ---------- */
/* TQST จำว่าตารางไหนกำลังปิดอยู่และเปิดช่องไหนไปแล้ว เพื่อให้ไม่หายตอน render ใหม่
   (เช่น ตอบข้อสอบท้ายหัวข้อ) · อยู่ในหน่วยความจำรอบนี้เท่านั้น ไม่ปนกับ state ที่ซิงก์ขึ้นบัญชี */
var TQST={};
function tqKey(i){return (state.sec||state.view||"x")+":"+i;}
function tqCell(td){
  var tr=td.parentNode,tb=tr.parentNode;
  return [].indexOf.call(tb.children,tr)+":"+[].indexOf.call(tr.children,td);
}
function tqRec(td,open){
  var tw=td.closest(".tablewrap");if(!tw||!tw._tqk)return;
  var st=TQST[tw._tqk];if(!st)return;
  if(open)st.op[tqCell(td)]=1;else delete st.op[tqCell(td)];
}
function tqOpen(td,open){                     /* เปิด/ปิดช่องเดียว พร้อมบอก screen reader */
  td.classList.toggle("op",open);
  td.setAttribute("aria-expanded",open?"true":"false");
  tqRec(td,open);
}
var TQSEG=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"grapheme"}):null;
function tqHint(t){
  t=String(t||"");
  var segs=t.split(/\s·\s|\n/).filter(function(x){return x.trim();}).length;
  t=t.replace(/\s+/g," ").trim();
  if(!t)return "";
  var core=t.replace(/[↑↓↔≈=<>≥≤+\-–—()*.,:;\/\s]/g,"");
  if(core.length<=2)return "?";
  var g=TQSEG?Array.from(TQSEG.segment(t),function(x){return x.segment;}):Array.from(t);
  var head=g.slice(0,2).join("").trim();
  return head+"…"+(segs>1?" ("+segs+")":"");
}
function tqSet(tw,on){
  var tb=tw.querySelector("table");if(!tb)return;
  tb.classList.toggle("tq",on);
  tb.querySelectorAll("tbody tr").forEach(function(tr){
    Array.prototype.forEach.call(tr.children,function(td,i){
      if(i===0||td.tagName!=="TD")return;
      if(on){
        if(!td.hasAttribute("data-hint"))td.setAttribute("data-hint",tqHint(td.innerText));
        td.classList.add("cv");td.classList.remove("op");
        td.tabIndex=0;td.setAttribute("role","button");
        td.setAttribute("aria-expanded","false");
        td.setAttribute("aria-label","ช่องที่ปิดไว้ คำใบ้ "+td.getAttribute("data-hint")+" · กดเพื่อเปิดดูคำตอบ");
      } else {
        td.classList.remove("cv","op");
        td.removeAttribute("tabindex");td.removeAttribute("role");
        td.removeAttribute("aria-expanded");td.removeAttribute("aria-label");
      }
    });
  });
  var bar=tw.previousElementSibling;if(bar&&bar.classList.contains("tqbar"))tqBar(bar,on);
  if(tw._tqk){if(on)TQST[tw._tqk]={on:1,op:{}};else delete TQST[tw._tqk];}
}
function tqBar(bar,on){
  bar.innerHTML=on?"<button class='btn' data-tq='all'>เปิดทั้งหมด</button><button class='btn' data-tq='re'>ปิดใหม่</button><button class='btn' data-tq='off'>เลิกทวน</button><span class='tqn'>แตะช่องเพื่อเปิดทีละช่อง · คำใบ้ = ตัวแรก ๆ (จำนวนข้อ)</span>"
    :"<button class='btn' data-tq='on'>ปิดเพื่อทวน</button>";
  bar.insertAdjacentHTML("beforeend","<a class='btn' data-tqpin='1' href='"+POSTIT+"' target='_blank' rel='noopener' title='แต่ละแถวของตารางนี้จะเป็น post-it หนึ่งใบ'>ปักตารางใน post-it</a>");
}
/* ปักตารางใน post-it (ผู้ใช้ขอ 5 พ.ย.) — แถวละใบ: หน้า = คอลัมน์แรก + คำถามจากหัวคอลัมน์ (ตาราง 2 คอลัมน์) หรือหัวข้อที่ตารางอยู่ · หลัง = คอลัมน์ที่เหลือ
   ส่งไปทาง #t=<base64url JSON> ตั้ง href ตอนกด (ก่อนเบราว์เซอร์เปิดลิงก์) จึงได้เนื้อหาล่าสุดเสมอ */
var POSTIT="https://claude.ai/artifact/BRsYSzd35CARo2m6Jw6ANY";
function cellTxt(td){return String(td.innerText||td.textContent||"").replace(/[ \t]+/g," ").replace(/\s*\n\s*/g,"\n").trim();}
function tqPinHref(tw){
  var tb=tw.querySelector("table");if(!tb)return POSTIT;
  var hd=[].map.call(tb.querySelectorAll("thead th"),cellTxt),ctx="",el=tw.previousElementSibling;
  while(el&&!/^H[34]$/.test(el.tagName))el=el.previousElementSibling;
  if(el)ctx=cellTxt(el);
  var s=secOf(lecOf(state.lec),state.sec),title=s?s.title:"";
  if(!ctx)ctx=title;
  var sub=hd.length===2&&hd[1]?hd[1]:"";
  var cards=[];
  tb.querySelectorAll("tbody tr").forEach(function(tr){
    var c=[].map.call(tr.children,cellTxt);if(!c.length||!c.join(""))return;
    var head=c[0]||hd[0]||"",back=[];
    for(var i=1;i<c.length;i++){if(!c[i]||c[i]==="—")continue;back.push(hd.length>2&&hd[i]?hd[i]+": "+c[i]:c[i]);}
    if(!head||!back.length)return;
    /* หน้าใบต้องบอกที่มาเสมอ — ตาราง 2 คอลัมน์ที่คอลัมน์แรกเป็นเลขหรือคำสั้น (เช่น WHO stage 1-4)
       เคยได้ใบหน้าเป็น "1" เฉย ๆ จนผู้ใช้หาไม่เจอบนกำแพง จึงใส่ ctx (ชื่อหัวข้อ) ไว้หน้าคำถามด้วย */
    cards.push(["**"+head.replace(/\*/g,"")+"**\n"+(sub?(ctx?ctx+" · ":"")+sub.replace(/[?？]\s*$/,"")+" ?":ctx),back.join("\n")]);
  });
  var js=JSON.stringify({s:ctx,c:cards});
  var b64=btoa(unescape(encodeURIComponent(js))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return POSTIT+"#t="+b64;
}
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[data-tqpin]");if(!a)return;
  var bar=a.closest(".tqbar"),tw=bar&&bar.nextElementSibling;
  if(tw)a.href=tqPinHref(tw);
});

/* ปักหลักจำใน post-it (ผู้ใช้ขอ 7 พ.ย.) — หลักจำหนึ่งอัน = ใบหนึ่งใบ
   หน้า = ชื่อหลักจำ + ใช้ตอนไหน · หลัง = ตัวย่อทีละตัว + หมายเหตุ · ตั้ง href ตอนกดเหมือนปักตาราง */
function pitHref(o){
  var js=JSON.stringify(o);
  return POSTIT+"#t="+btoa(unescape(encodeURIComponent(js))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function mnPlain(t){return String(t==null?"":t).replace(/\*\*/g,"").replace(/`/g,"").replace(/\s+/g," ").trim();}
function mnPinHref(){
  var l=lecOf(state.lec),s=l&&secOf(l,state.sec),list=(s&&s.mnem)||[];
  if(!list.length)return POSTIT;
  var ctx=s.title||"หลักจำ",cards=[];
  list.forEach(function(x){
    var name=mnPlain(x.name);if(!name)return;
    var back=[];
    (x.lines||[]).forEach(function(r){
      var k=mnPlain(r[0]),v=String(r[1]==null?"":r[1]).replace(/\s+/g," ").trim();
      if(!k&&!v)return;
      var plain=mnPlain(v);
      if(!plain)                      back.push(k);
      else if(!k)                     back.push(v);
      else if(plain.toUpperCase().indexOf(k.toUpperCase())===0) back.push(v);
      else                            back.push(k+" — "+v);
    });
    if(x.note)back.push(mnPlain(x.note));
    if(!back.length)return;
    cards.push(["**"+name+"**\n"+(mnPlain(x.what)||ctx),back.join("\n")]);
  });
  return cards.length?pitHref({s:ctx,c:cards}):POSTIT;
}
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[data-mnpin]");if(!a)return;
  a.href=mnPinHref();
});
function tqInit(root){
  (root||document).querySelectorAll(".prose .tablewrap").forEach(function(tw,i){
    if(tw._tq)return;tw._tq=1;
    var tb=tw.querySelector("table");if(!tb||!tb.querySelector("tbody tr td:nth-child(2)"))return;
    tw._tqk=tqKey(i);
    var bar=document.createElement("div");bar.className="tqbar";tqBar(bar,false);tw.parentNode.insertBefore(bar,tw);
    var st=TQST[tw._tqk];
    if(st&&st.on){                           /* render ใหม่แล้วให้กลับมาปิดเหมือนเดิม */
      var op=st.op;tqSet(tw,true);TQST[tw._tqk]={on:1,op:op};
      tb.querySelectorAll("tbody tr").forEach(function(tr){
        Array.prototype.forEach.call(tr.children,function(td,ci){
          if(ci===0||td.tagName!=="TD")return;
          if(op[tqCell(td)]){td.classList.add("op");td.setAttribute("aria-expanded","true");}
        });
      });
    }
  });
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-tq]");
  if(b){var bar=b.closest(".tqbar"),tw=bar.nextElementSibling,act=b.getAttribute("data-tq");
    if(act==="on"||act==="re")tqSet(tw,true);
    else if(act==="off")tqSet(tw,false);
    else if(act==="all")tw.querySelectorAll("td.cv").forEach(function(td){tqOpen(td,true);});
    return;}
  var td=e.target.closest&&e.target.closest("table.tq td.cv");
  if(td)tqOpen(td,!td.classList.contains("op"));
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var td=e.target&&e.target.closest&&e.target.closest("table.tq td.cv");
  if(!td)return;

  new MutationObserver(function(){tqInit(m);}).observe(m,{childList:true,subtree:true});})();

  var wide=w>440,sty="max-width:"+Math.round(w*1.25)+"px"+(wide?";min-width:"+Math.round(w*0.74)+"px":"");
  FIGN++;

    "<button class='figq' data-figq='1' title='ปิดป้ายรายละเอียดในภาพ เหลือชื่อหลักไว้เป็นใบ้ — กดกล่องเพื่อเฉลยทีละอัน'>ปิดป้าย · ทายเอง</button></div>"+

    (f.cap?"<figcaption>"+inline(f.cap)+"</figcaption>":"")+"</figure>";

/* แยกข้อความที่คั่นด้วย " · " เป็นท่อน (ทำหลัง inline เพื่อให้ตัวหนาที่คร่อมหลายท่อนยังถูกต้อง)
   ไม่ตัดใน (วงเล็บ) · ถ้าตัวหนาคร่อมจุดตัด ปิด/เปิด <strong> ใหม่ให้แต่ละท่อน */
function splitDots(h){
  var out=[],cur="",dep=0,bold=false,i=0;
  while(i<h.length){
    if(h.substr(i,8)==="<strong>"){bold=true;cur+="<strong>";i+=8;continue;}
    if(h.substr(i,9)==="</strong>"){bold=false;cur+="</strong>";i+=9;continue;}
    var ch=h.charAt(i);
    if(ch==="(")dep++;else if(ch===")"&&dep>0)dep--;
    if(dep===0&&h.substr(i,3)===" \u00b7 "){out.push(cur+(bold?"</strong>":""));cur=bold?"<strong>":"";i+=3;continue;}
    cur+=ch;i++;
  }
  out.push(cur);
  return out.filter(function(x){return x!==""&&x!=="<strong></strong>";});
}
function md(src){
  var lines=String(src==null?"":src).split("\n"),out=[],i=0,para=[];
  function flushPara(){if(para.length){out.push("<p>"+para.map(function(x){return splitDots(inline(x)).join("<br>");}).join("<br>")+"</p>");para=[];}}
  function flushTable(){
    var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
    if(!rows.length)return;
    var cells=rows.map(function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});});
    var hasSep=cells.length>1&&cells[1].every(function(c){return /^:?-{2,}:?$/.test(c);});
    var head=cells[0],body=hasSep?cells.slice(2):cells.slice(1);
    var h="<div class='tablewrap'><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
    body.forEach(function(r){h+="<tr>"+r.map(function(c){var sg=splitDots(inline(c));return "<td>"+(sg.length>1?sg.map(function(x){return "<span class='seg'>"+x+"</span>";}).join(""):(sg[0]||""))+"</td>";}).join("")+"</tr>";});
    out.push(h+"</tbody></table></div>");
  }
  function flushList(ordered){
    var tag=ordered?"ol":"ul",items=[];
    while(i<lines.length){
      var m=ordered?lines[i].match(/^\s*\d+[.)]\s+(.*)$/):lines[i].match(/^\s*[-•]\s+(.*)$/);
      if(!m)break;
      var txt=m[1];i++;
      while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*[-•]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*\|/.test(lines[i])){txt+=" "+lines[i].trim();i++;}
      items.push("<li>"+splitDots(inline(txt)).join("<br>")+"</li>");
    }
    out.push("<"+tag+">"+items.join("")+"</"+tag+">");
  }
  while(i<lines.length){
    var L=lines[i],fm=/^\s*\[\[fig:([\w-]+)\]\]\s*$/.exec(L);
    if(fm){flushPara();out.push(figHtml(fm[1]));i++;continue;}
    var am=/^\s*\[\[anim:([\w-]+)\]\]\s*$/.exec(L);
    if(am){flushPara();out.push(animHtml(am[1]));i++;continue;}
    var im=/^\s*\[\[img:([\w-]+)\]\]\s*$/.exec(L);
    if(im){flushPara();out.push(imgHtml(im[1]));i++;continue;}
    if(/^\s*>\s?/.test(L)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      flushPara();out.push("<div class='callout'>"+md(q.join("\n"))+"</div>");continue;}
    if(/^\s*####\s+/.test(L)){flushPara();out.push("<h4>"+inline(L.replace(/^\s*####\s+/,""))+"</h4>");i++;continue;}
    if(/^\s*###\s+/.test(L)){flushPara();out.push("<h3>"+inline(L.replace(/^\s*###\s+/,""))+"</h3>");i++;continue;}
    if(/^\s*\|/.test(L)){flushPara();flushTable();continue;}
    if(/^\s*[-•]\s+/.test(L)){flushPara();flushList(false);continue;}
    if(/^\s*\d+[.)]\s+/.test(L)){flushPara();flushList(true);continue;}
    if(!L.trim()){flushPara();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();return out.join("");
}

function secStat(sec){

  sec.items.forEach(function(it){var v=state.ans[it.id];if(v!=null){a++;if(v===it.answer)ok++;}});
  return {n:n,answered:a,correct:ok,read:!!state.done[sec.id],

}

var TABS=[{k:"home",label:"ภาพรวม"},{k:"lectures",label:"คาบเรียน"},{k:"learn",label:"เรียนเนื้อหา"},{k:"meq",label:"Practice · MEQ"},{k:"osce",label:"Practice · OSCE/SAQ"},{k:"review",label:"ทบทวนข้อที่ผิด"}];
function lum(hex){
  var h=String(hex).trim().replace("#","");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h))return 0;
  var f=function(v){v=parseInt(v,16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(h.slice(0,2))+0.7152*f(h.slice(2,4))+0.0722*f(h.slice(4,6));
}
function darkNow(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark")return true; if(t==="light")return false;
  try{return window.matchMedia("(prefers-color-scheme:dark)").matches;}catch(e){return false;}
}
function applyAccent(c){
  var r0=document.documentElement.style;["--accent","--accent-soft","--accent-ink","--on-accent"].forEach(function(k){r0.removeProperty(k);});return;
  var a=c.accent||{},d=darkNow(),r=document.documentElement.style;
  var acc=d?a.dark:a.light, soft=d?a.darkSoft:a.soft, ink=d?a.darkInk:a.ink;
  if(acc)r.setProperty("--accent",acc); if(soft)r.setProperty("--accent-soft",soft);
  if(ink)r.setProperty("--accent-ink",ink);
  /* ตัวอักษรบนพื้นสีประจำระบบ — เลือกขาว/ดำตามความสว่างของสีนั้น */

}

/* ---------- render ---------- */
/* ---------- ปิดป้ายในภาพ (ทายเอง) ----------
   ปิดรายละเอียดด้วยกล่อง + ใบ้ 2 ตัวอักษรแรก (ชื่อหลักยังเห็น) · กดกล่องเพื่อเฉลยทีละอัน · ต้องทำตอนภาพแสดงอยู่ (getBBox ของที่ซ่อนได้ 0) */
var SEG=null;try{SEG=new Intl.Segmenter("th",{granularity:"grapheme"});}catch(e){}
function graphemes(s){return SEG?Array.from(SEG.segment(s),function(x){return x.segment;}):Array.from(s);}
var SVGNS="http://www.w3.org/2000/svg";
function czBox(sv,inv,el,fs){
  /* กรอบของบรรทัด (text หรือ tspan) ในพิกัดของ svg — tspan ไม่มี getBBox จึงแปลงจาก getBoundingClientRect
     ความสูงตัดให้เท่าขนาดตัวอักษร (กรอบของฟอนต์ไทยสูงเกิน จะทับบรรทัดชื่อข้างบน) */
  var R=el.getBoundingClientRect();if(R.width<1||R.height<1)return null;
  var p1=sv.createSVGPoint(),p2=sv.createSVGPoint();p1.x=R.left;p1.y=R.top;p2.x=R.right;p2.y=R.bottom;
  p1=p1.matrixTransform(inv);p2=p2.matrixTransform(inv);
  var h=Math.min(p2.y-p1.y,fs*1.05),cy=(p1.y+p2.y)/2+fs*0.04;
  return {x:p1.x,y:cy-h/2,width:p2.x-p1.x,height:h};
}
function czAdd(sv,bb,txt){
  var g=graphemes(txt),hint=g.length>2?g.slice(0,2).join("")+"…":"?";
  var cz=document.createElementNS(SVGNS,"g");cz.setAttribute("class","cz");cz.setAttribute("data-cz","1");
  cz.setAttribute("tabindex","0");cz.setAttribute("role","button");cz.setAttribute("aria-label","เฉลยป้ายนี้");
  var r=document.createElementNS(SVGNS,"rect"),p=1.5;
  r.setAttribute("x",bb.x-p);r.setAttribute("y",bb.y-p);r.setAttribute("width",bb.width+2*p);r.setAttribute("height",bb.height+2*p);r.setAttribute("rx",3);
  var ht=document.createElementNS(SVGNS,"text"),fs=Math.max(7.5,Math.min(10.5,bb.height*0.72));
  ht.setAttribute("x",bb.x+2);ht.setAttribute("y",bb.y+bb.height/2+fs*0.36);ht.setAttribute("style","font-size:"+fs+"px");
  ht.textContent=hint;cz.appendChild(r);cz.appendChild(ht);sv.appendChild(cz);
}
function coverFig(fg){
  /* ชื่อหลักให้เห็น: บรรทัดแรกของป้ายขนาดปกติ (มักเป็นชื่อในกล่อง) · ปิด: บรรทัดถัดไป + ป้ายตัวเล็ก (sm/xs — ป้ายบนลูกศร รายละเอียด) */
  var sv=fg.querySelector(".figsv svg");if(!sv)return;
  uncoverFig(fg);
  var ctm=sv.getScreenCTM();if(!ctm)return;var inv=ctm.inverse(),todo=[],all=[];
  Array.prototype.slice.call(sv.querySelectorAll("text")).forEach(function(tx){
    var small=tx.classList.contains("sm")||tx.classList.contains("xs");
    var fs=parseFloat(getComputedStyle(tx).fontSize)||12;
    var lines=Array.prototype.slice.call(tx.querySelectorAll("tspan"));if(!lines.length)lines=[tx];
    lines.forEach(function(ln,i){
      var txt=(ln.textContent||"").replace(/\s+/g," ").trim();if(!txt||/^[\d.,%\s–-]+$/.test(txt))return;  /* ตัวเลขล้วน (แกนกราฟ) ไม่ปิด */
      var bb=czBox(sv,inv,ln,fs);if(!bb)return;
      all.push([bb,txt]);if(small||i>0)todo.push([bb,txt]);
    });
  });
  if(!todo.length)todo=all.filter(function(x,i){return i%2;});   /* ภาพที่ป้ายเป็นชื่อล้วน — ปิดสลับกันครึ่งหนึ่ง */
  todo.forEach(function(x){czAdd(sv,x[0],x[1]);});
  if(todo.length){fg.classList.add("czon");var b=fg.querySelector(".figq");if(b)b.textContent="เฉลยทั้งหมด";}
}
function uncoverFig(fg){
  Array.prototype.slice.call(fg.querySelectorAll(".cz")).forEach(function(x){x.remove();});
  fg.classList.remove("czon");var b=fg.querySelector(".figq");if(b)b.textContent="ปิดป้าย · ทายเอง";
}
function autoCover(root){
  if(state.view!=="section")return;var l=lecOf(state.lec);if(!l||!lecHidden(l))return;
  Array.prototype.slice.call(root.querySelectorAll("figure.fig:not(.pimg)")).forEach(function(fg){
    if(fg.offsetParent!==null&&!fg.classList.contains("czon"))coverFig(fg);});
}
function revealCz(cz){var fg=cz.closest("figure");cz.remove();
  if(fg&&!fg.querySelector(".cz"))uncoverFig(fg);}
document.addEventListener("click",function(e){var cz=e.target.closest&&e.target.closest("[data-cz]");if(cz)revealCz(cz);});
document.addEventListener("keydown",function(e){var cz=e.target.closest&&e.target.closest("[data-cz]");
  if(cz&&(e.key==="Enter"||e.key===" ")){e.preventDefault();revealCz(cz);}});

  renderMast();renderOutline();
  var m=document.getElementById('main'),h;
  var cc=course();
  if(!cc._loaded){
    m.innerHTML=cc._err
      ? "<section class='card'><h2>โหลดชุด "+esc(cc.label)+" ไม่สำเร็จ</h2><p class='lede'>"+esc(cc._err)+"</p></section>"
      : "<section class='card'><p class='lede'>กำลังโหลดเนื้อหา "+esc(cc.label)+" …</p></section>";
    return;
  }
  if(state.view==="section")h=viewSection();
  else if(state.view==="meq")h=viewPractice("meq");
  else if(state.view==="osce")h=viewPractice("osce");
  else if(state.view==="review")h=viewReview();

  else if(state.view==="lecture")h=viewLecture();
  else if(state.view==="learn"){h=viewHome();}
  else h=viewHome();

  autoCover(m);
  save();
}

var Pres=(function(){

  function pickAll(){try{return JSON.parse(localStorage.getItem(PPKEY)||"{}")||{};}catch(e){return {};}}

    for(var i=0;i<lines.length;i++){var m=/^\s*\[\[(fig|anim|img):([\w-]+)\]\]\s*$/.exec(lines[i]);if(m)return {t:m[1],k:m[2]};}

  function build(l){
    var off=P.off||{},secs=l.sections.filter(function(s){return !off[s.id];});

      var sum=String(s.summary||"").split(/\s·\s/).map(function(x){return x.trim();}).filter(Boolean);
      S.push({type:"sec",s:s,si:si,n:n,kw:sum.slice(0,10),more:Math.max(0,sum.length-10),key:s.id+"#sec"});
      blocks(s).forEach(function(b,bi){
        if(off[s.id+"#"+bi])return;
        var kw=keywords(b.lines),vis=visual(b.lines);
        if(!kw.length&&!vis&&!b.title)return;
        S.push({type:"blk",s:s,si:si,n:n,b:b,kw:kw.slice(0,10),more:Math.max(0,kw.length-10),vis:vis,key:s.id+"#"+bi});
      });
      S.push({type:"end",s:s,si:si,n:n,key:s.id+"#end"});

      if(any){w[s.id]=1;w._n++;}

  }

        (l.objectives&&l.objectives.length?"<h2 class='pv-sub'>จบแล้วคนฟังต้องทำได้</h2><ol class='pv-list'>"+l.objectives.map(function(o){return "<li>"+inline(o)+"</li>";}).join("")+"</ol>":"")+

        pickHtml();
      return h;
    }
    if(x.type==="fin"){

        "<ul class='pv-stats'><li>✓ อธิบายได้ "+R.c.ok+"</li><li>~ ติดบางจุด "+R.c.part+"</li><li>✗ ยังไม่ได้ "+R.c.no+"</li><li>ยังไม่ประเมิน "+R.c.none+"</li><li>ใช้เวลา "+mins+" นาที</li></ul>";

      }else h+="<p class='pv-ask' style='margin-top:16px'>"+(R.c.none?"ยังมีสไลด์ที่ไม่ได้ประเมิน ย้อนกลับไปให้คะแนนเพื่อดูว่าติดตรงไหน":"อธิบายได้ทุกสไลด์ — คาบนี้พร้อมสอนคนอื่นแล้ว")+"</p>"+

    }

      return "<p class='pv-eye'>"+eye+" · ปิดหัวข้อ</p><h2 class='pv-h2'>"+esc(x.s.title)+"</h2>"+

  function show(i){
    if(!P.el)return;
    P.i=Math.max(0,Math.min(P.S.length-1,i));posSet(P.i);
    var x=P.S[P.i];
    FIGS=(x.s&&x.s.figs)||{};ANIMS=(x.s&&x.s.anims)||{};IMGS=(x.s&&x.s.imgs)||{};FIGN=0;ANIMN=0;
    var stage=P.el.querySelector(".pv-stage");
    stage.innerHTML="<div class='pv-slide'>"+slideHtml(x)+"</div>";
    FIGS={};ANIMS={};IMGS={};
    stage.scrollTop=0;
    animInit(stage);
    stage.querySelectorAll(".pv-vis figure.fig:not(.pimg):not(.anim):not(.a3d)").forEach(function(fg){coverFig(fg);});
    P.el.querySelector(".pv-prog i").style.width=Math.round(P.i*100/(P.S.length-1))+"%";
    P.el.querySelector(".pv-count").textContent=(P.i+1)+" / "+P.S.length;
    P.el.querySelector("[data-pv='prev']").disabled=P.i===0;
    var nx=P.el.querySelector("[data-pv='next']"),last=P.i===P.S.length-1;nx.disabled=last;nx.classList.toggle("primary",!last);
    nx.textContent=P.i===P.S.length-2?"สรุป →":"ถัดไป →";
    var nb=P.el.querySelector("[data-pv='notes']");nb.setAttribute("aria-pressed",P.notes?"true":"false");nb.textContent=P.notes?"ซ่อนโน้ต":"โน้ต";
    var sel=P.el.querySelector("select"),si=x.s?x.si:-1;sel.value=String(si);
    P.el.querySelector(".pv-bot .sp").textContent=x.s?label(x):(x.type==="cover"?"ปก":"สรุป");
  }
  function clock(){
    var el=P.el&&P.el.querySelector(".pv-time");if(!el)return;
    var s=Math.floor((Date.now()-P.t0)/1000);el.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2);
  }
  function close(){
    if(!P.el)return;
    clearInterval(P.tick);P.tick=null;P.el.remove();P.el=null;
    document.documentElement.style.overflow="";
    if(P.back&&P.back.focus)try{P.back.focus();}catch(e){}
  }
  function open(lecId,secId,from){
    var l=lecOf(lecId);if(!l||!l.sections.length)return;
    P.lec=l;P.off=pickGet();P.pickOpen=false;
    if(secId&&P.off[secId]){delete P.off[secId];pickSet(P.off);}   /* กดพรีเซนต์จากหัวข้อที่ไม่ได้เลือกไว้ → ใส่หัวข้อนั้นกลับ */
    P.S=build(l);P.notes=false;P.t0=Date.now();P.back=from||null;
    var el=document.createElement("div");el.className="pv";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
    el.setAttribute("aria-label","โหมดพรีเซนต์ คาบ "+l.lec);el.tabIndex=-1;
    el.innerHTML="<div class='pv-top'><button class='btn' data-pv='close' aria-label='ออกจากโหมดพรีเซนต์'>✕ ออก</button>"+
      "<select aria-label='ไปที่หัวข้อ'></select>"+
      "<button class='btn' data-pv='notes' aria-pressed='false'>โน้ต</button>"+
      "<span class='pv-meta'><span class='pv-count'></span><span class='pv-time'>0:00</span></span></div>"+
      "<div class='pv-prog'><i></i></div><div class='pv-stage' aria-live='polite'></div>"+
      "<div class='pv-bot'><button class='btn' data-pv='prev'>← ก่อนหน้า</button><span class='sp'></span><button class='btn primary' data-pv='next'>ถัดไป →</button></div>";
    document.documentElement.appendChild(el);P.el=el;fillSel();
    document.documentElement.style.overflow="hidden";
    el.querySelector("select").addEventListener("change",function(e){
      var v=+e.target.value;
      if(v<0){show(0);return;}
      for(var i=0;i<P.S.length;i++)if(P.S[i].type==="sec"&&P.S[i].si===v){show(i);return;}
    });
    var tx=0,ty=0,ok=false,stage=el.querySelector(".pv-stage");
    stage.addEventListener("touchstart",function(e){var t=e.touches[0];ok=!(e.target.closest&&e.target.closest(".figsv,.tablewrap,.pv-notes,.pv-pick"));tx=t.clientX;ty=t.clientY;},{passive:true});
    stage.addEventListener("touchend",function(e){if(!ok)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
      if(Math.abs(dx)>60&&Math.abs(dy)<45)show(P.i+(dx<0?1:-1));},{passive:true});
    P.tick=setInterval(clock,1000);
    var start=0;
    if(secId)for(var i=0;i<P.S.length;i++)if(P.S[i].type==="sec"&&P.S[i].s.id===secId){start=i;break;}
    show(start);el.focus();
  }
  document.addEventListener("click",function(e){
    if(!P.el)return;
    var b=e.target.closest&&e.target.closest(".pv button");if(!b)return;
    var a=b.getAttribute("data-pv");
    if(a==="close"){close();return;}
    if(a==="prev"){show(P.i-1);return;}
    if(a==="next"){show(P.i+1);return;}
    if(a==="notes"){P.notes=!P.notes;var y=P.el.querySelector(".pv-stage").scrollTop;show(P.i);if(P.notes){var n=P.el.querySelector(".pv-notes");if(n)n.scrollIntoView({block:"nearest"});}else P.el.querySelector(".pv-stage").scrollTop=y;return;}
    if(b.hasAttribute("data-pvgo")){show(+b.getAttribute("data-pvgo"));return;}
    var pk=b.getAttribute("data-pvpk");if(pk){pickAct(pk);return;}
    var r=b.getAttribute("data-pvr");
    if(r){var x=P.S[P.i],k=rk(x.key);
      if(state.rate[k]===r)delete state.rate[k];else state.rate[k]=r;
      save();
      if(state.rate[k]==="ok"&&P.i<P.S.length-1)show(P.i+1);else{var y2=P.el.querySelector(".pv-stage").scrollTop;show(P.i);P.el.querySelector(".pv-stage").scrollTop=y2;}
    }
  });
  document.addEventListener("change",function(e){
    if(!P.el)return;var c=e.target;if(!c||!c.hasAttribute||!c.hasAttribute("data-pvck"))return;
    var k=c.getAttribute("data-pvck"),on=c.checked,off=P.off||{},h=k.indexOf("#");
    if(h<0){if(on)delete off[k];else off[k]=1;
      var s=P.lec.sections.filter(function(x){return x.id===k;})[0];
      if(s)blocks(s).forEach(function(b,bi){delete off[k+"#"+bi];});}
    else{if(on){delete off[k];delete off[k.slice(0,h)];}else off[k]=1;}
    P.off=off;repick();
    var again=P.el.querySelector("[data-pvck='"+k.replace(/'/g,"")+"']");if(again)try{again.focus({preventScroll:true});}catch(_){}
  });
  document.addEventListener("keydown",function(e){
    if(!P.el)return;
    var tg=e.target&&e.target.tagName;
    if(tg==="SELECT"||tg==="TEXTAREA"||tg==="INPUT")return;
    if(e.key==="Escape"){e.preventDefault();close();return;}
    if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();show(P.i+1);return;}
    if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(P.i-1);return;}
    if((e.key==="n"||e.key==="N")&&!e.metaKey&&!e.ctrlKey){e.preventDefault();P.el.querySelector("[data-pv='notes']").click();}
  });
  return {open:open,close:close};
})();

    if(DESK.matches)renderSide();
    renderDock();
    fzApply();paneApply();
  }

})();
