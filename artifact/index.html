<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MED421 learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#eef3f0; --surface:#ffffff; --surface-sunk:#e3ebe6;
  --ink:#0d1712; --ink-2:#3d4c44; --ink-3:#6d7f75;
  --rule:#d8e2dc; --rule-strong:#bccbc3;
  --accent:#8c1d2f; --accent-soft:#f6e9eb; --accent-ink:#6e1624; --on-accent:#ffffff;
  --ok:#0f7a4a; --ok-soft:#dff0e6; --miss:#9a5f08; --miss-soft:#f8efdc;
  --bad:#a3271f; --bad-soft:#f8e9e7;
  --focus:#1f6feb;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(13,23,18,.05),0 12px 28px -20px rgba(13,23,18,.3);
  --sans:"IBM Plex Sans Thai","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"IBM Plex Sans Thai","Helvetica Neue",Arial,sans-serif;
  --e:cubic-bezier(.22,.9,.28,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#090d0b; --surface:#111915; --surface-sunk:#18221d;
    --ink:#e7f0ea; --ink-2:#a5b8ac; --ink-3:#788c80;
    --rule:#1d2922; --rule-strong:#2a3830;
    --accent:#ff8fa3; --accent-soft:#24151a; --accent-ink:#ffb3c0; --on-accent:#08110c;
    --ok:#5fe3a1; --ok-soft:#0f2419; --miss:#e8bb63; --miss-soft:#241f10;
    --bad:#e8877c; --bad-soft:#2a1715;
    --focus:#7fb4ff;
    --shadow:0 1px 2px rgba(0,0,0,.6),0 18px 40px -28px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --paper:#090d0b; --surface:#111915; --surface-sunk:#18221d;
  --ink:#e7f0ea; --ink-2:#a5b8ac; --ink-3:#788c80;
  --rule:#1d2922; --rule-strong:#2a3830;
  --accent:#ff8fa3; --accent-soft:#24151a; --accent-ink:#ffb3c0; --on-accent:#08110c;
  --ok:#5fe3a1; --ok-soft:#0f2419; --miss:#e8bb63; --miss-soft:#241f10;
  --bad:#e8877c; --bad-soft:#2a1715;
  --focus:#7fb4ff;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 18px 40px -28px rgba(0,0,0,1);
}
@keyframes rise{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.rise{animation:rise .32s var(--e) both}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.64;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.wrap{max-width:1220px;margin:0 auto;padding-inline:16px}
@media (min-width:640px){.wrap{padding-inline:22px}}

/* ---------- masthead ---------- */
.mast{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.mast .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--sans);font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-size:12.5px}
.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-3);background:var(--surface);
     border:1px solid var(--rule);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap;
     transition:color .22s var(--e),background .22s var(--e),border-color .22s var(--e),transform .22s var(--e)}
.btn:hover{border-color:var(--rule-strong);color:var(--ink);background:var(--surface-sunk)}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-style:dashed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.lsync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 11px;white-space:nowrap}
.lsync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.lsync.cloud i{background:var(--ok)} .lsync.busy i{background:var(--miss)}
.bar{width:110px;height:7px;border-radius:999px;background:var(--surface-sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s var(--e)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;padding-block:22px 60px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:14px}}
aside{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto}
@media (max-width:900px){aside{position:static;max-height:none;order:2}main{order:1}}
/* ปุ่มซ่อนแถบเมนู — พับเหลือแถวเดียว (จำไว้ในเครื่องนี้) */
.mast.min #courseTabs,.mast.min #tabs,.mast.min #ring,.mast.min #lsync,.mast.min #themeBtn{display:none}
.mast.min .wrap{padding-block:8px}
#mastBtn{padding:6px 13px}
/* ปุ่มอยู่แถวเดียวกับชื่อเรื่องทุกความกว้าง ไม่ให้กินแถวเพิ่มบนจอกว้าง */
.brand{order:-2;flex:1 1 0}#mastBtn{order:-1}.brand b{white-space:nowrap}.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.mast .wrap{gap:8px}.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;padding-bottom:2px}.ring{order:3}.brand b{font-size:16px}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.outline{padding:12px 12px 14px}
.outline h4{font-size:12px;font-family:var(--sans);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:10px 6px 6px}
.olec{margin-bottom:6px}
.olec>button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;font:inherit;font-weight:600;font-size:13.5px;
  color:var(--ink);background:transparent;border:0;border-radius:var(--r-sm);padding:8px;cursor:pointer;
  transition:background .2s var(--e),color .2s var(--e)}
.olec>button:hover{background:var(--surface-sunk)}
.olec>button.on{background:var(--accent-soft);color:var(--accent-ink)}
.olec .num{font:600 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--rule-strong);border-radius:5px;padding:3px 4px}
.osec{list-style:none;margin:2px 0 8px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.osec li button{display:flex;gap:7px;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--ink-2);
  background:transparent;border:0;border-radius:9px;padding:6px 8px;cursor:pointer;
  transition:background .2s var(--e),color .2s var(--e)}
.osec li button:hover{background:var(--surface-sunk);color:var(--ink)}
.osec li button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tick{flex:0 0 15px;height:15px;margin-top:3px;border-radius:50%;border:1.5px solid var(--rule-strong);font:700 9px/13px var(--sans);text-align:center;color:transparent}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.tick.part{border-color:var(--miss);background:var(--miss-soft);color:var(--miss)}

/* ---------- content ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card[id]{scroll-margin-top:84px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:24px 26px;animation:rise .32s var(--e) both}
@media (max-width:560px){.card{padding:18px 16px;border-radius:var(--r-md)}}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.card h2{font-size:clamp(22px,4.4vw,27px);margin:7px 0 5px;line-height:1.24}
.card h3{font-size:18px;margin:22px 0 6px}
.lede{color:var(--ink-2);font-size:14.5px}
.prose{font-size:15.5px}
.prose p{margin:11px 0}
.prose ul,.prose ol{margin:9px 0;padding-left:22px}
.prose li{margin:4px 0}
.prose strong{color:var(--ink);font-weight:600}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-sunk);padding:1px 5px;border-radius:5px}
.prose h4{font-size:15.5px;font-family:var(--sans);font-weight:700;margin:18px 0 4px;color:var(--accent-ink)}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:13.6px;min-width:460px}
th,td{border-bottom:1px solid var(--rule);padding:8px 11px;text-align:left;vertical-align:top}
/* " · " ในเนื้อหา = ขึ้นบรรทัดใหม่ (ผู้ใช้ขอ 16 ต.ค.) · ในตารางแต่ละท่อนเป็นบรรทัดของตัวเอง เว้นระยะนิดหนึ่ง */
td .seg{display:block}td .seg+.seg{margin-top:5px}
/* โหมดทวน: ซ่อนเนื้อหาทั้งคาบ เหลือหัวข้อ กดเปิดทีละส่วน (ผู้ใช้ขอ 16 ต.ค.) */
.rvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.rv{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:15.5px;font-weight:700;color:var(--ink);background:var(--surface-sunk);border:1px solid var(--rule);border-radius:var(--r-sm);padding:11px 14px;margin-top:8px;cursor:pointer;transition:border-color .2s var(--e),background .2s var(--e)}
.rv:hover{border-color:var(--accent)}.rv[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rv .ar{flex:0 0 12px;color:var(--ink-3);font-size:12px}.rv.h4{margin-left:18px;width:calc(100% - 18px);font-size:14.6px;font-weight:600}
.rvb{padding:2px 4px 6px 16px;border-left:2px solid var(--accent-soft);margin:4px 0 10px 8px}.rv.h4+.rvb{margin-left:26px}
.chip.rvon{border-color:var(--miss);color:var(--miss);background:var(--miss-soft)}
th{background:var(--surface-sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.callout{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:13px 16px;margin:16px 0;font-size:14.5px}
.callout b{color:var(--accent-ink)}
.pearls{margin:18px 0 0;padding:15px 17px;border:1px dashed var(--rule-strong);border-radius:var(--r-md);background:var(--surface-sunk)}
.pearls h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans)}
.pearls ul{margin:0;padding-left:20px;font-size:14.4px}
.nlbox .gp2{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:1px 5px;white-space:nowrap}
.nlbox .gp3{font-size:11px;font-weight:600;color:var(--miss);background:var(--miss-soft);border-radius:4px;padding:1px 5px;white-space:nowrap}
.nlbox{margin:16px 0 0;border:1px solid var(--rule);border-left:4px solid var(--ok);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--surface-sunk);padding:14px 16px}
.nlbox h4{margin:0 0 8px;font-size:13.5px;font-family:var(--sans);font-weight:700;color:var(--ink);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.nlbox h4 .tick2{color:var(--ok);font-weight:700}
.nlbox h4.gl{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule-strong);color:var(--miss)}
.nlbox ul{margin:0;padding-left:0;list-style:none;display:grid;gap:5px}
.nlbox li{font-size:13.4px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nlbox li code{font-family:var(--mono);font-size:11.8px;background:var(--surface);border:1px solid var(--rule-strong);border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap}
.nlbox li .src{font-size:11.6px;color:var(--ink-3)}
.nlbox .note{margin:0 0 8px;font-size:13.4px;color:var(--ink-2)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:12.3px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--rule-strong);border-radius:999px;padding:2px 9px;font-size:11.8px;color:var(--ink-3);background:var(--surface)}
.chip.nl{border-style:dashed}
.chip.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

/* ---------- quiz ---------- */
.quiz{border-top:2px solid var(--accent);margin-top:28px;padding-top:20px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qhead h3{margin:0;font-size:19px}
.q{border:1px solid var(--rule);border-radius:var(--r-md);padding:17px 18px;margin-top:14px;background:var(--surface)}
.q .qid{font:600 11px/1 var(--mono);color:var(--ink-3)}
.stem{margin:7px 0 12px;font-size:15.2px}
.choices{display:flex;flex-direction:column;gap:7px}
.ch{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.6px;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-sm);padding:10px 13px;color:var(--ink);
  transition:border-color .2s var(--e),background .2s var(--e),transform .2s var(--e)}
.ch:active:not(:disabled){transform:scale(.995)}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch:disabled{cursor:default}
.ch .k{font:700 13px/1.5 var(--mono);color:var(--ink-3);flex:0 0 16px}
.ch.correct{border-color:var(--ok);background:var(--ok-soft);animation:pop .3s var(--e)}
.ch.correct .k{color:var(--ok)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.wrong .k{color:var(--bad)}
.verdict{margin-top:12px;font-weight:600;font-size:14.4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.explain{margin-top:8px;border-top:1px dashed var(--rule);padding-top:10px;font-size:14.6px}
.pearl{margin-top:10px;background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 14px;font-size:14.3px}
.pearl b{color:var(--accent-ink)}
.scorebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:13px 15px;
  border-radius:var(--r-md);background:var(--surface-sunk);font-size:14px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.nav .btn{white-space:normal;text-align:left;max-width:100%}

/* ---------- practice ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin-top:14px}
.tile{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:15px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;
  transition:border-color .22s var(--e),transform .22s var(--e)}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;margin-top:16px}
.ltile{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-md);
  padding:14px 15px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;
  transition:border-color .22s var(--e),transform .22s var(--e)}
.ltile:hover{border-color:var(--accent);transform:translateY(-2px)}
.ltile .lnum{font:600 11.5px/1.3 var(--mono);color:var(--accent-ink);letter-spacing:.02em}
.ltile b{font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.ltile .lsub{font-size:12.8px;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ltile .lprog{display:flex;align-items:center;gap:8px;font-size:12.3px;color:var(--ink-2);margin-top:2px}
.ltile .lprog .bar{width:90px;flex:none}
.ltile .lchips{display:flex;flex-wrap:wrap;gap:5px}
.lnav{align-items:center}
.tile b{font-size:14.8px;font-weight:700;letter-spacing:-.01em}
.tile span{font-size:12.6px;color:var(--ink-3)}
.vignette{font-size:14.6px;background:var(--surface-sunk);border-radius:var(--r-md);padding:15px 17px;margin:12px 0 4px}
.vignette.prose p:first-child{margin-top:0}.vignette.prose p:last-child{margin-bottom:0}.vignette .tablewrap{background:var(--surface)}
textarea{width:100%;min-height:104px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:var(--r-md);padding:11px 13px;resize:vertical}
.selfrate{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.timer{font:600 15px/1 var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:6px 12px}
.hr{height:1px;background:var(--rule);margin:18px 0}
footer{color:var(--ink-3);font-size:12.4px;padding:26px 0 40px;text-align:center}
.hide{display:none!important}
/* ---------- figures (แผนภาพ SVG ในบทเรียน · [[fig:key]] ใน md + section.figs) ---------- */
.fig{margin:20px 0;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--surface);padding:12px 14px 12px}
.fig .figt{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent-ink);margin:0 0 8px}
.fig .figt span{color:var(--ink-3);font-weight:600;margin-right:6px}
/* ปิดป้ายในภาพให้ทายเอง (ผู้ใช้ขอ 25 ต.ค.) — ชื่อหลักยังเห็น รายละเอียดถูกปิด โชว์ตัวอักษรแรกเป็นใบ้ */
.fig .figt.q{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.fig .figt.q .tt{flex:1 1 200px;min-width:0}
.fig .figt.q .tt span{color:var(--ink-3);font-weight:600;margin-right:6px}
.figq{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--ink-2);background:var(--surface);border:1px dashed var(--rule-strong);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.figq:hover{border-color:var(--accent);color:var(--accent-ink)}.fig.czon .figq{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.fig svg .cz{cursor:pointer}.fig svg .cz rect{fill:var(--surface-sunk);stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2}
.fig svg .cz:hover rect,.fig svg .cz:focus rect{fill:var(--accent-soft)}.fig svg .cz:focus{outline:none}
.fig svg .cz text{fill:var(--ink-3);font-weight:600}
.fig.czon figcaption{display:none}  /* คำอธิบายใต้ภาพเฉลยกลไก — ซ่อนจนกว่าจะเฉลยทั้งหมด */
.fig .figsv{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig .figin{margin:0 auto}
.fig svg{display:block;width:100%;height:auto;color:var(--ink);font-family:var(--sans)}

<script>
(function(){
"use strict";
var COURSES=[];
var NL={};
function ensure(set){
  var c=COURSES.filter(function(x){return x.set===set;})[0];
  if(!c||c._loaded)return Promise.resolve();
  if(!c._p)c._p=fetch(c.file,{cache:"no-cache"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(ls){c.lectures=ls;c._loaded=true;})
    .catch(function(e){c.lectures=[];c._loaded=true;c._err=String(e);});
  return c._p;
}
/* ---------- ลิงก์ตรงจาก Lecture Dashboard: #<ชุด> หรือ #<ชุด>-<คาบ> ----------
   เลขคาบที่มี / ใช้ . แทน (เช่น #gi-27.10 = คาบ 27/10 ของชุด GI) */
function slug(x){return String(x==null?"":x).replace(/[^A-Za-z0-9._~-]/g,".");}
var pendingLec=null;
function readHash(){
  var h=String(location.hash||"").replace(/^#/,"");
  if(!h)return false;
  var i=h.indexOf("-"),set=i<0?h:h.slice(0,i),lec=i<0?"":h.slice(i+1);
  if(!COURSES.some(function(c){return c.set===set;}))return false;
  state.course=set;state.view="home";state.sec=null;state.pid=null;state.lec=null;
  pendingLec=lec||null;
  return true;
}
function landHash(){
  if(!pendingLec)return;
  var want=pendingLec;pendingLec=null;
  var hit=lectures().filter(function(l){return slug(l.lec)===want;})[0];
  if(!hit)return;
  state.view="lecture";state.lec=hit.lec;render();window.scrollTo({top:0});
}
window.addEventListener("hashchange",function(){
  if(!COURSES.length||!readHash())return;
  render();window.scrollTo({top:0});
  ensure(state.course).then(function(){render();landHash();});
});
function boot(){
  Promise.all([
    fetch("data/index.json",{cache:"no-cache"}).then(function(r){return r.json();}),
    fetch("data/nl.json",{cache:"no-cache"}).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){
    NL=res[1];
    COURSES=res[0].map(function(meta){
      var c={};for(var k in meta)c[k]=meta[k];
      c.lectures=[];c._loaded=false;return c;
    });
    if(!COURSES.length)throw new Error("ไม่มีชุดวิชาใน data/index.json");
    if(!state.course||!COURSES.some(function(c){return c.set===state.course;}))state.course=COURSES[0].set;
    readHash();
    return ensure(state.course);
  }).then(function(){render();landHash();}).catch(function(e){
    document.getElementById("main").innerHTML=
      "<section class='card'><h2>โหลดเนื้อหาไม่สำเร็จ</h2><p class='lede'>"+
      String(e&&e.message||e)+"</p></section>";
  });
}

var KEY="med421-learn-v1";
var state={course:"",view:"home",lec:null,sec:null,pid:null,
           done:{},ans:{},notes:{},rate:{},theme:"",hide:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&typeof s==="object"){
  for(var k in state) if(k in s) state[k]=s[k];}}}catch(e){}
if(state.theme)document.documentElement.setAttribute("data-theme",state.theme);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}if(typeof syncCheck==="function")syncCheck();}
/* ---------- บันทึกความคืบหน้าในบัญชี (capability db + user) ----------
   data/users/<id>/learn = {done, ans, rate} · data/users/<id>/learn-notes = {notes}
   SYNC.sent = สิ่งที่อยู่ในบัญชีล่าสุดที่รู้ · meta.cloud = เครื่องนี้เคยซิงก์แล้ว · meta.pend = มีของในเครื่องที่ยังไม่ได้อัปโหลด */
var MKEY=KEY+":sync";
var SYNC={mode:"local",refs:null,uid:"",busy:{p:0,n:0},timer:null,first:{p:1,n:1},sent:{p:"",n:""},err:"",later:false,meta:{cloud:false,pend:false,uid:""}};
try{var mm=JSON.parse(localStorage.getItem(MKEY)||"{}");SYNC.meta.cloud=!!mm.cloud;SYNC.meta.pend=!!mm.pend;SYNC.meta.uid=typeof mm.uid==="string"?mm.uid:"";}catch(e){}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(SYNC.meta));}catch(e){}}
function trueKeys(o){var r={};if(o&&typeof o==="object")Object.keys(o).sort().forEach(function(k){if(o[k]===true)r[k]=true;});return r;}
function pick(o,ok){var r={};if(o&&typeof o==="object")Object.keys(o).sort().forEach(function(k){if(ok(o[k]))r[k]=o[k];});return r;}
function normP(o){o=o||{};return {done:trueKeys(o.done),ans:pick(o.ans,function(v){return typeof v==="number"&&v>=0&&v<10&&v===Math.floor(v);}),
  rate:pick(o.rate,function(v){return typeof v==="string"&&v.length<40;})};}
function normN(o){o=o||{};return {notes:pick(o.notes,function(v){return v===true||(typeof v==="string"&&v.length>0);})};}
function cur(k){return JSON.stringify(k==="p"?normP(state):normN(state));}
SYNC.sent.p=cur("p");SYNC.sent.n=cur("n");
function syncCheck(){
  if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n)return;
  if(!SYNC.meta.pend){SYNC.meta.pend=true;saveMeta();}
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,700);
}
function flush(){
  SYNC.timer=null;
  if(SYNC.mode!=="cloud"||!SYNC.refs)return;
  ["p","n"].forEach(function(k){
    var c=cur(k);if(c===SYNC.sent[k]||SYNC.busy[k])return;
    if(c.length>240000){SYNC.err="โน้ตยาวเกินที่บัญชีเก็บได้ ส่วนนี้บันทึกในเครื่องนี้";renderSync();return;}
    SYNC.busy[k]=1;renderSync();
    var body=JSON.parse(c);body.v=1;body.updatedAt=new Date().toISOString();
    SYNC.refs[k].set(body).then(function(){
      SYNC.busy[k]=0;SYNC.sent[k]=c;SYNC.err="";
      if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n){SYNC.meta.pend=false;SYNC.meta.cloud=true;SYNC.meta.uid=SYNC.uid;saveMeta();}
      else{clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,300);}
      renderSync();
    },function(e){
      SYNC.busy[k]=0;var code=e&&e.code;
      if(code==="unavailable"||code==="resource_exhausted"){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,2500+Math.random()*2000);}
      else if(code==="revoked"){SYNC.mode="local";}
      else SYNC.err="บันทึกขึ้นบัญชีไม่ได้ ตอนนี้เก็บในเครื่องนี้";
      renderSync();
    });
  });
}
function adopt(k,data){
  if(k==="p"){var p=normP(data);state.done=p.done;state.ans=p.ans;state.rate=p.rate;}
  else state.notes=normN(data).notes;
}
function merge(k,data){
  if(k==="p"){var c=normP(data),l=normP(state);
    state.done=Object.assign({},c.done,l.done);state.ans=Object.assign({},l.ans,c.ans);state.rate=Object.assign({},c.rate,l.rate);}
  else state.notes=Object.assign({},normN(data).notes,normN(state).notes);
}
function rerender(){
  /* อย่ารีเรนเดอร์ทับช่องที่กำลังพิมพ์ */
  var a=document.activeElement;
  if(a&&a.tagName==="TEXTAREA"){SYNC.later=true;return;}
  if(COURSES.length&&course()._loaded)render();else save();
}
document.addEventListener("focusout",function(e){if(SYNC.later&&e.target&&e.target.tagName==="TEXTAREA"){SYNC.later=false;setTimeout(rerender,0);}});
function onSnap(k,snap){
  var data=snap.exists?snap.data():null;
  if(SYNC.first[k]){
    SYNC.first[k]=0;
    /* เบราว์เซอร์นี้เคยซิงก์กับบัญชีอื่น → ไม่เอาของในเครื่องไปปนกับบัญชีนี้ */
    var other=!!(SYNC.meta.uid&&SYNC.meta.uid!==SYNC.uid);
    if(!data){SYNC.sent[k]="";if(other)adopt(k,{});}
    else{
      SYNC.sent[k]=JSON.stringify(k==="p"?normP(data):normN(data));
      if(other||(SYNC.meta.cloud&&!SYNC.meta.pend))adopt(k,data);else merge(k,data);
    }
    if(!SYNC.first.p&&!SYNC.first.n){
      SYNC.mode="cloud";SYNC.meta.uid=SYNC.uid;
      if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n){SYNC.meta.pend=false;SYNC.meta.cloud=true;}
      saveMeta();flush();
    }
    rerender();renderSync();return;
  }
  if(SYNC.busy[k]||SYNC.timer||snap.metadata&&snap.metadata.hasPendingWrites)return;
  var c=data?JSON.stringify(k==="p"?normP(data):normN(data)):"";
  if(!data||c===cur(k))return;
  SYNC.sent[k]=c;adopt(k,data);rerender();
}
function renderSync(){
  var el=document.getElementById("lsync");if(!el)return;
  var busy=SYNC.busy.p||SYNC.busy.n;
  el.className="lsync"+(SYNC.mode==="cloud"&&!SYNC.err?(busy?" busy":" cloud"):"");
  el.lastChild.textContent=SYNC.err||(SYNC.mode==="cloud"?(busy?"กำลังบันทึก…":"บันทึกในบัญชี"):"บันทึกในเครื่องนี้");
  el.title=SYNC.mode==="cloud"?"ความคืบหน้าบันทึกในบัญชีของคุณ เปิดเครื่องไหนก็เห็นเหมือนกัน":"ยังไม่ได้เชื่อมบัญชี ความคืบหน้าเก็บในเบราว์เซอร์เครื่องนี้";
}
(function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return;
      SYNC.uid=uid;var base="data/users/"+uid+"/";
      SYNC.refs={p:db.doc(base+"learn"),n:db.doc(base+"learn-notes")};
      ["p","n"].forEach(function(k){
        SYNC.refs[k].onSnapshot(function(snap){onSnap(k,snap);},function(e){
          if(e&&e.code==="revoked"){SYNC.mode="local";renderSync();}
        });
      });
    });
  }).catch(function(){});

/* ---------- ปิดตารางเพื่อทวน ---------- */
/* TQST จำว่าตารางไหนกำลังปิดอยู่และเปิดช่องไหนไปแล้ว เพื่อให้ไม่หายตอน render ใหม่
   (เช่น ตอบข้อสอบท้ายหัวข้อ) · อยู่ในหน่วยความจำรอบนี้เท่านั้น ไม่ปนกับ state ที่ซิงก์ขึ้นบัญชี */
var TQST={};
function tqKey(i){return (state.sec||state.view||"x")+":"+i;}
function tqCell(td){
  var tr=td.parentNode,tb=tr.parentNode;
  return [].indexOf.call(tb.children,tr)+":"+[].indexOf.call(tr.children,td);
}
function tqRec(td,open){
  var tw=td.closest(".tablewrap");if(!tw||!tw._tqk)return;
  var st=TQST[tw._tqk];if(!st)return;
  if(open)st.op[tqCell(td)]=1;else delete st.op[tqCell(td)];
}
function tqOpen(td,open){                     /* เปิด/ปิดช่องเดียว พร้อมบอก screen reader */
  td.classList.toggle("op",open);
  td.setAttribute("aria-expanded",open?"true":"false");
  tqRec(td,open);
}
var TQSEG=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"grapheme"}):null;
function tqHint(t){
  t=String(t||"");
  var segs=t.split(/\s·\s|\n/).filter(function(x){return x.trim();}).length;
  t=t.replace(/\s+/g," ").trim();
  if(!t)return "";
  var core=t.replace(/[↑↓↔≈=<>≥≤+\-–—()*.,:;\/\s]/g,"");
  if(core.length<=2)return "?";
  var g=TQSEG?Array.from(TQSEG.segment(t),function(x){return x.segment;}):Array.from(t);
  var head=g.slice(0,2).join("").trim();
  return head+"…"+(segs>1?" ("+segs+")":"");
}
function tqSet(tw,on){
  var tb=tw.querySelector("table");if(!tb)return;
  tb.classList.toggle("tq",on);
  tb.querySelectorAll("tbody tr").forEach(function(tr){
    Array.prototype.forEach.call(tr.children,function(td,i){
      if(i===0||td.tagName!=="TD")return;
      if(on){
        if(!td.hasAttribute("data-hint"))td.setAttribute("data-hint",tqHint(td.innerText));
        td.classList.add("cv");td.classList.remove("op");
        td.tabIndex=0;td.setAttribute("role","button");
        td.setAttribute("aria-expanded","false");
        td.setAttribute("aria-label","ช่องที่ปิดไว้ คำใบ้ "+td.getAttribute("data-hint")+" · กดเพื่อเปิดดูคำตอบ");
      } else {
        td.classList.remove("cv","op");
        td.removeAttribute("tabindex");td.removeAttribute("role");
        td.removeAttribute("aria-expanded");td.removeAttribute("aria-label");
      }
    });
  });
  var bar=tw.previousElementSibling;if(bar&&bar.classList.contains("tqbar"))tqBar(bar,on);
  if(tw._tqk){if(on)TQST[tw._tqk]={on:1,op:{}};else delete TQST[tw._tqk];}
}
function tqBar(bar,on){
  bar.innerHTML=on?"<button class='btn' data-tq='all'>เปิดทั้งหมด</button><button class='btn' data-tq='re'>ปิดใหม่</button><button class='btn' data-tq='off'>เลิกทวน</button><span class='tqn'>แตะช่องเพื่อเปิดทีละช่อง · คำใบ้ = ตัวแรก ๆ (จำนวนข้อ)</span>"
    :"<button class='btn' data-tq='on'>ปิดเพื่อทวน</button>";
}
function tqInit(root){
  (root||document).querySelectorAll(".prose .tablewrap").forEach(function(tw,i){
    if(tw._tq)return;tw._tq=1;
    var tb=tw.querySelector("table");if(!tb||!tb.querySelector("tbody tr td:nth-child(2)"))return;
    tw._tqk=tqKey(i);
    var bar=document.createElement("div");bar.className="tqbar";tqBar(bar,false);tw.parentNode.insertBefore(bar,tw);
    var st=TQST[tw._tqk];
    if(st&&st.on){                           /* render ใหม่แล้วให้กลับมาปิดเหมือนเดิม */
      var op=st.op;tqSet(tw,true);TQST[tw._tqk]={on:1,op:op};
      tb.querySelectorAll("tbody tr").forEach(function(tr){
        Array.prototype.forEach.call(tr.children,function(td,ci){
          if(ci===0||td.tagName!=="TD")return;
          if(op[tqCell(td)]){td.classList.add("op");td.setAttribute("aria-expanded","true");}
        });

}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-tq]");
  if(b){var bar=b.closest(".tqbar"),tw=bar.nextElementSibling,act=b.getAttribute("data-tq");
    if(act==="on"||act==="re")tqSet(tw,true);
    else if(act==="off")tqSet(tw,false);
    else if(act==="all")tw.querySelectorAll("td.cv").forEach(function(td){tqOpen(td,true);});
    return;}
  var td=e.target.closest&&e.target.closest("table.tq td.cv");

  new MutationObserver(function(){tqInit(m);}).observe(m,{childList:true,subtree:true});})();

/* ---------- tiny markdown (เหมือน drill.html) ---------- */
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(t){return esc(t)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");}
var FIGS={},FIGN=0;
function figHtml(k){
  var f=FIGS[k];if(!f||!f.svg)return "";
  var m=/viewBox="\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)\s*"/.exec(f.svg),w=m?+m[1]:560;
  var wide=w>440,sty="max-width:"+Math.round(w*1.25)+"px"+(wide?";min-width:"+Math.round(w*0.74)+"px":"");
  FIGN++;
  return "<figure class='fig'>"+"<div class='figt q'><div class='tt'><span>ภาพ "+FIGN+"</span>"+inline(f.title||"")+"</div>"+
    "<button class='figq' data-figq='1' title='ปิดป้ายรายละเอียดในภาพ เหลือชื่อหลักไว้เป็นใบ้ — กดกล่องเพื่อเฉลยทีละอัน'>ปิดป้าย · ทายเอง</button></div>"+
    "<div class='figsv'><div class='figin' style='"+sty+"'>"+f.svg+"</div></div>"+
    (wide?"<div class='figscroll on'>← เลื่อนภาพไปทางขวาเพื่อดูส่วนที่เหลือ →</div>":"")+
    (f.cap?"<figcaption>"+inline(f.cap)+"</figcaption>":"")+"</figure>";
}
/* แยกข้อความที่คั่นด้วย " · " เป็นท่อน (ทำหลัง inline เพื่อให้ตัวหนาที่คร่อมหลายท่อนยังถูกต้อง)
   ไม่ตัดใน (วงเล็บ) · ถ้าตัวหนาคร่อมจุดตัด ปิด/เปิด <strong> ใหม่ให้แต่ละท่อน */
function splitDots(h){
  var out=[],cur="",dep=0,bold=false,i=0;
  while(i<h.length){
    if(h.substr(i,8)==="<strong>"){bold=true;cur+="<strong>";i+=8;continue;}
    if(h.substr(i,9)==="</strong>"){bold=false;cur+="</strong>";i+=9;continue;}
    var ch=h.charAt(i);
    if(ch==="(")dep++;else if(ch===")"&&dep>0)dep--;
    if(dep===0&&h.substr(i,3)===" \u00b7 "){out.push(cur+(bold?"</strong>":""));cur=bold?"<strong>":"";i+=3;continue;}
    cur+=ch;i++;
  }
  out.push(cur);
  return out.filter(function(x){return x!==""&&x!=="<strong></strong>";});
}
function md(src){
  var lines=String(src==null?"":src).split("\n"),out=[],i=0,para=[];
  function flushPara(){if(para.length){out.push("<p>"+para.map(function(x){return splitDots(inline(x)).join("<br>");}).join("<br>")+"</p>");para=[];}}
  function flushTable(){
    var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
    if(!rows.length)return;
    var cells=rows.map(function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});});
    var hasSep=cells.length>1&&cells[1].every(function(c){return /^:?-{2,}:?$/.test(c);});
    var head=cells[0],body=hasSep?cells.slice(2):cells.slice(1);
    var h="<div class='tablewrap'><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
    body.forEach(function(r){h+="<tr>"+r.map(function(c){var sg=splitDots(inline(c));return "<td>"+(sg.length>1?sg.map(function(x){return "<span class='seg'>"+x+"</span>";}).join(""):(sg[0]||""))+"</td>";}).join("")+"</tr>";});
    out.push(h+"</tbody></table></div>");
  }
  function flushList(ordered){
    var tag=ordered?"ol":"ul",items=[];
    while(i<lines.length){
      var m=ordered?lines[i].match(/^\s*\d+[.)]\s+(.*)$/):lines[i].match(/^\s*[-•]\s+(.*)$/);
      if(!m)break;
      var txt=m[1];i++;
      while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*[-•]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*\|/.test(lines[i])){txt+=" "+lines[i].trim();i++;}
      items.push("<li>"+splitDots(inline(txt)).join("<br>")+"</li>");
    }
    out.push("<"+tag+">"+items.join("")+"</"+tag+">");
  }
  while(i<lines.length){
    var L=lines[i],fm=/^\s*\[\[fig:([\w-]+)\]\]\s*$/.exec(L);
    if(fm){flushPara();out.push(figHtml(fm[1]));i++;continue;}
    var am=/^\s*\[\[anim:([\w-]+)\]\]\s*$/.exec(L);
    if(am){flushPara();out.push(animHtml(am[1]));i++;continue;}
    var im=/^\s*\[\[img:([\w-]+)\]\]\s*$/.exec(L);
    if(im){flushPara();out.push(imgHtml(im[1]));i++;continue;}
    if(/^\s*>\s?/.test(L)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      flushPara();out.push("<div class='callout'>"+md(q.join("\n"))+"</div>");continue;}
    if(/^\s*####\s+/.test(L)){flushPara();out.push("<h4>"+inline(L.replace(/^\s*####\s+/,""))+"</h4>");i++;continue;}
    if(/^\s*###\s+/.test(L)){flushPara();out.push("<h3>"+inline(L.replace(/^\s*###\s+/,""))+"</h3>");i++;continue;}
    if(/^\s*\|/.test(L)){flushPara();flushTable();continue;}
    if(/^\s*[-•]\s+/.test(L)){flushPara();flushList(false);continue;}
    if(/^\s*\d+[.)]\s+/.test(L)){flushPara();flushList(true);continue;}
    if(!L.trim()){flushPara();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();return out.join("");
}

  return {n:n,answered:a,correct:ok,read:!!state.done[sec.id],
          complete:!!state.done[sec.id]&&(n===0||a===n)};
}

var TABS=[{k:"home",label:"ภาพรวม"},{k:"lectures",label:"คาบเรียน"},{k:"learn",label:"เรียนเนื้อหา"},{k:"meq",label:"Practice · MEQ"},{k:"osce",label:"Practice · OSCE/SAQ"},{k:"review",label:"ทบทวนข้อที่ผิด"}];
function lum(hex){
  var h=String(hex).trim().replace("#","");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h))return 0;
  var f=function(v){v=parseInt(v,16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(h.slice(0,2))+0.7152*f(h.slice(2,4))+0.0722*f(h.slice(4,6));
}
function darkNow(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark")return true; if(t==="light")return false;
  try{return window.matchMedia("(prefers-color-scheme:dark)").matches;}catch(e){return false;}
}
function applyAccent(c){
  var a=c.accent||{},d=darkNow(),r=document.documentElement.style;
  var acc=d?a.dark:a.light, soft=d?a.darkSoft:a.soft, ink=d?a.darkInk:a.ink;
  if(acc)r.setProperty("--accent",acc); if(soft)r.setProperty("--accent-soft",soft);
  if(ink)r.setProperty("--accent-ink",ink);
  /* ตัวอักษรบนพื้นสีประจำระบบ — เลือกขาว/ดำตามความสว่างของสีนั้น */
  if(acc)r.setProperty("--on-accent", lum(acc)>0.55 ? "#08110c" : "#ffffff");
}

function recallHtml(s){
  var lines=String(s.md||"").split("\n"),blocks=[],cur={title:"ภาพรวมหัวข้อ",lvl:3,lines:[]};

  });

        "<span class='chip"+(r?" acc":"")+"' style='align-self:flex-start;margin-top:4px'>"+(r?("ประเมินตัวเองแล้ว: "+r):"ยังไม่ได้ทำ")+"</span></button>";
    }).join("")+"</div>";
  });
  return h+"</section>";
}

function viewMeq(l,it){
  var h="<section class='card'><div class='eyebrow'>MEQ · คาบ "+esc(l.lec)+" · "+esc(l.lecture||l.title)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2><div class='vignette prose'>"+md(it.vignette)+"</div>";
  (it.questions||[]).forEach(function(q,i){
    var kid=it.id+"#"+i,open=!!state.notes[kid+"!shown"];
    h+="<div class='hr'></div><div class='prose'><strong>"+inline(q.q)+"</strong></div>"+
      "<textarea data-note='"+esc(kid)+"' placeholder='เขียนคำตอบของคุณก่อนดูเฉลย…'>"+esc(state.notes[kid]||"")+"</textarea>"+
      "<div class='nav' style='margin-top:9px'><button class='btn"+(open?"":" primary")+"' data-reveal='"+esc(kid)+"'>"+(open?"ซ่อนแนวคำตอบ":"ดูแนวคำตอบ")+"</button></div>"+
      (open?"<div class='explain prose'>"+md(q.a)+"</div>":"");
  });
  h+="<div class='hr'></div>"+rateBar(it)+
     "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='meq'>← กลับไปเลือกโจทย์อื่น</button></div></section>";
  return h;
}

function viewOsce(l,it){
  var mins=(String(it.station||"").match(/(\d+)\s*นาที/)||[])[1]||5;
  var h="<section class='card'><div class='eyebrow'>OSCE / SAQ · คาบ "+esc(l.lec)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2>"+
    "<div class='meta'><span class='chip acc'>"+esc(it.station||"")+"</span>"+
    "<span class='timer' id='timer'>"+mins+":00</span>"+
    "<button class='btn' data-timer='"+mins+"'>เริ่มจับเวลา</button></div>"+
    "<div class='vignette prose'>"+md(it.instruction)+"</div>"+
    "<textarea data-note='"+esc(it.id)+"' placeholder='เขียนคำตอบของคุณ…'>"+esc(state.notes[it.id]||"")+"</textarea>"+
    "<div class='nav' style='margin-top:10px'><button class='btn"+(state.notes[it.id+"!shown"]?"":" primary")+"' data-reveal='"+esc(it.id)+"'>"+
      (state.notes[it.id+"!shown"]?"ซ่อนเฉลย":"ดูเฉลยและเกณฑ์ให้คะแนน")+"</button></div>"+
    (state.notes[it.id+"!shown"]?"<div class='explain prose'>"+md(it.answer)+"</div>":"")+
    "<div class='hr'></div>"+rateBar(it)+
    "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='osce'>← กลับไปเลือกสถานีอื่น</button></div></section>";
  return h;
}

function rateBar(it){
  var r=state.rate[it.id];
  return "<div class='selfrate'><span class='lede'>ประเมินตัวเอง:</span>"+
    ["ตอบได้ครบ","ตอบได้บางส่วน","ยังไม่ได้"].map(function(x){
      return "<button class='btn"+(r===x?" on":"")+"' data-rate='"+esc(it.id)+"' data-val='"+x+"'>"+x+"</button>";
    }).join("")+"</div>";
}

function viewReview(){
  var wrong=[];
  allSections().forEach(function(x){x.sec.items.forEach(function(it){
    var v=state.ans[it.id];if(v!=null&&v!==it.answer)wrong.push({s:x.sec,l:x.lec,it:it});});});
  var h="<section class='card'><div class='eyebrow'>ทบทวน</div><h2>ข้อที่เคยตอบผิด</h2>"+
    "<p class='lede'>รวมทุกข้อที่ตอบผิดไว้ที่เดียว — กด “ล้างคำตอบ” เพื่อกลับไปทำใหม่แบบไม่เห็นเฉลย</p>";
  if(!wrong.length)return h+"<p class='lede'>ยังไม่มีข้อที่ตอบผิด — เริ่มทำข้อในหัวข้อต่าง ๆ ก่อน</p></section>";
  h+="<div class='meta'><span class='chip acc'>"+wrong.length+" ข้อ</span>"+
     "<button class='btn ghost' data-act='resetwrong'>ล้างคำตอบทุกข้อที่ผิด</button></div>";
  var byLec={};wrong.forEach(function(w){(byLec[w.l.lec]=byLec[w.l.lec]||[]).push(w);});
  Object.keys(byLec).forEach(function(lc){
    h+="<h3>คาบ "+esc(lc)+" · "+esc(lecOf(lc).title)+"</h3>";
    byLec[lc].forEach(function(w){h+="<div class='lede' style='margin-top:10px'>หัวข้อ: "+esc(w.s.title)+"</div>"+qHtml(w.it);});
  });
  return h+"</section>";
}

/* ---------- render ---------- */
/* ---------- ปิดป้ายในภาพ (ทายเอง) ----------
   ปิดรายละเอียดด้วยกล่อง + ใบ้ 2 ตัวอักษรแรก (ชื่อหลักยังเห็น) · กดกล่องเพื่อเฉลยทีละอัน · ต้องทำตอนภาพแสดงอยู่ (getBBox ของที่ซ่อนได้ 0) */
var SEG=null;try{SEG=new Intl.Segmenter("th",{granularity:"grapheme"});}catch(e){}
function graphemes(s){return SEG?Array.from(SEG.segment(s),function(x){return x.segment;}):Array.from(s);}
var SVGNS="http://www.w3.org/2000/svg";
function czBox(sv,inv,el,fs){
  /* กรอบของบรรทัด (text หรือ tspan) ในพิกัดของ svg — tspan ไม่มี getBBox จึงแปลงจาก getBoundingClientRect
     ความสูงตัดให้เท่าขนาดตัวอักษร (กรอบของฟอนต์ไทยสูงเกิน จะทับบรรทัดชื่อข้างบน) */
  var R=el.getBoundingClientRect();if(R.width<1||R.height<1)return null;
  var p1=sv.createSVGPoint(),p2=sv.createSVGPoint();p1.x=R.left;p1.y=R.top;p2.x=R.right;p2.y=R.bottom;
  p1=p1.matrixTransform(inv);p2=p2.matrixTransform(inv);
  var h=Math.min(p2.y-p1.y,fs*1.05),cy=(p1.y+p2.y)/2+fs*0.04;
  return {x:p1.x,y:cy-h/2,width:p2.x-p1.x,height:h};
}
function czAdd(sv,bb,txt){
  var g=graphemes(txt),hint=g.length>2?g.slice(0,2).join("")+"…":"?";
  var cz=document.createElementNS(SVGNS,"g");cz.setAttribute("class","cz");cz.setAttribute("data-cz","1");
  cz.setAttribute("tabindex","0");cz.setAttribute("role","button");cz.setAttribute("aria-label","เฉลยป้ายนี้");
  var r=document.createElementNS(SVGNS,"rect"),p=1.5;
  r.setAttribute("x",bb.x-p);r.setAttribute("y",bb.y-p);r.setAttribute("width",bb.width+2*p);r.setAttribute("height",bb.height+2*p);r.setAttribute("rx",3);
  var ht=document.createElementNS(SVGNS,"text"),fs=Math.max(7.5,Math.min(10.5,bb.height*0.72));
  ht.setAttribute("x",bb.x+2);ht.setAttribute("y",bb.y+bb.height/2+fs*0.36);ht.setAttribute("style","font-size:"+fs+"px");
  ht.textContent=hint;cz.appendChild(r);cz.appendChild(ht);sv.appendChild(cz);
}
function coverFig(fg){
  /* ชื่อหลักให้เห็น: บรรทัดแรกของป้ายขนาดปกติ (มักเป็นชื่อในกล่อง) · ปิด: บรรทัดถัดไป + ป้ายตัวเล็ก (sm/xs — ป้ายบนลูกศร รายละเอียด) */
  var sv=fg.querySelector(".figsv svg");if(!sv)return;
  uncoverFig(fg);
  var ctm=sv.getScreenCTM();if(!ctm)return;var inv=ctm.inverse(),todo=[],all=[];
  Array.prototype.slice.call(sv.querySelectorAll("text")).forEach(function(tx){
    var small=tx.classList.contains("sm")||tx.classList.contains("xs");
    var fs=parseFloat(getComputedStyle(tx).fontSize)||12;
    var lines=Array.prototype.slice.call(tx.querySelectorAll("tspan"));if(!lines.length)lines=[tx];
    lines.forEach(function(ln,i){
      var txt=(ln.textContent||"").replace(/\s+/g," ").trim();if(!txt||/^[\d.,%\s–-]+$/.test(txt))return;  /* ตัวเลขล้วน (แกนกราฟ) ไม่ปิด */
      var bb=czBox(sv,inv,ln,fs);if(!bb)return;
      all.push([bb,txt]);if(small||i>0)todo.push([bb,txt]);
    });
  });
  if(!todo.length)todo=all.filter(function(x,i){return i%2;});   /* ภาพที่ป้ายเป็นชื่อล้วน — ปิดสลับกันครึ่งหนึ่ง */
  todo.forEach(function(x){czAdd(sv,x[0],x[1]);});
  if(todo.length){fg.classList.add("czon");var b=fg.querySelector(".figq");if(b)b.textContent="เฉลยทั้งหมด";}
}
function uncoverFig(fg){
  Array.prototype.slice.call(fg.querySelectorAll(".cz")).forEach(function(x){x.remove();});
  fg.classList.remove("czon");var b=fg.querySelector(".figq");if(b)b.textContent="ปิดป้าย · ทายเอง";
}
function autoCover(root){
  if(state.view!=="section")return;var l=lecOf(state.lec);if(!l||!lecHidden(l))return;
  Array.prototype.slice.call(root.querySelectorAll("figure.fig:not(.pimg)")).forEach(function(fg){
    if(fg.offsetParent!==null&&!fg.classList.contains("czon"))coverFig(fg);});
}
function revealCz(cz){var fg=cz.closest("figure");cz.remove();
  if(fg&&!fg.querySelector(".cz"))uncoverFig(fg);}
document.addEventListener("click",function(e){var cz=e.target.closest&&e.target.closest("[data-cz]");if(cz)revealCz(cz);});
document.addEventListener("keydown",function(e){var cz=e.target.closest&&e.target.closest("[data-cz]");
  if(cz&&(e.key==="Enter"||e.key===" ")){e.preventDefault();revealCz(cz);}});

function render(){
  renderMast();renderOutline();
  var m=document.getElementById('main'),h;
  var cc=course();
  if(!cc._loaded){
    m.innerHTML=cc._err
      ? "<section class='card'><h2>โหลดชุด "+esc(cc.label)+" ไม่สำเร็จ</h2><p class='lede'>"+esc(cc._err)+"</p></section>"
      : "<section class='card'><p class='lede'>กำลังโหลดเนื้อหา "+esc(cc.label)+" …</p></section>";
    return;
  }
  if(state.view==="section")h=viewSection();
  else if(state.view==="meq")h=viewPractice("meq");
  else if(state.view==="osce")h=viewPractice("osce");
  else if(state.view==="review")h=viewReview();
  else if(state.view==="lectures")h=viewLectures();
  else if(state.view==="lecture")h=viewLecture();
  else if(state.view==="learn"){h=viewHome();}
  else h=viewHome();
  m.innerHTML=h;
  autoCover(m);
  save();
}

function openSection(lec,sec){state.view="section";state.lec=lec;state.sec=sec;render();window.scrollTo({top:0});}
function firstUnfinished(){
  var list=allSections();
  for(var i=0;i<list.length;i++)if(!secStat(list[i].sec).complete)return list[i];
  return list[0];
}

/* ---------- events ---------- */
function setMast(min){
  var m=document.querySelector('.mast'),b=document.getElementById('mastBtn');
  m.classList.toggle('min',min);b.setAttribute('aria-expanded',min?'false':'true');
  b.textContent=min?'เมนู ▾':'ซ่อนเมนู ▴';b.title=min?'แสดงแถบเมนู':'ซ่อนแถบเมนู';
}
try{setMast(localStorage.getItem('med421-learn-mast')==='min');}catch(e){}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==="mastBtn"){
    var min=!document.querySelector('.mast').classList.contains('min');setMast(min);
    try{localStorage.setItem('med421-learn-mast',min?'min':'');}catch(e2){}
    return;
  }
  if(t.id==="themeBtn"){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"":"dark");
    if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
    state.theme=nx;save();if(COURSES.length)applyAccent(course());return;
  }
  if(t.dataset.course){
    if(t.dataset.course!==state.course){
      state.course=t.dataset.course;state.view=(state.view==="lectures"||state.view==="lecture")?"lectures":"home";state.lec=null;state.sec=null;state.pid=null;
      render();window.scrollTo({top:0});ensure(state.course).then(render);
    }
    return;
  }
  if(t.dataset.tab){
    state.view=t.dataset.tab;state.pid=null;
    if(state.view==="learn"){var f=firstUnfinished();openSection(f.lec.lec,f.sec.id);return;}
    render();window.scrollTo({top:0});return;
  }
  if(t.dataset.go==="next"){var f2=firstUnfinished();openSection(f2.lec.lec,f2.sec.id);return;}
  if(t.dataset.openlec){state.view="lecture";state.lec=t.dataset.openlec;state.sec=null;state.pid=null;render();window.scrollTo({top:0});return;}
  if(t.dataset.lec){state.lec=(state.lec===t.dataset.lec?null:t.dataset.lec);renderOutline();save();return;}
  if(t.dataset.sec){openSection(t.dataset.slec,t.dataset.sec);return;}
  if(t.dataset.goto){openSection(t.dataset.golec,t.dataset.goto);return;}
  if(t.dataset.q){
    if(state.ans[t.dataset.q]==null){
      state.ans[t.dataset.q]=+t.dataset.i;
      var sec=secOf(lecOf(state.lec),state.sec);
      if(sec&&secStat(sec).answered===sec.items.length)state.done[sec.id]=true;
      var id=t.dataset.q;render();
      var el=document.getElementById('q-'+id);if(el)el.scrollIntoView({block:"nearest"});
    }
    return;
  }
  if(t.dataset.act==="hidelec"){
    var hk=state.course+"|"+t.dataset.hlec;state.hide=state.hide||{};
    if(state.hide[hk])delete state.hide[hk];else state.hide[hk]=true;render();return;
  }
  if(t.dataset.figq){var fg=t.closest("figure");if(fg.classList.contains("czon"))uncoverFig(fg);else coverFig(fg);return;}
  if(t.dataset.rv){
    var rb=document.getElementById("rvb-"+t.dataset.rv);if(!rb)return;
    var open=rb.classList.contains("hide");rb.classList.toggle("hide",!open);if(open)autoCover(rb);
    t.setAttribute("aria-expanded",open?"true":"false");t.querySelector(".ar").textContent=open?"▾":"▸";return;
  }
  if(t.dataset.rvall){
    var op=t.dataset.rvall==="1";
    document.querySelectorAll("main .rv").forEach(function(b){
      var x=document.getElementById("rvb-"+b.dataset.rv);if(x)x.classList.toggle("hide",!op);
      b.setAttribute("aria-expanded",op?"true":"false");b.querySelector(".ar").textContent=op?"▾":"▸";});
    if(op)autoCover(document.getElementById("main"));
    return;
  }
  if(t.dataset.act==="markread"){if(state.done[state.sec])delete state.done[state.sec];else state.done[state.sec]=true;render();return;}
  if(t.dataset.act==="resetsec"){
    var s2=secOf(lecOf(state.lec),state.sec);
    s2.items.forEach(function(it){delete state.ans[it.id];});delete state.done[s2.id];render();return;
  }
  if(t.dataset.act==="resetwrong"){
    allSections().forEach(function(x){x.sec.items.forEach(function(it){
      if(state.ans[it.id]!=null&&state.ans[it.id]!==it.answer){delete state.ans[it.id];delete state.done[x.sec.id];}});});
    render();return;
  }
  if(t.dataset.pid!==undefined&&t.dataset.pid!==""){if(t.dataset.pv)state.view=t.dataset.pv;state.pid=t.dataset.pid;render();window.scrollTo({top:0});return;}
  if(t.dataset.back){state.pid=null;state.view=t.dataset.back;render();window.scrollTo({top:0});return;}
  if(t.dataset.reveal){var k=t.dataset.reveal+"!shown";if(state.notes[k])delete state.notes[k];else state.notes[k]=true;render();return;}
  if(t.dataset.rate){state.rate[t.dataset.rate]=t.dataset.val;render();return;}
  if(t.dataset.timer){startTimer(+t.dataset.timer);return;}
});
document.addEventListener('input',function(e){
  var ta=e.target;if(ta.tagName!=="TEXTAREA"||!ta.dataset.note)return;
  state.notes[ta.dataset.note]=ta.value;save();
});
var timer=null;
function startTimer(mins){
  if(timer)clearInterval(timer);
  var left=mins*60,el=document.getElementById('timer');
  timer=setInterval(function(){
    left--;el=document.getElementById('timer');
    if(!el){clearInterval(timer);timer=null;return;}
    if(left<=0){clearInterval(timer);timer=null;el.textContent="หมดเวลา";return;}
    el.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  },1000);
}
renderSync();
boot();
})();
</script>
