<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MED421 learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* palette — สีดิบ เขียนครั้งเดียว */
  --g-50:#eef3f0; --g-0:#ffffff; --g-100:#e3ebe6; --g-900:#0d1712; --g-700:#3d4c44; --g-500:#6d7f75; --g-200:#d8e2dc; --g-300:#bccbc3;
  --wine-700:#8c1d2f; --wine-50:#f6e9eb; --wine-800:#6e1624;
  --green-700:#0f7a4a; --green-50:#dff0e6; --amber-700:#9a5f08; --amber-50:#f8efdc; --red-700:#a3271f; --red-50:#f8e9e7; --blue-600:#1f6feb;
  --n-950:#090d0b; --n-900:#111915; --n-850:#18221d; --n-50:#e7f0ea; --n-300:#a5b8ac; --n-400:#788c80; --n-800:#1d2922; --n-700:#2a3830;
  --pink-300:#ff8fa3; --pink-950:#24151a; --pink-200:#ffb3c0; --mint-300:#5fe3a1; --mint-950:#0f2419; --gold-300:#e8bb63; --gold-950:#241f10;
  --coral-300:#e8877c; --coral-950:#2a1715; --sky-300:#7fb4ff;
  /* ชื่อตามหน้าที่ — โค้ดส่วนอื่นใช้แค่ชุดนี้ */
  --paper:var(--g-50); --surface:var(--g-0); --surface-sunk:var(--g-100);
  --ink:var(--g-900); --ink-2:var(--g-700); --ink-3:var(--g-500);
  --rule:var(--g-200); --rule-strong:var(--g-300);
  --accent:var(--wine-700); --accent-soft:var(--wine-50); --accent-ink:var(--wine-800); --on-accent:#ffffff;
  --ok:var(--green-700); --ok-soft:var(--green-50); --miss:var(--amber-700); --miss-soft:var(--amber-50);
  --bad:var(--red-700); --bad-soft:var(--red-50);
  --focus:var(--blue-600);
  --shadow:0 1px 2px rgba(13,23,18,.05),0 12px 28px -20px rgba(13,23,18,.3);
  /* สเกล (study-page-design) */
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:var(--sans);
  --e:cubic-bezier(.22,.9,.28,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:var(--n-950); --surface:var(--n-900); --surface-sunk:var(--n-850);
    --ink:var(--n-50); --ink-2:var(--n-300); --ink-3:var(--n-400); --rule:var(--n-800); --rule-strong:var(--n-700);
    --accent:var(--pink-300); --accent-soft:var(--pink-950); --accent-ink:var(--pink-200); --on-accent:#08110c;
    --ok:var(--mint-300); --ok-soft:var(--mint-950); --miss:var(--gold-300); --miss-soft:var(--gold-950);
    --bad:var(--coral-300); --bad-soft:var(--coral-950); --focus:var(--sky-300);
    --shadow:0 1px 2px rgba(0,0,0,.6),0 18px 40px -28px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --paper:var(--n-950); --surface:var(--n-900); --surface-sunk:var(--n-850);
  --ink:var(--n-50); --ink-2:var(--n-300); --ink-3:var(--n-400); --rule:var(--n-800); --rule-strong:var(--n-700);
  --accent:var(--pink-300); --accent-soft:var(--pink-950); --accent-ink:var(--pink-200); --on-accent:#08110c;
  --ok:var(--mint-300); --ok-soft:var(--mint-950); --miss:var(--gold-300); --miss-soft:var(--gold-950);
  --bad:var(--coral-300); --bad-soft:var(--coral-950); --focus:var(--sky-300);
  --shadow:0 1px 2px rgba(0,0,0,.6),0 18px 40px -28px rgba(0,0,0,1);
}
@keyframes rise{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.rise{animation:rise .32s var(--e) both}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
/* ซูมทั้งหน้าตามความกว้างจอ (ผู้ใช้ขอ 31 ต.ค. — "มันโล่ง")
   ขยายเพดานความกว้างและตัวอักษรพร้อมกัน ความยาวบรรทัดเทียบขนาดตัวอักษรจึงคงที่ (66 เท่า)
   ต่างจากการดึงความกว้างอย่างเดียว ซึ่งทำให้บรรทัดยาวขึ้นเรื่อย ๆ จนอ่านยาก
   จอ <1500px ไม่ซูม มือถือและแท็บเล็ตจึงไม่เปลี่ยน */
:root{--z:1}
@media (min-width:1500px){:root{--z:1.10}}
@media (min-width:1750px){:root{--z:1.20}}
@media (min-width:2100px){:root{--z:1.32}}
@media (min-width:2500px){:root{--z:1.45}}
body{zoom:var(--z)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}
@media (min-width:640px){.wrap{padding-inline:24px}}

/* ---------- masthead ---------- */
.mast{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.mast .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--ink-3);font-size:12px}
.btn{font:inherit;font-size:14px;font-weight:600;color:var(--ink-3);background:var(--surface);
     border:1px solid var(--rule);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;
     transition:color .18s var(--e),background .18s var(--e),border-color .18s var(--e),transform .18s var(--e)}
.btn:hover{border-color:var(--rule-strong);color:var(--ink);background:var(--surface-sunk)}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-style:dashed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.lsync{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;white-space:nowrap}
.lsync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.lsync.cloud i{background:var(--ok)} .lsync.busy i{background:var(--miss)}
.bar{width:110px;height:7px;border-radius:999px;background:var(--surface-sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .18s var(--e)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding-block:24px 48px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:12px}}
/* vh วัดจากจอจริงซึ่งไม่ถูกซูม ต้องหารกลับ ไม่งั้นสารบัญสูงเกินจอเมื่อซูม */
aside{position:sticky;top:66px;max-height:calc((100vh - 84px) / var(--z));overflow:auto}
@media (max-width:900px){aside{position:static;max-height:none;order:2}main{order:1}}
/* ปุ่มซ่อนแถบเมนู — พับเหลือแถวเดียว (จำไว้ในเครื่องนี้) */
.mast.min #courseTabs,.mast.min #tabs,.mast.min #ring,.mast.min #lsync,.mast.min #themeBtn{display:none}
.mast.min .wrap{padding-block:8px}
#mastBtn{padding:4px 12px}
/* ซ่อนแถบสารบัญ "หัวข้อทั้งหมด" แล้วให้เนื้อหาขยายเต็มความกว้างจอ (ผู้ใช้ขอ 31 ต.ค.) — จำไว้ในเครื่องนี้ */
#asideBtn{padding:4px 12px;order:-1}
body.noaside .cols{grid-template-columns:minmax(0,1fr)}body.noaside .cols>aside{display:none}
body.noaside .wrap{max-width:none}
/* ปุ่มอยู่แถวเดียวกับชื่อเรื่องทุกความกว้าง ไม่ให้กินแถวเพิ่มบนจอกว้าง */
.brand{order:-2;flex:1 1 0}#mastBtn{order:-1}.brand b{white-space:nowrap}.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.mast .wrap{gap:8px}.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;padding-bottom:0}.ring{order:3}.brand b{font-size:16px}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.outline{padding:12px 12px 12px}
.outline h4{font-size:12px;font-family:var(--sans);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:8px 4px 4px}
.olec{margin-bottom:4px}
.olec>button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;font:inherit;font-weight:600;font-size:14px;
  color:var(--ink);background:transparent;border:0;border-radius:var(--r-sm);padding:8px;cursor:pointer;
  transition:background .18s var(--e),color .18s var(--e)}
.olec>button:hover{background:var(--surface-sunk)}
.olec>button.on{background:var(--accent-soft);color:var(--accent-ink)}
.olec .num{font:600 12px/1.3 var(--mono);color:var(--ink-3);border:1px solid var(--rule-strong);border-radius:var(--r-sm);padding:4px 4px}
.osec{list-style:none;margin:0 0 8px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.osec li button{display:flex;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink-2);
  background:transparent;border:0;border-radius:var(--r-md);padding:4px 8px;cursor:pointer;
  transition:background .18s var(--e),color .18s var(--e)}
.osec li button:hover{background:var(--surface-sunk);color:var(--ink)}
.osec li button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tick{flex:0 0 15px;height:15px;margin-top:4px;border-radius:50%;border:1.5px solid var(--rule-strong);font:600 12px/13px var(--sans);text-align:center;color:transparent}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.tick.part{border-color:var(--miss);background:var(--miss-soft);color:var(--miss)}

/* ---------- content ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card[id]{scroll-margin-top:48px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:24px}
@media (max-width:560px){.card{padding:16px 16px;border-radius:var(--r-md)}}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.card h2{font-size:24px;margin:8px 0 8px;line-height:1.35}
.card h3{font-size:18px;margin:24px 0 4px}
.lede{color:var(--ink-2);font-size:14px}
.prose{font-size:16px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:8px 0;padding-left:24px}
.prose li{margin:4px 0}
.prose strong{color:var(--ink);font-weight:600}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-sunk);padding:0 4px;border-radius:var(--r-sm)}
.prose h4{font-size:16px;font-family:var(--sans);font-weight:600;margin:16px 0 4px;color:var(--accent-ink)}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--rule);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{border-bottom:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:top}
/* " · " ในเนื้อหา = ขึ้นบรรทัดใหม่ (ผู้ใช้ขอ 16 ต.ค.) · ในตารางแต่ละท่อนเป็นบรรทัดของตัวเอง เว้นระยะนิดหนึ่ง */
td .seg{display:block}td .seg+.seg{margin-top:4px}
/* โหมดทวน: ซ่อนเนื้อหาทั้งคาบ เหลือหัวข้อ กดเปิดทีละส่วน (ผู้ใช้ขอ 16 ต.ค.) */
.rvbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.rv{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--surface-sunk);border:1px solid var(--rule);border-radius:var(--r-sm);padding:12px 12px;margin-top:8px;cursor:pointer;transition:border-color .18s var(--e),background .18s var(--e)}
.rv:hover{border-color:var(--accent)}.rv[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.rv .ar{flex:0 0 12px;color:var(--ink-3);font-size:12px}.rv.h4{margin-left:16px;width:calc(100% - 18px);font-size:14px;font-weight:600}
.rvb{padding:0 4px 4px 16px;border-left:2px solid var(--accent-soft);margin:4px 0 8px 8px}.rv.h4+.rvb{margin-left:24px}
.chip.rvon{border-color:var(--miss);color:var(--miss);background:var(--miss-soft)}
th{background:var(--surface-sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.callout{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:12px 16px;margin:16px 0;font-size:14px}
.callout b{color:var(--accent-ink)}
.pearls{margin:16px 0 0;padding:16px 16px;border:1px dashed var(--rule-strong);border-radius:var(--r-md);background:var(--surface-sunk)}
.pearls h4{margin:0 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans)}
.pearls ul{margin:0;padding-left:16px;font-size:14px}
.nlbox .gp2{font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:0 4px;white-space:nowrap}
.nlbox .gp3{font-size:12px;font-weight:600;color:var(--miss);background:var(--miss-soft);border-radius:var(--r-sm);padding:0 4px;white-space:nowrap}
.nlbox{margin:16px 0 0;border:1px solid var(--rule);border-left:4px solid var(--ok);border-radius:0 var(--r-md) var(--r-md) 0;background:var(--surface-sunk);padding:12px 16px}
.nlbox h4{margin:0 0 8px;font-size:14px;font-family:var(--sans);font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nlbox h4 .tick2{color:var(--ok);font-weight:600}
.nlbox h4.gl{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule-strong);color:var(--miss)}
.nlbox ul{margin:0;padding-left:0;list-style:none;display:grid;gap:4px}
.nlbox li{font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nlbox li code{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-sm);padding:0 4px;color:var(--ink);white-space:nowrap}
.nlbox li .src{font-size:12px;color:var(--ink-3)}
.nlbox .note{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:12px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--rule-strong);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-3);background:var(--surface)}
.chip.nl{border-style:dashed}
.chip.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

/* ---------- quiz ---------- */
.quiz{border-top:2px solid var(--accent);margin-top:24px;padding-top:16px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qhead h3{margin:0;font-size:20px}
.q{border:1px solid var(--rule);border-radius:var(--r-md);padding:16px 16px;margin-top:12px;background:var(--surface)}
.q .qid{font:600 12px/1.3 var(--mono);color:var(--ink-3)}
.stem{margin:8px 0 12px;font-size:16px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:8px;text-align:left;font:inherit;font-size:14px;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-sm);padding:8px 12px;color:var(--ink);
  transition:border-color .18s var(--e),background .18s var(--e),transform .18s var(--e)}
.ch:active:not(:disabled){transform:scale(.995)}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch:disabled{cursor:default}
.ch .k{font:600 14px/1.5 var(--mono);color:var(--ink-3);flex:0 0 16px}
.ch.correct{border-color:var(--ok);background:var(--ok-soft);animation:pop .18s var(--e)}
.ch.correct .k{color:var(--ok)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.wrong .k{color:var(--bad)}
.verdict{margin-top:12px;font-weight:600;font-size:14px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.explain{margin-top:8px;border-top:1px dashed var(--rule);padding-top:8px;font-size:14px}
.pearl{margin-top:8px;background:var(--accent-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:14px}
.pearl b{color:var(--accent-ink)}
.scorebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:12px 16px;
  border-radius:var(--r-md);background:var(--surface-sunk);font-size:14px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.nav .btn{white-space:normal;text-align:left;max-width:100%}

/* ---------- practice ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-top:12px}
.tile{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:16px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;
  transition:border-color .18s var(--e),transform .18s var(--e)}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.ltile{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-md);
  padding:12px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0;
  transition:border-color .18s var(--e),transform .18s var(--e)}
.ltile:hover{border-color:var(--accent);transform:translateY(-2px)}
.ltile .lnum{font:600 12px/1.3 var(--mono);color:var(--accent-ink);letter-spacing:.02em}
.ltile b{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.ltile .lsub{font-size:12px;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ltile .lprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-top:0}
.ltile .lprog .bar{width:90px;flex:none}
.ltile .lchips{display:flex;flex-wrap:wrap;gap:4px}
.lnav{align-items:center}
.tile b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tile span{font-size:12px;color:var(--ink-3)}
.vignette{font-size:14px;background:var(--surface-sunk);border-radius:var(--r-md);padding:16px 16px;margin:12px 0 4px}
.vignette.prose p:first-child{margin-top:0}.vignette.prose p:last-child{margin-bottom:0}.vignette .tablewrap{background:var(--surface)}
textarea{width:100%;min-height:104px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:var(--r-md);padding:12px 12px;resize:vertical}
.selfrate{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.timer{font:600 16px/1.3 var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:4px 12px}
.hr{height:1px;background:var(--rule);margin:16px 0}
footer{color:var(--ink-3);font-size:12px;padding:24px 0 32px;text-align:center}
.hide{display:none!important}
/* ---------- figures (แผนภาพ SVG ในบทเรียน · [[fig:key]] ใน md + section.figs) ---------- */
.fig{margin:16px 0;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--surface);padding:12px 12px 12px}
.fig .figt{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent-ink);margin:0 0 8px}
.fig .figt span{color:var(--ink-3);font-weight:600;margin-right:4px}
/* ปิดป้ายในภาพให้ทายเอง (ผู้ใช้ขอ 25 ต.ค.) — ชื่อหลักยังเห็น รายละเอียดถูกปิด โชว์ตัวอักษรแรกเป็นใบ้ */
.fig .figt.q{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.fig .figt.q .tt{flex:1 1 200px;min-width:0}
.fig .figt.q .tt span{color:var(--ink-3);font-weight:600;margin-right:4px}
.figq{font:inherit;font-size:12px;font-weight:600;letter-spacing:0;color:var(--ink-2);background:var(--surface);border:1px dashed var(--rule-strong);border-radius:999px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.figq:hover{border-color:var(--accent);color:var(--accent-ink)}.fig.czon .figq{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.fig svg .cz{cursor:pointer}.fig svg .cz rect{fill:var(--surface-sunk);stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2}
.fig svg .cz:hover rect,.fig svg .cz:focus rect{fill:var(--accent-soft)}.fig svg .cz:focus{outline:none}
.fig svg .cz text{fill:var(--ink-3);font-weight:600}
.fig.czon figcaption{display:none}  /* คำอธิบายใต้ภาพเฉลยกลไก — ซ่อนจนกว่าจะเฉลยทั้งหมด */
.fig .figsv{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig .figin{margin:0 auto}
.fig svg{display:block;width:100%;height:auto;color:var(--ink);font-family:var(--sans)}
.fig figcaption{font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.fig figcaption strong{color:var(--ink)}
.fig .figscroll{display:none;font-size:12px;color:var(--ink-3);margin-top:4px}
@media (max-width:560px){.fig{padding:8px 8px}.fig .figscroll.on{display:block}}
.fig svg text{fill:var(--ink);font-size:13px;stroke:none}
.fig svg :is(rect,circle,ellipse,path,polygon){fill:none;stroke:var(--ink-2);stroke-width:1.3}
.fig svg :is(line,polyline){fill:none;stroke:var(--ink-2);stroke-width:1.3}
.fig .lg{font-size:15px}.fig .sm{font-size:11.5px}.fig .xs{font-size:10.5px}.fig .b{font-weight:700}
.fig .mid{text-anchor:middle}.fig .end{text-anchor:end}
.fig .mu{fill:var(--ink-3)}.fig .i2{fill:var(--ink-2)}.fig .tac{fill:var(--accent-ink)}.fig .tok{fill:var(--ok)}
.fig .tbad{fill:var(--bad)}.fig .tms{fill:var(--miss)}.fig .twa{fill:var(--focus)}.fig .tpa{fill:var(--surface)}
.fig .bx{fill:var(--surface);stroke:var(--rule-strong)}.fig .sk{fill:var(--surface-sunk);stroke:var(--rule-strong)}
.fig .ac{fill:var(--accent-soft);stroke:var(--accent)}.fig .ok{fill:var(--ok-soft);stroke:var(--ok)}
.fig .bad{fill:var(--bad-soft);stroke:var(--bad)}.fig .ms{fill:var(--miss-soft);stroke:var(--miss)}
.fig .wa{fill:color-mix(in srgb,var(--focus) 14%,var(--surface));stroke:var(--focus)}
.fig .acf{fill:var(--accent);stroke:none}.fig .okf{fill:var(--ok);stroke:none}.fig .badf{fill:var(--bad);stroke:none}
.fig .msf{fill:var(--miss);stroke:none}.fig .waf{fill:var(--focus);stroke:none}.fig .inkf{fill:var(--ink-2);stroke:none}
.fig .muf{fill:var(--ink-3);stroke:none}.fig .ruf{fill:var(--rule-strong);stroke:none}.fig .paf{fill:var(--surface);stroke:none}
.fig .ln{fill:none;stroke:var(--ink-2)}.fig .lmu{fill:none;stroke:var(--ink-3)}.fig .lac{fill:none;stroke:var(--accent)}
.fig .lok{fill:none;stroke:var(--ok)}.fig .lbad{fill:none;stroke:var(--bad)}.fig .lms{fill:none;stroke:var(--miss)}
.fig .lwa{fill:none;stroke:var(--focus)}.fig .lru{fill:none;stroke:var(--rule-strong)}
.fig .w2{stroke-width:2.2}.fig .w3{stroke-width:3.4}.fig .w5{stroke-width:5}.fig .da{stroke-dasharray:5 4}.fig .dt{stroke-dasharray:1.5 3.5;stroke-linecap:round}.fig .ns{stroke:none}
/* ---------- ภาพ 3D แยกไฟล์ (section.anims[k].src → anim/*.html · โหลดเมื่อกด) ---------- */
.fig.a3d{border-color:color-mix(in srgb,var(--accent) 30%,var(--rule))}
.fig.a3d .figt span{color:var(--accent);}
.a3dd{margin:4px 0 8px;font-size:14px;color:var(--ink-2)}
.a3dbox{border-radius:var(--r-md);overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,#e9ecf2 0%,#cfd4de 100%);display:grid;place-items:center;min-height:180px}
.a3dbox.on{display:block;min-height:0;background:none}
.a3dbox iframe{display:block;width:100%;height:1420px;border:0}
@media (max-width:700px){.a3dbox iframe{height:1900px}}
.a3dgo{font:inherit;font-size:16px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.a3dlink{display:inline-block;margin-top:8px;font-size:14px;color:var(--accent-ink)}
/* ---------- กลไกแบบภาพเคลื่อนไหว ([[anim:key]] + section.anims) ---------- */
.fig.anim{border-color:color-mix(in srgb,var(--accent) 30%,var(--rule))}
.fig.anim .figt span{color:var(--accent);}
.anim svg [data-s],.anim svg [data-x]{transition:opacity .55s var(--e)}
.anim svg .aoff{opacity:0}
.anim svg .anow{animation:anow 1.1s var(--e) both}
@keyframes anow{0%{opacity:0}35%{opacity:1}100%{opacity:1}}
.anim svg .fl{stroke-dasharray:7 7;animation:afl 1.1s linear infinite}
.anim svg .fl.rv{animation-direction:reverse}
.anim svg .fl.sl{animation-duration:2.6s}
.anim svg .pl{animation:apl 1.3s ease-in-out infinite}
@keyframes afl{to{stroke-dashoffset:-14}}
@keyframes apl{0%,100%{opacity:1}50%{opacity:.35}}
.anim.paused svg .fl,.anim.paused svg .pl{animation-play-state:paused}
.actl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.actl .ab{font:inherit;font-size:14px;font-weight:600;min-width:38px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.actl .ab:hover{border-color:var(--accent);color:var(--accent-ink)}
.actl .ab.pp{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.actl .dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.actl .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--surface);font:600 12px/20px var(--mono);color:var(--ink-3);cursor:pointer;padding:0;text-align:center}
.actl .dot.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.actl .dot.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acap{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:14px;line-height:1.6;color:var(--ink-2);min-height:4.2em}
.acap b.st{display:block;color:var(--accent-ink);font-size:14px;margin-bottom:0}
.acap strong{color:var(--ink)}
/* ---------- หลักจำ (section.mnem) ---------- */
.mnem{margin:16px 0 0;padding:16px 16px;border:1px solid color-mix(in srgb,var(--miss) 45%,var(--rule));border-radius:var(--r-md);background:var(--miss-soft)}
.mnem>h4{margin:0 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--miss);font-family:var(--sans)}
.mnem .mnhd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.mnem .mnhd>h4{margin:0}
.mnem .mnpin{padding:4px 12px;font-size:12px;text-decoration:none;flex:none}
.mnem .mn+.mn{margin-top:12px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--miss) 40%,var(--rule))}
.mnem .mnh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.mnem .mnh b{font:600 18px/1.3 var(--mono);color:var(--ink);letter-spacing:.04em}
.mnem .mnh span{font-size:14px;color:var(--ink-2)}
.mnem ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.mnem li{display:grid;grid-template-columns:minmax(2.2em,max-content) 1fr;gap:8px;font-size:14px;line-height:1.5}
.mnem li b{font-family:var(--mono);color:var(--miss);font-weight:600}
.mnem .mnn{font-size:14px;color:var(--ink-2);margin:8px 0 0}
.mnem .mns{font-size:12px;color:var(--ink-3);margin:4px 0 0}
/* ---------- รูปภาพในบทเรียน ([[img:key]] + section.imgs) ---------- */
.fig.pimg{padding:8px 8px 12px}
.fig.pimg a.pz{display:block;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-sunk)}
.fig.pimg img{display:block;width:100%;height:auto;max-width:620px;margin:0 auto}
.fig.pimg .pcr{font-size:12px;color:var(--ink-3);margin-top:4px}
.fig.pimg .pq{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fig.pimg .pq b{font-size:14px;color:var(--accent-ink)}
.fig.pimg .pans{margin-top:8px;padding:8px 12px;border-radius:var(--r-sm);background:var(--ok-soft);border:1px solid var(--ok);font-size:14px;line-height:1.6}
/* ---------- ปิดตารางเพื่อทวน ---------- */
.tqbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:12px 0 -4px}
.tqbar .btn{padding:4px 12px;font-size:12px}.tqbar a.btn{text-decoration:none;margin-left:auto}
.tqbar .tqn{font-size:12px;color:var(--ink-3)}
table.tq td.cv{cursor:pointer;position:relative;background:var(--surface-sunk)}
table.tq td.cv:not(.op),table.tq td.cv:not(.op) *{color:transparent!important;text-shadow:none!important}
table.tq td.cv:not(.op)::after{content:attr(data-hint);position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--rule-strong);border-radius:var(--r-md);color:var(--ink-3);font-size:12px;font-weight:600;background:var(--surface);text-align:center;padding:0 4px}
table.tq td.cv.op{background:var(--ok-soft)}
.chip.anc{border-color:var(--accent);color:var(--accent-ink)}
/* ---------- ถาม AI (ผู้ใช้ขอ 7 พ.ย.) — ปุ่มลอยมุมขวาล่าง + ลากคลุมข้อความแล้วถามได้ทันที ----------
   แขวนไว้ที่ <html> ไม่ใช่ <body> เพื่อไม่โดน zoom ของ body (ตำแหน่ง fixed จึงตรงกับพิกัดจอ) */
.ai-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;
  font:600 14px/1.3 var(--sans);color:var(--on-accent);background:var(--accent);border:0;border-radius:999px;padding:12px 16px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(0,0,0,.45)}
.ai-fab[hidden],.ai-sel[hidden],.ai-panel[hidden],.ai-quote[hidden],.ai-quick[hidden]{display:none!important}
.ai-sel{position:fixed;z-index:62;font:600 14px/1.3 var(--sans);color:var(--on-accent);background:var(--accent);border:0;border-radius:999px;padding:8px 12px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);white-space:nowrap}
.ai-panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:61;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 100px));
  display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--r-lg);box-shadow:0 18px 50px -18px rgba(0,0,0,.55);font-family:var(--sans);overflow:hidden}
@media (max-width:560px){.ai-panel{right:8px;left:8px;width:auto;bottom:8px;height:min(78vh,620px)}}
.ai-hd{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:1px solid var(--rule);background:var(--surface-sunk)}
.ai-hd b{font-size:14px;margin-right:auto}
.ai-hd .ai-ctx{display:block;font-size:12px;font-weight:500;color:var(--ink-3);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-hd button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px 8px;cursor:pointer;white-space:nowrap;flex:none}
.ai-log{flex:1;min-height:0;overflow-y:auto;padding:12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.ai-m{max-width:92%;padding:8px 12px;border-radius:var(--r-lg)}
.ai-m.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:var(--r-sm)}
.ai-m.a{align-self:flex-start;background:var(--surface-sunk);border-bottom-left-radius:var(--r-sm)}
.ai-m.a.err{color:var(--bad)}
.ai-m p{margin:0 0 4px}.ai-m p:last-child{margin:0}.ai-m ul,.ai-m ol{margin:4px 0;padding-left:16px}.ai-m li{margin:0 0}
.ai-m .tablewrap{margin:4px 0}.ai-m table{min-width:0}
.ai-m blockquote,.ai-q{margin:0 0 4px;padding:4px 8px;border-left:3px solid var(--accent);color:var(--ink-2);font-size:14px;background:var(--surface);border-radius:0 var(--r-md) var(--r-md) 0;white-space:pre-wrap}
.ai-empty{color:var(--ink-3);font-size:14px;line-height:1.7}
.ai-quote{display:flex;gap:8px;align-items:flex-start;margin:0 12px;padding:8px 8px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;font-size:12px;color:var(--ink-2)}
.ai-quote span{flex:1;max-height:4.6em;overflow:hidden;white-space:pre-wrap}
.ai-quote button{font:inherit;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:0 0}
.ai-quick{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px 0}
.ai-quick button{font:inherit;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:4px 8px;cursor:pointer}
.ai-in{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end}
.ai-in textarea{flex:1;min-height:42px;max-height:140px;font:inherit;font-size:14px;padding:8px 12px;border-radius:var(--r-md);resize:none}
.ai-in button{font:600 14px/1.3 var(--sans);border:0;border-radius:var(--r-md);padding:12px 12px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.ai-in button.stop{background:var(--surface-sunk);color:var(--ink);border:1px solid var(--rule-strong)}
.ai-note{font-size:12px;color:var(--ink-3);padding:0 12px 8px}
@media print{.ai-fab,.ai-sel,.ai-panel{display:none!important}}
.mk{fill:var(--ink-2)}.mk-ac{fill:var(--accent)}.mk-ok{fill:var(--ok)}.mk-bad{fill:var(--bad)}.mk-ms{fill:var(--miss)}.mk-wa{fill:var(--focus)}.mk-mu{fill:var(--ink-3)}

/* ---------- study-page-design: ส่วนเสริมทับท้าย (9 พ.ย.) ---------- */
body{text-rendering:optimizeLegibility}
.prose p,.prose li,.lede,.explain,.stem{text-wrap:pretty}
h2,h3,h4,.card h2,.card h3{line-height:1.4}
.card h3{font-size:20px;margin:24px 0 8px}
.prose h4{font-size:18px;line-height:1.45;margin:24px 0 8px}
.qhead h3{font-size:20px}
.ltile b,.tile b{font-size:16px;line-height:1.4}
table,.timer,.olec .num,.q .qid,.ltile .lnum,.actl .dot,.nlbox li code,.ring{font-variant-numeric:tabular-nums}
/* ตัวอักษรเลือก A–E และหัวหลักจำเป็นป้ายกำกับ ไม่ใช่ตัวเลข → ใช้ฟอนต์หลัก */
.ch .k{font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.65;flex:0 0 16px}
.mnem .mnh b{font-family:var(--sans);font-size:18px;line-height:1.45;letter-spacing:0}
.mnem li b{font-family:var(--sans)}
/* พื้นที่กดอย่างน้อย 44×44 */
.btn,.figq,.ai-hd button,.ai-quick button,.ai-in button,.a3dgo,.ai-fab{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2)}
.btn{padding:var(--s-2) var(--s-4);border-radius:var(--r-md)}
.nav .btn{justify-content:flex-start}
#mastBtn,#asideBtn{padding:var(--s-2) var(--s-3)}
.tqbar .btn,.mnem .mnpin{padding:var(--s-1) var(--s-3);font-size:14px}
.olec>button,.osec li button{min-height:44px;align-items:center}
.osec li button .tick{margin-top:0}
.ch{min-height:44px}
.actl .ab{min-width:44px;height:44px}
.actl .dot{width:44px;height:44px;padding:8px;background-clip:content-box;line-height:26px;font-size:12px}
.ai-sel{min-height:44px;padding:var(--s-2) var(--s-3)}
.tick{flex:0 0 16px;height:16px;font:600 12px/14px var(--sans)}
/* state ครบ: hover กด focus disabled กำลังโหลด */
.btn:focus-visible,.ch:focus-visible,.tile:focus-visible,.ltile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn[aria-busy="true"]{cursor:progress;opacity:.75}
.btn[aria-busy="true"]::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:999px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:var(--on-accent)}
.btn.on:hover{background:var(--accent);color:var(--on-accent)}
/* การ์ดไม่เล่นอนิเมชันตอนแสดง — อ่านได้ทันที */
.card{animation:none}
main{gap:var(--s-4)}
@media (max-width:560px){.card{padding:var(--s-4);border-radius:var(--r-lg)}}
/* ชื่อชุดบนมือถือไม่ให้ปุ่มทับ — ตัดเป็น … แทน */
.brand{min-width:0}.brand b{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (min-width:900px){.brand b{flex:none}}
@media (max-width:560px){.brand span{display:none}}
/* ลิงก์ชิปที่กดได้ต้องสูง 44 */
.meta a.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 var(--s-3)}
/* ลิงก์ยาวในกล่อง นล./แนวทาง ทำหน้าล้นจอบนมือถือ — ให้ตัดบรรทัดได้ */
.nlbox li>span{min-width:0;overflow-wrap:anywhere}
/* ---------- โหมดพรีเซนต์ (ผู้ใช้ขอ 9 พ.ย.) ---------- */
.pv{position:fixed;inset:0;z-index:70;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;font-family:var(--sans);font-size:16px;line-height:1.65}
.pv[hidden]{display:none!important}
.pv:focus{outline:none}
.pv-top,.pv-bot{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-4);background:var(--surface)}
.pv-top{border-bottom:1px solid var(--rule)}.pv-bot{border-top:1px solid var(--rule)}
.pv-top select{min-height:44px;min-width:0;flex:0 1 360px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r-md);padding:0 var(--s-2)}
.pv-meta{margin-left:auto;display:flex;gap:var(--s-3);font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-prog{height:4px;background:var(--surface-sunk)}.pv-prog i{display:block;height:100%;background:var(--accent);transition:width .18s var(--e)}
.pv-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pv-slide{max-width:880px;margin:0 auto;padding:var(--s-6) var(--s-4) var(--s-7)}
.pv-eye{font-size:14px;line-height:1.6;font-weight:600;color:var(--accent-ink);margin:0 0 var(--s-2)}
.pv-h1{font-size:30px;line-height:1.3;font-weight:600;margin:0 0 var(--s-3);text-wrap:balance}
.pv-h2{font-size:24px;line-height:1.35;font-weight:600;margin:0 0 var(--s-3);text-wrap:balance}
.pv-ask{font-size:16px;color:var(--ink-2);margin:0 0 var(--s-5);text-wrap:pretty}
.pv-kw{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s-2)}
.pv-kw li{font-size:18px;line-height:1.45;font-weight:600;padding:var(--s-2) var(--s-3);border:1px solid var(--rule-strong);border-radius:var(--r-md);background:var(--surface)}
.pv-kw li strong{font-weight:600}
.pv-more{font-size:14px;color:var(--ink-3);margin:var(--s-2) 0 0}
.pv-vis{margin-top:var(--s-5)}
.pv-rate{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);margin-top:var(--s-6);padding-top:var(--s-4);border-top:1px dashed var(--rule)}
.pv-rate>span{font-size:14px;color:var(--ink-3);margin-right:var(--s-2)}
.pv-rate .btn.on,.pv-rate .btn.on:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.pv-notes{margin-top:var(--s-5);padding:var(--s-4);border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface)}
.pv-notes>h3{font-size:14px;line-height:1.6;font-weight:600;color:var(--ink-3);margin:0 0 var(--s-2)}
.pv-list{margin:var(--s-3) 0 0;padding-left:var(--s-5)}.pv-list li{margin:var(--s-1) 0}
.pv-sub{font-size:18px;line-height:1.45;font-weight:600;margin:var(--s-5) 0 var(--s-2)}
.pv-stats{display:flex;flex-wrap:wrap;gap:var(--s-2);margin:var(--s-3) 0 0;padding:0;list-style:none}
.pv-stats li{font-size:16px;padding:var(--s-2) var(--s-3);border:1px solid var(--rule);border-radius:var(--r-md);background:var(--surface);font-variant-numeric:tabular-nums}
.pv-weak{display:grid;gap:var(--s-2);margin-top:var(--s-3)}
.pv-weak .btn{justify-content:flex-start;white-space:normal;text-align:left;width:100%}
.pv-acts{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-5)}
.pv-bot .sp{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-top,.pv-bot,.pv-stage,.pv-slide{min-width:0}.pv-slide{overflow-wrap:anywhere}
/* เลือกเนื้อหาที่จะพรีเซนต์เอง (ผู้ใช้ขอ 14 พ.ย.) */
.pv-pick{margin-top:var(--s-5);border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);padding:0 var(--s-4)}
.pv-pick>summary{min-height:52px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:16px;line-height:1.5}
.pv-pl{list-style:none;margin:var(--s-3) 0 0;padding:0;display:grid;gap:var(--s-2)}
.pv-pl ul{list-style:none;margin:0;padding:0 0 0 var(--s-6);display:grid}
.pv-ck{display:flex;align-items:center;gap:var(--s-3);min-height:44px;cursor:pointer;font-size:16px;line-height:1.5}
.pv-ck b{font-weight:600}
.pv-ck.sub{font-size:14px;color:var(--ink-2)}
.pv-ck input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--lime-3)}
.pv-pick .pv-acts{margin:var(--s-3) 0 var(--s-4)}
.pv-pl>li:has(>label input:not(:checked))>ul{display:none}
@media (max-width:560px){.pv-h1{font-size:24px;line-height:1.35}.pv-h2{font-size:20px;line-height:1.4}.pv-kw li{font-size:16px;line-height:1.5}
  .pv-slide{padding:var(--s-5) var(--s-4) var(--s-6)}.pv-meta .pv-time{display:none}.pv-top,.pv-bot{padding:var(--s-2)}}

/* ===================== ธีม Teaching Round (ผู้ใช้ขอ 9 พ.ย.) — วางทับของเดิม ไม่ลบอะไร =====================
   พื้นเทาอ่อน การ์ดขาวมุมมน สีเน้น lime · แถบล่างลอย 5 ปุ่ม + วงล้อทางลัด · หน้าแรกการ์ดเขียว + วงแหวน
   วงล้อสลับคาบ (ดับเบิลคลิก/กดค้าง 2 วิ) · ปัดซ้าย-ขวา · เวอร์ชันคอม (แถบซ้าย/แถบขวา/ค้นหา Ctrl K) */
:root{
  --g-50:#eff0ec; --g-0:#ffffff; --g-100:#f6f7f3; --g-900:#151a14; --g-700:#3f463c; --g-500:#6b7268; --g-200:#e2e5de; --g-300:#d3d8cd;
  --lime:#d5f0a6; --lime-2:#a8dc5c; --lime-3:#86c43c; --on-lime:#1b2e0b; --pen:#3d7a17;
  --s-bg:#e6effa; --s-fg:#2f62a0; --o-bg:#e5f3e0; --o-fg:#3d7a17; --a-bg:#fbf0d9; --a-fg:#94600f;
  --paper:var(--g-50); --surface:var(--g-0); --surface-sunk:var(--g-100);
  --ink:var(--g-900); --ink-2:var(--g-700); --ink-3:var(--g-500); --rule:var(--g-200); --rule-strong:var(--g-300);
  --accent:var(--lime-2); --accent-soft:var(--lime); --accent-ink:var(--pen); --on-accent:#14200a;
  --ok:#3d7a17; --ok-soft:#e5f3e0; --miss:#94600f; --miss-soft:#fbf0d9; --bad:#c2372c; --bad-soft:#fdecea;
  --shadow:none; --tr-shadow:0 12px 32px -12px rgba(20,30,10,.35);
  --r-lg:24px; --r-md:16px; --r-sm:10px;
  --spring:cubic-bezier(.3,1.4,.5,1);
  --z:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --g-50:#0f110e; --g-0:#1a1d18; --g-100:#141712; --g-900:#e9ede5; --g-700:#c3cabd; --g-500:#9aa294; --g-200:#2b3027; --g-300:#3a4035;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2; --pen:#a8dc5c;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --ok:#a8dc5c; --ok-soft:#1b2c15; --miss:#eab863; --miss-soft:#2f2512; --bad:#ff8b7c; --bad-soft:#3a201d;
  --tr-shadow:0 12px 32px -12px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{
  --g-50:#0f110e; --g-0:#1a1d18; --g-100:#141712; --g-900:#e9ede5; --g-700:#c3cabd; --g-500:#9aa294; --g-200:#2b3027; --g-300:#3a4035;
  --lime:#2f4219; --lime-2:#8cc24a; --lime-3:#a8dc5c; --on-lime:#e8f7d2; --pen:#a8dc5c;
  --s-bg:#18263a; --s-fg:#93bdf0; --o-bg:#1b2c15; --o-fg:#a8dc5c; --a-bg:#2f2512; --a-fg:#eab863;
  --ok:#a8dc5c; --ok-soft:#1b2c15; --miss:#eab863; --miss-soft:#2f2512; --bad:#ff8b7c; --bad-soft:#3a201d;
  --tr-shadow:0 12px 32px -12px rgba(0,0,0,.8)}
body{zoom:1}
.card,.panel{border-color:transparent;border-radius:24px;box-shadow:none}
.btn{border-radius:999px;border-color:var(--rule)}
.btn.primary,.btn.on{background:var(--lime-2);border-color:var(--lime-2);color:#14200a}
.btn.primary:hover,.btn.on:hover{background:var(--lime-3);color:#14200a}
.btn:active{transform:scale(.96)}
.chip{border-radius:999px}
.tablewrap,.callout,.pearls,.nlbox,.mnem,.fig,.q,.vignette,.scorebar,.tile,.ltile,.ch,.rv,textarea{border-radius:20px}
.callout,.nlbox{border-left-width:0;box-shadow:inset 4px 0 0 var(--lime-3)}
.q{background:var(--surface-sunk);border-color:transparent}
.ch{background:var(--surface)}
.tile,.ltile{border-color:transparent;box-shadow:none;transition:transform .15s var(--spring)}
.tile:active,.ltile:active{transform:scale(.97)}
.quiz{border-top:0;padding-top:8px}
/* ชิปอ้างอิงที่มีลิงก์ยาวทำหน้าล้นจอบนมือถือ — ให้ตัดบรรทัดได้ */
.meta .chip{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.q,.explain,.pearl{min-width:0;overflow-wrap:anywhere}
.explain .tablewrap{max-width:100%}

/* ---------- มือถือ: หัวหน้าเหลือชื่อชุด + ชิปชุดวิชา ---------- */
.mast{background:color-mix(in srgb,var(--paper) 88%,transparent);border-bottom-color:transparent}
.mast #tabs,.mast #ring,.mast #lsync,.mast #themeBtn,.mast #asideBtn,.mast #mastBtn{display:none!important}
.mast.min #courseTabs{display:flex!important}
.mast #courseTabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:2px}
.mast #courseTabs::-webkit-scrollbar{display:none}
.mast #courseTabs .btn{background:var(--surface);border-color:transparent;min-height:44px}
.mast #courseTabs .btn.on{background:var(--lime);border-color:var(--lime-3);color:var(--on-lime)}
.ai-fab{display:none!important}
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body[data-view="home"] .cols>aside{display:none}
body[data-view="home"] .cols{grid-template-columns:minmax(0,1fr)}

/* ---------- หน้าแรก ---------- */
.tr-home{display:grid;gap:16px;min-width:0}
.tr-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tr-top h1{margin:0;font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.tr-top .tr-thai{font-size:14px;color:var(--ink-3)}
.tr-top-r{display:flex;align-items:center;gap:12px}
.tr-exam{display:grid;justify-items:center;min-height:44px;padding:4px 16px;border-radius:16px;background:var(--bad-soft);color:var(--bad);line-height:1.3}
.tr-exam b{font-size:18px;font-variant-numeric:tabular-nums}
.tr-exam small{font-size:12px;font-weight:600}
.tr-hero-row{display:grid;gap:16px}
.tr-hero{display:grid;gap:16px;background:var(--lime);color:var(--on-lime);border-radius:24px;padding:20px}
.tr-hero-r{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tr-hero-t{display:grid;gap:4px;min-width:0}
.tr-kicker{font-size:14px;font-weight:500;opacity:.8}
.tr-hero h2{margin:0;font-size:24px;line-height:1.35;font-weight:600}
.tr-hero p{margin:0;font-size:14px;opacity:.85}
.tr-ring{--p:0;flex:0 0 auto;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime-3) calc(var(--p)*360deg),color-mix(in srgb,var(--surface) 55%,transparent) 0)}
.tr-ring-in{width:66px;height:66px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-content:center;text-align:center}
.tr-ring-in b{font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.tr-ring-in small{font-size:12px;color:var(--ink-3);line-height:1.3}
.tr-next{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 8px 8px 16px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.tr-next span{flex:1;min-width:0;display:grid;line-height:1.4}
.tr-next small{font-size:12px;color:var(--ink-3)}
.tr-next b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-next i{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime-2);color:#14200a;font-style:normal;font-weight:600}
.tr-week{display:none}
.tr-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tr-tile{display:grid;gap:4px;align-content:start;text-align:left;min-height:104px;padding:16px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);min-width:0;font:inherit;cursor:pointer}
.tr-tile small{font-size:12px;font-weight:600;color:var(--ink-3);line-height:1.5}
.tr-tile b{font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tr-tile b em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink-3)}
.tr-tile.warn b{color:var(--bad)}
.tr-tile.tr-desk{display:none}
.tr-whead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.tr-whead h3{margin:0;font-size:20px;line-height:1.4;font-weight:600}
.tr-whead span{font-size:14px;color:var(--ink-3)}
.tr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tr-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tr-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;text-align:left;min-width:0;min-height:184px;padding:16px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);overflow:hidden;font:inherit;cursor:pointer}
.tr-card.done{box-shadow:inset 0 4px 0 var(--lime-3)}
.tr-c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tr-c-no{font-size:24px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.tr-c-day{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:2px 8px}
.tr-c-t{font-size:16px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tr-c-bar{height:6px;border-radius:6px;background:var(--rule);overflow:hidden;margin-top:auto}
.tr-c-bar i{display:block;height:100%;background:var(--lime-3);border-radius:6px}
.tr-c-foot{display:flex;flex-wrap:wrap;gap:4px}
.tr-tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-sunk);color:var(--ink-3);white-space:nowrap}
/* ปุ่มกดว่าเรียนจบทั้งคาบ (9 พ.ย.) */
.tr-lw{display:grid;grid-template-rows:1fr auto;gap:4px;min-width:0}
.tr-lmark{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border:1px dashed var(--rule-strong);border-radius:999px;background:transparent;color:var(--ink-3);cursor:pointer;white-space:normal;text-align:center}
.tr-lmark:hover{border-color:var(--lime-3);color:var(--ink)}
.tr-lmark.on{border-style:solid;border-color:var(--lime-3);background:var(--lime);color:var(--on-lime)}
.tr-lmark.btn{border-radius:999px}
.tr-tag.go{background:var(--s-bg);color:var(--s-fg)}.tr-tag.ok{background:var(--o-bg);color:var(--o-fg)}.tr-tag.bad{background:var(--bad-soft);color:var(--bad)}
.tr-hint{font-size:14px;color:var(--ink-3);text-align:center;margin:0}
.tr-about{border-radius:20px;background:var(--surface);padding:0 16px}
.tr-about>summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:600;font-size:16px;list-style:none}
.tr-about>summary::-webkit-details-marker{display:none}
.tr-about>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);margin-right:12px;transition:transform .15s}
.tr-about[open]>summary::before{transform:rotate(45deg)}
.tr-about>div{padding:0 0 16px;font-size:14px;color:var(--ink-2)}
.press{transition:transform .15s var(--spring)}
.press:active{transform:scale(.96)}
.tr-pop{animation:trPop .32s var(--spring)}
@keyframes trPop{40%{transform:scale(1.06)}100%{transform:none}}
.tr-slide-l{animation:trSl .26s cubic-bezier(.2,.9,.25,1)}.tr-slide-r{animation:trSr .26s cubic-bezier(.2,.9,.25,1)}
@keyframes trSl{from{opacity:0;transform:translateX(28px)}}@keyframes trSr{from{opacity:0;transform:translateX(-28px)}}
.tr-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface)}
.tr-seg button{min-height:44px;border:0;border-radius:999px;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink-3);cursor:pointer}
.tr-seg button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}

/* ---------- ข้อสอบหลังอ่านจบ ---------- */
.tr-gate{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px;border-radius:20px;background:var(--lime);color:var(--on-lime);margin-top:8px}
.tr-gate b{display:block;font-size:18px;line-height:1.45}
.tr-gate span{font-size:14px;opacity:.85}
.tr-gate .btn{min-height:48px;background:var(--surface);border-color:var(--surface);color:var(--ink);font-weight:600}
.tr-qin{animation:trQin .4s cubic-bezier(.2,.9,.25,1.05)}
@keyframes trQin{from{opacity:0;transform:translateY(24px)}}

/* ---------- แถบล่างลอย ---------- */
.tr-bnav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--surface);border-radius:28px;padding:8px 4px;box-shadow:var(--tr-shadow),0 0 0 1px var(--rule);font-family:var(--sans)}
.tr-bn{position:relative;display:grid;justify-items:center;gap:2px;min-height:52px;padding:4px 0;background:none;border:0;color:var(--ink-3);font:inherit;font-size:12px;line-height:1.4;font-weight:500;cursor:pointer}
.tr-bn-ic{display:grid;place-items:center;width:28px;height:28px;transition:transform .15s var(--spring)}
.tr-bn:active .tr-bn-ic{transform:scale(.88)}
.tr-bn svg,.tr-side svg,.tr-rm-it svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tr-bn svg{width:24px;height:24px}
.tr-bn[aria-current="page"]{color:var(--ink);font-weight:600}
.tr-bn[aria-current="page"] svg{stroke-width:2.1}
.tr-bn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:16px}
.tr-main .tr-bn-ic{width:60px;height:60px;margin-top:-30px;border-radius:50%;background:var(--lime-2);color:#14200a;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--lime-3) 80%,transparent),0 0 0 6px var(--surface)}
.tr-main svg{width:28px;height:28px;stroke-width:2;transition:transform .22s var(--spring)}
.tr-main.on .tr-bn-ic{background:var(--ink);color:var(--lime-2)}
.tr-main.on svg{transform:rotate(135deg)}
.tr-main{touch-action:none}
.tr-bn .n{position:absolute;top:-6px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;font-weight:600;text-align:center;box-shadow:0 0 0 2px var(--surface)}

/* ---------- วงล้อทางลัด ---------- */
.tr-rm{position:fixed;inset:0;z-index:19;touch-action:none;-webkit-user-select:none;user-select:none;background:color-mix(in srgb,#0b0f0a 46%,transparent);-webkit-backdrop-filter:blur(10px) saturate(.9);backdrop-filter:blur(10px) saturate(.9);opacity:0;transition:opacity .2s ease;font-family:var(--sans)}
.tr-rm.on{opacity:1}.tr-rm.out{opacity:0;transition-duration:.16s}
.tr-rm-ring{position:absolute;width:340px;height:340px;margin:-170px 0 0 -170px}
.tr-rm-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tr-rm-seg{transform-box:view-box;transform-origin:0 0;transition:transform .18s var(--spring);animation:trRmIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d)}
.tr-rm-seg path{fill:color-mix(in srgb,#1d2a1a 86%,transparent);stroke:color-mix(in srgb,#a8dc5c 55%,transparent);stroke-width:1.2;transition:fill .15s,stroke .15s}
.tr-rm-seg.hl{transform:translate(var(--tx),var(--ty))}
.tr-rm-seg.hl path{fill:color-mix(in srgb,#a8dc5c 88%,#1d2a1a);stroke:#d5f0a6;stroke-width:2}
.tr-rm-seg.pick{animation:trRmPick .26s ease-out}
.tr-rm-hubc{fill:color-mix(in srgb,#141c12 90%,transparent);stroke:color-mix(in srgb,#a8dc5c 45%,transparent);stroke-width:1.2;transform-box:view-box;transform-origin:0 0;animation:trRmHub .32s var(--spring) backwards}
.tr-rm-glow{fill:none;stroke:#a8dc5c;stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .15s}
.tr-rm-glow.on{opacity:.9}
@keyframes trRmIn{from{opacity:0;transform:rotate(-28deg) scale(.55)}to{opacity:1;transform:none}}
@keyframes trRmHub{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes trRmPick{50%{transform:translate(calc(var(--tx)*2.2),calc(var(--ty)*2.2)) scale(1.04)}}
.tr-rm-it{position:absolute;left:50%;top:50%;width:76px;margin:-32px 0 0 -38px;display:grid;justify-items:center;gap:2px;padding:4px 0;border:0;background:none;color:#e6f2dc;text-align:center;font:inherit;transform:translate(var(--x),var(--y));transition:transform .18s var(--spring),color .15s;animation:trRmItIn .36s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d);pointer-events:none}
.tr-rm-it svg{width:26px;height:26px;stroke-width:1.8}
.tr-rm-it span{font-size:12px;line-height:1.3;font-weight:600;white-space:nowrap}
.tr-rm-it .n{position:absolute;top:-2px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#c2372c;color:#fff;font-size:12px;line-height:18px}
.tr-rm-it.hl{color:#14200a;transform:translate(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty)))}
.tr-rm-it.off{opacity:.45}
@keyframes trRmItIn{from{opacity:0;transform:translate(calc(var(--x)*.4),calc(var(--y)*.4)) scale(.5)}to{opacity:1}}
.tr-rm-hub{position:absolute;left:50%;top:50%;width:132px;margin-left:-66px;transform:translateY(-50%);display:grid;justify-items:center;gap:2px;text-align:center;color:#e6f2dc;pointer-events:none;animation:trRmHubT .3s .08s ease-out backwards}
.tr-rm-hub b{font-size:16px;line-height:1.35;font-weight:600}
.tr-rm-hub small{font-size:12px;line-height:1.45;color:#b6c7aa}
.tr-rm-hub .tg{font-size:12px;font-weight:600;color:#14200a;background:#a8dc5c;border-radius:999px;padding:1px 8px;margin-bottom:4px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes trRmHubT{from{opacity:0;transform:translateY(-50%) scale(.8)}}
.tr-rm-tip{position:absolute;left:16px;right:16px;text-align:center;font-size:14px;color:#dfe9d6;opacity:.85}
.tr-flash{animation:trFlash 1.1s ease-out}
@keyframes trFlash{0%,35%{box-shadow:0 0 0 3px var(--lime-3),0 0 0 9px color-mix(in srgb,var(--lime-2) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- หน้าต่างเลื่อนขึ้นจากด้านล่าง ---------- */
.tr-sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(640px,100%);max-width:none;max-height:min(86vh,760px);padding:0;border:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -12px 40px -16px rgba(10,20,5,.45);overflow:hidden;font-family:var(--sans)}
.tr-sheet[open]{display:flex;flex-direction:column;animation:trUp .32s cubic-bezier(.2,.9,.25,1)}
.tr-sheet.out{animation:trDown .18s ease-in forwards}
.tr-sheet::backdrop{background:rgba(12,16,10,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:trFade .25s ease}
@media (min-width:720px){.tr-sheet{inset:0;margin:auto;border-radius:24px}}
@keyframes trUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes trDown{to{transform:translateY(30%);opacity:0}}
@keyframes trFade{from{opacity:0}}
.tr-grab{width:40px;height:4px;border-radius:4px;background:var(--rule-strong);margin:8px auto 0;flex:0 0 auto}
.tr-sh-head{display:flex;align-items:flex-start;gap:12px;padding:12px 16px 8px}

.tr-sh-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}

.tr-sh-list button{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:16px;background:var(--surface-sunk);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.tr-sh-list .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--surface);color:var(--ink-3);font-family:var(--mono)}
.tr-sh-list .num::before{content:counter(s)}
.tr-sh-list .ok .num{background:var(--lime-2);color:#14200a}
.tr-sh-list .ok .num::before{content:"✓"}
.tr-sh-list .part .num{box-shadow:inset 0 0 0 2px var(--lime-3);color:var(--ink)}
.tr-sh-list .tt{font-size:14px;font-weight:500;line-height:1.5;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.tr-sh-foot{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.tr-sh-acts{display:flex;flex-wrap:wrap;gap:8px}
.tr-sh-foot .btn.primary{width:100%;min-height:52px;font-size:16px;justify-content:center}

/* ---------- วงล้อสลับคาบ ---------- */
.tr-wheel{position:fixed;inset:0;z-index:60;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .2s ease;font-family:var(--sans)}
.tr-wheel.on{opacity:1}.tr-wheel.out{opacity:0;transition-duration:.18s}
.tr-wh-stage{position:absolute;top:0;bottom:0;left:50%;width:min(100%,460px);transform:translateX(-50%)}
.tr-wh-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tr-wh-arc circle{fill:none;stroke:var(--rule-strong);stroke-width:1.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1) .05s}
.tr-wheel.on .tr-wh-arc circle{stroke-dashoffset:0}
.tr-wh-knob{position:absolute;width:52px;height:22px;margin:-11px 0 0 -26px;border-radius:999px;background:var(--ink);transform:scale(.3);opacity:0;transition:transform .3s var(--spring) .15s,opacity .2s .15s}
.tr-wheel.on .tr-wh-knob{transform:none;opacity:1}
.tr-wh-it{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;transform-origin:calc(100% - 36px) 50%;will-change:transform,opacity}
.tr-wh-in{display:flex;align-items:center;gap:12px;animation:trWhIn .42s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d,0ms)}
.tr-wheel.out .tr-wh-in{animation:trWhOut .18s ease-in both}
@keyframes trWhIn{from{opacity:0;transform:translateX(56px) scale(.7)}to{opacity:1;transform:none}}
@keyframes trWhOut{to{opacity:0;transform:translateX(40px) scale(.85)}}
.tr-wh-lbl{display:grid;justify-items:end;text-align:right;max-width:min(52vw,230px);color:var(--ink-3);transition:color .15s}
.tr-wh-lbl b{font-size:18px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:2px 12px;border-radius:999px;border:1px solid transparent}
.tr-wh-lbl small{font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 12px;opacity:0;transition:opacity .2s}
.tr-wh-chip{position:relative;flex:0 0 auto;width:72px;height:56px;border-radius:999px;border:2px solid transparent;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px -10px rgba(20,30,10,.35);cursor:pointer}
.tr-wh-chip .dd{position:absolute;right:-6px;top:-8px;font-family:var(--sans);font-size:12px;line-height:1;font-weight:600;padding:4px 6px;border-radius:999px;background:var(--surface-sunk);color:var(--ink-3);box-shadow:0 0 0 2px var(--paper)}
.tr-wh-chip .dd.ok{background:var(--lime-2);color:#14200a}
.tr-wh-it.cur .tr-wh-chip{outline:2px dashed var(--ink-3);outline-offset:3px}

.tr-wh-it.on .tr-wh-lbl b{background:var(--surface);border-color:var(--rule)}
.tr-wh-it.on .tr-wh-lbl small{opacity:1}
.tr-wh-it.on .tr-wh-chip{border-color:var(--lime-3);background:var(--lime);color:var(--on-lime);box-shadow:0 0 0 6px color-mix(in srgb,var(--lime-2) 30%,transparent),0 10px 24px -10px rgba(20,30,10,.45)}
.tr-wh-it.pick .tr-wh-chip{animation:trWhPick .32s var(--spring)}
@keyframes trWhPick{40%{transform:scale(1.14)}100%{transform:none}}
.tr-wh-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-size:20px;line-height:1;box-shadow:0 4px 14px -8px rgba(0,0,0,.4);cursor:pointer}
.tr-wh-head{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:72px;display:grid}
.tr-wh-head b{font-size:20px;line-height:1.4;font-weight:600}
.tr-wh-head span{font-size:14px;color:var(--ink-3)}
.tr-wh-head:has(.tr-wh-sw){z-index:1;pointer-events:none}
.tr-wh-sw{pointer-events:auto;justify-self:start;margin-top:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.tr-wh-sw:hover{background:var(--surface-sunk)}.tr-wh-sw:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tr-wh-foot{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;color:var(--ink-3)}
.tr-lp{position:fixed;z-index:59;width:72px;height:72px;margin:-36px 0 0 -36px;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.tr-lp.go{opacity:1;transform:none}
.tr-lp svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-lp circle{fill:color-mix(in srgb,var(--lime) 45%,transparent);stroke:var(--lime-3);stroke-width:5;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201}
.tr-lp.go circle{animation:trLp 1.75s linear forwards}
@keyframes trLp{to{stroke-dashoffset:0}}
body.tr-arm,body.tr-arm *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}

/* ---------- toast ---------- */
.tr-toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);max-width:min(88vw,420px);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:16px;font-family:var(--sans);font-size:16px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:90}

/* ---------- แถบซ้าย/แถบขวา/ค้นหา (คอม) ---------- */
.tr-side,.tr-dock,.tr-week,.tr-pal-btn{display:none}
.tr-pal{position:fixed;inset:0;z-index:80;display:grid;justify-items:center;align-items:start;padding-top:12vh;background:rgba(12,16,10,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:trFade .2s ease;font-family:var(--sans)}

@keyframes trPalIn{from{opacity:0;transform:translateY(-12px) scale(.98)}}

<script>
(function(){
"use strict";
var COURSES=[];
var NL={};
function ensure(set){
  var c=COURSES.filter(function(x){return x.set===set;})[0];
  if(!c||c._loaded)return Promise.resolve();
  if(!c._p)c._p=fetch(c.file,{cache:"no-cache"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(ls){c.lectures=ls;c._loaded=true;})
    .catch(function(e){c.lectures=[];c._loaded=true;c._err=String(e);});
  return c._p;
}
/* ---------- ลิงก์ตรงจาก Lecture Dashboard: #<ชุด> หรือ #<ชุด>-<คาบ> ----------
   เลขคาบที่มี / ใช้ . แทน (เช่น #gi-27.10 = คาบ 27/10 ของชุด GI) */
function slug(x){return String(x==null?"":x).replace(/[^A-Za-z0-9._~-]/g,".");}
var pendingLec=null;
function readHash(){
  var h=String(location.hash||"").replace(/^#/,"");
  if(!h)return false;
  var i=h.indexOf("-"),set=i<0?h:h.slice(0,i),lec=i<0?"":h.slice(i+1);
  if(!COURSES.some(function(c){return c.set===set;}))return false;
  state.course=set;state.view="home";state.sec=null;state.pid=null;state.lec=null;
  pendingLec=lec||null;
  return true;
}
function landHash(){
  if(!pendingLec)return;
  var want=pendingLec;pendingLec=null;
  var hit=lectures().filter(function(l){return slug(l.lec)===want;})[0];
  if(!hit)return;
  state.view="lecture";state.lec=hit.lec;render();window.scrollTo({top:0});
}
window.addEventListener("hashchange",function(){
  if(!COURSES.length||!readHash())return;
  render();window.scrollTo({top:0});
  ensure(state.course).then(function(){render();landHash();});
});
function boot(){
  Promise.all([
    fetch("data/index.json",{cache:"no-cache"}).then(function(r){return r.json();}),
    fetch("data/nl.json",{cache:"no-cache"}).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(res){
    NL=res[1];
    COURSES=res[0].map(function(meta){
      var c={};for(var k in meta)c[k]=meta[k];
      c.lectures=[];c._loaded=false;return c;
    });
    if(!COURSES.length)throw new Error("ไม่มีชุดวิชาใน data/index.json");
    if(!state.course||!COURSES.some(function(c){return c.set===state.course;}))state.course=COURSES[0].set;
    readHash();
    return ensure(state.course);
  }).then(function(){render();landHash();}).catch(function(e){
    document.getElementById("main").innerHTML=
      "<section class='card'><h2>โหลดเนื้อหาไม่สำเร็จ</h2><p class='lede'>"+
      String(e&&e.message||e)+"</p></section>";
  });
}

var KEY="med421-learn-v1";
var state={course:"",view:"home",lec:null,sec:null,pid:null,
           done:{},ans:{},notes:{},rate:{},theme:"",hide:{},log:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&typeof s==="object"){
  for(var k in state) if(k in s) state[k]=s[k];}}}catch(e){}
if(state.theme)document.documentElement.setAttribute("data-theme",state.theme);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}if(typeof syncCheck==="function")syncCheck();}
/* ---------- บันทึกความคืบหน้าในบัญชี (capability db + user) ----------
   data/users/<id>/learn = {done, ans, rate} · data/users/<id>/learn-notes = {notes}
   SYNC.sent = สิ่งที่อยู่ในบัญชีล่าสุดที่รู้ · meta.cloud = เครื่องนี้เคยซิงก์แล้ว · meta.pend = มีของในเครื่องที่ยังไม่ได้อัปโหลด */
var MKEY=KEY+":sync";
var SYNC={mode:"local",refs:null,uid:"",busy:{p:0,n:0},timer:null,first:{p:1,n:1},sent:{p:"",n:""},err:"",later:false,meta:{cloud:false,pend:false,uid:""}};
try{var mm=JSON.parse(localStorage.getItem(MKEY)||"{}");SYNC.meta.cloud=!!mm.cloud;SYNC.meta.pend=!!mm.pend;SYNC.meta.uid=typeof mm.uid==="string"?mm.uid:"";}catch(e){}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(SYNC.meta));}catch(e){}}
function trueKeys(o){var r={};if(o&&typeof o==="object")Object.keys(o).sort().forEach(function(k){if(o[k]===true)r[k]=true;});return r;}
function pick(o,ok){var r={};if(o&&typeof o==="object")Object.keys(o).sort().forEach(function(k){if(ok(o[k]))r[k]=o[k];});return r;}
function normP(o){o=o||{};return {done:trueKeys(o.done),ans:pick(o.ans,function(v){return typeof v==="number"&&v>=0&&v<10&&v===Math.floor(v);}),
  rate:pick(o.rate,function(v){return typeof v==="string"&&v.length<40;}),log:normLog(o.log)};}
/* ประวัติการทวนรายวัน {yyyy-mm-dd:[section id]} เก็บ 60 วันล่าสุด (ผู้ใช้ขอ 9 พ.ย.) */
function normLog(o){var r={};if(!o||typeof o!=="object")return r;
  Object.keys(o).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(o[k]);}).sort().slice(-60).forEach(function(k){
    var a=[];o[k].forEach(function(v){if(typeof v==="string"&&v.length<80&&a.indexOf(v)<0)a.push(v);});if(a.length)r[k]=a.slice(-200);});return r;}
function mergeLog(a,b){var r={};[a||{},b||{}].forEach(function(o){Object.keys(o).forEach(function(k){r[k]=(r[k]||[]).concat(o[k].filter(function(v){return (r[k]||[]).indexOf(v)<0;}));});});return normLog(r);}
function normN(o){o=o||{};return {notes:pick(o.notes,function(v){return v===true||(typeof v==="string"&&v.length>0);})};}
function cur(k){return JSON.stringify(k==="p"?normP(state):normN(state));}
SYNC.sent.p=cur("p");SYNC.sent.n=cur("n");
function syncCheck(){
  if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n)return;
  if(!SYNC.meta.pend){SYNC.meta.pend=true;saveMeta();}
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,700);
}
function flush(){
  SYNC.timer=null;
  if(SYNC.mode!=="cloud"||!SYNC.refs)return;
  ["p","n"].forEach(function(k){
    var c=cur(k);if(c===SYNC.sent[k]||SYNC.busy[k])return;
    if(c.length>240000){SYNC.err="โน้ตยาวเกินที่บัญชีเก็บได้ ส่วนนี้บันทึกในเครื่องนี้";renderSync();return;}
    SYNC.busy[k]=1;renderSync();
    var body=JSON.parse(c);body.v=1;body.updatedAt=new Date().toISOString();
    SYNC.refs[k].set(body).then(function(){
      SYNC.busy[k]=0;SYNC.sent[k]=c;SYNC.err="";
      if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n){SYNC.meta.pend=false;SYNC.meta.cloud=true;SYNC.meta.uid=SYNC.uid;saveMeta();}
      else{clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,300);}
      renderSync();
    },function(e){
      SYNC.busy[k]=0;var code=e&&e.code;
      if(code==="unavailable"||code==="resource_exhausted"){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,2500+Math.random()*2000);}
      else if(code==="revoked"){SYNC.mode="local";}
      else SYNC.err="บันทึกขึ้นบัญชีไม่ได้ ตอนนี้เก็บในเครื่องนี้";
      renderSync();
    });
  });
}
function adopt(k,data){
  if(k==="p"){var p=normP(data);state.done=p.done;state.ans=p.ans;state.rate=p.rate;state.log=p.log;}
  else state.notes=normN(data).notes;
}
function merge(k,data){
  if(k==="p"){var c=normP(data),l=normP(state);
    state.done=Object.assign({},c.done,l.done);state.ans=Object.assign({},l.ans,c.ans);state.rate=Object.assign({},c.rate,l.rate);state.log=mergeLog(c.log,l.log);}
  else state.notes=Object.assign({},normN(data).notes,normN(state).notes);
}
function rerender(){
  /* อย่ารีเรนเดอร์ทับช่องที่กำลังพิมพ์ */
  var a=document.activeElement;
  if(a&&a.tagName==="TEXTAREA"){SYNC.later=true;return;}
  if(COURSES.length&&course()._loaded)render();else save();
}
document.addEventListener("focusout",function(e){if(SYNC.later&&e.target&&e.target.tagName==="TEXTAREA"){SYNC.later=false;setTimeout(rerender,0);}});
function onSnap(k,snap){
  var data=snap.exists?snap.data():null;
  if(SYNC.first[k]){
    SYNC.first[k]=0;
    /* เบราว์เซอร์นี้เคยซิงก์กับบัญชีอื่น → ไม่เอาของในเครื่องไปปนกับบัญชีนี้ */
    var other=!!(SYNC.meta.uid&&SYNC.meta.uid!==SYNC.uid);
    if(!data){SYNC.sent[k]="";if(other)adopt(k,{});}
    else{
      SYNC.sent[k]=JSON.stringify(k==="p"?normP(data):normN(data));
      if(other||(SYNC.meta.cloud&&!SYNC.meta.pend))adopt(k,data);else merge(k,data);
    }
    if(!SYNC.first.p&&!SYNC.first.n){
      SYNC.mode="cloud";SYNC.meta.uid=SYNC.uid;
      if(cur("p")===SYNC.sent.p&&cur("n")===SYNC.sent.n){SYNC.meta.pend=false;SYNC.meta.cloud=true;}
      saveMeta();flush();
    }
    rerender();renderSync();return;
  }
  if(SYNC.busy[k]||SYNC.timer||snap.metadata&&snap.metadata.hasPendingWrites)return;
  var c=data?JSON.stringify(k==="p"?normP(data):normN(data)):"";
  if(!data||c===cur(k))return;
  SYNC.sent[k]=c;adopt(k,data);rerender();
}
function renderSync(){
  var el=document.getElementById("lsync");if(!el)return;
  var busy=SYNC.busy.p||SYNC.busy.n;
  el.className="lsync"+(SYNC.mode==="cloud"&&!SYNC.err?(busy?" busy":" cloud"):"");
  el.lastChild.textContent=SYNC.err||(SYNC.mode==="cloud"?(busy?"กำลังบันทึก…":"บันทึกในบัญชี"):"บันทึกในเครื่องนี้");
  el.title=SYNC.mode==="cloud"?"ความคืบหน้าบันทึกในบัญชีของคุณ เปิดเครื่องไหนก็เห็นเหมือนกัน":"ยังไม่ได้เชื่อมบัญชี ความคืบหน้าเก็บในเบราว์เซอร์เครื่องนี้";
}
