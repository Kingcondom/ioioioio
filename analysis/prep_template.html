<title>MED421 Prep Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: แบบเดียวกับ MED421 Ward Drill — หน้าแรกการ์ดเขียว + กริดระบบ, หน้าข้อสอบ แถบระบบ + การ์ดข้อ, แถบล่างลอย */
:root{
  --g-50:#eff0ec;--g-0:#ffffff;--g-100:#f6f7f3;--g-900:#151a14;--g-700:#3f463c;--g-500:#6b7268;--g-200:#e2e5de;--g-300:#d3d8cd;
  --lime:#d5f0a6;--lime-2:#a8dc5c;--lime-3:#86c43c;--on-lime:#1b2e0b;--pen:#3d7a17;
  --bg:var(--g-50);--surface:var(--g-0);--sunk:var(--g-100);--ink:var(--g-900);--ink-2:var(--g-700);--muted:var(--g-500);--line:var(--g-200);--line-2:var(--g-300);
  --ok:#3d7a17;--ok-soft:#e5f3e0;--miss:#94600f;--miss-soft:#fbf0d9;--bad:#c2372c;--bad-soft:#fdecea;--blue:#2f62a0;--blue-soft:#e6effa;--note:#fff3b0;--on-note:#3a3110;
  --focus:#2f62a0;--shadow:0 12px 32px -12px rgba(20,30,10,.35);
  --f:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --g-50:#0f110e;--g-0:#1a1d18;--g-100:#141712;--g-900:#e9ede5;--g-700:#c3cabd;--g-500:#9aa294;--g-200:#2b3027;--g-300:#3a4035;
  --lime:#2f4219;--lime-2:#8cc24a;--lime-3:#a8dc5c;--on-lime:#e8f7d2;--pen:#a8dc5c;
  --ok:#a8dc5c;--ok-soft:#1b2c15;--miss:#eab863;--miss-soft:#2f2512;--bad:#ff8b7c;--bad-soft:#3a201d;--blue:#93bdf0;--blue-soft:#18263a;--note:#3a3416;--on-note:#f3e7a8;
  --focus:#93bdf0;--shadow:0 12px 32px -12px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --g-50:#0f110e;--g-0:#1a1d18;--g-100:#141712;--g-900:#e9ede5;--g-700:#c3cabd;--g-500:#9aa294;--g-200:#2b3027;--g-300:#3a4035;
  --lime:#2f4219;--lime-2:#8cc24a;--lime-3:#a8dc5c;--on-lime:#e8f7d2;--pen:#a8dc5c;
  --ok:#a8dc5c;--ok-soft:#1b2c15;--miss:#eab863;--miss-soft:#2f2512;--bad:#ff8b7c;--bad-soft:#3a201d;--blue:#93bdf0;--blue-soft:#18263a;--note:#3a3416;--on-note:#f3e7a8;
  --focus:#93bdf0;--shadow:0 12px 32px -12px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f);padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-md)}
.wrap{max-width:900px;margin:0 auto;padding-block:var(--s-4) var(--s-5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:var(--s-4);grid-template-columns:minmax(0,1fr)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.press{transition:transform .15s cubic-bezier(.3,1.4,.5,1),background .2s,color .2s,border-color .2s}
.press:active{transform:scale(.95)}

/* ---------- หน้าแรก ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap}
.top h1{font-size:30px;line-height:1.3}
.top p{font-size:14px;color:var(--muted)}
.hero{display:grid;gap:var(--s-4);background:var(--lime);color:var(--on-lime);border-radius:var(--r-xl);padding:20px}
.hero-r{display:flex;align-items:center;justify-content:space-between;gap:var(--s-4)}
.hero h2{font-size:24px;line-height:1.35}
.hero p{font-size:14px;opacity:.85}
.ring{--p:0;flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime-3) calc(var(--p)*360deg),color-mix(in srgb,var(--surface) 55%,transparent) 0)}
.ring-in{width:66px;height:66px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-content:center;text-align:center}
.ring-in b{font:600 20px/1.2 var(--mono)}
.ring-in small{font-size:12px;color:var(--muted);line-height:1.3}
.next{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:56px;padding:8px 8px 8px 16px;border:0;border-radius:999px;background:var(--surface);text-align:left;cursor:pointer}
.next span{flex:1;min-width:0;display:grid;line-height:1.4}
.next small{font-size:12px;color:var(--muted)}
.next b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next i{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime-2);color:#14200a;font-style:normal;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3)}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:grid;gap:var(--s-1);align-content:start;text-align:left;min-height:100px;padding:var(--s-4);border:0;border-radius:20px;background:var(--surface);cursor:pointer;min-width:0}
.tile small{font-size:12px;font-weight:600;color:var(--muted);line-height:1.5}
.tile b{font:600 24px/1.2 var(--mono)}
.tile b em{font-style:normal;font-size:14px;font-weight:500;color:var(--muted)}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-3)}
.whead h3{font-size:20px}
.whead span{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scard{display:grid;gap:var(--s-2);align-content:start;text-align:left;min-width:0;min-height:160px;padding:var(--s-4);border:0;border-radius:20px;background:var(--surface);cursor:pointer}
.scard .nm{font-size:20px;line-height:1.3;font-weight:600}
.scard .th{font-size:14px;color:var(--ink-2)}
.scard .ct{font-size:14px;color:var(--muted)}
.scard .ct b{font:600 18px var(--mono);color:var(--ink)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--lime-3);border-radius:6px}
.about{border-radius:20px;background:var(--surface);padding:0 16px}
.about>summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:600;list-style:none}
.about>summary::-webkit-details-marker{display:none}
.about>div{display:grid;gap:var(--s-3);padding:0 0 16px;font-size:14px;color:var(--ink-2)}
.about ol{margin:0;padding-left:1.4em;display:grid;gap:var(--s-1)}

/* ---------- หน้าข้อสอบ ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.strip::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:8px 16px;border:0;border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--lime);color:var(--on-lime)}
.tab .n{font:500 12px var(--mono);margin-left:6px;opacity:.75}
.bar2{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;justify-content:space-between}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--surface);border-radius:999px}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime-2);color:#14200a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:none;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lime);border-color:transparent;color:var(--on-lime);font-weight:600}
.phead{display:flex;align-items:baseline;gap:var(--s-3);flex-wrap:wrap;padding:4px 4px 0}
.phead h2{font-size:20px}
.phead span{font-size:14px;color:var(--muted)}
.stream{display:grid;gap:var(--s-3)}
.item{background:var(--surface);border-radius:var(--r-xl);padding:20px;min-width:0}
.ihead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:var(--s-3)}
.qno{font:600 12px var(--mono);color:var(--on-lime);background:var(--lime);padding:4px 10px;border-radius:999px}
.tag{font-size:12px;font-weight:500;color:var(--muted);background:var(--sunk);padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.yr{font-family:var(--mono);color:var(--pen);background:var(--ok-soft)}
.tag.hot{color:var(--bad);background:var(--bad-soft);font-weight:600}
.tag.nl{color:var(--blue);background:var(--blue-soft);font-weight:600}
.topic{font-size:18px;line-height:1.45;margin-bottom:var(--s-2)}
.stem{margin-bottom:var(--s-4);max-width:70ch;overflow-wrap:anywhere}
.choices{display:grid;gap:9px;max-width:72ch}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--sunk);border:1px solid transparent;padding:12px 14px;border-radius:var(--r-lg);cursor:pointer;min-height:48px}
.choice:hover:not([disabled]){border-color:var(--line-2)}
.choice .l{font:600 12px/26px var(--mono);height:26px;text-align:center;color:var(--muted);background:var(--surface);border-radius:8px}
.choice[disabled]{cursor:default}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .l{background:var(--ok);color:var(--surface)}
.choice.miss{border-color:var(--miss);background:var(--miss-soft)}
.choice.miss .l{background:var(--miss);color:var(--surface)}
.choice.dim{opacity:.55}
.verdict{display:flex;align-items:center;gap:8px;margin-top:var(--s-4);font-size:14px;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.miss{color:var(--miss)}
.panel{margin-top:var(--s-3);background:var(--sunk);border-radius:20px;padding:16px 18px;max-width:76ch;display:grid;gap:var(--s-3)}
.panel h4{font-size:14px;font-weight:600;color:var(--pen)}
.panel .blk{display:grid;gap:var(--s-1)}
.panel .blk+.blk{padding-top:var(--s-3);border-top:1px solid var(--line)}
.md p{margin:0 0 6px}.md p:last-child{margin:0}
.md ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.md strong{font-weight:600}
.tw{overflow-x:auto;margin:4px 0}
.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--line-2);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface);font-weight:600}
.fix{background:var(--bad-soft);color:var(--bad);border-radius:var(--r-md);padding:8px 12px;font-size:14px}
.pearl{background:var(--note);color:var(--on-note);border-radius:var(--r-md);padding:8px 12px;font-size:14px;font-weight:500}
.src,.cov{font-size:12px;color:var(--muted)}
.others summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--pen);min-height:32px;display:flex;align-items:center}
.others ol{margin:var(--s-2) 0 0;padding-left:1.4em;display:grid;gap:var(--s-2);font-size:14px}
.others li span{display:block;color:var(--ok);font-weight:500}
.reveal{min-height:44px;margin-top:var(--s-3);padding:0 16px;border:1px solid var(--line-2);border-radius:999px;background:none;color:var(--pen);font-size:14px;font-weight:600;cursor:pointer}
.figs{display:flex;flex-wrap:wrap;gap:var(--s-2);margin:0 0 var(--s-4)}
.figs figure{margin:0;flex:1 1 260px;min-width:0;background:var(--sunk);border-radius:var(--r-lg);padding:8px}
.figs img{display:block;max-width:100%;max-height:420px;margin:0 auto;border-radius:var(--r-md);background:#fff;cursor:zoom-in}
.figs figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.thumbs button{display:grid;gap:4px;width:132px;padding:6px;border:0;border-radius:var(--r-md);background:var(--surface);text-align:left;cursor:pointer;font-size:12px;color:var(--muted)}
.thumbs img{width:100%;height:84px;object-fit:cover;border-radius:6px;background:#fff}
.saq{display:grid;gap:var(--s-2);margin-top:var(--s-2)}
.saq details{background:var(--sunk);border-radius:var(--r-lg);padding:0 14px}
.saq summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;list-style:none}
.saq summary::-webkit-details-marker{display:none}
.saq summary::after{content:"ดูเฉลย";margin-left:auto;font-size:12px;color:var(--pen);padding-left:8px;white-space:nowrap}
.saq details[open] summary::after{content:"ซ่อน"}
.saq details>div{padding:0 0 12px}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,12,9,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lecbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.lecbar label{font-size:14px;color:var(--muted)}
.lecbar select{min-height:44px;max-width:100%;flex:1 1 260px;min-width:0;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink);font:500 14px var(--f);padding:0 14px}
.toplink{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.toplink svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:var(--s-7) var(--s-4);text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-xl)}
.more{justify-self:center}

/* ---------- แถบล่างลอย ---------- */
.bnav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:28px;padding:8px 4px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.bn{display:grid;justify-items:center;gap:2px;min-height:52px;padding:4px 0;background:none;border:0;color:var(--muted);font-size:12px;line-height:1.4;font-weight:500;cursor:pointer}
.bn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn[aria-current="page"]{color:var(--ink);font-weight:600}
.bn[aria-current="page"] svg{stroke-width:2.2;color:var(--pen)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- หน้าบทเรียน: เทียบโพยกับหัวข้อใน MED421 learn (เพิ่ม 16 พ.ย.) ---------- */
.bnav{grid-template-columns:repeat(6,minmax(0,1fr))}
.bn{text-align:center}
.md h4.mdh{font-size:16px;line-height:1.65;font-weight:600;color:var(--pen);margin:12px 0 4px}
.md h4.mdh:first-child{margin-top:0}
.md ol{margin:0 0 6px;padding-left:1.4em;display:grid;gap:4px}
.lx-ov{border-radius:20px;background:var(--surface);padding:0 16px}
.lx-ov>summary{cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;font-weight:600;list-style:none}
.lx-ov>summary::-webkit-details-marker{display:none}
.lx-ov>summary span{font-weight:400;font-size:14px;color:var(--muted)}
.lx-ov>div{display:grid;gap:12px;padding:0 0 16px}
.lx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.lx-stat{background:var(--sunk);border-radius:var(--r-md);padding:12px;display:grid;gap:4px}
.lx-stat b{font:600 24px/1.35 var(--mono);font-variant-numeric:tabular-nums}
.lx-stat span{font-size:14px;line-height:1.6;color:var(--ink-2)}
.lx-stat.gap b{color:var(--bad)}
.lx-ov ol{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.lx-ov ol b{color:var(--ink);font-weight:600}
.lx-mix{display:flex;height:10px;border-radius:var(--r-sm);overflow:hidden;background:var(--sunk)}
.lx-mix i{display:block;height:100%}
.lx-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;line-height:1.5;color:var(--ink-2)}
.lx-leg span{display:inline-flex;align-items:center;gap:6px}
.lx-sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
:root{--lx1:#2f62a0;--lx2:#c2410c;--lx3:#7c3aed;--lx4:#0f766e;--lx5:#a16207;--lx6:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lx1:#93bdf0;--lx2:#f59a62;--lx3:#b79cfa;--lx4:#4fd1c0;--lx5:#e3b341;--lx6:#a3acb8}}
:root[data-theme="dark"]{--lx1:#93bdf0;--lx2:#f59a62;--lx3:#b79cfa;--lx4:#4fd1c0;--lx5:#e3b341;--lx6:#a3acb8}
.a-dx{background:var(--lx1)}.a-mx{background:var(--lx2)}.a-ix{background:var(--lx4)}.a-interp{background:var(--lx3)}.a-mech{background:var(--lx5)}.a-fact{background:var(--lx6)}
.lx-lec{display:grid;gap:12px}
.lx-lh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.lx-lh h3{flex:1 1 220px;min-width:0;font-size:18px;line-height:1.45}
.lx-lh .ct{font-size:14px;color:var(--muted);white-space:nowrap}
.lx-lh .ct b{font:600 18px var(--mono);color:var(--ink)}
.lx-pat{font-size:16px;color:var(--ink-2);max-width:70ch}
.lx-tip{background:var(--ok-soft);border-radius:var(--r-md);padding:12px 16px;font-size:14px;line-height:1.6}
.lx-tip b{color:var(--pen);font-weight:600}
.lx-olh{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.lx-ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.lx-sec>details>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:4px 12px;align-items:start;padding:8px;border-radius:var(--r-md)}
.lx-sec>details>summary::-webkit-details-marker{display:none}
.lx-sec>details>summary:hover{background:var(--sunk)}
.lx-sec .st{font-size:16px;line-height:1.5;font-weight:500;min-width:0}
.lx-sec .st::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted);font-size:12px;transition:transform .15s}
.lx-sec details[open] .st::before{transform:rotate(90deg)}
.lx-sec.zero .st::before{content:""}
.lx-sec.zero .st{color:var(--muted);font-weight:400}
.lx-sec.zero>details>summary{cursor:default}
.lx-sec .bar{display:flex;align-items:center;gap:8px;padding-top:6px;height:auto;background:none;overflow:visible;margin:0}
.lx-sec .bar span{flex:1;height:10px;border-radius:var(--r-sm);background:var(--sunk);overflow:hidden}
.lx-sec .bar i{display:block;height:100%;background:var(--lime-3);border-radius:var(--r-sm)}
.lx-sec .bar b{font:600 14px/1 var(--mono);min-width:2ch;text-align:right}
.lx-sec.zero .bar b{color:var(--muted)}
.lx-sec .what,.lx-sec .cold{grid-column:1/-1;padding-left:1.1em;font-size:14px;line-height:1.6;color:var(--ink-2)}

+ crepitation + ปลายเย็น = cardiogenic", "anaphylaxis = distributive"], "q": [{"q": "Cardiac tamponade causes which category of shock?", "a": "Obstructive shock", "y": [34, 35], "an": "fact", "sub": "tamponade = obstructive shock", "t": 3}, {"q": "A patient admitted with pneumonia develops fever 39 C, BP 80/45 mmHg, warm extremities and bounding pulses 2 days after starting antibiotics. What type of shock is most likely?", "a": "Septic shock", "y": [34], "an": "dx", "sub": "ปลายอุ่น ชีพจรแรง = septic shock", "t": 3}, {"q": "A patient with cardiomegaly presents with shock, heart rate 130/min and an irregularly irregular pulse, with crepitations at both lung bases and cold extremities. What type of shock is this?", "a": "Cardiogenic shock", "y": [34], "an": "dx", "sub": "AF + crepitation + ปลายเย็น = cardiogenic", "t": 3}, {"q": "Anaphylactic shock belongs to which category of shock?", "a": "Distributive shock", "y": [30], "an": "fact", "sub": "anaphylaxis = distributive", "t": 3}, {"q": "Which haemodynamic pattern fits distributive (septic) shock before fluid resuscitation?", "a": "Low systemic vascular resistance with high or normal cardiac output", "y": [30], "an": "mech", "sub": "distributive: SVR ต่ำ CO สูง", "t": 3}, {"q": "A patient has warm hands and feet, wide pulse pressure, rising creatinine and a preserved ejection fraction with high cardiac output. Which mechanism best explains the picture?", "a": "Systemic vasodilatation with high output", "y": [34], "an": "mech", "sub": "ปลายอุ่น pulse pressure กว้าง = vasodilated high-output", "t": 43}, {"q": "A patient with warm extremities, wide pulse pressure, rising creatinine and preserved ejection fraction most likely has which problem?", "a": "Vasodilated high-output state", "y": [34], "an": "mech", "sub": "vasodilated high-output state", "t": 43}]}, {"t": "ระยะของช็อก — ทำไมต้องจับให้ได้ตั้งแต่ยังไม่ความดันตก", "n": 1, "y": [33, 34], "w": "Shock นาน → AST/ALT พันกว่าแล้วลดเร็วหลังแก้ความดัน = ischemic hepatitis (รุ่น 33,34)", "c": null, "s": ["ischemic hepatitis จาก hypoperfusion"], "q": [{"q": "A patient in prolonged shock is found to have AST 1,800 U/L and ALT 1,600 U/L with normal alkaline phosphatase, which fall rapidly over 3 days after blood pressure is restored. What is the most likely diagnosis?", "a": "Ischaemic hepatitis", "y": [33, 34], "an": "dx", "sub": "ischemic hepatitis จาก hypoperfusion", "t": 14}]}, {"t": "ประเมินข้างเตียง — หน้าต่างสามบานและ JVP", "n": 4, "y": [31, 35], "w": "JVP แบนแยก hypovolemic จาก cardiogenic/obstructive; vasovagal ระหว่างเจาะปอด = BP ต่ำ + ชีพจรช้า 40", "c": null, "s": ["JVP แบน แยก hypovolemic", "neck vein แบน = volume depletion รุนแรง", "vasovagal: ความดันต่ำ + ชีพจรช้า", "vasovagal ระหว่างเจาะปอด"], "q": [{"q": "Which bedside finding best distinguishes hypovolaemic shock from cardiogenic and obstructive shock?", "a": "Flat jugular venous pressure", "y": [35], "an": "dx", "sub": "JVP แบน แยก hypovolemic", "t": 3}, {"q": "A patient with fluid loss has flattened neck veins, capillary refill of 2 seconds, and normal blood pressure and temperature. Which of these findings indicates significant (severe) volume depletion?", "a": "Flattened neck veins", "y": [31, 35], "an": "dx", "sub": "neck vein แบน = volume depletion รุนแรง", "t": 12}, {"q": "During thoracentesis a patient becomes light-headed with cold extremities. BP 80/60 mmHg, pulse 40/min, and breath sounds are equal bilaterally. What is the most likely cause?", "a": "Vasovagal reaction", "y": [31], "an": "dx", "sub": "vasovagal: ความดันต่ำ + ชีพจรช้า", "t": 13}, {"q": "During thoracentesis a patient becomes light-headed with cold extremities. Blood pressure is 80/60 mmHg and pulse rate 40/min. Breath sounds are equal on both sides. What is the most likely cause?", "a": "Vasovagal reaction", "y": [31], "an": "dx", "sub": "vasovagal ระหว่างเจาะปอด", "t": 13}]}, {"t": "การตรวจเพิ่มเติม — แล็บ ECG ภาพรังสี และ POCUS", "n": 0, "y": [], "w": null, "c": "แล็บ lactate/POCUS ในช็อกยังไม่ออก — อาจออกเป็นการแปลผล lactate ได้ในอนาคต", "s": [], "q": []}, {"t": "การให้สารน้ำ — ให้เท่าไรและรู้ได้อย่างไรว่าพอ", "n": 5, "y": [30, 32, 33, 35], "w": "ขาดน้ำ/hypovolemic shock ± Na 105–122 → 0.9% NSS bolus (ไม่ใช่ hypertonic) — โจทย์ซ้ำจากฝั่ง nephro รุ่น 30–35", "c": null, "s": ["hypovolemia → NSS bolus", "hypovolemic + Na ต่ำ → 0.9% NSS", "hypovolemic hyponatremia → 0.9% NSS", "hypovolemic shock + Na 112 → isotonic"], "q": [{"q": "A hypotensive patient has flat neck veins, dry mucous membranes, poor skin turgor and a history of profuse diarrhoea. What is the most appropriate initial management?", "a": "Intravenous normal saline bolus", "y": [32, 35], "an": "mx", "sub": "hypovolemia → NSS bolus", "t": 12}, {"q": "A patient with severe vomiting and diarrhoea has BP 85/50 mmHg, Na 120 mEq/L, BUN 40 mg/dL and creatinine 1.8 mg/dL. What is the most appropriate initial fluid?", "a": "0.9% normal saline", "y": [33], "an": "mx", "sub": "hypovolemic + Na ต่ำ → 0.9% NSS", "t": 12}, {"q": "A patient with vomiting for 3 days has Na 105 mEq/L, dry mucous membranes, flat neck veins and BP 90/60 mmHg without seizure or coma. What fluid should be given?", "a": "0.9% normal saline", "y": [35], "an": "mx", "sub": "hypovolemic hyponatremia → 0.9% NSS", "t": 12}, {"q": "A patient with hypovolaemic shock has Na 112 mEq/L with elevated BUN and creatinine. What is the initial treatment?", "a": "Isotonic saline", "y": [30, 33], "an": "mx", "sub": "hypovolemic shock + Na 112 → isotonic", "t": 12}, {"q": "A dehydrated patient has Na 122 mEq/L and K 5.8 mEq/L with postural hypotension. What is the most appropriate initial fluid?", "a": "0.9% normal saline", "y": [32], "an": "mx", "sub": "ขาดน้ำ Na ต่ำ K สูง → NSS", "t": 12}]}, {"t": "ยากระตุ้นหลอดเลือด ยาเพิ่มแรงบีบหัวใจ และการช่วยหายใจ", "n": 0, "y": [], "w": null, "c": "Vasopressor/inotrope (norepinephrine first-line, dobutamine) ไม่มีข้อถามเลย แม้เป็นเนื้อหาหลักในการดูแลจริง — ควรรู้เผื่อออกใหม่", "s": [], "q": []}, {"t": "การรักษาจำเพาะตามสาเหตุ เป้าหมาย และสี่ระยะของการกู้ชีพ", "n": 4, "y": [30, 31, 33, 34, 35], "w": "Anaphylaxis = type I IgE/mast cell → IM adrenaline 0.3–0.5 mg ทันที และให้ adrenaline auto-injector ตอนกลับบ้าน; arrhythmia ที่ทำให้ช็อก → synchronized cardioversion; ถามแทบทุกรุ่น 30–35", "c": null, "s": ["arrhythmia ทำให้ช็อก → synchronized cardioversion", "anaphylaxis → IM adrenaline", "type I IgE hypersensitivity", "discharge: adrenaline auto-injector"], "q": [{"q": "A hypotensive patient has an irregularly irregular tachycardia at 150/min, elevated JVP and cold clammy skin. Which is the most appropriate immediate treatment?", "a": "Synchronised cardioversion", "y": [30, 31], "an": "mx", "sub": "arrhythmia ทำให้ช็อก → synchronized cardioversion", "t": 9}, {"q": "A woman develops generalised urticaria, wheeze and BP 80/50 mmHg minutes after dinner. What is the most appropriate initial treatment?", "a": "Intramuscular adrenaline", "y": [31, 33, 35], "an": "mx", "sub": "anaphylaxis → IM adrenaline", "t": 11}, {"q": "Urticaria and anaphylaxis are which type of hypersensitivity reaction?", "a": "Type I (IgE-mediated)", "y": [34, 35], "an": "mech", "sub": "type I IgE hypersensitivity", "t": 11}, {"q": "A patient who survived anaphylactic shock is being discharged. What is the most important item to provide?", "a": "An adrenaline auto-injector with training and a written action plan", "y": [34], "an": "mx", "sub": "discharge: adrenaline auto-injector", "t": 11}]}], "th": [3, 43, 14, 13, 12]}, {"lec": "13", "title": "Ischemic heart disease — ตั้งแต่ CCS ถึง STEMI", "n": 24, "angle": {"mech": 3, "dx": 3, "ix": 4, "mx": 5, "interp": 6, "fact": 3}, "pattern": "Dominant angle คือการอ่าน ECG STEMI แบบบอกตำแหน่งผนังและหลอดเลือด (รวม posterior/right-sided lead) ตามด้วยการเลือก reperfusion และแยก stable angina/UA/NSTEMI จาก ECG + troponin; โจทย์ส่วนใหญ่สั้น ซ้ำรุ่น 29–35 ส่วน hs-troponin 0h/1h, DAPT+OAC ยังไม่ถูกทดสอบ", "tip": "ฝึกอ่าน ECG STEMI ให้คล่อง (territory, reciprocal, posterior, V4R) และจำเวลาเป้าหมาย PCI 120 นาที/fibrinolysis + เกณฑ์สำเร็จ ST ลด > 50% ก่อนเรื่องอื่น แล้วค่อยเก็บ UA vs NSTEMI และยา secondary prevention", "secs": [{"t": "CAD เป็นโรคเรื้อรังที่วนเข้าออกหลายระยะ", "n": 1, "y": [31, 33], "w": null, "c": null, "s": ["plaque rupture + thrombus"], "q": [{"q": "What is the most common underlying mechanism of ST-elevation myocardial infarction?", "a": "Plaque rupture with superimposed thrombus", "y": [31, 33], "an": "mech", "sub": "plaque rupture + thrombus", "t": 16}]}, {"t": "Chronic coronary syndrome — step approach และ pretest probability", "n": 3, "y": [32, 35], "w": "เจ็บอกตอนออกแรงหายเมื่อพัก = stable angina (fixed stenosis supply-demand); เจ็บอก → ตรวจแรก 12-lead ECG", "c": null, "s": ["fixed stenosis supply-demand mismatch", "stable angina", "เจ็บอก → 12-lead ECG ก่อน"], "q": [{"q": "What is the mechanism of chest pain that occurs on exertion and resolves with rest in stable coronary disease?", "a": "Fixed stenosis with supply-demand mismatch", "y": [35], "an": "mech", "sub": "fixed stenosis supply-demand mismatch", "t": 16}, {"q": "A 58-year-old man has retrosternal tightness on exertion for 3 months that resolves within 5 minutes of rest. ECG, troponin and chest radiograph at rest are normal. What is the most likely diagnosis?", "a": "Stable angina", "y": [35], "an": "dx", "sub": "stable angina", "t": 17}, {"q": "A patient presents with exertional dyspnoea and chest discomfort. What is the most appropriate first investigation?", "a": "12-lead electrocardiogram", "y": [32], "an": "ix", "sub": "เจ็บอก → 12-lead ECG ก่อน", "t": 20}]}, {"t": "CCS — การรักษาด้วยยาและการป้องกันเหตุการณ์", "n": 2, "y": [31, 34], "w": "Angina กับหลอดเลือดปกติ = microvascular dysfunction; ห้าม short-acting nifedipine (reflex tachycardia)", "c": null, "s": ["coronary microvascular dysfunction", "ห้าม short-acting nifedipine"], "q": [{"q": "A patient with typical angina has normal epicardial coronary arteries on angiography. What is the most likely explanation?", "a": "Coronary microvascular dysfunction with supply-demand mismatch", "y": [34], "an": "mech", "sub": "coronary microvascular dysfunction", "t": 16}, {"q": "Which statement about the management of chronic stable angina is correct?", "a": "Short-acting nifedipine should not be used because reflex tachycardia may worsen ischaemia", "y": [31], "an": "mx", "sub": "ห้าม short-acting nifedipine", "t": 21}]}, {"t": "ACS — นิยามและการแบ่งสามกลุ่ม", "n": 1, "y": [30, 31, 34], "w": null, "c": null, "s": ["crescendo/rest pain = ACS"], "q": [{"q": "Which chest pain pattern is most consistent with acute coronary syndrome?", "a": "Crescendo pain at rest with diaphoresis", "y": [30, 31, 34], "an": "dx", "sub": "crescendo/rest pain = ACS", "t": 17}]}, {"t": "STEMI — เกณฑ์ ECG ที่ต้องจำตัวเลขให้แม่น", "n": 7, "y": [29, 31, 33, 35], "w": "อ่าน ECG STEMI บอกผนัง/หลอดเลือด: V1–V4 = anterior/LAD, II III aVF + reciprocal I aVL = inferior → ทำ V3R/V4R, ST กด + R สูง V1–V3 = posterior; ถาม 4 รุ่น (29,31,33,35)", "c": null, "s": ["ST ยก V1–V4 + reciprocal = anterior MI", "inferior STEMI → right-sided leads V4R", "V1–V4 = anterior wall, LAD", "anterolateral STEMI"], "q": [{"q": "A patient with a pleural effusion has an ECG showing ST elevation in leads V1 to V4 with reciprocal ST depression inferiorly and elevated troponin. What is the most likely cause of the ECG change?", "a": "Anterior wall myocardial infarction", "y": [33], "an": "interp", "sub": "ST ยก V1–V4 + reciprocal = anterior MI", "t": 4}, {"q": "An ECG shows ST elevation in leads II, III and aVF. Which additional leads should be recorded?", "a": "Right-sided leads V3R and V4R", "y": [35], "an": "ix", "sub": "inferior STEMI → right-sided leads V4R", "t": 4}, {"q": "ST elevation in leads V1 to V4 corresponds to infarction of which wall and which artery?", "a": "Anterior wall — left anterior descending artery", "y": [31, 33], "an": "fact", "sub": "V1–V4 = anterior wall, LAD", "t": 4}, {"q": "A 60-year-old woman with diabetes, dyslipidaemia and known coronary disease has 10 minutes of chest tightness. ECG shows ST elevation in I, aVL and V2-V6 with reciprocal depression in II, III and aVF, and troponin-I is 8 ng/mL. What is the diagnosis?", "a": "Anterolateral STEMI", "y": [31], "an": "interp", "sub": "anterolateral STEMI", "t": 4}, {"q": "An ECG shows ST elevation in II, III and aVF with reciprocal ST depression in I and aVL, rate 75/min, sinus rhythm and narrow QRS. What is the complete interpretation?", "a": "Sinus rhythm with inferior STEMI", "y": [29, 33], "an": "interp", "sub": "inferior STEMI + reciprocal I, aVL", "t": 4}, {"q": "A 60-year-old man with dyspnoea has an ECG showing ST elevation in II, III, aVF and V4–V6 with ST depression in aVL and V1–V3. What is the diagnosis?", "a": "Acute inferolateral STEMI with posterior extension", "y": [29], "an": "interp", "sub": "inferolateral + posterior extension", "t": 4}, {"q": "A 62-year-old man has chest pain. His ECG shows ST elevation in II, III and aVF and V5-V6, with ST depression and tall R waves in V1-V3 and ST depression in aVL. What is the diagnosis?", "a": "Acute inferoposterior (and lateral) ST-elevation myocardial infarction", "y": [33], "an": "interp", "sub": "posterior MI: ST กด + R สูง V1–V3", "t": 4}]}, {"t": "STEMI — การเปิดหลอดเลือดและเวลาเป้าหมาย", "n": 3, "y": [30, 32, 34, 35], "w": "STEMI ถึง PCI ได้ใน 120 นาที → primary PCI; PCI ดีกว่า fibrinolysis เพราะเปิดหลอดเลือดได้ดีกว่า reinfarction/bleeding น้อยกว่า (รุ่น 30,32,34,35)", "c": null, "s": ["ถึง PCI ใน 120 นาที → primary PCI", "definitive = reperfusion", "primary PCI ดีกว่า fibrinolysis"], "q": [{"q": "A patient with ST elevation in V1-V4 and elevated troponin-T can reach a PCI-capable centre within 120 minutes of first medical contact. What is the most appropriate reperfusion strategy?", "a": "Transfer for primary percutaneous coronary intervention", "y": [30, 34], "an": "mx", "sub": "ถึง PCI ใน 120 นาที → primary PCI", "t": 15}, {"q": "A patient with acute coronary syndrome has been given aspirin, a P2Y12 inhibitor, anticoagulant, statin and nitrate. What is the definitive next step in STEMI?", "a": "Reperfusion therapy — primary PCI or fibrinolysis", "y": [32], "an": "mx", "sub": "definitive = reperfusion", "t": 15}, {"q": "Why is primary PCI preferred over fibrinolysis when both are available within the recommended time?", "a": "Better patency with less reinfarction and bleeding", "y": [34, 35], "an": "fact", "sub": "primary PCI ดีกว่า fibrinolysis", "t": 15}]}, {"t": "STEMI — ยาละลายลิ่มเลือด", "n": 1, "y": [35], "w": null, "c": null, "s": ["ST resolution > 50% หลัง fibrinolysis"], "q": [{"q": "A patient with an anterolateral STEMI is treated with fibrinolysis. Which finding best indicates successful reperfusion at 90 minutes?", "a": "More than 50% ST-segment resolution", "y": [35], "an": "interp", "sub": "ST resolution > 50% หลัง fibrinolysis", "t": 15}]}, {"t": "NSTE-ACS — การวินิจฉัยด้วย hs-troponin", "n": 3, "y": [31, 33, 34, 35], "w": "ECG ไม่ยก troponin ปกติ = unstable angina; troponin แรกปกติ → ทำ ECG/troponin ซ้ำ; ECG ภายใน 10 นาที", "c": null, "s": ["troponin ปกติ ECG ไม่ยก = UA", "troponin ซ้ำ (serial ECG/hs-cTn)", "ECG 12 lead ภายใน 10 นาที"], "q": [{"q": "A patient has typical chest pain at rest for 20 minutes with dyspnoea. ECG shows no ST elevation and troponin is normal. What is the most likely diagnosis?", "a": "Unstable angina", "y": [31, 34], "an": "dx", "sub": "troponin ปกติ ECG ไม่ยก = UA", "t": 17}, {"q": "A patient with ongoing chest pain has a normal ECG and normal initial troponin-I taken 1 hour after pain onset. What is the most appropriate next step?", "a": "Repeat ECG and troponin serially over the next few hours", "y": [33, 35], "an": "ix", "sub": "troponin ซ้ำ (serial ECG/hs-cTn)", "t": 17}, {"q": "A 60-year-old woman has had dyspnoea and anginal chest pain for 1 hour. JVP 7 cm above the sternal angle, pulse 112/min totally irregular, crepitations at both lung bases and bilateral leg oedema. What is the most appropriate initial investigation?", "a": "12-lead ECG", "y": [35], "an": "ix", "sub": "ECG 12 lead ภายใน 10 นาที", "t": 20}]}, {"t": "NSTE-ACS — แบ่งความเสี่ยงและเวลาที่ต้องสวนหลอดเลือด", "n": 1, "y": [34], "w": null, "c": null, "s": ["high-risk: troponin ขึ้น/GRACE > 140 → สวนใน 24 ชม."], "q": [{"q": "Which feature identifies a high-risk non-ST-elevation acute coronary syndrome requiring early invasive strategy within 24 hours?", "a": "Rising troponin or GRACE above 140", "y": [34], "an": "fact", "sub": "high-risk: troponin ขึ้น/GRACE > 140 → สวนใน 24 ชม.", "t": 17}]}, {"t": "ยาต้านเกล็ดเลือดและยาต้านการแข็งตัวของเลือดใน ACS", "n": 0, "y": [], "w": null, "c": "DAPT ระยะเวลา, P2Y12 ตัวไหน, ผู้ป่วยที่ต้องกิน OAC ร่วม (triple therapy) ยังไม่เคยถาม — เนื้อหาแนวทางใหม่ที่อาจออก", "s": [], "q": []}, {"t": "หลังรอดจาก MI — ยาและการปรับวิถีชีวิต", "n": 2, "y": [33, 35], "w": "Secondary prevention หลัง MI = DAPT + statin + BB + ACEI; ข้อบ่งชี้ high-intensity statin ใน ASCVD", "c": null, "s": ["ข้อบ่งชี้ high-intensity statin (ASCVD)", "DAPT + statin + BB + ACEI"], "q": [{"q": "Which patient has the clearest indication for high-intensity statin therapy?", "a": "A 60-year-old man 2 weeks after an acute ischaemic stroke of atherosclerotic origin", "y": [33], "an": "mx", "sub": "ข้อบ่งชี้ high-intensity statin (ASCVD)", "t": 19}, {"q": "After reperfusion, which combination is standard long-term secondary prevention following myocardial infarction?", "a": "DAPT, statin, beta-blocker and ACE inhibitor", "y": [35], "an": "mx", "sub": "DAPT + statin + BB + ACEI", "t": 23}]}], "th": [16, 20, 21, 4, 15, 17, 23]}, {"lec": "24", "title": "Atrial fibrillation", "n": 17, "angle": {"mech": 3, "dx": 6, "fact": 2, "ix": 1, "mx": 4, "interp": 1}, "pattern": "ถามเชิงวินิจฉัยเป็นหลัก — จำ AF จากชีพจร/ECG และหาสาเหตุที่แก้ได้ (ต่อมไทรอยด์, สุรา) ส่วนการรักษาถามแค่ระดับพื้นฐาน (beta-blocker คุม rate, cardioversion เมื่อ unstable, warfarin ใน MS+AF) กระจายรุ่น 30–35 ด้วยจำนวนน้อยต่อหัวข้อ", "tip": "เตรียม AF แบบ 'รู้จัก → หาเหตุ (TFT, alcohol) → stable/unstable → CHA2DS2-VASc + เลือก warfarin vs NOAC (MS/ลิ้นเทียม = warfarin)' ให้ครบ; เนื้อหา rhythm control และ warfarin-INR เก็บเผื่อออกใหม่", "secs": [{"t": "AF คืออะไร และทำไมต้องสนใจ", "n": 2, "y": [31, 32], "w": "กลไก stroke ใน AF/flutter = ลิ่มเลือดใน LA/LAA หลุดไปอุด (รุ่น 31,32)", "c": null, "s": ["กลไก stroke: ลิ่มเลือดใน LA/LAA", "flutter/AF → LA thrombus embolism"], "q": [{"q": "A 72-year-old man with atrial fibrillation at 130/min develops acute hemiparesis and hypotension. What is the most likely mechanism of the neurological event?", "a": "Cardioembolism from the left atrium", "y": [32], "an": "mech", "sub": "กลไก stroke: ลิ่มเลือดใน LA/LAA", "t": 10}, {"q": "A patient with atrial flutter develops an embolic stroke. What is the underlying mechanism?", "a": "Left atrial thrombus with embolisation", "y": [31], "an": "mech", "sub": "flutter/AF → LA thrombus embolism", "t": 10}]}, {"t": "โรคที่สัมพันธ์กับ AF — ต้องหาสาเหตุเสมอ", "n": 5, "y": [30, 31, 32, 35], "w": "หาสาเหตุ AF: thyrotoxicosis/thyroid storm (ไข้ HF AF เร็ว TSH ต่ำ), holiday heart หลังดื่มสุรา, ใจสั่น → ECG + TFT (รุ่น 30,31,32,35)", "c": null, "s": ["holiday heart (alcohol)", "hyperthyroidism → AF", "thyroid storm + AF", "ใจสั่น → ECG + TFT"], "q": [{"q": "A 45-year-old man has palpitations every Monday after weekend drinking. ECG during symptoms shows atrial fibrillation that terminates spontaneously. What is the most likely precipitant?", "a": "Alcohol", "y": [31], "an": "dx", "sub": "holiday heart (alcohol)", "t": 27}, {"q": "Untreated hyperthyroidism most characteristically precipitates which arrhythmia?", "a": "Atrial fibrillation", "y": [31], "an": "fact", "sub": "hyperthyroidism → AF", "t": 27}, {"q": "A patient has fever 39 C, heart failure, atrial fibrillation with rapid ventricular response, agitation and suppressed TSH with high free T4. What is the diagnosis?", "a": "Thyroid storm", "y": [35], "an": "dx", "sub": "thyroid storm + AF", "t": 27}, {"q": "A patient presents with palpitations and an otherwise normal examination. Which two investigations are most appropriate first?", "a": "12-lead ECG and thyroid function test", "y": [32], "an": "ix", "sub": "ใจสั่น → ECG + TFT", "t": 27}, {"q": "An ECG shows sinus tachycardia in a patient with weight loss, tremor and heat intolerance. What is the most likely diagnosis?", "a": "Thyrotoxicosis", "y": [30], "an": "dx", "sub": "sinus tachy + อาการ thyrotoxicosis", "t": 27}]}, {"t": "อาการของ AF — stable หรือ unstable", "n": 4, "y": [31, 34, 35], "w": "ชีพจรไม่สม่ำเสมอ + pulse deficit; AF RVR ทำให้ HF/หมดสติจาก CO ต่ำ; AF unstable → synchronized cardioversion (รุ่น 31,34,35)", "c": null, "s": ["AF unstable → synchronized cardioversion", "irregularly irregular + pulse deficit", "AF RVR ใน HF", "syncope จาก CO ต่ำ (RVR)"], "q": [{"q": "A patient with palpitations and dyspnoea has no palpable pulse but is conscious and talking. The monitor shows atrial fibrillation with a rapid ventricular response. What should be done?", "a": "Synchronised cardioversion if unstable", "y": [31], "an": "mx", "sub": "AF unstable → synchronized cardioversion", "t": 9}, {"q": "What is the characteristic physical finding of atrial fibrillation?", "a": "Irregularly irregular pulse with pulse deficit", "y": [34], "an": "dx", "sub": "irregularly irregular + pulse deficit", "t": 25}, {"q": "A patient with known heart failure develops palpitations with an irregular tachycardia at 150/min and worsening dyspnoea. What is the most likely arrhythmia?", "a": "Atrial fibrillation with rapid ventricular rate", "y": [31], "an": "dx", "sub": "AF RVR ใน HF", "t": 25}, {"q": "An 80-year-old man has palpitations followed by transient loss of consciousness. BP 140/90 mmHg, pulse irregular 110-160/min. What is the most likely cause of the syncope?", "a": "Low cardiac output from rapid arrhythmia", "y": [35], "an": "mech", "sub": "syncope จาก CO ต่ำ (RVR)", "t": 25}]}, {"t": "วินิจฉัยด้วย ECG — สามเกณฑ์ และอุปกรณ์คัดกรอง", "n": 2, "y": [32], "w": "ECG ไม่มี P + RR ไม่สม่ำเสมอ = AF RVR; tachy-brady = sick sinus syndrome (รุ่น 32)", "c": null, "s": ["ไม่มี P, RR ไม่สม่ำเสมอ", "tachy-brady = sick sinus syndrome"], "q": [{"q": "An ECG shows an irregularly irregular rhythm with absent P waves and a ventricular rate of 130/min. What is the interpretation?", "a": "Atrial fibrillation with rapid ventricular response", "y": [32], "an": "interp", "sub": "ไม่มี P, RR ไม่สม่ำเสมอ", "t": 25}, {"q": "An elderly patient with tachy-brady syndrome has an irregularly irregular pulse alternating with pauses and dizziness. What is the underlying problem?", "a": "Sick sinus syndrome", "y": [32], "an": "dx", "sub": "tachy-brady = sick sinus syndrome", "t": 26}]}, {"t": "ระยะของ AF และการประเมินแรกรับ", "n": 0, "y": [], "w": null, "c": "ระยะ AF (paroxysmal/persistent/permanent) และ EHRA score ไม่เคยถาม", "s": [], "q": []}, {"t": "A — ประเมินความเสี่ยง stroke: CHA₂DS₂-VASc และ CHA₂DS₂-VA", "n": 1, "y": [35], "w": "ใช้ CHA2DS2-VASc ตัดสินให้ยาต้านการแข็งตัว (รุ่น 35)", "c": null, "s": ["CHA2DS2-VASc"], "q": [{"q": "Which score should be used to decide on anticoagulation for stroke prevention in non-valvular atrial fibrillation?", "a": "CHA2DS2-VASc score", "y": [35], "an": "fact", "sub": "CHA2DS2-VASc", "t": 10}]}, {"t": "เลือกยาต้านการแข็งตัว: warfarin หรือ NOAC", "n": 1, "y": [30], "w": null, "c": null, "s": ["MS + AF → warfarin INR 2–3 (ห้าม NOAC)"], "q": [{"q": "A patient with rheumatic mitral stenosis and atrial fibrillation develops sudden right hemiparesis. Which anticoagulant is indicated?", "a": "Warfarin with INR 2 to 3", "y": [30], "an": "mx", "sub": "MS + AF → warfarin INR 2–3 (ห้าม NOAC)", "t": 10}]}, {"t": "Warfarin ในชีวิตจริง — ปรับขนาดตาม INR และจัดการ INR สูง", "n": 0, "y": [], "w": null, "c": "ปรับ warfarin ตาม INR และจัดการ INR สูง/เลือดออก (vitamin K, FFP) ยังไม่ออก แต่เป็นทักษะ ward ที่น่าออก", "s": [], "q": []}, {"t": "B — Rate control: เป้า < 110 และเลือกยาตามโรคร่วม", "n": 2, "y": [32, 33], "w": "Rate control AF ที่ BP ปกติไม่มี HF → beta-blocker (metoprolol); แยกยาคุมอาการออกจากยากันลิ่มเลือด", "c": null, "s": ["rate control: beta-blocker", "ยาคุม rate/rhythm vs ยากันลิ่มเลือด"], "q": [{"q": "A 70-year-old man with atrial fibrillation at 140/min, stable blood pressure and no heart failure needs rate control. Which drug is most appropriate first?", "a": "A beta-blocker such as metoprolol", "y": [33], "an": "mx", "sub": "rate control: beta-blocker", "t": 24}, {"q": "Which drug controls symptoms of atrial fibrillation by controlling rate or rhythm rather than preventing stroke?", "a": "Atenolol or amiodarone", "y": [32], "an": "mx", "sub": "ยาคุม rate/rhythm vs ยากันลิ่มเลือด", "t": 24}]}, {"t": "B — Rhythm control: cardioversion และการคงจังหวะปกติ", "n": 0, "y": [], "w": null, "c": "Rhythm control: cardioversion ต้อง anticoagulate 3 สัปดาห์/TEE, amiodarone — ไม่มีข้อถามตรง", "s": [], "q": []}, {"t": "C — โรคร่วมและวิถีชีวิต และบทสรุปทั้งคาบ", "n": 0, "y": [], "w": null, "c": "โรคร่วมและวิถีชีวิต (AF-CARE/ABC) เป็นเนื้อหาแนวทางใหม่ ยังไม่ถูกทดสอบ", "s": [], "q": []}], "th": [10, 27, 25, 24]}, {"lec": "27", "title": "Valvular heart disease และ acute rheumatic fever", "n": 31, "angle": {"dx": 19, "fact": 4, "interp": 1, "mx": 4, "ix": 2, "mech": 1}, "pattern": "Lecture ที่มีข้อมากที่สุดในกลุ่ม ข้อสอบเกือบทั้งหมดเป็นวินิจฉัยลิ้นหัวใจจากลักษณะ murmur/ชีพจร (MS, AR, AS, MR/MVP, PDA, ASD, VSR) และ IE (signs, culture, เชื้อ, ยา, prophylaxis) ซ้ำต่อเนื่องรุ่น 28–35; เกณฑ์ผ่าตัดตาม guideline เริ่มปรากฏในรุ่น 35", "tip": "ทำตาราง murmur ↔ โรค ↔ ลักษณะชีพจร ให้จำแบบ spot diagnosis และท่อง IE ครบชุด (Duke, Osler vs Janeway/Roth, blood culture 3 ชุด, viridans → penicillin G 4 สัปดาห์, prophylaxis clindamycin/amoxicillin) — ครอบคลุมเกือบทุกข้อ", "secs": [{"t": "ตรวจร่างกายลิ้นหัวใจ — ดู คลำ เคาะ ฟัง", "n": 0, "y": [], "w": null, "c": "เทคนิคตรวจร่างกายลิ้นหัวใจ (ดู คลำ เคาะ ฟัง) ถูกประเมินผ่านโจทย์ murmur แต่ไม่ถามตรง", "s": [], "q": []}, {"t": "แยก murmur ตามจังหวะและรูปแบบ", "n": 5, "y": [31, 32, 35], "w": "Murmur spot: continuous machinery = PDA, fixed split S2 = ASD, pansystolic + thrill LLSB หลัง MI = VSR, P2 ดัง + right HF ปอดใส = pulmonary HT", "c": null, "s": ["murmur ใหม่หลัง MI: septal/papillary rupture", "VSR: pansystolic + thrill LLSB หลัง MI", "continuous machinery murmur = PDA", "fixed split S2 = ASD"], "q": [{"q": "Three days after an inferior STEMI a patient develops acute dyspnoea, hypotension and a new loud pansystolic murmur with a thrill at the lower sternal border. What is the most likely complication?", "a": "Papillary muscle or septal rupture", "y": [31], "an": "dx", "sub": "murmur ใหม่หลัง MI: septal/papillary rupture", "t": 18}, {"q": "Three days after an acute myocardial infarction a patient develops a new pansystolic murmur at the lower left sternal border with a thrill and acute pulmonary oedema. What is the most likely cause?", "a": "Ventricular septal rupture", "y": [35], "an": "dx", "sub": "VSR: pansystolic + thrill LLSB หลัง MI", "t": 18}, {"q": "A continuous machinery murmur heard below the left clavicle in a young adult suggests which lesion?", "a": "Patent ductus arteriosus", "y": [32], "an": "dx", "sub": "continuous machinery murmur = PDA", "t": 32}, {"q": "A patient has right atrial and right ventricular enlargement with a fixed widely split S2 and a systolic murmur at the left upper sternal border. What is the most likely diagnosis?", "a": "Atrial septal defect", "y": [35], "an": "dx", "sub": "fixed split S2 = ASD", "t": 32}, {"q": "A patient has a loud P2, elevated JVP, hepatomegaly and leg oedema with clear lungs. What is the most likely diagnosis?", "a": "Pulmonary hypertension", "y": [31, 32], "an": "dx", "sub": "P2 ดัง + right HF = pulmonary HT", "t": 33}]}, {"t": "Mitral stenosis — กลไก อาการ และการตรวจร่างกาย", "n": 4, "y": [30, 31, 32, 33, 34], "w": "Mitral stenosis: opening snap + diastolic rumble ที่ apex นอนตะแคงซ้าย + S1 ดัง; ผลระยะยาวของ RHD ที่พบบ่อยสุดในไทย; ซ้ำ 5 รุ่น (30–34)", "c": null, "s": ["opening snap + diastolic rumble", "อาการแสดงที่ไม่ใช่ MS", "diastolic rumble apex + S1 ดัง", "RHD → MS พบบ่อยสุดในไทย"], "q": [{"q": "Which physical finding is consistent with mitral stenosis?", "a": "An opening snap followed by a diastolic rumbling murmur at the apex", "y": [31], "an": "dx", "sub": "opening snap + diastolic rumble", "t": 28}, {"q": "Which finding is NOT a sign of mitral stenosis?", "a": "Ejection systolic murmur", "y": [32], "an": "dx", "sub": "อาการแสดงที่ไม่ใช่ MS", "t": 28}, {"q": "A patient has a low-pitched diastolic rumbling murmur heard best at the apex in the left lateral decubitus position, with a loud S1. What is the diagnosis?", "a": "Mitral stenosis", "y": [30, 32, 33], "an": "dx", "sub": "diastolic rumble apex + S1 ดัง", "t": 28}, {"q": "Which valve lesion is the most common long-term sequela of acute rheumatic fever in Thailand?", "a": "Mitral stenosis", "y": [30, 34], "an": "fact", "sub": "RHD → MS พบบ่อยสุดในไทย", "t": 28}]}, {"t": "Mitral stenosis — การตรวจ ความรุนแรง และการรักษา (อัปเดต ESC/EACTS 2025)", "n": 2, "y": [28, 34], "w": null, "c": null, "s": ["echo mean gradient → MS รุนแรง", "MS + AF"], "q": [{"q": "Echocardiography in a patient with a murmur shows a thickened mitral valve with restricted opening and a mean gradient of 12 mmHg. What is the diagnosis?", "a": "Significant mitral stenosis", "y": [28], "an": "interp", "sub": "echo mean gradient → MS รุนแรง", "t": 28}, {"q": "A 40-year-old woman has 1 month of exertional dyspnoea and orthopnoea, an irregularly irregular pulse, a loud S1 with an opening snap and a diastolic rumble at the apex. What is the most likely complete diagnosis?", "a": "Mitral stenosis with AF", "y": [34], "an": "dx", "sub": "MS + AF", "t": 28}]}, {"t": "Mitral regurgitation และ mitral valve prolapse", "n": 2, "y": [31, 34], "w": null, "c": null, "s": ["pansystolic apex → axilla", "mid-systolic click (MVP)"], "q": [{"q": "A patient has a pansystolic murmur at the apex radiating to the axilla, with bilateral leg oedema and lung crepitations. What is the diagnosis?", "a": "Mitral regurgitation", "y": [31], "an": "dx", "sub": "pansystolic apex → axilla", "t": 31}, {"q": "A young woman has a mid-systolic click followed by a late systolic murmur that moves earlier on standing. What is the diagnosis?", "a": "Mitral valve prolapse", "y": [31, 34], "an": "dx", "sub": "mid-systolic click (MVP)", "t": 31}]}, {"t": "MR — เกณฑ์ความรุนแรงและเมื่อไรต้องผ่าตัด (อัปเดต ESC/EACTS 2025)", "n": 2, "y": [35], "w": "Severe primary MR: repair ดีกว่า replacement, ข้อบ่งชี้ผ่าตัด (ไม่ใช่ PVC บ่อย) — ใหม่ในรุ่น 35", "c": null, "s": ["repair ดีกว่า replacement", "ข้อบ่งชี้ผ่าตัด severe primary MR"], "q": [{"q": "Which statement about surgical correction of severe mitral regurgitation is correct?", "a": "Left ventricular function declines more after prosthetic valve replacement than after repair", "y": [35], "an": "mx", "sub": "repair ดีกว่า replacement", "t": 31}, {"q": "Which of the following is NOT an indication for surgery in severe chronic primary mitral regurgitation?", "a": "Frequent premature ventricular contractions", "y": [35], "an": "mx", "sub": "ข้อบ่งชี้ผ่าตัด severe primary MR", "t": 31}]}, {"t": "Aortic stenosis — อาการ ตรวจร่างกาย และการรักษา (อัปเดต ESC/EACTS 2025)", "n": 3, "y": [28, 30, 32, 34], "w": "Aortic stenosis: ejection systolic murmur RUSB ร้าวไป carotid + pulsus parvus et tardus; collapsing pulse ไม่ใช่ AS", "c": null, "s": ["ejection murmur RUSB → carotid + slow-rising", "collapsing pulse ไม่ใช่ AS", "pulsus parvus et tardus"], "q": [{"q": "A systolic ejection murmur at the right upper sternal border radiating to the carotids with a slow-rising pulse indicates which lesion?", "a": "Aortic stenosis", "y": [28, 34], "an": "dx", "sub": "ejection murmur RUSB → carotid + slow-rising", "t": 30}, {"q": "Which finding is NOT expected in severe aortic stenosis?", "a": "Collapsing pulse", "y": [32], "an": "dx", "sub": "collapsing pulse ไม่ใช่ AS", "t": 30}, {"q": "Which arterial pulse finding is characteristic of severe aortic stenosis?", "a": "Pulsus parvus et tardus — a weak, delayed carotid upstroke", "y": [30], "an": "dx", "sub": "pulsus parvus et tardus", "t": 30}]}, {"t": "Aortic regurgitation — ชีพจรกระแทก และเกณฑ์ผ่าตัดใหม่", "n": 3, "y": [30, 31, 32, 34], "w": "Aortic regurgitation: pulse pressure กว้าง + early diastolic decrescendo ที่ LSB; สาเหตุ Marfan", "c": null, "s": ["wide pulse pressure + decrescendo diastolic", "AR จาก Marfan", "early diastolic murmur LSB นั่งโน้มตัว"], "q": [{"q": "A patient has a wide pulse pressure with a high-pitched blowing decrescendo diastolic murmur at the left sternal border. What is the diagnosis?", "a": "Aortic regurgitation", "y": [32, 34], "an": "dx", "sub": "wide pulse pressure + decrescendo diastolic", "t": 29}, {"q": "A tall thin 19-year-old woman with long arms and arachnodactyly has BP 180/70 mmHg, a bounding pulse and a high-pitched blowing decrescendo diastolic murmur. What is the most likely underlying condition?", "a": "Aortic regurgitation from Marfan syndrome", "y": [31], "an": "dx", "sub": "AR จาก Marfan", "t": 29}, {"q": "A 30-year-old man has a wide pulse pressure and a high-pitched, decrescendo early diastolic blowing murmur best heard at the left sternal border with the patient sitting forward in held expiration. What is the valve lesion?", "a": "Aortic regurgitation", "y": [30], "an": "dx", "sub": "early diastolic murmur LSB นั่งโน้มตัว", "t": 29}]}, {"t": "ลิ้นหัวใจด้านขวา — tricuspid และ pulmonic", "n": 0, "y": [], "w": null, "c": "ลิ้นด้านขวา (TR, TS, PR, PS) ไม่มีข้อถาม — ความสำคัญต่ำ", "s": [], "q": []}, {"t": "Acute rheumatic fever — กลไกและเกณฑ์ Jones", "n": 2, "y": [31, 33, 35], "w": null, "c": null, "s": ["ASO titre (evidence of GAS)", "erythema marginatum = major criterion"], "q": [{"q": "A 12-year-old has migratory polyarthritis, a new murmur and fever 3 weeks after pharyngitis. Which investigation supports the diagnosis?", "a": "Anti-streptolysin O titre", "y": [33, 35], "an": "ix", "sub": "ASO titre (evidence of GAS)", "t": 34}, {"q": "Which skin finding is a major manifestation of acute rheumatic fever?", "a": "Erythema marginatum", "y": [31], "an": "fact", "sub": "erythema marginatum = major criterion", "t": 34}]}, {"t": "รักษาไข้รูมาติก และป้องกันการกลับเป็นซ้ำ (อัปเดต WHO 2024)", "n": 0, "y": [], "w": null, "c": "รักษา ARF และ secondary prophylaxis (benzathine penicillin ตาม WHO 2024, ระยะเวลา) ยังไม่ออกเลย แม้เกี่ยวกับบริบทไทย — น่าออกใหม่", "s": [], "q": []}, {"t": "Infective endocarditis — สงสัยเมื่อไร และวินิจฉัยตาม Duke-ISCVID 2023", "n": 6, "y": [30, 31, 32, 34], "w": "Infective endocarditis: ไข้นาน + murmur + ม้ามโต → คิด IE, blood culture 3 ชุด, Roth spot/Osler node (immunologic), ฟันผุ → viridans strep (รุ่น 30,31,32,34)", "c": null, "s": ["ไข้ + murmur + ม้ามโต → IE", "Roth spot", "blood culture 3 ชุด", "Osler node = immunologic"], "q": [{"q": "A patient has a murmur, leg oedema, fever for 3 weeks and splenomegaly. Which diagnosis should be excluded first?", "a": "Infective endocarditis", "y": [31], "an": "dx", "sub": "ไข้ + murmur + ม้ามโต → IE", "t": 35}, {"q": "In infective endocarditis, what is a Roth spot?", "a": "A retinal haemorrhage with a pale centre", "y": [31], "an": "fact", "sub": "Roth spot", "t": 35}, {"q": "Which investigation is essential for diagnosing infective endocarditis?", "a": "Three sets of blood cultures", "y": [34], "an": "ix", "sub": "blood culture 3 ชุด", "t": 35}, {"q": "Which finding in infective endocarditis is an immunological phenomenon rather than a vascular (embolic) phenomenon?", "a": "Osler nodes", "y": [30], "an": "fact", "sub": "Osler node = immunologic", "t": 35}, {"q": "A 35-year-old man with a known mitral regurgitation murmur and several decayed teeth has had fever for 3 weeks. Splinter haemorrhages are seen and blood cultures are pending. Which organism is the most likely cause of his infective endocarditis?", "a": "Viridans group streptococci", "y": [31], "an": "mech", "sub": "ฟันผุ → viridans streptococci", "t": 35}, {"q": "A patient has had an infection with sore throat for 5 days and is now found to have a pansystolic murmur on cardiac examination. Which diagnosis best explains the murmur?", "a": "Infective endocarditis", "y": [32], "an": "dx", "sub": "ติดเชื้อ + murmur ใหม่ → IE", "t": 35}]}, {"t": "Infective endocarditis — รักษา ผ่าตัด และป้องกัน (ESC 2023)", "n": 2, "y": [28, 31], "w": null, "c": null, "s": ["viridans strep → IV penicillin G 4 สัปดาห์", "prophylaxis: แพ้ penicillin → clindamycin"], "q": [{"q": "A 54-year-old man has fever for 3 months, splinter haemorrhages, conjunctival haemorrhage, a diastolic murmur of aortic regurgitation, and an oscillating mass on the aortic valve. Four sets of blood cultures grow viridans streptococci. What is the appropriate treatment?", "a": "Intravenous penicillin G for 4 weeks", "y": [31], "an": "mx", "sub": "viridans strep → IV penicillin G 4 สัปดาห์", "t": 35}, {"q": "A patient with a prosthetic heart valve and penicillin allergy is scheduled for a dental extraction involving gingival manipulation. What is the most appropriate prophylaxis?", "a": "Single-dose clindamycin before the procedure", "y": [28], "an": "mx", "sub": "prophylaxis: แพ้ penicillin → clindamycin", "t": 35}]}], "th": [18, 32, 33, 28, 31, 30, 29, 34, 35]}, {"lec": "36", "title": "Basic ECG และ arrhythmia ที่พบบ่อย", "n": 20, "angle": {"interp": 8, "mx": 8, "mech": 2, "fact": 2}, "pattern": "เน้นการแปล ECG แบบ spot (hyperK, AV block, pericarditis, STEMI) ผสมกับการตัดสินใจรักษาทันที (Ca gluconate, pacemaker, cardioversion/defibrillation, adenosine); hyperkalemia ถูกถามทั้งจาก cardio และ nephro รุ่น 31–35 ส่วนลำดับการอ่าน ECG ออกเป็น SAQ ซ้ำ", "tip": "ฝึกอ่าน strip AV block ทุกระดับและ ECG hyperK/pericarditis ให้ไว พร้อมจำ ACLS tachy algorithm (pulse → stable → QRS); ฝึกเขียนรายงาน ECG ครบ 5 ขั้นเผื่อ SAQ แม้ axis/BBB/LVH ยังไม่ถูกถามแยก", "secs": [{"t": "คลื่นพื้นฐานบนกระดาษ ECG — แต่ละคลื่นคือไฟฟ้าผ่านส่วนไหน", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "การติด lead และ lead พิเศษ — Brugada leads · Lewis lead · right-sided", "n": 0, "y": [], "w": null, "c": "Lead พิเศษ (Brugada, Lewis) ไม่ถามตรง; right-sided lead ถูกถามในบริบท inferior STEMI", "s": [], "q": []}, {"t": "ขั้นที่ 1 Rate — 300 / 1500 / 6 วินาที และช่วงอัตราที่ใช้ตั้งชื่อ", "n": 0, "y": [], "w": null, "c": "คำนวณ rate (300/1500) เป็นทักษะพื้นฐานใน SAQ ไม่มีข้อเดี่ยว", "s": [], "q": []}, {"t": "ขั้นที่ 2 Rhythm — 4 จังหวะพื้นฐาน: sinus · atrial · junctional · ventricular", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Premature beat · escape beat · accelerated rhythm", "n": 0, "y": [], "w": null, "c": "PAC/PVC, escape, accelerated rhythm ไม่เคยถาม", "s": [], "q": []}, {"t": "Tachyarrhythmia ที่ต้องจำหน้าตา — sinus tachy · flutter · AF · VT · VF", "n": 1, "y": [], "w": "Atrial flutter: sawtooth 300/นาที conduction 2:1/4:1 (SAQ)", "c": null, "s": ["flutter sawtooth variable block"], "q": [{"q": "A 72-year-old woman with palpitations has an ECG showing regular sawtooth flutter waves in II, III and aVF at an atrial rate of 300/min with varying ventricular response (2:1 and 4:1 conduction). What is the rhythm?", "a": "Atrial flutter with variable AV conduction", "y": [], "an": "interp", "sub": "flutter sawtooth variable block", "t": 48}]}, {"t": "รักษา tachyarrhythmia เฉียบพลัน — ชีพจร · เสถียร · QRS (ACLS)", "n": 3, "y": [30, 31, 34, 35], "w": "ACLS tachy: VT มีชีพจรแต่ unstable → synchronized cardioversion, pulseless VT → defibrillation, SVT stable vagal ไม่ได้ผล → adenosine 6 mg", "c": null, "s": ["VT มีชีพจร unstable → synchronized CV", "pulseless VT → defibrillation", "SVT stable → adenosine 6 mg"], "q": [{"q": "A patient with monomorphic ventricular tachycardia at 180/min has BP 78/40 mmHg, chest pain and is drowsy but has a pulse. What is the immediate treatment?", "a": "Synchronised cardioversion", "y": [35], "an": "mx", "sub": "VT มีชีพจร unstable → synchronized CV", "t": 9}, {"q": "A monitored patient in the ICU suddenly becomes pulseless with ventricular tachycardia on the monitor. What is the best first therapy?", "a": "Immediate unsynchronised defibrillation", "y": [30, 31], "an": "mx", "sub": "pulseless VT → defibrillation", "t": 9}, {"q": "A stable patient has a regular narrow-complex tachycardia at 180/min with no visible P waves. Vagal manoeuvres fail. What is the next step?", "a": "Intravenous adenosine 6 mg rapid push", "y": [31, 34], "an": "mx", "sub": "SVT stable → adenosine 6 mg", "t": 36}]}, {"t": "ขั้นที่ 3 Axis — lead I กับ aVF", "n": 0, "y": [], "w": null, "c": "Axis (lead I กับ aVF) ไม่มีข้อถามตรง แต่ต้องรายงานใน SAQ", "s": [], "q": []}, {"t": "ขั้นที่ 4 Infarction — เกณฑ์ STEMI · วัด ST · territory · reciprocal · วิวัฒนาการ", "n": 1, "y": [32], "w": "ST ยก II III aVF + reciprocal I aVL = inferior MI (ข้อ STEMI อื่นอยู่ใน IHD)", "c": null, "s": ["territory inferior + reciprocal"], "q": [{"q": "An ECG shows ST elevation in leads II, III and aVF with reciprocal ST depression in I and aVL in a patient with 2 hours of chest pain. What is the diagnosis?", "a": "Acute inferior wall myocardial infarction", "y": [32], "an": "interp", "sub": "territory inferior + reciprocal", "t": 4}]}, {"t": "ขั้นที่ 5 Hypertrophy — P pulmonale · P mitrale · RVH · LVH", "n": 0, "y": [], "w": null, "c": "LVH/RVH, P mitrale/pulmonale ไม่เคยถาม", "s": [], "q": []}, {"t": "AV block — 1st · Mobitz I · Mobitz II · high-grade · complete heart block", "n": 5, "y": [29, 32, 34, 35], "w": "AV block: PR > 200 ms คงที่ = 1st degree → สังเกต; Wenckebach; Mobitz II/QRS กว้าง และ complete heart block ที่ BP ต่ำ → pacemaker (รุ่น 29,32,34,35)", "c": null, "s": ["1st degree: PR > 200 ms", "1st degree → observe", "Mobitz I (Wenckebach)", "Mobitz II → permanent pacemaker"], "q": [{"q": "An ECG shows a constant PR interval of 0.26 seconds with every P wave followed by a QRS complex. What is the diagnosis?", "a": "First-degree atrioventricular block", "y": [32, 34], "an": "interp", "sub": "1st degree: PR > 200 ms", "t": 26}, {"q": "An asymptomatic 45-year-old man has first-degree AV block on a routine ECG with normal examination. What is the appropriate management?", "a": "Observation", "y": [35], "an": "mx", "sub": "1st degree → observe", "t": 26}, {"q": "An ECG shows progressive PR prolongation until a P wave is not conducted, then the cycle repeats. What is the diagnosis?", "a": "Mobitz type I AV block", "y": [35], "an": "interp", "sub": "Mobitz I (Wenckebach)", "t": 26}, {"q": "An ECG shows intermittently dropped QRS complexes with a constant PR interval in the conducted beats and a wide QRS. What is the diagnosis and management?", "a": "Mobitz type II block — permanent pacemaker", "y": [35], "an": "interp", "sub": "Mobitz II → permanent pacemaker", "t": 26}, {"q": "An ECG shows P waves and QRS complexes that are completely dissociated, with a ventricular rate of 35/min and a wide QRS. The patient is dizzy with BP 85/50 mmHg. What is the definitive treatment?", "a": "Pacemaker insertion", "y": [29, 35], "an": "mx", "sub": "CHB → pacemaker", "t": 26}]}, {"t": "Bundle branch block — RBBB · LBBB (WiLLiaM MaRRoW)", "n": 0, "y": [], "w": null, "c": "RBBB/LBBB (WiLLiaM MaRRoW) ไม่มีข้อถาม — น่าออกใน SAQ อ่าน ECG", "s": [], "q": []}, {"t": "ECG พิเศษ — pericarditis และ potassium", "n": 8, "y": [29, 31, 32, 34, 35], "w": "Hyperkalemia: T สูงแหลม ± QRS กว้าง ในผู้ป่วย CKD → IV calcium gluconate ก่อน (ไม่ลด K) + ยาที่ไม่ลด K; และ ECG pericarditis ต่างจาก MI (ไม่มี reciprocal); ถาม 5 รุ่น", "c": null, "s": ["ECG pericarditis ต่างจาก STEMI", "T สูงแหลม QRS กว้าง → Ca gluconate", "ECG hyperkalemia", "peaked T = hyperkalemia"], "q": [{"q": "Which ECG pattern is most characteristic of acute pericarditis rather than myocardial infarction?", "a": "Widespread concave ST elevation with PR depression and no reciprocal change", "y": [29], "an": "interp", "sub": "ECG pericarditis ต่างจาก STEMI", "t": 0}, {"q": "An ECG shows tall peaked T waves with a widened QRS in a patient with chronic kidney disease. What is the first drug to give?", "a": "Intravenous calcium gluconate", "y": [32, 34], "an": "mx", "sub": "T สูงแหลม QRS กว้าง → Ca gluconate", "t": 37}, {"q": "A patient with CKD on two nephrotoxic drugs has an ECG showing tall peaked T waves, rate 120/min, sinus rhythm, P waves present and a narrow QRS. What is the interpretation?", "a": "ECG changes of hyperkalaemia", "y": [34], "an": "interp", "sub": "ECG hyperkalemia", "t": 37}, {"q": "An ECG shows tall peaked T waves in a patient who is drowsy with muscle weakness. What is the diagnosis?", "a": "Hyperkalaemia", "y": [35], "an": "interp", "sub": "peaked T = hyperkalemia", "t": 37}, {"q": "An ECG shows tall peaked T waves in a patient with CKD. What is the first drug to give and why?", "a": "Intravenous calcium gluconate to stabilise the cardiac membrane", "y": [32], "an": "mx", "sub": "Ca gluconate stabilise membrane", "t": 37}, {"q": "Which drug does NOT lower serum potassium?", "a": "Spironolactone", "y": [31], "an": "mech", "sub": "ยาที่ไม่ลด K (spironolactone)", "t": 37}, {"q": "A CKD patient on two nephrotoxic drugs has an ECG showing tall peaked T waves with sinus tachycardia and narrow QRS. What is the interpretation and immediate treatment?", "a": "Hyperkalaemia — give calcium gluconate", "y": [34], "an": "mx", "sub": "hyperK ECG + Ca gluconate", "t": 37}, {"q": "Which of the following treatments does NOT lower the serum potassium concentration in a patient with hyperkalaemia?", "a": "Intravenous calcium gluconate", "y": [31], "an": "mech", "sub": "Ca gluconate ไม่ลด K", "t": 37}]}, {"t": "รวมทุกขั้น — อ่าน ECG แบบเขียนตอบ SAQ", "n": 2, "y": [29, 32, 33, 34], "w": "ลำดับการรายงาน ECG: rate, rhythm, axis, interval, ST-T สำหรับ SAQ (ซ้ำ 4 รุ่น)", "c": null, "s": ["ลำดับรายงาน rate rhythm axis interval ST-T", "องค์ประกอบที่ต้องรายงานใน SAQ"], "q": [{"q": "When reading a 12-lead ECG of suspected STEMI, which sequence should be described?", "a": "Rate, rhythm, axis, intervals and ST-T", "y": [29, 33], "an": "fact", "sub": "ลำดับรายงาน rate rhythm axis interval ST-T", "t": 22}, {"q": "When describing an ECG in a SAQ station, which set of elements must be reported?", "a": "Rate, rhythm, axis, intervals and ST-T", "y": [29, 32, 34], "an": "fact", "sub": "องค์ประกอบที่ต้องรายงานใน SAQ", "t": 22}]}], "th": [48, 9, 36, 26, 37, 22]}, {"lec": "HF", "title": "Heart failure — นิยาม พยาธิสรีรวิทยา การวินิจฉัย และการรักษา", "n": 15, "angle": {"dx": 4, "fact": 2, "mech": 2, "ix": 1, "interp": 1, "mx": 5}, "pattern": "ข้อสอบ HF ส่วนใหญ่มาจากธนาคาร lecture 39 เดิม (HF+HT) เน้นอาการ/อาการแสดง (PND, crepitation, JVP), กลไกปอดบวมน้ำ, CXR, NYHA และการรักษาพื้นฐาน (ACEI+BB, loop diuretic) กระจายรุ่น 28–35 แบบไม่ค่อยซ้ำ; cardiorenal/high-output ออกเป็นชุดในรุ่น 34", "tip": "เก็บ HF clinical (อาการ, JVP, CXR Kerley B, NYHA) และ decompensated HF (CHAMPIT, warm/cold wet/dry, loop diuretic/nitrate) ให้แน่น แล้วอัปเดตสี่เสาหลัก HFrEF เผื่อข้อใหม่", "secs": [{"t": "เหนื่อยเฉียบพลัน — คิดเป็นระบบก่อนบอกว่าเป็น HF", "n": 1, "y": [31], "w": null, "c": null, "s": ["เหนื่อย: COPD hypercapnia vs HF (BNP ปกติ)"], "q": [{"q": "A 45-year-old smoker has dyspnoea with PaCO2 56 mmHg, pH 7.28 and severe airflow obstruction on spirometry, with clear lungs on radiograph and normal BNP. What is the most likely diagnosis?", "a": "COPD exacerbation with hypercapnia", "y": [31], "an": "dx", "sub": "เหนื่อย: COPD hypercapnia vs HF (BNP ปกติ)", "t": 44}]}, {"t": "นิยาม HF การจำแนกตาม LVEF และระยะ A–D", "n": 1, "y": [28], "w": null, "c": null, "s": ["NYHA class II"], "q": [{"q": "A patient is comfortable at rest but becomes breathless on ordinary activity such as walking on level ground. What is the NYHA functional class?", "a": "Class II", "y": [28], "an": "fact", "sub": "NYHA class II", "t": 42}]}, {"t": "พยาธิสรีรวิทยา — neurohormonal activation และ remodeling", "n": 0, "y": [], "w": null, "c": "Neurohormonal/remodeling เป็นพื้นฐานกลไกยา ไม่ถามตรง", "s": [], "q": []}, {"t": "จาก LVP สู่ปอดบวมน้ำ — hemodynamics ของ congestion", "n": 2, "y": [31, 33, 34], "w": "กลไกปอดบวมน้ำ: hydrostatic > oncotic pressure; cardiorenal จาก renal venous congestion", "c": null, "s": ["hydrostatic > oncotic pressure", "renal venous congestion (cardiorenal)"], "q": [{"q": "What is the mechanism of pulmonary oedema in acute decompensated heart failure?", "a": "Raised pulmonary capillary hydrostatic pressure exceeding plasma oncotic pressure", "y": [31, 33], "an": "mech", "sub": "hydrostatic > oncotic pressure", "t": 41}, {"q": "In cardiorenal syndrome type 1, which factor most drives the fall in renal function?", "a": "Renal venous congestion", "y": [34], "an": "mech", "sub": "renal venous congestion (cardiorenal)", "t": 43}]}, {"t": "อาการของ HF — typical, less typical และหายใจลำบากตามท่า", "n": 1, "y": [31, 32], "w": "ตื่นกลางคืนหอบ ไอเสมหะฟองชมพู + orthopnea = acute pulmonary edema", "c": null, "s": ["PND + pink frothy sputum"], "q": [{"q": "A patient wakes at night breathless and coughs pink frothy sputum, with orthopnoea and bibasal crepitations. What is the diagnosis?", "a": "Acute pulmonary oedema", "y": [31, 32], "an": "dx", "sub": "PND + pink frothy sputum", "t": 41}]}, {"t": "อาการแสดง — JVP, hepatojugular reflux, edema, crepitation", "n": 2, "y": [31, 33], "w": "Crepitation ละเอียดที่ฐานปอด; JVP สูงแยก HF ออกจากตับแข็งในผู้ป่วยบวม/ascites", "c": null, "s": ["fine crepitation ที่ฐานปอด", "JVP สูงแยก HF จากตับแข็ง"], "q": [{"q": "What lung finding is typical of left-sided heart failure?", "a": "Bibasal fine inspiratory crepitations", "y": [33], "an": "dx", "sub": "fine crepitation ที่ฐานปอด", "t": 41}, {"q": "Which finding best distinguishes congestive heart failure from chronic liver disease as the cause of oedema and ascites?", "a": "Elevated jugular venous pressure", "y": [31], "an": "dx", "sub": "JVP สูงแยก HF จากตับแข็ง", "t": 42}]}, {"t": "Natriuretic peptides — กลไก จุดตัด และกับดัก", "n": 0, "y": [], "w": null, "c": "Natriuretic peptides (จุดตัด BNP/NT-proBNP, กับดักอ้วน/ไตวาย) ไม่มีข้อถามตรง — น่าออก", "s": [], "q": []}, {"t": "หลักฐาน congestion และแผนการวินิจฉัย — CXR, echo, RHC", "n": 2, "y": [30, 31], "w": "CXR: cardiomegaly + Kerley B lines; ผู้ป่วยเหนื่อย บวม → CXR + ECG", "c": null, "s": ["CXR + ECG ในผู้ป่วยเหนื่อย/HF", "CXR: cardiomegaly + Kerley B"], "q": [{"q": "A 64-year-old man with uncontrolled diabetes and hypertension presents with chest discomfort and dyspnoea. SpO2 is 92% on room air, there are crepitations at both lung bases and pitting oedema of both legs. Which investigations should be done next?", "a": "Chest radiograph and 12-lead ECG", "y": [30], "an": "ix", "sub": "CXR + ECG ในผู้ป่วยเหนื่อย/HF", "t": 20}, {"q": "Which chest radiographic features indicate congestive heart failure?", "a": "Cardiomegaly with Kerley B lines", "y": [31], "an": "interp", "sub": "CXR: cardiomegaly + Kerley B", "t": 41}]}, {"t": "ทำไม HF จึงสำคัญ — ระบาดวิทยา การดำเนินโรค และตัวกระตุ้น", "n": 1, "y": [32], "w": null, "c": null, "s": ["ตัวกระตุ้น HF กำเริบ (obesity ไม่ใช่)"], "q": [{"q": "Which of the following is NOT a typical acute precipitant of decompensated heart failure?", "a": "Obesity", "y": [32], "an": "fact", "sub": "ตัวกระตุ้น HF กำเริบ (obesity ไม่ใช่)", "t": 42}]}, {"t": "HFrEF — foundational medical therapy (สี่เสาหลัก) และขนาดยา", "n": 2, "y": [28, 35], "w": "HFrEF EF 30% กิน furosemide อย่างเดียว → เพิ่ม ACEI + BB; ACEI ลดการตาย (รุ่น 28,35)", "c": null, "s": ["ACEI ลดการตายใน HFrEF", "EF 30% → เพิ่ม ACEI + BB"], "q": [{"q": "Which antihypertensive class improves survival in heart failure with reduced ejection fraction?", "a": "ACE inhibitor such as enalapril", "y": [28, 35], "an": "mx", "sub": "ACEI ลดการตายใน HFrEF", "t": 40}, {"q": "A patient with LVEF 30 percent and NYHA class II symptoms is on furosemide only. What should be added first?", "a": "ACEI plus beta-blocker", "y": [35], "an": "mx", "sub": "EF 30% → เพิ่ม ACEI + BB", "t": 40}]}, {"t": "HFpEF/HFmrEF, ภาวะขาดธาตุเหล็ก และอุปกรณ์ (ICD, CRT)", "n": 0, "y": [], "w": null, "c": "HFpEF, IV iron, ICD/CRT ยังไม่เคยถาม — เนื้อหาแนวทางใหม่", "s": [], "q": []}, {"t": "Decompensated (acute) HF — หาเหตุ แยกโปรไฟล์ warm/cold wet/dry และรักษา", "n": 3, "y": [31, 34], "w": "Decompensated HF: hypertensive APE → IV nitrate + loop diuretic; cardiorenal type 1 (Cr ขึ้น + congestion) → ให้ IV loop diuretic ต่อ (รุ่น 31,34)", "c": null, "s": ["hypertensive APE → IV nitrate + loop diuretic", "cardiorenal type 1 → ให้ loop diuretic ต่อ", "congestion + Cr ขึ้น → IV loop diuretic"], "q": [{"q": "A patient has blood pressure 220/130 mmHg with acute pulmonary oedema (acute heart failure). What is the most appropriate antihypertensive therapy?", "a": "Intravenous nitroglycerin with an intravenous loop diuretic", "y": [31], "an": "mx", "sub": "hypertensive APE → IV nitrate + loop diuretic", "t": 39}, {"q": "A patient with heart failure has worsening congestion and a rising creatinine. What is the most appropriate management of type 1 cardiorenal syndrome?", "a": "Continue intravenous loop diuretic", "y": [34], "an": "mx", "sub": "cardiorenal type 1 → ให้ loop diuretic ต่อ", "t": 43}, {"q": "A patient with heart failure and CKD has worsening congestion with rising creatinine. What is the appropriate approach?", "a": "Intravenous loop diuretic with salt restriction", "y": [34], "an": "mx", "sub": "congestion + Cr ขึ้น → IV loop diuretic", "t": 43}]}], "th": [42, 41, 40]}], "gaps": [{"id": "gap-cardio-01", "set": "cardio", "title": "ความดันโลหิตสูง: วัดให้ถูก วินิจฉัยให้ถูกชนิด และเลือกยาตามสถานการณ์", "subtitle": "white coat/masked/resistant, เบาะแส secondary HT, lifestyle และยาที่ห้ามใช้ในแต่ละภาวะ", "md": "### 1. วัดความดันให้ถูกก่อน — ค่าที่ผิดมาจากเทคนิคมากกว่าจากเครื่อง\nความดันที่วัดได้คือแรงดันในหลอดเลือดแดง brachial ที่ระดับเดียวกับหัวใจ ถ้าแขนต่ำกว่าหัวใจ น้ำหนักของคอลัมน์เลือด (hydrostatic) จะบวกเข้าไปทำให้ค่าสูงเกินจริง ถ้าแขนห้อยไม่มีที่รองกล้ามเนื้อเกร็ง (isometric) ก็ทำให้ค่าสูงขึ้นเช่นกัน\n- นั่งพักอย่างน้อย 5 นาที หลังพิงพนัก เท้าวางราบ ไม่ไขว่ห้าง งดบุหรี่ กาแฟ และออกกำลังกาย 30 นาทีก่อนวัด ปัสสาวะก่อน ไม่พูดคุยระหว่างวัด\n- แขนเปลือย วางบนโต๊ะให้กึ่งกลาง cuff อยู่ระดับหัวใจ (ระดับ mid-sternum)\n- **ขนาด cuff: bladder ยาวอย่างน้อย 80% ของเส้นรอบแขน และกว้างประมาณ 40% ของเส้นรอบแขน**\n- cuff เล็กเกินไป (เช่นใช้ cuff มาตรฐานกับคนอ้วนแขนใหญ่) → ค่าสูงเกินจริง ส่วน cuff ใหญ่เกิน → ค่าต่ำกว่าจริงเล็กน้อย\n- ครั้งแรกวัดทั้งสองแขน ใช้แขนที่สูงกว่าเป็นแขนอ้างอิง ต่างกัน >15–20 mmHg ให้นึกถึงหลอดเลือดตีบ (subclavian stenosis, coarctation, dissection)\n- วัด 2–3 ครั้งห่างกัน 1–2 นาทีแล้วเฉลี่ย ถ้าใช้หูฟังให้ปล่อยลมช้า 2 mmHg ต่อวินาที\n- ผู้สูงอายุ เบาหวาน หรือมีอาการหน้ามืด ให้วัดท่ายืนที่ 1 และ 3 นาทีด้วย (orthostatic hypotension)\n\n### 2. เกณฑ์วินิจฉัยและระดับความรุนแรง (Thai HT guideline 2019 / ESH)\n| วิธีวัด | เกณฑ์ HT |\n|---|---|\n| Office BP | ≥140/90 mmHg (ยืนยันอย่างน้อย 2 visit) |\n| Home BP (HBPM) | ≥135/85 mmHg |\n| ABPM 24 ชั่วโมง | ≥130/80 (กลางวัน ≥135/85, กลางคืน ≥120/70) |\n\nระดับ office BP: grade 1 = 140–159/90–99, grade 2 = 160–179/100–109, grade 3 = ≥180/≥110 ถ้า SBP กับ DBP อยู่คนละ grade ให้ใช้ grade ที่สูงกว่า Home BP ที่ถูกต้องคือวัดเช้า 2 ครั้งและเย็น 2 ครั้ง ติดต่อกัน 7 วัน (อย่างน้อย 3 วัน) ตัดวันแรกทิ้งแล้วเฉลี่ย\n\n### 3. Phenotype ที่ต้องแยกจาก office เทียบกับ out-of-office BP\n| ชื่อ | Office BP | Home/ABPM | ความหมาย |\n|---|---|---|---|\n| Normotension | ปกติ | ปกติ | — |\n| **White coat HT** | สูง | ปกติ | ตื่นเต้นเมื่อเจอแพทย์ ไม่ต้องให้ยา ติดตาม home BP และ lifestyle |\n| **Masked HT** | ปกติ | สูง | อันตรายเท่า sustained HT เพราะพลาดการรักษา พบในคนเครียด สูบบุหรี่ เบาหวาน CKD |\n| Sustained HT | สูง | สูง | HT จริง |\n\n**Resistant hypertension** = BP ยังไม่ถึงเป้า ทั้งที่ได้ยา ≥3 กลุ่มในขนาดเหมาะสม (สูงสุดที่ทนได้) ซึ่งต้องมี diuretic อยู่ด้วย (สูตรมาตรฐาน ACEi/ARB + CCB + thiazide-like) และยืนยันด้วย home BP หรือ ABPM ผู้ที่คุมได้แต่ต้องใช้ ≥4 ยาก็นับเป็น resistant ก่อนวินิจฉัยต้องตัด *pseudo-resistance* ออกก่อน คือ วัดผิดเทคนิค white coat effect และไม่กินยา (สาเหตุที่พบบ่อยที่สุด) แล้วทบทวนยาที่ทำให้ความดันสูง (NSAIDs, steroid, OCP, decongestant, alcohol) และคัดกรอง secondary HT ทุกราย ยาตัวที่ 4 ที่มีหลักฐานดีที่สุดคือ **spironolactone 25–50 mg/วัน** (PATHWAY-2) ถ้า K ไม่สูงและ eGFR พอ\n\n### 4. เบาะแส secondary hypertension\nคนส่วนใหญ่ (~90%) เป็น primary HT ซึ่งมักเริ่มอายุ 30–55 ปี ค่อยเป็นค่อยไป มีประวัติครอบครัวและอ้วน ให้สงสัย secondary HT เมื่อ\n- **อายุน้อย (<30–40 ปี) โดยเฉพาะเริ่มเป็นเร็วและรุนแรง** ไม่อ้วน ไม่มีประวัติครอบครัว\n- grade 3 หรือ hypertensive emergency, resistant HT, หรือคนที่เคยคุมได้แล้วจู่ ๆ คุมไม่อยู่\n- hypokalemia ทั้งที่ไม่ได้ใช้ diuretic หรือ K ต่ำมากผิดสัดส่วนเมื่อได้ diuretic\n- Cr เพิ่ม >30% หลังเริ่ม ACEi/ARB, flash pulmonary edema, มี abdominal bruit\n- อาการเป็นพัก ๆ ปวดศีรษะ ใจสั่น เหงื่อออก, กรนดังและง่วงกลางวัน, อวัยวะเป้าหมายเสียหายมากเกินระดับความดัน\n\n| สาเหตุ | เบาะแส | ตรวจคัดกรอง |\n|---|---|---|\n| Primary aldosteronism (สาเหตุ endocrine ที่พบบ่อยที่สุด) | hypokalemia, metabolic alkalosis, resistant HT, adrenal incidentaloma | **Plasma aldosterone-to-renin ratio (ARR)** แก้ K ให้ปกติก่อน → confirmatory test (saline infusion/captopril) → CT adrenal + adrenal venous sampling |\n| Renal parenchymal disease | Cr สูง โปรตีนหรือเลือดในปัสสาวะ | Cr, UA, ultrasound ไต |\n| Renovascular (atherosclerosis ผู้สูงอายุ, FMD หญิงสาว) | bruit, Cr ขึ้นหลัง ACEi, ไตสองข้างขนาดต่างกัน | duplex ultrasound, CTA/MRA |\n| Pheochromocytoma | ปวดหัว ใจสั่น เหงื่อ เป็นพัก ๆ | plasma free หรือ urine fractionated metanephrines |\n| Cushing syndrome | อ้วนลงพุง striae ม่วง | 1-mg overnight dexamethasone suppression, 24-h urine cortisol |\n| OSA | กรน ง่วงกลางวัน คออ้วน | STOP-BANG, polysomnography |\n| Coarctation of aorta | BP แขนสูงกว่าขา, radio-femoral delay | echo, CTA |\n| Thyroid | hyper: SBP สูง pulse pressure กว้าง | TSH |\n\nแนวทาง Endocrine Society 2025 แนะนำให้คัดกรอง primary aldosteronism ด้วย ARR ในผู้ป่วย HT ทุกราย และอย่างน้อยต้องทำในกลุ่มเสี่ยงข้างต้น\n\n### 5. Lifestyle modification — อะไรลดได้มาก อะไรไม่ได้ผล\n| มาตรการ | เป้าหมาย | SBP ลดลงโดยประมาณ |\n|---|---|---|\n| DASH diet (ผัก ผลไม้ นมไขมันต่ำ ลดไขมันอิ่มตัว) | — | ~11 mmHg |\n| ลดโซเดียม | Na <2 g/วัน (เกลือ <5 g หรือราว 1 ช้อนชา) | 5–6 mmHg |\n| ลดน้ำหนัก | BMI <23 (เกณฑ์เอเชีย), รอบเอว ชาย <90 หญิง <80 cm | ~1 mmHg ต่อน้ำหนักที่ลด 1 kg |\n| ออกกำลังกายแบบแอโรบิก | 150 นาที/สัปดาห์ | 5–8 mmHg |\n| เพิ่มโพแทสเซียมจากอาหาร (ถ้าไตปกติ) | 3.5–5 g/วัน | 4–5 mmHg |\n| จำกัดแอลกอฮอล์ | ชาย ≤2 drink หญิง ≤1 drink/วัน หรืองด | ~4 mmHg |\n\n**อาหารโปรตีนสูง ไม่มีหลักฐานว่าลดความดัน** จึงเป็นมาตรการที่ได้ผลน้อยที่สุดในตัวเลือก การเลิกบุหรี่ไม่ได้ลด BP มากแต่ลด CV risk สูงมาก จึงต้องแนะนำทุกคน\n\n### 6. เมื่อไรเริ่มยา และเริ่มอย่างไร\n- **Grade 1 ความเสี่ยงต่ำ** (ไม่มีเบาหวาน CKD CVD หรือ HMOD และ CV risk ต่ำ) → lifestyle modification 3–6 เดือน แล้วประเมินใหม่ ถ้ายังไม่ถึงเป้าจึงเริ่มยา\n- Grade 1 ที่มีความเสี่ยงสูง (เบาหวาน CKD CVD HMOD) หรือ grade 2–3 → เริ่มยาทันทีพร้อม lifestyle ส่วนใหญ่เริ่มเป็นยา 2 ตัวขนาดต่ำ ควรเป็น single-pill combination\n- ยาหลัก 4 กลุ่ม: **ACEi หรือ ARB, dihydropyridine CCB, thiazide/thiazide-like diuretic** และ beta-blocker เมื่อมีข้อบ่งชี้เฉพาะ (หลัง MI, HFrEF, AF ควบคุมอัตรา, angina)\n- ขั้นตอน: A + C หรือ A + D → A + C + D → เพิ่ม spironolactone\n- เป้าหมายทั่วไป <140/90 และถ้าทนได้ <130/80 mmHg (ESC 2024 แนะนำ SBP 120–129 ถ้าทนได้)\n\n### 7. เลือกยาตามสถานการณ์\n| สถานการณ์ | เลือก | ห้ามหรือเลี่ยง และเหตุผล |\n|---|---|---|\n| เบาหวานมี albuminuria, CKD มีโปรตีนรั่ว | ACEi **หรือ** ARB ขนาดสูงสุดที่ทนได้ (เพิ่ม SGLT2i เพื่อปกป้องไต) | **ห้ามใช้ ACEi ร่วม ARB** (dual RAS blockade) หรือร่วม aliskiren: ไม่ลด CV/ไตวาย แต่เพิ่ม hyperkalemia และ AKI (ONTARGET, VA NEPHRON-D) ถ้ายังสูงให้เพิ่ม CCB หรือ diuretic แทน |\n| **Bilateral renal artery stenosis** หรือ RAS ในไตข้างเดียวที่เหลือ | CCB, d
