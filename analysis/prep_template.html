่น่าถูกกด\n- Steroid ทาง inhaled, ทาผิว, ฉีดเข้าข้อ ก็กดได้\n- หยุดยา: ค่อย ๆ ลดจนถึงขนาด physiologic (prednisolone ~4–5 mg/วัน) แล้วลดช้าลง และวัด cortisol เช้าก่อนหยุด (แนวทาง ESE/Endocrine Society 2024)\n- Stress dose: เจ็บป่วยเล็กน้อยเพิ่มยา 2–3 เท่า (sick day rules); ผ่าตัดใหญ่ hydrocortisone 100 mg IV ตอนเริ่ม anesthesia แล้ว 200 mg/24 ชม.\n\n### Maintenance\n- Glucocorticoid: hydrocortisone 15–25 mg/วัน แบ่ง 2–3 มื้อ หรือ prednisolone 3–5 mg/วัน\n- เฉพาะ primary: **fludrocortisone 0.05–0.2 mg/วัน** ติดตาม BP ท่ายืน K และ renin\n- ให้บัตรประจำตัวผู้ป่วยและสอน sick day rules\n\n### Corticosteroid: ฤทธิ์เทียบกัน\nกลไก: cortisol จับ mineralocorticoid receptor ได้เท่า aldosterone แต่ไตมี 11β-HSD2 เปลี่ยน cortisol เป็น cortisone; เมื่อ hydrocortisone ขนาดสูง (> 50–100 mg/วัน) หรือ cortisol สูงมาก (ectopic ACTH) หรือกินชะเอมเทศ (ยับยั้ง 11β-HSD2) จึงเกิดฤทธิ์ mineralocorticoid\n\n| ยา | ขนาดเทียบเท่า (mg) | Glucocorticoid potency | Mineralocorticoid potency | ระยะออกฤทธิ์ |\n|---|---|---|---|---|\n| Hydrocortisone | 20 | 1 | 1 | สั้น 8–12 ชม. |\n| Prednisolone | 5 | 4 | 0.8 | กลาง 12–36 ชม. |\n| Methylprednisolone | 4 | 5 | 0.5 | กลาง |\n| Triamcinolone | 4 | 5 | 0 | กลาง |\n| Dexamethasone | 0.75 | 25–30 | 0 | ยาว 36–72 ชม. |\n| **Fludrocortisone** | ไม่ใช้เป็น glucocorticoid | 10 | **~125** | กลาง |\n\n- ฤทธิ์ mineralocorticoid แรงที่สุด = **fludrocortisone**; ใช้ใน primary AI, CAH ชนิด salt-wasting, orthostatic hypotension\n- Dexamethasone และ triamcinolone แทบไม่มีฤทธิ์ mineralocorticoid จึงใช้ทดแทนใน primary AI เดี่ยว ๆ ไม่ได้", "pearls": ["Hyperpigmentation (buccal mucosa, รอยพับผิว) + ACTH สูง = primary AI; secondary ไม่มี pigmentation ไม่มี K สูง และไม่ต้องให้ fludrocortisone", "Cortisol 08:00 < 3–5 µg/dL = AI; ก้ำกึ่ง → cosyntropin 250 µg วัดที่ 30/60 นาที ค่าสูงสุด < 18 µg/dL = AI", "Cushingoid + septic shock ไม่ตอบสนองต่อสารน้ำ → ถามประวัติหยุด steroid เอง → hydrocortisone 100 mg IV ทันที แล้ว 200 mg/วัน", "Sheehan syndrome: ตกเลือดหลังคลอด → ไม่มีน้ำนม + Na ต่ำจาก ACTH deficiency", "Mineralocorticoid แรงสุด = fludrocortisone (~125 เท่า hydrocortisone); dexamethasone ฤทธิ์ mineralocorticoid ≈ 0"], "traps": [], "q": [{"id": "N-OLD-058", "q": "A woman with severe postpartum haemorrhage later develops fatigue, failure to lactate and hyponatraemia. What is the mechanism?", "a": "Sheehan syndrome with ACTH deficiency", "y": [32], "t": 73}, {"id": "EN-OLDP-046", "q": "A patient is found to have a high plasma ACTH level together with postural hypotension and hyperpigmentation of the oral mucosa. What is the diagnosis?", "a": "Primary adrenal insufficiency (Addison disease)", "y": [30], "t": 73}, {"id": "EN-OLDP-049", "q": "Which clinical feature indicates primary adrenal insufficiency rather than secondary (pituitary) adrenal insufficiency?", "a": "Hyperpigmentation of sun-exposed skin, skin creases and buccal mucosa", "y": [30], "t": 73}, {"id": "EN-OLDP-051", "q": "Which investigation is most appropriate to diagnose secondary (central) adrenal insufficiency?", "a": "Morning (08:00) serum cortisol together with plasma ACTH level", "y": [30], "t": 73}, {"id": "PP30-END-089", "q": "A 45-year-old woman has fatigue, weight loss and hyperpigmentation of the buccal mucosa. Her 08:00 serum cortisol is 10 µg/dL (indeterminate). What is the next investigation to confirm adrenal insufficiency?", "a": "ACTH (cosyntropin) stimulation test — cortisol at 30–60 minutes after 250 µg synthetic ACTH", "y": [30], "t": 73}, {"id": "PPNA-END-099", "q": "A 50-year-old obese woman with diabetes and hypertension is in septic shock from pneumonia (BP 70/60 mmHg despite fluids). She has a round face, truncal obesity and easy bruising. Which history is most important to identify a contributing cause of her refractory shock?", "a": "Recent long-term steroid use that she stopped by herself (adrenal crisis)", "y": [], "t": 73}, {"id": "EN-OLDP-053", "q": "Which one of the following corticosteroid preparations has the most potent mineralocorticoid activity?", "a": "Fludrocortisone acetate", "y": [31], "t": 271}], "years": [30, 31, 32], "th": [73, 271]}, {"id": "gap-endo-01", "set": "endo", "title": "Cushing syndrome และ pheochromocytoma — ยืนยัน หาตำแหน่ง และอาการคลาสสิก", "subtitle": "ACTH บอกทาง high-dose dex กับ MRI/IPSS แยก pituitary จาก ectopic และ 5P ของ pheo", "md": "### กลไก: cortisol เกินมาจากไหน\n- **Exogenous glucocorticoid** พบบ่อยที่สุด ในไทยต้องถามเรื่องยาชุด ยาลูกกลอน ยาหม้อที่ผสม steroid เสมอ (ACTH และ cortisol ของร่างกายถูกกด)\n- **ACTH-dependent (~80% ของ endogenous)**: *Cushing disease* (corticotroph adenoma ของ pituitary ส่วนใหญ่เป็น microadenoma < 10 mm) กับ *ectopic ACTH* (small cell lung cancer, bronchial/thymic carcinoid, pancreatic NET, medullary thyroid carcinoma)\n- **ACTH-independent (~15–20%)**: adrenal adenoma, adrenal carcinoma, bilateral macronodular hyperplasia\n- อาการที่จำเพาะกว่า: proximal myopathy, purple striae กว้าง > 1 cm, ช้ำง่าย, facial plethora ร่วมกับอ้วนลงพุง moon face, buffalo hump, HT, DM, osteoporosis\n- Ectopic ACTH มักเป็นเร็ว น้ำหนักลด อ่อนแรงมาก บวม **K ต่ำรุนแรง + metabolic alkalosis** และ hyperpigmentation เพราะ cortisol สูงมากจนล้น 11β-HSD2 ที่ไต แล้วไปจับ mineralocorticoid receptor ลักษณะ cushingoid อาจไม่ทันขึ้น\n\n### Step 1: ยืนยัน hypercortisolism (ต้องผิดปกติอย่างน้อย 2 test)\n\n| Test | ผิดปกติเมื่อ | กับดัก |\n|---|---|---|\n| 1-mg overnight DST (dex 1 mg 23:00 เจาะ 08:00) | cortisol > 1.8 µg/dL (50 nmol/L) | OCP/estrogen เพิ่ม CBG, ยาเร่ง CYP3A4 (rifampicin, phenytoin, carbamazepine) ทำให้ผลบวกลวง |\n| 24-h urinary free cortisol (≥ 2 ครั้ง) | > upper limit | ปัสสาวะมาก ผลสูงลวง, CKD ผลต่ำลวง |\n| Late-night salivary cortisol (≥ 2 คืน) | > upper limit | คนทำงานกะดึก |\n| 2-day low-dose DST (0.5 mg q6h × 48 ชม.) | cortisol > 1.8 µg/dL | ใช้เมื่อสงสัย pseudo-Cushing |\n\n- ค่า cortisol เช้าแบบสุ่มเดี่ยว ๆ ใช้ยืนยัน Cushing ไม่ได้\n- Pseudo-Cushing: depression, alcohol use disorder, อ้วนมาก, DM คุมไม่ดี\n\n### Step 2: วัด plasma ACTH ตอนเช้า\n- ACTH < 10 pg/mL → ACTH-independent → CT adrenal\n- ACTH > 20 pg/mL → ACTH-dependent → ไป step 3\n- 10–20 pg/mL → ก้ำกึ่ง ทำ CRH/desmopressin test\n\n### Step 3: Cushing disease หรือ ectopic ACTH\nหลักคิด: corticotroph adenoma ยังรักษา negative feedback ไว้บางส่วน จึงถูกกดด้วย dexamethasone ขนาดสูง และยังตอบสนองต่อ CRH/desmopressin ส่วน ectopic tumor ไม่มี feedback เลย\n\n| ลักษณะ | Cushing disease | Ectopic ACTH |\n|---|---|---|\n| ผู้ป่วย | หญิงวัยทำงาน (หญิง:ชาย ~3–5:1) | ชายสูบบุหรี่ (SCLC) หรือ carcinoid |\n| ACTH | ปกติค่อนสูงถึงสูงปานกลาง | สูงมาก (มัก > 200 pg/mL) |\n| K ต่ำ | ~10% | พบส่วนใหญ่ และรุนแรง |\n| High-dose DST (8 mg) | cortisol ลด > 50% | **ไม่ลด** |\n| CRH/desmopressin | ACTH และ cortisol เพิ่ม | ไม่ตอบสนอง |\n| IPSS (central:peripheral ACTH) | ≥ 2 ก่อนกระตุ้น หรือ ≥ 3 หลังกระตุ้น | ต่ำกว่านั้น |\n| ภาพ | MRI pituitary with gadolinium | CT คอ อก ท้อง, Ga-68 DOTATATE PET |\n\nลำดับตามแนวทางปัจจุบัน (Pituitary Society consensus 2021):\n1. ยืนยันว่า ACTH-dependent แล้วทำ **MRI pituitary**\n2. ถ้าเห็น adenoma ≥ 10 mm และ dynamic test (CRH/desmopressin หรือ HDDST) เข้ากับ pituitary → วินิจฉัย Cushing disease ได้\n3. ถ้า adenoma < 6 mm, ไม่เห็นก้อน, หรือผล test ขัดกัน → **bilateral inferior petrosal sinus sampling (BIPSS)** ซึ่งเป็น gold standard (คนปกติ ~10% มี pituitary incidentaloma เล็ก ๆ จึงใช้ MRI อย่างเดียวไม่ได้)\n4. ถ้าผลชี้ ectopic → CT ทั้งตัวและ functional imaging หาก้อน\n- อ่านเคสสอบ: cortisol เช้า 30 µg/dL ไม่ถูกกดทั้ง low-dose และ high-dose และ ACTH สูงมาก → **ectopic ACTH syndrome** (เช่น SCLC, carcinoid); ถ้าถูกกดด้วย high-dose → Cushing disease\n- HDDST มี accuracy เพียง ~80% และ bronchial carcinoid บางรายถูกกดได้ จึงเป็นเพียงข้อมูลเสริม ไม่ใช่ตัวตัดสิน\n\n### รักษา Cushing\n- Cushing disease: transsphenoidal surgery เป็น first-line หลังผ่าตัด cortisol ต่ำ (บ่งว่าหาย) ต้องให้ hydrocortisone จนแกน HPA ฟื้น; ถ้าไม่หายใช้ผ่าตัดซ้ำ radiotherapy ยา (ketoconazole, metyrapone, osilodrostat, pasireotide, cabergoline) หรือ bilateral adrenalectomy (เสี่ยง Nelson syndrome)\n- Ectopic ACTH: ตัดก้อน ถ้าทำไม่ได้ใช้ steroidogenesis inhibitor หรือ bilateral adrenalectomy\n- Adrenal adenoma: unilateral adrenalectomy พร้อม steroid cover เพราะต่อมอีกข้างฝ่อ\n- Cortisol สูงมาก: ให้ PJP prophylaxis และ VTE prophylaxis\n\n### Pheochromocytoma: กลไกและอาการ 5P\n- เนื้องอก chromaffin cell ของ adrenal medulla (นอก adrenal เรียก paraganglioma) หลั่ง norepinephrine, epinephrine เป็นพัก ๆ\n- ~30–40% มี germline mutation (RET ใน MEN2, VHL, NF1, SDHx) จึงควรส่งตรวจพันธุกรรมทุกราย \"rule of 10\" เลิกใช้แล้ว\n- **5P**: Pressure (HT แบบ paroxysmal หรือ sustained), Pain (headache), Perspiration, Palpitation, Pallor (vasoconstriction)\n- Triad headache + sweating + palpitation ในคน HT มี specificity สูง\n- อาการอื่น: tremor, anxiety, น้ำหนักลด, hyperglycemia, **orthostatic hypotension** (ปริมาตรเลือดหดจาก vasoconstriction และ pressure natriuresis), catecholamine cardiomyopathy\n- **ไม่ใช่ลักษณะของ pheo**: pitting edema, น้ำหนักขึ้น, bradycardia เพราะผู้ป่วยขาดน้ำในหลอดเลือดและ catabolic\n- ตัวกระตุ้น attack: ยาสลบ, metoclopramide, glucocorticoid, β-blocker ที่ให้ก่อน α-blocker, อาหาร tyramine สูง, คลำก้อนแรง\n\n### วินิจฉัยและรักษา pheo\n1. Biochemistry ก่อนภาพ: **plasma free metanephrines** (เจาะท่านอนหลังพัก 30 นาที) หรือ 24-h urine fractionated metanephrines; สูง > 3–4 เท่าแทบยืนยัน\n2. แล้วจึง CT/MRI adrenal (ก้อน > 10 HU บน non-contrast CT, T2 สว่าง); ถ้าสงสัยหลายก้อนหรือแพร่กระจายใช้ Ga-68 DOTATATE PET\n3. ห้าม biopsy (กระตุ้น hypertensive crisis); adrenal incidentaloma ทุกก้อนต้องตรวจ metanephrines\n4. ก่อนผ่าตัด: **α-blocker ก่อนเสมอ** (phenoxybenzamine หรือ doxazosin) 7–14 วัน ร่วมกับเกลือและน้ำมาก ๆ เป้า BP นั่ง < 130/80 และ SBP ยืน > 90 จึงเพิ่ม β-blocker ถ้าชีพจรเร็ว (ให้ β ก่อน α → unopposed α vasoconstriction → crisis)\n5. Laparoscopic adrenalectomy; หลังผ่าตัดระวัง hypotension และ hypoglycemia; ติดตาม metanephrines ตลอดชีวิต\n6. Hypertensive crisis: phentolamine IV, nicardipine หรือ nitroprusside", "pearls": ["Cortisol ไม่ถูกกดทั้ง low- และ high-dose dex + ACTH สูงมาก = ectopic ACTH (SCLC/carcinoid); ถูกกดด้วย high-dose = Cushing disease", "คัดกรอง Cushing ด้วย 1-mg overnight DST (cortisol 08:00 > 1.8 µg/dL ผิดปกติ), 24-h UFC, late-night salivary cortisol อย่างน้อย 2 test", "ACTH-dependent → MRI pituitary; adenoma ≥ 10 mm และ dynamic test เข้ากัน = Cushing disease; ก้อนเล็กหรือไม่เห็น → BIPSS", "Ectopic ACTH มักมา K ต่ำรุนแรง + metabolic alkalosis + น้ำหนักลด มากกว่ารูปร่าง cushingoid", "Pheo = Pressure, Pain, Perspiration, Palpitation, Pallor; ไม่มี pitting edema; ตรวจ plasma free/urine metanephrines ก่อนภาพ", "Pheo ให้ α-blocker ก่อน β-blocker เสมอ และห้าม biopsy ก้อน"], "traps": [{"id": "EN-OLDP-047", "note": "โพยตอบ Cushing disease แต่ cortisol ที่ไม่ถูกกดทั้ง low-dose และ high-dose dexamethasone ร่วมกับ ACTH สูง ชี้ไปที่ ectopic ACTH syndrome (เหมือนข้อ PP28-END-098); Cushing disease ส่วนใหญ่ cortisol ลด > 50% กับ high-dose dex"}, {"id": "PPSAQ-END-097", "note": "โพยให้ทำ high-dose DST ± CRH แล้วค่อย MRI และทำ IPSS เมื่อก้ำกึ่ง ซึ่งยังพอใช้ได้แต่ลำดับเก่า แนวทางปัจจุบันเมื่อยืนยัน ACTH-dependent แล้วให้ทำ MRI pituitary เลย ร่วมกับ CRH/desmopressin test; HDDST accuracy ต่ำ (~80%) จึงเป็นแค่ข้อมูลเสริม และ BIPSS ทำเมื่อ adenoma < 6–10 mm, ไม่เห็นก้อน หรือผลขัดกัน"}], "q": [{"id": "EN-OLDP-047", "q": "A patient is investigated for suspected Cushing syndrome. Morning serum cortisol is 30 microgram/dL, cortisol is not suppressed by either low-dose or high-dose dexamethasone, and plasma ACTH is high. What is the most likely diagnosis?", "a": "Pituitary ACTH-secreting adenoma (Cushing disease)", "y": [32], "t": 272}, {"id": "PPSAQ-END-097", "q": "A patient with cushingoid features has a high 24-hour urinary free cortisol and fails to suppress on the overnight 1-mg dexamethasone test. Plasma ACTH is normal-to-high. What is the next step to localise the source?", "a": "High-dose dexamethasone suppression test (± CRH test) followed by MRI of the pituitary; inferior petrosal sinus sampling if equivocal", "y": [], "t": 272}, {"id": "PP28-END-098", "q": "A patient who denies taking any steroid has morning cortisol 30 µg/dL, failure of cortisol suppression on both low-dose and high-dose dexamethasone tests, and a markedly high plasma ACTH. What is the most likely diagnosis?", "a": "Ectopic ACTH syndrome (e.g., small cell lung cancer or carcinoid)", "y": [28, 29], "t": 272}, {"id": "EN-OLDP-048", "q": "Pheochromocytoma classically presents with pallor, pain (headache), perspiration, palpitations and pressure (hypertension). Which of the following is NOT a feature of pheochromocytoma?", "a": "Pitting peripheral edema", "y": [30], "t": 274}], "years": [28, 29, 30, 32], "th": [272, 274]}, {"id": "gap-endo-02", "set": "endo", "title": "Pituitary adenoma, hyperprolactinemia และ hypopituitarism", "subtitle": "ตรวจฮอร์โมนครบทุกแกน ไล่หาสาเหตุ prolactin สูง ทดแทนฮอร์โมนให้ถูกลำดับ และผลของ hypogonadism", "md": "### กลไก: ก้อนที่ pituitary ก่อปัญหา 3 ทาง\n- ขนาด: microadenoma < 10 mm, **macroadenoma ≥ 10 mm**\n1. **ฮอร์โมนเกิน**: prolactinoma พบบ่อยที่สุดในก้อนที่ทำงาน ตามด้วย GH (acromegaly), ACTH (Cushing disease), TSH พบน้อย\n2. **ฮอร์โมนขาดจากการกด**: เสียตามลำดับ GH → LH/FSH → TSH → ACTH ส่วน prolactin มักสูงเล็กน้อยจาก *stalk effect* (dopamine จาก hypothalamus ส่งลงมาไม่ได้)\n3. **Mass effect**: ปวดศีรษะ, bitemporal hemianopia (กด optic chiasm), CN III/IV/VI palsy (cavernous sinus), pituitary apoplexy\n- Diabetes insipidus พบน้อยใน adenoma ถ้ามีให้คิดถึง craniopharyngioma, metastasis, hypophysitis\n\n### Baseline hormone panel ของ macroadenoma ทุกราย\n\n| แกน | Test | เหตุผล |\n|---|---|---|\n| Prolactin | serum prolactin (ถ้าก้อนใหญ่แต่ PRL สูงเล็กน้อย ให้ dilute ซ้ำเพื่อตัด hook effect) | prolactinoma รักษาด้วยยา ไม่ต้องผ่าตัด |\n| GH | IGF-1 | acromegaly (ยืนยันด้วย OGTT: GH ไม่กดลง < 1 µg/L) |\n| ACTH | cortisol 08:00 ± ACTH | adrenal insufficiency อันตรายถึงชีวิต |\n| TSH | **free T4 คู่ TSH** | central hypothyroidism: FT4 ต่ำแต่ TSH ต่ำหรือปกติ ใช้ TSH อย่างเดียวพลาด |\n| Gonad | LH/FSH + testosterone (ชาย) หรือประวัติประจำเดือน + estradiol (หญิง) | hypogonadotropic hypogonadism |\n| Posterior | Na, serum/urine osmolality | DI |\n\n- ถ้าก้อนใกล้ chiasm ตรวจ formal visual field (perimetry)\n- ตอบข้อสอบ: ชาย 40 ปี macroadenoma 2.5 cm → prolactin, IGF-1, cortisol เช้า (± ACTH), FT4 + TSH, LH/FSH + testosterone\n\n### Hyperprolactinemia: amenorrhea + galactorrhea\nกลไก: dopamine จาก hypothalamus กด prolactin ตลอดเวลา; prolactin สูงไปกด GnRH pulse → LH/FSH ต่ำ → amenorrhea, มีบุตรยาก, libido ลด, ED, กระดูกบาง และ galactorrhea\nInitial tests ก่อนส่ง MRI:\n1. **Pregnancy test (β-hCG)** สาเหตุที่พบบ่อยที่สุดของประจำเดือนขาด\n2. **Serum prolactin** เจาะครั้งเดียวในภาวะไม่เครียด\n3. **TSH/FT4**: primary hypothyroidism (TRH สูงกระตุ้น prolactin)\n4. **Creatinine**: CKD ลดการกำจัด prolactin\n5. **ประวัติยา**: antipsychotic (risperidone, haloperidol), metoclopramide, domperidone, TCA/SSRI, verapamil, methyldopa, opioid, estrogen\n- ถ้าไม่พบสาเหตุรอง จึงทำ MRI pituitary\n- ระดับช่วยแยก: prolactin > 250 ng/mL ชี้ prolactinoma; stalk effect มักไม่เกิน ~100 ng/mL; macroprolactin อาจทำให้ค่าสูงโดยไม่มีอาการ\n- สาเหตุอื่น: ตั้งครรภ์ ให้นมบุตร กระตุ้นหัวนม รอยโรคผนังอก (herpes zoster) cirrhosis\n- รักษา: **dopamine agonist เป็น first-line แม้เป็น macroprolactinoma ที่กด chiasm** (cabergoline 0.25–0.5 mg สัปดาห์ละ 1–2 ครั้ง ปรับขึ้นตาม prolactin; ก้อนยุบเร็ว) ผ่าตัดเมื่อดื้อยาหรือทนยาไม่ได้; microprolactinoma ไม่มีอาการ ติดตามได้; ระวัง impulse control disorder จาก dopamine agonist\n\n### Hypopituitarism: สาเหตุ\n- Tumor, หลังผ่าตัดหรือฉายแสง, apoplexy, hypophysitis (รวมจาก immune checkpoint inhibitor), TB, trauma\n- **Sheehan syndrome**: ตกเลือดหลังคลอดรุนแรง → pituitary ที่โตตอนตั้งครรภ์ขาดเลือดตาย → ไม่มีน้ำนม (prolactin), ประจำเดือนไม่มา, อ่อนเพลีย, Na ต่ำ (ACTH ขาด), hypothyroid\n\n### ทดแทนฮอร์โมนใน panhypopituitarism\n\n| ฮอร์โมนที่ขาด | ทดแทน | ติดตาม |\n|---|---|---|\n| ACTH (สำคัญที่สุด) | hydrocortisone 15–25 mg/วัน แบ่ง 2–3 มื้อ (มื้อเช้ามากสุด) หรือ prednisolone 3–5 mg/วัน; **ไม่ต้องให้ fludrocortisone** เพราะ aldosterone ยังคุมด้วย RAAS | อาการ; สอน sick day rules |\n| TSH | levothyroxine ~1.6 µg/kg/วัน | **free T4** ให้อยู่ครึ่งบนของค่าปกติ ไม่ใช้ TSH |\n| LH/FSH ในชาย | testosterone (ฉีดหรือเจล) | testosterone, Hct, PSA |\n| LH/FSH ในหญิงก่อนวัยหมดประจำเดือน | estrogen + progestin (ถ้ามีมดลูก) จนถึงวัยหมดประจำเดือน; อยากมีบุตรใช้ gonadotropin | อาการ, BMD |\n| GH | recombinant GH ในผู้ใหญ่เป็นทางเลือก ให้เมื่อมีอาการชัดและไม่มี malignancy | IGF-1 |\n| ADH | desmopressin | Na |\n\n- **ให้ glucocorticoid ก่อน levothyroxine** เพราะ thyroxine เร่งการกำจัด cortisol อาจกระตุ้น adrenal crisis\n- ข้อสอบถามว่าฮอร์โมนใด *ไม่จำเป็น* ต้องทดแทน → **growth hormone** (ขาดแล้วไม่ถึงชีวิต ราคาแพง); ส่วน cortisol และ thyroxine ขาดไม่ได้ และ sex steroid ควรให้ในหญิงอายุ 30 ปีเพื่อป้องกันกระดูกพรุน\n\n### Hypogonadism ในชาย: ผลต่อกล้ามเนื้อและร่างกาย\n- Testosterone เป็น anabolic hormone กระตุ้น muscle protein synthesis และ satellite cell ดังนั้น hypogonadism → **muscle mass และ strength ลดลง** ไขมันเพิ่ม (โดยเฉพาะ visceral)\n- อื่น ๆ: libido ลด, ED, อ่อนเพลีย, กระดูกพรุน, anemia เล็กน้อย (testosterone กระตุ้น erythropoietin), ขนตามตัวลด, gynecomastia, hot flushes\n- วินิจฉัย: total testosterone เช้าขณะอดอาหาร ต่ำ 2 ครั้ง (< ~264–300 ng/dL) แล้วดู LH/FSH\n- LH/FSH สูง = primary (Klinefelter 47,XXY, mumps orchitis, เคมีบำบัด) ; LH/FSH ต่ำหรือปกติ = secondary (pituitary tumor, prolactin สูง, opioid, glucocorticoid, อ้วน) → ตรวจ prolactin และ MRI\n- รักษาด้วย testosterone; ห้ามในมะเร็งต่อมลูกหมากหรือเต้านม, Hct > 50%, OSA รุนแรงที่ไม่ได้รักษา; ถ้าต้องการมีบุตรใช้ hCG แทน เพราะ testosterone จากภายนอกกด spermatogenesis", "pearls": ["Macroadenoma ≥ 10 mm ตรวจครบทุกแกน: prolactin, IGF-1, cortisol 08:00, FT4 + TSH, LH/FSH + testosterone", "Amenorrhea + galactorrhea: β-hCG, prolactin, TSH/FT4, creatinine และประวัติยา ก่อน MRI", "Central hypothyroidism ติดตามด้วย FT4 ไม่ใช่ TSH และต้องให้ steroid ก่อน thyroxine", "Panhypopituitarism: GH ไม่จำเป็นต้องทดแทน และไม่ต้องให้ fludrocortisone", "Prolactinoma แม้เป็น macroadenoma ที่กด chiasm ให้ cabergoline เป็น first-line", "Hypogonadism ในชายทำให้ muscle mass และ strength ลดลง"], "traps": [], "q": [{"id": "PP30-END-013", "q": "A 40-year-old man has a 2.5-cm pituitary macroadenoma found on MRI. Which baseline hormonal panel is most appropriate?", "a": "Prolactin, IGF-1, morning cortisol (± ACTH), free T4 with TSH, and LH/FSH with testosterone", "y": [30], "t": 275}, {"id": "PP30-END-091", "q": "A 28-year-old woman has amenorrhoea and galactorrhoea. Which initial tests are most appropriate?", "a": "Pregnancy test, serum prolactin, TSH/free T4 and renal function, with a drug history", "y": [30], "t": 275}, {"id": "PP31-END-002", "q": "A 30-year-old woman is diagnosed with panhypopituitarism. Which hormone does NOT necessarily have to be replaced?", "a": "Growth hormone", "y": [31], "t": 275}, {"id": "PP31-END-017", "q": "What are the effects of hypogonadism on skeletal muscle?", "a": "Decreased mass and strength", "y": [31], "t": 276}], "years": [30, 31], "th": [275, 276]}, {"id": "gap-endo-04", "set": "endo", "title": "คำแนะนำผู้ป่วย Graves ที่กินยาต้านไทรอยด์ — อาหาร goitrogen ไอโอดีน และความปลอดภัยของยา", "subtitle": "กะหล่ำปลีกินได้ ไอโอดีนเกินต้องระวัง และสิ่งที่ต้องสอนก่อนกลับบ้านเมื่อเริ่ม methimazole", "md": "### Goitrogen ในอาหาร: กลไกและขนาดที่มีผลจริง\n- ผักตระกูลกะหล่ำ (cruciferous: กะหล่ำปลี บรอกโคลี กะหล่ำดอก คะน้า) มี glucosinolate ซึ่งถูกเอนไซม์ myrosinase เปลี่ยนเป็น **thiocyanate** (แย่งไอโอไดด์ที่ sodium-iodide symporter) และ **goitrin** (ยับยั้ง thyroid peroxidase)\n- มันสำปะหลังดิบให้ thiocyanate, ถั่วเหลือง (isoflavone) ยับยั้ง TPO อ่อน ๆ\n- ผลต่อต่อมไทรอยด์เกิดเมื่อ **กินดิบปริมาณมากมากต่อเนื่อง ร่วมกับขาดไอโอดีน**; การปรุงสุกทำลาย myrosinase\n- ดังนั้นผู้ป่วย Graves หรือ hypothyroid **กินกะหล่ำปลีปรุงสุกปริมาณปกติได้ ไม่ต้องงด** และกะหล่ำปลีก็ไม่ได้ช่วยรักษา hyperthyroidism จนทดแทนยาได้\n\n### ไอโอดีน: สิ่งที่ควรระวังจริง\n- ไอโอดีนปริมาณมากเป็นวัตถุดิบสร้างฮอร์โมน ใน toxic nodular goiter อาจกระตุ้น thyrotoxicosis (Jod–Basedow) และใน Graves ทำให้คุมยากและลดการจับ RAI\n- ผู้ป่วยไทยใช้เกลือหรือน้ำปลาเสริมไอโอดีนปริมาณปกติได้\n- หลีกเลี่ยงไอโอดีนเกิน: สาหร่ายทะเล (kelp) และอาหารเสริมสาหร่าย, ยาที่มีไอโอดีน (amiodarone), สารทึบรังสี, povidone-iodine ปริมาณมาก\n- ถ้าจะรักษาด้วย RAI: กิน low-iodine diet 1–2 สัปดาห์ และหยุด methimazole 2–3 วันก่อนกลืนแร่\n- เลิกบุหรี่ เพราะบุหรี่เพิ่มความเสี่ยงและความรุนแรงของ Graves orbitopathy (โดยเฉพาะหลัง RAI)\n- ลดกาแฟถ้าใจสั่น, กินโปรตีนและพลังงานพอ (catabolic), แคลเซียมและวิตามินดีพอ (กระดูกบาง)\n- งดอาหารเสริม \"บำรุงไทรอยด์\" ที่อาจผสม T3/T4 และงด biotin ขนาดสูงอย่างน้อย 2 วันก่อนเจาะ TFT เพราะรบกวน immunoassay (FT4 สูงลวง TSH ต่ำลวง)\n\n### ทบทวนยาต้านไทรอยด์ที่ต้องสอนผู้ป่วย\n\n| หัวข้อ | Methimazole (MMI) | Propylthiouracil (PTU) |\n|---|---|---|\n| ตำแหน่ง | **first-line** เกือบทุกราย | ไตรมาสแรกของการตั้งครรภ์, thyroid storm, แพ้ MMI แบบไม่รุนแรงและไม่ต้องการ RAI/ผ่าตัด |\n| กลไกเพิ่ม | ยับยั้ง TPO | ยับยั้ง TPO + ยับยั้ง peripheral T4 → T3 |\n| ขนาดทั่วไป | 10–30 mg วันละครั้งตามระดับ FT4 | 50–150 mg วันละ 3 ครั้ง; storm 200–250 mg ทุก 4 ชม. |\n| พิษเด่น | cholestatic hepatitis; embryopathy ช่วงสัปดาห์ 6–10 (aplasia cutis, choanal/esophageal atresia) | **hepatocellular necrosis รุนแรง**, ANCA-associated vasculitis |\n| ร่วมกันทั้งสอง | **agranulocytosis** (~0.2–0.5%, ส่วนใหญ่ใน 90 วันแรก; ขึ้นกับขนาดยา), ผื่น, คัน, ปวดข้อ | agranulocytosis เช่นกัน (ไม่ขึ้นกับขนาดยา), ผื่น, ปวดข้อ |\n\n- **Agranulocytosis**: สอนให้หยุดยาทันทีและมาเจาะ CBC เมื่อมีไข้หรือเจ็บคอ; ANC < 500/µL ห้ามเปลี่ยนไปใช้ ATD อีกตัว (cross-reactivity) ให้รักษาด้วย RAI หรือผ่าตัด; ให้ antibiotic กว้างถ้ามีไข้ และ G-CSF ในรายรุนแรง\n- **Propranolol** 10–40 mg วันละ 3–4 ครั้ง คุมใจสั่น มือสั่น ระหว่างรอ ATD ออกฤทธิ์ (4–6 สัปดาห์); ห้ามในหอบหืด ใช้ atenolol/metoprolol แทน\n- ตั้งครรภ์: PTU ในไตรมาสแรก แล้วพิจารณาเปลี่ยนเป็น MMI ตั้งแต่ไตรมาสที่ 2; เป้า FT4 อยู่ขอบบนของค่าปกติด้วยยาขนาดต่ำที่สุด\n- ติดตาม FT4 (± T3) ทุก 4–6 สัปดาห์ช่วงแรก เพราะ TSH ยังถูกกดอยู่นานหลายเดือน; ระยะเวลาให้ยา 12–18 เดือนแล้วประเมินการหยุดยา", "pearls": ["ผู้ป่วย Graves กินกะหล่ำปลีปรุงสุกปริมาณปกติได้ goitrogen มีผลเฉพาะกินดิบปริมาณมากร่วมกับขาดไอโอดีน", "ที่ต้องระวังคือไอโอดีนเกิน: สาหร่าย อาหารเสริม amiodarone สารทึบรังสี และ low-iodine diet ก่อน RAI", "MMI เป็น first-line; PTU เฉพาะไตรมาสแรก thyroid storm หรือแพ้ MMI", "ไข้หรือเจ็บคอขณะกิน ATD → หยุดยา เจาะ CBC ทันที; agranulocytosis ห้ามเปลี่ยนไปอีกตัว", "เลิกบุหรี่ลดความเสี่ยง Graves orbitopathy"], "traps": [], "q": [{"id": "PP34-END-025", "q": "A 30-year-old woman newly diagnosed with Graves' disease is started on methimazole and propranolol. She asks whether she is allowed to eat cabbage. What is the most appropriate advice?", "a": "Ordinary dietary amounts of cooked cabbage are safe; no special restriction is needed", "y": [34], "t": 268}], "years": [34], "th": []}], "left": []}, {"set": "hemonc", "name": "Heme/Onc", "n_lec": 103, "n_unc": 23, "lectures": [{"lec": "12/10", "title": "Approach to WBC disorder and lymphadenopathy", "n": 7, "angle": {"ix": 2, "dx": 1, "mx": 2, "fact": 2}, "pattern": "ข้อสอบจากบทนี้น้อย (7 ข้อ) และกระจายรุ่น 29–34 ส่วนใหญ่เป็น spot diagnosis/เลือก investigation ของ leukemia/lymphoma (CML → BCR-ABL1, CLL, lymph node → excisional biopsy) ส่วน AML ถามเรื่องการรักษา (7+3, เป้าหมายในผู้สูงอายุ) ข้อสอบ smear ของ leukemia ส่วนใหญ่ไปอยู่ในบท PBS แทน", "tip": "จำคู่ 'โรค → ตรวจยืนยัน' (CML–BCR-ABL1, lymphoma–excisional biopsy) และเติมการรักษา AML (7+3, ATRA ใน APL) เองเพราะเนื้อหาในเว็บไม่มีสูตร 7+3", "secs": [{"t": "อ่าน CBC ให้เป็น — absolute count และแผนที่ของเม็ดเลือดขาว", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "กลไกของ neutrophilia — neutrophil 5 คลัง", "n": 0, "y": [], "w": null, "c": "กลไก neutrophilia 5 คลังเป็นสรีรวิทยา ไม่เคยถาม", "s": [], "q": []}, {"t": "Left shift, leukemoid reaction และ CML", "n": 1, "y": [31], "w": "CML: ม้ามโตมาก WBC 120,000 myelocyte+basophilia → ยืนยันด้วย BCR-ABL1/Ph chromosome", "c": null, "s": ["CML → BCR-ABL1/Ph chromosome"], "q": [{"q": "A 45-year-old man has fatigue and left upper quadrant fullness. Examination shows massive splenomegaly. CBC: Hb 11 g/dL, WBC 120,000/µL with a full spectrum of myeloid cells (myelocytes, metamyelocytes, basophilia), platelets 520,000/µL. Which investigation confirms the diagnosis?", "a": "Detection of BCR-ABL1 by RT-PCR or the Philadelphia chromosome by cytogenetics", "y": [31], "an": "ix", "sub": "CML → BCR-ABL1/Ph chromosome", "t": 305}]}, {"t": "Monocytosis และ lymphocytosis — reactive หรือ clone", "n": 1, "y": [33], "w": "คนไม่มีอาการ lymphocyte ตัวเล็กโตเต็มที่สูงมาก → CLL", "c": null, "s": ["lymphocytosis ไม่มีอาการ → CLL"], "q": [{"q": "An asymptomatic patient is found on routine blood testing to have a markedly increased number of small mature-looking lymphocytes in the peripheral blood. What is the most likely diagnosis?", "a": "Chronic lymphocytic leukaemia", "y": [33], "an": "dx", "sub": "lymphocytosis ไม่มีอาการ → CLL", "t": 302}]}, {"t": "Eosinophilia — พยาธิ ภูมิแพ้ ยา หรือ clone", "n": 0, "y": [], "w": null, "c": "Eosinophilia (พยาธิ/ยา/clone) เนื้อหาเยอะแต่ไม่เคยออก — อ่านพอรู้สาเหตุหลัก", "s": [], "q": []}, {"t": "Leukopenia และ neutropenia — กลไก สาเหตุ และ approach", "n": 0, "y": [], "w": null, "c": "Neutropenia approach ไม่เคยถูกถามตรง ๆ แต่ febrile neutropenia ออกในฝั่ง onc", "s": [], "q": []}, {"t": "Acute leukemia — ทำไมมาด้วยซีด ไข้ เลือดออก", "n": 2, "y": [29, 31], "w": "AML: ผู้สูงอายุ 81 ปี blast+Auer rod → คุยเป้าหมาย/low-intensity แทน induction; คนหนุ่มแข็งแรง → 7+3 (cytarabine+anthracycline) — สูตร 7+3 ไม่มีในเนื้อหา", "c": null, "s": ["AML ผู้สูงอายุเปราะบาง — goal of care", "AML induction 7+3 (ไม่มีในเนื้อหา)"], "q": [{"q": "An 81-year-old man has fever, pallor and bleeding. CBC shows pancytopenia; the smear shows normochromic normocytic red cells and >20% myeloblasts, some containing Auer rods. What is the diagnosis, and what is the most appropriate approach given his frailty?", "a": "Acute myeloid leukaemia; discuss goals of care — low-intensity therapy or palliative/supportive care rather than intensive induction chemotherapy", "y": [29], "an": "mx", "sub": "AML ผู้สูงอายุเปราะบาง — goal of care", "t": 301}, {"q": "A 34-year-old man has fatigue, gum bleeding and fever. CBC shows WBC 46,000/µL with 70% blasts; the blasts contain Auer rods and are myeloperoxidase positive. Cytogenetics do not show t(15;17). Which induction regimen is standard for this fit patient?", "a": "Cytarabine for 7 days plus an anthracycline (daunorubicin or idarubicin) for 3 days (7+3)", "y": [31], "an": "mx", "sub": "AML induction 7+3 (ไม่มีในเนื้อหา)", "t": 301}]}, {"t": "Hyperleukocytosis และ leukostasis", "n": 0, "y": [], "w": null, "c": "Hyperleukocytosis/leukostasis ยังไม่เคยออก แต่เป็นเรื่องฉุกเฉินที่ควรรู้หลักรักษา", "s": [], "q": []}, {"t": "Approach to lymphadenopathy — ประวัติ ลักษณะต่อม และเมื่อไรต้อง biopsy", "n": 1, "y": [34], "w": "ต่อมน้ำเหลืองยาง ๆ ทั่วตัว + B symptoms → excisional biopsy ทั้งต่อม (ไม่ใช่ FNA)", "c": null, "s": ["เมื่อไรต้องตัด — excisional LN biopsy"], "q": [{"q": "A 50-year-old woman has 2 months of painless, generalised rubbery lymphadenopathy with night sweats and weight loss. Lymphoma is suspected. What is the best diagnostic procedure?", "a": "Excisional biopsy of a whole lymph node", "y": [34], "an": "ix", "sub": "เมื่อไรต้องตัด — excisional LN biopsy", "t": 306}]}, {"t": "ตำแหน่งของต่อมบอกต้นเหตุ — แผนที่การระบายน้ำเหลือง", "n": 0, "y": [], "w": null, "c": "แผนที่ต่อมน้ำเหลือง (Virchow ฯลฯ) ยังไม่เคยออกในชุดนี้", "s": [], "q": []}, {"t": "Lymphoma — เกิดจากระยะไหน และแบ่งกลุ่มตามความเร็ว", "n": 1, "y": [32], "w": "NHL (aggressive เช่น DLBCL) เป็นมะเร็งที่หายขาดได้ด้วยยาเคมี", "c": null, "s": ["aggressive NHL หายขาดได้ด้วยยาเคมี"], "q": [{"q": "Which malignancy is highly chemosensitive, i.e. can respond to and even be cured by systemic chemotherapy alone?", "a": "Non-Hodgkin lymphoma", "y": [32], "an": "fact", "sub": "aggressive NHL หายขาดได้ด้วยยาเคมี", "t": 334}]}, {"t": "Hodgkin, indolent NHL และ B symptoms — อาการเฉพาะและ staging", "n": 1, "y": [31], "w": "ปัจจัยพยากรณ์ไม่ดีของ NHL = stage III–IV (Ann Arbor)", "c": null, "s": ["Ann Arbor stage III–IV = poor prognosis"], "q": [{"q": "Which of the following indicates a poor prognosis in non-Hodgkin lymphoma (NHL)?", "a": "Stage III-IV", "y": [31], "an": "fact", "sub": "Ann Arbor stage III–IV = poor prognosis", "t": 306}]}, {"t": "ภาวะฉุกเฉินของ lymphoma — TLS และ SVC syndrome", "n": 0, "y": [], "w": null, "c": "TLS/SVC syndrome ไม่มีข้อจากฝั่ง heme — เป็นภาวะฉุกเฉินที่น่าจะออก MEQ/OSCE ได้", "s": [], "q": []}], "th": [305, 302, 301, 306]}, {"lec": "2/11", "title": "General oncology", "n": 37, "angle": {"mx": 7, "fact": 16, "mech": 5, "ix": 2, "dx": 7}, "pattern": "เน้น fact/recall สั้น ๆ มากกว่าเคส: 'มะเร็งใดหายขาดด้วยยาเคมี', 'tumour marker → ชนิด germ cell tumour', 'risk factor–มะเร็ง' ถามซ้ำแทบทุกรุ่น (28–35) ส่วนเคสจะเป็นมะเร็งเต้านมและ SCLC ที่ถามการรักษาขั้นต่อไป", "tip": "ท่องให้แม่น: testicular GCT/lymphoma หายขาดด้วยเคมี, β-hCG vs AFP ใน mediastinal GCT, ECOG 0–4, การรักษาเต้านมตาม ER/HER2 และ SCLC = chemo ± RT; สถิติ (95% CI) ก็หลุดมาในชุดนี้ และพิษยาเคมี (doxorubicin → หัวใจ/รั่วนอกเส้น, bleomycin → ปอด)", "secs": [{"t": "ระบาดวิทยาของมะเร็ง — โลกและประเทศไทย", "n": 0, "y": [], "w": null, "c": "ระบาดวิทยา GLOBOCAN/ไทย ไม่เคยถาม", "s": [], "q": []}, {"t": "เป้าหมายการรักษา — หายขาดหรือประคับประคอง", "n": 2, "y": [32, 35], "w": null, "c": null, "s": ["ตัดก้อนหมด ไม่พบมะเร็ง → เฝ้าติดตาม", "adjuvant กำจัด micrometastasis"], "q": [{"q": "A T1N0M0 mass is completely excised. Histology of the resected specimen shows no malignancy. What is the most appropriate next step?", "a": "Observation with regular surveillance", "y": [32], "an": "mx", "sub": "ตัดก้อนหมด ไม่พบมะเร็ง → เฝ้าติดตาม", "t": 342}, {"q": "What is the purpose of giving adjuvant chemotherapy after curative cancer surgery?", "a": "To eradicate residual micrometastatic disease and lower the risk of recurrence", "y": [35], "an": "fact", "sub": "adjuvant กำจัด micrometastasis", "t": 342}]}, {"t": "ปัจจัยของผู้ป่วยและของมะเร็ง — performance status", "n": 2, "y": [28, 31], "w": "ECOG: เตะฟุตบอลได้ = ECOG 0 + curative intent; นิยาม ECOG 3", "c": null, "s": ["ECOG 0 + treatment intent", "ECOG 3 นิยาม"], "q": [{"q": "A man with cancer staged T3N1M0 is still able to play football. What is his performance status and the appropriate treatment intent?", "a": "ECOG 0; curative intent with neoadjuvant therapy", "y": [31], "an": "fact", "sub": "ECOG 0 + treatment intent", "t": 337}, {"q": "A patient diagnosed with lymphoma has his performance status assessed as ECOG 3. Which of the following is the correct interpretation?", "a": "Symptomatic, confined to bed or chair more than 50% of waking hours and capable of only limited self-care, but not completely bedridden", "y": [28], "an": "fact", "sub": "ECOG 3 นิยาม", "t": 337}]}, {"t": "เซลล์ปกติกับเซลล์มะเร็ง — วงจรเซลล์และ hallmarks", "n": 1, "y": [34], "w": null, "c": null, "s": ["carcinoma in situ — basement membrane intact"], "q": [{"q": "Which histopathological feature defines ductal carcinoma in situ (DCIS) of the breast?", "a": "Malignant ductal epithelial cells confined within an intact basement membrane", "y": [34], "an": "fact", "sub": "carcinoma in situ — basement membrane intact", "t": 331}]}, {"t": "ยาเคมีบำบัดและวงจรเซลล์", "n": 10, "y": [28, 29, 31, 32, 34, 35], "w": "มะเร็งที่หายขาดด้วยยาเคมีได้ = testicular germ cell tumour (ถามซ้ำ 5 ข้อ รุ่น 28–35) · growth fraction สูงตอบสนองดี · myelosuppression = dose-limiting toxicity", "c": null, "s": ["germ cell tumour ไวต่อยาเคมี (curable)", "ยาเคมีที่รั่วนอกเส้นแล้วทำลายเนื้อเยื่อ", "ขนาดสะสม doxorubicin", "bleomycin → พังผืดในปอด"], "q": [{"q": "Extravasation of which chemotherapeutic agent causes the most severe local tissue injury?", "a": "Doxorubicin", "y": [34], "an": "fact", "sub": "ยาเคมีที่รั่วนอกเส้นแล้วทำลายเนื้อเยื่อ", "t": 6}, {"q": "What is the maximum safe (cumulative lifetime) dose of doxorubicin?", "a": "550 mg/m² cumulative lifetime dose", "y": [28], "an": "fact", "sub": "ขนาดสะสม doxorubicin", "t": 6}, {"q": "Which chemotherapeutic agent is classically associated with pulmonary toxicity (interstitial pneumonitis progressing to pulmonary fibrosis)?", "a": "Bleomycin", "y": [32], "an": "mech", "sub": "bleomycin → พังผืดในปอด", "t": 6}, {"q": "Which cancer is curable by chemotherapy?", "a": "Testicular CA", "y": [31, 35], "an": "fact", "sub": "germ cell tumour ไวต่อยาเคมี (curable)", "t": 334}, {"q": "Which malignancy can be cured by chemotherapy, even when it presents with metastatic disease?", "a": "Testicular germ cell tumor", "y": [29], "an": "fact", "sub": "germ cell tumour ไวต่อยาเคมี (curable)", "t": 334}, {"q": "Which malignancy shows the best response to chemotherapy?", "a": "Testicular cancer (germ cell tumour)", "y": [32], "an": "fact", "sub": "germ cell tumour ไวต่อยาเคมี", "t": 334}, {"q": "Which of the following malignancies is curable with chemotherapy?", "a": "Testicular cancer (germ cell tumor)", "y": [29], "an": "fact", "sub": "germ cell tumour ไวต่อยาเคมี (curable)", "t": 334}, {"q": "Which of the following tumor characteristics predicts a good response to chemotherapy?", "a": "A high proliferative rate (large growth fraction)", "y": [28], "an": "mech", "sub": "growth fraction สูง → ตอบสนองดี", "t": 334}, {"q": "Which of the following types of cancer can be completely cured by chemotherapy?", "a": "Testicular cancer", "y": [29], "an": "fact", "sub": "germ cell tumour ไวต่อยาเคมี (curable)", "t": 334}, {"q": "What is the most common dose-limiting side effect of cytotoxic chemotherapy?", "a": "Myelosuppression", "y": [31, 35], "an": "fact", "sub": "dose-limiting toxicity = myelosuppression", "t": 332}]}, {"t": "Targeted therapy — HER family, tyrosine kinase และ angiogenesis", "n": 2, "y": [32, 34], "w": null, "c": null, "s": ["HER2+ → trastuzumab", "EGFR → RAS-MAPK / PI3K-AKT"], "q": [{"q": "A 45-year-old woman has invasive ductal carcinoma of the breast that is oestrogen-receptor negative and HER2-positive (IHC 3+). Which targeted drug should be included in her systemic therapy?", "a": "Trastuzumab", "y": [34], "an": "mx", "sub": "HER2+ → trastuzumab", "t": 340}, {"q": "Activation of the epidermal growth factor receptor (EGFR) on a tumour cell produces which of the following effects?", "a": "Downstream RAS-MAPK and PI3K-AKT signalling that increases tumour cell proliferation", "y": [32], "an": "mech", "sub": "EGFR → RAS-MAPK / PI3K-AKT", "t": 344}]}, {"t": "Immuno-oncology — immune checkpoint inhibitors และ irAEs", "n": 0, "y": [], "w": null, "c": "Immune checkpoint inhibitors/irAEs ยังไม่เคยออก — เนื้อหาใหม่ อาจเริ่มออกในรุ่นถัดไป", "s": [], "q": []}, {"t": "มะเร็งเต้านม — คัดกรอง ชนิดย่อย และการรักษา", "n": 5, "y": [28, 31, 32, 34], "w": "ก้อนเต้านม FNA ลบ → core needle biopsy · ER+ → tamoxifen และผลข้างเคียงมะเร็งเยื่อบุโพรงมดลูก · BRCA · metastatic → palliative systemic", "c": null, "s": ["ก้อนเต้านม FNA ลบ → core needle biopsy", "HBOC — germline BRCA1/2", "ER+ HER2− → tamoxifen", "tamoxifen → มะเร็งเยื่อบุโพรงมดลูก"], "q": [{"q": "A 35-year-old woman has taken oral contraceptive pills continuously for 8 years since marriage, and her sister has breast cancer. A firm mass about 1 cm is palpable in her left breast. Mammography has been performed and fine-needle aspiration of the mass reports \"no malignancy found\". What is the most appropriate next advice?", "a": "Needle core biopsy", "y": [31], "an": "ix", "sub": "ก้อนเต้านม FNA ลบ → core needle biopsy", "t": 331}, {"q": "A woman is diagnosed with ovarian cancer; her mother had breast cancer. Which factor is the most important one in this patient?", "a": "Genetic predisposition — germline BRCA1/BRCA2 mutation (hereditary breast–ovarian cancer syndrome)", "y": [34], "an": "mech", "sub": "HBOC — germline BRCA1/2", "t": 338}, {"q": "A woman has breast cancer that is oestrogen-receptor positive and HER2 negative. Which drug is appropriate for her?", "a": "Tamoxifen", "y": [32], "an": "mx", "sub": "ER+ HER2− → tamoxifen", "t": 340}, {"q": "A 52-year-old postmenopausal woman has been taking tamoxifen for 3 years as adjuvant therapy for hormone-receptor-positive breast cancer. Which serious adverse effect of tamoxifen should she be counselled about?", "a": "Endometrial cancer", "y": [31], "an": "mech", "sub": "tamoxifen → มะเร็งเยื่อบุโพรงมดลูก", "t": 340}, {"q": "A patient with breast cancer now has metastasis to the bone. Which of the following is the best management?", "a": "Palliative systemic chemotherapy", "y": [28], "an": "mx", "sub": "ระยะแพร่กระจาย → palliative systemic therapy", "t": 341}]}, {"t": "Staging, grading และ tumour markers", "n": 4, "y": [31, 32, 35], "w": "anterior mediastinal mass + β-hCG สูงมาก AFP ปกติ → choriocarcinoma (สูงเล็กน้อย → seminoma) ถามซ้ำ 4 ข้อ", "c": null, "s": ["β-hCG สูงมาก AFP ปกติ → choriocarcinoma", "β-hCG สูงเล็กน้อย AFP ปกติ → seminoma"], "q": [{"q": "A young man is found to have an anterior mediastinal mass. Serum beta-hCG is markedly elevated while AFP is normal. Which is the most likely diagnosis?", "a": "Choriocarcinoma", "y": [32], "an": "dx", "sub": "β-hCG สูงมาก AFP ปกติ → choriocarcinoma", "t": 335}, {"q": "An 18-year-old single Thai man presents with dyspnoea. Chest radiograph shows an anterior mediastinal mass. Tumour markers show a mildly elevated beta-hCG with a normal AFP. Which malignancy is the most likely diagnosis?", "a": "Seminoma", "y": [31], "an": "dx", "sub": "β-hCG สูงเล็กน้อย AFP ปกติ → seminoma", "t": 335}, {"q": "An anterior mediastinal mass is found in a patient with a markedly elevated serum beta-hCG and a normal serum AFP. What is the most likely diagnosis?", "a": "Choriocarcinoma", "y": [35], "an": "dx", "sub": "β-hCG สูงมาก AFP ปกติ → choriocarcinoma", "t": 335}, {"q": "A 25-year-old man has an anterior mediastinal mass. Serum beta-hCG is markedly elevated and AFP is normal. Which tumour is most likely?", "a": "Choriocarcinoma", "y": [32], "an": "dx", "sub": "β-hCG สูงมาก AFP ปกติ → choriocarcinoma", "t": 335}]}, {"t": "คัดกรองและป้องกันมะเร็ง", "n": 2, "y": [31, 34], "w": "คัดกรองที่ลด mortality: mammography, FOBT/sigmoidoscopy ใน CRC", "c": null, "s": ["FOBT/sigmoidoscopy ลด CRC mortality", "mammography ลด mortality"], "q": [{"q": "A healthy 55-year-old woman with no family history of cancer asks you about cancer screening. Which statement is true?", "a": "Annual stool occult blood testing reduces colorectal cancer mortality, as does sigmoidoscopy", "y": [31], "an": "fact", "sub": "FOBT/sigmoidoscopy ลด CRC mortality", "t": 339}, {"q": "Which of the following cancer screening tests has been shown to reduce mortality?", "a": "Mammography for breast cancer", "y": [34], "an": "fact", "sub": "mammography ลด mortality", "t": 339}]}, {"t": "มะเร็งที่พบบ่อย 1 — ปอด ลำไส้ใหญ่ ตับ และทางเดินอาหารส่วนบน", "n": 6, "y": [31, 33, 35], "w": "SCLC → chemo (limited stage: platinum-etoposide + thoracic RT) · Lynch/HNPCC (CRC ไม่มี polyp + endometrial) · asbestos → mesothelioma · บุหรี่ → มะเร็งหลอดอาหาร", "c": null, "s": ["SCLC → chemotherapy", "limited-stage SCLC → platinum-etoposide + RT", "Lynch syndrome (HNPCC)", "Lynch syndrome — autosomal dominant"], "q": [{"q": "A patient is diagnosed with small cell lung cancer. Which is the most appropriate therapy?", "a": "Chemotherapy", "y": [33], "an": "mx", "sub": "SCLC → chemotherapy", "t": 333}, {"q": "A 64-year-old man who smokes is diagnosed with limited-stage small cell lung carcinoma confined to one hemithorax with ipsilateral hilar and mediastinal node involvement. His performance status is ECOG 1. What is the most appropriate treatment?", "a": "Concurrent platinum-etoposide chemotherapy with thoracic radiotherapy", "y": [31], "an": "mx", "sub": "limited-stage SCLC → platinum-etoposide + RT", "t": 333}, {"q": "A patient has a family history of colorectal cancer without polyposis together with endometrial cancer. What is the diagnosis?", "a": "Lynch syndrome (hereditary non-polyposis colorectal cancer, HNPCC)", "y": [33], "an": "dx", "sub": "Lynch syndrome (HNPCC)", "t": 338}, {"q": "A patient is diagnosed with colorectal cancer with no polyposis of the colon. His mother had cancer and his sister also had colon cancer; his father is unaffected. Which hereditary cancer syndrome does this family pattern represent?", "a": "Hereditary nonpolyposis colorectal cancer (Lynch syndrome), autosomal dominant", "y": [33], "an": "dx", "sub": "Lynch syndrome — autosomal dominant", "t": 338}, {"q": "Which exposure is the major risk factor for malignant mesothelioma?", "a": "Asbestos exposure", "y": [35], "an": "fact", "sub": "asbestos → mesothelioma", "t": 343}, {"q": "Which of the following statements about a risk factor and its associated cancer is true?", "a": "Smoking and oesophageal cancer", "y": [31], "an": "fact", "sub": "บุหรี่ → มะเร็งหลอดอาหาร", "t": 343}]}, {"t": "มะเร็งที่พบบ่อย 2 — ต่อมลูกหมาก ปากมดลูก รังไข่ ไต ไทรอยด์ ผิวหนัง และสมอง", "n": 2, "y": [32, 33, 35], "w": null, "c": null, "s": ["ก้อนอัณฑะ → scrotal ultrasound", "สมอง — brain metastasis จากเต้านม"], "q": [{"q": "A man is found to have a mass in the inguino-scrotal region, adjacent to the testis. Which is the most appropriate next investigation?", "a": "Scrotal (testicular) ultrasound", "y": [35], "an": "ix", "sub": "ก้อนอัณฑะ → scrotal ultrasound", "t": 336}, {"q": "A 55-year-old woman who had surgery and chemotherapy for breast cancer 3 years ago has 3 weeks of progressive left-sided headache, now with expressive (motor) aphasia and mild right arm weakness. What is the most likely diagnosis?", "a": "Brain metastasis from breast cancer", "y": [32, 33], "an": "dx", "sub": "สมอง — brain metastasis จากเต้านม", "t": 341}]}, {"t": "ภาวะฉุกเฉินทางมะเร็งและการดูแลประคับประคอง", "n": 1, "y": [31], "w": null, "c": null, "s": ["febrile neutropenia หลัง AC"], "q": [{"q": "A 48-year-old woman with breast cancer and lung metastasis received her first cycle of chemotherapy (adriamycin and cyclophosphamide) 10 days ago. She now presents with high-grade fever, productive cough and painful oral ulcers. Vital signs: BT 38.7 C, RR 26/min, PR 110/min, BP 130/80 mmHg. Examination shows multiple small oral ulcers and coarse crepitations at the right lower lung. Which of the following is NOT an appropriate management for her condition?", "a": "CT chest to rule out rapidly progressive breast cancer", "y": [31], "an": "mx", "sub": "febrile neutropenia หลัง AC", "t": 332}]}], "th": [342, 337, 331, 6, 334, 332, 344, 340, 341, 335, 339, 338, 343, 333, 336]}, {"lec": "9/11", "title": "Anemia — สไลด์ อ.Kunapa + pathophysiology แบบไล่กลไก 21 ภาวะ", "n": 39, "angle": {"dx": 12, "ix": 9, "interp": 2, "mx": 8, "fact": 4, "mech": 4}, "pattern": "บทที่ถูกถามมากที่สุดของกลุ่ม (39 ข้อ, รุ่น 29–35) — โจทย์มักเป็นหญิงสาวซีด/เหลือง ให้ CBC+smear แล้วถามขั้นต่อไป: IDA และ warm AIHA ออกซ้ำทุกรุ่น มักเป็นรูปแบบ NOT/EXCEPT และ management (prednisolone, คำแนะนำกินเหล็ก) รองลงมาคือ B12, pancytopenia → bone marrow และการถ่ายทอด thalassemia/HbE", "tip": "ทำ IDA (อาการ, iron profile, การกินเหล็ก), AIHA (DAT → prednisolone, least incompatible) และ B12 ให้แม่นก่อน แล้วฝึกคำนวณโอกาสลูกใน β-thal × HbE; ถ้าเวลาเหลือให้อ่าน hemostasis/hemophilia/vWD เพิ่มนอกเว็บเพราะออกบ่อยแต่ไม่มีบทในเว็บ", "secs": [{"t": "Approach to anemia ทั้งระบบ — ทีละขั้นจากเตียงถึงการวินิจฉัย", "n": 2, "y": [32], "w": null, "c": null, "s": ["ซีด+เหลือง+ม้ามโต = hemolysis", "indirect hyperbilirubinemia → hemolysis work-up"], "q": [{"q": "A patient presents with jaundice for 2 days. On examination he has mild anaemia and splenomegaly, and liver function tests were consistent with the diagnosis (the exact values were not legible in the recall note). Which of the following best explains his jaundice?", "a": "Haemolysis", "y": [32], "an": "dx", "sub": "ซีด+เหลือง+ม้ามโต = hemolysis", "t": 282}, {"q": "A 22-year-old man has progressive jaundice with cola-coloured urine throughout the day, without fever or abdominal pain. He had a blood transfusion for anaemia at age 10. He is pale. LFT: total bilirubin 5 mg/dL, mostly indirect, AST mildly raised, ALT and ALP normal, no reversal of albumin/globulin ratio. Which investigation is most appropriate next?", "a": "Peripheral blood smear with reticulocyte count and G6PD/haemolysis work-up", "y": [32], "an": "ix", "sub": "indirect hyperbilirubinemia → hemolysis work-up", "t": 282}]}, {"t": "สไลด์ อ.Kunapa ① — นิยาม onset 4 กลไก และ MCV", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "สไลด์ อ.Kunapa ② — แล็บ red cell indices reticulocyte 3 แบบ และ smear", "n": 1, "y": [31, 34, 35], "w": null, "c": null, "s": ["แล็บที่ส่งตามสมมติฐาน (hemolysis)"], "q": [{"q": "A 25-year-old woman presented with anemic symptoms for 2 weeks. She had no history of blood loss, fever or bleeding problem. Physical examination: moderately pale, mild jaundice, mild splenomegaly. Blood smear showed normochromic normocytic RBC, spherocytes 2+, polychromasia 1+, WBC normal, platelet adequate. Which investigation is NOT appropriate in this patient?", "a": "Stool occult blood", "y": [31, 34, 35], "an": "ix", "sub": "แล็บที่ส่งตามสมมติฐาน (hemolysis)", "t": 282}]}, {"t": "สไลด์ อ.Kunapa ③ — Case 1: pancytopenia ชาย 33 ปี → aplastic anemia", "n": 4, "y": [30, 32], "w": "Pancytopenia → bone marrow aspiration/biopsy; DDx pancytopenia ที่ 'ไม่ใช่' = CML chronic phase, CLL", "c": null, "s": ["aplastic anemia → bone marrow biopsy", "pancytopenia → bone marrow study", "DDx pancytopenia (ไม่ใช่ CML chronic phase)", "DDx pancytopenia (ไม่ใช่ CLL)"], "q": [{"q": "A patient presents with pallor and fatigue. Investigations show a low haematocrit, low platelet count and low white cell count with relative lymphocytosis; aplastic anaemia is suspected. Which investigation establishes the diagnosis?", "a": "Bone marrow aspiration and trephine biopsy", "y": [32], "an": "ix", "sub": "aplastic anemia → bone marrow biopsy", "t": 289}, {"q": "A patient's CBC shows all three cell lines decreased (low haemoglobin, low white cell count and low platelet count). What is the most appropriate next investigation?", "a": "Bone marrow aspiration and biopsy", "y": [32], "an": "ix", "sub": "pancytopenia → bone marrow study", "t": 289}, {"q": "A CBC is shown with all three cell lines decreased (pancytopenia). Pancytopenia would NOT be expected as a presentation of which of the following?", "a": "Chronic myeloid leukemia, chronic phase", "y": [30], "an": "dx", "sub": "DDx pancytopenia (ไม่ใช่ CML chronic phase)", "t": 289}, {"q": "A CBC shows pancytopenia. All of the following belong in the differential diagnosis EXCEPT which one?", "a": "Chronic lymphocytic leukemia (CLL)", "y": [32], "an": "dx", "sub": "DDx pancytopenia (ไม่ใช่ CLL)", "t": 289}]}, {"t": "สไลด์ อ.Kunapa ④ — Case 2 IDA จากประจำเดือนมามาก · Case 3 megaloblastic หลังตัดกระเพาะ", "n": 1, "y": [34, 35], "w": null, "c": null, "s": ["สามระยะของการพร่องเหล็ก (iron profile)"], "q": [{"q": "A 20-year-old woman with hypermenorrhoea has a hypochromic microcytic anaemia. Which pattern of iron studies is expected?", "a": "Low serum ferritin, high TIBC and low transferrin saturation", "y": [34, 35], "an": "interp", "sub": "สามระยะของการพร่องเหล็ก (iron profile)", "t": 277}]}, {"t": "สไลด์ อ.Kunapa ⑤ — Thalassemia: genotype–phenotype, TDT/NTDT, เหล็กเกิน และยาขับเหล็ก 3 ตัว", "n": 1, "y": [31], "w": null, "c": null, "s": ["TDT — leukodepleted PRC"], "q": [{"q": "A 9-year-old child with transfusion-dependent beta-thalassaemia/HbE disease, whose parents are both thalassaemia carriers, is starting a regular transfusion programme. Which blood product is most appropriate?", "a": "Leukocyte-depleted (leukoreduced) packed red cells", "y": [31], "an": "mx", "sub": "TDT — leukodepleted PRC", "t": 298}]}, {"t": "ภาพรวม: จำแนกภาวะซีดด้วย MCV + reticulocyte — kinetic vs morphologic", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Iron deficiency anemia — hepcidin–ferroportin และสามระยะของการพร่องเหล็ก", "n": 8, "y": [30, 31, 33, 34, 35], "w": "IDA: อาการแสดง (glossitis, ไม่มีม้ามโต — ถามแบบ NOT 3 ข้อ), microcytic → iron profile, คำแนะนำกิน ferrous (เลี่ยงนม/แคลเซียม/ยาลดกรด, vit C ช่วย)", "c": null, "s": ["อาการแสดง IDA (ไม่มีม้ามโต)", "microcytic → iron profile", "IDA ในหญิงตั้งครรภ์ + glossitis", "atrophic glossitis ใน IDA"], "q": [{"q": "A 20-year-old woman had heavy menstruation for the last 2 months. She noticed anemia and palpitation. CBC: Hb 5 g/dL, Hct 15%, MCV 50 fL, WBC 6,000/mm3 (PMN 70%, L 20%), platelet 500,000/mm3. Which of the following is NOT expected to be seen in this patient?", "a": "Splenomegaly", "y": [31, 35], "an": "dx", "sub": "อาการแสดง IDA (ไม่มีม้ามโต)", "t": 277}, {"q": "A patient's CBC shows a hypochromic microcytic anaemia. Which investigation is the most appropriate next step to establish the cause?", "a": "Iron profile (serum iron, TIBC/transferrin saturation, serum ferritin)", "y": [34], "an": "ix", "sub": "microcytic → iron profile", "t": 277}, {"q": "A pregnant woman presents with pallor and glossitis. Her CBC shows MCV 70 fL. What is the most likely diagnosis?", "a": "Iron deficiency anaemia", "y": [31], "an": "dx", "sub": "IDA ในหญิงตั้งครรภ์ + glossitis", "t": 277}, {"q": "A woman with breast cancer has had heavy, prolonged bleeding for a long time. Hb and Hct are low with a low MCV, consistent with iron deficiency anaemia. Which clinical finding would you expect?", "a": "Atrophic glossitis (smooth, sore tongue)", "y": [34], "an": "dx", "sub": "atrophic glossitis ใน IDA", "t": 277}, {"q": "The laboratory results of a patient are typical of iron deficiency anaemia. Which of the following findings would NOT be present in this patient?", "a": "Splenomegaly", "y": [30], "an": "dx", "sub": "อาการแสดง IDA (ไม่มีม้ามโต)", "t": 277}, {"q": "After starting iron supplementation in iron deficiency anaemia, which laboratory parameter is the first to rise?", "a": "Serum iron", "y": [33], "an": "fact", "sub": "การตอบสนองต่อ oral iron", "t": 278}, {"q": "A 30-year-old woman with iron deficiency anaemia from hypermenorrhoea due to a uterine myoma is started on oral ferrous sulfate. Which advice is correct?", "a": "Avoid taking the iron together with milk, calcium supplements or antacids; black stools are an expected effect", "y": [31], "an": "mx", "sub": "Oral iron — เลี่ยงนม แคลเซียม ยาลดกรด", "t": 278}, {"q": "A woman with iron deficiency anaemia takes ferrous fumarate, omeprazole, vitamin C and a calcium supplement. Which advice is INAPPROPRIATE?", "a": "Stop vitamin C because it decreases iron absorption", "y": [35], "an": "mx", "sub": "Oral iron — vitamin C ช่วยดูดซึม", "t": 278}]}, {"t": "Anemia of chronic disease/inflammation — IL-6 → hepcidin → เหล็กติดคุก", "n": 1, "y": [30], "w": null, "c": null, "s": ["acute phase: CRP↑ albumin/transferrin↓"], "q": [{"q": "A patient has had systemic inflammation for one month. Which pattern of plasma protein levels is expected?", "a": "C-reactive protein high, albumin low, transferrin low", "y": [30], "an": "mech", "sub": "acute phase: CRP↑ albumin/transferrin↓", "t": 279}]}, {"t": "Sideroblastic anemia และพิษตะกั่ว — เหล็กมีแต่ใส่เข้า heme ไม่ได้", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "α-thalassemia — ยีนหายทีละตัว จาก silent carrier ถึง Hb Bart's hydrops", "n": 0, "y": [], "w": null, "c": "α-thalassemia/Hb Bart's/Hb H เนื้อหาเยอะและสำคัญในไทย แต่ยังไม่เคยออกตรง ๆ", "s": [], "q": []}, {"t": "β-thalassemia และ HbE — α-chain ที่ไม่มีคู่ ไขกระดูกขยาย และเหล็กเกินจาก hepcidin ต่ำ", "n": 3, "y": [31, 32], "w": "พ่อ β-thal trait × แม่ HbE trait → ลูกเป็น trait 50%, ปกติ 25%; HbEE ตั้งครรภ์ microcytic → ตรวจ ferritin ก่อนให้เหล็ก", "c": null, "s": ["ถ่ายทอด β-thal trait × HbE trait", "HbEE microcytic ไม่ใช่ขาดเหล็กเสมอ — ตรวจ ferritin ก่อน"], "q": [{"q": "A 20-year-old Thai woman, G1P0 at 29 weeks' gestation, is referred for anaemia. On examination she has moderate pallor, no jaundice, no hepatosplenomegaly, and the uterine fundus is at the umbilicus. CBC: Hb 7.3 g/dL, Hct 24%, MCV 68 fL, WBC 4,500/µL, platelets 320,000/µL. Hb typing: EE (homozygous Hb E). What is the most important management for this patient?", "a": "Check ferritin and an iron profile before giving iron supplementation, together with folic acid supplementation", "y": [31], "an": "mx", "sub": "HbEE microcytic ไม่ใช่ขาดเหล็กเสมอ — ตรวจ ferritin ก่อน", "t": 277}, {"q": "A father with beta-thalassaemia trait and a mother with haemoglobin E trait have a son. What is the probability that the son carries a trait (either beta-thalassaemia trait or Hb E trait)?", "a": "50%", "y": [32], "an": "fact", "sub": "ถ่ายทอด β-thal trait × HbE trait", "t": 280}, {"q": "A husband has beta-thalassaemia trait and his wife has haemoglobin E trait. What is the chance that their child will be completely normal (inheriting neither abnormal beta-globin allele)?", "a": "25%", "y": [32], "an": "fact", "sub": "ถ่ายทอด β-thal trait × HbE trait", "t": 280}]}, {"t": "Vitamin B12 deficiency / pernicious anemia — folate trap, MMA และไขสันหลังเสื่อม", "n": 4, "y": [31, 32, 35], "w": "B12 deficiency: MMA+homocysteine สูง, anti-IF (pernicious), vegan, ตัด terminal ileum", "c": null, "s": ["MMA + homocysteine สูง", "สาเหตุ B12 ขาด — vegan", "pernicious anemia — anti-IF antibody", "ตัด terminal ileum → B12 ดูดซึมไม่ได้"], "q": [{"q": "A patient with suspected vitamin B12 deficiency has macrocytic anaemia (MCV > 100 fL) together with neurological symptoms. Which biochemical pattern is expected?", "a": "Elevated serum methylmalonic acid and elevated homocysteine", "y": [31], "an": "interp", "sub": "MMA + homocysteine สูง", "t": 281}, {"q": "A peripheral blood smear shows macro-ovalocytes with hypersegmented neutrophils. Which feature of the patient's history best explains this finding?", "a": "A long-standing strict vegetarian (vegan) diet", "y": [32], "an": "mech", "sub": "สาเหตุ B12 ขาด — vegan", "t": 281}, {"q": "A 60-year-old woman has macrocytic anaemia (Hb 7 g/dL, MCV 125 fL), mild leucopenia and thrombocytopenia, hyporeflexia and loss of position sense. She eats meat. Which laboratory finding is expected?", "a": "Anti-intrinsic factor antibodies", "y": [], "an": "dx", "sub": "pernicious anemia — anti-IF antibody", "t": 281}, {"q": "A patient who had extensive resection of the terminal ileum for Crohn disease develops macrocytic anaemia with hypersegmented neutrophils 3 years later. What is the cause?", "a": "Vitamin B12 deficiency from loss of ileal absorption of the B12–intrinsic factor complex", "y": [35], "an": "mech", "sub": "ตัด terminal ileum → B12 ดูดซึมไม่ได้", "t": 281}]}, {"t": "Folate deficiency — วงจร THF, dUMP → dTMP และทำไมต้องให้ B12 ก่อน", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Aplastic anemia — T cell ทำลาย stem cell ไขกระดูกกลายเป็นไขมัน", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Anemia of CKD — เซ็นเซอร์ O₂ ในไตเสีย, hepcidin ขังเหล็ก", "n": 0, "y": [], "w": null, "c": "Anemia of CKD ไม่เคยออกในชุด heme (อาจไปอยู่ในไต)", "s": [], "q": []}, {"t": "ซีดในโรคตับ สุรา และ hypothyroidism — macrocytosis ที่ไม่ใช่ megaloblastic", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Hereditary spherocytosis — แกนยึดแนวตั้งหลุด เยื่อหาย ม้ามกรองทิ้ง", "n": 2, "y": [29, 31], "w": null, "c": null, "s": ["HS ในครอบครัว + hemolytic crisis", "ยืนยัน HS ด้วย EMA/osmotic fragility"], "q": [{"q": "A 27-year-old woman has a long-standing history of mild pallor and mild jaundice. She comes to the ER because of dark urine and markedly increased jaundice for 4 days, together with dysuria. Examination shows moderate pallor and jaundice with a palpable spleen. Her younger brother has exactly the same symptoms. CBC: Hct 24%, MCV 80 fL, WBC 13,000/uL (N 70%), platelets 250,000/uL. The peripheral blood smear shows spherocytes. What is the most likely diagnosis?", "a": "Hemolytic anemia from red cell membrane defect", "y": [31], "an": "dx", "sub": "HS ในครอบครัว + hemolytic crisis", "t": 285}, {"q": "A young woman has anaemia, splenomegaly and many spherocytes on the smear with a negative direct antiglobulin test and a family history of gallstones. Which test confirms hereditary spherocytosis?", "a": "Eosin-5′-maleimide (EMA) binding flow cytometry or the osmotic fragility test", "y": [29], "an": "ix", "sub": "ยืนยัน HS ด้วย EMA/osmotic fragility", "t": 285}]}, {"t": "G6PD deficiency — ไม่มี NADPH ก็ไม่มีเกราะกันออกซิเดชัน", "n": 1, "y": [31], "w": null, "c": null, "s": ["ถั่วปากอ้า → acute hemolysis"], "q": [{"q": "A 20-year-old man develops dark urine, pallor and jaundice 2 days after eating fava beans. His haemoglobin has fallen from 14 to 8.5 g/dL. The peripheral blood smear shows irregularly contracted red cells, bite cells and blister cells. Which diagnosis is most likely?", "a": "Glucose-6-phosphate dehydrogenase (G6PD) deficiency", "y": [31], "an": "dx", "sub": "ถั่วปากอ้า → acute hemolysis", "t": 286}]}, {"t": "Pyruvate kinase deficiency — ATP หาย เซลล์แห้งแข็ง แต่ 2,3-BPG ช่วยปล่อย O₂", "n": 0, "y": [], "w": null, "c": "PK deficiency ไม่เคยออก — ข้ามได้", "s": [], "q": []}, {"t": "Sickle cell disease — HbS polymerization, vaso-occlusion และ hemolysis–NO", "n": 0, "y": [], "w": null, "c": "Sickle cell ไม่พบในไทย ไม่เคยถาม — อ่านแค่หลัก", "s": [], "q": []}, {"t": "Paroxysmal nocturnal hemoglobinuria — PIGA, CD55/CD59 และ complement MAC", "n": 2, "y": [31, 34], "w": null, "c": null, "s": ["flow cytometry CD55/CD59 (FLAER)", "Budd-Chiari + cytopenia → flow CD55/59"], "q": [{"q": "A patient has haemolytic anaemia with haemoglobinuria, pancytopenia and venous thrombosis, suggesting paroxysmal nocturnal haemoglobinuria (PNH). Which test is the current diagnostic standard?", "a": "Flow cytometry for loss of GPI-anchored proteins (CD55/CD59, FLAER) on blood cells", "y": [31], "an": "ix", "sub": "flow cytometry CD55/CD59 (FLAER)", "t": 287}, {"q": "A patient presents with hepatic vein thrombosis (Budd-Chiari syndrome) together with thrombocytopenia. Which investigation is most likely to identify the underlying cause?", "a": "Flow cytometry of peripheral blood for CD55/CD59 (GPI-anchored protein) deficiency", "y": [34], "an": "ix", "sub": "Budd-Chiari + cytopenia → flow CD55/59", "t": 287}]}, {"t": "Warm autoimmune hemolytic anemia — IgG ที่ 37 °C กับม้ามที่กัดทีละคำจนเป็น spherocyte", "n": 6, "y": [30, 31, 32, 33, 35], "w": "Warm AIHA: spherocyte+DAT บวก → prednisolone 1 mg/kg; Hb 4 + MI → ให้ PRC; หาเลือดเข้ากันไม่ได้ → least incompatible; Evans syndrome", "c": null, "s": ["วินิจฉัย — DAT", "Evans syndrome + steroid", "AIHA + MI Hb 4 → ให้ PRC", "first-line prednisolone"], "q": [{"q": "A woman presents with symptoms of anaemia. Her peripheral blood smear shows polychromasia and spherocytes. Which investigation should be performed next?", "a": "Direct Coombs test (direct antiglobulin test)", "y": [31], "an": "ix", "sub": "วินิจฉัย — DAT", "t": 283}, {"q": "A 30-year-old woman has fatigue and petechiae. Hb 7.5 g/dL with reticulocytosis, platelets 15,000/mm3, peripheral smear shows normochromic normocytic red cells with polychromasia and spherocytes, and the direct antiglobulin test is positive. What is the diagnosis and first-line treatment?", "a": "Evans syndrome (autoimmune haemolytic anaemia with immune thrombocytopenia); corticosteroids (e.g., dexamethasone or prednisolone) ± IVIG", "y": [30], "an": "dx", "sub": "Evans syndrome + steroid", "t": 283}, {"q": "A 60-year-old woman was admitted due to acute myocardial infarction. She noticed anemia and jaundice for 1 week. Labs show Hb 4 g/dL, Hct 12%, WBC 5,000/mm3 (PMN 60%, L 30%), platelet 300,000/mm3, reticulocyte 20%, and a direct Coombs test positive 4+. What is the appropriate initial management?", "a": "Packed red cell transfusion", "y": [31, 35], "an": "mx", "sub": "AIHA + MI Hb 4 → ให้ PRC", "t": 284}, {"q": "A 26-year-old woman has had fatigue for 2 weeks. Examination shows mild anemia, mild jaundice and mild splenomegaly. CBC: Hb 8.5 g/dL, Hct 26%, WBC 8,500/uL, platelets 140,000/uL. The peripheral blood smear shows microspherocytes and polychromasia. What is the appropriate management for this patient?", "a": "Prednisolone", "y": [31], "an": "mx", "sub": "first-line prednisolone", "t": 284}, {"q": "A 30-year-old woman has symptomatic anaemia with Hb 5.8 g/dL, jaundice, spherocytes on smear and a direct antiglobulin (Coombs) test of 4+ (IgG). She is haemodynamically stable. What is the first-line specific treatment?", "a": "Oral prednisolone 1 mg/kg/day", "y": [32], "an": "mx", "sub": "prednisolone 1 mg/kg/day", "t": 284}, {"q": "A patient's blood smear shows microspherocytes with polychromasia, and no crossmatch-compatible red cell unit can be found although transfusion is needed. What is the appropriate transfusion approach?", "a": "Transfuse \"least incompatible\" red cells with close monitoring", "y": [33], "an": "mx", "sub": "ให้เลือด least incompatible", "t": 284}]}, {"t": "Cold agglutinin disease — IgM จับตอนเย็น ทิ้ง C3b ไว้ให้ตับกิน", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Disseminated intravascular coagulation — แข็งตัวทั่วร่างจนหมดแรงหยุดเลือด", "n": 0, "y": [], "w": null, "c": "DIC ออกเฉพาะในรูป smear schistocyte (บท PBS) — กลไก/แล็บ PT-aPTT-fibrinogen ยังไม่ถามตรง", "s": [], "q": []}, {"t": "Thrombotic thrombocytopenic purpura — กรรไกร ADAMTS13 หาย vWF ยักษ์จับเกล็ดเลือดเป็นลิ่ม", "n": 0, "y": [], "w": null, "c": "TTP (ADAMTS13, ห้ามให้ platelet) ยังไม่มีข้อเฉพาะ — high-yield ที่น่าจะออก", "s": [], "q": []}, {"t": "Hemolytic uremic syndrome — Shiga toxin กับ complement ที่ทำร้าย endothelium ของไต", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Acute blood loss anemia — ปริมาตรหายก่อน Hb ลดทีหลัง", "n": 3, "y": [31, 32, 35], "w": "Massive transfusion: citrate → hypocalcemia, dilutional coagulopathy; PRC 1 unit ≈ Hb ขึ้น 1 g/dL", "c": null, "s": ["massive transfusion — citrate → hypocalcemia", "dilutional coagulopathy", "PRC 1 unit ≈ Hb ขึ้น 1 g/dL"], "q": [{"q": "What electrolyte may fall in level as a result of citrate toxicity from massive blood transfusion?", "a": "Calcium", "y": [31], "an": "mech", "sub": "massive transfusion — citrate → hypocalcemia", "t": 297}, {"q": "During major surgery a patient receives 14 units of packed red cells and several litres of crystalloid without plasma or platelets. He then develops diffuse oozing from wounds and line sites. PT and aPTT are prolonged and platelets are 60,000/µL. What is the most likely cause?", "a": "Dilutional coagulopathy from massive transfusion", "y": [35], "an": "dx", "sub": "dilutional coagulopathy", "t": 297}, {"q": "In an average-sized adult who is not actively bleeding or hemolysing, how much does the hemoglobin rise after transfusion of one unit of packed red cells?", "a": "About 1 g/dL (hematocrit about 3%)", "y": [32], "an": "fact", "sub": "PRC 1 unit ≈ Hb ขึ้น 1 g/dL", "t": 298}]}], "th": [282, 289, 277, 278, 279, 280, 281, 285, 287, 284, 283, 297]}, {"lec": "PBS", "title": "อ่าน Peripheral Blood Smear — ตาม Atlas ของ อ.Chaicharoen Tantanate", "n": 20, "angle": {"interp": 9, "ix": 2, "mx": 2, "dx": 5, "fact": 1, "mech": 1}, "pattern": "ข้อสอบจาก smear มักเป็น spot diagnosis 1 บรรทัด ('smear shows X → diagnosis?') หรือภาพ OSCE ตามด้วยคำถามต่อ (DDx/investigation/treatment) — rouleaux → myeloma ออกซ้ำมากที่สุด, ตามด้วย bite cell, schistocyte, Auer rod, pencil cell, spherocyte", "tip": "จำคู่ hallmark → โรคให้ขึ้นใจ (rouleaux–MM, bite/blister–G6PD, schistocyte–DIC/TTP/HUS, Auer rod–AML, pencil cell–IDA, spherocyte+polychromasia–AIHA, smudge cell–CLL) และรู้ว่าต้องส่งอะไรต่อ", "secs": [{"t": "วิธีทำและอ่าน blood smear อย่างเป็นระบบ + การ grading RBC morphology", "n": 0, "y": [], "w": null, "c": "เทคนิคทำ smear/grading เป็นพื้นฐาน ไม่ถามตรง แต่ platelet clumping (pseudothrombocytopenia) เคยออก", "s": [], "q": []}, {"t": "Iron deficiency anemia บน smear — เล็ก จาง รูปดินสอ และแยกจาก thalassemia trait", "n": 1, "y": [30], "w": "pencil (cigar) cell + hypochromic microcytic + plt สูง → IDA", "c": null, "s": ["pencil cell บน smear IDA"], "q": [{"q": "A peripheral blood smear shows hypochromic microcytic red cells with marked anisopoikilocytosis, elongated pencil (cigar) cells and a few target cells; WBC is normal and platelets are mildly increased. What is the most likely diagnosis?", "a": "Iron deficiency anaemia", "y": [30], "an": "interp", "sub": "pencil cell บน smear IDA", "t": 277}]}, {"t": "Thalassemia traits & diseases บน smear — จาก trait ที่เซลล์เล็กเท่ากัน ถึง Hb H, β-thal/Hb E และหลังตัดม้าม + Mentzer index", "n": 1, "y": [34], "w": null, "c": null, "s": ["ตรวจต่อ — Hb typing ยืนยัน thalassemia"], "q": [{"q": "A patient presents with anaemia and reports that the whole family is anaemic; the blood smear shows target cells, suggesting thalassaemia. Which investigation should be ordered to establish the diagnosis?", "a": "Haemoglobin typing by electrophoresis/HPLC", "y": [34], "an": "ix", "sub": "ตรวจต่อ — Hb typing ยืนยัน thalassemia", "t": 280}]}, {"t": "Megaloblastic anemia บน smear — macro-ovalocyte กับ hypersegmented neutrophil", "n": 1, "y": [32], "w": null, "c": null, "s": ["ตรวจต่อ — serum B12"], "q": [{"q": "A patient with a history of chronic alcohol drinking has a peripheral blood smear showing macrocytes 1+ and hypersegmented neutrophils. Which investigation is most appropriate?", "a": "Serum vitamin B12 level", "y": [32], "an": "ix", "sub": "ตรวจต่อ — serum B12", "t": 281}]}, {"t": "Aplastic anemia บน smear — อ่าน \"สิ่งที่หายไป\" และสิ่งที่ต้องไม่เจอ", "n": 0, "y": [], "w": null, "c": "Aplastic anemia smear (อ่านสิ่งที่หาย) ไม่เคยถามเป็นภาพ — ถามในรูป pancytopenia → bone marrow แทน", "s": [], "q": []}, {"t": "RBC membrane defects — HS, HE และ SAO (และ HS vs AIHA)", "n": 0, "y": [], "w": null, "c": "HE/SAO และการแยก HS vs AIHA บน smear ไม่เคยถามตรง (HS ไปถามใน anm-12)", "s": [], "q": []}, {"t": "Autoimmune hemolytic anemia — warm (microspherocyte) และ cold agglutinin (RBC agglutination)", "n": 1, "y": [32], "w": "spherocyte + polychromasia → warm AIHA (DAT positive)", "c": null, "s": ["spherocyte + polychromasia → warm AIHA"], "q": [{"q": "A patient with anaemia has a peripheral blood smear showing spherocytes together with polychromasia. Which diagnosis best explains this blood film?", "a": "Autoimmune haemolytic anaemia (warm-antibody type, DAT-positive)", "y": [32], "an": "interp", "sub": "spherocyte + polychromasia → warm AIHA", "t": 283}]}, {"t": "G6PD deficiency with hemolysis — Hb leakage, blister, bite และ ghost cell", "n": 2, "y": [31, 32], "w": "หลังยา oxidant/primaquine: bite/blister cell + Heinz body → G6PD deficiency", "c": null, "s": ["bite/blister cell หลังยา oxidant", "bite/blister cell + Heinz body"], "q": [{"q": "After taking an oxidant drug, a patient develops acute haemolysis. The peripheral blood smear shows contracted, dense red cells with bite cells and blister cells. What is the most likely diagnosis?", "a": "G6PD deficiency", "y": [31, 32], "an": "interp", "sub": "bite/blister cell หลังยา oxidant", "t": 286}, {"q": "A man with G6PD deficiency develops acute hemolysis 2 days after taking primaquine. Which red cell findings on the peripheral blood smear are most characteristic?", "a": "Bite cells and blister cells, with Heinz bodies on supravital stain", "y": [32], "an": "interp", "sub": "bite/blister cell + Heinz body", "t": 286}]}, {"t": "Microangiopathic hemolytic anemia — schistocyte ใน DIC และ TMA", "n": 2, "y": [31, 33], "w": "schistocyte + thrombocytopenia → MAHA: DDx DIC/TTP/HUS (OSCE smear)", "c": null, "s": ["schistocyte → DIC/TTP/HUS", "schistocyte → MAHA DDx (OSCE)"], "q": [{"q": "A patient has anaemia and thrombocytopenia; the smear shows many schistocytes (fragmented red cells), some spherocytes and polychromasia. Which three diagnoses should be considered first?", "a": "Disseminated intravascular coagulation, thrombotic thrombocytopenic purpura and haemolytic uraemic syndrome", "y": [], "an": "interp", "sub": "schistocyte → DIC/TTP/HUS", "t": 288}, {"q": "An OSCE station shows a peripheral blood smear from an anaemic patient with thrombocytopenia. The smear shows schistocytes (fragmented red cells, helmet cells), polychromasia and reduced platelets. What is the condition, and which group of diseases is the appropriate differential diagnosis?", "a": "Microangiopathic haemolytic anaemia — DIC, TTP and HUS", "y": [31, 33], "an": "interp", "sub": "schistocyte → MAHA DDx (OSCE)", "t": 288}]}, {"t": "Reactive (atypical/variant) lymphocytosis — แยกจาก lymphocyte ปกติ monocyte และ blast", "n": 0, "y": [], "w": null, "c": "Atypical lymphocyte ยังไม่เคยออก — อาจเป็นภาพ OSCE ได้", "s": [], "q": []}, {"t": "Acute leukemia — myeloblast vs lymphoblast · AML · APL (Auer rod, faggot cell, DIC) · ALL", "n": 2, "y": [31, 34], "w": "blast จำนวนมาก/Auer rod → AML แล้วถาม induction 7+3", "c": null, "s": ["blast จำนวนมาก → AML", "Auer rod → AML → induction 7+3"], "q": [{"q": "A 70-year-old woman's peripheral blood smear shows numerous blast cells. What is the most likely diagnosis?", "a": "Acute myeloid leukaemia", "y": [34], "an": "interp", "sub": "blast จำนวนมาก → AML", "t": 301}, {"q": "A peripheral blood smear shows myeloblasts containing Auer rods, consistent with acute myeloid leukaemia (non-APL). Which induction chemotherapy is standard for a fit patient?", "a": "'7+3' — cytarabine for 7 days plus an anthracycline (daunorubicin or idarubicin) for 3 days", "y": [31], "an": "mx", "sub": "Auer rod → AML → induction 7+3", "t": 301}]}, {"t": "Chronic myeloid leukemia + ลำดับการเจริญของ neutrophil (myeloblast → segmented)", "n": 0, "y": [], "w": null, "c": "CML smear และลำดับการเจริญของ neutrophil ไม่เคยถามเป็นภาพ (CML ถามแค่ตรวจ BCR-ABL1)", "s": [], "q": []}, {"t": "Chronic lymphocytic leukemia — lymphocyte ตัวเล็ก chromatin ลูกฟุตบอล และ smudge cell", "n": 1, "y": [33], "w": null, "c": null, "s": ["small mature lymphocyte เด่น → CLL"], "q": [{"q": "A peripheral blood smear shows a striking predominance of small mature lymphocytes, and the patient has no splenomegaly. What is the most likely diagnosis?", "a": "Chronic lymphocytic leukaemia (CLL)", "y": [33], "an": "interp", "sub": "small mature lymphocyte เด่น → CLL", "t": 302}]}, {"t": "Myelophthisis — leukoerythroblastic picture และ teardrop cell", "n": 0, "y": [], "w": null, "c": "Myelophthisis/teardrop ยังไม่เคยออก", "s": [], "q": []}, {"t": "Multiple myeloma และ plasma cell leukemia — rouleaux, พื้นหลังสีฟ้า และ plasma cell ในเลือด", "n": 8, "y": [30, 31, 32, 34], "w": "ปวดหลัง + rouleaux → multiple myeloma (ซ้ำ 6 ข้อ รุ่น 30–34) · CRAB (hypercalcemia ไม่ใช่ hypocalcemia) · กลไก hypercalcemia = osteoclast activation", "c": null, "s": ["ปวดหลัง + rouleaux", "anemia + renal impairment → multiple myeloma", "rouleaux → multiple myeloma", "CRAB (hypercalcemia ไม่ใช่ hypocalcemia)"], "q": [{"q": "A 65-year-old man is evaluated for a 3-month history of progressive malaise, fatigue and weakness. He has a 10-year history of hypertension treated with HCTZ and atenolol. On physical examination vital signs including blood pressure are normal and the remainder of the examination is unremarkable. Laboratory studies: Hct 25%, WBC 5,600/µL, platelets 340,000/µL, FBS 110 mg/dL, BUN/Cr 22/1.8, Na 135 mEq/L, K 3.0 mEq/L, Cl 105 mEq/L, HCO3 18 mEq/L. Urinalysis: protein trace, glucose 1+, WBC 3-5, RBC 1-2; 24-hour urine protein 5.2 g. Which of the following is the most likely diagnosis?", "a": "Multiple myeloma", "y": [31], "an": "dx", "sub": "anemia + renal impairment → multiple myeloma", "t": 299}, {"q": "A patient presents with back pain and the peripheral blood smear shows rouleaux formation. What is the most likely diagnosis?", "a": "Multiple myeloma", "y": [34], "an": "dx", "sub": "ปวดหลัง + rouleaux", "t": 299}, {"q": "A patient presents with back pain. The peripheral blood smear shows red cells stacked together in long chains (rouleaux formation). What is the most likely diagnosis?", "a": "Multiple myeloma", "y": [31], "an": "dx", "sub": "ปวดหลัง + rouleaux", "t": 299}, {"q": "A patient presents with back pain. The peripheral blood smear shows rouleaux formation. What is the most likely diagnosis?", "a": "Multiple myeloma", "y": [32], "an": "dx", "sub": "ปวดหลัง + rouleaux", "t": 299}, {"q": "A peripheral blood smear is described as showing rouleaux formation. Which disease does this finding suggest?", "a": "Multiple myeloma", "y": [31], "an": "interp", "sub": "rouleaux → multiple myeloma", "t": 299}, {"q": "An older patient presents with progressive lower back pain. A peripheral blood smear shows marked rouleaux formation. What is the most likely diagnosis?", "a": "Multiple myeloma", "y": [32], "an": "dx", "sub": "ปวดหลัง + rouleaux", "t": 299}, {"q": "Which of the following is NOT characteristic of multiple myeloma?", "a": "Hypocalcemia", "y": [30], "an": "fact", "sub": "CRAB (hypercalcemia ไม่ใช่ hypocalcemia)", "t": 300}, {"q": "A 66-year-old man with multiple myeloma has calcium 13 mg/dL. What is the main mechanism of hypercalcaemia in this disease?", "a": "Osteoclast activation by myeloma-derived factors (RANKL, MIP-1α, DKK-1 suppressing osteoblasts) producing osteolytic lesions", "y": [30], "an": "mech", "sub": "กลไก hypercalcemia — osteoclast activation", "t": 300}]}, {"t": "Immune thrombocytopenia (ITP) และ acquired platelet dysfunction with eosinophilia (APDE)", "n": 1, "y": [31], "w": null, "c": null, "s": ["platelet clumping = pseudothrombocytopenia"], "q": [{"q": "A young woman with heavy menstrual periods has a low automated platelet count, but the peripheral blood smear shows platelet clumping. What should be done next?", "a": "Observe; no specific treatment of the platelet count is needed", "y": [31], "an": "mx", "sub": "platelet clumping = pseudothrombocytopenia", "t": 294}]}, {"t": "ฝึกอ่าน smear — ทายโรคจากภาพ (spot diagnosis)", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}], "th": [286, 288, 299, 300, 294]}], "gaps": [{"id": "gap-hemonc-02", "set": "hemonc", "title": "Hemophilia และ von Willebrand disease", "subtitle": "X-linked hemarthrosis กับ autosomal mucocutaneous bleeding: วินิจฉัยและให้ factor ให้ถูกตัว", "md": "### Hemophilia: กลไกและพันธุกรรม\n- **Hemophilia A** ขาด FVIII (พบบ่อยกว่า ~4–5 เท่า), **hemophilia B** (Christmas disease) ขาด FIX; ทั้งสองอาการเหมือนกัน แยกได้ด้วย factor assay เท่านั้น\n- FIXa ร่วมกับ FVIIIa (intrinsic tenase) กระตุ้น FX บนผิว platelet ทำให้เกิด thrombin burst; ถ้าขาด platelet plug เกิดได้แต่ fibrin clot ไม่แข็งแรง จึงเลือดออกช้าและออกซ้ำ\n- **X-linked recessive**: ผู้ป่วยเป็นชาย, หญิงเป็น carrier; ไม่มี **male-to-male transmission**; ชายที่เป็นโรคถ่ายทอดให้ลูกสาวทุกคนเป็น carrier ลูกชายปกติทุกคน; แม่ที่เป็น carrier มีลูกชายเป็นโรค 50% ลูกสาวเป็น carrier 50%; pedigree จะเห็นชายหลายรุ่นเป็นโรคโดยผ่านแม่ที่ปกติ (เช่น **น้าชาย/ลุงฝั่งแม่**เป็นด้วย)\n- ราว 1 ใน 3 เป็น de novo mutation จึงไม่มีประวัติครอบครัวได้\n\n### ความรุนแรงตามระดับ factor\n| ระดับ | Factor activity | อาการ |\n|---|---|---|\n| Severe | <1% | hemarthrosis และ muscle bleed เกิดเอง (spontaneous) ตั้งแต่เด็กเล็ก |\n| Moderate | 1–5% | บางครั้งเกิดเอง, เลือดออกหลังบาดเจ็บเล็กน้อย |\n| Mild | >5% ถึง <40% | เลือดออกหลังผ่าตัด ถอนฟัน หรือบาดเจ็บรุนแรง |\n\n### อาการและการวินิจฉัย\n- **Hemarthrosis** (เข่า มากกว่าศอกและข้อเท้า): ข้อปวด บวม ร้อน ขยับไม่ได้; เป็นซ้ำจนเกิด target joint และ hemophilic arthropathy\n- Muscle hematoma: iliopsoas bleed (ปวดขาหนีบ งอสะโพกไว้ อาจกด femoral nerve), compartment syndrome; intracranial hemorrhage เป็นสาเหตุตายสำคัญ; เลือดออกหลังขลิบหรือถอนฟัน\n- Lab: platelet ปกติ, **PT ปกติ, aPTT ยาว** (mild อาจปกติ), mixing study **correct**; ยืนยันด้วย **FVIII:C และ FIX assay**; ตรวจ inhibitor (Bethesda assay) ก่อนผ่าตัดหรือเมื่อตอบสนองไม่ดี\n- แยกจาก acquired hemophilia A (ผู้สูงอายุ, หลังคลอด, autoimmune; จ้ำเลือดใหญ่ใต้ผิวหนัง; mixing study **ไม่ correct**) และ vWD type 2N หรือ 3 ซึ่ง FVIII ต่ำได้\n\n### การรักษา hemophilia\n- หลักสำคัญ: เมื่อสงสัยเลือดออกในผู้ป่วยที่รู้ว่าเป็น hemophilia ให้ **factor replacement ทันที (ภายใน 2 ชม.) ก่อนรอ imaging**; ถ้ายังไม่เคยวินิจฉัย ให้เจาะเลือดส่ง factor assay ก่อนแล้วให้ factor ได้เลย\n- ข้อห้าม: ฉีดยาเข้ากล้าม, aspirin และ NSAIDs (ใช้ paracetamol แทน), เจาะข้อโดยไม่จำเป็น\n- Hemarthrosis: ให้ factor ร่วมกับ RICE (rest, ice, compression, elevation) และกายภาพบำบัดเมื่อเลือดหยุด\n- คำนวณขนาด: **FVIII 1 IU/kg เพิ่มระดับ ~2%** (units = น้ำหนัก × %ที่ต้องการเพิ่ม × 0.5) ให้ซ้ำทุก 8–12 ชม.; **FIX 1 IU/kg เพิ่ม ~1%** (units = น้ำหนัก × %ที่ต้องการเพิ่ม) ให้ทุก 12–24 ชม.\n\n| สถานการณ์ | เป้าหมาย factor level |\n|---|---|\n| Hemarthrosis, muscle bleed ทั่วไป | 40–60% |\n| Iliopsoas bleed, ICH, ผ่าตัดใหญ่ | 80–100% |\n| ถอนฟัน | ราว 50% ก่อนทำ ร่วมกับ tranexamic acid |\n\n- **ถ้าไม่มี factor concentrate**: hemophilia A ใช้ **cryoprecipitate** (FVIII ~80–100 IU/unit) ได้; hemophilia B ต้องใช้ **FFP** หรือ prothrombin complex concentrate เพราะ cryo **ไม่มี FIX**; FFP มี FVIII แต่ปริมาตรมากเกินกว่าจะได้ระดับพอ\n- Adjunct: **tranexamic acid** (เช่น 15–25 mg/kg PO ทุก 8 ชม. หรือบ้วนปาก) สำหรับเลือดออกเยื่อบุและถอนฟัน ห้ามใช้เมื่อมี hematuria; **DDAVP 0.3 µg/kg** ใช้ได้ใน mild hemophilia A เท่านั้น (ไม่ได้ผลใน hemophilia B)\n- Severe hemophilia: ให้ prophylaxis ตามกำหนด (factor concentrate หรือ **emicizumab** ซึ่งเป็น bispecific antibody เชื่อม FIXa กับ FX ฉีด SC ใช้ได้แม้มี inhibitor); ในไทย สปสช. สนับสนุน factor concentrate สำหรับผู้ป่วยฮีโมฟีเลีย\n- มี inhibitor (~25–30% ของ severe A): ใช้ bypassing agent (rFVIIa, aPCC), emicizumab, immune tolerance induction\n\n### von Willebrand disease (vWD)\n- **กลไก**: vWF สร้างจาก endothelium (Weibel–Palade bodies) และ megakaryocyte ทำหน้าที่ 2 อย่าง คือ (1) เชื่อม platelet GPIb กับ collagen (primary hemostasis) และ (2) เป็น carrier ป้องกัน FVIII ถูกทำลาย; ขาด vWF จึงมี mucocutaneous bleeding และ FVIII อาจต่ำจน **aPTT ยาว** ได้\n- เป็น **inherited bleeding disorder ที่พบบ่อยที่สุด**, ถ่ายทอด autosomal จึงเป็นได้ทั้งหญิงและชาย มักพบพี่น้องหญิงเลือดออกง่ายด้วย\n- ชนิด: **type 1** (ปริมาณลดลงบางส่วน, autosomal dominant, ~70–80%); **type 2** (การทำงานผิดปกติ: 2A, 2B ซึ่ง plt ต่ำได้, 2M, 2N ซึ่งจับ FVIII ไม่ได้คล้าย hemophilia A); **type 3** (แทบไม่มี vWF, autosomal recessive, รุนแรง มี hemarthrosis ได้)\n- อาการ: epistaxis, เลือดออกตามไรฟัน, จ้ำเลือดง่าย, **menorrhagia ตั้งแต่มีประจำเดือน**, postpartum hemorrhage, เลือดออกนานหลังถอนฟันหรือผ่าตัด\n- Lab: platelet ปกติ (ยกเว้น 2B), PT ปกติ, aPTT ปกติหรือยาว, bleeding time หรือ PFA-100 ยาว; ยืนยันด้วย **vWF panel** คือ vWF:Ag, vWF activity (ristocetin cofactor หรือ GPIbM), FVIII:C แล้วดู activity/Ag ratio (<0.7 นึกถึง type 2), multimer, RIPA\n- เกณฑ์ (ASH/ISTH/NHF/WFH 2021): vWF <30 IU/dL วินิจฉัยได้แม้ไม่มีประวัติเลือดออก; 30–50 IU/dL ร่วมกับประวัติเลือดออกผิดปกติ; ระดับสูงขึ้นชั่วคราวจาก stress, ตั้งครรภ์, estrogen, การอักเสบ และต่ำกว่าในเลือดกรุ๊ป O จึงอาจต้องตรวจซ้ำ\n- โจทย์คลาสสิก: หญิงประจำเดือนมามาก น้องสาวเลือดออกง่าย platelet, PT, aPTT ปกติ ขั้นต่อไปคือตรวจ platelet function/vWF (ตำราเก่าตอบ bleeding time); ผู้ป่วยเหงือกเลือดออกเอง FVIII และ FIX ปกติ = ขาด vWF; เลือดออกนานหลังทำฟัน aPTT ยาวอย่างเดียว PT ปกติ นึกถึง vWD\n\n### รักษา vWD\n- **DDAVP (desmopressin) 0.3 µg/kg IV** ใน NSS 50 mL นาน 30 นาที (หรือพ่นจมูก) กระตุ้นการหลั่ง vWF และ FVIII จาก endothelium ได้ผลดีใน type 1 (ควรทำ DDAVP trial ก่อน); ระวัง hyponatremia (จำกัดน้ำ) และ tachyphylaxis; ไม่ได้ผลใน type 3 และควรเลี่ยงใน 2B\n- **vWF-containing FVIII concentrate** สำหรับ type 2, 3, ผ่าตัดใหญ่ หรือ DDAVP ไม่ได้ผล; ถ้าไม่มีใช้ **cryoprecipitate** (มี vWF)\n- Tranexamic acid สำหรับเลือดออกเยื่อบุ; menorrhagia ใช้ combined hormonal contraceptive หรือ LNG-IUD; เลี่ยง aspirin และ NSAIDs\n\n### เปรียบเทียบ\n| | Hemophilia A | vWD |\n|---|---|---|\n| ถ่ายทอด | X-linked recessive (ชาย) | Autosomal (ทั้งสองเพศ) |\n| อาการเด่น | hemarthrosis, muscle bleed |
