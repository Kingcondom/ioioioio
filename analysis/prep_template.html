 "y": [28], "an": "dx", "sub": "Secondary — ผื่น + mucosal", "t": 208}]}, {"t": "Syphilis serology — non-treponemal กับ treponemal และลำดับการตรวจ", "n": 1, "y": [32], "w": "ผื่นฝ่ามือฝ่าเท้า → VDRL ยืนยัน", "c": null, "s": ["non-treponemal serology (VDRL)"], "q": [{"q": "A young adult has a widespread non-pruritic maculopapular rash that involves the palms and soles. Which investigation confirms the suspected diagnosis?", "a": "VDRL (non-treponemal serology)", "y": [32], "an": "ix", "sub": "non-treponemal serology (VDRL)", "t": 208}]}, {"t": "Neurosyphilis, ocular และ otic syphilis — ใครต้องเจาะหลัง และรักษาอย่างไร", "n": 1, "y": [], "w": "HIV + ผื่น + คอแข็ง → CSF VDRL", "c": null, "s": ["CSF ที่เข้าได้กับ neurosyphilis — CSF VDRL"], "q": [{"q": "A 25-year-old man with HIV has 2 weeks of fever and headache, neck stiffness, and a non-itchy reddish rash on the trunk, palms and soles. Lumbar puncture is performed. Which CSF test is most appropriate to diagnose the suspected infection?", "a": "CSF VDRL", "y": [], "an": "ix", "sub": "CSF ที่เข้าได้กับ neurosyphilis — CSF VDRL", "t": 208}]}, {"t": "รักษาซิฟิลิสตามระยะ แพ้ penicillin และ Jarisch–Herxheimer reaction", "n": 2, "y": [32, 34], "w": "secondary syphilis → benzathine penicillin G 2.4 MU IM ครั้งเดียว; แพ้ penicillin ใช้ doxycycline ไม่ใช่ erythromycin", "c": null, "s": ["สูตรยาตามระยะ — benzathine 2.4 MU", "ผู้ป่วยที่แพ้ penicillin — doxycycline ไม่ใช่ erythromycin"], "q": [{"q": "A patient presents with a copper-coloured papulosquamous rash involving the palms and soles, and is diagnosed with secondary syphilis. Which is the appropriate treatment?", "a": "Benzathine penicillin G 2.4 million units IM, single dose", "y": [34], "an": "mx", "sub": "สูตรยาตามระยะ — benzathine 2.4 MU", "t": 208}, {"q": "Which statement about secondary syphilis is INCORRECT?", "a": "Erythromycin is the recommended alternative for patients who are allergic to penicillin", "y": [32], "an": "fact", "sub": "ผู้ป่วยที่แพ้ penicillin — doxycycline ไม่ใช่ erythromycin", "t": 208}]}, {"t": "ซิฟิลิสในหญิงตั้งครรภ์ การติดตาม titre คู่นอน และการป้องกัน", "n": 0, "y": [], "w": null, "c": "อาจารย์บอกว่าชอบถาม 'หญิงตั้งครรภ์ VDRL บวก' แต่ยังไม่มีในคลัง — ควรเตรียม", "s": [], "q": []}], "th": [188, 208]}, {"lec": "12/11", "title": "ไข้เฉียบพลันและโรคติดเชื้อเขตร้อน", "n": 20, "angle": {"interp": 3, "fact": 3, "dx": 7, "mx": 3, "mech": 1, "ix": 3}, "pattern": "เน้น dx จากเบาะแสเฉพาะ (conjunctival suffusion, eschar, safety pin) เป็นโจทย์สั้นซ้ำหลายรุ่น 30–34 และ ix เลือกตรวจตามวันไข้ (dengue IgM/IgG, MAT) รุ่น 33–34; malaria ถูกถาม 8 ข้อ (smear, ACT, prophylaxis) — ย้ายไปอยู่คาบ 16/11 แล้ว", "tip": "จำ 'ภาพจำเฉพาะ' ของ lepto/scrub/melioid/dengue และการตรวจตามวันป่วย + ยาหลัก (doxycycline, ceftazidime, penicillin/ceftriaxone, fluid ใน dengue); malaria ไปทวนที่คาบ 16/11 (Microorganism)", "secs": [{"t": "ไข้ไม่เกิน 1 สัปดาห์ — แยก organ-specific กับ systemic infection", "n": 0, "y": [], "w": null, "c": "กรอบ organ-specific vs systemic — ไม่ถามตรงเป็นแนวคิด", "s": [], "q": []}, {"t": "CBC · UA · LFT · creatinine — อ่านเป็นเบาะแสของเชื้อ", "n": 0, "y": [], "w": null, "c": "lab พื้นฐานเป็นเบาะแส — ไม่ถามตรงแต่ใช้ตีความโจทย์ dengue/lepto", "s": [], "q": []}, {"t": "จับคู่ระยะไข้และอาการเด่นกับเชื้อ — ตารางโหวตของอาจารย์", "n": 0, "y": [], "w": null, "c": "ตารางโหวตอาการ-เชื้อ — ไม่ถามตรง", "s": [], "q": []}, {"t": "Pneumonia ที่รักษาแล้วไม่ดีขึ้น และ Gram stain 15 นาที", "n": 2, "y": [28, 29], "w": "อ่าน Gram stain: GN diplococci ในเสมหะ COPD = Moraxella; GN coccobacilli = H. influenzae", "c": null, "s": ["อ่าน Gram stain — GN diplococci = Moraxella", "อ่าน Gram stain — GN coccobacilli = H. influenzae"], "q": [{"q": "A 68-year-old man with COPD has pneumonia. Sputum Gram stain shows >25 PMN and <10 squamous epithelial cells per low-power field with many intracellular Gram-negative diplococci. What is the most likely organism?", "a": "Moraxella catarrhalis", "y": [29], "an": "interp", "sub": "อ่าน Gram stain — GN diplococci = Moraxella", "t": 192}, {"q": "Which organism is a Gram-negative coccobacillus?", "a": "Haemophilus influenzae", "y": [28], "an": "fact", "sub": "อ่าน Gram stain — GN coccobacilli = H. influenzae", "t": 192}]}, {"t": "Melioidosis — ใครเสี่ยง เชื้อ และการวินิจฉัย", "n": 2, "y": [31], "w": "GNB ติดสีสองปลาย (safety pin) ในเบาหวาน / ฝีตับ honeycomb → B. pseudomallei", "c": null, "s": ["การวินิจฉัย — bipolar safety pin", "อาการ — ฝีตับ honeycomb"], "q": [{"q": "A 48-year-old woman with diabetes mellitus treated with glipizide presents with fever from an abscess over the right hip. Gram stain of the pus shows slender gram-negative bacilli that stain more darkly at both ends (bipolar staining). Which organism is most likely responsible?", "a": "Burkholderia pseudomallei", "y": [31], "an": "interp", "sub": "การวินิจฉัย — bipolar safety pin", "t": 196}, {"q": "Imaging shows a multiloculated, multi-septate (\"honeycomb\") liver abscess. Which organism is the most likely cause?", "a": "Burkholderia pseudomallei", "y": [31], "an": "interp", "sub": "อาการ — ฝีตับ honeycomb", "t": 196}]}, {"t": "Melioidosis — รักษาสองระยะ: intensive และ eradication", "n": 0, "y": [], "w": null, "c": "melioidosis สองระยะ (ceftazidime → co-trimoxazole) ยังไม่ออก แต่น่าออก", "s": [], "q": []}, {"t": "Rickettsia — สามกลุ่มเชื้อ พาหะ และ eschar", "n": 2, "y": [30, 31], "w": "eschar (แผลดำขอบแดง แม้ที่อวัยวะเพศ) → scrub typhus", "c": null, "s": ["Eschar — scrub typhus (genital)", "Eschar — scrub typhus"], "q": [{"q": "A febrile patient is found to have a painless ulcer with a black necrotic crust and an erythematous rim on the genital area. What is the most likely diagnosis?", "a": "Scrub typhus", "y": [31], "an": "dx", "sub": "Eschar — scrub typhus (genital)", "t": 199}, {"q": "A patient returns from Kalasin province with fever and headache. Examination reveals a black ulcer with an erythematous base (eschar). What is the most likely diagnosis?", "a": "Scrub typhus (Orientia tsutsugamushi)", "y": [30], "an": "dx", "sub": "Eschar — scrub typhus", "t": 199}]}, {"t": "Scrub typhus — วินิจฉัย รักษา และรายรุนแรง", "n": 1, "y": [31], "w": null, "c": null, "s": ["การรักษา — doxycycline"], "q": [{"q": "A patient with acute fever from Nakhon province is found to have a brown-black crusted skin ulcer (eschar). Which antibiotic is the treatment of choice?", "a": "Doxycycline", "y": [31], "an": "mx", "sub": "การรักษา — doxycycline", "t": 199}]}, {"t": "Leptospirosis — เชื้อ การติดต่อ ไข้สองระยะ และอาการหลายระบบ", "n": 7, "y": [30, 31, 32, 33, 34], "w": "conjunctival suffusion + jaundice/calf pain/ไข้สองระยะ → leptospirosis (ถาม 6 ข้อ รุ่น 30–34)", "c": null, "s": ["อาการ — conjunctival suffusion", "อาการ — conjunctival suffusion + jaundice", "Weil syndrome — calf pain + jaundice", "ไข้สองระยะ (biphasic)"], "q": [{"q": "A febrile patient is found to have jaundice together with conjunctival suffusion (red eyes without discharge). Which is the most likely diagnosis?", "a": "Leptospirosis", "y": [30], "an": "dx", "sub": "อาการ — conjunctival suffusion + jaundice", "t": 197}, {"q": "A man has had calf pain and jaundice for 5 days; over the next 5 days he develops vomiting with deepening jaundice. AST is about 1000 U/L and ALT is just over 1000 U/L. What is the most likely diagnosis?", "a": "Leptospirosis (Weil's disease)", "y": [31], "an": "dx", "sub": "Weil syndrome — calf pain + jaundice", "t": 197}, {"q": "A man living in Bangkok presents with fever, abdominal pain and subconjunctival haemorrhage (conjunctival suffusion). What is the most likely diagnosis?", "a": "Leptospirosis", "y": [33], "an": "dx", "sub": "อาการ — conjunctival suffusion", "t": 197}, {"q": "A patient had fever for 7 days which then resolved, after which the fever returned together with jaundice. What is the most likely diagnosis?", "a": "Leptospirosis", "y": [34], "an": "dx", "sub": "ไข้สองระยะ (biphasic)", "t": 197}, {"q": "A patient presents with fever and myalgia and is found to have conjunctival suffusion. What is the most likely diagnosis?", "a": "Leptospirosis", "y": [32], "an": "dx", "sub": "อาการ — conjunctival suffusion + myalgia", "t": 197}, {"q": "Which of the following statements about leptospirosis is correct?", "a": "Conjunctival suffusion is seen more often than subconjunctival haemorrhage during the first week of illness", "y": [31], "an": "fact", "sub": "อาการ — conjunctival suffusion", "t": 197}, {"q": "A man waded barefoot through standing floodwater during the rainy season and subsequently develops features of leptospirosis. Which route of transmission best explains how he acquired the infection?", "a": "Direct penetration of the organism through abraded skin or a wound on the foot", "y": [34], "an": "mech", "sub": "เชื้อและแหล่งรังโรค — ไชผ่านผิวหนัง", "t": 198}]}, {"t": "Leptospirosis — เลือกสิ่งส่งตรวจตามวันป่วย รักษา และป้องกัน", "n": 2, "y": [32, 33], "w": "ยืนยัน lepto ด้วย MAT คู่ / IFA", "c": null, "s": ["เลือกสิ่งส่งตรวจ — serology (IFA/MAT)", "MAT คู่ยืนยัน"], "q": [{"q": "A febrile patient has conjunctival suffusion and jaundice. Which serological investigation best confirms the suspected diagnosis?", "a": "Indirect fluorescent antibody (IFA) test for Leptospira", "y": [32, 33], "an": "ix", "sub": "เลือกสิ่งส่งตรวจ — serology (IFA/MAT)", "t": 198}, {"q": "A man who lives in Bangkok and gives no rural or farming exposure history presents with an acute febrile illness whose clinical picture fits leptospirosis. Which investigation confirms the diagnosis?", "a": "Microscopic agglutination test (MAT) for Leptospira on paired sera", "y": [33], "an": "ix", "sub": "MAT คู่ยืนยัน", "t": 198}]}, {"t": "Dengue — ระยะโรค warning signs และ severe dengue", "n": 1, "y": [33], "w": null, "c": null, "s": ["สามระยะ — recovery phase"], "q": [{"q": "A patient with dengue infection who had plasma leakage is now on day 8 of illness. Which finding best indicates that he has entered the recovery (convalescent) phase?", "a": "Return of appetite with diuresis, a stable or falling hematocrit and a rising platelet count", "y": [33], "an": "fact", "sub": "สามระยะ — recovery phase", "t": 200}]}, {"t": "Dengue — NS1 PCR IgM IgG ตามวันไข้ ติดเชื้อครั้งแรกกับซ้ำ และการดูแล", "n": 3, "y": [31, 33, 34], "w": "dengue: Hct สูง+เกล็ดเลือดต่ำ → IV isotonic crystalloid; ไข้วันที่ 7 ใช้ IgM/IgG; ดูแลแบบประคับประคองติดตาม Hct", "c": null, "s": ["การดูแล — Hct สูง → IV crystalloid", "ตรวจอะไร วันไหน — IgM/IgG วันที่ 7", "การดูแล — supportive + Hct monitoring"], "q": [{"q": "A patient with dengue infection has a markedly low platelet count together with a markedly raised haemoglobin/haematocrit. What is the appropriate management?", "a": "Intravenous isotonic crystalloid fluid therapy", "y": [31], "an": "mx", "sub": "การดูแล — Hct สูง → IV crystalloid", "t": 200}, {"q": "A 25-year-old office worker in Bangkok, with no recent travel or flood exposure, has had fever for 7 days and now has petechiae on the legs. Platelets 95,000/µL with leukopenia. Which test best confirms the most likely diagnosis at this stage of illness?", "a": "Dengue IgM and IgG serology", "y": [34], "an": "ix", "sub": "ตรวจอะไร วันไหน — IgM/IgG วันที่ 7", "t": 200}, {"q": "A 25-year-old man has high fever for 7 days with headache, myalgia and RUQ tenderness. He has petechiae but no mucosal or GI bleeding. BP 100/80 mmHg. Hb 15 g/dL, WBC 1,800/mm3 (atypical lymphocytes 5%), platelets 24,000/mm3. Dengue infection is diagnosed. What is the most appropriate management?", "a": "Supportive care with close monitoring of vital signs, urine output and serial hematocrit, giving isotonic IV fluid only as needed for plasma leakage", "y": [33], "an": "mx", "sub": "การดูแล — supportive + Hct monitoring", "t": 200}]}], "th": [192, 196, 199, 197, 198, 200]}, {"lec": "16/11", "title": "ทบทวน Microorganism — อ่านสไลด์เชื้อ วินิจฉัย และรักษา", "n": 22, "angle": {"mx": 11, "dx": 3, "fact": 1, "interp": 6, "ix": 1}, "pattern": "โพยถามเชื้อจากภาพหรือเบาะแสสั้น ๆ แล้วตามด้วยยา: มาลาเรีย 8 ข้อ (smear PF/PV, ACT + primaquine, ตั้งครรภ์, doxycycline ป้องกัน) รุ่น 29–33, HIV diarrhea แยกขนาด oocyst, Nocardia กับ modified AFB, M. marinum หลังตกปลา และ pharyngitis ที่แพ้ penicillin — ข้อเหล่านี้เดิมอยู่ในบทเสริม ย้ายมาเมื่อเพิ่มคาบ 16 พ.ย.", "tip": "ทวนหัวข้อ 14 (มาลาเรีย) ก่อนเพราะออกมากที่สุด แล้วหัวข้อ 11 (oocyst 5 · 8 · 25 µm) และหัวข้อ 7 (Nocardia ติด 2 สี) · ตอบแบบบรรยาย → วินิจฉัย → ยา และสะกดชื่อเชื้อกับชื่อยาให้ถูก", "th": [186, 215, 196, 201, 187, 195, 211, 202, 203, 204], "secs": [{"t": "ตอบโจทย์ \"จงบรรยาย วินิจฉัย และรักษา\" + จัดกลุ่มเชื้อจาก Gram stain", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 1 · Meningococcus และตาราง CSF แยกเยื่อหุ้มสมองอักเสบ", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 2–4 · Streptococcus: GAS, pneumococcus, S. suis, GBS, Enterococcus", "n": 3, "y": [33, 34, 35], "w": "เจ็บคอมีหนองแต่แพ้ penicillin → erythromycin; ไอ น้ำมูก ไม่มีหนอง → ไม่ให้ยาปฏิชีวนะ; pseudomembrane สีเทา = diphtheria", "c": null, "s": ["GAS แพ้ penicillin → erythromycin", "diphtheria แพ้ penicillin → erythromycin", "viral pharyngitis → รักษาตามอาการ"], "q": [{"id": "PP34-INF-012", "q": "A 20-year-old man has a 2-day history of fever and sore throat with white exudate over the pharynx and both tonsils and tender anterior cervical lymph nodes, but no cough. His records document a penicillin allergy. Which antibiotic is the most appropriate treatment?", "a": "Erythromycin", "y": [34], "t": 186, "an": "mx", "sub": "GAS แพ้ penicillin → erythromycin"}, {"id": "ID-OLDP-003", "q": "A febrile patient is found to have a greyish patch (pseudomembrane) over the pharynx. He has a documented penicillin allergy. Which antibiotic should be given instead?", "a": "Erythromycin", "y": [33], "t": 186, "an": "mx", "sub": "diphtheria แพ้ penicillin → erythromycin"}, {"id": "PP35-INF-058", "q": "A 25-year-old man has fever and sore throat for 2 days with cough and rhinorrhoea. The pharynx and tonsils are injected without exudate, there is no tender cervical lymphadenopathy, and the lungs are clear. What is the most appropriate management?", "a": "Symptomatic treatment without antibiotics", "y": [35], "t": 186, "an": "mx", "sub": "viral pharyngitis → รักษาตามอาการ"}]}, {"t": "Quiz 5 · S. aureus bacteremia และการรักษา IE ตามเชื้อ", "n": 1, "y": [], "w": "MSSA ลิ้นเทียม = cloxacillin + rifampin ≥ 6 สัปดาห์ + gentamicin 2 สัปดาห์แรก", "c": null, "s": ["PVE MSSA: cloxacillin + rifampin + gentamicin"], "q": [{"id": "PPNA-INF-125", "q": "A 40-year-old woman with a prosthetic mitral valve has fever, heart failure and blood cultures growing methicillin-susceptible Staphylococcus aureus. Which regimen is recommended?", "a": "Cloxacillin (nafcillin) for ≥6 weeks plus rifampicin for ≥6 weeks plus gentamicin for the first 2 weeks", "y": [], "t": 215, "an": "mx", "sub": "PVE MSSA: cloxacillin + rifampin + gentamicin"}]}, {"t": "Quiz 6–7 · Gram-positive rods: Listeria และ cutaneous anthrax", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 8 · Gram-negative bacilli: Vibrio, Salmonella, เชื้อจากสัตว์กัด และฝีในตับ", "n": 2, "y": [30, 31, 34, 35], "w": "ฝีในตับก้อนเดียวในเบาหวาน (เอเชีย) = Klebsiella", "c": null, "s": ["ฝีตับในเบาหวาน = Klebsiella", "ภาวะที่สัมพันธ์กับ Salmonella"], "q": [{"id": "PP30-INF-029", "q": "A 60-year-old man with diabetes has fever and a single 6-cm pyogenic liver abscess. Which organism is most commonly responsible in Asia?", "a": "Klebsiella pneumoniae", "y": [30], "t": 196, "an": "dx", "sub": "ฝีตับในเบาหวาน = Klebsiella"}, {"id": "ID-OLDP-023", "q": "Which of the following is NOT associated with Salmonella infection?", "a": "Myofascial pain syndrome", "y": [31, 34, 35], "t": 201, "an": "fact", "sub": "ภาวะที่สัมพันธ์กับ Salmonella"}]}, {"t": "Quiz 9–10 · Nocardia กับ Actinomyces, anaerobes และ botulism", "n": 3, "y": [32, 34], "w": "ติดทั้ง Gram และ modified AFB = Nocardia; Actinomyces mAFB ลบ — โพยตอบ azithromycin แต่ยาหลักคือ penicillin", "c": null, "s": ["GP beaded branching = Nocardia", "partially acid-fast = Nocardia", "Actinomyces → penicillin (โพยตอบ azithromycin)"], "q": [{"id": "ID-OLDP-006", "q": "Gram stain of purulent material shows gram-positive beaded, filamentous, branching bacilli lying extracellularly, with a PMN-predominant exudate. Which organism is most likely?", "a": "Nocardia spp.", "y": [34], "t": 187, "an": "interp", "sub": "GP beaded branching = Nocardia"}, {"id": "ID-OLDP-038", "q": "An HIV-infected patient presents with cough and dyspnoea. A stain of the respiratory specimen shows beaded, branching filamentous rods that are weakly (partially) acid-fast on modified acid-fast stain. Which organism is most likely?", "a": "Nocardia species", "y": [32], "t": 187, "an": "interp", "sub": "partially acid-fast = Nocardia"}, {"id": "ID-OLDP-007", "q": "Gram stain of pus from a chronic suppurative lesion shows gram-positive branching filamentous organisms; the modified acid-fast stain is negative and culture identifies Actinomyces israelii. Which antimicrobial treatment is appropriate?", "a": "Azithromycin", "y": [32], "t": 187, "an": "mx", "sub": "Actinomyces → penicillin (โพยตอบ azithromycin)"}]}, {"t": "เชื้อรา: Cryptococcus, Candida, Mucor, Aspergillus, Histoplasma กับ Talaromyces", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 11 · ตุ่มบุ๋มตรงกลางและผื่นทั่วตัว: Mpox, ราฉวยโอกาส, อีสุกอีใส, syphilis ระยะ 2", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Mycobacteria: NTM และ leprosy", "n": 2, "y": [32, 35], "w": "ตุ่มม่วงแผลตกสะเก็ดที่หลังมือหลังตกปลา = M. marinum (รุ่น 32, 35)", "c": null, "s": ["ตกปลา + ตุ่มม่วงที่มือ = M. marinum"], "q": [{"id": "PP35-INF-035", "q": "A 35-year-old man has a painful violaceous pustule on the dorsum of the right hand that appeared after a fishing trip; a crusted ulcer is present in the middle of the lesion. He has no constitutional symptoms. What is the most likely cause?", "a": "Mycobacterium marinum", "y": [35], "t": 195, "an": "dx", "sub": "ตกปลา + ตุ่มม่วงที่มือ = M. marinum"}, {"id": "PP32-DER-048", "q": "A 35-year-old man presents with a painful violet pustule on the dorsum of the right hand that appeared after returning from a fishing trip. A crusted ulcer is seen in the midportion of the pustule. He denies any constitutional symptoms. What is the most likely cause of this infection?", "a": "Mycobacterium marinum", "y": [32, 35], "t": 195, "an": "dx", "sub": "ตกปลา + ตุ่มม่วงที่มือ = M. marinum"}]}, {"t": "Quiz 15–16 · HIV: PCP, toxoplasma, ท้องเสียเรื้อรังจาก coccidia และโปรโตซัวอื่น", "n": 3, "y": [30, 34], "w": "แยกด้วยขนาด oocyst ใน modified AFB: 4–6 µm Cryptosporidium (ART) vs 20–30 µm Cystoisospora (Bactrim)", "c": null, "s": ["oocyst 4–6 µm = Cryptosporidium", "Cryptosporidium → เริ่ม ART", "oocyst 25 µm = Cystoisospora → Bactrim"], "q": [{"id": "PP34-INF-019", "q": "A man with HIV (CD4 40 cells/µL) has 6 weeks of chronic watery diarrhoea and weight loss. A modified acid-fast stain of stool shows small (4–6 µm) round acid-fast oocysts. Which organism is the cause?", "a": "Cryptosporidium spp.", "y": [34], "t": 211, "an": "interp", "sub": "oocyst 4–6 µm = Cryptosporidium"}, {"id": "PP30-INF-141", "q": "A man with advanced HIV (CD4 40 cells/µL) has chronic profuse watery diarrhoea. Modified acid-fast stain of stool shows small round oocysts 4–6 µm in diameter. What is the diagnosis and the most important treatment?", "a": "Cryptosporidiosis; start effective antiretroviral therapy (immune restoration), with rehydration ± nitazoxanide", "y": [30], "t": 211, "an": "mx", "sub": "Cryptosporidium → เริ่ม ART"}, {"id": "PPSAQ-INF-128", "q": "A man with advanced HIV has chronic watery diarrhoea and weight loss. Modified acid-fast stain of stool shows large oval oocysts (20–30 µm) containing sporoblasts. What is the diagnosis and treatment?", "a": "Cystoisosporiasis (Cystoisospora belli); trimethoprim–sulfamethoxazole, with ART", "y": [], "t": 211, "an": "interp", "sub": "oocyst 25 µm = Cystoisospora → Bactrim"}]}, {"t": "Quiz 13 · ไข่พยาธิในอุจจาระ: plug, operculum และยาที่ต้องตอบ", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 14 · Strongyloides hyperinfection, larva migrans, filaria และ cysticercosis", "n": 0, "y": [], "w": null, "c": "ยังไม่มีข้อในโพย — ผู้สอนบอกว่าโจทย์ภาพแบบนี้อาจออกใน SAQ ให้บรรยาย วินิจฉัย และตอบชื่อยา", "s": [], "q": []}, {"t": "Quiz 12 · Malaria: อ่าน blood smear และยาตามแนวทางไทย", "n": 8, "y": [29, 30, 31, 32, 33], "w": "มาลาเรียถูกถาม 8 ข้อ รุ่น 29–33: แยก PF/PV จาก smear, ACT + primaquine ครั้งเดียว, ตั้งครรภ์ไตรมาสแรก, doxycycline ป้องกัน", "c": null, "s": ["ไข้หลังเข้าป่า → thick และ thin film", "RBC โต + Schüffner = P. vivax", "ring หลายวง + gametocyte กล้วย = P. falciparum", "PF → ACT + primaquine ครั้งเดียว", "PF ตั้งครรภ์ไตรมาสแรก → quinine + clindamycin", "ป้องกันก่อนเข้าป่า → doxycycline"], "q": [{"id": "PP30-INF-114", "q": "A 25-year-old man has high-grade fever with chills for 4 days after a trip to a forest waterfall near the Thai–Myanmar border. What is the most appropriate initial diagnostic test?", "a": "Thick and thin peripheral blood films for malaria parasites", "y": [30], "t": 202, "an": "ix", "sub": "ไข้หลังเข้าป่า → thick และ thin film"}, {"id": "PP33-INF-002", "q": "A peripheral blood smear from a febrile man who returned from the Thai–Myanmar border shows enlarged, pale infected red cells containing amoeboid trophozoites and fine red stippling (Schüffner's dots). Which organism is most likely?", "a": "Plasmodium vivax", "y": [32, 33], "t": 202, "an": "interp", "sub": "RBC โต + Schüffner = P. vivax"}, {"id": "PP32-INF-050", "q": "A man who returned from a forest in western Thailand has fever for 3 days and jaundice. A thin blood smear shows many red cells infected with small ring forms, some with double chromatin dots and more than one parasite per cell, plus crescent (banana)-shaped gametocytes. The infected red cells are not enlarged. Which species is most likely?", "a": "Plasmodium falciparum", "y": [32], "t": 202, "an": "interp", "sub": "ring หลายวง + gametocyte กล้วย = P. falciparum"}, {"id": "PP31-INF-034", "q": "A 28-year-old Thai soldier returning from the Thai-Myanmar border has fever with chills for 3 days. He is alert, can take oral medication, has no jaundice, no bleeding and normal renal function. The blood smear shows ring forms and banana-shaped gametocytes of Plasmodium falciparum with parasitaemia of 0.5%. Which treatment is most appropriate?", "a": "An oral artemisinin-based combination therapy (e.g. dihydroartemisinin-piperaquine) plus a single low dose of primaquine", "y": [31], "t": 203, "an": "mx", "sub": "PF → ACT + primaquine ครั้งเดียว"}, {"id": "PP31-INF-007b", "q": "A man returning from the Thai–Myanmar border has fever, and the blood smear shows Plasmodium falciparum ring forms with low parasitaemia. He has no features of severe malaria. Which treatment is most appropriate?", "a": "An oral artemisinin-based combination therapy (e.g. dihydroartemisinin–piperaquine, or artesunate plus mefloquine) with single low-dose primaquine", "y": [31], "t": 203, "an": "mx", "sub": "PF → ACT + primaquine ครั้งเดียว"}, {"id": "PP30-INF-117", "q": "A woman at 10 weeks of gestation has uncomplicated Plasmodium falciparum malaria (ring forms and banana-shaped gametocytes on smear). Which treatment is appropriate?", "a": "Quinine plus clindamycin for 7 days (artemether–lumefantrine is now also acceptable in the first trimester per WHO)", "y": [30], "t": 203, "an": "mx", "sub": "PF ตั้งครรภ์ไตรมาสแรก → quinine + clindamycin"}, {"id": "PP29-INF-118", "q": "A forest worker will spend 3 weeks in a malaria-endemic forest on the Thai border with multidrug-resistant P. falciparum. Which chemoprophylaxis is most appropriate, together with mosquito-bite prevention?", "a": "Doxycycline 100 mg daily, started 1–2 days before, continued during and for 4 weeks after leaving", "y": [29], "t": 204, "an": "mx", "sub": "ป้องกันก่อนเข้าป่า → doxycycline"}, {"id": "PP31-INF-004", "q": "A traveller is about to trek into forest on the Thai border area. How should malaria chemoprophylaxis be given?", "a": "Doxycycline 100 mg daily, starting 1-2 days before entering the forest and continued daily until 4 weeks after leaving", "y": [31], "t": 204, "an": "mx", "sub": "ป้องกันก่อนเข้าป่า → doxycycline"}]}]}], "gaps": [{"id": "gap-id-01", "set": "id", "title": "Infection control, PPE และวัคซีนผู้ใหญ่ (Infection control & adult vaccination)", "subtitle": "Hand hygiene, isolation precautions, PPE สำหรับ COVID-19 และกลุ่มเสี่ยงที่ต้องได้วัคซีน", "md": "### หลักคิด: standard precautions ก่อน แล้วค่อยเพิ่ม transmission-based precautions\n- **Standard precautions** ใช้กับผู้ป่วยทุกราย ไม่ว่าวินิจฉัยอะไร: hand hygiene, PPE ตามโอกาสสัมผัสเลือด/สารคัดหลั่ง, respiratory hygiene (cough etiquette), safe injection, การจัดการของมีคม, การทำความสะอาดอุปกรณ์และสิ่งแวดล้อม\n- **Hand hygiene คือมาตรการเดียวที่ได้ผลและคุ้มค่าที่สุดในการป้องกัน healthcare-associated (nosocomial) infection** เพราะมือบุคลากรเป็นพาหะหลักที่นำเชื้อดื้อยา (MRSA, CRE, *Acinetobacter baumannii*) จากผู้ป่วยรายหนึ่งไปอีกรายหนึ่ง\n- WHO **\"5 moments\"**: ก่อนสัมผัสผู้ป่วย, ก่อนทำหัตถการปลอดเชื้อ, หลังสัมผัสสารคัดหลั่ง, หลังสัมผัสผู้ป่วย, หลังสัมผัสสิ่งแวดล้อมรอบตัวผู้ป่วย\n- Alcohol-based hand rub (ABHR) 20–30 วินาที เป็นวิธีมาตรฐาน; ใช้ **สบู่และน้ำ 40–60 วินาที** เมื่อมือเปื้อนเห็นชัด หรือดูแลผู้ป่วย *Clostridioides difficile*/norovirus (spore และ non-enveloped virus ทนแอลกอฮอล์)\n- ถุงมือไม่ใช่สิ่งทดแทน hand hygiene ต้องทำความสะอาดมือหลังถอดถุงมือทุกครั้ง\n\n### Transmission-based precautions\n| ชนิด | กลไก | ตัวอย่างเชื้อ | สิ่งที่ต้องทำ |\n|---|---|---|---|\n| Contact | สัมผัสผู้ป่วยหรือสิ่งแวดล้อม | MRSA, VRE, CRE, *C. difficile*, scabies, infectious diarrhea | gown + gloves, ห้องแยกหรือ cohort, อุปกรณ์เฉพาะราย |\n| Droplet | ละอองขนาดใหญ่ ตกในระยะ 1–2 เมตร | influenza, pertussis, *N. meningitidis* (24 ชม.แรกของยา), pharyngeal diphtheria, mumps, rubella, *M. pneumoniae* | surgical mask, ห้องแยก |\n| Airborne | อนุภาคเล็กลอยในอากาศนาน ไปได้ไกล | **pulmonary/laryngeal TB, measles, varicella, disseminated zoster** | fit-tested N95, airborne infection isolation room (negative pressure, ≥12 air changes/hr), ผู้ป่วยใส่ surgical mask เมื่อออกนอกห้อง |\n\n- **Varicella-zoster virus**: chickenpox, disseminated zoster และ **zoster ใดๆ ในผู้ป่วย immunocompromised** (เช่น acute leukemia ระหว่าง chemotherapy ที่มีผื่น vesicle ปวดแสบตาม dermatome) → **airborne + contact precautions** จนกว่าแผลตกสะเก็ดทั้งหมด เพราะเสี่ยง dissemination และปล่อยไวรัสทางอากาศ\n- Localized zoster ในคนภูมิปกติที่ปิดแผลได้ → standard precautions; บุคลากรที่ไม่มีภูมิต่อ VZV ไม่ควรเข้าดูแล\n- ผู้ป่วย immunocompromised ที่เป็น zoster ควรได้ **acyclovir IV 10 mg/kg q8h**\n\n### COVID-19: การแพร่เชื้อและการเลือก PPE\n- ความเข้าใจปัจจุบันของ WHO: SARS-CoV-2 แพร่หลักผ่าน **infectious respiratory particles ทางอากาศ (airborne)** ซึ่งเด่นที่ระยะใกล้ แต่ไปไกลได้ในห้องปิดที่ระบายอากาศไม่ดี ร่วมกับการตกของละอองลงเยื่อบุตา จมูก ปาก (droplet) และการสัมผัส (contact, มีบทบาทน้อยกว่า)\n- **ตรวจผู้ป่วยสงสัย COVID-19 ทั่วไป** (ซักประวัติ ตรวจร่างกาย ไม่มีหัตถการ): **mask (medical/surgical mask หรือ N95) + eye protection (face shield หรือ goggles) + gown + gloves**; WHO ให้ใช้ respirator ได้เสมอ และควรใช้เมื่อห้องระบายอากาศไม่ดี\n- **Aerosol-generating procedure (AGP)** เช่น intubation, NIV, high-flow nasal cannula, bronchoscopy, CPR, nebulization, sputum induction: **fit-tested N95/FFP2 + eye protection + gown + gloves** ในห้อง airborne isolation\n- ลำดับใส่ (donning): hand hygiene → gown → mask/respirator (ทำ seal check) → eye protection → gloves\n- ลำดับถอด (doffing): gloves → gown → hand hygiene → eye protection → mask (จับที่สาย) → hand hygiene\n- ผู้ป่วยต้องใส่ medical mask, แยก triage, เว้นระยะ, เพิ่มการระบายอากาศ\n- มาตรการระดับบุคคลและชุมชนที่ได้ผล: วัคซีน, ระบายอากาศ, ใส่ medical mask ในที่แออัด, ล้างมือ, หยุดอยู่บ้านเมื่อป่วย; **หน้ากากผ้าเย็บเองกรองอนุภาคได้น้อยและไม่สม่ำเสมอ** ช่วย source control ได้บ้างแต่ป้องกันผู้สวมได้ต่ำสุด จึงเป็นคำตอบของข้อ \"วิธีที่ป้องกันตนเองไม่ได้ผล\"\n\n### วัคซีนผู้ใหญ่และกลุ่มเสี่ยงในประเทศไทย\n- **Influenza vaccine (inactivated)** ฉีดปีละครั้ง ก่อนฤดูระบาด (ไทยรณรงค์ช่วง พ.ค.–ส.ค.) ฟรีสำหรับ **7 กลุ่มเสี่ยง**:\n1. **หญิงตั้งครรภ์อายุครรภ์ ≥4 เดือน** (WHO จัดเป็น priority สูงสุด เพราะป่วยรุนแรงง่าย และภูมิผ่านรกปกป้องทารกช่วง <6 เดือนที่ยังฉีดไม่ได้)\n2. เด็กอายุ 6 เดือน–2 ปี\n3. ผู้ป่วยโรคเรื้อรัง: COPD, asthma, โรคหัวใจ, stroke, CKD, มะเร็งที่ได้ chemotherapy, เบาหวาน\n4. ผู้สูงอายุ ≥65 ปี\n5. ธาลัสซีเมียและผู้มีภูมิคุ้มกันบกพร่อง (รวม HIV)\n6. โรคอ้วน (น้ำหนัก >100 kg หรือ BMI ≥35 kg/m²)\n7. ผู้พิการทางสมองที่ช่วยเหลือตนเองไม่ได้\n- Inactivated influenza vaccine ฉีดได้ทุกไตรมาส; live attenuated vaccine ห้ามในหญิงตั้งครรภ์\n- **COVID-19 vaccine** กลุ่มเป้าหมายคือ **\"608\"**: อายุ ≥60 ปี, โรคเรื้อรัง 7 กลุ่ม (โรคปอดเรื้อรัง, โรคหัวใจและหลอดเลือด, CKD, stroke, โรคอ้วน, มะเร็ง, เบาหวาน) และหญิงตั้งครรภ์ ≥12 สัปดาห์ เพราะเสี่ยงป่วยหนักและเสียชีวิต; ปัจจุบันแนะนำเข็มกระตุ้นประมาณปีละครั้งในกลุ่มนี้ ชาย 62 ปีที่มี DM และ HT จึงควรได้ COVID-19 vaccine เป็นลำดับแรก (และ influenza ด้วย)\n- **Asplenia/hyposplenism** (splenectomy, thalassemia ที่ตัดม้าม, sickle cell): เสี่ยง **overwhelming post-splenectomy infection (OPSI)** จากเชื้อมี capsule ได้แก่ *S. pneumoniae* (พบมากที่สุด), *H. influenzae* type b, *N. meningitidis* รวมถึง *Capnocytophaga* (สุนัขกัด) และ malaria/babesiosis รุนแรง\n- ความเสี่ยง OPSI **สูงสุดใน 1–2 ปีแรกหลังตัดม้าม** (แต่คงอยู่ตลอดชีวิต) และสูงขึ้นอีกในธาลัสซีเมียที่มี iron overload; ผู้ป่วยธาลัสซีเมียตัดม้าม 1 เดือนที่ยังไม่ได้วัคซีน จึงเสี่ยงติดเชื้อรุนแรงที่สุด\n- วัคซีนสำหรับ asplenia: pneumococcal (PCV20 เข็มเดียว หรือ PCV15 ตามด้วย PPSV23 ห่าง ≥8 สัปดาห์), MenACWY conjugate 2 เข็มห่าง ≥8 สัปดาห์ แล้วกระตุ้นทุก 5 ปี, MenB, Hib 1 เข็ม, influenza ทุกปี; ให้ **≥2 สัปดาห์ก่อน elective splenectomy** หรือ **≥14 วันหลังผ่าตัดฉุกเฉิน**\n- สอนผู้ป่วยว่า \"ไข้ = ภาวะฉุกเฉิน\" ให้มี standby antibiotic (เช่น amoxicillin–clavulanate) และรีบมาโรงพยาบาล; empirical IV ceftriaxone ± vancomycin\n- ผู้ใหญ่ทั่วไป: Td กระตุ้นทุก 10 ปี; หญิงตั้งครรภ์ให้ Tdap ทุกครรภ์ช่วง 27–36 สัปดาห์", "pearls": ["Hand hygiene (ABHR หรือสบู่+น้ำ) คือมาตรการป้องกัน nosocomial infection ที่ได้ผลที่สุด; ใช้สบู่+น้ำเมื่อมือเปื้อนหรือ C. difficile", "Zoster ในผู้ป่วย immunocompromised หรือ disseminated zoster/varicella → airborne + contact precautions", "ตรวจผู้ป่วยสงสัย COVID-19 ที่ไม่มี AGP → mask (surgical หรือ N95) + face shield + gown + gloves; AGP → fit-tested N95 ในห้อง negative pressure", "หญิงตั้งครรภ์ (≥4 เดือน) เป็นกลุ่ม priority ของ influenza vaccine; DM/HT/อายุ ≥60 อยู่ในกลุ่ม 608 ของ COVID-19 vaccine", "หลังตัดม้ามช่วง 1–2 ปีแรกโดยยังไม่ได้วัคซีน เสี่ยง OPSI จาก S. pneumoniae สูงสุด — ฉีดวัคซีน ≥2 สัปดาห์ก่อนหรือ ≥14 วันหลังผ่าตัด"], "traps": [], "q": [{"id": "ID-OLDP-008", "q": "Which of the following behaviours is INEFFECTIVE for protecting a person against COVID-19?", "a": "Sewing a mask out of household cloth and wearing it out into public places", "y": [32], "t": 189}, {"id": "PPNA-INF-127", "q": "A traveller with fever, sore throat and dry cough is suspected of COVID-19. Which mode of transmission should guide infection-control precautions according to current WHO understanding?", "a": "Airborne (respiratory aerosols, including short-range) plus droplet and contact — use a fit-tested N95 respirator, eye protection, gown and gloves", "y": [], "t": 189}, {"id": "PP31-INF-028", "q": "You are about to examine a patient with fever and cough who is suspected of having COVID-19. Which of the following is the most appropriate way to protect yourself?", "a": "Wear a mask (surgical mask or N95 respirator) together with a face shield", "y": [31], "t": 189}, {"id": "PP32-INF-061", "q": "You are about to examine a febrile patient with cough whom you suspect has COVID-19, for history taking and routine physical examination (no aerosol-generating procedure). Which personal protective equipment is appropriate?", "a": "Surgical (medical) mask plus face shield, together with gown and gloves", "y": [32], "t": 189}, {"id": "PP29-INF-119", "q": "Which measure is most effective for preventing nosocomial (healthcare-associated) infection?", "a": "Hand hygiene before and after every patient contact", "y": [29], "t": 190}, {"id": "PP31-INF-003", "q": "Which of the following methods is the best for prevention of nosocomial infection?", "a": "Hand hygiene (hand washing or alcohol-based hand rub)", "y": [31], "t": 190}, {"id": "PP31-INF-071", "q": "A 35-year-old woman with acute leukaemia receiving chemotherapy develops a painful, pruritic vesicular rash on her flank on the fifth hospital day. Which isolation precaution is the most appropriate?", "a": "Airborne isolation", "y": [31], "t": 190}, {"id": "PP30-INF-001", "q": "A 62-year-old man with type 2 diabetes and hypertension attends clinic during the COVID-19 pandemic and asks which vaccination he should prioritise now. Which is the most appropriate recommendation?", "a": "COVID-19 vaccination (with boosters as scheduled), as diabetes and hypertension increase the risk of severe COVID-19", "y": [30], "t": 191}, {"id": "PP32-INF-029", "q": "According to national recommendations, which of the following people has the highest priority to receive the seasonal inactivated influenza vaccine?", "a": "A pregnant woman in her second trimester", "y": [32], "t": 191}, {"id": "PP31-INF-007", "q": "Which of the following patients is at highest risk of developing a severe infection?", "a": "Thalassaemia, post-splenectomy 1 month ago, not vaccinated", "y": [31], "t": 191}], "years": [29, 30, 31, 32], "th": [191, 189, 190]}, {"id": "gap-id-07", "set": "id", "title": "Urethritis, DGI, vaginitis และ recurrent candidiasis (Genital infections)", "subtitle": "แยก gonococcal กับ non-gonococcal urethritis, รู้จัก M. genitalium และหาโรคพื้นฐานเมื่อ candidiasis เป็นซ้ำ", "md": "### Urethritis และ cervicitis: เชื้อก่อโรค\n- **Gonococcal urethritis (GU)**: *Neisseria gonorrhoeae* ระยะฟักตัว 2–7 วัน หนองข้นสีเหลืองปริมาณมาก ปัสสาวะแสบ; gram stain หนองพบ **gram-negative intracellular diplococci** ใน PMN (ในผู้ชายไวและจำเพาะ >90%)\n- **Non-gonococcal urethritis (NGU)**: *Chlamydia trachomatis* (พบบ่อยที่สุด), ***Mycoplasma genitalium*** (15–25% ของ NGU และเป็นสาเหตุหลักของ **persistent/recurrent urethritis หลังได้ doxycycline**), *Trichomonas vaginalis*, HSV, adenovirus; discharge ใสหรือเป็นมูก\n- *M. genitalium* **ไม่มี cell wall** (β-lactam ไม่ได้ผล), เพาะเชื้อไม่ได้ในงานประจำ วินิจฉัยด้วย NAAT, ดื้อ macrolide สูงทั่วโลก\n- ผู้หญิงมักเป็น cervicitis ที่ไม่มีอาการหรือมี discharge/ปัสสาวะแสบเล็กน้อย และเสี่ยง PID, infertility, ectopic pregnancy\n- วินิจฉัย urethritis: มี discharge, gram stain ≥2 WBC/oil immersion field, หรือ leukocyte esterase บวก/≥10 WBC/HPF ใน first-void urine; ส่ง **NAAT สำหรับ GC และ CT** (first-void urine ในชาย, vaginal swab ในหญิง); ตรวจ HIV และ syphilis ทุกราย และรักษาคู่นอน\n\n### การรักษา (CDC 2021 เป็นหลัก)\n| เชื้อ | ยา |\n|---|---|\n| Gonorrhea (urethra, cervix, rectum, pharynx) | **Ceftriaxone 500 mg IM ครั้งเดียว** (น้ำหนัก ≥150 kg ให้ 1 g); ถ้ายังไม่ได้ตัด chlamydia ให้ doxycycline 100 mg bid × 7 วันร่วม (แนวทางเดิม: ceftriaxone 250 mg + azithromycin 1 g) |\n| *C. trachomatis* | **Doxycycline 100 mg bid × 7 วัน**; หญิงตั้งครรภ์ใช้ azithromycin 1 g ครั้งเดียว |\n| *M. genitalium* | Doxycycline 100 mg bid × 7 วัน แล้วต่อ **moxifloxacin 400 mg/วัน × 7 วัน**; ถ้าทดสอบว่าไวต่อ macrolide ใช้ azithromycin 1 g แล้ว 500 mg/วัน × 3 วันแทน moxifloxacin |\n| *T. vaginalis* | Metronidazole 500 mg bid × 7 วัน (หญิง), 2 g ครั้งเดียว (ชาย) |\n\n- Urethritis ไม่หายหลัง doxycycline และ NAAT GC/CT ลบ → นึกถึง ***M. genitalium*** ก่อน (รองลงมาคือ *T. vaginalis*)\n\n### Disseminated gonococcal infection (DGI)\n- เกิดจาก gonococcal bacteremia พบ 0.5–3% ของผู้ติดเชื้อ มักในหญิง (ช่วงมีประจำเดือน ตั้งครรภ์) ซึ่งการติดเชื้อที่ mucosa มักไม่มีอาการ; ผู้ที่เป็น DGI/Neisseria ซ้ำให้นึกถึง **terminal complement deficiency (C5–C9)**\n- 2 รูปแบบ:\n1. **Arthritis–dermatitis syndrome**: ไข้, **migratory polyarthralgia**, **tenosynovitis** (หลังข้อมือ มือ ข้อเท้า), **pustule หรือ vesicopustule ไม่เจ็บ** จำนวนน้อยที่แขนขา\n2. **Purulent monoarthritis** (เข่า ข้อมือ ข้อเท้า) โดยไม่มีผื่น\n- ตรวจ: NAAT จากทุก mucosal site (urethra/cervix, rectum, pharynx) ให้ผลบวกสูงสุด, blood culture, synovial fluid culture (เพาะขึ้นยาก)\n- รักษา: **ceftriaxone 1 g IV/IM ทุก 24 ชม.** เมื่อดีขึ้น 24–48 ชม. เปลี่ยนเป็นยากินตาม susceptibility จนครบ **≥7 วัน**; septic arthritis ต้องเจาะล้างข้อ; ถ้ามี endocarditis หรือ meningitis ต้องให้ยา IV นานขึ้น\n\n### Vaginitis: แยก 3 สาเหตุหลัก\n| ลักษณะ | Vulvovaginal candidiasis | Bacterial vaginosis | Trichomoniasis |\n|---|---|---|---|\n| อาการ | คันมาก แสบ ตกขาวข้นขาวคล้ายนมบูด | ตกขาวบางสีเทา กลิ่นคาวปลา ไม่ค่อยคัน | ตกขาวเป็นฟองเหลืองเขียว กลิ่นเหม็น, strawberry cervix |\n| pH | ≤4.5 (ปกติ) | >4.5 | >4.5 |\n| ตรวจ | KOH พบ pseudohyphae/budding yeast | clue cells, whiff test บวก (Amsel ≥3 ใน 4) | wet mount เห็น trichomonads เคลื่อนที่, NAAT |\n| รักษา | fluconazole 150 mg ครั้งเดียว หรือ topical azole | metronidazole 500 mg bid × 7 วัน | metronidazole 500 mg bid × 7 วัน + รักษาคู่นอน |\n\n### Recurrent candidiasis: หาโรคพื้นฐานก่อน\n- *Candida albicans* เป็น commensal; เมื่อ candidiasis กลับเป็นซ้ำเร็ว (เช่น 1 เดือนหลังรักษาครบ) หรือเป็นบ่อย ให้คิดว่ามี **host factor** ที่ยังไม่ได้แก้ แทนที่จะให้ยาซ้ำอย่างเดียว\n- **Diabetes mellitus** เป็นสาเหตุที่ต้องหาเป็นอันดับแรก: glucose สูงในสารคัดหลั่งและเนื้อเยื่อเป็นอาหารของเชื้อ และ neutrophil ทำงานบกพร่อง → ตรวจ **fasting plasma glucose/HbA1c**\n- ปัจจัยอื่น: **HIV** (oral/esophageal candidiasis ในผู้ใหญ่ที่ไม่มีเหตุอื่น ต้องตรวจ anti-HIV; esophageal candidiasis บ่งชี้ CD4 <100–200), ยาปฏิชีวนะ, corticosteroid (รวม inhaled steroid สำหรับ oral thrush), **SGLT2 inhibitors** (glucosuria → vulvovaginal candidiasis/balanitis), ตั้งครรภ์, ยาคุมฮอร์โมนเอสโตรเจนสูง, ยากดภูมิ/เคมีบำบัด\n- **Recurrent vulvovaginal candidiasis** = ≥3 ครั้งใน 12 เดือน: เพาะเชื้อยืนยันและหาชนิด (non-albicans เช่น *C. glabrata* ไม่ตอบสนอง fluconazole → boric acid vaginal), รักษา induction **fluconazole 150 mg ทุก 72 ชม. × 3 ครั้ง** แล้ว maintenance **150 mg สัปดาห์ละครั้ง × 6 เดือน**\n- คู่นอนชายไม่ต้องรักษาเป็นประจำ ยกเว้นมี balanitis", "pearls": ["Urethritis ไม่หายหลัง doxycycline และ NAAT GC/CT ลบ → Mycoplasma genitalium → doxycycline แล้ว moxifloxacin", "Gram-negative intracellular diplococci = gonorrhea → ceftriaxone 500 mg IM ครั้งเดียว", "หญิงวัยเจริญพันธุ์ + ไข้ + migratory polyarthralgia + tenosynovitis + pustule ไม่เจ็บ = DGI (N. gonorrhoeae) → ceftriaxone 1 g IV q24h", "DGI/Neisseria ซ้ำ → ตรวจ terminal complement deficiency (C5–C9)", "Candidiasis กลับเป็นซ้ำ → ตรวจน้ำตาลหา DM ก่อน (และ HIV, ยา steroid/SGLT2i/antibiotic)"], "traps": [], "q": [{"id": "ID-OLDP-035", "q": "A woman with multiple sexual partners has urethral discharge and dysuria with a clear discharge. She has taken doxycycline for several days with no improvement. NAAT is negative for both N. gonorrhoeae and C. trachomatis. Which pathogen is the most likely cause?", "a": "Mycoplasma genitalium", "y": [34], "t": 213}, {"id": "PP35-INF-045", "q": "A sexually active 22-year-old woman has fever, migratory polyarthralgia, tenosynovitis of the wrist and scattered painless pustules on the hands. Which organism is the most likely cause?", "a": "Neisseria gonorrhoeae", "y": [35], "t": 213}, {"id": "ID-OLDP-034", "q": "A woman is treated for candidiasis, but the infection returns one month after she completed treatment. What should be done next?", "a": "Check a blood glucose level to look for underlying diabetes mellitus", "y": [31], "t": 212}], "years": [31, 34, 35], "th": [213, 212]}, {"id": "gap-id-08", "set": "id", "title": "ยาต้านจุลชีพ: กลไก, spectrum และผลข้างเคียง", "subtitle": "จำกลไกยาแต่ละกลุ่ม, ยาที่ครอบคลุม Pseudomonas, vancomycin infusion reaction และสูตรยา MSSA PVE", "md": "### กลไกการออกฤทธิ์\n| เป้าหมาย | ยา | หมายเหตุ |\n|---|---|---|\n| Cell wall: จับ penicillin-binding protein ยับยั้ง transpeptidation | β-lactams (penicillins, cephalosporins, carbapenems, aztreonam) | bactericidal, time-dependent |\n| Cell wall: จับปลาย D-Ala-D-Ala ของ peptidoglycan precursor | Glycopeptides (vancomycin, teicoplanin) | gram-positive เท่านั้น |\n| Cell membrane | Daptomycin (gram-positive), polymyxin B/colistin (gram-negative) | daptomycin ถูก surfactant ทำลาย ห้ามใช้รักษา pneumonia |\n| Ribosome 30S | Aminoglycosides (misreading, bactericidal), tetracyclines/tigecycline (บัง aminoacyl-tRNA) | aminoglycoside ต้องใช้ออกซิเจนเข้าเซลล์ จึงไม่ได้ผลกับ anaerobe |\n| Ribosome 50S | Macrolides, clindamycin, chloramphenicol, linezolid (ยับยั้ง initiation complex) | ส่วนใหญ่ bacteriostatic |\n| **DNA gyrase (topoisomerase II) + topoisomerase IV** | **Fluoroquinolones** (ciprofloxacin, levofloxacin, moxifloxacin) | gyrase เป็นเป้าหลักใน gram-negative, topo IV ใน gram-positive |\n| DNA (free radical หลังถูก reduce ในเชื้อ anaerobe) | Metronidazole | anaerobe และ protozoa |\n| DNA-dependent RNA polymerase | Rifampicin | ห้ามใช้เดี่ยว ดื้อเร็ว |\n| Folate synthesis | Sulfonamide (dihydropteroate synthase) + trimethoprim (dihydrofolate reductase) | TMP-SMX ออกฤทธิ์เสริมกัน |\n\n### Spectrum ที่ต้องจำ\n- **Anti-pseudomonal**: piperacillin–tazobactam, ceftazidime, cefepime, imipenem/meropenem/doripenem, aztreonam, ciprofloxacin/levofloxacin, aminoglycosides (amikacin, gentamicin), colistin; ยาใหม่สำหรับเชื้อดื้อ: ceftolozane–tazobactam, ceftazidime–avibactam\n- **ไม่ครอบคลุม Pseudomonas**: **ceftriaxone/cefotaxime, ertapenem**, cefazolin, ampicillin–sulbactam, amoxicillin–clavulanate, tigecycline, moxifloxacin (อ่อน)\n- **MRSA**: vancomycin, linezolid, daptomycin, ceftaroline, TMP-SMX/doxycycline/clindamycin (ผิวหนัง)\n- **Anaerobes**: metronidazole, β-lactam/β-lactamase inhibitor, carbapenems, clindamycin (ดื้อสูงขึ้น)\n- **Atypical** (*Mycoplasma*, *Chlamydophila*, *Legionella*): macrolides, doxycycline, respiratory fluoroquinolones — β-lactam ไม่ได้ผล\n- **ESBL-producing Enterobacterales**: carbapenem เป็นยาหลักในการติดเชื้อรุนแรง\n\n### ผลข้างเคียงสำคัญ\n- **Vancomycin infusion reaction (\"red man/red neck syndrome\")**: ฉีดเร็ว → vancomycin กระตุ้น mast cell หลั่ง histamine โดยตรง (**ไม่ใช่ IgE allergy**) → หน้าแดง คัน ผื่นแดงที่หน้า คอ ลำตัวส่วนบน ± hypotension\n- การจัดการ: **หยุดหยด, ให้ antihistamine** (diphenhydramine หรือ chlorpheniramine), ให้สารน้ำถ้า BP ต่ำ แล้ว **เริ่มใหม่ในอัตราช้าลง** (≤10 mg/min หรือ 1 g ใน ≥1–2 ชม.) ± premedicate antihistamine; ใช้ยาต่อได้\n- Vancomycin อื่นๆ: nephrotoxicity (เพิ่มเมื่อใช้ร่วม piperacillin–tazobactam หรือ aminoglycoside) → ติดตาม AUC 400–600 mg·h/L หรือ trough\n- Fluoroquinolones: tendinitis/tendon rupture (สูงอายุ, ใช้ steroid), QT prolongation, dysglycemia, ชัก/สับสน, aortic aneurysm/dissection, *C. difficile*; ดูดซึมลดลงเมื่อกินกับ Ca, Mg, Al, Fe\n- Aminoglycosides: nephrotoxicity และ **ototoxicity (ถาวร)**, neuromuscular blockade\n- Linezolid: thrombocytopenia/myelosuppression เมื่อใช้ >2 สัปดาห์, serotonin syndrome ร่วมกับ SSRI, lactic acidosis\n- อื่นๆ: TMP-SMX → hyperkalemia, SJS/TEN, creatinine สูงขึ้น; metronidazole → disulfiram-like reaction, peripheral neuropathy; carbapenem → ลดระดับ valproate (imipenem ลด seizure threshold); colistin → nephro/neurotoxicity; macrolide (erythromycin, clarithromycin) → QT ยาว และยับยั้ง CYP3A4\n\n### Prosthetic valve endocarditis (PVE) จาก MSSA\n- *S. aureus* สร้าง **biofilm** บนวัสดุเทียม ทำให้ยาที่ออกฤทธิ์ต่อผนังเซลล์อย่างเดียวกำจัดเชื้อไม่หมด จึงต้องเพิ่ม **rifampicin** (เข้า biofilm ได้ดี) และให้ gentamicin ระยะสั้นช่วยฆ่าเชื้อเร็วขึ้น\n- **Regimen (AHA/ESC 2023)**:\n1. **Cloxacillin (anti-staphylococcal penicillin; nafcillin/oxacillin/flucloxacillin) 2 g IV q4h (12 g/วัน) นาน ≥6 สัปดาห์**\n2. **ร่วมกับ rifampicin 900 mg/วัน แบ่ง 2–3 ครั้ง (เช่น 300 mg q8h) นาน ≥6 สัปดาห์** — เริ่มหลังได้ยาฆ่าเชื้อและ bacteremia เริ่มลดลงแล้ว 3–5 วัน เพื่อลดการดื้อ rifampicin\n3. **ร่วมกับ gentamicin 3 mg/kg/วัน (1–2 ครั้ง/วัน) เฉพาะ 2 สัปดาห์แรก** ติดตามการทำงานของไต\n- แพ้ penicillin แบบไม่รุนแรงใช้ cefazolin แทน; MRSA PVE ใช้ vancomycin + rifampicin ≥6 สัปดาห์ + gentamicin 2 สัปดาห์\n- เปรียบเทียบ **native valve MSSA IE**: cloxacillin หรือ cefazolin 4–6 สัปดาห์ **ไม่ต้องเพิ่ม gentamicin หรือ rifampicin** (เพิ่ม nephrotoxicity โดยไม่ลดอัตราตาย)\n- **PVE จาก S. aureus มีอัตราตายสูงและมักต้องผ่าตัดเปลี่ยนลิ้น**: ข้อบ่งชี้ผ่าตัดเร่งด่วนได้แก่ **heart failure** จาก valve dysfunction, uncontrolled infection (perivalvular abscess, fistula, เพาะเชื้อยังบวกแม้ได้ยาเหมาะสม), vegetation ใหญ่ร่วมกับ embolism → ผู้ป่วยที่มี heart failure ต้องปรึกษา cardiothoracic surgeon ทันที\n- ทุกรายต้อง blood culture ซ้ำจนลบ, echocardiography (TEE จำเป็นสำหรับลิ้นเทียม) และนับระยะเวลาให้ยาจากวันที่ blood culture ลบ", "pearls": ["Fluoroquinolone ยับยั้ง DNA gyrase (topoisomerase II) และ topoisomerase IV", "Vancomycin red man syndrome = histamine release ไม่ใช่ IgE → หยุด, antihistamine, เริ่มใหม่ช้าลง ≥1–2 ชม.", "Ceftriaxone และ ertapenem ไม่ครอบคลุม Pseudomonas; ceftazidime, cefepime, pip-tazo, mero/imipenem, cipro, aminoglycoside ครอบคลุม", "MSSA prosthetic valve endocarditis → cloxacillin ≥6 สัปดาห์ + rifampicin ≥6 สัปดาห์ + gentamicin 2 สัปดาห์แรก", "Native valve MSSA IE ไม่ต้องเพิ่ม gentamicin/rifampicin; PVE จาก S. aureus ที่มี heart failure → ผ่าตัด"], "traps": [], "q": [{"id": "PP30-INF-115", "q": "What is the mechanism of action of fluoroquinolones such as ciprofloxacin?", "a": "Inhibition of bacterial DNA gyrase (topoisomerase II) and topoisomerase IV", "y": [30], "t": 214}, {"id": "PP30-INF-116", "q": "During a rapid intravenous infusion of vancomycin, a patient develops flushing and an itchy erythematous rash over the face, neck and upper trunk, with mild hypotension. What is the cause and management?", "a": "Vancomycin infusion reaction (red man syndrome) from non-IgE histamine release; stop, give antihistamine, and restart at a slower rate (over ≥1–2 hours)", "y": [30], "t": 214}], "years": [30], "th": [214]}, {"id": "gap-id-04", "set": "id", "title": "Tetanus และ Rabies: การจัดการแผลและ post-exposure prophylaxis", "subtitle": "รักษาบาดทะยักให้ครบ 4 ข้อ และให้ PEP พิษสุนัขบ้าตาม WHO category", "md": "### Tetanus: กลไก\n- Spore ของ *Clostridium tetani* อยู่ในดินและมูลสัตว์ เข้าทางแผลลึก ปนเปื้อน มีเนื้อตาย (ตะปูตำ, แผลเบาหวานที่เท้า, แผลไฟไหม้, ฉีดยาเสพติด, ตัดสายสะดือไม่สะอาด) → เจริญในสภาวะ anaerobic สร้าง **tetanospasmin**\n- Toxin เดินทางย้อนตาม motor neuron ไปไขสันหลังและก้านสมอง ตัด synaptobrevin ทำให้ inhibitory interneuron **หลั่ง GABA และ glycine ไม่ได้** → กล้ามเนื้อเกร็งและกระตุก และระบบ autonomic แปรปรวน; toxin ที่จับปลายประสาทแล้วไม่สามารถ neutralize ได้\n- ระยะฟักตัว 3–21 วัน (ยิ่งสั้นยิ่งรุนแรง)\n\n### อาการและการวินิจฉัย\n- Generalized tetanus: **trismus** (อาการแรกที่พบบ่อยที่สุด), risus sardonicus, กลืนลำบาก, คอและหลังแข็ง, opisthotonus, ท้องแข็งเป็นแผ่นไม้, spasm เมื่อถูกกระตุ้นด้วยเสียง แสง สัมผัส โดยผู้ป่วย **รู้สึกตัวดี**\n- Autonomic dysfunction (สัปดาห์ที่ 2): BP แกว่ง, tachycardia, ไข้, เหงื่อออก — เป็นสาเหตุตายสำคัญร่วมกับ laryngospasm และ respiratory failure\n- รูปแบบอื่น: local tetanus, cephalic tetanus (แผลที่ศีรษะ + cranial nerve palsy), neonatal tetanus\n- วินิจฉัยจาก **อาการทางคลินิก** ไม่มี lab ยืนยัน; ทุกรายต้องหาแผลต้นเหตุ\n\n### การรักษา tetanus ให้ \"ครบ\"\n1. **Human tetanus immunoglobulin (HTIG)** 3,000–6,000 IU IM ครั้งเดียว (บางแนวทางใช้ 500 IU) เพื่อจับ toxin ที่ยังไม่เข้าเส้นประสาท; ไม่มีใช้ equine tetanus antitoxin; ให้ก่อนหรือพร้อมการทำแผล\n2. **Wound debridement** ตัดเนื้อตายและสิ่งแปลกปลอม เพื่อกำจัดแหล่งสร้าง toxin\n3. **Antibiotic: metronidazole 500 mg IV q6–8h × 7–10 วัน** เป็นยาแรก (penicillin G เป็นทางเลือก แต่เป็น GABA antagonist อาจเสริม spasm)\n4. **Tetanus toxoid (TT/Td) ครบชุด 3 เข็ม** ฉีดคนละตำแหน่งกับ HTIG เพราะ **การเป็นบาดทะยักไม่ทำให้เกิดภูมิคุ้มกัน**\n5. Supportive: ห้องมืดเงียบ ลดสิ่งกระตุ้น, **benzodiazepine** (diazepam) คุม spasm, **magnesium sulfate** ลด spasm และ autonomic instability, neuromuscular blocker + ventilator ในรายรุนแรง, tracheostomy เร็ว, ให้อาหาร, ป้องกัน DVT; หลีกเลี่ยง pure β-blocker (เช่น propranolol) เพราะเสี่ยง hypotension/cardiac arrest\n\n### Tetanus prophylaxis ในผู้มีบาดแผล\n| ประวัติวัคซีน | แผลสะอาด เล็ก | แผลอื่น (สกปรก ลึก ตะปูตำ ถูกกัด เนื้อตาย ไฟไหม้) |\n|---|---|---|\n| ไม่ทราบ หรือ <3 เข็ม | Td/Tdap และให้ครบชุด | Td/Tdap + **TIG 250 IU IM** |\n| ≥3 เข็ม เข็มสุดท้าย <5 ปี | ไม่ต้องให้ | ไม่ต้องให้ |\n| ≥3 เข็ม เข็มสุดท้าย 5–10 ปี | ไม่ต้องให้ | Td/Tdap |\n| ≥3 เข็ม เข็มสุดท้าย >10 ปี | Td/Tdap | Td/Tdap |\n\n### Rabies: กลไก\n- Rabies virus (Lyssavirus, RNA) อยู่ในน้ำลายสัตว์; ในไทยแหล่งหลักคือ **สุนัข** ตามด้วยแมว; ไวรัสเข้าปลายประสาทแล้วเคลื่อนย้อนไปสมอง ระยะนี้ไม่มีอาการ (ระยะฟักตัวส่วนใหญ่ 1–3 เดือน สั้นลงเมื่อแผลใกล้สมอง ที่มือ หรือแผลรุนแรง)\n- เมื่อมีอาการ (ปวด/ชาบริเวณแผล, furious form มี hydrophobia aerophobia กระสับกระส่าย หรือ paralytic form) **อัตราตายเกือบ 100%** ดังนั้น PEP ต้องให้ทันทีและ **ไม่มีข้อห้าม** รวมถึงหญิงตั้งครรภ์\n\n### Post-exposure prophylaxis (PEP)\n1. **ล้างแผลทันที** ด้วยน้ำสะอาดและสบู่ฟอกหลายครั้งอย่างน้อย 15 นาที แล้วใส่ povidone-iodine; หลีกเลี่ยงการเย็บปิดแผลทันที (ถ้าจำเป็นให้ฉีด RIG ก่อนแล้วเย็บหลวม)\n2. ประเมิน **WHO category** แล้วให้วัคซีน ± rabies immunoglobulin (RIG)\n3. ให้ tetanus prophylaxis ตามตารางข้างบน และ antibiotic (amoxicillin–clavulanate) เมื่อแผลเสี่ยงติดเชื้อ\n\n| WHO category | ลักษณะการสัมผัส | การจัดการ |\n|---|---|---|\n| I | สัมผัส ป้อนอาหาร ถูกเลียบนผิวหนังปกติ | ล้างบริเวณ ไม่ต้องให้ PEP |\n| II | ถูกงับผิวหนังเปลือย (nibbling), ข่วนหรือถลอกเล็กน้อย **ไม่มีเลือดออก** | ล้างแผล + **วัคซีนทันที** |\n| III | **กัดหรือข่วนทะลุผิวหนัง (มีเลือดออก)** หนึ่งแผลหรือหลายแผล, ถูกเลียบนแผล, น้ำลายถูกเยื่อบุตา/ปาก, สัมผัสค้างคาว | ล้างแผล + **วัคซีน + RIG** |\n\n- Category II ในผู้ป่วย immunocompromised ให้ RIG ด้วย\n- **RIG**: ERIG 40 IU/kg หรือ HRIG 20 IU/kg **ฉีดเข้าและรอบแผลให้มากที่สุดเท่าที่ทำได้** (WHO 2018 ไม่ต้องฉีดส่วนที่เหลือเข้ากล้ามที่ไกลแผล); ให้พร้อมวัคซีนเข็มแรก หรือช้าที่สุด **ภายใน 7 วันหลังวัคซีนเข็มแรก**; ห้ามเกินขนาดเพราะกดการตอบสนองต่อวัคซีน\n- ตารางวัคซีนสำหรับผู้ไม่เคยได้รับวัคซีน:\n- Intradermal (ID): 0.1 mL 2 จุด ในวันที่ 0, 3, 7 (WHO 2018 one-week regimen; แนวทางไทยเดิมเพิ่ม 2 จุดในวันที่ 28)\n- Intramuscular (IM): 1 dose ที่ deltoid ในวันที่ 0, 3, 7 และ 14–28 (Essen; สูตรเดิม 5 เข็ม 0, 3, 7, 14, 28) หรือ Zagreb 2-1-1 (2 dose วันที่ 0, แล้ว 1 dose วันที่ 7 และ 21); ห้ามฉีดที่สะโพก\n- **ผู้ที่เคยได้ PrEP หรือ PEP ครบมาก่อน**: กระตุ้นวันที่ 0 และ 3 (ID 1 จุด หรือ IM 1 dose) หรือ ID 4 จุดวันที่ 0 ครั้งเดียว — **ไม่ต้องให้ RIG**\n- สุนัขหรือแมวที่กัดให้กักดูอาการ 10 วัน (เริ่มวัคซีนไปก่อน ไม่ต้องรอ); ถ้าสัตว์ยังปกติครบ 10 วัน หยุดวัคซีนได้\n- PrEP สำหรับกลุ่มเสี่ยง (สัตวแพทย์ ผู้ทำงานกับสัตว์): ID 2 จุด หรือ IM 1 dose วันที่ 0 และ 7", "pearls": ["Tetanus: trismus เป็นอาการแรกที่พบบ่อย ผู้ป่วยรู้สึกตัวดี; วินิจฉัยทางคลินิก", "รักษา tetanus ครบ = debridement + metronidazole + HTIG + tetanus toxoid (การเป็นโรคไม่สร้างภูมิ) + benzodiazepine/MgSO4", "Rabies WHO category III (กัดทะลุผิวมีเลือดออก, เลียแผล, น้ำลายถูกเยื่อบุ) → วัคซีนครบชุด + RIG ฉีดเข้ารอบแผล", "Category II (ถลอกไม่มีเลือด) → วัคซีนอย่างเดียว; category I → ไม่ต้อง PEP", "เคยได้วัคซีนพิษสุนัขบ้าครบ → กระตุ้นวันที่ 0, 3 ไม่ต้องให้ RIG; RIG ให้ได้ไม่เกิน 7 วันหลังวัคซีนเข็มแรก"], "traps": [], "q": [{"id": "PPNA-INF-126", "q": "A 45-year-old man with diabetes has trismus, dysphagia, agitation and generalised extensor muscle rigidity for 2 days. He has an infected puncture wound on the right sole. Which management is most complete?", "a": "Wound debridement, metronidazole, human tetanus immunoglobulin and tetanus toxoid", "y": [], "t": 193}, {"id": "PP31-INF-018", "q": "An unvaccinated man is bitten by a stray dog, with a bleeding transdermal wound (WHO category III exposure). Besides wound washing, what post-exposure prophylaxis should he receive?", "a": "A full course of rabies vaccine plus rabies immunoglobulin (ERIG or HRIG) infiltrated into the wound, with tetanus prophylaxis as needed", "y": [31], "t": 194}], "years": [31], "th": [194, 193]}], "left": []}, {"set": "gi", "name": "GI", "n_lec": 77, "n_unc": 15, "lectures": [{"lec": "12/10", "title": "Acute and chronic hepatitis", "n": 8, "angle": {"fact": 3, "interp": 1, "mx": 1, "dx": 3}, "pattern": "ข้อสอบคาบนี้เป็น fact สั้นเรื่อง virology (DNA/RNA, ทางติดต่อ) และอ่านผล serology ง่าย ๆ ข้อละเรื่องไม่ซ้ำรุ่น กระจายรุ่น 28–35 โจทย์ยาวมีแค่ alcoholic hepatitis. ยังไม่มีข้อเรื่องการให้ยา HBV/HCV, MASLD treatment หรือ DILI.", "tip": "จำตาราง A–E (สารพันธุกรรม ทางติดต่อ เรื้อรังได้ไหม) และ serology HBV ให้แม่น แล้วอ่าน alcoholic hepatitis (AST/ALT > 2, AST < 400) กับ HCV/HBV→HCC เป็นข้อเก็บคะแนน.", "secs": [{"t": "ตับอักเสบเฉียบพลัน — อ่าน ALT/AST และแยกสาเหตุ", "n": 0, "y": [], "w": null, "c": "อ่าน ALT/AST ถูกถามผ่านคาบ LFT แทน — เนื้อซ้ำกัน", "s": [], "q": []}, {"t": "ไวรัสตับอักเสบ A ถึง E", "n": 2, "y": [28, 30], "w": "ตาราง A–E: HBV เป็นไวรัส DNA ตัวเดียว · HAV ติดทาง fecal–oral (รุ่น 28, 30)", "c": null, "s": ["HAV ติดต่อทางปาก", "ตาราง A–E: HBV เป็น DNA"], "q": [{"q": "Hepatitis A is transmitted mainly by which route?", "a": "Faecal-oral route", "y": [30], "an": "fact", "sub": "HAV ติดต่อทางปาก", "t": 227}, {"q": "Which hepatitis virus has a DNA genome?", "a": "Hepatitis B virus", "y": [28], "an": "fact", "sub": "ตาราง A–E: HBV เป็น DNA", "t": 228}]}, {"t": "ตับอักเสบจากไวรัสเฉียบพลัน — อาการ และการอ่านผลเลือด HBV", "n": 1, "y": [30], "w": "ผลเลือด HBsAg+ + anti-HBc IgM+ = acute HBV → ถามประวัติรับเลือด 1 เดือนก่อน", "c": null, "s": ["ผลเลือด HBV: anti-HBc IgM = acute"], "q": [{"q": "A 30-year-old man has nausea and jaundice. Serology: anti-HAV IgG positive, HBsAg positive, anti-HBc IgM positive, anti-HBc IgG positive. Which history is most helpful for this diagnosis?", "a": "Blood transfusion one month ago", "y": [30], "an": "interp", "sub": "ผลเลือด HBV: anti-HBc IgM = acute", "t": 226}]}, {"t": "พยากรณ์โรคและการดูแล acute viral hepatitis", "n": 1, "y": [30], "w": "acute HAV เหลืองแต่รู้สึกตัวดี INR ปกติ → supportive อย่างเดียว", "c": null, "s": ["การดูแล: supportive"], "q": [{"q": "A 24-year-old man has acute hepatitis A with jaundice; he is alert, eating and has a normal INR. What is the appropriate treatment?", "a": "Supportive care only (rest, hydration, avoid alcohol and hepatotoxic drugs)", "y": [30], "an": "mx", "sub": "การดูแล: supportive", "t": 227}]}, {"t": "ตับอักเสบจากแอลกอฮอล์", "n": 1, "y": [31], "w": "ดื่มเหล้าหนัก + เหลือง ไข้ต่ำ ตับโตกดเจ็บ AST > ALT → alcoholic hepatitis", "c": null, "s": ["ภาพทางคลินิก alcoholic hepatitis"], "q": [{"q": "A 42-year-old woman has had jaundice, low-grade fever and fatigue for 2 weeks. She has drunk one bottle of rum per day for 15 years and has taken acetaminophen 1 g/day for the past 3 days. Temperature is 37.9°C, heart rate 100/min, blood pressure 110/70 mmHg; jaundice, spider angiomata and mild muscle wasting are noted. Abdominal examination shows mild splenomegaly and mild tender hepatomegaly with no ascites. Hb 12.8 g/dL, leukocytes 3,400/µL, platelets 99,000/µL, AST 124 U/L, ALT 57 U/L, total/direct bilirubin 6.2/3.4 mg/dL, albumin 3.4 g/dL, INR 1.2. Which of the following is the most likely diagnosis?", "a": "Alcoholic hepatitis", "y": [31], "an": "dx", "sub": "ภาพทางคลินิก alcoholic hepatitis", "t": 224}]}, {"t": "ตับอักเสบจากยาและสมุนไพร (DILI)", "n": 0, "y": [], "w": null, "c": "DILI/สมุนไพร ยังไม่เคยออก แต่ RUCAM และระยะแฝงเป็นเนื้อหาใหม่ น่าออกได้", "s": [], "q": []}, {"t": "สาเหตุที่พบน้อยแต่ห้ามพลาด: ischemic hepatitis, AIH, Wilson", "n": 0, "y": [], "w": null, "c": "ischemic hepatitis, AIH, Wilson ไม่ถูกถามในคาบนี้ (ไปโผล่ในคาบ LFT แทน) — อ่านคู่กัน", "s": [], "q": []}, {"t": "ตับอักเสบเรื้อรัง — ไล่หาสาเหตุ และวัดพังผืด", "n": 0, "y": [], "w": null, "c": "ขั้นตอนหาสาเหตุ chronic hepatitis และ Fibroscan < 8 kPa ยังไม่เคยออก", "s": [], "q": []}, {"t": "ตับอักเสบบีเรื้อรัง — เมื่อไรให้ยา (อัปเดต WHO 2024 / EASL 2025)", "n": 1, "y": [35], "w": "ไวรัสที่เป็นสาเหตุ HCC อันดับหนึ่งของโลก = HBV (รุ่น 35)", "c": null, "s": ["เฝ้าระวังมะเร็งตับ: HBV → HCC"], "q": [{"q": "Worldwide, chronic infection with which virus is the leading cause of hepatocellular carcinoma?", "a": "Hepatitis B virus", "y": [35], "an": "fact", "sub": "เฝ้าระวังมะเร็งตับ: HBV → HCC", "t": 228}]}, {"t": "ตับอักเสบซีเรื้อรัง — รักษาหายขาดได้", "n": 1, "y": [31], "w": "รอยสักร้านเถื่อน ALT สูงเล็กน้อย HBsAg ลบ → HCV", "c": null, "s": ["HCV ติดต่อทางไหน: รอยสัก"], "q": [{"q": "A 35-year-old man with a tattoo obtained 5 years ago in an unlicensed studio is found to have mildly raised ALT on a health check. HBsAg is negative. Which chronic viral infection is he most likely to have acquired?", "a": "Hepatitis C virus", "y": [31], "an": "dx", "sub": "HCV ติดต่อทางไหน: รอยสัก", "t": 228}]}, {"t": "MASLD — ไขมันพอกตับที่สัมพันธ์กับเมตาบอลิก", "n": 1, "y": [31], "w": null, "c": null, "s": ["MASLD นิยามชื่อใหม่"], "q": [{"q": "A patient with a high BMI who drinks alcohol only about twice a month is found to have fatty change of the liver. Which diagnosis is most likely?", "a": "Non-alcoholic fatty liver disease", "y": [31], "an": "dx", "sub": "MASLD นิยามชื่อใหม่", "t": 225}]}], "th": [228, 227, 224, 225]}, {"lec": "27/10", "title": "Approach to abdominal pain", "n": 20, "angle": {"mech": 5, "ix": 6, "dx": 4, "fact": 3, "mx": 2}, "pattern": "ข้อสอบเน้นเลือก investigation (colonoscopy, lipase) และวินิจฉัยจากลักษณะปวดคลาสสิก colon cancer/alarm features ถามซ้ำแทบทุกรุ่น pancreatitis ถามทุกมุม (อาการ แล็บ สาเหตุ กลไก). มีโจทย์ mechanism บ้าง (visceral→parietal, translocation, trypsin).", "tip": "ท่อง alarm features → colonoscopy และ acute pancreatitis 2 ใน 3 (lipase > 3×ULN, สาเหตุนิ่ว/เหล้า) ให้ขึ้นใจ แล้วทวนอาการคลาสสิก (cholangitis, diverticulitis, appendicitis) กับ GERD lifestyle.", "secs": [{"t": "ปวดท้องสองแบบ: visceral กับ parietal", "n": 1, "y": [34], "w": "ไส้ติ่ง: ปวดรอบสะดือ (visceral) ย้ายไป RLQ เมื่ออักเสบถึง parietal peritoneum", "c": null, "s": ["visceral → parietal (ไส้ติ่ง)"], "q": [{"q": "In acute appendicitis the pain characteristically starts as vague periumbilical discomfort and then migrates to become sharp and well localised in the right lower quadrant. What best explains the migration of the pain to the right lower quadrant?", "a": "Inflammation extends through the appendiceal serosa to the adjacent parietal peritoneum, which has somatic innervation and localises the pain", "y": [34], "an": "mech", "sub": "visceral → parietal (ไส้ติ่ง)", "t": 250}]}, {"t": "ซักประวัติและตรวจร่างกายผู้ป่วยปวดท้อง", "n": 0, "y": [], "w": null, "c": "เทคนิคซักประวัติตรวจร่างกาย (Murphy, rebound) ไม่ถูกถามแยก", "s": [], "q": []}, {"t": "ปวดตามอวัยวะ — กลางตัวหรือเอียงข้าง", "n": 0, "y": [], "w": null, "c": "ปวดตามอวัยวะกลางตัว/เอียงข้าง เป็นพื้นฐาน ไม่ออก", "s": [], "q": []}, {"t": "ปวดจากลำไส้ใหญ่ และ IBS (Rome IV)", "n": 7, "y": [29, 30, 31, 34, 35], "w": "เปลี่ยนนิสัยการถ่าย/ถ่ายเป็นมูกเลือด/น้ำหนักลด/คลำก้อนได้ในผู้สูงอายุ → colonoscopy ± biopsy (ถามซ้ำ 7 ข้อ รุ่น 29–35); IBS ต้องไม่มี alarm", "c": null, "s": ["Alarm features → colonoscopy", "Alarm features: colon cancer", "เปลี่ยนนิสัยการถ่าย → colonoscopy", "IBS + alarm → colonoscopy"], "q": [{"q": "A 60-year-old woman presents with 2 months of dull pain spread across the lower abdomen and frequent bloating without nausea or vomiting. Her bowel habits have changed recently, alternating between hard pellet-like stools and loose stools, with no blood. She has lost 22 kg in 2 months. She has osteoarthritis treated with ibuprofen and takes omeprazole for heartburn. Vital signs are normal; there is osteoarthritis of the right knee and both hands. Abdominal examination reveals normal bowel sounds and no tenderness or masses, rectal examination is normal and stool is negative for occult blood; laboratory results are pending. What is the most appropriate next step?", "a": "Colonoscopy", "y": [31], "an": "ix", "sub": "Alarm features → colonoscopy", "t": 240}, {"q": "A 75-year-old man presents with diarrhoea alternating with constipation for 2 months. He has had bloody mucus in the stool on and off for 2 weeks and no fever. His physical examination is normal. Proctoscopy shows normal mucosa and no blood. What is the most likely diagnosis of this patient?", "a": "Colon cancer", "y": [31], "an": "dx", "sub": "Alarm features: colon cancer", "t": 240}, {"q": "A patient reports alternating constipation and diarrhoea for the past 6 months. Which investigation is most appropriate?", "a": "Colonoscopy", "y": [34], "an": "ix", "sub": "เปลี่ยนนิสัยการถ่าย → colonoscopy", "t": 240}, {"q": "A patient whose chronic abdominal pain and altered bowel habit fit irritable bowel syndrome is found to have alarm features. Which investigation is indicated?", "a": "Colonoscopy", "y": [31], "an": "ix", "sub": "IBS + alarm → colonoscopy", "t": 240}, {"q": "A 50-year-old woman has had a change in bowel habit for several months. On digital rectal examination a hard, irregular mass is felt. What is the most appropriate next investigation?", "a": "Colonoscopy with biopsy of the lesion", "y": [30, 31], "an": "ix", "sub": "Alarm features: คลำได้ก้อน → colonoscopy", "t": 240}, {"q": "A 60-year-old man has intermittent painless bright-red rectal bleeding for 2 months with a change in bowel habit and mild weight loss. What is the most appropriate investigation?", "a": "Colonoscopy with biopsy of any lesion", "y": [34, 35], "an": "ix", "sub": "Alarm: เลือดสด + น้ำหนักลด", "t": 240}, {"q": "Which clinical feature supports irritable bowel syndrome rather than organic bowel disease?", "a": "Abdominal pain related to defecation with altered stool form, without nocturnal diarrhoea, bleeding or weight loss", "y": [29, 30], "an": "fact", "sub": "เกณฑ์ IBS Rome IV vs alarm", "t": 242}]}, {"t": "Dyspepsia — ปวดจากกระเพาะและลำไส้เล็กส่วนต้น", "n": 0, "y": [], "w": null, "c": "Dyspepsia/alarm 4 ข้อ ยังไม่เคยถามตรง แต่ alarm features ใช้ตอบข้อ colon/esophageal cancer", "s": [], "q": []}, {"t": "ขั้นตอนดูแล uninvestigated dyspepsia และ H. pylori", "n": 3, "y": [30, 32], "w": "GERD: อาการ heartburn + ยกหัวเตียง ไม่นอนหลังกิน 3 ชม.; H. pylori → MALT lymphoma", "c": null, "s": ["GERD (เกี่ยวข้อง): heartburn", "GERD: ปรับพฤติกรรม", "กลไก H. pylori → MALT lymphoma"], "q": [{"q": "A 30-year-old man with asthma has bloating, epigastric pain and chronic cough. Which symptom is the typical symptom of gastro-oesophageal reflux disease?", "a": "Heartburn (retrosternal burning) with acid regurgitation", "y": [30], "an": "fact", "sub": "GERD (เกี่ยวข้อง): heartburn", "t": 220}, {"q": "A 45-year-old man with GERD (weight 50 kg, height 160 cm) eats dinner at 19:00 and goes to bed at 22:00 with nocturnal heartburn. Which lifestyle advice is most appropriate?", "a": "Elevate the head of the bed and avoid lying down within 3 hours after meals", "y": [30], "an": "mx", "sub": "GERD: ปรับพฤติกรรม", "t": 220}, {"q": "Which factor is most strongly associated with the development of gastric MALT (mucosa-associated lymphoid tissue) lymphoma?", "a": "Chronic Helicobacter pylori infection", "y": [32], "an": "mech", "sub": "กลไก H. pylori → MALT lymphoma", "t": 222}]}, {"t": "นิ่วในถุงน้ำดีและภาวะแทรกซ้อน", "n": 1, "y": [30], "w": "ไข้หนาวสั่น เหลือง ปวด RUQ + CBD โต → acute cholangitis", "c": null, "s": ["ท่อน้ำดีอักเสบ Charcot triad"], "q": [{"q": "A 70-year-old woman has fever with chills, jaundice and right upper quadrant pain. Murphy sign is negative. Ultrasound shows a dilated common bile duct. What is the most likely diagnosis?", "a": "Acute cholangitis from common bile duct obstruction", "y": [30], "an": "dx", "sub": "ท่อน้ำดีอักเสบ Charcot triad", "t": 238}]}, {"t": "ตับอ่อนอักเสบเฉียบพลันและเรื้อรัง", "n": 5, "y": [30, 31, 32, 33, 34], "w": "ปวดลิ้นปี่ร้าวทะลุหลัง นั่งโน้มตัวดีขึ้น → ส่ง lipase; สาเหตุบ่อยสุด = นิ่ว; กลไก trypsinogen activate ในเซลล์ (5 รุ่น)", "c": null, "s": ["ผลเลือดและอาการแสดง: ปวดทะลุหลัง", "วินิจฉัย 2 ใน 3: lipase", "สาเหตุ: นิ่วถุงน้ำดี", "วินิจฉัย 2 ใน 3 (Revised Atlanta)"], "q": [{"q": "A patient is suspected of having acute pancreatitis. Which feature of the pain history would best support this diagnosis?", "a": "Epigastric pain boring through to the back that is relieved by sitting up and leaning forward", "y": [31], "an": "dx", "sub": "ผลเลือดและอาการแสดง: ปวดทะลุหลัง", "t": 239}, {"q": "A patient presents with epigastric pain radiating to the back. Which additional laboratory test should be ordered to confirm the most likely diagnosis?", "a": "Serum lipase", "y": [34], "an": "ix", "sub": "วินิจฉัย 2 ใน 3: lipase", "t": 239}, {"q": "What is the most common cause of acute pancreatitis in adults?", "a": "Gallstones", "y": [30], "an": "fact", "sub": "สาเหตุ: นิ่วถุงน้ำดี", "t": 239}, {"q": "A 45-year-old man who drinks heavily has acute, severe, constant epigastric pain radiating straight through to the back, with nausea and vomiting. Serum lipase is more than three times the upper limit of normal. What is the most likely diagnosis?", "a": "Acute pancreatitis", "y": [32, 33], "an": "dx", "sub": "วินิจฉัย 2 ใน 3 (Revised Atlanta)", "t": 239}, {"q": "What is the key initiating mechanism of acute pancreatitis?", "a": "Premature intracellular activation of pancreatic proteolytic enzymes (trypsinogen to trypsin) causing autodigestion", "y": [32], "an": "mech", "sub": "กลไก: trypsinogen activation", "t": 239}]}, {"t": "อาการคลาสสิกและปวดท้องรุนแรง", "n": 1, "y": [31], "w": null, "c": null, "s": ["อาการคลาสสิก: diverticulitis"], "q": [{"q": "A 70-year-old man has had left lower quadrant abdominal pain and tenesmus for 5 days, with the pain worsening over the 2 days before admission. He has nausea but no vomiting and occasional haematochezia. He has a history of chronic constipation requiring milk of magnesia and no other underlying disease. Examination: temperature 38.2°C, BP 140/90 mmHg and HR 90 bpm. Bowel sounds are hypoactive but present and there is significant tenderness in the left lower quadrant with guarding but no rebound tenderness. Hb is 12 g/dL and the leukocyte count is 12,400/µL. Which of the following is the most appropriate management?", "a": "Empirical antibiotic therapy", "y": [31], "an": "mx", "sub": "อาการคลาสสิก: diverticulitis", "t": 243}]}, {"t": "ท้องอืดจากลม: ลำไส้อุดตันและ toxic megacolon", "n": 0, "y": [], "w": null, "c": "SBO/LBO, toxic megacolon (> 6 ซม.) ยังไม่เคยออก", "s": [], "q": []}, {"t": "ลำไส้ขาดเลือดเฉียบพลันและเยื่อบุช่องท้องอักเสบ", "n": 2, "y": [32, 33], "w": "SBP เกิดจาก bacterial translocation ข้ามผนังลำไส้ (ถาม 2 รุ่น 32–33)", "c": null, "s": ["Peritonitis: SBP bacterial translocation"], "q": [{"q": "A cirrhotic patient with ascites has a diagnostic paracentesis; ascitic fluid culture grows a Gram-negative bacillus. Which mechanism best explains how spontaneous bacterial peritonitis (SBP) develops?", "a": "Increased intestinal permeability allowing bacterial translocation from the gut lumen into ascitic fluid", "y": [33], "an": "mech", "sub": "Peritonitis: SBP bacterial translocation", "t": 229}, {"q": "A patient with ascites undergoes diagnostic paracentesis and the ascitic fluid culture grows gram-negative bacilli (spontaneous bacterial peritonitis). Which mechanism best explains how the organisms reached the ascitic fluid?", "a": "Translocation of enteric bacteria across the gut wall into mesenteric lymphatics and the circulation", "y": [32], "an": "mech", "sub": "Peritonitis: SBP bacterial translocation", "t": 229}]}], "th": [250, 240, 242, 220, 222, 238, 239, 243, 229]}, {"lec": "Diarrhea", "title": "Diarrhea — acute และ chronic", "n": 18, "angle": {"fact": 2, "mx": 8, "dx": 4, "mech": 3, "ix": 1}, "pattern": "ข้อสอบเป็น acute diarrhea เกือบทั้งหมด: เดาเชื้อจากอาหาร/อาการ, กลไกตามความลึกที่รุกล้ำ และ management (ORS, antiemetic, ยาปฏิชีวนะเฉพาะโรค) ถามซ้ำแทบทุกรุ่น. chronic diarrhea (osmotic gap, malabsorption) แทบไม่ถูกถาม.", "tip": "จำตารางเชื้อ–อาหาร–onset และข้อบ่งชี้ยาปฏิชีวนะ (shigella, cholera, C. diff oral vanco, amoeba metronidazole) กับการประเมินขาดน้ำ/ORS ก่อน แล้วค่อยอ่าน osmotic gap เผื่อข้อใหม่.", "secs": [{"t": "ท้องเสียจริงหรือไม่ — นิยาม และโรคที่เลียนแบบ", "n": 1, "y": [30], "w": null, "c": null, "s": ["นิยาม ≥ 3 ครั้ง/วัน"], "q": [{"q": "Which statement correctly defines acute diarrhoea?", "a": "Passage of three or more loose or watery stools in 24 hours (or more frequent than usual for the person), lasting less than 14 days", "y": [30], "an": "fact", "sub": "นิยาม ≥ 3 ครั้ง/วัน", "t": 248}]}, {"t": "น้ำ 10 ลิตรต่อวัน — ลำไส้ดูดน้ำกลับที่ไหน", "n": 1, "y": [31], "w": "ตัด terminal ileum → ขาด B12 → ฉีด cobalamin", "c": null, "s": ["ผลของการตัด ileum: ขาด B12"], "q": [{"q": "A patient with colonic cancer complicated by small bowel obstruction has undergone resection of the terminal ileum. Which measure best prevents the vitamin deficiency expected from this operation?", "a": "Intramuscular cobalamin (vitamin B12) injection", "y": [31], "an": "mx", "sub": "ผลของการตัด ileum: ขาด B12", "t": 251}]}, {"t": "จำแนกท้องเสีย 4 แกน — เลือกให้ถูกก่อนสืบค้น", "n": 1, "y": [35], "w": "นิยาม chronic diarrhea > 4 สัปดาห์ (รุ่น 35)", "c": null, "s": ["Acute < 2 สัปดาห์ vs chronic > 4 สัปดาห์"], "q": [{"q": "Which patient meets the definition of chronic diarrhoea?", "a": "Loose stools three times a day for 5 weeks", "y": [35], "an": "fact", "sub": "Acute < 2 สัปดาห์ vs chronic > 4 สัปดาห์", "t": 248}]}, {"t": "Acute diarrhea — สาเหตุ และเบาะแสจากอาหาร สถานที่", "n": 3, "y": [30, 31, 34], "w": "เดาเชื้อจากอาหาร: ไก่ย่าง → Campylobacter, street food มูกเลือด → Shigella", "c": null, "s": ["เชื้อที่พบบ่อย: Shigella", "เบาะแสจากอาหาร: ไก่ → Campylobacter", "เชื้อที่พบบ่อย: Campylobacter"], "q": [{"q": "A 25-year-old man has had fever, cramping abdominal pain and frequent small-volume bloody mucoid stools for 1 day after eating street food. Which organism is most likely?", "a": "Shigella species", "y": [30], "an": "dx", "sub": "เชื้อที่พบบ่อย: Shigella", "t": 245}, {"q": "A 24-year-old man has fever, abdominal cramps and bloody diarrhoea 3 days after eating undercooked chicken at a barbecue. Stool shows many leucocytes and red cells. Which organism is the most likely cause?", "a": "Campylobacter jejuni", "y": [31], "an": "dx", "sub": "เบาะแสจากอาหาร: ไก่ → Campylobacter", "t": 245}, {"q": "A previously healthy 22-year-old man has 4 days of fever, cramping abdominal pain and diarrhoea with visible blood and mucus. He has had no recent illness, no hospitalisation and no antibiotic use. Which organism is the most likely cause?", "a": "Campylobacter jejuni", "y": [34], "an": "dx", "sub": "เชื้อที่พบบ่อย: Campylobacter", "t": 245}]}, {"t": "กลไกก่อโรคของเชื้อ — ยิ่งรุกล้ำลึก ยิ่งไข้และปวดบิด", "n": 3, "y": [30, 31, 32], "w": "preformed toxin อาเจียนเด่น onset < 6 ชม.; dysentery = invasive mucosa", "c": null, "s": ["preformed toxin onset < 4 ชม.", "preformed toxin อาเจียนเด่น", "invasive → dysentery"], "q": [{"q": "A patient develops diarrhoea 6 hours after eating raw meat. Which mechanism best explains this?", "a": "Ingestion of preformed bacterial enterotoxin in the food", "y": [30], "an": "mech", "sub": "preformed toxin onset < 4 ชม.", "t": 244}, {"q": "Several people develop acute gastrointestinal symptoms after sharing the same meal. Which feature of the history best indicates preformed-toxin food poisoning rather than invasive bacterial enteritis?", "a": "Vomiting is the predominant symptom and begins before the diarrhoea, within a few hours of the meal", "y": [32], "an": "mech", "sub": "preformed toxin อาเจียนเด่น", "t": 244}, {"q": "A patient presents with acute bloody diarrhoea (dysentery). Which mechanism best explains the pathogenesis?", "a": "Invasion of the colonic mucosa by bacteria, producing inflammatory (exudative) diarrhoea", "y": [31], "an": "mech", "sub": "invasive → dysentery", "t": 245}]}, {"t": "Approach to acute diarrhea — ใครต้องส่งตรวจ ใครต้องได้ยา", "n": 1, "y": [30], "w": null, "c": null, "s": ["ตรวจอุจจาระเมื่อไร: มูกเลือด"], "q": [{"q": "A 60-year-old woman with diabetes has had mucous bloody diarrhoea with fever (38.5 °C) and abdominal pain for 1 day. She has not taken antibiotics recently and is haemodynamically stable. What is the most appropriate initial investigation?", "a": "Stool examination (microscopy for leucocytes, red cells and trophozoites) with stool culture", "y": [30], "an": "ix", "sub": "ตรวจอุจจาระเมื่อไร: มูกเลือด", "t": 245}]}, {"t": "ORS และการแก้ภาวะขาดน้ำ — ทำไมต้องใส่น้ำตาล", "n": 2, "y": [32, 33, 34], "w": "ประเมินขาดน้ำด้วย postural BP/HR; ไม่ขาดน้ำ → low-osm ORS + กินอาหารต่อ", "c": null, "s": ["ประเมินภาวะขาดน้ำ", "สูตร ORS low-osmolarity + กินต่อ"], "q": [{"q": "A patient with acute diarrhoea is being assessed for the severity of volume depletion. Which bedside finding best indicates significant (moderate-to-severe) dehydration?", "a": "A postural (orthostatic) fall in blood pressure with a rise in pulse rate", "y": [32, 33], "an": "dx", "sub": "ประเมินภาวะขาดน้ำ", "t": 247}, {"q": "A previously healthy young adult has had acute watery diarrhoea for one day with two episodes of vomiting. He is afebrile, the stool has no blood or mucus, and he has no signs of dehydration. He asks for something to make him better as quickly as possible. What is the most appropriate management?", "a": "Low-osmolarity oral rehydration solution with continued normal feeding", "y": [34], "an": "mx", "sub": "สูตร ORS low-osmolarity + กินต่อ", "t": 247}]}, {"t": "ยาปฏิชีวนะเมื่อไร — แนวทางไทย 2546 เทียบปัจจุบัน และ traveler's diarrhea", "n": 6, "y": [30, 31, 32, 33, 34, 35], "w": "แนวทางยาปฏิชีวนะ: C. difficile → oral vancomycin, cholera → ยาครั้งเดียว (doxy/azithro), amoeba → metronidazole + luminal, อาเจียนเด่น → ORS + antiemetic (ทุกรุ่น 30–35)", "c": null, "s": ["แนวทางไทย: อาเจียนเด่น รักษาตามอาการ + ORS", "E. histolytica: metronidazole", "แนวทางไทย 2546: ORS + quinolone", "cholera: แก้ขาดน้ำ + ยาครั้งเดียว"], "q": [{"q": "A 50-year-old man has mucous bloody diarrhoea, fever and lower abdominal pain for 1 week. Stool examination shows Entamoeba histolytica trophozoites containing ingested red cells. What is the most appropriate management?", "a": "Metronidazole followed by a luminal agent (e.g., paromomycin or diloxanide furoate)", "y": [], "an": "mx", "sub": "E. histolytica: metronidazole", "t": 246}, {"q": "A patient with acute diarrhoea has vomiting and dry lips (clinically moderate dehydration). Which treatment should be given?", "a": "ORS plus ciprofloxacin", "y": [31], "an": "mx", "sub": "แนวทางไทย 2546: ORS + quinolone", "t": 247}, {"q": "A patient presents with acute watery diarrhoea and vomiting. What is the most appropriate management?", "a": "Oral ORS plus an antiemetic", "y": [30], "an": "mx", "sub": "แนวทางไทย: อาเจียนเด่น รักษาตามอาการ + ORS", "t": 247}, {"q": "An 85-year-old woman has had acute watery diarrhoea and repeated vomiting for 1 day. She has no blood in the stool and only mild fever. She has moderate dehydration and is alert. What is the most appropriate treatment?", "a": "Oral rehydration solution together with an antiemetic", "y": [32, 33], "an": "mx", "sub": "แนวทางไทย: อาเจียนเด่น รักษาตามอาการ + ORS", "t": 247}, {"q": "A 30-year-old man has had profuse 'rice-water' stools for 10 hours with vomiting. He is thirsty with reduced skin turgor and sunken eyes but remains alert with stable blood pressure. Cholera is suspected. What is the most appropriate management?", "a": "Rehydration according to the degree of dehydration plus a single-dose antibiotic such as doxycycline or azithromycin", "y": [35], "an": "mx", "sub": "cholera: แก้ขาดน้ำ + ยาครั้งเดียว", "t": 247}, {"q": "A patient who has been hospitalized for a prolonged period develops bloody, mucoid stools, and the findings indicate pseudomembranous colitis. What is the most appropriate treatment?", "a": "Oral vancomycin", "y": [34], "an": "mx", "sub": "C. difficile: oral vancomycin", "t": 249}]}, {"t": "Chronic diarrhea — ซักประวัติ ตรวจร่างกาย และแล็บ", "n": 0, "y": [], "w": null, "c": "approach chronic diarrhea (ถ่ายกลางคืน, flushing) ยังไม่ถาม", "s": [], "q": []}, {"t": "ถ่ายเป็นน้ำเรื้อรัง — osmotic vs secretory และ stool osmotic gap", "n": 0, "y": [], "w": null, "c": "stool osmotic gap (290 − 2(Na+K), < 50 secretory, > 100 osmotic) ยังไม่ออกเลย — คำนวณได้ น่าออก", "s": [], "q": []}, {"t": "ถ่ายเป็นมัน — steatorrhea และ malabsorption", "n": 0, "y": [], "w": null, "c": "steatorrhea, fat > 7 g/วัน, D-xylose ยังไม่ออก", "s": [], "q": []}, {"t": "ถ่ายมูกเลือดเรื้อรัง การติดเชื้อเรื้อรัง และกลุ่มผู้ป่วยพิเศษ", "n": 0, "y": [], "w": null, "c": "IBD/microscopic colitis/ท้องเสียในผู้ป่วยภูมิต่ำ ไม่เคยออก", "s": [], "q": []}, {"t": "IBS — functional diarrhea, Rome IV และแนวทางไทย 2022", "n": 0, "y": [], "w": null, "c": "IBS Rome IV ถูกถามผ่านคาบปวดท้องแทน — อ่านคู่", "s": [], "q": []}, {"t": "ยาที่ทำให้ท้องเสีย สาเหตุที่หาไม่เจอ และยารักษาตามอาการ", "n": 0, "y": [], "w": null, "c": "ยาที่ทำให้ท้องเสีย (metformin, colchicine) ยังไม่ถาม", "s": [], "q": []}], "th": [248, 251, 245, 244, 247, 246, 249]}, {"lec": "29/10", "title": "Liver function tests", "n": 11, "angle": {"fact": 2, "interp": 5, "mx": 2, "ix": 2}, "pattern": "ข้อสอบเป็นการอ่าน LFT/serology เป็นหลัก (แยกชนิดดีซ่าน, AST/ALT ratio, HBV/HAV markers) และ next step (US, viral serology, NAC) ข้อละเรื่อง รุ่น 30–35. เคสใหม่ในสไลด์ 2570 (shock liver, Wilson, AIH) ยังไม่เคยออก.", "tip": "ฝึกจัด pattern LFT 5 แบบ + อ่าน HBV ห้าแถวให้คล่อง และจำ NAC สำหรับ paracetamol; ตัวเลขใหม่ (ALT/LDH < 1.5, Wilson 2.2/4) ควรจำไว้เพราะอาจจะออกปีนี้.", "secs": [{"t": "LFT มีอะไรบ้าง และ 5 รูปแบบความผิดปกติ", "n": 1, "y": [32], "w": null, "c": null, "s": ["5 รูปแบบ: hepatocellular jaundice"], "q": [{"q": "A patient presents with jaundice and is HBsAg positive. Which type of jaundice does this represent?", "a": "Hepatocellular jaundice", "y": [32], "an": "fact", "sub": "5 รูปแบบ: hepatocellular jaundice", "t": 223}]}, {"t": "Aminotransferase — ระดับและอัตราส่วน AST/ALT", "n": 1, "y": [31], "w": "AST > ALT แต่ < 200 + เหลือง → alcoholic hepatitis", "c": null, "s": ["อัตราส่วน AST/ALT > 2 = เหล้า"], "q": [{"q": "A patient presents with jaundice and scleral icterus. AST and ALT are only mildly elevated (both below about 200 U/L), with AST higher than ALT. What is the most likely diagnosis?", "a": "Alcoholic hepatitis", "y": [31], "an": "interp", "sub": "อัตราส่วน AST/ALT > 2 = เหล้า", "t": 224}]}, {"t": "Transaminase สูงมาก: ตับอักเสบเฉียบพลัน ตับขาดเลือด และ paracetamol", "n": 2, "y": [31, 32], "w": "paracetamol เกินขนาด (10–40 เม็ด) → ให้ NAC ทันที", "c": null, "s": ["Paracetamol: NAC", "Paracetamol: IV NAC"], "q": [{"q": "A patient took ten 500 mg paracetamol tablets at 09:00 in a suicide attempt and arrived at hospital at 17:00. The serum acetaminophen level is 100 microgram/mL. What is the most appropriate next step?", "a": "Start N-acetylcysteine immediately", "y": [31], "an": "mx", "sub": "Paracetamol: NAC", "t": 237}, {"q": "A 19-year-old woman ingested 40 tablets of paracetamol 500 mg (20 g) 4 hours ago. She weighs 50 kg. What is the specific treatment?", "a": "Intravenous N-acetylcysteine", "y": [32], "an": "mx", "sub": "Paracetamol: IV NAC", "t": 237}]}, {"t": "สไลด์ 2570: transaminase หลายพัน — shock liver vs paracetamol vs rhabdomyolysis", "n": 0, "y": [], "w": null, "c": "shock liver vs paracetamol vs rhabdo (ALT/LDH < 1.5)
