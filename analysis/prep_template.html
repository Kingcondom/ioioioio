L (significant when >40). What is the most likely cause of the effusion?", "a": "Malignant pleural effusion from adenocarcinoma of the lung", "y": [30], "an": "interp", "sub": "exudate ADA ต่ำ → malignant", "t": 105}]}, {"t": "Parapneumonic effusion · empyema · malignant effusion — เมื่อไรต้องใส่สาย", "n": 4, "y": [29, 30, 32, 33, 34, 35], "w": "complicated parapneumonic (pH <7.2, glucose ต่ำ) → ใส่ ICD + ยา; malignant effusion จากมะเร็งปอด (exudate mononuclear เด่น) ถามซ้ำ 30, 32, 35", "c": null, "s": ["malignant effusion จากมะเร็งปอด", "complicated parapneumonic → ใส่สาย", "parapneumonic effusion neutrophil เด่น"], "q": [{"q": "A patient with fever and pleuritic chest pain has a pleural effusion. Analysis shows an exudate by Light's criteria with pleural fluid pH 7.10, glucose 35 mg/dL and LDH 1000 U/L. Gram stain shows no organisms. What is the diagnosis and the most appropriate management?", "a": "Complicated parapneumonic effusion; insert an intercostal chest drain in addition to antibiotics", "y": [32, 33, 34], "an": "mx", "sub": "complicated parapneumonic → ใส่สาย", "t": 105}, {"q": "A 65-year-old smoker has 2 months of progressive breathlessness. Chest radiograph shows a mass at the right upper lobe with a massive pleural effusion. Thoracentesis shows an exudate with WBC 10,000 cells/microlitre, 90 percent mononuclear cells, and markedly elevated LDH. What is the most likely cause of the effusion?", "a": "Malignant pleural effusion from lung cancer", "y": [30, 32, 35], "an": "dx", "sub": "malignant effusion จากมะเร็งปอด", "t": 105}, {"q": "A patient has had progressive breathlessness for 2 months. Chest X-ray shows a mass in the right upper lobe with a massive pleural effusion. Thoracentesis yields an exudate with WBC 10,000/mm3, 90% mononuclear cells, and a markedly elevated LDH. What is the most likely cause of the effusion?", "a": "Malignant pleural effusion from bronchogenic carcinoma", "y": [35], "an": "dx", "sub": "malignant effusion จากมะเร็งปอด", "t": 105}, {"q": "A previously healthy 16-year-old has low-grade fever and productive cough with right-sided chest pain. Chest radiograph shows right upper lobe infiltration with a right pleural effusion. Pleural fluid is yellow, WBC 900/µL with 80% neutrophils. What best explains the effusion?", "a": "Parapneumonic effusion", "y": [29], "an": "interp", "sub": "parapneumonic effusion neutrophil เด่น", "t": 105}]}], "th": [109, 108, 106, 105]}, {"lec": "21", "title": "Image in chest — อ่าน CXR อย่างเป็นระบบ และโรคปอดจากการทำงาน", "n": 14, "angle": {"interp": 2, "dx": 9, "mech": 1, "fact": 1, "ix": 1}, "pattern": "ข้อสอบไม่ได้ให้อ่านฟิล์มเชิงเทคนิค แต่ให้คำบรรยายภาพ + อาชีพ/ประวัติ แล้วถามการวินิจฉัย (dx) โดยเฉพาะโรคปอดจากการทำงาน (silica/asbestos/occupational asthma) ซึ่งซ้ำหลายรุ่น 30–35. ส่วนอื่นที่ออกคือ silhouette sign บอกกลีบ และ SVC syndrome/ก้อน mediastinum.", "tip": "จำคู่ อาชีพ–ภาพ–โรค (ทราย/หิน → silicosis eggshell; กระเบื้องหลังคา → asbestosis plaque; mesothelioma) และกฎ silhouette (RML–ขอบหัวใจขวา, lingula–ขอบหัวใจซ้าย, RLL–diaphragm) กับ 4T ของ anterior mediastinum.", "secs": [{"t": "ก่อนอ่าน: ตรวจตัวผู้ป่วย ท่าถ่าย และ view พิเศษ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Technical adequacy — RIPE และสิ่งที่ฟิล์มไม่ดีหลอกเรา", "n": 0, "y": [], "w": null, "c": "RIPE/technical adequacy ไม่ถูกถาม — ความสำคัญต่ำสำหรับ MCQ", "s": [], "q": []}, {"t": "Density และ attenuation — ภาษาของขาวกับดำ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Normal anatomy · อ่านเป็นระบบ · เงาผนังอกที่หลอกตา", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Air-space disease — consolidation และ ground-glass opacity", "n": 0, "y": [], "w": null, "c": "consolidation vs GGO ไม่ถูกถามตรง (PCP perihilar GGO ถูกถามแต่เป็นเรื่องเชื้อ)", "s": [], "q": []}, {"t": "Silhouette sign — บอกกลีบจากขอบที่หาย", "n": 2, "y": [29, 32], "w": "silhouette sign: RLL consolidation ขอบหัวใจขวายังเห็น; ขอบ ascending aorta หาย = RUL anterior segment", "c": null, "s": ["RLL consolidation ขอบหัวใจขวายังเห็น", "ขอบ ascending aorta หาย = RUL anterior"], "q": [{"q": "A chest radiograph of a febrile coughing patient shows homogeneous opacification of the right lower zone containing air bronchograms, with the right heart border remaining clearly visible and no blunting of the costophrenic angle. What is the most likely diagnosis?", "a": "Lobar pneumonia of the right lower lobe", "y": [29, 32], "an": "interp", "sub": "RLL consolidation ขอบหัวใจขวายังเห็น", "t": 113}, {"q": "A 70-year-old man with fever, cough and purulent sputum has a chest radiograph showing patchy consolidation with air bronchograms in the right upper zone and loss of the right border of the ascending aorta, with a normal right heart border. Where is the pneumonia?", "a": "Right upper lobe (anterior segment)", "y": [], "an": "interp", "sub": "ขอบ ascending aorta หาย = RUL anterior", "t": 113}]}, {"t": "Interstitial patterns — reticular, nodular, miliary, reticulonodular", "n": 0, "y": [], "w": null, "c": "interstitial patterns (reticular, miliary) ยังไม่ถูกถามแยก — อาจโผล่ใน spot film", "s": [], "q": []}, {"t": "Atelectasis — ชนิด สัญญาณ volume loss และ white-out", "n": 0, "y": [], "w": null, "c": "atelectasis และ volume loss ไม่ถูกถาม แต่เป็นทักษะอ่านฟิล์มพื้นฐาน OSCE", "s": [], "q": []}, {"t": "Lobar collapse ทีละกลีบ — RUL RML RLL LUL LLL", "n": 0, "y": [], "w": null, "c": "lobar collapse ทีละกลีบ ยังไม่ถูกถาม — ออกเป็นภาพได้ง่าย", "s": [], "q": []}, {"t": "Nodule และ mass — ในหรือนอกปอด · Fleischner · มะเร็งปอดบนฟิล์ม", "n": 3, "y": [31, 32], "w": "SVC syndrome จากมะเร็งปอด (NSCLC) ในผู้สูบบุหรี่ — หน้า/แขนบวม เส้นเลือดคอโป่งไม่เต้น", "c": null, "s": ["SVC syndrome จาก bronchogenic CA", "SVC obstruction จาก NSCLC", "SVC syndrome จาก NSCLC"], "q": [{"q": "A 62-year-old man who has smoked 40 pack-years presents with facial and upper limb swelling, distended neck and chest wall veins that do not pulsate, and a right upper lobe mass on chest radiograph. What is the most likely diagnosis?", "a": "Superior vena cava syndrome from bronchogenic carcinoma", "y": [31, 32], "an": "dx", "sub": "SVC syndrome จาก bronchogenic CA", "t": 114}, {"q": "A patient who smokes presents with facial swelling and engorged neck veins. What is the most likely diagnosis?", "a": "SVC obstruction from non-small cell lung carcinoma", "y": [31], "an": "dx", "sub": "SVC obstruction จาก NSCLC", "t": 114}, {"q": "A patient who smokes presents with features of superior vena cava (SVC) syndrome. What is the most likely underlying malignancy?", "a": "Non-small cell lung carcinoma", "y": [31], "an": "dx", "sub": "SVC syndrome จาก NSCLC", "t": 114}]}, {"t": "Cavity, cyst, bulla, pneumatocele และ lung abscess", "n": 1, "y": [35], "w": "lung abscess เกิดจากสำลัก anaerobe ในปาก → necrotising pneumonia", "c": null, "s": ["lung abscess จากสำลัก anaerobe"], "q": [{"q": "What is the most common mechanism of a primary lung abscess?", "a": "Aspiration of oropharyngeal anaerobic flora leading to necrotising pneumonia with liquefactive necrosis and cavitation", "y": [35], "an": "mech", "sub": "lung abscess จากสำลัก anaerobe", "t": 121}]}, {"t": "ปอดดำเกิน — emphysema, bulla, Westermark และ bronchiectasis", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Mediastinum และ hila — แบ่งช่อง บอกตำแหน่งก้อน", "n": 2, "y": [30], "w": "anterior mediastinal mass = 4T (thymoma, teratoma, thyroid, lymphoma); thymoma → SVC syndrome", "c": null, "s": ["anterior mediastinal mass (thymoma) → SVC", "anterior mediastinum 4T"], "q": [{"q": "A patient with a thymoma (anterior mediastinal mass) develops swelling of the face, neck and both arms, while the legs are not swollen. What is the most likely diagnosis?", "a": "Superior vena cava syndrome", "y": [30], "an": "dx", "sub": "anterior mediastinal mass (thymoma) → SVC", "t": 114}, {"q": "A chest radiograph shows a well-defined mass in the anterior mediastinum with normal lung parenchyma and no cardiomegaly. Which group of conditions forms the main differential diagnosis?", "a": "Thymoma, teratoma (germ cell tumour), thyroid (retrosternal goitre) and 'terrible' lymphoma", "y": [30], "an": "fact", "sub": "anterior mediastinum 4T", "t": 115}]}, {"t": "Vascular — PE, pulmonary hypertension และ heart failure", "n": 1, "y": [31], "w": null, "c": null, "s": ["PE: CXR ปกติ + DVT ในตั้งครรภ์"], "q": [{"q": "A 24-year-old woman at 3 months of gestation has had swelling of the right leg for 1 week, with no fever or cough and no previous leg swelling. Two hours before arrival she developed sudden right-sided chest pain and dyspnoea. In the emergency room she is afebrile, PR 120/min, RR 40/min, BP 110/70 mmHg, and the chest radiograph is normal. What is the most likely diagnosis?", "a": "Pulmonary embolism", "y": [31], "an": "dx", "sub": "PE: CXR ปกติ + DVT ในตั้งครรภ์", "t": 110}]}, {"t": "Pleural effusion — meniscus, subpulmonic, loculated", "n": 0, "y": [], "w": null, "c": "ภาพ pleural effusion (meniscus, subpulmonic) ไม่ถูกถามบนฟิล์ม", "s": [], "q": []}, {"t": "Pneumothorax — visceral pleural line, tension และขนาด", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Pneumoconiosis — silica, ถ่านหิน และใยหิน (ไม่อยู่ในสไลด์)", "n": 3, "y": [30, 31, 33, 34, 35], "w": "pneumoconiosis: silicosis (eggshell hilar calcification, upper-zone nodules), asbestosis (lower-zone reticular + pleural plaque), mesothelioma จาก asbestos; ถาม 30–35", "c": null, "s": ["silicosis eggshell calcification", "asbestosis + pleural plaque", "mesothelioma จาก asbestos"], "q": [{"q": "A 55-year-old man who has worked in a stone-grinding and sandblasting factory for 25 years has progressive exertional dyspnoea. Chest radiograph shows multiple small upper-zone nodules with bilateral hilar lymph nodes that have peripheral rim calcification. What is the most likely diagnosis?", "a": "Silicosis", "y": [30, 31, 34], "an": "dx", "sub": "silicosis eggshell calcification", "t": 112}, {"q": "A 60-year-old man worked for 30 years in a roofing-sheet factory. He has progressive dyspnoea and a dry cough. Chest radiograph shows irregular opacities with a fine reticular pattern in the lower zones, together with calcified pleural plaques on the diaphragmatic pleura. What is the most likely diagnosis?", "a": "Asbestosis", "y": [31, 34], "an": "dx", "sub": "asbestosis + pleural plaque", "t": 112}, {"q": "A 68-year-old man with a remote history of asbestos exposure presents with chest pain and a pleural effusion. Thoracentesis shows an exudate; cytology reports atypical mesothelial cells and is negative for malignant epithelial cells. What is the most likely diagnosis, and what is the principal risk factor?", "a": "Malignant pleural mesothelioma; asbestos exposure", "y": [33, 35], "an": "dx", "sub": "mesothelioma จาก asbestos", "t": 112}]}, {"t": "Hypersensitivity pneumonitis และ occupational asthma (ไม่อยู่ในสไลด์)", "n": 2, "y": [31, 35], "w": "occupational asthma (คนทำขนมปัง, latex) ดีขึ้นวันหยุด → หยุดสัมผัส, ยืนยันด้วย serial PEF", "c": null, "s": ["occupational asthma: หยุดสัมผัส", "serial PEF ที่งาน/บ้าน"], "q": [{"q": "A 35-year-old bakery worker has had wheezing and cough for 6 months. Symptoms begin a few hours after arriving at work, worsen through the working week and improve completely during weekends and holidays. Lung examination at the clinic is normal. What is the most likely diagnosis and the most important management?", "a": "Occupational asthma; remove the patient from exposure to the causative agent", "y": [31, 35], "an": "dx", "sub": "occupational asthma: หยุดสัมผัส", "t": 112}, {"q": "A 30-year-old nurse with a known latex allergy has episodes of cough and expiratory wheezing that occur while she is working in the hospital and improve when she is at home on days off. Examination reveals expiratory wheeze in both lungs. Which investigation best confirms work-related asthma?", "a": "Serial peak expiratory flow measurements at work and away from work", "y": [31], "an": "ix", "sub": "serial PEF ที่งาน/บ้าน", "t": 112}]}], "th": [113, 114, 121, 115, 112]}, {"lec": "Thoracentesis", "title": "Thoracentesis และการแปลผลน้ำในช่องเยื่อหุ้มปอด", "n": 2, "angle": {"dx": 1, "mx": 1}, "pattern": "ถามน้อยเฉพาะภาวะแทรกซ้อนของหัตถการ (RPE หลังระบายมาก, pneumothorax หลังเจาะ) ในรุ่น 35 และข้อ SAQ. การแปลผลน้ำถูกถามเยอะแต่นับใน lecture 17.", "tip": "จำขีด 1–1.5 L, กลไก RPE และการแยกภาวะแทรกซ้อนหลังเจาะ; อ่านผลน้ำทบทวนคู่กับ Light's criteria ใน lecture 17.", "secs": [{"t": "Thoracentesis คืออะไร — ช่องเยื่อหุ้มปอดและชั้นที่เข็มผ่าน", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ข้อบ่งชี้ — diagnostic หรือ therapeutic และเมื่อไรไม่ต้องเจาะ", "n": 0, "y": [], "w": null, "c": "ข้อบ่งชี้ diagnostic vs therapeutic ไม่ถูกถาม", "s": [], "q": []}, {"t": "ข้อห้าม (relative) การเตรียม และการขอความยินยอม", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "อุปกรณ์และท่าผู้ป่วย — นั่งโน้มตัว ทำไมน้ำไปรวมด้านหลัง", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "อัลตราซาวด์เลือกจุดเจาะ — ดูอะไร และทำไมต้องเจาะทันที", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ขั้นตอนเจาะ — ยาชา แทงเหนือขอบบนซี่โครง และเหตุผลของ neurovascular bundle", "n": 0, "y": [], "w": null, "c": "แทงเหนือขอบบนซี่โครงเพื่อเลี่ยง neurovascular bundle ไม่ถูกถามใน MCQ แต่สำคัญใน OSCE", "s": [], "q": []}, {"t": "ระบายได้เท่าไร — ขีด 1–1.5 L และกลไก re-expansion pulmonary oedema", "n": 1, "y": [35], "w": "ระบาย 2 L ครั้งเดียว → re-expansion pulmonary oedema (ขีด 1–1.5 L)", "c": null, "s": ["re-expansion pulmonary oedema หลังระบาย 2 L"], "q": [{"q": "A large pleural effusion is drained and 2 litres of fluid are removed in a single session. Shortly afterwards the patient develops cough, chest tightness and worsening hypoxaemia, with new unilateral infiltrates on the side that was drained. What is the most likely complication?", "a": "Re-expansion pulmonary oedema", "y": [35], "an": "dx", "sub": "re-expansion pulmonary oedema หลังระบาย 2 L", "t": 107}]}, {"t": "ภาวะแทรกซ้อนและ after care — แยก pneumothorax · vasovagal · hemothorax · RPE", "n": 1, "y": [], "w": "hydropneumothorax หลังเจาะ, vital signs ปกติ → สังเกต + O2 + ฟิล์มซ้ำ", "c": null, "s": ["pneumothorax หลังเจาะปอด"], "q": [{"q": "Immediately after a diagnostic thoracentesis, a patient's chest radiograph shows a new air–fluid level in the pleural space (hydropneumothorax) without mediastinal shift. Vital signs are stable and she is not short of breath. What is the cause and appropriate management?", "a": "Iatrogenic pneumothorax from the procedure; observe with oxygen and repeat imaging, inserting an intercostal drain if vital signs change or dyspnoea worsens", "y": [], "an": "mx", "sub": "pneumothorax หลังเจาะปอด", "t": 106}]}, {"t": "เก็บสิ่งส่งตรวจ — หลอดไหนตรวจอะไร และทำไม pH ต้องใช้ syringe blood gas", "n": 0, "y": [], "w": null, "c": "หลอดส่งตรวจ และ pH ต้องใช้ syringe blood gas ยังไม่ถูกถาม", "s": [], "q": []}, {"t": "อ่านผลขั้น 1–3 — ดูด้วยตา · Light's criteria · cell count", "n": 0, "y": [], "w": null, "c": "อ่านผลขั้น 1–3 (Light's) ถูกถามมากแต่จัดไว้ที่ chest-rp-11 — เนื้อหาซ้ำ", "s": [], "q": []}, {"t": "อ่านผลขั้น 4–5 — pH glucose LDH และการตรวจพิเศษ (ADA · cytology · TG · Hct · amylase · culture)", "n": 0, "y": [], "w": null, "c": "pH/glucose/ADA/TG/amylase ถูกถามผ่าน chest-rp-11/12", "s": [], "q": []}, {"t": "Case example — ชาย 59 ปี น้ำสองข้างจากหัวใจล้มเหลว (ไล่อ่านทีละขั้น)", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}], "th": [107]}, {"lec": "37", "title": "COPD — โรคปอดอุดกั้นเรื้อรัง (GOLD 2026)", "n": 11, "angle": {"mech": 1, "dx": 2, "fact": 2, "interp": 1, "mx": 5}, "pattern": "COPD ถามแบบ mx เป็นหลัก (เลิกบุหรี่, pulmonary rehab, step-up LAMA→LABA+LAMA) และวินิจฉัยด้วย spirometry; หลายข้อถามซ้ำ 3–4 รุ่น (31–35) และคำถาม 'อะไรลดตาย/ชะลอโรค' วนมาตั้งแต่รุ่น 28.", "tip": "จำตอบตายตัว: เลิกบุหรี่ (ลดตาย + ชะลอ FEV1), LTOT ลดตายเมื่อ PaO2 ≤55, FEV1/FVC <0.7 post-BD, ยาตามกลุ่ม ABE และ step-up; ข้ามหัวข้อ 12–14.", "secs": [{"t": "COPD คืออะไร ใครเสี่ยง — นิยาม GOLD 2026 และปัจจัยเสี่ยงในบริบทไทย", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "พยาธิสรีรวิทยา — จากควันถึงลมค้าง ปอดพอง และออกซิเจนต่ำ", "n": 1, "y": [30], "w": "กลไก airflow limitation ใน COPD = เสีย elastic recoil ทางเดินหายใจเล็กยุบตอนหายใจออก", "c": null, "s": ["เสีย elastic recoil, small airway collapse"], "q": [{"q": "What is the main mechanism of airflow limitation in COPD, in contrast to asthma?", "a": "Collapse of small (distal) airways during expiration from loss of alveolar elastic recoil and parenchymal destruction, plus small-airway inflammation", "y": [30], "an": "mech", "sub": "เสีย elastic recoil, small airway collapse", "t": 120}]}, {"t": "อาการและการตรวจร่างกาย — ทำไมถึงมีอาการนี้", "n": 0, "y": [], "w": null, "c": "อาการและตรวจร่างกาย COPD ถามเพียงทางอ้อม", "s": [], "q": []}, {"t": "วินิจฉัยด้วย spirometry — อ่านค่า FEV1/FVC เกรด GOLD 1–4 และการตรวจอื่นที่ต้องรู้", "n": 1, "y": [31, 33, 35], "w": "post-BD FEV1/FVC < 0.7 = COPD (ถาม 31, 33, 35)", "c": null, "s": ["post-BD FEV1/FVC < 0.7"], "q": [{"q": "A 65-year-old man with 4 months of breathlessness and greyish morning sputum has an increased anteroposterior chest diameter and normal breath sounds. Post-bronchodilator spirometry shows FEV1/FVC 68 percent with FEV1 75 percent predicted. What is the most likely diagnosis?", "a": "COPD", "y": [31, 33, 35], "an": "dx", "sub": "post-BD FEV1/FVC < 0.7", "t": 118}]}, {"t": "ประเมินผู้ป่วยหลังวินิจฉัย — mMRC, CAT และกลุ่ม ABE แบบ GOLD 2026", "n": 1, "y": [31], "w": "ตัวทำนาย exacerbation ที่ดีที่สุด = ประวัติ exacerbation เดิม", "c": null, "s": ["ประวัติ exacerbation ทำนายครั้งต่อไป"], "q": [{"q": "In a patient with COPD, which factor is the strongest predictor of future acute exacerbations?", "a": "A history of previous exacerbations", "y": [31], "an": "fact", "sub": "ประวัติ exacerbation ทำนายครั้งต่อไป", "t": 118}]}, {"t": "แยกโรค — asthma, หัวใจล้ม, bronchiectasis, วัณโรคเก่า และอื่น ๆ", "n": 1, "y": [31], "w": null, "c": null, "s": ["asthma ร่วมกับ COPD (overlap)"], "q": [{"q": "A 58-year-old smoker with a long history of childhood asthma has chronic cough and dyspnoea. Spirometry shows a post-bronchodilator FEV1/FVC of 0.62, and FEV1 increases by 420 mL (22%) after salbutamol. Which conclusion is most appropriate?", "a": "Persistent airflow limitation with marked reversibility, consistent with asthma-COPD overlap", "y": [31], "an": "interp", "sub": "asthma ร่วมกับ COPD (overlap)", "t": 119}]}, {"t": "ยาที่ใช้ใน COPD — กลไกที่ receptor ผลข้างเคียง และการใช้ inhaler ให้ถูก", "n": 0, "y": [], "w": null, "c": "กลไกยาที่ receptor และผลข้างเคียง (LAMA ปากแห้ง, LABA ใจสั่น) ยังไม่ถูกถามตรง", "s": [], "q": []}, {"t": "ยาระยะคงที่ — เริ่มยาตามกลุ่ม ABE, เมื่อไรใช้ ICS และการปรับยาเบื้องต้น", "n": 1, "y": [32, 34, 35], "w": "ยังเหนื่อย/exacerbate บน LAMA → เพิ่ม LABA เป็น LABA+LAMA (ถาม 32–35)", "c": null, "s": ["LAMA → LABA+LAMA"], "q": [{"q": "A 68-year-old man with COPD remains breathless on exertion despite regular inhaled tiotropium and as-needed salbutamol, and has had two exacerbations in the past year. What is the most appropriate next step in his maintenance therapy?", "a": "Add a long-acting beta-2 agonist to make a LABA plus LAMA combination", "y": [32, 34, 35], "an": "mx", "sub": "LAMA → LABA+LAMA", "t": 118}]}, {"t": "การรักษาที่ไม่ใช่ยา — เลิกบุหรี่ วัคซีน pulmonary rehab LTOT โภชนาการ และเมื่อไรส่งต่อ", "n": 3, "y": [28, 29, 30, 31, 32, 34, 35], "w": "เลิกบุหรี่เป็นสิ่งเดียวที่ชะลอ FEV1 ลดและลดตาย (ถาม 28–30, 35); pulmonary rehabilitation ในผู้ที่ยังเหนื่อยแม้ได้ยาพ่น (ถาม 31–35)", "c": null, "s": ["pulmonary rehabilitation", "เลิกบุหรี่ชะลอ FEV1 ลด", "เลิกบุหรี่ลดตาย"], "q": [{"q": "A 65-year-old man with COPD can perform activities of daily living but becomes breathless walking more than one block. He is on appropriate inhaled therapy for his stage. SpO2 on room air is 96 percent. Which of the following is indicated in the management of this condition?", "a": "Pulmonary rehabilitation", "y": [31, 32, 34, 35], "an": "mx", "sub": "pulmonary rehabilitation", "t": 118}, {"q": "In a 62-year-old man with COPD who still smokes 20 cigarettes a day, which intervention most effectively slows the decline in lung function and improves survival?", "a": "Smoking cessation", "y": [28, 29, 30], "an": "mx", "sub": "เลิกบุหรี่ชะลอ FEV1 ลด", "t": 118}, {"q": "A 62-year-old man with COPD who still smokes 20 cigarettes a day has frequent exacerbations. Which intervention has been shown to reduce his mortality?", "a": "Smoking cessation", "y": [35], "an": "mx", "sub": "เลิกบุหรี่ลดตาย", "t": 118}]}, {"t": "Acute exacerbation (1) — วินิจฉัย ความรุนแรง และยา 3 กลุ่ม", "n": 1, "y": [31, 32, 35], "w": "สาเหตุ exacerbation ที่พบบ่อยที่สุด = ติดเชื้อทางเดินหายใจ", "c": null, "s": ["สาเหตุ exacerbation: ติดเชื้อ"], "q": [{"q": "What is the single most common precipitating cause of an acute exacerbation of COPD?", "a": "Respiratory tract infection", "y": [31, 32, 35], "an": "fact", "sub": "สาเหตุ exacerbation: ติดเชื้อ", "t": 118}]}, {"t": "Acute exacerbation (2) — ออกซิเจนแบบควบคุม, CO2 คั่ง, NIV, ใส่ท่อช่วยหายใจ และก่อนกลับบ้าน", "n": 2, "y": [30, 31, 34], "w": null, "c": null, "s": ["NIV ใน AECOPD", "O2 เกินใน COPD → CO2 คั่ง"], "q": [{"q": "A patient with acute exacerbation of chronic obstructive pulmonary disease has persistent dyspnoea and SpO2 88 percent despite oxygen by nasal cannula. ABG shows pH 7.28, PaCO2 65 mmHg and HCO3 28 mEq/L. He is alert and able to protect his airway. What is the most appropriate next step?", "a": "Non-invasive positive pressure ventilation", "y": [30, 31, 34], "an": "mx", "sub": "NIV ใน AECOPD", "t": 44}, {"q": "A 45-year-old man is brought to the emergency department confused and drowsy. Arterial blood gas: PaO2 170 mmHg (on supplemental oxygen), PaCO2 56 mmHg, pH 7.28. He has a 15 pack-year smoking history and pulmonary function testing 3 months ago showed severe airway obstruction. What is the most likely cause of his hypercapnic respiratory failure?", "a": "COPD with excessive oxygen", "y": [31], "an": "dx", "sub": "O2 เกินใน COPD → CO2 คั่ง", "t": 44}]}, {"t": "อ่านเพิ่มเติม (เกินระดับ NL) — ปรับยาขั้นสูง: azithromycin, roflumilast, biologics, ensifentrine และยาที่ลดการตาย", "n": 0, "y": [], "w": null, "c": "เนื้อหาเกินระดับ NL (roflumilast, biologics) ไม่ถูกถาม — ข้ามได้", "s": [], "q": []}, {"t": "อ่านเพิ่มเติม (เกินระดับ NL) — pre-COPD, PRISm, AATD, CT/DLco, case-finding และ treatable traits", "n": 0, "y": [], "w": null, "c": "pre-COPD/PRISm/AATD เกินระดับ NL ไม่ถูกถาม", "s": [], "q": []}, {"t": "อ่านเพิ่มเติม (เกินระดับ NL) — ลดปริมาตรปอด ปลูกถ่ายปอด home NIV palliative care และโรคร่วมเชิงลึก", "n": 0, "y": [], "w": null, "c": "ผ่าตัดลดปริมาตรปอด/ปลูกถ่าย เกินระดับ NL ไม่ถูกถาม", "s": [], "q": []}], "th": [120, 118, 44]}, {"lec": "3/11", "title": "Asthma — วินิจฉัยและรักษาโรคหืด (GINA)", "n": 6, "angle": {"mech": 1, "dx": 1, "ix": 1, "interp": 1, "mx": 2}, "pattern": "Asthma ถามสั้นและซ้ำมาก 4 ประเด็นหลัก: วินิจฉัยด้วย spirometry reversibility, ICS-formoterol ตาม GINA, การรักษา exacerbation ใน ER และ vignette ไอกลางคืน + rhinitis; แต่ละข้อซ้ำ 3–4 รุ่น (30–35).", "tip": "ท่อง GINA Track 1 (ไม่ใช้ SABA เดี่ยว), เกณฑ์ reversibility ≥12% และ ≥200 mL, และ protocol ER (O2 เป้า 93–95%, SABA ซ้ำ, systemic steroid ทุกราย) ให้แม่น.", "secs": [{"t": "Asthma คืออะไร — นิยาม GINA อาการแปรปรวน และ phenotype", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "พยาธิสรีรวิทยา — T2-high, T2-low และ airway remodeling", "n": 1, "y": [35], "w": "กลไกพื้นฐานคือ chronic T2 airway inflammation → BHR", "c": null, "s": ["chronic T2 airway inflammation"], "q": [{"q": "Which process is the fundamental underlying mechanism of asthma?", "a": "Chronic airway inflammation (predominantly type 2/eosinophilic) that causes bronchial hyperresponsiveness and variable airflow obstruction", "y": [35], "an": "mech", "sub": "chronic T2 airway inflammation", "t": 120}]}, {"t": "อาการเกิดได้อย่างไร — wheeze ไอกลางคืน silent chest และ pulsus paradoxus", "n": 1, "y": [31, 32, 34], "w": "ไอ/หอบกลางคืน + allergic rhinitis โดยไม่มีหัวใจล้มเหลว = asthma", "c": null, "s": ["ไอ/หอบกลางคืน + rhinitis = asthma"], "q": [{"q": "A 24-year-old man has had nocturnal wheeze and breathlessness almost every night for 1 week, with no daytime symptoms and no leg oedema. He has nasal congestion and rhinorrhoea every evening. Examination shows pale swollen inferior turbinates, no jugular venous distension, normal heart sounds and clear lungs. What is the most likely cause of his breathlessness?", "a": "Asthma", "y": [31, 32, 34], "an": "dx", "sub": "ไอ/หอบกลางคืน + rhinitis = asthma", "t": 119}]}, {"t": "วินิจฉัย — spirometry, PEF diary, challenge test และ ICS trial", "n": 2, "y": [30, 31, 32, 35], "w": "ยืนยันวินิจฉัยด้วย spirometry + bronchodilator reversibility; FEV1/FVC ต่ำในหญิงอายุน้อย = asthma (ถาม 30–35)", "c": null, "s": ["spirometry + bronchodilator reversibility", "FEV1/FVC ต่ำในคนอายุน้อย = asthma"], "q": [{"q": "Which test best confirms the diagnosis of asthma in a patient with intermittent wheeze and a normal physical examination in the clinic?", "a": "Spirometry with bronchodilator reversibility testing", "y": [30, 31, 32, 35], "an": "ix", "sub": "spirometry + bronchodilator reversibility", "t": 119}, {"q": "A 30-year-old woman has had shortness of breath for 2 months. Vital signs are normal, SpO2 98% and breath sounds are normal. Pulmonary function testing shows a reduced FEV1/FVC ratio of 65%. Which of the following is the most likely diagnosis?", "a": "Asthma", "y": [35], "an": "interp", "sub": "FEV1/FVC ต่ำในคนอายุน้อย = asthma", "t": 119}]}, {"t": "Biomarker และการวินิจฉัยแยกโรค — FeNO, eosinophil, IgE และโรคที่เลียนแบบ asthma", "n": 0, "y": [], "w": null, "c": "FeNO/eosinophil และโรคเลียนแบบ asthma ยังไม่ถูกถาม", "s": [], "q": []}, {"t": "ยา — controller, reliever, add-on: กลไกและผลข้างเคียง", "n": 0, "y": [], "w": null, "c": "กลไก/ผลข้างเคียงยา (ICS candidiasis, LTRA) ยังไม่ถูกถามตรง", "s": [], "q": []}, {"t": "GINA Track 1 / Track 2 — เลือกขั้นเริ่มต้น และสอน MART", "n": 1, "y": [31, 32, 34, 35], "w": "GINA Track 1: as-needed low-dose ICS-formoterol แทน SABA อย่างเดียว (ถาม 31–35)", "c": null, "s": ["Track 1 as-needed ICS-formoterol"], "q": [{"q": "A 28-year-old woman with asthma has symptoms twice a week and wakes at night once or twice a month. She currently uses only an as-needed short-acting beta-2 agonist. According to current asthma guidelines, what should she be prescribed?", "a": "As-needed low-dose inhaled corticosteroid-formoterol as reliever therapy", "y": [31, 32, 34, 35], "an": "mx", "sub": "Track 1 as-needed ICS-formoterol", "t": 119}]}, {"t": "ติดตามผล — symptom control, ความเสี่ยงในอนาคต, step up/down, difficult-to-treat vs severe, remission", "n": 0, "y": [], "w": null, "c": "step up/down, difficult vs severe asthma ยังไม่ถูกถาม", "s": [], "q": []}, {"t": "เทคนิคพ่นยา action plan และการดูแลที่ไม่ใช้ยา", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Acute exacerbation — ตัวกระตุ้น ใครเสี่ยงตาย และแบ่งความรุนแรง", "n": 0, "y": [], "w": null, "c": "แบ่งความรุนแรง exacerbation และผู้เสี่ยงตาย (silent chest, PaCO2 ปกติ/สูง) ไม่ถูกถามตรง — ABG asthma ถูกถามใน lecture 26", "s": [], "q": []}, {"t": "รักษา exacerbation — คลินิก ห้องฉุกเฉิน ICU และการจำหน่าย", "n": 1, "y": [30, 31, 35], "w": "exacerbation ใน ER: O2 + SABA + systemic steroid (ถาม 30, 31, 35)", "c": null, "s": ["ER: O2 + systemic steroid + SABA"], "q": [{"q": "A 30-year-old woman with asthma comes to the emergency department with progressive dyspnoea and non-productive cough over 3 days. She stopped her inhaled corticosteroid 3 months ago and has used her reliever inhaler every day in the past week, three times in the last hour. Vital signs: BT 37 C, PR 120/min, RR 30/min, BP 140/90 mmHg, SpO2 90 percent on room air, with generalised expiratory wheeze. What is the most appropriate initial treatment?", "a": "Oxygen supplementation, systemic corticosteroid and inhaled short-acting beta-2 agonist", "y": [30, 31, 35], "an": "mx", "sub": "ER: O2 + systemic steroid + SABA", "t": 119}]}, {"t": "สถานการณ์พิเศษ — AERD, ตั้งครรภ์, exercise-induced bronchoconstriction", "n": 0, "y": [], "w": null, "c": "AERD, ตั้งครรภ์, EIB ยังไม่ถูกถาม แต่ออกเป็น MCQ ได้ง่าย", "s": [], "q": []}, {"t": "อ่านเพิ่มเติม (เกินระดับ NL) — severe asthma และ biologics", "n": 0, "y": [], "w": null, "c": "biologics เกินระดับ NL ไม่ถูกถาม", "s": [], "q": []}], "th": [119]}], "gaps": [{"id": "gap-chest-01", "set": "chest", "title": "Pneumonia: เชื้อเข้าปอดทางไหน และเดาเชื้อจากเบาะแส", "subtitle": "microaspiration, aspiration กับ anaerobe และ lung abscess, Klebsiella, pneumococcus, Pseudomonas, bronchiectasis", "md": "### 1. เชื้อเดินทางไปถึงปอดได้อย่างไร\nทางเดินหายใจส่วนล่างมีกลไกป้องกันหลายชั้น ได้แก่ epiglottis และ cough reflex, mucociliary clearance, IgA และ surfactant และ alveolar macrophage ปอดบวมเกิดเมื่อเชื้อมีปริมาณมากหรือรุนแรงเกินกว่ากลไกเหล่านี้จะกำจัดได้\n- **Microaspiration ของเสมหะในช่องคอหอยที่มีเชื้ออาศัยอยู่ (colonization) — ทางที่พบบ่อยที่สุด** ของ CAP เกิดได้ในคนปกติขณะหลับ เชื้อเช่น S. pneumoniae และ H. influenzae จึงต้องเกาะที่คอหอยก่อน\n- **Inhalation ของละอองฝอย (aerosol)**: Legionella (ละอองน้ำจากหอระบายความร้อน เครื่องปรับอากาศ), วัณโรค, ไวรัส, Mycoplasma\n- **Hematogenous spread**: S. aureus จาก right-sided endocarditis ในผู้ใช้ยาเสพติดทางหลอดเลือดหรือสายสวน → septic emboli ก้อนหลายก้อนกระจายทั้งสองปอดที่มักเป็นโพรง\n- Direct extension จากช่องท้องหรือแผลทะลุ (พบน้อย)\n\n**Macroaspiration** คือสำลักเนื้อหาปริมาณมาก ปัจจัยเสี่ยง: สติลดลง (เมาสุรา ชัก ยากล่อมประสาท ดมยา), กลืนลำบาก (stroke, Parkinson, โรคหลอดอาหาร), ใส่สาย NG, ฟันผุเหงือกอักเสบ (เพิ่มปริมาณ anaerobe ในปาก)\n- **ตำแหน่งขึ้นกับท่า**: นอนหงาย → **posterior segment ของ upper lobe และ superior segment ของ lower lobe**; นั่งหรือยืน → basal segments ของ lower lobe\n- **ข้างขวาบ่อยกว่า** เพราะ right main bronchus กว้าง สั้น และชันกว่า\n- *Aspiration pneumonitis* (Mendelson) = สารเคมีจากกรดในกระเพาะ เกิดภายในชั่วโมง มักไม่ต้องให้ยาฆ่าเชื้อ ต่างจาก *aspiration pneumonia* ซึ่งเป็นการติดเชื้อจากเชื้อในปาก\n\n**เชื้อ anaerobe ในช่องปากกับ lung abscess**: Peptostreptococcus, Fusobacterium, Prevotella, Bacteroides เมื่อสำลักแล้วไม่ได้รักษา ภายใน 1–2 สัปดาห์เกิดเนื้อปอดตาย (necrotizing pneumonia) → **lung abscess** (โพรงผนังหนามี air-fluid level ในตำแหน่ง dependent segment) หรือ empyema อาการเรื้อรัง เสมหะเหม็นเน่า (putrid) น้ำหนักลด Gram stain เสมหะพบเชื้อหลายรูปร่างปน (mixed flora) รักษาด้วย ampicillin-sulbactam หรือ amoxicillin-clavulanate (หรือ clindamycin) ให้ยานานหลายสัปดาห์จนภาพรังสีดีขึ้นชัด มักไม่ต้องระบายหนอง\n*หมายเหตุแนวทางใหม่*: ATS/IDSA 2019 แนะนำว่า aspiration pneumonia ทั่วไป **ไม่ต้องเพิ่มยาครอบคลุม anaerobe เป็นประจำ** ยกเว้นสงสัย lung abscess หรือ empyema แต่ข้อสอบคลาสสิก \"stroke กลืนลำบาก + posterior segment RUL/superior segment RLL + mixed flora\" คำตอบคือ **anaerobic oral flora**\n\n### 2. ตารางเดาเชื้อจากเบาะแส\n| เบาะแส | เชื้อ | การรักษาหลัก |\n|---|---|---|\n| ไข้หนาวสั่นเฉียบพลัน เสมหะสีสนิม lobar consolidation; **Gram-positive lancet-shaped diplococci** ร่วม PMN มาก epithelial cell น้อย (เสมหะคุณภาพดี) | **Streptococcus pneumoniae** (สาเหตุ CAP อันดับ 1) | OPD: amoxicillin ขนาดสูง; admit: **ceftriaxone 1–2 g IV วันละครั้ง** (หรือ penicillin G ถ้าไวต่อยา) |\n| ดื่มสุรา เบาหวาน; เสมหะข้นมีเลือดปน **\"red currant jelly\"**; upper lobe consolidation มี **bulging fissure**; เกิดโพรงหรือ abscess ง่าย; Gram-negative bacilli มีแคปซูลหนา | **Klebsiella pneumoniae** | ceftriaxone หรือ ceftazidime; ถ้าเสี่ยง ESBL (ใช้ยาฆ่าเชื้อหรือนอน รพ. มาก่อน) → carbapenem ในไทยพบ hypervirulent strain ที่มี liver abscess ร่วม |\n| หลังไข้หวัดใหญ่, ผู้ใช้ยาเสพติดทางหลอดเลือด, necrotizing pneumonia, pneumatocele; Gram-positive cocci in clusters | **Staphylococcus aureus** | cloxacillin/cefazolin; MRSA → vancomycin หรือ linezolid |\n| COPD, คนสูบบุหรี่, **bronchiectasis**; Gram-negative coccobacilli | **Haemophilus influenzae** | amoxicillin หรือ amoxicillin-clavulanate |\n| COPD; Gram-negative diplococci | Moraxella catarrhalis | amoxicillin-clavulanate |\n| วัยรุ่นหรือหนุ่มสาวอยู่รวมกัน (หอพัก ทหาร), walking pneumonia, ไอแห้งนาน, bullous myringitis, cold agglutinin hemolysis, ภาพรังสีแย่กว่าตรวจร่างกาย | Mycoplasma pneumoniae | macrolide หรือ doxycycline (beta-lactam ไม่ได้ผลเพราะไม่มี cell wall) |\n| ไข้สูงแต่ชีพจรช้าสัมพัทธ์, ท้องเสีย, สับสน, **hyponatremia**, transaminase สูง, สัมผัสหอระบายความร้อนหรือระบบน้ำ | Legionella pneumophila | azithromycin หรือ levofloxacin ตรวจ urinary antigen |\n| ชาวนาภาคอีสาน เบาหวาน ไตวาย ดื่มสุรา; ปอดบวมรุนแรง sepsis ฝีหลายอวัยวะ (ตับ ม้าม ต่อมลูกหมาก) | **Burkholderia pseudomallei (melioidosis)** | ceftazidime หรือ meropenem อย่างน้อย 10–14 วัน แล้วตามด้วย co-trimoxazole 3–6 เดือน |\n| นอน ICU หรือใส่ท่อช่วยหายใจนาน, โรคปอดโครงสร้าง (bronchiectasis, CF), เคยได้ IV antibiotic; **Gram-negative bacillus, oxidase positive, non-lactose fermenter, สร้างสีเขียว (pyocyanin)** กลิ่นคล้ายองุ่น | **Pseudomonas aeruginosa** | anti-pseudomonal beta-lactam: **piperacillin-tazobactam 4.5 g IV q6h** หรือ cefepime 2 g q8h, ceftazidime, meropenem 1 g q8h |\n| ICU ไทย ดื้อยาหลายขนาน | Acinetobacter baumannii (มัก carbapenem-resistant) | ตาม antibiogram เช่น colistin |\n| HIV CD4 <200, ground-glass ทั้งสองข้าง, LDH สูง, SpO2 ตกเมื่อออกแรง | Pneumocystis jirovecii | co-trimoxazole ± steroid |\n| ไอเรื้อรัง >2 สัปดาห์ น้ำหนักลด ไข้ต่ำ ๆ ตอนเย็น, upper lobe cavity | Mycobacterium tuberculosis | สูตรยา 2HRZE/4HR |\n\n### 3. HAP/VAP — ปอดบวมที่เกิดใน รพ.\n- **HAP** = ปอดบวมที่เกิด ≥48 ชั่วโมงหลังรับไว้ใน รพ.; **VAP** = เกิด ≥48 ชั่วโมงหลังใส่ท่อช่วยหายใจ\n- เชื้อต่างจาก CAP: Pseudomonas aeruginosa, Acinetobacter baumannii, Klebsiella/E. coli ที่สร้าง ESBL หรือดื้อ carbapenem และ MRSA\n- ผู้ป่วยนอน ICU 10 วัน เพิ่งถอดท่อแล้วมีไข้ใหม่ เสมหะเป็นหนอง เพาะเชื้อได้ Gram-negative bacillus oxidase บวกและมีสีเขียว = **Pseudomonas** ให้ empirical anti-pseudomonal beta-lactam (เช่น piperacillin-tazobactam) เลือกตาม antibiogram ของ รพ. เพิ่มยาตัวที่สองต้าน Pseudomonas (aminoglycoside หรือ ciprofloxacin) เมื่อมี septic shock หรือเสี่ยงเชื้อดื้อยามาก และเพิ่ม vancomycin/linezolid เมื่อเสี่ยง MRSA ระยะเวลาโดยทั่วไป 7 วัน แล้ว de-escalate ตามผลเพาะเชื้อ\n\n### 4. Bronchiectasis — เชื้อที่ทำให้กำเริบ\nหลอดลมที่ขยายถาวรและผนังหนา (HRCT: bronchus กว้างกว่าหลอดเลือดแดงคู่กัน \"signet ring sign\", tram-track) ทำให้ mucociliary clearance เสีย เสมหะคั่ง ติดเชื้อซ้ำ เกิดวงจร infection–inflammation–damage อาการ: ไอมีเสมหะปริมาณมากเป็นหนองทุกวัน ไอเป็นเลือด ติดเชื้อบ่อย\n- **ในผู้ที่ไม่ใช่ cystic fibrosis และไม่มีภูมิคุ้มกันบกพร่อง เชื้อที่พบบ่อยที่สุดคือ Haemophilus influenzae**\n- รองลงมาคือ **Pseudomonas aeruginosa** ซึ่งบ่งถึงโรครุนแรงกว่า กำเริบบ่อย และพยากรณ์แย่กว่า ตามด้วย S. pneumoniae, Moraxella, S. aureus และ nontuberculous mycobacteria\n- ใน cystic fibrosis: เด็กพบ S. aureus มาก ผู้ใหญ่พบ Pseudomonas\n- สาเหตุในไทยที่พบบ่อยคือหลังติดเชื้อ (วัณโรคเก่า ปอดบวมรุนแรงในวัยเด็ก)\n- รักษาการกำเริบ: ยาฆ่าเชื้อ 14 วัน ตามผลเพาะเชื้อเสมหะเดิม เช่น amoxicillin หรือ amoxicillin-clavulanate สำหรับ H. influenzae, ciprofloxacin สำหรับ Pseudomonas ร่วมกับทำ airway clearance (กายภาพบำบัดทรวงอก)", "pearls": ["เชื้อก่อ CAP เข้าปอดส่วนใหญ่ทาง microaspiration ของเสมหะคอหอยที่มีเชื้อ colonize", "Stroke กลืนลำบาก นอนหงาย → posterior segment RUL + superior segment RLL; mixed flora = anaerobe ในปาก → lung abscess", "Red currant jelly + upper lobe + bulging fissure + สุรา/เบาหวาน = Klebsiella", "Gram-positive lancet diplococci = S. pneumoniae → ceftriaxone (admit)", "ICU/VAP + oxidase positive + green pigment = Pseudomonas → piperacillin-tazobactam (หรือ cefepime/meropenem)", "Bronchiectasis (ไม่ใช่ CF): เชื้อกำเริบบ่อยสุด H. influenzae; Pseudomonas = โรครุนแรงกว่า"], "traps": [], "q": [{"id": "CH-OLD-43", "q": "A 62-year-old man with poorly controlled diabetes and chronic alcohol use has fever and cough productive of thick, blood-tinged sputum described as red currant jelly. Chest radiograph shows right upper lobe consolidation with a bulging fissure. Which organism is most likely responsible?", "a": "Klebsiella pneumoniae", "y": [30, 34], "t": 116}, {"id": "CH-OLD-45", "q": "A patient with community-acquired pneumonia has a sputum Gram stain showing gram-positive lancet-shaped diplococci in pairs, with abundant polymorphonuclear leucocytes and few epithelial cells. Which antibiotic is most appropriate?", "a": "Ceftriaxone", "y": [31, 33, 34, 35], "t": 116}, {"id": "CH-OLD-46", "q": "An elderly bed-ridden man who has had a stroke with dysphagia develops fever and cough. Chest radiograph shows consolidation of the posterior segment of the right upper lobe and the superior segment of the right lower lobe. Sputum Gram stain shows mixed pleomorphic rods. Which organisms are most likely responsible?", "a": "Anaerobic oral flora", "y": [28, 30, 34, 35], "t": 116}, {"id": "CH-OLD-47", "q": "A patient who has been in the intensive care unit for 10 days is extubated after treatment for pneumonia. He develops a new fever with purulent secretions, and culture grows a gram-negative bacillus that is oxidase positive and produces a green pigment. Which organism is most likely, and which empirical therapy is appropriate?", "a": "Pseudomonas aeruginosa; piperacillin-tazobactam", "y": [32, 34], "t": 116}, {"id": "CH-OLD-56", "q": "A previously healthy 40-year-old woman has a chronic productive cough with large volumes of purulent sputum and recurrent infections. High-resolution CT shows dilated, thick-walled bronchi. Which organism is the most common cause of infective exacerbations in a patient like this with no underlying immunodeficiency?", "a": "Haemophilus influenzae", "y": [32, 35], "t": 116}, {"id": "PP28-CHE-132", "q": "By which route do most bacteria reach the lower respiratory tract to cause community-acquired pneumonia?", "a": "Microaspiration of oropharyngeal secretions colonised by the pathogen", "y": [28, 30], "t": 121}], "years": [28, 30, 31, 32, 33, 34, 35], "th": [116]}, {"id": "gap-chest-02", "set": "chest", "title": "CAP: ประเมินความรุนแรง เลือกที่รักษา ยา empirical และเกณฑ์เปลี่ยน IV เป็นยากิน (รวม common cold)", "subtitle": "CURB-65, amoxicillin ขนาดสูงที่ OPD, ceftriaxone + azithromycin ใน รพ., clinical stability และไม่ให้ antibiotic ใน common cold", "md": "### 1. วินิจฉัย CAP\nCAP = ปอดอักเสบติดเชื้อที่เกิดในชุมชน (หรือภายใน 48 ชั่วโมงแรกของการนอน รพ.) วินิจฉัยเมื่อมีอาการติดเชื้อทางเดินหายใจส่วนล่าง (ไข้ ไอ เสมหะ เหนื่อย เจ็บอกแบบ pleuritic) ร่วมกับ **infiltrate ใหม่ในภาพรังสีทรวงอก** ตรวจร่างกายพบ crepitation, bronchial breath sound หรือ dullness เฉพาะที่ เชื้อที่พบบ่อยคือ S. pneumoniae, H. influenzae, atypical (Mycoplasma, Chlamydophila, Legionella) และไวรัสทางเดินหายใจ (influenza, RSV, SARS-CoV-2) ในไทยต้องนึกถึง melioidosis, leptospirosis และ scrub typhus ด้วยตามบริบท\n\n### 2. ประเมินความรุนแรงเพื่อเลือกที่รักษา\n**CURB-65** (ให้ข้อละ 1 คะแนน)\n- **C**onfusion (สับสนใหม่)\n- **U**rea >7 mmol/L (เท่ากับ BUN >19–20 mg/dL)\n- **R**espiratory rate ≥30/นาที\n- **B**lood pressure: SBP <90 หรือ DBP ≤60 mmHg\n- อายุ ≥**65** ปี\n\n| คะแนน | ความเสี่ยงตาย 30 วัน | ที่รักษา |\n|---|---|---|\n| 0–1 | ต่ำ (<3%) | **OPD** |\n| 2 | ปานกลาง (~9%) | admit ระยะสั้นหรือ OPD ที่ติดตามใกล้ชิด |\n| ≥3 | สูง (≥15%, คะแนน 4–5 สูงถึง 40–57%) | admit, คะแนน 4–5 พิจารณา ICU |\n\nใช้ CRB-65 (ไม่ต้องรอผล urea) ในระดับปฐมภูมิได้ หรือใช้ PSI (class I–II รักษา OPD) ข้อควรจำคือคะแนนเป็นเพียงตัวช่วย ต้องพิจารณา **SpO2 <92%**, กินยาไม่ได้, โรคร่วมที่กำเริบ และปัจจัยทางสังคมด้วย\n\n**ตัวอย่างข้อสอบ**: ชาย 40 ปีไม่มีโรคร่วม รู้ตัวดี RR 18 BP 122/78 BUN 15 mg/dL → CURB-65 = 0 → **รักษาแบบผู้ป่วยนอกด้วย amoxicillin ขนาดสูง**\n\n**Severe CAP ต้องเข้า ICU (ATS/IDSA)**: major criteria ข้อใดข้อหนึ่ง (septic shock ต้องใช้ vasopressor หรือ respiratory failure ต้องใส่ท่อช่วยหายใจ) หรือ minor criteria ≥3 ข้อ (RR ≥30, PaO2/FiO2 ≤250, multilobar infiltrates, confusion, BUN ≥20 mg/dL, WBC <4,000, platelet <100,000, อุณหภูมิ <36°C, ความดันต่ำต้องให้สารน้ำมาก)\n\n### 3. ยา empirical ตามที่รักษา (ATS/IDSA 2019 ปรับบริบทไทย)\n| กลุ่ม | สูตรที่แนะนำ |\n|---|---|\n| OPD ไม่มีโรคร่วม ไม่เสี่ยง MRSA/Pseudomonas | **amoxicillin 1 g PO วันละ 3 ครั้ง** (ทางเลือก: doxycycline 100 mg วันละ 2 ครั้ง) |\n| OPD มีโรคร่วม (โรคหัวใจ ปอด ตับ ไตเรื้อรัง เบาหวาน สุรา มะเร็ง ไม่มีม้าม) | amoxicillin-clavulanate (หรือ cefuroxime, cefpodoxime) **ร่วมกับ** macrolide หรือ doxycycline; หรือ respiratory fluoroquinolone เดี่ยว (levofloxacin 750 mg, moxifloxacin 400 mg) |\n| Admit ward ไม่รุนแรง | **beta-lactam (ceftriaxone 1–2 g IV OD, cefotaxime หรือ ampicillin-sulbactam) + macrolide (azithromycin 500 mg OD หรือ clarithromycin 500 mg bid)**; หรือ respiratory FQ เดี่ยว |\n| Severe CAP (ICU) | beta-lactam + macrolide (หรือ beta-lactam + respiratory FQ) |\n| เคยเพาะเชื้อพบ MRSA/Pseudomonas หรือนอน รพ. + ได้ IV antibiotic ใน 90 วัน | เพิ่ม vancomycin/linezolid และ/หรือ anti-pseudomonal beta-lactam ตามเชื้อที่เสี่ยง เพาะเชื้อก่อน แล้ว de-escalate |\n\nเหตุผลของสูตร\n- beta-lactam ครอบคลุม pneumococcus (ดื้อ penicillin ระดับสูงพบน้อยใน CAP เมื่อใช้ขนาดสูง) ส่วน macrolide ครอบคลุม atypical และอาจมีฤทธิ์ต้านอักเสบ\n- **ไม่ใช้ macrolide เดี่ยวในไทย** เพราะ pneumococcus ดื้อ macrolide สูงกว่า 25%\n- ใช้ fluoroquinolone อย่างระมัดระวังในไทย เพราะวัณโรคชุก FQ กดเชื้อวัณโรคบางส่วนทำให้วินิจฉัยช้าและดื้อยา ควรตรวจเสมหะ AFB ก่อนถ้าสงสัย\n- ฤดูไข้หวัดใหญ่ ให้ oseltamivir ในผู้ป่วยที่ admit โดยไม่ต้องรอผล\n- ผู้ป่วย admit ที่รุนแรง ควรเก็บ hemoculture และ sputum Gram stain/culture ก่อนให้ยา และให้ยาเข็มแรกโดยเร็ว (ภายใน 1 ชั่วโมงถ้ามี septic shock)\n- severe CAP: แนวทางใหม่ (ATS 2025, อิง CAPE COD 2023) แนะนำพิจารณา hydrocortisone 200 mg/วัน ส่วน CAP ไม่รุนแรงไม่ให้ steroid\n- ระยะเวลา: อย่างน้อย 5 วัน และต้อง clinically stable ≥48 ชั่วโมงก่อนหยุดยา (นานขึ้นถ้ามี MRSA/Pseudomonas, empyema หรือ abscess)\n\n### 4. เกณฑ์เปลี่ยนยาฉีดเป็นยากิน (IV-to-oral switch)\nเปลี่ยนได้เมื่อ **อาการดีขึ้นและ clinically stable** ซึ่งมักเกิดในวันที่ 2–3\n- hemodynamic คงที่: HR ≤100/นาที, SBP ≥90 mmHg\n- ไข้ลง: อุณหภูมิ ≤37.8°C\n- RR ≤24/นาที และ SpO2 ≥90% (หรือ PaO2 ≥60 mmHg) ในอากาศห้อง\n- รู้สติปกติ\n- **กินได้และทางเดินอาหารดูดซึมได้ปกติ**\n\n**สิ่งที่ไม่ใช่เกณฑ์**: **ภาพรังสีที่ดีขึ้น** เพราะ infiltrate หายช้ากว่าอาการมาก (4–12 สัปดาห์ ผู้สูงอายุอาจนานกว่า) การรอให้ฟิล์มดีขึ้นจึงทำให้นอน รพ. นานโดยไม่จำเป็น และไม่ต้องรอ WBC ปกติสมบูรณ์ ยากินใช้กลุ่มเดียวกับยาฉีด (เช่น ceftriaxone → amoxicillin-clavulanate หรือ cefdinir) จำหน่ายได้เมื่อ stable และกินยาได้ ไม่ต้องสังเกตอาการต่อใน รพ. หลังเปลี่ยนยา ไม่ต้องถ่ายภาพรังสีซ้ำเป็นประจำ ยกเว้นอาการไม่หายหรือเสี่ยงมะเร็งปอด (ทำที่ 6–8 สัปดาห์)\n\n### 5. Common cold — แยกให้ออกว่าไม่ใช่ CAP และไม่ต้องให้ยาฆ่าเชื้อ\n- สาเหตุเป็นไวรัสเกือบทั้งหมด **rhinovirus** มากที่สุด ตามด้วย coronavirus (ที่ไม่ใช่ SARS-CoV-2), RSV, adenovirus, parainfluenza\n- อาการ: น้ำมูก คัดจมูก จาม เจ็บคอ ไอเล็กน้อย ไข้ต่ำ ๆ อาการมากสุดวันที่ 2–3 หายเองใน 7–10 วัน ตรวจพบคอแดงเล็กน้อยไม่มีหนอง ปอดปกติ\n- **น้ำมูกเขียวหรือเหลืองไม่ได้บ่งว่าติดเชื้อแบคทีเรีย**\n- **รักษาตามอาการ**: paracetamol (หรือ NSAID) ลดไข้และปวด, **ล้างจมูกด้วยน้ำเกลือ**, ยาหดหลอดเลือดพ่นจมูก (oxymetazoline) ไม่เกิน 3 วัน (เกินนั้นเกิด rebound congestion), antihistamine รุ่นแรกร่วม decongestant ช่วยได้เล็กน้อยในผู้ใหญ่, น้ำผึ้งบรรเทาไอ (ห้ามในเด็ก <1 ปี), พักผ่อน ดื่มน้ำ\n- **ไม่ให้ antibiotic**: ไม่ลดระยะโรค ไม่ป้องกันภาวะแทรกซ้อน แต่เพิ่มผลข้างเคียงและเชื้อดื้อยา สอดคล้องกับโครงการ **Antibiotic Smart Use** ของไทย ซึ่งเน้นไม่ใช้ยาฆ่าเชื้อในโรคหวัด ท้องเสียเฉียบพลัน และแผลสะอาด\n- นึกถึงแบคทีเรียแทรกเมื่อ: อาการไซนัส >10 วันไม่ดีขึ้น, ไข้ ≥39°C ร่วมน้ำมูกหนอง 3–4 วันแรก, หรืออาการดีขึ้นแล้วกลับแย่ลง (double sickening) → acute bacterial rhinosinusitis ให้ amoxicillin (± clavulanate); เจ็บคอมาก มีหนองที่ทอนซิล ต่อมน้ำเหลืองโต ไม่ไอ → ใช้ Centor/McIsaac score หา streptococcal pharyngitis\n- แยกจากไข้หวัดใหญ่: ไข้สูงเฉียบพลัน ปวดกล้ามเนื้อมาก อ่อนเพลีย → oseltamivir ในกลุ่มเสี่ยงหรืออาการรุนแรง", "pearls": ["CURB-65: Confusion, Urea >7 mmol/L (BUN >19), RR ≥30, SBP <90/DBP ≤60, อายุ ≥65; 0–1 = OPD", "CAP OPD ไม่มีโรคร่วม: amoxicillin 1 g tid (ไม่ใช้ macrolide เดี่ยวในไทย)", "CAP admit ward: ceftriaxone + azithromycin (beta-lactam + macrolide) หรือ respiratory FQ เดี่ยว", "IV → oral เมื่อ stable: ไข้ลง HR ≤100 RR ≤24 SBP ≥90 SpO2 ≥90% สติดี กินได้ — ไม่ต้องรอภาพรังสีดีขึ้น", "Common cold (rhinovirus): paracetamol + ล้างจมูกน้ำเกลือ ไม่ให้ antibiotic"], "traps": [], "q": [{"id": "PP31-CHE-073", "q": "All of the following factors are used to decide on switching from parenteral to oral antibiotics in community-acquired pneumonia EXCEPT:", "a": "Decrease in the radiographic parenchymal infiltrate", "y": [31], "t": 123}, {"id": "PP32-CHE-063", "q": "A patient is diagnosed with pneumonia. He has no history of recent hospitalisation and no history of antibiotic use beforehand. Which empiric antibiotic regimen is most appropriate?", "a": "Ceftriaxone IV plus azithromycin", "y": [32], "t": 123}, {"id": "CH-OLD-44", "q": "A 40-year-old man with no comorbidity has community-acquired pneumonia. He is alert, RR 18/min, BP 122/78 mmHg, BUN 15 mg/dL and creatinine 0.87 mg/dL. What is the most appropriate management?", "a": "Outpatient treatment with high-dose oral amoxicillin", "y": [34, 35], "t": 117}, {"id": "PP31-CHE-037", "q": "A previously healthy 25-year-old woman has had a runny nose, nasal congestion, sore throat and low-grade fever for 2 days. Examination shows mild pharyngeal injection without exudate; the lungs are clear. What is the most appropriate management?", "a": "Symptomatic treatment with paracetamol and saline nasal irrigation", "y": [31], "t": 122}], "years": [31, 32, 34, 35], "th": [123, 117, 122]}, {"id": "gap-chest-03", "set": "chest", "title": "Pulmonary embolism: เดาจากบริบท วินิจฉัยเป็นขั้น และเลือก anticoagulant", "subtitle": "หลังผ่าตัดสะโพก ตั้งครรภ์ มะเร็ง: Wells, D-dimer, CTPA, แบ่งความเสี่ยงและ LMWH/DOAC", "md": "### 1. กลไก: Virchow's triad และผลต่อหัวใจขวา\nลิ่มเลือดส่วนใหญ่มาจาก **DVT ของหลอดเลือดดำส่วนต้นที่ขา** (popliteal ขึ้นไป) หลุดไปอุด pulmonary artery ปัจจัยเสี่ยงอธิบายด้วย Virchow's triad คือ เลือดไหลช้า (stasis) ผนังหลอดเลือดบาดเจ็บ และเลือดแข็งตัวง่าย (hypercoagulability)\n- **ผ่าตัดใหญ่ โดยเฉพาะ hip/knee arthroplasty และกระดูกสะโพกหัก** (ความเสี่ยงสูงสุดใน 2–4 สัปดาห์แรก), trauma, นอนติดเตียง, เดินทางไกล\n- **มะเร็ง** (โดยเฉพาะปอด ตับอ่อน กระเพาะ สมอง ที่มีการกระจาย หรือระหว่างให้เคมีบำบัด)\n- **ตั้งครรภ์และหลังคลอด 6 สัปดาห์** (เสี่ยงสูงสุดหลังคลอด), ยาเม็ดคุมกำเนิดหรือฮอร์โมนทดแทน\n- เคยเป็น VTE, thrombophilia, antiphospholipid syndrome, อ้วน, nephrotic syndrome\n\nเมื่ออุดหลอดเลือดปอด pulmonary vascular resistance เพิ่ม → RV ต้องบีบต้านแรงสูง RV โตและ septum ดันไปทาง LV → LV รับเลือดได้น้อย → cardiac output ลด → ความดันตก ช็อก หมดสติ ส่วนการแลกเปลี่ยนก๊าซ V/Q mismatch ทำให้ hypoxemia, A–a gradient กว้าง และหายใจเร็วจน PaCO2 ต่ำ (respiratory alkalosis)\n\n### 2. อาการ: ให้นึกถึงจากบริบท\n- **เหนื่อยเฉียบพลัน** (พบบ่อยที่สุด), เจ็บอกแบบ pleuritic (จาก pulmonary infarction ส่วนปลาย), ไอเป็นเลือด, หน้ามืดหมดสติ (ก้อนใหญ่)\n- ตรวจพบหายใจเร็ว **หัวใจเต้นเร็ว** SpO2 ต่ำ ขาบวมข้างเดียว ปอดมักฟังปกติ\n- **ตัวอย่างคลาสสิก**: หญิง 64 ปี วันที่ 3 หลังผ่าตัดสะโพก เหนื่อยทันที เจ็บอกเวลาหายใจ ใจสั่น SpO2 89% = **PE** จนกว่าจะพิสูจน์ว่าไม่ใช่ หรือหญิงตั้งครรภ์ขาบวมข้างเดียวแล้วเหนื่อยเฉียบพลัน\n- ECG: **sinus tachycardia พบบ่อยที่สุด**; S1Q3T3, RBBB ใหม่, T inversion V1–V4, right axis deviation บ่ง RV strain\n- CXR: มักปกติ (ช่วยแยกโรคอื่น) อาจพบ Westermark sign หรือ Hampton hump\n- ABG: PaO2 ต่ำ PaCO2 ต่ำ A–a gradient กว้าง\n\n### 3. การวินิจฉัยเป็นขั้นตอน (ESC 2019)\n1. ถ้า **hemodynamic ไม่คงที่** (ช็อก) → ทำ bedside echo ถ้าพบ RV dysfunction และทำ CTPA ไม่ได้ทันที ให้รักษาแบบ high-risk PE ได้เลย\n2. ถ้าคงที่ → ประเมิน clinical probability ด้วย **Wells score** (ข้อสำคัญ: อาการ DVT 3, PE น่าจะเป็นมากกว่าโรคอื่น 3, HR >100 1.5, นอนติดเตียง ≥3 วันหรือผ่าตัดใน 4 สัปดาห์ 1.5, เคยเป็น DVT/PE 1.5, ไอเป็นเลือด 1, มะเร็ง 1) คะแนน >4 = PE likely\n3. Probability ต่ำ ใช้ PERC rule ถ้าครบทั้ง 8 ข้อไม่ต้องตรวจเพิ่ม\n4. Probability ไม่สูง (PE unlikely) → **D-dimer** ถ้าปกติ ตัด PE ออกได้ (อายุ >50 ปีใช้ age-adjusted cut-off = อายุ × 10 µg/L)\n5. D-dimer สูง หรือ probability สูงตั้งแต่ต้น → **CT pulmonary angiography (CTPA)** ระหว่างรอผลให้ anticoagulant ได้เลยถ้าไม่มีข้อห้าม\n6. ไตเสื่อมรุนแรงหรือแพ้สารทึบรังสี → V/Q scan; หรือ compression ultrasound ขาถ้าพบ DVT ก็รักษาได้เลย\n\n**ในหญิงตั้งครรภ์**: D-dimer สูงตามธรรมชาติ ถ้ามีอาการของ DVT ให้ทำ **compression ultrasound ขาก่อน** ถ้าพบ DVT ให้ LMWH ได้เลยโดยไม่ต้องฉายรังสี ถ้าไม่พบ ทำ CTPA หรือ V/Q scan (ปริมาณรังสีต่อทารกต่ำมาก การพลาดวินิจฉัยอันตรายกว่า)\n\n### 4. แบ่งความเสี่ยงเพื่อเลือกการรักษา\n| ระดับ | เกณฑ์ | การรักษา |\n|---|---|---|\n| **High risk (massive)** | SBP <90 mmHg นาน ≥15 นาที, ต้องใช้ vasopressor หรือ cardiac arrest | UFH + **systemic thrombolysis** (alteplase 100 mg IV ใน 2 ชั่วโมง) ถ้ามีข้อห้าม → surgical embolectomy หรือ catheter-directed therapy |\n| Intermediate-high | ความดันปกติ แต่ RV dysfunction ใน echo/CT **และ** troponin สูง | anticoagulation + เฝ้าระวังใกล้ชิด; ให้ rescue thrombolysis เมื่อ hemodynamic แย่ลง (ไม่ให้ thrombolysis ตั้งแต่แรก) |\n| Intermediate-low | sPESI ≥1 หรือมีเพียงข้อเดียวของ RV dysfunction/troponin | anticoagulation ใน รพ. |\n| **Low risk** | sPESI 0, ความดันปกติ, RV ปกติ | **anticoagulation อย่างเดียว** อาจจำหน่ายเร็วหรือรักษาแบบผู้ป่วยนอก |\n\nผู้ป่วยมะเร็งปอดที่ CTPA พบลิ่มเลือดใน right main pulmonary artery แต่ BP 128/76 และ RV ปกติ → **ไม่ใช่ high risk ไม่ต้อง thrombolysis** ให้ therapeutic anticoagulation ด้วย LMWH หรือ DOAC ขนาดของก้อนหรือตำแหน่งที่ใหญ่ไม่ได้เป็นข้อบ่งชี้ให้ยาละลายลิ่มเลือด สิ่งที่ตัดสินคือ hemodynamic\n\n### 5. Anticoagulant ที่ต้องจำขนาด\n| ยา | ขนาด | ข้อควรรู้ |\n|---|---|---|\n| **Enoxaparin (LMWH)** | **1 mg/kg SC ทุก 12 ชั่วโมง** (หรือ 1.5 mg/kg วันละครั้ง) | ปรับลดเมื่อ CrCl <30 mL/min; ใช้ได้ในตั้งครรภ์และมะเร็ง |\n| Unfractionated heparin | 80 U/kg IV bolus แล้ว 18 U/kg/ชม. ปรับ aPTT 1.5–2.5 เท่า | เลือกเมื่อช็อกหรืออาจต้องให้ thrombolysis, ไตวายรุนแรง, เสี่ยงเลือดออก (หยุดฤทธิ์ได้เร็ว ใช้ protamine แก้) |\n| Rivaroxaban | 15 mg bid 21 วัน แล้ว 20 mg OD | เริ่มได้เลยไม่ต้องให้ heparin ก่อน |\n| Apixaban | 10 mg bid 7 วัน แล้ว 5 mg bid | เริ่มได้เลย |\n| Dabigatran, edoxaban | เริ่มหลังให้ heparin/LMWH ≥5 วัน | — |\n| Warfarin | ให้ทับซ้อนกับ heparin ≥5 วัน และ INR 2–3 ติดต่อกัน ≥24 ชั่วโมงจึงหยุด heparin | ราคาถูก ใช้มากในไทย; ใช้ใน mechanical valve และ APS |\n\n- **DOAC ห้ามใช้**: ตั้งครรภ์และให้นมบุตร, ไตวายรุนแรง (CrCl <15–30 แล้วแต่ยา), antiphospholipid syndrome ชนิด triple positive, ลิ้นหัวใจเทียมชนิดโลหะ\n- **ตั้งครรภ์**: ใช้ **LMWH ตลอดการตั้งครรภ์** และต่ออย่างน้อย 6 สัปดาห์หลังคลอด (รวมไม่น้อยกว่า 3 เดือน) ห้าม warfarin (ทำให้ทารกพิการโดยเฉพาะสัปดาห์ที่ 6–12) และห้าม DOAC\n- **Cancer-associated VTE**: LMWH หรือ DOAC (apixaban, edoxaban, rivaroxaban) ระวัง DOAC ในมะเร็งทางเดินอาหารหรือทางเดินปัสสาวะที่มีรอยโรคในทางเดิน (เลือดออกมากกว่า) ให้นานอย่างน้อย 6 เดือนและตลอดที่มะเร็งยัง active\n\n### 6. ระยะเวลาการรักษา\n- PE จากปัจจัยกระตุ้นชั่วคราวที่ชัดเจน (เช่น ผ่าตัด) → **3 เดือน**\n- PE ไม่มีสาเหตุ (unprovoked) หรือปัจจัยเสี่ยงถาวร → อย่างน้อย 3 เดือนแล้วพิจารณาให้ต่อไปเรื่อย ๆ ถ้าเสี่ยงเลือดออกต่ำ\n- มะเร็ง → ≥6 เดือน และตลอดที่มะเร็งยังอยู่\n- IVC filter ใช้เฉพาะเมื่อให้ anticoagulant ไม่ได้ (ข้อห้ามเด็ดขาด เช่น เลือดออกรุนแรง)\n- ป้องกันหลังผ่าตัดสะโพก: LMWH หรือ DOAC นานถึง 35 วัน ร่วมกับลุกเดินเร็ว", "pearls": ["เหนื่อยเฉียบพลัน + pleuritic chest pain + tachycardia หลังผ่าตัดสะโพก/ตั้งครรภ์/มะเร็ง = คิดถึง PE", "ECG ใน PE พบบ่อยสุดคือ sinus tachycardia (S1Q3T3 ไม่ไว)", "PE unlikely → D-dimer (age-adjusted >50 ปี = อายุ × 10); likely หรือ D-dimer สูง → CTPA", "Thrombolysis เฉพาะ high-risk (SBP <90 ≥15 นาที/vasopressor); BP ปกติ RV ปกติ → anticoagulation อย่างเดียว", "Enoxaparin 1 mg/kg SC q12h; ตั้งครรภ์ใช้ LMWH (ห้าม warfarin/DOAC); มะเร็งใช้ LMWH หรือ DOAC"], "traps": [], "q": [{"id": "PP30-CHE-027", "q": "On postoperative day 3 after hip surgery, a 64-year-old woman develops sudden dyspnoea, pleuritic chest pain and tachycardia. SpO2 is 89%. What is the most likely diagnosis?", "a": "Pulmonary embolism", "y": [30], "t": 110}, {"id": "PP29-CHE-045", "q": "During treatment for lung cancer a patient develops sudden dyspnoea. CT pulmonary angiography shows a thrombus in the right main pulmonary artery; BP 128/76 mmHg and RV function is normal. What is the appropriate treatment?", "a": "Therapeutic anticoagulation with low-molecular-weight heparin (e.g., enoxaparin) or a DOAC", "y": [29, 30], "t": 110}], "years": [29, 30], "th": [110]}, {"id": "gap-chest-04", "set": "chest", "title": "ARDS: นิยาม กลไก และ lung-protective ventilation", "subtitle": "Berlin/Global definition, Vt 6 mL/kg PBW, Pplat ≤30, PEEP, prone position", "md": "### 1. กลไก: ปอดรั่วจากการอักเสบ ไม่ใช่จากหัวใจ\nARDS คือการบาดเจ็บของ alveolar–capillary membrane แบบกระจายทั่วปอด (diffuse alveolar damage) จากการอักเสบรุนแรง ทั้ง endothelium และ epithelium (type I และ type II pneumocyte) เสียหาย ของเหลวที่มีโปรตีนสูงจึงรั่วเข้าถุงลม (non-cardiogenic pulmonary edema) surfactant ลดลง ถุงลมแฟบ\n- **ระยะ exudative (วันที่ 1–7)**: hyaline membrane, neutrophil และน้ำในถุงลม\n- **ระยะ proliferative (สัปดาห์ที่ 1–3)**: type II pneumocyte เพิ่มจำนวนเพื่อซ่อมแซม\n- **ระยะ fibrotic**: บางรายเกิดพังผืด ทำให้ปอดแข็งถาวร\n- ผลทางสรีรวิทยา: **shunt** (เลือดผ่านถุงลมที่ไม่มีอากาศ) จึงเกิด hypoxemia ที่แก้ด้วย O2 อย่างเดียวไม่ค่อยขึ้น; compliance ลดลง ปอดแข็ง \"baby lung\" (ส่วนที่ยังรับอากาศได้เหลือน้อย); dead space เพิ่ม\n\nสาเหตุ\n- *Direct (ปอดโดยตรง)*: **ปอดบวม (พบบ่อยที่สุด)**, สำลักน้ำย่อย, จมน้ำ, สูดควันหรือก๊าซพิษ, lung contusion\n- *Indirect*: **sepsis จากนอกปอด**, ตับอ่อนอักเสบ, trauma รุนแรงหรือ multiple transfusion (TRALI), ไฟไหม้, ยาเกินขนาด\n\n### 2. นิยาม (Berlin 2012 ปรับตาม Global definition 2023)\n- เกิดภายใน **1 สัปดาห์** หลังสิ่งกระตุ้นหรืออาการหายใจแย่ลง\n- **ภาพรังสีมี bilateral opacities** ที่อธิบายไม่ได้ด้วย effusion, ปอดแฟบ หรือก้อน (Global definition ยอมรับ lung ultrasound)\n- ภาวะหายใจล้มเหลวที่อธิบายไม่ได้ทั้งหมดด้วยหัวใจล้มเหลวหรือน้ำเกิน (ถ้าไม่มีปัจจัยเสี่ยงชัดเจนต้องทำ echo)\n- Oxygenation ขณะ PEEP หรือ CPAP ≥5 cmH2O:\n\n| ความรุนแรง | PaO2/FiO2 |\n|---|---|\n| Mild | 201–300 |\n| Moderate | 101–200 |\n| Severe | ≤100 |\n\nGlobal definition 2023 เพิ่มให้ใช้ SpO2/FiO2 ≤315 (เมื่อ SpO2 ≤97%) และรวมผู้ป่วยที่ยังไม่ใส่ท่อซึ่งใช้ high-flow nasal cannula ≥30 L/min ได้\nตัวอย่าง: PaO2/FiO2 110 บน FiO2 0.8 = moderate ARDS ถ้าผู้ป่วยเริ่มหอบเหนื่อยล้า ไม่ควรรอ ต้อง **ใส่ท่อช่วยหายใจ** แล้วใช้ lung-protective ventilation (การใช้ NIV ใน ARDS ปานกลางถึงรุนแรงล้มเหลวบ่อยและทำให้ใส่ท่อช้า)\n\n### 3. Lung-protective ventilation — การรักษาเดียวที่ลดการตายชัดเจนตั้งแต่แรก\nเหตุผล: ปอด ARDS มีส่วนที่รับลมได้น้อย ถ้าให้ tidal volume แบบปกติ (10–12 mL/kg) ถุงลมที่ดีจะถูกยืดเกิน (volutrauma) และถุงลมที่เปิดปิดซ้ำ ๆ จะบาดเจ็บ (atelectrauma) ปลดปล่อย cytokine (biotrauma) ทำให้อวัยวะอื่นล้มเหลวตาม เรียกรวมว่า ventilator-induced lung injury (VILI)\n- **Tidal volume 6 mL/kg ของ predicted body weight (PBW)** (ช่วง 4–8) ไม่ใช่น้ำหนักจริง\n- PBW ชาย = 50 + 0.91 × (ส่วนสูง cm − 152.4); หญิง = 45.5 + 0.91 × (ส่วนสูง cm − 152.4) เช่น ชายสูง 170 cm PBW ≈ 66 kg → Vt ≈ 400 mL\n- **Plateau pressure ≤30 cmH2O** (วัดด้วย inspiratory hold) ถ้าเกินให้ลด Vt ลงได้ถึง 4 mL/kg\n- **Driving pressure (Pplat − PEEP) <15 cmH2O** สัมพันธ์กับอัตราตายต่ำกว่า\n- **PEEP ที่เพียงพอ** เพื่อเปิดถุงลมค้างไว้ ARDS ปานกลางถึงรุนแรงใช้ PEEP สูงกว่า (ตามตาราง PEEP/FiO2 ของ ARDSNet)\n- เป้า oxygenation: SpO2 88–95% หรือ PaO2 55–80 mmHg\n- **Permissive hypercapnia**: ยอมให้ PaCO2 สูงขึ้น ตราบที่ pH ≥7.20–7.25 (ห้ามในความดันในสมองสูง)\n- หลักฐาน: ARDSNet ARMA trial (2000) Vt 6 เทียบกับ 12 mL/kg ลดการตายจาก ~40% เหลือ ~31%\n\n### 4. การรักษาเสริมตามความรุนแรง (ATS 2024)\n- **Prone position ≥12–16 ชั่วโมงต่อวัน** ใน ARDS รุนแรง (PaO2/FiO2 <150) ลดการตาย (PROSEVA)\n- Neuromuscular blocker ระยะสั้นในช่วงแรกของ ARDS รุนแรงที่ยังต้านเครื่อง (conditional)\n- Corticosteroid: ATS 2024 แนะนำแบบมีเงื่อนไขให้พิจารณาใน ARDS\n- **Conservative fluid strategy** เมื่อพ้นภาวะช็อกแล้ว (ลดวันใช้เครื่องช่วยหายใจ)\n- VV-ECMO ในรายรุนแรงที่ดื้อต่อการรักษาข้างต้น ในศูนย์ที่มีความพร้อม\n- **ไม่แนะนำ**: recruitment maneuver ความดันสูงนาน ๆ (ART trial เพิ่มการตาย) และ high-frequency oscillation เป็นประจำ (OSCILLATE เพิ่มการตาย)\n- รักษาสาเหตุ (ยาฆ่าเชื้อ ควบคุมแหล่งติดเชื้อ) และป้องกันภาวะแทรกซ้อน: ยกหัวเตียง 30–45 องศา, sedation ให้น้อยที่สุด, ทดลองหายใจเอง (SBT) ทุกวัน, ป้องกัน DVT และแผลกดทับ", "pearls": ["ARDS = ภายใน 1 สัปดาห์ + bilateral opacities + ไม่ใช่หัวใจ/น้ำเกิน + PaO2/FiO2 ≤300 บน PEEP ≥5", "Mild 201–300, moderate 101–200, severe ≤100", "Lung-protective: Vt 6 mL/kg ของ predicted body weight, Pplat ≤30, driving pressure <15, PEEP พอเพียง", "Permissive hypercapnia ได้ถ้า pH ≥7.20–7.25", "ARDS รุนแรง P/F <150 → prone ≥12–16 ชม./วัน ลดการตาย"], "traps": [], "q": [{"id": "PP31-CHE-051", "q": "A 50-year-old man with severe pneumonia develops acute respiratory distress syndrome; PaO2/FiO2 is 110 on FiO2 0.8 with bilateral infiltrates, and he is tiring. Which ventilatory strategy is most appropriate?", "a": "Intubation and lung-protective ventilation with tidal volume 6 mL/kg predicted body weight, plateau pressure ≤30 cmH2O and adequate PEEP", "y": [31], "t": 111}, {"id": "PP31-CHE-016", "q": "A mechanically ventilated patient has acute respiratory distress syndrome. Which ventilator strategy has been shown to reduce mortality?", "a": "Low tidal volume (about 6 mL/kg predicted body weight) with plateau pressure ≤30 cmH2O and adequate PEEP", "y": [31], "t": 111}], "years": [31], "th": [111]}, {"id": "gap-chest-05", "set": "chest", "title": "มะเร็งปอด: น้ำในเยื่อหุ้มปอดจากมะเร็ง ระยะโรค SVC syndrome และมะเร็งที่สัมพันธ์บุหรี่", "subtitle": "Light's criteria → malignant effusion = M1a stage IV, สาเหตุ SVC syndrome (NSCLC, SCLC, lymphoma, thymoma)", "md": "### 1. Pleural effusion: แยก transudate กับ exudate ด้วย Light's criteria\nน้ำในช่องเยื่อหุ้มปอดเกิดจากสมดุลแรง Starling เสีย (transudate: เยื่อหุ้มปกติ แต่ความดันใน capillary สูงหรือ oncotic pressure ต่ำ) หรือเยื่อหุ้มปอดอักเสบหรือมีเนื้องอก ทำให้ผนังรั่วหรือท่อน้ำเหลืองอุดตัน (exudate: โปรตีนสูง)\n\n**Light's criteria — เป็น exudate ถ้ามีข้อใดข้อหนึ่ง**\n- pleural protein / serum protein **>0.5**\n- pleural LDH / serum LDH **>0.6**\n- pleural LDH **>2/3 ของค่าสูงสุดปกติของ serum LDH**\n\nLight's criteria ไวต่อ exudate มาก แต่ผู้ป่วยหัวใจล้มเหลวที่ได้ diuretic อาจถูกจัดเป็น exudate ผิด ๆ (~25%) ให้ใช้ **serum − pleural albumin gradient >1.2 g/dL** (หรือ protein gradient >3.1 g/dL) ยืนยันว่าเป็น transudate\n\n| ชนิด | สาเหตุ |\n|---|---|\n| Transudate | **หัวใจล้มเหลว (พบบ่อยที่สุดโดยรวม)**, ตับแข็ง (hepatic hydrothorax มักขวา), nephrotic syndrome, albumin ต่ำ, peritoneal dialysis, hypothyroid |\n| Exudate | parapneumonic/empyema (exudate ที่พบบ่อยที่สุด), **วัณโรค** (ในไทยพบบ่อย: lymphocyte เด่น ADA >40 U/L mesothelial cell น้อย), **มะเร็ง** (ปอด, เต้านม, lymphoma, mesothelioma), PE, ตับอ่อนอักเสบ (amylase สูง มักซ้าย), RA (glucose ต่ำมาก), SLE, chylothorax (TG >110 mg/dL), หลอดอาหารทะลุ (amylase สูง pH ต่ำ) |\n\nเบาะแสเพิ่มเติม: glucose <60 mg/dL พบใน empyema, RA, TB, มะเร็ง, หลอดอาหารทะลุ; pH <7.2 ใน parapneumonic effusion = complicated ต้องใส่สายระบาย; น้ำเป็นเลือดนึกถึงมะเร็ง PE หรือบาดเจ็บ **Cytology** วินิจฉัยมะเร็งได้ราว 60% (เจาะซ้ำได้ครั้งที่สองแล้วจึงเพิ่มขึ้นเล็กน้อย) ถ้ายังไม่ได้ผลให้ทำ thoracoscopic pleural biopsy\n\n### 2. Malignant pleural effusion ในมะเร็งปอด = ระยะ IV\nผู้ป่วยสูบบุหรี่จัด มี pleural effusion ขนาดใหญ่ น้ำเป็น exudate cytology หรือ pleural biopsy พบ **adenocarcinoma** AFB และเพาะเชื้อลบ ไม่มีการกระจายไปต่อมหมวกไตหรือตับ → **NSCLC (adenocarcinoma) with malignant pleural effusion = M1a = stage IVA** (TNM 8th และ 9th edition ซึ่งใช้ตั้งแต่ปี 2025)\n\n| M category | ความหมาย | Stage |\n|---|---|---|\n| **M1a** | **malignant pleural หรือ pericardial effusion**, ก้อนที่เยื่อหุ้มปอดหรือเยื่อหุ้มหัวใจ, ก้อนแยกในปอดอีกข้าง | IVA |\n| M1b | แพร่กระจายนอกทรวงอก 1 ตำแหน่งในอวัยวะเดียว | IVA |\n| M1c | แพร่กระจายนอกทรวงอกหลายตำแหน่ง (9th: M1c1 ระบบอวัยวะเดียว, M1c2 หลายระบบ) | IVB |\n\nความหมายทางคลินิก: เป็นโรคระยะแพร่กระจาย **ไม่ผ่าตัดเพื่อหายขาด** รักษาด้วยยาทั้งร่างกาย ต้องส่งตรวจ molecular ทุกรายของ non-squamous NSCLC (EGFR พบราวครึ่งหนึ่งของ adenocarcinoma ในคนไทย โดยเฉพาะหญิงที่ไม่สูบบุหรี่ → osimertinib; ALK, ROS1, KRAS G12C, BRAF, MET, RET, NTRK, HER2) และ PD-L1 เพื่อเลือก immunotherapy ส่วนน้ำที่กลับมาซ้ำ จัดการด้วยเจาะระบาย, **talc pleurodesis** หรือ **indwelling pleural catheter**\n\nชนิดของมะเร็งปอดที่ควรจำ\n- **Adenocarcinoma**: พบบ่อยที่สุด อยู่ส่วนปลายปอด เกิดในคนไม่สูบบุหรี่และผู้หญิงได้มาก\n- **Squamous cell carcinoma**: อยู่ส่วนกลาง สัมพันธ์บุหรี่มาก เกิดโพรงได้ hypercalcemia จาก PTHrP\n- **Small cell carcinoma**: อยู่ส่วนกลาง สัมพันธ์บุหรี่มากที่สุด โตเร็ว แพร่กระจายเร็ว SIADH, ectopic ACTH, Lambert–Eaton\n- Large cell: ส่วนปลาย พยากรณ์ไม่ดี\n\n### 3. SVC syndrome\n**กลไก**: superior vena cava ผนังบาง ความดันต่ำ จึงถูกกดหรืออุดตันง่ายจากก้อนใน mediastinum ด้านหน้าและด้านขวา หรือจากลิ่มเลือด เลือดดำจากศีรษะ คอ และแขนกลับหัวใจไม่ได้ ความดันหลอดเลือดดำส่วนบนสูง และเกิดทางเบี่ยง (collateral) ผ่าน azygos และผนังอก\n**อาการ**: หน้าบวมแดง (facial plethora) คอบวม แขนบวม หลอดเลือดดำที่คอโป่งไม่ยุบตามการหายใจ เส้นเลือดดำที่ผนังอกขยาย เหนื่อย ไอ เสียงแหบ ปวดศีรษะ อาการแย่ลงเมื่อก้มตัวหรือนอนราบ Pemberton sign (ยกแขนสองข้างแล้วหน้าแดงคั่ง) อาการอันตรายคือ **stridor จากกล่องเสียงบวม** และ **สับสนหรือซึมจากสมองบวม**\n\n**สาเหตุ**\n- **มะเร็ง (~60–85%)**: **มะเร็งปอดพบบ่อยที่สุด** (NSCLC ~50%, SCLC ~25% ของผู้ป่วย SVC syndrome จากมะเร็ง แต่ถ้าคิดเป็นสัดส่วนในมะเร็งแต่ละชนิด SCLC เกิด SVC syndrome บ่อยกว่า ราว 10% เพราะอยู่ส่วนกลางใกล้ mediastinum), **non-Hodgkin lymphoma** (~10%), **thymoma/thymic carcinoma**, germ cell tumor, มะเร็งแพร่กระจาย (เต้านม)\n- ไม่ใช่มะเร็งและพบมากขึ้น: **ลิ่มเลือดจากสายสวนหลอดเลือดดำใหญ่** (central line, port, สาย pacemaker, สายฟอกไต), fibrosing mediastinitis (วัณโรค histoplasmosis), goiter ลงทรวงอก\n- จำก้อน anterior mediastinum \"4T\": thymoma, teratoma (germ cell), thyroid, \"terrible\" lymphoma; thymoma สัมพันธ์กับ myasthenia gravis (~30–50%), pure red cell aplasia, hypogammaglobulinemia\n\n**วินิจฉัยและรักษา**\n- CT ทรวงอกฉีดสารทึบรังสีบอกตำแหน่งการอุดและสาเหตุ\n- **ต้องได้ชิ้นเนื้อวินิจฉัยก่อนให้ steroid หรือฉายรังสี** เพราะ steroid และรังสีทำให้อ่านชิ้นเนื้อ lymphoma ไม่ได้ ยกเว้นมีภาวะคุกคามชีวิต (stridor, สมองบวม)\n- ทั่วไป: นอนหัวสูง ให้ออกซิเจน\n- อาการรุนแรง: **ใส่ stent ผ่านหลอดเลือด (endovascular stenting)** บรรเทาอาการเร็วที่สุด\n- รักษาตามสาเหตุ: เคมีบำบัดใน SCLC, lymphoma และ germ cell tumor ซึ่งตอบสนองต่อยาดี, ฉายรังสีใน NSCLC, steroid ใน lymphoma/thymoma หรือเมื่อทางเดินหายใจบวม, ถ้าเป็นลิ่มเลือดให้ anticoagulant และพิจารณาถอดสาย\n\n### 4. มะเร็งที่สัมพันธ์กับบุหรี่\n- **สัมพันธ์มาก**: มะเร็งปอด (โดยเฉพาะ small cell และ squamous), กล่องเสียง, ช่องปากและคอหอย, **หลอดอาหารชนิด squamous**, **กระเพาะปัสสาวะ (urothelial)**, ไต (renal cell), ตับอ่อน\n- สัมพันธ์ปานกลาง: กระเพาะอาหาร, ตับ, ปากมดลูก, ลำไส้ใหญ่, AML\n- **สัมพันธ์น้อยที่สุดในตัวเลือกที่ออกสอบ: มะเร็งเต้านม** (หลักฐานความสัมพันธ์อ่อนมาก ปัจจัยหลักคือฮอร์โมนและพันธุกรรม) รวมถึงมะเร็งต่อมลูกหมาก ส่วนมะเร็งเยื่อบุโพรงมดลูกพบน้อยลงในคนสูบบุหรี่ด้วยซ้ำ", "pearls": ["Light's: exudate ถ้า protein ratio >0.5 หรือ LDH ratio >0.6 หรือ pleural LDH >2/3 ULN ของ serum", "Malignant pleural effusion ในมะเร็งปอด = M1a = stage IVA → ไม่ผ่าตัด ส่งตรวจ EGFR/ALK/PD-L1", "SVC syndrome: สาเหตุอันดับหนึ่งคือมะเร็งปอด รองลงมาคือ lymphoma; ต้องได้ชิ้นเนื้อก่อนให้ steroid/RT", "Anterior mediastinal mass 4T: thymoma, teratoma, thyroid, lymphoma; thymoma ร่วมกับ myasthenia gravis", "มะเร็งที่สัมพันธ์บุหรี่น้อยที่สุดในตัวเลือก = มะเร็งเต้านม"], "traps": [], "q": [{"id": "PP29-CHE-044", "q": "A 62-year-old heavy smoker has a large right pleural effusion. Pleural fluid is an exudate, cytology and pleural biopsy show adenocarcinoma, AFB and cultures are negative, and there are no adrenal or liver metastases. What is the diagnosis and stage?", "a": "Non-small cell lung carcinoma (adenocarcinoma) with malignant pleural effusion, stage IV (M1a)", "y": [29], "t": 105}, {"id": "CH-OLD-42", "q": "Which of the following malignancies is LEAST associated with cigarette smoking?", "a": "Breast cancer", "y": [31, 33, 35], "t": 114}], "years": [29, 31, 33, 35], "th": []}], "left": []}, {"set": "air", "name": "AIR", "n_lec": 91, "n_unc": 4, "lectures": [{"lec": "08", "title": "Allergy and clinical immunology", "n": 24, "angle": {"mech": 5, "mx": 7, "fact": 4, "dx": 5, "ix": 3}, "pattern": "ข้อสอบเน้น vignette สั้นให้ระบุชนิดปฏิกิริยา (transfusion reaction, SJS) แล้วต่อด้วยการป้องกัน/ตรวจก่อนให้ยา (leukoreduced blood, HLA-B*58:01/15:02) เป็นหลัก ออกต่อเนื่องรุ่น 30–35 และวนโจทย์เดิมซ้ำ (allopurinol-SJS ออก 3 รุ่นติด) ส่วน immune cytopenia ถามมุม 'ส่งอะไรหาสาเหตุ' นอกจากนี้ anaphylaxis (type I, adrenaline IM, auto-injector) ออกเกือบทุกรุ่น 31–35 ทั้งในชุดนี้และในคาบ Shock", "tip": "ท่องตารางแยก transfusion reaction ตามเวลา/อาการพร้อมวิธีป้องกัน และคู่ยา–HLA ให้แม่น; ทบทวน ANA/HIV/HCV ใน ITP/AIHA และหลักวัคซีนเชื้อเป็นห้ามในคนกดภูมิ", "secs": [{"t": "ภูมิไวเกิน 4 ชนิด (Gell & Coombs)", "n": 3, "y": [31, 33, 34], "w": "ลมพิษ/anaphylaxis จากยา ผึ้งต่อย อาหาร = type I (IgE) hypersensitivity ถามซ้ำรุ่น 31, 33, 34", "c": null, "s": ["urticaria = type I IgE", "bee sting = type I IgE"], "q": [{"q": "A 32-year-old man develops generalized itchy wheals within 30 minutes of taking an oral antibiotic. The lesions blanch on pressure and each individual wheal disappears within a few hours. Which type of hypersensitivity reaction is this?", "a": "Type I (IgE-mediated immediate hypersensitivity)", "y": [33], "an": "mech", "sub": "urticaria = type I IgE", "t": 11}, {"q": "Allergen-induced urticaria is mediated by which type of hypersensitivity reaction?", "a": "Type I (IgE-mediated immediate hypersensitivity)", "y": [34], "an": "mech", "sub": "urticaria = type I IgE", "t": 11}, {"q": "A 17-year-old boy develops generalised urticaria and wheezing within 15 minutes of a bee sting. Which type of hypersensitivity reaction is responsible?", "a": "Type I (IgE-mediated immediate) hypersensitivity", "y": [31], "an": "mech", "sub": "bee sting = type I IgE", "t": 11}]}, {"t": "Anaphylaxis — รู้ให้เร็ว ฉีดให้ถูกที่", "n": 3, "y": [33, 34], "w": "Anaphylaxis: adrenaline 0.3–0.5 mg IM ทันที และสั่ง adrenaline auto-injector พร้อมสอนก่อนกลับบ้าน (รุ่น 33, 34)", "c": null, "s": ["พก adrenaline auto-injector", "adrenaline 0.3–0.5 mg IM"], "q": [{"q": "A patient who survived anaphylactic shock from a bee sting is being discharged. Which of the following is the most appropriate advice?", "a": "Carry an adrenaline auto-injector at all times and use it immediately when symptoms begin", "y": [33], "an": "mx", "sub": "พก adrenaline auto-injector", "t": 11}, {"q": "A 28-year-old woman develops itching, generalized flushing, wheezing and hypotension 15 minutes after eating at a restaurant. Which is the most appropriate first drug and route?", "a": "Adrenaline 0.3-0.5 mg intramuscularly", "y": [33], "an": "mx", "sub": "adrenaline 0.3–0.5 mg IM", "t": 11}, {"q": "A patient has recovered from anaphylactic shock and is being discharged. Which is the most appropriate management to arrange at discharge?", "a": "Prescribe an adrenaline (epinephrine) auto-injector and teach the patient to self-inject", "y": [34], "an": "mx", "sub": "พก adrenaline auto-injector", "t": 11}]}, {"t": "ลมพิษและ angioedema", "n": 2, "y": [31, 35], "w": "นิยาม chronic urticaria ≥ 6 สัปดาห์", "c": null, "s": ["mast cell degranulation, histamine", "CSU นิยาม > 6 สัปดาห์"], "q": [{"q": "A patient with an allergic reaction develops generalised swelling with itchy weals (urticaria and angio-oedema). Which mechanism is responsible?", "a": "Mast cell degranulation with histamine release", "y": [31], "an": "mech", "sub": "mast cell degranulation, histamine", "t": 11}, {"q": "Urticaria is classified as chronic when recurrent wheals have been present for at least how long?", "a": "6 weeks", "y": [35], "an": "fact", "sub": "CSU นิยาม > 6 สัปดาห์", "t": 176}]}, {"t": "แพ้ยารุนแรงทางผิวหนัง — SJS/TEN, DRESS และ HLA", "n": 5, "y": [32, 33, 34], "w": "SJS จาก allopurinol (mucosa ≥2 แห่ง, BSA <10%) และ HLA-B*58:01 ก่อน allopurinol / HLA-B*15:02 ก่อน carbamazepine — ถามซ้ำ 3 รุ่น (32–34)", "c": null, "s": ["HLA-B*58:01 ก่อนให้ allopurinol", "SJS (<10% BSA) vs TEN — แยกตาม %BSA", "SJS จาก allopurinol + mucosal erosion", "HLA-B*15:02 ก่อนให้ carbamazepine"], "q": [{"q": "A patient develops Stevens-Johnson syndrome after receiving allopurinol. Testing for which allele would have identified the risk before prescribing?", "a": "HLA-B*58:01", "y": [33], "an": "fact", "sub": "HLA-B*58:01 ก่อนให้ allopurinol", "t": 164}, {"q": "A patient taking allopurinol develops a widespread painful rash with erosions of the lips, oral mucosa and conjunctivae, with skin detachment of about 8% of body surface area. What is the diagnosis?", "a": "Stevens-Johnson syndrome", "y": [33], "an": "dx", "sub": "SJS (<10% BSA) vs TEN — แยกตาม %BSA", "t": 164}, {"q": "A patient presents with Stevens-Johnson syndrome. He had recently been started on allopurinol without any pharmacogenetic testing beforehand. Which allele should have been tested before the drug was prescribed?", "a": "HLA-B*58:01", "y": [34], "an": "fact", "sub": "HLA-B*58:01 ก่อนให้ allopurinol", "t": 164}, {"q": "A patient who recently started allopurinol develops a drug eruption with erosions involving the mucosa (oral and ocular). Which adverse drug reaction is this?", "a": "Stevens–Johnson syndrome (SJS)", "y": [34], "an": "dx", "sub": "SJS จาก allopurinol + mucosal erosion", "t": 164}, {"q": "Before starting carbamazepine in a Thai patient, which genetic test is recommended to reduce the risk of Stevens-Johnson syndrome/toxic epidermal necrolysis?", "a": "HLA-B*15:02", "y": [32], "an": "ix", "sub": "HLA-B*15:02 ก่อนให้ carbamazepine", "t": 164}]}, {"t": "ประเมินประวัติแพ้ยา และการ de-label penicillin", "n": 0, "y": [], "w": null, "c": "De-label penicillin เป็นเนื้อหาใหม่ ยังไม่เคยออก", "s": [], "q": []}, {"t": "ปฏิกิริยาจากการให้เลือด", "n": 6, "y": [30, 33, 34], "w": "แยกชนิด transfusion reaction จากเวลา+อาการ: ลมพิษล้วน 15 นาที = allergic, ไข้หนาวสั่นไม่มีปัสสาวะสีเข้ม = FNHTR (cytokine จาก donor WBC → ใช้ leukoreduced blood), HF หอบหลังให้เลือด = TACO → furosemide; ออกรุ่น 30/33/34", "c": null, "s": ["Allergic (urticarial) transfusion reaction", "FNHTR → ใช้ leukoreduced blood", "FNHTR: ไข้ไม่มีปัสสาวะสีเข้ม", "Allergic transfusion reaction"], "q": [{"q": "Fifteen minutes after a packed red cell transfusion is started, a patient develops itchy urticarial wheals only, with no fever, no hypotension and normal urine colour. What is the most likely type of reaction?", "a": "Allergic transfusion reaction", "y": [33], "an": "dx", "sub": "Allergic (urticarial) transfusion reaction", "t": 165}, {"q": "A patient develops fever and chills 2 hours into a red cell transfusion. Urine colour is normal, blood pressure is stable and there is no flank pain. What is the most likely diagnosis and the measure to prevent recurrence?", "a": "Febrile non-hemolytic reaction; use leukoreduced blood", "y": [33], "an": "mx", "sub": "FNHTR → ใช้ leukoreduced blood", "t": 165}, {"q": "A patient develops fever during a blood transfusion but has no dark urine. What is the most likely transfusion reaction?", "a": "Febrile non-haemolytic transfusion reaction", "y": [34], "an": "dx", "sub": "FNHTR: ไข้ไม่มีปัสสาวะสีเข้ม", "t": 165}, {"q": "About 15 minutes into a blood transfusion the patient develops a rash. Which transfusion reaction is this?", "a": "Allergic (urticarial) transfusion reaction", "y": [33], "an": "dx", "sub": "Allergic transfusion reaction", "t": 165}, {"q": "A patient develops a temperature rise of more than 1°C with chills about 2 hours into a packed red cell transfusion. There is no haemoglobinuria, no fall in haemoglobin and the direct antiglobulin test is negative. What is the mechanism of this acute febrile non-haemolytic transfusion reaction?", "a": "Cytokines (IL-1, IL-6, TNF-alpha) released from donor leucocytes and accumulated in the stored component, together with recipient antibodies against donor leucocyte/HLA antigens", "y": [30], "an": "mech", "sub": "FNHTR: cytokine จาก donor leukocyte", "t": 165}, {"q": "A patient with heart failure and chronic anaemia becomes dyspnoeic soon after receiving a red cell transfusion. What is the appropriate management?", "a": "Give intravenous furosemide and stop/slow the transfusion", "y": [34], "an": "mx", "sub": "TACO → furosemide + หยุด/ชะลอเลือด", "t": 165}]}, {"t": "ภูมิคุ้มกันทำลายเม็ดเลือดตัวเอง — AIHA และ ITP", "n": 3, "y": [33, 34, 35], "w": "AIHA (spherocyte + DAT บวก) หรือ ITP → ส่ง ANA, anti-HIV, anti-HCV หาสาเหตุทุติยภูมิ; HIV-ITP ไม่เลือดออก → เริ่ม ART", "c": null, "s": ["AIHA → หา SLE (ANA)", "HIV-associated ITP → เริ่ม ART", "ITP → คัดกรอง ANA/HIV/HCV"], "q": [{"q": "A 25-year-old woman has anemia and jaundice. Blood smear shows spherocytes and polychromasia; direct Coombs test is positive. Which additional investigation should be sent to look for an underlying cause?", "a": "Antinuclear antibody", "y": [33], "an": "ix", "sub": "AIHA → หา SLE (ANA)", "t": 166}, {"q": "A newly diagnosed HIV-positive man has isolated thrombocytopenia (platelet 80,000/mm3) with normal hemoglobin and white cell count, and no bleeding. What is the most appropriate management?", "a": "Start antiretroviral therapy and monitor the platelet count", "y": [34], "an": "mx", "sub": "HIV-associated ITP → เริ่ม ART", "t": 166}, {"q": "A young woman presents with easy bruising for 1 week. CBC shows isolated thrombocytopenia with giant platelets on smear; hemoglobin and white cells are normal. Besides a bone marrow study if indicated, which screening tests are most appropriate to look for secondary causes?", "a": "ANA, anti-HIV and anti-HCV", "y": [35], "an": "ix", "sub": "ITP → คัดกรอง ANA/HIV/HCV", "t": 166}]}, {"t": "ผู้ป่วยที่ได้ยากดภูมิคุ้มกัน — วัคซีนและการติดเชื้อฉวยโอกาส", "n": 2, "y": [31, 34], "w": "วัคซีนในคนกดภูมิ: live varicella ห้ามในคนกิน pred 30 mg; ให้วัคซีนเชื้อตาย/mRNA (COVID) ได้ขณะได้ cyclophosphamide", "c": null, "s": ["วัคซีนเชื้อเป็นห้ามในคนกิน pred ≥20 mg", "วัคซีนเชื้อตายให้ได้ขณะกดภูมิ"], "q": [{"q": "A patient on long-term prednisolone 30 mg daily for lupus nephritis asks about vaccination. Which vaccine is contraindicated?", "a": "Live attenuated varicella vaccine", "y": [34], "an": "fact", "sub": "วัคซีนเชื้อเป็นห้ามในคนกิน pred ≥20 mg", "t": 167}, {"q": "A patient with SLE is currently being treated with cyclophosphamide. Which vaccine can be recommended during this period?", "a": "COVID-19 vaccine (non-live: mRNA or inactivated)", "y": [31], "an": "mx", "sub": "วัคซีนเชื้อตายให้ได้ขณะกดภูมิ", "t": 167}]}, {"t": "เมื่อไรต้องคิดถึงภูมิคุ้มกันบกพร่องปฐมภูมิในผู้ใหญ่", "n": 0, "y": [], "w": null, "c": "Primary immunodeficiency/CVID ในผู้ใหญ่ ไม่เคยถาม — ผ่านเร็วได้", "s": [], "q": []}], "th": [11, 176, 164, 165, 166]}, {"lec": "23", "title": "Approach to arthritis / crystal and infective arthropathy", "n": 30, "angle": {"dx": 7, "interp": 6, "mx": 8, "fact": 5, "mech": 2, "ix": 2}, "pattern": "ข้อสอบบทนี้แบ่งเป็นสองก้อน: septic/gonococcal arthritis (เลือกยา ระยะเวลา ซักประวัติเพศสัมพันธ์) และผลึก — เกาต์ถามยาช่วงกำเริบตามโรคร่วม (แผลในกระเพาะ → colchicine, CKD → prednisolone, ESRD → ฉีดเข้าข้อ, ไตปกติ → NSAID) และอ่านผลึก needle vs rhomboid ส่วน OA/RA/PsA เป็น spot diagnosis จาก vignette การกระจายข้อ", "tip": "ท่องตาราง 'เกาต์กำเริบ + โรคร่วม → ยาอะไร' ข้อบ่งชี้เริ่มยาลดกรดยูริก และรูปผลึก/การหักเหแสงให้แม่น จำเชื้อ–ยาใน septic arthritis และภาพ DGI แล้วฝึกแยก OA vs RA vs PsA จากข้อที่จับ (DIP/MCP)", "secs": [{"t": "I-I-N-O-D-E — กรอบเข้าหาผู้ป่วยปวดข้อของ อ.กิตติวรรณ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "รูปแบบข้อบอกโรค — ต้นไม้ DDx ของสไลด์ และ RA vs OA vs SpA vs crystal vs septic", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "เข้าหาอาการปวดข้ออย่างเป็นระบบ และการแปลผลน้ำไขข้อ", "n": 3, "y": [30, 33, 35], "w": "แปลผลน้ำไขข้อ: ใส หนืด WBC <2,000 = non-inflammatory (OA); ข้ออักเสบเฉียบพลันในคนหนุ่มต้องซักประวัติเพศสัมพันธ์", "c": null, "s": ["ข้ออักเสบเฉียบพลันคนหนุ่ม → ซักเพศสัมพันธ์", "น้ำไขข้อ non-inflammatory (WBC<2,000)", "น้ำไขข้อ: OA ไม่ขุ่นเป็นหนอง"], "q": [{"q": "A 45-year-old man presents with acute arthritis. Which of the following history items is most important to obtain?", "a": "Sexual history and recent infection", "y": [33], "an": "dx", "sub": "ข้ออักเสบเฉียบพลันคนหนุ่ม → ซักเพศสัมพันธ์", "t": 170}, {"q": "Knee aspiration in a 68-year-old woman with chronic knee pain yields clear, viscous fluid with WBC 500 cells/mm3 and no growth on culture. What is the most likely diagnosis?", "a": "Osteoarthritis (non-inflammatory effusion)", "y": [30], "an": "interp", "sub": "น้ำไขข้อ non-inflammatory (WBC<2,000)", "t": 178}, {"q": "Arthrocentesis is performed on a knee with osteoarthritis and effusion. Which synovial fluid finding would NOT be expected?", "a": "Turbid, purulent fluid with WBC 80,000/µL", "y": [35], "an": "interp", "sub": "น้ำไขข้อ: OA ไม่ขุ่นเป็นหนอง", "t": 178}]}, {"t": "เกาต์เฉียบพลัน — ผลึกและการรักษาช่วงกำเริบ", "n": 5, "y": [31, 32, 33, 35], "w": null, "c": null, "s": ["gout flare + CKD + PU → prednisolone", "ผลึกเข็ม negative = gout", "gout flare + PU → colchicine", "ESRD → steroid ฉีดเข้าข้อ"], "q": [{"q": "Which drug is most appropriate for an acute gout flare in a patient with CKD stage 3 and peptic ulcer disease?", "a": "Oral prednisolone", "y": [32], "an": "mx", "sub": "gout flare + CKD + PU → prednisolone", "t": 68}, {"q": "A 50-year-old man with acute pain of the first metatarsophalangeal joint has synovial fluid showing needle-shaped, strongly negatively birefringent crystals. What is the diagnosis?", "a": "Acute gouty arthritis", "y": [35], "an": "interp", "sub": "ผลึกเข็ม negative = gout", "t": 68}, {"q": "Which drug is the most appropriate first-line treatment for an acute gout flare in a patient with peptic ulcer disease?", "a": "Colchicine", "y": [33], "an": "mx", "sub": "gout flare + PU → colchicine", "t": 68}, {"q": "A 40-year-old man with end-stage renal disease, hypertension and diabetes has acute gout of the right ankle confirmed by negatively birefringent needle-shaped crystals; Gram stain is negative. Which treatment is most appropriate?", "a": "Intra-articular corticosteroid injection", "y": [], "an": "mx", "sub": "ESRD → steroid ฉีดเข้าข้อ", "t": 68}, {"q": "A 45-year-old man with normal renal function has acute pain and swelling of the right first metatarsophalangeal joint after a night of drinking beer. Synovial fluid shows needle-shaped crystals with strong negative birefringence. Which treatment is most appropriate now?", "a": "A full-dose NSAID such as ibuprofen or naproxen", "y": [31], "an": "mx", "sub": "ไตปกติ → NSAID เต็มขนาด", "t": 68}]}, {"t": "เจาะข้อไม่ได้ — clinical prediction rule ของเกาต์ และภาพรังสี อัลตราซาวนด์ DECT", "n": 1, "y": [32], "w": null, "c": null, "s": ["punched-out erosion overhanging edge"], "q": [{"q": "Which radiographic finding is most characteristic of long-standing tophaceous gout?", "a": "Punched-out erosion with sclerotic margin and overhanging edge, with preserved joint space", "y": [32], "an": "interp", "sub": "punched-out erosion overhanging edge", "t": 68}]}, {"t": "เกาต์ระยะยาว — ยาลดกรดยูริก เป้าหมาย และกับดัก", "n": 1, "y": [32, 34], "w": null, "c": null, "s": ["ข้อบ่งชี้เริ่ม ULT"], "q": [{"q": "Which of the following is an indication to start urate-lowering therapy?", "a": "Presence of tophi or two or more gout flares per year", "y": [32, 34], "an": "fact", "sub": "ข้อบ่งชี้เริ่ม ULT", "t": 68}]}, {"t": "ผลึก 6 ชนิดในน้ำไขข้อ — รูปร่าง การหักเหแส
