เป็นสไลด์ใหม่ 2570 ยังไม่ออก — น่าออก", "s": [], "q": []}, {"t": "Transaminase สูงเล็กน้อยเรื้อรัง: ไล่หาสาเหตุ · AIH · Wilson", "n": 1, "y": [34], "w": null, "c": null, "s": ["ขั้นตอนเมื่อ LFT สูงเล็กน้อย: ตรวจไวรัส"], "q": [{"q": "A patient is found to have mildly elevated AST and ALT, with ALT higher than AST. Which investigation should be sent next?", "a": "Anti-HAV and HBsAg (viral hepatitis serology)", "y": [34], "an": "ix", "sub": "ขั้นตอนเมื่อ LFT สูงเล็กน้อย: ตรวจไวรัส", "t": 224}]}, {"t": "สไลด์ 2570: เคส ALT สูงเล็กน้อยจาก MASLD และ AIH ที่ globulin 6", "n": 0, "y": [], "w": null, "c": "เคส MASLD และ AIH globulin สูง สไลด์ใหม่ ยังไม่ออก", "s": [], "q": []}, {"t": "สไลด์ 2570: Acute liver failure จาก Wilson disease — case challenge", "n": 0, "y": [], "w": null, "c": "Wilson ALF: AST/ALT > 2.2, ALP/TB < 4 สไลด์ใหม่ เน้น 'จำ' แต่ยังไม่ออก", "s": [], "q": []}, {"t": "Cholestasis: อุดตันทางกล vs ทางยา (medical) · PBC · sepsis", "n": 1, "y": [32], "w": "เหลือง + ALP สูงมาก → obstructive jaundice", "c": null, "s": ["เบาะแสว่าเป็นการอุดตัน: ALP สูง"], "q": [{"q": "A patient presents with yellow skin and yellow eyes, and liver function tests show a markedly elevated alkaline phosphatase. What is the most likely cause of the jaundice?", "a": "Obstructive (cholestatic) jaundice from biliary tract obstruction", "y": [32], "an": "interp", "sub": "เบาะแสว่าเป็นการอุดตัน: ALP สูง", "t": 223}]}, {"t": "ALP · GGT · 5'-nucleotidase — ALP สูงอย่างเดียว", "n": 0, "y": [], "w": null, "c": "ALP สูงอย่างเดียว/GGT ยังไม่ถาม", "s": [], "q": []}, {"t": "การสร้างของตับ (PT, albumin) และ bilirubin เด่น", "n": 0, "y": [], "w": null, "c": "PT/factor V/albumin half-life ยังไม่ถามตรง", "s": [], "q": []}, {"t": "สไลด์ 2570: Direct bilirubin สูง — ตับคั่งเลือด ตับอักเสบจากเหล้า ตับแข็งระยะท้าย DILI", "n": 1, "y": [30], "w": "TB สูง direct ต่ำ LDH reticulocyte สูง → hemolysis (unconjugated)", "c": null, "s": ["Jaundice breakdown: IB เด่น = hemolysis"], "q": [{"q": "A patient has jaundice with total bilirubin 5 mg/dL, direct bilirubin 0.6 mg/dL, normal AST/ALT/ALP, raised LDH and reticulocytosis. What is the most likely mechanism?", "a": "Haemolysis producing excess unconjugated bilirubin", "y": [30], "an": "interp", "sub": "Jaundice breakdown: IB เด่น = hemolysis", "t": 223}]}, {"t": "รวมรูปแบบ LFT · ไข้กับตัวเหลือง · ขั้นตอนดูแลผู้ป่วยเหลือง", "n": 1, "y": [31], "w": "เหลือง คัน อุจจาระซีด คลำได้ถุงน้ำดี คนอีสานกินดิบ → US ตับและท่อน้ำดีก่อน", "c": null, "s": ["ขั้นตอนดูแลผู้ป่วยเหลือง: US ก่อน"], "q": [{"q": "A 59-year-old woman from Sakon Nakhon has had yellow eyes and skin with generalised itching for 1–2 months, together with progressively pale stools, very dark urine, anorexia, 8 kg weight loss and fever on some days. She has a history of eating raw/undercooked food. Examination: normal vital signs, deep jaundice, mild pallor, no cutaneous stigmata of chronic liver disease, palpable gallbladder, normal liver span, no ascites, generalised scratch marks on the skin; rectal examination normal except light grey stool. Hct 31%, albumin 3.2 / globulin 2.4 g/dL, total bilirubin 18 and direct bilirubin 16 mg/dL, AST 35, ALT 34, ALP 560 U/L, GGT 450 U/L. Which one of the following is the best next step of management?", "a": "Ultrasonography of the liver and biliary tree", "y": [31], "an": "ix", "sub": "ขั้นตอนดูแลผู้ป่วยเหลือง: US ก่อน", "t": 223}]}, {"t": "สไลด์ 2570: ผลเลือดไวรัสตับอักเสบ — HAV HEV HCV HBV และ core window", "n": 3, "y": [31, 32, 35], "w": "อ่าน serology: anti-HBs เดี่ยว = มีภูมิจากวัคซีน ไม่ต้องฉีด; IgM anti-HAV = acute HAV (รุ่น 31, 32, 35)", "c": null, "s": ["ตาราง HBV ห้าแถว: anti-HBs เดี่ยว", "ตาราง HBV: ภูมิจากวัคซีน anti-HBs", "IgM anti-HAV = acute HAV"], "q": [{"q": "A hepatitis B serology panel shows anti-HBs positive, HBsAg negative, HBcAg (anti-HBc) negative and HBeAg negative. What is the appropriate advice?", "a": "No hepatitis B immunization is needed — the patient is already immune", "y": [31, 35], "an": "interp", "sub": "ตาราง HBV ห้าแถว: anti-HBs เดี่ยว", "t": 226}, {"q": "After a person receives hepatitis B vaccination, which serological marker becomes positive?", "a": "Anti-HBs", "y": [31], "an": "fact", "sub": "ตาราง HBV: ภูมิจากวัคซีน anti-HBs", "t": 226}, {"q": "A patient presents with fever and jaundice. Anti-HAV IgM is positive. What is the diagnosis?", "a": "Acute hepatitis A infection", "y": [32], "an": "interp", "sub": "IgM anti-HAV = acute HAV", "t": 227}]}], "th": [223, 237, 226]}, {"lec": "3/11", "title": "Liver cirrhosis and complications", "n": 20, "angle": {"dx": 2, "mech": 5, "mx": 8, "interp": 5}, "pattern": "คาบนี้ถูกถามมากที่สุดในกลุ่ม ตับแข็งออกทุกรุ่นผ่านภาวะแทรกซ้อน: SBP (วินิจฉัยจาก PMN + รักษา), HE (lactulose), ascites (SAAG, spironolactone) และ varices (NSBB). มุมผสม mx/interp/mech เท่า ๆ กัน และซ้ำรุ่นบ่อย.", "tip": "ท่องตัวเลข PMN ≥ 250, SAAG 1.1, protein 2.5 พร้อมยา cefotaxime + albumin, lactulose, propranolol/carvedilol ก่อน แล้วทวน Child-Pugh และ HRS ที่ยังไม่เคยออก.", "secs": [{"t": "ตับแข็งคืออะไร — พังผืด ก้อน regenerative และสาเหตุในไทย", "n": 0, "y": [], "w": null, "c": "นิยาม/สาเหตุตับแข็งไม่ออก", "s": [], "q": []}, {"t": "อาการ — compensated vs decompensated และประวัติที่ต้องถาม", "n": 0, "y": [], "w": null, "c": "compensated vs decompensated ไม่ถามตรง", "s": [], "q": []}, {"t": "ตรวจร่างกาย — stigmata of chronic liver disease", "n": 1, "y": [34], "w": null, "c": null, "s": ["stigmata: spider naevi"], "q": [{"q": "A man with alcoholic cirrhosis is admitted with confusion and asterixis. Which additional physical sign of chronic liver disease should you look for?", "a": "Spider naevi", "y": [34], "an": "dx", "sub": "stigmata: spider naevi", "t": 234}]}, {"t": "แล็บในตับแข็ง — AST > ALT · A/G กลับข้าง · เกล็ดเลือดต่ำ · Na ต่ำ", "n": 2, "y": [31, 34], "w": "เกล็ดเลือดต่ำจาก hypersplenism; PT/aPTT ยาว (เฉลยเก่าตอบ FFP)", "c": null, "s": ["CBC: เกล็ดเลือดต่ำจากม้ามโต", "coagulopathy ในตับแข็ง"], "q": [{"q": "A patient with cirrhosis and splenomegaly has a CBC showing thrombocytopenia. What is the most likely cause of the low platelet count?", "a": "Hypersplenism with splenic sequestration of platelets", "y": [34], "an": "mech", "sub": "CBC: เกล็ดเลือดต่ำจากม้ามโต", "t": 234}, {"q": "A patient with cirrhosis has both PT and aPTT prolonged. What is the appropriate management of this coagulopathy?", "a": "Fresh frozen plasma", "y": [31], "an": "mx", "sub": "coagulopathy ในตับแข็ง", "t": 234}]}, {"t": "ภาพถ่ายรังสี ยืนยันตับแข็ง และหาสาเหตุ", "n": 0, "y": [], "w": null, "c": "imaging/Fibroscan ยืนยันตับแข็งไม่ออก", "s": [], "q": []}, {"t": "Child-Pugh และพยากรณ์โรค", "n": 0, "y": [], "w": null, "c": "Child-Pugh/MELD ไม่เคยถามตรงเลย แม้เป็นเนื้อหาหลัก — อาจออกคำนวณคะแนน", "s": [], "q": []}, {"t": "Portal hypertension — กลไก ทางลัด และภาวะแทรกซ้อนสองกลุ่ม", "n": 0, "y": [], "w": null, "c": "กลไก portal HT/HVPG ถูกถามผ่านยา NSBB เท่านั้น", "s": [], "q": []}, {"t": "Hepatic encephalopathy — กลไก ตัวเร่ง วินิจฉัย และรักษา", "n": 3, "y": [30, 31, 32], "w": "asterixis/สับสนในตับแข็ง → lactulose; กลไกลำไส้เป็นกรด NH3 → NH4+", "c": null, "s": ["รักษา HE: lactulose", "lactulose: NH3 → NH4+"], "q": [{"q": "A patient with cirrhosis develops asterixis (flapping tremor). What is the most appropriate treatment?", "a": "Lactulose", "y": [31], "an": "mx", "sub": "รักษา HE: lactulose", "t": 233}, {"q": "A patient with cirrhosis develops confusion with asterixis. What is the most appropriate management of this symptom?", "a": "Oral lactulose", "y": [32], "an": "mx", "sub": "รักษา HE: lactulose", "t": 233}, {"q": "Lactulose is used to treat hepatic encephalopathy. What is its mechanism of action?", "a": "Colonic bacterial fermentation acidifies the lumen, trapping ammonia as non-absorbable NH4+ that is then excreted, lowering blood ammonia", "y": [30], "an": "mech", "sub": "lactulose: NH3 → NH4+", "t": 233}]}, {"t": "Varices — ธรรมชาติของโรค และป้องกันเลือดออกครั้งแรก", "n": 2, "y": [31, 34], "w": "large varices ไม่เคยออก → propranolol; กลไก carvedilol/β2 ลด portal inflow", "c": null, "s": ["NSBB/carvedilol ลด portal inflow", "NSBB ป้องกันเลือดออกครั้งแรก"], "q": [{"q": "In a patient with cirrhosis and portal hypertension, by which mechanism does carvedilol lower portal pressure?", "a": "Beta-2 blockade produces splanchnic arteriolar vasoconstriction, reducing portal venous inflow", "y": [34], "an": "mech", "sub": "NSBB/carvedilol ลด portal inflow", "t": 235}, {"q": "A 53-year-old man with cirrhosis undergoes upper endoscopy, which shows large oesophageal varices. He has never bled from the varices and has no ascites, peripheral oedema, encephalopathy or gastrointestinal bleeding. How should he be managed?", "a": "Propranolol", "y": [31], "an": "mx", "sub": "NSBB ป้องกันเลือดออกครั้งแรก", "t": 235}]}, {"t": "เลือดออกจาก varices เฉียบพลัน ป้องกันซ้ำ gastric varices และ PHG", "n": 2, "y": [30, 34], "w": "อาเจียนเป็นเลือด + spider + shifting dullness → variceal bleeding; secondary prophylaxis NSBB + EVL", "c": null, "s": ["variceal bleeding in cirrhosis", "ป้องกันเลือดออกซ้ำ: NSBB + EVL"], "q": [{"q": "A patient presents with haematemesis. On examination there are spider naevi and shifting dullness. What is the most likely cause of the bleeding?", "a": "Variceal bleeding from oesophageal varices", "y": [30], "an": "dx", "sub": "variceal bleeding in cirrhosis", "t": 218}, {"q": "A patient with cirrhosis and a previous episode of bleeding from oesophageal varices has just undergone endoscopy in which the varices were band-ligated. Which drug should he receive as long-term secondary prophylaxis against rebleeding?", "a": "Non-selective beta-blocker (propranolol, nadolol or carvedilol)", "y": [34], "an": "mx", "sub": "ป้องกันเลือดออกซ้ำ: NSBB + EVL", "t": 235}]}, {"t": "Ascites — กลไก สาเหตุ เจาะตรวจ และ SAAG", "n": 3, "y": [31, 34, 35], "w": "SAAG < 1.1 + protein > 2.5 → TB peritonitis (ซ้ำ 2 รุ่น); กลไก ascites splanchnic vasodilation + RAAS", "c": null, "s": ["แยกโรคด้วย SAAG: TB peritonitis", "กลไก ascites: underfilling + RAAS"], "q": [{"q": "A patient with ascites has fluid analysis showing a serum-ascites albumin gradient (SAAG) below 1.1 g/dL and an ascitic total protein above 2.5 g/dL. What is the most likely cause of the ascites?", "a": "Tuberculous peritonitis", "y": [34], "an": "interp", "sub": "แยกโรคด้วย SAAG: TB peritonitis", "t": 231}, {"q": "Ascitic fluid analysis in a patient with new-onset ascites shows a low serum–ascites albumin gradient (SAAG < 1.1 g/dL) with a high ascitic total protein (> 2.5 g/dL). Which condition best explains this fluid?", "a": "Tuberculous peritonitis", "y": [31], "an": "interp", "sub": "แยกโรคด้วย SAAG: TB peritonitis", "t": 231}, {"q": "A 50-year-old man with alcoholic cirrhosis and spider naevi has tense ascites. Which mechanism best explains the formation of his ascites?", "a": "Portal hypertension with splanchnic arterial vasodilatation, effective arterial underfilling and activation of RAAS, sympathetic system and ADH causing renal sodium and water retention", "y": [34, 35], "an": "mech", "sub": "กลไก ascites: underfilling + RAAS", "t": 232}]}, {"t": "รักษา ascites — เกลือ ยาขับปัสสาวะ LVP + albumin และ refractory ascites", "n": 1, "y": [35], "w": null, "c": null, "s": ["spironolactone ต้าน aldosterone"], "q": [{"q": "Spironolactone is the first-line diuretic for ascites in cirrhosis. What is its mechanism of action in this setting?", "a": "It blocks aldosterone at mineralocorticoid receptors in the collecting duct, countering the secondary hyperaldosteronism of cirrhosis", "y": [35], "an": "mech", "sub": "spironolactone ต้าน aldosterone", "t": 232}]}, {"t": "Spontaneous bacterial peritonitis — วินิจฉัย แยก secondary peritonitis และรักษา", "n": 5, "y": [29, 30, 31, 32, 34], "w": "น้ำในท้อง PMN ≥ 250 = SBP, เพาะเชื้อไม่ขึ้น = CNNA → cefotaxime IV + albumin เมื่อ Cr สูง (5 ข้อ รุ่น 29–34)", "c": null, "s": ["Algorithm: PMN ≥ 250 = SBP", "รักษา SBP: cefotaxime", "รักษา SBP: cefotaxime + albumin", "จำแนก: PMN ≥ 250"], "q": [{"q": "A cirrhotic patient with ascites undergoes diagnostic paracentesis. The SAAG is high (>1.1 g/dL), the ascitic PMN count is about 10,000 cells/mm3, and the Gram stain of the fluid shows bacilli. What is the most likely diagnosis?", "a": "Spontaneous bacterial peritonitis", "y": [32], "an": "interp", "sub": "Algorithm: PMN ≥ 250 = SBP", "t": 230}, {"q": "A patient with ascites presents with marked abdominal pain and rebound tenderness. Diagnostic paracentesis shows an ascitic neutrophil count above 250 cells/mm3. What is the most appropriate treatment?", "a": "Intravenous cefotaxime", "y": [34], "an": "mx", "sub": "รักษา SBP: cefotaxime", "t": 230}, {"q": "A 40-year-old man with alcoholic cirrhosis and parotid enlargement presents with fever and tense ascites. Ascitic fluid: SAAG 1.3 g/dL, total protein 2.2 g/dL, WBC 500/mm3 with 90% neutrophils. Creatinine 2.0 mg/dL. What is the appropriate initial management?", "a": "Intravenous third-generation cephalosporin (ceftriaxone or cefotaxime) plus intravenous albumin", "y": [30], "an": "mx", "sub": "รักษา SBP: cefotaxime + albumin", "t": 230}, {"q": "Which ascitic fluid profile is diagnostic of spontaneous bacterial peritonitis in a patient with cirrhosis?", "a": "SAAG 1.3 g/dL, total cells 400/mm3, PMN 300/mm3", "y": [29, 31], "an": "interp", "sub": "จำแนก: PMN ≥ 250", "t": 230}, {"q": "A cirrhotic patient with ascites undergoes diagnostic paracentesis. The ascitic fluid neutrophil (PMN) count is 300 cells/mm3, and Gram stain and culture show no organisms. What is the diagnosis?", "a": "Culture-negative neutrocytic ascites (CNNA)", "y": [30], "an": "interp", "sub": "จำแนก: CNNA", "t": 230}]}, {"t": "Hepatorenal syndrome — นิยาม เกณฑ์วินิจฉัย และการรักษา", "n": 0, "y": [], "w": null, "c": "Hepatorenal syndrome (terlipressin + albumin) ยังไม่ออก", "s": [], "q": []}, {"t": "รักษาตับแข็งโดยรวม ป้องกันภาวะแทรกซ้อน คัดกรอง HCC และเปลี่ยนตับ", "n": 1, "y": [], "w": null, "c": null, "s": ["หยุดดื่ม + โภชนาการ"], "q": [{"q": "A 55-year-old man with alcoholic cirrhosis, Child–Pugh A, has temporal muscle wasting. He has never had SBP or variceal bleeding. Which health-promotion advice is most appropriate?", "a": "Ensure adequate calorie and protein intake with micronutrient (vitamin) supplementation, and stop alcohol", "y": [], "an": "mx", "sub": "หยุดดื่ม + โภชนาการ", "t": 234}]}], "th": [234, 233, 235, 218, 232, 231, 230]}], "gaps": [{"id": "gap-gi-01", "set": "gi", "title": "Dysphagia, achalasia, esophageal cancer และ corrosive ingestion", "subtitle": "แยก oropharyngeal กับ esophageal dysphagia, mechanical กับ motility แล้วรู้การจัดการโรคหลอดอาหารที่ออกสอบ", "md": "### ขั้นที่ 1: oropharyngeal หรือ esophageal\n| | Oropharyngeal (transfer) dysphagia | Esophageal dysphagia |\n|---|---|---|\n| อาการ | เริ่มกลืนไม่ได้, **สำลักหรือไอทันทีขณะกลืน**, สำลักน้ำออกจมูก (nasal regurgitation), เสียงขึ้นจมูก | รู้สึกอาหารติดบริเวณคอหรือหน้าอก**หลังกลืนไปแล้วหลายวินาที** |\n| กลไก | กล้ามเนื้อลายของคอหอยหรือเส้นประสาทผิดปกติ (neuromuscular) | ทางเดินอาหารตีบ (mechanical) หรือการบีบตัวผิดปกติ (motility) |\n| สาเหตุ | **stroke**, Parkinson, myasthenia gravis, ALS, **polymyositis/dermatomyositis**, Zenker diverticulum, head and neck cancer | ดูขั้นที่ 2 |\n| การตรวจ | videofluoroscopic swallow study (modified barium swallow), FEES | EGD, barium swallow, high-resolution manometry |\n\n- Polymyositis กระทบกล้ามเนื้อลายของคอหอยและหลอดอาหารส่วนบน จึงมี oropharyngeal dysphagia (สำลักทันทีขณะกลืน) ร่วมกับ proximal muscle weakness และ CK สูง\n- Systemic sclerosis กระทบกล้ามเนื้อเรียบของหลอดอาหารส่วนล่าง 2/3 ทำให้ peristalsis ลดลงและ LES หย่อน จึงมี esophageal dysphagia ร่วมกับ GERD รุนแรง (ต่างจาก polymyositis)\n\n### ขั้นที่ 2: esophageal dysphagia แยก mechanical กับ motility\n| ลักษณะ | สาเหตุ |\n|---|---|\n| ของแข็งอย่างเดียว เป็นมากขึ้นเรื่อยๆ + น้ำหนักลด | **esophageal cancer**, peptic stricture (มีประวัติ GERD) |\n| ของแข็งอย่างเดียว เป็นๆ หายๆ | Schatzki ring, **eosinophilic esophagitis** (ชายหนุ่ม atopy มี food impaction) |\n| ของแข็งและของเหลว**ตั้งแต่แรก** | motility: **achalasia**, distal esophageal spasm (corkscrew, เจ็บหน้าอก), systemic sclerosis |\n\n### Achalasia\n- กลไก: สูญเสีย **inhibitory neurons (NO, VIP) ใน myenteric (Auerbach) plexus** ทำให้ **LES คลายตัวไม่ได้** และ**ไม่มี peristalsis** ในหลอดอาหารส่วนกล้ามเนื้อเรียบ; สาเหตุส่วนใหญ่ idiopathic (Chagas disease ทำให้เกิดภาพเดียวกัน)\n- อาการ: กลืนลำบากทั้งของแข็งและของเหลว, regurgitation อาหารที่ยังไม่ย่อย (โดยเฉพาะตอนนอน), aspiration, น้ำหนักลดช้าๆ\n- Barium swallow: หลอดอาหารขยายและเรียวลงเป็น **\"bird's beak\"** ที่ gastroesophageal junction\n- **High-resolution manometry เป็น gold standard** (Chicago classification v4.0: IRP สูงร่วมกับ peristalsis ล้มเหลว 100%; type II ตอบสนองต่อการรักษาดีที่สุด)\n- ต้องทำ **EGD เสมอ** เพื่อแยก pseudoachalasia (มะเร็งบริเวณ cardia) โดยเฉพาะผู้สูงอายุที่อาการเร็วและน้ำหนักลดมาก\n- รักษา: pneumatic dilation, laparoscopic Heller myotomy ร่วมกับ partial fundoplication, **POEM** (เหมาะกับ type III); botulinum toxin สำหรับคนที่ผ่าตัดไม่ได้; nitrates/CCB ได้ผลน้อย\n- เพิ่มความเสี่ยงต่อ squamous cell carcinoma ของหลอดอาหาร\n\n### Esophageal cancer\n| | Squamous cell carcinoma (พบมากในไทย) | Adenocarcinoma |\n|---|---|---|\n| ปัจจัยเสี่ยง | **สูบบุหรี่ + ดื่มสุรา** (เสริมกัน), เครื่องดื่มร้อน, nitrosamine, achalasia, corrosive stricture, Plummer–Vinson, tylosis, เคยเป็นมะเร็งศีรษะและคอ | GERD จนเป็น **Barrett's esophagus**, อ้วน, ชาย |\n| ตำแหน่ง | ส่วนบนและกลาง | ส่วนล่างและ GE junction |\n\n- อาการ: **กลืนของแข็งลำบากแบบ progressive** (ต่อมากลืนน้ำก็ลำบาก) ร่วมกับ**น้ำหนักลดเร็ว**, odynophagia, เสียงแหบ (ลุกลาม recurrent laryngeal nerve), ไอขณะดื่มน้ำ (tracheoesophageal fistula), ซีดจาก iron deficiency, hypercalcemia (SCC หลั่ง PTHrP)\n- ชาย 55 ปี สูบบุหรี่ ดื่มเหล้าหนัก กลืนของแข็งลำบาก 2 สัปดาห์ ยังกลืนน้ำได้ น้ำหนักลด 8 kg ไม่มีประวัติกลืนสารกัดกร่อน คือ esophageal cancer จนกว่าจะพิสูจน์ได้ว่าไม่ใช่\n- วินิจฉัย: **EGD + biopsy** เป็นการตรวจแรกใน dysphagia ที่มี alarm features; staging ด้วย CT chest/abdomen, PET-CT, EUS (T และ N stage), bronchoscopy ถ้าก้อนอยู่ส่วนบนหรือกลางใกล้หลอดลม\n- รักษา: T1a ทำ endoscopic resection (EMR/ESD); ระยะลุกลามเฉพาะที่ (T3–T4a หรือ N บวก) ให้ **neoadjuvant chemoradiation (CROSS) แล้วผ่าตัด esophagectomy** หรือ definitive chemoradiation (นิยมใน SCC โดยเฉพาะส่วนคอ); ถ้ายังมีโรคเหลือหลังผ่าตัดให้ adjuvant nivolumab; adenocarcinoma ใช้ perioperative FLOT ได้; ระยะแพร่กระจายให้ platinum + fluoropyrimidine ร่วมกับ PD-1 inhibitor และบรรเทาการกลืนด้วย esophageal stent หรือ radiotherapy พร้อมดูแลโภชนาการ\n\n### Corrosive ingestion\n- กลไก: **ด่าง** (น้ำยาล้างท่อ, NaOH) ทำให้เกิด **liquefactive necrosis** ลึกและทะลุง่าย ทำลายหลอดอาหารมาก; **กรด** (น้ำยาล้างห้องน้ำหลายชนิดในไทยเป็นกรดเกลือ HCl) ทำให้เกิด **coagulative necrosis** ที่จำกัดการลุกลาม มักทำลายกระเพาะมากกว่า แต่กรดแก่ก็ทำลายรุนแรงได้\n- อาการ: น้ำลายไหล, กลืนเจ็บ (odynophagia), กลืนลำบาก, เจ็บหน้าอกหรือท้อง; stridor หรือเสียงแหบบ่งชี้ทางเดินหายใจบาดเจ็บ; ไม่มีแผลในปากไม่ได้แปลว่าหลอดอาหารไม่บาดเจ็บ\n- จัดการ:\n1. ประเมิน **airway ก่อน** (stridor ให้ใส่ท่อช่วยหายใจโดยผู้ชำนาญ), สัญญาณชีพ, ภาวะทะลุ (peritonitis, mediastinitis, subcutaneous emphysema)\n2. **NPO**, IV fluid, PPI, ยาแก้ปวด; **ห้ามกระตุ้นอาเจียน ห้ามล้างท้อง ห้ามให้สารเพื่อทำให้เป็นกลาง (neutralize) ห้ามใส่ NG tube แบบไม่เห็น ห้ามให้ activated charcoal**\n3. CXR และ upright abdominal film หา free air; CT ช่วยประเมินความลึกของ necrosis และภาวะทะลุ\n4. **Upper endoscopy ภายใน 12–24 ชม.** (ไม่เกิน 48 ชม.) เพื่อ grade ความรุนแรงตาม Zargar classification และวางแผนให้อาหาร; **เลี่ยงการส่องกล้องช่วงวันที่ 5–15** เพราะเนื้อเยื่ออ่อนที่สุด เสี่ยงทะลุ\n5. ไม่ให้ steroid หรือ antibiotic เป็น routine\n- Zargar grade 0–2a ส่วนใหญ่หายได้ให้กินได้เร็ว; grade 2b–3 เสี่ยง stricture และทะลุ ต้องใส่สายให้อาหาร\n- ภาวะแทรกซ้อนระยะยาว: **esophageal stricture** (มักเกิดภายใน 2 เดือน รักษาด้วย dilation) และ **SCC** ของหลอดอาหารหลังหลายสิบปี", "pearls": ["สำลักหรือไอทันทีขณะเริ่มกลืน, nasal regurgitation = oropharyngeal dysphagia จาก neuromuscular (stroke, polymyositis, MG)", "กลืนลำบากทั้งของแข็งและของเหลวตั้งแต่แรก + regurgitation + bird's beak = achalasia (LES คลายไม่ได้ + ไม่มี peristalsis จากการสูญเสีย inhibitory neurons); manometry เป็น gold standard", "กลืนของแข็งลำบาก progressive + น้ำหนักลด ในคนสูบบุหรี่ดื่มเหล้า = esophageal SCC; ทำ EGD + biopsy", "Corrosive ingestion: airway ก่อน, NPO, ห้ามกระตุ้นอาเจียนหรือ neutralize, EGD ภายใน 12–24 ชม. เลี่ยงวันที่ 5–15", "ด่าง = liquefactive necrosis (ลึก ทะลุง่าย); กรด = coagulative necrosis"], "traps": [], "q": [{"id": "PP30-GIS-025", "q": "A 70-year-old man with recent stroke has difficulty initiating swallowing, coughing and choking with both liquids and solids, and nasal regurgitation. Which type of dysphagia is this?", "a": "Oropharyngeal (transfer) dysphagia from neuromuscular dysfunction", "y": [30], "t": 217}, {"id": "PP30-GIS-059", "q": "A 35-year-old woman has 1 year of dysphagia to both solids and liquids from the onset, with regurgitation of undigested food. Barium swallow shows a dilated oesophagus tapering to a smooth 'bird's beak' at the gastro-oesophageal junction. What is the underlying abnormality?", "a": "Failure of the lower oesophageal sphincter to relax with absent peristalsis (achalasia), from loss of inhibitory myenteric neurons", "y": [30], "t": 217}, {"id": "PP31-GIS-012", "q": "A patient presents with difficulty swallowing and immediate choking at the moment of swallowing. Which of the following best explains this swallowing abnormality?", "a": "Polymyositis", "y": [31], "t": 217}, {"id": "GI-OLDP-001", "q": "A 55-year-old man who is a heavy smoker and heavy drinker has had intermittent dyspeptic symptoms for 6 months. For the past 2 weeks he has had difficulty swallowing solid food although he can still swallow water, with a sensation of something stuck in his throat, and he has lost 8 kg in 3 weeks. There is no hematemesis, no history of corrosive ingestion, normal bowel habits and no fever. Examination: thin man, fully conscious, mild pallor, no jaundice, normal heart and lungs, abdomen with no organomegaly and no tenderness, no lymphadenopathy; chest radiograph shows no infiltration. Which diagnosis is most likely?", "a": "Esophageal cancer", "y": [31], "t": 216}, {"id": "GI-OLDP-003", "q": "A patient who has been a heavy smoker for many years presents with progressive difficulty swallowing. What is the most likely diagnosis?", "a": "Esophageal cancer", "y": [34], "t": 216}, {"id": "PP31-GIS-027", "q": "A 35-year-old woman is brought to the emergency department 1 hour after deliberately drinking a strong bathroom (toilet-bowl) cleaner. She has drooling and odynophagia; vital signs are stable and there is no stridor. Which of the following is the most appropriate management?", "a": "Keep nil by mouth, give supportive care and arrange upper endoscopy within 12-24 hours to grade the injury", "y": [31], "t": 221}], "years": [30, 31, 34], "th": [217, 216, 221]}, {"id": "gap-gi-02", "set": "gi", "title": "Amoebiasis และ liver abscess (amoebic vs pyogenic รวม melioidosis)", "subtitle": "วงจรชีวิต Entamoeba histolytica จาก colon สู่ตับ, การตรวจอุจจาระ และการเลือกยาใน liver abscess แบบไทย", "md": "### วงจรชีวิต Entamoeba histolytica\n1. กลืน **cyst** (มี 4 nuclei ทนกรดในกระเพาะและคลอรีน) จากอาหารหรือน้ำที่ปนเปื้อนอุจจาระ\n2. **Excystation ที่ลำไส้เล็กส่วนปลาย** ได้ trophozoite\n3. Trophozoite ไปอยู่ที่ลำไส้ใหญ่ (cecum, ascending colon, sigmoid, rectum) ยึดเกาะด้วย Gal/GalNAc lectin ทำลายเซลล์ด้วย amoebapore และ cysteine protease แล้วรุกเข้า mucosa เกิด **flask-shaped ulcer** (ปากแผลแคบ ฐานกว้างใน submucosa)\n4. รุกเข้า **portal venules** แล้วไปตามระบบ **portal vein สู่ตับ** เกิด liver abscess (ส่วนใหญ่ right lobe เพราะได้เลือดจาก superior mesenteric vein มาก)\n5. บางส่วนกลายเป็น cyst ถูกขับออกทางอุจจาระและแพร่ต่อ (trophozoite ที่ออกมาตายเร็วนอกร่างกาย)\n\n### Amoebic dysentery (amoebic colitis)\n- อาการ: ถ่ายเป็นมูกเลือดค่อยเป็นค่อยไปหลายวันถึงสัปดาห์ ปวดท้อง ปวดเบ่ง; ไข้น้อยกว่า shigellosis\n- ภาวะแทรกซ้อน: toxic megacolon, ทะลุ, **ameboma** (ก้อนคล้ายมะเร็ง), liver abscess; **ห้ามให้ steroid** (ทำให้เป็น fulminant colitis)\n- ตรวจอุจจาระสด (ส่งภายใน 30 นาทีเพื่อเห็น trophozoite เคลื่อนไหว):\n- **trophozoite ที่กิน RBC (erythrophagocytosis)** วินิจฉัย E. histolytica ได้\n- cyst แยก E. histolytica จาก E. dispar ที่ไม่ก่อโรคไม่ได้ ต้องใช้ stool antigen หรือ PCR\n- พบ RBC เกาะกลุ่ม แต่ **WBC ค่อนข้างน้อย** (ต่างจาก Shigella ที่มี PMN มาก)\n- **Charcot–Leyden crystals**: ผลึกรูปเข็มสองปลายแหลม มาจาก **eosinophil** (galectin-10); พบใน**อุจจาระที่มีปรสิต** (amoebiasis, หนอนพยาธิ) และในเสมหะ **asthma/allergic** (ร่วมกับ Curschmann spirals)\n- Colonoscopy เห็น flask-shaped ulcer เล็กๆ กระจาย ระหว่างแผลเยื่อบุปกติ; biopsy ที่ขอบแผลพบ trophozoite\n\n### Amoebic liver abscess\n- กลุ่มเสี่ยง: ชายวัยผู้ใหญ่ ดื่มสุรา อยู่ในถิ่นสุขาภิบาลไม่ดี; ส่วนใหญ่ไม่มีอาการท้องเสียในขณะนั้น\n- อาการ: ไข้ ปวดชายโครงขวา ตับโตกดเจ็บ เคาะเจ็บที่ intercostal space ขวา, เสียงหายใจลดที่ฐานปอดขวา (pleural effusion, กะบังลมขวายกสูง)\n- Lab: WBC สูง (ไม่มี eosinophilia), ALP สูง; US/CT เห็น abscess เดี่ยวกลมที่ right lobe\n- **Serology (anti-amoebic antibody, IHA หรือ ELISA) เป็นการตรวจที่สนับสนุนการวินิจฉัยดีที่สุด** บวก >90% (อาจลบในสัปดาห์แรก ควรตรวจซ้ำ; ในถิ่นระบาดบวกค้างได้หลายปี); stool exam มักไม่พบเชื้อ\n- หนองจากการเจาะเป็น **\"anchovy paste\"** ไม่มีกลิ่น ย้อมไม่พบแบคทีเรีย และไม่ค่อยพบ trophozoite (อยู่ที่ผนัง abscess)\n\n### Pyogenic liver abscess\n- เชื้อ: **Klebsiella pneumoniae** (เด่นในเอเชีย, hypervirulent สัมพันธ์กับเบาหวาน แพร่ไปตา endophthalmitis หรือสมองได้), E. coli, anaerobes, Streptococcus anginosus group; ต้นเหตุจาก biliary tract (cholangitis, นิ่ว, มะเร็ง), portal pyemia (ไส้ติ่ง, diverticulitis), hematogenous\n- **ในไทยโดยเฉพาะภาคตะวันออกเฉียงเหนือ ต้องคิดถึง melioidosis (Burkholderia pseudomallei)**: ชาวนา เบาหวาน ติดสุรา โรคไต มี abscess หลายก้อนในตับ**และม้าม** (ลักษณะ honeycomb หรือ Swiss cheese), อาจมี pneumonia ร่วม; ยืนยันด้วย culture (Ashdown medium)\n\n| | Amoebic | Pyogenic |\n|---|---|---|\n| ผู้ป่วย | ชายวัยผู้ใหญ่ ดื่มสุรา | สูงอายุ, เบาหวาน, โรคทางเดินน้ำดี |\n| จำนวนก้อน | มักก้อนเดียว right lobe | เดี่ยวหรือหลายก้อน |\n| การตรวจสำคัญ | amoebic serology | blood culture, หนองย้อมและเพาะเชื้อ |\n| หนอง | anchovy paste ไม่มีกลิ่น ไม่มีเชื้อ | หนองมีเชื้อ อาจมีกลิ่น |\n| ยา | metronidazole + luminal agent | antibiotic + drainage |\n\n### การรักษา\n- **Amoebic liver abscess และ amoebic colitis**: **metronidazole 500–750 mg PO วันละ 3 ครั้ง 7–10 วัน** (หรือ tinidazole 2 g/วัน 3–5 วัน) แล้วตามด้วย **luminal agent** เพื่อกำจัด cyst ในลำไส้: paromomycin 25–35 mg/kg/วัน แบ่ง 3 ครั้ง 7 วัน หรือ diloxanide furoate 500 mg วันละ 3 ครั้ง 10 วัน; ผู้ที่มีแต่ cyst ไม่มีอาการให้ luminal agent อย่างเดียว\n- ไข้และอาการปวดดีขึ้นใน 72–96 ชม.; ส่วนใหญ่ไม่ต้องเจาะระบาย ยกเว้นไม่ตอบสนองใน 3–5 วัน, ก้อนใหญ่ใกล้แตก, **left lobe** (เสี่ยงแตกเข้า pericardium), หรือแยกจาก pyogenic ไม่ได้\n- **Pyogenic liver abscess**: empirical **ceftriaxone + metronidazole** (ครอบคลุม Klebsiella, Enterobacterales, anaerobes และ amoeba) หรือ β-lactam/β-lactamase inhibitor; ร่วมกับ **percutaneous drainage เมื่อก้อน >5 cm**; ผ่าตัดเมื่อ multiloculated, แตก หรือระบายไม่ได้ผล; รวมระยะเวลา antibiotic 4–6 สัปดาห์ (IV 2–3 สัปดาห์แล้วเปลี่ยนเป็น oral)\n- **สงสัย melioidosis** (ภาคอีสาน, เบาหวาน, abscess หลายก้อนในตับและม้าม): **ceftazidime 2 g IV ทุก 8 ชม.** (หรือ meropenem) intensive phase อย่างน้อย 4 สัปดาห์สำหรับ deep abscess แล้วตามด้วย eradication phase ด้วย **co-trimoxazole อย่างน้อย 12 สัปดาห์**; ceftriaxone ให้ผลทางคลินิกด้อยกว่า (อัตราตายสูงกว่า) และ B. pseudomallei ดื้อ aminoglycoside โดยธรรมชาติ จึงต้องใช้ ceftazidime หรือ carbapenem", "pearls": ["E. histolytica: กลืน cyst, excyst ที่ลำไส้เล็ก, trophozoite รุก colon เป็น flask-shaped ulcer, เข้า portal venule ไปตับทาง portal vein", "Amoebic liver abscess: ชายดื่มสุรา ก้อนเดียว right lobe; serology anti-amoebic antibody บวก >90%; หนอง anchovy paste", "Amoebiasis รักษาด้วย metronidazole 7–10 วัน แล้วต้องตาม luminal agent (paromomycin) เสมอ", "Charcot–Leyden crystals มาจาก eosinophil: พบในอุจจาระที่มีปรสิต (amoebiasis) และเสมหะ asthma", "Liver/splenic abscess หลายก้อนในเบาหวานภาคอีสาน = melioidosis ใช้ ceftazidime (หรือ meropenem) ไม่ใช่ ceftriaxone"], "traps": [{"id": "GI-OLDP-010", "note": "โพยตอบ ceftazidime สำหรับ liver abscess โดยไม่มีบริบท; ceftazidime ถูกเมื่อสงสัย melioidosis (ภาคอีสาน, เบาหวาน, abscess หลายก้อนในตับและม้าม) แต่ pyogenic liver abscess ทั่วไปใช้ ceftriaxone + metronidazole ร่วมกับ drainage และ amoebic abscess ใช้ metronidazole ต้องดูบริบทในโจทย์ก่อนเลือก"}], "q": [{"id": "GI-OLDP-010", "q": "A patient is diagnosed with a liver abscess. Which antimicrobial treatment should be given?", "a": "Ceftazidime", "y": [31], "t": 236}, {"id": "GI-OLDP-017", "q": "A patient with an amoebic liver abscess has serology positive for antibody to Entamoeba histolytica. Which sequence best describes how the organism reaches the liver?", "a": "Ingested cysts excyst in the small bowel, trophozoites colonise and invade the colonic mucosa producing a flask-shaped ulcer, penetrate into portal venules, and are carried through the hepatic portal vein to the liver", "y": [32], "t": 236}, {"id": "PP31-GIS-002", "q": "A patient has a liver abscess thought to be due to Entamoeba histolytica. Which investigation best supports the diagnosis?", "a": "Serum anti-amoebic antibody titre (amoebic serology)", "y": [31], "t": 236}, {"id": "PP30-GIS-058", "q": "Charcot–Leyden crystals seen in stool or sputum are derived from which cell, and in which setting are they typically found?", "a": "Eosinophils — in asthma/allergic sputum and in stool with parasitic (e.g., amoebic or helminthic) infection", "y": [30], "t": 246}], "years": [30, 31, 32], "th": [236]}, {"id": "gap-gi-03", "set": "gi", "title": "Upper GI bleeding และ NSAID-induced peptic ulcer", "subtitle": "เดาสาเหตุจากประวัติ (Mallory–Weiss, varices, ulcer), resuscitate ก่อนส่องกล้อง และป้องกันแผลจาก NSAIDs ด้วย PPI", "md": "### เดาสาเหตุ upper GI bleeding จากประวัติ\n| สาเหตุ | เบาะแส |\n|---|---|\n| Peptic ulcer (พบบ่อยที่สุด) | NSAIDs/aspirin, H. pylori, ปวดใต้ลิ้นปี่ |\n| Esophageal/gastric varices | cirrhosis (ดื่มสุรา, HBV/HCV), ม้ามโต, ascites, platelet ต่ำ, เลือดออกมาก |\n| **Mallory–Weiss tear** | **อาเจียนหรือขย้อนอย่างรุนแรงซ้ำๆ แล้วตามด้วยอาเจียนเป็นเลือดสด**: hyperemesis gravidarum, ดื่มสุราหนัก, gastroenteritis |\n| Erosive esophagitis/gastritis | GERD, alcohol, ผู้ป่วยวิกฤต |\n| Malignancy | น้ำหนักลด, ซีดเรื้อรัง, อายุมาก |\n| Dieulafoy lesion, angiodysplasia | เลือดออกเป็นพักๆ หาสาเหตุไม่พบ |\n\n- Mallory–Weiss tear คือการฉีกขาดตามยาวของ**เยื่อบุ**ที่ gastroesophageal junction จากความดันในท้องที่เพิ่มขึ้นทันทีขณะขย้อน; ต่างจาก **Boerhaave syndrome** ซึ่งเป็นการฉีกขาด**ทะลุทุกชั้น** มีเจ็บหน้าอกรุนแรง subcutaneous emphysema และ mediastinitis\n- โจทย์ตั้งครรภ์ 15 สัปดาห์ มี hyperemesis ขย้อนหลายชั่วโมงแล้วอาเจียนเป็นเลือดสด สัญญาณชีพปกติ: คำตอบคือ **Mallory–Weiss tear**; spider angioma, palmar erythema พบได้ปกติในหญิงตั้งครรภ์ (estrogen), ALP สูงจาก placenta และ AST/ALT ปกติ จึงไม่ได้บ่งชี้ cirrhosis หรือ varices; BUN สูงโดย creatinine ปกติ พบได้ทั้งจากเลือดออกทางเดินอาหารส่วนบนและภาวะขาดน้ำ\n- เกือบทั้งหมดหยุดเองได้; ส่องกล้องรักษา (clip, epinephrine injection) เมื่อยังมีเลือดออก; ให้ antiemetic และ PPI\n\n### หลักการดูแล UGIB\n1. **Resuscitation ก่อน**: IV access ขนาดใหญ่ 2 เส้น, crystalloid, ป้องกัน aspiration\n2. **Restrictive transfusion**: ให้ PRC เมื่อ **Hb <7 g/dL** (เป้าหมาย 7–9); มีโรคหัวใจและหลอดเลือดใช้ <8 g/dL; ใน variceal bleeding ระวังการให้มากเกินเพราะเพิ่ม portal pressure\n3. ประเมินความเสี่ยงด้วย **Glasgow-Blatchford score**: คะแนน 0–1 พิจารณาดูแลแบบผู้ป่วยนอกได้\n4. **IV PPI** ก่อนส่องกล้อง (เช่น omeprazole 80 mg IV แล้วตามด้วย 8 mg/ชม. หรือ 40 mg IV ทุก 12 ชม.); erythromycin 250 mg IV 30–120 นาทีก่อนส่องช่วยให้กระเพาะว่าง\n5. **EGD ภายใน 24 ชม.** หลัง resuscitate (non-variceal) และ**ภายใน 12 ชม.** ถ้าสงสัย varices\n6. แผลที่มี high-risk stigmata (Forrest Ia, Ib, IIa, IIb) ทำ endoscopic hemostasis แล้วให้ high-dose PPI ต่อ 72 ชม.\n- **สงสัย variceal bleeding**: vasoactive drug ทันที (terlipressin หรือ octreotide 50 µg bolus แล้ว 50 µg/ชม.) 2–5 วัน, **ceftriaxone 1 g/วัน** ป้องกัน SBP และการติดเชื้อ (สูงสุด 7 วัน), **endoscopic variceal ligation**; Child-Pugh C (10–13) หรือ B ที่ยังเลือดออกขณะส่อง พิจารณา pre-emptive TIPS ภายใน 72 ชม.\n\n### NSAID-induced peptic ulcer: กลไก\n- NSAIDs ยับยั้ง **COX-1** ทำให้ prostaglandin (PGE2, PGI2) ที่ปกป้องเยื่อบุลดลง: mucus และ bicarbonate ลดลง เลือดไปเลี้ยงเยื่อบุลดลง เซลล์ซ่อมแซมช้า ร่วมกับการระคายเคืองเฉพาะที่\n- มักเป็น gastric ulcer ที่ antrum และ**ไม่ค่อยปวด** (ยาแก้ปวดบดบังอาการ) จึงมักมาด้วยเลือดออกหรือทะลุ\n- ปัจจัยเสี่ยงต่อภาวะแทรกซ้อน: อายุ >65 ปี, เคยเป็นแผลหรือเลือดออก, NSAID ขนาดสูงหรือหลายตัว, ใช้ร่วมกับ aspirin, anticoagulant, corticosteroid หรือ SSRI, มี H. pylori\n\n### รักษาแผลจาก NSAIDs\n- **หยุด NSAID ถ้าทำได้** และให้ **PPI** (เช่น omeprazole 20–40 mg วันละครั้งก่อนอาหารเช้า) 8 สัปดาห์สำหรับ gastric ulcer, 4 สัปดาห์สำหรับ duodenal ulcer\n- **ถ้าจำเป็นต้องใช้ NSAID ต่อ** (เช่น โรคข้ออักเสบเรื้อรัง): **ให้ NSAID ต่อร่วมกับ PPI** โดยให้ PPI ตลอดระยะที่ยังใช้ NSAID; ใช้ขนาดต่ำสุดและสั้นที่สุด; ผู้ป่วยเสี่ยงสูงเปลี่ยนเป็น **COX-2 selective inhibitor (celecoxib) ร่วมกับ PPI**\n- **H2RA ขนาดปกติป้องกัน gastric ulcer จาก NSAID ไม่ได้**; misoprostol 200 µg วันละ 4 ครั้งได้ผลแต่ท้องเสียบ่อยและห้ามใช้ในหญิงตั้งครรภ์; sucralfate ไม่ได้ผล\n- **ตรวจหา H. pylori** (urea breath test, stool antigen, rapid urease test จาก biopsy; หยุด PPI 2 สัปดาห์ก่อนตรวจ) และกำจัดถ้าพบ เช่น bismuth quadruple therapy 14 วัน\n- ผู้ที่ใช้ aspirin ขนาดต่ำเพื่อป้องกันโรคหัวใจ: ไม่ควรหยุด aspirin ให้ PPI ร่วม; ถ้าเลือดออกจากแผล ให้กลับมาใช้ aspirin เร็วที่สุดเมื่อห้ามเลือดได้แล้ว (ภายในไม่กี่วัน)\n\n| ความเสี่ยง GI | ลักษณะ | แนวทาง |\n|---|---|---|\n| ต่ำ | ไม่มีปัจจัยเสี่ยง | NSAID ได้ |\n| ปานกลาง | ปัจจัยเสี่ยง 1–2 ข้อ | NSAID + PPI |\n| สูง | เคยมีแผลที่มีภาวะแทรกซ้อน หรือปัจจัยเสี่ยง >2 ข้อ | เลี่ยง NSAID ถ้าได้ หรือ celecoxib + PPI |\n\n- ถ้ามีความเสี่ยงโรคหัวใจและหลอดเลือดสูงด้วย ให้เลี่ยง NSAIDs ถ้าจำเป็นเลือก naproxen ร่วมกับ PPI", "pearls": ["อาเจียนหรือขย้อนรุนแรงซ้ำๆ แล้วอาเจียนเป็นเลือดสด = Mallory–Weiss tear (ฉีกเฉพาะเยื่อบุที่ GE junction, ส่วนใหญ่หยุดเอง)", "Spider angioma, palmar erythema และ ALP สูงพบได้ปกติในหญิงตั้งครรภ์ อย่าเดาว่าเป็น varices", "UGIB: resuscitate, PRC เมื่อ Hb <7, IV PPI, EGD ภายใน 24 ชม. (สงสัย varices: vasoactive + ceftriaxone + EVL ภายใน 12 ชม.)", "NSAID ulcer: หยุด NSAID + PPI; ถ้าต้องใช้ NSAID ต่อ ให้ PPI ร่วม (omeprazole) และพิจารณา celecoxib + PPI ในคนเสี่ยงสูง", "H2RA ขนาดปกติป้องกัน gastric ulcer จาก NSAID ไม่ได้; ตรวจและกำจัด H. pylori ทุกราย"], "traps": [], "q": [{"id": "GI-OLDP-004", "q": "A patient who has taken NSAIDs long-term is found to have a peptic ulcer. Which drug is the most appropriate treatment?", "a": "Omeprazole", "y": [31], "t": 219}, {"id": "GI-OLDP-005", "q": "A patient with chronic arthritis must stay on an NSAID but now complains of epigastric pain. The NSAID cannot be discontinued. What is the most appropriate management?", "a": "Add omeprazole (a proton pump inhibitor) and continue the NSAID", "y": [34], "t": 219}, {"id": "PP31-GIS-009", "q": "A previously healthy 32-year-old woman at 15 weeks' gestation presents with haematemesis. She has had hyperemesis gravidarum during this pregnancy. This morning she had repeated nausea and vomiting after breakfast and continued retching for several hours, then noticed fresh blood in the vomitus. Her medications are a multivitamin and an iron supplement. She does not drink alcohol and has no risk factors for chronic hepatitis. Vital signs are normal with no orthostatic changes; findings include spider angiomata, palmar erythema and a slightly protuberant abdomen consistent with gestational age. Rectal examination shows normal-coloured stool in the rectal vault. Hb 10.4 g/dL, platelets 215,000/µL, BUN 44 mg/dL, creatinine 0.9 mg/dL, AST 23 U/L, ALT 28 U/L, ALP 218 U/L. Which of the following is the most likely diagnosis?", "a": "Mallory-Weiss tear", "y": [31], "t": 218}], "years": [31, 34], "th": [219]}, {"id": "gap-gi-04", "set": "gi", "title": "Clostridium septicum bacteremia: สัญญาณเตือนมะเร็งลำไส้ใหญ่", "subtitle": "เชื้อในเลือดบางชนิดบอกว่าต้องหามะเร็ง: C. septicum และ Streptococcus gallolyticus", "md": "### ตัวเชื้อและกลไก\n- Clostridium septicum เป็น gram-positive bacillus, anaerobe ที่ทนออกซิเจนได้บ้าง (aerotolerant) สร้างสปอร์; พบในลำไส้ปกติได้น้อย\n- เชื้อเข้ากระแสเลือดผ่าน**เยื่อบุลำไส้ที่ฉีกขาด** โดยเฉพาะ**ก้อนมะเร็งลำไส้ใหญ่** (มักเป็น cecum หรือ right colon) เพราะในก้อนมะเร็งมีสภาพขาดออกซิเจน เป็นกรด และมี glycolysis สูง เหมาะกับการเจริญของเชื้อ\n- เชื้อสร้าง **alpha-toxin** ที่เจาะผนังเซลล์ทำให้เนื้อเยื่อตาย และแพร่ทางเลือดได้โดยไม่ต้องมีแผล\n- **ราว 50–80% ของผู้ป่วย C. septicum bacteremia มีมะเร็งซ่อนอยู่** โดยเฉพาะ colorectal cancer รองลงมาคือ hematologic malignancy (leukemia, lymphoma) และ neutropenia จากเคมีบำบัด (neutropenic enterocolitis/typhlitis)\n\n### อาการ\n- **Spontaneous (atraumatic) gas gangrene / myonecrosis**: ปวดกล้ามเนื้อรุนแรงเกินกว่าที่ตรวจพบ บวม ผิวม่วงคล้ำ มี crepitus ลุกลามเร็วเป็นชั่วโมง shock และเสียชีวิตสูง\n- Sepsis จาก bacteremia โดยไม่มีจุดติดเชื้อชัดเจน\n- อาการของมะเร็งที่ซ่อนอยู่: **น้ำหนักลด ถ่ายเหลวหรือการขับถ่ายเปลี่ยนแปลงเป็นๆ หายๆ หลายเดือน ซีดจาก iron deficiency** เลือดออกทางทวารหนัก\n\n### การตรวจหาต้นเหตุ\n- ผู้ป่วยที่ blood culture ขึ้น C. septicum ต้อง**หามะเร็งลำไส้ใหญ่ทุกราย**แม้ไม่มีอาการทางเดินอาหาร\n- **Colonoscopy** เป็นการตรวจที่ดีที่สุดในการหาและ biopsy มะเร็งลำไส้ใหญ่\n- **CT abdomen and pelvis (contrast)** ช่วยหาก้อน, abscess, gas ในเนื้อเยื่อ, การลุกลาม, และมะเร็งตำแหน่งอื่น ทำได้เร็วในผู้ป่วยที่ยังไม่พร้อมส่องกล้อง และใช้ staging\n- ตรวจ CBC และ blood smear หา hematologic malignancy หรือ neutropenia\n- ถ้าสงสัย myonecrosis: ภาพรังสีหา gas ในกล้ามเนื้อ แต่**ห้ามรอภาพรังสีก่อนผ่าตัด**\n\n### การรักษา\n- Gas gangrene: **ผ่าตัด debridement อย่างเร่งด่วน** (อาจต้องตัดอวัยวะ) ร่วมกับ antibiotic\n- Antibiotic: **penicillin G ขนาดสูงร่วมกับ clindamycin** (clindamycin ยับยั้งการสร้าง toxin); empirical ใน sepsis ที่ยังไม่ทราบเชื้อใช้ piperacillin-tazobactam หรือ carbapenem ร่วมกับ clindamycin; metronidazole ก็ครอบคลุมได้\n- รักษามะเร็งที่พบตามมาตรฐาน หลังผู้ป่วยพ้นภาวะวิกฤต\n\n### เชื้อในเลือดอื่นที่ต้องหาโรคซ่อน\n| เชื้อในเลือด | ต้องหา |\n|---|---|\n| **Clostridium septicum** | **colorectal cancer** (โดยเฉพาะ right colon), hematologic malignancy, neutropenia |\n| **Streptococcus gallolyticus** (เดิม S. bovis biotype I) | **colorectal cancer/adenoma** และ **infective endocarditis** (ต้องทำ echocardiography + colonoscopy) |\n| Klebsiella pneumoniae liver abscess (ในเอเชีย) | มีรายงานความสัมพันธ์กับ colorectal cancer จึงควรพิจารณา colonoscopy ในผู้สูงอายุ |", "pearls": ["Blood culture ขึ้น Clostridium septicum = ต้องหามะเร็งลำไส้ใหญ่ (โดยเฉพาะ cecum/right colon) และ hematologic malignancy", "C. septicum ทำให้เกิด spontaneous (atraumatic) gas gangrene ได้ รักษาด้วย surgical debridement + penicillin + clindamycin", "Colonoscopy คือการตรวจหลักเพื่อหาและ biopsy มะเร็ง; CT abdomen/pelvis ใช้ประเมินก้อน การลุกลาม และ abscess", "Streptococcus gallolyticus (S. bovis) bacteremia = หา colorectal cancer + infective endocarditis"], "traps": [{"id": "GI-OLDP-031", "note": "โพยตอบ CT abdomen and pelvis; การตรวจที่ดีที่สุดเพื่อหาและ biopsy มะเร็งลำไส้ใหญ่คือ colonoscopy ส่วน CT ใช้หาก้อน การลุกลาม abscess และ staging; ถ้าตัวเลือกมี colonoscopy ควรเลือก colonoscopy ถ้าไม่มีจึงเลือก CT abdomen and pelvis"}], "q": [{"id": "GI-OLDP-031", "q": "A 70-year-old man presents with weight loss and diarrhoea that has been on and off for several months. Blood culture grows Clostridium septicum. What is the most appropriate investigation to complete this patient's workup?", "a": "CT abdomen and pelvis", "y": [32], "t": 241}, {"id": "GI-OLDP-041", "q": "A patient with several months of weight loss and diarrhoea has blood cultures growing Clostridium septicum. A lesion in which organ should be actively looked for?", "a": "Carcinoma of the colon", "y": [32], "t": 241}], "years": [32], "th": [241]}], "left": []}, {"set": "endo", "name": "Endo", "n_lec": 84, "n_unc": 16, "lectures": [{"lec": "01", "title": "Metabolic Syndrome, Obesity และ Dyslipidemia", "n": 18, "angle": {"fact": 5, "mx": 8, "dx": 1, "mech": 2, "ix": 1, "interp": 1}, "pattern": "ข้อสอบเน้นตัวเลขและการตัดสินใจรักษา: คำนวณ LDL, เลือก statin vs fibrate ตามระดับ LDL/TG, องค์ประกอบ MetS และขนาดการออกกำลังกาย 150 นาที/สัปดาห์ ส่วนใหญ่ angle = mx/fact กระจายรุ่น 29–34 และมีโจทย์ซ้ำเกือบคำต่อคำ (MetS 'ข้อใดไม่ใช่' — สูบบุหรี่) ส่วนโรคอ้วน/ยาลดน้ำหนัก/ผ่าตัดแทบไม่ถูกถาม", "tip": "ท่องสูตร Friedewald + เกณฑ์ statin (LDL ≥190 high-intensity) + fibrate เมื่อ TG ≥500, 5 องค์ประกอบ MetS และ TLC 150 นาที/สัปดาห์ ให้แม่น; เพิ่มลักษณะแยก Cushing จากอ้วนธรรมดา", "secs": [{"t": "Metabolic syndrome — นิยามและกลไก", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "เกณฑ์วินิจฉัย MetS และการวัดรอบเอว", "n": 3, "y": [32, 33], "w": "เลือกข้อที่เป็น/ไม่เป็นองค์ประกอบ MetS — FPG >100/110 ใช่, สูบบุหรี่ไม่ใช่ (ออกซ้ำรุ่น 32–33)", "c": null, "s": ["ห้าองค์ประกอบตามสไลด์"], "q": [{"q": "Which of the following counts as a diagnostic component of the metabolic syndrome?", "a": "Fasting plasma glucose > 110 mg/dL", "y": [32], "an": "fact", "sub": "ห้าองค์ประกอบตามสไลด์", "t": 253}, {"q": "Which of the following is NOT one of the diagnostic components of the metabolic syndrome?", "a": "Cigarette smoking", "y": [33], "an": "fact", "sub": "ห้าองค์ประกอบตามสไลด์", "t": 253}, {"q": "Which of the following is NOT one of the diagnostic criteria of the metabolic syndrome?", "a": "Cigarette smoking", "y": [33], "an": "fact", "sub": "ห้าองค์ประกอบตามสไลด์", "t": 253}]}, {"t": "การจัดการ MetS — ลดความเสี่ยงหัวใจที่แก้ไขได้", "n": 4, "y": [31, 32, 34], "w": "TLC: ออกกำลังกายปานกลาง ≥150 นาที/สัปดาห์ (โจทย์ 20 นาที×5 วัน = ไม่พอ ต้องเพิ่ม), อาหารผักผลไม้, exercise ลด insulin resistance (รุ่น 31, 32, 34)", "c": null, "s": ["TLC — ออกกำลังกาย 150–300 นาที/สัปดาห์", "TLC — ออกกำลังกายลด insulin resistance", "TLC — อาหาร"], "q": [{"q": "Which of the following interventions improves (reduces) insulin resistance?", "a": "Regular aerobic exercise", "y": [31], "an": "mx", "sub": "TLC — ออกกำลังกายลด insulin resistance", "t": 254}, {"q": "Which one is correct about lifestyle recommendations for cardiovascular risk reduction?", "a": "A diet rich in vegetables and fruits", "y": [31], "an": "mx", "sub": "TLC — อาหาร", "t": 254}, {"q": "A 45-year-old man without diabetes, hypertension or cardiovascular disease has LDL-C 95 mg/dL and triglycerides 130 mg/dL. He exercises 20 minutes a day, 5 days a week. What is the most appropriate advice?", "a": "Keep a healthy diet and increase moderate-intensity aerobic exercise to at least 150 minutes per week", "y": [34], "an": "mx", "sub": "TLC — ออกกำลังกาย 150–300 นาที/สัปดาห์", "t": 254}, {"q": "A patient with two family members who have diabetes is worried about developing diabetes himself. His BMI is 22 kg/m2 and he exercises 20 minutes a day, 5 days a week. What should he be advised to change?", "a": "Increase the intensity of his physical activity", "y": [32], "an": "mx", "sub": "TLC — ออกกำลังกาย 150–300 นาที/สัปดาห์", "t": 254}]}, {"t": "Obesity — นิยาม ระบาดวิทยา และการจัดระดับด้วย BMI", "n": 0, "y": [], "w": null, "c": "BMI เกณฑ์เอเชีย (≥25 อ้วน) และนิยาม obesity 2025 ยังไม่ถูกถามตรง ๆ", "s": [], "q": []}, {"t": "สาเหตุของโรคอ้วน และยาที่ทำให้น้ำหนักขึ้น", "n": 3, "y": [30, 32], "w": "แยก Cushing จากอ้วนธรรมดา: proximal weakness + striae ม่วงกว้าง >1 cm, ฟกช้ำง่าย; ใจสั่นเป็นพักๆ ไม่ใช่อาการ Cushing (รุ่น 30, 32)", "c": null, "s": ["แยกอ้วนธรรมดาจาก Cushing", "แยกอ้วนธรรมดาจาก Cushing — striae ม่วง"], "q": [{"q": "Which clinical feature of Cushing syndrome did this examination key as the most common?", "a": "Purplish (violaceous) abdominal striae", "y": [32], "an": "fact", "sub": "แยกอ้วนธรรมดาจาก Cushing — striae ม่วง", "t": 273}, {"q": "Which clinical finding best discriminates endogenous Cushing syndrome from simple obesity?", "a": "Proximal muscle weakness with wide (>1 cm) violaceous striae, facial plethora and easy bruising", "y": [30], "an": "dx", "sub": "แยกอ้วนธรรมดาจาก Cushing", "t": 273}, {"q": "Which of the following is NOT a typical feature of Cushing syndrome?", "a": "Episodic palpitations", "y": [30], "an": "fact", "sub": "แยกอ้วนธรรมดาจาก Cushing", "t": 273}]}, {"t": "ภาวะแทรกซ้อนของโรคอ้วน", "n": 0, "y": [], "w": null, "c": "ภาวะแทรกซ้อนของโรคอ้วนและ MHO ไม่เคยออก", "s": [], "q": []}, {"t": "การประเมินผู้ป่วยโรคอ้วน — ประวัติ ตรวจร่างกาย และแล็บ", "n": 0, "y": [], "w": null, "c": "การประเมินผู้ป่วยอ้วน/complication-centric ไม่เคยออก", "s": [], "q": []}, {"t": "รักษาโรคอ้วน — อาหาร การออกกำลังกาย และยาลดน้ำหนัก", "n": 0, "y": [], "w": null, "c": "ยาลดน้ำหนัก (semaglutide 2.4, tirzepatide, orlistat) เนื้อหาเยอะแต่ยังไม่เคยออก — เป็นเนื้อหาใหม่ อาจเริ่มออก", "s": [], "q": []}, {"t": "ผ่าตัดลดน้ำหนัก (metabolic and bariatric surgery)", "n": 0, "y": [], "w": null, "c": "เกณฑ์ผ่าตัด bariatric (ไทย 27.5/32.5/37.5) ไม่เคยถาม แต่เป็นตัวเลขที่ออกง่ายถ้าออก", "s": [], "q": []}, {"t": "Lipoprotein metabolism — exogenous กับ endogenous pathway", "n": 0, "y": [], "w": null, "c": "lipoprotein pathway/PCSK9 เป็นพื้นฐานกลไก ไม่ถูกถามเดี่ยว ๆ", "s": [], "q": []}, {"t": "สาเหตุของ dyslipidemia — primary (FH) และ secondary", "n": 3, "y": [32, 33, 34], "w": "TG 1,000 + TC 300 (สูงคู่กัน) = dysbetalipoproteinemia → premature PAD (รุ่น 32)", "c": null, "s": ["FH: LDL receptor บกพร่อง", "คัดกรองด้วย lipid profile", "Primary dyslipidemia (dysbetalipoproteinemia)"], "q": [{"q": "A 35-year-old man whose father died of myocardial infarction at 40 has LDL 260 mg/dL, tendon xanthomata at the Achilles tendon and corneal arcus. Which defect is most likely?", "a": "Defective LDL receptor function", "y": [34], "an": "mech", "sub": "FH: LDL receptor บกพร่อง", "t": 19}, {"q": "A 28-year-old asymptomatic man has a strong family history of premature coronary disease. Which investigation is most appropriate first?", "a": "Fasting lipid profile", "y": [33], "an": "ix", "sub": "คัดกรองด้วย lipid profile", "t": 19}, {"q": "A patient's lipid profile shows triglyceride 1,000 mg/dL and total cholesterol 300 mg/dL. Which vascular complication is this lipid pattern most characteristically associated with?", "a": "Peripheral arterial (peripheral vascular) disease from premature limb atherosclerosis", "y": [32], "an": "mech", "sub": "Primary dyslipidemia (dysbetalipoproteinemia)", "t": 252}]}, {"t": "รักษา LDL สูง — ประเมินความเสี่ยง เป้า LDL และยา", "n": 4, "y": [29, 31], "w": "ให้ lipid profile → คำนวณ LDL ด้วย Friedewald (TC−HDL−TG/5; ตัวอย่าง 250/40/150 → 180) และเลือก high-intensity statin เมื่อ LDL ≥190 / TLC ± statin ตามความเสี่ยง (รุ่น 29, 31)", "c": null, "s": ["Statin — ยาหลัก (mixed lipid เลือกยา)", "จัดระดับความเสี่ยงก่อน แล้วจึงตั้งเป้า", "คำนวณ LDL (Friedewald)", "Statin — ยาหลัก (high-intensity)"], "q": [{"q": "A patient's fasting lipid profile shows triglyceride > 150 mg/dL, total cholesterol > 200 mg/dL, LDL-C > 150 mg/dL and HDL-C < 60 mg/dL. Which lipid-lowering drug should be given?", "a": "Fibrate (fenofibrate)", "y": [31], "an": "mx", "sub": "Statin — ยาหลัก (mixed lipid เลือกยา)", "t": 252}, {"q": "A 55-year-old man has total cholesterol 200 mg/dL, triglycerides 200 mg/dL, HDL 40 mg/dL and no diabetes or cardiovascular disease. What is the most appropriate management?", "a": "Therapeutic lifestyle change, with a statin if his calculated cardiovascular risk warrants it; fibrate is reserved for triglycerides ≥500 mg/dL", "y": [29], "an": "mx", "sub": "จัดระดับความเสี่ยงก่อน แล้วจึงตั้งเป้า", "t": 252}, {"q": "A patient has total cholesterol 250 mg/dL, HDL 40 mg/dL and triglycerides 150 mg/dL (fasting). What is the calculated LDL cholesterol using the Friedewald equation?", "a": "180 mg/dL", "y": [29], "an": "interp", "sub": "คำนวณ LDL (Friedewald)", "t": 252}, {"q": "A 45-year-old man without diabetes or known cardiovascular disease has a fasting lipid profile showing LDL-C 190 mg/dL, triglycerides 160 mg/dL and HDL-C 42 mg/dL, confirmed on repeat testing. He has started lifestyle modification. Which drug should be added?", "a": "High-intensity statin (e.g. atorvastatin 40-80 mg)", "y": [31], "an": "mx", "sub": "Statin — ยาหลัก (high-intensity)", "t": 252}]}, {"t": "ไตรกลีเซอไรด์สูง", "n": 1, "y": [32], "w": "TG 650 ไม่มี pancreatitis → fenofibrate (รุ่น 32)", "c": null, "s": ["ขั้นตอนดูแล — TG ≥500 ใช้ fibrate"], "q": [{"q": "A 50-year-old man has fasting triglyceride of 650 mg/dL and LDL-C of 110 mg/dL. He has no history of pancreatitis. Lifestyle change and alcohol cessation have been advised. Which drug should be started primarily to lower the triglyceride level?", "a": "Fenofibrate", "y": [32], "an": "mx", "sub": "ขั้นตอนดูแล — TG ≥500 ใช้ fibrate", "t": 252}]}], "th": [253, 254, 273, 19, 252]}, {"lec": "14", "title": "Thyroid disorders", "n": 34, "angle": {"ix": 10, "fact": 4, "interp": 2, "mx": 6, "dx": 6, "mech": 6}, "pattern": "เป็น lecture ที่ถูกถามมากที่สุดของ endo ข้อสอบเน้น ix (ส่งตรวจอะไรต่อ — TSH, FNA, scan, TRAb, anti-TPO) และ dx จาก spot sign (exophthalmos, delayed reflex) ร่วมกับยา ATD (PTU ไตรมาสแรก/storm, agranulocytosis, MMI ดีกว่า) คำถามซ้ำเดิมแทบทุกรุ่น 30–35 โดยเฉพาะ algorithm ก้อนไทรอยด์", "tip": "จำ algorithm thyroid nodule (TSH→FNA หรือ scan) ให้ขึ้นใจ, ลักษณะเฉพาะ Graves, P-T-U กับผลข้างเคียง ATD และ levothyroxine กับยาที่ลดการดูดซึม — ครอบคลุมเกือบทุกข้อที่เคยออก", "secs": [{"t": "ผู้จัดการกับโรงงาน — แกน HPT, deiodinase และทำไม TSH ไวที่สุด", "n": 3, "y": [31, 32], "w": "T3 vs T4: T3 ออกฤทธิ์ ส่วนใหญ่มาจาก deiodination ของ T4; สงสัยไทรอยด์ส่ง TSH ก่อน (รุ่น 31–32)", "c": null, "s": ["แกน HPT — T4 prohormone, T3 ออกฤทธิ์", "TSH คือเทอร์โมมิเตอร์ที่ไวที่สุด"], "q": [{"q": "A patient complains of weight gain, easy fatigability and eating a lot, and hypothyroidism is suspected. Which investigation should be sent first?", "a": "Serum TSH", "y": [32], "an": "ix", "sub": "TSH คือเทอร์โมมิเตอร์ที่ไวที่สุด", "t": 263}, {"q": "Which statement correctly compares triiodothyronine (T3) and thyroxine (T4)?", "a": "T3 is the biologically active hormone at peripheral tissues, mostly produced by deiodination of T4", "y": [31], "an": "fact", "sub": "แกน HPT — T4 prohormone, T3 ออกฤทธิ์", "t": 270}, {"q": "Which statement correctly compares T3 and T4?", "a": "T3 is the biologically active hormone acting on peripheral tissues; most T3 comes from peripheral deiodination of T4", "y": [31], "an": "fact", "sub": "แกน HPT — T4 prohormone, T3 ออกฤทธิ์", "t": 270}]}, {"t": "ถอดรหัส TFT ในห้านาที", "n": 2, "y": [31, 34], "w": "อ่าน TFT: TSH ต่ำ FT4 สูง = primary hyperthyroid; TSH สูง FT4 ปกติ (รุ่น 31, 34)", "c": null, "s": ["Hypothyroid patterns — TSH สูง FT4 ปกติ", "Thyrotoxicosis patterns"], "q": [{"q": "Thyroid function tests show an elevated TSH with normal free T3 and free T4. What is the diagnosis?", "a": "Primary hypothyroidism", "y": [31], "an": "interp", "sub": "Hypothyroid patterns — TSH สูง FT4 ปกติ", "t": 263}, {"q": "Thyroid function tests show a low TSH, a high free T4, and a T3 at the upper limit of normal. What is the diagnosis?", "a": "Primary hyperthyroidism", "y": [34], "an": "interp", "sub": "Thyrotoxicosis patterns", "t": 266}]}, {"t": "Thyrotoxicosis ≠ hyperthyroidism — โรงงานเร่ง หรือ โกดังแตก", "n": 0, "y": [], "w": null, "c": "RAIU แยก thyrotoxicosis vs hyperthyroidism, factitious ไม่ถูกถามตรง", "s": [], "q": []}, {"t": "อาการไทรอยด์เป็นพิษ — ทุกข้อไล่กลับไปหากลไกได้", "n": 4, "y": [30, 32, 33, 35], "w": null, "c": null, "s": ["thyrotoxic periodic paralysis → K + propranolol", "thyrotoxic periodic paralysis", "อาการตามกลไก — น้ำหนักลด ใจสั่น", "อาการตามกลไก — hypoK (Na/K-ATPase)"], "q": [{"q": "A young Asian man wakes with proximal muscle weakness. K 1.9 mEq/L, TSH suppressed with high free T4. What is the management?", "a": "Careful potassium replacement with propranolol and definitive treatment of thyrotoxicosis", "y": [35], "an": "mx", "sub": "thyrotoxic periodic paralysis → K + propranolol", "t": 74}, {"q": "A patient has proximal muscle weakness with K 2.4 mEq/L and a suppressed TSH. What is the complete diagnosis?", "a": "Thyrotoxic periodic paralysis", "y": [32], "an": "dx", "sub": "thyrotoxic periodic paralysis", "t": 74}, {"q": "A patient reports weight loss and the EKG shows sinus tachycardia. Which condition is most likely?", "a": "Thyrotoxicosis (hyperthyroidism)", "y": [30], "an": "dx", "sub": "อาการตามกลไก — น้ำหนักลด ใจสั่น", "t": 266}, {"q": "In a patient with hyperthyroidism who is found to be hypokalaemic, what is the main mechanism of the hypokalaemia?", "a": "Transcellular shift of potassium into cells from increased Na+/K+-ATPase activity", "y": [33], "an": "mech", "sub": "อาการตามกลไก — hypoK (Na/K-ATPase)", "t": 266}]}, {"t": "Graves' disease — แอนติบอดีปลอมตัวเป็น TSH", "n": 4, "y": [30, 31, 35], "w": "Graves: TRAb เป็นสาเหตุ/ส่งตรวจ, exophthalmos และ pretibial myxedema เฉพาะ Graves (รุ่น 30, 31, 35)", "c": null, "s": ["กลไก — TRAb กระตุ้น TSH receptor", "แอนติบอดี — TRAb", "ป้ายชื่อของ Graves — ตา/pretibial myxedema", "ป้ายชื่อของ Graves — exophthalmos"], "q": [{"q": "A pregnant woman is found to have a thyroid problem (thyrotoxicosis). Her family history is positive for Graves' disease. What is the underlying cause of her thyroid disease?", "a": "An autoantibody that stimulates the TSH receptor (TSH receptor antibody, TRAb)", "y": [31], "an": "mech", "sub": "กลไก — TRAb กระตุ้น TSH receptor", "t": 267}, {"q": "A woman presents with symptoms of thyrotoxicosis and her elder sister has Graves' disease. Which additional investigation should be sent to establish the cause?", "a": "TSH receptor antibody (TRAb)", "y": [31], "an": "ix", "sub": "แอนติบอดี — TRAb", "t": 267}, {"q": "Which clinical feature is specific to Graves disease and not found in other causes of thyrotoxicosis?", "a": "Infiltrative ophthalmopathy (proptosis/exophthalmos) or pretibial myxoedema", "y": [30], "an": "fact", "sub": "ป้ายชื่อของ Graves — ตา/pretibial myxedema", "t": 267}, {"q": "A 32-year-old woman has thyrotoxicosis with low TSH and high free T3 and free T4. Which physical finding is specific for Graves' disease rather than other causes of thyrotoxicosis?", "a": "Exophthalmos (Graves' ophthalmopathy)", "y": [35], "an": "dx", "sub": "ป้ายชื่อของ Graves — exophthalmos", "t": 267}]}, {"t": "Thyroiditis สามแบบ — และ subacute thyroiditis สามระยะ", "n": 3, "y": [31, 32, 35], "w": "Hashimoto เป็นสาเหตุ hypothyroid อันดับหนึ่ง → anti-TPO; subacute thyroiditis หลัง URI เจ็บคอ (รุ่น 31, 32, 35)", "c": null, "s": ["Hashimoto's thyroiditis — anti-TPO", "Hashimoto — สาเหตุหลักของ hypothyroid", "Subacute thyroiditis หลัง URI"], "q": [{"q": "A 45-year-old woman has fatigue, cold intolerance, weight gain and a firm diffuse goitre. TSH is raised with low free T4. Which antibody test best supports Hashimoto thyroiditis as the cause?", "a": "Anti-thyroid peroxidase (anti-TPO) antibody", "y": [35], "an": "ix", "sub": "Hashimoto's thyroiditis — anti-TPO", "t": 265}, {"q": "In an iodine-sufficient area such as present-day Thailand, what is the most common cause of primary hypothyroidism in adults?", "a": "Chronic autoimmune (Hashimoto) thyroiditis", "y": [32], "an": "fact", "sub": "Hashimoto — สาเหตุหลักของ hypothyroid", "t": 265}, {"q": "A woman had an upper respiratory tract infection, and about two weeks later developed pain and tenderness over the anterior neck with a slightly enlarged thyroid gland. Her TSH is 20 mIU/L. What is the most likely diagnosis?", "a": "Subacute (granulomatous, de Quervain) thyroiditis in the hypothyroid phase", "y": [31], "an": "dx", "sub": "Subacute thyroiditis หลัง URI", "t": 269}]}, {"t": "ยาต้านไทรอยด์ — MMI คือยาแรก, PTU แค่ P-T-U", "n": 2, "y": [30, 31], "w": null, "c": null, "s": ["P-T-U — storm ยับยั้ง T4→T3", "กลไกและเภสัช — MMI ดีกว่า PTU"], "q": [{"q": "In the management of thyroid storm, which antithyroid (thionamide) drug is preferred, because in addition to blocking thyroid hormone synthesis it also inhibits the peripheral conversion of T4 to T3?", "a": "Propylthiouracil", "y": [31], "an": "mech", "sub": "P-T-U — storm ยับยั้ง T4→T3", "t": 268}, {"q": "For a non-pregnant adult with Graves disease starting antithyroid drug therapy, why is methimazole preferred over propylthiouracil?", "a": "Lower risk of severe hepatotoxicity (acute liver failure), once-daily dosing and faster control", "y": [30], "an": "mx", "sub": "กลไกและเภสัช — MMI ดีกว่า PTU", "t": 268}]}, {"t": "ผลข้างเคียงของ ATD, การตั้งครรภ์ และ β-blocker", "n": 2, "y": [31, 34], "w": null, "c": null, "s": ["การตั้งครรภ์ — PTU ไตรมาสแรก", "กฎเหล็ก — agranulocytosis"], "q": [{"q": "A pregnant woman at 8 weeks of gestation (first trimester) is found to have hyperthyroidism on thyroid function tests. Which drug should she be treated with?", "a": "Propylthiouracil (PTU)", "y": [34], "an": "mx", "sub": "การตั้งครรภ์ — PTU ไตรมาสแรก", "t": 268}, {"q": "What is the most serious side effect of thionamide (antithyroid) drugs?", "a": "Agranulocytosis", "y": [31], "an": "mech", "sub": "กฎเหล็ก — agranulocytosis", "t": 268}]}, {"t": "เลือกทางรักษา Graves — ATD · RAI · ผ่าตัด และใครจะกลับเป็นซ้ำ", "n": 0, "y": [], "w": null, "c": "RAI vs ผ่าตัด, GREAT score, การกลับเป็นซ้ำ — เนื้อหามาก แต่ไม่เคยออก", "s": [], "q": []}, {"t": "Toxic adenoma, toxic multinodular goiter และ thyroid storm", "n": 0, "y": [], "w": null, "c": "Toxic adenoma/TMNG และลำดับรักษา thyroid storm ยังไม่ถูกถามตรง (มีแค่ PTU ใน storm) ควรรู้ลำดับ β-blocker→PTU→iodine→steroid", "s": [], "q": []}, {"t": "Hypothyroidism — ทุกอย่างช้าลง และมีเมือกพอกผิว", "n": 7, "y": [29, 30, 32, 33], "w": "Hypothyroid: delayed DTR relaxation / Queen Anne sign, กลไก = ต่อมสร้างฮอร์โมนลดลง, รักษา levothyroxine, เหล็กลดการดูดซึม LT4 (แยก ≥4 ชม.) — รุ่น 29–33", "c": null, "s": ["Levothyroxine", "อาการตามกลไก — delayed DTR relaxation", "อาการตามกลไก — คิ้ว/ผิว/reflex", "Primary vs central"], "q": [{"q": "Which physical finding is relatively specific for hypothyroidism?", "a": "Delayed relaxation phase of the deep tendon reflexes (Woltman sign)", "y": [30], "an": "dx", "sub": "อาการตามกลไก — delayed DTR relaxation", "t": 263}, {"q": "Loss of the lateral third of the eyebrows (Queen Anne/Hertoghe sign), dry coarse skin and delayed relaxation of ankle reflexes suggest which condition?", "a": "Hypothyroidism", "y": [30], "an": "dx", "sub": "อาการตามกลไก — คิ้ว/ผิว/reflex", "t": 263}, {"q": "A woman has weight gain, fatigue, cold intolerance and decreased breath sounds at both lung bases from small pleural effusions. TSH is high and free T4 is low. What is the mechanism of this condition?", "a": "Decreased thyroid hormone secretion by the thyroid gland", "y": [33], "an": "mech", "sub": "Primary vs central", "t": 263}, {"q": "A 40-year-old woman is diagnosed with Hashimoto thyroiditis with hypothyroidism. Which drug should she be treated with?", "a": "Levothyroxine (thyroxine)", "y": [32], "an": "mx", "sub": "Levothyroxine", "t": 264}, {"q": "A 40-year-old woman is diagnosed with Hashimoto thyroiditis with overt hypothyroidism (high TSH, low free T4). What is the treatment of choice?", "a": "Levothyroxine (L-thyroxine) once daily, titrated to TSH", "y": [32, 33], "an": "mx", "sub": "Levothyroxine", "t": 264}, {"q": "A 50-year-old woman with Hashimoto hypothyroidism stable on levothyroxine starts ferrous sulfate taken together with her morning levothyroxine. Six weeks later her TSH has risen from 2 to 9 mIU/L. Why?", "a": "Iron binds levothyroxine in the gut and reduces its absorption", "y": [30], "an": "mech", "sub": "Levothyroxine — แยกจากเหล็ก ≥4 ชม.", "t": 264}, {"q": "A 32-year-old woman with fatigue and weight gain has TSH 25 mIU/L (0.35–4.94), FT4 0.6 ng/dL (0.7–1.48). What are the diagnosis, the confirmatory test of the cause, and the treatment plan?", "a": "Primary hypothyroidism; anti-thyroid peroxidase antibody for Hashimoto thyroiditis; levothyroxine with TSH rechecked after 6–8 weeks", "y": [29], "an": "mx", "sub": "Primary hypothyroid → anti-TPO → LT4", "t": 265}]}, {"t": "Amiodarone และไอโอดีน — Wolff–Chaikoff กับ Jod–Basedow", "n": 0, "y": [], "w": null, "c": "Amiodarone AIT 1 vs 2 ไม่เคยออก แต่เป็นหัวข้อคลาสสิกของ IM", "s": [], "q": []}, {"t": "ก้อนที่คอ — ทำงานไหม แล้วร้ายไหม", "n": 7, "y": [31, 32, 33, 34], "w": "ก้อนไทรอยด์: ส่ง TSH ก่อน → TSH ปกติ = FNA, TSH ต่ำ = thyroid scan (Tc-99m/I-123); ออกซ้ำรุ่น 31–34 รวม 7 ข้อ", "c": null, "s": ["Algorithm — TSH ปกติ → FNA", "Algorithm — TSH ต่ำ → thyroid scan", "Algorithm — TSH ก่อน"], "q": [{"q": "A patient has a palpable thyroid nodule and normal thyroid function tests. What is the appropriate next investigation to establish the diagnosis?", "a": "Fine-needle aspiration of the nodule for cytology", "y": [34], "an": "ix", "sub": "Algorithm — TSH ปกติ → FNA", "t": 262}, {"q": "A patient has an asymptomatic 2-cm thyroid nodule with normal thyroid function tests. What is the most appropriate next step?", "a": "Fine-needle aspiration (FNA) of the nodule", "y": [31], "an": "ix", "sub": "Algorithm — TSH ปกติ → FNA", "t": 262}, {"q": "A patient has gained 10 kg in weight and has a palpable neck mass. Which investigation should be performed first?", "a": "Thyroid function tests (serum TSH and free T4)", "y": [34], "an": "ix", "sub": "Algorithm — TSH ก่อน", "t": 262}, {"q": "A patient is found to have a thyroid nodule. TSH, FT3 and FT4 are all normal. What is the most appropriate next investigation?", "a": "Fine needle aspiration of the nodule", "y": [32], "an": "ix", "sub": "Algorithm — TSH ปกติ → FNA", "t": 262}, {"q": "A patient is found to have a thyroid nodule. Thyroid function tests and the rest of the evaluation are all normal. What is the most appropriate next step?", "a": "Fine-needle aspiration of the nodule", "y": [32], "an": "ix", "sub": "Algorithm — TSH ปกติ → FNA", "t": 262}, {"q": "A patient has a 20 g non-tender thyroid gland containing a 3 cm nodule. Serum TSH is low. What is the most appropriate next step in evaluation?", "a": "Radionuclide thyroid scan (scintigraphy) to see whether the nodule is autonomously functioning", "y": [33], "an": "ix", "sub": "Algorithm — TSH ต่ำ → thyroid scan", "t": 262}, {"q": "A 46-year-old woman has a 2.5-cm thyroid nodule. Serum TSH is suppressed (<0.01 mIU/L) with a high-normal free T4. What is the most appropriate next investigation?", "a": "Radionuclide thyroid scan (Tc-99m or I-123 scintigraphy)", "y": [31], "an": "ix", "sub": "Algorithm — TSH ต่ำ → thyroid scan", "t": 262}]}], "th": [270, 74, 266, 267, 265, 269, 268, 263, 264, 262]}, {"lec": "14/10", "title": "Diabetes mellitus — ตั้งแต่วินิจฉัยถึง DKA", "n": 32, "angle": {"mech": 2, "fact": 6, "mx": 14, "dx": 6, "ix": 4}, "pattern": "DKA ครองข้อสอบ — ถามลำดับการรักษา (น้ำก่อน insulin, K ก่อน insulin) ซ้ำแทบทุกรุ่น 28–34 ด้วย stem สั้น ๆ 'next step' ส่วนที่เหลือเป็น vignette จำแนกชนิดเบาหวาน (MODY/LADA/3c) ที่เริ่มออกใหม่รุ่น 34–35 และคัดกรองภาวะแทรกซ้อนรายปี ยาเบาหวานถูกถามตรงน้อย (metformin ยาแรก) แต่ diabetic nephropathy ออกเป็นชุดในหมวดไต 7 ข้อ — hyperfiltration, UACR, ACEI + SGLT2i", "tip": "ทวนลำดับรักษา DKA (NSS → K check → insulin 0.1 U/kg/h → dextrose) และเกณฑ์วินิจฉัย DKA ให้แม่น แล้วเพิ่มการแยก MODY/LADA/type 3c และการรักษา hypoglycemia; อ่านยา SGLT2/GLP-1 เผื่อออกใหม่", "secs": [{"t": "เบาหวานคืออะไร — insulin ทำงานที่ไหน และแนวทาง 5 ขั้น", "n": 0, "y": [], "w": null, "c": "นิยามและ insulin action เป็นพื้นฐาน ไม่ถูกถาม", "s": [], "q": []}, {"t": "ทำไมถึงมีอาการ — ปัสสาวะมาก กระหายน้ำ น้ำหนักลด ตามัว", "n": 2, "y": [30, 31], "w": "acanthosis nigricans = insulin resistance; DM ทำให้ COVID พยากรณ์แย่ (รุ่น 30, 31)", "c": null, "s": ["acanthosis — insulin resistance", "ติดเชื้อง่าย (COVID พยากรณ์แย่)"], "q": [{"q": "A patient whose mother and maternal grandmother both have diabetes mellitus is found to have acanthosis nigricans. Which underlying mechanism does this skin finding indicate?", "a": "Insulin resistance with compensatory hyperinsulinaemia", "y": [31], "an": "mech", "sub": "acanthosis — insulin resistance", "t": 255}, {"q": "Which of the following statements about diabetes mellitus and COVID-19 is correct?", "a": "Diabetes mellitus is associated with a poorer prognosis of COVID-19 infection", "y": [30], "an": "fact", "sub": "ติดเชื้อง่าย (COVID พยากรณ์แย่)", "t": 261}]}, {"t": "วินิจฉัย ภาวะก่อนเบาหวาน และใครต้องคัดกรอง", "n": 1, "y": [30], "w": null, "c": null, "s": ["Pre-diabetes (IFG)"], "q": [{"q": "A patient whose mother has type 2 diabetes is found to have a fasting blood glucose of 115 mg/dL. What should be done?", "a": "Lifestyle modification — weight loss, diet control and regular exercise", "y": [30], "an": "mx", "sub": "Pre-diabetes (IFG)", "t": 254}]}, {"t": "ชนิดของเบาหวาน และ T1 — ภูมิคุ้มกันทำลาย β cell", "n": 4, "y": [31, 34, 35], "w": "จำแนกชนิด DM: MODY (ประวัติครอบครัวหลายรุ่น), LADA (anti-GAD+, autoimmune ร่วม), type 3c จากตับอ่อนอักเสบเรื้อรัง (รุ่น 31, 34, 35)", "c": null, "s": ["ชนิดจำเพาะ — MODY", "ชนิดจำเพาะ — exocrine pancreas (type 3c)", "Type 1 autoimmune — LADA (anti-GAD)"], "q": [{"q": "A 16-year-old adolescent is found to have diabetes mellitus. She is obese (BMI 31 kg/m2) and has clinical evidence of insulin resistance. Her mother and her maternal grandmother also have diabetes. Which type of diabetes mellitus does this vignette describe?", "a": "Maturity-onset diabetes of the young (MODY)", "y": [31], "an": "dx", "sub": "ชนิดจำเพาะ — MODY", "t": 255}, {"q": "A 25-year-old woman presents with frequent urination and is found to have diabetes. Almost every member of her family has diabetes as well. What is the most likely diagnosis?", "a": "Maturity-onset diabetes of the young (MODY)", "y": [34], "an": "dx", "sub": "ชนิดจำเพาะ — MODY", "t": 255}, {"q": "A thin man with long-standing alcoholic chronic pancreatitis (pancreatic calcification and steatorrhoea) is normotensive, has FPG below 126 mg/dL, but HbA1c is 6.7%. How should his diabetes be classified?", "a": "Other specific type — diabetes due to disease of the exocrine pancreas (type 3c)", "y": [35], "an": "dx", "sub": "ชนิดจำเพาะ — exocrine pancreas (type 3c)", "t": 255}, {"q": "A 38-year-old normal-weight woman with Hashimoto thyroiditis and rheumatoid arthritis is diagnosed with diabetes. She was controlled on oral agents for 1 year but now needs insulin. Anti-GAD antibody is positive. What is the most likely type of diabetes?", "a": "Latent autoimmune diabetes in adults (LADA)", "y": [35], "an": "dx", "sub": "Type 1 autoimmune — LADA (anti-GAD)", "t": 255}]}, {"t": "Type 2 — ดื้อ insulin + β cell ล้า · แยก T1/T2 · C-peptide", "n": 1, "y": [33], "w": null, "c": null, "s": ["แยก T1 กับ T2"], "q": [{"q": "A 19-year-old lean woman (BMI 19 kg/m2) has 3 weeks of polyuria, polydipsia and weight loss. Fasting plasma glucose is 260 mg/dL. There is no acanthosis nigricans. Several relatives have type 2 diabetes. Which type of diabetes is most likely?", "a": "Type 1 diabetes (insulin deficiency)", "y": [33], "an": "dx", "sub": "แยก T1 กับ T2", "t": 255}]}, {"t": "Gestational diabetes — ทำไมทารกตัวโตแล้วน้ำตาลต่ำหลังคลอด", "n": 1, "y": [30], "w": null, "c": null, "s": ["หลังวินิจฉัย — OGTT หลังคลอด/คัดกรองต่อ"], "q": [{"q": "A woman had gestational diabetes in a previous pregnancy. Which investigation should be used to diagnose type 2 diabetes in her?", "a": "75-g oral glucose tolerance test (2-hour plasma glucose)", "y": [30], "an": "ix", "sub": "หลังวินิจฉัย — OGTT หลังคลอด/คัดกรองต่อ", "t": 256}]}, {"t": "DKA และ HHS — กลไก อาการ และเกณฑ์วินิจฉัย", "n": 2, "y": [31, 34], "w": "DKA: fruity breath, เกณฑ์ glucose ≥250, pH <7.3, HCO3 <18 + ketone (รุ่น 31, 34)", "c": null, "s": ["ทำไมถึงมีอาการนี้ — acetone breath", "เกณฑ์วินิจฉัย DKA"], "q": [{"q": "A 19-year-old man presents with vomiting, abdominal pain and deep rapid breathing. Plasma glucose is 480 mg/dL. Which physical finding most supports diabetic ketoacidosis?", "a": "Fruity (acetone) odour of the breath", "y": [31], "an": "dx", "sub": "ทำไมถึงมีอาการนี้ — acetone breath", "t": 259}, {"q": "Which set of findings fulfils the diagnostic criteria for diabetic ketoacidosis (DKA)?", "a": "Plasma glucose ≥ 250 mg/dL (or known diabetes), arterial pH < 7.30 and/or HCO3 < 18 mEq/L, with raised serum or urine ketones", "y": [34], "an": "fact", "sub": "เกณฑ์วินิจฉัย DKA", "t": 259}]}, {"t": "รักษา DKA/HHS — น้ำก่อน · ดู K ก่อน insulin · ระวังน้ำตาลและ osmolality ลดเร็ว", "n": 8, "y": [28, 30, 31, 32, 34], "w": "รักษา DKA: NSS 0.9% ก่อน (ความดันต่ำ) → insulin regular IV 0.1 U/kg/h (ไม่ใช่ IM) → K <3.3 ให้ K ก่อนห้าม insulin; ออกซ้ำ 8 ข้อ รุ่น 28–34", "c": null, "s": ["ลำดับการรักษา — NSS ก่อน", "ลำดับการรักษา — insulin 0.1 U/kg/h", "ลำดับการรักษา — insulin drip หลังน้ำ", "K < 3.3 ห้ามเริ่ม insulin"], "q": [{"q": "A patient presents with a blood glucose just over 300 mg/dL and has already received intravenous fluid resuscitation. What is the most appropriate next step in treatment?", "a": "Start a continuous intravenous regular insulin infusion (0.1 unit/kg/hr)", "y": [32], "an": "mx", "sub": "ลำดับการรักษา — insulin 0.1 U/kg/h", "t": 258}, {"q": "A patient presents with dyspnoea, blood sugar 500 mg/dL and diabetic ketoacidosis. Blood pressure is 80/65 mmHg. What is the most appropriate initial management?", "a": "IV 0.9% NaCl 1,000 mL infused rapidly as the first step", "y": [31], "an": "mx", "sub": "ลำดับการรักษา — NSS ก่อน", "t": 258}, {"q": "A patient with diabetes mellitus has not injected insulin for a day and now presents with a hyperglycaemic crisis. What is the appropriate initial management?", "a": "Intravenous 0.9% NaCl (normal saline)", "y": [31], "an": "mx", "sub": "ลำดับการรักษา — NSS ก่อน", "t": 258}, {"q": "A patient with diabetic ketoacidosis has received initial intravenous fluid resuscitation. What should be given next?", "a": "Intravenous regular insulin infusion", "y": [32], "an": "mx", "sub": "ลำดับการรักษา — insulin drip หลังน้ำ", "t": 258}, {"q": "A patient with type 1 diabetes mellitus presents with diabetic ketoacidosis. Serum potassium is 3.2 mEq/L. What is the appropriate management?", "a": "Give intravenous potassium first and withhold insulin until serum K is at least 3.3 mEq/L", "y": [34], "an": "mx", "sub": "K < 3.3 ห้ามเริ่ม insulin", "t": 258}, {"q": "In the management of diabetic ketoacidosis, which of the following is NOT part of the treatment?", "a": "Intramuscular insulin", "y": [30], "an": "mx", "sub": "ลำดับการรักษา — insulin IV ไม่ใช่ IM", "t": 258}, {"q": "Which one is the most important component of the initial treatment of diabetic ketoacidosis (DKA)?", "a": "Intravenous 0.9% NaCl (normal saline)", "y": [31], "an": "mx", "sub": "ลำดับการรักษา — NSS ก่อน", "t": 258}, {"q": "A patient with diabetic ketoacidosis has BP 90/60 mmHg, pulse 120/min and dry mucosa. What is the first step in management?", "a": "Rapid intravenous 0.9% saline (about 1–1.5 L in the first hour)", "y": [28], "an": "mx", "sub": "ลำดับการรักษา — NSS 15–20 mL/kg", "t": 258}]}, {"t": "Hypoglycemia — อาการเตือน สมองขาดน้ำตาล และ unawareness", "n": 2, "y": [30, 33], "w": "Hypoglycemia: Whipple triad, SU + กลืนไม่ได้ → 50% glucose 50 mL IV (รุ่น 30, 33)", "c": null, "s": ["นิยาม — Whipple triad", "การรักษา — 50% glucose IV"], "q": [{"q": "A 30-year-old woman reports episodes of sweating, tremor and confusion. Which finding establishes that the episodes are due to true hypoglycaemia (before searching for its cause)?", "a": "Whipple triad: symptoms of hypoglycaemia, a documented low plasma glucose at the time, and relief when glucose is raised", "y": [30], "an": "fact", "sub": "นิยาม — Whipple triad", "t": 260}, {"q": "A patient with type 2 diabetes taking a sulfonylurea is brought in confused and sweating, unable to swallow safely. Capillary glucose is 38 mg/dL. What is the most appropriate immediate management?", "a": "Give 50% glucose 50 mL IV push immediately, then continue a dextrose infusion", "y": [33], "an": "mx", "sub": "การรักษา — 50% glucose IV", "t": 260}]}, {"t": "Diabetic retinopathy — จาก microaneurysm ถึงหลอดเลือดใหม่ที่เปราะ", "n": 1, "y": [34], "w": null, "c": null, "s": ["ตรวจคัดกรองจอตาทุกปี"], "q": [{"q": "A patient with type 2 diabetes mellitus has an HbA1c of 7.5%. Which complication screening must be performed every year?", "a": "Dilated fundus examination for diabetic retinopathy", "y": [34], "an": "ix", "sub": "ตรวจคัดกรองจอตาทุกปี", "t": 257}]}, {"t": "Diabetic nephropathy — hyperfiltration ถึงไตวาย และยาที่ลดแรงดันใน glomerulus", "n": 8, "y": [30, 31, 32, 33, 34, 35], "w": "microalbuminuria เป็นตัวพยากรณ์ nephropathy (รุ่น 34)", "c": null, "s": ["ACEI + SGLT2i", "ปัจจัยเร่งไตเสื่อม", "hyperfiltration ระยะแรก", "UACR คัดกรอง"], "q": [{"q": "A 60-year-old woman with type 2 diabetes, hypertension and dyslipidaemia on glibenclamide, enalapril and simvastatin has urine protein 2+ and creatinine 1.6 mg/dL. What is the most appropriate management?", "a": "Continue ACE inhibitor and add an SGLT2 inhibitor", "y": [31], "an": "mx", "sub": "ACEI + SGLT2i", "t": 45}, {"q": "Which factor most accelerates progression of chronic kidney disease in a diabetic patient with HbA1c 11 percent and albuminuria?", "a": "Uncontrolled glucose and BP", "y": [32], "an": "fact", "sub": "ปัจจัยเร่งไตเสื่อม", "t": 45}, {"q": "What is the earliest pathophysiological change in diabetic nephropathy?", "a": "Glomerular hyperfiltration", "y": [35], "an": "mech", "sub": "hyperfiltration ระยะแรก", "t": 45}, {"q": "Which test is used to screen for and predict progression of diabetic nephropathy?", "a": "Urine albumin-to-creatinine ratio", "y": [31, 33], "an": "ix", "sub": "UACR คัดกรอง", "t": 45}, {"q": "Which antidiabetic drug class has proven renoprotective benefit in patients with albuminuria?", "a": "SGLT2 inhibitor", "y": [35], "an": "mx", "sub": "SGLT2i ป้องกันไต", "t": 45}, {"q": "What is the most common cause of chronic kidney disease and end-stage kidney disease in Thailand and worldwide?", "a": "Diabetic kidney disease", "y": [30], "an": "fact", "sub": "สาเหตุ CKD อันดับหนึ่ง", "t": 45}, {"q": "A 62-year-old man with type 2 diabetes has chronic kidney disease with an eGFR of 10 mL/min/1.73 m2 (not yet on dialysis). Which glucose-lowering drug should NOT be newly started at this level of kidney function?", "a": "Empagliflozin (an SGLT2 inhibitor)", "y": [32], "an": "mx", "sub": "SGLT2i ตาม eGFR", "t": 67}, {"q": "Which finding is the best predictor of progression of diabetic nephropathy?", "a": "Microalbuminuria (increased urinary albumin excretion)", "y": [34], "an": "fact", "sub": "Albuminuria — microalbuminuria", "t": 257}]}, {"t": "Diabetic neuropathy และเท้าเบาหวาน — ทำไมแผลเกิดโดยไม่เจ็บ", "n": 0, "y": [], "w": null, "c": "neuropathy/เท้าเบาหวาน monofilament ไม่เคยออก", "s": [], "q": []}, {"t": "Macrovascular และเป้าหมายการรักษาแบบองค์รวม", "n": 1, "y": [], "w": null, "c": null, "s": ["Holistic management — ประเมินแรกวินิจฉัย"], "q": [{"q": "A 35-year-old man with newly diagnosed type 2 diabetes, BMI 30 and BP 150/90 mmHg, who runs 5 km every day without symptoms, attends for his first diabetes assessment. Which examination is LEAST appropriate at this time?", "a": "Exercise stress test for coronary artery disease", "y": [], "an": "ix", "sub": "Holistic management — ประเมินแรกวินิจฉัย", "t": 257}]}, {"t": "ยาเม็ดและยากลุ่ม incretin — ออกฤทธิ์ที่ไหน และผลข้างเคียงมาจากไหน", "n": 1, "y": [31, 34, 35], "w": null, "c": null, "s": ["metformin ยาแรก"], "q": [{"q": "A 50-year-old obese woman presents with polyuria and weight loss. FPG is 180 mg/dL and a repeat FPG is 190 mg/dL. Serum creatinine is 0.6 mg/dL. What is the first-line drug for this patient?", "a": "Metformin", "y": [31, 34, 35], "an": "mx", "sub": "metformin ยาแรก", "t": 67}]}, {"t": "แนวทางรักษา T2 (Thai CPG 2020) และการใช้ insulin", "n": 0, "y": [], "w": null, "c": "Thai CPG 2020 และ insulin regimen ไม่เคยออก", "s": [], "q": []}], "th": [261, 255, 256, 259, 258, 260, 257, 45]}], "gaps": [{"id": "gap-endo-03", "set": "endo", "title": "Adrenal insufficiency และ corticosteroid — primary vs secondary, cosyntropin test, adrenal crisis", "subtitle": "ACTH กับ hyperpigmentation แยกระดับโรค และตารางฤทธิ์ glucocorticoid/mineralocorticoid ของ steroid แต่ละตัว", "md": "### กลไก: primary vs secondary\n- **Primary (Addison disease)**: adrenal cortex ถูกทำลาย → ขาดทั้ง cortisol และ aldosterone → ACTH สูงมาก; POMC ที่ถูกสร้างเพิ่มให้ α-MSH ด้วย → **hyperpigmentation**\n- สาเหตุ primary: autoimmune, **TB** (สำคัญในไทย ต่อมมักโตหรือมี calcification), เชื้อราและ CMV ในผู้ติดเชื้อ HIV, metastasis, เลือดออกใน adrenal ทั้งสองข้าง (anticoagulant, meningococcemia, APS), ยา (ketoconazole, etomidate)\n- **Secondary/tertiary**: ACTH หรือ CRH ขาด → ขาดเฉพาะ cortisol ส่วน aldosterone ยังคุมโดย RAAS; สาเหตุที่พบบ่อยที่สุดคือ **หยุด glucocorticoid ที่ใช้นาน** รองลงมาคือโรค pituitary และ Sheehan syndrome\n- Na ต่ำใน secondary AI เกิดจาก cortisol ขาด → ADH หลั่งมากขึ้น และไตขับน้ำอิสระไม่ได้ (euvolemic คล้าย SIADH) ไม่ใช่จาก aldosterone ขาด\n- อาการร่วม: อ่อนเพลีย, น้ำหนักลด, เบื่ออาหาร, คลื่นไส้, ปวดท้อง, postural hypotension, hypoglycemia, eosinophilia, Ca สูงเล็กน้อย\n\n| ลักษณะ | Primary | Secondary/tertiary |\n|---|---|---|\n| ACTH | สูง (> 2 เท่าของค่าสูงสุด) | ต่ำหรือปกติ (ไม่เหมาะสม) |\n| Hyperpigmentation (buccal mucosa, เหงือก, รอยพับฝ่ามือ, แผลเป็น, ผิวโดนแดด) | **มี** | ไม่มี ผิวซีด |\n| Aldosterone/renin | aldosterone ต่ำ renin สูง | ปกติ |\n| K สูง, อยากเกลือ, ความดันตกท่ายืนรุนแรง | มี | ไม่มี |\n| Na ต่ำ | มี | มีได้ |\n| ฮอร์โมนอื่นที่ผิดปกติร่วม | autoimmune polyglandular (hypothyroid, T1DM, vitiligo) | แกน pituitary อื่น |\n| Fludrocortisone | ต้องให้ | ไม่ต้อง |\n\n- Sheehan syndrome: ตกเลือดหลังคลอดรุนแรง แล้วไม่มีน้ำนม ประจำเดือนไม่มา อ่อนเพลีย Na ต่ำ → กลไกคือ pituitary infarction ทำให้ **ACTH deficiency** (ร่วมกับ prolactin, gonadotropin, TSH ขาด)\n\n### วินิจฉัย\n1. **Cortisol 08:00 พร้อม ACTH ในหลอดเดียวกัน**: cortisol < 3–5 µg/dL แทบยืนยัน AI; > 15–18 µg/dL ตัด AI ได้ (cut-off ขึ้นกับ assay); ค่ากลาง ๆ เช่น 10 µg/dL ถือว่าก้ำกึ่ง\n2. ก้ำกึ่ง → **cosyntropin (ACTH 1–24) stimulation test**: ฉีด 250 µg IV/IM วัด cortisol ที่ 0, 30, 60 นาที; ค่าสูงสุด < 18 µg/dL (500 nmol/L) = AI (assay ใหม่ที่จำเพาะกว่าใช้ ~14–15 µg/dL); ทำได้ทุกเวลา\n3. แยกระดับ: ACTH สูง = primary; ACTH ต่ำหรือปกติ = secondary แล้วตรวจแกน pituitary อื่นและ MRI; primary ตรวจ 21-hydroxylase antibody, CT adrenal, CXR หา TB\n- Secondary AI ที่เพิ่งเกิด (< 4–6 สัปดาห์ เช่น หลังผ่าตัด pituitary) cosyntropin test อาจปกติลวงเพราะ adrenal ยังไม่ฝ่อ จึงอาศัย cortisol เช้าคู่ ACTH; gold standard คือ insulin tolerance test (ห้ามในโรคหัวใจขาดเลือดและลมชัก)\n- กับดัก: OCP เพิ่ม CBG ทำให้ total cortisol สูงลวง; prednisolone cross-react กับ assay ส่วน dexamethasone ไม่รบกวน\n\n### Adrenal crisis\n- ตัวกระตุ้น: ติดเชื้อ ผ่าตัด อุบัติเหตุ และ **หยุด steroid ที่กินนานเอง** (ในไทยรวมยาชุด ยาลูกกลอน)\n- อาการ: shock ที่ไม่ตอบสนองต่อสารน้ำและ vasopressor, ปวดท้อง, ไข้, สับสน, hypoglycemia, Na ต่ำ, K สูง (ใน primary)\n- คนที่ดู cushingoid (หน้ากลม อ้วนลงพุง ช้ำง่าย) แต่ช็อกไม่ตอบสนอง → **ถามประวัติใช้ steroid นานแล้วหยุดเอง** เป็นอันดับแรก\n- รักษาทันทีไม่ต้องรอผล:\n1. เจาะ cortisol และ ACTH เก็บไว้ถ้าไม่ทำให้ช้า\n2. **Hydrocortisone 100 mg IV bolus** แล้ว 200 mg/24 ชม. (50 mg IV q6h หรือ infusion) ขนาดนี้มีฤทธิ์ mineralocorticoid พอ ไม่ต้องให้ fludrocortisone; ลดลงสู่ขนาด maintenance ใน 1–3 วันเมื่ออาการคงที่\n3. NSS 1 L ในชั่วโมงแรก แล้วปรับตาม hemodynamics; แก้น้ำตาลต่ำด้วย dextrose\n4. รักษาสาเหตุกระตุ้น\n- ถ้าไม่มี hydrocortisone ใช้ dexamethasone 4 mg IV (ไม่รบกวนการวัด cortisol แต่ไม่มีฤทธิ์ mineralocorticoid) หรือ methylprednisolone\n\n### ใครมี HPA suppression จาก steroid\n- Prednisolone ≥ 20 mg/วัน (หรือเทียบเท่า) นาน ≥ 3 สัปดาห์ หรือมีลักษณะ cushingoid → ถือว่าถูกกด\n- < 5 mg/วัน หรือใช้ < 3 สัปดาห์ → ไม
