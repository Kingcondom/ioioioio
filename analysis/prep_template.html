rophylaxis ไม่แนะนำแล้ว** (hypervolemia มีอันตราย)\n\n### Cerebral venous sinus thrombosis (CVST)\n- กลุ่มเสี่ยง: **หญิงอายุน้อย + combined OCP/estrogen**, ตั้งครรภ์/หลังคลอด, thrombophilia (factor V Leiden, prothrombin mutation, APS, protein C/S/antithrombin deficiency), nephrotic syndrome, ขาดน้ำ, ติดเชื้อหู/mastoid, มะเร็ง, SLE\n- กลไก: venous outflow อุดตัน → venous pressure สูง + การดูดซึม CSF ที่ arachnoid granulation ลดลง → **ICP สูง (ปวดหัว papilledema)** + venous infarct/hemorrhage (ไม่ตาม arterial territory, มัก parasagittal สองข้าง) → **ชัก** focal deficit\n- อาการ: **ปวดหัวค่อย ๆ มากขึ้นเป็นวัน–สัปดาห์** (~90%), papilledema, ชัก (~40%), อ่อนแรง, ซึม; superior sagittal sinus เป็นตำแหน่งที่พบบ่อยสุด\n- วินิจฉัย: **MRI + MR venography** (หรือ CT venography); CT อาจเห็น cord/dense triangle sign, empty delta sign หลังฉีด contrast; D-dimer ปกติไม่ตัดโรค\n- รักษา: **anticoagulation แม้มี hemorrhagic venous infarct** → LMWH (enoxaparin 1 mg/kg q12h) หรือ UFH ในระยะแรก → ต่อด้วย warfarin (INR 2–3) หรือ dabigatran/DOAC นาน 3–12 เดือน (มีปัจจัยชั่วคราว 3–6 เดือน, unprovoked 6–12 เดือน, severe thrombophilia/เป็นซ้ำ อาจตลอดชีวิต)\n- หยุด estrogen-containing OCP เปลี่ยนเป็นวิธีที่ไม่มี estrogen; ชักให้ ASM; แย่ลงแม้ได้ยา → endovascular thrombectomy; herniation → decompressive craniectomy", "pearls": ["ปวดหัวรุนแรงทันที + คอแข็งไม่มีไข้ = SAH → non-contrast CT ภายใน 6 ชม. ถ้าลบ LP หา xanthochromia", "SAH วันที่ 3–14 มี focal deficit ใหม่ = vasospasm/DCI; ป้องกันด้วย nimodipine 60 mg q4h × 21 วัน", "Migraine ปวดปานกลาง-รุนแรงที่ NSAID ไม่ได้ผล → triptan (ห้ามใน CAD/stroke); attack บ่อย ≥4 วัน/เดือน → prophylaxis เช่น propranolol 40–160 mg/day", "TTH = ปวดรัดแน่นสองข้างแบบ band-like ไม่คลื่นไส้; ป้องกัน chronic TTH ด้วย amitriptyline 10 mg ก่อนนอน", "หญิงกิน OCP ปวดหัวมากขึ้น + papilledema + ชัก = CVST → MRV; รักษาด้วย anticoagulant แม้มี hemorrhagic infarct"], "traps": [], "q": [{"id": "PP28-NEU-033", "q": "A 28-year-old woman has recurrent unilateral throbbing headaches lasting 12 hours with nausea and photophobia, preceded by zig-zag visual lights; she must lie in a quiet dark room until it settles. What is the diagnosis?", "a": "Migraine with aura", "y": [28, 30], "t": 135}, {"id": "PP31-NEU-022", "q": "A 38-year-old woman is diagnosed with migraine with aura. She has 2 attacks per week and cannot work during the attacks. What is the most appropriate medication?", "a": "Propranolol every day", "y": [31], "t": 135}, {"id": "PP32-NEU-045", "q": "A 30-year-old woman has a typical migraine attack with unilateral throbbing headache, nausea and photophobia that did not respond to paracetamol. She has no vascular disease. Which drug is a migraine-specific abortive treatment?", "a": "Eletriptan (a triptan)", "y": [32], "t": 135}, {"id": "PP35-NEU-040", "q": "A 30-year-old woman has a moderate-to-severe migraine attack that has not responded to her usual NSAID. Which drug is the most appropriate acute (abortive) treatment?", "a": "Eletriptan", "y": [35], "t": 135}, {"id": "PP28-NEU-136", "q": "A 45-year-old woman has sudden severe headache followed by neck stiffness, without fever or systemic illness. What is the most probable diagnosis?", "a": "Subarachnoid haemorrhage", "y": [28], "t": 132}, {"id": "NEU-OLDP-051", "q": "A patient presents with neck stiffness without fever. What is the most likely diagnosis?", "a": "Subarachnoid hemorrhage", "y": [31], "t": 132}, {"id": "NEU-OLDP-018", "q": "A 27-year-old man was diagnosed with subarachnoid hemorrhage from a right anterior communicating artery aneurysm and has undergone successful surgery. Three days later he develops weakness of the right arm. What is the diagnosis?", "a": "Vasospasm", "y": [31], "t": 132}, {"id": "NEU-OLDP-017", "q": "A 25-year-old presents with headaches that come and go over a long period, described as a bilateral tight, pressing sensation around the head. What is the most likely diagnosis?", "a": "Tension-type headache", "y": [31], "t": 134}, {"id": "NEU-OLDP-033", "q": "A patient complains of a tight, band-like headache felt mainly over the posterior part of the head and neck. Which type of headache is this most consistent with?", "a": "Tension-type headache", "y": [32], "t": 134}, {"id": "PP31-NEU-021", "q": "A 30-year-old woman has frequent chronic tension-type headache despite non-pharmacological measures. Which drug is the preventive treatment of choice?", "a": "Amitriptyline at low dose (e.g. 10 mg at night)", "y": [31], "t": 134}, {"id": "PP34-NEU-003", "q": "A 28-year-old woman taking combined oral contraceptives has 1 week of progressively worsening headache, then a generalised seizure. She has bilateral papilloedema. MR venography shows absent flow (obstruction) in the superior sagittal sinus. What is the diagnosis?", "a": "Cerebral venous sinus thrombosis", "y": [34], "t": 133}], "years": [28, 30, 31, 32, 34, 35], "th": [135, 134, 132, 133]}, {"id": "gap-neuro-01", "set": "neuro", "title": "Neuromuscular junction: Myasthenia gravis, Lambert–Eaton และ Organophosphate poisoning", "subtitle": "โรคของรอยต่อประสาท-กล้ามเนื้อ: postsynaptic, presynaptic และสาร cholinesterase inhibitor", "md": "### กลไก: acetylcholine ที่ neuromuscular junction\n- ปลายประสาท motor ปล่อย acetylcholine (ACh) เมื่อ Ca2+ ไหลเข้าทาง **P/Q-type voltage-gated calcium channel (VGCC)**\n- ACh จับ **nicotinic AChR** ที่ motor end plate → end-plate potential → กล้ามเนื้อหดตัว แล้วถูก acetylcholinesterase (AChE) สลาย\n- **Myasthenia gravis (MG)** = ความผิดปกติ *postsynaptic*: autoantibody ต่อ AChR (~85% ของ generalized MG) หรือ MuSK/LRP4 → receptor ลดลง → ยิ่งใช้ยิ่งอ่อน (fatigable)\n- **Lambert–Eaton (LEMS)** = ความผิดปกติ *presynaptic*: antibody ต่อ P/Q-type VGCC → ปล่อย ACh น้อย → เมื่อออกแรงซ้ำ Ca2+ สะสมในปลายประสาท → แรงดีขึ้นชั่วคราว (facilitation)\n- **Organophosphate** = ยับยั้ง AChE แบบ irreversible → ACh ล้นทั้ง muscarinic และ nicotinic receptor (carbamate คล้ายกันแต่ reversible)\n\n### Myasthenia gravis: อาการ\n- อ่อนแรงแบบ **fluctuating + fatigable**: เป็นมากตอนเย็นหรือหลังใช้งาน ดีขึ้นหลังพัก เปลี่ยนแปลงวันต่อวัน\n- Ocular: **ptosis** (มักไม่สมมาตร) + **diplopia** เป็นอาการแรกราว 50–60% และพบในเกือบทุกรายตลอดโรค\n- Bulbar: dysphagia, dysarthria, nasal speech, เคี้ยวแล้วล้า; neck flexor weakness; limb weakness **proximal > distal**\n- **Pupil ปกติเสมอ**, sensation ปกติ, DTR ปกติ\n- โจทย์ \"ptosis + proximal muscle weakness\" → **MG** (myopathy ส่วนใหญ่ไม่มี ptosis; LEMS มี ocular sign น้อยและเล็กน้อย)\n- ถ้า proximal weakness ล้วนโดยไม่มี ocular/bulbar sign เลย ให้คิดถึง myopathy (ตรวจ CK) หรือ LEMS ด้วย\n- **Myasthenic crisis** = หายใจล้มเหลว ติดตามด้วย **FVC/NIF ไม่ใช่ SpO2** (FVC <20 mL/kg หรือ NIF อ่อนกว่า −30 cmH2O → เตรียม intubate)\n- ยาที่ทำให้กำเริบ: aminoglycoside, fluoroquinolone, macrolide, magnesium IV, beta-blocker, immune checkpoint inhibitor\n\n### MG: การวินิจฉัย\n| การตรวจ | รายละเอียด |\n|---|---|\n| Bedside | sustained upgaze 60 วินาที → ptosis มากขึ้น (fatigability); **ice pack test** วางน้ำแข็งที่หนังตา ~2 นาที → ptosis ดีขึ้น ≥2 mm (เย็นลด AChE activity) |\n| Serology (ยืนยันหลัก) | **anti-AChR antibody** (+ ~85% generalized, ~50% ocular); ถ้าลบ → anti-MuSK, anti-LRP4 |\n| Electrodiagnosis | low-frequency (3 Hz) repetitive nerve stimulation (RNS) → **decrement >10%**; single-fiber EMG ไวที่สุด (increased jitter) |\n| Imaging | CT/MRI chest หา **thymoma (~10–15%)** หรือ thymic hyperplasia (พบบ่อยใน AChR+ อายุน้อย) |\n| อื่น ๆ | TFT (autoimmune thyroid disease พบร่วมได้) |\n\n- **Edrophonium (Tensilon) test เป็นวิธีในอดีต** ปัจจุบันแทบไม่ใช้และไม่มีจำหน่ายในหลายประเทศ (เสี่ยง bradycardia, false positive) ให้ยืนยันด้วย antibody + RNS/SFEMG\n\n### MG: การรักษา\n1. **Symptomatic first-line: pyridostigmine** (AChE inhibitor) 30–60 mg PO ทุก 4–6 ชม. (ไม่ควรเกิน ~120 mg/dose); ผลข้างเคียง muscarinic (ท้องเสีย ปวดท้อง น้ำลาย/เสมหะมาก); ขนาดเกิน → cholinergic crisis (อ่อนแรง + muscarinic signs)\n2. **Immunotherapy**: prednisolone (เริ่มขนาดต่ำแล้วค่อยเพิ่ม เพราะขนาดสูงทันทีอาจอ่อนแรงลงชั่วคราวในสัปดาห์แรก) + steroid-sparing เช่น azathioprine, mycophenolate; โรคดื้อยา: rituximab (เด่นใน MuSK+), complement inhibitor หรือ FcRn blocker (AChR+)\n3. **Rapid therapy** (crisis, bulbar/respiratory weakness, เตรียมผ่าตัด): IVIG 2 g/kg แบ่งให้ 2–5 วัน หรือ plasma exchange ~5 ครั้ง\n4. **Thymectomy**: ทุกรายที่มี **thymoma**; และ non-thymomatous **AChR+ generalized MG อายุ 18–65 ปี** (MGTX trial: ลดขนาด steroid และ exacerbation); ไม่ช่วยใน MuSK+\n5. Thymectomy เป็น **elective** → ทำเมื่อ **อาการคงที่ (clinically stable)** หลังคุมด้วยยา ± IVIG/PLEX ก่อนผ่าตัด ไม่ทำในช่วง crisis หรือขณะยังมี bulbar/respiratory weakness มาก (เสี่ยง post-op respiratory failure)\n\n### Lambert–Eaton myasthenic syndrome\n- ~50–60% เป็น **paraneoplastic จาก small cell lung cancer** → ผู้สูงอายุที่สูบบุหรี่\n- Triad: **proximal leg weakness + hypo/areflexia + autonomic dysfunction** (ปากแห้ง ท้องผูก impotence orthostatic hypotension)\n- ออกแรงเต็มที่ ~10 วินาที → แรงดีขึ้นชั่วคราวและ **reflex กลับมา** (post-exercise facilitation) — ตรงข้าม MG\n- Ocular/bulbar อาการน้อยกว่า MG มาก\n- Serology: **anti-P/Q-type VGCC antibody** (+ ~85–90%)\n- Electrodiagnosis ยืนยัน: **baseline CMAP amplitude ต่ำ**, low-frequency RNS มี decrement, แต่หลัง brief exercise 10 วินาที หรือ **high-frequency RNS 20–50 Hz → CMAP increment >100%** (≥60% ถือว่า suggestive)\n- ต้องค้นหา SCLC: CT chest ± PET; ถ้าไม่พบ ตรวจซ้ำทุก 3–6 เดือนอย่างน้อย 2 ปี\n- รักษา: รักษามะเร็ง (อาการมักดีขึ้น), **3,4-diaminopyridine (amifampridine)** ปิด K+ channel → ยืด depolarization → Ca2+ เข้ามากขึ้น; เสริม pyridostigmine, IVIG, immunosuppression\n\n| | MG | LEMS |\n|---|---|---|\n| ตำแหน่ง | postsynaptic AChR | presynaptic VGCC |\n| ออกแรงซ้ำ | แย่ลง | ดีขึ้นชั่วคราว |\n| Ocular/bulbar | เด่น | น้อย |\n| Reflex | ปกติ | ลด/หาย กลับมาหลังออกแรง |\n| Autonomic | ไม่มี | มี (ปากแห้ง) |\n| RNS | decrement ที่ 3 Hz | CMAP ต่ำ + increment >100% ที่ 20–50 Hz |\n| สัมพันธ์ | thymoma | small cell lung cancer |\n\n### Organophosphate / carbamate poisoning\n- พบบ่อยในเกษตรกรไทย (ยาฆ่าแมลง) ทั้งจากการพ่นยา (ผิวหนัง/หายใจ) และกินฆ่าตัวตาย\n\n| Receptor | อาการ |\n|---|---|\n| **Muscarinic** (DUMBELS) | Diarrhea, Urination, **Miosis**, **Bronchorrhea/Bronchospasm**, **Bradycardia**, Emesis, Lacrimation, Salivation/sweating |\n| **Nicotinic** (NMJ + sympathetic ganglia) | **fasciculation**, muscle weakness → paralysis รวมกล้ามเนื้อหายใจ, tachycardia, hypertension |\n| CNS | confusion, seizure, coma, respiratory depression |\n\n- ข้อสอบชอบถาม \"ข้อใด **ไม่ใช่** muscarinic effect\" → **muscle fasciculation/weakness (nicotinic)**\n- สาเหตุตายหลัก: หายใจล้มเหลวจาก bronchorrhea + bronchospasm + กล้ามเนื้อหายใจอ่อนแรง + CNS depression\n\n### Organophosphate: การรักษา\n1. ABC + **decontamination** (ถอดเสื้อผ้า ล้างตัว บุคลากรใส่ PPE); หลีกเลี่ยง succinylcholine (paralysis นานผิดปกติ)\n2. **Atropine IV ให้ก่อน**: 1–2 mg IV แล้ว **เพิ่มเป็นสองเท่าทุก 5 นาที** จนได้ atropinization แล้วให้ infusion ~10–20% ของ total loading dose ต่อชั่วโมง\n3. เป้าหมาย atropinization: **ปอดใส/bronchial secretion แห้ง (เป้าหมายหลัก)**, HR >80/min, SBP >80 mmHg, รูม่านตาไม่ pinpoint, รักแร้แห้ง — ไม่ใช้ขนาดรูม่านตาหรือ HR อย่างเดียว\n4. Atropine แก้เฉพาะ muscarinic **ไม่แก้ nicotinic weakness**\n5. **Pralidoxime (2-PAM)** reactivate AChE ก่อนเกิด \"aging\": WHO แนะนำ 30 mg/kg IV bolus แล้ว 8 mg/kg/h (หลักฐานประโยชน์ยังขัดแย้ง)\n6. Benzodiazepine (diazepam) สำหรับชัก/agitation\n- **Intermediate syndrome** (24–96 ชม.): neck flexor, proximal limb, cranial nerve และ respiratory muscle weakness → ระวังหายใจล้มเหลวซ้ำ\n- **OPIDN** (2–3 สัปดาห์): distal sensorimotor axonal neuropathy", "pearls": ["Ptosis + proximal weakness + pupil ปกติ + อาการแย่ตอนเย็น = Myasthenia gravis", "ยืนยัน MG ปัจจุบันด้วย anti-AChR antibody + RNS decrement (ไม่ใช่ Tensilon); bedside ใช้ ice pack test", "MG symptomatic first-line = pyridostigmine; thymectomy ทำเมื่ออาการคงที่ (elective) ใน thymoma ทุกราย และ AChR+ generalized อายุ 18–65", "LEMS: SCLC + proximal leg weakness + areflexia + ปากแห้ง; ออกแรงแล้วดีขึ้น; CMAP ต่ำ + increment >100% ที่ 20–50 Hz", "Organophosphate: fasciculation เป็น nicotinic ไม่ใช่ muscarinic; atropine ให้ก่อน titrate จนปอดแห้ง"], "traps": [{"id": "NEU-OLDP-046", "note": "โพยตอบ Tensilon (edrophonium) test แต่การทดสอบนี้เลิกใช้แล้ว (ไม่มีจำหน่ายในหลายประเทศ เสี่ยง bradycardia) — การยืนยัน MG ปัจจุบันคือ anti-AChR antibody (± MuSK) ร่วมกับ RNS/SFEMG; และถ้า proximal weakness โดยไม่มี ptosis/ocular sign เลย ควรคิดถึง myopathy (CK, EMG) หรือ LEMS (VGCC antibody, RNS increment) ก่อน"}], "q": [{"id": "NEU-OLDP-019", "q": "A 29-year-old woman is diagnosed with myasthenia gravis. She has bilateral ptosis, ophthalmoparesis, dysphagia and proximal muscle weakness. When should thymectomy be performed?", "a": "After her clinical stable", "y": [31], "t": 136}, {"id": "NEU-OLDP-031", "q": "A man presents with ptosis and proximal muscle weakness. What is the most likely diagnosis?", "a": "Myasthenia gravis", "y": [32], "t": 136}, {"id": "NEU-OLDP-046", "q": "A patient is found on examination to have proximal muscle weakness, with no ptosis and no other ocular signs. Which investigation is most appropriate to confirm the suspected diagnosis?", "a": "Tensilon (edrophonium) test", "y": [31], "t": 136}, {"id": "NEU-OLDP-052", "q": "A patient presents with ptosis together with proximal muscle weakness. Which diagnosis best explains this combination?", "a": "Myasthenia gravis", "y": [32], "t": 136}, {"id": "PP30-NEU-011", "q": "A 30-year-old woman has ptosis and diplopia that are worse in the evening and fluctuate from day to day. Which bedside test is most useful to support the diagnosis?", "a": "Fatigability testing (sustained upgaze for 60 seconds) with an ice-pack test", "y": [30], "t": 136}, {"id": "PP31-NEU-022b", "q": "A patient with generalized myasthenia gravis has positive acetylcholine receptor antibodies. Which drug is used for first-line symptomatic treatment?", "a": "Pyridostigmine", "y": [31], "t": 136}, {"id": "PP30-NEU-009", "q": "A 58-year-old smoker has proximal leg weakness and dry mouth. His strength transiently improves after a few seconds of sustained maximal contraction, and tendon reflexes reappear after exercise. What is the most likely diagnosis?", "a": "Lambert–Eaton myasthenic syndrome", "y": [30], "t": 137}, {"id": "PP30-NEU-010", "q": "Which electrodiagnostic finding confirms Lambert–Eaton myasthenic syndrome?", "a": "Low baseline CMAP amplitude that increases by more than 100% after brief exercise or high-frequency (20–50 Hz) repetitive nerve stimulation", "y": [30], "t": 137}, {"id": "PP30-NEU-015", "q": "Which of the following is NOT a muscarinic effect of organophosphate poisoning?", "a": "Muscle fasciculations", "y": [30], "t": 155}, {"id": "PP30-NEU-016", "q": "A farmer is brought in after spraying pesticide with salivation, lacrimation, vomiting, diarrhoea, bronchorrhoea, pinpoint pupils and bradycardia. Which drug should be given first for these features?", "a": "Intravenous atropine titrated until bronchial secretions dry", "y": [30], "t": 155}], "years": [30, 31, 32], "th": [136, 137, 155]}, {"id": "gap-neuro-02", "set": "neuro", "title": "Peripheral neuropathy: GBS, diabetic polyneuropathy, entrapment และ lumbar spinal stenosis", "subtitle": "แยก pattern ของเส้นประสาทส่วนปลายและรากประสาท: เฉียบพลัน เรื้อรัง และถูกกดทับ", "md": "### หลักคิด: ดู pattern ก่อน\n- **Mononeuropathy** (entrapment): อาการตามเส้นประสาทเส้นเดียว เช่น median ที่ข้อมือ\n- **Length-dependent polyneuropathy** (เช่น diabetic): ชาปลายเท้าทั้งสองข้างก่อน แบบ stocking-glove ค่อยเป็นค่อยไป\n- **Acute polyradiculoneuropathy** (GBS): อ่อนแรงทั้ง proximal และ distal ภายในวันถึงสัปดาห์ + areflexia\n- **Radiculopathy/cauda equina** (lumbar spinal stenosis): ปวดร้าวตาม dermatome สัมพันธ์ท่าทาง\n\n### Guillain–Barré syndrome (GBS)\n- กลไก: **molecular mimicry** หลังติดเชื้อ 1–4 สัปดาห์ (*Campylobacter jejuni* พบบ่อยสุด, CMV, EBV, Zika) → antibody ทำลาย myelin หรือ axon\n- ชนิด: **AIDP** (demyelinating, พบมากในตะวันตก) และ **AMAN** (axonal, anti-GM1, สัมพันธ์ *C. jejuni*, พบมากขึ้นในเอเชีย); **Miller Fisher** = ophthalmoplegia + ataxia + areflexia (anti-GQ1b)\n- อาการ: **ascending symmetric weakness** + **areflexia/hyporeflexia** + ชาปลายมือปลายเท้าเล็กน้อย (อาจมี proprioception ลด), facial diplegia ~50%, ปวดหลัง/ขา\n- ถึงจุดแย่สุด (nadir) ภายใน 4 สัปดาห์ (ส่วนใหญ่ ~2 สัปดาห์); ถ้าแย่ต่อเนื่อง >8 สัปดาห์ คิด CIDP\n- อันตราย: **respiratory failure (~20–30%)** และ **autonomic dysfunction** (arrhythmia, BP แกว่ง, ileus)\n- CSF: **albuminocytologic dissociation** = protein สูง แต่ WBC ปกติ (<5/µL; ยอมรับได้ถึง <50/µL) — อาจปกติในสัปดาห์แรก; ถ้า WBC >50/µL คิด HIV, CMV polyradiculitis, lymphoma, Lyme\n- NCS: demyelinating (prolonged distal latency, conduction block, absent F-wave) หรือ axonal\n- Monitor: FVC ทุก 4–6 ชม. ในระยะแรก — **\"20/30/40 rule\"** FVC <20 mL/kg, MIP อ่อนกว่า −30 cmH2O, MEP <40 cmH2O → intubate\n\n### GBS: การรักษา\n1. **IVIG 0.4 g/kg/day × 5 วัน (รวม 2 g/kg)** หรือ **plasma exchange ~5 ครั้งใน 1–2 สัปดาห์** — ได้ผลเท่ากัน ให้ภายใน 2 สัปดาห์ (ถึง 4 สัปดาห์) ในผู้ที่เดินเองไม่ได้หรือแย่ลงเร็ว\n2. ไม่ให้ PLEX ตามด้วย IVIG (ไม่ดีกว่า) และไม่ให้ IVIG รอบสองเป็น routine\n3. **สิ่งที่ไม่ควรทำ: corticosteroid (ไม่ได้ผล)** และ **empirical antibiotic** (การติดเชื้อนำผ่านไปแล้ว ไม่ใช่โรคติดเชื้อปัจจุบัน)\n4. Supportive: DVT prophylaxis, cardiac monitoring, ระวัง BP/HR แกว่ง, แก้ปวด (gabapentin, carbamazepine), กายภาพ\n- โจทย์: อ่อนแรงขามากกว่าแขนใน 1 สัปดาห์ + DTR 0 ทุกที่ + ชาปลายนิ้ว + proprioception ลด → GBS → **IVIG**\n\n### Diabetic polyneuropathy (DSPN)\n- Neuropathy ที่พบบ่อยที่สุด เป็น **distal symmetric sensory polyneuropathy**, length-dependent: ชา/แสบร้อนปลายเท้าทั้งสองข้างก่อน แล้วขึ้นไปถึงระดับเข่าจึงเริ่มเป็นที่มือ (stocking-glove)\n- พยาธิวิทยา: **chronic axonal degeneration แบบ length-dependent (dying-back)** ± secondary segmental demyelination; กลไก hyperglycemia → polyol (sorbitol) pathway, AGEs, oxidative stress, microvascular ischemia ของ vasa nervorum\n- Small fiber เสียก่อน (ปวดแสบ pinprick/temperature ลด) → large fiber (vibration, proprioception, ankle reflex หาย) → แผลที่เท้า, Charcot joint\n- Screening (ADA): T2DM ตั้งแต่วินิจฉัย, T1DM หลังเป็น 5 ปี แล้ว **ทุกปี**: 10-g monofilament + pinprick/temperature + vibration (128-Hz tuning fork) + ankle reflex\n- **ผู้ป่วยชาปลายเท้าสมมาตร กำลังและ reflex ปกติ** → ตรวจหาสาเหตุที่พบบ่อยและรักษาได้ก่อน: **FBS/HbA1c** (DM และ prediabetes), vitamin B12, TSH, creatinine, CBC ± SPEP; alcohol, ยา (isoniazid, chemotherapy), HIV\n- NCS ไม่จำเป็นในรายทั่วไป ทำเมื่อ atypical: ไม่สมมาตร, motor เด่น, เป็นเร็ว\n- รักษา: คุมน้ำตาล (ป้องกัน progression ชัดใน T1DM), ดูแลเท้า; **painful DPN**: pregabalin/gabapentin, duloxetine, amitriptyline (หรือ TCA อื่น) เป็น first-line; หลีกเลี่ยง opioid\n- Diabetic neuropathy อื่น: CN III palsy แบบ pupil-sparing, diabetic amyotrophy (lumbosacral radiculoplexus), autonomic neuropathy, เพิ่มความเสี่ยง CTS\n\n### Entrapment neuropathy\n| ภาวะ | เส้นประสาท/ตำแหน่ง | อาการเด่น | ตรวจ |\n|---|---|---|---|\n| **Carpal tunnel syndrome** | median ใต้ transverse carpal ligament | ชา/ปวด นิ้วโป้ง ชี้ กลาง (+ ครึ่งนิ้วนาง) **เป็นมากกลางคืนจนตื่น**, ขับรถ/ถือโทรศัพท์, สะบัดมือแล้วดีขึ้น; ปวดร้าวขึ้นแขนได้; ระยะท้าย thenar atrophy | Tinel, Phalen; ยืนยันด้วย **NCS ของ distal median nerve** |\n| **Meralgia paresthetica** | **lateral femoral cutaneous nerve** (L2–L3) ใต้ inguinal ligament ใกล้ ASIS | แสบร้อน/ชา **anterolateral thigh**, pure sensory — ไม่อ่อนแรง, knee reflex ปกติ | clinical; risk อ้วน ตั้งครรภ์ เข็มขัด/กางเกงรัด DM |\n| **Morton neuroma** | **common plantar digital (interdigital) nerve** ระหว่าง metatarsal head ที่ 3–4 (perineural fibrosis ไม่ใช่เนื้องอกจริง) | ปวดแปล๊บ/แสบระหว่างนิ้วเท้า 3–4 ขณะเดิน รองเท้าแคบ/ส้นสูง หยุดเดินถอดรองเท้านวดแล้วดีขึ้น | บีบ forefoot (squeeze test) เจ็บ, Mulder click; US/MRI |\n| Ulnar neuropathy | ulnar ที่ cubital tunnel (ข้อศอก) | ชานิ้วนาง-ก้อย, intrinsic hand weakness | NCS |\n| Peroneal neuropathy | common peroneal ที่ fibular head | foot drop, นั่งไขว่ห้าง/นั่งยอง | NCS |\n\n- **สาเหตุ CTS (โดยเฉพาะสองข้าง)**: **pregnancy, hypothyroidism, obesity, diabetes**, RA, acromegaly, amyloidosis, CKD/dialysis, ใช้ข้อมือซ้ำ ๆ (พิมพ์งาน)\n- CTS ที่ปวดร้าวขึ้นแขน: ถ้าคอปกติ, **Spurling test ลบ** (ไม่ใช่ cervical radiculopathy), **Adson test ลบ** (ไม่ใช่ thoracic outlet) และตรวจร่างกายปกติ → test ถัดไปคือ **NCS ของ distal median nerve**\n- รักษา CTS: **wrist splint ท่า neutral ตอนกลางคืน**, ปรับกิจกรรม, local steroid injection, รักษาสาเหตุ; **carpal tunnel release** เมื่อมี thenar atrophy/weakness, NCS รุนแรง หรือ conservative ไม่ได้ผล\n- Meralgia: ลดน้ำหนัก คลายเข็มขัด NSAIDs มักหายเอง; Morton: รองเท้ากว้าง metatarsal pad, steroid injection, neurectomy\n\n### Lumbar spinal stenosis vs vascular claudication\n| | Neurogenic claudication (LSS) | Vascular claudication (PAD) |\n|---|---|---|\n| ตำแหน่ง | ก้น ต้นขา ร้าวลงขา มักทั้งสองข้าง | น่อง (ตามระดับหลอดเลือดตีบ) |\n| ลักษณะ | **ชา tingling** ปวด อ่อนแรง | ปวดบีบ/ตะคริว มักไม่ชา |\n| กระตุ้น | ยืนนาน เดิน แอ่นหลัง (เดินลงเนิน) | เดินระยะทางคงที่ ยืนเฉย ๆ ไม่ปวด |\n| บรรเทา | **นั่ง/ก้มตัว (flexion)**, เข็นรถเข็นได้นาน (shopping cart sign), ปั่นจักรยานได้ | หยุดเดินยืนพักก็หายภายในไม่กี่นาที |\n| ชีพจร/ผิวหนัง | ปกติ | ชีพจรลด, bruit, ผิวเย็น ซีด ขนร่วง |\n| ตรวจยืนยัน | **MRI L-spine** | ABI (<0.9), duplex, CTA |\n\n- ผู้สูงอายุอาจมีทั้งสองภาวะ ให้ดูว่าอาการอธิบายด้วยอะไรได้ดีกว่า: อาการ **สองข้าง + tingling** แต่ชีพจรลดเพียงข้างเดียวและผิวหนังสี/อุณหภูมิปกติ → เด่น neurogenic → **MRI L-spine** ให้ yield สูงสุด (ตามเฉลยของวิชา); ABI ทำเพิ่มได้ง่ายเพื่อประเมิน PAD ร่วม\n- Red flag cauda equina: saddle anesthesia, urinary retention, อ่อนแรงลุกลาม → MRI ด่วน + ผ่าตัด\n- รักษา LSS: กายภาพ (flexion exercise), แก้ปวด, epidural steroid; **decompressive laminectomy** เมื่ออาการรุนแรง/neurologic deficit ลุกลาม", "pearls": ["GBS: ascending weakness + areflexia + CSF protein สูง WBC ปกติ → IVIG 2 g/kg หรือ PLEX; steroid และ antibiotic ไม่มีบทบาท", "Diabetic neuropathy = length-dependent axonal degeneration; ชาปลายเท้าสมมาตร → ตรวจ FBS/HbA1c, B12, TSH ก่อน", "CTS: ชา 3 นิ้วครึ่งตอนกลางคืน Tinel/Phalen บวก → ยืนยันด้วย NCS median; สาเหตุสองข้าง = pregnancy, hypothyroid, obesity, DM", "Meralgia paresthetica = lateral femoral cutaneous nerve: ชา anterolateral thigh ไม่อ่อนแรง reflex ปกติ", "Morton neuroma = interdigital nerve ระหว่าง metatarsal 3–4; neurogenic claudication ดีขึ้นเมื่อนั่ง/ก้ม → MRI L-spine"], "traps": [], "q": [{"id": "NEU-OLDP-021", "q": "A 34-year-old woman has a 5-month history of progressively worsening shooting pain between the third and fourth toes of the left foot. The pain occurs with walking and is relieved by stopping and massaging the affected area. On examination, compression of the forefoot makes her wince in pain. Which statement is most closely related to her condition?", "a": "It is caused by compression of the interdigital (common plantar digital) nerve — a Morton neuroma", "y": [32], "t": 139}, {"id": "PP30-NEU-020", "q": "A 32-year-old woman who types all day has numbness of the thumb, index and middle fingers at night. Tinel sign at the wrist and Phalen test are positive. What is the diagnosis?", "a": "Carpal tunnel syndrome (median nerve compression)", "y": [30], "t": 139}, {"id": "PP30-NEU-021", "q": "A woman develops bilateral carpal tunnel syndrome. Which group of conditions are recognised causes?", "a": "Pregnancy, hypothyroidism, obesity and diabetes mellitus", "y": [30], "t": 139}, {"id": "PP30-NEU-026", "q": "An obese 45-year-old man who wears a tight belt has burning numbness over the anterolateral thigh with no weakness and normal knee reflex. Which nerve is affected?", "a": "Lateral femoral cutaneous nerve (meralgia paraesthetica)", "y": [30], "t": 139}, {"id": "PP35-NEU-032", "q": "A 32-year-old woman has progressive pain in the right arm involving the second and third fingers, forearm and upper arm, with painful tingling. It wakes her from sleep and worsens while driving. Neck motion is normal; Spurling and Adson tests are negative; shoulder examination, pulses, reflexes, pinprick and strength are normal. What is the next diagnostic test?", "a": "Nerve conduction study of the distal median nerve", "y": [35], "t": 139}, {"id": "NEU-OLDP-020", "q": "A 30-year-old man has had progressive difficulty walking for 1 week, with numbness and a heavy sensation in all distal fingers and toes. Examination: motor power grade 4 in both upper extremities and grade 3 in both lower extremities, deep tendon reflexes absent (0) at all sites, and impaired proprioception in all fingers and toes. Which treatment is most appropriate?", "a": "Intravenous immunoglobulin", "y": [31], "t": 138}, {"id": "NEU-OLDP-045", "q": "A patient is diagnosed with Guillain-Barre syndrome. Which of the following is NOT an appropriate management?", "a": "Empirical intravenous antibiotics", "y": [30], "t": 138}, {"id": "NEU-OLDP-025", "q": "A 55-year-old woman complains of pins-and-needles sensation in both feet for 2 months. On examination there is decreased pinprick sensation over both feet, while motor power is grade 5 and deep tendon reflexes are 2+. What is the most appropriate investigation?", "a": "Fasting blood sugar", "y": [31], "t": 140}, {"id": "NEU-OLDP-062", "q": "A patient with type 2 diabetes mellitus presents with numbness of both feet for one year. Which underlying nerve pathology best explains this?", "a": "Chronic axonal degeneration (distal symmetric sensory polyneuropathy)", "y": [30], "t": 140}, {"id": "PP35-NEU-047", "q": "A 68-year-old man has 1 year of increasing exertional bilateral calf pain with tingling in the legs; he can walk only 1 km on a treadmill. There is a reduced left distal pulse and a left iliac bruit, but foot temperature, colour, reflexes, pinprick and strength are normal. According to the course quiz, which test has the highest diagnostic yield?", "a": "MRI of the lumbar spine", "y": [35], "t": 141}], "years": [30, 31, 32, 35], "th": [139, 138, 140, 141]}, {"id": "gap-neuro-07", "set": "neuro", "title": "Dementia และ movement disorders: Alzheimer, NPH, Parkinson, dystonia, tardive dyskinesia, RLS", "subtitle": "พยาธิตำแหน่งที่เสียก่อน อาการเด่นที่ใช้แยกโรค และยาที่ใช้จริง", "md": "### Alzheimer disease: พยาธิกำเนิด\n- Dementia ที่พบบ่อยที่สุด; พยาธิ: **extracellular amyloid-β plaques** (APP ถูกตัดโดย β- และ γ-secretase ได้ Aβ42) + **intracellular neurofibrillary tangles** (hyperphosphorylated tau) → neuronal loss\n- เสีย cholinergic neurons ใน **nucleus basalis of Meynert** → ACh ลดลง (เหตุผลของการใช้ cholinesterase inhibitor)\n- ลำดับการลาม (Braak): **entorhinal/transentorhinal cortex → hippocampus (medial temporal lobe) ก่อน** → limbic → association cortex (temporal, parietal); primary motor/sensory/visual cortex เสียท้ายสุด\n- เพราะ hippocampus เสียก่อน → อาการแรกคือ **anterograde episodic memory loss** (จำเรื่องใหม่ไม่ได้ ถามซ้ำ วางของผิดที่) และภาพถ่ายสมองเห็น **medial temporal/hippocampal atrophy**\n- ปัจจัยเสี่ยง: อายุ, **APOE ε4**, Down syndrome (APP gene บน chr 21 → เป็นเร็ว), familial early-onset (APP, PSEN1, PSEN2)\n\n### Alzheimer: อาการ วินิจฉัย รักษา\n- ค่อยเป็นค่อยไป: ความจำ → anomia → visuospatial (หลงทาง) → executive/behavior → ระยะท้าย apraxia, กลั้นปัสสาวะไม่ได้, เดินลำบาก\n- ประเมิน: MMSE/TMSE, MoCA (ฉบับภาษาไทย); ต้องมีผลต่อการใช้ชีวิตประจำวันจึงเรียก dementia\n- **ตัดสาเหตุที่รักษาได้**: TSH, vitamin B12, glucose, electrolytes/Ca, renal/liver function, CBC, syphilis serology ± HIV, ซึมเศร้า, ยา (anticholinergic, benzodiazepine); CT/MRI brain (หา NPH, subdural, tumor, vascular)\n- Biomarker: CSF Aβ42 ต่ำ + p-tau สูง, amyloid PET, plasma p-tau217\n- **Cholinesterase inhibitor** (mild–severe): **donepezil 5 mg ก่อนนอน → 10 mg หลัง 4–6 สัปดาห์**, rivastigmine (oral/patch), galantamine → ช่วย cognition ได้เล็กน้อย (modest) ไม่หยุดโรค; ผลข้างเคียง คลื่นไส้ ท้องเสีย **bradycardia/syncope** ฝันชัด\n- **Memantine** (NMDA antagonist) สำหรับ moderate–severe เดี่ยวหรือร่วม donepezil\n- Anti-amyloid mAb (lecanemab, donanemab) สำหรับ early AD ที่ยืนยัน amyloid; เสี่ยง ARIA (สมองบวม/เลือดออก)\n- หลีกเลี่ยง antipsychotic ถ้าไม่จำเป็น (เพิ่ม mortality/stroke ในผู้สูงอายุ dementia); ดูแลผู้ดูแล\n\n### Normal pressure hydrocephalus (NPH)\n- Communicating hydrocephalus จากการดูดซึม CSF บกพร่อง ความดันขณะ LP ปกติ/ค่อนสูงแต่ขึ้นลงเป็นพัก ๆ; idiopathic ในผู้สูงอายุ หรือ secondary หลัง SAH, meningitis, head injury\n- Ventricle ขยายดึง periventricular fibers (corona radiata ที่ไปขา และ frontal-bladder pathway) → triad (Hakim)\n- **Triad: gait disturbance + dementia + urinary incontinence** (\"wobbly, wacky, wet\")\n- **Gait เกิดก่อนและเด่นที่สุด**: magnetic gait (เท้าเหมือนติดพื้น), ก้าวสั้น ฐานกว้าง หมุนตัวลำบาก — เรียกถูกต้องว่า **gait apraxia (frontal gait)** ไม่ใช่ cerebellar ataxia; แขนแกว่งปกติ (ต่างจาก Parkinson)\n- Cognition แบบ subcortical: ช้า เฉยเมย executive ลด (ไม่มี aphasia)\n- Urinary urgency → incontinence\n- Imaging: ventriculomegaly (Evans index >0.3) เกินสัดส่วนของ cortical atrophy, DESH, callosal angle แคบ\n- **CSF tap test** (ระบาย 30–50 mL) หรือ extended lumbar drainage → การเดินดีขึ้น = ทำนายว่าจะตอบสนองต่อ shunt\n- รักษา: **ventriculoperitoneal shunt** → **gait ดีขึ้นมากที่สุดและเร็วที่สุด**, cognition และ incontinence ดีขึ้นน้อยกว่า\n\n### Parkinson disease\n- พยาธิหลัก: **สูญเสีย dopaminergic neurons ใน substantia nigra pars compacta** → dopamine ใน striatum (nigrostriatal pathway) ลด; มี **Lewy bodies (α-synuclein)**; อาการเกิดเมื่อ dopamine ลดลง ~60–80%\n- Cardinal: **bradykinesia** (จำเป็น) + **rest tremor 4–6 Hz แบบ pill-rolling** และ/หรือ **rigidity** (cogwheel/lead-pipe); postural instability ระยะหลัง; เริ่มข้างเดียว\n- อื่น ๆ: mask-like face, micrographia, เสียงเบา, ท่าก้มหลัง, shuffling/festinating gait; non-motor: anosmia, REM sleep behavior disorder, ท้องผูก, ซึมเศร้า (มาก่อนอาการ motor ได้)\n- วินิจฉัยทางคลินิก + ตอบสนองต่อ levodopa; red flags ของ atypical parkinsonism: ล้มเร็ว, vertical gaze palsy (PSP), autonomic failure เร็ว (MSA), สมมาตร, ไม่ตอบสนอง levodopa\n- รักษา: **levodopa + carbidopa/benserazide** ได้ผลดีที่สุด; dopamine agonist (pramipexole, ropinirole) ในคนอายุน้อย (ระวัง impulse control disorder); MAO-B inhibitor; trihexyphenidyl สำหรับ tremor ในคนอายุน้อย; amantadine สำหรับ dyskinesia; DBS\n- **Drug-induced parkinsonism**: antipsychotic, metoclopramide, **flunarizine/cinnarizine** (ใช้บ่อยในไทย) → สมมาตร หยุดยาแล้วดีขึ้น\n\n### Focal dystonia\n- Dystonia = กล้ามเนื้อหดเกร็งต่อเนื่องหรือเป็นพัก ๆ ทำให้ท่าบิดผิดปกติ มักเป็น task-specific และมี sensory trick (geste antagoniste)\n- **Writer's cramp** = task-specific focal hand dystonia: เกร็งปวดและท่ามือผิดปกติ **เฉพาะเวลาเขียน** ตรวจระบบประสาทอื่นปกติ\n- Focal dystonia อื่น: cervical dystonia (torticollis, พบบ่อยสุด), blepharospasm, spasmodic dysphonia\n- รักษา: **botulinum toxin injection** เป็น first-line; trihexyphenidyl\n\n### Drug-induced movement disorders จาก dopamine blockade\n| ภาวะ | เวลาที่เกิด | ลักษณะ | รักษา |\n|---|---|---|---|\n| Acute dystonia | ชั่วโมง–วัน | torticollis, oculogyric crisis, trismus | anticholinergic (benztropine), diphenhydramine IV |\n| Akathisia | วัน–สัปดาห์ | กระสับกระส่าย นั่งไม่ติด | ลดยา, propranolol |\n| Parkinsonism | สัปดาห์–เดือน | bradykinesia rigidity สมมาตร | หยุดยา, anticholinergic |\n| **Tardive dyskinesia** | **เดือน–ปี** | **orofacial–buccal–lingual: เคี้ยว ดูดปาก แลบลิ้น**, choreoathetosis | หยุด/เปลี่ยนเป็น clozapine หรือ quetiapine, **VMAT2 inhibitor** (valbenazine, deutetrabenazine, tetrabenazine) |\n\n- กลไก TD: **D2 receptor ถูก block นาน → upregulation/supersensitivity**; เสี่ยงในหญิงสูงอายุ, typical antipsychotic, metoclopramide ระยะยาว\n- Anticholinergic **ทำให้ TD แย่ลง**\n\n### Restless legs syndrome (RLS, Willis–Ekbom disease)\n- เกณฑ์วินิจฉัย (ครบ 5 ข้อ):\n1. อยากขยับขา มักมีความรู้สึกไม่สบายที่ขา\n2. เริ่มหรือแย่ลงขณะพัก (นั่ง/นอน)\n3. ดีขึ้นเมื่อขยับขาหรือลุกเดิน\n4. แย่ลงช่วงเย็น/กลางคืน\n5. ไม่ได้อธิบายด้วยภาวะอื่น (ตะคริว, ท่าทาง, ข้ออักเสบ, venous stasis)\n- ~80% มี **periodic limb movements of sleep** → คู่นอนบอกว่าเตะขาตอนหลับ; ทำให้นอนไม่หลับเรื้อรัง\n- กลไก: **ภาวะขาดธาตุเหล็กในสมอง** (substantia nigra) → dopaminergic dysfunction; พันธุกรรม (primary มักมีประวัติครอบครัว)\n- ปัจจัยกระตุ้น/secondary: **iron deficiency (ferritin ≤75 µg/L)**, **การตั้งครรภ์ (ทำให้อาการแย่ลง โดยเฉพาะไตรมาสสาม แล้วดีขึ้นหลังคลอด — ไม่ได้ทำให้ดีขึ้น)**, ESRD/uremia, peripheral neuropathy, ยา (sedating antihistamine เช่น diphenhydramine, dopamine antagonist, SSRI/SNRI, mirtazapine, lithium), caffeine, alcohol, อดนอน\n- รักษา (AASM 2024): ตรวจ ferritin + transferrin saturation → **ให้ iron** ถ้า ferritin ≤75 µg/L หรือ TSAT <20% (IV ferric carboxymaltose ถ้า ferritin <100 หรือ oral ไม่ได้ผล); **alpha-2-delta ligand (gabapentin, pregabalin) เป็น first-line**; dopamine agonist (pramipexole, ropinirole, rotigotine) ไม่แนะนำเป็น standard เพราะเกิด **augmentation** (อาการเกิดเร็วขึ้นในวัน รุนแรงขึ้น ลามไปแขน); levodopa หลีกเลี่ยง; refractory → low-dose opioid\n- Non-pharm: sleep hygiene, งด caffeine/alcohol, นวดขา ออกกำลังกายพอดี, หยุดยาที่กระตุ้น", "pearls": ["Alzheimer: entorhinal cortex/hippocampus เสียก่อน → anterograde memory loss + medial temporal atrophy; donepezil ช่วย cognition ได้เล็กน้อย", "NPH triad = gait (magnetic, apraxic) + dementia + incontinence; gait เกิดก่อนและดีขึ้นมากสุดหลัง VP shunt; tap test ทำนายผล", "Parkinson = เสีย dopaminergic neuron ใน substantia nigra pars compacta + Lewy bodies; rest tremor 4–6 Hz pill-rolling", "Tardive dyskinesia = orofacial chewing/แลบลิ้นหลังได้ dopamine blocker นาน → รักษาด้วย VMAT2 inhibitor; writer's cramp = focal dystonia → botulinum toxin", "RLS: อาการขาตอนพักกลางคืน ดีขึ้นเมื่อขยับ; การตั้งครรภ์และขาดเหล็กทำให้แย่ลง; ให้ iron ถ้า ferritin ≤75 + gabapentinoid"], "traps": [], "q": [{"id": "NEU-OLDP-024", "q": "A 48-year-old man has had cramping pain and stiffness of his right arm whenever he writes, for about 1 year. Neurological examination is normal. What is the diagnosis?", "a": "Focal dystonia (writer's cramp)", "y": [31], "t": 145}, {"id": "NEU-OLDP-026", "q": "A 55-year-old woman presents with repetitive involuntary movements involving the face and oral muscles, with chewing movements and tongue protrusion. Which drug mechanism is the most likely cause?", "a": "Dopamine blockage", "y": [31], "t": 145}, {"id": "PP30-NEU-036", "q": "A 68-year-old man has a stooped posture, mask-like face, cogwheel rigidity, bradykinesia and a 4–6 Hz resting pill-rolling tremor. Where is the primary pathology?", "a": "Loss of dopaminergic neurons in the substantia nigra pars compacta", "y": [30], "t": 145}, {"id": "NEU-OLDP-069", "q": "In Alzheimer disease, which structure is involved earliest — accounting for the early anterograde memory loss and the medial temporal atrophy seen on imaging?", "a": "Hippocampus and entorhinal cortex", "y": [31], "t": 162}, {"id": "NEU-OLDP-070", "q": "In a patient with Alzheimer disease, degenerative pathology and atrophy appear EARLIEST in which brain structure?", "a": "Hippocampus", "y": [31], "t": 162}, {"id": "PPNA-NEU-137", "q": "An 85-year-old man has been diagnosed with Alzheimer disease after 2 years of progressive memory loss. Which medication may modestly improve cognitive function?", "a": "Donepezil", "y": [], "t": 162}, {"id": "NEU-OLDP-071", "q": "In normal pressure hydrocephalus (NPH), which clinical feature typically appears first and is the most likely to improve after CSF shunting?", "a": "Gait ataxia (magnetic, apraxic gait)", "y": [31], "t": 163}, {"id": "NEU-OLDP-072", "q": "Which clinical triad is characteristic of normal pressure hydrocephalus?", "a": "Gait disturbance, dementia, and urinary incontinence", "y": [34], "t": 163}, {"id": "NEU-OLDP-023", "q": "A 40-year-old woman presents with nightly insomnia for 5 years. She has \"weird\" sensations in her legs at night when trying to sleep. This feeling is relieved when she moves her legs or gets up and walks. Her husband complains that she kicks during her sleep. Which statement about her condition is NOT correct?", "a": "Pregnancy causes temporary relief of the symptoms.", "y": [31, 35], "t": 144}], "years": [30, 31, 34, 35], "th": [145, 163, 144, 162]}, {"id": "gap-neuro-05", "set": "neuro", "title": "Cranial nerves และ localization: facial palsy, CN III palsy, visual field และ crossed signs", "subtitle": "บอกตำแหน่งรอยโรคจากอาการ: UMN vs LMN facial, pupil ใน CN III palsy, ลานสายตา และ brainstem/cortex", "md": "### Facial nerve: UMN vs LMN\n- Facial motor nucleus อยู่ใน **pons**: ส่วนที่เลี้ยง **หน้าผาก/ใบหน้าส่วนบน** ได้ corticobulbar input จาก **ทั้งสองซีก** ส่วนที่เลี้ยง **ใบหน้าส่วนล่าง** ได้จาก **cortex ฝั่งตรงข้ามเท่านั้น**\n- **UMN lesion** (เช่น stroke ที่ cortex/internal capsule): อ่อนแรง **ใบหน้าส่วนล่างฝั่งตรงข้าม** หน้าผากยังย่นได้ (forehead sparing) → **รอยโรค UMN ขวา = มุมปากซ้ายตก**\n- **LMN lesion** (nucleus หรือเส้นประสาท): อ่อนแรง **ทั้งซีกหน้าข้างเดียวกัน** รวมหน้าผาก ยักคิ้วไม่ได้ หลับตาไม่สนิท nasolabial fold แบน → peripheral facial palsy เช่น Bell palsy\n- แขนงที่ช่วยบอกระดับรอยโรค: greater petrosal (น้ำตา), nerve to stapedius (**hyperacusis**), **chorda tympani (รับรส anterior 2/3 ของลิ้น + น้ำลาย submandibular/sublingual)**\n- Pontine lesion ที่ nucleus: LMN facial + CN VI palsy + contralateral hemiparesis (Millard–Gubler)\n\n### Bell palsy\n- Idiopathic acute LMN facial palsy เชื่อว่าเกิดจาก **HSV-1 reactivation** → เส้นประสาทอักเสบบวมใน facial canal (labyrinthine segment แคบที่สุด)\n- เป็นเต็มที่ภายใน **<72 ชม.**; อาจปวดหลังหู, hyperacusis, **สูญเสียการรับรส anterior 2/3 ของลิ้นข้างเดียวกัน**, น้ำตาลด; Bell phenomenon (ลูกตากลอกขึ้นเมื่อพยายามหลับตา)\n- เป็น diagnosis of exclusion; red flags: เป็นสองข้าง (GBS, Lyme, sarcoidosis, HIV), ค่อย ๆ เป็น >3 สัปดาห์ หรือไม่ดีขึ้นใน 3–4 เดือน (เนื้องอก เช่น parotid), มี CN อื่นร่วม, UMN sign\n- รักษา: **prednisolone ภายใน 72 ชม.** (เช่น 60 mg/day × 5 วันแล้ว taper 5 วัน หรือ 50 mg/day × 10 วัน); antiviral (valacyclovir 1 g tid × 7 วัน) **ไม่ใช้เดี่ยว** อาจเพิ่มร่วม steroid ในรายรุนแรง\n- **Eye care สำคัญ**: น้ำตาเทียมกลางวัน ป้ายยาและปิดตาตอนนอน ป้องกัน exposure keratitis\n- พยากรณ์: หายสมบูรณ์ ~70–85%; แย่กว่าในอัมพาตสมบูรณ์ ผู้สูงอายุ DM; ภาวะแทรกซ้อน synkinesis, crocodile tears\n\n### Ramsay Hunt syndrome (herpes zoster oticus)\n- **VZV reactivation ที่ geniculate ganglion** → LMN facial palsy + **vesicles ในช่องหู/ใบหู** (หรือเพดาน, ลิ้น) + ปวดหูมาก\n- ลามไป **CN VIII** ที่อยู่ติดกันใน internal acoustic meatus → SNHL, tinnitus, vertigo → **เกี่ยวข้อง CN VII + VIII**\n- พยากรณ์แย่กว่า Bell palsy\n- รักษา: **acyclovir** (800 mg PO 5 ครั้ง/วัน × 7–10 วัน หรือ IV ในรายรุนแรง) หรือ valacyclovir 1 g tid × 7 วัน + prednisolone + eye care\n\n### CN III (oculomotor) palsy\n- CN III เลี้ยง levator palpebrae (**ptosis**), SR, IR, MR, IO และ parasympathetic ไป sphincter pupillae/ciliary muscle (**รูม่านตาขยาย**, accommodation เสีย)\n- Complete palsy: **ptosis + ตา \"down and out\"** (LR จาก CN VI และ SO จาก CN IV ไม่มีแรงต้าน) + **dilated fixed pupil** + diplopia\n- โจทย์ \"ptosis + diplopia\" → structure ที่น่าจะเป็นคือ **CN III**\n- **Pupillary fibers อยู่ผิวนอก (superficial, dorsomedial)** ของเส้นประสาท → การกดจากภายนอก (aneurysm, uncal herniation) ทำให้ **pupil-involving** ตั้งแต่แรก; ส่วน ischemia (DM, HT) ทำลายแกนกลางที่ขาด vasa nervorum → **pupil-sparing**\n- **Pupil-involving CN III palsy + ปวดหัว = PCom aneurysm จนกว่าจะพิสูจน์ได้ว่าไม่ใช่** → CTA/MRA ด่วน (เสี่ยงแตกเป็น SAH) แม้ผู้ป่วยเป็นเบาหวาน\n- Pupil-sparing complete motor palsy ในผู้ >50 ปีที่มี DM/HT → microvascular ischemia หายเองใน 8–12 สัปดาห์ (อาจปวดได้ ปวดจึงแยกไม่ได้); ทำ imaging ถ้าอายุน้อย, เป็นไม่สมบูรณ์, มี CN อื่นร่วม หรือไม่ดีขึ้น\n- ตำแหน่งอื่น: uncal herniation (pupil ขยายข้างเดียว + ซึม), cavernous sinus (III, IV, V1, V2, VI ± Horner), midbrain (Weber: CN III + contralateral hemiparesis)\n\n| สาเหตุ ptosis | ลักษณะ |\n|---|---|\n| CN III palsy | ptosis มาก + ophthalmoplegia + ± mydriasis |\n| Horner syndrome | ptosis เล็กน้อย + **miosis** + anhidrosis |\n| Myasthenia gravis | fatigable, เปลี่ยนแปลงตามเวลา, **pupil ปกติ** |\n\n### Localization: visual pathway\n| ตำแหน่งรอยโรค | Visual field defect |\n|---|---|\n| Optic nerve | ตาบอดข้างเดียว + RAPD |\n| **Optic chiasm** (pituitary adenoma, craniopharyngioma) | **bitemporal hemianopia** (ใยประสาท nasal retina ที่รับลานสายตา temporal ไขว้ที่ chiasm) |\n| Optic tract | contralateral homonymous hemianopia (incongruous) |\n| Meyer loop (temporal lobe) | contralateral superior quadrantanopia (\"pie in the sky\") |\n| Optic radiation ส่วน parietal | contralateral inferior quadrantanopia (\"pie on the floor\") |\n| Occipital cortex (PCA) | contralateral homonymous hemianopia with **macular sparing** |\n\n- Pituitary adenoma กดจากด้านล่าง → เสีย superior temporal quadrant ก่อน; craniopharyngioma กดจากด้านบน → inferior ก่อน\n\n### Localization: crossed signs และ cortical signs\n- **Crossed sign** = cranial nerve ข้างเดียวกับรอยโรค + long tract (motor/sensory) ฝั่งตรงข้าม → **brainstem**\n- **Crossed sensory**: ชา pain/temperature ที่หน้าข้างเดียวกัน (spinal trigeminal nucleus/tract) + ลำตัวแขนขาฝั่งตรงข้าม (spinothalamic tract) → lateral medulla (**Wallenberg**, PICA/vertebral: + Horner, dysphagia/hoarseness, ataxia, vertigo) หรือ lateral pons (AICA: + CN VII, VIII เช่น hearing loss)\n- Midbrain = Weber (CN III + contralateral hemiparesis); pons = Millard–Gubler (CN VI, VII + contralateral hemiparesis); medial medulla = CN XII + contralateral hemiparesis + proprioception ลด\n- Dominant (ซ้าย) hemisphere: aphasia (Broca = inferior frontal, Wernicke = superior temporal), Gerstmann syndrome (angular gyrus: agraphia, acalculia, finger agnosia, left-right confusion)\n- **Non-dominant (ขวา) parietal lobe → hemineglect ด้านซ้าย**, anosognosia, dressing/constructional apraxia", "pearls": ["รอยโรค UMN ขวา → ใบหน้าส่วนล่างซ้ายอ่อนแรง หน้าผากปกติ; LMN → ทั้งซีกหน้าข้างเดียวกันรวมหน้าผาก", "Bell palsy อาจเสียรับรส anterior 2/3 ของลิ้น (chorda tympani); รักษา prednisolone ภายใน 72 ชม. + eye care", "Ramsay Hunt = VZV ที่ geniculate ganglion: vesicles ในหู + LMN facial palsy + hearing loss/vertigo (CN VII + VIII)", "CN III palsy ที่ pupil ขยาย + ปวดหัว = PCom aneurysm (แม้เป็น DM); DM microvascular มัก pupil-sparing", "Bitemporal hemianopia = optic chiasm; hemineglect = right (non-dominant) parietal; crossed sensory = brainstem"], "traps": [], "q": [{"id": "NEU-OLDP-002", "q": "A lesion of the RIGHT upper motor neuron pathway to the facial nucleus (upper motor neuron facial palsy). Which part of the face is weak?", "a": "The left lower face only, with the forehead spared", "y": [30], "t": 127}, {"id": "NEU-OLDP-036", "q": "A patient has facial weakness involving BOTH the upper half of the face (cannot raise the eyebrow or close the eye) and the lower half of the face on the same side. What does this pattern indicate?", "a": "A lower motor neuron lesion of the facial nerve or its nucleus, ipsilateral to the weakness (peripheral facial palsy, e.g. Bell palsy)", "y": [31], "t": 127}, {"id": "PP35-NEU-033", "q": "A 48-year-old man has had drooping of the right side of his face and difficulty speaking for 36 hours. He cannot raise his right eyebrow or close the right eye tightly; the right nasolabial fold is flattened. Which statement about this condition is true?", "a": "There may be loss of taste over the ipsilateral anterior two-thirds of the tongue", "y": [35], "t": 127}, {"id": "PP31-NEU-017", "q": "A patient has a vesicular eruption in the external ear canal with ipsilateral lower motor neuron facial palsy, hearing loss and vertigo (Ramsay Hunt syndrome). Which cranial nerves are involved?", "a": "Facial (VII) and vestibulocochlear (VIII) nerves", "y": [31], "t": 127}, {"id": "PP30-NEU-149", "q": "A patient presents with ptosis and diplopia. Which structure is most likely affected?", "a": "Oculomotor nerve (CN III)", "y": [30], "t": 130}, {"id": "PP35-NEU-046", "q": "A 65-year-old woman with diabetes presents with new diplopia and headache. The left eyelid is ptotic, the left pupil is dilated and fixed to light, and the left eye is deviated laterally and slightly downward. What is the most likely cause?", "a": "Left third nerve palsy from compression by a posterior communicating artery aneurysm", "y": [35], "t": 130}, {"id": "NEU-OLDP-032", "q": "A patient cannot see in the temporal visual field of both eyes (bitemporal hemianopia). Where is the lesion?", "a": "Optic chiasm", "y": [30], "t": 129}], "years": [30, 31, 35], "th": [127, 130]}, {"id": "gap-neuro-04", "set": "neuro", "title": "Vertigo, cerebellar hemorrhage และ stroke pathology", "subtitle": "แยก central จาก peripheral vertigo, CPA tumor, เลือดออกใน cerebellum และพยาธิกำเนิดของ stroke", "md": "### Vertigo: กลไก\n- Vertigo = รู้สึกหมุนจากความไม่สมดุลของสัญญาณ vestibular สองข้าง\n- **Peripheral**: inner ear (semicircular canal, utricle) หรือ CN VIII\n- **Central**: vestibular nuclei ใน brainstem หรือ cerebellum (ส่วนใหญ่ stroke ใน posterior circulation)\n\n### Central vs peripheral vertigo\n| ลักษณะ | Peripheral | Central |\n|---|---|---|\n| Nystagmus | horizontal-torsional ทิศเดียว (unidirectional), ลดลงเมื่อจ้องจุด (fixation) | **direction-changing (gaze-evoked)**, pure vertical (downbeat) หรือ pure torsional, ไม่ลดเมื่อ fixation |\n| Head impulse test | ผิดปกติ (มี corrective saccade) | **ปกติ** (สัญญาณอันตรายในผู้ป่วย acute vestibular syndrome) |\n| Test of skew | ไม่มี | **skew deviation** |\n| การทรงตัว | เดินได้แต่เอียง | **truncal ataxia** ยืน/นั่งเองไม่ได้ |\n| Hearing loss | พบได้ (Meniere, labyrinthitis) | พบน้อย (ยกเว้น AICA infarct) |\n| อาการร่วม | คลื่นไส้มาก ไม่มี neuro deficit | diplopia, dysarthria, dysphagia, limb ataxia (dysmetria), crossed sensory, Horner, ปวดหัว/ปวดคอ |\n\n- **HINTS** (Head Impulse, Nystagmus, Test of Skew): มีข้อใดข้อหนึ่งเป็นแบบ central (\"INFARCT\": Impulse Normal, Fast-phase Alternating, Refixation on Cover Test) → คิด stroke; ไวกว่า MRI-DWI ใน 24–48 ชม.แรก\n- **Resting tremor ไม่ใช่ลักษณะของ central vertigo** — เป็นอาการของ parkinsonism (basal ganglia) ส่วน cerebellar lesion ให้ *intention* tremor\n- Peripheral ที่พบบ่อย: **BPPV** (เป็นวินาทีตามท่า, Dix–Hallpike บวก → Epley maneuver), **vestibular neuritis** (หลายวัน ไม่มีหูอื้อ), labyrinthitis (มี hearing loss), **Meniere** (20 นาที–12 ชม. + low-frequency SNHL ขึ้นลง + tinnitus + หูอื้อ)\n\n### Cerebellopontine angle (CPA) tumor\n- ที่พบบ่อยสุดคือ **vestibular schwannoma (acoustic neuroma)** จาก Schwann cell ของ vestibular portion ของ CN VIII ที่ internal auditory canal; สองข้าง → NF2; รองลงมา meningioma\n- อาการตามลำดับการโต: **unilateral progressive SNHL + tinnitus** (อาการแรกที่พบบ่อยสุด) → imbalance/dizziness เป็นพัก ๆ (มักไม่หมุนรุนแรงเพราะโตช้า สมองชดเชยทัน) → กด **CN V: corneal reflex ลดลง** (sign แรกของ CN V) + ชาหน้า → CN VII (facial weakness มักเกิดช้า) → กด cerebellum (ataxia) และ hydrocephalus\n- โจทย์: เวียนหัวเป็นพัก ๆ + **corneal reflex ข้างซ้ายลด + หูซ้ายเสีย** → CPA tumor ข้างซ้าย\n- Corneal reflex: afferent CN V1, efferent CN VII\n- ตรวจ: audiometry (asymmetric SNHL) → **MRI with gadolinium ของ IAC/CPA**\n- รักษา: observation (ก้อนเล็ก ผู้สูงอายุ), stereotactic radiosurgery, microsurgery\n\n### Cerebellar hemorrhage\n- ~10% ของ ICH; สาเหตุหลัก **hypertension** บริเวณ dentate nucleus\n- อาการทันที: **ปวดท้ายทอย, vertigo, อาเจียนซ้ำ, ยืน/เดินไม่ได้ (truncal ataxia), gaze-evoked nystagmus, ipsilateral limb ataxia — ไม่มี hemiparesis**\n- อาจมี **neck stiffness** (เลือดเข้า subarachnoid/fourth ventricle หรือ tonsillar herniation), ipsilateral gaze palsy, CN VI/VII palsy\n- **ซึมลง** = brainstem compression หรือ obstructive hydrocephalus (กด fourth ventricle) → อันตราย อาจเสียชีวิตเร็ว\n- วินิจฉัย: **non-contrast CT brain**\n- รักษา: ควบคุม BP (SBP เป้าหมาย ~140 mmHg, หลีกเลี่ยง <130), reverse anticoagulant; **surgical evacuation (suboccipital craniectomy) ทันที** เมื่อ hematoma >3 cm หรือ >15 mL ร่วมกับ neurologic deterioration, brainstem compression หรือ hydrocephalus — ใส่ EVD อย่างเดียวไม่แนะนำ\n- **Cerebellar infarction** (PICA พบบ่อยสุด) อาการคล้ายกัน; infarct ใหญ่บวมสูงสุดวันที่ 2–4 → กด brainstem → suboccipital decompressive craniectomy\n\n### Stroke pathology: ischemic stroke\n- จำแนก (TOAST): large-artery atherosclerosis, cardioembolism (AF), small-vessel occlusion (lacunar), other determined, cryptogenic\n- **Atherosclerosis**: plaque ที่ carotid bifurcation/ICA origin, MCA, vertebrobasilar → thrombosis ณ ที่ตีบ หรือ artery-to-artery embolism; risk HT, DM, dyslipidemia, สูบบุหรี่\n- **Lacunar infarct** (<15 mm): หลอดเลือดเล็ก penetrating (lenticulostriate, thalamoperforator, basilar paramedian) อุดจาก **lipohyalinosis**/microatheroma จาก **HT และ DM**; ตำแหน่ง basal ganglia, internal capsule, thalamus, pons\n- กลุ่มอาการ lacunar: pure motor (posterior limb internal capsule), pure sensory (thalamus VPL), ataxic hemiparesis, dysarthria–clumsy hand, sensorimotor — **ไม่มี cortical sign** (aphasia, neglect, hemianopia)\n\n### Stroke pathology: spontaneous intracerebral hemorrhage (ICH)\n- **สาเหตุที่พบบ่อยที่สุดในผู้ใหญ่ = chronic hypertension** → small penetrating artery เกิด lipohyalinosis/fibrinoid necrosis และ **Charcot–Bouchard microaneurysm** → แตก\n- ตำแหน่ง hypertensive ICH (deep): **putamen (พบบ่อยสุด)** > thalamus > pons > cerebellum\n- **Lobar ICH ในผู้สูงอายุ >70 ปี** → cerebral amyloid angiopathy (β-amyloid สะสมในผนังหลอดเลือด cortex, เลือดออกซ้ำ, microbleeds บน MRI-SWI)\n- คนอายุน้อย/lobar: AVM, cavernoma, ยา (amphetamine, cocaine), anticoagulant, tumor, CVST → ทำ CTA/MRI หา secondary cause\n\n| | Hypertensive ICH | Cerebral amyloid angiopathy |\n|---|---|---|\n| อายุ | กลางคน-สูงอายุที่มี HT | >70 ปี |\n| ตำแหน่ง | deep: putamen, thalamus, pons, cerebellum | lobar (cortical-subcortical) |\n| พยาธิ | lipohyalinosis, Charcot–Bouchard | β-amyloid ในผนังหลอดเลือด |", "pearls": ["Central vertigo: direction-changing nystagmus, head impulse ปกติ, skew deviation, truncal ataxia (HINTS); resting tremor ไม่ใช่ลักษณะ central vertigo", "เวียนหัว + corneal reflex ลด + หูเสียข้างเดียวกัน = CPA tumor (vestibular schwannoma) → MRI gadolinium", "HT + vertigo + อาเจียน + truncal ataxia + nystagmus ± คอแข็ง ไม่มี hemiparesis = cerebellar hemorrhage → CT; >3 cm หรือซึมลง → ผ่าตัดด่วน", "สาเหตุ spontaneous ICH ที่พบบ่อยที่สุด = chronic hypertension (lipohyalinosis, Charcot–Bouchard) ตำแหน่ง putamen มากสุด", "Lacunar infarct = lipohyalinosis ของ penetrating artery จาก HT/DM ไม่มี cortical sign"], "traps": [], "q": [{"id": "PP29-NEU-037", "q": "A 62-year-old hypertensive man suddenly develops vertigo, vomiting, truncal ataxia, nystagmus, headache and neck stiffness, with no limb weakness. What is the most likely diagnosis?", "a": "Cerebellar haemorrhage", "y": [29, 31], "t": 131}, {"id": "PP31-NEU-043", "q": "A 66-year-old hypertensive man has sudden severe occipital headache, vomiting, vertigo and inability to stand. Examination shows nystagmus and right-sided limb and truncal ataxia without hemiparesis; he is drowsy. Which is the most likely diagnosis?", "a": "Cerebellar haemorrhage", "y": [31], "t": 131}, {"id": "PP33-NEU-004", "q": "A 60-year-old man presents with headache, vertigo and vomiting that began abruptly 20 minutes earlier. On examination he has truncal ataxia, gaze-evoked nystagmus and a positive stiff neck. What is the most likely diagnosis?", "a": "Cerebellar hemorrhage (cerebellar hematoma)", "y": [33], "t": 131}, {"id": "NEU-OLDP-027", "q": "A 58-year-old woman has intermittent episodes of dizziness. Examination shows a diminished left corneal reflex and left-sided hearing loss. What is the diagnosis?", "a": "Cerebellopontine angle tumor", "y": [31], "t": 146}, {"id": "NEU-OLDP-053", "q": "A patient presents with vertigo. Which of the following findings is NOT a feature suggesting a central cause of vertigo?", "a": "Resting tremor", "y": [30], "t": 146}, {"id": "NEU-OLDP-075", "q": "Which of the following findings is NOT seen in central vertigo?", "a": "Resting tremor", "y": [32], "t": 146}, {"id": "PP28-NEU-134", "q": "What is the most common cause of spontaneous (non-traumatic) intracerebral haemorrhage in adults?", "a": "Chronic hypertension (small-vessel lipohyalinosis and Charcot–Bouchard microaneurysms)", "y": [28], "t": 126}], "years": [28, 29, 30, 31, 32, 33], "th": [131, 146]}, {"id": "gap-neuro-06", "set": "neuro", "title": "CNS infection: eosinophilic meningitis (Angiostrongylus) และ meningococcal disease", "subtitle": "เยื่อหุ้มสมองอักเสบจากพยาธิในบริบทไทย และ N. meningitidis: การแพร่เชื้อ การรักษา และยาป้องกันผู้สัมผัส", "md": "### Eosinophilic meningitis: นิยามและสาเหตุ\n- นิยาม: **CSF eosinophils ≥10 cells/µL หรือ ≥10% ของ CSF WBC**\n- สาเหตุในไทย: **Angiostrongylus cantonensis** (พบบ่อยที่สุด) และ **Gnathostoma spinigerum**; อื่น ๆ cysticercosis, toxocariasis, coccidioidomycosis และ non-infectious (lymphoma, ยา, VP shunt)\n\n### Angiostrongylus cantonensis (rat lungworm): วงจรชีวิตและกลไก\n- พยาธิตัวแก่อยู่ใน pulmonary artery ของ **หนู** → ตัวอ่อนออกมากับอุจจาระหนู → เข้าสู่ **หอย/ทาก (intermediate host)**: **หอยโข่ง (Pila)**, หอยเชอรี่ (Pomacea, golden apple snail), หอยทากยักษ์แอฟริกา\n- Paratenic host: กุ้ง ปู กบ ตะกวด; ผักที่ปนเมือกทาก\n- คนเป็น accidental dead-end host: กินหอยดิบ (เช่น ก้อยหอย ในภาคอีสาน) → L3 larvae ไชไปที่ CNS แล้วตาย → **eosinophilic inflammation** ของเยื่อหุ้มสมอง\n\n### Angiostrongylus: อาการและ CSF\n- ระยะฟักตัว **1–3 สัปดาห์ (เฉลี่ย ~2 สัปดาห์)** หลังกินหอยดิบ; พบในผู้ชายวัยทำงานภาคอีสานมาก\n- **ปวดหัวรุนแรง** (อาการเด่นที่สุด เป็นพัก ๆ), คอแข็ง, คลื่นไส้อาเจียน, paresthesia/hyperesthesia ผิวหนัง; ไข้ต่ำหรือไม่มีไข้; **ความรู้สึกตัวมักปกติ**; อาจมี CN VI/VII palsy หรือพยาธิเข้าตา\n- CSF: **opening pressure สูง**, WBC หลายร้อย/µL, **eosinophils >10% (มักราว 20–70%)**, protein สูงเล็กน้อย-ปานกลาง, **glucose มักปกติหรือต่ำเล็กน้อย**; เลือดมักมี eosinophilia\n- โจทย์ที่ให้ประวัติ **\"กินหอยโข่งดิบ + CSF eosinophil >10%\"** → ตอบ ***Angiostrongylus cantonensis*** เสมอ (แม้ค่าน้ำตาลใน CSF ที่ให้มาจะต่ำ)\n\n### Angiostrongylus vs Gnathostoma\n| | Angiostrongylus cantonensis | Gnathostoma spinigerum |\n|---|---|---|\n| แหล่ง | หอยโข่ง หอยเชอรี่ ทาก (ดิบ) | ปลาน้ำจืดดิบ (ปลาช่อน ปลาไหล), กบ, ไก่ |\n| พยาธิสภาพ | meningitis (larvae ตายในเยื่อหุ้มสมอง) | larva ไชทำลายเนื้อเยื่อ: radiculomyelitis, encephalitis, เลือดออก |\n| อาการเด่น | ปวดหัวรุนแรง คอแข็ง รู้สึกตัวดี | **ปวดร้าวตามรากประสาทรุนแรง → อัมพาตขา ปัสสาวะไม่ออก**, ซึม; ผิวหนังบวมเคลื่อนที่ (migratory swelling) |\n| CSF | eosinophilic, ใส | eosinophilic, **xanthochromic หรือมีเลือดปน** |\n| พยากรณ์ | ดี ส่วนใหญ่หายเอง | แย่กว่า อาจเสียชีวิต/พิการ |\n| รักษา | supportive + steroid | albendazole 400 mg bid × 21 วัน หรือ ivermectin |\n\n### Angiostrongylus: การรักษาและป้องกัน\n1. ส่วนใหญ่ **self-limited** ใน 2–8 สัปดาห์\n2. **Serial LP** เพื่อลดความดันและบรรเทาปวดหัวเมื่อ opening pressure สูง; analgesics\n3. **Prednisolone 60 mg/day × 14 วัน** (RCT ในไทย: ลดระยะเวลาปวดหัว ลดการใช้ยาแก้ปวดและ LP ซ้ำ)\n4. Albendazole ร่วมกับ steroid ใช้ได้ในบางแนวทาง แต่การศึกษาในไทยไม่พบว่าดีกว่า steroid เดี่ยวชัดเจน; ยาฆ่าพยาธิเดี่ยว ๆ อาจทำให้อักเสบมากขึ้นจากพยาธิที่ตาย\n5. ป้องกัน: ไม่กินหอย/ทากดิบหรือสุก ๆ ดิบ ๆ, ล้างผักสด\n\n### Neisseria meningitidis: เชื้อและการแพร่\n- Gram-negative diplococcus (รูปเมล็ดถั่ว) มี polysaccharide capsule; serogroup สำคัญ A, B, C, W, X, Y\n- คนเป็นแหล่งรังโรคเดียว; **asymptomatic nasopharyngeal carriage** ~5–10% ของประชากร\n- **การแพร่: respiratory droplets และสัมผัสโดยตรงกับสารคัดหลั่งจาก nasopharynx/ช่องปาก** (อยู่ใกล้ชิด จูบ ใช้ภาชนะร่วม) — ไม่ใช่ airborne ระยะไกล ไม่ใช่ fecal-oral\n- กลุ่มเสี่ยง: อยู่รวมกันแออัด (หอพัก ทหาร เรือนจำ ผู้แสวงบุญ Hajj), **terminal complement deficiency (C5–C9)**, ได้ eculizumab, asplenia, HIV, สูบบุหรี่\n\n### Meningococcal disease: อาการและการรักษา\n- **Meningitis**: ไข้ ปวดหัว คอแข็ง ซึม\n- **Meningococcemia**: ไข้สูงเฉียบพลัน + **petechiae → hemorrhagic purpura (purpura fulminans)**, septic shock, DIC; **Waterhouse–Friderichsen syndrome** (adrenal hemorrhage); แย่ลงภายในชั่วโมง\n- วินิจฉัย: **hemoculture ก่อนให้ยา (แต่ไม่ให้ยาช้า)**, CSF Gram stain/culture/PCR, ขูดรอยโรคผิวหนัง\n- รักษา: **ให้ antibiotic ภายใน 1 ชม.** — **ceftriaxone 2 g IV q12h** (meningitis) ประมาณ 7 วัน; penicillin G ใช้ได้ถ้าเชื้อไวต่อยา; dexamethasone 0.15 mg/kg q6h ให้ก่อน/พร้อม antibiotic โดสแรกใน suspected bacterial meningitis (ประโยชน์ชัดใน pneumococcus)\n- **Droplet precaution จนได้ยาที่มีประสิทธิภาพครบ 24 ชม.**\n- ผู้ป่วยที่รักษาด้วย penicillin ต้องได้ยากำจัด carriage เพิ่ม (ไม่จำเป็นถ้าได้ ceftriaxone)\n\n### Chemoprophylaxis สำหรับผู้สัมผัสใกล้ชิด\n- ใคร: คนในบ้าน, เพื่อนร่วมห้องพัก, คู่นอน/จูบ, เด็กใน daycare เดียวกัน, บุคลากรที่สัมผัสสารคัดหลั่งช่องปากโดยไม่ป้องกัน (ใส่ท่อช่วยหายใจ ดูดเสมหะ, mouth-to-mouth); ผู้สัมผัสทั่วไปในโรงพยาบาล/ห้องเรียนไม่ต้อง\n- ให้เร็วที่สุด (ภายใน 24 ชม. หลังวินิจฉัย index case)\n\n| ยา | ขนาดผู้ใหญ่ | หมายเหตุ |\n|---|---|---|\n| **Ciprofloxacin** | **500 mg PO ครั้งเดียว** | สะดวกที่สุด |\n| Rifampicin | 600 mg PO q12h × 2 วัน (เด็ก 10 mg/kg q12h) | ปัสสาวะสีส้ม, ยาตีกัน, ลดผล OCP |\n| Ceftriaxone | 250 mg IM ครั้งเดียว (เด็ก <15 ปี 125 mg) | **เลือกในหญิงตั้งครรภ์** |\n| Azithromycin | 500 mg PO ครั้งเดียว | ทางเลือกถ้าเชื้อดื้อ ciprofloxacin |\n\n- วัคซีน: MenACWY conjugate และ MenB สำหรับ asplenia, complement deficiency, ผู้ได้ eculizumab, ผู้เดินทางไป meningitis belt/Hajj, การระบาด", "pearls": ["กินหอยโข่ง/หอยเชอรี่ดิบ ~2 สัปดาห์ + ปวดหัวรุนแรง คอแข็ง + CSF eosinophil >10% = Angiostrongylus cantonensis", "Angiostrongylus: รู้สึกตัวดี CSF ใส รักษา serial LP + prednisolone 60 mg/day × 14 วัน; Gnathostoma: radiculomyelitis + CSF มีเลือด", "N. meningitidis แพร่ทาง respiratory droplets และสารคัดหลั่ง nasopharynx; droplet precaution 24 ชม. หลังได้ยา", "Chemoprophylaxis ผู้สัมผัสใกล้ชิด: ciprofloxacin 500 mg PO ครั้งเดียว (หรือ rifampicin 600 mg q12h × 2 วัน, ceftriaxone 250 mg IM ในหญิงตั้งครรภ์)", "Meningococcemia: purpura fulminans + shock + Waterhouse–Friderichsen; terminal complement deficiency เสี่ยงติดซ้ำ"], "traps": [], "q": [{"id": "PP28-NEU-030", "q": "A 30-year-old man from north-eastern Thailand who often eats raw Pila snails has 3 days of severe headache and neck stiffness. CSF: opening pressure 28 cmH2O, glucose 20 mg/dL (blood glucose 100), protein 96 mg/dL, WBC 100/mm3 (PMN 35%, lymphocytes 45%, eosinophils 25%). What is the most likely causative organism?", "a": "Angiostrongylus cantonensis", "y": [28, 29, 30, 33], "t": 152}, {"id": "PP31-NEU-028", "q": "A patient develops headache and neck stiffness about 2 weeks after eating raw golden apple snails (หอยโข่ง). CSF shows pleocytosis with more than 10% eosinophils. What is the causative organism?", "a": "Angiostrongylus cantonensis", "y": [31, 35], "t": 152}, {"id": "PP35-NEU-067", "q": "A man from north-eastern Thailand develops severe headache and neck stiffness 2 weeks after eating raw apple snails (Pila). CSF shows WBC 600/µL with 40% eosinophils, normal glucose and mildly raised protein. Which organism is the most likely cause? (Write the full scientific name.)", "a": "Angiostrongylus cantonensis", "y": [35], "t": 152}, {"id": "PP34-NEU-018", "q": "A university student is admitted with meningococcal meningitis. How is Neisseria meningitidis transmitted to his close contacts?", "a": "Respiratory droplets and direct contact with nasopharyngeal secretions", "y": [34], "t": 148}, {"id": "ID-OLDP-004", "q": "A patient is admitted with Neisseria meningitidis infection (the photograph shows hemorrhagic purpura). Which antimicrobial should be given to close household contacts as chemoprophylaxis?", "a": "Ciprofloxacin 500 mg orally, single dose", "y": [31], "t": 148}], "years": [28, 29, 30, 31, 33, 34, 35], "th": [152]}, {"id": "gap-neuro-08", "set": "neuro", "title": "Status epilepticus และการชักเฉียบพลัน", "subtitle": "ลำดับการรักษาตามเวลา: stabilization → benzodiazepine → second-line ASM → anesthetic infusion", "md": "### นิยามและกลไก\n- **Convulsive status epilepticus (ILAE 2015)**: ชักต่อเนื่อง **≥5 นาที (t1 = เริ่มรักษา)** หรือชัก ≥2 ครั้งโดยไม่ฟื้นกลับสู่ภาวะปกติระหว่างครั้ง; **≥30 นาที (t2)** เริ่มเกิด neuronal injury ถาวร\n- Focal SE with impaired awareness: t1 = 10 นาที, t2 >60 นาที\n- กลไก: กลไกหยุดชักล้มเหลว → **GABA-A receptor ถูก internalize** ออกจาก synapse เมื่อชักนานขึ้น → **benzodiazepine ได้ผลลดลงตามเวลา**; NMDA receptor เพิ่มขึ้น → excitotoxicity → ต้องรักษาเร็วและให้ขนาดเพียงพอ\n- สาเหตุ: ระดับยากันชักต่ำ (ขาดยา) ในผู้ป่วย epilepsy, stroke (เฉียบพลันหรือ remote), alcohol withdrawal, CNS infection, metabolic (hypoglycemia, hyponatremia, hypocalcemia, uremia), ยา/สารพิษ, head injury, tumor, eclampsia\n\n### ลำดับการรักษาตามเวลา\n1. **0–5 นาที Stabilization**: ABC, จัดท่านอนตะแคง, O2, monitor, เปิด IV, เจาะ DTX → ถ้า glucose <60 mg/dL ให้ **thiamine 100 mg IV ก่อน แล้วตามด้วย 50% glucose 50 mL**; ส่ง electrolytes, Ca, Mg, BUN/Cr, LFT, CBC, ระดับยากันชัก, toxicology\n2. **5–20 นาที First-line = benzodiazepine** (เลือกหนึ่งอย่าง ให้ซ้ำได้ 1 ครั้ง)\n3. **20–40 นาที Second-line ASM** (ยังชักหลัง benzodiazepine)\n4. **40–60 นาที Refractory SE**: intubate + continuous IV infusion (midazolam, propofol หรือ thiopental/pentobarbital) titrate จน EEG ไม่มีชัก + continuous EEG\n5. Super-refractory (≥24 ชม. แม้ได้ anesthetic): ketamine, ปรึกษาผู้เชี่ยวชาญ\n\n- ห้ามใส่ของในปาก ห้ามกดตรึงแรง ๆ; ผู้ป่วยไม่ตื่นหลังหยุดเกร็ง → คิด **non-convulsive SE** → EEG\n\n### First-line benzodiazepine\n| ยา | ขนาด | หมายเหตุ |\n|---|---|---|\n| **Lorazepam IV** | **0.1 mg/kg (max 4 mg/dose)** | ยาแรกตาม guideline สากล ออกฤทธิ์ในสมองนาน |\n| **Diazepam IV** | **0.15–0.2 mg/kg (max 10 mg/dose)** ฉีดช้า ~5 mg/min | หาได้ทั่วไปในไทย ฤทธิ์กันชักซ้ำสั้นกว่า |\n| Midazolam IM | 10 mg (>40 kg), 5 mg (13–40 kg) | เมื่อยังเปิด IV ไม่ได้ (RAMPART) |\n| Diazepam rectal / midazolam buccal-intranasal | diazepam 0.2–0.5 mg/kg PR | ก่อนถึงโรงพยาบาล |\n\n- ผลข้างเคียงสำคัญ: respiratory depression, hypotension — เตรียม bag-valve-mask; **การไม่ให้ benzodiazepine หรือให้ขนาดต่ำเกินไปอันตรายกว่า**\n\n### Second-line ASM (ESETT: ประสิทธิภาพใกล้เคียงกัน ~50%)\n| ยา | ขนาด | ข้อควรระวัง |\n|---|---|---|\n| **Phenytoin** | **20 mg/kg IV rate ≤50 mg/min** (ผู้สูงอายุ/โรคหัวใจ ≤25 mg/min) | ผสม NSS เท่านั้น (ตกตะกอนใน dextrose); hypotension, arrhythmia → monitor ECG/BP; purple glove |\n| Fosphenytoin | 20 mg PE/kg IV ≤150 mg PE/min | ระคายหลอดเลือดน้อยกว่า |\n| **Sodium valproate** | **40 mg/kg IV (max 3,000 mg)** | ห้ามในโรคตับ, mitochondrial disease, หญิงตั้งครรภ์ |\n| **Levetiracetam** | **60 mg/kg IV (max 4,500 mg)** | ปลอดภัย ยาตีกันน้อย ปรับขนาดตามไต |\n| Phenobarbital | 15–20 mg/kg IV | ใช้เมื่อไม่มียาอื่น; กดการหายใจ/BP |\n\n### สถานการณ์ที่ออกสอบบ่อย\n- **ชักต่อเนื่อง >5 นาที**: หลัง ABC → **IV lorazepam** (ในบริบทไทยที่ไม่มี lorazepam IV ใช้ **IV diazepam** แทนได้)\n- **ผู้ป่วยเคยเป็น stroke 2 ปีก่อน มาด้วยชักหลายครั้งวันนี้**: ถ้ายังชักอยู่หรือชักซ้ำโดยไม่ฟื้นระหว่างครั้ง = SE → **IV benzodiazepine (diazepam IV)** ทันที แล้วตามด้วย loading second-line ASM\n- Post-stroke seizure: **early (≤7 วันหลัง stroke)** = acute symptomatic; **late (>7 วัน เช่น 2 ปีหลัง)** = unprovoked, โอกาสชักซ้ำ >60% → **นับเป็น epilepsy** → เริ่มยากันชักระยะยาว (เช่น levetiracetam, lamotrigine)\n- Alcohol withdrawal seizure → benzodiazepine (phenytoin ไม่ได้ผล) + thiamine\n- Eclampsia → **MgSO4** 4–6 g IV loading แล้ว 1–2 g/h\n- Hypoglycemia → glucose; isoniazid overdose → **pyridoxine** (gram ต่อ gram ของ INH ที่กิน)\n- Hyponatremia รุนแรงที่ชัก → 3% NaCl 100–150 mL IV bolus", "pearls": ["Convulsive SE = ชัก ≥5 นาที หรือชักซ้ำโดยไม่ฟื้น; ยิ่งชักนาน benzodiazepine ยิ่งได้ผลน้อย (GABA-A internalization)", "ลำดับ: ABC + DTX (thiamine ก่อน glucose) → IV lorazepam 0.1 mg/kg (max 4 mg) หรือ IV diazepam 0.15–0.2 mg/kg (max 10 mg) → second-line", "Second-line เท่ากัน: phenytoin 20 mg/kg ≤50 mg/min (ใน NSS), valproate 40 mg/kg, levetiracetam 60 mg/kg", "ไม่มี IV → midazolam IM 10 mg; ชักต่อหลัง 2 ยา = refractory → intubate + midazolam/propofol infusion + EEG", "ชักครั้งแรกหลัง stroke >7 วัน (late) = unprovoked → ถือเป็น epilepsy เริ่มยากันชักระยะยาว"], "traps": [], "q": [{"id": "NEU-OLDP-040", "q": "A patient is brought in with a convulsive seizure that has continued for more than 5 minutes (status epilepticus). After airway, breathing and circulation are secured, which drug should be given first?", "a": "IV lorazepam", "y": [30], "t": 158}, {"id": "NEU-OLDP-056", "q": "A patient who had a stroke 2 years ago is brought in today after several seizure episodes. What should be given?", "a": "Intravenous diazepam", "y": [34], "t": 158}], "years": [30, 34], "th": [158]}], "left": []}, {"set": "id", "name": "ID", "n_lec": 68, "n_unc": 17, "lectures": [{"lec": "25/9", "title": "Septicemia and antibiotic usage", "n": 2, "angle": {"dx": 1, "fact": 1}, "pattern": "แทบไม่ถูกถามตรง (2 ข้อ รุ่น 30–31) เป็น fact/dx ง่าย; ข้อ antibiotic pharmacology (FQ กลไก, red man, PVE regimen) ที่เคยออกไม่อยู่ในคาบนี้", "tip": "เป็นเนื้อหาใหม่ตาม SSC 2026 — ให้รู้นิยาม Sepsis-3, ชนิด/ปริมาณสารน้ำ, vasopressor ตัวแรก และ spectrum ยาหลัก (ceftazidime/meropenem/vancomycin) ไว้เผื่อออกใหม่", "secs": [{"t": "นิยาม Sepsis-3 และคัดกรองด้วยอะไร", "n": 1, "y": [31], "w": "ไข้ + UTI + RR 22 WBC 13,000 ในผู้สูงอายุ → วินิจฉัย sepsis", "c": null, "s": ["นิยาม Sepsis-3 / คัดกรอง"], "q": [{"q": "A 75-year-old woman is brought to the emergency room because of a 2-day history of fever and fatigue. On physical examination, temperature is 38.4°C, pulse 95/min, respiratory rate 22/min, BP 130/70 mmHg, O2 saturation 95% on room air. The leukocyte count is 13,000/µL and urinalysis shows 20–25 leukocytes/HPF. Urine culture and blood culture are both growing E. coli. Which of the following terms best describes this patient's illness?", "a": "Sepsis", "y": [31], "an": "dx", "sub": "นิยาม Sepsis-3 / คัดกรอง", "t": 185}]}, {"t": "กลไก — ท่อรั่ว ท่อขยาย ท่อตัน โรงงานดับ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "สี่ระดับความมั่นใจ และนาฬิกายาปฏิชีวนะ 1·1·3·รอ", "n": 0, "y": [], "w": null, "c": "นาฬิกายาปฏิชีวนะ 1·1·3 — แนวคิดใหม่ ยังไม่ถูกทดสอบ", "s": [], "q": []}, {"t": "ชั่วโมงแรก — เพาะเชื้อ วัด lactate และ procalcitonin ใช้ตอนไหน", "n": 0, "y": [], "w": null, "c": "blood culture/lactate/procalcitonin — ยังไม่ออก", "s": [], "q": []}, {"t": "สารน้ำ — 30 mL/kg ใน 3 ชั่วโมง และเลือกชนิดให้ถูก", "n": 0, "y": [], "w": null, "c": "30 mL/kg balanced crystalloid — SSC 2026 ใหม่ ยังไม่ถาม แต่น่าออก", "s": [], "q": []}, {"t": "ยากระตุ้นความดันและ steroid", "n": 0, "y": [], "w": null, "c": "norepinephrine first-line, MAP 65, hydrocortisone — ยังไม่ออก", "s": [], "q": []}, {"t": "หลักการใช้ยาปฏิชีวนะ 1 — empirical ให้ตรงแหล่ง แล้วค่อยแคบลง", "n": 1, "y": [30], "w": "ยาที่คลุม Pseudomonas = ceftazidime", "c": null, "s": ["ยาหลักแต่ละกลุ่ม — ceftazidime anti-pseudomonal"], "q": [{"q": "Which antibiotic reliably covers Pseudomonas aeruginosa?", "a": "Ceftazidime", "y": [30], "an": "fact", "sub": "ยาหลักแต่ละกลุ่ม — ceftazidime anti-pseudomonal", "t": 214}]}, {"t": "หลักการใช้ยาปฏิชีวนะ 2 — PK/PD ขนาดยา และไต", "n": 0, "y": [], "w": null, "c": "PK/PD time vs concentration-dependent — ยังไม่ออก (แต่กลไกยา FQ/vancomycin ถูกถามแบบนอก learn)", "s": [], "q": []}, {"t": "Stewardship — คลุมเท่าที่จำเป็น และหยุดให้เป็น", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Source control และ sepsis เขตร้อนในประเทศไทย", "n": 0, "y": [], "w": null, "c": "sepsis เขตร้อน — ทับซ้อนกับคาบไข้เฉียบพลันที่ถูกถามมาก", "s": [], "q": []}, {"t": "ดูแลต่อใน ICU และการสื่อสาร", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}], "th": [185]}, {"lec": "5/10", "title": "AIDS and HIV infection", "n": 17, "angle": {"fact": 1, "dx": 6, "ix": 3, "mx": 7}, "pattern": "เน้น dx ของ OI ตาม CD4 และ mx (เริ่ม ART, สูตร TLD, amphotericin) เป็นข้อเคสสั้น ส่วนใหญ่รุ่น 31 (8 ข้อ) แล้วกระจายรุ่น 32–34; Cryptosporidium/Cystoisospora (ขนาด oocyst) และ Nocardia ใน HIV ถูกถามแต่ไม่มีใน learn นอกจากนี้ PCP (cotrimoxazole + steroid, LDH สูง) ถูกถาม 5 ข้อจากหมวดปอดและ AIR", "tip": "ทำตาราง CD4 → เชื้อฉวยโอกาส + ยาป้องกัน, การรักษา crypto (amphotericin + ICP), สูตร TLD/HBV coinfection และ window period ให้แม่น; เสริม oocyst ขนาดเล็ก/ใหญ่ใน HIV diarrhoea", "secs": [{"t": "ไวรัสและกลไก — ทำไม CD4 คือเป้าหมาย", "n": 0, "y": [], "w": null, "c": "วงจรชีวิตไวรัส/กลไกยา — ไม่เคยออก", "s": [], "q": []}, {"t": "การติดต่อ และ U=U", "n": 1, "y": [31], "w": null, "c": null, "s": ["สามทางหลัก — urine ไม่แพร่"], "q": [{"q": "Which body fluid is the least likely route of HIV transmission?", "a": "Urine", "y": [31], "an": "fact", "sub": "สามทางหลัก — urine ไม่แพร่", "t": 209}]}, {"t": "ธรรมชาติของโรค และ acute HIV", "n": 0, "y": [], "w": null, "c": "acute HIV ไม่เคยถามตรง แต่เลียนแบบ mononucleosis น่าออก", "s": [], "q": []}, {"t": "WHO clinical staging และโรคที่บ่งชี้ AIDS", "n": 1, "y": [32, 34], "w": "CD4 500 + pneumonia → S. pneumoniae (รุ่น 32,34)", "c": null, "s": ["CD4 บอกว่าควรนึกถึงเชื้ออะไร — CD4 สูง = pneumococcus"], "q": [{"q": "A 20-year-old HIV-infected man with a CD4 count of 500/mm3 presents with pneumonia. What is the most likely organism in this patient?", "a": "Streptococcus pneumoniae", "y": [32, 34], "an": "dx", "sub": "CD4 บอกว่าควรนึกถึงเชื้ออะไร — CD4 สูง = pneumococcus", "t": 205}]}, {"t": "ใครควรตรวจ HIV และหลัก 5C", "n": 0, "y": [], "w": null, "c": "5C/กลุ่มที่ต้องตรวจ/PrEP-PEP ไม่เคยออก", "s": [], "q": []}, {"t": "การตรวจวินิจฉัย — 4th generation, window period และขั้นตอน A1–A2–A3", "n": 1, "y": [34], "w": "หญิงตั้งครรภ์เสี่ยงแต่ anti-HIV ลบ → ตรวจซ้ำเพราะ window period", "c": null, "s": ["window period — ตรวจซ้ำ"], "q": [{"q": "A pregnant woman with risk factors for HIV infection has a negative anti-HIV test. She is completely asymptomatic. What should be done next?", "a": "Schedule a repeat anti-HIV test in about 2 months because of the window period", "y": [34], "an": "ix", "sub": "window period — ตรวจซ้ำ", "t": 209}]}, {"t": "เริ่มยาต้านไวรัส — rapid ART, สูตรแรก และวิธีกินยาแต่ละตัว", "n": 2, "y": [31, 32, 33], "w": "เริ่ม ART ทันทีไม่ว่า CD4 เท่าไร; สูตรแรกตามแนวทางไทย = TLD (รุ่น 31–33)", "c": null, "s": ["เริ่มเมื่อไร — rapid ART ทุก CD4", "สูตรแรก — TLD"], "q": [{"q": "A 35-year-old man is newly found to be HIV positive. His only symptom is occasional night sweats, two to three times each month. Physical examination discloses small white exudative patches on the soft palate consistent with thrush. His CD4 count is 260/µL and his plasma viral load is 1,500 copies/mL. Which of the following is the most appropriate management for this patient?", "a": "Begin treatment now with a three-drug antiretroviral regimen", "y": [31], "an": "mx", "sub": "เริ่มเมื่อไร — rapid ART ทุก CD4", "t": 210}, {"q": "A 30-year-old man is newly diagnosed with HIV infection. He has no tuberculosis, no hepatitis B, normal renal function and is not taking other drugs. According to current Thai national guidelines, which antiretroviral regimen is preferred?", "a": "Tenofovir disoproxil fumarate + lamivudine + dolutegravir (TLD)", "y": [32, 33], "an": "mx", "sub": "สูตรแรก — TLD", "t": 210}]}, {"t": "ติดตามการรักษา พิษของ TDF และยาตีกัน", "n": 1, "y": [28], "w": null, "c": null, "s": ["HBV ร่วมกับ HIV — ต้องมี tenofovir"], "q": [{"q": "A patient with HIV is also chronically infected with hepatitis B. Which antiretroviral backbone is recommended?", "a": "Tenofovir (TDF or TAF) plus lamivudine or emtricitabine, with a third agent such as dolutegravir", "y": [28], "an": "mx", "sub": "HBV ร่วมกับ HIV — ต้องมี tenofovir", "t": 210}]}, {"t": "หญิงตั้งครรภ์และการป้องกันการติดเชื้อจากแม่สู่ลูก", "n": 0, "y": [], "w": null, "c": "PMTCT ไม่เคยออก แม้เป็นหัวข้อสำคัญในแนวทางไทย", "s": [], "q": []}, {"t": "วัณโรคในผู้ติดเชื้อ HIV", "n": 2, "y": [31], "w": "HIV + RLL infiltrate ไม่เห็นเชื้อใน Gram → reactivation TB (2 ข้อรุ่น 31)", "c": null, "s": ["ภาพทางคลินิกขึ้นกับ CD4 — TB ปอดกลีบล่าง"], "q": [{"q": "An HIV-infected patient has progressively worsening dyspnoea. Chest radiograph shows infiltration of the right lower lobe, and sputum Gram stain shows no causative organism. What is the most likely diagnosis?", "a": "Reactivation pulmonary tuberculosis", "y": [31], "an": "dx", "sub": "ภาพทางคลินิกขึ้นกับ CD4 — TB ปอดกลีบล่าง", "t": 205}, {"q": "An HIV-infected patient presents with progressively worsening dyspnoea. Chest radiograph shows an infiltrate at the right lower lobe and sputum Gram stain shows no organisms. Which diagnosis is most likely?", "a": "Reactivation pulmonary tuberculosis", "y": [31], "an": "dx", "sub": "ภาพทางคลินิกขึ้นกับ CD4 — TB ปอดกลีบล่าง", "t": 205}]}, {"t": "MAC และ Pneumocystis pneumonia (PCP)", "n": 5, "y": [30, 31, 32, 34, 35], "w": null, "c": null, "s": ["PCP: cotrimoxazole + steroid", "PCP ใน HIV", "PCP ในผู้ได้ยากดภูมิ", "LDH สูงใน PCP"], "q": [{"q": "A 34-year-old man with HIV infection who has never received antiretroviral therapy presents with 3 weeks of dry cough and progressive exertional dyspnoea. CD4 count is 125 cells/microlitre. Chest radiograph shows bilateral perihilar ground-glass opacities. Which organism is most likely responsible?", "a": "Pneumocystis jirovecii", "y": [32, 34, 35], "an": "dx", "sub": "PCP ใน HIV", "t": 99}, {"q": "A 36-year-old woman with HIV infection presents with 2 weeks of progressive exertional dyspnoea, low-grade fever and dry cough. Examination: BT 38 C, PR 130/min, RR 30/min, mild pallor, oral hairy leukoplakia, normal breath sounds with no adventitious sounds. ABG on room air: pH 7.45, PaO2 55 mmHg, PaCO2 30 mmHg, O2 saturation 80 percent. Apart from oxygen therapy, which treatment is most appropriate?", "a": "Cotrimoxazole plus systemic corticosteroid", "y": [31], "an": "mx", "sub": "PCP: cotrimoxazole + steroid", "t": 99}, {"q": "A patient with SLE on prednisolone and immunosuppressants presents with 1 week of dry cough, fever and dyspnea with bilateral interstitial infiltrates and marked hypoxemia but an unremarkable lung examination. What should be done first?", "a": "Treat empirically for Pneumocystis pneumonia while investigating for infection", "y": [34], "an": "mx", "sub": "PCP ในผู้ได้ยากดภูมิ", "t": 99}, {"q": "A 36-year-old woman has had progressive exertional dyspnoea for 2 weeks and one week of low-grade fever with a non-productive cough; for the last 2-3 days she has been breathless even at rest. Examination: BT 38 C, BP 100/70 mmHg, PR 130/min, RR 30/min, mild pallor, no icteric sclerae, oral hairy leukoplakia present, normal heart sounds, tachypnoea with normal breath sounds and no adventitious sounds, rest within normal limits. ABG on room air: pH 7.45, PaO2 55 mmHg, PaCO2 30 mmHg, O2 saturation 80%. Besides oxygen therapy, which treatment is most appropriate?", "a": "Cotrimoxazole plus prednisolone", "y": [31], "an": "mx", "sub": "PCP: cotrimoxazole + steroid", "t": 99}, {"q": "A patient with HIV presents with clinical features of Pneumocystis pneumonia (PCP). Which of the following is NOT an investigation used to diagnose PCP?", "a": "Serum LDH", "y": [30], "an": "ix", "sub": "LDH สูงใน PCP", "t": 99}]}, {"t": "เชื้อราประจำถิ่น: Talaromycosis และ Histoplasmosis", "n": 1, "y": [31], "w": "umbilicated papules ใน HIV → talaromycosis/cryptococcosis", "c": null, "s": ["Talaromycosis — ตุ่มบุ๋มกลาง"], "q": [{"q": "An HIV-infected patient presents with multiple umbilicated skin papules. What is the most likely diagnosis?", "a": "Disseminated fungal infection (cryptococcosis or talaromycosis)", "y": [31], "an": "dx", "sub": "Talaromycosis — ตุ่มบุ๋มกลาง", "t": 207}]}, {"t": "Cryptococcosis และสรุปยาป้องกันโรคฉวยโอกาสตาม CD4", "n": 3, "y": [31], "w": "cryptococcal meningitis: CSF ใน HIV ที่คอไม่แข็ง → crypto; amphotericin B 0.7 mg/kg; ผลข้างเคียง K/Mg ต่ำ → อ่อนแรง (รุ่น 31)", "c": null, "s": ["วินิจฉัยและรักษา — amphotericin: K/Mg", "Cryptococcus — อาการ (คอแข็งพบน้อย)", "วินิจฉัยและรักษา — amphotericin B"], "q": [{"q": "A 21-year-old woman with symptomatic HIV (last CD4 29 cells/mm3, 2%) is admitted with cryptococcal meningitis and has received amphotericin B 40 mg/day for one week. This morning she is fatigued with weakness of all four limbs; bowel and bladder control are normal and she swallows normally. Neurological examination: motor power grade 3+ in all proximal groups and grade 5 in all distal groups, normal deep tendon reflexes, negative Babinski sign, normal sensation and normal cranial nerves. What is the most appropriate next step?", "a": "Send serum electrolytes together with magnesium", "y": [31], "an": "ix", "sub": "วินิจฉัยและรักษา — amphotericin: K/Mg", "t": 206}, {"q": "A 30-year-old Thai man presents with headache for 2 weeks. Examination shows oral candidiasis, pruritic papular eruption and multiple enlarged cervical lymph nodes about 1 cm in size; neurological examination shows no neck stiffness and no papilloedema, and is otherwise unremarkable. Lumbar puncture: opening pressure 12 cmH2O, WBC 5 cells (all lymphocytes), protein 200 mg/dL, CSF sugar 30 mg% with blood sugar 130 mg%; CSF Gram stain shows multiple encapsulated budding yeasts. What is the diagnosis?", "a": "Cryptococcal meningitis", "y": [31], "an": "dx", "sub": "Cryptococcus — อาการ (คอแข็งพบน้อย)", "t": 206}, {"q": "An HIV-infected patient presents with meningitis and a positive neck stiffness. Which treatment should be started?", "a": "Amphotericin B 0.7 mg/kg IV q 24 hr", "y": [31], "an": "mx", "sub": "วินิจฉัยและรักษา — amphotericin B", "t": 206}]}], "th": [209, 210, 205, 99, 207, 206]}, {"lec": "10/11", "title": "Genital ulcer และ syphilis", "n": 7, "angle": {"mx": 3, "dx": 1, "ix": 2, "fact": 1}, "pattern": "เน้น mx (ชื่อยา+ขนาด: azithromycin 1 g, benzathine 2.4 MU) และ ix (VDRL/CSF VDRL) เป็นโจทย์สั้นจากลักษณะแผล/ผื่น รุ่น 31–34; ไม่ลงรายละเอียด herpes/LGV", "tip": "ท่องตารางแยกแผลห้าโรค + ยาและขนาดของ chancroid/syphilis ทุกระยะ (รวม neurosyphilis PGS IV และหญิงตั้งครรภ์ต้อง desensitize) และการแปล RPR/TPHA", "secs": [{"t": "แนวทางประเมินแผลที่อวัยวะเพศ และตารางแยกห้าโรค", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Chancroid (แผลริมอ่อน) — แยกจาก chancre และรักษาแบบครั้งเดียว", "n": 2, "y": [31, 32], "w": "แผลเจ็บที่อวัยวะเพศ (chancroid) หรือแพ้ penicillin → azithromycin 1 g ครั้งเดียว (รุ่น 31,32)", "c": null, "s": ["การรักษา chancroid — azithromycin 1 g"], "q": [{"q": "A patient with a painful genital ulcer is diagnosed with chancroid caused by Haemophilus ducreyi. What is the appropriate treatment?", "a": "Azithromycin 1 g orally as a single dose", "y": [32], "an": "mx", "sub": "การรักษา chancroid — azithromycin 1 g", "t": 188}, {"q": "A patient presents with a painful genital ulcer. He gives a history of penicillin allergy. Which antibiotic should be given?", "a": "Azithromycin 1 g orally as a single dose", "y": [31], "an": "mx", "sub": "การรักษา chancroid — azithromycin 1 g", "t": 188}]}, {"t": "Genital herpes — ลักษณะทางคลินิกและการวินิจฉัย", "n": 0, "y": [], "w": null, "c": "genital herpes clinical/NAAT ไม่เคยออก", "s": [], "q": []}, {"t": "Genital herpes — ยาต้านไวรัสในคนปกติและผู้ภูมิคุ้มกันบกพร่อง", "n": 0, "y": [], "w": null, "c": "acyclovir ขนาดยา genital herpes ยังไม่ออก", "s": [], "q": []}, {"t": "เริมรุนแรง แพร่กระจาย และภาวะแทรกซ้อนทางระบบประสาท", "n": 0, "y": [], "w": null, "c": "disseminated HSV ไม่เคยออก", "s": [], "q": []}, {"t": "Granuloma inguinale (donovanosis) และ Lymphogranuloma venereum", "n": 0, "y": [], "w": null, "c": "donovanosis/LGV ไม่เคยออก", "s": [], "q": []}, {"t": "Syphilis — เชื้อ การแบ่งระยะ และธรรมชาติของโรค", "n": 0, "y": [], "w": null, "c": "การแบ่งระยะ syphilis ไม่ถามตรงแต่จำเป็นต่อการเลือกยา", "s": [], "q": []}, {"t": "Syphilis — อาการ primary, secondary, latent และ tertiary", "n": 1, "y": [28], "w": "ผื่น secondary syphilis ฝ่ามือฝ่าเท้า/mucosa", "c": null, "s": ["Secondary — ผื่น + mucosal"], "q": [{"q": "A patient presents with erythematous lesions on the back and face and at other sites, including the mucosa of the mouth. Which of the following is the most likely diagnosis?", "a": "Syphilis",
