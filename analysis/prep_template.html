mucocutaneous, menorrhagia |\n| Platelet, PT | ปกติ | ปกติ |\n| aPTT | ยาว | ปกติหรือยาว |\n| Bleeding time/PFA-100 | ปกติ | ยาว |\n| FVIII | ต่ำ | ปกติหรือต่ำ |\n| ยาหลัก | FVIII concentrate (สำรอง: cryo) | DDAVP, vWF concentrate (สำรอง: cryo) |", "pearls": ["Hemophilia = X-linked recessive: ชายเป็นโรค ผ่านแม่ carrier ไม่มี male-to-male transmission, ~1/3 เป็น de novo", "เด็กชาย hemarthrosis, PT ปกติ aPTT ยาว mixing correct = ขาด FVIII หรือ FIX; ให้ factor ทันทีโดยไม่ต้องรอ imaging", "FVIII 1 IU/kg เพิ่ม 2%, FIX 1 IU/kg เพิ่ม 1%; cryo มี FVIII, fibrinogen, vWF, FXIII แต่ไม่มี FIX", "vWD = inherited bleeding disorder ที่พบบ่อยที่สุด: mucocutaneous bleeding, menorrhagia, aPTT ปกติหรือยาว, PFA-100/bleeding time ยาว, FVIII และ FIX อาจปกติ", "DDAVP 0.3 µg/kg ใช้ได้ใน vWD type 1 และ mild hemophilia A แต่ไม่ได้ผลใน hemophilia B และ vWD type 3"], "traps": [{"id": "PP31-HEM-015", "note": "โพยตอบ cryoprecipitate สำหรับ hemophilia A ก่อนถอนฟัน; ปัจจุบันคำตอบที่ดีที่สุดคือ FVIII concentrate (ให้ระดับราว 50%) ร่วมกับ tranexamic acid และ mild hemophilia A อาจใช้ DDAVP ได้; cryo เป็นทางเลือกเมื่อไม่มี concentrate ถ้าตัวเลือกมีแต่ blood component (PRC, FFP, platelet, cryo) จึงเลือก cryo ไม่ใช่ FFP"}, {"id": "HE-OLDP-022", "note": "โพยตอบ bleeding time (ข้อสอบแนวตำราเก่า); ปัจจุบัน bleeding time ไม่แนะนำแล้วเพราะไม่แม่นและขึ้นกับผู้ทำ ควรส่ง vWF panel (vWF:Ag, vWF activity, FVIII:C) ร่วมกับ PFA-100 หรือ platelet function test; ถ้าตัวเลือกไม่มี vWF assay จึงเลือก bleeding time"}], "q": [{"id": "PP29-HEM-081", "q": "A 12-year-old boy has recurrent spontaneous haemarthrosis of the knees. His maternal uncle had a similar problem. Platelet count and PT are normal, aPTT is prolonged and corrects on mixing. Which factor is deficient?", "a": "Factor VIII or factor IX (haemophilia A or B)", "y": [29], "t": 293}, {"id": "PP33-HEM-003", "q": "A pedigree is shown in which only males in several generations are affected; affected males are born to unaffected mothers, and there is no male-to-male transmission. What is the mode of inheritance?", "a": "X-linked recessive", "y": [33], "t": 293}, {"id": "PP32-HEM-039", "q": "An 8-year-old boy falls while playing and his right knee becomes painful, swollen and warm. CBC is normal; PT is normal and aPTT is 80 seconds. He has had prolonged bleeding after minor cuts before. What is the most appropriate initial management?", "a": "Replace factor VIII concentrate promptly (after drawing blood for factor assays)", "y": [32], "t": 293}, {"id": "PP31-HEM-015", "q": "An 18-year-old man with underlying hemophilia A is being prepared for dental extraction. Which is the most appropriate blood component for this patient?", "a": "Cryoprecipitate", "y": [31], "t": 293}, {"id": "HE-OLDP-022", "q": "A 21-year-old woman with severe menorrhagia is referred by her gynaecologist for evaluation of a possible systemic coagulopathy. A younger sister has been noted to bleed excessively after trauma. She takes no medication and physical examination is unremarkable. Initial laboratory results: platelet count 252,000/µL, PT 13.6 sec (control 13.0), PTT 23.6 sec (control 21.5). Further laboratory testing should include which of the following?", "a": "Determination of bleeding time", "y": [31], "t": 291}, {"id": "HE-OLDP-023", "q": "A patient bleeds excessively and for a prolonged time after a dental procedure. Coagulation testing shows an isolated prolonged aPTT with a normal PT. What is the most likely diagnosis?", "a": "Von Willebrand disease", "y": [33], "t": 291}, {"id": "HE-OLDP-028", "q": "A patient presents with spontaneous oozing from the gums and a long history of bleeding easily with bleeding that is difficult to stop. Factor VIII activity and factor IX activity are both normal. Which abnormality best explains this bleeding tendency?", "a": "Deficiency of von Willebrand factor", "y": [33], "t": 291}], "years": [29, 31, 32, 33], "th": [293, 291]}, {"id": "gap-hemonc-01", "set": "hemonc", "title": "Approach to bleeding: primary vs secondary hemostasis และการแปลผล PT/aPTT/TT", "subtitle": "ดูลักษณะเลือดออกก่อน แล้วใช้ PT, aPTT, TT ชี้ตำแหน่งที่ผิดปกติ รวม vitamin K deficiency และ scurvy", "md": "### กลไก: hemostasis มี 3 ขั้น\n- **Primary hemostasis** (ภายในนาที): หลอดเลือดฉีกขาด แล้ว von Willebrand factor (vWF) จับ subendothelial collagen ให้ platelet GPIb มายึดเกาะ (adhesion) จากนั้น platelet ถูก activate (ADP, TXA2) และใช้ GPIIb/IIIa จับ fibrinogen (aggregation) จนเป็น platelet plug\n- **Secondary hemostasis**: coagulation cascade สร้าง thrombin เปลี่ยน fibrinogen เป็น fibrin และ FXIIIa cross-link fibrin ให้ plug แข็งแรง\n- **Fibrinolysis**: plasmin สลาย fibrin เมื่อแผลหายแล้ว\n- ผนังหลอดเลือดและ connective tissue (collagen) ต้องแข็งแรงด้วย ถ้า collagen ผิดปกติ (scurvy, Ehlers–Danlos, steroid, senile purpura) จะเลือดออกได้ทั้งที่ platelet และ coagulation test ปกติ\n\n### แยก primary กับ secondary จากอาการ\n| ลักษณะ | Primary (platelet, vWF) | Secondary (coagulation factor) |\n|---|---|---|\n| ตำแหน่ง | ผิวหนังและเยื่อบุ: petechiae, purpura, epistaxis, เลือดออกตามไรฟัน, menorrhagia, GI bleeding, hematuria | เนื้อเยื่อลึก: **hemarthrosis**, muscle hematoma, retroperitoneal bleed |\n| เวลาที่ออกหลังบาดเจ็บ | ออก**ทันที** | ออก**ช้า** (ชั่วโมงถึงวัน) และออกซ้ำ |\n| Petechiae | พบบ่อย | ไม่พบ |\n| แผลเล็ก | เลือดไหลนาน | มักหยุดได้ก่อน แล้วซึมออกซ้ำ |\n| ตัวอย่างโรค | thrombocytopenia (ITP), vWD, antiplatelet, uremia, Glanzmann, Bernard–Soulier | hemophilia A/B, vitamin K deficiency, warfarin, liver disease |\n\n- ข้อสอบชอบถาม: \"เลือดออกตามไรฟันหลังแปรงฟัน\" = primary; \"เด็กชายเข่าบวมเองจาก hemarthrosis\" = secondary (นึกถึง hemophilia)\n\n### การตรวจคัดกรองและสิ่งที่แต่ละตัววัด\n- **Platelet count + blood smear**: ดูจำนวนและรูปร่าง platelet\n- **PT/INR**: extrinsic + common pathway คือ FVII และ FX, FV, FII (prothrombin), fibrinogen\n- **aPTT**: intrinsic + common pathway คือ FXII, FXI, FIX, FVIII และ FX, FV, FII, fibrinogen\n- **Thrombin time (TT)**: วัดเฉพาะขั้น fibrinogen เป็น fibrin (ยาวเมื่อ fibrinogen ต่ำหรือผิดปกติ, มี heparin, dabigatran, หรือ FDP สูง)\n- **Platelet function**: bleeding time (วิธีเก่า, ขึ้นกับผู้ทำ), PFA-100 closure time, platelet aggregation study\n- **Mixing study** (ผสม plasma ผู้ป่วยกับ normal plasma 1:1): ถ้า correct = factor deficiency; ถ้าไม่ correct = มี inhibitor (acquired hemophilia, lupus anticoagulant, heparin)\n\n### ตารางแปลผล\n| PT | aPTT | TT | นึกถึง |\n|---|---|---|---|\n| ยาว | ปกติ | ปกติ | FVII deficiency, warfarin หรือ vitamin K deficiency ระยะแรก, liver disease ระยะแรก (FVII half-life สั้นสุด ~6 ชม.) |\n| ปกติ | ยาว | ปกติ | ขาด FVIII, FIX, FXI (เลือดออก); ขาด FXII (aPTT ยาวแต่ไม่เลือดออก); vWD; lupus anticoagulant (thrombosis ไม่ใช่ bleeding) |\n| ยาว | ยาว | ปกติ | ขาด factor ใน common pathway (**FX, FV, FII**) หรือขาดหลาย factor: vitamin K deficiency, warfarin ขนาดสูง, liver disease |\n| ยาว | ยาว | ยาว | fibrinogen ต่ำหรือผิดปกติ (afibrinogenemia, dysfibrinogenemia), DIC, liver disease รุนแรง, heparin ขนาดสูง |\n| ปกติ | ปกติ | ปกติ (plt ปกติ) | platelet dysfunction, vWD ชนิดอ่อน, FXIII deficiency, ความผิดปกติของหลอดเลือด (scurvy, Ehlers–Danlos) |\n\n- ถ้าโจทย์ให้ PT และ aPTT ยาวทั้งคู่แล้วถามว่าขาด factor ตัวเดียวตัวไหน ให้เลือก factor ใน common pathway (X, V, II หรือ fibrinogen) เช่น **factor V**; FVII ทำให้ PT ยาวอย่างเดียว ส่วน FVIII/IX/XI/XII ทำให้ aPTT ยาวอย่างเดียว\n- PT + aPTT ยาวแต่ **TT ปกติ** แปลว่าการเปลี่ยน fibrinogen เป็น fibrin ปกติ ไม่มี heparin และ fibrinogen ไม่ต่ำ ความผิดปกติจึงอยู่ที่ factor ก่อน thrombin (common pathway หรือหลาย factor)\n- Liver disease กับ DIC แยกด้วย **FVIII**: FVIII สร้างจาก endothelium จึงปกติหรือสูงใน liver disease แต่ต่ำใน DIC\n\n### Vitamin K deficiency\n- กลไก: vitamin K เป็น cofactor ของ γ-glutamyl carboxylase ที่เติม carboxyl ให้ **FII, FVII, FIX, FX, protein C, protein S** เพื่อให้จับ Ca2+ และ phospholipid ได้; warfarin ยับยั้ง VKORC1 จึงลด factor ชุดเดียวกัน\n- สาเหตุ: กินไม่ได้หรือ NPO นานใน ICU ร่วมกับยาปฏิชีวนะที่ฆ่า gut flora; cephalosporin ที่มี **NMTT side chain** (cefoperazone, cefamandole, cefotetan, moxalactam) ยับยั้ง vitamin K epoxide reductase; ดูดซึมไขมันไม่ได้ (obstructive jaundice, cholestasis, pancreatic insufficiency); ทารกแรกเกิด; ยาเบื่อหนู superwarfarin\n- Lab: PT ยาวก่อน (FVII หมดเร็ว) ตามด้วย aPTT; platelet, fibrinogen, TT ปกติ\n- รักษา: **vitamin K1 (phytonadione) 10 mg IV ช้าๆ** (ระวัง anaphylactoid reaction) หรือ PO; PT ดีขึ้นภายใน 12–24 ชม. ซึ่งยืนยันการวินิจฉัยได้ด้วย (liver disease แก้ด้วย vitamin K ไม่ได้); ถ้าเลือดออกรุนแรงให้ FFP 10–15 mL/kg หรือ 4-factor PCC ร่วมกับ vitamin K\n- ตัวอย่าง: ผู้ป่วยได้ cefoperazone-sulbactam 10 วัน มีเลือดออกตามไรฟัน PT และ aPTT ยาว platelet ปกติ แก้ได้ด้วย vitamin K = ขาด factor II, VII, IX, X\n\n### Scurvy (vitamin C deficiency): bleeding จากหลอดเลือด\n- กลไก: vitamin C เป็น cofactor ของ **prolyl hydroxylase และ lysyl hydroxylase** (คง Fe2+ ใน enzyme) ที่ hydroxylate proline และ lysine ใน procollagen เพื่อให้เกิด triple helix ที่เสถียรและ cross-link ได้ ขาดแล้ว collagen อ่อนแอ หลอดเลือดฝอยเปราะ แผลหายช้า (ความผิดปกติอยู่ที่ **collagen synthesis** ไม่ใช่ platelet หรือ coagulation)\n- กลุ่มเสี่ยง: ผู้สูงอายุอยู่คนเดียว, ไม่กินผักผลไม้, ติดสุรา, โรคจิตเวชหรือ eating disorder, ฟอกไต, malabsorption; ร่างกายมีสำรองพอใช้ราว 1–3 เดือน\n- อาการ: **perifollicular hemorrhage**, **corkscrew hair**, follicular hyperkeratosis, เหงือกบวมเลือดออก (ในคนที่ยังมีฟัน), ecchymosis ที่ขา, แผลหายช้า, hemarthrosis หรือ subperiosteal hemorrhage, ซีด อ่อนเพลีย\n- วินิจฉัย: จากประวัติและอาการเป็นหลัก ระดับ plasma ascorbate ต่ำช่วยยืนยัน; platelet, PT, aPTT ปกติ\n- รักษา: vitamin C 300–1,000 mg/วัน PO ราว 1 เดือนหรือจนอาการหาย ร่วมกับแก้ภาวะโภชนาการ; เลือดออกและอ่อนเพลียดีขึ้นในไม่กี่วัน", "pearls": ["เลือดออกตามไรฟัน, epistaxis, petechiae, menorrhagia ทันทีหลังบาดเจ็บ = primary hemostasis (platelet/vWF); hemarthrosis, muscle hematoma = secondary (coagulation factor)", "PT ยาวอย่างเดียว = FVII; aPTT ยาวอย่างเดียว = VIII, IX, XI, XII หรือ vWD; ทั้งคู่ยาว = common pathway (X, V, II, fibrinogen) หรือหลาย factor", "PT + aPTT ยาวแต่ TT ปกติ = fibrinogen และการเปลี่ยนเป็น fibrin ปกติ ปัญหาอยู่ที่ factor ก่อนหน้า", "Vitamin K-dependent factors = II, VII, IX, X, protein C, S; cefoperazone (NMTT side chain) ทำให้ขาดได้ แก้ด้วย vitamin K1 10 mg IV", "Scurvy: perifollicular hemorrhage + corkscrew hair + เหงือกเลือดออก กลไกคือ hydroxylation ของ proline/lysine ใน collagen บกพร่อง"], "traps": [], "q": [{"id": "HE-OLDP-034", "q": "Which bleeding manifestation indicates a disorder of primary haemostasis?", "a": "Bleeding per gum (mucosal bleeding)", "y": [31], "t": 290}, {"id": "PP29-HEM-080", "q": "Which bleeding manifestation is characteristic of a defect of primary haemostasis (platelet or von Willebrand factor disorder)?", "a": "Immediate mucocutaneous bleeding such as gum bleeding after tooth brushing, epistaxis, petechiae, menorrhagia or haematuria", "y": [29, 30], "t": 290}, {"id": "PP35-HEM-053", "q": "A 15-year-old boy presents with spontaneous painful swelling of the knee due to haemarthrosis. Which part of haemostasis is most likely defective?", "a": "Secondary haemostasis (a coagulation factor deficiency such as haemophilia)", "y": [35], "t": 290}, {"id": "HE-OLDP-025", "q": "A patient has both a prolonged PT and a prolonged aPTT. Which coagulation factor is deficient?", "a": "Factor V", "y": [31], "t": 292}, {"id": "PP35-HEM-064", "q": "A patient has a prolonged PT and a prolonged aPTT. A thrombin time (TT) is performed and is normal. What does this indicate?", "a": "A deficiency of coagulation factors (e.g. in the common pathway or multiple factors) with normal conversion of fibrinogen to fibrin", "y": [35], "t": 292}, {"id": "PP32-HEM-052", "q": "A patient treated for 10 days with cefoperazone-sulbactam develops gum bleeding. Both PT and aPTT are prolonged; platelets are normal. The prolongation corrects with vitamin K. Deficiency of which clotting factors explains this?", "a": "Factors II, VII, IX and X (vitamin K-dependent factors)", "y": [32], "t": 292}, {"id": "PP33-HEM-009", "q": "A 60-year-old man who lives alone and eats almost no fruit or vegetables has bleeding gums, perifollicular hemorrhages and corkscrew hairs on his legs. Which process is primarily impaired?", "a": "Collagen synthesis (hydroxylation of proline and lysine)", "y": [33], "t": 295}], "years": [29, 30, 31, 32, 33, 35], "th": [290, 292, 295]}, {"id": "gap-hemonc-03", "set": "hemonc", "title": "Myeloproliferative neoplasms: Polycythemia vera และ Essential thrombocythemia", "subtitle": "Hct สูงหรือ platelet สูงต่อเนื่อง ต้องแยก reactive ก่อน แล้วยืนยันด้วย JAK2/CALR/MPL", "md": "### กลไก\n- MPN คือ clonal disorder ของ hematopoietic stem cell ที่มี driver mutation ทำให้ **JAK–STAT signaling ทำงานเองโดยไม่ต้องมี cytokine** จึงสร้างเซลล์ที่โตเต็มที่มากเกิน\n- กลุ่ม BCR::ABL1-negative ได้แก่ PV, ET, primary myelofibrosis (PMF); ถ้ามี BCR::ABL1 คือ CML (ต้องตรวจแยกเสมอเมื่อ platelet หรือ WBC สูง)\n\n| โรค | JAK2 V617F | อื่นๆ |\n|---|---|---|\n| PV | ~95% | JAK2 exon 12 ~3% |\n| ET | ~55–60% | CALR ~20–25%, MPL ~3–5%, triple-negative ~10–15% |\n| PMF | ~55–60% | CALR, MPL คล้าย ET |\n\n### Polycythemia vera (PV): อาการ\n- Hyperviscosity: ปวดศีรษะ มึนงง ตามัว หูอื้อ; หน้าแดง (plethora, ruddy complexion)\n- **Aquagenic pruritus**: คันหลังอาบน้ำอุ่น (จาก mast cell/basophil หลั่ง histamine) เป็นอาการที่ชี้ PV มาก\n- Erythromelalgia, thrombosis ทั้ง arterial และ venous รวมถึงตำแหน่งแปลก (Budd–Chiari, portal vein thrombosis), splenomegaly, gout\n- CBC มักมี WBC และ platelet สูงร่วมด้วย\n\n### แนวทาง erythrocytosis\n- นิยาม (WHO 2022): **Hb >16.5 g/dL (ชาย), >16.0 (หญิง) หรือ Hct >49% (ชาย), >48% (หญิง)**\n- ตัด relative erythrocytosis (ขาดน้ำ, diuretics) ก่อน\n- ตรวจ SpO2, ประวัติสูบบุหรี่, **serum EPO**, JAK2 V617F\n\n| | PV (primary) | Secondary erythrocytosis |\n|---|---|---|\n| EPO | **ต่ำ** | ปกติหรือสูง |\n| JAK2 | บวก | ลบ |\n| Splenomegaly, WBC/plt สูง, aquagenic pruritus | พบได้ | ไม่พบ |\n| สาเหตุ | clonal | hypoxia (COPD, OSA, ที่สูง, cyanotic heart disease), สูบบุหรี่ (COHb), EPO-secreting tumor (RCC, HCC, cerebellar hemangioblastoma, uterine leiomyoma), หลังปลูกถ่ายไต, testosterone, SGLT2 inhibitor |\n\n- เกณฑ์ WHO 2022 major: (1) Hb/Hct ตามข้างบน (2) bone marrow hypercellular panmyelosis (3) **JAK2 V617F หรือ exon 12**; minor: **serum EPO ต่ำ**; วินิจฉัยเมื่อครบ major 3 ข้อ หรือ major 2 ข้อแรก + minor\n- โจทย์: ชายอายุ 60 Hct 58% splenomegaly SpO2 ปกติ EPO ต่ำ คันหลังอาบน้ำ การตรวจยืนยันคือ **JAK2 V617F mutation**\n\n### รักษา PV\n- ทุกราย: **phlebotomy ให้ Hct <45%** (CYTO-PV trial), **aspirin ขนาดต่ำ 81–100 mg/วัน**, คุมปัจจัยเสี่ยงหลอดเลือด เลิกบุหรี่\n- แบ่งความเสี่ยง: **high risk = อายุ ≥60 ปี หรือเคยมี thrombosis** ให้ cytoreduction ด้วย **hydroxyurea** หรือ ropeginterferon alfa-2b (เหมาะกับคนอายุน้อยและหญิงตั้งครรภ์); ดื้อหรือทนไม่ได้ต่อ hydroxyurea ใช้ ruxolitinib\n- คัน: เลี่ยงน้ำร้อน, antihistamine, SSRI, ruxolitinib\n- ภาวะแทรกซ้อนระยะยาว: post-PV myelofibrosis, AML transformation\n\n### Essential thrombocythemia (ET): อาการ\n- มักพบโดยบังเอิญจาก platelet สูงมาก\n- Vasomotor: ปวดศีรษะ ตามัวชั่วคราว **erythromelalgia** (ปลายมือเท้าแดง ร้อน ปวดแสบ ตอบสนองต่อ aspirin อย่างดี)\n- Thrombosis; และ **bleeding เมื่อ plt >1,000,000/µL** เพราะ vWF multimer ขนาดใหญ่ถูก platelet ดูดซับไป (acquired von Willebrand syndrome); ม้ามโตเล็กน้อย; แท้งซ้ำ\n\n### แนวทาง thrombocytosis (plt ≥450,000/µL)\n- **Reactive (พบบ่อยที่สุด ~80–90%)**: iron deficiency, ติดเชื้อหรืออักเสบ (CRP สูง), มะเร็ง, หลังตัดม้าม, เสียเลือด, หลังผ่าตัดหรือบาดเจ็บ\n- **Clonal**: ET, PV, PMF, **CML** (ต้องตรวจ BCR::ABL1), MDS del(5q)\n- นึกถึง ET เมื่อ plt สูง**ต่อเนื่อง**ในการตรวจซ้ำ (หลายเดือน), Hb และ WBC ปกติ, ferritin และ CRP ปกติ, ไม่มีติดเชื้อ อักเสบ หรือตัดม้าม; การพบ JAK2 V617F ยืนยันว่าเป็น clonal process\n- เกณฑ์ WHO 2022 major: (1) plt ≥450,000 (2) bone marrow มี megakaryocyte ขนาดใหญ่ nucleus หลายแฉก (staghorn) เพิ่มขึ้น (3) ไม่เข้าเกณฑ์ CML, PV, PMF, MDS (4) มี JAK2, CALR หรือ MPL; minor: clonal marker อื่น หรือไม่มีสาเหตุ reactive; วินิจฉัยเมื่อครบ major 4 ข้อ หรือ major 3 ข้อ + minor\n- ET ต่างจาก PV ตรงที่ Hb/Hct ปกติ; ถ้า Hb สูงร่วมด้วยต้องคิดถึง PV ที่ masked ด้วย iron deficiency\n\n### รักษา ET (revised IPSET-thrombosis)\n| กลุ่ม | ลักษณะ | การรักษา |\n|---|---|---|\n| Very low | อายุ ≤60, ไม่เคย thrombosis, JAK2 ลบ | สังเกตอาการ (aspirin ถ้ามี vasomotor symptoms) |\n| Low | อายุ ≤60, ไม่เคย thrombosis, JAK2 บวก | aspirin 81–100 mg/วัน |\n| Intermediate | อายุ >60, ไม่เคย thrombosis, JAK2 ลบ | aspirin, พิจารณา cytoreduction รายบุคคล |\n| High | เคย thrombosis หรืออายุ >60 ร่วมกับ JAK2 บวก | **hydroxyurea** + aspirin |\n\n- Plt >1,000,000/µL: ตรวจ vWF activity (ristocetin cofactor) ก่อนให้ aspirin; ถ้า <30% เลี่ยง aspirin\n- ยาทางเลือก: anagrelide (second-line), interferon alfa ในคนอายุน้อยหรือตั้งครรภ์", "pearls": ["Aquagenic pruritus + plethora + Hct สูง + SpO2 ปกติ + EPO ต่ำ = PV; ยืนยันด้วย JAK2 V617F (บวก ~95%)", "PV: phlebotomy ให้ Hct <45% + aspirin ขนาดต่ำทุกราย; อายุ ≥60 หรือเคย thrombosis ให้ hydroxyurea เพิ่ม", "Plt >1,000,000 ต่อเนื่องหลายเดือน Hb/WBC ปกติ ไม่มี iron deficiency, infection, inflammation, splenectomy = ET (JAK2 ~55–60%, CALR, MPL)", "Erythromelalgia ใน ET/PV ตอบสนองต่อ aspirin ขนาดต่ำอย่างดี", "Plt >1,000,000 ใน ET ทำให้เกิด acquired vWD เลือดออกง่าย ต้องตรวจ vWF activity ก่อนให้ aspirin"], "traps": [], "q": [{"id": "PP31-HEM-030", "q": "A 58-year-old woman is found to have a platelet count of 1,400,000/µL on a routine check-up. Haemoglobin and white cell count are normal, iron studies are normal and there is no infection, inflammation or history of splenectomy. Which diagnosis is most likely?", "a": "Essential thrombocythaemia", "y": [31], "t": 303}, {"id": "PP32-HEM-026", "q": "A 58-year-old woman has a platelet count of 1,450,000/mm3 on two occasions 3 months apart, with normal haemoglobin, white cell count and iron studies, and no infection, inflammation or splenectomy. She had one episode of erythromelalgia. What is the most likely diagnosis?", "a": "Essential thrombocythemia", "y": [32], "t": 303}, {"id": "PP35-HEM-063", "q": "A 55-year-old man has a persistent platelet count of 1,100,000/µL on repeated tests with normal haemoglobin and white cell count. Ferritin, CRP and spleen size are normal and there is no recent infection, bleeding or surgery. A JAK2 V617F mutation is detected. What is the most likely diagnosis?", "a": "Essential thrombocythaemia", "y": [35], "t": 303}, {"id": "PP31-HEM-056", "q": "A 58-year-old man has headache and aquagenic pruritus. Haematocrit is 56% and platelets 450,000/µL; he does not smoke, lives at sea level and has normal oxygen saturation. Which diagnosis is most likely?", "a": "Polycythaemia vera", "y": [31], "t": 304}, {"id": "PP32-HEM-031", "q": "A 60-year-old man has headache, aquagenic pruritus and a ruddy complexion. Haemoglobin is 19.5 g/dL and hematocrit 58%, with mild splenomegaly. Oxygen saturation is normal and serum erythropoietin is low. Which test best confirms the diagnosis?", "a": "JAK2 V617F mutation analysis", "y": [32], "t": 304}], "years": [31, 32, 35], "th": [303, 304]}, {"id": "gap-hemonc-04", "set": "hemonc", "title": "Blood component therapy: PRC, platelet, FFP, cryoprecipitate และ special products", "subtitle": "เลือกส่วนประกอบเลือดให้ตรงข้อบ่งชี้ รู้ threshold, ขนาด และเรื่อง ABO compatibility", "md": "### หลักการ\n- ให้เฉพาะส่วนประกอบที่ขาด (component therapy) แทน whole blood; ทุกครั้งต้องชั่งประโยชน์กับความเสี่ยง (transfusion reaction, ติดเชื้อ, volume overload, alloimmunization)\n- Threshold ตัวเลขเป็นเพียงแนวทาง ต้องดูอาการ เลือดออกจริง และสาเหตุของภาวะที่ขาดด้วย\n\n### ส่วนประกอบหลัก\n| Component | สิ่งที่มี / เก็บ | ข้อบ่งชี้หลัก | ขนาดและผลที่คาด |\n|---|---|---|---|\n| PRC (ในไทยใช้ LPRC) | RBC ~250–300 mL, เก็บ 1–6 °C ได้ 35–42 วัน | ซีดมีอาการ, เสียเลือด | 1 unit เพิ่ม Hb ~1 g/dL (Hct ~3%) |\n| Platelet concentrate (random donor) หรือ SDP (apheresis) | เก็บ 20–24 °C เขย่าตลอด ได้ 5 วัน (เสี่ยง bacterial contamination มากสุด) | thrombocytopenia มีเลือดออก, prophylaxis, ก่อนหัตถการ | 1 unit/10 kg; 1 unit เพิ่ม ~5,000–10,000/µL; SDP 1 ถุงเท่ากับ ~4–6 units |\n| FFP | ทุก coagulation factor, แช่แข็ง ≤ -18 °C ได้ ~1 ปี | ขาดหลาย factor และมีเลือดออกหรือต้องทำหัตถการ (liver disease, DIC, massive transfusion), TTP (plasma exchange), warfarin reversal เมื่อไม่มี PCC | 10–15 mL/kg; ไม่ใช้เพื่อเพิ่ม volume |\n| Cryoprecipitate | ตะกอนจาก FFP ที่ละลายที่ 1–6 °C ปริมาตร ~10–20 mL/unit มี **fibrinogen, FVIII, vWF, FXIII**, fibronectin | fibrinogen <100–150 mg/dL ร่วมกับเลือดออก (DIC, massive transfusion, PPH), hemophilia A และ vWD เมื่อไม่มี concentrate, FXIII deficiency | 1 unit/10 kg |\n\n### ABO compatibility\n- **PRC ต้อง ABO compatible และ crossmatch เสมอ**: O เป็น universal donor ของ RBC, AB เป็น universal recipient\n- **FFP ต้อง ABO compatible ในทิศ plasma**: AB เป็น universal plasma donor, O รับ plasma ได้ทุกกรุ๊ป\n- **Platelet**: ควร ABO compatible แต่ไม่บังคับ; หญิงวัยเจริญพันธุ์ RhD ลบที่ได้ platelet RhD บวกควรได้ anti-D\n- **Cryoprecipitate ไม่จำเป็นต้อง ABO compatible ในผู้ใหญ่** เพราะปริมาตร plasma น้อยมาก (ในทารกและเด็กเล็กควรใช้ compatible)\n- ไม่ต้อง crossmatch สำหรับ FFP, platelet, cryo แต่ต้องรู้ ABO ของผู้ป่วย\n\n### Threshold ที่ใช้บ่อย\n- **PRC**: ผู้ป่วยในที่ hemodynamic คงที่ให้เมื่อ **Hb <7 g/dL**; มีโรคหัวใจและหลอดเลือดเดิม, ผ่าตัดหัวใจหรือกระดูก ใช้ราว 7.5–8 g/dL; acute MI ข้อมูลใหม่ (MINT 2023) โน้มไปทางเป้าหมายสูงขึ้น (~10 g/dL); thalassemia ที่ต้องรับเลือดประจำให้ pre-transfusion Hb ราว 9–10.5 g/dL\n- **Platelet**:\n- prophylaxis ใน hypoproliferative thrombocytopenia ที่คงที่ (หลังเคมีบำบัด, aplastic anemia): plt <10,000/µL\n- มีไข้ sepsis หรือ coagulopathy ร่วม: <20,000/µL\n- **มีเลือดออก active: ให้ทันทีเพื่อให้ plt >50,000/µL** (>100,000 ถ้าเลือดออกในสมองหรือ multiple trauma)\n- ผ่าตัดใหญ่หรือหัตถการเสี่ยง: ≥50,000/µL; neurosurgery หรือผ่าตัดตาส่วนหลัง: ≥100,000/µL; หัตถการเสี่ยงต่ำ (เช่น ใส่ CVC โดยใช้ ultrasound) ยอมรับต่ำกว่านี้ได้\n- ตัวอย่าง: epistaxis ที่ยังไหลอยู่ plt 5,000/µL ให้ **platelet transfusion** ทันทีร่วมกับห้ามเลือดเฉพาะที่ แล้วหาสาเหตุ\n- ข้อควรระวัง: **ITP** platelet ถูกทำลายเร็ว ให้เมื่อเลือดออกรุนแรงคุกคามชีวิตร่วมกับ IVIG และ steroid; **TTP และ HIT** เลี่ยง platelet transfusion (เพิ่ม thrombosis) ยกเว้นเลือดออกคุกคามชีวิต; DIC ให้เฉพาะเมื่อมีเลือดออกหรือต้องทำหัตถการ\n- **Cryo**: fibrinogen <150 mg/dL ในเลือดออกรุนแรง/massive transfusion/PPH, หรือ <100 mg/dL ในภาวะทั่วไป\n\n### Special products\n| ชนิด | วิธี | ป้องกันอะไร / ข้อบ่งชี้ |\n|---|---|---|\n| Leukoreduced (leukodepleted, LDPRC, ใช้ filter) | เหลือ WBC <5 × 10^6/unit | **febrile non-hemolytic transfusion reaction (FNHTR)**, HLA alloimmunization และ platelet refractoriness, CMV transmission; ใช้ใน thalassemia ที่รับเลือดประจำ, hematologic malignancy, ผู้รอปลูกถ่ายไขกระดูก, เคยมี FNHTR ซ้ำ |\n| LPRC (leukocyte-poor, เอา buffy coat ออก) | ลด WBC ได้บางส่วน | ลด FNHTR, ใช้ทั่วไปในไทย |\n| Irradiated (gamma ~25 Gy) | ทำลาย T lymphocyte | **TA-GVHD**: HSCT, Hodgkin lymphoma, ได้ purine analog (fludarabine), congenital T-cell immunodeficiency, intrauterine transfusion, เลือดจากญาติสายตรง, HLA-matched platelet; leukoreduction **ป้องกัน TA-GVHD ไม่ได้** |\n| Washed | ล้าง plasma protein ออก | IgA deficiency ที่มี anti-IgA (anaphylaxis), severe allergic reaction ซ้ำ |\n\n### Transfusion reaction ที่ต้องรู้\n- **Acute hemolytic (ABO incompatibility)**: ไข้ หนาวสั่น ปวดหลัง/สีข้าง hemoglobinuria ความดันต่ำ DIC; หยุดให้ทันที ให้ NSS ตรวจ DAT และตรวจสอบถุงเลือดกับตัวผู้ป่วย\n- **FNHTR** (พบบ่อยที่สุด): ไข้เพิ่ม ≥1 °C โดยไม่มี hemolysis; ป้องกันด้วย leukoreduced\n- **Allergic (urticaria)**: antihistamine แล้วให้ต่อได้; anaphylaxis นึกถึง IgA deficiency\n- **TRALI**: หายใจลำบาก hypoxemia ภายใน 6 ชม. ปอดบวมน้ำแบบ non-cardiogenic, ความดันปกติหรือต่ำ, มักจาก plasma ของผู้บริจาคหญิงที่ตั้งครรภ์หลายครั้ง (anti-HLA/anti-HNA)\n- **TACO**: volume overload ความดันสูง JVP สูง BNP สูง ตอบสนองต่อ diuretic; ป้องกันด้วยให้ช้าในผู้สูงอายุหรือโรคหัวใจ", "pearls": ["Cryoprecipitate มี fibrinogen, FVIII, vWF, FXIII และไม่ต้อง ABO compatible ในผู้ใหญ่ (ปริมาตร plasma น้อย)", "PRC ต้อง ABO compatible + crossmatch; FFP ต้อง plasma compatible (AB = universal plasma donor)", "Platelet 5,000/µL ร่วมกับเลือดออก active ให้ platelet transfusion ทันที (ยกเว้นระวังใน ITP, TTP, HIT)", "Leukoreduced ป้องกัน FNHTR, HLA alloimmunization, CMV; irradiated ป้องกัน TA-GVHD", "PRC 1 unit เพิ่ม Hb ~1 g/dL; platelet 1 unit เพิ่ม ~5,000–10,000/µL; FFP 10–15 mL/kg; cryo 1 unit/10 kg"], "traps": [], "q": [{"id": "HE-OLDP-026", "q": "A patient presents with active epistaxis and a platelet count of 5,000/µL. What is the most appropriate immediate management?", "a": "Platelet transfusion", "y": [34], "t": 298}, {"id": "PP31-HEM-069", "q": "Which of the following statements about blood component transfusion is TRUE?", "a": "Cryoprecipitate does not need to be ABO compatible", "y": [31], "t": 298}], "years": [31, 34], "th": [298]}, {"id": "gap-hemonc-05", "set": "hemonc", "title": "งูพิษกัด (snakebite): hematotoxic vs neurotoxic และการตรวจที่จำเป็น", "subtitle": "รู้ชนิดงูไทยตามกลุ่มพิษ เลือก investigation ให้ตรง และรู้ข้อบ่งชี้ antivenom", "md": "### งูพิษในไทยแบ่งตามกลุ่มพิษ\n| กลุ่มพิษ | งู | อาการเด่น |\n|---|---|---|\n| Hematotoxic (Viperidae) | **งูกะปะ** (Malayan pit viper), **งูเขียวหางไหม้** (green pit viper, พบถูกกัดบ่อยที่สุดโดยเฉพาะภาคกลางและกรุงเทพฯ), **งูแมวเซา** (Russell's viper) | บวมเฉพาะที่, เลือดออกจากรอยเขี้ยว, เลือดไม่แข็งตัว, Russell's viper มี AKI และ hemolysis |\n| Neurotoxic (Elapidae) | งูเห่า, งูจงอาง, งูสามเหลี่ยม, งูทับสมิงคลา | หนังตาตก (ptosis), กลืนลำบาก, พูดไม่ชัด, กล้ามเนื้อหายใจอ่อนแรง (งูเห่ามี local necrosis ด้วย) |\n| Myotoxic | งูทะเล | ปวดกล้ามเนื้อ, rhabdomyolysis, myoglobinuria, AKI, hyperkalemia |\n\n### กลไกของพิษ hematotoxic\n- งูกะปะและงูเขียวหางไหม้: มี **thrombin-like enzyme** ที่ตัด fibrinogen เป็น fibrin ที่ไม่เสถียร fibrinogen ถูกใช้หมดจนเลือดไม่แข็งตัว (venom-induced consumption coagulopathy); งูเขียวหางไหม้ทำให้ platelet ต่ำได้\n- งูแมวเซา: มี **FX และ FV activator** ทำให้เกิดภาวะคล้าย DIC ร่วมกับพิษต่อไตโดยตรง hemolysis และ capillary leak จึงเกิด **AKI** ได้บ่อย\n- Metalloproteinase (hemorrhagin) ทำลายผนังหลอดเลือด ทำให้บวม พอง จ้ำเลือด และ necrosis เฉพาะที่\n\n### อาการ\n- เฉพาะที่: ปวด บวมลุกลาม bleb, ecchymosis, **เลือดซึมจากรอยเขี้ยวไม่หยุด**\n- Systemic bleeding: เหงือก, hematuria, GI bleeding, intracranial hemorrhage\n- งูแมวเซา: ปัสสาวะออกน้อย ปัสสาวะสีเข้ม ความดันต่ำ\n- ถ้า**ไม่มี ptosis หรือกล้ามเนื้ออ่อนแรง** แปลว่าไม่มีลักษณะ neurotoxic\n\n### Investigation ที่จำเป็นในงูกัดกลุ่ม hematotoxic\n- **20-minute whole blood clotting test (20WBCT)** หรือ **venous clotting time (VCT)**: ทำข้างเตียง ตั้งแต่แรกรับ แล้วทำซ้ำทุก 6 ชม. อย่างน้อย 24 ชม. (นานกว่านั้นถ้างูแมวเซาหรือผลผิดปกติ)\n- **CBC + platelet count**\n- **PT/INR** (และ aPTT, fibrinogen ถ้าทำได้)\n- งูแมวเซาหรือสงสัย: **BUN, creatinine, electrolytes, UA** (hematuria, hemoglobinuria), urine output, blood smear ดู fragmented RBC, CK\n- จองเลือดเมื่อมีเลือดออก\n- **ไม่จำเป็น** สำหรับ hematotoxic ล้วน: การตรวจกำลังกล้ามเนื้อหายใจ เช่น **peak expiratory flow**, negative inspiratory force, vital capacity ซึ่งใช้ติดตามงูกัดกลุ่ม neurotoxic\n\n### การดูแลเบื้องต้น\n- ระบุชนิดงูจากซากหรือภาพถ่าย (ไม่ต้องไล่จับ) และจากอาการ\n- ให้อวัยวะที่ถูกกัดอยู่นิ่งด้วยไม้ดาม ถอดแหวนหรือกำไล; **ห้ามขันชะเนาะ ห้ามกรีด ห้ามดูด ห้ามประคบน้ำแข็ง**\n- ป้องกันบาดทะยัก; ไม่ต้องให้ antibiotic เป็น routine (ให้เมื่อมีแผลติดเชื้อ); ให้ paracetamol แก้ปวด เลี่ยง NSAIDs และยาฉีดเข้ากล้าม\n- สังเกตอาการในโรงพยาบาลอย่างน้อย 24 ชม.\n\n### Antivenom (สภากาชาดไทย)\n- มี monovalent antivenom แยกตามชนิดงู และ polyvalent สำหรับกลุ่ม hematotoxic และ neurotoxic เมื่อไม่ทราบชนิดงู\n- ข้อบ่งชี้ใน hematotoxic: **systemic bleeding**, **20WBCT ไม่แข็งตัว หรือ VCT >20 นาที**, INR ยาว (>1.2), platelet <50,000/µL; งูแมวเซาที่มี AKI หรือ hemolysis\n- ขนาดเริ่มต้นตามชนิดงู (กลุ่ม pit viper โดยทั่วไป 3 vials, งูแมวเซาใช้มากกว่า) ให้ IV ช้าๆ ไม่ต้องทำ skin test แต่เตรียม adrenaline ไว้รักษา anaphylaxis\n- ตรวจ 20WBCT/VCT ซ้ำ 6 ชม. หลังให้ ถ้ายังไม่แข็งตัวให้ซ้ำ\n- FFP, cryo, platelet ไม่ใช่สิ่งทดแทน antivenom; ใช้เมื่อยังมีเลือดออกรุนแรงหลังได้ antivenom แล้ว\n- งูแมวเซาที่มี AKI อาจต้อง dialysis", "pearls": ["งูกะปะ, งูเขียวหางไหม้, งูแมวเซา = hematotoxic; งูเห่า, จงอาง, สามเหลี่ยม, ทับสมิงคลา = neurotoxic; งูทะเล = myotoxic", "Hematotoxic ต้องทำ 20WBCT/VCT, CBC + platelet, PT/INR ซ้ำทุก 6 ชม. อย่างน้อย 24 ชม.; งูแมวเซาเพิ่ม BUN/Cr, UA", "Peak expiratory flow/NIF ใช้ติดตาม neurotoxic ไม่จำเป็นในผู้ป่วยที่มีแต่อาการเลือดออกและไม่มี ptosis", "Antivenom เมื่อมี systemic bleeding หรือ 20WBCT ไม่แข็งตัว; ห้ามขันชะเนาะ กรีด ดูดแผล"], "traps": [], "q": [{"id": "PPNA-HEM-138", "q": "A farmer was bitten on the hand by an unidentified snake. The next morning he has local swelling and persistent bleeding from the fang marks, with no ptosis or weakness. Which investigation is unnecessary?", "a": "Peak expiratory flow measurement", "y": [], "t": 296}], "years": [], "th": [296]}, {"id": "gap-hemonc-06", "set": "hemonc", "title": "Biostatistics: การแปลผล 95% confidence interval", "subtitle": "CI คร่อมค่า null แปลว่าไม่มีนัยสำคัญ: 0 สำหรับผลต่าง และ 1 สำหรับอัตราส่วน", "md": "### Confidence interval คืออะไร\n- ค่า point estimate (เช่น mean difference, RR, OR, HR) ที่ได้จากตัวอย่างหนึ่งชุดมีความคลาดเคลื่อนจากการสุ่ม; **95% CI** คือช่วงที่คำนวณจากข้อมูลที่ถ้าทำการศึกษาแบบเดียวกันซ้ำหลายครั้ง ช่วงที่คำนวณได้ 95% จะครอบคลุมค่าจริงของประชากร\n- ช่วงกว้างแปลว่าความแม่นยำต่ำ (ตัวอย่างน้อยหรือข้อมูลกระจายมาก); เพิ่ม sample size ช่วงจะแคบลง\n- สำหรับผลต่าง (difference) ค่า point estimate อยู่กึ่งกลางของ CI; สำหรับอัตราส่วน (ratio) จะอยู่กึ่งกลางบน log scale จึงดูไม่สมมาตรบนสเกลปกติ\n\n### ค่า null (no-effect value)\n| ชนิดของค่าที่รายงาน | ค่า null | แปลว่า |\n|---|---|---|\n| Difference (mean difference, risk difference) | **0** | สองกลุ่มไม่ต่างกัน |\n| Ratio (RR, OR, HR) | **1** | ความเสี่ยงเท่ากัน |\n\n### กฎการแปลผล\n- **95% CI ไม่คร่อมค่า null** แปลว่ามีนัยสำคัญทางสถิติที่ระดับ 0.05 (p <0.05)\n- **95% CI คร่อมค่า null** แปลว่าไม่มีนัยสำคัญ (p ≥0.05) สรุปว่ายา**ไม่ได้แสดงประโยชน์** แต่ก็ไม่ได้พิสูจน์ว่าไม่มีผล (absence of evidence ไม่ใช่ evidence of absence)\n- p-value และ 95% CI ต้องสอดคล้องกันเสมอเมื่อมาจากการทดสอบเดียวกัน; ถ้า p = 0.04 แต่ 95% CI คร่อม 0 แปลว่าตัวเลขขัดกันเอง ให้ยึด CI ซึ่งให้ข้อมูลมากกว่า (ทั้งทิศทาง ขนาด และความแม่นยำ)\n- Statistical significance ไม่เท่ากับ clinical significance: CI ที่ไม่คร่อม null แต่ทั้งช่วงมีขนาดผลเล็กเกินกว่าที่มีความหมายทางคลินิก ก็ไม่ควรเปลี่ยนการรักษา; ดูขอบของ CI ฝั่งที่ใกล้ null ว่ายังมีความหมายทางคลินิกหรือไม่\n- เทียบ CI ของสองกลุ่มที่คำนวณแยกกัน: ถ้าไม่ซ้อนกันเลยแปลว่าต่างกันอย่างมีนัยสำคัญ แต่ถ้าซ้อนกันเล็กน้อยยังอาจมีนัยสำคัญได้ ต้องดู CI ของผลต่างโดยตรง\n\n### ตัวอย่าง\n| ผลการศึกษา | แปลผล |\n|---|---|\n| Mean difference -2 วัน (95% CI -4 ถึง +1) | คร่อม 0 จึง**ไม่มีนัยสำคัญ** สรุปประโยชน์ไม่ได้ |\n| Mean difference -2 วัน (95% CI -3.5 ถึง -0.5) | ไม่คร่อม 0 ยาลดเวลาฟื้นตัวอย่างมีนัยสำคัญ |\n| RR 0.80 (95% CI 0.70–0.92) | ไม่คร่อม 1 ลดความเสี่ยง ~20% อย่างมีนัยสำคัญ |\n| OR 1.5 (95% CI 0.9–2.5) | คร่อม 1 ไม่มีนัยสำคัญ |\n| HR 1.8 (95% CI 1.2–2.7) | ไม่คร่อม 1 เพิ่มความเสี่ยงอย่างมีนัยสำคัญ |\n\n### โจทย์ที่ออกสอบ\n- ยา X ฟื้นตัวเฉลี่ย 8 วัน กลุ่มควบคุม 10 วัน mean difference -2 วัน p = 0.04 แต่ 95% CI -4 ถึง +1: คำตอบคือ **สรุปว่ายาได้ประโยชน์ไม่ได้ เพราะ 95% CI คร่อมศูนย์** และ p-value ที่รายงานขัดกับ CI (สังเกตด้วยว่ากึ่งกลางของช่วง -4 ถึง +1 คือ -1.5 ไม่ใช่ -2 ตัวเลขชุดนี้จึงไม่สอดคล้องกันเอง)\n- หลักจำ: เห็น CI ให้ถามตัวเองก่อนว่าเป็น difference (null = 0) หรือ ratio (null = 1) แล้วดูว่าช่วงคร่อมค่านั้นหรือไม่\n\n### ศัพท์ที่เกี่ยวข้อง\n- **Type I error (α)**: สรุปว่ามีผลทั้งที่ไม่มีจริง; ระดับ 0.05 สอดคล้องกับ 95% CI\n- **Type II error (β)**: สรุปว่าไม่มีผลทั้งที่มีจริง มักเกิดเมื่อ sample size น้อย; power = 1 - β (นิยม ≥80%)\n- CI กว้างและคร่อม null ในการศึกษาขนาดเล็ก อาจเป็นเพราะ power ไม่พอ ไม่ใช่ยาไม่ได้ผล", "pearls": ["95% CI ของ difference คร่อม 0 หรือของ ratio (RR/OR/HR) คร่อม 1 = ไม่มีนัยสำคัญทางสถิติ (p ≥0.05)", "p <0.05 กับ 95% CI ที่ไม่คร่อม null ต้องไปด้วยกันเสมอ; ถ้าขัดกันให้ยึด CI", "CI กว้าง = ความแม่นยำต่ำ (sample size น้อย); เพิ่ม sample size ช่วงแคบลง", "ไม่มีนัยสำคัญ แปลว่าสรุปประโยชน์ไม่ได้ ไม่ใช่พิสูจน์ว่าไม่มีผล"], "traps": [], "q": [{"id": "PP35-ONC-057", "q": "In a trial, patients given drug X recovered in a mean of 8 days versus 10 days with control (mean difference −2 days, p = 0.04, 95% confidence interval −4 to +1). What is the most appropriate conclusion?", "a": "Benefit cannot be concluded, because the 95% confidence interval includes zero (the reported p-value is inconsistent with this interval)", "y": [35], "t": 345}], "years": [35], "th": [345]}], "left": []}, {"set": "derm", "name": "Derm", "n_lec": 42, "n_unc": 17, "lectures": [{"lec": "Derm1", "title": "Common skin diseases for internists — eczema, urticaria, STD, leprosy, EM/SJS/TEN, erythema nodosum", "n": 26, "angle": {"mech": 2, "dx": 13, "mx": 4, "ix": 4, "fact": 3}, "pattern": "ข้อสอบ derm เป็น spot diagnosis จากคำบรรยายรอยโรค/ภาพ (วงขอบนูน, deep-seated vesicle, มือแห้งแตก, ก้อนหน้าแข้ง) แทบทั้งหมด รองลงมาคือ 'ส่งตรวจอะไร' (KOH, patch test) โจทย์ซ้ำเกือบคำต่อคำหลายรุ่น (AD flexural, ICD แม่บ้าน, EN จาก OCP) มาจากคลัง DE-OLDP รุ่น 28–35", "tip": "ฝึกแปลคำบรรยายรอยโรค → ชื่อโรค สำหรับ eczema ทุกชนิด, EN, dyshidrosis และจำคู่ 'โรค–การตรวจ' (tinea→KOH, ACD→patch test) ให้คล่อง; อ่าน superficial fungal/scabies/acne เพิ่มเองเพราะออกแต่ไม่มีใน lecture", "secs": [{"t": "ภาษาของผิวหนัง (1): primary lesion — บอกชนิดจาก “ความลึก” และ “สิ่งที่อยู่ข้างใน”", "n": 2, "y": [30, 31], "w": "ตุ่มน้ำ: pemphigus (acantholysis, flaccid, Nikolsky, oral) vs bullous pemphigoid (tense, subepidermal, eosinophil)", "c": null, "s": ["Vesicle/bulla: acantholysis vs subepidermal", "Bulla: bullous pemphigoid (subepidermal)"], "q": [{"q": "Which feature distinguishes pemphigus vulgaris from bullous pemphigoid?", "a": "Pemphigus: flaccid easily ruptured
