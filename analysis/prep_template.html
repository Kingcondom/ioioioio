ง และความหมาย", "n": 0, "y": [], "w": null, "c": "ผลึก 6 ชนิด — เนื้อหาเสริมจากราวด์ ไม่ออก MCQ แต่ใช้ตอบ MEQ ได้", "s": [], "q": []}, {"t": "CPPD และ pseudogout", "n": 2, "y": [33], "w": null, "c": null, "s": ["ผลึก rhomboid positive = CPPD", "น้ำไขข้อ inflammatory"], "q": [{"q": "Synovial fluid from a painful knee contains rhomboid-shaped crystals that are weakly positively birefringent under polarized light. What is the diagnosis?", "a": "Calcium pyrophosphate deposition disease", "y": [33], "an": "interp", "sub": "ผลึก rhomboid positive = CPPD", "t": 68}, {"q": "In the same patient with pseudogout of the knee, which additional synovial fluid profile is expected?", "a": "Inflammatory fluid, neutrophil-predominant", "y": [33], "an": "interp", "sub": "น้ำไขข้อ inflammatory", "t": 68}]}, {"t": "ผลึกอื่นที่ต้องรู้จัก — BCP และ calcium oxalate", "n": 1, "y": [33], "w": null, "c": null, "s": ["hydroxyapatite (BCP) ในผู้ฟอกไต"], "q": [{"q": "A 70-year-old man on hemodialysis develops an acutely painful shoulder. Aspiration shows no crystals under polarized light but the fluid contains clumps that stain with alizarin red. What is the most likely diagnosis?", "a": "Hydroxyapatite arthritis", "y": [33], "an": "dx", "sub": "hydroxyapatite (BCP) ในผู้ฟอกไต", "t": 68}]}, {"t": "ข้ออักเสบติดเชื้อ", "n": 7, "y": [31, 33, 34, 35], "w": "Septic arthritis: GPC clusters → IV cloxacillin ให้ครบ course, neutropenia ระหว่างใช้ cloxacillin → เปลี่ยนกลุ่มยา; DGI (migratory arthralgia + tenosynovitis + pustule) → ซักประวัติเพศสัมพันธ์ → ceftriaxone; ออก 4 รุ่น (31–35)", "c": null, "s": ["GPC clusters → IV cloxacillin", "ข้อควรระวังเรื่องยา: cloxacillin neutropenia", "DGI: tenosynovitis + pustule → N. gonorrhoeae", "DGI → ceftriaxone"], "q": [{"q": "A patient with a hot swollen knee has synovial fluid Gram stain showing gram-positive cocci in clusters. What is the most appropriate antibiotic?", "a": "Intravenous cloxacillin", "y": [33], "an": "mx", "sub": "GPC clusters → IV cloxacillin", "t": 170}, {"q": "A patient with septic arthritis on intravenous cloxacillin for 12 days is clinically well but the neutrophil count has fallen to 900/mm3. What is the most appropriate next step?", "a": "Switch to another antibiotic class", "y": [33], "an": "mx", "sub": "ข้อควรระวังเรื่องยา: cloxacillin neutropenia", "t": 170}, {"q": "A 30-year-old sexually active man has migratory polyarthralgia, tenosynovitis of the wrist and a few pustular skin lesions, then develops a hot swollen knee. What is the most likely organism?", "a": "Neisseria gonorrhoeae", "y": [33], "an": "mech", "sub": "DGI: tenosynovitis + pustule → N. gonorrhoeae", "t": 170}, {"q": "A 20-year-old single Thai woman has had left knee pain with high fever for 2 days, and subsequently developed pain in the right ankle and right knee. She has no other abnormal symptoms; her LMP was 1 week ago. Examination: T 38°C, RR 16/min, PR 100/min, BP 100/70 mmHg; both knees are tender, swollen and warm with moderate effusion; the right ankle is tender, swollen and warm without effusion; other systems are normal. Arthrocentesis of the right knee shows cell count 40,000 cells/mm3 with 80% PMN and 20% lymphocytes, Gram stain shows no organism and no crystals; blood culture no growth, joint fluid culture no growth; ANA positive 1:40 speckled pattern. What treatment should you give this patient?", "a": "Ceftriaxone 2 g/day", "y": [31], "an": "mx", "sub": "DGI → ceftriaxone", "t": 170}, {"q": "A sexually active young woman presents with an acutely swollen, painful joint and is suspected of having gonococcal arthritis. Which investigation confirms the diagnosis?", "a": "Arthrocentesis for synovial fluid cell count, Gram stain and culture", "y": [33], "an": "ix", "sub": "เจาะข้อ cell count/Gram/culture", "t": 170}, {"q": "A patient with an acutely painful knee has synovial fluid culture growing gram-positive cocci in clusters and is started on IV cloxacillin. After 5 days, follow-up synovial fluid shows a falling neutrophil count. What is the next step in management?", "a": "Continue IV cloxacillin to complete the full course", "y": [34], "an": "mx", "sub": "ลำดับการจัดการ: ให้ยาครบ course", "t": 170}, {"q": "A 24-year-old man has 5 days of fever, migratory pain moving between the knees and wrists, tenosynovitis over the dorsum of the wrist and a few painless pustules on the hands. Which history is most important for the diagnosis?", "a": "Recent sexual history, including new or multiple partners and condom use", "y": [34, 35], "an": "dx", "sub": "DGI → ซักประวัติเพศสัมพันธ์", "t": 170}]}, {"t": "Rheumatoid arthritis — เกณฑ์ 2010 จากเคสจริง กลไก นอกข้อ และพยากรณ์โรค", "n": 3, "y": [28, 30, 31], "w": "RA: คิดคะแนน ACR/EULAR 2010 จากเคส, RF ไม่จำเพาะ, rheumatoid nodule = นอกข้อที่จำเพาะสุด", "c": null, "s": ["เกณฑ์ ACR/EULAR 2010 จากเคส", "Serology: RF ไม่จำเพาะ", "นอกข้อ: rheumatoid nodule"], "q": [{"q": "A 40-year-old woman has had painful, swollen joints of both wrists, the 2nd and 3rd MCP and PIP joints of both hands and both knees for about 6 weeks, with 30 minutes of morning stiffness and mild anorexia. Investigations show mild anaemia, normal white cell and platelet counts, ESR 50 mm/h and normal BUN and creatinine; rheumatoid factor and antinuclear antibody are both negative. What is the most likely diagnosis?", "a": "Rheumatoid arthritis", "y": [31], "an": "dx", "sub": "เกณฑ์ ACR/EULAR 2010 จากเคส", "t": 179}, {"q": "A man has joint pain and an elevated rheumatoid factor. Which statement is correct?", "a": "Rheumatoid arthritis is the most likely diagnosis if he has symmetric small-joint synovitis, but rheumatoid factor is not specific; anti-CCP is more specific", "y": [28], "an": "fact", "sub": "Serology: RF ไม่จำเพาะ", "t": 179}, {"q": "Which extra-articular finding is most specific for rheumatoid arthritis?", "a": "Subcutaneous rheumatoid nodules over the extensor surfaces", "y": [30], "an": "fact", "sub": "นอกข้อ: rheumatoid nodule", "t": 179}]}, {"t": "ยารักษา RA — treat to target · csDMARD · biologic · JAK และพิษที่ต้องรู้", "n": 1, "y": [31], "w": "TNF จำเป็นต่อ granuloma → anti-TNF ทำให้ latent TB กำเริบ", "c": null, "s": ["TNF คง granuloma → anti-TNF ทำ TB กลับ"], "q": [{"q": "Formation and maintenance of granulomas (e.g. in tuberculosis) depend critically on which cytokine, explaining why its blockade can reactivate latent TB?", "a": "Tumour necrosis factor-alpha (TNF-alpha)", "y": [31], "an": "mech", "sub": "TNF คง granuloma → anti-TNF ทำ TB กลับ", "t": 175}]}, {"t": "SLE arthritis และ spondyloarthritis — แยกจาก RA ให้ได้", "n": 2, "y": [31, 33], "w": "Psoriatic arthritis: plaque + nail pitting + DIP + dactylitis, RF ลบ — แยกจาก RA", "c": null, "s": ["Psoriatic arthritis: DIP + dactylitis + เล็บ", "PsA vs RA → ส่ง RF"], "q": [{"q": "A 45-year-old man has well-demarcated erythematous plaques with silvery scale on the elbows, knees and scalp, nail pitting, and painful swelling of several distal interphalangeal joints with dactylitis of one toe. Rheumatoid factor is negative. What is the most likely diagnosis?", "a": "Psoriatic arthritis", "y": [33], "an": "dx", "sub": "Psoriatic arthritis: DIP + dactylitis + เล็บ", "t": 168}, {"q": "A 65-year-old Thai woman has had pain in both wrists and all finger joints for 6 months, with thick red scaly plaques and heavy dandruff on the scalp, and morning stiffness lasting about 1 hour. Examination shows tender, swollen, warm MCP, PIP and DIP joints of both hands, erythematous hyperkeratotic scaly plaques on the scalp, and a positive sign of four on the right. Besides plain films of the hands, which laboratory test should be sent?", "a": "Rheumatoid factor", "y": [31], "an": "ix", "sub": "PsA vs RA → ส่ง RF", "t": 168}]}, {"t": "ข้อเสื่อม (osteoarthritis)", "n": 3, "y": [28, 29, 30, 31, 34, 35], "w": "OA: Heberden node, ฝืดเช้า <30 นาที, crepitus เป็นสิ่งตรวจพบบ่อยสุด, ข้อที่ OA ปฐมภูมิจับ (เข่า สะโพก MTP1 DIP/PIP) vs ไม่จับ (MCP ข้อมือ ข้อเท้า) — ออกซ้ำรุ่น 28–31, 34–35", "c": null, "s": ["OA: Heberden node, ฝืดเช้าสั้น", "ข้อที่ OA ปฐมภูมิจับ/ไม่จับ", "Crepitus ใน knee OA"], "q": [{"q": "A 60-year-old woman has bilateral knee pain worse with walking, relieved by rest, with 10 minutes of morning stiffness and bony enlargement of the distal interphalangeal joints. ANA and rheumatoid factor are negative. Radiograph shows joint space narrowing with osteophytes. What is the diagnosis?", "a": "Osteoarthritis", "y": [34], "an": "dx", "sub": "OA: Heberden node, ฝืดเช้าสั้น", "t": 178}, {"q": "Which statement about primary osteoarthritis is correct?", "a": "It commonly affects the knees, hips, first MTP joints and DIP/PIP joints, while the ankle, wrist, elbow and MCP joints are usually spared", "y": [28, 29, 30], "an": "fact", "sub": "ข้อที่ OA ปฐมภูมิจับ/ไม่จับ", "t": 178}, {"q": "What is the most common physical examination finding in knee osteoarthritis?", "a": "Crepitus on joint movement", "y": [31, 35], "an": "fact", "sub": "Crepitus ใน knee OA", "t": 178}]}, {"t": "ปวดรอบข้อ และข้ออักเสบหลังติดเชื้อ", "n": 1, "y": [30], "w": null, "c": null, "s": ["Lateral epicondylitis (tennis elbow)"], "q": [{"q": "A 40-year-old woman who carries heavy shopping bags has pain at the lateral elbow, worse with gripping and resisted wrist extension, with tenderness over the lateral epicondyle. What is the diagnosis?", "a": "Lateral epicondylitis (tennis elbow)", "y": [30], "an": "dx", "sub": "Lateral epicondylitis (tennis elbow)", "t": 180}]}, {"t": "กระดูกพรุนและกระดูกหักจากอุบัติเหตุเล็กน้อย", "n": 0, "y": [], "w": null, "c": "Osteoporosis/fragility fracture ไม่มีในคลังกลุ่มนี้ (อาจไปอยู่บท endocrine)", "s": [], "q": []}], "th": [68, 170, 179, 168, 178]}, {"lec": "33", "title": "Connective tissue disease, vasculitis and inflammatory arthritis", "n": 37, "angle": {"ix": 7, "fact": 3, "dx": 15, "mech": 3, "mx": 9}, "pattern": "บทที่ออกมากที่สุดในกลุ่ม ครอบคลุมรุ่น 28–35 มุมกระจาย: dx จาก vignette (SLE, SCLE, AOSD, IgAV, PMR) สลับกับ mx/ix เรื่องยา (MTX, HCQ, ANCA/autoantibody) และพิษยา/การตั้งครรภ์ใน SLE โจทย์หลายข้อวนซ้ำแนวเดิม (SCLE+anti-Ro, HCQ ทุกราย)", "tip": "ทำตาราง autoantibody–โรค (ANA, dsDNA/Sm, histone, Ro, Scl-70/ACA, PR3/MPO, aCL) และตารางพิษยา DMARD/SLE (MTX, HCQ, MMF ในครรภ์, steroid–AVN, anti-TNF–TB) ให้ขึ้นใจ แล้วฝึก spot dx ผื่นลูปัสและ vasculitis/PMR-GCA", "secs": [{"t": "การตรวจ autoantibody อย่างมีเหตุผล", "n": 2, "y": [34], "w": "ANA = screening, anti-Sm/anti-dsDNA = จำเพาะ SLE", "c": null, "s": ["ANA = screening test", "Anti-Sm/anti-dsDNA จำเพาะ SLE"], "q": [{"q": "Which of the following is the best initial screening test in a patient with suspected systemic lupus erythematosus?", "a": "Antinuclear antibody", "y": [34], "an": "ix", "sub": "ANA = screening test", "t": 169}, {"q": "Which antibody pattern is most specific for systemic lupus erythematosus?", "a": "Anti-Smith and anti-double-stranded DNA", "y": [34], "an": "fact", "sub": "Anti-Sm/anti-dsDNA จำเพาะ SLE", "t": 169}]}, {"t": "SLE — วินิจฉัยและ lupus nephritis", "n": 4, "y": [31, 32], "w": "วินิจฉัย SLE จาก vignette (ข้อ + leukopenia/AIHA + proteinuria + ANA) และกลไก UV → keratinocyte apoptosis → flare", "c": null, "s": ["คิดถึง SLE: ข้อ + leukopenia + ไข้", "SLE: nephritis + AIHA + ANA บวก", "UV → keratinocyte apoptosis → flare", "UV → keratinocyte apoptosis"], "q": [{"q": "A 35-year-old woman has fever, fatigue and symmetrical pain and swelling of the finger joints, wrists and both knees. Temperature 37.5°C; mild pallor. CBC: Hb 10 g/dL, WBC 3,400/µL (N 80%, L 15%), platelets 150,000/µL; urinalysis normal; ESR 50 mm/h; BUN 12, Cr 1 mg/dL. ANA positive 1:320, anti-dsDNA negative, RF positive. What is the most likely diagnosis?", "a": "Systemic lupus erythematosus", "y": [31], "an": "dx", "sub": "คิดถึง SLE: ข้อ + leukopenia + ไข้", "t": 183}, {"q": "A 28-year-old woman has arthralgia, proteinuria with active urine sediment and a haemolytic anaemia. ANA is positive at 1:160, anti-dsDNA is negative and the direct Coombs test is 2+. What is the most likely diagnosis?", "a": "Systemic lupus erythematosus", "y": [32], "an": "dx", "sub": "SLE: nephritis + AIHA + ANA บวก", "t": 183}, {"q": "A 28-year-old woman with systemic lupus erythematosus develops a flare of her malar rash and arthritis after a beach holiday. Which mechanism best explains how sunlight triggers her disease activity?", "a": "Ultraviolet light induces keratinocyte apoptosis, exposing nuclear autoantigens that drive immune-complex formation", "y": [31], "an": "mech", "sub": "UV → keratinocyte apoptosis → flare", "t": 184}, {"q": "In systemic lupus erythematosus, which environmental trigger induces keratinocyte apoptosis, exposing nuclear autoantigens and precipitating flares?", "a": "Ultraviolet (UV) light", "y": [31], "an": "mech", "sub": "UV → keratinocyte apoptosis", "t": 184}]}, {"t": "เกณฑ์ EULAR/ACR 2019 และผื่นของลูปัส", "n": 5, "y": [28, 29, 30, 31, 35], "w": "SCLE (annular/polycyclic บริเวณโดนแดด + anti-Ro) ถามซ้ำ 3 รุ่น (31, 35), serositis ในเกณฑ์ 2019, rhupus (RF/anti-CCP บวก + erosion + SLE)", "c": null, "s": ["SCLE annular + anti-Ro", "ผื่นลูปัส: SCLE annular + anti-Ro", "EULAR/ACR 2019: serositis", "ข้ออักเสบใน SLE: rhupus"], "q": [{"q": "A 35-year-old woman develops annular, polycyclic and psoriasiform scaly erythematous plaques on sun-exposed upper trunk and arms that heal without scarring; anti-Ro (SSA) is positive. Which form of cutaneous lupus is this?", "a": "Subacute cutaneous lupus erythematosus", "y": [30], "an": "dx", "sub": "ผื่นลูปัส: SCLE annular + anti-Ro", "t": 183}, {"q": "Which of the following is included in the classification criteria for systemic lupus erythematosus?", "a": "Serositis (pleuritis or pericarditis)", "y": [28, 29], "an": "fact", "sub": "EULAR/ACR 2019: serositis", "t": 183}, {"q": "A 38-year-old woman has symmetrical polyarthritis of the hands. Rheumatoid factor and anti-CCP are strongly positive, and radiographs show joint-space narrowing with marginal erosions. She also has a photosensitive malar rash, oral ulcers, a positive ANA and a positive anti-dsDNA antibody. What is the most likely diagnosis?", "a": "Rheumatoid arthritis-SLE overlap syndrome (rhupus)", "y": [31], "an": "dx", "sub": "ข้ออักเสบใน SLE: rhupus", "t": 183}, {"q": "A patient has annular erythematous scaly plaques on the face, chest, back and arms. Investigations show a strongly positive ANA, positive anti-Ro/SSA and negative anti-La/SSB. What is the most likely diagnosis?", "a": "Subacute cutaneous lupus erythematosus (SCLE)", "y": [35], "an": "dx", "sub": "SCLE annular + anti-Ro", "t": 183}, {"q": "A patient presents with erythematous, annular, scaly plaques on the face, upper chest, back and arms. Labs: ANA positive at very high titre, anti-Ro/SSA positive, anti-La/SSB negative. What is the most likely diagnosis?", "a": "Subacute cutaneous lupus erythematosus (SCLE)", "y": [31], "an": "dx", "sub": "SCLE annular + anti-Ro", "t": 183}]}, {"t": "การรักษา SLE ตามความรุนแรงและการดูแลระยะยาว", "n": 3, "y": [31, 35], "w": "HCQ เป็น background therapy ทุกราย (ถามซ้ำรุ่น 31, 35) ± steroid", "c": null, "s": ["HCQ ให้ทุกราย", "ตารางเลือกยา: steroid สำหรับ SLE"], "q": [{"q": "A young woman presents with a malar rash and is found to be ANA positive, consistent with systemic lupus erythematosus. Which drug should be given to control her disease?", "a": "Systemic corticosteroid (prednisolone)", "y": [31], "an": "mx", "sub": "ตารางเลือกยา: steroid สำหรับ SLE", "t": 181}, {"q": "A 26-year-old woman is newly diagnosed with systemic lupus erythematosus presenting with arthritis, malar rash and oral ulcers; renal function and urinalysis are normal. Which drug should be prescribed as the long-term background therapy for essentially all patients with SLE unless contraindicated?", "a": "Hydroxychloroquine", "y": [31], "an": "mx", "sub": "HCQ ให้ทุกราย", "t": 181}, {"q": "A 26-year-old woman is newly diagnosed with SLE presenting with arthritis, malar rash and mild leukopenia, without renal or CNS involvement. Which drug is recommended for essentially all patients with SLE unless contraindicated?", "a": "Hydroxychloroquine", "y": [35], "an": "mx", "sub": "HCQ ให้ทุกราย", "t": 181}]}, {"t": "เจาะน้ำในเยื่อหุ้มปอดของลูปัส — อ่านผลให้เป็น", "n": 0, "y": [], "w": null, "c": "น้ำในเยื่อหุ้มปอดของลูปัส ยังไม่มีข้อตรง — เนื้อหาเสริมจากสไลด์", "s": [], "q": []}, {"t": "Drug-induced lupus", "n": 1, "y": [33], "w": null, "c": null, "s": ["Hydralazine + anti-histone"], "q": [{"q": "A 45-year-old woman on hydralazine for 1 year develops arthralgia, fever and pleuritic chest pain. ANA is positive, anti-double-stranded DNA is negative, anti-histone antibody is positive and complement levels are normal. What is the diagnosis?", "a": "Drug-induced lupus erythematosus", "y": [33], "an": "dx", "sub": "Hydralazine + anti-histone", "t": 169}]}, {"t": "Antiphospholipid syndrome", "n": 1, "y": [33], "w": null, "c": null, "s": ["เกณฑ์ lab APS: aCL/LA/β2GPI"], "q": [{"q": "A woman with four unexplained pregnancy losses and a past unprovoked deep vein thrombosis is suspected of having antiphospholipid syndrome. Which antibody should be tested?", "a": "Anticardiolipin antibody", "y": [33], "an": "ix", "sub": "เกณฑ์ lab APS: aCL/LA/β2GPI", "t": 169}]}, {"t": "ดูแลผู้ป่วย SLE ระยะยาว — ติดเชื้อ พิษยา และการตั้งครรภ์", "n": 4, "y": [32, 33, 34], "w": "พิษยาใน SLE: HCQ → maculopathy ตรวจตา, steroid → AVN สะโพก (X-ray ปกติ → MRI), MMF ห้ามในครรภ์ → เปลี่ยน azathioprine, steroid + ตั้งครรภ์ → pre-existing DM", "c": null, "s": ["การตั้งครรภ์/steroid → pre-existing DM", "HCQ maculopathy ต้องตรวจตา", "ปวดสะโพกจาก steroid → AVN → MRI", "ยาห้ามในครรภ์: MMF → azathioprine"], "q": [{"q": "A woman with SLE has been on prednisolone for 3 years and now presents in pregnancy with fasting plasma glucose 138 mg/dL and HbA1c 7.2% at 8 weeks of gestation. How should her hyperglycemia be classified?", "a": "Pre-existing diabetes mellitus", "y": [34], "an": "fact", "sub": "การตั้งครรภ์/steroid → pre-existing DM", "t": 167}, {"q": "Which drug used in systemic lupus erythematosus requires periodic ophthalmologic screening because of the risk of irreversible maculopathy?", "a": "Hydroxychloroquine", "y": [33], "an": "mech", "sub": "HCQ maculopathy ต้องตรวจตา", "t": 167}, {"q": "A 34-year-old woman with SLE on long-term high-dose prednisolone develops progressive right groin pain on weight bearing. Hip radiograph is normal. What is the most appropriate next investigation?", "a": "MRI of both hips", "y": [32], "an": "ix", "sub": "ปวดสะโพกจาก steroid → AVN → MRI", "t": 167}, {"q": "A woman with SLE and lupus nephritis wishes to become pregnant. Which drug must be stopped and replaced before conception?", "a": "Mycophenolate mofetil, replaced by azathioprine", "y": [34], "an": "mx", "sub": "ยาห้ามในครรภ์: MMF → azathioprine", "t": 167}]}, {"t": "Systemic sclerosis และ Raynaud phenomenon", "n": 2, "y": [32, 33], "w": null, "c": null, "s": ["ANA ลบ → anti-Scl-70/ACA", "Scleroderma renal crisis → ACEI (captopril)"], "q": [{"q": "A patient with features of systemic sclerosis has a negative ANA on the standard screening assay. Which test should be sent next?", "a": "Anti-Scl-70 and anticentromere antibodies", "y": [33], "an": "ix", "sub": "ANA ลบ → anti-Scl-70/ACA", "t": 169}, {"q": "A patient with diffuse systemic sclerosis recently started on prednisolone develops blood pressure 210/120 mmHg, acute kidney injury and schistocytes on blood smear. Which drug should be started immediately?", "a": "Captopril", "y": [32], "an": "mx", "sub": "Scleroderma renal crisis → ACEI (captopril)", "t": 171}]}, {"t": "เกณฑ์จำแนก systemic sclerosis ปี 2013 ทีละข้อ", "n": 0, "y": [], "w": null, "c": "เกณฑ์ SSc 2013 แบบให้คะแนน ไม่เคยถาม — จำแค่ sclerodactyly เหนือ MCP = 9 คะแนนก็พอ", "s": [], "q": []}, {"t": "กล้ามเนื้ออักเสบ และกล้ามเนื้อเป็นพิษจากยา", "n": 2, "y": [33], "w": null, "c": null, "s": ["AST สูง ALT ปกติ → ส่ง CK", "Dermatomyositis → คัดกรองมะเร็ง"], "q": [{"q": "A patient has proximal muscle weakness with AST 1,000 U/L but normal ALT, ALP and GGT. What is the most appropriate next investigation?", "a": "Creatine kinase", "y": [33], "an": "ix", "sub": "AST สูง ALT ปกติ → ส่ง CK", "t": 91}, {"q": "A 55-year-old woman has proximal muscle weakness, a violaceous periorbital rash and scaly papules over the knuckles. Apart from treating the myositis, what must not be missed?", "a": "Screening for an underlying malignancy", "y": [33], "an": "mx", "sub": "Dermatomyositis → คัดกรองมะเร็ง", "t": 172}]}, {"t": "Sjögren's syndrome", "n": 0, "y": [], "w": null, "c": "Sjögren ไม่เคยออก แต่ anti-Ro/La และ lymphoma risk เป็นข้อ fact ง่าย", "s": [], "q": []}, {"t": "MCTD และ UCTD — เมื่ออาการยังไม่เข้าโรคใดโรคหนึ่ง", "n": 0, "y": [], "w": null, "c": "MCTD/UCTD (anti-U1 RNP) ไม่เคยออก — ความสำคัญต่ำ", "s": [], "q": []}, {"t": "Polymyalgia rheumatica และ giant cell arteritis", "n": 2, "y": [32], "w": null, "c": null, "s": ["GCA → steroid ก่อน biopsy", "PMR → prednisolone ขนาดต่ำ"], "q": [{"q": "A 72-year-old woman has new temporal headache, scalp tenderness, jaw claudication and ESR 95 mm/hr. Vision is normal. What should be done first?", "a": "Start high-dose corticosteroid immediately, then arrange temporal artery biopsy", "y": [32], "an": "mx", "sub": "GCA → steroid ก่อน biopsy", "t": 173}, {"q": "A 68-year-old woman has 2 months of bilateral shoulder and hip girdle aching with prolonged morning stiffness, ESR 88 mm/hr, normal creatine kinase and no true weakness on testing. What is the most likely diagnosis and treatment?", "a": "Polymyalgia rheumatica; low-dose prednisolone", "y": [32], "an": "dx", "sub": "PMR → prednisolone ขนาดต่ำ", "t": 173}]}, {"t": "หลอดเลือดอักเสบ — ANCA-associated และ IgA vasculitis", "n": 2, "y": [32, 34], "w": null, "c": null, "s": ["GPA → anti-PR3", "IgA vasculitis (HSP)"], "q": [{"q": "A 56-year-old man with chronic sinusitis and bloody nasal discharge develops hemoptysis, cavitating lung nodules and glomerulonephritis with red cell casts. Which antibody is most likely to be positive?", "a": "Anti-proteinase 3", "y": [34], "an": "ix", "sub": "GPA → anti-PR3", "t": 169}, {"q": "A 19-year-old man has palpable purpura over both legs and buttocks, colicky abdominal pain, arthralgia and hematuria one week after an upper respiratory infection. Platelet count and coagulation tests are normal. What is the diagnosis?", "a": "IgA vasculitis", "y": [32], "an": "dx", "sub": "IgA vasculitis (HSP)", "t": 174}]}, {"t": "Rheumatoid arthritis — วินิจฉัยเร็ว รักษาเร็ว", "n": 6, "y": [30, 33, 34], "w": "RA: ข้อเล็กสมมาตร + ฝืดเช้า >30–60 นาที → วินิจฉัย; MTX สัปดาห์ละครั้ง + folic, MTX pneumonitis → หยุดยา, ก่อน anti-TNF ต้องคัดกรอง latent TB/HBV/HCV", "c": null, "s": ["MTX สัปดาห์ละครั้ง + folic", "ก่อน anti-TNF: latent TB, HBV, HCV", "MTX pneumonitis → หยุดยา", "ข้อเล็กสมมาตร + ฝืดเช้า > 30 นาที"], "q": [{"q": "Which conventional DMARD is the anchor drug for newly diagnosed rheumatoid arthritis, and how is it given?", "a": "Methotrexate, given once weekly with folic acid supplementation", "y": [33], "an": "mx", "sub": "MTX สัปดาห์ละครั้ง + folic", "t": 175}, {"q": "Before starting an anti-TNF biologic agent in rheumatoid arthritis, which screening is mandatory?", "a": "Latent TB, hepatitis B and C screening", "y": [34], "an": "ix", "sub": "ก่อน anti-TNF: latent TB, HBV, HCV", "t": 175}, {"q": "A patient with rheumatoid arthritis on methotrexate develops fever, dry cough and diffuse interstitial infiltrates with leukopenia. What should be done first?", "a": "Stop methotrexate and investigate", "y": [34], "an": "mx", "sub": "MTX pneumonitis → หยุดยา", "t": 175}, {"q": "A 46-year-old woman has symmetric swelling of the MCP and PIP joints of both hands with morning stiffness of more than 30 minutes for 4 months. What is the most likely diagnosis?", "a": "Rheumatoid arthritis", "y": [33], "an": "dx", "sub": "ข้อเล็กสมมาตร + ฝืดเช้า > 30 นาที", "t": 179}, {"q": "Examination of a patient's hands shows symmetric fusiform (spindle-shaped) swelling of the proximal interphalangeal joints with morning stiffness lasting 2 hours. What is the most likely diagnosis?", "a": "Rheumatoid arthritis", "y": [30], "an": "dx", "sub": "Fusiform PIP + ฝืดเช้านาน", "t": 179}, {"q": "A 45-year-old woman has 4 months of painful swelling of both hands and wrists with morning stiffness for more than 1 hour. Hand radiographs show periarticular osteopenia at the MCP, PIP and wrist joints with mild joint-space narrowing at the PIP joints and no erosions or osteophytes. ANA and RF are negative. What is the most likely diagnosis?", "a": "Rheumatoid arthritis (early, seronegative)", "y": [33], "an": "dx", "sub": "Early seronegative RA: periarticular osteopenia", "t": 179}]}, {"t": "Axial spondyloarthritis", "n": 1, "y": [31], "w": null, "c": null, "s": ["Inflammatory back pain + uveitis"], "q": [{"q": "A 27-year-old man has chronic low back pain that improves with exercise, wakes him in the early morning, with morning stiffness of 1 hour and a past episode of acute anterior uveitis. What is the most likely diagnosis?", "a": "Axial spondyloarthritis", "y": [31], "an": "dx", "sub": "Inflammatory back pain + uveitis", "t": 168}]}, {"t": "ไข้ ผื่น ปวดข้อ — Still disease และโรคเลียนแบบ", "n": 2, "y": [34], "w": null, "c": null, "s": ["Chikungunya ในวินิจฉัยแยก ไข้+ผื่น+ข้อ", "AOSD: ไข้เย็น ผื่น salmon ferritin สูง"], "q": [{"q": "A 20-year-old man presents with fever, arthralgia, a maculopapular rash over the trunk and extremities, and swelling with warmth and limited movement of both knees, ankles and elbows. Hct 40%, WBC 3,500/mm3 (N 45%, L 50%, atypical lymphocyte 5%), platelet 45,000/mm3. What is the most likely diagnosis?", "a": "Chikungunya virus infection", "y": [34], "an": "dx", "sub": "Chikungunya ในวินิจฉัยแยก ไข้+ผื่น+ข้อ", "t": 168}, {"q": "A 28-year-old woman has daily evening fever for 3 weeks, an evanescent salmon-coloured rash, sore throat, arthralgia, neutrophilic leukocytosis and ferritin 8,000 ng/mL, with negative ANA, RF and blood cultures. What is the most likely diagnosis?", "a": "Adult-onset Still disease", "y": [34], "an": "dx", "sub": "AOSD: ไข้เย็น ผื่น salmon ferritin สูง", "t": 168}]}], "th": [169, 184, 183, 181, 167, 171, 172, 173, 174, 175]}], "gaps": [{"id": "gap-air-01", "set": "air", "title": "Soft tissue rheumatism — fibromyalgia, myofascial pain, tennis elbow และ trigger finger", "subtitle": "ปวดรอบข้อที่ข้อไม่อักเสบ แยก widespread กับ regional และรู้จักโครงสร้างที่ผิดปกติ", "md": "### หลักคิด\n- Soft tissue rheumatism คืออาการปวดจากโครงสร้างรอบข้อ (tendon, enthesis, bursa, ligament, กล้ามเนื้อ) หรือจากระบบประสาทส่วนกลางที่ขยายความปวด ไม่ใช่ synovitis\n- เบาะแส: ข้อไม่บวม, ขยับข้อแบบ passive ได้สุดแต่ปวดเมื่อออกแรงต้านเฉพาะท่า, กดเจ็บเฉพาะจุด, ESR/CRP และภาพรังสีปกติ\n- แบ่งเป็น **ปวดทั่วตัว (fibromyalgia)** กับ **ปวดเฉพาะที่** (myofascial pain, tendinopathy, bursitis, entrapment)\n\n### Fibromyalgia: nociplastic pain\n- กลไก: **central sensitization** สมองและไขสันหลังขยายสัญญาณปวด (substance P และ glutamate สูง, descending inhibition จาก serotonin/norepinephrine ลดลง) ร่วมกับการนอนที่ไม่มีคุณภาพ\n- พบในหญิงอายุ 30–50 ปี มักมี depression, anxiety, IBS, migraine, TMJ disorder ร่วม\n- อาการ: **ปวดทั่วตัว (ซ้ายขวา เหนือและใต้เอว และแกนกลาง) ≥ 3 เดือน**, อ่อนเพลีย, **นอนตื่นมาไม่สดชื่น**, ความจำและสมาธิลด (fibro fog), อารมณ์ซึมเศร้า\n- ตรวจร่างกาย: กดเจ็บหลายจุดทั่วตัว แต่ **ข้อปกติ แรงกล้ามเนื้อปกติ**\n- เกณฑ์ ACR 1990: ปวดทั่วตัว ≥ 3 เดือน + กดเจ็บ ≥ 11 จาก 18 tender points\n- เกณฑ์ ACR 2010/2016 (ไม่ต้องกด tender point): WPI ≥ 7 และ symptom severity score ≥ 5 หรือ WPI 4–6 และ SSS ≥ 9; ปวดใน ≥ 4 จาก 5 บริเวณ; อาการ ≥ 3 เดือน; วินิจฉัยได้แม้มีโรคอื่นร่วม\n- แล็บพอประมาณเพื่อตัดโรคเลียนแบบ: CBC, ESR/CRP, CK, TSH (± glucose, LFT, vitamin D); ไม่ส่ง ANA/RF ถ้าไม่มีอาการชี้นำ เพราะผลบวกลวงพบบ่อย\n- โรคที่ต้องแยก: hypothyroidism, polymyalgia rheumatica (อายุ > 50 ปี ข้อฝืด ESR สูง), myositis (อ่อนแรง CK สูง), statin myopathy, RA/SLE, vitamin D deficiency\n- รักษา (EULAR 2016): **ไม่ใช้ยาเป็นหลัก** อธิบายโรค, **aerobic exercise แบบค่อยเพิ่ม** (หลักฐานดีที่สุด), CBT, sleep hygiene, tai chi/yoga\n- ยา: amitriptyline 10–25 mg ก่อนนอน, duloxetine 30–60 mg/วัน, milnacipran, pregabalin 150–450 mg/วัน, cyclobenzaprine\n- ไม่แนะนำ: strong opioid, corticosteroid, NSAID เดี่ยว ๆ (ไม่ได้ผล), benzodiazepine\n\n### Myofascial pain syndrome: ปวดเฉพาะที่จาก trigger point\n- กลไก: motor endplate ทำงานผิดปกติ → sarcomere หดค้าง → ขาดเลือดเฉพาะที่และสาร sensitizing สะสม → **trigger point** ในแถบกล้ามเนื้อที่ตึง\n- สาเหตุ: ท่าทางไม่เหมาะ ใช้กล้ามเนื้อซ้ำ ๆ (office syndrome), บาดเจ็บ, ความเครียด\n- อาการ: ปวดเฉพาะบริเวณ (คอ บ่า สะบัก หลังล่าง) คลำได้ **taut band** ที่มีจุดกดเจ็บ กดแล้วเกิด **referred pain** แบบที่ผู้ป่วยคุ้นเคย และอาจมี local twitch response; neuro exam และแล็บปกติ\n- รักษา: แก้ท่าทางและ ergonomics, stretching, ความร้อน นวด, ออกกำลังกาย, **trigger point injection** ด้วย 1% lidocaine หรือ dry needling, NSAID ระยะสั้น, TCA ในรายเรื้อรัง\n\n| ลักษณะ | Fibromyalgia | Myofascial pain |\n|---|---|---|\n| การกระจาย | ทั่วตัว | เฉพาะที่ หนึ่งบริเวณ |\n| จุดกดเจ็บ | tender points หลายจุด ไม่มีปวดร้าว | trigger point ใน taut band มี referred pain |\n| อาการร่วม | อ่อนเพลีย นอนไม่สดชื่น อารมณ์ | ไม่เด่น |\n| รักษาหลัก | exercise, CBT, ยาออกฤทธิ์ส่วนกลาง | แก้ท่าทาง ยืดกล้ามเนื้อ ฉีด trigger point |\n\n### Tendinopathy และ tenosynovitis ที่ออกสอบ\n\n| ภาวะ | โครงสร้างที่ผิดปกติ | การตรวจ | รักษา |\n|---|---|---|---|\n| **Lateral epicondylitis (tennis elbow)** | จุดเกาะ common extensor โดยเฉพาะ **ECRB** ที่ lateral epicondyle (degenerative tendinosis ไม่ใช่การอักเสบ) | ปวดเมื่อต้าน wrist extension (Cozen test) หรือยกของคว่ำมือ | ลดกิจกรรม, counterforce brace, eccentric exercise, topical NSAID; ฉีด steroid ได้ผลระยะสั้นแต่ผลที่ 1 ปีแย่กว่า; หายเองใน 1–2 ปีส่วนใหญ่ |\n| Medial epicondylitis (golfer's elbow) | จุดเกาะ flexor–pronator ที่ medial epicondyle | ปวดเมื่อต้าน wrist flexion | เหมือน tennis elbow |\n| **Trigger finger (stenosing flexor tenosynovitis)** | **A1 pulley หนาตัว** ที่ระดับหัว metacarpal (รอยพับฝ่ามือที่ MCP) ทำให้ flexor tendon ที่บวมเป็นปุ่มลอดผ่านไม่ได้ | นิ้วล็อกในท่างอ ดีดเมื่อเหยียด คลำได้ปุ่มกดเจ็บ | splint, **ฉีด steroid เข้า tendon sheath** (first-line), ผ่าตัดตัด A1 pulley ถ้าไม่ดีขึ้น; พบบ่อยใน DM, RA, hypothyroid; นิ้วนางและนิ้วโป้ง |\n| De Quervain tenosynovitis | APL + EPB ใน first dorsal compartment | Finkelstein test | thumb spica splint, ฉีด steroid |\n| Rotator cuff tendinopathy | supraspinatus | painful arc 60–120°, Neer, Hawkins | กายภาพ, NSAID, ฉีด steroid ใต้ acromion |\n| Plantar fasciitis | plantar fascia ที่ calcaneus | ปวดส้นเท้าก้าวแรกตอนเช้า | ยืด plantar fascia และน่อง, แผ่นรองส้น |", "pearls": ["Fibromyalgia: ปวดทั่วตัว ≥ 3 เดือน + อ่อนเพลีย + นอนไม่สดชื่น ข้อและแรงปกติ แล็บ (ESR, CK, TSH) ปกติ", "Fibromyalgia รักษาหลักคือ aerobic exercise + education + CBT; ยา amitriptyline, duloxetine, pregabalin; ไม่ใช้ opioid หรือ steroid", "Myofascial pain: taut band + trigger point ที่กดแล้วปวดร้าวแบบเดิม + local twitch response เป็นเฉพาะที่", "Trigger finger = A1 pulley ของ flexor tendon sheath หนาตัวที่ MCP สัมพันธ์กับเบาหวาน", "Tennis elbow = ECRB ที่ lateral epicondyle ปวดเมื่อต้าน wrist extension; ฉีด steroid ช่วยแค่ระยะสั้น"], "traps": [], "q": [{"id": "PP30-AIR-104", "q": "A 42-year-old woman has chronic widespread pain above and below the waist for 6 months with fatigue, unrefreshing sleep and low mood. Examination shows multiple tender points with normal joints and muscle strength; ESR, CK and TSH are normal. What is the diagnosis?", "a": "Fibromyalgia", "y": [30], "t": 180}, {"id": "PP30-AIR-105", "q": "A 45-year-old man has neck and shoulder pain with a palpable taut band in the trapezius containing a trigger point that reproduces referred pain. Muscle power and reflexes are normal. What is the diagnosis?", "a": "Myofascial pain syndrome", "y": [30], "t": 180}, {"id": "PP30-AIR-107", "q": "A patient has a painful finger that catches or locks in flexion and snaps when extended, with a tender nodule at the palmar MCP crease. Thickening of which structure causes this?", "a": "The A1 pulley of the flexor tendon sheath (stenosing flexor tenosynovitis)", "y": [30], "t": 180}], "years": [30], "th": [180]}, {"id": "gap-air-02", "set": "air", "title": "Behçet disease — แผลในปาก แผลที่อวัยวะเพศ ตา และหลอดเลือด", "subtitle": "variable vessel vasculitis ที่วินิจฉัยด้วยเกณฑ์ทางคลินิก และเลือกยาตามอวัยวะที่เป็น", "md": "### กลไก\n- Behçet disease เป็น **variable vessel vasculitis** (Chapel Hill 2012) อักเสบได้ทั้งหลอดเลือดแดงและดำทุกขนาด\n- Neutrophil ทำงานมากเกิน ร่วมกับ Th1/Th17 และสัมพันธ์กับ **HLA-B51**\n- พบมากตามแนว Silk Road (ตุรกีมากที่สุด, ตะวันออกกลาง, จีน, เกาหลี, ญี่ปุ่น) พบได้แต่ไม่บ่อยในไทย\n- อายุ 20–40 ปี; ชายอายุน้อยเป็นรุนแรงกว่า (ตา หลอดเลือด เสียชีวิต)\n- ไม่มี autoantibody จำเพาะ (ANA, ANCA ลบ) ESR/CRP สูงได้ จึงเป็นการวินิจฉัยทางคลินิก\n\n### อาการแยกตามระบบ\n- **Oral aphthous ulcer ซ้ำ ๆ** (~100%) มักเป็นอาการแรก เจ็บ หายใน 1–3 สัปดาห์\n- **Genital ulcer** (~75%): ถุงอัณฑะในชาย แคมในหญิง ลึกกว่าและหายแล้ว **มีแผลเป็น** (ช่วยวินิจฉัยย้อนหลัง)\n- ผิวหนัง: **erythema nodosum**, papulopustular/acneiform lesion, pseudofolliculitis\n- **Pathergy test**: ใช้เข็ม 20–21G แทงผิวท้องแขน อ่านที่ 24–48 ชม. ขึ้นตุ่มแดงหรือตุ่มหนองปลอดเชื้อ = บวก\n- **ตา (~50%)** สาเหตุพิการที่สำคัญ: panuveitis หรือ posterior uveitis + **retinal vasculitis** สองข้าง, anterior uveitis มี hypopyon ได้; ตาบอดได้ในไม่กี่ปีถ้าไม่รักษาเร็ว\n- **หลอดเลือดดำ** พบบ่อยกว่าแดง: superficial thrombophlebitis, DVT ขา, Budd–Chiari, cerebral venous sinus thrombosis; thrombus เกิดจากผนังหลอดเลือดอักเสบ ยึดแน่น จึงหลุดเป็น emboli น้อย\n- **หลอดเลือดแดง**: aneurysm โดยเฉพาะ **pulmonary artery aneurysm** (ไอเป็นเลือด เป็นสาเหตุตายสำคัญ)\n- Neuro-Behçet: parenchymal (ก้านสมอง, meningoencephalitis) หรือ CVST\n- ทางเดินอาหาร: แผลที่ ileocecal คล้าย Crohn disease, ทะลุได้\n- ข้อ: oligoarthritis ของเข่าและข้อเท้า ไม่กัดกร่อน ไม่ผิดรูป\n\n### เกณฑ์วินิจฉัย\n- **ISG 1990**: oral ulcer ซ้ำ ≥ 3 ครั้งใน 12 เดือน **ร่วมกับ ≥ 2 ข้อ** จาก genital ulcer ซ้ำ, รอยโรคตา, รอยโรคผิวหนัง, pathergy บวก\n- **ICBD 2014** (ให้คะแนน ≥ 4 = Behçet):\n\n| ลักษณะ | คะแนน |\n|---|---|\n| Ocular lesions | 2 |\n| Genital aphthosis | 2 |\n| Oral aphthosis | 2 |\n| Skin lesions (EN, pseudofolliculitis) | 1 |\n| Neurological manifestations | 1 |\n| Vascular manifestations | 1 |\n| Pathergy test บวก (ไม่บังคับ) | 1 |\n\n- ตัวอย่างข้อสอบ: ชาย 28 ปี oral ulcer + genital ulcer + erythema nodosum + pathergy บวก → ครบทั้ง ISG และ ICBD (2+2+1+1 = 6) = **Behçet disease**\n- โรคที่ต้องแยก: recurrent aphthous stomatitis ธรรมดา, HSV, syphilis, Crohn disease, reactive arthritis, SLE, Sweet syndrome\n\n### รักษาตามอวัยวะ (EULAR 2018)\n\n| อวัยวะ | ยา |\n|---|---|\n| แผลในปากและอวัยวะเพศ | topical corticosteroid; **colchicine** ป้องกันการกลับเป็นซ้ำ (โดยเฉพาะ genital ulcer และ EN); **apremilast** สำหรับ oral ulcer; ดื้อยาใช้ azathioprine, thalidomide, interferon-α, anti-TNF |\n| Erythema nodosum, arthritis | colchicine เป็น first-line |\n| Posterior uveitis / retinal vasculitis | azathioprine, cyclosporine-A, interferon-α หรือ anti-TNF (infliximab, adalimumab); steroid ขนาดสูงให้ร่วมกับยากดภูมิเสมอ ไม่ใช้เดี่ยว |\n| DVT | **glucocorticoid + ยากดภูมิ** (azathioprine, cyclophosphamide, cyclosporine-A) เป็นหลัก; anticoagulant เพิ่มได้เฉพาะรายดื้อยาที่เสี่ยงเลือดออกต่ำและตัด PA aneurysm แล้ว |\n| Pulmonary/peripheral arterial aneurysm | steroid ขนาดสูง + cyclophosphamide (ดื้อยาใช้ anti-TNF); embolization หรือผ่าตัดเมื่อมีเลือดออก |\n| Parenchymal neuro-Behçet | steroid ขนาดสูง + azathioprine หรือ anti-TNF; **เลี่ยง cyclosporine** (neurotoxic) |\n| GI | 5-ASA หรือ azathioprine; รุนแรงใช้ anti-TNF; ทะลุต้องผ่าตัด |\n\n- Colchicine ขนาด 0.5–2 mg/วัน (มัก 1–1.5 mg/วัน) ปรับลดถ้าท้องเสีย; ใช้ป้องกันการกลับเป็นซ้ำระยะยาว", "pearls": ["Oral aphthae ≥ 3 ครั้ง/ปี + ≥ 2 ข้อของ genital ulcer, ตา, ผิวหนัง (EN), pathergy บวก = Behçet (ISG)", "Behçet = variable vessel vasculitis สัมพันธ์ HLA-B51 ไม่มี autoantibody จำเพาะ", "ตา (posterior uveitis + retinal vasculitis) และ pulmonary artery aneurysm คืออวัยวะที่ทำให้พิการและเสียชีวิต", "DVT ใน Behçet รักษาด้วย steroid + ยากดภูมิ ไม่ใช่ anticoagulant เดี่ยว ๆ; neuro-Behçet เลี่ยง cyclosporine", "Mucocutaneous: topical steroid, colchicine, apremilast (oral ulcer)"], "traps": [], "q": [{"id": "PP30-AIR-088", "q": "A 28-year-old man has recurrent painful oral aphthous ulcers and genital ulcers, with erythema nodosum and a positive pathergy test. What is the most likely diagnosis?", "a": "Behçet disease", "y": [30], "t": 182}], "years": [30], "th": [182]}], "left": []}, {"set": "neuro", "name": "Neuro", "n_lec": 75, "n_unc": 61, "lectures": [{"lec": "07", "title": "Acute ischemic stroke — pathophysiology and management", "n": 22, "angle": {"ix": 2, "dx": 9, "mech": 5, "fact": 3, "mx": 3}, "pattern": "เน้น dx/localization จากอาการ (aphasia, ลานสายตา, crossed sign) และ mech (TOAST จากเบาะแส AF/murmur) เป็นโจทย์สั้น 1–2 บรรทัด ซ้ำมากในรุ่น 30–31; ข้อ management มีน้อยแต่ยาวขึ้นในรุ่นหลัง (เคส AF+INR 1.8 รุ่น 32,35). นอกจากนี้ hemorrhagic stroke (cerebellar haemorrhage, SAH, vasospasm) ถูกถามบ่อยแต่ไม่มีในคาบนี้", "tip": "ท่องตาราง MCA ซ้าย/ขวา, PCA, brainstem crossed sign และ TOAST จากเบาะแสข้างเตียงให้แม่น; จำข้อห้าม tPA (INR>1.7, BP>185/110) คู่กับข้อบ่งชี้ thrombectomy และเสริม ICH/SAH/cerebellar haemorrhage เองนอก learn", "secs": [{"t": "นิยาม ชนิด และสัดส่วนของโรคหลอดเลือดสมอง", "n": 2, "y": [31], "w": "UMN facial palsy → next step คือ non-contrast CT brain (R/O bleed) รุ่น 31 สองข้อ", "c": null, "s": ["ทำไมต้องส่ง CT สมองทุกราย"], "q": [{"q": "A man presents with right-sided facial palsy of the upper-motor-neuron (central) pattern — weakness of the lower face with preserved forehead movement and eye closure. What is the most appropriate next step?", "a": "Non-contrast CT of the brain", "y": [31], "an": "ix", "sub": "ทำไมต้องส่ง CT สมองทุกราย", "t": 127}, {"q": "A man presents with right-sided facial weakness in an upper-motor-neuron pattern (lower face affected, forehead and eye closure spared). What is the next appropriate step?", "a": "Non-contrast CT of the brain", "y": [31], "an": "ix", "sub": "ทำไมต้องส่ง CT สมองทุกราย", "t": 127}]}, {"t": "หลอดเลือดสมองและแนวคิด core กับ penumbra", "n": 0, "y": [], "w": null, "c": "core/penumbra เป็นแนวคิด ไม่เคยถามตรง ใช้เข้าใจเหตุผลเรื่องเวลาเท่านั้น", "s": [], "q": []}, {"t": "กลุ่มอาการตามหลอดเลือด — แปลอาการกลับเป็นตำแหน่ง", "n": 9, "y": [30, 31, 32, 34, 35], "w": "แปลอาการกลับเป็นตำแหน่ง: Wernicke (fluent ไร้ความหมาย) vs Broca (พูดติดขัด เข้าใจดี) ถามซ้ำ 5 ข้อ, PCA → homonymous hemianopia, crossed sensory = pons, right parietal neglect, cerebellar infarct", "c": null, "s": ["MCA ซีกซ้าย — Wernicke aphasia", "MCA ซีกซ้าย — Broca area", "MCA ซีกซ้าย — Broca aphasia", "Posterior circulation — PCA hemianopia"], "q": [{"q": "A patient speaks in fluent, well-formed sentences at a normal rate, but the content is nonsensical. Which type of aphasia is this?", "a": "Sensory (Wernicke) aphasia — fluent speech with impaired comprehension", "y": [30], "an": "dx", "sub": "MCA ซีกซ้าย — Wernicke aphasia", "t": 128}, {"q": "A patient's speech is fluent, with normal rate and prosody, but is often meaningless (word salad) with neologisms and paraphasias. Which type of aphasia is this?", "a": "Wernicke's aphasia (sensory / receptive aphasia)", "y": [30], "an": "dx", "sub": "MCA ซีกซ้าย — Wernicke aphasia", "t": 128}, {"q": "A patient speaks fluently in full sentences but the content is meaningless. Which type of aphasia is this?", "a": "Wernicke (receptive) aphasia", "y": [30], "an": "dx", "sub": "MCA ซีกซ้าย — Wernicke aphasia", "t": 128}, {"q": "A right-handed patient understands speech but speaks haltingly in short, effortful phrases with impaired repetition (non-fluent/motor aphasia). Where is the lesion?", "a": "Left inferior frontal gyrus (Broca area)", "y": [30], "an": "dx", "sub": "MCA ซีกซ้าย — Broca area", "t": 128}, {"q": "A 66-year-old man with acute stroke understands and follows spoken commands correctly but produces only a few effortful, halting words. Repetition is impaired. Which type of language disturbance is this?", "a": "Broca's (motor, expressive) aphasia", "y": [32], "an": "dx", "sub": "MCA ซีกซ้าย — Broca aphasia", "t": 128}, {"q": "A patient develops an acute infarction of the right occipital lobe and is found to have a left homonymous hemianopia. Occlusion of which artery best explains this presentation?", "a": "Right posterior cerebral artery (PCA)", "y": [34], "an": "dx", "sub": "Posterior circulation — PCA hemianopia", "t": 129}, {"q": "A patient develops paraesthesia of the LEFT side of the face together with paraesthesia of the RIGHT side of the body. Where is the lesion?", "a": "Left pons", "y": [30], "an": "dx", "sub": "Posterior circulation — crossed sensory pons", "t": 129}, {"q": "A right-handed patient with a stroke has left-sided visual and tactile neglect (extinction on double simultaneous stimulation), dressing apraxia and constructional apraxia. Where is the lesion?", "a": "Right (non-dominant) parietal lobe", "y": [31], "an": "dx", "sub": "MCA ซีกขวา — neglect/apraxia", "t": 129}, {"q": "A 50-year-old man with hypertension and coronary disease woke with headache, dizziness and unsteady gait. He is alert with severe vertigo, BP 175/97 mmHg, bidirectional nystagmus and gait ataxia with normal strength. Non-contrast CT brain is normal. Several hours later he becomes lethargic alternating with agitation, with intractable hiccups and right upper-limb dysmetria. What is the most likely diagnosis?", "a": "Cerebellar infarction", "y": [35], "an": "dx", "sub": "Posterior circulation — cerebellar infarct", "t": 131}]}, {"t": "OCSP (Oxfordshire) classification", "n": 0, "y": [], "w": null, "c": "OCSP ไม่เคยออก — อ่านผ่าน ๆ", "s": [], "q": []}, {"t": "Stroke awareness — BEFAST, การคัดกรอง LVO และภาวะที่เลียนแบบ stroke", "n": 0, "y": [], "w": null, "c": "BEFAST/LVO screening/stroke mimics ยังไม่ออก แต่เป็นเนื้อหาใหม่ อาจถูกนำมาใช้", "s": [], "q": []}, {"t": "TOAST classification — รู้กลไกเพื่อเลือกการป้องกัน", "n": 7, "y": [28, 30, 31, 32, 34], "w": "กลไก stroke จากเบาะแสข้างเตียง: ชีพจรไม่สม่ำเสมอ/AF/flutter/MS/murmur → cardioembolism (4 ข้อ รุ่น 30–32), ICA ตีบ 90% = LAA, lacune = lipohyalinosis", "c": null, "s": ["2. Cardioembolism (AF)", "2. Cardioembolism (valvular)", "2. Cardioembolism (MS + AF)", "2. Cardioembolism (atrial flutter)"], "q": [{"q": "A patient presents with acute left-sided weakness. The pulse rate is 130/min and irregularly irregular. What is the most likely mechanism of the stroke?", "a": "Cardioembolism from atrial fibrillation", "y": [32], "an": "mech", "sub": "2. Cardioembolism (AF)", "t": 125}, {"q": "A patient presents with an acute ischaemic stroke. On physical examination a murmur is heard at the cardiac apex. What is the most likely mechanism of this stroke?", "a": "Cardioembolism from valvular heart disease", "y": [30], "an": "mech", "sub": "2. Cardioembolism (valvular)", "t": 125}, {"q": "A patient with mitral stenosis and atrial fibrillation develops an acute stroke. What is the most likely stroke mechanism?", "a": "Cardioembolic (embolic) infarction", "y": [30], "an": "mech", "sub": "2. Cardioembolism (MS + AF)", "t": 125}, {"q": "An ECG shows atrial flutter and the patient subsequently presents with an acute stroke. What is the most likely mechanism of the stroke?", "a": "Cardioembolism", "y": [31], "an": "mech", "sub": "2. Cardioembolism (atrial flutter)", "t": 125}, {"q": "A patient with acute ischemic stroke is found on vascular imaging to have 90% stenosis of the internal carotid artery ipsilateral to the infarct. How should this stroke be classified by aetiologic (TOAST) subtype?", "a": "Large artery atherosclerosis", "y": [34], "an": "fact", "sub": "1. Large artery atherosclerosis", "t": 125}, {"q": "A 66-year-old man with long-standing uncontrolled hypertension has a pure motor hemiparesis from a 1-cm lacunar infarct in the internal capsule. What is the underlying vascular pathology?", "a": "Lipohyalinosis and microatheroma of small penetrating arteries", "y": [30], "an": "mech", "sub": "3. Small vessel disease — lipohyalinosis", "t": 126}, {"q": "What is the leading underlying cause of ischaemic cerebrovascular disease?", "a": "Atherosclerosis (large-artery and small-vessel disease)", "y": [28], "an": "fact", "sub": "ห้ากลุ่มตาม TOAST — atherosclerosis", "t": 126}]}, {"t": "การประเมิน — เวลาเริ่มอาการ การดูแลเบื้องต้น และ NIHSS", "n": 1, "y": [31], "w": "เครื่องมือวัดความรุนแรง = NIHSS", "c": null, "s": ["NIHSS — มาตรวัดความรุนแรง"], "q": [{"q": "In the initial assessment and management of a patient with acute stroke, which tool should be used to grade the severity of the neurological deficit?", "a": "NIHSS score", "y": [31], "an": "fact", "sub": "NIHSS — มาตรวัดความรุนแรง", "t": 124}]}, {"t": "ภาพถ่ายสมอง — สัญญาณระยะแรกและ ASPECTS", "n": 0, "y": [], "w": null, "c": "early CT sign/ASPECTS ไม่เคยถาม (ไม่มีข้อให้อ่านภาพ CT)", "s": [], "q": []}, {"t": "ยาละลายลิ่มเลือดทางหลอดเลือดดำ (IV thrombolysis)", "n": 1, "y": [31], "w": "มาภายใน 2 ชม. รู้สึกตัวดี → IV rt-PA", "c": null, "s": ["ข้อบ่งชี้และหน้าต่างเวลา"], "q": [{"q": "A patient with acute stroke arrives 2 hours after symptom onset and is fully conscious. Which drug should be given?", "a": "Intravenous rt-PA (alteplase)", "y": [31], "an": "mx", "sub": "ข้อบ่งชี้และหน้าต่างเวลา", "t": 124}]}, {"t": "การลากลิ่มเลือด การดูแลทั่วไป และการป้องกันการเป็นซ้ำ", "n": 2, "y": [31, 32, 35], "w": "AF + INR 1.8 + 1 ชม. → ห้าม tPA → ส่ง thrombectomy (รุ่น 32,35); aspirin ป้องกันซ้ำใน non-cardioembolic", "c": null, "s": ["Mechanical thrombectomy (INR>1.7 ห้าม tPA)", "การป้องกันการเป็นซ้ำ — aspirin"], "q": [{"q": "A 67-year-old woman with diabetes and atrial fibrillation presents with left body weakness and dysarthria. The onset was sudden while she was brushing her teeth 1 hour ago, and she was brought immediately to the ER. Her medications are metformin and warfarin. On examination: pulse 110/min irregular, BP 205/95 mmHg. There is left-sided neglect with dysarthria, and weakness of the left body with the face and upper extremity worse than the lower extremity. Routine chemistries and CBC are normal except INR 1.8. Non-contrast CT brain shows no haemorrhage. Which of the following is the most appropriate treatment?", "a": "Call a vascular surgery consult for possible endovascular intervention.", "y": [32, 35], "an": "mx", "sub": "Mechanical thrombectomy (INR>1.7 ห้าม tPA)", "t": 124}, {"q": "Which drug is the standard choice for secondary prevention in a patient who has had a non-cardioembolic ischaemic stroke?", "a": "Aspirin", "y": [31], "an": "mx", "sub": "การป้องกันการเป็นซ้ำ — aspirin", "t": 124}]}], "th": [129, 128, 125, 126, 124]}, {"lec": "23/9", "title": "Epilepsy — จำแนก วินิจฉัย และเลือกยาให้ตรงชนิดการชัก", "n": 8, "angle": {"mech": 2, "fact": 2, "ix": 2, "mx": 2}, "pattern": "ถามน้อยและกระจาย — ส่วนใหญ่เป็นข้อ fact/mech สั้น (GABA, EEG) และเลือกยาตามชนิดชัก รุ่น 30 เป็นหลัก; การรักษา status epilepticus (IV lorazepam/diazepam, intubate) ถูกถามซ้ำ 3 ข้อแต่ไม่มีหัวข้อในคาบนี้", "tip": "จับคู่ยากับชนิดชัก (absence → ethosuximide, ตั้งครรภ์ → LEV/LTG, VPA teratogen) และ EEG/MRI ให้แม่น; เสริม algorithm status epilepticus (ABC → IV benzodiazepine → phenytoin/levetiracetam) เอง", "secs": [{"t": "ชัก ≠ โรคลมชัก — เริ่มที่นิยามให้ถูกก่อน", "n": 2, "y": [31, 34], "w": "กลไกชัก: glutamate ↑ GABA ↓ / GABA เป็น inhibitory transmitter หลัก (รุ่น 31,34)", "c": null, "s": ["กลไก — GABA ยับยั้ง", "กลไก — glutamate ↑ GABA ↓"], "q": [{"q": "Which neurotransmitter is the main inhibitory transmitter of the CNS and therefore acts to suppress (prevent) seizure activity?", "a": "GABA (gamma-aminobutyric acid)", "y": [31], "an": "mech", "sub": "กลไก — GABA ยับยั้ง", "t": 160}, {"q": "At the neuronal level, which imbalance underlies the generation of an epileptic seizure?", "a": "Increased glutamatergic excitation with decreased GABAergic inhibition", "y": [34], "an": "mech", "sub": "กลไก — glutamate ↑ GABA ↓", "t": 160}]}, {"t": "แยกจากภาวะที่เหมือนชัก (seizure mimics)", "n": 0, "y": [], "w": null, "c": "seizure mimics (syncope/PNES) ยังไม่ออก แต่เป็นหลักการแยกโรคที่ออกเป็น vignette ได้ง่าย", "s": [], "q": []}, {"t": "การจำแนกอาการชัก — focal, generalized, unknown", "n": 1, "y": [31], "w": "ซักประวัติคนชัก — ถามเวลาตื่น/ฟื้น", "c": null, "s": ["สิ่งที่ต้องถามเมื่อซักประวัติคนชัก"], "q": [{"q": "A patient is brought to the emergency department after a sudden seizure. Which piece of history is most important to ask about?", "a": "Wake-up time (the time the patient woke up / regained consciousness)", "y": [31], "an": "fact", "sub": "สิ่งที่ต้องถามเมื่อซักประวัติคนชัก", "t": 159}]}, {"t": "Focal onset — อาการบอกตำแหน่งรอยโรค", "n": 1, "y": [30], "w": "Jacksonian march → focal aware ลามเป็น bilateral tonic-clonic", "c": null, "s": ["การลามเป็นสองซีก (focal → bilateral TC)"], "q": [{"q": "A patient has jerking that begins in one part of the limb and marches up the same arm, and then evolves into a whole-body convulsion. What is this seizure type called?", "a": "Focal aware seizure evolving to a bilateral tonic–clonic (generalised) seizure", "y": [30], "an": "fact", "sub": "การลามเป็นสองซีก (focal → bilateral TC)", "t": 159}]}, {"t": "Generalized onset — ชักหกชนิดที่ต้องแยกให้ออก", "n": 0, "y": [], "w": null, "c": "ชักหกชนิด generalized ยังไม่ถามตรง แต่จำเป็นต่อการเลือกยา", "s": [], "q": []}, {"t": "Epilepsy syndrome — ทำไมต้องแยกให้ได้", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "สามกลุ่มอาการที่ต้องรู้จัก — SeLECTS, CAE, JME", "n": 0, "y": [], "w": null, "c": "SeLECTS/CAE/JME ไม่ถามชื่อ syndrome แต่ CAE แฝงในโจทย์ ethosuximide", "s": [], "q": []}, {"t": "DEEs — Dravet และ Lennox-Gastaut", "n": 0, "y": [], "w": null, "c": "Dravet/LGS — ระดับเด็ก ไม่เคยออก", "s": [], "q": []}, {"t": "การสืบค้น — EEG, MRI และการหาสาเหตุ", "n": 2, "y": [30, 32], "w": "EEG ใช้สนับสนุนการวินิจฉัยและจำแนกชนิดชัก/ประเมินความเสี่ยงชักซ้ำ", "c": null, "s": ["EEG", "EEG — classify + recurrence risk"], "q": [{"q": "Which of the following investigations is used to support the diagnosis of seizure?", "a": "Electroencephalography (EEG)", "y": [30], "an": "ix", "sub": "EEG", "t": 159}, {"q": "A 25-year-old woman had a focal seizure with impaired awareness that evolved into a generalised tonic-clonic seizure. Glucose and electrolytes are normal and she has no fever. Besides brain MRI, which investigation is most useful to classify the seizure and estimate the risk of recurrence?", "a": "Electroencephalography (EEG)", "y": [32], "an": "ix", "sub": "EEG — classify + recurrence risk", "t": 159}]}, {"t": "เลือกยากันชักให้ตรงชนิดการชัก", "n": 2, "y": [30], "w": "เลือกยา: absence 3 Hz → ethosuximide; หญิงวางแผนตั้งครรภ์ → levetiracetam/lamotrigine (หลีกเลี่ยง VPA) รุ่น 30", "c": null, "s": ["แนวทางตามหลักฐาน — absence: ethosuximide", "สิ่งที่กำหนดการเลือกยา — ตั้งครรภ์ (LEV/LTG)"], "q": [{"q": "A 9-year-old girl has many daily brief staring spells with 3-Hz spike-and-wave on EEG and no other seizure types. What is the first-line drug?", "a": "Ethosuximide", "y": [30], "an": "mx", "sub": "แนวทางตามหลักฐาน — absence: ethosuximide", "t": 161}, {"q": "A 26-year-old woman with focal epilepsy is planning pregnancy. Which antiseizure medication is preferred because of its lower teratogenic risk?", "a": "Levetiracetam (or lamotrigine)", "y": [30], "an": "mx", "sub": "สิ่งที่กำหนดการเลือกยา — ตั้งครรภ์ (LEV/LTG)", "t": 161}]}, {"t": "เมื่อยาตัวแรกไม่ได้ผล — คัดกรอง pseudoresistance ก่อนเสมอ", "n": 0, "y": [], "w": null, "c": "pseudoresistance ไม่เคยออก", "s": [], "q": []}, {"t": "ดื้อยา การรักษาที่ไม่ใช่ยา และ SUDEP", "n": 0, "y": [], "w": null, "c": "SUDEP/ketogenic/VNS ไม่เคยออก", "s": [], "q": []}], "th": [160, 159, 161]}, {"lec": "15/10", "title": "CNS infection และการแปลผลน้ำไขสันหลัง", "n": 23, "angle": {"mech": 1, "dx": 2, "ix": 5, "interp": 4, "mx": 11}, "pattern": "เป็นคาบที่ถูกถามมากที่สุดในกลุ่ม neuro เน้น mx (เลือกยาจาก Gram stain/ประวัติสัมผัส) และ ix (CT ก่อน LP) โจทย์สั้นซ้ำกันเกือบคำต่อคำในรุ่น 30–32; รุ่นหลังเปลี่ยนเป็น vignette ยาวขึ้น (ลาบดิบ+หูดับ, Listeria จาก steroid). eosinophilic meningitis (Angiostrongylus จากหอยโข่ง) ถามซ้ำ 4–5 รุ่นแต่ไม่มีในตาราง CSF ของ learn", "tip": "ท่อง: ceftriaxone ± ampicillin (Listeria) ± dexamethasone, IV acyclovir ใน frontotemporal lesion, เกณฑ์ CT ก่อน LP และตาราง CSF สี่กลุ่ม + eosinophilic (Angiostrongylus cantonensis — เขียนชื่อเต็มให้ถูก) และ chemoprophylaxis meningococcus (ciprofloxacin 500 mg ครั้งเดียว)", "secs": [{"t": "CNS infection — เชื้อเข้าสมองได้อย่างไร", "n": 1, "y": [30], "w": "เส้นทางเข้าสู่ meninges ส่วนใหญ่ = hematogenous จาก nasopharynx", "c": null, "s": ["สามเส้นทางเข้าสู่ CNS — hematogenous"], "q": [{"q": "In most cases of bacterial meningitis, by which route does the pathogen reach the meninges?", "a": "Haematogenous spread — nasopharyngeal invasion leading to bacteraemia and crossing of the blood–brain barrier", "y": [30], "an": "mech", "sub": "สามเส้นทางเข้าสู่ CNS — hematogenous", "t": 148}]}, {"t": "Meningitis — อาการและการสืบค้น", "n": 6, "y": [30, 31, 32], "w": "CT ก่อน LP เมื่อ papilledema/focal deficit/HIV/ชักใหม่; ไข้+คอแข็ง+purpura = N. meningitidis", "c": null, "s": ["อาการและอาการแสดง — purpura = meningococcus", "เมื่อไรต้องทำ CT ก่อนเจาะหลัง", "เมื่อไรต้องทำ CT ก่อนเจาะหลัง — ภูมิคุ้มกันบกพร่อง", "CT ก่อน LP — ภูมิคุ้มกันบกพร่อง/ชักใหม่"], "q": [{"q": "A febrile, drowsy patient has a positive stiff neck and hemorrhagic purpura scattered over the trunk and limbs. Which organism is the most likely cause?", "a": "Neisseria meningitidis", "y": [32], "an": "dx", "sub": "อาการและอาการแสดง — purpura = meningococcus", "t": 148}, {"q": "A febrile patient develops hemorrhagic purpura on the legs and feet. Which organism is the most likely cause?", "a": "Neisseria meningitidis", "y": [30], "an": "dx", "sub": "อาการและอาการแสดง — purpura = meningococcus", "t": 148}, {"q": "A patient has signs of raised intracranial pressure with neck stiffness and papilloedema. What should be done before lumbar puncture?", "a": "Non-contrast CT brain", "y": [31], "an": "ix", "sub": "เมื่อไรต้องทำ CT ก่อนเจาะหลัง", "t": 150}, {"q": "A patient presents with a meningitis-like syndrome (fever, headache, neck stiffness) but is also found to have a focal neurological deficit. What should be done?", "a": "Obtain a non-contrast CT brain before performing lumbar puncture", "y": [31], "an": "ix", "sub": "เมื่อไรต้องทำ CT ก่อนเจาะหลัง", "t": 150}, {"q": "A patient with known HIV infection presents with fever and headache, and neck stiffness is positive on examination. Which investigation should be obtained first?", "a": "Non-contrast CT of the brain before lumbar puncture", "y": [32], "an": "ix", "sub": "เมื่อไรต้องทำ CT ก่อนเจาะหลัง — ภูมิคุ้มกันบกพร่อง", "t": 206}, {"q": "An HIV-infected patient presents with a new seizure and has no focal neurological deficit. What should be done next?", "a": "CT brain", "y": [31], "an": "ix", "sub": "CT ก่อน LP — ภูมิคุ้มกันบกพร่อง/ชักใหม่", "t": 206}]}, {"t": "CSF interpretation — ตารางที่ต้องจำให้ขึ้นใจ", "n": 2, "y": [31, 34], "w": "อ่าน CSF: lymphocyte โปรตีนสูง น้ำตาลต่ำ = TB; lymphocyte น้ำตาลปกติ → acyclovir", "c": null, "s": ["ตารางแยกสี่กลุ่ม — viral", "ตารางแยกสี่กลุ่ม — TB"], "q": [{"q": "CSF examination shows opening pressure 18 cmH2O, glucose 60 mg/dL, protein 45 mg/dL, and a white cell count with 85% lymphocytes. Which treatment is most appropriate?", "a": "Acyclovir", "y": [34], "an": "interp", "sub": "ตารางแยกสี่กลุ่ม — viral", "t": 149}, {"q": "CSF analysis shows a lymphocyte-predominant pleocytosis with high protein and low glucose. Which diagnosis is most likely?", "a": "Tuberculous meningitis", "y": [31], "an": "interp", "sub": "ตารางแยกสี่กลุ่ม — TB", "t": 151}]}, {"t": "Bacterial meningitis — ภาวะฉุกเฉินทางระบบประสาท", "n": 7, "y": [30, 31, 32], "w": "Gram stain GPC/สัมผัสหมู/กินลาบดิบ (S. suis) → ceftriaxone ถามซ้ำ 5 ข้อรุ่น 30–32; ผู้สูงอายุ/steroid/CKD → เพิ่ม ampicillin คลุม Listeria", "c": null, "s": ["แนวทางเชิงปฏิบัติ — S. suis ceftriaxone", "กลุ่มเสี่ยงต้องครอบคลุม Listeria — ampicillin", "แนวทางเชิงปฏิบัติ — ceftriaxone", "แนวทางเชิงปฏิบัติ — empirical ceftriaxone"], "q": [{"q": "A Gram stain of cerebrospinal fluid from a patient with a central nervous system infection is shown and reported as Gram-positive diplococci. Which antibiotic should be given?", "a": "Intravenous ceftriaxone", "y": [31], "an": "mx", "sub": "แนวทางเชิงปฏิบัติ — ceftriaxone", "t": 147}, {"q": "A patient with a history of contact with pigs presents with fever and neck stiffness. CSF Gram stain shows gram-positive cocci. Which antibiotic should be given?", "a": "Ceftriaxone intravenously", "y": [31], "an": "mx", "sub": "แนวทางเชิงปฏิบัติ — S. suis ceftriaxone", "t": 147}, {"q": "A patient with a history of pig contact presents with fever and a positive stiff neck sign. CSF Gram stain shows gram-positive cocci. Which antibiotic should be given?", "a": "Ceftriaxone", "y": [32], "an": "mx", "sub": "แนวทางเชิงปฏิบัติ — S. suis ceftriaxone", "t": 147}, {"q": "CSF examination shows 500 WBC/mm3 and organisms are seen on Gram stain. Which antibiotic is the most appropriate empirical treatment?", "a": "Ceftriaxone", "y": [30], "an": "mx", "sub": "แนวทางเชิงปฏิบัติ — empirical ceftriaxone", "t": 147}, {"q": "A 55-year-old man who ate a raw pork dish (larb) 2 days ago has fever, severe headache, stiff neck and new bilateral hearing loss. CSF Gram stain shows gram-positive cocci in pairs and short chains. What is the most appropriate antibiotic?", "a": "Intravenous ceftriaxone (or high-dose penicillin G)", "y": [32], "an": "mx", "sub": "S. suis (larb) — ceftriaxone", "t": 147}, {"q": "A 72-year-old man on long-term prednisolone has fever, headache and neck stiffness. CSF Gram stain shows short gram-positive rods and culture grows Listeria monocytogenes. Which antibiotic is the drug of choice?", "a": "Intravenous ampicillin (or penicillin G), with or without gentamicin", "y": [32], "an": "mx", "sub": "กลุ่มเสี่ยงต้องครอบคลุม Listeria — ampicillin", "t": 147}, {"q": "A 60-year-old woman with diabetes and CKD stage 5 develops fever, neck stiffness and progressive confusion after eating refrigerated ready-to-eat foods for several days. Which pathogen must be covered, and with which antibiotic added to ceftriaxone?", "a": "Listeria monocytogenes; ampicillin", "y": [], "an": "mx", "sub": "กลุ่มเสี่ยงต้องครอบคลุม Listeria — ampicillin", "t": 147}]}, {"t": "Tuberculous meningitis", "n": 0, "y": [], "w": null, "c": "TB meningitis สูตรยา/steroid/ภาวะแทรกซ้อนไม่เคยถามตรง (ถามแค่อ่าน CSF)", "s": [], "q": []}, {"t": "Encephalitis — เมื่อเนื้อสมองเองอักเสบ", "n": 7, "y": [31, 33, 34], "w": "พฤติกรรมเปลี่ยน + CT hypodensity frontotemporal → IV acyclovir 10 mg/kg q8h ทันที; CSF มี RBC = HSV; ชัก+คอแข็ง → HSV PCR (รุ่น 31,33,34)", "c": null, "s": ["การรักษา — IV acyclovir", "การสืบค้น — CSF มี RBC", "การสืบค้น — HSV PCR", "การรักษา — acyclovir 10 mg/kg q8h"], "q": [{"q": "A patient is brought in with altered behaviour (personality/behavioural change). Non-contrast CT of the brain shows hypodensity of the frontotemporal lobe. Which treatment should be started immediately?", "a": "Intravenous acyclovir", "y": [31], "an": "mx", "sub": "การรักษา — IV acyclovir", "t": 149}, {"q": "A patient is brought in with progressive behavioral change and confusion. CT of the brain shows hypodensity in the frontotemporal region, and CSF examination shows a normal glucose level. Which treatment should be started immediately?", "a": "Intravenous acyclovir", "y": [33], "an": "mx", "sub": "การรักษา — IV acyclovir", "t": 149}, {"q": "A patient is brought in with seizures and is found to have neck stiffness. Which investigation will establish the most likely treatable cause?", "a": "CSF PCR for herpes simplex virus", "y": [31], "an": "ix", "sub": "การสืบค้น — HSV PCR", "t": 149}, {"q": "A patient presents with alteration of consciousness. Lumbar puncture shows a CSF with a few red blood cells. What is the most likely diagnosis?", "a": "Herpes simplex meningoencephalitis", "y": [31], "an": "interp", "sub": "การสืบค้น — CSF มี RBC", "t": 149}, {"q": "A patient presents with alteration of consciousness. Lumbar puncture shows cerebrospinal fluid containing a few red blood cells. Which of the following is the MOST likely diagnosis?", "a": "Herpes simplex meningoencephalitis", "y": [31], "an": "interp", "sub": "การสืบค้น — CSF มี RBC", "t": 149}, {"q": "A patient presents with fever and behavioural/personality change. CT brain shows hypodensity at the frontotemporal lobe. Which treatment should be started?", "a": "IV acyclovir 10 mg/kg every 8 hours", "y": [31], "an": "mx", "sub": "การรักษา — acyclovir 10 mg/kg q8h", "t": 149}, {"q": "A patient's CT brain shows a lesion involving the fronto-temporal lobe. Which drug should be given?", "a": "Intravenous acyclovir", "y": [34], "an": "mx", "sub": "HSV ที่ frontotemporal → acyclovir", "t": 149}]}, {"t": "Brain abscess — ระยะ เชื้อ และภาพ", "n": 0, "y": [], "w": null, "c": "brain abscess ระยะ/เชื้อ/ring enhancement ไม่เคยออก", "s": [], "q": []}, {"t": "Brain abscess — การรักษา", "n": 0, "y": [], "w": null, "c": "การรักษา brain abscess และ toxoplasmosis ไม่เคยออก", "s": [], "q": []}, {"t": "Spine และ spinal cord infection", "n": 0, "y": [], "w": null, "c": "spinal epidural abscess/spondylodiscitis ไม่เคยออก — เนื้อหาใหม่", "s": [], "q": []}], "th": [148, 150, 151, 147, 149]}, {"lec": "9/10", "title": "หัตถการ: Lumbar puncture และการตรวจตาทางระบบประสาท", "n": 4, "angle": {"ix": 1, "fact": 2, "interp": 1}, "pattern": "ถามน้อย (4 ข้อ) เน้น fact เรื่องข้อห้าม LP และข้อบ่งชี้ ซ้อนทับกับคาบ CNS infection; ส่วนตรวจตา (Snellen/fundoscopy) ไม่เคยออกข้อเขียน", "tip": "จำข้อห้าม LP (mass effect, เกล็ดเลือดต่ำ, ติดเชื้อผิวหนังตำแหน่งเจาะ) และ CSF ในโรคอักเสบ (GBS, SAH xanthochromia) ก็พอ; ส่วนหัตถการ/ตรวจตาอ่านเพื่อ OSCE", "secs": [{"t": "ข้อบ่งชี้ของการเจาะหลัง", "n": 1, "y": [34], "w": "CT เห็น leptomeningeal enhancement → ทำ LP เพื่อวินิจฉัย", "c": null, "s": ["เพื่อวินิจฉัย — leptomeningeal disease"], "q": [{"q": "CT brain of a patient shows a leptomeningeal lesion with leptomeningeal enhancement. Which investigation is most appropriate next to establish the diagnosis?", "a": "Lumbar puncture for CSF analysis", "y": [34], "an": "ix", "sub": "เพื่อวินิจฉัย — leptomeningeal disease", "t": 150}]}, {"t": "ข้อห้ามและเทคนิคที่ลดภาวะแทรกซ้อน", "n": 2, "y": [30], "w": "ข้อห้าม LP: ภาพสมองมี mass + midline shift/basal cistern effacement (รุ่น 30 สองข้อ)", "c": null, "s": ["ข้อห้าม — mass + midline shift"], "q": [{"q": "A patient with suspected meningitis has a CT brain performed before lumbar puncture. Which CT finding is a contraindication to performing the LP?", "a": "Midline shift with effacement of the basal cisterns from a mass lesion", "y": [30], "an": "fact", "sub": "ข้อห้าม — mass + midline shift", "t": 150}, {"q": "Based on the history and physical examination, which of the following is a contraindication to lumbar puncture?", "a": "Brain imaging showing midline shift from a mass lesion", "y": [30], "an": "fact", "sub": "ข้อห้าม — mass + midline shift", "t": 150}]}, {"t": "ภาวะแทรกซ้อนของการเจาะหลัง", "n": 0, "y": [], "w": null, "c": "post-LP headache/herniation ไม่เคยออก", "s": [], "q": []}, {"t": "สิ่งที่ต้องส่งตรวจจากน้ำไขสันหลัง", "n": 0, "y": [], "w": null, "c": "รายการส่งตรวจ CSF ไม่เคยถามตรง", "s": [], "q": []}, {"t": "การตรวจสายตา — Snellen, pinhole และ near chart", "n": 0, "y": [], "w": null, "c": "Snellen/pinhole ไม่เคยออกในข้อเขียน (น่าจะสอบ OSCE)", "s": [], "q": []}, {"t": "Fundoscopy — สิ่งที่ต้องดูให้เป็น", "n": 0, "y": [], "w": null, "c": "fundoscopy/papilledema ไม่ถามตรง แต่ papilledema เป็นเบาะแสในโจทย์ CVST/CT ก่อน LP", "s": [], "q": []}, {"t": "สไลด์ อ.ปองปวีณ์ — ข้อบ่งชี้ ข้อห้าม และตัวเลขที่ต้องจำ", "n": 0, "y": [], "w": null, "c": "ตัวเลขเกล็ดเลือด/heparin ก่อน LP ยังไม่ออก — ใหม่ตาม handout อ.ปองปวีณ์", "s": [], "q": []}, {"t": "สไลด์ อ.ปองปวีณ์ — อุปกรณ์ ท่า เทคนิค และภาวะแทรกซ้อน", "n": 0, "y": [], "w": null, "c": "อุปกรณ์/ท่า/ชั้นที่เข็มผ่าน — เนื้อหาหัตถการ ไม่ออกข้อเขียน", "s": [], "q": []}, {"t": "สไลด์ อ.ปองปวีณ์ — แปลผล CSF: ค่าปกติ meningitis สี่แบบ โรคอักเสบ และเลือดปน", "n": 1, "y": [28], "w": "CSF protein 180 เซลล์ 2 หลังท้องเสีย = GBS (albuminocytologic dissociation)", "c": null, "s": ["CSF ในโรคอักเสบ — GBS albuminocytologic"], "q": [{"q": "A 35-year-old man has progressive ascending symmetric limb weakness with areflexia 10 days after diarrhoea; sensation is largely intact. CSF shows protein 180 mg/dL with 2 cells/mm3. What is the diagnosis?", "a": "Guillain–Barré syndrome (albuminocytological dissociation)", "y": [28], "an": "interp", "sub": "CSF ในโรคอักเสบ — GBS albuminocytologic", "t": 138}]}], "th": []}, {"lec": "21/10", "title": "Acute confusional state และภาวะการรู้สึกตัวเปลี่ยนแปลง", "n": 18, "angle": {"fact": 8, "mx": 5, "dx": 1, "mech": 3, "interp": 1}, "pattern": "เน้น fact ที่คำนวณ/จำได้ตรง (GCS, สาเหตุ metabolic) และ toxidrome จากรูม่านตา เป็นโจทย์สั้นซ้ำกันหลายรุ่น (31–32 มากสุด); delirium ถามแค่ข้อการจัดการผู้สูงอายุหลังผ่าตัดและถอนสุรา. organophosphate (muscarinic vs nicotinic, atropine) ถูกถามแต่ learn มีแค่ชื่อ", "tip": "ฝึกคิด GCS ให้เร็ว (โดยเฉพาะ M2 extension vs M3 flexion), จำ pupil → ระดับรอยโรค/สารพิษ (opioid, organophosphate, cocaine/TCA), สาเหตุ metabolic ที่ทำให้ซึม และหลักไม่ใช้ restraint/benzo ใน delirium", "secs": [{"t": "กายวิภาคของความรู้สึกตัว และรอยโรคที่ทำให้โคม่า", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ระดับความรู้สึกตัว และภาวะที่เลียนแบบโคม่า", "n": 1, "y": [31], "w": null, "c": null, "s": ["สี่ระดับ — coma"], "q": [{"q": "A patient brought in after a head injury does not open his eyes and makes no sounds; on deep painful stimulation he shows only extensor posturing of the arms. Which term best describes his level of consciousness?", "a": "Coma", "y": [31], "an": "fact", "sub": "สี่ระดับ — coma", "t": 153}]}, {"t": "Glasgow Coma Scale และข้อจำกัดที่สไลด์ชี้ไว้", "n": 4, "y": [31, 32, 34], "w": "คิด GCS: ไม่ลืมตา ไม่ส่งเสียง แขนเหยียด = E1V1M2 = 4 (ถาม 4 ข้อรุ่น 31,32,34)", "c": null, "s": ["ตารางคะแนน — M2 extension", "ตารางคะแนน GCS = 3"], "q": [{"q": "A patient does not open his eyes, makes no motor response to pain, and makes no sound. What is his Glasgow Coma Scale score?", "a": "3 (E1 V1 M1)", "y": [34], "an": "fact", "sub": "ตารางคะแนน GCS = 3", "t": 153}, {"q": "A patient shows extension of both arms in response to pain, does not open his eyes, and makes no verbal response. What is his Glasgow Coma Scale score?", "a": "E1V1M2 = GCS 4", "y": [32], "an": "fact", "sub": "ตารางคะแนน — M2 extension", "t": 153}, {"q": "A patient does not speak and does not open the eyes; on painful stimulation the arms extend. What is this patient's Glasgow Coma Scale score?", "a": "GCS 4", "y": [31], "an": "fact", "sub": "ตารางคะแนน — M2 extension", "t": 153}, {"q": "A patient with a head injury does not open his eyes to pain, makes no verbal sounds, and shows extension of both arms to a painful stimulus. What is his Glasgow Coma Scale score?", "a": "4 (E1 V1 M2)", "y": [32], "an": "fact", "sub": "ตารางคะแนน — M2 extension", "t": 153}]}, {"t": "FOUR Score — เครื่องมือที่ออกแบบมาแก้จุดบอดของ GCS", "n": 0, "y": [], "w": null, "c": "FOUR score ไม่เคยออก — ของใหม่ในสไลด์", "s": [], "q": []}, {"t": "ขั้นที่ 1–2: ทำให้คงที่ก่อน แล้วประเมินแรกรับ", "n": 2, "y": [31, 32], "w": "ประวัติที่สำคัญน้อยสุดในคนหมดสติ = family history; ชักแล้ว GCS 5 → intubate ก่อน", "c": null, "s": ["ขั้นที่ 2 — INITIAL ASSESSMENT (ประวัติ)", "STABILIZE FIRST (ABC) — intubate GCS 5"], "q": [{"q": "A patient is brought in unconscious. Which item of history is the LEAST important?", "a": "Family history", "y": [32], "an": "fact", "sub": "ขั้นที่ 2 — INITIAL ASSESSMENT (ประวัติ)", "t": 156}, {"q": "A patient has a focal seizure that secondarily generalises and is then brought in unconscious with GCS 5. What should be done first?", "a": "Secure the airway by endotracheal intubation", "y": [31], "an": "mx", "sub": "STABILIZE FIRST (ABC) — intubate GCS 5", "t": 158}]}, {"t": "การตรวจตาและรีเฟล็กซ์ก้านสมองในผู้ป่วยโคม่า", "n": 4, "y": [28, 29, 30, 31, 33], "w": "pinpoint pupil + RR 6 → opioid → naloxone; ยาที่ไม่ทำ miosis = cocaine/amitriptyline (รุ่น 28–33)", "c": null, "s": ["รูม่านตา — pinpoint = pons/opioid", "รูม่านตา — ยาที่ไม่ทำ miosis", "pinpoint pupil → opioid → naloxone", "รูม่านตา — cocaine ไม่ทำ miosis"], "q": [{"q": "A man is found unconscious on a sidewalk and brought to the emergency department. His respiratory rate is 6/min and both pupils are 1 mm. What is the most likely cause?", "a": "Opioid overdose", "y": [33], "an": "dx", "sub": "รูม่านตา — pinpoint = pons/opioid", "t": 154}, {"q": "Which of the following drugs/toxins does NOT cause pinpoint (miotic) pupils?", "a": "Amitriptyline (tricyclic antidepressant)", "y": [30], "an": "mech", "sub": "รูม่านตา — ยาที่ไม่ทำ miosis", "t": 154}, {"q": "A 20-year-old man is found unconscious with pinpoint pupils, RR 6/min and crepitations in both lungs. Which drug class most likely caused this, and what is the antidote?", "a": "Opioid agonist overdose; give naloxone", "y": [28, 29, 30], "an": "mx", "sub": "pinpoint pupil → opioid → naloxone", "t": 154}, {"q": "A young man is brought to the emergency department with an acute drug overdose. Which of the following agents is LEAST likely to cause pinpoint (miotic) pupils?", "a": "Cocaine", "y": [31], "an": "mech", "sub": "รูม่านตา — cocaine ไม่ทำ miosis", "t": 154}]}, {"t": "การกลอกตาในผู้ป่วยโคม่า: ท่าพัก การเคลื่อนไหวเอง Doll's eye และ Cold caloric", "n": 1, "y": [31], "w": null, "c": null, "s": ["Caloric testing (Wernicke encephalopathy)"], "q": [{"q": "A 40-year-old man presents with confusion and inability to walk without support. On examination he is drowsy, disoriented to time, place and person, with horizontal nystagmus, bilateral lateral rectus palsy and truncal ataxia. Which finding would you expect on investigation?", "a": "Abnormal caloric test", "y": [31], "an": "mech", "sub": "Caloric testing (Wernicke encephalopathy)", "t": 142}]}, {"t": "ระบบสั่งการ: Decorticate, Decerebrate และการระบุระดับรอยโรค", "n": 1, "y": [35], "w": "asterixis + ไม่มี focal deficit = diffuse/metabolic encephalopathy (รุ่น 35)", "c": null, "s": ["Asterixis = diffuse/metabolic"], "q": [{"q": "A patient presents with alteration of consciousness. There is no focal neurological deficit, but asterixis is present. Where is the lesion most likely localised?", "a": "Diffuse (bilateral) brain dysfunction, as in metabolic encephalopathy", "y": [35], "an": "interp", "sub": "Asterixis = diffuse/metabolic", "t": 156}]}, {"t": "ขั้นที่ 4: หาสาเหตุด้วยกรอบหกกลุ่ม และการตรวจที่ตรงเป้า", "n": 2, "y": [31], "w": "metabolic cause ที่ไม่ทำให้ซึม = hypokalaemia (2 ข้อรุ่น 31)", "c": null, "s": ["METABOLIC — hypokalemia ไม่ทำซึม"], "q": [{"q": "Which of the following is NOT a cause of alteration of consciousness?", "a": "Hypokalaemia", "y": [31], "an": "fact", "sub": "METABOLIC — hypokalemia ไม่ทำซึม", "t": 156}, {"q": "Which of the following metabolic derangements does NOT by itself cause an alteration of consciousness?", "a": "Hypokalemia", "y": [31], "an": "fact", "sub": "METABOLIC — hypokalemia ไม่ทำซึม", "t": 156}]}, {"t": "ขั้นที่ 5–6: การรักษาจำเพาะ การประคับประคอง และการติดตาม", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Acute confusional state: Confusion เป็นอาการ ไม่ใช่การวินิจฉัย", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ความผิดปกติทางปัญญาใน Delirium ตามที่สไลด์แจกแจง", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "เกณฑ์การวินิจฉัย Delirium และการประเมินข้างเตียงอย่างรวดเร็ว", "n": 0, "y": [], "w": null, "c": "DSM-5/CAM ยังไม่ถามตรง แต่เป็นเกณฑ์วินิจฉัย delirium ที่น่าออก", "s": [], "q": []}, {"t": "สาเหตุของ Delirium: ตาราง Major Causes และ I WATCH DEATH", "n": 0, "y": [], "w": null, "c": "I WATCH DEATH/ยาที่ก่อ delirium ไม่ถามตรง (แต่ใช้ตอบข้อถอนสุรา)", "s": [], "q": []}, {"t": "การดูแล Delirium แบบครบวงจร และเส้นทางการดำเนินโรค", "n": 2, "y": [31, 32, 35], "w": "delirium หลังผ่าตัดสะโพก — restraint ไม่ใช่คำตอบที่ถูก; benzodiazepine เฉพาะถอนสุรา", "c": null, "s": ["benzodiazepine เฉพาะภาวะถอนสุรา", "Iatrogenic hazards — restraint"], "q": [{"q": "A patient with chronic heavy alcohol use stops drinking and subsequently becomes delirious (alcohol withdrawal delirium / delirium tremens). Which drug is the treatment of choice?", "a": "Diazepam", "y": [32], "an": "mx", "sub": "benzodiazepine เฉพาะภาวะถอนสุรา", "t": 143}, {"q": "An 85-year-old woman presented with a fall and a fractured hip. She previously lived alone and had hip surgery yesterday. Today she is combative and trying to get out of bed. History and examination are difficult to perform because she fluctuates between falling asleep and shouting. She will listen to you and follow simple commands, but is easily distracted by hospital noises, unable to concentrate, and wants to leave the bed to go home. Which statement about her confusion is NOT correct?", "a": "The best plan for her safety is to restrain her with soft restraints until the confusion resolves.", "y": [31, 35], "an": "mx", "sub": "Iatrogenic hazards — restraint", "t": 157}]}, {"t": "ที่อาจารย์เน้นในคาบ 21 ต.ค. 2026 (handout + Delirium quiz)", "n": 1, "y": [33], "w": null, "c": null, "s": ["Quiz: alcohol withdrawal / DT"], "q": [{"q": "A patient with a history of chronic alcohol drinking stopped drinking 3 days ago and presents with tremor and sweating. Which drug should be given?", "a": "Lorazepam", "y": [33], "an": "mx", "sub": "Quiz: alcohol withdrawal / DT", "t": 143}]}, {"t": "Delirium ตาม handout 2026: นิยาม 3D-CAM สี่ขั้นการดูแล DELIRIUM ยาและยาปฏิชีวนะ", "n": 0, "y": [], "w": null, "c": "3D-CAM/Marcantonio — handout 2026 ใหม่ ยังไม่ถูกทดสอบ", "s": [], "q": []}, {"t": "การนอนพังใน delirium และสารสื่อประสาทของ RAS", "n": 0, "y": [], "w": null, "c": "sleep/RAS neurotransmitter — เชิงกลไก ไม่เคยออก", "s": [], "q": []}, {"t": "ส่วนเติมจาก handout 2026: ระดับความรู้สึกตัว 5 ขั้น เบาะแสจากร่างกาย ตาแนวดิ่ง caloric และ algorithm", "n": 0, "y": [], "w": null, "c": "ระดับความรู้สึกตัว 5 ขั้น/eye movement 7 แบบ — ใหม่ ยังไม่ออก", "s": [], "q": []}], "th": [153, 154, 142, 156, 143, 157]}], "gaps": [{"id": "gap-neuro-03", "set": "neuro", "title": "Headache: migraine, tension-type, SAH และ CVST", "subtitle": "แยก primary headache ออกจาก secondary headache ที่อันตราย พร้อมยารักษาเฉียบพลันและยาป้องกัน", "md": "### หลักคิด: red flags ของ secondary headache\n- **Thunderclap headache** (ปวดถึงสูงสุดภายใน <1 นาที, \"worst headache of my life\") → SAH จนกว่าจะพิสูจน์ได้ว่าไม่ใช่; อื่น ๆ: RCVS, CVST, pituitary apoplexy, arterial dissection\n- ปวดหัวแบบใหม่อายุ >50 ปี, ปวดมากขึ้นเรื่อย ๆ, papilledema, focal deficit, ชัก, ไข้ + คอแข็ง, ปวดตามท่าทาง, ตั้งครรภ์/หลังคลอด/กิน OCP, ภูมิคุ้มกันบกพร่อง\n- **คอแข็งโดยไม่มีไข้** หลังปวดหัวทันที → คิด **SAH** (เลือดระคายเยื่อหุ้มสมอง); มีไข้ → meningitis\n\n### Migraine: กลไกและอาการ\n- **Cortical spreading depression** → aura; การกระตุ้น **trigeminovascular system** → หลั่ง **CGRP** → neurogenic inflammation + vasodilation ของ meningeal vessels → ปวดตุบ ๆ; central sensitization ทำให้ allodynia\n- ICHD-3 (ไม่มี aura): ≥5 ครั้ง นาน **4–72 ชม.** + ≥2 ข้อ (ข้างเดียว, ตุบ ๆ, ปานกลาง-รุนแรง, แย่ลงเมื่อเคลื่อนไหว) + ≥1 ข้อ (คลื่นไส้/อาเจียน หรือ photophobia + phonophobia)\n- **Aura**: อาการทาง visual (zig-zag/fortification spectra, scintillating scotoma) sensory หรือ speech ที่ค่อย ๆ ลาม แต่ละอาการ 5–60 นาที กลับเป็นปกติทั้งหมด แล้วตามด้วยปวดหัว\n- ชอบนอนในห้องมืดเงียบ ต่างจาก cluster headache ที่กระสับกระส่าย\n\n### Migraine: acute (abortive) treatment\n1. ปวดเล็กน้อย-ปานกลาง: paracetamol 1,000 mg หรือ NSAIDs (ibuprofen 400 mg, naproxen 500–550 mg, aspirin 900–1,000 mg) ± antiemetic (metoclopramide 10 mg, domperidone)\n2. ปวดปานกลาง-รุนแรง หรือ NSAID/paracetamol ไม่ได้ผล → **triptan** (migraine-specific) เช่น sumatriptan 50–100 mg, **eletriptan 40 mg** — 5-HT1B/1D agonist: หดหลอดเลือด meningeal + ยับยั้งการหลั่ง CGRP; กินเร็วตั้งแต่เริ่มปวด ซ้ำได้หลัง 2 ชม.\n3. **ข้อห้าม triptan**: CAD, stroke/TIA, PAD, HT ที่คุมไม่ได้, hemiplegic หรือ brainstem aura; ไม่ใช้ร่วม ergotamine ภายใน 24 ชม.\n4. มีข้อห้ามทาง vascular → gepant (ubrogepant, rimegepant) หรือ lasmiditan\n- **Medication overuse headache**: simple analgesic ≥15 วัน/เดือน หรือ triptan/ergot/opioid/combination ≥10 วัน/เดือน นาน >3 เดือน\n\n### Migraine: prophylaxis\n- ข้อบ่งชี้: attack บ่อย (≥4 วัน/เดือน หรือ ≥2 ครั้ง/เดือนที่ทำให้ทำงานไม่ได้), acute treatment ไม่ได้ผล/มีข้อห้าม, เสี่ยง medication overuse, aura นาน\n- โจทย์: **2 ครั้ง/สัปดาห์ ทำงานไม่ได้** → ต้องให้ยาป้องกันทุกวัน เช่น **propranolol**\n\n| ยา | ขนาด | หมายเหตุ |\n|---|---|---|\n| **Propranolol** | 40–160 mg/day | first-line; ห้ามใน asthma, heart block |\n| Flunarizine | 5–10 mg ก่อนนอน | ใช้บ่อยในไทย; ง่วง น้ำหนักขึ้น ซึมเศร้า parkinsonism ในผู้สูงอายุ |\n| Amitriptyline | 10–50 mg ก่อนนอน | เหมาะถ้ามี TTH/นอนไม่หลับ ร่วม |\n| Topiramate | 50–100 mg/day | น้ำหนักลด; teratogenic |\n| Sodium valproate | 500–1,000 mg/day | ห้ามในหญิงวัยเจริญพันธุ์ |\n| Candesartan | 16 mg/day | ทางเลือกในผู้มี HT |\n| Anti-CGRP mAb, onabotulinumtoxinA | | refractory/chronic migraine |\n\n- ประเมินผลหลัง 2–3 เดือน; เป้าหมายลดความถี่ ≥50%\n- Migraine with aura เพิ่มความเสี่ยง ischemic stroke → **ห้าม combined estrogen OCP** (WHO MEC category 4)\n\n### Tension-type headache (TTH)\n- Primary headache ที่พบบ่อยที่สุด; กลไกเกี่ยวกับ pericranial muscle tenderness และ central sensitization, กระตุ้นด้วยความเครียด นอนน้อย ท่าทาง\n- ลักษณะ: **สองข้าง, รัดแน่น/บีบ (pressing/tightening) เหมือนมีแถบรัดรอบศีรษะ (band-like)**, มักเป็นที่ท้ายทอยและต้นคอ, เล็กน้อย-ปานกลาง, ไม่แย่ลงเมื่อเคลื่อนไหว, **ไม่คลื่นไส้อาเจียน** (photophobia หรือ phonophobia ได้อย่างใดอย่างหนึ่ง), นาน 30 นาที–7 วัน\n- แบ่ง: infrequent episodic <1 วัน/เดือน; frequent 1–14 วัน/เดือน; **chronic ≥15 วัน/เดือน นาน >3 เดือน**\n- Acute: paracetamol, ibuprofen 400 mg, aspirin; ระวัง medication overuse\n- **Prevention (frequent/chronic): amitriptyline เริ่ม 10 mg ก่อนนอน** เพิ่มทีละ 10–25 mg ทุก 1–2 สัปดาห์ ถึง 25–75 mg; ทางเลือก mirtazapine, venlafaxine\n- Non-pharmacologic: จัดการความเครียด, CBT, relaxation, กายภาพ/ปรับท่าทาง, ออกกำลังกาย\n\n### Subarachnoid hemorrhage (SAH)\n- ~85% non-traumatic เกิดจาก **ruptured saccular (berry) aneurysm** ที่ circle of Willis: **ACom** พบบ่อยสุด, PCom, MCA bifurcation; risk: HT, สูบบุหรี่, ADPKD, ประวัติครอบครัว\n- อาการ: thunderclap headache, อาเจียน, หมดสติชั่วคราว, **neck stiffness ไม่มีไข้** (เกิดหลังเลือดออกหลายชั่วโมง), photophobia, CN III palsy (PCom aneurysm), subhyaloid hemorrhage\n- วินิจฉัย: **non-contrast CT brain** (sensitivity ~100% ภายใน 6 ชม.) → ถ้าลบแต่ยังสงสัย → **LP: xanthochromia** (ตรวจได้ ≥12 ชม. หลังเริ่มปวด) และ RBC ไม่ลดลงในหลอดหลัง → CTA/DSA หา aneurysm\n- รักษา: ICU, **secure aneurysm เร็ว** (ภายใน 24–72 ชม.) ด้วย endovascular coiling (เลือกก่อนถ้าทำได้) หรือ clipping; ควบคุม SBP <160 mmHg ก่อน secure; **nimodipine 60 mg PO ทุก 4 ชม. × 21 วัน** (ลด delayed cerebral ischemia และ poor outcome)\n\n### SAH: ภาวะแทรกซ้อนตามเวลา\n| เวลา | ภาวะแทรกซ้อน |\n|---|---|\n| 0–24 ชม. | **Rebleeding** (สูงสุดใน 6 ชม.แรก) → secure aneurysm เร็ว |\n| ชั่วโมง–วัน | Acute hydrocephalus → EVD |\n| **วันที่ 3–14 (peak 7–10)** | **Vasospasm / delayed cerebral ischemia (DCI)**: focal deficit ใหม่หรือซึมลง |\n| วันแรก ๆ–สัปดาห์ | Hyponatremia (cerebral salt wasting/SIADH — ไม่จำกัดน้ำ), ชัก, neurogenic stunned myocardium |\n\n- โจทย์: ผ่าตัด ACom aneurysm สำเร็จ 3 วันต่อมามีแขนอ่อนแรงใหม่ → **vasospasm** (ต้อง CT แยก rebleed/hydrocephalus ก่อน); ประเมินด้วย TCD/CTA\n- รักษา DCI: euvolemia, induced hypertension (หลัง secure aneurysm แล้ว), intra-arterial vasodilator หรือ angioplasty; **triple-H p
