scraping", "y": [30], "an": "ix", "sub": "Tinea → KOH ก่อน", "t": 316}, {"q": "A patient applied a topical steroid to a rash; the lesion has since enlarged into a ring (annular) shape with a raised border. What is the most appropriate treatment?", "a": "Topical clotrimazole", "y": [31], "an": "mx", "sub": "Tinea incognito หลังทา steroid → azole", "t": 316}, {"q": "A patient has an itchy, round, erythematous plaque on the trunk with a scaly, raised active border and central clearing. Which bedside investigation is most appropriate to confirm the diagnosis?", "a": "Potassium hydroxide (KOH) preparation of scrapings from the active border", "y": [32], "an": "ix", "sub": "Tinea → KOH จากขอบ", "t": 316}, {"q": "A patient has well-demarcated scaly erythematous plaques over the extensor surfaces of the elbows and knees. What is the most likely diagnosis?", "a": "Psoriasis vulgaris", "y": [30], "an": "dx", "sub": "โรคต้องแยก: psoriasis plaque extensor", "t": 320}]}, {"t": "รักษา eczema — วงจรคัน-เกา บันไดการรักษา ยาพื้น และความแรงของ steroid", "n": 0, "y": [], "w": null, "c": "บันไดรักษา eczema/ความแรง steroid ไม่ถามตรง แต่ใช้ตอบข้อ AD/LP", "s": [], "q": []}, {"t": "Atopic dermatitis และ pityriasis alba", "n": 5, "y": [28, 31, 32, 35], "w": "Atopic dermatitis ผู้ใหญ่จับข้อพับ (antecubital/popliteal) ถามซ้ำ 3 ครั้ง, รักษา TCS + emollient; pityriasis alba = ปื้นซีดขุยที่หน้า", "c": null, "s": ["AD ผู้ใหญ่: flexural", "การรักษา AD: TCS + emollient", "Pityriasis alba"], "q": [{"q": "A patient presents with a chronic, intensely itchy eczematous rash typical of atopic dermatitis. Which treatment is most appropriate?", "a": "Topical corticosteroid together with regular emollient", "y": [32], "an": "mx", "sub": "การรักษา AD: TCS + emollient", "t": 324}, {"q": "In adults with atopic dermatitis, which site is most commonly involved?", "a": "Flexural areas (antecubital and popliteal fossae, neck, wrists)", "y": [31], "an": "fact", "sub": "AD ผู้ใหญ่: flexural", "t": 324}, {"q": "What is the most common site of involvement of atopic dermatitis in adults?", "a": "Flexural areas (antecubital and popliteal fossae, neck)", "y": [35], "an": "fact", "sub": "AD ผู้ใหญ่: flexural", "t": 324}, {"q": "Which site is the characteristic area of involvement of atopic dermatitis in older children and adults?", "a": "Flexural areas (antecubital and popliteal fossae)", "y": [35], "an": "fact", "sub": "AD ผู้ใหญ่: flexural", "t": 324}, {"q": "A patient presents with hypopigmented macules and patches with some scales located on the face. What is the most likely diagnosis?", "a": "Pityriasis alba", "y": [28], "an": "dx", "sub": "Pityriasis alba", "t": 326}]}, {"t": "Seborrheic dermatitis — ผื่นตรงที่ต่อมไขมันมาก", "n": 1, "y": [29], "w": null, "c": null, "s": ["Seb derm → ketoconazole cream"], "q": [{"q": "A patient presents with skin lesions described as poorly demarcated erythematous patches with greasy scaling located at the nasolabial folds. Which of the following topical drugs should be prescribed in this case?", "a": "Ketoconazole cream", "y": [29], "an": "mx", "sub": "Seb derm → ketoconazole cream", "t": 327}]}, {"t": "Eczema ที่ขาผู้สูงอายุ: stasis dermatitis และ xerotic (asteatotic) eczema", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Nummular eczema · prurigo nodularis · lichen simplex chronicus — โรคของวงจรคัน-เกา", "n": 0, "y": [], "w": null, "c": "Nummular/prurigo/LSC ไม่เคยออก — ความสำคัญต่ำ", "s": [], "q": []}, {"t": "Dyshidrosis (pompholyx) และ miliaria — ตุ่มน้ำที่เกี่ยวกับมือ เท้า และเหงื่อ", "n": 3, "y": [28, 35], "w": "Dyshidrosis = deep-seated vesicle ที่ฝ่ามือ/ข้างนิ้ว; miliaria สัมพันธ์อากาศร้อนชื้นเหงื่อมาก", "c": null, "s": ["Dyshidrosis: deep-seated vesicles", "Miliaria: ร้อนชื้นเหงื่อมาก"], "q": [{"q": "Miliaria is most commonly associated with which of the following conditions?", "a": "A hot, humid environment with profuse sweating", "y": [35], "an": "mech", "sub": "Miliaria: ร้อนชื้นเหงื่อมาก", "t": 309}, {"q": "A patient presents with deep-seated vesicles on the lateral aspects of the fingers. What is the most likely diagnosis?", "a": "Dyshidrotic eczema (pompholyx)", "y": [35], "an": "dx", "sub": "Dyshidrosis: deep-seated vesicles", "t": 323}, {"q": "A patient presents with deep-seated vesicles on the palms of the hands and the sides of the fingers. What is the most likely diagnosis?", "a": "Dyshidrosis (dyshidrotic eczema / pompholyx)", "y": [28], "an": "dx", "sub": "Dyshidrosis: deep-seated vesicles", "t": 323}]}, {"t": "Contact dermatitis — irritant (“ระคาย ไม่ใช่แพ้”) vs allergic (type IV)", "n": 5, "y": [31, 35], "w": "ICD: แม่บ้านมือแห้งแตก, alcohol hand rub (ถามซ้ำ 3 ข้อ); ACD จากต่างหู/โลหะ → patch test", "c": null, "s": ["ICD มือแห้งแตกแม่บ้าน", "ACD (type IV) → patch test", "ACD จากโลหะ → patch test", "ICD จาก alcohol hand rub"], "q": [{"q": "A woman with a known seafood allergy develops an itchy, scaly eczematous rash on both earlobes at the sites where her earrings touch the skin. Which test should be used to identify the cause of this rash?", "a": "Patch test", "y": [31], "an": "ix", "sub": "ACD (type IV) → patch test", "t": 177}, {"q": "A patient has contact dermatitis triggered by metal jewellery and also has dyshidrotic eczema flares related to certain foods. Which investigation best confirms the causative allergen?", "a": "Patch test", "y": [35], "an": "ix", "sub": "ACD จากโลหะ → patch test", "t": 177}, {"q": "A housewife presents with dry, cracked skin and painful fissures over the palms and the fingertips. What is the most likely diagnosis?", "a": "Irritant contact dermatitis", "y": [31], "an": "dx", "sub": "ICD มือแห้งแตกแม่บ้าน", "t": 322}, {"q": "A housewife presents with dry, painful fissures over the palms and the tips of her fingers. What is the most likely diagnosis?", "a": "Irritant contact dermatitis", "y": [31], "an": "dx", "sub": "ICD มือแห้งแตกแม่บ้าน", "t": 322}, {"q": "A patient repeatedly applies alcohol hand rub to the hands. The hands become dry and scaly, and vesicles subsequently appear at the same sites. What is the most likely diagnosis?", "a": "Irritant contact dermatitis", "y": [35], "an": "dx", "sub": "ICD จาก alcohol hand rub", "t": 322}]}, {"t": "Urticaria และ angioedema — mast cell, wheal–flare, สาเหตุ และ acute vs chronic", "n": 0, "y": [], "w": null, "c": "Urticaria/angioedema ในบท derm ไม่มีข้อ (ข้อ 6 สัปดาห์ถูกจัดไปบท 08)", "s": [], "q": []}, {"t": "รักษาลมพิษ — antihistamine เป็นแกน บันไดลมพิษเรื้อรัง และ angioedema ที่ทางเดินหายใจ", "n": 0, "y": [], "w": null, "c": "บันไดรักษาลมพิษเรื้อรัง (sgAH 4 เท่า → omalizumab) ยังไม่ทดสอบ", "s": [], "q": []}, {"t": "STD ทางผิวหนัง และ syphilis (1): ระยะของโรคและอาการทางผิว", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Syphilis (2): serology การรักษา Jarisch–Herxheimer และการแจ้งคู่นอน", "n": 0, "y": [], "w": null, "c": "Syphilis serology/BPG ไม่อยู่ในคลังกลุ่มนี้ — น่าจะไปออกในบท ID/STD ต้องอ่าน", "s": [], "q": []}, {"t": "Chancroid · gonorrhoea/DGI · LGV — และการแยกแผลอวัยวะเพศ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Leprosy (Hansen’s disease) — ผื่นชา เส้นประสาทโต และ spectrum ตามภูมิคุ้มกัน", "n": 0, "y": [], "w": null, "c": "Leprosy ไม่ปรากฏในคลังกลุ่มนี้ แต่เป็นโรคไทยที่ออก MEQ/OSCE ได้", "s": [], "q": []}, {"t": "Erythema multiforme vs SJS/TEN — target lesion, ยาต้นเหตุ, HLA, SCORTEN และการดูแล", "n": 1, "y": [30], "w": null, "c": null, "s": ["SJS: atypical flat target + ≥2 mucosae"], "q": [{"q": "A patient develops Stevens–Johnson syndrome 10 days after starting a new drug. Which skin lesion is characteristic?", "a": "Widespread dusky red or purpuric macules and flat atypical targets with blistering, plus erosions of two or more mucosae", "y": [30], "an": "dx", "sub": "SJS: atypical flat target + ≥2 mucosae", "t": 164}]}, {"t": "Panniculitis และ erythema nodosum — nodule กดเจ็บที่หน้าแข้งที่ “ไม่แตก”", "n": 3, "y": [31, 35], "w": "Erythema nodosum: ก้อนกดเจ็บหน้าแข้งในหญิงกิน OCP (ถามซ้ำ 3 ข้อ รุ่น 31, 35)", "c": null, "s": ["Erythema nodosum จาก OCP"], "q": [{"q": "A woman develops tender subcutaneous nodules after taking oral contraceptive pills. What is the most likely diagnosis?", "a": "Erythema nodosum", "y": [35], "an": "dx", "sub": "Erythema nodosum จาก OCP", "t": 308}, {"q": "A woman who has been taking oral contraceptive pills for a long time develops tender nodules on her legs. What is the most likely diagnosis?", "a": "Erythema nodosum", "y": [31], "an": "dx", "sub": "Erythema nodosum จาก OCP", "t": 308}, {"q": "A young woman has been taking combined oral contraceptive pills for a long time and now presents with tender nodular lesions on both shins. What is the most likely diagnosis?", "a": "Erythema nodosum", "y": [31], "an": "dx", "sub": "Erythema nodosum จาก OCP", "t": 308}]}], "th": [315, 325, 316, 320, 324, 326, 327, 323, 309, 322, 177, 308]}, {"lec": "26/10", "title": "Skin infection — การติดเชื้อที่ผิวหนัง", "n": 16, "angle": {"dx": 8, "mx": 2, "interp": 1, "mech": 1, "ix": 3, "fact": 1}, "pattern": "เกือบครึ่งของข้อในบทนี้คือ herpes zoster ในรูป spot dx จากภาพ/คำบรรยาย แล้วถามต่อ 'ตรวจอะไรยืนยัน' (Tzanck) หรือ 'รักษาอะไร' (acyclovir) วนซ้ำทุกรุ่น ส่วนแบคทีเรียผิวหนังถามแบบ spot dx คำศัพท์เดียว (honey crust, ขอบคม, coral-red)", "tip": "VZV/HSV ต้องได้เต็ม: ภาพ dermatomal vesicle, Tzanck, acyclovir, HZO-Hutchinson; จากนั้นจำคำศัพท์คู่โรคของแบคทีเรีย (impetigo, erysipelas vs cellulitis, erythrasma coral-red) และ necrotizing fasciitis", "secs": [{"t": "เข้าหาคนไข้ติดเชื้อผิวหนัง — ถามสามคำถามก่อนตั้งชื่อโรค", "n": 0, "y": [], "w": null, "c": "กรอบการจำแนกติดเชื้อผิวหนัง ไม่ถาม", "s": [], "q": []}, {"t": "Impetigo และ ecthyma — ตื้นแล้วไม่เป็นแผลเป็น ลึกแล้วเป็น", "n": 1, "y": [32], "w": "Impetigo: honey-coloured crust", "c": null, "s": ["Impetigo: honey-coloured crust"], "q": [{"q": "A patient presents with multiple small vesicles and pustules covered by honey-coloured crusts. What is the most likely diagnosis?", "a": "Impetigo contagiosa", "y": [32], "an": "dx", "sub": "Impetigo: honey-coloured crust", "t": 321}]}, {"t": "Erysipelas · cellulitis · lymphangitis — ตระกูลเดียวกันที่ต่างความลึก", "n": 1, "y": [33], "w": "Erysipelas: ปื้นแดงสดขอบคมยกนูน + ไข้", "c": null, "s": ["Erysipelas: ขอบคมยกนูน"], "q": [{"q": "A diabetic patient presents with fever and a bright red, raised skin plaque with a sharply demarcated border. What is the most likely diagnosis?", "a": "Erysipelas", "y": [33], "an": "dx", "sub": "Erysipelas: ขอบคมยกนูน", "t": 321}]}, {"t": "Cellulitis ที่ไม่ใช่แบคทีเรียธรรมดา — fungal · TB · NTM", "n": 0, "y": [], "w": null, "c": "Fungal/TB/NTM cellulitis ไม่เคยถาม", "s": [], "q": []}, {"t": "Abscess และ infective panniculitis — คลำได้นุ่มคือเส้นแบ่งการรักษา", "n": 1, "y": [31], "w": "Infective panniculitis (neutrophil ใน fat lobule) → ให้ยาปฏิชีวนะ", "c": null, "s": ["Infective panniculitis (lobular neutrophil) → ATB"], "q": [{"q": "A patient has multiple nodules on the leg. Biopsy shows fat lobules infiltrated by numerous neutrophils. What should be done next?", "a": "Start systemic antibiotics (e.g. penicillin)", "y": [31], "an": "mx", "sub": "Infective panniculitis (lobular neutrophil) → ATB", "t": 308}]}, {"t": "Folliculitis → furuncle → carbuncle — เรื่องเดียวกันที่ลึกขึ้น", "n": 0, "y": [], "w": null, "c": "Folliculitis→furuncle→carbuncle ยังไม่ทดสอบ — ศัพท์ง่าย", "s": [], "q": []}, {"t": "Necrotizing fasciitis — โรคที่แพ้ที่เวลา ไม่ใช่ที่ยา", "n": 0, "y": [], "w": null, "c": "Necrotizing fasciitis (pain out of proportion → ผ่าตัด) ไม่มีข้อ แต่เป็นภาวะฉุกเฉินที่ต้องรู้", "s": [], "q": []}, {"t": "Cutaneous anthrax — แผลดำที่ไม่เจ็บ", "n": 0, "y": [], "w": null, "c": "Cutaneous anthrax (painless black eschar) ไม่เคยออก", "s": [], "q": []}, {"t": "Pitted keratolysis และ Corynebacterium — เท้าเหม็น ซอกพับ และ Wood lamp", "n": 1, "y": [31], "w": null, "c": null, "s": ["Erythrasma: coral-red Wood lamp"], "q": [{"q": "Erythrasma of the axillae has which of the following characteristics?", "a": "Coral-red fluorescence under Wood's lamp examination", "y": [31], "an": "interp", "sub": "Erythrasma: coral-red Wood lamp", "t": 318}]}, {"t": "แปลคำบรรยายรอยโรคให้เป็นชื่อโรค", "n": 0, "y": [], "w": null, "c": "ตารางแปลคำศัพท์ ไม่ถามตรงแต่ใช้ทำข้อ spot dx ทุกข้อ", "s": [], "q": []}, {"t": "HPV และหูด — จำเลข type คู่กับตำแหน่ง", "n": 1, "y": [32, 33], "w": "Verruca vulgaris: papule ขรุขระ + black dots เมื่อเฉือนผิว", "c": null, "s": ["Verruca vulgaris: black dots"], "q": [{"q": "A 20-year-old football player has a firm, rough, skin-coloured papule with a hyperkeratotic verrucous surface on his finger. Paring the surface reveals tiny black dots. What is the diagnosis?", "a": "Verruca vulgaris (common wart)", "y": [32, 33], "an": "dx", "sub": "Verruca vulgaris: black dots", "t": 329}]}, {"t": "HHV ทั้งแปดชนิด และ HSV-1/HSV-2", "n": 2, "y": [28, 29], "w": "HSV: grouped vesicles ซ้ำที่เดิม (ริมฝีปาก, ก้นกบ)", "c": null, "s": ["HSV recurrent grouped vesicles", "HSV ที่ก้นกบ"], "q": [{"q": "A 30-year-old woman presents with a recurrent group of vesicles on an erythematous base at the upper lip. Which history is most helpful for the diagnosis?", "a": "Unsafe sex", "y": [29], "an": "dx", "sub": "HSV recurrent grouped vesicles", "t": 312}, {"q": "A patient with diabetes mellitus presents with a group of vesicles on an erythematous base at the coccyx. What is the most likely causative agent?", "a": "Herpes simplex virus", "y": [28], "an": "mech", "sub": "HSV ที่ก้นกบ", "t": 312}]}, {"t": "VZV — สุกใส งูสวัด และสามภาวะที่ห้ามพลาด", "n": 9, "y": [28, 30, 31, 32, 33, 34, 35], "w": "Herpes zoster: grouped vesicles ข้างเดียวตาม dermatome → วินิจฉัย, Tzanck smear (multinucleated giant cell) ยืนยัน, oral acyclovir ภายใน 72 ชม., HZO + Hutchinson sign — ออกทุกรุ่น 28–35", "c": null, "s": ["Tzanck smear (multinucleated giant cell)", "Herpes zoster: dermatomal vesicles", "Herpes zoster: dermatomal", "Herpes zoster: ข้างเดียว"], "q": [{"q": "Photograph shows grouped vesicles on an erythematous base arranged as a unilateral band along one dermatome on the trunk/back. What is the diagnosis?", "a": "Herpes zoster", "y": [35], "an": "dx", "sub": "Herpes zoster: dermatomal vesicles", "t": 310}, {"q": "A patient presents with a rash erupting in the distribution of a single nerve (dermatomal pattern). What is the most likely diagnosis?", "a": "Herpes zoster", "y": [33], "an": "dx", "sub": "Herpes zoster: dermatomal", "t": 310}, {"q": "Multiple grouped vesicles are found on the left upper back and left arm (unilateral, one side only). What is the most likely diagnosis?", "a": "Herpes zoster", "y": [34], "an": "dx", "sub": "Herpes zoster: ข้างเดียว", "t": 310}, {"q": "A photograph shows grouped vesicles on an erythematous base distributed in a unilateral band along a single dermatome on the back. Which management is most appropriate?", "a": "Oral acyclovir", "y": [32], "an": "mx", "sub": "Zoster → oral acyclovir ภายใน 72 ชม.", "t": 310}, {"q": "A 70-year-old man has a painful eruption of grouped vesicles on an erythematous base extending from the forehead to the upper eyelid on one side, with vesicles on the tip of the nose. What is the diagnosis and the key concern?", "a": "Herpes zoster ophthalmicus (V1); urgent antiviral and ophthalmology review because nasal-tip involvement (Hutchinson sign) predicts eye involvement", "y": [28], "an": "dx", "sub": "HZO + Hutchinson sign", "t": 310}, {"q": "A patient has grouped vesicles on an erythematous base arranged in a band-like distribution around the waist. Which bedside investigation is most appropriate?", "a": "Tzanck smear from the base of a vesicle", "y": [30], "an": "ix", "sub": "Tzanck smear (multinucleated giant cell)", "t": 311}, {"q": "A patient is shown with a photograph of grouped herpetic vesicles on an erythematous base on the abdominal wall. Which bedside investigation should be sent to confirm the diagnosis?", "a": "Tzanck smear — scraping from the base of a freshly opened vesicle, stained to look for multinucleated giant cells", "y": [34], "an": "ix", "sub": "Tzanck smear (multinucleated giant cell)", "t": 311}, {"q": "A patient presents with vesicles and pustules on the back. Which investigation is most appropriate?", "a": "Tzanck smear", "y": [32], "an": "ix", "sub": "Tzanck smear", "t": 311}, {"q": "Vesiculopustular skin lesions are characteristically found in which condition?", "a": "Varicella zoster virus infection", "y": [31], "an": "fact", "sub": "Varicella: vesiculopustule", "t": 311}]}], "th": [321, 329, 312, 310, 311]}], "gaps": [{"id": "gap-derm-01", "set": "derm", "title": "Wood's lamp และเชื้อราผิวหนังตื้น: tinea capitis, pityriasis versicolor, erythrasma, onychomycosis", "subtitle": "สีเรืองแสงบอกเชื้อ, KOH ยืนยัน, เล็บต้องกินยานานพอและเลือก terbinafine ก่อน", "md": "### Wood's lamp ทำงานอย่างไร\n- Wood's lamp คือหลอด UVA คลื่นยาว (~365 nm) ส่องในห้องมืด สารบางชนิดที่เชื้อสร้าง (เช่น pteridine ของ *Microsporum*, porphyrin ของแบคทีเรีย) จะเรืองแสงเป็นสีจำเพาะ\n- ใช้เป็น **การตรวจข้างเตียงเพื่อสนับสนุน** การวินิจฉัย ไม่ใช่การยืนยัน ผลลบไม่ตัดโรค (เช่น *Trichophyton* ส่วนใหญ่ไม่เรืองแสง) และต้องไม่ล้างหรือทายาก่อนตรวจ\n- การยืนยันเชื้อราผิวหนังข้างเตียงคือ **KOH preparation** (ขูดขุยหยด 10–20% KOH ดูหา hyphae/yeast)\n\n| ภาวะ | เชื้อ | สีใต้ Wood's lamp |\n|---|---|---|\n| Tinea capitis ชนิด ectothrix | *Microsporum canis*, *M. audouinii* | เขียว/ฟ้าอมเขียวสว่าง (bright blue-green) |\n| Tinea capitis ชนิด endothrix | *Trichophyton tonsurans*, *T. violaceum* | **ไม่เรืองแสง** |\n| Favus | *T. schoenleinii* | ฟ้าอมขาวจาง (dull blue-white) |\n| Pityriasis (tinea) versicolor | *Malassezia* spp. | เหลือง/เหลืองอมเขียว/ทอง (yellow-green, golden) บางรายสีส้มทองแดง |\n| Erythrasma | *Corynebacterium minutissimum* | **coral-red** (จาก coproporphyrin III) |\n| Pseudomonas infection | *P. aeruginosa* | เขียว (pyoverdin) |\n| Vitiligo | ไม่ใช่เชื้อ | ขาวสว่างชัดขอบคม (เน้นรอยด่างที่เห็นไม่ชัดด้วยตาเปล่า) |\n| Porphyria cutanea tarda | ไม่ใช่เชื้อ | ปัสสาวะเรืองแสงสีชมพู-แดง |\n\n- ข้อสอบเก่าถาม \"Wood's lamp ช่วยวินิจฉัยโรคใด\" คำตอบคือ **dermatophyte infection โดยเฉพาะ tinea capitis จาก *Microsporum*** (ectothrix) ไม่ใช่ tinea corporis ทั่วไป\n\n### Tinea capitis\n- พบในเด็กก่อนวัยรุ่น ผื่นเป็นวงขุยบนหนังศีรษะ ผมหักเป็นตอ (black dot ใน endothrix) อาจเป็น **kerion** (ก้อนนูนอักเสบมีหนอง) ซึ่งไม่ใช่ฝีแบคทีเรีย ไม่ต้องผ่า\n- ต้อง **กินยาเสมอ** เพราะเชื้ออยู่ในเส้นผมและรากผม ยาทาอย่างเดียวไม่หาย\n- Griseofulvin (microsize) 20–25 mg/kg/day นาน 6–8 สัปดาห์ เหมาะกับ *Microsporum*; terbinafine ได้ผลดีกับ *Trichophyton*\n- ใช้แชมพู ketoconazole 2% หรือ selenium sulfide ร่วมเพื่อลดการแพร่สปอร์ ตรวจคนในบ้าน/สัตว์เลี้ยง (แมว/สุนัขเป็นแหล่ง *M. canis*)\n\n### Pityriasis versicolor (tinea versicolor)\n- กลไก: *Malassezia* เป็นยีสต์ประจำถิ่นบนผิว เปลี่ยนเป็นระยะ hyphae เมื่อร้อนชื้น เหงื่อมาก ผิวมัน สร้าง azelaic acid ยับยั้ง tyrosinase ทำให้เกิดรอยด่างขาว\n- อาการ: ผื่นวงเล็กรวมกันเป็นปื้น สีขาว ชมพู หรือน้ำตาล ขุยละเอียด (ขูดแล้วขุยร่อนชัด, evoked scale sign) ที่ **หน้าอก หลังส่วนบน ต้นแขน** ไม่คันหรือคันเล็กน้อย เป็นมากช่วงหน้าร้อน พบบ่อยมากในคนไทยวัยหนุ่มสาวที่ทำงานกลางแดดเหงื่อออก\n- วินิจฉัย: Wood's lamp เรืองแสง **yellow-green/golden** สนับสนุน, **KOH** เห็น short hyphae + round spores (\"spaghetti and meatballs\") เป็นการยืนยันข้างเตียงที่ดีที่สุด\n- รักษา ยาทา: ketoconazole 2% shampoo/cream, selenium sulfide 2.5% ฟอกทิ้ง 10 นาทีทุกวันราว 1–2 สัปดาห์, 20–25% sodium thiosulfate, azole cream\n- รักษา ยากิน (ผื่นกว้าง/ดื้อยาทา): itraconazole 200 mg/day 5–7 วัน หรือ fluconazole 300 mg สัปดาห์ละครั้ง 2 สัปดาห์ (หรือ 400 mg ครั้งเดียว)\n- **Oral terbinafine และ griseofulvin ใช้ไม่ได้ผลกับ pityriasis versicolor** (terbinafine ชนิดทาใช้ได้)\n- บอกผู้ป่วยว่าสีผิวต้องใช้หลายเดือนจึงกลับ รอยขาวที่ค้างไม่ได้แปลว่ายาไม่ได้ผล และโรคกลับเป็นซ้ำบ่อย อาจใช้แชมพูฟอกตัวป้องกันเดือนละ 1–2 ครั้งช่วงหน้าร้อน\n\n### Erythrasma\n- เชื้อแบคทีเรีย *C. minutissimum* ผื่นปื้นสีน้ำตาลแดงขอบชัดที่ซอกพับ (ขาหนีบ รักแร้ ซอกนิ้วเท้าช่อง 4) พบมากในเบาหวาน อ้วน\n- Wood's lamp **coral-red** ช่วยแยกจาก tinea cruris\n- รักษา: topical erythromycin/clindamycin/fusidic acid ถ้ากว้างให้ oral erythromycin หรือ clarithromycin\n\n### Onychomycosis: กลไกและชนิด\n- เชื้อหลักคือ **dermatophyte (tinea unguium)** โดยเฉพาะ *Trichophyton rubrum* และ *T. interdigitale (mentagrophytes)* ส่วนน้อยเป็น *Candida* (เล็บมือ คนทำงานเปียก มักมี chronic paronychia) และ non-dermatophyte mold (*Fusarium*, *Neoscytalidium* ซึ่งพบได้ในไทย)\n- **Distal lateral subungual (DLSO)** พบบ่อยที่สุด: เล็บหนา เหลือง เปราะยุ่ย มีขุยใต้เล็บ (subungual hyperkeratosis) มักเป็นที่เล็บเท้าร่วมกับ tinea pedis\n- **Superficial white (SWO)**: ผิวเล็บเป็นจุด/ปื้นขาวขุ่นขูดออกได้ มักจาก *T. interdigitale*\n- **Proximal subungual (PSO)**: ขาวจากโคนเล็บ มักจาก *T. rubrum* เป็นเบาะแสของภูมิคุ้มกันบกพร่อง (HIV) ควรตรวจ anti-HIV\n- Ddx สำคัญ: nail psoriasis (pitting, oil drop, onycholysis), trauma, lichen planus (pterygium) เล็บผิดรูปประมาณครึ่งหนึ่งไม่ได้เกิดจากเชื้อรา จึง **ควรยืนยันเชื้อก่อนให้ยากินนาน**\n\n### วินิจฉัย onychomycosis\n- KOH ของขุยใต้เล็บส่วนที่ติดกับเนื้อดี (proximal-most debris) เห็น septate hyphae\n- เพาะเชื้อ (Sabouraud) บอกชนิดเชื้อ, ตัดเล็บย้อม PAS ไวที่สุด\n\n### รักษา onychomycosis\n| ยา | ขนาด | ระยะเวลา | ข้อควรระวัง |\n|---|---|---|---|\n| **Terbinafine** (first-line สำหรับ dermatophyte) | 250 mg/day | เล็บมือ 6 สัปดาห์, เล็บเท้า 12 สัปดาห์ | ตรวจ LFT ก่อนเริ่ม, hepatotoxicity พบน้อย, รับรสผิดปกติ |\n| **Itraconazole** (ทางเลือก; ดีกว่าเมื่อเป็น *Candida*/mold หรือเชื้อผสม) | continuous 200 mg/day หรือ pulse 200 mg bid 1 สัปดาห์/เดือน | continuous 12 สัปดาห์; pulse เล็บมือ 2 pulse, เล็บเท้า 3 pulse | ห้ามใน heart failure, CYP3A4 inhibitor (simvastatin ฯลฯ), ตับ |\n| Fluconazole (off-label) | 150–450 mg สัปดาห์ละครั้ง | 6–12 เดือนขึ้นไป | เมื่อใช้ 2 ตัวแรกไม่ได้ |\n| ยาทา (ciclopirox 8%, amorolfine 5% lacquer, efinaconazole 10%) | ทาตามชนิดยา | 48 สัปดาห์ | เฉพาะรายเบา: เป็นส่วนปลาย <50% ไม่ถึง matrix, หรือ SWO |\n\n- Terbinafine เป็น fungicidal ต่อ dermatophyte อัตราหายสูงกว่า itraconazole จึงเป็น **drug of choice สำหรับ *T. rubrum*** itraconazole เป็นยาทางเลือก\n- Griseofulvin ไม่แนะนำแล้ว (ต้องกินนาน 12–18 เดือน หายต่ำ)\n- เล็บเท้างอกใหม่ทั้งเล็บใช้ 12–18 เดือน ประเมินผลจากเล็บใหม่ที่งอกออกมาใสหลังหยุดยา ไม่ใช่ตอนสิ้นสุดยา\n- ป้องกันกลับเป็นซ้ำ: รักษา tinea pedis ร่วม เท้าแห้ง เปลี่ยนถุงเท้า อาจทายาเชื้อราที่เท้าเป็นระยะ", "pearls": ["Wood's lamp: Microsporum (ectothrix) เขียวฟ้า, Trichophyton (endothrix) ไม่เรืองแสง", "Pityriasis versicolor = yellow-green/golden, erythrasma = coral-red, Pseudomonas = เขียว", "Pityriasis versicolor ยืนยันด้วย KOH spaghetti and meatballs; oral terbinafine/griseofulvin ไม่ได้ผล", "Tinea capitis ต้องกินยาเสมอ (griseofulvin สำหรับ Microsporum, terbinafine สำหรับ Trichophyton)", "Onychomycosis จาก T. rubrum: oral terbinafine 250 mg/day เล็บมือ 6 สัปดาห์ เล็บเท้า 12 สัปดาห์ = first-line", "Itraconazole ห้ามใน CHF และระวัง drug interaction ผ่าน CYP3A4"], "traps": [{"id": "DE-OLDP-019", "note": "โพยตอบ oral itraconazole แต่เชื้อที่เพาะได้คือ T. rubrum (dermatophyte) ซึ่ง drug of choice ปัจจุบันคือ oral terbinafine (fungicidal, หายสูงกว่า) itraconazole เป็นทางเลือกหรือใช้เมื่อเป็น Candida/non-dermatophyte mold; ถ้าเป็น superficial white onychomycosis จำกัดตำแหน่ง ยาทาก็พอ ถ้าตัวเลือกมี terbinafine ให้เลือก terbinafine"}], "q": [{"id": "DE-OLDP-047", "q": "Wood's lamp examination can aid in the diagnosis of which of the following?", "a": "Dermatophyte infection (tinea capitis)", "y": [29], "t": 318}, {"id": "DE-OLDP-048", "q": "Wood's lamp examination is most useful in the diagnosis of which condition?", "a": "Dermatophyte infection (e.g. tinea capitis from Microsporum species)", "y": [29], "t": 318}, {"id": "PP31-DER-065", "q": "A 24-year-old delivery worker has asymptomatic, finely scaling brownish macules and patches on his upper back and chest that worsen in the hot season. Which bedside examination best supports the diagnosis?", "a": "Wood's lamp examination showing yellow-green fluorescence", "y": [31], "t": 318}, {"id": "PP34-DER-014", "q": "A 25-year-old man has multiple hypopigmented and hyperpigmented, finely scaly macules on the upper trunk that become more prominent in hot weather. Wood's lamp examination is performed. Which finding is expected?", "a": "Yellow-green (golden) fluorescence", "y": [34], "t": 318}, {"id": "DE-OLDP-018", "q": "A patient has a fungal nail infection (onychomycosis). Which drug is the treatment of choice?", "a": "Oral terbinafine", "y": [34], "t": 317}, {"id": "DE-OLDP-019", "q": "A patient has a whitish discolouration of the nail. Scraping of the nail material grows Trichophyton rubrum. Which treatment is most appropriate?", "a": "Oral itraconazole", "y": [32], "t": 317}, {"id": "DE-OLDP-043", "q": "Photograph of a toe shows a thickened, yellow, crumbly nail with subungual scale. What is the most likely diagnosis (causative infection)?", "a": "Tinea unguium (dermatophyte onychomycosis)", "y": [35], "t": 317}], "years": [29, 31, 32, 34, 35], "th": [318, 317]}, {"id": "gap-derm-02", "set": "derm", "title": "Measles และ viral enanthem: Koplik spot, herpangina, HFMD", "subtitle": "ผื่นไข้ในเด็กและแรงงานข้ามชาติ: อ่านลำดับผื่นและตำแหน่งแผลในปาก", "md": "### Measles (หัด): กลไก\n- เชื้อ measles virus (paramyxovirus, genus *Morbillivirus*) แพร่ทาง **airborne** ติดง่ายที่สุดโรคหนึ่ง (R0 12–18) คนที่ไม่มีภูมิคุ้มกันสัมผัสแล้วติด ~90%\n- ไวรัสเพิ่มจำนวนในทางเดินหายใจและต่อมน้ำเหลือง แล้วกระจายไปทั่วร่างกาย ทำลาย memory lymphocyte ทำให้ **ภูมิคุ้มกันกดชั่วคราวนานหลายสัปดาห์ถึงหลายเดือน (immune amnesia)** จึงติดเชื้อแบคทีเรียแทรกซ้อนง่าย\n- ระยะฟักตัว ~10–14 วัน ระยะแพร่เชื้อ **4 วันก่อนถึง 4 วันหลังผื่นขึ้น**\n\n### อาการ\n- **Prodrome 2–4 วัน**: ไข้สูง + 3C คือ cough, coryza, conjunctivitis (ตาแดง แพ้แสง)\n- **Koplik spots**: จุดขาวเทาเล็ก ๆ บนพื้นแดงของ buccal mucosa ตรงข้ามฟันกรามล่าง ขึ้น 1–2 วันก่อนผื่น และหายไปใน 2–3 วันหลังผื่นขึ้น เป็น pathognomonic\n- **ผื่น**: maculopapular สีแดง เริ่มที่ไรผม หลังหู ใบหน้า แล้ว **ลามลงล่าง** ไปคอ ลำตัว แขนขาในราว 3 วัน ผื่นที่หน้า/ลำตัวมักรวมกัน (confluent) ไข้สูงสุดตอนผื่นขึ้น\n- ผื่นจางตามลำดับเดิม ทิ้ง **รอยสีน้ำตาลคล้ำและขุยละเอียด** (ไม่ลอกที่ฝ่ามือฝ่าเท้า)\n- ไข้ไม่ลงเกิน 3–4 วันหลังผื่นขึ้น ให้นึกถึงภาวะแทรกซ้อน\n- บริบทไทย: การระบาดมักเกิดในกลุ่มที่ความครอบคลุมวัคซีนต่ำ เช่น **แรงงานข้ามชาติ/เด็กชาวเมียนมา** ตามชายแดน และสามจังหวัดชายแดนใต้ รวมทั้งผู้ใหญ่ที่ไม่เคยได้วัคซีนครบ\n\n### ภาวะแทรกซ้อน\n- **Otitis media**: ภาวะแทรกซ้อนที่พบบ่อยที่สุดในเด็ก\n- **Pneumonia**: เป็น **สาเหตุการเสียชีวิตที่พบบ่อยที่สุด** ทั้ง primary viral (giant cell / Hecht pneumonia ในคนภูมิคุ้มกันต่ำ) และ secondary bacterial (*S. pneumoniae*, *S. aureus*, *H. influenzae*)\n- Diarrhea และขาดอาหาร (ทำให้เสียชีวิตมากในประเทศรายได้ต่ำ), laryngotracheobronchitis (croup)\n- Keratitis/corneal ulcer จนตาบอด โดยเฉพาะเด็กขาด vitamin A\n- Acute post-infectious encephalitis ~1/1,000 ราย; measles inclusion body encephalitis ในผู้ภูมิคุ้มกันต่ำ\n- **SSPE** (subacute sclerosing panencephalitis): เกิด 7–10 ปีหลังติดเชื้อ เสี่ยงสูงถ้าติดก่อนอายุ 2 ปี เสียชีวิตเกือบทุกราย\n- อื่น ๆ: TB กำเริบ (tuberculin anergy), ในหญิงตั้งครรภ์ทำให้แท้ง/คลอดก่อนกำหนด, ผู้ใหญ่มี hepatitis ได้บ่อย\n\n### วินิจฉัย\n- ใช้ clinical case definition: ไข้ + maculopapular rash + cough/coryza/conjunctivitis อย่างใดอย่างหนึ่ง แล้วยืนยันทางห้องปฏิบัติการ\n- **Measles IgM** ในเลือด (อาจลบปลอมถ้าเจาะภายใน 72 ชม. หลังผื่นขึ้น) และ/หรือ **RT-PCR** จาก throat/nasopharyngeal swab หรือปัสสาวะ (ได้ผลดีสุดช่วงไม่กี่วันแรกของผื่น)\n- ประเทศไทยอยู่ในโครงการกำจัดโรคหัด ผู้ป่วยสงสัยทุกรายต้อง **รายงานงานระบาดวิทยา** และเก็บตัวอย่างส่งตรวจ\n\n### รักษาและป้องกัน\n- ไม่มียาต้านไวรัสเฉพาะ รักษา **supportive**: ลดไข้ (paracetamol) สารน้ำ อาหาร รักษาภาวะแทรกซ้อน ให้ยาปฏิชีวนะเมื่อมีการติดเชื้อแบคทีเรียซ้ำ\n- **Vitamin A** ให้ทุกรายในเด็ก (WHO) วันละครั้ง 2 วันติดกัน: อายุ <6 เดือน 50,000 IU, 6–11 เดือน 100,000 IU, ≥12 เดือน 200,000 IU; ถ้ามีอาการตาจากขาด vitamin A ให้ครั้งที่ 3 ห่าง 2–6 สัปดาห์ ลดการตาย ตาบอด และความรุนแรงของปอดอักเสบ\n- แยกผู้ป่วยแบบ **airborne precaution** จนครบ 4 วันหลังผื่นขึ้น\n- **PEP**: ให้ MMR ภายใน **72 ชม.** หลังสัมผัส (อายุ ≥6 เดือนและไม่มีข้อห้าม) หรือ immunoglobulin ภายใน **6 วัน** สำหรับทารกเล็ก หญิงตั้งครรภ์ที่ไม่มีภูมิ และผู้ภูมิคุ้มกันบกพร่อง (ห้ามให้วัคซีนเชื้อเป็นในกลุ่มนี้)\n- วัคซีน MMR 2 เข็มตาม EPI ไทย (เข็มแรกอายุ 9 เดือน เข็มสองอายุ 1 ปีครึ่ง)\n\n### แยกผื่นไข้ที่พบบ่อย\n| โรค | เบาะแสหลัก |\n|---|---|\n| Measles | ไข้ + 3C, Koplik spots, ผื่นลามหน้าลงล่างช้า ๆ ใน 3 วัน, ป่วยหนัก |\n| Rubella | ไข้ต่ำ อาการน้อย ผื่นลามหน้าลงล่างเร็วใน 24 ชม., ต่อมน้ำเหลือง postauricular/suboccipital โต |\n| Roseola (HHV-6) | ไข้สูง 3–5 วันในทารก **ผื่นขึ้นหลังไข้ลง** เริ่มที่ลำตัว |\n| Scarlet fever | sandpaper rash, strawberry tongue, Pastia lines, หลังคออักเสบจาก GAS |\n| Dengue | ผื่นระยะฟื้นตัว \"islands of white in a sea of red\" คัน, tourniquet test บวก |\n| Varicella | ตุ่มน้ำหลายระยะพร้อมกัน กระจายจากลำตัว (centripetal) |\n\n### Herpangina: กลไกและอาการ\n- เกิดจาก **enterovirus** ส่วนใหญ่ **coxsackievirus A** พบในเด็กอายุ 3–10 ปี ระบาดหน้าฝนในไทย แพร่ทาง fecal-oral และละอองฝอย\n- ไข้เฉียบพลัน เจ็บคอ กลืนเจ็บ น้ำลายไหล ไม่ยอมกิน ตรวจพบ **ตุ่มน้ำเล็ก 1–2 mm แตกเป็นแผลตื้นสีเทามีขอบแดง** จำนวนไม่มาก ที่ **ช่องปากส่วนหลัง: soft palate, uvula, tonsillar pillars, posterior pharynx**\n- หายเองใน 3–7 วัน วินิจฉัยทางคลินิก ไม่ต้องส่งตรวจไวรัสในรายทั่วไป\n\n### Herpangina: รักษา\n- **Observation + symptomatic/supportive** เท่านั้น: paracetamol/ibuprofen ลดไข้และปวด, ดื่มน้ำเย็น อาหารเหลวเย็นนิ่ม, ยาชาเฉพาะที่ (เช่น lidocaine gel ระวังในเด็กเล็ก)\n- **ไม่ต้องให้ antibiotic และไม่มีบทบาทของ acyclovir** หลีกเลี่ยง aspirin ในเด็ก (Reye syndrome)\n- เฝ้าระวังภาวะขาดน้ำ (ปัสสาวะน้อย ซึม) เป็นเหตุผลหลักที่ต้องนอนโรงพยาบาล\n- ล้างมือ แยกเด็กจากโรงเรียน/ศูนย์เด็กเล็กจนหาย เพราะเชื้อออกทางอุจจาระได้หลายสัปดาห์\n\n### แยก enanthem ในปาก\n| โรค | เชื้อ | ตำแหน่ง/ลักษณะ | รักษา |\n|---|---|---|---|\n| Herpangina | Coxsackie A | แผลเล็กที่ **ปากส่วนหลัง** (soft palate, tonsillar pillars) ไม่มีเหงือกอักเสบ | supportive |\n| Hand-foot-mouth disease | Coxsackie A16, A6, **EV71** | แผลในปากส่วนหน้า + ตุ่มน้ำรูปรีที่ฝ่ามือ ฝ่าเท้า ก้น | supportive; EV71 เฝ้าระวัง brainstem encephalitis, pulmonary edema (ซึม myoclonic jerk อาเจียน หัวใจเร็ว หอบ ต้อง admit) |\n| Primary herpetic gingivostomatitis | HSV-1 | แผลปากส่วนหน้า ลิ้น ริมฝีปาก **เหงือกบวมแดงเลือดออก** | acyclovir ถ้าเริ่มใน 72–96 ชม. แรก + supportive |\n| Aphthous ulcer | ไม่ใช่เชื้อ | แผลเดี่ยว/ไม่กี่แผล ไม่มีไข้ เป็นซ้ำ | topical steroid |", "pearls": ["Measles: prodrome 3C (cough, coryza, conjunctivitis) + Koplik spots ขึ้นก่อนผื่น 1–2 วัน", "ผื่นหัดเริ่มไรผม/หลังหู/หน้า แล้วลามลงล่าง จางทิ้งรอยน้ำตาลและขุย", "ภาวะแทรกซ้อนพบบ่อยสุด = otitis media, สาเหตุตายบ่อยสุด = pneumonia", "รักษาหัด: supportive + vitamin A 200,000 IU (≥1 ปี) 2 วัน, airborne isolation ถึง 4 วันหลังผื่น, MMR PEP ภายใน 72 ชม.", "Herpangina = Coxsackie A, แผลเล็กที่ soft palate/tonsillar pillars, รักษาแค่ supportive ไม่ให้ antibiotic/acyclovir", "HSV gingivostomatitis = ปากส่วนหน้า + เหงือกอักเสบ (ต่างจาก herpangina ที่อยู่ปากส่วนหลัง)"], "traps": [], "q": [{"id": "PP34-DER-016", "q": "A 15-year-old Myanmar girl presents with fever and white spots on the buccal mucosa, followed by a rash that spreads downward from the face to the neck and trunk. What is the most likely diagnosis?", "a": "Measles", "y": [34], "t": 313}, {"id": "PP32-DER-055", "q": "A febrile patient is shown with an erythematous maculopapular rash that appeared first on the face and then spread downward to the trunk. Which complication of this disease is the most frequent cause of death?", "a": "Pneumonia", "y": [32], "t": 313}, {"id": "PP32-DER-043", "q": "A patient has fever, sore throat and several small vesicles and shallow ulcers on the soft palate and tonsillar pillars. The illness is diagnosed as herpangina. What is the appropriate management?", "a": "Observation with symptomatic and supportive treatment", "y": [32], "t": 314}], "years": [32, 34], "th": [313, 314]}, {"id": "gap-derm-03", "set": "derm", "title": "Scabies (หิด): permethrin, sulfur ในคนท้อง และ crusted scabies", "subtitle": "คันกลางคืน คนในบ้านคันด้วย เจอ burrow ที่ซอกนิ้ว รักษาทุกคนพร้อมกัน", "md": "### กลไก\n- เกิดจากไร *Sarcoptes scabiei* var. *hominis* ตัวเมียขุดอุโมงค์ (burrow) ในชั้น stratum corneum วางไข่วันละ 2–3 ฟอง ตัวอ่อนโตเต็มวัยใน ~2 สัปดาห์ ผู้ป่วยทั่วไปมีไรเพียง 10–15 ตัว\n- **อาการคันเกิดจาก hypersensitivity type IV** ต่อตัวไร ไข่ และมูล จึงเริ่มคัน 3–6 สัปดาห์หลังติดครั้งแรก แต่ถ้าเคยเป็นมาก่อนจะคันภายใน 1–3 วัน ช่วงก่อนมีอาการก็แพร่เชื้อได้แล้ว\n- แพร่ทางการสัมผัสผิวหนังใกล้ชิดนาน (คนในบ้าน คู่นอน ผู้ดูแล) ไรอยู่นอกตัวคนได้ราว 2–3 วัน การติดผ่านผ้าปูที่นอนพบน้อยในหิดธรรมดา แต่พบมากใน crusted scabies\n\n### อาการ\n- **คันมากโดยเฉพาะกลางคืน** และ **คนใกล้ชิดคันเหมือนกัน** เป็นเบาะแสที่สำคัญที่สุด\n- รอยโรค: burrow (เส้นคดเคี้ยวสีเทาขาวยาว 2–10 mm ปลายมีจุด) ตุ่มแดงและ papulovesicle รอยเกา\n- ตำแหน่ง: **ง่ามนิ้วมือ** ข้อมือด้านใน ข้อศอก **รักแร้** รอบสะดือ/เอว ก้น ต้นขาด้านใน **อวัยวะเพศชาย** (scabietic nodule) และ **areola/หัวนม ในผู้หญิง**\n- ในผู้ใหญ่มักไม่เป็นที่หน้าและหนังศีรษะ แต่ **ทารก ผู้สูงอายุ และผู้ภูมิคุ้มกันต่ำ เป็นที่ศีรษะ หน้า ฝ่ามือฝ่าเท้าได้**\n- ภาวะแทรกซ้อน: secondary impetigo (*S. aureus*, GAS) ซึ่งอาจตามด้วย post-streptococcal glomerulonephritis\n\n### Crusted (Norwegian) scabies\n- ผู้ป่วยภูมิคุ้มกันต่ำ (HIV, HTLV-1, ใช้ steroid/immunosuppressant) ผู้สูงอายุติดเตียง ผู้ป่วยระบบประสาท/ความรู้สึกบกพร่อง ภูมิไม่สามารถคุมไรได้ จึงมีไร **หลายพันถึงหลายล้านตัว**\n- สะเก็ดหนาเป็นขุยสีเทาเหลืองที่มือ เท้า ข้อศอก ใต้เล็บ อาจ **คันน้อย** ติดต่อง่ายมาก ทำให้ระบาดในหอผู้ป่วยและบ้านพักคนชรา\n\n### วินิจฉัย\n- ส่วนใหญ่วินิจฉัยทางคลินิก\n- ยืนยันด้วยการขูด burrow แล้วหยด **mineral oil** (หรือ KOH) ส่องกล้องหา **ตัวไร ไข่ หรือมูล (scybala)**\n- Dermoscopy เห็น \"delta-wing jet sign\"; burrow ink test\n\n### รักษา: หลักการ\n- **รักษาผู้ป่วยและผู้สัมผัสใกล้ชิดทุกคนพร้อมกัน** แม้ไม่มีอาการ\n- ทายา **ทั่วตัวตั้งแต่คอลงถึงปลายเท้า** รวมง่ามนิ้ว ใต้เล็บ อวัยวะเพศ ฝ่าเท้า; ในทารก ผู้สูงอายุ และผู้ภูมิคุ้มกันต่ำ ให้ทาศีรษะและหน้าด้วย (เลี่ยงตาและปาก)\n- เสื้อผ้า ผ้าปู ผ้าเช็ดตัวที่ใช้ใน 3 วันก่อนรักษา ซักน้ำร้อน (≥50–60 °C) อบแห้งร้อน หรือใส่ถุงปิดสนิท ≥72 ชม.\n- ตัดเล็บสั้น ให้ antihistamine ช่วยลดคัน\n\n### ยาที่ใช้\n| ยา | วิธีใช้ | หมายเหตุ |\n|---|---|---|\n| **Permethrin 5% cream** (first-line) | ทาคอลงเท้า ทิ้งไว้ 8–14 ชม. แล้วล้างออก **ทาซ้ำอีกครั้งหลัง 7 วัน** | ใช้ได้ตั้งแต่อายุ 2 เดือน; guideline สากลถือว่าปลอดภัยในหญิงตั้งครรภ์และให้นมบุตร |\n| **Precipitated sulfur 6–10% ointment** | ทาทั้งตัวทุกคืน ติดต่อกัน 3 คืน อาบน้ำ 24 ชม. หลังทาครั้งสุดท้าย | ปลอดภัยมากที่สุด เหมาะ **หญิงตั้งครรภ์ ให้นมบุตร ทารก <2 เดือน**; เหนอะหนะ กลิ่นแรง |\n| Benzyl benzoate 25% emulsion | ทาคอลงเท้า ทิ้งไว้ 24 ชม. แล้วทาซ้ำตามสูตรที่ใช้ (เช่น ซ้ำอีกครั้งใน 1 สัปดาห์) | ราคาถูก ใช้มากในไทย ระคายเคืองแสบมาก ต้องเจือจางในเด็ก ไม่ใช่ตัวเลือกแรกในครรภ์/ทารก |\n| **Ivermectin** oral | 200 µg/kg กินพร้อมอาหาร ซ้ำอีกครั้งหลัง 7–14 วัน | ใช้ในหิดระบาดในสถาบัน/crusted scabies; **ห้ามในหญิงตั้งครรภ์ ให้นมบุตร เด็กน้ำหนัก <15 kg** |\n| Lindane 1% | ไม่แนะนำแล้ว | neurotoxic (ชัก) ห้ามในเด็ก คนท้อง ผิวหนังอักเสบ |\n\n### หิดในหญิงตั้งครรภ์\n- หลีกเลี่ยง ivermectin และ lindane\n- ทางเลือกที่ปลอดภัยคือ **sulfur ointment 6–10%** (คำตอบคลาสสิกในข้อสอบไทย) และ **permethrin 5%** (CDC/European guideline ถือเป็น first-line ที่ใช้ได้ในครรภ์เพราะดูดซึมน้อยมากและถูกทำลายเร็ว)\n- ในโจทย์หญิงตั้งครรภ์ไทยที่มีคันกลางคืน สามีคันด้วย ผื่นที่ง่ามนิ้วและหัวนม: วินิจฉัย scabies และให้ sulfur ointment (หรือ permethrin 5%) แก่ตัวเธอ และรักษาสามีพร้อมกัน\n\n### Crusted scabies: รักษา\n- แยกผู้ป่วย contact precaution, ผู้ดูแลใส่ถุงมือและเสื้อคลุม\n- **Ivermectin 200 µg/kg วันที่ 1, 2, 8** (รายรุนแรงเพิ่มวันที่ 9, 15 และ 22, 29) ร่วมกับ **permethrin 5% ทาทุกวันใน 7 วันแรก แล้วสัปดาห์ละ 2 ครั้ง** จนหาย\n- ยาละลายขุย (salicylic acid หรือ urea) เพื่อให้ยาซึมผ่านสะเก็ด ตัดเล็บสั้นและทายาใต้เล็บ\n- ทำความสะอาดห้องและเครื่องนอนอย่างละเอียด รักษาผู้สัมผัสทุกคนในหอผู้ป่วย\n\n### หลังรักษา\n- **อาการคันอาจคงอยู่ 2–4 สัปดาห์ (post-scabetic itch)** เพราะปฏิกิริยาต่อซากไร ไม่ใช่การรักษาล้มเหลว ให้ antihistamine และ topical steroid อ่อน–ปานกลาง และให้ความชุ่มชื้นผิว\n- ถ้าเกิน 4 สัปดาห์ยังมี burrow ใหม่หรือรอยโรคใหม่ คิดถึงการทายาไม่ถูกวิธี ผู้สัมผัสไม่ได้รักษา หรือการติดซ้ำ", "pearls": ["คันกลางคืน + คนในบ้านคันด้วย + burrow ที่ง่ามนิ้ว/ข้อมือ/รักแร้/อวัยวะเพศ = scabies", "Permethrin 5% ทาคอลงเท้า ทิ้ง 8–14 ชม. ซ้ำหลัง 7 วัน และรักษาผู้สัมผัสทุกคนพร้อมกัน", "หญิงตั้งครรภ์/ทารก <2 เดือน: sulfur ointment 6–10% 3 คืน (permethrin ก็ปลอดภัย); ห้าม ivermectin และ lindane", "Crusted scabies (ผู้ป่วยติดเตียง/ภูมิต่ำ): ไรมหาศาล ติดง่าย ใช้ oral ivermectin ร่วม permethrin + keratolytic", "คันต่ออีก 2–4 สัปดาห์หลังรักษาเป็นเรื่องปกติ ไม่ใช่ treatment failure"], "traps": [], "q": [{"id": "DE-OLDP-010", "q": "A 25-year-old Thai woman at 22 weeks' gestation is referred from the antenatal clinic with itchy papules for 1 week. The itching is worst at night and her husband has the same problem. Examination shows papulovesicular lesions at the finger web spaces and excoriations on the trunk, extremities and nipples. What is the most appropriate treatment?", "a": "10% sulfur ointment", "y": [31], "t": 319}, {"id": "PP32-DER-057", "q": "A bedridden 70-year-old man with diabetes has intensely itchy papules and burrows in the finger webs, wrists and axillae; his caregiver is also itchy. A skin scraping examined with KOH/mineral oil shows a mite and eggs. What is the treatment of choice?", "a": "Permethrin 5% cream applied from the neck down to the whole body, repeated after 7 days, treating all contacts", "y": [32], "t": 319}], "years": [31, 32], "th": [319]}, {"id": "gap-derm-04", "set": "derm", "title": "Acne vulgaris (สิว): pathogenesis, C. acnes และการรักษาตามความรุนแรง", "subtitle": "สี่กลไกของสิว ยาแต่ละตัวตีกลไกไหน และคำแนะนำผู้ป่วยที่ถูกต้อง", "md": "### กลไก: 4 ปัจจัยใน pilosebaceous unit\n1. **Follicular hyperkeratinization** เซลล์บุรูขุมขนเกาะกันแน่น อุดรู เกิด microcomedone เป็นจุดตั้งต้นของสิวทุกชนิด\n2. **Sebum เพิ่มขึ้น** จาก androgen (วัยรุ่น, PCOS) กระตุ้น sebaceous gland\n3. **Cutibacterium acnes** (ชื่อเดิม *Propionibacterium acnes*) แบคทีเรียแกรมบวก anaerobic/aerotolerant ประจำถิ่นในรูขุมขน ใช้ lipase ย่อย sebum เป็น free fatty acid และกระตุ้น TLR2 ให้หลั่ง IL-1, IL-8 ทำให้เกิด **inflammatory lesion**\n4. **Inflammation** ผนังรูขุมขนแตก เกิด papule, pustule, nodule และแผลเป็น\n- อาหาร: หลักฐานปัจจุบัน (AAD 2024) พบว่า **อาหาร high-glycemic index/high glycemic load และนม (โดยเฉพาะ skim milk)** สัมพันธ์กับสิวกำเริบ ผ่าน insulin/IGF-1 ที่กระตุ้น androgen และ sebum ส่วนช็อกโกแลตหลักฐานยังไม่ชัด\n\n### อาการและการแบ่งความรุนแรง\n- Non-inflammatory: **comedone** ปิด (whitehead) และเปิด (blackhead สีดำจาก oxidized melanin ไม่ใช่สิ่งสกปรก)\n- Inflammatory: papule, pustule, nodule/cyst ที่หน้า หน้าอก หลัง\n- แบ่งระดับ: comedonal, mild–moderate papulopustular, severe (nodular, แผลเป็น, ดื้อการรักษา)\n- Ddx สำคัญ: **drug-induced acne** (systemic steroid, isoniazid, lithium, phenytoin, anabolic steroid: ตุ่มหน้าตาเหมือนกันหมด ไม่มี comedone), **Malassezia (pityrosporum) folliculitis** (ตุ่มคันขนาดเท่ากันที่หน้าอก หลัง หน้าผาก ในอากาศร้อนชื้น มักแย่ลงหลังได้ antibiotic; รักษาด้วย azole), rosacea (ไม่มี comedone, หน้าแดง)\n\n### รักษาตามระดับ\n| ระดับ | First-line | หมายเหตุ |\n|---|---|---|\n| Comedonal | **Topical retinoid** (adapalene 0.1–0.3%, tretinoin 0.025–0.05%) | ตีกลไก hyperkeratinization, ใช้ maintenance ระยะยาว |\n| Mild–moderate papulopustular | Topical retinoid + **benzoyl peroxide (BPO) 2.5–5%** ± topical clindamycin 1% | BPO ฆ่า *C. acnes* และไม่ทำให้ดื้อยา; topical antibiotic ต้องใช้คู่ BPO เสมอ |\n| Moderate–severe | เพิ่ม **oral doxycycline 100 mg/day** (หรือ minocycline) + topical retinoid + BPO | จำกัด oral antibiotic ประมาณ 3–4 เดือนแล้วประเมิน, ห้ามใช้ antibiotic เดี่ยว |\n| ผู้หญิงที่มีอาการ androgen/สิวรอบประจำเดือน | combined oral contraceptive, spironolactone 50–100 mg/day | ระวัง hyperkalemia ในผู้มีโรคไต |\n| Severe nodular, แผลเป็น, ดื้อการรักษา | **Oral isotretinoin 0.5–1 mg/kg/day** สะสมรวม ~120–150 mg/kg | ยาตัวเดียวที่ตีทั้ง 4 กลไก |\n\n- Clascoterone 1% cream เป็น topical antiandrogen ทางเลือกใหม่; azelaic acid 15–20% ใช้ได้ในคนท้องและช่วยรอยดำ\n- Topical retinoid อาจทำให้ \"สิวเห่อ\" ช่วง 2–4 สัปดาห์แรก ระคายเคืองและไวแสง ให้เริ่มความเข้มข้นต่ำ ทาก่อนนอน และใช้ครีมกันแดด ผลการรักษาเห็นหลัง 6–8 สัปดาห์\n\n### ข้อควรระวังของยา\n- **Doxycycline**: กินพร้อมน้ำมาก ๆ ห้ามนอนทันที (pill esophagitis), ไวแสง, **ห้ามในหญิงตั้งครรภ์และเด็ก <8 ปี**\n- **Isotretinoin**: **teratogenic รุนแรง** ต้องตรวจ pregnancy test และคุมกำเนิด 2 วิธี ตั้งแต่ 1 เดือนก่อนเริ่ม ระหว่างใช้ และ 1 เดือนหลังหยุด; ตรวจ lipid และ LFT; ปากแห้ง ตาแห้ง; เฝ้าระวังอารมณ์ซึมเศร้า; **ห้ามใช้ร่วมกับ tetracycline (เสี่ยง pseudotumor cerebri)**; ห้ามบริจาคเลือดระหว่างใช้\n- หญิงตั้งครรภ์: ใช้ได้คือ BPO, azelaic acid, topical clindamycin/erythromycin; หลีกเลี่ยง topical retinoid, tetracycline, isotretinoin, spironolactone\n\n### คำแนะนำผู้ป่วย: ข้อที่ถูก\n- ล้างหน้าด้วยสบู่/cleanser อ่อนวันละ 2 ครั้ง ไม่ขัดถูแรง\n- **ไม่บีบ แกะ หรือกดสิว** (เพิ่มการอักเสบ แผลเป็น และรอยดำ)\n- ใช้เครื่องสำอางและครีมกันแดดชนิด **non-comedogenic / oil-free**\n- **รับประทานอาหาร low-glycemic index** ลดน้ำตาล ขนมหวาน เครื่องดื่มหวาน และนมพร่องมันเนย อาจช่วยได้\n- ลดแรงเสียดสีกดทับ (สายรัดหมวกกันน็อก หน้ากากอนามัย: acne mechanica)\n- ใช้ยาต่อเนื่องอย่างน้อย 6–8 สัปดาห์ก่อนตัดสินผล และใช้ topical retinoid เป็น maintenance\n\n### คำแนะนำที่ผิด (ตัวเลือกหลอกในข้อสอบ)\n- **แนะนำให้กินอาหาร high-glycemic index มาก ๆ**\n- ใช้ topical หรือ systemic steroid รักษาสิว (ทำให้เกิด steroid acne)\n- ใช้ topical/oral antibiotic เดี่ยว ๆ ระยะยาวโดยไม่มี BPO\n- ขัดหน้าแรง ๆ หลายครั้งต่อวัน หรือบีบสิวเอง", "pearls": ["เชื้อที่เกี่ยวกับ inflammatory acne = Cutibacterium (Propionibacterium) acnes, แกรมบวก anaerobe", "สี่กลไก: hyperkeratinization, sebum (androgen), C. acnes, inflammation", "คำแนะนำที่ผิด = กินอาหาร high-GI; ที่ถูกคือ low-GI, ไม่บีบสิว, non-comedogenic", "Antibiotic (topical หรือ oral) ต้องใช้คู่ BPO + retinoid เสมอ จำกัด oral antibiotic ~3–4 เดือน", "Isotretinoin 0.5–1 mg/kg/day: teratogenic, คุมกำเนิด 1 เดือนก่อน–1 เดือนหลัง, ห้ามคู่ tetracycline"], "traps": [], "q": [{"id": "DE-OLDP-045", "q": "Which of the following is NOT appropriate advice or management for a patient with acne vulgaris?", "a": "Encouraging a diet rich in high-glycemic-index foods", "y": [30], "t": 328}, {"id": "PP34-DER-006", "q": "A 21-year-old medical student has open and closed comedones with some inflammatory papules on the face. Which organism contributes to the inflammatory lesions of acne vulgaris?", "a": "Cutibacterium (Propionibacterium) acnes", "y": [34], "t": 328}], "years": [30, 34], "th": [328]}, {"id": "gap-derm-06", "set": "derm", "title": "Papulosquamous diseases: Psoriasis และ Lichen planus", "subtitle": "ปื้นแดงขุยเงินที่ด้านเหยียด กับตุ่มแบนสีม่วงมี Wickham striae ที่ข้อมือ", "md": "### Psoriasis: กลไก\n- โรคอักเสบเรื้อรังจาก immune ผ่าน **IL-23/Th17 axis**: dendritic cell หลั่ง IL-23 กระตุ้น Th17 ให้หลั่ง IL-17 และ TNF-α กระตุ้น keratinocyte แบ่งตัวเร็ว (turnover ~3–5 วัน แทน ~28 วัน) จึงเกิดขุยหนาและเส้นเลือดฝอยขยาย\n- มีพื้นฐานทางพันธุกรรม (HLA-Cw6) และถูกกระตุ้นด้วยปัจจัยภายนอก\n- เป็นโรคทั้งระบบ สัมพันธ์กับ psoriatic arthritis (~20–30%), metabolic syndrome, อ้วน, เบาหวาน, ไขมันสูง, cardiovascular disease, ซึมเศร้า, IBD\n\n### Psoriasis: อาการ\n- **Plaque psoriasis** (พบบ่อยสุด): ปื้นแดงขอบชัด มีขุยหนาสีเงิน ที่ **ด้านเหยียด (ข้อศอก เข่า)** หนังศีรษะ เอวด้านหลัง/lumbosacral สะดือ ร่องก้น มักสมมาตร\n- **Auspitz sign** (ขูดขุยออกมีจุดเลือดออก), **Koebner phenomenon** (ผื่นขึ้นตามรอยเกา/แผล)\n- **เล็บ**: pitting (จาก matrix), onycholysis, oil-drop/salmon patch, subungual hyperkeratosis, splinter hemorrhage; เล็บที่เป็นบ่งชี้ความเสี่ยง psoriatic arthritis และต้องแยกจาก onychomycosis ด้วย KOH\n- ชนิดอื่น: **guttate** (ตุ่มขุยเล็กจำนวนมากหลัง streptococcal pharyngitis ในเด็ก/วัยรุ่น), inverse (ซอกพับ ไม่มีขุย), **pustular** และ **erythrodermic** (รุนแรง มักตามหลังหยุด systemic steroid)\n\n### ปัจจัยกระตุ้น psoriasis\n| กลุ่ม | ตัวอย่าง |\n|---|---|\n| Physical trauma | เกา ถู แผล รอยสัก (Koebner) |\n| Infection | streptococcal pharyngitis (guttate), HIV (เป็นรุนแรงขึ้นมาก) |\n| Drugs | **lithium, beta-blocker, antimalarial (chloroquine/HCQ), interferon**, ACE inhibitor, NSAIDs บางชนิด, **หยุด systemic corticosteroid** (rebound pustular/erythrodermic), immune checkpoint inhibitor |\n| Lifestyle/metabolic | **ความเครียดทางจิตใจ, แอลกอฮอล์, สูบบุหรี่, อ้วน** |\n| สิ่งแวดล้อม | อากาศหนาวแห้ง; hypocalcemia (pustular) |\n\n- **แสงแดด/UV ส่วนใหญ่ทำให้ดีขึ้น** (เป็นที่มาของ phototherapy) มีเพียงส่วนน้อยที่ไวแสง ส่วนการอดนอนไม่ใช่ trigger หลักที่ยอมรับในตำรา จึงเป็นตัวเลือก \"LEAST likely\" เมื่อเทียบกับ trigger มาตรฐานข้างต้น\n\n### Psoriasis: ประเมินความรุนแรงและรักษา\n- ฝ่ามือผู้ป่วย 1 ฝ่ามือ ≈ 1% BSA; ใช้ \"rule of 10\": **BSA >10% หรือ PASI >10 หรือ DLQI >10** = moderate–severe; ตำแหน่งพิเศษ (หน้า มือ เท้า อวัยวะเพศ เล็บ หนังศีรษะ) อาจนับเป็นรุนแรงแม้ BSA น้อย\n- **Mild (topical)**: potent topical corticosteroid + **vitamin D analog (calcipotriol)** ซึ่งเสริมกันและลดการใช้ steroid (calcipotriol ไม่เกิน 100 g/สัปดาห์ เสี่ยง hypercalcemia); coal tar, salicylic acid สำหรับขุยหนาที่หนังศีรษะ; หน้าและซอกพับใช้ steroid อ่อนหรือ topical tacrolimus\n- **Moderate–severe**: phototherapy **NB-UVB** สัปดาห์ละ 2–3 ครั้ง\n- **Methotrexate 7.5–25 mg สัปดาห์ละครั้ง** + folic acid; ตรวจ CBC, LFT, creatinine; ห้ามในครรภ์และไตเสื่อม\n- **Cyclosporine 2.5–5 mg/kg/day** ระยะสั้นสำหรับคุมโรคเร็ว; เฝ้า BP และ creatinine\n- **Acitretin**: เหมาะกับ pustular/erythrodermic; teratogenic ต้องคุมกำเนิดถึง 3 ปีหลังหยุดยา จึงเลี่ยงในหญิงวัยเจริญพันธุ์\n- Apremilast (PDE4 inhibitor), deucravacitinib (TYK2 inhibitor)\n- **Biologics**: anti-TNF (adalimumab, etanercept, infliximab), anti-IL-17 (secukinumab, ixekizumab; ระวังใน IBD), anti-IL-23 (guselkumab, risankizumab), anti-IL-12/23 (ustekinumab)\n- ก่อนให้ MTX/biologics ต้อง **คัดกรอง TB latent (IGRA/TST + CXR) และ HBV** โดยเฉพาะในไทยซึ่งเป็นพื้นที่ระบาด\n- **ห้ามใช้ systemic corticosteroid** ในการรักษา psoriasis เพราะหยุดแล้วกำเริบรุนแรงเป็น pustular/erythrodermic\n\n### Lichen planus: กลไก\n- **CD8+ T cell โจมตี basal keratinocyte** (cell-mediated, interface dermatitis) เกิด band-like lymphocytic infiltrate ที่ dermoepidermal junction\n- สัมพันธ์กับ **hepatitis C** (โดยเฉพาะ oral LP) ควรตรวจ anti-HCV; ยาหลายตัวทำให้เกิด **lichenoid drug eruption** (thiazide, beta-blocker, ACE inhibitor, antimalarial, gold, immune checkpoint inhibitor) ซึ่งมักกระจายตามที่ถูกแดดและไม่ค่อยมี Wickham striae\n\n### Lichen planus: อาการ\n- จำ **6P: pruritic, purple (violaceous), polygonal, planar (flat-topped), papules and plaques**\n- ผิวมีลายเส้นขาวละเอียด **Wickham striae** เห็นชัดด้วย dermoscopy มี Koebner phenomenon\n- ตำแหน่ง: **ด้านงอของข้อมือ**, ปลายแขน, ข้อเท้า, หน้าแข้ง (hypertrophic LP), เอว, อวัยวะเพศ\n- **Oral LP**: ลายร่างแหขาวที่ buccal mucosa สองข้าง (reticular) พบบ่อยสุด ชนิด erosive เจ็บและเพิ่มความเสี่ยง squamous cell carcinoma ต้องติดตาม\n- เล็บ: **pterygium**, เล็บบางมีร่อง; หนังศีรษะ: lichen planopilaris (ผมร่วงแบบแผลเป็น)\n- ผิวไทยมักทิ้ง postinflammatory hyperpigmentation เข้มนาน\n- Histology: hyperkeratosis, wedge-shaped hypergranulosis, saw-tooth rete ridges, band-like infiltrate, Civatte (colloid) bodies\n\n### Lichen planus: รักษา\n- ผื่นผิวหนังมักหายเองใน 1–2 ปี การรักษามุ่งลดคันและการอักเสบ\n- **First-line สำหรับ localized cutaneous LP = potent/super-potent topical corticosteroid** (เช่น clobetasol propionate 0.05% หรือ betamethasone dipropionate 0.05%) วันละ 2 ครั้ง ร่วม oral antihistamine\n- Hypertrophic LP: intralesional triamcinolone acetonide 5–10 mg/mL หรือ steroid ใต้ occlusion\n- Oral LP: topical steroid ชนิดเจล/ใน orabase หรือ topical tacrolimus, หลีกเลี่ยงอาหารเผ็ดและสิ่งระคายเคือง\n- Generalized/รุนแรง: oral prednisolone ระยะสั้น (~0.5 mg/kg/day ลดขนาดใน 4–6 สัปดาห์), NB-UVB, acitretin, methotrexate\n- หยุดยาที่สงสัยถ้าเป็น lichenoid drug eruption\n\n### ความแรงของ topical corticosteroid (ที่ใช้บ่อย)\n| ความแรง | ตัวอย่าง | ใช้ที่ |\n|---|---|---|\n| Super-potent | clobetasol propionate 0.05% | ปื้นหนา ฝ่ามือฝ่าเท้า LP/psoriasis ระยะสั้น ≤2–4 สัปดาห์ |\n| Potent | betamethasone dipropionate 0.05%, mometasone furoate 0.1% ointment | ลำตัว แขนขา |\n| Mid | triamcinolone acetonide 0.1%, betamethasone valerate 0.1% cream | ผื่นทั่วไป |\n| Low | hydrocortisone 1% | หน้า ซอกพับ เด็ก |\n\n- ผลข้างเคียงเฉพาะที่: ผิวบาง striae telangiectasia steroid acne; ไม่ใช้ potent บนหน้าและซอกพับ", "pearls": ["Psoriasis: ปื้นแดงขุยเงินที่ข้อศอก เข่า หนังศีรษะ เอว + nail pitting/onycholysis", "Trigger ของ psoriasis: trauma (Koebner), strep (guttate), lithium/beta-blocker/antimalarial, หยุด systemic steroid, เครียด, สุรา, บุหรี่, อ้วน; แสงแดดส่วนใหญ่ทำให้ดีขึ้น", "ห้ามใช้ systemic steroid ใน psoriasis (rebound pustular/erythrodermic); คัดกรอง TB/HBV ก่อน MTX/biologics", "Lichen planus = 6P + Wickham striae ที่ด้านงอข้อมือ; ตรวจ anti-HCV", "First-line ของ localized lichen planus = potent topical corticosteroid"], "traps": [], "q": [{"id": "DE-OLDP-012", "q": "A 40-year-old man has had a relapsing-remitting scalp rash for 1 year. Examination shows scaly erythematous plaques on the scalp, elbows, knees and lower back, with onycholysis and pitting of the fingernails. Which factor is LEAST likely to aggravate his disease?", "a": "อดนอน (sleep deprivation)", "y": [31], "t": 320}, {"id": "PP35-DER-055", "q": "A 40-year-old man has localised itchy, flat-topped, violaceous polygonal papules with fine white streaks on the wrists. Biopsy confirms lichen planus. What is the first-line treatment?", "a": "Potent topical corticosteroid", "y": [35], "t": 330}], "years": [31, 35], "th": [330]}, {"id": "gap-derm-05", "set": "derm", "title": "Fixed drug eruption: ผื่นแพ้ยาที่ขึ้นซ้ำที่เดิม", "subtitle": "วงม่วงคล้ำ ขอบชัด ขึ้นที่เดิมทุกครั้งที่ได้ยา หายแล้วทิ้งรอยดำ", "md": "### กลไก\n- เป็น **delayed hypersensitivity (type IV)** ที่ตำแหน่งเฉพาะ หลังได้ยาครั้งแรกจะเกิด sensitization ต่อมา **CD8+ intraepidermal resident memory T cell** ค้างอยู่ที่ผิวหนังตรงรอยโรคเดิม\n- เมื่อได้ยาซ้ำ T cell เหล่านี้ถูกกระตุ้นทันที หลั่ง IFN-γ และ granzyme ทำลาย keratinocyte เฉพาะที่ จึง **ขึ้นเร็วและขึ้นที่เดิม** และอาจเพิ่มจุดใหม่เมื่อได้ยาซ้ำหลายครั้ง\n- การทำลายชั้น basal ทำให้ melanin ตกลงไปใน dermis (pigment incontinence) จึง **ทิ้งรอยดำนาน** ในผิวคนเอเชีย\n\n### อาการ\n- ผื่นวงกลมหรือรี **ขอบชัด สีแดงคล้ำถึงม่วงเข้ม (dusky violaceous)** ขนาดไม่กี่ cm จำนวน 1 ถึงไม่กี่วง ตรงกลางอาจพองเป็นตุ่มน้ำหรือถลอก แสบร้อนหรือคัน\n- **ขึ้นภายใน 30 นาทีถึง 8 ชม. (ส่วนใหญ่ <24 ชม.) หลังได้ยาซ้ำ**\n- ตำแหน่งที่พบบ่อย: **ริมฝีปาก อวัยวะเพศ (glans penis)** มือ เท้า รอบทวารหนัก\n- หายใน 1–2 สัปดาห์หลังหยุดยา ทิ้ง **postinflammatory hyperpigmentation** สีน้ำตาลเทา ซึ่งจะแดงขึ้นอีกเมื่อได้ยาซ้ำ\n- อาการทั่วไปมักไม่มีหรือน้อย\n\n### ยาที่เป็นสาเหตุบ่อย\n- **Sulfonamide โดยเฉพาะ co-trimoxazole** (พบบ่อยที่สุดในไทย)\n- NSAIDs (mefenamic acid, naproxen, ibuprofen, oxicams) และ paracetamol\n- Tetracycline/doxycycline, metronidazole, fluoroquinolone\n- Barbiturate, carbamazepine, allopurinol, phenolphthalein\n- Pseudoephedrine ทำให้เกิด non-pigmenting FDE\n- ยาที่ซื้อเองหรือยาชุดเป็นสาเหตุที่ซ่อนอยู่บ่อย ต้องซักประวัติยาแก้ปวด ยาลดไข้ ยาปฏิชีวนะที่กินเป็นครั้งคราว\n\n### ชนิดที่ต้องระวัง: Generalized bullous FDE (GBFDE)\n- ตุ่มน้ำกว้างหลายวง พื้นที่ >10% BSA อาจคล้าย SJS/TEN แต่รอยโรคเป็นวงชัดมีผิวปกติคั่น เยื่อบุเป็นน้อยกว่า ป่วยน้อยกว่า\n- ในผู้สูงอายุอัตราตายใกล้เคียง SJS/TEN จึงต้อง admit ดูแลแบบ burn/SJS-TEN\n\n### วินิจฉัย\n- ส่วนใหญ่วินิจฉัยจาก **ประวัติขึ้นที่เดิมหลังได้ยาเดิม** + ลักษณะผื่น\n- Biopsy: interface dermatitis, necrotic keratinocytes, **pigment incontinence (melanophage ใน dermis)**\n- Patch test บนตำแหน่งรอยโรคเดิม (lesional patch test) ช่วยหายา; oral provocation test ทำได้เฉพาะ FDE ชนิดไม่รุนแรงภายใต้การดูแลใกล้ชิด ห้ามทำใน GBFDE\n\n### รักษา\n- **หยุดและหลีกเลี่ยงยาที่เป็นสาเหตุตลอดไป** รวมยาในกลุ่มเดียวกัน\n- รอยโรคที่ไม่ถลอก: **potent topical corticosteroid** สั้น ๆ ร่วม oral antihistamine\n- รอยถลอก/ตุ่มน้ำ: ทำแผลแบบชุ่มชื้น ป้องกันติดเชื้อ\n- GBFDE: admit ดูแลเหมือน SJS/TEN\n- ออก **บัตรแพ้ยา** บันทึกในเวชระเบียน/ระบบโรงพยาบาล และสอนผู้ป่วยอ่านชื่อยาสามัญ (เช่น co-trimoxazole อยู่ในยาชื่อการค้าหลายชื่อ)\n- รอยดำจางช้าเป็นเดือนถึงปี ทาครีมกันแดดช่วยได้\n\n### เทียบเวลาเกิดของผื่นแพ้ยา\n| ชนิด | เวลาหลังได้ยา | ลักษณะเด่น |\n|---|---|---|\n| Urticaria/anaphylaxis (type I) | นาทีถึงชั่วโมง | ผื่นลมพิษหายใน 24 ชม., angioedema |\n| **Fixed drug eruption** | **30 นาทีถึง 8 ชม. เมื่อได้ยาซ้ำ** | วงม่วงคล้ำ ขึ้นที่เดิม ทิ้งรอยดำ |\n| AGEP | 1–2 วัน (ชั่วโมงถึงไม่กี่วัน) | ตุ่มหนองเล็กไม่ติดรูขุมขนจำนวนมาก ไข้ |\n| Maculopapular exanthem | 4–14 วัน | ผื่นแดงทั่วตัว พบบ่อยที่สุด |\n| SJS/TEN | 4–28 วัน | target atypical, ผิวหลุดลอก, เยื่อบุ ≥2 แห่ง |\n| DRESS | 2–8 สัปดาห์ | ไข้ ผื่น หน้าบวม eosinophilia ตับอักเสบ |", "pearls": ["ผื่นวงม่วงคล้ำขอบชัด ขึ้นที่เดิมทุกครั้งที่ได้ยา หายแล้วทิ้งรอยดำ = fixed drug eruption", "ตำแหน่งบ่อย: ริมฝีปาก อวัยวะเพศ มือ เท้า; ขึ้นภายใน 30 นาที–8 ชม. หลังได้ยาซ้ำ", "ยาที่พบบ่อยสุดในไทย: co-trimoxazole (sulfonamide) ตามด้วย NSAIDs และ tetracycline", "รักษา: หยุดยา + potent topical steroid + antihistamine + บัตรแพ้ยา; GBFDE ดูแลเหมือน SJS/TEN"], "traps": [], "q": [{"id": "PP30-DER-139", "q": "A patient develops a recurrent single, round, dusky violaceous patch on the lip that reappears at exactly the same site each time he takes co-trimoxazole, leaving hyperpigmentation. What is the diagnosis?", "a": "Fixed drug eruption", "y": [30], "t": 307}], "years": [30], "th": [307]}], "left": []}]};</script>

<script>
const D = __DATA__;
const LET = 'ABCDE';
const LECTURES = 'https://claude.ai/artifact/8ir2xCgMKC7Fn4MiE2a5AV';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl = s => esc(s).replace(/\*\*\*?(.+?)\*\*\*?/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
function md(t){
  let out = '', ul = false, ol = false, tb = [];
  const flush = () => { if (!tb.length) return;
    const rows = tb.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    out += '<div class="tw"><table>' + rows.map((r, i) => '<tr>' + r.map(c => i ? '<td>' + inl(c) + '</td>' : '<th>' + inl(c) + '</th>').join('') + '</tr>').join('') + '</table></div>'; tb = []; };
  String(t || '').split('\n').forEach(L => {
    if (/^\s*\|/.test(L)) { if (ul) { out += '</ul>'; ul = false; } if (ol) { out += '</ol>'; ol = false; } tb.push(L); return; }
    flush();
    if (/^\s*[-*] /.test(L)) { if (ol) { out += '</ol>'; ol = false; } if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + inl(L.replace(/^\s*[-*] /, '')) + '</li>'; }
    else if (/^\s*\d+\. /.test(L)) { if (ul) { out += '</ul>'; ul = false; } if (!ol) { out += '<ol>'; ol = true; } out += '<li>' + inl(L.replace(/^\s*\d+\. /, '')) + '</li>'; }
    else { if (ul) { out += '</ul>'; ul = false; } if (ol) { out += '</ol>'; ol = false; } if (/^#{2,4} /.test(L)) out += '<h4 class="mdh">' + inl(L.replace(/^#{2,4} /, '')) + '</h4>'; else if (L.trim()) out += '<p>' + inl(L) + '</p>'; }
  });
  flush();
  return '<div class="md">' + out + (ul ? '</ul>' : '') + (ol ? '</ol>' : '') + '</div>';
}
// ---------- ความจำ (เก็บในเครื่องผู้ใช้) ----------
const KEY = 'med421-prep-v1';
let ST = { ans: {}, view: 'home', set: D.sets[0]?.key, mode: 'one', filt: 'all' };
try { Object.assign(ST, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };

const ALL = [];
D.sets.forEach(s => {
  s.one.forEach((x, i) => ALL.push(Object.assign(x, { kind: 'one', set: s.key, no: s.label + ' ' + (i + 1) })));
  s.synth.forEach(x => ALL.push(Object.assign(x, { kind: 'synth', set: s.key, no: x.id })));
});
(D.pics || []).forEach(x => ALL.push(Object.assign(x, { no: x.id, years: x.years || [] })));
const PICS = ALL.filter(x => x.kind === 'pic' || x.kind === 'saq');
const MCQ = ALL.filter(x => x.kind !== 'saq');
const BYID = Object.fromEntries(ALL.map(x => [x.kind + ':' + x.id, x]));
const k = x => x.kind + ':' + x.id;
const done = L => L.filter(x => ST.ans[k(x)] !== undefined).length;
const right = L => L.filter(x => ST.ans[k(x)] !== undefined && ST.ans[k(x)] === x.answer).length;
const wrongs = () => ALL.filter(x => ST.ans[k(x)] !== undefined && ST.ans[k(x)] !== x.answer);

function go(v){ ST.view = v; if (v === 'one' || v === 'synth' || v === 'pic') ST.mode = v; save(); render(); window.scrollTo(0, 0); }
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

function render(){
  document.querySelectorAll('.bn').forEach(b => { if (b.dataset.go === (ST.view === 'drill' ? ST.mode : ST.view)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (ST.view === 'home') return renderHome();
  if (ST.view === 'wrong') return renderWrong();
  if (ST.view === 'lec') return renderLec();
  return renderDrill();
}

function renderHome(){
  const one = ALL.filter(x => x.kind === 'one'), syn = ALL.filter(x => x.kind === 'synth');
  const d = done(MCQ), p = MCQ.length ? d / MCQ.length : 0, acc = d ? Math.round(right(MCQ) / d * 100) : 0;
  const nextSet = D.sets.find(s => done(s.one) < s.one.length) || D.sets[0];
  $('#app').innerHTML = `
  <div class="top"><div><h1>MED421 Prep Drill</h1><p>แก่นละ 1 ข้อจากโพย MED28–35 และโจทย์รวบยอดที่เติมหัวข้อ NL 2567</p></div><a class="toplink press" href="${LECTURES}" target="_blank" rel="noopener">${BOOK}MED421 Lectures</a></div>
  <section class="hero">
    <div class="hero-r"><div style="display:grid;gap:4px;min-width:0"><span style="font-size:14px;opacity:.8">ความคืบหน้า</span>
      <h2>ทำไปแล้ว ${d} จาก ${MCQ.length} ข้อ</h2><p>ตอบถูก ${acc}% ของข้อที่ทำ</p></div>
      <div class="ring" style="--p:${p}"><div class="ring-in"><b>${Math.round(p * 100)}</b><small>%</small></div></div></div>
    <button class="next press" id="cont"><span><small>ทำต่อ</small><b>${esc(nextSet.label)} ${esc(nextSet.thai)}: แก่นละ 1 ข้อ</b></span><i>→</i></button>
  </section>
  <div class="tiles">
    <button class="tile press" data-go2="pic"><small>ข้อสอบมีรูป</small><b>${PICS.length}<em> ข้อ</em></b></button>
    <button class="tile press" data-go2="one"><small>แก่นละ 1 ข้อ</small><b>${done(one)}<em> / ${one.length}</em></b></button>
    <button class="tile press" data-go2="synth"><small>โจทย์รวบยอด</small><b>${done(syn)}<em> / ${syn.length}</em></b></button>
    <button class="tile press" data-go2="wrong"><small>ข้อที่ตอบผิด</small><b>${wrongs().length}</b></button>
  </div>
  <button class="homelx press" id="golx"><span><small>เทียบโพยกับบทเรียน</small><b>แต่ละคาบข้อสอบเน้นหัวข้อไหน และบทเสริม ${LX.sys.reduce((a, s) => a + s.gaps.length, 0)} บท</b></span><i>→</i></button>
  <div class="whead"><h3>เลือกระบบ</h3><span>${D.sets.length} ระบบ</span></div>
  <div class="grid">${D.sets.map(s => { const L = ALL.filter(x => x.set === s.key), dd = done(L);
    return `<button class="scard press" data-set="${s.key}"><span class="nm">${esc(s.label)}</span><span class="th">${esc(s.thai)}</span>
      <span class="ct"><b>${s.one.length}</b> แก่น <b>${s.synth.length}</b> รวบยอด</span><span class="bar"><i style="width:${L.length ? dd / L.length * 100 : 0}%"></i></span></button>`; }).join('')}</div>
  <details class="about"><summary>ชุดนี้คืออะไร</summary><div>
    <ol>
      <li><b>แก่นละ 1 ข้อ</b>: ข้อสอบเก่า 1,101 ข้อในคลัง Ward Drill ยุบเหลือ ${one.length} แก่น เลือกข้อที่ออกหลายรุ่นที่สุดมาเป็นตัวแทน เรียงจากแก่นที่ออกบ่อยก่อน เฉลยมีเนื้อหาที่เกี่ยวข้องที่ต้องรู้ และข้ออื่นในแก่นเดียวกันไว้ทวนเร็ว</li>
      <li><b>โจทย์รวบยอด</b>: โจทย์ใหม่ ${syn.length} ข้อ แต่ละข้อรวมหลายแก่นที่เป็นเรื่องเดียวกัน และเติมหัวข้อในเกณฑ์ NL 2567 ที่โพยยังไม่เคยออก เฉลยมีสรุปทั้งเรื่อง</li>
      <li><b>ข้อสอบมีรูป</b>: ${PICS.length} ข้อจากรูปในโพย MED35 (ECG, CXR, smear, ผื่น ฯลฯ) และรูปเดียวกันแนบไว้ในเฉลยของแก่นที่เกี่ยวข้อง</li>
      <li><b>บทเรียน</b>: ข้อสอบเก่าทุกข้อจับคู่กับหัวข้อในหน้า MED421 learn ทั้ง 49 คาบ ดูได้ว่าแต่ละคาบข้อสอบไปกองที่หัวข้อไหน หัวข้อไหนไม่เคยออก และกดไปทำข้อของแก่นนั้นได้ ส่วนเรื่องที่โพยออกแต่ยังไม่มีคาบ มีบทเสริมเขียนไว้ท้ายแต่ละระบบ</li>
      <li>ความคืบหน้าเก็บไว้ในเครื่องนี้เท่านั้น ถ้าล้างข้อมูลเบราว์เซอร์จะเริ่มใหม่</li>
    </ol>
    <button class="chip press" id="reset" style="justify-self:start">ล้างความคืบหน้า</button>
  </div></details>`;
  $('#golx').onclick = () => go('lec');
  $('#cont').onclick = () => { ST.set = nextSet.key; ST.lec = ''; ST.mode = 'one'; go('drill'); };
  document.querySelectorAll('[data-go2]').forEach(b => b.onclick = () => go(b.dataset.go2 === 'wrong' ? 'wrong' : (ST.mode = b.dataset.go2, 'drill')));
  document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { ST.set = b.dataset.set; ST.lec = ''; go('drill'); });
  let armed = false;
  $('#reset').onclick = e => { if (!armed) { armed = true; e.target.textContent = 'กดอีกครั้งเพื่อยืนยัน'; return; } ST.ans = {}; save(); render(); };
}

let shown = 30;
function renderDrill(){
  if (ST.view !== 'drill') ST.view = 'drill';
  const s = D.sets.find(x => x.key === ST.set) || D.sets[0];
  const lecOK = x => !ST.lec || (x.lecs || []).includes(ST.lec);
  const pool = ST.mode === 'pic' ? PICS : ST.lec ? D.sets.flatMap(x => ST.mode === 'one' ? x.one : x.synth) : (ST.mode === 'one' ? s.one : s.synth);
  const base = pool.filter(lecOK);
  const lecKeys = [...new Set(D.sets.flatMap(x => [...x.one, ...x.synth]).flatMap(x => x.lecs || []))].filter(k2 => k2.startsWith(s.key + '-')).sort();
  const L = base.filter(x => ST.filt === 'all' ? true : ST.filt === 'todo' ? ST.ans[k(x)] === undefined : ST.ans[k(x)] !== undefined && ST.ans[k(x)] !== x.answer);
  $('#app').innerHTML = `
  <div class="strip" role="tablist" ${ST.mode === 'pic' ? 'hidden' : ''}>${D.sets.map(x => `<button class="tab press" role="tab" aria-selected="${x.key === s.key}" data-s="${x.key}">${esc(x.label)}<span class="n">${(ST.mode === 'one' ? x.one : x.synth).length}</span></button>`).join('')}</div>
  <div class="bar2">
    <div class="seg" role="group" aria-label="ชุดข้อ"><button data-m="one" aria-pressed="${ST.mode === 'one'}">แก่นละ 1 ข้อ</button><button data-m="synth" aria-pressed="${ST.mode === 'synth'}">โจทย์รวบยอด</button><button data-m="pic" aria-pressed="${ST.mode === 'pic'}">มีรูป</button></div>
    <div class="chips" role="group" aria-label="กรอง"><button class="chip press" data-f="all" aria-pressed="${ST.filt === 'all'}">ทั้งหมด</button><button class="chip press" data-f="todo" aria-pressed="${ST.filt === 'todo'}">ยังไม่ทำ</button><button class="chip press" data-f="wrong" aria-pressed="${ST.filt === 'wrong'}">ตอบผิด</button></div>
  </div>
  ${lecKeys.length > 1 || ST.lec ? `<div class="lecbar"><label for="lecsel">คาบ</label><select id="lecsel"><option value="">ทุกคาบของ ${esc(s.label)}</option>${lecKeys.map(k2 => `<option value="${k2}" ${k2 === ST.lec ? 'selected' : ''}>${esc((D.lecnames[k2] || k2))}</option>`).join('')}</select>${ST.lec ? `<a class="toplink press" href="${LECTURES}" target="_blank" rel="noopener">${BOOK}Lectures</a>` : ''}</div>` : ''}
  <div class="phead"><h2>${ST.lec ? esc(D.lecnames[ST.lec] || ST.lec) + (ST.mode === 'pic' ? ' (ข้อมีรูป)' : '') : ST.mode === 'pic' ? 'ข้อสอบมีรูป ทุกระบบ' : esc(s.label) + ' ' + esc(s.thai)}</h2><span>ทำแล้ว ${done(base)}/${base.length} ข้อ ตอบถูก ${right(base)}</span></div>
  <div class="stream" id="stream">${L.length ? L.slice(0, shown).map(card).join('') : `<p class="empty">${ST.filt === 'wrong' ? 'ยังไม่มีข้อที่ตอบผิดในระบบนี้' : 'ทำครบทุกข้อในระบบนี้แล้ว เลือกระบบอื่นจากแถบด้านบน'}</p>`}</div>
  ${L.length > shown ? `<button class="chip press more" id="more">แสดงอีก ${Math.min(30, L.length - shown)} ข้อ (เหลือ ${L.length - shown})</button>` : ''}`;
  if ($('#lecsel')) $('#lecsel').onchange = e => { ST.lec = e.target.value; shown = 30; save(); render(); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { ST.set = b.dataset.s; ST.lec = ''; shown = 30; save(); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { ST.mode = b.dataset.m; shown = 30; save(); render(); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ST.filt = b.dataset.f; shown = 30; save(); render(); });
  if ($('#more')) $('#more').onclick = () => { shown += 30; render(); };
  bindCards();
}

function renderWrong(){
  const W = wrongs();
  $('#app').innerHTML = `<div class="phead"><h2>ทวนข้อที่ตอบผิด</h2><span>${W.length} ข้อ จากทุกระบบ</span></div>
  <div class="stream">${W.length ? W.map(card).join('') : '<p class="empty">ยังไม่มีข้อที่ตอบผิด ลองทำ "แก่นละ 1 ข้อ" ก่อน แล้วข้อที่ผิดจะมารวมที่นี่</p>'}</div>`;
  bindCards();
}

function card(x){
  const id = k(x), a = ST.ans[id], answered = a !== undefined;
  const label = (D.sets.find(s => s.key === x.set) || {label: x.set}).label;
  if (x.kind === 'saq') return saqCard(x, label);
  const figs = x.img ? `<div class="figs">${x.img.map(i => `<figure><img src="${esc(i.src)}" alt="${esc(i.cap)}" loading="lazy"><figcaption>${esc(i.cap)}</figcaption></figure>`).join('')}</div>` : '';
  const yrs = x.years.map(y => `<span class="tag yr">MED${y}</span>`).join('');
  const head = x.kind === 'one'
    ? `<span class="qno">${esc(x.no)}</span>${x.years.length >= 4 ? `<span class="tag hot">ออก ${x.years.length} รุ่น</span>` : `<span class="tag">ออก ${x.years.length} รุ่น</span>`}${yrs}`
    : x.kind === 'pic' ? `<span class="qno">${esc(x.id)}</span><span class="tag">${esc(label)}</span>${yrs}`
    : `<span class="qno">${esc(x.id)}</span><span class="tag">คลุม ${x.themes.length} แก่น</span>${x.nl.length ? `<span class="tag nl">+NL ${x.nl.length}</span>` : ''}${yrs}`;
  const ch = x.choices.map((c, i) => {
    let cls = '';
    if (answered) cls = i === x.answer ? 'ok' : i === a ? 'miss' : 'dim';
    return `<button class="choice press ${cls}" data-id="${id}" data-i="${i}" ${answered ? 'disabled' : ''}><span class="l">${LET[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');
  let panel = '';
  if (answered) {
    const ok = a === x.answer;
    panel = `<p class="verdict ${ok ? 'ok' : 'miss'}">${ok ? '✓ ถูกต้อง' : '✗ ยังไม่ใช่ คำตอบคือ ' + LET[x.answer]}</p><div class="panel">` + (x.kind === 'one'
      ? `<div class="blk"><h4>เฉลย</h4>${md(x.note)}</div>${x.fix ? `<p class="fix"><strong>แก้ตามแนวทางปัจจุบัน:</strong> ${inl(x.fix)}</p>` : ''}
         <div class="blk"><h4>เนื้อหาที่เกี่ยวข้องที่ต้องรู้</h4>${md(x.related)}</div>
         ${x.pics ? `<div class="blk"><h4>รูปจากข้อสอบจริง MED35</h4><div class="thumbs">${x.pics.map(p => `<button class="press" data-pic="${esc(p.id)}"><img src="${esc(p.img[0].src)}" alt="" loading="lazy">${esc(p.id)} ดูข้อนี้</button>`).join('')}</div></div>` : ''}
         ${x.others.length ? `<details class="others blk"><summary>ข้ออื่นในแก่นนี้ (${x.others.length})</summary><ol>${x.others.map(o => `<li>${esc(o.q)} ${o.years.length ? `<em class="src">(MED${o.years.join(', MED')})</em>` : ''}<span>→ ${esc(o.a)}</span></li>`).join('')}</ol></details>` : ''}
         <p class="src">${esc(x.src)}</p>`
      : x.kind === 'pic' ? `<div class="blk"><h4>เฉลย</h4>${md(x.explain)}</div>${x.fix ? `<p class="fix"><strong>แก้ไข:</strong> ${inl(x.fix)}</p>` : ''}${x.pearl ? `<p class="pearl">${inl(x.pearl)}</p>` : ''}<p class="cov">แก่น: ${esc(x.theme)}</p>`
      : `<div class="blk"><h4>เฉลย</h4>${md(x.explain)}</div><div class="blk"><h4>สรุปทั้งเรื่อง</h4>${md(x.fullcover)}</div>
         ${x.pearl ? `<p class="pearl">${inl(x.pearl)}</p>` : ''}
         <p class="cov">ครอบคลุมแก่น: ${x.themes.map(esc).join(' / ')}${x.nl.length ? '<br>เพิ่มจาก NL ที่โพยยังไม่เคยออก: ' + x.nl.map(esc).join(' / ') : ''}</p>`) +
      `</div><button class="reveal press" data-reset="${id}">ลองทำข้อนี้ใหม่</button>`;
  }
  return `<article class="item" id="c-${id.replace(':', '-')}"><div class="ihead">${head}${ST.view === 'wrong' ? `<span class="tag">${esc(label)}</span>` : ''}</div>
    <h3 class="topic">${esc(x.kind === 'one' ? x.theme : x.title)}</h3><p class="stem">${esc(x.q)}</p>${figs}<div class="choices">${ch}</div>${panel}</article>`;
}
function saqCard(x, label){
  return `<article class="item" id="c-${k(x).replace(':', '-')}"><div class="ihead"><span class="qno">${esc(x.id)}</span><span class="tag">${esc(label)}</span><span class="tag">${esc(x.station || 'SAQ')}</span>${x.years.map(y => `<span class="tag yr">MED${y}</span>`).join('')}</div>
    <h3 class="topic">${esc(x.title)}</h3>${md(x.q)}<div class="figs" style="margin-top:12px">${x.img.map(i => `<figure><img src="${esc(i.src)}" alt="${esc(i.cap)}" loading="lazy"><figcaption>${esc(i.cap)}</figcaption></figure>`).join('')}</div>
    <div class="saq">${x.parts.map(p => `<details><summary>${esc(p.q)}</summary><div>${md(p.a)}</div></details>`).join('')}</div>
    ${x.fix ? `<p class="fix" style="margin-top:12px"><strong>แก้ไข:</strong> ${inl(x.fix)}</p>` : ''}${x.pearl ? `<p class="pearl" style="margin-top:12px">${inl(x.pearl)}</p>` : ''}<p class="cov" style="margin-top:8px">แก่น: ${esc(x.theme)}</p></article>`;
}
document.addEventListener('click', e => {
  const im = e.target.closest('.figs img');
  if (im) { const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = `<img src="${im.getAttribute('src')}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; }
  const pb = e.target.closest('[data-pic]');
  if (pb) { ST.mode = 'pic'; ST.filt = 'all'; shown = 99; go('drill'); const el = document.getElementById('c-' + (BYID['pic:' + pb.dataset.pic] ? 'pic-' : 'saq-') + pb.dataset.pic); if (el) el.scrollIntoView(); }
});
function bindCards(){
  document.querySelectorAll('.choice:not([disabled])').forEach(b => b.onclick = () => {
    ST.ans[b.dataset.id] = +b.dataset.i; save();
    const el = b.closest('.item'); el.outerHTML = card(BYID[b.dataset.id]); bindCards(); refreshHead();
  });
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    delete ST.ans[b.dataset.reset]; save(); const el = b.closest('.item'); el.outerHTML = card(BYID[b.dataset.reset]); bindCards(); refreshHead();
  });
}
function refreshHead(){
  const h = document.querySelector('.phead span'); if (!h || ST.view !== 'drill') return;
  const s = D.sets.find(x => x.key === ST.set); const base = (ST.mode === 'pic' ? PICS : ST.lec ? D.sets.flatMap(x => ST.mode === 'one' ? x.one : x.synth) : (ST.mode === 'one' ? s.one : s.synth)).filter(x => !ST.lec || (x.lecs || []).includes(ST.lec));
  h.textContent = `ทำแล้ว ${done(base)}/${base.length} ข้อ ตอบถูก ${right(base)}`;
}

// ---------- หน้าบทเรียน: เทียบโพยกับหัวข้อใน MED421 learn + บทเสริมเรื่องที่ยังไม่มีคาบ (เพิ่ม 16 พ.ย.) ----------
const LX_ANG = {dx:'วินิจฉัย',mx:'รักษา/จัดการ',ix:'เลือกส่งตรวจ',interp:'อ่านผล ECG/ภาพ/แลป',mech:'กลไก เชื้อ ยา',fact:'จำนิยาม ตัวเลข เกณฑ์'};
const LX_AK = Object.keys(LX_ANG);
const LX_TH = {};
D.sets.forEach(s => s.one.forEach(x => { LX_TH[x.theme] = { set: s.key, id: x.id }; }));
let lxHide = false;
try { lxHide = localStorage.getItem('med421-prep-lxhide') === '1'; } catch (e) {}
const lxMix = c => { const t = LX_AK.reduce((a, k2) => a + (c[k2] || 0), 0) || 1; return LX_AK.filter(k2 => c[k2]).map(k2 => `<i class="a-${k2}" style="width:${(c[k2] / t * 100).toFixed(1)}%"></i>`).join(''); };
const lxLeg = (c, pct) => { const t = LX_AK.reduce((a, k2) => a + (c[k2] || 0), 0) || 1; return LX_AK.filter(k2 => c[k2]).map(k2 => `<span><i class="lx-sw a-${k2}"></i>${LX_ANG[k2]} <b class="num">${pct ? Math.round(c[k2] / t * 100) + '%' : c[k2]}</b></span>`).join(''); };
const lxY = ys => ys.map(y => `<span class="lx-y">${y}</span>`).join('');
const lxSlug = x => String(x).replace(/[^A-Za-z0-9._~-]/g, '.');
function lxQ(q, withAng){
  const th = LX.themes[q.t], hit = LX_TH[th];
  return `<li><span class="q">${esc(q.q)}</span><span class="a">${esc(q.a)}</span><span class="m">${withAng && q.an ? `<span class="lx-ang a-${q.an}">${LX_ANG[q.an] || q.an}</span>` : ''}${lxY(q.y)}${q.sub ? `<span class="lx-chip">${esc(q.sub)}</span>` : ''}${hit ? `<button class="lx-go press" data-th="${q.t}">ทำข้อแก่นนี้</button>` : ''}</span></li>`;
}
function lxSec(x, max){
  const w = max ? x.n / max * 100 : 0;
  return `<li class="lx-sec${x.n ? '' : ' zero'}"><details><summary><span class="st">${esc(x.t)}</span><span class="bar"><span><i style="width:${w}%"></i></span><b>${x.n}</b></span>` +
    (x.n && x.w ? `<span class="what">${esc(x.w)}</span>` : '') +
    (x.n && !x.w && x.s.length ? `<span class="meta">${x.s.map(s => `<span class="lx-chip">${esc(s)}</span>`).join('')}</span>` : '') +
    (x.n ? `<span class="meta">${lxY(x.y)}</span>` : '') + (!x.n && x.c ? `<span class="cold">${esc(x.c)}</span>` : '') +
    `</summary>${x.n ? `<ol class="lx-qs">${x.q.map(q => lxQ(q, true)).join('')}</ol>` : ''}</details></li>`;
}
const LX_ONE = {};
D.sets.forEach(s => s.one.forEach(x => { LX_ONE[x.theme] = x; }));
function lxThemes(ix){
  if (!ix || !ix.length) return '';
  return `<div class="lx-th"><h4>แก่นข้อสอบในบทนี้ (${ix.length})</h4>${ix.map(i => { const th = LX.themes[i], x = LX_ONE[th]; if (!x) return '';
    return `<details><summary><span>${esc(th)}</span><span class="lx-y">ออก ${x.years.length} รุ่น</span></summary><div>
      <div class="blk"><h5>เนื้อหาที่ต้องรู้</h5>${md(x.related)}</div>${x.fix ? `<p class="fix"><strong>แก้ตามแนวทางปัจจุบัน:</strong> ${inl(x.fix)}</p>` : ''}
      <button class="lx-go press" data-th="${i}">ทำข้อตัวแทนของแก่นนี้</button></div></details>`; }).join('')}</div>`;
}
function renderLec(){
  const S = LX.sys.find(s => s.set === ST.lxset) || LX.sys[0];
  ST.lxset = S.set;
  const tot = LX.stats;
  let h = `<div class="phead"><h2>เทียบโพยกับบทเรียน</h2><span>ข้อสอบเก่าแต่ละข้อจับคู่กับหัวข้อในหน้า MED421 learn</span></div>
  <details class="lx-ov"><summary>ภาพรวม <span>${tot.cov} ข้อตรงบทเรียน · ${tot.gap} ข้อยังไม่มีคาบ</span></summary><div>
    <div class="lx-stats"><div class="lx-stat"><b>${tot.cov}</b><span>ข้อ ตรงกับหัวข้อในบทเรียน</span></div><div class="lx-stat gap"><b>${tot.gap}</b><span>ข้อ ยังไม่มีคาบ (มีบทเสริมให้)</span></div><div class="lx-stat"><b>${tot.asked}</b><span>หัวข้อที่โพยเคยถาม</span></div><div class="lx-stat"><b>${tot.zero}</b><span>หัวข้อที่ไม่เคยออก</span></div></div>
    <div class="lx-mix">${lxMix(tot.angle)}</div><div class="lx-leg">${lxLeg(tot.angle, true)}</div>
    <ol>${LX.findings.map(f => `<li>${f}</li>`).join('')}</ol>
  </div></details>
  <div class="strip" role="tablist">${LX.sys.map(s => `<button class="tab press" role="tab" aria-selected="${s.set === S.set}" data-lx="${s.set}">${esc(s.name)}<span class="n">${s.n_lec + s.n_unc}</span></button>`).join('')}</div>
  <div class="bar2"><p style="font-size:14px;color:var(--ink-2)">${esc(S.name)}: <b class="num">${S.n_lec}</b> ข้อตรงบทเรียน <b class="num">${S.n_unc}</b> ข้อยังไม่มีคาบ</p>
    <div class="chips"><button class="chip press" id="lxhz" aria-pressed="${lxHide}">ซ่อนหัวข้อที่ไม่เคยออก</button></div></div>
  <div class="stream${lxHide ? ' hidezero' : ''}" id="lxs">`;
  S.lectures.forEach(L => {
    const max = Math.max(1, ...L.secs.map(x => x.n)), z = L.secs.filter(x => !x.n).length;
    h += `<article class="item lx-lec"><div class="lx-lh"><span class="qno">${esc(L.lec)}</span><h3>${esc(L.title)}</h3><span class="ct"><b>${L.n}</b> ข้อ</span></div>` +
      (L.n ? `<div class="lx-mix">${lxMix(L.angle)}</div><div class="lx-leg">${lxLeg(L.angle, false)}</div>` : '') +
      (L.pattern ? `<p class="lx-pat">${esc(L.pattern)}</p>` : '') + (L.tip ? `<p class="lx-tip"><b>ทวนอะไรก่อน</b> ${esc(L.tip)}</p>` : '') +
      `<div class="lx-olh"><span>หัวข้อในบทเรียน ตามลำดับ (กดดูโจทย์)</span><span>${L.secs.length - z}/${L.secs.length} หัวข้อเคยออก</span></div>
      <ol class="lx-ol">${L.secs.map(x => lxSec(x, max)).join('')}</ol>
      ${lxThemes(L.th)}
      <a class="lx-link" href="${LX.learn}#${S.set}-${lxSlug(L.lec)}" target="_blank" rel="noopener">เปิดคาบนี้ใน MED421 learn ↗</a></article>`;
  });
  if (S.gaps.length || S.left.length) {
    h += `<div class="lx-gh"><h2>บทเสริม: โพยออก แต่ยังไม่มีคาบ</h2><p>${S.n_unc} ข้อในโพยที่ไม่มีหัวข้อใน MED421 learn รองรับ เขียนเนื้อหาไว้ให้ที่นี่</p></div>`;
    S.gaps.forEach(g => {
      h += `<article class="item lx-gap" id="gap-${esc(g.id)}"><div class="ihead"><span class="tag hot">บทเสริม</span><span class="tag">${g.q.length} ข้อในโพย</span>${lxY(g.years)}</div>
        <h3 class="topic">${esc(g.title)}</h3>${g.subtitle ? `<p class="sub2">${esc(g.subtitle)}</p>` : ''}
        ${g.pearls.length ? `<ol class="pl">${g.pearls.map(p => `<li>${inl(p)}</li>`).join('')}</ol>` : ''}
        <details><summary>อ่านเนื้อหา</summary><div>${md(g.md)}</div></details>
        ${lxThemes(g.th)}
        <details><summary>ข้อสอบเก่าในบทนี้ (${g.q.length})</summary><div>${g.traps.length ? g.traps.map(t => `<p class="lx-trap"><b>${esc(t.id)} โพยตอบไม่ตรงแนวทาง</b> ${inl(t.note)}</p>`).join('') : ''}<ol class="lx-qs">${g.q.map(q => lxQ(q, false)).join('')}</ol></div></details></article>`;
    });
    if (S.left.length) h += `<article class="item"><h3 class="topic">หัวข้ออื่นที่ยังไม่มีเนื้อหา</h3><ol class="lx-qs">${S.left.map(q => lxQ(q, false)).join('')}</ol></article>`;
  }
  h += `</div>`;
  $('#app').innerHTML = h;
  document.querySelectorAll('[data-lx]').forEach(b => b.onclick = () => { ST.lxset = b.dataset.lx; save(); render(); window.scrollTo(0, 0); });
  $('#lxhz').onclick = e => { lxHide = !lxHide; try { localStorage.setItem('med421-prep-lxhide', lxHide ? '1' : '0'); } catch (er) {} e.currentTarget.setAttribute('aria-pressed', lxHide); $('#lxs').classList.toggle('hidezero', lxHide); };
  document.querySelectorAll('.lx-sec.zero summary').forEach(s => s.addEventListener('click', e => e.preventDefault()));
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => {
    const hit = LX_TH[LX.themes[+b.dataset.th]]; if (!hit) return;
    ST.set = hit.set; ST.mode = 'one'; ST.filt = 'all'; shown = 999; go('drill');
    const el = document.getElementById('c-one-' + hit.id); if (el) el.scrollIntoView({ block: 'start' });
  });
}

if (!['home', 'drill', 'wrong', 'lec'].includes(ST.view)) ST.view = 'home';
if (!['one', 'synth', 'pic'].includes(ST.mode)) ST.mode = 'one';
// ลิงก์จากหน้า Lectures: #cardio-04 = คาบนั้น, #cardio = ทั้งระบบ
function fromHash(){
  const h = String(location.hash || '').replace(/^#/, ''); if (!h) return false;
  const m = h.match(/^([a-z]+)(?:-([A-Za-z0-9]+))?$/); if (!m) return false;
  const set = D.sets.find(x => x.key === m[1]); if (!set) return false;
  ST.set = set.key; ST.lec = m[2] ? h : ''; ST.view = 'drill'; if (ST.mode === 'pic') ST.mode = 'one'; ST.filt = 'all'; shown = 30; return true;
}
fromHash();
window.addEventListener('hashchange', () => { if (fromHash()) { render(); window.scrollTo(0, 0); } });
render();
</script>
