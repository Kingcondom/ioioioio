iuretic, beta-blocker | **ห้าม ACEi/ARB**: เมื่อ perfusion ไตต่ำ GFR ต้องพึ่ง angiotensin II บีบ efferent arteriole การกด AII ทำให้ GFR ตกและเกิด AKI |\n| ตั้งครรภ์ (chronic HT หรือ gestational HT) | **labetalol, nifedipine ชนิดออกฤทธิ์นาน, methyldopa** | ห้าม ACEi/ARB/aliskiren (fetotoxic: ไตทารกเสีย oligohydramnios กะโหลกเจริญไม่ดี) เลี่ยง atenolol (IUGR) และ spironolactone |\n| CCB ทำให้ข้อเท้าบวม (JVP ปกติ หัวใจปกติ ไม่มีโปรตีนรั่ว) | ลดขนาด, เพิ่มหรือเปลี่ยนเป็น ACEi/ARB | diuretic แก้ได้น้อย เพราะไม่ใช่ภาวะน้ำเกิน |\n| Acute aortic dissection | **IV beta-blocker ก่อน** (esmolol, labetalol) เป้า HR <60 และ SBP 100–120 ภายใน 20–30 นาที แล้วค่อยเพิ่ม vasodilator (nitroprusside, nicardipine) | **ห้ามให้ vasodilator เดี่ยว (hydralazine, nitroprusside) โดยไม่มี beta-blocker**: reflex tachycardia เพิ่ม dP/dt (แรงเฉือนผนังหลอดเลือด) ทำให้รอยฉีกลามต่อ |\n| HFrEF | ACEi/ARB/ARNI + beta-blocker + MRA + SGLT2i | เลี่ยง non-dihydropyridine CCB (verapamil, diltiazem) |\n| เกาต์ | losartan (ขับ uric acid), CCB | thiazide และ loop diuretic เพิ่ม uric acid |\n| หอบหืด | ACEi/ARB, CCB | non-selective beta-blocker |\n\n**กลไกขาบวมจาก CCB**: dihydropyridine ขยาย arteriole ด้านก่อน capillary (precapillary) มากกว่า venule ความดันใน capillary จึงสูงขึ้น น้ำรั่วออกนอกหลอดเลือด เป็นผลตามขนาดยา ACEi/ARB ขยาย venule ด้านหลัง capillary (postcapillary) จึงลดแรงดันนี้ได้ การเปลี่ยนเป็น ACEi หรือเพิ่ม ACEi/ARB จึงเป็นคำตอบที่ถูก ไม่ใช่ furosemide\n\n**ขนาดยาในครรภ์ที่ควรรู้**: methyldopa 250 mg วันละ 2–3 ครั้ง (สูงสุด 3 g/วัน), labetalol 100 mg วันละ 2 ครั้ง (สูงสุด 2,400 mg/วัน), nifedipine ER 30–60 mg/วัน (สูงสุด 120 mg) เริ่มยาเมื่อ BP ≥140/90 และตั้งเป้า <140/90 (CHAP trial 2022) ความดัน ≥160/110 ถือว่ารุนแรง ต้องลดภายใน 30–60 นาทีด้วย IV labetalol, IV hydralazine หรือ oral nifedipine ชนิดออกฤทธิ์ทันที", "pearls": ["White coat = office สูงแต่ home ปกติ; masked = office ปกติแต่ home/ABPM สูง (masked อันตรายกว่า)", "Resistant HT = ไม่ถึงเป้าทั้งที่ได้ ≥3 ยาขนาดเหมาะสมรวม diuretic และยืนยันด้วย home BP/ABPM; ยาตัวที่ 4 คือ spironolactone", "HT + hypokalemia โดยไม่ได้ใช้ diuretic → คัดกรอง primary aldosteronism ด้วย aldosterone-to-renin ratio", "Cuff: bladder ยาว ≥80% ของรอบแขน แขนวางระดับหัวใจ; cuff เล็กหรือแขนต่ำทำให้ค่าสูงเกินจริง", "ห้าม ACEi/ARB ใน bilateral RAS และตั้งครรภ์; ห้าม ACEi + ARB ร่วมกัน", "Aortic dissection: beta-blocker ก่อนเสมอ ห้าม hydralazine เดี่ยว (reflex tachycardia)"], "traps": [{"id": "C-OLD-114", "note": "โพยตอบ methyldopa ซึ่งยังใช้ได้และปลอดภัย แต่ไม่ใช่ตัวเลือกเดียวอีกแล้ว แนวทางปัจจุบัน (ACOG 2019/2022, NICE, ISSHP) ให้ labetalol หรือ nifedipine ชนิดออกฤทธิ์นานเป็น first-line เท่ากับหรือก่อน methyldopa เพราะ methyldopa ง่วงและซึมเศร้าบ่อย ถ้าตัวเลือกมี labetalol หรือ nifedipine ER ก็ถูกเช่นกัน ส่วนที่ผิดแน่นอนคือ ACEi/ARB"}], "q": [{"id": "C-OLD-110", "q": "A patient has blood pressure 150/80 mmHg at the clinic but 120/80 mmHg on repeated home readings. What is the diagnosis?", "a": "White coat hypertension", "y": [34], "t": 38}, {"id": "C-OLD-111", "q": "A patient taking three antihypertensive drugs including a thiazide diuretic at optimal doses has BP 180/120 mmHg both at the clinic and at home. What is the diagnosis?", "a": "Resistant hypertension", "y": [32], "t": 38}, {"id": "C-OLD-112", "q": "Which feature most suggests secondary rather than primary hypertension?", "a": "Sudden onset of severe hypertension in a young patient", "y": [33], "t": 38}, {"id": "C-OLD-121", "q": "Which lifestyle measure has the LEAST effect on lowering blood pressure?", "a": "A high-protein diet", "y": [32], "t": 38}, {"id": "PP28-CAR-046", "q": "A 40-year-old man has office BP 142/90 mmHg confirmed on repeat visits and home readings. He has no diabetes, CKD, cardiovascular disease or target-organ damage and a low estimated cardiovascular risk. What is the best initial management?", "a": "Lifestyle modification (salt reduction, weight loss, exercise, limit alcohol) and reassess in 3–6 months before starting a drug", "y": [28, 30], "t": 38}, {"id": "PP30-CAR-047", "q": "A 45-year-old man's clinic blood pressure is repeatedly normal (126/78 mmHg), but home and ambulatory readings average 148/94 mmHg. What is this called?", "a": "Masked hypertension", "y": [30], "t": 38}, {"id": "PP30-CAR-048", "q": "A 38-year-old woman has hypertension requiring three drugs and a serum potassium of 2.9 mEq/L while not on a diuretic. What is the most appropriate screening test?", "a": "Plasma aldosterone-to-renin ratio", "y": [30], "t": 38}, {"id": "C-OLD-113", "q": "Which antihypertensive should be avoided in bilateral renal artery stenosis?", "a": "Enalapril", "y": [32, 35], "t": 39}, {"id": "C-OLD-114", "q": "Which drug is most appropriate for chronic hypertension in pregnancy?", "a": "Methyldopa", "y": [31, 32], "t": 39}, {"id": "C-OLD-124", "q": "A hypertensive patient on amlodipine develops bilateral ankle oedema with a normal JVP, normal echocardiogram and no proteinuria. What is the most appropriate action?", "a": "Switch amlodipine to an ACE inhibitor", "y": [31], "t": 39}, {"id": "C-OLD-127", "q": "In acute aortic dissection with BP 180/120 mmHg, which drug must NOT be given alone?", "a": "Hydralazine without a beta-blocker", "y": [30], "t": 39}, {"id": "PP30-CAR-055", "q": "A 58-year-old man with hypertension and diabetic nephropathy is on enalapril. Which antihypertensive addition is NOT appropriate?", "a": "Adding losartan (dual ACE inhibitor plus ARB blockade)", "y": [30], "t": 39}, {"id": "PP31-CAR-005", "q": "When measuring blood pressure in the clinic, which technique is correct?", "a": "Use a cuff whose bladder encircles at least 80% of the arm circumference, with the arm supported at heart level", "y": [31], "t": 50}], "years": [28, 30, 31, 32, 33, 34, 35], "th": [38, 39, 50]}, {"id": "gap-cardio-02", "set": "cardio", "title": "WPW, Syncope และ Digoxin toxicity — กลไกไฟฟ้าหัวใจที่ออกสอบซ้ำ", "subtitle": "pre-excitation กับ Ebstein, แยก vasovagal/orthostatic/cardiac syncope และพิษ digoxin จาก Na/K-ATPase", "md": "### 1. Wolff–Parkinson–White: ทางลัดที่ข้าม AV node\nปกติไฟฟ้าจาก atrium ลงสู่ ventricle ได้ทางเดียวคือ AV node ซึ่งหน่วงเวลาไว้ ใน WPW มี **accessory pathway (bundle of Kent)** ซึ่งเป็นกล้ามเนื้อหัวใจที่เชื่อม atrium กับ ventricle โดยตรงและไม่มีการหน่วง ventricle บางส่วนจึงถูกกระตุ้นก่อน (pre-excitation) แล้วค่อย ๆ นำไฟฟ้าผ่านกล้ามเนื้อ (ช้า) ก่อนที่ไฟฟ้าจาก AV node จะตามมารวม\n- **PR สั้น <120 ms** เพราะข้ามการหน่วงของ AV node\n- **Delta wave** คือขาขึ้นของ QRS ที่ลาด (slurred) จากการนำไฟฟ้าผ่านกล้ามเนื้อช้า ๆ\n- **QRS กว้าง >110–120 ms** ร่วมกับ ST-T เปลี่ยนแปลงในทิศตรงข้าม delta wave\n- *WPW pattern* = ECG แบบนี้แต่ไม่มีอาการ ส่วน *WPW syndrome* = pattern + tachyarrhythmia\n\n**ความสัมพันธ์กับโรคหัวใจแต่กำเนิด: Ebstein anomaly** (ลิ้น tricuspid ด้าน septal และ posterior เลื่อนลงไปทาง apex ทำให้ RV ส่วนบนกลายเป็น \"atrialized RV\" เกิด TR และ RA โต) ผู้ป่วย Ebstein ราว 10–25% มี accessory pathway มักอยู่ด้านขวาและอาจมีหลายเส้น นอกจากนี้พบร่วมกับ hypertrophic cardiomyopathy (กลายพันธุ์ PRKAG2)\n\n| Arrhythmia ใน WPW | ECG | การรักษาเฉียบพลัน |\n|---|---|---|\n| Orthodromic AVRT (พบบ่อยที่สุด ~90%) ลงทาง AV node ขึ้นทาง pathway | narrow QRS เร็วสม่ำเสมอ | vagal maneuver → adenosine; ไม่เสถียร → synchronized cardioversion |\n| Antidromic AVRT | wide QRS สม่ำเสมอ คล้าย VT | รักษาแบบ VT ถ้าไม่แน่ใจ; procainamide หรือ cardioversion |\n| **Pre-excited AF** | wide QRS **ไม่สม่ำเสมอ** รูปร่าง QRS เปลี่ยนไปมา อัตราเร็วมาก อาจ >250/นาที | ไม่เสถียร → synchronized DC cardioversion; เสถียร → IV procainamide หรือ ibutilide หรือ cardioversion |\n\n**ห้ามให้ AV nodal blocker ใน pre-excited AF** (จำ \"ABCD\": adenosine, beta-blocker, CCB ชนิด verapamil/diltiazem, digoxin รวมทั้ง IV amiodarone) เพราะเมื่อ AV node ถูกกด ไฟฟ้าจาก AF จะวิ่งผ่าน pathway ที่ไม่มีการหน่วงได้มากขึ้น อัตรา ventricle เร็วขึ้นจนกลายเป็น VF และเสียชีวิตเฉียบพลัน นี่คือเหตุที่ **นักกีฬาหนุ่มเป็นลมหมดสติ + short PR + delta wave = WPW** ต้องส่ง electrophysiology study และ **catheter ablation** (สำเร็จ >95%) ซึ่งเป็นการรักษาหายขาดในผู้ที่มีอาการ ส่วนผู้ที่ไม่มีอาการแต่อาชีพเสี่ยง (นักกีฬา นักบิน คนขับรถ) ควรประเมินความเสี่ยงด้วย EPS\n\n### 2. Syncope: สมองขาดเลือดทั้งหมดชั่วคราว\nนิยาม: หมดสติชั่วคราวจาก global cerebral hypoperfusion เกิดเร็ว เป็นสั้น และฟื้นเองสมบูรณ์ ต่างจากชัก (หลับหลังชักนาน ลิ้นด้านข้างกัด สับสนหลังฟื้น) แบ่งเป็น 3 กลุ่มใหญ่\n\n**(ก) Reflex (neurally mediated) syncope — พบบ่อยที่สุด โดยเฉพาะคนอายุน้อย**\n- **Vasovagal**: ตัวกระตุ้นคือยืนนาน อากาศร้อน คนแออัด เจ็บปวด กลัว เห็นเลือดหรือเข็ม หรือทำหัตถการ (เจาะเลือด เจาะน้ำในช่องเยื่อหุ้มปอด)\n- กลไก (Bezold–Jarisch reflex): เลือดไปคั่งที่ขา → venous return ลด → ventricle ที่เลือดน้อยบีบแรง → mechanoreceptor (C-fibre) ส่งสัญญาณ → vagal เพิ่ม (cardioinhibitory: หัวใจเต้นช้า) และ sympathetic ลด (vasodepressor: หลอดเลือดขยาย ความดันตก)\n- อาการนำ (prodrome): คลื่นไส้ เหงื่อออก หน้าซีด ร้อนวูบวาบ ตาพร่ามัว ล้มลงหมดสติ <1 นาที อาจกระตุกสั้น ๆ ไม่กี่ครั้ง ฟื้นเร็ว แต่อ่อนเพลียต่อ ตรวจร่างกายและ ECG ปกติ\n- *Situational*: ไอ กลืน ปัสสาวะ เบ่งถ่าย และ *carotid sinus syncope* (หันคอ ผูกเนกไท พบในผู้สูงอายุ)\n- รักษา: อธิบายว่าเป็นโรคไม่อันตราย เลี่ยงตัวกระตุ้น ดื่มน้ำ 2–3 L/วัน เพิ่มเกลือ สอน physical counterpressure maneuvers (ไขว่ขาเกร็ง กำมือ นั่งยอง) เมื่อมีอาการนำ ขณะเป็นให้นอนราบยกขาสูง\n\n**Vasovagal ระหว่างเจาะปอด (thoracentesis)**: ผู้ป่วยหน้าซีด เหงื่อแตก ชีพจรช้า ความดันตก → หยุดหัตถการทันที ให้นอนราบยกขา ให้สารน้ำ ถ้าหัวใจเต้นช้าไม่ดีขึ้นให้ **atropine 1 mg IV** (ซ้ำได้) ต้องแยกจาก pneumothorax (เจ็บอก เหนื่อย เสียงหายใจลด) และ re-expansion pulmonary edema (ระบายน้ำ >1–1.5 L ไอ เหนื่อย SpO2 ตก)\n\n**(ข) Orthostatic hypotension**\n- นิยาม: SBP ลด ≥20 mmHg หรือ DBP ลด ≥10 mmHg (หรือ SBP <90) **ภายใน 3 นาทีหลังลุกยืน** จากท่านอน\n- อาการ: หน้ามืด ตาลาย มองไม่ชัด ทุกครั้งที่ลุกยืน หายเมื่อนั่งหรือนอน\n- สาเหตุ: ขาดน้ำหรือเสียเลือด, **ยา** (alpha-blocker เช่น doxazosin/prazosin, diuretic, nitrate, vasodilator, TCA, antipsychotic, levodopa), autonomic failure (เบาหวาน, Parkinson, MSA, amyloidosis, alcohol), ผู้สูงอายุ\n- เบาะแส neurogenic: ความดันตกแต่ชีพจรแทบไม่เพิ่ม (<15/นาที) ถ้าขาดน้ำชีพจรจะเพิ่มชัด\n- รักษา: หยุดหรือลดยาที่เป็นสาเหตุ ลุกช้า ๆ เป็นขั้น ดื่มน้ำ 2–3 L และเกลือ ยกหัวเตียง ~10 องศาตอนนอน ใส่ถุงน่องรัด ถ้าไม่พอใช้ midodrine หรือ fludrocortisone\n\n**(ค) Cardiac syncope — อันตรายที่สุด ต้องไม่พลาด**\n- arrhythmia (complete heart block, Mobitz II, sick sinus, VT, WPW, long QT, Brugada) หรือ structural (aortic stenosis, HCM, PE, tamponade, dissection)\n- Red flags: หมดสติขณะออกแรงหรือขณะนอนราบ ใจสั่นนำมาก่อน ไม่มีอาการนำ มีโรคหัวใจหรือ HF ประวัติครอบครัวเสียชีวิตเฉียบพลันอายุ <40 ปี ECG ผิดปกติ (pre-excitation, QTc ยาว, Brugada, bifascicular block, Mobitz II/CHB, sinus brady <40)\n\nการประเมินเบื้องต้นที่ต้องทำทุกราย: ซักประวัติละเอียด ตรวจร่างกาย วัดความดันท่านอนและยืน และ **ECG 12 lead** ถ้ามี red flag ส่ง echo, monitor และพิจารณา admit\n\n### 3. Digoxin toxicity: กลไกเดียวอธิบายได้ทั้งฤทธิ์และพิษ\n- Digoxin **ยับยั้ง Na+/K+-ATPase** → Na ในเซลล์เพิ่ม → Na+/Ca2+ exchanger ขับ Ca ออกได้น้อยลง → Ca ในเซลล์และใน sarcoplasmic reticulum เพิ่ม → บีบตัวแรงขึ้น (positive inotropy)\n- นอกจากนี้เพิ่ม vagal tone → AV node นำไฟฟ้าช้าลง (ใช้คุม rate ใน AF)\n- **เมื่อเกินขนาด**: SR มี Ca มากเกินจนปล่อย Ca ออกเองในช่วง diastole → **delayed afterdepolarizations (DADs) → triggered activity** ร่วมกับ automaticity เพิ่มและ AV block จาก vagal\n- จึงได้ arrhythmia ลักษณะ \"เร็วร่วมกับ block\": **paroxysmal atrial tachycardia with block**, accelerated junctional rhythm, AF ที่ ventricle กลับสม่ำเสมอ (regularized AF จาก CHB + junctional escape), PVC bigeminy, **bidirectional VT** (เกือบจำเพาะต่อ digoxin toxicity และ CPVT), VF\n- อาการนอกหัวใจ: เบื่ออาหาร คลื่นไส้อาเจียน ปวดท้อง สับสน ตามัว เห็นสีเหลืองเขียว (xanthopsia) เห็นวงแสง\n- ปัจจัยเสริม: **hypokalemia** (K แข่งจับตำแหน่งเดียวกับ digoxin บน pump เมื่อ K ต่ำ digoxin จับได้มาก), hypomagnesemia, hypercalcemia, ไตเสื่อม (ขับทางไต), ผู้สูงอายุ, hypothyroid, ยาที่เพิ่มระดับ digoxin (amiodarone, verapamil, diltiazem, quinidine, clarithromycin, spironolactone)\n- พิษเฉียบพลันเกินขนาดมัก **hyperkalemia** (pump ทั่วร่างกายถูกกด) K ยิ่งสูงพยากรณ์โรคยิ่งแย่\n- ระดับเป้าหมายใน HF 0.5–0.9 ng/mL (เจาะ ≥6 ชั่วโมงหลังกินยา) \"Digoxin effect\" (ST ยุบเป็นรูปช้อนหรือ reverse tick, QT สั้น) ไม่ใช่พิษ\n- รักษา: หยุดยา แก้ K และ Mg (ระวังอย่าให้ K ถ้า K สูง) bradycardia ให้ atropine **ยาต้านพิษคือ digoxin-specific antibody Fab (DigiFab)** ข้อบ่งชี้: arrhythmia ที่อันตรายต่อชีวิต, K >5–5.5 mEq/L ในพิษเฉียบพลัน, กินเกินขนาดมาก, อวัยวะล้มเหลว การฟอกเลือดไม่ช่วยเพราะ volume of distribution สูง หลีกเลี่ยง cardioversion ถ้าไม่จำเป็น (ถ้าต้องทำใช้พลังงานต่ำ)", "pearls": ["Short PR + delta wave + wide QRS = WPW (pre-excitation ผ่าน bundle of Kent)", "WPW สัมพันธ์กับ Ebstein anomaly ของลิ้น tricuspid", "Pre-excited AF (wide, irregular) ห้าม ABCD: adenosine, beta-blocker, CCB, digoxin → ใช้ procainamide หรือ cardioversion; รักษาหายขาดด้วย ablation", "Vasovagal: ยืนนาน/ร้อน/เจ็บ/หัตถการ + prodrome คลื่นไส้เหงื่อออก ฟื้นเร็ว ECG ปกติ", "Orthostatic hypotension: SBP ลด ≥20 หรือ DBP ลด ≥10 ภายใน 3 นาทีหลังยืน", "Digoxin ยับยั้ง Na/K-ATPase → Ca ในเซลล์สูง → DADs (triggered activity) → PAT with block, bidirectional VT; hypokalemia เสริมพิษ"], "traps": [], "q": [{"id": "PP31-CAR-020", "q": "An 18-year-old male high-school athlete presents with syncope. His electrocardiogram shows a short PR interval, a slurred upstroke of the QRS (delta wave) and a wide QRS complex. Which of the following conditions does this ECG diagnose?", "a": "Wolff-Parkinson-White (ventricular pre-excitation) syndrome", "y": [31], "t": 49}, {"id": "PP31-CAR-024", "q": "Wolff–Parkinson–White syndrome is classically associated with which congenital heart anomaly?", "a": "Ebstein's anomaly", "y": [31, 35], "t": 49}, {"id": "PP35-CAR-039", "q": "Wolff–Parkinson–White syndrome is classically associated with which congenital heart anomaly?", "a": "Ebstein anomaly of the tricuspid valve", "y": [35], "t": 49}, {"id": "PP31-CAR-018", "q": "A patient complains of light-headedness and dimming of vision every time he stands up from lying or sitting. Physical examination is otherwise normal. What is the most likely cause of his symptoms?", "a": "Orthostatic (postural) hypotension", "y": [31], "t": 13}, {"id": "PP29-CAR-122", "q": "A healthy 15-year-old boy standing for a long time in a hot school assembly feels nauseated and sweaty, then collapses for 20 seconds and recovers fully. Examination and ECG afterwards are normal. What is this called?", "a": "Vasovagal (reflex, neurally mediated) syncope", "y": [29], "t": 13}, {"id": "PP30-CAR-054", "q": "Digoxin toxicity causes atrial tachycardia with block and bidirectional ventricular tachycardia mainly through which mechanism?", "a": "Na+/K+-ATPase inhibition causing intracellular Ca2+ overload and delayed afterdepolarisations (triggered activity)", "y": [30], "t": 47}], "years": [29, 30, 31, 35], "th": [49, 47]}, {"id": "gap-cardio-03", "set": "cardio", "title": "Murmur ที่ไม่อันตราย กับ Aortic regurgitation จาก Marfan syndrome", "subtitle": "ลักษณะ innocent murmur, เมื่อไรต้องทำ echo และ Marfan: autosomal dominant, FBN1, aortic root", "md": "### 1. Innocent (functional) murmur คืออะไร\nเสียงที่เกิดจากเลือดไหลเร็วหรือปั่นป่วนผ่านลิ้นและหลอดเลือดที่ปกติ ไม่มีโรคโครงสร้าง พบบ่อยในเด็ก คนผอม และภาวะ high-output (ไข้ ซีด ตั้งครรภ์ thyrotoxicosis ออกกำลังกาย) เพราะ stroke volume หรือความเร็วเลือดผ่าน outflow tract เพิ่มขึ้น เป็น murmur ช่วง ejection จึงอยู่ใน **systole ตอนต้นถึงกลาง** และหายไปก่อน S2\n\nลักษณะของ innocent murmur (จำ \"7 S\")\n- **Soft**: ความดัง ≤ grade 2/6 ไม่มี thrill\n- **Systolic**: เป็น ejection murmur ช่วงต้นถึงกลาง systole ไม่ใช่ holosystolic และไม่ใช่ diastolic\n- **Short**: สั้น ไม่ยาวถึง S2\n- **Single**: ไม่มี click, opening snap หรือ gallop\n- **S2 ปกติ**: แยกเสียงตามการหายใจปกติ (physiological splitting)\n- **Small/localized**: ได้ยินจำกัดบริเวณ (LSB หรือ apex) ไม่แผ่ไปคอหรือรักแร้\n- **Sensitive/Sweet**: เปลี่ยนตามท่าทางและการหายใจ และ **ไม่มีอาการ** หัวใจไม่โต ชีพจรปกติ ECG และ CXR ปกติ\n\nชนิดที่พบบ่อย: Still's murmur (เสียงสั่นแบบดนตรี ที่ LLSB ในเด็กเล็ก), pulmonary flow murmur (ULSB), venous hum (เสียงต่อเนื่องที่คอใต้ไหปลาร้า หายเมื่อนอนราบหรือกดหลอดเลือดดำที่คอ เป็นข้อยกเว้นเดียวที่เป็นเสียงต่อเนื่องแต่ไม่อันตราย)\n\n**ลักษณะที่บอกว่าเป็น pathologic murmur → ส่ง echocardiography**\n- murmur ช่วง diastole ทุกชนิด หรือ holosystolic / late systolic\n- ความดัง ≥3/6 หรือคลำได้ thrill\n- S2 ผิดปกติ (fixed split ใน ASD, single S2, P2 ดัง)\n- มี click หรือ gallop, แผ่ไปคอหรือรักแร้\n- มีอาการ (เหนื่อย เจ็บอก หมดสติ) cyanosis ชีพจรผิดปกติ หัวใจโต ECG ผิดปกติ\n- murmur ที่ดังขึ้นเมื่อยืนหรือ Valsalva (HCM, MVP)\n\n### 2. Aortic regurgitation — กลไกและอาการแสดง\nAR เกิดจาก (ก) **ลิ้นเสีย**: bicuspid aortic valve, rheumatic, infective endocarditis หรือ (ข) **aortic root ขยาย**: Marfan syndrome, aortic dissection, ankylosing spondylitis, syphilitic aortitis, HT ผู้สูงอายุ\n\nในช่วง diastole เลือดไหลย้อนจาก aorta เข้า LV → LV ได้ทั้ง volume และ pressure overload → eccentric hypertrophy, LV โต → stroke volume ใหญ่มาก SBP สูง ขณะที่เลือดรั่วกลับทำให้ DBP ต่ำ จึงได้ **pulse pressure กว้าง** ซึ่งอธิบาย peripheral signs ทั้งหมด\n- **Murmur**: early diastolic, decrescendo เสียงเป่า (blowing) ที่ LSB ช่องซี่โครง 3–4 ฟังชัดสุดเมื่อนั่งโน้มตัวไปข้างหน้าและหายใจออกสุดแล้วกลั้น ถ้าดังที่ RSB มากกว่าให้นึกถึงโรคของ aortic root (Marfan, dissection)\n- **Austin Flint murmur**: mid-diastolic rumble ที่ apex จากเลือดที่รั่วกระแทกลิ้น mitral anterior leaflet\n- มักมี systolic ejection flow murmur ร่วม (stroke volume ใหญ่)\n- Peripheral signs: water-hammer (Corrigan) pulse, de Musset sign (ศีรษะผงกตามชีพจร), Quincke sign (capillary pulsation ที่เล็บ), Traube (pistol-shot) และ Duroziez sign ที่ femoral, Hill sign (SBP ที่ popliteal สูงกว่า brachial มาก)\n- วินิจฉัยและประเมินความรุนแรงด้วย echocardiography\n- รักษา: severe AR ที่มีอาการ → ผ่าตัดเปลี่ยนลิ้น (AVR) ส่วน severe AR ไม่มีอาการ → ผ่าตัดเมื่อ LVEF ≤55% (ACC/AHA; ESC ≤50%) หรือ LV โต (LVESD >50 mm หรือ LVESDi >25 mm/m²) ยาขยายหลอดเลือด (ACEi/ARB, dihydropyridine CCB) ใช้คุมความดัน Acute severe AR (IE, dissection) → ผ่าตัดด่วน ห้ามใส่ intra-aortic balloon pump\n\n### 3. Marfan syndrome\n- **การถ่ายทอด: autosomal dominant** (ราว 25% เป็น de novo mutation) ยีน **FBN1** บนโครโมโซม 15 สร้าง fibrillin-1 ซึ่งเป็นโครง microfibril ของ elastic fibre และควบคุม TGF-β เมื่อผิดปกติ TGF-β signaling เพิ่ม เนื้อเยื่อเกี่ยวพันอ่อนแอ\n- วิธีอ่าน pedigree แบบ AD: พบผู้ป่วย **ทุกรุ่น** (ไม่ข้ามรุ่น) เพศชายและหญิงเป็นเท่ากัน ผู้ป่วยหนึ่งคนส่งต่อให้ลูก 50% และ **มีการถ่ายทอดจากพ่อสู่ลูกชาย (male-to-male)** ซึ่งตัด X-linked ออกได้ทันที\n- **หัวใจและหลอดเลือด (สาเหตุตายหลัก)**: aortic root ขยายที่ sinus of Valsalva → AR, **aortic dissection** (type A), mitral valve prolapse\n- **ตา**: ectopia lentis (เลนส์เคลื่อน มักขึ้นบนและออกด้านนอก), สายตาสั้นมาก, จอประสาทตาลอก\n- **กระดูก**: ตัวสูง แขนกาง (arm span) ยาวกว่าส่วนสูง, arachnodactyly (wrist sign และ thumb sign บวก), pectus excavatum/carinatum, scoliosis, ข้อหลวม, เท้าแบน\n- อื่น ๆ: spontaneous pneumothorax, dural ectasia, striae\n- วินิจฉัยด้วย revised Ghent criteria (2010): **aortic root dilatation (Z-score ≥2) ร่วมกับ ectopia lentis เพียงพอสำหรับวินิจฉัย** หรือใช้ประวัติครอบครัว systemic score และการตรวจยีน FBN1\n- แยกโรค: homocystinuria (autosomal recessive, เลนส์เคลื่อน *ลงล่าง*, สติปัญญาบกพร่อง, ลิ่มเลือดอุดตัน), Loeys–Dietz, Ehlers–Danlos\n- ดูแล: **beta-blocker หรือ ARB (losartan)** ชะลอการขยายของ aortic root, echo ทุกปี (หรือถี่ขึ้น), เลี่ยงกีฬาปะทะและการออกแรงแบบ isometric หนัก ๆ, **ผ่าตัด aortic root แบบป้องกันเมื่อเส้นผ่านศูนย์กลาง ≥50 mm** (หรือ ≥45 mm ถ้ามีประวัติครอบครัว dissection, ขยาย >3 mm/ปี, AR รุนแรง หรือวางแผนตั้งครรภ์) การตั้งครรภ์เสี่ยง dissection สูงต้องปรึกษาก่อน", "pearls": ["Innocent murmur = soft ≤2/6, early–mid systolic ejection, S2 split ปกติ, ไม่มีอาการ ไม่มี thrill/click", "Diastolic murmur ทุกชนิดหรือ ≥3/6 หรือ S2 ผิดปกติ = pathologic → echo", "AR: early diastolic decrescendo ที่ LSB นั่งโน้มตัวหายใจออก + pulse pressure กว้าง (water-hammer pulse)", "Marfan = autosomal dominant (FBN1, fibrillin-1): ทุกรุ่น ชายหญิงเท่ากัน มี father-to-son", "Marfan: aortic root dilatation + ectopia lentis (ขึ้นบน) ; homocystinuria เลนส์เคลื่อนลงล่าง"], "traps": [], "q": [{"id": "PP34-CAR-007", "q": "A tall 20-year-old man with arachnodactyly, lens subluxation and aortic root dilatation is diagnosed with Marfan syndrome. His pedigree shows affected males and females in every generation, including father-to-son transmission. What is the mode of inheritance?", "a": "Autosomal dominant", "y": [34], "t": 29}, {"id": "PP30-CAR-051", "q": "Which feature suggests an innocent (functional) heart murmur?", "a": "A soft (grade ≤2/6) short early-to-mid systolic ejection murmur with normal S2 splitting and no symptoms", "y": [30], "t": 46}], "years": [30, 34], "th": [46]}], "left": []}, {"set": "nephro", "name": "Nephro", "n_lec": 135, "n_unc": 4, "lectures": [{"lec": "Physio1", "title": "สรีรวิทยาไตพื้นฐาน I — การทำงานของไต GFR และการขนส่งในท่อไต", "n": 5, "angle": {"fact": 1, "mx": 3, "dx": 1}, "pattern": "สรีรวิทยาล้วนแทบไม่ถูกถามตรง ข้อที่ตกมาที่นี่เป็นโจทย์คลินิกที่ใช้ความรู้ท่อไต/hemodynamics เช่น SGLT2i ปกป้องไต (รุ่น 31–35 ซ้ำ), Cockcroft–Gault, Fanconi. รูปแบบเป็น mx/fact สั้น ๆ", "tip": "อ่านแค่ phy1-06 (NSAID/ACEi/SGLT2i กับ afferent/efferent) และ phy1-09 (Fanconi) ให้แม่น ที่เหลือใช้เป็นฐานอธิบายกลไกเท่านั้น", "secs": [{"t": "หน้าที่ 7 ข้อของไต — และอาการที่เกิดเมื่อหน้าที่นั้นหายไป", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "เลือดไปเลี้ยงไต (RBF) — afferent vs efferent, sympathetic และ renin", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Clearance — วัด RPF, RBF และ GFR ด้วยสารตัวเดียว", "n": 1, "y": [31], "w": "เลือกสูตร Cockcroft–Gault ประมาณ CrCl ข้างเตียง (ชาย 70 kg Cr 1.5)", "c": null, "s": ["eGFR: Cockcroft–Gault"], "q": [{"q": "A 40-year-old man weighing 70 kg has creatinine 1.5 mg/dL. Which f ไม่มีข้อสอบ — ใช้อธิบาย sepsis AKI เท่านั้น", "s": [], "q": []}, {"t": "Filtration fraction และ glomerulotubular balance — กรองมากขึ้น ดูดกลับมากขึ้นตาม", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Proximal tubule — ดูดกลับ 65% ด้วยพลังของ Na⁺/K⁺-ATPase (HCO₃⁻, Pi, acetazolamide, Fanconi)", "n": 1, "y": [34], "w": "glucosuria น้ำตาลปกติ + phosphaturia + aminoaciduria + NAGMA → Fanconi syndrome", "c": null, "s": ["Fanconi syndrome"], "q": [{"q": "A patient has glucosuria with normal blood glucose, phosphaturia, aminoaciduria and normal anion gap metabolic acidosis. What is the diagnosis?", "a": "Fanconi syndrome", "y": [34], "an": "dx", "sub": "Fanconi syndrome", "t": 79}]}, {"t": "Glucose, amino acid และโปรตีน — Tm, threshold และ glucosuria", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Loop of Henle — ขาลงดูดน้ำ ขาขึ้นดูดเกลือ (furosemide, Bartter)", "n": 0, "y": [], "w": null, "c": "loop diuretic/Bartter ไม่ถามตรง แต่เป็นฐานของ hypoMg/hypoK", "s": [], "q": []}, {"t": "Distal tubule และ collecting duct — thiazide, aldosterone, K-sparing และทำไม K ต่ำมาคู่กับด่าง", "n": 0, "y": [], "w": null, "c": "thiazide/Gitelman/Liddle/K-sparing ยังไม่ออก — เสี่ยงออกใหม่ได้", "s": [], "q": []}, {"t": "การหลั่งสารอินทรีย์และ fractional excretion — drug interaction, creatinine และ FENa", "n": 0, "y": [], "w": null, "c": "FENa/drug interaction ที่ท่อไต ถูกถามในบริบท AKI (คาบ 42) ไม่ใช่ที่นี่", "s": [], "q": []}, {"t": "ทำปัสสาวะเข้มข้นและเจือจาง — countercurrent, urea recycling, C_osm และ C_H₂O", "n": 0, "y": [], "w": null, "c": "countercurrent, C_H2O ไม่เคยถาม", "s": [], "q": []}], "th": [66, 67, 79]}, {"lec": "Physio2", "title": "สรีรวิทยาไตพื้นฐาน II — สมดุลน้ำ อิเล็กโทรไลต์ กรด-ด่าง และการถ่ายปัสสาวะ", "n": 16, "angle": {"interp": 3, "dx": 7, "mx": 2, "ix": 1, "mech": 2, "fact": 1}, "pattern": "คาบนี้รับข้อสอบ Na/K ที่เดิมอยู่ในคาบ electrolyte (รหัส 22) ซึ่งไม่มีในเว็บ: เน้นวินิจฉัยจากเคส (SIADH, ODS, hypernatremia ผู้สูงอายุ, TPP) และอ่าน ECG/ค่าแล็บหลอก. ส่วนใหญ่ออกครั้งเดียวต่อรุ่น กระจายรุ่น 30–35 แต่ธีม hyponatremia และ K shift วนกลับทุกปี", "tip": "ให้เวลามากที่ phy2-07 (approach hyponatremia + อัตราแก้ไข/ODS) และ phy2-08 (K shift, ECG, pseudohyperK); เสริม periodic paralysis/TPP และ adrenal insufficiency จากคาบ endo เพราะเว็บยังไม่ครอบคลุม", "secs": [{"t": "น้ำเคลื่อนตาม tonicity — osmolarity ที่ \"ดึงน้ำได้จริง\"", "n": 1, "y": [31], "w": "Na 130 + glucose 600 → translocational hypoNa (corrected Na ~138)", "c": null, "s": ["glucose ดึงน้ำ: translocational hypoNa"], "q": [{"q": "A patient has Na 130 mEq/L with plasma glucose 600 mg/dL. How should the sodium be interpreted?", "a": "Translocational hyponatraemia — corrected sodium is about 138 mEq/L", "y": [31], "an": "interp", "sub": "glucose ดึงน้ำ: translocational hypoNa", "t": 71}]}, {"t": "Darrow–Yannet — หกแบบของปริมาตรที่ผิดปกติ และเลือกสารน้ำให้ตรง", "n": 0, "y": [], "w": null, "c": "Darrow–Yannet หกแบบ ไม่ถามตรง", "s": [], "q": []}, {"t": "ไตคุมปริมาตรด้วยการขับ Na — การกรอง การดูดกลับ และ sympathetic", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "RAAS, aldosterone และ ANP — คันเร่งกับเบรกของการเก็บ Na", "n": 1, "y": [30], "w": "hyperpigmentation + Na 128 K 5.9 → primary adrenal insufficiency (Addison)", "c": null, "s": ["Addison: ขาด aldosterone → Na ต่ำ K สูง"], "q": [{"q": "A patient with hyperpigmentation, postural hypotension, Na 128 mEq/L and K 5.9 mEq/L has which diagnosis?", "a": "Primary adrenal insufficiency", "y": [30], "an": "dx", "sub": "Addison: ขาด aldosterone → Na ต่ำ K สูง", "t": 73}]}, {"t": "ADH และการกระหายน้ำ — ตัวคุม osmolality", "n": 1, "y": [], "w": "polyuria Uosm 80 Na 148 → diabetes insipidus", "c": null, "s": ["DI: ปัสสาวะจาง Na สูง"], "q": [{"q": "A 35-year-old woman has 4 months of polyuria and polydipsia. Serum Na 148 mEq/L, glucose 88 mg/dL, Cr 0.8 mg/dL, urine osmolality 80 mOsm/kg. What is the most likely diagnosis?", "a": "Diabetes insipidus", "y": [], "an": "dx", "sub": "DI: ปัสสาวะจาง Na สูง", "t": 94}]}, {"t": "ร่างกายตอบสนองแบบบูรณาการ — ขาดน้ำ ดื่มน้ำมาก กินเค็ม ออกกำลังกาย", "n": 2, "y": [30, 31], "w": "ผู้สูงอายุติดเตียงดื่มน้ำไม่ได้ ซึมลง → hypernatremia (30, 31)", "c": null, "s": ["Hyperosmotic volume contraction — ขาดน้ำ"], "q": [{"q": "An 85-year-old bedridden woman with dementia and an indwelling urinary catheter, who depends on others for drinking water, becomes drowsy. Which electrolyte disorder is most likely?", "a": "Hypernatraemia from inadequate free-water intake", "y": [30], "an": "dx", "sub": "Hyperosmotic volume contraction — ขาดน้ำ", "t": 78}, {"q": "An 82-year-old bedridden woman is brought in because she has become progressively drowsy over 2 days. She has had poor oral intake during a heat wave. Examination shows dry lips and mucous membranes and reduced skin turgor; there is no focal neurological deficit. Which electrolyte disturbance is the most likely cause of her altered consciousness?", "a": "Hypernatraemia", "y": [31], "an": "dx", "sub": "Hyperosmotic volume contraction — ขาดน้ำ", "t": 78}]}, {"t": "สะพานสู่คลินิก — SIADH, hyponatremia และ osmotic demyelination", "n": 6, "y": [31, 34, 35], "w": "hyponatremia: SIADH (euvolemia Uosm 600 UNa 60), ODS หลังแก้เร็วด้วย 3% saline, thiazide Na 105 → หยุดยาแก้ช้า, นักวิ่งดื่มน้ำมากชัก; รุ่น 31/34/35", "c": null, "s": ["แก้ Na ช้า — thiazide hyponatremia", "ไล่ tonicity → ADH → ปริมาตร", "hyponatremia เป็นปัญหาน้ำ ไม่ใช่ K", "แก้เร็วเกิน → osmotic demyelination"], "q": [{"q": "A hypertensive patient on hydrochlorothiazide presents with drowsiness and weakness with Na 105 mEq/L. What is the most appropriate management?", "a": "Stop the thiazide and correct sodium slowly", "y": [34], "an": "mx", "sub": "แก้ Na ช้า — thiazide hyponatremia", "t": 71}, {"q": "Before choosing therapy for hyponatraemia, which assessment is most important?", "a": "Volume status and osmolality", "y": [31], "an": "ix", "sub": "ไล่ tonicity → ADH → ปริมาตร", "t": 71}, {"q": "A patient has Na 114 mEq/L and K 4.1 mEq/L. Which treatment is NOT indicated?", "a": "Potassium supplementation", "y": [35], "an": "mx", "sub": "hyponatremia เป็นปัญหาน้ำ ไม่ใช่ K", "t": 71}, {"q": "A patient with chronic hyponatraemia corrected rapidly with 3% saline develops dysarthria, quadriparesis and impaired consciousness several days later. What is the diagnosis?", "a": "Osmotic demyelination syndrome", "y": [34], "an": "dx", "sub": "แก้เร็วเกิน → osmotic demyelination", "t": 71}, {"q": "A patient with small cell lung cancer has Na 118 mEq/L, urine osmolality 600 mOsm/kg, urine sodium 60 mEq/L and clinical euvolaemia with normal thyroid and adrenal function. What is the diagnosis?", "a": "SIADH", "y": [35], "an": "dx", "sub": "SIADH: euvolemia Uosm สูง UNa สูง", "t": 72}, {"q": "A 30-year-old marathon runner who drank large volumes of water during the race becomes confused and then has a generalised tonic-clonic seizure. Which electrolyte disturbance most likely provoked the seizure?", "a": "Acute hyponatraemia", "y": [31], "an": "dx", "sub": "Na ต่ำเฉียบพลัน → สมองบวม ชัก", "t": 75}]}, {"t": "Potassium I — K กำหนด RMP · ผลต่อกล้ามเนื้อและหัวใจ · การย้าย K เข้า-ออกเซลล์", "n": 5, "y": [30, 32, 33, 35], "w": "K: TPP/หลังกินแป้ง = shift (insulin, β2), ECG K ต่ำ = U wave (30, 35), pseudohyperK จากเกล็ดเลือดสูง, K ต่ำไม่ทำให้ชัก", "c": null, "s": ["Shift: K เข้าเซลล์ (Na/K-ATPase)", "Shift: insulin + β2 catecholamine", "K ต่ำ → อ่อนแรง ไม่ใช่ชัก", "ECG K ต่ำ: U wave เด่น"], "q": [{"q": "What is the main mechanism of hypokalaemia in thyrotoxic periodic paralysis?", "a": "Transcellular shift into cells", "y": [33], "an": "mech", "sub": "Shift: K เข้าเซลล์ (Na/K-ATPase)", "t": 74}, {"q": "A young man develops transient weakness with K 2.6 mEq/L after a large carbohydrate meal and alcohol at a party, with normal acid-base status and rapid recovery after potassium replacement. What is the mechanism?", "a": "Transcellular shift from insulin and catecholamines", "y": [35], "an": "mech", "sub": "Shift: insulin + β2 catecholamine", "t": 74}, {"q": "Which electrolyte abnormality is LEAST likely to cause seizures or altered consciousness?", "a": "Hypokalaemia", "y": [32, 35], "an": "fact", "sub": "K ต่ำ → อ่อนแรง ไม่ใช่ชัก", "t": 75}, {"q": "Which ECG change is characteristic of hypokalaemia?", "a": "Prominent U waves", "y": [30, 35], "an": "interp", "sub": "ECG K ต่ำ: U wave เด่น", "t": 76}, {"q": "A 70-year-old man with essential thrombocythaemia (platelets 1,200,000/mm3) has serum K 6.4 mEq/L on a routine clotted sample. He has no symptoms, normal renal function and a normal ECG. What is the most likely explanation?", "a": "Pseudohyperkalaemia from potassium release by platelets during clotting (or haemolysis/fist clenching during sampling)", "y": [30], "an": "interp", "sub": "pseudohyperkalemia (เกล็ดเลือดสูง/hemolysis)", "t": 77}]}, {"t": "Potassium II — ไตขับ K ที่ principal cell และ 6 ปัจจัยที่ทำให้ขับมากขึ้น", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Ca, Pi และ Mg — รูปแบบในพลาสมา ความไวของเส้นประสาท และการจัดการของไต", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "กรดมาจากไหน และสามแนวป้องกัน pH — buffer · ปอด · ไต", "n": 0, "y": [], "w": null, "c": "buffer/Henderson–Hasselbalch ไม่ถาม", "s": [], "q": []}, {"t": "ไตกับกรด — เก็บ HCO3 คืน สร้าง HCO3 ใหม่ และขับ H ด้วย phosphate กับ ammonium", "n": 0, "y": [], "w": null, "c": "RTA type 1/2/4 กลไก — ออกในรูปเคสภาพ (คาบ imaging) ไม่ถามที่นี่", "s": [], "q": []}, {"t": "ความผิดปกติกรด-ด่างและการชดเชย — กลไกเบื้องหลังอาการ", "n": 0, "y": [], "w": null, "c": "compensation/mixed disorder ไม่มีข้อสอบในกลุ่มไต (อาจอยู่คาบ chest)", "s": [], "q": []}, {"t": "แปลผลกรด-ด่างทีละขั้น — ABG, anion gap, delta ratio, osmolal gap และแบบฝึกจากสไลด์", "n": 0, "y": [], "w": null, "c": "ABG/AG/osmolal gap ทีละขั้น — มีแค่ methanol ที่ไปลงคาบ AKI; ควรฝึกเพราะโจทย์ ABG มักมาในคาบอื่น", "s": [], "q": []}, {"t": "การถ่ายปัสสาวะ — ศูนย์ควบคุม เส้นประสาท micturition reflex และชนิดของก  of acute kidney injury produces INTRINSIC renal parenchymal damage rather than a prerenal (haemodynamic) state?", "a": "Malignant hypertension", "y": [31], "an": "fact", "sub": "Malignant HT = intrinsic vascular", "t": 90}]}, {"t": "Intrinsic (2) — glomerulonephritis ที่มาเป็น AKI", "n": 0, "y": [], "w": null, "c": "GN ที่มาเป็น AKI/RPGN ไม่มีข้อสอบในคาบนี้", "s": [], "q": []}, {"t": "Intrinsic (3) — acute interstitial nephritis (AIN)", "n": 5, "y": [31, 32, 34, 35], "w": "AIN จากยา (ATB ระหว่าง steroid, NSAID, TB drug): sterile pyuria + WBC cast + ผื่น eosinophil; leptospirosis → K ต่ำ", "c": null, "s": ["AIN จากยา: sterile pyuria WBC cast", "สาเหตุ AIN: NSAID", "AIN จากยา: ผื่น eosinophil WBC cast", "UA ใน AIN (rifampicin): WBC cast"], "q": [{"q": "A patient with minimal change disease on high-dose prednisolone develops acute kidney injury 2 weeks later with sterile pyuria and WBC casts. What is the most likely cause?", "a": "Acute interstitial nephritis from a concurrent drug", "y": [32], "an": "dx", "sub": "AIN จากยา: sterile pyuria WBC cast", "t": 58}, {"q": "Which additional renal complication can NSAIDs cause besides reduced glomerular filtration?", "a": "Acute interstitial nephritis", "y": [31], "an": "mech", "sub": "สาเหตุ AIN: NSAID", "t": 58}, {"q": "A patient on high-dose steroid for minimal change disease develops acute kidney injury with sterile pyuria, WBC casts, rash and eosinophilia after starting a new antibiotic. What is the diagnosis?", "a": "Acute interstitial nephritis", "y": [32], "an": "dx", "sub": "AIN จากยา: ผื่น eosinophil WBC cast", "t": 58}, {"q": "A patient with pulmonary tuberculosis develops acute kidney injury 10 days after starting the standard four-drug regimen. Which urinary finding would best support drug-induced acute interstitial nephritis as the cause?", "a": "Sterile pyuria with white blood cell casts", "y": [35], "an": "interp", "sub": "UA ใน AIN (rifampicin): WBC cast", "t": 58}, {"q": "By which mechanism does leptospirosis cause hypokalaemia?", "a": "Renal potassium wasting from tubular injury", "y": [34], "an": "mech", "sub": "Leptospirosis: AKI ไม่ oliguric + K ต่ำ", "t": 76}]}, {"t": "Intrinsic (4) — acute tubular necrosis (ATN)", "n": 3, "y": [32, 34], "w": "muddy brown granular cast = ATN; กลไก ischemic + toxic", "c": null, "s": ["UA ใน ATN: muddy brown granular cast", "UA ใน ATN: granular cast", "ทำไม GFR ตกใน ATN: ischemic + toxic"], "q": [{"q": "Muddy brown granular casts in the urine are most characteristic of which condition?", "a": "Acute tubular necrosis", "y": [32], "an": "interp", "sub": "UA ใน ATN: muddy brown granular cast", "t": 59}, {"q": "Which urinary finding supports intrinsic acute kidney injury from tubular injury?", "a": "Granular casts", "y": [32], "an": "interp", "sub": "UA ใน ATN: granular cast", "t": 59}, {"q": "What is the main mechanism of drug-induced acute tubular necrosis?", "a": "Ischaemic and toxic tubular injury", "y": [34], "an": "mech", "sub": "ทำไม GFR ตกใน ATN: ischemic + toxic", "t": 90}]}, {"t": "Nephrotoxins — aminoglycoside · contrast · acyclovir · lithium และยาอื่น", "n": 4, "y": [31, 32, 35], "w": "contrast AKI ป้องกันด้วย IV isotonic saline; metformin หยุด eGFR < 30; lithium → nephrogenic DI", "c": null, "s": ["Metformin งดเมื่อ eGFR < 30", "Contrast-AKI: ป้องกันด้วย IV isotonic", "Contrast-associated AKI → ATN", "Lithium → nephrogenic DI"], "q": [{"q": "Which oral antidiabetic drug must be stopped when eGFR falls below 30 mL/min/1.73 m2?", "a": "Metformin", "y": [31, 32], "an": "fact", "sub": "Metformin งดเมื่อ eGFR < 30", "t": 67}, {"q": "A patient with CKD needs a contrast CT. What is the best evidence-based prophylaxis against contrast-associated acute kidney injury?", "a": "Intravenous isotonic saline hydration", "y": [35], "an": "mx", "sub": "Contrast-AKI: ป้องกันด้วย IV isotonic", "t": 92}, {"q": "A 60-year-old woman with diabetes has a rise in serum creatinine from 1.2 to 2.6 mg/dL 48 hours after a contrast-enhanced CT scan. She has no hypotension and no new drugs. Which renal lesion best explains her acute kidney injury?", "a": "Acute tubular injury (acute tubular necrosis)", "y": [31], "an": "dx", "sub": "Contrast-associated AKI → ATN", "t": 92}, {"q": "A 64-year-old man on lithium for 20 years has polyuria with low urine osmolality that does not rise after desmopressin. What is the diagnosis?", "a": "Lithium-induced nephrogenic diabetes insipidus", "y": [31], "an": "dx", "sub": "Lithium → nephrogenic DI", "t": 94}]}, {"t": "Pigment nephropathy — rhabdomyolysis · hemoglobinuria · ปัสสาวะแดง/น้ำตาล", "n": 4, "y": [31, 33, 34], "w": "statin + gemfibrozil → rhabdomyolysis CK 45,000 → หยุดยา + isotonic fluid; CK ยืนยัน", "c": null, "s": ["statin + gemfibrozil → rhabdomyolysis", "CK ยืนยัน rhabdomyolysis", "การดูแล rhabdo: หยุดยา + isotonic fluid", "statin → ส่ง CK"], "q": [{"q": "A patient on simvastatin and gemfibrozil develops severe muscle pain, dark urine, CK 45,000 U/L and creatinine 3.5 mg/dL. What is the diagnosis?", "a": "Rhabdomyolysis", "y": [31], "an": "dx", "sub": "statin + gemfibrozil → rhabdomyolysis", "t": 91}, {"q": "Which investigation confirms rhabdomyolysis?", "a": "Serum creatine kinase", "y": [34], "an": "ix", "sub": "CK ยืนยัน rhabdomyolysis", "t": 91}, {"q": "A patient with statin-fibrate rhabdomyolysis has K 6.8 mEq/L, phosphate 8 mg/dL, creatinine 4.2 mg/dL and CK 60,000 U/L. What is the management priority?", "a": "Stop the drugs and give isotonic fluid", "y": [33], "an": "mx", "sub": "การดูแล rhabdo: หยุดยา + isotonic fluid", "t": 91}, {"q": "A 58-year-old man on simvastatin complains of symmetric proximal muscle aching. Which investigation should be ordered first?", "a": "Serum creatine kinase", "y": [33], "an": "ix", "sub": "statin → ส่ง CK", "t": 91}]}, {"t": "Intrarenal obstruction — crystal nephropathy (uric acid · oxalate · ยา)", "n": 2, "y": [31, 32], "w": null, "c": null, "s": ["uric acid/phosphate crystal (TLS)", "toxic alcohol: fomepizole/ethanol"], "q": [{"q": "A patient develops acute kidney injury with hyperkalaemia, hyperphosphataemia and hyperuricaemia 2 days after starting chemotherapy. What is the mechanism of the renal injury?", "a": "Uric acid and phosphate crystal deposition", "y": [31], "an": "mech", "sub": "uric acid/phosphate crystal (TLS)", "t": 52}, {"q": "A 55-year-old man drank homemade liquor and now has blurred vision, drowsiness, a high anion gap metabolic acidosis and an increased osmolal gap. Methanol poisoning is diagnosed. Besides correcting acidosis and considering haemodialysis, what is the specific antidote?", "a": "Fomepizole, or ethanol if fomepizole is unavailable", "y": [32], "an": "mx", "sub": "toxic alcohol: fomepizole/ethanol", "t": 95}]}, {"t": "Post-renal AKI — ทางเดินปัสสาวะอุดตัน", "n": 1, "y": [31], "w": null, "c": null, "s": ["post-renal BPH: ใส่สายสวนระบาย"], "q": [{"q": "An elderly man with benign prostatic hyperplasia has anuria, a palpable bladder and rising creatinine. What is the first management step?", "a": "Bladder catheterisation to relieve the obstruction", "y": [31], "an": "mx", "sub": "post-renal BPH: ใส่สายสวนระบาย", "t": 93}]}, {"t": "Step 1–2: ไตวายจริงไหม และ AKI หรือ CKD — พร้อมภาพรังสี", "n": 2, "y": [28, 31, 33], "w": null, "c": null, "s": ["Step 2 AKI หรือ CKD: ultrasound", "Step 2: Ca/PO4, osteodystrophy บอกเรื้อรัง"], "q": [{"q": "Which investigation is most useful to establish chronicity when the duration of renal impairment is unknown?", "a": "Renal ultrasound", "y": [31, 33], "an": "ix", "sub": "Step 2 AKI หรือ CKD: ultrasound", "t": 65}, {"q": "Which finding indicates chronicity rather than an acute process in renal failure?", "a": "Renal osteodystrophy", "y": [28], "an": "fact", "sub": "Step 2: Ca/PO4, osteodystrophy บอกเรื้อรัง", "t": 65}]}, {"t": "Step 4: ดัชนีปัสสาวะ — FENa, FEurea และกับดัก", "n": 1, "y": [31], "w": null, "c": null, "s": ["FENa > 2% = ATN"], "q": [{"q": "Which urinary index favours acute tubular necrosis over prerenal azotaemia?", "a": "FENa above 2 percent", "y": [31], "an": "interp", "sub": "FENa > 2% = ATN", "t": 90}]}, {"t": "ภาวะแทรกซ้อน — hyperkalemia และ ECG · น้ำเกิน · Na ต่ำ · กรด · PO4/Ca/urate", "n": 1, "y": [31], "w": null, "c": null, "s": ["Hyperkalemia: ทำ ECG ก่อน"], "q": [{"q": "A patient with chronic kidney disease attends a routine follow-up and feels well. The laboratory reports serum K+ 7.2 mEq/L but notes that the sample is haemolysed. What should you do first?", "a": "Obtain a 12-lead ECG immediately", "y": [31], "an": "ix", "sub": "Hyperkalemia: ทำ ECG ก่อน", "t": 77}]}, {"t": "ข้อบ่งชี้ dialysis ใน AKI — เริ่มก่อน \"too late\"", "n": 4, "y": [30, 31], "w": "ข้อบ่งชี้ dialysis: K/กรด/น้ำเกินดื้อยา, uremic pericarditis/asterixis (30, 31)", "c": null, "s": ["ข้อบ่งชี้: K/กรด/น้ำเกินดื้อยา", "uremic pericarditis, asterixis", "rhabdo + กรดรุนแรง + น้ำเกิน → HD ด่วน"], "q": [{"q": "Which clinical feature is a manifestation of uraemia in advanced chronic kidney disease?", "a": "Pericardial rub with asterixis", "y": [31], "an": "fact", "sub": "uremic pericarditis, asterixis", "t": 70}, {"q": "What are the indications for urgent dialysis?", "a": "Refractory hyperkalaemia, acidosis or overload", "y": [30], "an": "fact", "sub": "ข้อบ่งชี้: K/กรด/น้ำเกินดื้อยา", "t": 70}, {"q": "Which is an indication for dialysis in rhabdomyolysis-associated acute kidney injury?", "a": "Refractory hyperkalaemia, acidosis or overload", "y": [31], "an": "fact", "sub": "ข้อบ่งชี้: K/กรด/น้ำเกินดื้อยา", "t": 70}, {"q": "A 60-year-old woman with type 2 diabetes, hypertension and dyslipidaemia takes glibenclamide, enalapril, amlodipine, simvastatin 40 mg and fenofibrate. She is admitted with dyspnoea, decreased urine output for 1 day and bilateral calf pain. BP 160/80 mmHg, HR 100/min, RR 30/min, engorged neck veins, fine crepitations in both lungs, oedema 1+. Labs: Hb 9 g/dL; urine blood 3+ with RBC 1-2/HPF; BUN/Cr 25/5.5 mg/dL; Na 140, Cl 101, HCO3 12 mEq/L; ABG pH 7.0, PaCO2 15 mmHg; ECG sinus tachycardia; chest radiograph pulmonary congestion. What is the most appropriate management?", "a": "Urgent haemodialysis for severe metabolic acidosis and volume overload", "y": [31], "an": "mx", "sub": "rhabdo + กรดรุนแรง + น้ำเกิน → HD ด่วน", "t": 70}]}], "th": [90, 69, 58, 59, 92, 91, 95, 93, 70]}], "gaps": [{"id": "gap-nephro-02", "set": "nephro", "title": "Paraneoplastic syndrome ของมะเร็งปอด — SIADH, ectopic ACTH, hypercalcemia และ clubbing", "subtitle": "ชนิดเนื้อเยื่อบอกกลุ่มอาการ และการวินิจฉัยรักษา SIADH ที่ไม่ให้ Na ขึ้นเร็วเกิน", "md": "### กลไก\n- Paraneoplastic syndrome คืออาการที่ไม่ได้เกิดจากก้อนกดหรือการแพร่กระจาย แต่เกิดจาก (1) ก้อนหลั่งฮอร์โมนหรือ peptide (ectopic) หรือ (2) ภูมิคุ้มกันต่อก้อนไป cross-react กับเนื้อเยื่อประสาท (onconeural antibody)\n- **Small cell lung cancer (SCLC)** มาจาก neuroendocrine cell จึงหลั่ง ADH, ACTH และแสดง antigen ของเซลล์ประสาท → เป็นมะเร็งที่มี paraneoplastic มากที่สุด\n- อาการ paraneoplastic อาจนำมาก่อนเห็นก้อน จึงเป็นเบาะแสให้หามะเร็ง\n\n| ชนิด | Paraneoplastic ที่เป็นภาพจำ | กลไก |\n|---|---|---|\n| **Small cell** (ก้อนกลางอก คนสูบบุหรี่) | **SIADH** (พบบ่อยสุดของกลุ่ม endocrine ~10–15%), ectopic ACTH, Lambert–Eaton (LEMS), encephalomyelitis และ sensory neuronopathy (anti-Hu), cerebellar degeneration | ectopic ADH/ACTH, anti-VGCC, anti-Hu |\n| **Squamous cell** (ก้อนกลางอก คนสูบบุหรี่) | **Hypercalcemia** | PTHrP |\n| **Adenocarcinoma** (ก้อนส่วนปลาย พบบ่อยสุดโดยรวม พบในคนไม่สูบบุหรี่และหญิงไทยได้) | **Clubbing/HPOA**, Trousseau syndrome (migratory thrombophlebitis), NBTE | VEGF/PDGF, hypercoagulable |\n| Large cell | gynecomastia | β-hCG |\n\n- Ectopic ACTH ใน SCLC มาเร็ว: K ต่ำรุนแรง, metabolic alkalosis, อ่อนแรง, บวม, ความดันและน้ำตาลสูง แต่ลักษณะ cushingoid มักไม่ทันขึ้น\n- LEMS: อ่อนแรงต้นแขนต้นขาที่ **ดีขึ้นเมื่อออกแรงซ้ำ**, reflex ลด, ปากแห้ง; EMG มี incremental response เมื่อกระตุ้นความถี่สูง; รักษา amifampridine (3,4-diaminopyridine) และรักษาก้อน\n\n### Clubbing และ hypertrophic pulmonary osteoarthropathy (HPOA)\n- กลไก: megakaryocyte หรือกลุ่มเกล็ดเลือดไม่ถูกกรองที่ปอด (มะเร็ง หรือ right-to-left shunt) ไปติดที่ปลายนิ้ว ปล่อย **PDGF และ VEGF** → เนื้อเยื่อใต้เล็บหนาตัวและหลอดเลือดเพิ่ม\n- ตรวจ: Lovibond angle > 180°, Schamroth window หาย, nail bed นุ่มหยุ่น, ความหนาปลายนิ้วที่โคนเล็บมากกว่าที่ข้อ DIP\n- HPOA = clubbing + periostitis ของกระดูกยาว (tibia, radius) ปวดกระดูกและข้อ; สัมพันธ์มะเร็งปอดชนิด **non-small cell** (โดยเฉพาะ adenocarcinoma) พบน้อยใน SCLC\n- สาเหตุ clubbing ที่พบบ่อยในผู้ใหญ่: **มะเร็งปอด** (สาเหตุมะเร็งที่พบบ่อยที่สุด), mesothelioma, bronchiectasis, lung abscess, empyema, idiopathic pulmonary fibrosis, cyanotic congenital heart disease, infective endocarditis, IBD, cirrhosis, Graves (thyroid acropachy)\n- **COPD และ asthma ไม่ทำให้เกิด clubbing** ผู้ป่วย COPD ที่มี clubbing ใหม่ → หามะเร็งปอดด้วย CXR/CT\n\n### SIADH: กลไก\n- ADH หลั่งโดยไม่ขึ้นกับ osmolality → V2 receptor ที่ collecting duct → aquaporin-2 → เก็บน้ำ → **dilutional hyponatremia**\n- ปริมาตรเพิ่มเล็กน้อยทำให้ ANP เพิ่มและ RAAS ลด → ขับ Na ออก → ผู้ป่วย **euvolemic ไม่บวม แต่ urine Na สูง**\n\n### เกณฑ์วินิจฉัย SIADH\n1. Serum osmolality < 275 mOsm/kg (hypotonic hyponatremia)\n2. Urine osmolality > 100 mOsm/kg (ปัสสาวะไม่เจือจางอย่างที่ควร)\n3. Euvolemia ทางคลินิก\n4. Urine Na > 30 mEq/L ขณะกินเกลือและน้ำตามปกติ\n5. Thyroid และ adrenal function ปกติ และไม่ได้ใช้ diuretic\n- ข้อมูลสนับสนุน: uric acid < 4 mg/dL, BUN ต่ำ, Na ไม่ขึ้นเมื่อให้ NSS\n- สาเหตุ SIADH: มะเร็ง (SCLC มากที่สุด, มะเร็งศีรษะและคอ), โรคปอด (pneumonia, **TB**), โรคสมอง (stroke, SAH, meningitis), ยา (carbamazepine, oxcarbazepine, SSRI, cyclophosphamide, vincristine, cisplatin, chlorpropamide), ปวดและคลื่นไส้หลังผ่าตัด\n- ต้องแยก secondary adrenal insufficiency และ hypothyroidism ก่อนเสมอ ส่วน cerebral salt wasting มีภาวะ hypovolemia\n\n### รักษา hyponatremia จาก SIADH\n- **อาการรุนแรง** (ชัก ซึม โคม่า อาเจียนมาก): **3% NaCl 100–150 mL IV ใน 10–20 นาที** ซ้ำได้ 2–3 ครั้งจนอาการดีขึ้นหรือ Na ขึ้น 4–6 mEq/L\n- **ขีดจำกัดการแก้**: Na ขึ้นไม่เกิน 10 mEq/L ใน 24 ชม. แรก (ไม่เกิน 8 mEq/L ในกลุ่มเสี่ยง osmotic demyelination: Na ≤ 105, ติดสุรา, ขาดอาหาร, K ต่ำ, โรคตับ); ถ้าขึ้นเกินให้ D5W ± desmopressin ดึงกลับ\n- **ไม่มีอาการหรืออาการน้อย**: จำกัดน้ำ < 800–1,000 mL/วัน; มักไม่ได้ผลถ้า urine osm > 500 หรือ (urine Na + urine K)/serum Na > 1\n- ถ้าจำกัดน้ำไม่พอ: oral urea 15–60 g/วัน, เม็ดเกลือ + loop diuretic, **tolvaptan** (V2 antagonist เริ่ม 15 mg/วัน เริ่มในโรงพยาบาล ไม่จำกัดน้ำช่วงเริ่ม เลี่ยงในโรคตับ)\n- NSS อย่างเดียวอาจทำให้ Na ต่ำลงใน SIADH ที่ urine osm สูง (ไตขับเกลือออกแต่เก็บน้ำไว้)\n- **รักษามะเร็ง**: SCLC ตอบสนองต่อ platinum + etoposide (± immunotherapy) ซึ่งทำให้ SIADH ดีขึ้น", "pearls": ["SCLC → SIADH, ectopic ACTH, LEMS, anti-Hu; squamous → hypercalcemia จาก PTHrP; adenocarcinoma → clubbing/HPOA และ Trousseau", "Clubbing ในผู้ใหญ่ สาเหตุมะเร็งที่พบบ่อยที่สุดคือมะเร็งปอด; COPD เองไม่ทำให้เกิด clubbing", "SIADH: serum osm < 275, urine osm > 100, urine Na > 30, euvolemic, TFT และ cortisol ปกติ", "Hyponatremia อาการรุนแรง → 3% NaCl 100–150 mL bolus; Na ขึ้นไม่เกิน 10 mEq/L ใน 24 ชม. (8 ในกลุ่มเสี่ยง)"], "traps": [], "q": [{"id": "CH-OLD-41", "q": "A 58-year-old heavy smoker is found to have a small cell lung carcinoma with mediastinal involvement. Which paraneoplastic syndrome is most characteristically associated with this tumour?", "a": "Syndrome of inappropriate antidiuretic hormone secretion", "y": [33, 35], "t": 72}, {"id": "ON-OLDP-003", "q": "A 60-year-old man is found to have bilateral clubbing of the fingers (photograph). This finding is most commonly associated with which malignancy?", "a": "Lung cancer", "y": [35], "t": 72}, {"id": "ON-OLDP-004", "q": "A 62-year-old smoker is diagnosed with small cell lung cancer. Which paraneoplastic syndrome is characteristically associated with this tumour?", "a": "Syndrome of inappropriate antidiuretic hormone secretion (SIADH) causing hyponatraemia", "y": [35], "t": 72}], "years": [33, 35], "th": [72]}, {"id": "gap-nephro-01", "set": "nephro", "title": "Periodic paralysis — อ่อนแรงจาก K shift: hypokalemic, thyrotoxic และ hyperkalemic", "subtitle": "ระดับ K ขณะมีอาการบอกชนิด ตัวกระตุ้นบอกกลไก และให้ K น้อยเพราะ K ในร่างกายไม่ได้ขาด", "md": "### กลไก: K ย้ายที่ ไม่ได้หายไป\n- K ในเซลล์ ~98% ความต่างของ K ข้ามเยื่อเซลล์กำหนด resting membrane potential ของกล้ามเนื้อลาย\n- ตัวดึง K **เข้าเซลล์**: insulin (มื้ออาหารแป้งหรือหวาน), β2-agonist และ catecholamine, **thyroid hormone** (เพิ่มจำนวน Na⁺/K⁺-ATPase), alkalosis\n- ตัวดัน K **ออกนอกเซลล์**: พักหลังออกกำลังกาย, อดอาหาร (insulin ต่ำ), β-blocker, hyperosmolality, mineral acidosis\n- Periodic paralysis เป็น **channelopathy** ของกล้ามเนื้อลาย: ใน hypokalemic ช่อง Ca (CACNA1S) หรือ Na (SCN4A) ที่กลายพันธุ์ทำให้เกิดกระแสรั่ว เมื่อ K ต่ำเยื่อเซลล์จึง depolarize ผิดทางจนกระตุ้นไม่ได้; ใน hyperkalemic ช่อง Na (SCN4A) ปิดไม่สนิท K สูงเล็กน้อยก็ทำให้ depolarize ค้างและ Na channel inactivate\n- เพราะ total body K **ปกติ** การให้ KCl มากเกินจะเกิด **rebound hyperkalemia** เมื่อ K ย้ายกลับออกมา\n\n### ชนิดของ periodic paralysis\n\n| ลักษณะ | Hypokalemic PP (familial) | Thyrotoxic PP (TPP) | Hyperkalemic PP |\n|---|---|---|---|\n| พันธุกรรม | autosomal dominant, CACNA1S (ส่วนใหญ่) หรือ SCN4A | ยีนเสี่ยง KCNJ18 + thyrotoxicosis (Graves บ่อยสุด) | autosomal dominant, SCN4A |\n| ใครเป็น | วัยรุ่น | **ชายเอเชีย 20–40 ปี** (ชายมากกว่าหญิงมาก ทั้งที่ Graves พบในหญิงมากกว่า) | เด็กเล็ก ทศวรรษแรก |\n| ตัวกระตุ้น | **มื้อคาร์โบไฮเดรตมาก**, พักหลังออกกำลัง, ความเครียด | เหมือนกัน + แอลกอฮอล์ | พักหลังออกกำลัง, **อดอาหาร**, อาหาร K สูง (ผลไม้), อากาศเย็น |\n| ลักษณะ attack | หลายชั่วโมงถึงวัน มักตื่นมาตอนเช้าแล้วขยับไม่ได้ | เหมือนกัน + ชีพจรเร็ว | สั้น นาทีถึง 2 ชม. บ่อย อาจมี myotonia |\n| K ขณะ attack | ต่ำ (มัก 1.5–3) | ต่ำ, PO4 และ Mg ต่ำเล็กน้อย | **สูงหรือปกติค่อนสูง** |\n| บรรเทา | K | K ขนาดน้อย + propranolol | คาร์โบไฮเดรต, เดินเบา ๆ, salbutamol สูด |\n| ป้องกัน | acetazolamide/dichlorphenamide, K-sparing diuretic, ลดแป้งลดเค็ม | ทำให้ euthyroid (ถาวรด้วย RAI/ผ่าตัด), propranolol ระหว่างรอ | thiazide, acetazolamide/dichlorphenamide, กินแป้งบ่อย ๆ เลี่ยงอดอาหาร |\n\n- Andersen–Tawil syndrome (KCNJ2): periodic paralysis + ventricular arrhythmia + ลักษณะ dysmorphic\n- ทุกชนิด: อ่อนแรงแบบ flaccid เริ่มที่ขาส่วนต้น reflex ลดขณะ attack, ความรู้สึกปกติ, ไม่มีกล้ามเนื้อหายใจหรือหน้าเกี่ยวข้องเป็นส่วนใหญ่, ระหว่าง attack ปกติดี\n- อ่านโจทย์สอบ: อ่อนแรงเป็นพัก ๆ K 6.2 mEq/L ไตปกติ → **hyperkalemic periodic paralysis** (ตัดสาเหตุรองของ K สูง เช่น ACEi/ARB, spironolactone, adrenal insufficiency, rhabdomyolysis ก่อน); ถ้าโจทย์ว่าเป็นหลังมื้อใหญ่ ให้ยึด **ระดับ K** เป็นหลัก เพราะมื้อแป้งมากกระตุ้นชนิด hypokalemic แต่มื้อที่ K สูงกระตุ้นชนิด hyperkalemic\n\n### แยก K ต่ำจาก shift กับจากการเสียทางไต (สำคัญในไทย)\n- **Spot urine K/creatinine < 13 mEq/g (< 1.5 mmol/mmol) หรือ TTKG < 3** → ไตเก็บ K ดี = shift (periodic paralysis) หรือเสียทางลำไส้\n- ค่าสูงกว่านั้น → เสียทางไต: **distal RTA** (พบบ่อยในภาคอีสาน และใน Sjögren), Gitelman/Bartter, diuretic, primary aldosteronism\n- Acid–base: periodic paralysis ปกติ; distal RTA เป็น hyperchloremic metabolic acidosis และ urine pH > 5.5; Gitelman มี metabolic alkalosis, Mg ต่ำ, Ca ในปัสสาวะต่ำ\n- อาการเป็นเร็ว ฟื้นเร็วด้วย K ปริมาณน้อย และชีพจรเร็ว → นึกถึง TPP; **ตรวจ TFT ในการอ่อนแรงจาก K ต่ำครั้งแรกทุกราย** เพราะอาการไทรอยด์เป็นพิษอาจไม่ชัด\n- ECG: K ต่ำมี U wave, ST depression; K สูงมี peaked T, QRS กว้าง\n\n### รักษา TPP และ hypokalemic PP\n1. KCl ทางปากถ้ากลืนได้; ทาง IV ผสมใน NSS ไม่เกิน 10 mEq/ชม. ทางเส้นส่วนปลาย ใช้ปริมาณรวมน้อย และวัด K ทุก 1–2 ชม.; ให้ > 90 mEq/24 ชม. เสี่ยง rebound hyperkalemia สูง\n2. **ห้ามใช้สารน้ำที่มี dextrose** เพราะกระตุ้น insulin ดึง K เข้าเซลล์มากขึ้น\n3. TPP: **propranolol** (non-selective β-blocker ยับยั้งการกระตุ้น Na⁺/K⁺-ATPase) ทางปาก เช่น 40–80 mg หรือ 1 mg IV ช้า ๆ ซ้ำได้ ทำให้หายอ่อนแรงโดยไม่เกิด rebound\n4. รักษา thyrotoxicosis ด้วย methimazole; attack จะหยุดเมื่อ euthyroid จึงควรพิจารณา RAI หรือผ่าตัดเป็นการรักษาถาวร\n5. ป้องกัน: เลี่ยงมื้อแป้งหนัก แอลกอฮอล์ และการพักทันทีหลังออกกำลังหนัก\n\n### รักษา hyperkalemic PP\n- Attack ส่วนใหญ่สั้นและหายเอง: กินคาร์โบไฮเดรต เดินเบา ๆ salbutamol สูด\n- ถ้า K สูงมากหรือ ECG เปลี่ยน: calcium gluconate 10% 10 mL IV, insulin + glucose เหมือนรักษา hyperkalemia ทั่วไป\n- ป้องกัน: thiazide หรือ acetazolamide/dichlorphenamide, กินมื้อเล็กบ่อย ๆ ที่มีแป้ง, เลี่ยงอาหาร K สูงและการอดอาหาร; ระวัง depolarizing muscle relaxant (succinylcholine) ตอนดมยา", "pearls": ["Periodic paralysis = K shift โดย total body K ปกติ ให้ KCl มากเกินเสี่ยง rebound hyperkalemia", "ชายเอเชียอ่อนแรงเฉียบพลัน K ต่ำ หลังมื้อแป้งหรือแอลกอฮอล์ + ชีพจรเร็ว → TPP: ตรวจ TFT ให้ propranolol + KCl ขนาดน้อย ห้ามสารน้ำ dextrose", "อ่อนแรงเป็นพัก + K สูง + ไตปกติ → hyperkalemic PP (SCN4A); คาร์โบไฮเดรตช่วยให้หาย อดอาหารกระตุ้น", "Urine K/Cr < 13 mEq/g และ acid–base ปกติ → shift; สูงกว่านั้น → เสียทางไต (distal RTA, Gitelman)"], "traps": [], "q": [{"id": "N-OLD-066", "q": "A patient develops episodic weakness after a large meal with K 6.2 mEq/L and normal renal function. What is the likely diagnosis?", "a": "Hyperkalaemic periodic paralysis", "y": [28], "t": 74}], "years": [28], "th": []}], "left": []}, {"set": "chest", "name": "Chest", "n_lec": 84, "n_unc": 16, "lectures": [{"lec": "03", "title": "Pulmonary tuberculosis", "n": 17, "angle": {"mx": 4, "mech": 9, "ix": 2, "fact": 2}, "pattern": "ข้อสอบวัณโรคปอดเน้นผลข้างเคียงยาแบบจับคู่ยา–อาการ (mech/mx) ซ้ำแทบทุกรุ่น ตามด้วยคำถามเชิงโปรแกรม: isolation, MDR, culture, adherence/DOT. โจทย์มักเป็น vignette สั้นที่ให้อาการหลังเริ่มยา 1–8 สัปดาห์ แล้วถามยาที่เป็นต้นเหตุหรือการจัดการ.", "tip": "ท่องตารางผลข้างเคียง H/R/Z/E พร้อมการจัดการ (ตับอักเสบ: หยุดยาเมื่อ ALT >3 เท่ามีอาการ/>5 เท่า แล้ว rechallenge, EMB → ส่งจักษุแพทย์, INH → B6) ให้แม่น แล้วเก็บตัวเลข/นิยามสั้น ๆ: MDR, culture gold standard, airborne isolation + N95 ~2 สัปดาห์.", "secs": [{"t": "เชื้อ การติดต่อ และการป้องกันการแพร่เชื้อ", "n": 1, "y": [32], "w": "รับผู้ป่วย smear บวก → ห้องความดันลบ + บุคลากรใส่ N95", "c": null, "s": ["airborne isolation + N95"], "q": [{"q": "A patient with newly diagnosed smear-positive pulmonary tuberculosis is admitted. Which admission arrangement is most appropriate?", "a": "Admit to a negative-pressure isolation room and have all staff wear an N95 respirator", "y": [32], "an": "mx", "sub": "airborne isolation + N95", "t": 98}]}, {"t": "ธรรมชาติของโรค — primary, latent และ reactivation", "n": 1, "y": [35], "w": "reactivation TB ชอบ apical/posterior segment ของกลีบบนเพราะ O2 tension สูง", "c": null, "s": ["Reactivation ที่ apex (O2 tension)"], "q": [{"q": "Reactivation pulmonary tuberculosis in an immunocompetent adult most characteristically involves which part of the lung, and why?", "a": "Apical and posterior segments of the upper lobes, because of the higher oxygen tension there", "y": [35], "an": "mech", "sub": "Reactivation ที่ apex (O2 tension)", "t": 98}]}, {"t": "Latent TB infection และการดูแลผู้สัมผัส", "n": 1, "y": [31], "w": "TNF-α คุม granuloma → anti-TNF ทำ LTBI reactivate", "c": null, "s": ["TNF-α คุม granuloma, anti-TNF reactivation"], "q": [{"q": "Which cytokine is most essential for forming and maintaining the granuloma that contains Mycobacterium tuberculosis, such that blocking it can reactivate latent tuberculosis?", "a": "Tumour necrosis factor-alpha (TNF-α)", "y": [31], "an": "mech", "sub": "TNF-α คุม granuloma, anti-TNF reactivation", "t": 102}]}, {"t": "อาการและภาพรังสีทรวงอก", "n": 1, "y": [33], "w": null, "c": null, "s": ["CXR เป็นการตรวจแรก"], "q": [{"q": "A 45-year-old man has had cough for 6 weeks with weight loss, night sweats and a recent episode of blood-streaked sputum. He is haemodynamically stable. Pulmonary tuberculosis is suspected. What is the most appropriate initial investigation?", "a": "Chest radiograph (PA view)", "y": [33], "an": "ix", "sub": "CXR เป็นการตรวจแรก", "t": 98}]}, {"t": "การวินิจฉัยทางห้องปฏิบัติการ", "n": 1, "y": [34], "w": "gold standard = sputum culture", "c": null, "s": ["culture = gold standard"], "q": [{"q": "Which investigation is the gold standard for the diagnosis of pulmonary tuberculosis?", "a": "Mycobacterial culture of sputum", "y": [34], "an": "ix", "sub": "culture = gold standard", "t": 98}]}, {"t": "สูตรยาและระยะเวลาการรักษา", "n": 0, "y": [], "w": null, "c": "สูตรยา 2HRZE/4HR และระยะเวลารักษาไม่เคยถูกถามตรง ๆ แต่เป็นฐานของทุกข้อเรื่องผลข้างเคียง — ควรจำสูตรและขนาดยา", "s": [], "q": []}, {"t": "ผลข้างเคียงของยาวัณโรคและการติดตามการรักษา", "n": 10, "y": [28, 29, 30, 31, 32, 33, 35], "w": "ผลข้างเคียงยาวัณโรคจับคู่ยา: RIF ปัสสาวะส้ม/flu-like (intermittent), PZA uric สูง-ปวดข้อ, EMB ตามัว-ตาบอดสี → หยุด EMB, INH ชา → B6; ตับอักเสบ → หยุดยาตับแล้ว rechallenge; smear ยังบวกที่ 2 เดือน → นึกถึงขาดยา ทำ DOT; ถามแทบทุกรุ่น 28–35", "c": null, "s": ["rifampicin flu-like syndrome", "ตับอักเสบจากยา: หยุดยา rechallenge", "ethambutol optic neuritis", "pyrazinamide กรดยูริกสูง"], "q": [{"q": "A 30-year-old previously healthy woman with smear-positive pulmonary tuberculosis was started on isoniazid, rifampicin, pyrazinamide and ethambutol once daily. After 1 week she develops progressive nausea, vomiting and malaise. Physical findings are unremarkable. Liver function tests: total bilirubin / direct bilirubin 2.8 / 1.6 mg/dL, AST/ALT 180/170 U/L, ALP 150 U/L (normal <115). What is the most appropriate immediate management?", "a": "Stop hepatotoxic drugs and rechallenge later", "y": [31], "an": "mx", "sub": "ตับอักเสบจากยา: หยุดยา rechallenge", "t": 97}, {"q": "A patient receiving the 2HRZE/4HR anti-tuberculous regimen develops painless blurring of vision in both eyes with impaired colour discrimination after several weeks of treatment. There is no eye redness or pain. Which of the following is the most appropriate action?", "a": "Stop ethambutol and refer to an ophthalmologist", "y": [31], "an": "mx", "sub": "ethambutol optic neuritis", "t": 97}, {"q": "Which anti-tuberculous drug most characteristically causes hyperuricaemia and may precipitate an acute gouty attack?", "a": "Pyrazinamide", "y": [33], "an": "mech", "sub": "pyrazinamide กรดยูริกสูง", "t": 97}, {"q": "A patient completing anti-tuberculous therapy notices that his urine, tears and sweat have turned orange-red. He feels well and liver function tests are normal. Which drug is responsible?", "a": "Rifampicin", "y": [28, 31], "an": "mech", "sub": "rifampicin ปัสสาวะสีส้มแดง", "t": 97}, {"q": "Which anti-tuberculous drug causes peripheral neuropathy, and what is given to prevent it?", "a": "Isoniazid; prevented by pyridoxine (vitamin B6)", "y": [35], "an": "mech", "sub": "INH neuropathy + pyridoxine", "t": 97}, {"q": "A patient on an intermittent (thrice-weekly) rifampicin-containing regimen develops fever, chills, headache and myalgia a few hours after each dose. Which statement is correct?", "a": "Rifampicin can cause an immune-mediated flu-like syndrome, especially with intermittent dosing", "y": [29], "an": "mech", "sub": "rifampicin flu-like syndrome", "t": 97}, {"q": "Which pairing of an anti-tuberculous drug with its characteristic adverse effect is correct?", "a": "Rifampicin - flu-like syndrome (especially with intermittent dosing)", "y": [31], "an": "mech", "sub": "จับคู่ยากับผลข้างเคียง", "t": 97}, {"q": "A patient taking anti-tuberculous drugs develops fever, chills, headache and myalgia a few hours after each dose, particularly with intermittent dosing. Which drug is most likely responsible for this flu-like syndrome?", "a": "Rifampicin", "y": [31], "an": "mech", "sub": "rifampicin flu-like syndrome", "t": 97}, {"q": "A patient on anti-tuberculous therapy develops joint pain with a serum uric acid of 10 mg/dL. Which drug is responsible?", "a": "Pyrazinamide", "y": [33], "an": "mech", "sub": "pyrazinamide ปวดข้อ uric สูง", "t": 97}, {"q": "A patient with smear-positive pulmonary tuberculosis has been on the standard regimen for 8 weeks but his sputum smear remains AFB positive and his symptoms have not improved. He obtains his medication from the local health centre and admits missing doses frequently. Which is the most likely explanation and the best next step?", "a": "Poor adherence; start DOT and send culture", "y": [30, 32], "an": "mx", "sub": "ติดตาม smear 2 เดือน, adherence/DOT", "t": 98}]}, {"t": "วัณโรคในภาวะพิเศษ — ไต ตับ ตั้งครรภ์ และเอชไอวี", "n": 0, "y": [], "w": null, "c": "วัณโรคในโรคไต ตับ ตั้งครรภ์ HIV (ปรับยา, IRIS, rifampicin-ARV interaction) ยังไม่ถูกถาม แต่เป็นหัวข้อ MEQ/ward ที่ออกได้ง่าย", "s": [], "q": []}, {"t": "วัณโรคดื้อยา", "n": 2, "y": [32], "w": "นิยาม MDR-TB = ดื้อ INH + RIF และใครเสี่ยง MDR (ผู้สัมผัสร่วมบ้านผู้ป่วย MDR)", "c": null, "s": ["นิยาม MDR-TB", "ปัจจัยเสี่ยง MDR: สัมผัสผู้ป่วย MDR"], "q": [{"q": "What is the definition of multidrug-resistant tuberculosis (MDR-TB)?", "a": "Resistance to at least isoniazid and rifampicin", "y": [32], "an": "fact", "sub": "นิยาม MDR-TB", "t": 98}, {"q": "Which of the following patients with newly diagnosed pulmonary tuberculosis is most likely to have multidrug-resistant (MDR) TB?", "a": "A patient who is a close household contact of a known MDR-TB case", "y": [32], "an": "fact", "sub": "ปัจจัยเสี่ยง MDR: สัมผัสผู้ป่วย MDR", "t": 98}]}], "th": [102, 97]}, {"lec": "26", "title": "Arterial blood gas analysis", "n": 13, "angle": {"mech": 3, "dx": 2, "interp": 8}, "pattern": "ข้อสอบ ABG แทบทั้งหมดเป็น interp: ให้ตัวเลข pH/PaCO2/HCO3 (± electrolyte) แล้วถามชนิดความผิดปกติ มักซ่อน mixed disorder ที่ต้องใช้ expected compensation หรือ delta ratio. ส่วน oxygenation ถามแนวกลไก (shunt vs V/Q vs hypoventilation, A–a gradient) ซ้ำหลายรุ่นตั้งแต่ 29–35.", "tip": "ฝึกแปล ABG ให้ครบ 5 ขั้น (primary → compensation สูตร Winter/acute-chronic → AG → delta ratio → สาเหตุ) กับโจทย์จริงจนคล่อง และจำตาราง A–a ปกติ vs กว้าง + ตอบสนอง O2 หรือไม่.", "secs": [{"t": "การเก็บตัวอย่างและข้อผิดพลาดที่ทำให้แปลผลผิด", "n": 0, "y": [], "w": null, "c": "การเก็บตัวอย่างและ error (ฟองอากาศ, เก็บช้า, leukocyte larceny) ไม่เคยถาม — ความสำคัญต่ำสำหรับข้อสอบ", "s": [], "q": []}, {"t": "ประเมิน oxygenation — PaO2, SaO2 และ dissociation curve", "n": 0, "y": [], "w": null, "c": "PaO2/SaO2 และ dissociation curve shift ไม่ถูกถามใน lecture นี้ (พบคำถามคล้ายใน lecture 17 เล็กน้อย)", "s": [], "q": []}, {"t": "A–a gradient และกลไกของภาวะพร่องออกซิเจน", "n": 3, "y": [29, 30, 31, 32, 33, 34], "w": "กลไก hypoxemia กับ A–a gradient: shunt ไม่ตอบ O2, ARDS A–a กว้าง, hypoventilation จาก opioid A–a ปกติ; ซ้ำ 3–5 รุ่น", "c": null, "s": ["นิยาม shunt ไม่ตอบสนอง O2", "ARDS: A–a กว้าง refractory hypoxemia", "hypoventilation A–a ปกติ"], "q": [{"q": "Which statement correctly describes a physiological shunt?", "a": "Alveolar units that are perfused but not ventilated, causing hypoxaemia that does not correct with supplemental oxygen", "y": [30, 32, 34], "an": "mech", "sub": "นิยาม shunt ไม่ตอบสนอง O2", "t": 104}, {"q": "A patient has severe hypoxaemia with a markedly increased alveolar-arterial oxygen gradient that does not improve despite a high fraction of inspired oxygen. Bilateral infiltrates are present on chest radiograph and there is no evidence of cardiac failure. Which condition best explains this?", "a": "Acute respiratory distress syndrome", "y": [31, 33], "an": "dx", "sub": "ARDS: A–a กว้าง refractory hypoxemia", "t": 104}, {"q": "Which of the following causes hypoxaemia with a NORMAL alveolar-arterial oxygen gradient?", "a": "Hypoventilation from an opioid overdose", "y": [29, 30, 31], "an": "mech", "sub": "hypoventilation A–a ปกติ", "t": 104}]}, {"t": "Ventilation และภาวะหายใจล้มเหลว", "n": 1, "y": [35], "w": "acute respiratory acidosis (pH 7.26, PaCO2 60, HCO3 26) ชดเชยน้อย", "c": null, "s": ["acute respiratory acidosis"], "q": [{"q": "A patient becomes dyspnoeic 6 hours ago. Arterial blood gas on room air: pH 7.26, PaCO2 60 mmHg, HCO3 26 mEq/L, O2 saturation 80 percent. Which interpretation is correct?", "a": "Acute respiratory acidosis with minimal metabolic compensation", "y": [35], "an": "interp", "sub": "acute respiratory acidosis", "t": 101}]}, {"t": "แปลผลกรด-ด่างทีละขั้น", "n": 5, "y": [30, 31, 34, 35], "w": "แปลผล ABG ทีละขั้น: mixed metabolic+respiratory acidosis, acute-on-chronic respiratory acidosis ใน COPD, asthma ที่ CO2 คั่ง, salicylate (resp alkalosis + HAGMA), hyperventilation → ionized Ca ต่ำ", "c": null, "s": ["alkalosis → ionized Ca ลด", "respiratory + metabolic acidosis ใน asthma", "mixed metabolic + respiratory acidosis", "acute-on-chronic respiratory acidosis"], "q": [{"q": "A 17-year-old student starts breathing rapidly (RR 34/min) after an argument with friends at school and develops perioral numbness and carpopedal spasm. Which mechanism explains the carpopedal spasm?", "a": "Acute respiratory alkalosis increases albumin binding of calcium, lowering ionised calcium", "y": [30], "an": "mech", "sub": "alkalosis → ionized Ca ลด", "t": 100}, {"q": "A 30-year-old woman with asthma presents with fever, cough and severe dyspnoea, BP 90/60 mmHg. ABG on supplemental oxygen: pH 7.16, PaCO2 72 mmHg, HCO3 19 mEq/L, PaO2 81 mmHg. What is the acid–base disorder and the immediate management?", "a": "Acute respiratory acidosis with a concomitant metabolic acidosis (hypoventilation, oxygenation adequate on O2); give oxygen, bronchodilators, systemic steroid, antibiotics and fluid, and prepare for ventilatory support", "y": [30], "an": "interp", "sub": "respiratory + metabolic acidosis ใน asthma", "t": 101}, {"q": "An arterial blood gas shows pH 7.15, PaCO2 30 mmHg and HCO3 10 mEq/L. Which acid-base disorder is present?", "a": "Mixed metabolic acidosis and respiratory acidosis", "y": [31], "an": "interp", "sub": "mixed metabolic + respiratory acidosis", "t": 101}, {"q": "A 60-year-old man with chronic obstructive pulmonary disease presents with worsening dyspnoea. Arterial blood gas: pH 7.30, PaCO2 80 mmHg, HCO3 38 mEq/L. Which interpretation is correct?", "a": "Acute-on-chronic respiratory acidosis with partial metabolic compensation", "y": [35], "an": "interp", "sub": "acute-on-chronic respiratory acidosis", "t": 101}, {"q": "A 19-year-old man is brought in comatose; he was asymptomatic 12 hours ago. Pulse 110/min, RR 32/min, BP 90/60 mmHg. Glucose 114 mg/dL, BUN 14 mg/dL, Cr 1.4 mg/dL, Na 142, K 3.6, Cl 108, HCO3 14 mEq/L; measured serum osmolality 290 mOsm/kg. ABG: pH 7.42, PaCO2 20 mmHg, PaO2 94 mmHg. What is the most likely diagnosis?", "a": "Salicylate poisoning", "y": [34, 35], "an": "dx", "sub": "salicylate: resp alkalosis + HAGMA", "t": 103}]}, {"t": "Anion gap, delta ratio และสาเหตุของ metabolic acidosis", "n": 4, "y": [28, 30, 31, 32, 34, 35], "w": "anion gap/Winter's formula/delta ratio: DKA HAGMA ชดเชยเหมาะสม, ท้องเสีย NAGMA, triple disorder (pneumonia+อาเจียน+lactic)", "c": null, "s": ["HAGMA + Winter's formula", "ท้องเสีย → NAGMA", "triple disorder: delta ratio", "DKA: HAGMA ชดเชยเหมาะสม"], "q": [{"q": "A patient has Na 140, Cl 105, HCO3 13 mEq/L, pH 7.29 and PaCO2 26 mmHg. Which interpretation is correct?", "a": "High anion gap metabolic acidosis with appropriate respiratory compensation (expected PaCO2 25.5–29.5 mmHg)", "y": [30], "an": "interp", "sub": "HAGMA + Winter's formula", "t": 101}, {"q": "A 30-year-old man has had profuse watery diarrhoea for 3 days. Which arterial blood gas is most consistent with the expected acid–base disturbance, appropriately compensated?", "a": "pH 7.28, PaCO2 29 mmHg, HCO3 13 mEq/L", "y": [34], "an": "interp", "sub": "ท้องเสีย → NAGMA", "t": 101}, {"q": "A 56-year-old diabetic man presents with fever, productive cough and vomiting for 3 days. Vital signs: BT 38.5 C, PR 110/min, RR 28/min, BP 95/55 mmHg, moderate dehydration, crepitations at the lower lung. Laboratory results: blood sugar 128 mg/dL, BUN 14, creatinine 1.0 mg/dL, Na 140, K 4.1, Cl 78, HCO3 15 mEq/L, albumin 4.0 g/dL. ABG: pH 7.50, PaO2 70 mmHg, PaCO2 20 mmHg. What best describes the acid-base abnormality?", "a": "Respiratory alkalosis from pneumonia, metabolic alkalosis from vomiting and high anion gap metabolic acidosis from lactic acidosis", "y": [31, 35], "an": "interp", "sub": "triple disorder: delta ratio", "t": 101}, {"q": "A patient with diabetic ketoacidosis has an arterial blood gas showing pH 7.26, PaCO2 23 mmHg and HCO3 10 mEq/L, with Na 140, Cl 100 mEq/L. Which interpretation is correct?", "a": "High anion gap metabolic acidosis with appropriate respiratory compensation", "y": [28, 32], "an": "interp", "sub": "DKA: HAGMA ชดเชยเหมาะสม", "t": 101}]}], "th": [104, 103, 100, 101]}, {"lec": "23/9", "title": "Extrapulmonary tuberculosis", "n": 3, "angle": {"fact": 2, "mx": 1}, "pattern": "Lecture นี้แทบไม่มีข้อสอบโดยตรง มีเพียงคำถามเชิงควบคุมการติดเชื้อ (ระยะ isolation, EPTB ไม่แพร่ทางอากาศ) ในรุ่น 32 และ 35. โจทย์ EPTB อื่น ๆ (TB pleuritis) ถูกถามผ่านการอ่านน้ำเยื่อหุ้มปอดใน lecture อื่น.", "tip": "เน้นหลัก isolation (~2 สัปดาห์/EPTB ไม่ต้อง airborne ถ้าตัด PTB แล้ว) และ ADA cut-off ของ pleural TB; ส่วน meningitis/pericarditis ทบทวนแบบตัวเลขสำคัญพอ.", "secs": [{"t": "ภูเขาน้ำแข็งที่ซ่อนอยู่ — ภาระโรคและใครเสี่ยง", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "HIV เปลี่ยนแผนที่ของโรค", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ทำไม EPTB วินิจฉัยยาก — smear, culture, NAAT และ TST", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "ถอดรหัสสารน้ำ: pleural, pericardial และ CSF + ADA", "n": 0, "y": [], "w": null, "c": "อ่านสารน้ำ + ADA (pleural/pericardial/CSF) ไม่ถูกถามใน lecture นี้โดยตรง แต่ TB pleural effusion ถูกถามผ่าน Light's criteria (lecture 17) — ควรรู้ cut-off ADA >40", "s": [], "q": []}, {"t": "Case 01 — วัณโรคเยื่อหุ้มปอด (TB pleuritis)", "n": 0, "y": [], "w": null, "c": "TB pleuritis ถามซ้ำแต่ถูกจัดไปที่ Light's criteria (chest-rp-11)", "s": [], "q": []}, {"t": "Case 02 — วัณโรคต่อมน้ำเหลือง (TB lymphadenitis)", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "Case 03 — วัณโรคกระดูกสันหลัง (Pott's disease)", "n": 0, "y": [], "w": null, "c": "Pott's disease ยังไม่ถูกถาม", "s": [], "q": []}, {"t": "วัณโรคเยื่อหุ้มสมองและระบบประสาท (TB meningitis, tuberculoma)", "n": 0, "y": [], "w": null, "c": "TB meningitis / tuberculoma ยังไม่ถูกถามในกลุ่มนี้ แต่สำคัญทางคลินิก (steroid, CSF lymphocyte, glucose ต่ำ)", "s": [], "q": []}, {"t": "วัณโรคเยื่อหุ้มหัวใจ (TB pericarditis)", "n": 0, "y": [], "w": null, "c": "TB pericarditis ยังไม่ถูกถาม — ADA ในน้ำเยื่อหุ้มหัวใจและ constrictive pericarditis", "s": [], "q": []}, {"t": "วัณโรคช่องท้องและระบบทางเดินปัสสาวะ", "n": 0, "y": [], "w": null, "c": null, "s": [], "q": []}, {"t": "สรุปการรักษา: ระยะเวลา steroid และการผ่าตัด", "n": 0, "y": [], "w": null, "c": "ระยะเวลารักษาและ steroid ใน EPTB (meningitis 12 เดือน) ยังไม่ถูกถาม — เป็นตัวเลขที่ออกง่าย", "s": [], "q": []}, {"t": "พิษของยาแนวแรก และการตัดวงจรการแพร่เชื้อ", "n": 3, "y": [32, 35], "w": "การควบคุมการแพร่เชื้อ: แยกผู้ป่วย ~2 สัปดาห์หลังเริ่มยา; TB lymphadenitis ไม่มีรอยโรคปอด → ward ธรรมดา standard precaution", "c": null, "s": ["แยกผู้ป่วยอย่างน้อย 2 สัปดาห์", "EPTB ไม่แพร่ทางอากาศ"], "q": [{"q": "An adult with smear-positive pulmonary tuberculosis has just started standard anti-TB therapy. Roughly how long should the patient be separated (isolated) from other people?", "a": "About 2 weeks", "y": [32], "an": "fact", "sub": "แยกผู้ป่วยอย่างน้อย 2 สัปดาห์", "t": 98}, {"q": "A patient with smear-positive, drug-susceptible pulmonary tuberculosis starts standard therapy. In general, for how long should airborne isolation be maintained after starting effective treatment?", "a": "About 2 weeks, provided there is clinical improvement on treatment", "y": [35], "an": "fact", "sub": "แยกผู้ป่วยอย่างน้อย 2 สัปดาห์", "t": 98}, {"q": "A 35-year-old woman is admitted for drainage and evaluation of tuberculous cervical lymphadenitis. Chest radiograph is normal and sputum AFB is negative; she has no cough and no laryngeal involvement. What infection-control arrangement is appropriate on the ward?", "a": "Admit to a general ward with standard precautions (no airborne isolation needed)", "y": [32], "an": "mx", "sub": "EPTB ไม่แพร่ทางอากาศ", "t": 98}]}], "th": [98]}, {"lec": "17", "title": "Respiratory failure and Pleural disease", "n": 18, "angle": {"mech": 4, "mx": 4, "dx": 3, "fact": 2, "interp": 5}, "pattern": "Lecture ที่ถูกถามมากที่สุดในกลุ่ม chest: โจทย์อ่านผลน้ำเยื่อหุ้มปอด (interp) ให้ protein/LDH ratio, cell differential, pH/glucose, TG แล้วถามสาเหตุหรือการจัดการ ถามซ้ำแทบทุกรุ่น. Pneumothorax ถามเชิง mx (tension, บนเครื่องช่วยหายใจ) และ mech (bleb) ซ้ำ 31–35 ส่วน respiratory failure ถามเพียงกลไก hypoxemia.", "tip": "ทำ Light's criteria + ตารางอ่านน้ำ (lymphocyte → TB/มะเร็ง, pH <7.2 → drain, TG >110 → chylothorax, amylase) ให้คล่อง และจำ algorithm pneumothorax: tension → needle ก่อน, on ventilator → ICD เสมอ.", "secs": [{"t": "ออกซิเจนเดินทางอย่างไร — DO₂ และ O₂ dissociation curve", "n": 0, "y": [], "w": null, "c": "DO2 และ O2 dissociation curve ไม่ถูกถาม — พื้นฐานสรีรวิทยา", "s": [], "q": []}, {"t": "Hypoxia ไม่เท่ากับ hypoxemia — สี่แบบ และเมื่อไร SpO₂ โกหก", "n": 0, "y": [], "w": null, "c": "hypoxia 4 แบบ / SpO2 หลอก (CO poisoning, methemoglobin) ยังไม่ถูกถาม แต่ออกง่ายเป็น MCQ", "s": [], "q": []}, {"t": "A-a gradient — เครื่องมือแยกปอดเสียกับหายใจไม่พอ", "n": 0, "y": [], "w": null, "c": "A–a gradient ถูกถามบ่อยแต่จัดไว้ที่ lecture ABG (chest-26-03) — เนื้อหาซ้ำกัน", "s": [], "q": []}, {"t": "V/Q mismatch · shunt · dead space · diffusion — ให้ O₂ แล้วดีขึ้นไหม", "n": 2, "y": [31, 34], "w": "V/Q mismatch ตอบสนอง O2 ดี vs dead space (high V/Q) ใน emphysema", "c": null, "s": ["dead space (high V/Q) ใน emphysema", "V/Q mismatch ตอบสนอง O2"], "q": [{"q": "Which condition primarily increases physiological dead space (alveoli that are ventilated but poorly perfused, i.e. high V/Q units)?", "a": "Emphysema-predominant COPD with destruction of the alveolar capillary bed", "y": [34], "an": "mech", "sub": "dead space (high V/Q) ใน emphysema", "t": 104}, {"q": "A 66-year-old man with COPD has PaO2 52 mmHg on room air. After oxygen 2 L/min by nasal cannula, his PaO2 rises to 78 mmHg. Which mechanism of hypoxaemia is most consistent with this good response to supplemental oxygen?", "a": "Ventilation-perfusion (V/Q) mismatch", "y": [31], "an": "mech", "sub": "V/Q mismatch ตอบสนอง O2", "t": 104}]}, {"t": "Respiratory failure สี่ชนิด และเลือกออกซิเจนให้ตรงกลไก", "n": 1, "y": [30], "w": null, "c": null, "s": ["หมดสติหายใจตื้น → BVM แล้วใส่ท่อ"], "q": [{"q": "A patient is found unconscious with SpO2 80% on room air and shallow breathing. What is the most appropriate immediate management?", "a": "Bag-valve-mask ventilation with 100% oxygen, then endotracheal intubation", "y": [30], "an": "mx", "sub": "หมดสติหายใจตื้น → BVM แล้วใส่ท่อ", "t": 109}]}, {"t": "เจ็บหน้าอกจากปอด — ประสาทของเยื่อหุ้มปอด และตรวจร่างกายแยก ลม น้ำ เนื้อ", "n": 2, "y": [30, 33, 34], "w": "ตรวจร่างกายแยกน้ำ: ทึบ เสียงลด fremitus ลด; massive effusion หลอดลมเบี้ยวออก", "c": null, "s": ["ตรวจร่างกาย: น้ำ (ทึบ เสียงลด fremitus ลด)", "massive effusion หลอดลมเบี้ยวออก"], "q": [{"q": "A 60-year-old man has decreased breath sounds and dullness to percussion at the right lower chest with decreased tactile fremitus and reduced chest wall expansion on that side. Which condition do these findings indicate?", "a": "Pleural effusion", "y": [30, 34], "an": "dx", "sub": "ตรวจร่างกาย: น้ำ (ทึบ เสียงลด fremitus ลด)", "t": 108}, {"q": "A patient has a massive right-sided pleural effusion with complete opacification of the right hemithorax. Toward which side would the trachea be expected to be deviated?", "a": "Away from the effusion, to the left", "y": [33], "an": "fact", "sub": "massive effusion หลอดลมเบี้ยวออก", "t": 108}]}, {"t": "Pneumothorax — ชนิด สาเหตุ และวินิจฉัยด้วยตา ฟิล์ม อัลตราซาวด์", "n": 3, "y": [31, 32, 34, 35], "w": "tension pneumothorax → needle decompression ทันทีแล้วใส่ ICD (ถาม 4 รุ่น 31–35); PSP ในชายผอมสูงจาก subpleural apical bleb", "c": null, "s": ["PSP จาก subpleural bleb", "tension pneumothorax → needle decompression"], "q": [{"q": "A 25-year-old tall thin man develops sudden right-sided chest pain and dyspnoea. Examination shows decreased breath sounds and hyperresonance to percussion on the right, with the trachea deviated to the left and blood pressure 80/50 mmHg. What is the most appropriate immediate action?", "a": "Immediate needle decompression followed by intercostal chest drain insertion", "y": [31, 32, 34, 35], "an": "mx", "sub": "tension pneumothorax → needle decompression", "t": 106}, {"q": "A previously healthy 22-year-old tall, thin man has sudden right pleuritic chest pain and dyspnoea. Examination shows decreased breath sounds and hyper-resonance (tympany) to percussion on the right. What is the most likely underlying cause?", "a": "Rupture of a subpleural apical bleb", "y": [31], "an": "mech", "sub": "PSP จาก subpleural bleb", "t": 106}, {"q": "A tall, thin 22-year-old man who smokes has sudden right-sided pleuritic chest pain and breathlessness. The right hemithorax is tympanic (hyperresonant) to percussion with absent breath sounds. What is the most likely underlying cause?", "a": "Rupture of subpleural apical blebs", "y": [34], "an": "mech", "sub": "PSP จาก subpleural bleb", "t": 106}]}, {"t": "รักษา pneumothorax ตาม BTS 2023 — ดูอาการ ไม่ใช่ขนาด", "n": 1, "y": [31, 34, 35], "w": "pneumothorax ขณะใช้เครื่องช่วยหายใจ (แม้ 10%) → tube thoracostomy; ถาม 31, 34, 35", "c": null, "s": ["บนเครื่องช่วยหายใจ → tube thoracostomy"], "q": [{"q": "A 52-year-old woman is mechanically ventilated with pressure-controlled ventilation and PEEP for severe pneumonia. After subclavian catheterisation she develops subcutaneous emphysema and a chest radiograph shows a 10 percent right pneumothorax. What is the most appropriate management?", "a": "Tube thoracostomy", "y": [31, 34, 35], "an": "mx", "sub": "บนเครื่องช่วยหายใจ → tube thoracostomy", "t": 106}]}, {"t": "Pleural effusion — น้ำมาจากไหน และเห็นได้เมื่อมีเท่าไร", "n": 0, "y": [], "w": null, "c": "กลไกเกิดน้ำ (Starling) และปริมาณที่เห็นบนฟิล์มไม่ถูกถามโดยตรง", "s": [], "q": []}, {"t": "เมื่อไรต้องเจาะ และ work up ตาม BTS 2023", "n": 0, "y": [], "w": null, "c": "ข้อบ่งชี้เจาะ/ work-up ตาม BTS 2023 เป็นเนื้อหาใหม่ยังไม่ถูกถาม", "s": [], "q": []}, {"t": "Light's criteria และอ่านน้ำให้ออกว่าคืออะไร", "n": 5, "y": [28, 30, 31, 34, 35], "w": "Light's criteria + อ่านน้ำ: transudate = CHF, exudate lymphocyte เด่น = TB, chylothorax TG สูง, amylase-rich effusion, ADA ต่ำ → มะเร็ง; ซ้ำ 28–35", "c": null, "s": ["exudate lymphocyte เด่น = TB pleuritis", "chylothorax TG > 110", "transudate = CHF", "amylase-rich effusion สาเหตุ"], "q": [{"q": "A 16-year-old man with 1 month of low-grade fever and cough has a chest radiograph showing right upper lobe infiltration with a right pleural effusion. Pleural fluid is yellow with WBC 900 cells/dL (neutrophils 10 percent, lymphocytes 90 percent), pleural fluid to serum LDH ratio 0.8 and pleural fluid to serum protein ratio 0.7. What is the most likely diagnosis?", "a": "Tuberculous pleural effusion", "y": [28, 31], "an": "interp", "sub": "exudate lymphocyte เด่น = TB pleuritis", "t": 105}, {"q": "Thoracentesis yields milky-white pleural fluid. Analysis shows WBC 1200 cells/microlitre with lymphocyte predominance and triglyceride 300 mg/dL. What is the most likely diagnosis?", "a": "Chylothorax", "y": [35], "an": "interp", "sub": "chylothorax TG > 110", "t": 105}, {"q": "A patient has a bilateral pleural effusion. Pleural fluid analysis shows a transudate by Light's criteria. Which of the following is the most likely cause?", "a": "Congestive heart failure", "y": [28, 31, 34], "an": "interp", "sub": "transudate = CHF", "t": 105}, {"q": "Which of the following is NOT a recognised cause of an amylase-rich pleural effusion?", "a": "Rheumatoid pleural effusion", "y": [31], "an": "fact", "sub": "amylase-rich effusion สาเหตุ", "t": 105}, {"q": "A former smoker (20 pack-years, stopped 10 years ago) has a pleural effusion. Pleural fluid meets Light's criteria for an exudate and pleural ADA is 30 U/
