<title>SAQ MED421 รายปี</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: framed retro study board — class-year rail | SAQ cards by exam round | topic tracker; folds to one column on phones */
:root{
  --stage:#ebe8e2; --app:#fbf4e7; --paper:#fffdf8; --ink:#1d1b18; --fg:#1d1b18; --muted:#6a6356;
  --yellow:#f5c346; --blue:#aab5f6; --pink:#f6b8cb; --mint:#bde6c6; --peach:#f9d0a4; --lilac:#d8c7f3; --sand:#efe4cf;
  --on-tint:#1d1b18; --blob:#d9d6cf; --ill:#fffdf8;
  --warn-bg:#ffe0d3; --warn-fg:#7b2711; --tip-bg:#e2eaff; --tip-fg:#1f306e; --ok-bg:#fff6d6;
  --display:"Zilla Slab","Chonburi",Georgia,serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px; --sh:4px 4px 0 var(--ink); --sh-sm:2px 2px 0 var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#121110; --app:#1c1a16; --paper:#27241f; --ink:#e8ddc8; --fg:#f3ead8; --muted:#b2a790;
  --yellow:#e2ae37; --blue:#8692e4; --pink:#df8ea7; --mint:#84c597; --peach:#e2a671; --lilac:#ab97dc; --sand:#38322a;
  --on-tint:#1c1a16; --blob:#24221e;
  --warn-bg:#4a2318; --warn-fg:#ffcdb9; --tip-bg:#1f2949; --tip-fg:#cdd8ff; --ok-bg:#3a3220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#121110; --app:#1c1a16; --paper:#27241f; --ink:#e8ddc8; --fg:#f3ead8; --muted:#b2a790;
  --yellow:#e2ae37; --blue:#8692e4; --pink:#df8ea7; --mint:#84c597; --peach:#e2a671; --lilac:#ab97dc; --sand:#38322a;
  --on-tint:#1c1a16; --blob:#24221e;
  --warn-bg:#4a2318; --warn-fg:#ffcdb9; --tip-bg:#1f2949; --tip-fg:#cdd8ff; --ok-bg:#3a3220;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--stage)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.disp{font-family:var(--display);font-weight:700;font-synthesis:none;letter-spacing:-.01em}

/* stage + frame */
.stage{position:relative;overflow:hidden;min-height:100%;padding-block:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blobs{position:absolute;inset:0;pointer-events:none}
.blobs svg{position:absolute}
.app{position:relative;max-width:1340px;margin:0 auto;background:var(--app);border:2.5px solid var(--ink);
  border-radius:26px;box-shadow:6px 7px 0 var(--ink);display:grid;grid-template-columns:232px minmax(0,1fr) 300px;min-height:720px}

/* sidebar */
.side{border-right:2.5px solid var(--ink);padding:26px 18px;display:flex;flex-direction:column;gap:22px}
.logo{font-size:30px;line-height:1}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.yrs{display:flex;flex-direction:column;gap:6px}
.yr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:14px;
  padding:8px 10px;cursor:pointer}
.yr:hover{border-color:var(--ink)}
.yr[aria-current="true"]{background:var(--sand);border-color:var(--ink);box-shadow:var(--sh-sm)}
.yr svg{flex:none;width:18px;height:18px}
.yr .yl{font-family:var(--display);font-weight:700;font-size:16px;font-synthesis:none;line-height:1.1}
.yr .ys{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.yr .yc{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.yr[disabled]{opacity:.55;cursor:default}
.yr[disabled]:hover{border-color:transparent}
.tipcard{margin-top:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px 14px 16px;position:relative}
.tipcard .badge{position:absolute;top:-14px;left:14px}
.tipcard h3{margin:6px 0 4px;font-size:17px;line-height:1.25}
.tipcard p{margin:0 0 12px;font-size:13px;color:var(--muted)}

/* buttons, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:999px;
  padding:7px 16px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.y{background:var(--yellow);color:var(--on-tint)}
.btn.wide{width:100%}
.circ{width:40px;height:40px;padding:0;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:600;color:var(--on-tint);background:var(--pink);white-space:nowrap}

/* main */
.main{padding:24px 26px 32px;min-width:0;border-right:2.5px solid var(--ink);display:flex;flex-direction:column;gap:22px}
.top{display:flex;gap:12px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 8px 0 18px;box-shadow:var(--sh-sm)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:14.5px;padding:10px 0}
.search input::placeholder{color:var(--muted)}
.search svg{width:20px;height:20px;flex:none}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:40px;height:22px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);position:relative;cursor:pointer;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle input:checked{background:var(--yellow)}
.toggle input:checked::after{left:20px;background:var(--on-tint)}
.chips{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 13px 4px 5px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--sh-sm)}
.chip .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:var(--c,var(--sand))}
.chip .dot svg{width:13px;height:13px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-tint)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font-size:34px;line-height:1.05;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:4px 12px;font-size:12.5px;font-weight:600}
.stat b{font-family:var(--mono);font-size:15px;margin-right:4px;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead h2{margin:0;font-size:21px;line-height:1.2}
.sechead .sub{font-size:13px;color:var(--muted)}
.sechead .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.secnote{margin:0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--yellow);padding-left:10px}
.yearband{display:flex;align-items:center;gap:12px;margin-top:6px}
.yearband span{font-family:var(--display);font-weight:700;font-size:26px;font-synthesis:none}
.yearband::after{content:"";flex:1;border-top:2.5px dashed var(--ink);opacity:.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,198px),1fr));gap:16px}

/* card */
.card{display:flex;flex-direction:column;text-align:left;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);
  padding:0;overflow:hidden;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;min-width:0}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--c,var(--sand));border-bottom:2.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ill{width:72%;height:auto;color:var(--on-tint)}
.thumb .badge{position:absolute;top:8px;left:8px;background:var(--paper);color:var(--fg)}
.thumb .badge.img{background:var(--pink);color:var(--on-tint)}
.thumb .nimg{position:absolute;right:8px;bottom:6px;font-size:10.5px;font-weight:600;color:var(--on-tint);opacity:.7}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctitle{font-weight:600;font-size:14px;line-height:1.35;margin:0}
.cfoot{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cfoot .ex{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cfoot b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--fg);white-space:nowrap}
.empty{border:2.5px dashed var(--ink);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--paper)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* right rail */
.rail{padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.me{display:flex;gap:12px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--yellow);display:grid;place-items:center;flex:none;color:var(--on-tint)}
.ava svg{width:28px;height:28px}
.me h3{margin:0;font-size:19px;line-height:1.15}
.me p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.rail h4{margin:0;font-size:17px}
.feat{display:block;width:100%;text-align:left;padding:0;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer}
.feat .ph{position:relative;aspect-ratio:16/11;background:var(--blue);border-bottom:2.5px solid var(--ink);overflow:hidden}
.feat .ph img{width:100%;height:100%;object-fit:cover;display:block}
.feat .ph .badge{position:absolute;top:10px;left:10px}
.feat .fb{padding:10px 12px}
.feat .fb b{display:block;font-size:14.5px;line-height:1.3}
.feat .fb span{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.trk{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;width:100%;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:var(--sh-sm)}
.trow[aria-pressed="true"]{background:var(--c)}
.trow[aria-pressed="true"] *{color:var(--on-tint)}
.trow .ic{width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--c);display:grid;place-items:center;color:var(--on-tint)}
.trow .ic svg{width:26px;height:26px}
.trow > span:last-child{display:block;min-width:0}
.trow b{font-size:13.5px;display:block;line-height:1.25}
.trow small{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{display:block;height:7px;border:1.5px solid var(--ink);border-radius:99px;background:var(--app);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-right:1.5px solid var(--ink)}

/* modal */
.ov{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--stage) 55%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--app);border:2.5px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);display:flex;flex-direction:column}
.dhead{position:sticky;top:0;z-index:2;background:var(--app);border-bottom:2.5px solid var(--ink);padding:14px 16px 12px 20px;display:flex;gap:12px;align-items:flex-start}
.dhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{margin:0;font-size:23px;line-height:1.2;text-wrap:balance}
.dhead .x{margin-left:auto}
.dbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.ctx{background:var(--ok-bg);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13.5px}
.ctx b{margin-right:4px}
.stem{font-size:16.5px;line-height:1.6;margin:0;max-width:68ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.fig{margin:0;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm)}
.fig button{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}
.fig img{display:block;width:100%;max-height:360px;object-fit:contain;margin:0 auto}
.fig figcaption{border-top:2px solid var(--ink);padding:7px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.fig figcaption .badge{flex:none}
.noimg{display:flex;gap:12px;align-items:center;border:2px dashed var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);background:var(--paper)}
.noimg .ic{width:54px;height:40px;flex:none;border:2px solid var(--ink);border-radius:9px;background:var(--c);display:grid;place-items:center;color:var(--on-tint)}
.noimg .ic svg{width:44px;height:30px}
.noimg .linkbtn{font-size:13px}
.asks h3,.ansbox h3{margin:0 0 8px;font-size:17px}
.asks ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.asks li{padding-left:2px}
.asks li + li{margin-top:8px}
.asks label{display:block;font-weight:500}
.asks textarea{display:block;width:100%;margin-top:6px;min-height:52px;resize:vertical;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--fg);font:inherit;font-size:14px;line-height:1.5;padding:8px 11px}
.asks textarea::placeholder{color:var(--muted)}
.asks textarea:focus{outline:none;box-shadow:var(--sh-sm)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts .hint{font-size:12.5px;color:var(--muted)}
.grade{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh-sm)}
.ghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-synthesis:none;font-variant-numeric:tabular-nums}
.score small{font-size:15px;color:var(--muted)}
.ghead p{margin:0;flex:1;min-width:0;font-size:14px}
.gparts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.gparts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;font-size:13.5px}
.gparts .q{display:block;color:var(--muted);font-size:12.5px}
.badge.v-correct{background:var(--mint)} .badge.v-partial{background:var(--yellow)} .badge.v-wrong{background:var(--pink)} .badge.v-blank{background:var(--paper);color:var(--fg)}
.gmodel h4{margin:0 0 4px;font-size:15px}
.gmodel ul{margin:0;padding-left:20px;font-size:13.5px}
.gnote{font-size:11.5px;color:var(--muted);margin:0}
.busy{display:flex;align-items:center;gap:12px;font-size:13.5px;flex-wrap:wrap}
.spin{width:18px;height:18px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cdone + b{margin-left:6px}
.cdone{margin-left:auto;font-family:var(--mono);font-size:11px;border:1.5px solid var(--ink);border-radius:99px;padding:0 7px;background:var(--mint);color:var(--on-tint)}
.reveal{align-self:flex-start}
.ansbox{display:flex;flex-direction:column;gap:12px}
.ans{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.ans ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.ans .none{margin:0;color:var(--muted)}
.note{border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:9px}
.note b{flex:none}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.tip{background:var(--tip-bg);color:var(--tip-fg)}
.dfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 20px 16px;border-top:2.5px solid var(--ink);flex-wrap:wrap}
.dfoot .pos{align-self:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:40;background:rgba(10,9,8,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}

/* responsive */
@media (max-width:1180px){
  .app{grid-template-columns:212px minmax(0,1fr)}
  .main{border-right:0}
  .rail{grid-column:1 / -1;border-top:2.5px solid var(--ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px 24px;align-items:start}
  .rail .me{grid-column:1 / -1}
  .trk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
}
@media (max-width:780px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--app)}
  .stage{padding-block:12px}
  .app{grid-template-columns:minmax(0,1fr);border-radius:20px;box-shadow:4px 5px 0 var(--ink)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--app);border-right:0;border-bottom:2.5px solid var(--ink);border-radius:18px 18px 0 0;padding:12px 14px 10px;gap:10px}
  .logo small{display:none}
  .yrs{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .yr{width:auto;flex:none;padding:5px 11px;gap:6px}
  .yr .ys,.yr svg{display:none}
  .yr .yl{font-size:14px;white-space:nowrap}
  .yr .yc{margin-left:2px}
  .tipcard{display:none}
  .main{padding:16px 14px 22px;gap:18px}
  .top{flex-wrap:wrap}
  .search{flex-basis:100%}
  .hero h1{font-size:27px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
  .ctitle{font-size:13px}
  .rail{display:flex;padding:18px 14px}
  .trk{display:flex}
  .ov{padding:0;place-items:end stretch}
  .dlg{border-radius:20px 20px 0 0;max-height:94%;box-shadow:none;border-bottom:0}
  .dhead h2{font-size:20px}
  .dbody{padding:14px 16px 18px}
  .dfoot{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="stage">

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const TCOL = {ekg:'pink',xray:'blue',pbs:'peach',csf:'yellow',micro:'mint',skin:'peach',thyroid:'lilac',dm:'yellow',joint:'mint',ua:'yellow',lft:'peach',abg:'blue',fluid:'mint',endo:'lilac',lab:'sand'};
const col = t => 'var(--' + (TCOL[t]||'sand') + ')';
const EX = Object.fromEntries(D.exams.map(e=>[e.id,e]));
const ITEMS = D.items.map(it=>Object.assign({}, it, {y: EX[it.ex].y}));
const BYID = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const YEARS = D.years;
const YL = Object.fromEntries(YEARS.map(y=>[y.k,y]));
const COUNTED = YEARS.filter(y=>!y.empty && y.k!=='unk').map(y=>y.k);

/* illustrations (no original picture) */
const S = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
const ILL = {
  ekg:`<svg viewBox="0 0 120 70" ${S}><path d="M4 40h18l4-5 4 5h6l4-26 5 46 4-20h10q6-10 12 0h45" /><path d="M4 62h112M4 8h112" stroke-width="1.2" opacity=".35"/></svg>`,
  xray:`<svg viewBox="0 0 120 80" ${S}><path d="M60 8v24M60 32l-10 8M60 32l10 8"/><path d="M48 18C30 18 20 40 22 64c10 6 22 4 30 0 2-16 0-34-4-46zM72 18c18 0 28 22 26 46-10 6-22 4-30 0-2-16 0-34 4-46z" fill="var(--ill)"/><path d="M28 34q8-4 18 0M26 46q10-4 22 0M92 34q-8-4-18 0M94 46q-10-4-22 0" stroke-width="1.8"/></svg>`,
  pbs:`<svg viewBox="0 0 120 80" ${S}><g fill="var(--ill)"><circle cx="24" cy="24" r="12"/><circle cx="56" cy="18" r="12"/><circle cx="92" cy="28" r="12"/><circle cx="36" cy="56" r="12"/><circle cx="96" cy="60" r="12"/></g><g stroke-width="1.6"><circle cx="24" cy="24" r="5"/><circle cx="56" cy="18" r="5"/><circle cx="92" cy="28" r="5"/><circle cx="36" cy="56" r="5"/><circle cx="96" cy="60" r="5"/></g><circle cx="66" cy="54" r="11" fill="var(--lilac)"/><path d="M60 52q6-6 12 2" stroke-width="2"/></svg>`,
  micro:`<svg viewBox="0 0 120 80" ${S}><circle cx="60" cy="40" r="34" fill="var(--ill)"/><path d="M40 30l8 3M66 22l3 8M78 44l8-2M50 52l6 6M70 58l7-3M36 44l5 6M58 38l7 2" stroke-width="4"/></svg>`,
  csf:`<svg viewBox="0 0 120 80" ${S}><path d="M46 6h28M50 6v58a10 10 0 0020 0V6" fill="var(--ill)"/><path d="M50 36h20v28a10 10 0 01-20 0z" fill="currentColor" opacity=".25"/><path d="M84 20h18M84 32h12M84 44h16" stroke-width="2"/></svg>`,
  skin:`<svg viewBox="0 0 120 80" ${S}><path d="M30 76V40c0-14 12-24 30-24s30 10 30 24v36" fill="var(--ill)"/><circle cx="60" cy="10" r="8" fill="var(--ill)"/><g stroke-width="1.8" fill="currentColor" fill-opacity=".18"><ellipse cx="46" cy="40" rx="6" ry="4"/><ellipse cx="70" cy="34" rx="5" ry="3.5"/><ellipse cx="62" cy="52" rx="7" ry="4.5"/><ellipse cx="78" cy="56" rx="4" ry="3"/><ellipse cx="44" cy="60" rx="4.5" ry="3"/></g></svg>`,
  lab:`<svg viewBox="0 0 120 80" ${S}><rect x="30" y="8" width="60" height="66" rx="6" fill="var(--ill)"/><path d="M48 8v-2h24v2"/><path d="M40 26h24M40 40h24M40 54h24" stroke-width="2"/><path d="M76 30v-8l-4 4M76 22l4 4M76 44v8l-4-4M76 52l4-4" stroke-width="2"/></svg>`,
  crystal:`<svg viewBox="0 0 120 80" ${S}><circle cx="60" cy="40" r="34" fill="var(--ill)"/><path d="M38 28l20 10M62 20l10 26M44 52l26-6M76 30l6 22M50 62l16-8" stroke-width="2.2"/></svg>`,
  cast:`<svg viewBox="0 0 120 80" ${S}><circle cx="60" cy="40" r="34" fill="var(--ill)"/><rect x="36" y="32" width="48" height="16" rx="8" fill="currentColor" fill-opacity=".15"/><g stroke-width="1.6"><circle cx="46" cy="40" r="3"/><circle cx="56" cy="38" r="3"/><circle cx="66" cy="42" r="3"/><circle cx="75" cy="39" r="3"/></g></svg>`
};
const VIS = {ekg:'ekg',xray:'xray',pbs:'pbs',csf:'csf',micro:'micro',skin:'skin',thyroid:'lab',dm:'lab',joint:'crystal',ua:'cast',lft:'lab',abg:'lab',fluid:'csf',endo:'lab',lab:'lab'};
const ill = t => ILL[VIS[t]||'lab'];
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstImg = it => (it.img||[]).find(i=>i.k!=='ref') || null;

/* state */
let state = {view:'med35', topic:null, q:''};
let auto = false;
try { auto = localStorage.getItem('saq-auto')==='1'; } catch(e) {}
const autoEl = document.getElementById('auto'); autoEl.checked = auto;
autoEl.addEventListener('change', ()=>{ auto = autoEl.checked; try{localStorage.setItem('saq-auto', auto?'1':'0')}catch(e){} });

function fromHash(){
  const h = (location.hash||'').slice(1);
  if (h==='all' || YL[h]) state.view = h;
}

/* sidebar */
const yrsEl = document.getElementById('yrs');
function countFor(k){ return k==='all' ? ITEMS.length : ITEMS.filter(i=>i.y===k).length; }
function renderYears(){
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>';
  const home = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>';
  let h = `<button class="yr" type="button" data-v="all" aria-current="${state.view==='all'}">${home}<span><span class="yl">ทุกรุ่น</span><span class="ys">เรียงจากปีล่าสุด</span></span><span class="yc">${countFor('all')}</span></button>`;
  for (const y of YEARS){
    const n = countFor(y.k);
    h += `<button class="yr" type="button" data-v="${y.k}" aria-current="${state.view===y.k}"${y.empty?' disabled':''}>${icon}<span><span class="yl">${esc(y.label)}</span><span class="ys">${esc(y.sub)}</span></span><span class="yc">${y.empty?'–':n}</span></button>`;
  }
  yrsEl.innerHTML = h;
}
yrsEl.addEventListener('click', e=>{
  const b = e.target.closest('.yr'); if(!b || b.disabled) return;
  state.view = b.dataset.v; state.q=''; qEl.value='';
  try{ history.replaceState(null,'','#'+state.view);}catch(err){ location.hash = state.view; }
  render(); document.querySelector('.main').scrollIntoView({block:'start'});
});

/* chips */
const chipsEl = document.getElementById('chips');
function pool(){
  if (state.q) return ITEMS;
  return state.view==='all' ? ITEMS : ITEMS.filter(i=>i.y===state.view);
}
function renderChips(){
  const p = pool(); const counts = {};
  p.forEach(i=>counts[i.t]=(counts[i.t]||0)+1);
  const keys = Object.keys(D.topics).filter(k=>counts[k]);
  chipsEl.innerHTML = keys.map(k=>`<button class="chip" type="button" data-t="${k}" aria-pressed="${state.topic===k}" style="--c:${col(k)}"><span class="dot">${ill(k)}</span>${esc(D.topics[k])} <span class="n">${counts[k]}</span></button>`).join('')
    + (state.topic ? ` <button class="linkbtn" type="button" data-t="">ดูทั้งหมด</button>` : '');
}
chipsEl.addEventListener('click', e=>{
  const b = e.target.closest('[data-t]'); if(!b) return;
  const t = b.dataset.t; state.topic = (t && state.topic!==t) ? t : null; render();
});

/* search */
const qEl = document.getElementById('q');
qEl.addEventListener('input', ()=>{ state.q = qEl.value.trim(); render(); });
document.getElementById('clear').addEventListener('click', ()=>{ state.q=''; qEl.value=''; state.topic=null; render(); qEl.focus(); });
const hay = it => [it.ti,it.q,it.ctx,(it.ask||[]).join(' '),(it.ans||[]).join(' '),it.tip,it.warn,D.topics[it.t],EX[it.ex].name,YL[it.y].label].join(' ').toLowerCase();

/* list */
let visible = [];
function card(it){
  const im = firstImg(it); const nAsk = (it.ask||[]).length;
  const thumb = im
    ? `<img src="img/${esc(im.f)}" alt="" loading="lazy"><span class="badge img">มีรูป</span>`
    : `<span class="ill">${ill(it.t)}</span><span class="badge">${esc(D.topics[it.t])}</span>`;
  return `<button class="card" type="button" data-id="${it.id}"><div class="thumb" style="--c:${col(it.t)}">${thumb}</div>
    <div class="cbody"><p class="ctitle">${esc(it.ti)}</p><div class="cfoot"><span class="ex">${esc(it.n)}</span><b>${nAsk} คำถาม</b></div></div></button>`;
}
function render(){
  renderYears(); renderChips();
  let items = pool();
  if (state.q){ const q = state.q.toLowerCase(); items = items.filter(i=>hay(i).includes(q)); }
  if (state.topic) items = items.filter(i=>i.t===state.topic);
  visible = items;
  const h1 = document.getElementById('h1'), lede = document.getElementById('lede'), stats = document.getElementById('stats');
  const yr = YL[state.view];
  if (state.q){ h1.textContent = 'ผลการค้นหา'; lede.textContent = `“${state.q}” ในทุกรุ่น`; }
  else if (state.view==='all'){ h1.textContent = 'SAQ ทุกรุ่น'; lede.textContent = 'เรียงจาก MED35 ลงไป แยกตามรอบสอบ กดการ์ดเพื่อทำโจทย์และให้ AI ตรวจ'; }
  else { h1.textContent = 'SAQ ' + yr.label; lede.textContent = yr.k==='unk' ? 'ชุดที่โพย MED29 ลงไว้ว่าเป็นของรุ่นพี่ แต่ไม่ได้บอกปี' : 'แยกตามรอบสอบ กดการ์ดเพื่อทำโจทย์ พิมพ์คำตอบ แล้วให้ AI ตรวจเทียบกับเฉลย'; }
  if (state.topic) lede.textContent += ' · เฉพาะหัวข้อ ' + D.topics[state.topic];
  const nImg = items.filter(i=>firstImg(i)).length;
  stats.innerHTML = `<span class="stat"><b>${items.length}</b>ข้อ</span><span class="stat"><b>${new Set(items.map(i=>i.ex)).size}</b>รอบสอบ</span><span class="stat"><b>${nImg}</b>มีรูป</span>`;

  const list = document.getElementById('list');
  if (!items.length){
    list.innerHTML = `<div class="empty"><strong>ไม่พบข้อที่ตรงกัน</strong>ลองคำอื่น หรือกดปุ่มย้อนกลับเพื่อล้างตัวกรอง</div>`; return;
  }
  const multiYear = state.q || state.view==='all';
  let html = ''; let lastY = null;
  const order = D.exams.map(e=>e.id);
  for (const exId of order){
    const its = items.filter(i=>i.ex===exId); if(!its.length) continue;
    const ex = EX[exId];
    if (multiYear && ex.y!==lastY){ html += `<div class="yearband"><span>${esc(YL[ex.y].label)}</span></div>`; lastY = ex.y; }
    html += `<section class="sec"><div class="sechead"><h2 class="disp">${esc(ex.name)}</h2><span class="sub">${esc(ex.sub||'')}</span><span class="cnt">${its.length} ข้อ</span></div>`
      + (ex.note && !state.topic && !state.q ? `<p class="secnote">${esc(ex.note)}</p>` : '')
      + `<div class="grid">${its.map(card).join('')}</div></section>`;
  }
  list.innerHTML = html;
  renderCardsDone();
}
document.getElementById('list').addEventListener('click', e=>{ const c = e.target.closest('.card'); if(c) openItem(c.dataset.id, visible); });

/* rail */
function renderRail(){
  const yrsN = COUNTED.length;
  document.getElementById('tagline').textContent = `โพย MED29–MED35 · ${ITEMS.length} ข้อ`;
  const f = BYID['m35-l1-p1']; const fi = firstImg(f);
  document.getElementById('feat').innerHTML = `<button class="feat" type="button" data-id="${f.id}"><div class="ph"><img src="img/${fi.f}" alt="CXR จากข้อ ${esc(f.n)}"><span class="badge" style="background:var(--pink)">MED35 · ลงกอง 1</span></div>
    <div class="fb"><b>${esc(f.ti)}</b><span><span>${esc(f.n)}</span><span>${(f.ask||[]).length} คำถาม</span></span></div></button>`;
  const rows = Object.keys(D.topics).map(k=>{
    const its = ITEMS.filter(i=>i.t===k); const ys = new Set(its.filter(i=>COUNTED.includes(i.y)).map(i=>i.y));
    return {k, n:its.length, ys:ys.size};
  }).filter(r=>r.n).sort((a,b)=>b.ys-a.ys || b.n-a.n);
  document.getElementById('trk').innerHTML = rows.map(r=>`<button class="trow" type="button" data-t="${r.k}" aria-pressed="${state.topic===r.k && state.view==='all'}" style="--c:${col(r.k)}"><span class="ic">${ill(r.k)}</span>
    <span><b>${esc(D.topics[r.k])}</b><small><span>ออก ${r.ys}/${yrsN} รุ่น</span><span>${r.n} ข้อ</span></small><span class="bar"><i style="width:${Math.round(r.ys/yrsN*100)}%"></i></span></span></button>`).join('');
}
document.getElementById('feat').addEventListener('click', e=>{ const b=e.target.closest('[data-id]'); if(b) openItem(b.dataset.id, ITEMS.filter(i=>i.y==='med35')); });
document.getElementById('trk').addEventListener('click', e=>{
  const b = e.target.closest('.trow'); if(!b) return;
  const t = b.dataset.t;
  if (state.view==='all' && state.topic===t){ state.topic=null; } else { state.view='all'; state.topic=t; state.q=''; qEl.value=''; }
  try{ history.replaceState(null,'','#'+state.view);}catch(err){}
  render(); renderRail(); document.querySelector('.main').scrollIntoView({block:'start', behavior:'smooth'});
});

/* modal */
const ov = document.getElementById('ov'), dlg = document.getElementById('dlg');
let cur = {list:[], i:0}; let lastFocus = null;
function openItem(id, list){
  lastFocus = lastFocus || document.activeElement;
  const l = (list && list.some(x=>x.id===id)) ? list : ITEMS;
  cur = {list:l, i:l.findIndex(x=>x.id===id)};
  draw(); ov.hidden = false; document.documentElement.style.overflow='hidden';
  dlg.scrollTop = 0; dlg.querySelector('.x').focus();
}
function closeItem(){ if (gradeCtl) gradeCtl.abort(); ov.hidden = true; document.documentElement.style.overflow=''; if(lastFocus) { try{lastFocus.focus();}catch(e){} } lastFocus=null; }
function draw(){
  if (gradeCtl) gradeCtl.abort();
  const it = cur.list[cur.i]; const ex = EX[it.ex]; const y = YL[it.y];
  const imgs = it.img||[];
  let fig = '';
  if (imgs.length){
    fig = `<div class="figs">${imgs.map(m=>`<figure class="fig"><button type="button" data-zoom="img/${esc(m.f)}" aria-label="ขยายรูป: ${esc(m.c)}"><img src="img/${esc(m.f)}" alt="${esc(m.c)}"></button>
      <figcaption><span class="badge" style="background:${m.k==='ref'?'var(--blue)':'var(--pink)'}">${m.k==='ref'?'ประกอบเฉลย':'รูปในโพย'}</span><span>${esc(m.c)}</span></figcaption></figure>`).join('')}</div>`;
  } else {
    const see = it.see && BYID[it.see];
    fig = `<div class="noimg" style="--c:${col(it.t)}"><span class="ic">${ill(it.t)}</span><span>โพยรุ่นนี้ไม่มีรูปต้นฉบับ${see?` · <button class="linkbtn" type="button" data-go="${see.id}">ดูรูปตัวอย่างแบบเดียวกันจาก ${esc(YL[see.y].label)} ${esc(see.n)}</button>`:''}</span></div>`;
  }
  const ans = (it.ans||[]).length ? `<ul>${it.ans.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>` : `<p class="none">โพยไม่ได้จดคำตอบข้อนี้</p>`;
  const notes = (it.warn?`<div class="note warn"><b>ระวัง</b><span>${esc(it.warn)}</span></div>`:'') + (it.tip?`<div class="note tip"><b>แนวตอบเพิ่ม</b><span>${esc(it.tip)} <em style="opacity:.75">(ไม่ได้มาจากโพย)</em></span></div>`:'');
  dlg.innerHTML = `<div class="dhead"><div style="min-width:0"><div class="meta"><span class="badge" style="background:var(--yellow)">${esc(y.label)}</span><span class="badge" style="background:var(--paper);color:var(--fg)">${esc(ex.name)} · ${esc(it.n)}</span><span class="badge" style="background:${col(it.t)}">${esc(D.topics[it.t])}</span></div>
      <h2 class="disp" id="dtitle">${esc(it.ti)}</h2></div><button class="btn circ x" type="button" aria-label="ปิด">✕</button></div>
    <div class="dbody">
      ${it.ctx?`<div class="ctx"><b>บริบท</b>${esc(it.ctx)}</div>`:''}
      <p class="stem">${esc(it.q)}</p>
      ${fig}
      <div class="asks"><h3 class="disp">คำถาม · ลองตอบเอง</h3><ol>${(it.ask||[]).map((a,k)=>`<li><label for="ans-${k}">${esc(a)}</label><textarea id="ans-${k}" data-k="${k}" rows="2" placeholder="พิมพ์คำตอบข้อนี้"></textarea></li>`).join('')}</ol></div>
      <div class="acts"><button class="btn y" type="button" data-grade ${aiState==='none'?'hidden':''}>ให้ AI ตรวจ</button><button class="btn reveal" type="button" ${auto?'hidden':''}>แสดงเฉลย</button><button class="btn" type="button" data-clear>ล้างคำตอบ</button><span class="hint" id="ghint">${aiState==='none'?esc(AI_OFF):''}</span></div>
      <div id="gout"></div>
      <div class="ansbox" ${auto?'':'hidden'}><h3 class="disp">เฉลยจากโพย</h3><div class="ans">${ans}</div>${notes}</div>
    </div>
    <div class="dfoot"><button class="btn" type="button" data-nav="-1" ${cur.i<=0?'disabled':''}>‹ ข้อก่อน</button><span class="pos">${cur.i+1} / ${cur.list.length}</span><button class="btn" type="button" data-nav="1" ${cur.i>=cur.list.length-1?'disabled':''}>ข้อถัดไป ›</button></div>`;
  const draft = load('saq-d-'+it.id) || [];
  dlg.querySelectorAll('.asks textarea').forEach(t=>{ t.value = draft[+t.dataset.k] || ''; });
  const prev = load('saq-g-'+it.id);
  if (prev && prev.result) showGrade(prev.result, true);
}

/* answer drafts + AI grading */
const AI_OFF = 'การตรวจด้วย AI ใช้ได้เมื่อเปิดหน้านี้ใน Claude และอนุญาตให้หน้านี้ใช้ Claude · ยังพิมพ์ตอบแล้วเทียบกับเฉลยเองได้';
let aiState = 'pending', sampleFn = null, gradeCtl = null;
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function del(k){ try{ localStorage.removeItem(k); }catch(e){} }
let clearArm = null;
function clearAnswers(btn){
  if (clearArm !== btn){
    clearArm = btn; btn.textContent = 'กดอีกครั้งเพื่อล้าง';
    setTimeout(()=>{ if (clearArm===btn){ clearArm=null; if (btn.isConnected) btn.textContent='ล้างคำตอบ'; } }, 3000);
    return;
  }
  clearArm = null;
  if (gradeCtl) gradeCtl.abort();
  const it = cur.list[cur.i];
  del('saq-d-'+it.id); del('saq-g-'+it.id);
  dlg.querySelectorAll('.asks textarea').forEach(t=>{ t.value=''; });
  const out = dlg.querySelector('#gout'); if (out) out.innerHTML = '';
  if (!auto){ const ab = dlg.querySelector('.ansbox'); if (ab) ab.hidden = true; const rv = dlg.querySelector('.reveal'); if (rv) rv.hidden = false; }
  btn.textContent = 'ล้างคำตอบ';
  const h = dlg.querySelector('#ghint'); if (h) h.textContent = 'ล้างคำตอบและผลตรวจของข้อนี้แล้ว';
  renderCardsDone();
  const t0 = dlg.querySelector('#ans-0'); if (t0) t0.focus();
}
function setAi(state){
  aiState = state;
  const b = dlg.querySelector('[data-grade]'), h = dlg.querySelector('#ghint');
  if (b) b.hidden = state==='none';
  if (h && state==='none') h.textContent = AI_OFF;
}
(function(){
  const cl = window.claude;
  if (!cl || typeof cl.use!=='function'){ aiState='none'; return; }
  cl.use('sample').then(s=>{ sampleFn = s; setAi(s ? 'ready' : 'none'); }).catch(()=>setAi('none'));
})();
dlg.addEventListener('input', e=>{
  const t = e.target.closest('.asks textarea'); if(!t) return;
  const it = cur.list[cur.i]; const all = [...dlg.querySelectorAll('.asks textarea')].map(x=>x.value);
  save('saq-d-'+it.id, all);
});
const VERD = {correct:['ถูก','v-correct'], partial:['บางส่วน','v-partial'], wrong:['ผิด','v-wrong'], blank:['ไม่ได้ตอบ','v-blank']};
function showGrade(r, old){
  const it = cur.list[cur.i]; const asks = it.ask||[];
  const out = dlg.querySelector('#gout'); if(!out) return;
  const score = Math.max(0, Math.min(10, Math.round(Number(r.score)*10)/10 || 0));
  const parts = Array.isArray(r.parts) ? r.parts : [];
  const model = Array.isArray(r.model_answer) ? r.model_answer : (r.model_answer ? [r.model_answer] : []);
  out.innerHTML = `<div class="grade"><div class="ghead"><span class="score">${score}<small> / 10</small></span><p></p></div><ul class="gparts"></ul>
    <div class="gmodel" ${model.length?'':'hidden'}><h4 class="disp">คำตอบที่ควรเขียน</h4><ul></ul></div>
    <p class="gnote">${old?'ผลตรวจครั้งก่อน · ':''}ตรวจโดย AI เทียบกับเฉลยโพยและความรู้มาตรฐาน อาจผิดได้ ใช้ประกอบการทบทวน</p></div>`;
  out.querySelector('.ghead p').textContent = String(r.summary||'');
  const ul = out.querySelector('.gparts');
  parts.forEach(p=>{
    const k = (Number(p.n)||0) - 1; const v = VERD[p.verdict] || VERD.partial;
    const li = document.createElement('li');
    li.innerHTML = `<span class="badge ${v[1]}"></span><span><span class="q"></span><span class="f"></span></span>`;
    li.querySelector('.badge').textContent = (k>=0 ? (k+1)+'. ' : '') + v[0];
    li.querySelector('.q').textContent = asks[k] || '';
    li.querySelector('.f').textContent = String(p.feedback||'');
    ul.appendChild(li);
  });
  const mu = out.querySelector('.gmodel ul');
  model.forEach(m=>{ const li=document.createElement('li'); li.textContent = String(m); mu.appendChild(li); });
}
function gradePrompt(it, answers){
  const ex = EX[it.ex], y = YL[it.y];
  const caps = (it.img||[]).filter(m=>m.k!=='ref').map(m=>m.c);
  const L = [];
  L.push('คุณเป็นอาจารย์แพทย์อายุรศาสตร์ ตรวจข้อสอบ SAQ (short answer) ของนักศึกษาแพทย์ปี 4 ข้อละ 5 นาที');
  L.push('', '## โจทย์', `ที่มา: ${y.label} · ${ex.name} · ${it.n}`);
  if (it.ctx) L.push('บริบท: ' + it.ctx);
  L.push('โจทย์: ' + it.q);
  if (caps.length) L.push('รูปในโจทย์: ' + caps.join(' / '));
  L.push('', '## คำถามย่อย'); (it.ask||[]).forEach((a,k)=>L.push(`${k+1}. ${a}`));
  L.push('', '## เฉลยจากโพยรุ่นพี่ (อาจไม่ครบ หรือผิดบางจุด)');
  if ((it.ans||[]).length) it.ans.forEach(a=>L.push('- ' + a)); else L.push('- (โพยไม่ได้จดคำตอบ)');
  if (it.warn) L.push('จุดที่โพยผิด: ' + it.warn);
  if (it.tip) L.push('แนวตอบเพิ่มเติม: ' + it.tip);
  L.push('', '## คำตอบของนักศึกษา'); answers.forEach((a,k)=>L.push(`${k+1}. ${a || '(เว้นว่าง)'}`));
  L.push('', '## วิธีตรวจ',
    '- ยึดความรู้ทางการแพทย์ที่ถูกต้องเป็นหลัก ถ้าเฉลยโพยผิดหรือไม่มี ให้ใช้แนวทางมาตรฐานปัจจุบัน',
    '- ให้คะแนนบางส่วนได้ ตอบถูกความหมายแม้ใช้คำต่างกันถือว่าถูก',
    '- ชื่อเชื้อต้องเขียนเต็ม (genus + species) และสะกดถูก ถ้าย่อหรือสะกดผิดให้ partial และบอกคำที่ถูก',
    '- โจทย์ที่ขอให้บรรยาย ให้ดูว่าครอบคลุมประเด็นสำคัญหรือไม่ บอกสิ่งที่ขาด',
    '- feedback แต่ละข้อสั้น 1–2 ประโยค ภาษาไทยปนศัพท์อังกฤษ เขียนถึงนักศึกษาโดยตรง',
    '', '## รูปแบบคำตอบ',
    'ตอบเป็น JSON อย่างเดียว ตามรูปแบบนี้:',
    '{"score": 7.5, "summary": "สรุปภาพรวม 1 ประโยค", "parts": [{"n": 1, "verdict": "correct|partial|wrong|blank", "feedback": "..."}], "model_answer": ["คำตอบที่ควรเขียนของข้อ 1", "ข้อ 2"]}',
    `score เป็นคะแนนรวม 0–10 · parts ต้องมีครบ ${(it.ask||[]).length} ข้อ เรียงตาม n · model_answer สั้นกระชับ ข้อละ 1 บรรทัด`);
  return L.join('\n');
}
async function grade(btn){
  const it = cur.list[cur.i]; const hint = dlg.querySelector('#ghint'); const out = dlg.querySelector('#gout');
  if (aiState==='pending' || !sampleFn){ hint.textContent = aiState==='none' ? AI_OFF : 'กำลังเชื่อมต่อ Claude ลองกดอีกครั้งในไม่กี่วินาที'; return; }
  const answers = [...dlg.querySelectorAll('.asks textarea')].map(t=>t.value.trim());
  if (answers.every(a=>!a)){ hint.textContent = 'พิมพ์คำตอบอย่างน้อย 1 ข้อก่อน'; return; }
  hint.textContent = '';
  if (gradeCtl) gradeCtl.abort();
  const ctl = new AbortController(); gradeCtl = ctl;
  btn.disabled = true;
  out.innerHTML = `<div class="grade busy"><span class="spin"></span><span>Claude กำลังตรวจ… ปกติใช้เวลาไม่เกิน 1 นาที</span><button class="btn" type="button" data-stop>หยุด</button></div>`;
  try {
    const r = await sampleFn.json(gradePrompt(it, answers), {signal: ctl.signal});
    if (cur.list[cur.i] !== it) return;
    if (!r || typeof r!=='object' || !('score' in r)) throw {code:'invalid_json'};
    save('saq-g-'+it.id, {answers, result:r, at:Date.now()});
    showGrade(r, false);
    const ab = dlg.querySelector('.ansbox'); if (ab) ab.hidden = false;
    const rv = dlg.querySelector('.reveal'); if (rv) rv.hidden = true;
    renderCardsDone();
  } catch(e){
    if (cur.list[cur.i] !== it) return;
    const code = e && e.code;
    out.innerHTML = '';
    if (code==='cancelled') return;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ setAi('none'); return; }
    hint.textContent = {
      rate_limited:'ตรวจถี่เกินไปหรือโควตา Claude หมด รอสักพักแล้วลองใหม่',
      session_expired:'ต้องเข้าสู่ระบบ Claude ใหม่ก่อน',
      invalid_json:'Claude ตอบกลับมาในรูปแบบที่อ่านไม่ได้ กดตรวจอีกครั้ง',
      refused:'Claude ไม่ตรวจคำตอบนี้ ลองแก้คำตอบแล้วส่งใหม่',
      prompt_too_large:'คำตอบยาวเกินไป ลองย่อให้สั้นลง'
    }[code] || 'ตรวจไม่สำเร็จ ลองกดอีกครั้ง';
  } finally {
    if (gradeCtl===ctl) gradeCtl = null;
    if (btn.isConnected) btn.disabled = false;
  }
}
function renderCardsDone(){
  document.querySelectorAll('.card').forEach(c=>{
    const g = load('saq-g-'+c.dataset.id); const foot = c.querySelector('.cfoot');
    let tag = foot.querySelector('.cdone');
    if (g && g.result){ if(!tag){ tag=document.createElement('span'); tag.className='cdone'; foot.querySelector('b').before(tag); } tag.textContent = Math.round(Number(g.result.score)*10)/10 + '/10'; }
    else if (tag) tag.remove();
  });
}
dlg.addEventListener('click', e=>{
  if (e.target.closest('.x')) return closeItem();
  const gb = e.target.closest('[data-grade]'); if (gb){ grade(gb); return; }
  if (e.target.closest('[data-stop]')){ if (gradeCtl) gradeCtl.abort(); return; }
  const cb = e.target.closest('[data-clear]'); if (cb){ clearAnswers(cb); return; }
  const r = e.target.closest('.reveal'); if (r){ r.hidden = true; dlg.querySelector('.ansbox').hidden = false; return; }
  const n = e.target.closest('[data-nav]'); if (n && !n.disabled){ cur.i += +n.dataset.nav; draw(); dlg.scrollTop=0; return; }
  const g = e.target.closest('[data-go]'); if (g){ openItem(g.dataset.go, ITEMS); return; }
  const z = e.target.closest('[data-zoom]'); if (z){ document.getElementById('lbimg').src = z.dataset.zoom; document.getElementById('lb').hidden = false; }
});
ov.addEventListener('click', e=>{ if (e.target===ov) closeItem(); });
document.getElementById('lb').addEventListener('click', ()=>{ document.getElementById('lb').hidden = true; });
document.addEventListener('keydown', e=>{
  if (!document.getElementById('lb').hidden && e.key==='Escape'){ document.getElementById('lb').hidden = true; return; }
  if (ov.hidden) return;
  if (e.key==='Escape') closeItem();
  if (/^(TEXTAREA|INPUT)$/.test((document.activeElement||{}).tagName||'')) return;
  if (e.key==='ArrowRight' && cur.i<cur.list.length-1){ cur.i++; draw(); }
  if (e.key==='ArrowLeft' && cur.i>0){ cur.i--; draw(); }
});
document.getElementById('rand').addEventListener('click', ()=>{
  const p = visible.length ? visible : ITEMS; const it = p[Math.floor(Math.random()*p.length)]; openItem(it.id, p);
});
window.addEventListener('hashchange', ()=>{ fromHash(); render(); renderRail(); });

fromHash(); render(); renderRail();
})();
</script>
