 Still disease versus infection", "src": "", "ref": ["MED34 โพย MCQ ไข้ไม่ทราบสาเหตุ", "Yamaguchi criteria; Harrison 21st ed."], "nl": ["2.1.1", "2.1.27", "2.1.50", "2.3.13-3(12)"]}, {"id": "AIR-OLD-50", "kind": "old", "stem": "A 28-year-old woman has daily evening fever for 3 weeks, an evanescent salmon-coloured rash, sore throat, arthralgia, neutrophilic leukocytosis and ferritin 8,000 ng/mL, with negative ANA, RF and blood cultures. What is the most likely diagnosis?", "choices": ["Adult-onset Still disease", "Systemic lupus erythematosus", "Infective endocarditis", "Lymphoma", "Rheumatoid arthritis"], "answer": 0, "explain": "**ไข้รายวัน + ผื่นสีปลาแซลมอนที่มาพร้อมไข้ + เจ็บคอ + เม็ดเลือดขาวสูงชนิด neutrophil + ferritin สูงมาก + ANA/RF ลบ = adult-onset Still disease** ซึ่งเป็นการวินิจฉัยแบบตัดโรคอื่นออก (ต้องตัดการติดเชื้อ โดยเฉพาะ endocarditis และวัณโรค กับมะเร็งต่อมน้ำเหลืองออกก่อน); ระวังภาวะแทรกซ้อน **macrophage activation syndrome** เมื่อเม็ดเลือดต่ำลงทุกซีรีส์และ ferritin พุ่งขึ้นอีก", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย ไข้ไม่ทราบสาเหตุ (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.1.1", "2.1.27", "2.1.50"]}, {"id": "AIR-OLD-13", "kind": "old", "stem": "A 20-year-old man presents with fever, arthralgia, a maculopapular rash over the trunk and extremities, and swelling with warmth and limited movement of both knees, ankles and elbows. Hct 40%, WBC 3,500/mm3 (N 45%, L 50%, atypical lymphocyte 5%), platelet 45,000/mm3. What is the most likely diagnosis?", "choices": ["Acute gouty arthritis", "Septic arthritis", "Chikungunya virus infection", "Systemic lupus erythematosus", "Rickettsial infection"], "answer": 2, "explain": "**ไข้ + ผื่น + ปวดข้อหลายข้อสมมาตร + เม็ดเลือดขาวต่ำ + เกล็ดเลือดต่ำ + atypical lymphocyte = ไวรัส (chikungunya หรือ dengue)** ไม่ใช่เก๊าท์ซึ่งไม่ทำให้เม็ดเลือดต่ำและมักเป็นข้อเดียวในชายที่มีปัจจัยเสี่ยง; chikungunya เด่นที่ **ปวดข้อรุนแรงหลายข้อและอาจปวดต่อเนื่องเป็นเดือน** ส่วน dengue เด่นที่ไข้สูง ปวดเมื่อย และเกล็ดเลือดต่ำมากกว่า", "pearl": "", "topic": "", "src": "MED34 โพย MCQ '20 year old man fever, arthralgia, rash ... Diag? A. Chikungunya B. Acute gout C. Rickettsia'", "ref": [], "nl": ["2.1.27", "2.1.1", "2.1.50"]}]}], "date": "TBD — แก้ใน config.lectures"}], "label": "AIR", "thai": "ภูมิแพ้ ภูมิคุ้มกัน และโรคข้อรูมาติก", "accent": {"light": "#8a5a12", "soft": "#f4ecdd", "ink": "#6d460c", "dark": "#d9ab63", "darkSoft": "#241d12", "darkInk": "#ecc98f"}}, {"set": "chest", "title": "Chest · ระบบการหายใจและทรวงอก", "intro": "เริ่มจากสองคาบของ อ.ศิวพร — วัณโรคปอด และการแปลผลก๊าซในเลือดแดง — เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับคลังข้อสอบ MED28–MED35 และข้อใหม่ของชุด Chest จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบวัณโรคแล้วไปฝึก **MEQ** และ **OSCE/SAQ** ต่อได้เลย\n\nคาบที่เหลือของชุด Chest (เยื่อหุ้มปอด/respiratory failure · CXR และโรคจากการทำงาน · pneumonia/asthma/COPD) ยังไม่ได้ทำบทเรียน แต่ข้อสอบมีอยู่ครบใน drill.html แล้ว", "lectures": [{"lec": "03", "title": "Pulmonary tuberculosis", "subtitle": "เชื้อและการติดต่อ · LTBI กับวัณโรคระยะแสดงอาการ · ภาพรังสี · การวินิจฉัยทางห้องปฏิบัติการ · สูตรยาและผลข้างเคียง · วัณโรคในภาวะพิเศษและวัณโรคดื้อยา", "objectives": ["อธิบายการติดต่อทางอากาศของวัณโรคและวางมาตรการป้องกันการแพร่เชื้อในโรงพยาบาลได้", "แยก **latent TB infection** ออกจาก **active TB disease** และรู้ว่าใครควรได้รับการตรวจและรักษา LTBI", "เลือกส่งตรวจทางห้องปฏิบัติการได้ถูกลำดับ — AFB smear · molecular test · culture/DST — และแปลผลได้", "สั่งสูตรยา 2HRZE/4HR ได้ถูกขนาดและระยะเวลา รู้ว่าอวัยวะไหนต้องรักษานานกว่าและกรณีใดต้องให้ steroid", "จับผลข้างเคียงของยาวัณโรคที่ต้องหยุดยาทันที แยกจากผลข้างเคียงที่ให้ยาต่อได้", "ปรับการรักษาในผู้ป่วยไตเสื่อม โรคตับ ตั้งครรภ์ และผู้ติดเชื้อเอชไอวี รวมถึงจังหวะเริ่มยาต้านไวรัส", "นิยามวัณโรคดื้อยาแต่ละแบบและวางแผนติดตามการรักษาได้"], "meq": [{"id": "CH-MEQ-01", "part": "MEQ", "lec": "03", "lecture": "Pulmonary tuberculosis / ABG (อ.ศิวพร)", "topic": "Active pulmonary tuberculosis — diagnosis, regimen and contact management", "vignette": "ผู้ป่วยชายไทยอายุ 46 ปี อาชีพขับรถสองแถว มาโรงพยาบาลด้วยอาการไอเรื้อรัง 6 สัปดาห์ก่อนมาโรงพยาบาล\nPI: ไอมีเสมหะสีขาวปนเหลือง 6 สัปดาห์ 2 สัปดาห์หลังมีเสมหะปนเลือดสดเล็กน้อยวันละ 2-3 ครั้ง มีไข้ต่ำๆ ตอนบ่าย เหงื่อออกกลางคืนจนต้องเปลี่ยนเสื้อ น้ำหนักลด 6 กิโลกรัมใน 2 เดือน เบื่ออาหาร ไม่มีเจ็บหน้าอก ไม่เหนื่อยขณะพัก\nU/D: DM type 2 วินิจฉัย 5 ปี, ไม่เคยตรวจ HIV\nยาเดิม: metformin (500) 1x2 pc\nประวัติอื่น: สูบบุหรี่ 20 มวน/วัน 25 ปี, ดื่มสุราสังสรรค์, อาศัยอยู่กับภรรยาและหลานอายุ 3 ขวบในบ้านไม้ห้องเดียว ไม่มีประวัติคนในบ้านเป็นวัณโรค\nPE: GA: ผอม looks chronically ill, not pale, no jaundice\nV/S: BT 37.8 C, PR 96/min, RR 22/min, BP 112/70 mmHg, SpO2 96% room air, BW 48 kg (เดิม 54 kg), Ht 168 cm\nHEENT: no cervical lymphadenopathy, oral cavity: no thrush\nLung: coarse crackles at right upper lung field, no wheezing\nHeart: normal S1 S2, no murmur; Abdomen: soft, liver and spleen not palpable; Extremities: no edema, no clubbing\nLab: Hb 10.8 g/dL, WBC 8,900 /uL (N 66%, L 26%), Plt 380,000 /uL, Cr 0.9 mg/dL, AST 32 / ALT 28 U/L, FBS 186 mg/dL, HbA1c 9.2%\nCXR: right upper lobe heterogeneous infiltration with a thick-walled cavity 2.5 cm, no pleural effusion", "questions": [{"q": "1. จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด พร้อมบอกข้อมูลสนับสนุนจากประวัติ ตรวจร่างกาย และภาพรังสี", "a": "**การวินิจฉัย: Active pulmonary tuberculosis (ผู้ป่วยเบาหวานที่ควบคุมไม่ดี)**\n\n**ข้อมูลสนับสนุนจากประวัติ (constitutional + respiratory symptoms ของ TB)**\n- **ไอเรื้อรัง ≥ 2 สัปดาห์** (6 สัปดาห์) — เกณฑ์คัดกรองหลักของประเทศไทย\n- **ไอเป็นเลือด (haemoptysis)** — จากการกัดกร่อนหลอดเลือดในผนังโพรง (Rasmussen aneurysm ในรายรุนแรง)\n- **ไข้ต่ำ ๆ ตอนบ่าย + เหงื่อออกกลางคืน + น้ำหนักลด 6 กก. + เบื่ออาหาร** = classic constitutional symptoms จาก **TNF-α / IL-1 ที่หลั่งจาก granulomatous inflammation**\n- **ปัจจัยเสี่ยง**: **เบาหวานคุมไม่ได้ (HbA1c 9.2%)** ทำให้ **neutrophil chemotaxis, phagocytosis และ Th1 response บกพร่อง** → เพิ่มความเสี่ยง TB ~3 เท่า; **สูบบุหรี่จัด** ทำลาย mucociliary clearance และ macrophage function; **อาชีพขับรถสองแถว** = สัมผัสคนหนาแน่นในที่อากาศถ่ายเทไม่ดี\n\n**ตรวจร่างกาย**: ผอมลง, ไข้ต่ำ, **crackles ที่ปอดขวาบน**\n\n**ภาพรังสี — จุดชี้ขาด**: **right upper lobe infiltration + thick-walled cavity**\n> **ทำไม TB ชอบปอดกลีบบน**: บริเวณ apical/posterior segment ของ upper lobe และ superior segment ของ lower lobe มี **ventilation/perfusion ratio สูง → PO2 สูง** ซึ่งเหมาะกับเชื้อ **obligate aerobe** อย่าง *M. tuberculosis* และมี **lymphatic drainage น้อย** ทำให้กำจัดเชื้อได้ช้า\n\n**Lab สนับสนุน**: **anaemia of chronic disease** (Hb 10.8), **thrombocytosis** (380,000) เป็น acute-phase response, WBC มักปกติ (ต่างจากปอดอักเสบแบคทีเรียทั่วไป) — **WBC ปกติในผู้ป่วยไอเป็นเลือดที่มี cavity เป็นเบาะแสสำคัญ**"}, {"q": "2. จงส่งตรวจเพื่อยืนยันการวินิจฉัย พร้อมบอกเหตุผลของแต่ละอย่าง", "a": "**การตรวจเพื่อยืนยัน (ต้องได้เชื้อหรือสารพันธุกรรมของเชื้อ)**\n\n| การตรวจ | เหตุผล / จุดเด่น |\n|---|---|\n| **Xpert MTB/RIF (Ultra) จากเสมหะ** — **ทำเป็นอันดับแรกตามแนวทาง WHO/ประเทศไทย** | รู้ผลใน **~2 ชั่วโมง**, ไวกว่า smear มาก (โดยเฉพาะ smear-negative และผู้ติดเชื้อ HIV), และ **บอก rifampicin resistance ได้ทันที** |\n| **Sputum AFB smear (Ziehl-Neelsen หรือ fluorochrome) อย่างน้อย 2 ตัวอย่าง** รวมเสมหะตอนเช้า | ถูก เร็ว และ **บอกความสามารถในการแพร่เชื้อ** (smear-positive = แพร่เชื้อสูง ต้องแยกผู้ป่วย) |\n| **Sputum culture (solid Löwenstein-Jensen หรือ liquid MGIT) + drug susceptibility test** | **มาตรฐานอ้างอิง (gold standard)** ไวที่สุด และจำเป็นสำหรับ **DST** — MGIT ~2 สัปดาห์, solid media 3-8 สัปดาห์ |\n| **HIV testing (พร้อม counselling)** | **ต้องตรวจในผู้ป่วยวัณโรคทุกราย** เพราะเปลี่ยนทั้งการรักษา (เวลาเริ่ม ART, ปฏิกิริยาระหว่าง rifampicin กับยาต้านไวรัส) และพยากรณ์โรค |\n\n**การตรวจประกอบก่อนเริ่มยา (baseline)**\n- **LFT** (INH, RIF, PZA เป็นพิษต่อตับ) — รายนี้ AST/ALT ปกติ\n- **Cr/eGFR** (ปรับขนาด EMB, PZA)\n- **Visual acuity + colour vision (Ishihara)** ก่อนให้ **ethambutol** เพราะเสี่ยง optic neuritis\n- **Uric acid** (PZA ทำให้สูงขึ้น)\n- **น้ำหนักตัว** — ใช้คำนวณขนาดยาและติดตามการตอบสนอง\n- **ควบคุมเบาหวานให้ดีขึ้น** และตรวจ HbA1c ซ้ำ (rifampicin เร่งการเผาผลาญ sulfonylurea → น้ำตาลอาจสูงขึ้น)"}, {"q": "3. จงวางแผนการรักษาด้วยยาต้านวัณโรค พร้อมบอกขนาดยาโดยประมาณและระยะเวลา", "a": "**สูตรมาตรฐานสำหรับ drug-susceptible pulmonary TB: 2HRZE / 4HR (รวม 6 เดือน)**\n\n| ระยะ | ยา | ระยะเวลา |\n|---|---|---|\n| **Intensive phase** | **Isoniazid (H) + Rifampicin (R) + Pyrazinamide (Z) + Ethambutol (E)** | **2 เดือน** |\n| **Continuation phase** | **Isoniazid + Rifampicin** | **4 เดือน** |\n\n**ขนาดยาผู้ใหญ่ (น้ำหนัก 48 กก.)** — ให้วันละครั้ง ท้องว่าง\n- **Isoniazid 5 mg/kg** (≈ 250-300 mg) — สูงสุด 300 mg\n- **Rifampicin 10 mg/kg** (≈ 450-600 mg; น้ำหนัก < 50 กก. มักให้ 450 mg)\n- **Pyrazinamide 25 mg/kg** (≈ 1,200 mg)\n- **Ethambutol 15-20 mg/kg** (≈ 800 mg)\n- **Pyridoxine (vitamin B6) 10-25 mg/วัน** — **ต้องให้ในรายนี้** เพราะ **เบาหวาน** เป็นกลุ่มเสี่ยงต่อ **INH-induced peripheral neuropathy** (INH แย่งการทำงานของ pyridoxal phosphate)\n\n**เหตุผลเชิงกลไกที่ต้องใช้ยาหลายตัวและนาน**\n- **ใช้หลายตัว**: ในโพรงมีเชื้อ ~10⁸-10⁹ ตัว ซึ่ง **มีเชื้อกลายพันธุ์ดื้อยาแต่ละตัวอยู่แล้วตามธรรมชาติ** (INH ~1 ใน 10⁶, RIF ~1 ใน 10⁸) — ให้ยาตัวเดียวจึงเท่ากับคัดเลือกเชื้อดื้อยา\n- **ใช้นาน**: เชื้อกลุ่ม **persister/dormant** แบ่งตัวช้ามาก **rifampicin และ pyrazinamide เป็นยา sterilising** ที่ฆ่ากลุ่มนี้ได้ (PZA ทำงานได้ดีใน **สภาพเป็นกรดภายใน macrophage/บริเวณอักเสบ** จึงใช้แค่ 2 เดือนแรกที่การอักเสบยังมาก)\n\n**ผลข้างเคียงที่ต้องเตือนผู้ป่วย**\n- **Rifampicin**: **ปัสสาวะ/น้ำตา/เหงื่อสีส้มแดง** (บอกล่วงหน้าเพื่อไม่ให้หยุดยาเอง), เป็น **enzyme inducer แรง** → ลดระดับยาคุมกำเนิด, warfarin, ยาต้านไวรัส, sulfonylurea\n- **INH**: ตับอักเสบ, peripheral neuropathy, drug-induced lupus\n- **PZA**: ตับอักเสบ, **hyperuricaemia/ปวดข้อ**\n- **EMB**: **optic neuritis (สูญเสียการมองเห็นสีแดง-เขียว)** — ให้หยุดยาและพบแพทย์ทันทีถ้าตามัว"}, {"q": "4. ควรแยกผู้ป่วยอย่างไร และจะจัดการผู้สัมผัสในบ้านอย่างไร (ภรรยา และหลานอายุ 3 ขวบ)", "a": "**การแยกผู้ป่วย (airborne precautions)**\n- **กลไกการแพร่**: **droplet nuclei ขนาด 1-5 ไมครอน** ลอยในอากาศได้นานเป็นชั่วโมง เข้าถึงถุงลมโดยตรง → **ไม่ใช่ droplet ธรรมดา จึงใช้ surgical mask ป้องกันผู้สัมผัสไม่ได้**\n- **ลำดับความสำคัญของมาตรการ (hierarchy of controls)**\n 1. **Administrative**: คัดแยกผู้ป่วยไอเรื้อรังตั้งแต่จุดคัดกรอง, เริ่มยาเร็ว (**การรักษาที่ได้ผลคือมาตรการควบคุมการแพร่ที่ดีที่สุด**)\n 2. **Environmental**: **ห้องแยกความดันลบ ≥ 6-12 air changes/hour**, ถ้าไม่มีให้ใช้ห้องแยกที่ **เปิดหน้าต่าง อากาศถ่ายเทดี** และแสงแดดส่องถึง (UV ฆ่าเชื้อ)\n 3. **Personal**: **ผู้ป่วยใส่ surgical mask** (กันละอองที่ออกจากตัว), **บุคลากรใส่ N95** (กันการสูดละอองเข้า) — จำสลับกันไม่ได้\n- **ระยะเวลา**: จนกว่าจะ (1) **ได้ยาต้านวัณโรคที่เหมาะสม ≥ 2 สัปดาห์** (2) **อาการทางคลินิกดีขึ้น** และ (3) **AFB smear เป็นลบ 3 ครั้งติดต่อกัน** (เกณฑ์เข้มในกรณี MDR หรือมีผู้สัมผัสภูมิคุ้มกันต่ำ)\n\n**การจัดการผู้สัมผัสในบ้าน (contact investigation)**\n**ทุกคนที่อยู่ร่วมบ้าน ต้องได้รับการคัดกรองอาการ + CXR**\n\n| ผู้สัมผัส | แนวทาง |\n|---|---|\n| **ภรรยา (ผู้ใหญ่)** | ซักอาการ + **CXR**; ถ้าไม่มีอาการและ CXR ปกติ → ตรวจ **TST หรือ IGRA**; ถ้าบวก = **LTBI** → พิจารณารักษา (3HP, 4R, 3HR หรือ 6H) **หลังจากตัด active disease แล้วเท่านั้น**; ควรตรวจ HIV และเบาหวานด้วย |\n| **หลานอายุ 3 ขวบ** | **กลุ่มเสี่ยงสูงที่สุด** — เด็ก < 5 ปี มีโอกาสลุกลามเป็น **miliary TB และ TB meningitis** สูงมากหลังติดเชื้อ<br>• ประเมินอาการ + **CXR** + TST/IGRA<br>• **ถ้าไม่มี active TB → ต้องให้ยาป้องกัน (TB preventive therapy) ทันที แม้ TST จะยังลบ** เพราะภูมิยังไม่ตอบสนอง (anergy/ยังไม่ถึงเวลา) แล้วตรวจ TST ซ้ำที่ 8-12 สัปดาห์<br>• สูตรที่ใช้: **isoniazid 10 mg/kg/วัน 6-9 เดือน** หรือ **3HR/3HP ตามอายุและความพร้อม** พร้อม **pyridoxine** |\n\n**อื่น ๆ**: แจ้งเป็นโรคที่ต้องรายงาน, ขึ้นทะเบียนในระบบ **DOTS (directly observed therapy)** เพื่อให้กินยาครบ — การกินยาไม่ครบคือสาเหตุหลักของ **MDR-TB**"}, {"q": "5. จะติดตามการรักษาอย่างไร และถ้า sputum AFB ยังเป็นบวกเมื่อครบ intensive phase 2 เดือน จะทำอย่างไร", "a": "**การติดตามระหว่างการรักษา**\n\n| สิ่งที่ติดตาม | ความถี่ | เหตุผล |\n|---|---|---|\n| **Sputum AFB smear (± culture)** | **สิ้นเดือนที่ 2, 5 และ 6** | เป็นตัวชี้วัดหลักของการตอบสนอง และนิยาม treatment failure |\n| **น้ำหนักตัว** | ทุกครั้งที่มาตรวจ | เพิ่มขึ้น = ตอบสนองดี และใช้ปรับขนาดยา |\n| **อาการทางคลินิก** | ทุกครั้ง | ไข้ลด ไอลด เหงื่อกลางคืนหาย ภายใน 2-4 สัปดาห์ |\n| **LFT** | เมื่อมีอาการ (เบื่ออาหาร คลื่นไส้ ตัวเหลือง ปวดชายโครงขวา) หรือเป็นระยะในกลุ่มเสี่ยง | **Drug-induced hepatitis**: หยุดยาเมื่อ **ALT > 3 เท่าของค่าปกติร่วมกับมีอาการ** หรือ **> 5 เท่าแม้ไม่มีอาการ** |\n| **การมองเห็นและการแยกสี** | ทุกเดือนขณะได้ EMB | Optic neuritis |\n| **น้ำตาลในเลือด** | สม่ำเสมอ | **rifampicin เหนี่ยวนำ CYP → ลดระดับ sulfonylurea**; และเบาหวานที่คุมไม่ได้ทำให้ TB ตอบสนองช้า |\n| **CXR** | เมื่อสิ้นสุดการรักษา (ไม่ใช้ตัดสินระหว่างทาง) | รอยโรคทางรังสีหายช้ากว่าอาการเสมอ **ห้ามใช้ CXR เพียงอย่างเดียวตัดสินว่าล้มเหลว** |\n\n**ถ้า sputum AFB ยังบวกเมื่อครบ 2 เดือน**\n\n**ขั้นตอนที่ถูกต้อง**\n1. **ทบทวนความสม่ำเสมอในการกินยา (adherence)** — สาเหตุอันดับหนึ่ง; ตรวจสอบผ่านระบบ DOTS, ถามตรง ๆ อย่างไม่ตัดสิน, ดูสีปัสสาวะส้มจาก rifampicin\n2. **ส่ง sputum culture + drug susceptibility test และ Xpert MTB/RIF ซ้ำ** เพื่อดู **drug resistance** — นี่คือสิ่งที่ต้องทำเสมอ\n3. **ทบทวนขนาดยาเทียบกับน้ำหนัก** (ได้ยาน้อยเกินไปหรือไม่) และภาวะที่ทำให้ดูดซึมยาไม่ดี (เบาหวาน, ท้องเสียเรื้อรัง, กินยาพร้อมอาหาร)\n4. **ตรวจ HIV ซ้ำ/ประเมินภูมิคุ้มกัน** และควบคุมเบาหวานให้ดี\n5. **ถ้าเชื้อยังไวต่อยา (DST ปกติ)** → **ยืดระยะ intensive phase ออกไปอีก 1 เดือน** และตรวจเสมหะซ้ำ (ผู้ป่วยที่มีโพรงขนาดใหญ่และเชื้อมากมักเปลี่ยนเป็นลบช้า) พร้อมย้ำ DOTS\n\n**กฎเหล็กที่ออกสอบเสมอ**\n> **ห้ามเติมยาตัวเดียวเข้าไปในสูตรที่กำลังล้มเหลวเด็ดขาด (never add a single drug to a failing regimen)** เพราะเท่ากับให้ยาเดี่ยวต่อเชื้อที่ดื้อสูตรเดิม → สร้าง **MDR/XDR-TB**\n> ถ้าสงสัย MDR ต้องเปลี่ยนเป็น **สูตรใหม่ที่มียาที่คาดว่ายังได้ผลอย่างน้อย 4-5 ตัวพร้อมกัน** และส่งต่อผู้เชี่ยวชาญ\n\n**หมายเหตุสำคัญ**: **smear บวกอาจเป็นเชื้อที่ตายแล้ว** (ย้อมติดกรดได้แม้ตาย) — ดังนั้น **culture** จึงเป็นตัวตัดสินจริงว่าล้มเหลวหรือไม่ นิยาม **treatment failure = culture ยังบวกที่เดือนที่ 5 ขึ้นไป**"}], "ref": ["MED35 สอบลงกองครั้งที่ 1 — MEQ pulmonary TB", "MED33 MEQ วัณโรคปอด", "MED31 past paper loop C&D — TB"], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.1.33", "3.1.9"], "_kind": "meq", "_set": "chest"}], "osce": [{"id": "CH-OSCE-05", "part": "OSCE/SAQ", "lec": "03", "lecture": "Pulmonary tuberculosis / ABG (อ.ศิวพร)", "topic": "SAQ – Sputum smear interpretation: Gram stain and acid-fast bacilli", "station": "SAQ (เขียนตอบ) 5 นาที — สถานีกล้องจุลทรรศน์/ภาพสไลด์", "instruction": "สถานีนี้มีภาพสไลด์เสมหะของผู้ป่วย 2 ราย\n\n**ผู้ป่วยรายที่ 1**: ชายไทยอายุ 65 ปี ไข้สูงหนาวสั่น 2 วัน ไอมีเสมหะสีสนิม เจ็บหน้าอกขวาเวลาหายใจ CXR: right lower lobe consolidation with air bronchogram\nภาพย้อมสีแกรมจากเสมหะ (กำลังขยาย 1000 เท่า): พบ **epithelial cell < 10 เซลล์/LPF, neutrophil > 25 เซลล์/LPF** และพบ **gram-positive cocci รูปร่างคล้ายหัวหอกเรียงตัวเป็นคู่ (lancet-shaped diplococci)** จำนวนมากอยู่ภายในและรอบ neutrophil\n\n**ผู้ป่วยรายที่ 2**: หญิงไทยอายุ 38 ปี ไอเรื้อรัง 2 เดือน มีเสมหะปนเลือด น้ำหนักลด เหงื่อออกกลางคืน CXR: left upper lobe infiltration with cavity\nภาพย้อมสี Ziehl-Neelsen จากเสมหะ (กำลังขยาย 1000 เท่า): พบ **แท่งสีแดงเรียวโค้งเล็กน้อย บางตัวเรียงตัวคล้ายเส้นเชือก (cording)** บนพื้นสีน้ำเงิน นับได้ประมาณ **5 ตัวต่อ 1 oil field**\n\nจงตอบคำถามต่อไปนี้\n5.1 จงบอกว่าเสมหะของผู้ป่วยรายที่ 1 มีคุณภาพเพียงพอต่อการแปลผลหรือไม่ พร้อมเหตุผล (2 คะแนน)\n5.2 เชื้อก่อโรคของผู้ป่วยรายที่ 1 คืออะไร และจะให้ยาอะไร (3 คะแนน)\n5.3 จงรายงานผลสไลด์ของผู้ป่วยรายที่ 2 ตามระบบการรายงานมาตรฐาน และให้การวินิจฉัย (3 คะแนน)\n5.4 ข้อจำกัดของการย้อมสีทนกรดคืออะไร (2 คะแนน)", "answer": "**5.1 คุณภาพของเสมหะผู้ป่วยรายที่ 1**\n\n**เพียงพอต่อการแปลผล (adequate specimen)**\n\n**เกณฑ์คุณภาพเสมหะ (Bartlett / Murray-Washington criteria) ประเมินที่กำลังขยายต่ำ (LPF, ×100)**\n- **Squamous epithelial cell < 10 เซลล์/LPF** ✔ (รายนี้ < 10)\n- **Polymorphonuclear neutrophil > 25 เซลล์/LPF** ✔ (รายนี้ > 25)\n\n**เหตุผลเชิงกลไก**: **squamous epithelial cell มาจากช่องปากและคอหอย** ไม่ได้มาจากทางเดินหายใจส่วนล่าง การพบมากแปลว่าตัวอย่างเป็น **น้ำลายที่ปนเปื้อนเชื้อประจำถิ่นในช่องปาก** ซึ่งจะทำให้แปลผลผิดพลาดและเพาะขึ้นเชื้อที่ไม่ใช่สาเหตุของโรค ส่วน **neutrophil จำนวนมากบ่งชี้ว่ามีการอักเสบจากทางเดินหายใจส่วนล่างจริง**\n\n> **หมายเหตุสำคัญ**: เกณฑ์นี้ใช้กับ **การย้อมแกรมและการเพาะเชื้อแบคทีเรียทั่วไป** เท่านั้น — **ไม่ใช้กับตัวอย่างสำหรับตรวจวัณโรค, Legionella, เชื้อรา หรือไวรัส** ซึ่งตัวอย่างที่มีเซลล์เยื่อบุปนก็ยังส่งตรวจได้\n\n**5.2 เชื้อก่อโรคและการรักษาของผู้ป่วยรายที่ 1**\n\n**เชื้อ: *Streptococcus pneumoniae* (pneumococcus)**\n\n**หลักฐานที่ประกอบกัน**\n- **Gram-positive, lancet-shaped diplococci** — รูปร่างจำเพาะมาก (อาจเห็นเป็นวงใสรอบตัวเชื้อจาก **polysaccharide capsule**)\n- **เสมหะสีสนิม (rusty sputum)** — เกิดจาก **เม็ดเลือดแดงที่รั่วเข้าถุงลมแล้วถูกย่อยสลาย** ในระยะ red hepatisation\n- **ไข้สูงหนาวสั่นเฉียบพลัน + lobar consolidation ที่มี air bronchogram** — รูปแบบคลาสสิกของ lobar pneumonia\n\n**การรักษา**\n| สถานการณ์ | ยาที่เลือก |\n|---|---|\n| **ผู้ป่วยนอกที่แข็งแรงดี** | **Amoxicillin ขนาดสูง 1 g วันละ 3 ครั้ง** |\n| **ผู้ป่วยในที่ไม่รุนแรง (ward)** | **Ceftriaxone 1-2 g IV วันละครั้ง ร่วมกับ azithromycin** หรือ **respiratory fluoroquinolone เดี่ยว (levofloxacin 750 mg)** |\n| **Severe CAP (ICU)** | **Beta-lactam + macrolide เสมอ (การรักษาแบบผสม)** |\n| **แพ้ penicillin รุนแรง** | **Respiratory fluoroquinolone** |\n\n**กลไกและประเด็นที่ต้องรู้**: pneumococcus ดื้อ penicillin ผ่าน **การเปลี่ยนแปลงของ penicillin-binding protein (ไม่ใช่ beta-lactamase)** → **การเติม clavulanate จึงไม่ช่วยแก้การดื้อ** แต่การใช้ **ขนาดยาที่สูงขึ้น** เอาชนะได้ในเชื้อที่ดื้อระดับกลาง\n**ระยะเวลารักษา**: **อย่างน้อย 5 วัน และต้องไม่มีไข้ ≥ 48 ชั่วโมง พร้อมสัญญาณชีพคงที่ก่อนหยุดยา**\n**การป้องกัน**: **วัคซีนนิวโมคอคคัส** ในผู้สูงอายุและกลุ่มเสี่ยง\n\n**5.3 การรายงานผลสไลด์ของผู้ป่วยรายที่ 2 และการวินิจฉัย**\n\n**การรายงาน: \"AFB smear positive 2+ (ประมาณ 5 ตัว/oil immersion field)\"**\n\n**ระบบรายงานมาตรฐาน (WHO/IUATLD) สำหรับการย้อม Ziehl-Neelsen ที่กำลังขยาย 1000 เท่า (oil immersion field, ตรวจ 100 fields)**\n\n| จำนวนที่พบ | รายงานเป็น |\n|---|---|\n| ไม่พบใน 100 fields | **Negative** |\n| **1-9 ตัวใน 100 fields** | **รายงานจำนวนที่พบจริง (scanty)** |\n| **10-99 ตัวใน 100 fields** | **1+** |\n| **1-10 ตัวต่อ 1 field** (ตรวจอย่างน้อย 50 fields) | **2+** ← **รายนี้** |\n| **มากกว่า 10 ตัวต่อ 1 field** (ตรวจอย่างน้อย 20 fields) | **3+** |\n\n**การแปลผลและการวินิจฉัย: Active pulmonary tuberculosis (smear-positive)**\n- ลักษณะ **แท่งเรียวโค้งสีแดงบนพื้นน้ำเงิน** = **acid-fast bacilli** — ผนังเซลล์มี **mycolic acid** ปริมาณมาก ทำให้จับสี carbol fuchsin ไว้ได้แม้ล้างด้วย **acid-alcohol** (จึงเรียก \"ทนกรด\")\n- **การเรียงตัวคล้ายเส้นเชือก (serpentine cording)** สัมพันธ์กับ **cord factor (trehalose-6,6'-dimycolate)** ซึ่งเป็น **ปัจจัยก่อโรคของ *M. tuberculosis*** และช่วยแยกจาก NTM หลายชนิดได้ในระดับหนึ่ง\n- ประวัติ **ไอเรื้อรัง 2 เดือน + ไอเป็นเลือด + น้ำหนักลด + เหงื่อออกกลางคืน + โพรงที่ปอดกลีบบนซ้าย** สอดคล้องอย่างยิ่ง\n\n**ความสำคัญทางคลินิกของระดับ smear**: **ยิ่งระดับสูง ยิ่งมีเชื้อมากและแพร่เชื้อได้มาก** → ต้อง **แยกผู้ป่วยแบบ airborne precaution** (ห้องแยกความดันลบหรือห้องอากาศถ่ายเทดี, **ผู้ป่วยใส่ surgical mask / บุคลากรใส่ N95**) และ **สอบสวนผู้สัมผัสอย่างเร่งด่วน**\n\n**ขั้นตอนต่อไป**: ส่ง **Xpert MTB/RIF (Ultra)** เพื่อยืนยันว่าเป็น *M. tuberculosis* จริงและดูการดื้อ rifampicin, ส่ง **culture + DST**, **ตรวจ HIV**, ตรวจ baseline LFT/Cr/การมองเห็น แล้ว **เริ่มสูตร 2HRZE/4HR พร้อม pyridoxine** และขึ้นทะเบียน DOTS\n\n**5.4 ข้อจำกัดของการย้อมสีทนกรด**\n\n1. **ความไวต่ำ** — ต้องมีเชื้ออย่างน้อยประมาณ **5,000-10,000 ตัวต่อมิลลิลิตรของเสมหะ** จึงจะตรวจพบ ทำให้ **ตรวจพบเพียง 50-60% ของผู้ป่วยวัณโรคปอดที่เพาะเชื้อขึ้น** → **smear เป็นลบไม่ตัดโรค** โดยเฉพาะใน **ผู้ติดเชื้อ HIV, เด็ก, วัณโรคนอกปอด และรอยโรคที่ไม่มีโพรง**\n\n2. **ความจำเพาะจำกัด — แยกชนิดของเชื้อไม่ได้** การย้อมบอกได้เพียงว่าเป็น **แบคทีเรียทนกรด** ซึ่งรวมถึง **nontuberculous mycobacteria (NTM) เช่น *M. avium* complex, *M. abscessus*** และเชื้อทนกรดบางส่วนอื่น (*Nocardia* ติดสีทนกรดแบบอ่อน, *Rhodococcus*) → **ต้องยืนยันชนิดด้วย culture หรือ molecular test**\n\n3. **แยกเชื้อเป็นกับเชื้อตายไม่ได้** — เชื้อที่ตายแล้วยังคงย้อมติดสีทนกรด ทำให้ **smear อาจยังบวกระหว่างการรักษาที่ได้ผลดี** → **ห้ามใช้ smear เพียงอย่างเดียวตัดสินว่าการรักษาล้มเหลว ต้องใช้ culture**\n\n4. **ไม่บอกความไวต่อยา** — ต้องอาศัย **culture + drug susceptibility test หรือ molecular test (Xpert MTB/RIF, line probe assay)**\n\n5. **ขึ้นกับคุณภาพตัวอย่างและผู้อ่าน** — ต้องเป็น **เสมหะจริงไม่ใช่น้ำลาย**, ควรเก็บอย่างน้อย 2 ตัวอย่างรวมตัวอย่างตอนเช้า, และ **ใช้เวลาอ่านนาน** (การย้อมด้วย **fluorochrome (auramine-rhodamine)** อ่านเร็วกว่าและไวกว่า ZN ประมาณ 10% จึงเป็นวิธีที่ WHO แนะนำเมื่อมีกล้อง LED)\n\n> ด้วยข้อจำกัดเหล่านี้ **WHO จึงแนะนำให้ใช้ Xpert MTB/RIF (Ultra) เป็นการตรวจเริ่มต้นแทน smear** ในผู้ที่สงสัยวัณโรค เพราะไวกว่ามาก รู้ผลใน ~2 ชั่วโมง และบอกการดื้อ rifampicin ได้ทันที", "ref": ["MED35 สอบลงกองครั้งที่ 1 — OSCE/SAQ sputum smear", "MED32 SAQ AFB smear", "MED30 SAQ gram stain sputum"], "nl": ["3.1.9", "2.3.10(5)", "2.3.4(20)"], "_kind": "meq", "_set": "chest"}], "sections": [{"id": "chest-03-01", "title": "เชื้อ การติดต่อ และการป้องกันการแพร่เชื้อ", "minutes": 7, "summary": "ทำไมวัณโรคติดทางอากาศ และมาตรการที่ต้องทำในวันแรกที่รับผู้ป่วยไว้", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### ตัวเชื้อ\n*Mycobacterium tuberculosis* อยู่ใน **M. tuberculosis complex** เป็นแบคทีเรีย **รูปแท่ง ไม่เคลื่อนที่ ต้องการออกซิเจน (aerobe) และโตช้ามาก** ขนาดหนา 0.3 µm ยาว 1–5 µm ผนังเซลล์มีไขมัน (mycolic acid) สูง จึงย้อมติดสีทนกรด และเป็นเหตุผลที่ **เชื้อชอบบริเวณที่มีออกซิเจนสูง เช่น ปอดกลีบบน**\n\n**ความทนทานของเชื้อ (ตัวเลขจากสไลด์)**\n- ในเสมหะแห้งที่ไม่ถูกแสงแดด อยู่ได้นานถึง **6 เดือน**\n- **แสงแดดฆ่าเชื้อในเสมหะใช้เวลา 20–30 ชั่วโมง**\n- **รังสีอัลตราไวโอเลตฆ่าได้ภายใน 1–2 นาที**\n- **ความร้อน 60 °C นาน 20 นาที** ทำลายเชื้อได้\n\n### การติดต่อ — airborne ไม่ใช่ droplet\n- ผู้ป่วย **ไอ จาม หัวเราะ หรือร้องเพลง** ปล่อย **droplet nuclei ขนาด 1–5 µm** ซึ่ง **ลอยในอากาศได้ราว 30 นาที** (ละอองใหญ่ตกลงพื้นเร็วและไม่ใช่ตัวแพร่เชื้อหลัก)\n- **ต้องสัมผัสใกล้ชิดเป็นเวลานาน** จึงติด — การเดินผ่านกันไม่ค่อยทำให้ติด\n- **เซลล์เป้าหมายคือ alveolar macrophage** ผลลัพธ์ของการติดเชื้อขึ้นกับภูมิคุ้มกันของผู้รับและความรุนแรงของเชื้อ\n\n### สิ่งที่ต้องสั่งทันทีเมื่อรับผู้ป่วยสงสัยวัณโรคปอดไว้ในโรงพยาบาล\n1. **แยกผู้ป่วยในห้องความดันลบ (airborne isolation)** — ถ้าไม่มี ให้ห้องแยกที่ระบายอากาศดี\n2. **บุคลากรใส่ N95 respirator** (surgical mask ของบุคลากรไม่พอ เพราะกันอนุภาคขนาด 1–5 µm ไม่ได้) และให้ **ผู้ป่วยใส่ surgical mask** เมื่อออกจากห้องหรือมีคนเข้าเยี่ยม\n3. เปิดการระบายอากาศ/ใช้ UV germicidal irradiation ตามที่มี\n4. เก็บเสมหะส่งตรวจก่อนเริ่มยา และเริ่มยาให้เร็ว — **การรักษาที่ได้ผลคือมาตรการควบคุมการแพร่เชื้อที่ดีที่สุด**\n5. คัดกรองผู้สัมผัสร่วมบ้าน โดยเฉพาะ **เด็กอายุน้อยกว่า 5 ปี ผู้ติดเชื้อเอชไอวี และผู้ที่ได้ยากดภูมิคุ้มกัน**\n\n> **กับดักที่ออกสอบ** — การล้างมือ ถุงมือ เสื้อกาวน์ และ **การล้างจาน/แยกภาชนะ ไม่ได้ช่วยป้องกันวัณโรค** เพราะไม่ใช่โรคติดต่อทางสัมผัสหรือทางเดินอาหาร\n", "pearls": ["วัณโรคติดทาง airborne ผ่าน droplet nuclei 1–5 µm ที่ลอยอยู่ได้ราว 30 นาที", "บุคลากรต้องใส่ N95 · ผู้ป่วยใส่ surgical mask · ห้องความดันลบ", "แยกภาชนะและอุปกรณ์กินอาหารไม่ได้ช่วยอะไร"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-MCQ-08", "kind": "mcq", "stem": "Which statement best describes how Mycobacterium tuberculosis is transmitted, and what is the most effective single measure to interrupt transmission in a hospital?", "choices": ["Ingestion of contaminated food or milk; pasteurisation of dairy products", "Large respiratory droplets over 5 micrometres that fall within 1 metre; surgical masks for all visitors", "Airborne droplet nuclei 1-5 micrometres that remain suspended in air; prompt identification and effective treatment of infectious cases", "Percutaneous inoculation through needlestick injury; sharps disposal protocols", "Direct contact with contaminated surfaces; alcohol-based hand rub"], "answer": 2, "explain": "**กลไกการแพร่เชื้อ**: เมื่อผู้ป่วยไอ จาม พูด หรือร้องเพลง จะปล่อยละอองที่ระเหยน้ำออกจนเหลือ **droplet nuclei ขนาด 1-5 ไมครอน** ซึ่ง\n- **ลอยในอากาศได้นานหลายชั่วโมง** และกระจายไปตามกระแสลมทั่วห้อง\n- **เล็กพอที่จะผ่านลงไปถึง alveoli** ได้โดยตรง (ละอองใหญ่จะติดที่ทางเดินหายใจส่วนบนและถูกกำจัด)\n→ ดังนั้นวัณโรคจึงเป็น **airborne** ไม่ใช่ droplet และ **การอยู่ห่างกันเกิน 1 เมตรไม่เพียงพอ**\n\n**ลำดับชั้นของการป้องกัน (hierarchy of controls)**\n1. **Administrative control — ได้ผลมากที่สุด**: **คัดกรองและวินิจฉัยเร็ว แยกผู้ป่วยทันที และเริ่มการรักษาที่ได้ผล** เพราะ **ผู้ป่วยที่ได้ยาที่เชื้อไวจะลดการแพร่เชื้อลงอย่างมากภายใน 2 สัปดาห์** — การรักษาคือมาตรการควบคุมการติดเชื้อที่ทรงพลังที่สุด\n2. **Environmental control**: **ห้องความดันลบ 6-12 ACH**, การระบายอากาศตามธรรมชาติ (เปิดหน้าต่าง — ใช้ได้ดีในบริบทไทย), **UV germicidal irradiation**\n3. **Personal protective equipment — ชั้นสุดท้าย**: **บุคลากรใส่ N95** (ต้องทำ fit test); **ผู้ป่วยใส่ surgical mask** เมื่อออกจากห้อง (เพื่อดักละอองที่ต้นทาง — ไม่ใช้ N95 กับผู้ป่วยเพราะมี exhalation valve ในบางรุ่นและหายใจลำบาก)\n\n**ปัจจัยที่เพิ่มการแพร่**: เสมหะ **AFB smear บวก**, มี **cavity**, ไอมาก, **ยังไม่ได้รับการรักษา**, พื้นที่แออัดและระบายอากาศไม่ดี, ระยะเวลาสัมผัสนาน\n\nทำไมข้ออื่นผิด: การแพร่แบบ droplet ใหญ่คือ influenza/pertussis; contact คือ MRSA/C. difficile; **Mycobacterium bovis** ต่างหากที่ติดจากนมไม่ผ่านการฆ่าเชื้อ (ไม่ใช่ M. tuberculosis); และวัณโรคไม่ติดทางเข็มตำในทางปฏิบัติ", "pearl": "เกณฑ์ยุติการแยกผู้ป่วยวัณโรคปอดในโรงพยาบาล: **ได้ยาที่เหมาะสมอย่างน้อย 2 สัปดาห์ + อาการทางคลินิกดีขึ้น + AFB smear ลบ 3 ครั้งจากคนละวัน** (และต้องไม่สงสัย MDR-TB ซึ่งต้องรอ culture conversion)", "topic": "Mechanism of tuberculosis transmission and infection control", "src": "", "ref": ["MED35 MEQ (สอบลงกอง) ข้อ 7 – บอกวิธีแพร่กระจายของเชื้อวัณโรค → Air borne", "MED32 MCQ ข้อ 28, 32, 60 – คนไข้ TB ให้นอนห้องแบบไหน ต้องใส่ mask ไหม → negative pressure room", "MED32 MCQ ข้อ 8 – ถ้าเป็น TB ควรแยกจากคนอื่นกี่สัปดาห์", "MED34 FA MCQ (Infection ข้อ 15) – ถามการ transmission ของเชื้อ"], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-08", "kind": "old", "stem": "A patient with newly diagnosed smear-positive pulmonary tuberculosis is admitted. Which admission arrangement is most appropriate?", "choices": ["Admit to a positive-pressure isolation room with staff wearing surgical masks", "Admit to a negative-pressure isolation room and have all staff wear an N95 respirator", "Admit to a general ward with contact precautions and gowns", "Admit to a general ward and have the patient wear a surgical mask only", "No isolation is needed once anti-tuberculous drugs have been started"], "answer": 1, "explain": "วัณโรคปอดแพร่ทาง **airborne (droplet nuclei ขนาด 1-5 ไมครอน ลอยในอากาศได้นาน)** → ต้องใช้ **airborne precautions: ห้องแยกความดันลบ (negative pressure) ที่มีการระบายอากาศ 6-12 ACH และบุคลากรใส่ N95**\n\nความเข้าใจผิดที่ออกสอบ: **positive pressure ใช้ป้องกันผู้ป่วยภูมิคุ้มกันต่ำจากสิ่งแวดล้อม** ไม่ใช่ป้องกันการแพร่เชื้อออก; **ผู้ป่วยเองใส่ surgical mask** เมื่อต้องออกจากห้อง (ไม่ใช่ N95)\n\nการแยกจะยุติเมื่อ **ได้รับยาอย่างน้อย 2 สัปดาห์ + อาการดีขึ้น + AFB smear ลบ 3 ครั้งติดต่อกัน** (และต้องไม่สงสัย MDR)", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 60 – คนไข้ TB positive ต้องให้อยู่ในวอร์ดไหน → negative pressure room; MED32 MCQ ข้อ 28 และ 32 – คนไข้ TB ให้นอนห้องแบบไหน ต้องใส่ mask ไหม; MED32 MCQ ข้อ 8 – ถ้าเป็น TB ควรแยกจากคนอื่นกี่สัปดาห์", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}]}, {"id": "chest-03-02", "title": "ธรรมชาติของโรค — primary, latent และ reactivation", "minutes": 8, "summary": "ตัวเลข 5% + 5% และกลไก granuloma ที่เป็น type IV hypersensitivity", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### หลังสูดเชื้อเข้าไปเกิดอะไรขึ้น\nเชื้อถูก alveolar macrophage กลืนและถูกพาไปที่ **ต่อมน้ำเหลืองขั้วปอด** ภูมิคุ้มกันชนิดเซลล์ใช้เวลา **3–8 สัปดาห์** จึงสร้าง **granuloma** ล้อมเชื้อไว้ — ปฏิกิริยานี้คือ **type IV (delayed) hypersensitivity** ซึ่งเป็นเหตุผลที่ tuberculin skin test เพิ่งบวกหลังติดเชื้อไปแล้วหลายสัปดาห์\n\nพยาธิสภาพคือ **granulomatous inflammation ที่มี epithelioid macrophage, Langhans giant cell, lymphocyte และ caseous necrosis อยู่ตรงกลาง**\n\n### ตัวเลขที่ต้องจำ\n- ผู้ติดเชื้อ **ราว 5% เป็นวัณโรคภายใน 2 ปีแรก** และอีก **ราว 5% เป็นในภายหลัง** ที่เหลือคุมเชื้อไว้ได้เป็น **latent TB infection**\n- **วัณโรคที่ไม่ได้รักษา เสียชีวิตราว 50–65% ใน 5 ปี · ยังป่วยเรื้อรังราว 25% · หายเองราว 25%**\n\n### Primary TB disease\nเกิดเมื่อภูมิคุ้มกันคุมไม่อยู่ตั้งแต่แรก มักพบในเด็กและผู้ที่ภูมิคุ้มกันต่ำ\n- **Ghon focus** = รอยโรคปฐมภูมิ มักอยู่ **ใต้เยื่อหุ้มปอด บริเวณปอดส่วนกลางถึงล่าง** (บริเวณที่ลมเข้ามากที่สุด)\n- **Ghon complex** = Ghon focus + **ต่อมน้ำเหลืองขั้วปอดโต**\n- ภาพที่พบ: TB pneumonia · ต่อมน้ำเหลืองในช่องอกโต · **middle lobe syndrome** จากต่อมกดหลอดลม · ปอดแฟบ\n- ต่อมน้ำเหลืองที่แตกเข้าโครงสร้างข้างเคียง → **TB pericarditis · TB pleuritis · miliary TB (เมื่อแตกเข้าหลอดเลือด)**\n\n### Reactivation (post-primary/secondary) TB\nเชื้อที่หลับอยู่กลับมาแบ่งตัวเมื่อภูมิคุ้มกันตก หรือได้รับเชื้อซ้ำ\n- **ตำแหน่งคลาสสิก: apical และ posterior segment ของปอดกลีบบน หรือ superior segment ของกลีบล่าง** (บริเวณที่ออกซิเจนสูงที่สุด) และพบ **สองข้างได้บ่อย**\n- **โพรง (cavity) ผนังบาง ขอบในเรียบ และมักไม่มีระดับน้ำ–อากาศ** (ต่างจากฝีในปอดที่ผนังหนาและมี air–fluid level)\n- แพร่ไปกลีบอื่นทาง **transbronchial spread** จึงพบรอยโรคกลีบบนข้างหนึ่งกับกลีบล่างอีกข้างพร้อมกัน\n- ผลระยะยาว: **bronchiectasis (มักไม่มีอาการ) · bronchostenosis จากพังผืด · ปอดแฟบและ middle lobe syndrome**\n\n### ใครเสี่ยงต่อการกลายเป็นวัณโรคระยะแสดงอาการ (จากสไลด์)\n| กลุ่มที่มีโรคหรือภาวะเสี่ยง | กลุ่มประชากรเสี่ยง |\n|---|---|\n| **ผู้ติดเชื้อเอชไอวี** · **เบาหวาน** · ได้ยากดภูมิคุ้มกัน (มะเร็ง ปลูกถ่ายอวัยวะ SLE) | **ผู้สัมผัสผู้ป่วยวัณโรค โดยเฉพาะเด็กอายุน้อยกว่า 5 ปี** และผู้สัมผัสวัณโรคดื้อยา |\n| **COPD และผู้สูบบุหรี่** · **silicosis** · โรคไตเรื้อรัง | ผู้สูงอายุ โดยเฉพาะผู้ป่วยเรื้อรัง ติดเตียง ติดบ้าน |\n| **ผ่าตัดกระเพาะ/ตัดต่อลำไส้** · ทุพโภชนาการ | **ผู้ต้องขังและบุคลากรในเรือนจำ · บุคลากรสาธารณสุข** |\n| ติดสุราและสารเสพติด · **เคยเป็นวัณโรคมาก่อน** | แรงงานย้ายถิ่นจากประเทศที่มีความชุกสูง · ผู้อยู่ในที่แออัด · คนไร้ที่อยู่อาศัย |\n", "pearls": ["ติดเชื้อแล้ว 5% เป็นโรคใน 2 ปีแรก และอีก 5% เป็นภายหลัง", "Ghon focus อยู่ใต้เยื่อหุ้มปอดส่วนกลาง–ล่าง แต่ reactivation อยู่ยอดปอด", "โพรงวัณโรคผนังบาง ขอบในเรียบ ไม่มีระดับน้ำ-อากาศ", "granuloma ของวัณโรคคือปฏิกิริยา type IV hypersensitivity"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-10", "kind": "old", "stem": "Reactivation pulmonary tuberculosis in an immunocompetent adult most characteristically involves which part of the lung, and why?", "choices": ["Right middle lobe, because of its narrow bronchus", "Basal segments of the lower lobes, because of gravity-dependent ventilation", "Peripheral subpleural regions of both lower lobes, because of higher perfusion", "Lingula, because of poor lymphatic drainage", "Apical and posterior segments of the upper lobes, because of the higher oxygen tension there"], "answer": 4, "explain": "**M. tuberculosis เป็น obligate aerobe** → เจริญได้ดีที่สุดในบริเวณที่มี **oxygen tension สูงและ perfusion ต่ำ** ซึ่งคือ **apical/posterior segment ของ upper lobe และ superior segment ของ lower lobe**\n\nแยกจาก **primary TB** ที่มักอยู่ที่ **middle/lower zone** พร้อม hilar lymphadenopathy (Ghon complex)\n\nลักษณะบน CXR ของ reactivation: **fibronodular opacity, cavitation, volume loss ที่ปอดส่วนบน**", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 18 – TB → Apex of lung", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.3.20"]}, {"id": "CH-MCQ-05", "kind": "mcq", "stem": "A 45-year-old man with diabetes presents with 6 weeks of fever, weight loss and progressive dyspnoea. Chest radiograph shows innumerable uniform 2 mm nodules evenly distributed throughout both lungs. He is confused on examination. Which of the following is the most appropriate combination of investigations?", "choices": ["Serial chest radiographs for 4 weeks before any invasive test", "Bronchoscopy with bronchoalveolar lavage for Pneumocystis only", "High-resolution CT of the chest only", "Sputum and blood for mycobacterial culture, fundoscopy for choroidal tubercles and lumbar puncture", "Sputum culture alone and observation"], "answer": 3, "explain": "**Miliary TB = การแพร่กระจายของเชื้อทางกระแสเลือดไปทั่วร่างกาย** ชื่อมาจากลักษณะ **nodule เล็ก 1-3 มม. กระจายสม่ำเสมอทั้งสองปอดเหมือนเมล็ดข้าวฟ่าง (millet seed)**\n\n**กลุ่มเสี่ยง**: **เบาหวาน, HIV, ผู้สูงอายุ, เด็กเล็ก, ผู้ได้ยากดภูมิ/anti-TNF, ไตวาย, ทุพโภชนาการ, ตั้งครรภ์/หลังคลอด**\n\n**หลักการสืบค้น: เมื่อกระจายทางเลือด ต้องหาเชื้อจากหลายอวัยวะพร้อมกัน**\n1. **Sputum AFB/culture/molecular test** — แม้ CXR จะไม่มี cavity ก็ควรส่ง\n2. **Blood culture สำหรับ mycobacteria** — มีความไวสูงเป็นพิเศษในผู้ติดเชื้อ HIV\n3. **Fundoscopy หา choroidal tubercle** — เป็นสิ่งตรวจที่ **ทำได้ทันที ไม่รุกล้ำ และค่อนข้างจำเพาะ**\n4. **Lumbar puncture** — เพราะ **miliary TB ร่วมกับ TB meningitis ได้บ่อยมาก** และผู้ป่วยรายนี้ **สับสน** ซึ่งเป็นข้อบ่งชี้ชัดเจน (ควรถ่ายภาพสมองก่อนถ้ามี focal deficit หรือ papilloedema)\n5. อื่นๆตามอาการ: **bone marrow และ liver biopsy** (ให้ผลบวกสูงในรายที่หาไม่เจอจากที่อื่น), ปัสสาวะ, น้ำในเยื่อหุ้มต่างๆ\n\n**อย่ารอผลก่อนเริ่มรักษา**: miliary TB มี mortality สูง → **เริ่มยาต้านวัณโรคเชิงประจักษ์เมื่อภาพทางคลินิกเข้าได้** และเพิ่ม **steroid เมื่อมี meningitis หรือ pericarditis ร่วม**\n\nทำไมข้ออื่นผิด: การส่งเสมหะอย่างเดียวมีความไวต่ำใน miliary TB (มักไม่มี cavity เชื้อจึงน้อย); CT ช่วยเห็นรอยโรคแต่ไม่ให้การวินิจฉัยจุลชีววิทยา; PCP ให้ **ground-glass** ไม่ใช่ miliary nodule; การเฝ้าดู 4 สัปดาห์คือการปล่อยให้ผู้ป่วยเสียชีวิต", "pearl": "DDx ของ **miliary pattern** บน CXR: **TB, เชื้อรากระจาย (histoplasmosis, cryptococcosis), มะเร็งแพร่กระจาย (thyroid, renal cell, melanoma), silicosis, sarcoidosis และ hypersensitivity pneumonitis**", "topic": "Miliary tuberculosis", "src": "", "ref": ["MED32 MCQ ข้อ 32 – ให้อาการ extrapulmonary TB ทำยังไงดี", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 53 – ตัด ileum ไปตรวจ biopsy เจอ granulomatous inflammation → TB", "MED34 MCQ ครั้งที่ 4 ข้อ 76 – Terminal ileum thickening + lymphadenopathy → TB", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (GI ข้อ 2) – ascites low SAAG high protein → TB peritoneal"], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.1.1"]}]}, {"id": "chest-03-03", "title": "Latent TB infection และการดูแลผู้สัมผัส", "minutes": 7, "summary": "ใครควรตรวจ ใครควรรักษา และสูตรยาป้องกัน", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "**LTBI = มีเชื้ออยู่ในร่างกายโดยที่ร่างกายคุมไว้ได้** — ไม่มีอาการ **ภาพรังสีปกติ (หรือมีเพียงรอยหินปูนเก่า) เสมหะตรวจไม่พบเชื้อ และไม่แพร่เชื้อ**\n\n### หลักการที่ห้ามลืม\n> **ต้องตัดวัณโรคระยะแสดงอาการออกให้ได้ก่อนเสมอ** — ซักอาการ (ไอเกิน 2 สัปดาห์ ไข้ เหงื่อออกกลางคืน น้ำหนักลด) และ **ถ่ายภาพรังสีทรวงอก** ถ้ามีอาการหรือภาพผิดปกติต้องส่งเสมหะก่อน เพราะ **การให้ยาป้องกันตัวเดียวในผู้ที่เป็นวัณโรคจริงจะทำให้เกิดเชื้อดื้อยา**\n\n### ใครควรได้รับการตรวจ LTBI (ตรวจเมื่อพร้อมจะรักษาเท่านั้น)\n- **ผู้สัมผัสร่วมบ้านของผู้ป่วยวัณโรคปอด** โดยเฉพาะ **เด็กอายุน้อยกว่า 5 ปี**\n- **ผู้ติดเชื้อเอชไอวี**\n- ผู้ที่กำลังจะได้รับ **ยากดภูมิคุ้มกัน โดยเฉพาะ anti-TNF**, ผู้ปลูกถ่ายอวัยวะ, ผู้ฟอกไต\n- บุคลากรสาธารณสุขและกลุ่มประชากรเสี่ยงตามบริบท\n\n**เครื่องมือ** — **TST (tuberculin skin test)** หรือ **IGRA** · IGRA ไม่ถูกรบกวนจากวัคซีน BCG จึงเหมาะกับผู้ที่เคยฉีด BCG · **ทั้งสองอย่างแยก LTBI ออกจาก active TB ไม่ได้** และผลลบไม่ตัดโรคในผู้ที่ภูมิคุ้มกันต่ำ\n\n### สูตรยาป้องกัน (เลือกได้ตามบริบท)\n| สูตร | รายละเอียด | ข้อดี |\n|---|---|---|\n| **3HP** | isoniazid + rifapentine สัปดาห์ละครั้ง 12 ครั้ง | สั้น ผู้ป่วยทำสำเร็จสูง |\n| **4R** | rifampicin ทุกวัน 4 เดือน | ตับอักเสบน้อยกว่า H |\n| **3HR** | isoniazid + rifampicin ทุกวัน 3 เดือน | ใช้ในเด็กได้ดี |\n| **6H หรือ 9H** | isoniazid ทุกวัน 6–9 เดือน | ใช้ได้เมื่อมีข้อจำกัดเรื่อง rifamycin |\n\n- **ให้ pyridoxine (vitamin B6) ร่วมด้วยเมื่อใช้ isoniazid** ในผู้ที่เสี่ยงต่อปลายประสาทอักเสบ (เบาหวาน ไตวาย ติดสุรา ตั้งครรภ์ ผู้ติดเชื้อเอชไอวี ทุพโภชนาการ)\n- **ผู้สัมผัสวัณโรคดื้อยาต้องปรึกษาผู้เชี่ยวชาญ** ไม่ใช้สูตรมาตรฐาน\n- ก่อนเริ่มยาให้ประเมินตับ (โดยเฉพาะผู้สูงอายุและผู้ดื่มสุรา) และเตือนอาการตับอักเสบ\n", "pearls": ["ก่อนรักษา LTBI ต้องตัด active TB ออกให้ได้ด้วยอาการและภาพรังสี มิฉะนั้นจะสร้างเชื้อดื้อยา", "TST/IGRA แยก latent ออกจาก active ไม่ได้ และ IGRA ไม่ถูกรบกวนด้วย BCG", "สูตรสั้น 3HP หรือ 4R ให้ผลดีกว่าการกิน isoniazid ยาว ๆ เพราะผู้ป่วยกินครบมากกว่า"], "nl": ["B6.2.2(8)", "3.1.11"], "items": [{"id": "CH-MCQ-01", "kind": "mcq", "stem": "A 28-year-old healthy woman is the household contact of her father, who has just been diagnosed with smear-positive pulmonary tuberculosis. She is asymptomatic with a normal chest radiograph. An interferon-gamma release assay is positive. She is not pregnant, has normal liver function and takes no medication. Which of the following is the most appropriate management?", "choices": ["Start the standard four-drug regimen for active tuberculosis", "Treat for latent tuberculosis infection after active disease has been excluded", "Give BCG vaccination now", "Observe without treatment and repeat the chest radiograph in 1 year", "Start isoniazid only if she develops cough or fever"], "answer": 1, "explain": "**แยกแนวคิดให้ชัด: latent TB infection (LTBI) ไม่ใช่โรค แต่คือการมีเชื้อที่ร่างกายควบคุมไว้ได้**\n\n| | **LTBI** | **Active TB** |\n|---|---|---|\n| อาการ | **ไม่มี** | ไอเรื้อรัง ไข้ เหงื่อกลางคืน น้ำหนักลด |\n| CXR | **ปกติ** | ผิดปกติ (infiltrate, cavity) |\n| แพร่เชื้อ | **ไม่แพร่** | แพร่ได้ |\n| การรักษา | **ยาตัวเดียวหรือสองตัว ระยะสั้น** | **สูตร 4 ตัว 6 เดือน** |\n\n**ลำดับที่ถูกต้อง**: (1) **คัด active disease ให้แน่ใจก่อนเสมอ** ด้วยอาการ + CXR (± ส่งเสมหะถ้ามีเบาะแส) เพราะการให้ยาตัวเดียวในผู้ที่เป็น active TB จะ **สร้างเชื้อดื้อยา** (2) เมื่อแน่ใจว่าเป็น LTBI จึงรักษา\n\n**สูตร LTBI ที่ใช้ปัจจุบัน**: **3HP (isoniazid + rifapentine สัปดาห์ละครั้ง 12 ครั้ง)**, **4R (rifampicin 4 เดือน)**, **3HR (3 เดือน)** หรือ **6-9H (isoniazid 6-9 เดือน)** — สูตรที่มี rifamycin สั้นกว่าและผู้ป่วยกินครบมากกว่า\n\n**กลุ่มที่ควรคัดกรองและรักษา LTBI**: ผู้สัมผัสใกล้ชิดผู้ป่วย TB, **ผู้ติดเชื้อ HIV**, ผู้ที่จะได้รับ **anti-TNF หรือยากดภูมิ**, ผู้ป่วยฟอกไต, ผู้รับการปลูกถ่ายอวัยวะ, silicosis\n\nทำไมข้ออื่นผิด\n- **สูตร 4 ตัว**: เกินความจำเป็นและมีพิษมากกว่าใน LTBI\n- **สังเกตอาการเฉยๆ**: **ความเสี่ยงกลายเป็น active สูงสุดใน 2 ปีแรกหลังสัมผัส** การรักษา LTBI ลดความเสี่ยงได้ 60-90%\n- **BCG**: ป้องกัน **disseminated TB และ TB meningitis ในเด็กเล็ก** ไม่มีที่ใช้ในผู้ใหญ่ที่ติดเชื้อแล้ว\n- **รอจนมีอาการ**: คือปล่อยให้เป็นโรคและแพร่เชื้อ", "pearl": "**IGRA เหนือกว่า TST ในผู้ที่เคยฉีด BCG** เพราะไม่ข้ามปฏิกิริยากับ BCG และ NTM ส่วนใหญ่; ทั้งสองวิธี **แยก latent จาก active ไม่ได้** และ **ผลลบไม่ตัดโรค** โดยเฉพาะในผู้ที่ภูมิคุ้มกันต่ำ", "topic": "Latent tuberculosis infection in a household contact", "src": "", "ref": ["MED32 MCQ ข้อ 19 – คนไหนเสี่ยง MDR TB → close contact MDR TB", "MED32 MCQ ข้อ 32 – ให้อาการ extrapulmonary TB ทำยังไงดี (ไม่ต้อง admit, admit ห้องแยก, face mask)", "MED35 MEQ – ซักประวัติปฏิเสธประวัติครอบครัวเป็นวัณโรค และบอกวิธีแพร่กระจายของเชื้อวัณโรค"], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.11"]}]}, {"id": "chest-03-04", "title": "อาการและภาพรังสีทรวงอก", "minutes": 6, "summary": "อาการที่ต้องคัดกรอง และรูปแบบภาพรังสีที่ต้องแยกให้ออก", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### อาการที่ใช้คัดกรอง\n- **ทั่วกาย** — น้ำหนักลดโดยไม่ตั้งใจ เบื่ออาหาร **เหงื่อออกกลางคืน** ไข้ อ่อนเพลีย\n- **ทางปอด** — **ไอนานเกิน 2–3 สัปดาห์** ไอเป็นเลือด เจ็บหน้าอก\nผู้ป่วยที่มี **อาการอย่างใดอย่างหนึ่งร่วมกับปัจจัยเสี่ยง ต้องถ่ายภาพรังสีทรวงอกและส่งเสมหะเสมอ**\n\n### รูปแบบภาพรังสีที่ต้องแยก\n| รูปแบบ | ลักษณะ |\n|---|---|\n| **Latent TB** | ภาพรังสีปกติ หรือเห็นเพียง **หินปูนเล็ก ๆ (Ghon focus) และต่อมน้ำเหลืองที่มีหินปูน** |\n| **Primary TB** | ฝ้าที่ปอดกลีบกลาง–ล่าง + **ต่อมน้ำเหลืองขั้วปอดหรือ mediastinum โต** ± น้ำในเยื่อหุ้มปอด |\n| **Reactivation TB** | **ฝ้าและโพรงที่ apical/posterior segment ของกลีบบน หรือ superior segment ของกลีบล่าง** มักมี fibrosis และดึงรั้งโครงสร้าง |\n| **Miliary TB** | **ตุ่มเล็กกระจายทั่วปอดสองข้างขนาดราว 1 mm** (โตได้ถึง 2–3 mm ถ้าไม่รักษา) — **เมื่อรักษาแล้วจางหายเร็วและไม่ทิ้งหินปูน** |\n| **ผลตามหลัง** | bronchiectasis · **middle lobe syndrome** · พังผืดดึงรั้ง · aspergilloma ในโพรงเก่า |\n\n**Miliary TB** เกิดจากเชื้อกระจายทางกระแสเลือด — ผู้ป่วยมีไข้เรื้อรัง ผอมลง ตับม้ามโต อาจมี **choroidal tubercle ที่จอตา** (ตรวจตาช่วยวินิจฉัยได้เร็ว) และ **ต้องเจาะน้ำไขสันหลังเมื่อมีอาการทางระบบประสาท เพราะมักมีเยื่อหุ้มสมองอักเสบร่วม**\n\n> ภาพรังสีทรวงอก **ไวแต่ไม่จำเพาะ** — ผู้ป่วยเอชไอวีที่ CD4 ต่ำอาจมีภาพผิดปกติแบบไม่ตรงแบบ (ฝ้ากลีบล่าง ต่อมน้ำเหลืองโต ไม่มีโพรง) หรือ **ภาพปกติทั้งที่เสมหะพบเชื้อ** จึงต้องส่งเสมหะทุกรายที่สงสัย\n", "pearls": ["ไอเกิน 2 สัปดาห์ + น้ำหนักลด + เหงื่อออกกลางคืน = ส่ง CXR และเสมหะ", "Reactivation อยู่ยอดปอด · primary อยู่กลีบกลาง-ล่างพร้อมต่อมน้ำเหลืองโต", "Miliary TB: ตุ่ม 1 mm ทั่วปอดสองข้าง หายแล้วไม่ทิ้งหินปูน และต้องมองหาเยื่อหุ้มสมองอักเสบ", "ผู้ติดเชื้อเอชไอวีที่ CD4 ต่ำ ภาพรังสีอาจปกติทั้งที่เสมหะพบเชื้อ"], "nl": ["B6.2.2(8)", "2.1.32", "2.1.33"], "items": [{"id": "CH-OLD-11", "kind": "old", "stem": "A 34-year-old man with HIV infection who has never received antiretroviral therapy presents with 3 weeks of dry cough and progressive exertional dyspnoea. CD4 count is 125 cells/microlitre. Chest radiograph shows bilateral perihilar ground-glass opacities. Which organism is most likely responsible?", "choices": ["Cryptococcus neoformans", "Streptococcus pneumoniae", "Mycobacterium avium complex", "Pneumocystis jirovecii", "Mycobacterium tuberculosis"], "answer": 3, "explain": "**PCP (Pneumocystis jirovecii pneumonia)** เกิดเมื่อ **CD4 < 200** โดยลักษณะคลาสสิกคือ **ไอแห้ง เหนื่อยเพิ่มขึ้นช้าๆ เป็นสัปดาห์ ไข้ต่ำ** และ **ฟังปอดมักปกติ** ขณะที่ **hypoxaemia รุนแรงและแย่ลงเมื่อออกแรง (exercise desaturation)** ร่วมกับ **LDH สูง**\nCXR: **bilateral perihilar ground-glass/reticular opacity** (อาจปกติได้ในระยะแรก)\n\nรักษาด้วย **cotrimoxazole ขนาดสูง 21 วัน** และ **เพิ่ม corticosteroid เมื่อ PaO2 <70 mmHg หรือ A-a gradient >35 mmHg** เพราะการตายของเชื้อกระตุ้นการอักเสบจนออกซิเจนแย่ลง\n\nเทียบกับ **CD4 500 ที่ยังสูง → เชื้อที่พบบ่อยที่สุดยังเป็น Streptococcus pneumoniae** เหมือนคนทั่วไป", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 14 และ ลงกองครั้งที่ 2 ข้อ 81 – HIV CD4 125/low CD4, CXR ground-glass → PCP; MED32 MCQ ข้อ 4 – HIV CD4 200 เป็น pneumonia; MED34 FA MCQ ข้อ 7 / MED32 ข้อ 16 – HIV CD4 500 → Streptococcus pneumoniae", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.3.3-3(5)"]}]}, {"id": "chest-03-05", "title": "การวินิจฉัยทางห้องปฏิบัติการ", "minutes": 9, "summary": "เก็บเสมหะให้ถูก · AFB · molecular test · culture ซึ่งยังเป็น gold standard", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### การเก็บเสมหะ (ข้อสอบชอบถาม)\n- **ต้องเป็นเสมหะจากปอด ไม่ใช่น้ำลาย**\n- **เก็บ 3 ตัวอย่าง คนละวัน** และ **เสมหะตอนเช้าหลังตื่นนอนดีที่สุด** (ดีกว่าการกระตุ้นเสมหะ)\n- **เก็บก่อนเริ่มยาเสมอ**\n- ผู้ที่ไอไม่มีเสมหะ ใช้ **induced sputum, gastric washing (เด็ก) หรือส่องกล้องหลอดลมล้าง (BAL)**\n\n### ลำดับการตรวจ\n| การตรวจ | รายละเอียด | จุดเด่น / ข้อจำกัด |\n|---|---|---|\n| **AFB smear** — Ziehl–Neelsen หรือ Kinyoun | ย้อมสีทนกรด เห็นแท่งสีแดงบนพื้นน้ำเงิน | **เร็วและถูก ใช้ประเมินการแพร่เชื้อ** แต่ **ต้องมีเชื้อ ~5,000–10,000 ตัว/มล.** จึงบวก และ **แยก MTB จาก NTM ไม่ได้** |\n| **Fluorochrome (auramine O)** | เชื้อเรืองเป็นแท่งสีเหลือง อ่านที่กำลังขยายต่ำ (500x) | **อ่านเร็วกว่าและไวกว่า ZN** แต่ต้องยืนยันต่อ |\n| **Molecular / rapid DST** — **Xpert MTB/RIF**, line probe assay (HAIN), **TB-LAMP** | ตรวจ DNA ของเชื้อพร้อมบอกการดื้อ **rifampicin** ได้ในไม่กี่ชั่วโมง | **WHO แนะนำเป็นการตรวจเริ่มต้น** · ไวกว่า smear · ใช้ยืนยัน MTB และคัดกรอง MDR ได้เลย |\n| **Culture** — solid media **2–8 สัปดาห์** · liquid media **1–6 สัปดาห์** | อาหารเลี้ยงเชื้อไขมันสูง | **gold standard ของการวินิจฉัย** ไวที่สุด (พบได้ที่ ~10–100 ตัว/มล.) และ **จำเป็นสำหรับ phenotypic DST** |\n| **Urine LAM** | ตรวจแอนติเจน lipoarabinomannan ในปัสสาวะ | ใช้ในผู้ติดเชื้อ **เอชไอวีที่ CD4 < 100** และสงสัยวัณโรค |\n| **พยาธิวิทยาชิ้นเนื้อ** | granuloma + caseous necrosis | ใช้กับวัณโรคนอกปอด |\n\n> **ส่งเพาะเชื้อทุกตัวอย่างเสมอ แม้ smear เป็นลบ** และเชื้อที่แยกได้ครั้งแรกต้องส่งทดสอบความไวต่อยาแนวที่หนึ่ง (H, R, E, Z)\n\n### การจัดประเภทผู้ป่วยตามแนวทางประเทศไทย\n- **Bacteriologically confirmed TB (B+)** — ตรวจพบเชื้อจาก **smear, culture หรือการตรวจอณูชีววิทยาที่ WHO รับรอง** (Xpert MTB/RIF, LPA, TB-LAMP)\n- **Clinically diagnosed TB (B−)** — ตรวจไม่พบเชื้อหรือไม่ได้ส่งตรวจ แต่ **อาการ ภาพรังสี หรือพยาธิวิทยาเข้าได้ และแพทย์ตัดสินใจรักษา**\n\n### อัลกอริทึมการวินิจฉัยจากสไลด์\nคัดกรองอาการ → **ถ่ายภาพรังสีทรวงอก** → ถ้าผิดปกติเข้าได้กับวัณโรค → **ส่งเสมหะ AFB smear ร่วมกับ molecular test (Xpert MTB/RIF)** →\n- **MTB not detected** — แพทย์พิจารณาตามคลินิก (อาจเป็น clinically diagnosed TB)\n- **MTB detected ไม่ดื้อยา** → **DS-TB** รักษาสูตรมาตรฐาน\n- **RR/MDR** → ส่ง second-line molecular และ culture ต่อ → แยกเป็น **MDR/RR ที่ยังไวต่อ FQ** หรือ **ดื้อ FQ → phenotypic DST (Bdq, Lzd) → pre-XDR / XDR-TB**\n- **ดื้อ isoniazid (Hr)** → ส่ง second-line molecular + culture → **Hr-TB** หรือ Hr ที่ดื้อ FQ ร่วม\n", "pearls": ["เก็บเสมหะ 3 ตัวอย่าง คนละวัน ตอนเช้า ก่อนเริ่มยา", "Culture ยังเป็น gold standard และจำเป็นสำหรับ DST — solid 2–8 สัปดาห์ liquid 1–6 สัปดาห์", "AFB smear แยก MTB จาก NTM ไม่ได้ ต้องใช้ molecular หรือ culture", "Xpert MTB/RIF บอกทั้งเชื้อและการดื้อ rifampicin ได้ในไม่กี่ชั่วโมง"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-09", "kind": "old", "stem": "Which investigation is the gold standard for the diagnosis of pulmonary tuberculosis?", "choices": ["Sputum acid-fast bacilli smear", "Chest radiograph showing upper lobe cavitation", "Tuberculin skin test", "Mycobacterial culture of sputum", "Xpert MTB/RIF (molecular) assay"], "answer": 3, "explain": "**Culture เป็น gold standard** เพราะ (ก) ไวที่สุด ตรวจพบได้ที่ **10-100 เชื้อ/mL** เทียบกับ smear ที่ต้องการ **5,000-10,000 เชื้อ/mL** (ข) **ให้ผลความไวต่อยา (drug susceptibility)** (ค) ระบุสปีชีส์ได้ (แยก NTM)\nข้อเสียคือ **ช้า 2-6 สัปดาห์** (liquid media เร็วกว่า solid)\n\n**Xpert MTB/RIF** เป็นการตรวจเริ่มต้นที่แนะนำในปัจจุบันเพราะรู้ผลใน 2 ชั่วโมงและบอก rifampicin resistance ได้ แต่ **ไม่แทน culture** สำหรับการดูความไวต่อยาตัวอื่นและติดตามการรักษา\n\n**AFB smear** ราคาถูกและบอกความสามารถในการแพร่เชื้อ แต่ไวต่ำและ **แยกจาก NTM ไม่ได้**", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 73 – Gold standard TB (choice: gene expert, AFB, fluid culture)", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.9"]}]}, {"id": "chest-03-06", "title": "สูตรยาและระยะเวลาการรักษา", "minutes": 8, "summary": "2HRZE/4HR · อวัยวะไหนต้องนานกว่า · และกรณีที่ต้องให้ steroid", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### ยาแนวที่หนึ่ง\n**Isoniazid (H) · Rifampicin (R) · Pyrazinamide (Z) · Ethambutol (E)** (และ streptomycin (S) ซึ่งปัจจุบันใช้น้อยลง)\n\n**สูตรมาตรฐานของวัณโรครายใหม่ = 2HRZE / 4HR**\n- **ระยะเข้มข้น (intensive phase) 2 เดือน — HRZE** เพื่อฆ่าเชื้อที่แบ่งตัวเร็วและลดการแพร่เชื้อ\n- **ระยะต่อเนื่อง (continuation phase) 4 เดือน — HR** เพื่อกำจัดเชื้อที่แบ่งตัวช้าและกันการกลับเป็นซ้ำ\n- **ปรับสูตรเมื่อผล DST ออก** หรือเมื่อผู้ป่วยทนยาตัวใดไม่ได้\n\n### ระยะเวลาตามอวัยวะ และการให้ corticosteroid (ตารางจากสไลด์)\n\n| ตำแหน่ง | ระยะเวลา (เดือน) | Corticosteroid |\n|---|---|---|\n| ต่อมน้ำเหลือง | 6 | ไม่แนะนำ |\n| เยื่อหุ้มปอด | 6 | ไม่แนะนำ |\n| **เยื่อหุ้มหัวใจ** | 6 | **บางราย** |\n| **เยื่อหุ้มสมองและ tuberculoma** | **> 12** | **ให้ทุกราย** |\n| **กระดูกและข้อ** | **9–12** | ไม่แนะนำ |\n| ระบบทางเดินปัสสาวะ | 6 | ไม่แนะนำ |\n| Disseminated TB | แล้วแต่อวัยวะเด่น | แล้วแต่อวัยวะ |\n\n**ขนาด prednisolone ใน TB meningitis (เริ่มตั้งแต่สัปดาห์แรกของการรักษา)**\n**40–60 มก./วัน นาน 2–4 สัปดาห์ → 30 มก./วัน นาน 2 สัปดาห์ → 15 มก./วัน นาน 2 สัปดาห์ → 5 มก./วัน นาน 1–2 สัปดาห์**\n\n### TB meningitis — จุดที่ต้องจำเพิ่ม\n- น้ำไขสันหลัง: **เซลล์เด่น lymphocyte (ระยะแรกอาจเป็น neutrophil) · โปรตีนสูงมาก · น้ำตาลต่ำ** · ความดันเปิดสูง\n- **ส่ง Xpert MTB/RIF จากน้ำไขสันหลัง** ช่วยวินิจฉัยได้เร็วกว่าการเพาะเชื้อ แต่ผลลบไม่ตัดโรค\n- **ต้องเริ่มยาทันทีเมื่อสงสัย** และ **ให้ corticosteroid ทุกราย** เพราะลดอัตราตายชัดเจน\n\n### เรื่องการกินยา\n- กินยา **วันละครั้ง ตอนท้องว่างก่อนอาหาร 1 ชั่วโมง** จะดูดซึมดีที่สุด — ถ้าคลื่นไส้มากให้กินพร้อมอาหารมื้อเล็กหรือก่อนนอนแทน\n- **DOT (directly observed therapy)** — มีผู้สังเกตการกลืนยาทุกครั้ง เป็นวิธีที่ดีที่สุดในการทำให้กินยาครบ **ลดการกลับเป็นซ้ำและลดการเกิดเชื้อดื้อยา** ต้องใช้เสมอในสูตรที่ให้ยาแบบเป็นช่วง\n", "pearls": ["สูตรมาตรฐาน 2HRZE/4HR · เยื่อหุ้มสมองนานกว่า 12 เดือนและให้ steroid ทุกราย · กระดูกและข้อ 9–12 เดือน", "TB meningitis: CSF lymphocyte เด่น โปรตีนสูง น้ำตาลต่ำ — เริ่มยาทันทีเมื่อสงสัย", "DOT คือมาตรการที่ลดการกลับเป็นซ้ำและเชื้อดื้อยาได้จริง"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-MCQ-03", "kind": "mcq", "stem": "A 32-year-old man presents with 3 weeks of headache, low-grade fever and progressive drowsiness, followed by a left sixth cranial nerve palsy. Lumbar puncture shows opening pressure 28 cmH2O, clear but slightly xanthochromic fluid, WBC 220 cells/microlitre with 85 percent lymphocytes, protein 180 mg/dL and CSF glucose 28 mg/dL with simultaneous blood glucose 100 mg/dL. Which diagnosis is most likely, and which adjunctive treatment improves survival?", "choices": ["Carcinomatous meningitis; adjunctive intrathecal chemotherapy", "Cryptococcal meningitis; adjunctive serial lumbar punctures only", "Bacterial meningitis; adjunctive corticosteroid", "Tuberculous meningitis; adjunctive corticosteroid", "Viral meningoencephalitis; adjunctive acyclovir"], "answer": 3, "explain": "**อ่าน CSF profile ให้เป็นคือหัวใจ**\n\n| | **Bacterial** | **TB** | **Viral** | **Cryptococcal** |\n|---|---|---|---|---|\n| เซลล์ | **PMN เด่น พันๆ** | **lymphocyte เด่น 100-500** | lymphocyte, <500 | lymphocyte น้อย-ปานกลาง |\n| Protein | สูงมาก | **สูงมาก (>100)** | ปกติ-สูงเล็กน้อย | สูง |\n| Glucose | **ต่ำมาก** | **ต่ำ (<50% ของเลือด)** | **ปกติ** | ต่ำ |\n| Opening pressure | สูง | สูง | ปกติ-สูงเล็กน้อย | **สูงมาก** |\n\nเคสนี้: **lymphocyte เด่น + protein สูงมาก + glucose ต่ำ (28/100 = 28%) + ดำเนินโรคเป็นสัปดาห์ + cranial nerve palsy** = **TB meningitis**\n\n**กลไกที่อธิบายอาการ**: การอักเสบเกิดที่ **basal meninges** → (1) **หุ้ม cranial nerve** โดยเฉพาะ **CN VI (พบบ่อยที่สุด), III, VII** (2) **อุดทางเดินน้ำไขสันหลัง → hydrocephalus และความดันในกะโหลกสูง** (3) **vasculitis ของหลอดเลือดที่ฐานสมอง → infarction**\n\n**Corticosteroid (dexamethasone) ลด mortality อย่างมีนัยสำคัญ** ในผู้ป่วย TB meningitis ทุกระดับความรุนแรง โดยลดการอักเสบและภาวะแทรกซ้อนจาก vasculitis/hydrocephalus — เป็นหนึ่งในไม่กี่โรคที่ **steroid ช่วยชีวิต**\n\nการรักษาอื่น: ยาต้านวัณโรคสูตรมาตรฐานแต่ **ระยะเวลานาน 9-12 เดือน**; **ส่ง CSF AFB, culture, molecular test (Xpert MTB/RIF Ultra) และเจาะน้ำปริมาณมากจะเพิ่มความไว**; อย่าลืม **ตรวจ HIV**\n\nทำไมข้ออื่นผิด\n- **Cryptococcal**: opening pressure มักสูงกว่านี้มากและตรวจพบ **India ink / cryptococcal antigen บวก**; รักษาด้วย amphotericin B + flucytosine และ **ต้องเจาะระบายน้ำซ้ำ**\n- **Bacterial**: ดำเนินโรคเป็นชั่วโมง-วัน, **PMN เด่น**\n- **Viral**: **glucose ปกติ** และ protein ไม่สูงขนาดนี้\n- **Carcinomatous**: ต้องมีมะเร็งเดิมและ cytology บวก", "pearl": "**การเริ่ม ART ในผู้ป่วย HIV ที่มี TB meningitis ควรเลื่อนไปประมาณ 4-8 สัปดาห์** (ต่างจาก TB ที่อื่นซึ่งเริ่มใน 2 สัปดาห์เมื่อ CD4 ต่ำ) เพราะ **paradoxical IRIS ในสมองอันตรายถึงชีวิต**", "topic": "Tuberculous meningitis – CSF profile and adjunctive therapy", "src": "", "ref": ["MED33 OSCE ข้อ 3 – Meningitis (TB/Crypto จาก unsafe sex): high opening pressure, increase WBC with lymphocyte predominance, high protein, low sugar → Tuberculous meningitis", "MED31 past paper – ผู้ป่วยชายไทย 30 ปี ปวดศีรษะ 2 สัปดาห์ oral candidiasis, LP 12 cmH2O wbc 5 lymphocyte, encapsulated budding yeast → Cryptococcal meningitis", "MED32 OSCE – TB meningitis, CSF PCR for TB", "MED31 MCQ – ตอบ TB meningitis"], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.7"]}]}, {"id": "chest-03-07", "title": "ผลข้างเคียงของยาวัณโรคและการติดตามการรักษา", "minutes": 10, "summary": "อะไรต้องหยุดยาทันที อะไรให้ยาต่อได้ และตารางติดตาม 6 เดือน", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### สิ่งที่ต้องบอกผู้ป่วยให้กลับมาพบแพทย์ทันที\n**ผื่น · คลื่นไส้อาเจียน เบื่ออาหาร ปวดท้อง · ปัสสาวะสีเข้มตลอด · อ่อนเพลียมาก · ชาปลายมือปลายเท้าที่ไม่หาย**\n\n### ผลข้างเคียงรุนแรง — ต้องหยุดยาที่เป็นสาเหตุและปรึกษาผู้เชี่ยวชาญ\n| อาการ | ยาที่เป็นสาเหตุ | การจัดการ |\n|---|---|---|\n| **ผื่นทั้งแบบคันและไม่คัน** | **H, R, Z (ได้ทุกตัว)** | **หยุดยาวัณโรค** |\n| **ดีซ่าน / ตับอักเสบ** (ไม่พบสาเหตุอื่น) | **H, R, Z** | **หยุดยาวัณโรค** |\n| **สับสน** (โดยเฉพาะเมื่อมีตับอักเสบร่วม) | ยาวัณโรคเกือบทุกตัว | หยุดยาวัณโรค |\n| **การมองเห็นบกพร่อง / ตาบอดสี** | **Ethambutol** | **หยุด ethambutol** |\n| **ช็อก ผื่น purpura เกล็ดเลือดต่ำ ไตวายเฉียบพลัน** | **Rifampicin** | **หยุด rifampicin ถาวร** |\n| หูหนวก · เวียนศีรษะ (vertigo, nystagmus) · ปัสสาวะออกน้อย ไตวาย | **Streptomycin** | หยุด streptomycin |\n\n### ผลข้างเคียงไม่รุนแรง — ให้ยาต่อได้ เพียงตรวจสอบขนาดยา\n| อาการ | ยา | การจัดการ |\n|---|---|---|\n| เบื่ออาหาร คลื่นไส้ ปวดท้อง | **Z, R, H** | กินยาพร้อมอาหารปริมาณน้อยหรือก่อนนอน กลืนช้า ๆ จิบน้ำตาม |\n| **ปวดข้อ (ไม่มีข้ออักเสบรุนแรง)** | **Z > E** | **NSAIDs หรือ paracetamol** — เกิดจาก **pyrazinamide ทำให้กรดยูริกสูง** |\n| **ชา แสบ เจ็บปลายมือปลายเท้า** | **H** | **pyridoxine (B6) 50–75 มก./วัน** (ป้องกันด้วย 10–25 มก./วัน ในผู้เสี่ยง) |\n| ง่วงนอน | H | ให้ยาก่อนนอน |\n| **ปัสสาวะ น้ำตา เหงื่อ สีส้มแดง** | **R** | **ไม่ต้องทำอะไร — บอกผู้ป่วยล่วงหน้าและเตือนเรื่องคอนแทกต์เลนส์** |\n| อาการคล้ายไข้หวัดใหญ่ | R | พิจารณาหยุดยาถ้าอาการรุนแรง |\n\n### ตับอักเสบจากยาวัณโรค — แนวทางที่ใช้จริง\n- หยุดยาที่มีพิษต่อตับเมื่อ **ALT > 3 เท่าของค่าปกติร่วมกับอาการ** หรือ **ALT > 5 เท่าแม้ไม่มีอาการ** หรือ **bilirubin สูงขึ้น**\n- ระหว่างรอ ถ้าผู้ป่วยยังต้องรักษา ให้ใช้สูตรที่ไม่มีพิษต่อตับชั่วคราว (เช่น E + FQ ± aminoglycoside)\n- เมื่อเอนไซม์กลับสู่ปกติ **ค่อย ๆ เติมยาทีละตัว (rechallenge)** โดยทั่วไปเริ่ม R ก่อน ตามด้วย H และมักไม่กลับไปใช้ Z ถ้าตับอักเสบรุนแรง\n- **Rifampicin ทำให้ bilirubin สูงแบบไม่ใช่ตับอักเสบได้** (แย่งการจับกับตัวขนส่งที่ตับ) — แยกจากตับอักเสบจริงด้วย ALT ที่ยังปกติ\n\n### การติดตามระหว่างรักษา (ตารางจากสไลด์)\n| การตรวจ | ก่อนเริ่ม | ตามระยะ |\n|---|---|---|\n| อาการทางคลินิกและ **ชั่งน้ำหนัก** | ✓ | **ทุกเดือนจนครบ 6 เดือน** (ใช้ปรับขนาดยาด้วย) |\n| **AFB smear** | ✓ | **สิ้นเดือนที่ 2 · เดือนที่ 5 · เดือนที่ 6** (และเดือนที่ 3 ถ้าเดือนที่ 2 ยังบวก) |\n| การตรวจอณูชีววิทยา / เพาะเชื้อ + DST | ✓ | **เมื่อ AFB ยังบวกที่สิ้นเดือนที่ 2 หรือเดือนที่ 5** |\n| **ภาพรังสีทรวงอก** | ✓ | เดือนที่ 2 และเดือนที่ 6 |\n| **HIV test** | ✓ | — |\n| **LFT** | ✓ | เมื่อมีอาการ · เฝ้าระวังถี่ในผู้เสี่ยง (อายุ > 60 ปี ดื่มสุรา โรคตับ ไวรัสตับอักเสบเรื้อรัง เอชไอวี ทุพโภชนาการ ตั้งครรภ์) |\n| **BUN/Cr** | ✓ | ผู้ป่วยโรคไตหรือเสี่ยงไตวาย |\n| **ตรวจการมองเห็น** | ✓ | ผู้สูงอายุหรือมีความผิดปกติของสายตาเดิม |\n\n**ความหมายของผลเสมหะที่สิ้นเดือนที่ 2**\n- **ลบ** → เข้าสู่ระยะต่อเนื่อง 4HR ตามปกติ\n- **ยังบวก** → **ไม่ใช่การยืดระยะเข้มข้นโดยอัตโนมัติ** แต่ต้อง **ทบทวนการกินยา (adherence) ส่งเพาะเชื้อและตรวจความไวต่อยาซ้ำ** แล้วตรวจ AFB ซ้ำที่เดือนที่ 3\n\n### ขาดยาระหว่างการรักษา (loss to follow-up)\n- **ขาดยาในระยะเข้มข้น < 14 วัน** → ให้ยาต่อจนครบ **แต่ถ้าทำให้ระยะเข้มข้นยาวเกิน 3 เดือนนับจากเริ่มรักษา ให้เริ่มนับการรักษาใหม่**\n- **ขาดยาในระยะเข้มข้น ≥ 14 วัน** → **เริ่มการรักษาใหม่**\n- **ขาดยาในระยะต่อเนื่อง โดยได้ยาไปแล้ว ≥ 80%** → ให้ยาต่อจนครบตามความเหมาะสม\n- **ได้ยาไป < 80% และขาดยา < 3 เดือน** → ให้ยาต่อจนครบ แต่ถ้ารวมแล้วนานเกิน 9 เดือนให้เริ่มใหม่ตั้งแต่ระยะเข้มข้น\n- **ได้ยาไป < 80% และขาดยา ≥ 3 เดือน** → **เริ่มการรักษาใหม่ พร้อมส่ง AFB smear เพาะเชื้อ และตรวจอณูชีววิทยาเพื่อยืนยันว่าไม่ดื้อยา**\n", "pearls": ["ผื่น ดีซ่าน/ตับอักเสบ สับสน ตามัว ช็อก = หยุดยาทันที · คลื่นไส้ ปวดข้อ ชา ปัสสาวะสีส้ม = ให้ยาต่อได้", "Ethambutol → optic neuritis · Isoniazid → ปลายประสาทอักเสบ ป้องกันด้วย pyridoxine · Pyrazinamide → กรดยูริกสูงและปวดข้อ · Rifampicin → สารคัดหลั่งสีส้มแดง", "AFB ยังบวกสิ้นเดือนที่ 2 = ทบทวนการกินยาและส่งเพาะเชื้อ/DST ไม่ใช่ยืดระยะเข้มข้นเฉย ๆ", "ขาดยาระยะเข้มข้นตั้งแต่ 14 วันขึ้นไป = เริ่มการรักษาใหม่"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-02", "kind": "old", "stem": "A patient receiving the 2HRZE/4HR anti-tuberculous regimen develops painless blurring of vision in both eyes with impaired colour discrimination after several weeks of treatment. There is no eye redness or pain. Which of the following is the most appropriate action?", "choices": ["Stop isoniazid and refer to an ophthalmologist", "Stop rifampicin and refer to an ophthalmologist", "Continue the same regimen and refer to an ophthalmologist", "Stop ethambutol and refer to an ophthalmologist", "Stop pyrazinamide and refer to an ophthalmologist"], "answer": 3, "explain": "**Ethambutol → retrobulbar (optic) neuritis** ซึ่งเป็น dose- และ duration-dependent: ตามัวสองข้าง, **เสียการมองเห็นสีแดง-เขียวก่อน**, central scotoma, ตาไม่แดงไม่เจ็บ\n\nต้อง **หยุดทันที** เพราะถ้าหยุดเร็วมักกลับเป็นปกติ แต่ถ้าปล่อยไว้อาจเสียถาวร; ควรตรวจ **visual acuity และ colour vision เป็น baseline** ก่อนเริ่มยา และปรับขนาดตามการทำงานของไต", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D – ผู้ป่วยวัณโรครับสูตร 2HRZE/4HR แล้วตามัวสองข้าง ไม่เจ็บตา ไม่ตาแดง", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-05", "kind": "old", "stem": "Which anti-tuberculous drug causes peripheral neuropathy, and what is given to prevent it?", "choices": ["Streptomycin; prevented by magnesium", "Ethambutol; prevented by thiamine (vitamin B1)", "Isoniazid; prevented by pyridoxine (vitamin B6)", "Pyrazinamide; prevented by allopurinol", "Rifampicin; prevented by folic acid"], "answer": 2, "explain": "**Isoniazid** จับกับ **pyridoxal phosphate** และเร่งการขับ pyridoxine ทางปัสสาวะ → **pyridoxine deficiency → peripheral neuropathy** (ชาปลายมือปลายเท้าแบบ stocking-glove)\n\nกลุ่มเสี่ยงที่ต้องให้ **pyridoxine 10-25 mg/day ป้องกัน**: เบาหวาน, ไตวาย, ติดสุรา, ทุพโภชนาการ, ตั้งครรภ์และให้นมบุตร, HIV, ผู้สูงอายุ\n\nINH ยังทำให้เกิด **hepatitis** (อายุมากเสี่ยงขึ้น), drug-induced lupus และ **INH overdose → ชักที่ดื้อต่อยากันชัก ต้องแก้ด้วย pyridoxine ขนาดสูง**", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 5 และ 41 – ยา TB ที่ทำให้ peripheral neuropathy → Isoniazid", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-03", "kind": "old", "stem": "Which anti-tuberculous drug most characteristically causes hyperuricaemia and may precipitate an acute gouty attack?", "choices": ["Pyrazinamide", "Streptomycin", "Isoniazid", "Levofloxacin", "Rifampicin"], "answer": 0, "explain": "**Pyrazinamide** และ metabolite (pyrazinoic acid) **ยับยั้งการขับกรดยูริกที่ proximal tubule (URAT1)** → hyperuricaemia และ arthralgia; **ethambutol ก็ทำให้กรดยูริกสูงได้แต่น้อยกว่า** (โพยเก่าตอบเป็นคู่ pyrazinamide + ethambutol)\n\nอาการปวดข้อจาก PZA มักเป็น **arthralgia ที่ไม่ใช่ gout จริง** และ **ไม่ต้องหยุดยา** — ให้ยาแก้ปวดและติดตาม; ถ้าเป็น gout แท้จึงรักษาตามปกติ", "pearl": "", "topic": "", "src": "MED33 MCQ – ยา TB ปวดข้อเป็น gout เกิดจาก pyrazinamide (ตอบชอย pyrazinamide + ethambutol); MED33 MCQ ข้อ 72", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "B5.2.5(1)"]}, {"id": "CH-OLD-04", "kind": "old", "stem": "A patient completing anti-tuberculous therapy notices that his urine, tears and sweat have turned orange-red. He feels well and liver function tests are normal. Which drug is responsible?", "choices": ["Ethambutol", "Rifampicin", "Streptomycin", "Pyrazinamide", "Isoniazid"], "answer": 1, "explain": "**Rifampicin** ทำให้สารคัดหลั่งทุกชนิดเป็นสีส้มแดง — **ไม่เป็นอันตราย** แต่ต้องบอกผู้ป่วยล่วงหน้าเพื่อไม่ให้ตกใจและหยุดยาเอง (และเตือนผู้ใส่คอนแทคเลนส์ชนิดนิ่มว่าจะติดสี)\n\nผลข้างเคียงอื่นของ rifampicin ที่ออกสอบ: **flu-like syndrome**, cholestatic hepatitis, thrombocytopenia และที่สำคัญคือเป็น **CYP450 inducer แรง** → ลดระดับ warfarin, ยาคุมกำเนิด, ARV, azole, corticosteroid", "pearl": "", "topic": "", "src": "MED28 MED421 ข้อ 23 – urine turns orange after TB regimen → Rifampicin; MED28 ข้อ 88 – side effects of rifampicin include flu-like symptoms; MED31 MCQ ข้อ 5", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-01", "kind": "old", "stem": "A 30-year-old previously healthy woman with smear-positive pulmonary tuberculosis was started on isoniazid, rifampicin, pyrazinamide and ethambutol once daily. After 1 week she develops progressive nausea, vomiting and malaise. Physical findings are unremarkable. Liver function tests: total bilirubin / direct bilirubin 2.8 / 1.6 mg/dL, AST/ALT 180/170 U/L, ALP 150 U/L (normal <115). What is the most appropriate immediate management?", "choices": ["Stop only pyrazinamide and continue the other three drugs", "Replace rifampicin with ofloxacin and continue the rest", "Add domperidone and continue the same regimen", "Split isoniazid into three doses daily after meals", "Stop all hepatotoxic drugs, switch to ethambutol plus a fluoroquinolone, then perform a drug challenge test when liver function recovers"], "answer": 4, "explain": "**Drug-induced liver injury จากยาต้านวัณโรค** — เกณฑ์ที่ต้องหยุดยาคือ **ALT >3 เท่าของค่าปกติร่วมกับอาการ** หรือ **>5 เท่าแม้ไม่มีอาการ** หรือ **bilirubin สูงร่วมด้วย** (เคสนี้มีทั้งอาการและ bilirubin สูง) → **หยุด INH, RIF, PZA ทั้งหมด** แล้วใช้สูตรที่ไม่เป็นพิษต่อตับชั่วคราว (ethambutol + fluoroquinolone ± aminoglycoside) จนค่าตับกลับเป็นปกติ แล้วจึง **re-challenge ทีละตัว**\n\nความเป็นพิษต่อตับ: **PZA > INH > RIF**; rifampicin ทำให้ bilirubin สูงได้จากการแข่งขันการ uptake โดยที่ transaminase ไม่ขึ้น (cholestatic pattern)", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D – A 30 year old woman with smear positive pulmonary TB, after 1 week developed nausea vomiting, TB/DB 2.8/1.6, AST/ALT 180/170", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-MCQ-06", "kind": "mcq", "stem": "A patient with drug-susceptible smear-positive pulmonary tuberculosis has completed 2 months of isoniazid, rifampicin, pyrazinamide and ethambutol under directly observed therapy. He feels much better and has gained weight, but the sputum smear at the end of the second month is still positive. What is the most appropriate next step?", "choices": ["Immediately switch to a second-line multidrug-resistant tuberculosis regimen", "Declare treatment failure and restart the same regimen from the beginning", "Send sputum for culture and drug susceptibility testing, and continue treatment while awaiting results", "Stop all treatment and repeat the smear in 1 month", "Add a fluoroquinolone to the current regimen indefinitely"], "answer": 2, "explain": "**Smear ที่ยังบวกเมื่อจบ intensive phase ไม่ได้แปลว่าล้มเหลว** — ต้องแยกสาเหตุ 4 อย่าง\n1. **เชื้อที่ตายแล้ว (non-viable bacilli)** — smear เป็น microscopy ที่ **แยกเชื้อเป็นกับเชื้อตายไม่ได้** ผู้ป่วยที่มี cavity ใหญ่และเชื้อจำนวนมากตั้งต้นอาจ smear บวกนานกว่า ทั้งที่ culture ลบแล้ว\n2. **เชื้อจำนวนมากตั้งต้น / รอยโรคกว้าง** → conversion ช้ากว่าปกติ\n3. **การกินยาไม่สม่ำเสมอ** — แต่ผู้ป่วยรายนี้อยู่ใน **DOT** และอาการดีขึ้นชัด\n4. **เชื้อดื้อยา** — ต้องพิสูจน์ ไม่ใช่สันนิษฐาน\n\n**สิ่งที่ต้องทำ: ส่ง culture + drug susceptibility testing (หรือ molecular test เช่น Xpert MTB/RIF, line probe assay)** และ **ให้ยาสูตรเดิมต่อระหว่างรอผล** — ในผู้ป่วยที่อาการทางคลินิกดีขึ้นชัดเจน\n\n**ตัวชี้วัดที่เชื่อถือได้กว่าคือ culture conversion** และตัวชี้วัดทางคลินิก: **น้ำหนักขึ้น ไข้ลง อาการไอลดลง**\n\nทำไมข้ออื่นผิด\n- **เปลี่ยนเป็นสูตร MDR ทันที**: สูตรที่สองมีพิษสูง ระยะเวลานาน ราคาแพง — **ห้ามใช้โดยไม่มีหลักฐานความดื้อยา**\n- **หยุดยา 1 เดือน**: การหยุดยาคือสิ่งที่สร้างเชื้อดื้อยาโดยตรง\n- **เติม fluoroquinolone ตัวเดียวเข้าไปในสูตรที่กำลังล้มเหลว**: เป็นความผิดพลาดคลาสสิกที่เรียกว่า **\"adding a single drug to a failing regimen\"** → สร้างการดื้อต่อยาตัวใหม่ทันที\n- **เริ่มสูตรเดิมใหม่ทั้งหมด**: ไม่มีเหตุผลทางเภสัชวิทยาและทำให้ระยะเวลารักษายืดออกโดยเปล่าประโยชน์", "pearl": "**กฎทองของวัณโรค: ห้ามเติมยาเพียงตัวเดียวเข้าไปในสูตรที่ไม่ได้ผล** — ถ้าจะเปลี่ยนต้องเปลี่ยนเป็นสูตรใหม่ที่มียาที่เชื้อยังไวอย่างน้อย 3-4 ตัว", "topic": "Sputum conversion at the end of the intensive phase", "src": "", "ref": ["MED32 MCQ ข้อ 18 – AFB positive treat TB ไป 8 weeks แต่อาการไม่ดีขึ้นและยัง AFB positive จะทำยังไงต่อ (PCR for TB, drug compliance)", "MED30 SAQ ข้อ 4 – TB กินยามา 6 อาทิตย์อาการไม่ดีขึ้น → poor compliance (choice TB drug resistance)", "MED32 MCQ ข้อ 27 – คนไข้ TB กินยาตามสูตรแล้วไม่ได้ผล ถามว่าทำไงต่อ", "MED33 MCQ – เป็น TB, AFB positive อะไรเป็นตัว prognosis → CXR"], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.9"]}, {"id": "CH-OLD-07", "kind": "old", "stem": "A patient with smear-positive pulmonary tuberculosis has been on the standard regimen for 8 weeks but his sputum smear remains AFB positive and his symptoms have not improved. He obtains his medication from the local health centre and admits missing doses frequently. Which is the most likely explanation and the best next step?", "choices": ["Non-tuberculous mycobacterial infection; stop all anti-tuberculous drugs", "Poor adherence; assess and reinforce adherence with directly observed therapy while sending sputum for culture and drug susceptibility testing", "Paradoxical reaction; add systemic corticosteroid and continue the same regimen", "Primary drug resistance; empirically start a second-line MDR regimen immediately", "Drug malabsorption; double the dose of all four drugs"], "answer": 1, "explain": "**สาเหตุอันดับหนึ่งของการรักษาวัณโรคล้มเหลวคือการกินยาไม่สม่ำเสมอ ไม่ใช่เชื้อดื้อยา** — โดยเฉพาะเมื่อมีหลักฐานว่าขาดยา\n\nขั้นตอนที่ถูก: **ประเมิน adherence และจัด DOT (directly observed therapy)** ร่วมกับ **ส่ง sputum culture + drug susceptibility testing (หรือ molecular test เช่น Xpert MTB/RIF)** เพื่อพิสูจน์ว่าดื้อยาจริงหรือไม่ **ก่อน** เปลี่ยนไปสูตรที่สอง (ซึ่งมีพิษมากและใช้เวลานาน)\n\nข้อควรรู้: smear อาจยังบวกจาก **เชื้อที่ตายแล้ว** ได้ — ต้องดู culture ประกอบ", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 18 – AFB positive treat TB ไป 8 weeks แต่อาการไม่ดีขึ้นและยัง AFB positive จะทำยังไงต่อ (choice: PCR for TB, drug compliance); MED30 SAQ ข้อ 4 – TB กินยามา 6 อาทิตย์อาการไม่ดีขึ้น → poor compliance", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.9"]}]}, {"id": "chest-03-08", "title": "วัณโรคในภาวะพิเศษ — ไต ตับ ตั้งครรภ์ และเอชไอวี", "minutes": 9, "summary": "ยาตัวไหนต้องปรับ สูตรไหนใช้เมื่อตับพัง และเริ่มยาต้านไวรัสเมื่อไร", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### ผู้ป่วยไตเสื่อม (CrCl < 30 มล./นาที หรือฟอกไต)\n| ยา | ต้องปรับ? | ขนาดที่แนะนำ |\n|---|---|---|\n| **Isoniazid (H)** | **ไม่ต้อง** | เท่าเดิม (ขับทางตับ) |\n| **Rifampicin (R)** | **ไม่ต้อง** | เท่าเดิม (ขับทางตับ) |\n| **Pyrazinamide (Z)** | **ต้องปรับ** | **15–20 มก./กก. สัปดาห์ละ 3 ครั้ง** |\n| **Ethambutol (E)** | **ต้องปรับ** | **20–30 มก./กก. สัปดาห์ละ 3 ครั้ง** |\n\n**ให้ยาหลังฟอกไต** เพื่อไม่ให้ถูกขจัดออก และ **ต้องให้ pyridoxine ทุกราย** เพราะผู้ป่วยไตวายเสี่ยงต่อปลายประสาทอักเสบจาก isoniazid สูง\n\n### ผู้ป่วยโรคตับ\nผู้ที่มีอาการของโรคตับเรื้อรังและ **ALT > 3 เท่าของค่าปกติ** ให้เลือกสูตรที่มีพิษต่อตับน้อยลงตามลำดับความรุนแรง\n- **ใช้ยาที่มีพิษต่อตับ 2 ตัว** → **2HRE/7HR** หรือ **6–9 RZE**\n- **ใช้ยาที่มีพิษต่อตับ 1 ตัว** → **2 AmHE/16 HE** หรือ **12–18 HE + levofloxacin**\n- **ติดตามอาการทุก 1 สัปดาห์ในช่วง 2–3 สัปดาห์แรก และทุก 2 สัปดาห์ใน 2 เดือนแรก** ถ้าสงสัยตับอักเสบต้องเจาะเลือดทันที\n\n### หญิงตั้งครรภ์\n- **H, R, E, Z ใช้ได้ในหญิงตั้งครรภ์** และแนวทางไทยและ WHO ใช้สูตรมาตรฐาน **2HRZE/4HR** ได้ตามปกติ — วัณโรคที่ไม่รักษาอันตรายต่อทั้งแม่และทารกมากกว่า\n- **ห้าม streptomycin และ aminoglycoside อื่น** เพราะทำให้ทารกหูหนวกถาวร (ototoxicity ต่อ CN VIII)\n- **ให้ pyridoxine ทุกราย**\n- **ให้นมบุตรได้** ยาผ่านน้ำนมในปริมาณน้อยมาก · ทารกควรได้รับการประเมินและพิจารณายาป้องกัน\n- เสริมวิตามินเคในทารกแรกเกิดของแม่ที่ได้ rifampicin\n\n### ผู้ติดเชื้อเอชไอวี\n- **เริ่มยาต้านไวรัสทุกราย โดยไม่ต้องดูระดับ CD4** เมื่อผู้ป่วยพร้อมและทนยาวัณโรคได้\n| ชนิดของวัณโรค | จังหวะเริ่มยาต้านไวรัสหลังเริ่มยาวัณโรค |\n|---|---|\n| **วัณโรคทุกชนิด ยกเว้นเยื่อหุ้มสมอง** | **ภายใน 2 สัปดาห์ อย่างช้าไม่เกิน 4 สัปดาห์** |\n| **วัณโรคเยื่อหุ้มสมอง** | **หลังรักษาวัณโรคแล้วอย่างน้อย 4 สัปดาห์ อย่างช้าไม่เกิน 8 สัปดาห์** (เริ่มเร็วเพิ่มอัตราตายจากภาวะแทรกซ้อนในสมอง) |\n\n**ปฏิกิริยาระหว่างยา — rifampicin เป็นตัวกระตุ้น CYP3A4 ที่แรงมาก**\n- **ยาต้านไวรัสที่ไม่แนะนำให้ใช้ร่วมกับ R** — **tenofovir alafenamide (TAF) · nevirapine · etravirine · rilpivirine · PI ทุกตัว · elvitegravir**\n- **ยาที่ต้องปรับขนาดเมื่อใช้ร่วมกับ R** — **raltegravir, dolutegravir (เพิ่มเป็นวันละ 2 ครั้ง), maraviroc**\n- ถ้าจำเป็นต้องใช้ PI ให้เปลี่ยนเป็น **rifabutin** แทน rifampicin\n\n**IRIS (immune reconstitution inflammatory syndrome)** — อาการวัณโรคแย่ลงหรือมีต่อมน้ำเหลืองโตขึ้นหลังเริ่มยาต้านไวรัส มักเกิดใน 2–8 สัปดาห์แรก โดยเฉพาะเมื่อ CD4 ต่ำมาก\n**ให้ยาวัณโรคและยาต้านไวรัสต่อ อย่าหยุดยา** รักษาตามอาการ และให้ **corticosteroid ในรายที่อาการรุนแรง** — ต้องแยกจากการรักษาล้มเหลว การติดเชื้อฉวยโอกาสอื่น และวัณโรคดื้อยาก่อนเสมอ\n", "pearls": ["ไตเสื่อม: H และ R ไม่ต้องปรับ · Z และ E ปรับเป็นสัปดาห์ละ 3 ครั้ง และให้ยาหลังฟอกไต", "ตั้งครรภ์ใช้ HRZE ได้ตามปกติ ห้าม streptomycin", "เอชไอวี: เริ่ม ART ภายใน 2 สัปดาห์ทุกราย ยกเว้นเยื่อหุ้มสมองให้รอ 4–8 สัปดาห์", "Rifampicin เข้ากันไม่ได้กับ PI ทุกตัว nevirapine และ TAF · dolutegravir ต้องเพิ่มเป็นวันละ 2 ครั้ง"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-MCQ-07", "kind": "mcq", "stem": "A patient with end-stage renal disease on haemodialysis is diagnosed with pulmonary tuberculosis. Which pair of first-line drugs requires dose or interval adjustment in this setting?", "choices": ["Isoniazid and pyrazinamide", "Rifampicin and ethambutol", "Isoniazid and rifampicin", "Ethambutol and pyrazinamide", "No first-line drug requires adjustment"], "answer": 3, "explain": "**หลักการ: ยาที่ขับทางไตต้องปรับ ยาที่ขับทางตับไม่ต้องปรับ**\n\n| ยา | ทางขับหลัก | ปรับใน renal failure |\n|---|---|---|\n| **Isoniazid** | **ตับ (acetylation)** | **ไม่ต้อง** |\n| **Rifampicin** | **ตับ/น้ำดี** | **ไม่ต้อง** |\n| **Pyrazinamide** | **ตับ แต่ metabolite ขับทางไตและสะสม** | **ต้องปรับ — ให้สัปดาห์ละ 3 ครั้ง** |\n| **Ethambutol** | **ไต 80%** | **ต้องปรับ — ให้สัปดาห์ละ 3 ครั้ง** |\n\n**เหตุผลเชิงพิษวิทยา**\n- **Ethambutol สะสม → optic neuritis** ซึ่งเป็นพิษที่ dose-dependent → ต้องตรวจ visual acuity และ colour vision เป็นระยะ\n- **Pyrazinamide** — metabolite **pyrazinoic acid สะสม → hyperuricaemia รุนแรงและ arthralgia**\n\n**ข้อควรปฏิบัติเพิ่มเติมในผู้ป่วยฟอกไต**\n- **ให้ยาหลังการฟอกเลือดในวันที่ฟอก** เพื่อไม่ให้ยาถูกกำจัดออกไปและเอื้อต่อ DOT\n- **ให้ pyridoxine ทุกราย** เพราะผู้ป่วยไตวายเสี่ยง peripheral neuropathy อยู่แล้ว\n- **ห้ามลดขนาด isoniazid และ rifampicin** เพราะการลดขนาดยาสองตัวที่ฆ่าเชื้อได้ดีที่สุดจะทำให้รักษาล้มเหลวและเกิดเชื้อดื้อยา\n\nทำไมข้ออื่นผิด: ทุกข้อที่ระบุว่า INH หรือ RIF ต้องปรับล้วนขัดกับเภสัชจลนศาสตร์ของยา และการบอกว่าไม่ต้องปรับเลยจะทำให้เกิดพิษจาก EMB/PZA", "pearl": "ในผู้ป่วยโรคตับ: **pyrazinamide เป็นพิษต่อตับมากที่สุด** → ในตับแข็งรุนแรงอาจต้องใช้สูตรที่ไม่มี PZA (2HRE/7HR) หรือสูตรที่มียาตับ ≤1 ตัวในรายที่รุนแรงมาก", "topic": "Anti-tuberculous drug dosing in renal impairment", "src": "", "ref": ["MED31 past paper – A 30 year old woman with smear positive pulmonary TB developed hepatotoxicity", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 17 – เป็น TB แล้ว start anti-TB drug 10 days แล้วไตแหก", "MED31 past paper – ผู้ป่วยวัณโรคได้สูตร 2HRZE/4HR แล้วตามัว → หยุด ethambutol"], "nl": ["B6.2.2(8)", "2.3.4(20)", "B9.2.7(2)"]}, {"id": "CH-MCQ-02", "kind": "mcq", "stem": "A 26-year-old woman at 12 weeks of gestation is diagnosed with smear-positive pulmonary tuberculosis. Which anti-tuberculous drug must be avoided during her pregnancy?", "choices": ["Pyrazinamide", "Rifampicin", "Isoniazid", "Ethambutol", "Streptomycin"], "answer": 4, "explain": "**Streptomycin เป็น aminoglycoside ที่ผ่านรกได้และเป็นพิษต่อ cranial nerve VIII ของทารก** → ทำให้เกิด **congenital sensorineural deafness และ vestibular damage ถาวร** จึงเป็น **ข้อห้ามเด็ดขาดในการตั้งครรภ์** (เช่นเดียวกับ aminoglycoside ตัวอื่น: amikacin, kanamycin, capreomycin)\n\n**ยาที่ปลอดภัยและใช้ได้ในครรภ์**: **isoniazid, rifampicin, ethambutol** และในแนวทางของ WHO **pyrazinamide ก็ใช้ได้** (ข้อมูลความปลอดภัยจำกัดกว่าแต่ประโยชน์มากกว่าความเสี่ยง) → สูตรมาตรฐาน **2HRZE/4HR ใช้ได้ในครรภ์**\n\n**สิ่งที่ต้องทำเพิ่มในหญิงตั้งครรภ์ที่เป็นวัณโรค**\n1. **ให้ pyridoxine (vitamin B6) ทุกราย** ที่ได้ isoniazid\n2. **ให้ vitamin K แก่แม่ในช่วงท้ายและแก่ทารกแรกเกิด** เพราะ **rifampicin เหนี่ยวนำเอนไซม์ตับ → ลด vitamin K-dependent clotting factor → เสี่ยงเลือดออกในทารกแรกเกิด**\n3. **ติดตามค่าตับใกล้ชิด** เพราะการตั้งครรภ์เพิ่มความเสี่ยง hepatotoxicity\n4. **ให้นมบุตรได้** — ยาผ่านน้ำนมในปริมาณน้อยมาก และการแยกแม่ลูกทำเฉพาะเมื่อแม่ยังแพร่เชื้อ\n\n**วัณโรคที่ไม่รักษาอันตรายต่อทั้งแม่และทารกมากกว่าผลข้างเคียงของยา** (เพิ่มการแท้ง คลอดก่อนกำหนด ทารกน้ำหนักน้อย) → **ห้ามเลื่อนการรักษาเพราะกลัวยา**\n\nทำไมข้ออื่นไม่ใช่: INH, RIF, EMB, PZA ล้วนอยู่ในสูตรที่แนะนำสำหรับหญิงตั้งครรภ์", "pearl": "ยาวัณโรคแนวที่สองที่ **ห้ามในครรภ์** เพิ่มเติม: **fluoroquinolone, ethionamide (teratogenic ชัด), aminoglycoside ทุกตัว**", "topic": "Anti-tuberculous therapy in pregnancy", "src": "", "ref": ["MED31 past paper – ยาในข้อใดเหมาะสมที่สุดในการรักษา hypertension ในคนท้อง (หลักการความปลอดภัยของยาในครรภ์)", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 13 – Pregnant woman GA 8 wk ยา thyroid → PTU", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 48 – UTI ในหญิงตั้งครรภ์ → Amoxicillin"], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-MCQ-04", "kind": "mcq", "stem": "A 29-year-old man is newly diagnosed with HIV infection and smear-positive pulmonary tuberculosis. His CD4 count is 30 cells/microlitre. Anti-tuberculous therapy is started. Which statement about starting antiretroviral therapy is correct?", "choices": ["Delay antiretroviral therapy until anti-tuberculous treatment is completed to avoid drug interactions", "Do not treat tuberculosis until the viral load is suppressed", "Start antiretroviral therapy within the first 2 weeks of anti-tuberculous treatment because the CD4 count is below 50", "Start both anti-tuberculous therapy and antiretroviral therapy on the same day", "Start antiretroviral therapy only if the CD4 count falls below 20"], "answer": 2, "explain": "**หลักการ: รักษาวัณโรคก่อนเสมอ แล้วเริ่ม ART โดยเร็วตามระดับ CD4**\n- **CD4 < 50 cells/µL → เริ่ม ART ภายใน 2 สัปดาห์**\n- **CD4 ≥ 50 → เริ่มภายใน 8 สัปดาห์**\n- **ยกเว้น TB meningitis → เลื่อนไปประมาณ 4-8 สัปดาห์** เพราะ IRIS ในสมองมี mortality สูง\n\nเหตุผล: การทดลอง (SAPIT, CAMELIA, STRIDE) แสดงว่า **การเริ่ม ART เร็วในผู้ที่ CD4 ต่ำมากลด mortality อย่างชัดเจน** แม้จะแลกกับ IRIS ที่มากขึ้น\n\n**Paradoxical TB-IRIS**: ระบบภูมิคุ้มกันฟื้นตัวแล้วตอบสนองต่อ antigen ของเชื้อที่ตายหรือยังอยู่ → **ไข้กลับมา ต่อมน้ำเหลืองโตขึ้น รอยโรคในปอดแย่ลง** ทั้งที่การรักษาได้ผล → **ไม่ใช่การรักษาล้มเหลว** จัดการด้วย NSAID/steroid และ **ให้ยาทั้งสองสูตรต่อ**\n\n**Drug interaction ที่ต้องรู้**: **rifampicin เป็น CYP3A4 inducer แรง** → ลดระดับ **protease inhibitor และ integrase inhibitor** อย่างมาก → ในทางปฏิบัติ\n- ใช้ **efavirenz-based regimen** ได้โดยไม่ต้องปรับ\n- ถ้าใช้ **dolutegravir ต้องเพิ่มเป็นวันละ 2 ครั้ง**\n- ถ้าเลี่ยงไม่ได้จริงๆ ใช้ **rifabutin** แทน rifampicin\n→ **แต่ interaction ไม่ใช่เหตุผลให้เลื่อน ART ออกไปเป็นเดือนๆ**\n\nทำไมข้ออื่นผิด\n- **รอจนรักษา TB ครบ**: ผู้ป่วย CD4 30 มีความเสี่ยงติดเชื้อฉวยโอกาสและเสียชีวิตสูงมากในระหว่างนั้น\n- **เริ่มพร้อมกันวันเดียวกัน**: เพิ่ม IRIS, พิษยาซ้อนทับ และภาระเม็ดยาจนผู้ป่วยกินไม่ไหว\n- **รอ CD4 < 20**: ไม่มีเกณฑ์นี้\n- **ไม่รักษา TB ก่อน**: ตรงข้ามกับหลักการโดยสิ้นเชิง", "pearl": "ผู้ป่วย HIV ที่เป็น TB มักมีภาพ **ไม่คลาสสิก**: CXR อาจเป็น **lower zone infiltrate, lymphadenopathy, miliary หรือแม้แต่ปกติ** และ **smear มักลบ** เมื่อ CD4 ต่ำ → ใช้ **molecular test และ urine LF-LAM** ช่วย", "topic": "Timing of antiretroviral therapy in HIV-associated tuberculosis", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 73 – HIV ให้ยา Tenofovir disoproxil fumarate/Lamivudine/Dolutegravir", "MED34 MCQ ครั้งที่ 4 ข้อ 43 – hiv on tivir ทำไรต่อ → cd4 count, viral load, screen crypto, screen toxo", "MED31 MCQ ข้อ 49 – HIV เหนื่อยมากขึ้น infiltration at right lower lobe → Reactivate TB", "MED32 MCQ ข้อ 22 – คนไข้ HIV มีอาการไอ เหนื่อย ให้รูป AFB"], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.3.3-3(5)"]}, {"id": "CH-OLD-12", "kind": "old", "stem": "A patient with pulmonary tuberculosis develops acute kidney injury 10 days after starting the standard four-drug regimen. Which urinary finding would best support drug-induced acute interstitial nephritis as the cause?", "choices": ["Oval fat bodies and fatty casts", "Dysmorphic red blood cells with red cell casts", "Numerous uric acid crystals", "Sterile pyuria with white blood cell casts", "Muddy brown granular casts"], "answer": 3, "explain": "**Rifampicin เป็นยาต้านวัณโรคที่ทำให้เกิด acute interstitial nephritis (AIN) ได้บ่อยที่สุด** โดยเฉพาะเมื่อ **ให้แบบไม่ต่อเนื่อง (intermittent) หรือหยุดแล้วเริ่มใหม่** เพราะเป็นปฏิกิริยาผ่าน antibody ต่อ rifampicin\n\n**ลายเซ็นของ AIN ในปัสสาวะคือ sterile pyuria ร่วมกับ WBC cast** (± eosinophiluria) โดย **culture ไม่ขึ้น** และอาจมีไข้ ผื่น eosinophilia\n\nแยกจาก: muddy brown granular cast = ATN; RBC cast = glomerulonephritis; oval fat body = nephrotic\n\nรักษาโดย **หยุดยาที่เป็นสาเหตุ** และพิจารณา corticosteroid ในรายที่ไตไม่ฟื้น", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 17 – เป็น TB แล้ว start anti-TB drug 10 days แล้วไตแหก ส่งไร → UA WBC cast", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "B9.2.7(1)"]}]}, {"id": "chest-03-09", "title": "วัณโรคดื้อยา", "minutes": 6, "summary": "นิยามแต่ละแบบให้แม่น เพราะข้อสอบถามตรง ๆ", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "| คำ | นิยาม (ตามแนวทางไทย/WHO) |\n|---|---|\n| **Mono-resistant TB** | ดื้อยาแนวที่หนึ่ง **เพียงขนานเดียว** |\n| **Poly-drug resistant TB** | ดื้อยาแนวที่หนึ่ง **มากกว่าหนึ่งขนาน แต่ไม่ใช่ H และ R พร้อมกัน** |\n| **MDR-TB** | **ดื้อทั้ง isoniazid และ rifampicin พร้อมกัน** (จะดื้อยาแนวที่หนึ่งตัวอื่นร่วมด้วยหรือไม่ก็ได้) |\n| **RR-TB** | **ดื้อ rifampicin** ตรวจพบด้วยวิธี phenotypic หรือ genotypic (เช่น Xpert MTB/RIF) — จัดการเหมือน MDR |\n| **Pre-XDR-TB** | **MDR/RR-TB ที่ดื้อยากลุ่ม fluoroquinolone ร่วมด้วย** |\n| **XDR-TB** | **MDR-TB ที่ดื้อ fluoroquinolone และดื้อยากลุ่ม A อย่างน้อย 1 ขนาน (bedaquiline หรือ linezolid)** |\n| **Hr-TB** | ดื้อ **isoniazid** โดยยังไวต่อ rifampicin |\n\n### หลักการที่ต้องรู้\n- **สงสัยเชื้อดื้อยาเมื่อ** — เคยรักษาวัณโรคมาก่อน · สัมผัสผู้ป่วยวัณโรคดื้อยา · **เสมหะยังบวกเมื่อสิ้นเดือนที่ 2 หรือกลับบวกใหม่** · อาการไม่ดีขึ้นทั้งที่กินยาครบ\n- **Xpert MTB/RIF คือเครื่องมือคัดกรองที่เร็วที่สุด** เพราะบอกการดื้อ rifampicin ได้ในไม่กี่ชั่วโมง แล้วจึงส่ง second-line molecular และ phenotypic DST ต่อ\n- **ห้ามเติมยาเพียงตัวเดียวเข้าไปในสูตรที่กำลังล้มเหลว** — เท่ากับให้ยาเดี่ยวและสร้างเชื้อดื้อยาเพิ่ม\n- การรักษา MDR/RR-TB ใช้สูตรที่ผู้เชี่ยวชาญกำหนด (ปัจจุบันเป็นสูตรกินล้วนที่มี **bedaquiline, linezolid, levofloxacin/moxifloxacin, clofazimine, cycloserine**) ร่วมกับ **DOT อย่างเคร่งครัด** และการติดตามผลข้างเคียง (QT ยาว เส้นประสาทตาและปลายประสาทอักเสบ ซีดจาก linezolid)\n", "pearls": ["MDR-TB = ดื้อ H และ R พร้อมกัน · pre-XDR = MDR + ดื้อ FQ · XDR = pre-XDR + ดื้อ
