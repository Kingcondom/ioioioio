], "md": "อาจารย์เปิดคาบด้วยรูปเดียว — **PTH, FGF-23 และ 1,25(OH)₂D ควบคุมกันเองแบบ classic negative endocrine feedback loop** แล้วทั้งสามตัวไปสั่งการขนส่งแคลเซียมและฟอสเฟตที่ **ไต · กระดูก · ลำไส้** ถ้าจำแกนนี้ได้ จะเดาได้ว่าค่าแล็บชุดหนึ่งเกิดจากฮอร์โมนตัวไหนผิดปกติ\n\n### ใครทำอะไร\n\n| ฮอร์โมน | สร้างจาก | ถูกกระตุ้นโดย | ผลต่อ **แคลเซียม** | ผลต่อ **ฟอสเฟต** |\n|---|---|---|---|---|\n| **PTH** | ต่อมพาราไทรอยด์ | **แคลเซียมต่ำ** (ผ่าน CaSR) · ฟอสเฟตสูง · 1,25(OH)₂D ต่ำ | **ขึ้น** — สลายกระดูก · ดูดกลับที่ DCT · กระตุ้น 1α-hydroxylase | **ลง** — กด NaPi-2a/2c ที่ PCT ขับฟอสเฟตทิ้ง |\n| **FGF-23** | **osteocyte ในกระดูก** | **ฟอสเฟตสูง** · 1,25(OH)₂D สูง | ลงทางอ้อม (กด 1,25(OH)₂D) | **ลง** — กด NaPi-2a/2c เหมือน PTH |\n| **1,25(OH)₂D** | ไต (1α-hydroxylase) | **PTH** · ฟอสเฟตต่ำ | **ขึ้น** — ดูดซึมที่ลำไส้ | **ขึ้น** — ดูดซึมที่ลำไส้ |\n\n> **FGF-23 ต้องมี klotho เป็นตัวรับร่วม** จึงจะออกฤทธิ์ที่ไตได้ — klotho ลดลงในโรคไตเรื้อรัง จึงเป็นเหตุผลหนึ่งที่ FGF-23 ต้องสูงขึ้นมาก ๆ กว่าจะพอคุมฟอสเฟตไหว\n\n### วงป้อนกลับที่ต้องไล่ให้คล่อง\n1. **แคลเซียมตก** → CaSR ที่ต่อมพาราไทรอยด์รับรู้ → **PTH ขึ้น** → สลายกระดูก + ดูดแคลเซียมกลับที่ไต + สร้าง 1,25(OH)₂D → **แคลเซียมกลับขึ้น** และ **ฟอสเฟตถูกขับทิ้ง**\n2. **ฟอสเฟตสูง** → **FGF-23 ขึ้น** → ขับฟอสเฟตทิ้ง **และกด 1,25(OH)₂D** (ยับยั้ง 1α-hydroxylase พร้อมเร่ง 24-hydroxylase) → ลดการดูดซึมฟอสเฟตจากลำไส้ด้วย\n3. **1,25(OH)₂D สูง** → ป้อนกลับไปกด PTH และกระตุ้น FGF-23\n\n### กุญแจอ่านแล็บ — ดูแคลเซียมคู่กับฟอสเฟตเสมอ\n\n| แคลเซียม | ฟอสเฟต | แปลว่า | ตัวอย่าง |\n|---|---|---|---|\n| **สูง** | **ต่ำ** | **PTH (หรือ PTHrP) ทำงานมากเกิน** | primary hyperparathyroidism · **humoral hypercalcemia of malignancy** |\n| **สูง** | **ปกติ–สูง** | ไม่ได้ผ่าน PTH | วิตามินดีเกิน · granulomatous disease · สลายกระดูกจากมะเร็ง |\n| **ต่ำ** | **สูง** | **PTH ไม่พอ หรือฟอสเฟตล้น** | hypoparathyroidism · **CKD** · tumor lysis · rhabdomyolysis |\n| **ต่ำ** | **ต่ำ** | ขาดวิตามินดี หรือดูดซึมบกพร่อง | ขาดวิตามินดี · malabsorption · **hungry bone syndrome** |\n\n> **กฎเหล็กของตารางนี้** — **PTH ขับฟอสเฟตทิ้งเสมอ** ฉะนั้น **\"แคลเซียมสูงคู่ฟอสเฟตต่ำ\" แทบจะแปลว่ามี PTH-like activity เสมอ** ไม่ว่าจะมาจากต่อมพาราไทรอยด์เองหรือจาก PTHrP ของก้อนมะเร็ง\n\n### ที่อาจารย์เน้นในสไลด์\nสไลด์เปิดและสไลด์ปิดของทุกหัวข้อย่อยเป็นรูปแกนเดียวกันนี้ — อาจารย์ใช้เป็นแผนที่ของคาบ และย้ำว่าต้องอ่าน **แคลเซียม ฟอสเฟต และ PTH พร้อมกันสามค่า** ไม่ใช่ดูทีละตัว เพราะค่าใดค่าหนึ่งโดด ๆ แปลผลไม่ได้", "pearls": ["PTH ขึ้นแคลเซียม ลงฟอสเฟต · 1,25(OH)₂D ขึ้นทั้งคู่ · FGF-23 ลงฟอสเฟตและลง 1,25(OH)₂D", "แคลเซียมสูง + ฟอสเฟตต่ำ = มี PTH หรือ PTHrP ทำงานมากเกิน จนกว่าจะพิสูจน์เป็นอย่างอื่น", "FGF-23 ต้องมี klotho เป็นตัวรับร่วม — klotho ที่ลดลงใน CKD คือจุดเริ่มของ CKD-MBD", "ห้ามอ่านแคลเซียมเดี่ยว ๆ — ต้องดูฟอสเฟตและ PTH พร้อมกันเสมอ"], "items": [{"id": "NEPHRO-05-01-Q1", "kind": "own", "stem": "A 54-year-old woman has serum calcium 11.4 mg/dL and phosphate 2.0 mg/dL. Which hormonal pattern best explains this combination?", "choices": ["Deficient calcitonin, which raises calcium without any effect on phosphate", "Excess FGF-23 activity, which lowers both calcium and phosphate", "Excess 1,25-dihydroxyvitamin D activity, which raises calcium and phosphate together", "Deficient parathyroid hormone, which lowers calcium and raises phosphate", "Excess parathyroid hormone activity, which raises calcium while promoting renal phosphate wasting"], "answer": 4, "explain": "**แคลเซียมสูงคู่กับฟอสเฟตต่ำคือลายเซ็นของ PTH (หรือ PTHrP) ที่ทำงานมากเกิน** เพราะ PTH ทำสองอย่างพร้อมกัน — **ดึงแคลเซียมขึ้น** (สลายกระดูก ดูดกลับที่ DCT กระตุ้น 1α-hydroxylase) และ **กด NaPi-2a/2c ที่ PCT จนฟอสเฟตรั่วทิ้งทางปัสสาวะ** · สาเหตุที่พบบ่อยคือ **primary hyperparathyroidism** และ **humoral hypercalcemia of malignancy จาก PTHrP**\n\n- **1,25(OH)₂D เกิน** เพิ่มการดูดซึมที่ลำไส้ทั้งแคลเซียมและฟอสเฟต จึงได้ **ฟอสเฟตปกติหรือสูง** ไม่ใช่ต่ำ — ภาพนี้พบใน granulomatous disease และวิตามินดีเกิน\n- **FGF-23 เกิน** ทำให้ **ฟอสเฟตต่ำก็จริง แต่แคลเซียมไม่สูง** (กลับต่ำจากการที่ 1,25(OH)₂D ถูกกด) เช่นใน tumor-induced osteomalacia\n- **PTH ขาด** ให้ภาพกลับด้านคือ **แคลเซียมต่ำ ฟอสเฟตสูง**\n- **Calcitonin** มีบทบาทน้อยมากในมนุษย์ การขาด calcitonin ไม่ทำให้แคลเซียมสูง (ผู้ป่วยที่ตัดต่อมไทรอยด์ออกหมดก็ไม่มีปัญหาแคลเซียมจากเหตุนี้)", "pearl": "อ่านแคลเซียมคู่ฟอสเฟตทุกครั้ง — สูงคู่ต่ำ = PTH/PTHrP · สูงคู่สูง = วิตามินดีหรือสลายกระดูก · ต่ำคู่สูง = PTH ไม่พอหรือฟอสเฟตล้น", "topic": "แกน PTH – FGF-23 – วิตามินดี — เครื่องมือเดียวที่ใช้อธิบายได้ทั้งคาบ", "src": "", "ref": [], "nl": ["B9.1.2(8)", "B9.3(5)", "B9.2.5(2)"]}]}, {"id": "nephro-05-02", "title": "อ่านค่าแคลเซียมให้เป็น และไตจัดการแคลเซียมอย่างไร", "minutes": 8, "summary": "ionized เทียบ total · สูตรแก้ตามอัลบูมิน · การดูดกลับ 60/25/15 และบทบาทของ CaSR", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.1.2(4)", "B9.3(5)", "B9.1.2(3)"], "md": "### แคลเซียมอยู่ที่ไหนบ้าง\n- **ส่วนใหญ่มหาศาลอยู่ในกระดูก** — มีเพียง **1% ที่ไหลเวียนในเลือด**\n- แคลเซียมในเลือดแบ่งเป็นสามส่วน\n  - **40% จับกับโปรตีน** (ส่วนใหญ่คืออัลบูมิน) — **ส่วนนี้ไม่ออกฤทธิ์**\n  - **10% จับกับประจุลบอื่น** เช่น citrate, phosphate, bicarbonate\n  - **50% เป็น free \"ionized\" calcium** — **ส่วนนี้เท่านั้นที่ออกฤทธิ์ทางชีวภาพ**\n\n> **นี่คือเหตุผลที่ total calcium หลอกได้** — อัลบูมินต่ำทำให้ total calcium ต่ำโดยที่ ionized ปกติ ผู้ป่วยจึงไม่มีอาการเลย · สูตรแก้ที่ใช้กันคือ **corrected Ca = measured Ca + 0.8 × (4.0 − albumin)** แต่อาจารย์เน้นว่า **ถ้ามีข้อสงสัยให้ส่ง ionized calcium ตรง ๆ ดีที่สุด อย่าพึ่งสูตรอย่างเดียว**\n\n**ปัจจัยที่เปลี่ยน ionized calcium โดยที่ total ไม่เปลี่ยน**\n- **ด่าง (alkalosis) → ionized ลดลง** เพราะ H⁺ หลุดจากอัลบูมิน ทำให้อัลบูมินจับแคลเซียมได้มากขึ้น — จึงเป็นกลไกของ **มือจีบเกร็งเวลาหายใจเร็ว (hyperventilation tetany)**\n- **กรด (acidosis) → ionized เพิ่มขึ้น** ด้วยเหตุผลตรงข้าม\n- **Citrate จำนวนมากจากการให้เลือด** จับแคลเซียมอิสระไว้ → ionized ตกทันทีโดยที่ total อาจปกติ\n\n### การดูดซึมจากอาหาร\nแหล่งอาหารคือ **นมและผลิตภัณฑ์นม ผักใบเขียว อัลมอนด์ และถั่วเหลือง** ดูดซึมที่ **ลำไส้เล็กส่วนต้นและ jejunum ส่วนบน** ผ่านสองทาง — **transcellular ที่ต้องพึ่ง 1,25(OH)₂D** และ **paracellular ที่ไม่ต้องพึ่งวิตามินดี** · โดยรวมแล้ว **การดูดซึมแคลเซียมค่อนข้างไม่มีประสิทธิภาพ แต่ถูกเร่งอย่างมากโดย 1,25(OH)₂D**\n\n### ไตจัดการแคลเซียมอย่างไร\n**เฉพาะแคลเซียมอิสระและที่จับกับประจุลบเท่านั้นที่ถูกกรองผ่านโกลเมอรูลัส** (ส่วนที่จับโปรตีนกรองไม่ผ่าน) แล้ว **95% ของที่กรองมาถูกดูดกลับ**\n\n| ตำแหน่ง | สัดส่วน | กลไก |\n|---|---|---|\n| **PCT** | **60%** | **Paracellular** — passive diffusion และ solvent drag ผ่านรูของ **claudin-2 และ claudin-12** อาศัยแรงขับจากการดูด Na⁺ ผ่าน NHE3 |\n| **TAL** | **25%** | **Paracellular ผ่าน claudin-16 และ claudin-19** ขับเคลื่อนด้วย **แรงดันไฟฟ้าบวกในท่อ** ที่เกิดจาก NKCC2 + การรั่วกลับของ K⁺ ทาง **ROMK** |\n| **DCT** | **15%** | **Transcellular ล้วน** — เข้าทาง **TRPV5** จับกับ **calbindin D-28k** แล้วออกทาง **PMCA4** หรือ **NCX1 (SLC8A1)** |\n\n### กลไกที่ตอบข้อสอบได้หลายข้อ — CaSR ที่ TAL\n> **เมื่อแคลเซียมในเลือดสูง → CaSR ที่ TAL ถูกกระตุ้น → ยับยั้ง ROMK → K⁺ รั่วกลับเข้าท่อน้อยลง → แรงดันไฟฟ้าบวกในท่อหายไป → แคลเซียม (และแมกนีเซียม) ถูกดูดกลับน้อยลง จึงถูกขับทิ้ง**\n\nกลไกเดียวกันนี้อธิบายได้อีกสามเรื่อง\n- **ยาขับปัสสาวะกลุ่ม loop ยับยั้ง NKCC2 → ลบแรงดันไฟฟ้าบวกทิ้ง → ขับแคลเซียมออก** จึงใช้ช่วยลดแคลเซียมได้ (แต่ **ต้องให้สารน้ำจนเพียงพอก่อน** มิฉะนั้นจะยิ่งแย่)\n- **ยาขับปัสสาวะกลุ่ม thiazide ออกฤทธิ์ที่ DCT → เพิ่มการดูดแคลเซียมกลับ → ทำให้แคลเซียมสูงขึ้น** จึงเป็นสาเหตุ hypercalcemia จากยา และใช้รักษานิ่วแคลเซียมได้\n- **Familial hypocalciuric hypercalcemia (FHH)** เกิดจาก **CaSR ที่ทำงานบกพร่อง (inactivating mutation)** ไตจึงหวงแคลเซียมไว้ทั้งที่ในเลือดสูง → **แคลเซียมสูงแต่แคลเซียมในปัสสาวะต่ำ**\n\n### กับดักที่คนพลาดจริง\n- **อย่าวินิจฉัย hypocalcemia จาก total calcium ในผู้ป่วยอัลบูมินต่ำ** (ตับแข็ง nephrotic ทุพโภชนาการ) — ต้องส่ง ionized\n- **การส่ง ionized calcium ต้องเก็บแบบไม่ให้สัมผัสอากาศและส่งทันที** เพราะ pH ที่เปลี่ยนไปทำให้ค่าเพี้ยน\n- **แคลเซียมในปัสสาวะ 24 ชั่วโมงเป็นตัวแยก FHH ออกจาก primary hyperparathyroidism** — สองโรคนี้มี PTH สูงเหมือนกัน แต่ FHH ขับแคลเซียมต่ำ (**calcium-to-creatinine clearance ratio < 0.01**) และ **FHH ไม่ต้องผ่าตัด**", "pearls": ["แคลเซียมในเลือด 50% ionized · 40% จับโปรตีน · 10% จับประจุลบ — มีแต่ ionized ที่ออกฤทธิ์", "Corrected Ca = measured Ca + 0.8 × (4.0 − albumin) แต่ถ้าสงสัยให้ส่ง ionized ตรง ๆ", "ด่างทำให้ ionized calcium ตก จึงเกิดมือจีบเกร็งตอนหายใจเร็วทั้งที่ total ปกติ", "ดูดกลับ PCT 60% · TAL 25% · DCT 15% — loop diuretic ขับแคลเซียมออก ส่วน thiazide เก็บแคลเซียมไว้", "FHH แยกจาก primary hyperparathyroidism ด้วยแคลเซียมในปัสสาวะที่ต่ำ และไม่ต้องผ่าตัด"], "items": [{"id": "NEPHRO-05-02-Q1", "kind": "own", "stem": "A 60-year-old man with alcoholic cirrhosis has serum total calcium 7.2 mg/dL (8.6-10.2), albumin 2.0 g/dL, phosphate 3.4 mg/dL and a normal QTc. He has no perioral tingling, no cramps and negative Chvostek and Trousseau signs. What is the most appropriate interpretation?", "choices": ["This confirms hypoparathyroidism and long-term calcitriol should be started", "This confirms vitamin D deficiency and high-dose ergocalciferol should be started empirically", "The low total calcium reflects hypoalbuminaemia; ionized calcium should be measured and is likely normal", "The result is invalid and the specimen must be redrawn in a heparinised tube", "This is true symptomatic hypocalcaemia and intravenous calcium gluconate should be given now"], "answer": 2, "explain": "**อัลบูมิน 2.0 g/dL ต่ำกว่าปกติ 2 g/dL** — แคลเซียมที่จับกับโปรตีน (40% ของทั้งหมด) จึงหายไปด้วย ทำให้ **total calcium ต่ำโดยที่ ionized calcium ยังปกติ** ผู้ป่วยจึง **ไม่มีอาการ Chvostek/Trousseau ลบ และ QTc ปกติ** · ใช้สูตรแก้ **corrected Ca = 7.2 + 0.8 × (4.0 − 2.0) = 8.8 mg/dL** ซึ่งอยู่ในเกณฑ์ปกติ และยืนยันได้ด้วยการส่ง **ionized calcium**\n\n- **ให้แคลเซียมทางหลอดเลือดดำ** ในคนที่ ionized ปกติ เสี่ยงต่อ **แคลเซียมเกินและการตกตะกอนแคลเซียมฟอสเฟต** โดยไม่ได้ประโยชน์\n- **ตัวอย่างเลือดไม่ได้เสีย** — ค่าที่ได้ถูกต้องตามที่วัด เพียงแต่ต้องแปลผลร่วมกับอัลบูมิน (อนึ่ง **หลอด heparin คือหลอดที่ใช้ส่ง ionized calcium** ไม่ใช่หลอดที่ทำให้ผลใช้ไม่ได้)\n- **Hypoparathyroidism** ต้องมี **ฟอสเฟตสูง** ร่วมด้วยและ PTH ต่ำ — รายนี้ฟอสเฟตปกติและยังไม่ได้ส่ง PTH\n- **ขาดวิตามินดี** เป็นไปได้ในผู้ป่วยตับแข็ง แต่ **วินิจฉัยจาก total calcium ที่ต่ำเทียม ๆ ไม่ได้** ต้องวัด 25(OH)D ก่อนเริ่มยา", "pearl": "อัลบูมินต่ำลง 1 g/dL ทำให้ total calcium ต่ำลงราว 0.8 mg/dL โดยที่ ionized ไม่เปลี่ยน — ไม่มีอาการก็อย่ารีบรักษา", "topic": "อ่านค่าแคลเซียมให้เป็น และไตจัดการแคลเซียมอย่างไร", "src": "", "ref": [], "nl": ["B9.3(5)", "B9.2.5(2)"]}]}, {"id": "nephro-05-03", "title": "Hypercalcemia — สาเหตุและการไล่วินิจฉัย", "minutes": 10, "summary": "สองกลุ่มใหญ่คือ PTH-mediated กับ non-PTH · อาการทุกระบบ · แยกด้วย intact PTH ก่อนเสมอ", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.1.2(8)", "2.3.2"], "md": "### ขั้นแรกเสมอ — ส่ง **intact PTH** แล้วแยกเป็นสองโลก\n\n| | **PTH สูงหรือสูงไม่เหมาะสม (ปกติแต่ไม่ควรปกติ)** | **PTH ถูกกดต่ำ** |\n|---|---|---|\n| แปลว่า | **PTH-mediated hypercalcemia** | **non-PTH-mediated** — ต้องหาสาเหตุอื่น |\n| คิดถึง | **Primary hyperparathyroidism** (adenoma · hyperplasia · carcinoma · **MEN 1 และ 2a**) · **FHH** · lithium | **มะเร็ง** · **granulomatous disease** · **วิตามินดีหรือวิตามินเอเกิน** · immobilization · thyrotoxicosis · milk-alkali |\n\n> **PTH ที่ \"ปกติ\" ในคนที่แคลเซียมสูงถือว่าผิดปกติ** เพราะต่อมพาราไทรอยด์ที่ทำงานถูกต้องต้องถูกกดจนแทบวัดไม่ได้ — นี่คือจุดที่คนพลาดบ่อยที่สุดของหัวข้อนี้\n\n### กลุ่มมะเร็ง — 4 กลไก\n| กลไก | รายละเอียด | ตัวอย่าง |\n|---|---|---|\n| **Humoral hypercalcemia of malignancy (HHM)** | ก้อนหลั่ง **PTHrP** ออกฤทธิ์เหมือน PTH | squamous cell carcinoma ของปอด · ศีรษะและคอ · ไต · เต้านม |\n| **Local osteolytic hypercalcemia (LOH)** | กระดูกถูกทำลายเฉพาะที่จากก้อนที่แพร่มา | **multiple myeloma** · มะเร็งเต้านม |\n| **ก้อนสร้าง 1,25(OH)₂D เอง** | เนื้องอกเปลี่ยน 25(OH)D เป็นรูปออกฤทธิ์ | **lymphoma** · germinoma |\n| **หลั่ง PTH นอกตำแหน่ง** | พบน้อยมาก | เนื้องอกบางชนิด |\n\n**HHM ให้ภาพเหมือน hyperparathyroidism ทุกอย่าง** — แคลเซียมสูง ฟอสเฟตต่ำ — **ต่างกันที่ intact PTH ถูกกด** (เพราะการตรวจไม่จับ PTHrP) จึงต้องส่ง **PTHrP** แยกต่างหากเมื่อสงสัย\n\n### กลุ่ม granulomatous — กลไกเดียวกันหมด\n**Macrophage ใน granuloma มี 1α-hydroxylase ของตัวเอง** และ **ไม่ถูกควบคุมด้วยวงป้อนกลับปกติ** จึงเปลี่ยน 25(OH)D เป็น 1,25(OH)₂D ได้ไม่จำกัด → ดูดซึมแคลเซียมจากลำไส้มากเกิน · โรคที่พบ: **sarcoidosis · วัณโรค · โรคเรื้อน · histoplasmosis · coccidioidomycosis · berylliosis · silicone granuloma · eosinophilic granuloma** · **จึงตอบสนองต่อ glucocorticoid ได้ดีมาก**\n\n### ยาที่ทำให้แคลเซียมสูง\n**Thiazide** (เพิ่มการดูดกลับที่ DCT) · **lithium** (เลื่อน set point ของ CaSR) · **milk-alkali syndrome** (แคลเซียมคาร์บอเนตปริมาณมาก → แคลเซียมสูง + **เมตะบอลิกแอลคาโลซิส + ไตวาย**) · วิตามินดี · **วิตามินเอ** · teriparatide · foscarnet · growth hormone · estrogen/SERM · theophylline เป็นพิษ\n\n### อาการ — \"stones, bones, groans, moans\"\n| ระบบ | อาการ |\n|---|---|\n| **ทั่วไป** | อ่อนเพลีย ไม่มีแรง |\n| **ระบบประสาทและจิตใจ** | สมาธิสั้น ความจำเสีย ปวดศีรษะ ซึม สับสน หงุดหงิด ซึมเศร้า หวาดระแวง ประสาทหลอน **จนถึง stupor และโคม่า** |\n| **กล้ามเนื้อและข้อ** | อ่อนแรง **hyporeflexia** ปวดกล้ามเนื้อ ปวดข้อ **ปวดกระดูก** chondrocalcinosis |\n| **ทางเดินอาหาร** | เบื่ออาหาร ปากแห้ง **กระหายน้ำ** คลื่นไส้ อาเจียน **ท้องผูก** ปวดท้อง น้ำหนักลด **ตับอ่อนอักเสบ** แผลในกระเพาะ |\n| **ไต** | **ปัสสาวะมาก ปัสสาวะกลางคืน** (แคลเซียมสูงทำให้เกิด nephrogenic DI) **นิ่วไต** nephrocalcinosis interstitial nephritis **AKI และ CKD** |\n| **หัวใจ** | **QT สั้น** หัวใจเต้นช้า AV block ระดับ 1 หัวใจเต้นผิดจังหวะ **ความดันสูง** หลอดเลือดมีหินปูน |\n| **ตกตะกอนตามอวัยวะ** | **band keratopathy** ตาแดง เยื่อบุตามีหินปูน คัน |\n\n> **วงจรอันตรายที่ต้องเข้าใจ** — แคลเซียมสูง → **nephrogenic DI ทำให้ปัสสาวะมาก** + คลื่นไส้อาเจียนกินไม่ได้ → **ขาดน้ำ** → GFR ตก → **ขับแคลเซียมได้น้อยลง → แคลเซียมยิ่งสูง** · นี่คือเหตุผลที่การรักษาอันดับแรกคือ **สารน้ำ** ไม่ใช่ยาลดแคลเซียม\n\n### กับดักที่คนพลาดจริง\n- **แคลเซียมสูงในผู้ป่วยนอกที่ไม่มีอาการ ส่วนใหญ่คือ primary hyperparathyroidism** แต่ **แคลเซียมสูงในผู้ป่วยในที่มีอาการและเป็นเร็ว ส่วนใหญ่คือมะเร็ง** — สองบริบทให้คำตอบคนละข้อ\n- **ผู้สูงอายุ + ปวดหลัง + ซีด + ไตวาย + แคลเซียมสูง + รอยโรคกระดูกแบบ lytic** = **multiple myeloma** ต้องส่ง SPEP/UPEP และ serum free light chain\n- **ห้ามให้ยาขับปัสสาวะก่อนให้สารน้ำ** — ผู้ป่วยขาดน้ำอยู่แล้ว การให้ furosemide ก่อนจะทำให้แคลเซียมยิ่งสูง", "pearls": ["ส่ง intact PTH ก่อนเสมอ — PTH ที่ 'ปกติ' ในคนแคลเซียมสูงถือว่าผิดปกติ", "ผู้ป่วยนอกไม่มีอาการคิด primary hyperparathyroidism · ผู้ป่วยในมีอาการเป็นเร็วคิดมะเร็ง", "HHM จาก PTHrP ให้ภาพเหมือน hyperparathyroidism แต่ intact PTH ถูกกด — ต้องส่ง PTHrP แยก", "Granulomatous disease สร้าง 1,25(OH)₂D เองจาก macrophage จึงตอบสนอง steroid ดีมาก", "แคลเซียมสูงทำให้เกิด nephrogenic DI → ขาดน้ำ → GFR ตก → แคลเซียมยิ่งสูง เป็นวงจร"], "items": [{"id": "N-MCQ-01", "kind": "mcq", "stem": "A 62-year-old woman is found to have a serum calcium of 11.2 mg/dL (normal 8.6-10.2) on a routine health check-up. She has no symptoms, takes no medication and no vitamin supplements. Serum phosphate is 2.1 mg/dL (normal 2.7-4.5), albumin 4.2 g/dL, creatinine 0.9 mg/dL. Which of the following is the most likely cause of her hypercalcaemia?", "choices": ["Vitamin D intoxication", "Primary hyperparathyroidism", "Thyrotoxicosis", "Malignancy with bone metastasis", "Milk-alkali syndrome"], "answer": 1, "explain": "กลไกและหลักการแยก: **primary hyperparathyroidism (PHPT)** เป็นสาเหตุอันดับหนึ่งของ hypercalcemia ใน **ผู้ป่วยนอก/คนที่ไม่มีอาการ** (ส่วนใหญ่มาจาก solitary parathyroid adenoma) ขณะที่ **malignancy เป็นอันดับหนึ่งในผู้ป่วยใน (inpatient)** — นี่คือจุดที่ข้อสอบหลอกโดยสลับบริบท\n\nสรีรวิทยาที่ต้องใช้ตัดสินในโจทย์นี้: PTH ส่วนเกินออกฤทธิ์\n- **กระดูก**: กระตุ้น osteoclast (ผ่าน RANKL บน osteoblast) → ปล่อย Ca และ PO4\n- **ไต**: เพิ่มการดูดซึม **Ca** กลับที่ distal tubule แต่ **ยับยั้ง NaPi cotransporter ที่ proximal tubule → ขับ phosphate ออก**\n- **ลำไส้**: กระตุ้น 1α-hydroxylase → **calcitriol สูง** → ดูดซึม Ca เพิ่ม\n→ ผลคือ **Ca สูง + PO4 ต่ำ** ซึ่งตรงกับโจทย์ (PO4 2.1) = ลายเซ็นของ PTH-mediated hypercalcemia\n\nทำไมข้ออื่นผิด:\n- **Malignancy**: มักมีอาการ (น้ำหนักลด ปวดกระดูก) และ **มาเร็ว Ca สูงมาก**; กลไกหลักคือ **PTH-rP** (humoral hypercalcemia of malignancy) ซึ่งก็ทำให้ PO4 ต่ำได้ แต่ **PTH จะถูกกด** และผู้ป่วยไม่ใช่ภาพ \"ตรวจสุขภาพแล้วเจอโดยไม่มีอาการ\"\n- **Milk-alkali syndrome**: จากการกิน calcium carbonate/ยาลดกรดปริมาณมาก → Ca สูง, **metabolic alkalosis, ไตวาย** และ **PO4 มักปกติหรือสูง**; โจทย์ระบุว่าไม่กินอาหารเสริมและ Cr ปกติ\n- **Vitamin D intoxication**: calcitriol สูงจะเพิ่มการดูดซึมทั้ง Ca **และ PO4** จากลำไส้ → **PO4 สูงหรือปกติ ไม่ใช่ต่ำ**; และโจทย์บอกว่าไม่กินวิตามิน\n- **Thyrotoxicosis**: thyroid hormone เพิ่ม bone turnover → Ca สูงได้เล็กน้อย แต่ต้องมีอาการ hyperthyroid (น้ำหนักลด ใจสั่น ขี้ร้อน มือสั่น) และ PO4 มักปกติ\n\nขั้นต่อไปทางคลินิก: **วัด intact PTH** — ถ้า **สูงหรือ inappropriately normal** → PTH-dependent (PHPT, tertiary HPT, familial hypocalciuric hypercalcemia); ถ้า **ถูกกด** → PTH-independent (malignancy, vitamin D, granulomatous disease, myeloma, ยา)", "pearl": "แยก PHPT จาก **familial hypocalciuric hypercalcemia (FHH)** ด้วย **24-hour urine calcium และ calcium/creatinine clearance ratio** (FHH ขับ Ca ในปัสสาวะต่ำ <0.01) เพราะ FHH **ไม่ต้องผ่าตัด** — ถ้าผ่าไปจะไม่หาย", "topic": "Most common cause of hypercalcaemia – outpatient vs inpatient", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 2 – Most common cause of hypercalcemia in out patient (choices: milk-alkali, medication, malignancies, primary hyperparathyroid)", "MED31 past paper – ผู้ป่วยอายุ 70 ปี ไม่มีอาการ ตรวจสุขภาพพบ Ca 11 mg/dl (8.6-10.2) PO4 1.1 (2.7-4.5) ไม่มีประวัติใช้ยา สาเหตุของ hypercalcemia", "MED31 MCQ – Ans hypercalcemia", "MED30 สรุป – parathyroid → hypercalcemia", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia"], "nl": ["B9.2.5(2)", "B9.3(5)", "B9.1.2(4)"]}, {"id": "N-OLD-001", "kind": "old", "stem": "What is the most common cause of hypercalcaemia in the outpatient setting?", "choices": ["Milk-alkali syndrome", "Thiazide diuretic", "Primary hyperparathyroidism", "Malignancy", "Vitamin D intoxication"], "answer": 2, "explain": "**ผู้ป่วยนอก = primary hyperparathyroidism (มักไม่มีอาการ ตรวจเจอโดยบังเอิญ) ส่วนผู้ป่วยใน = มะเร็ง** (PTHrP, osteolytic metastasis, myeloma) ซึ่งมักมีอาการชัดและ Ca สูงเร็ว — สองสาเหตุนี้รวมกันกว่า 90% ของ hypercalcaemia ทั้งหมด", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 2", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)", "B9.1.2(4)"]}, {"id": "N-OLD-002", "kind": "old", "stem": "A 70-year-old asymptomatic man has calcium 11.0 mg/dL (8.6-10.2) and phosphate 1.1 mg/dL (2.7-4.5) with no drug history. What is the most likely cause?", "choices": ["Malignancy-associated hypercalcaemia", "Thyrotoxicosis", "Vitamin D intoxication", "Familial hypocalciuric hypercalcaemia", "Primary hyperparathyroidism"], "answer": 4, "explain": "**Ca สูงคู่กับ PO4 ต่ำ = PTH ทำงานมากเกิน** เพราะ PTH เพิ่มการขับฟอสเฟตที่ท่อไตส่วนต้น; ถ้าเป็นมะเร็งหรือได้วิตามินดีเกิน ฟอสเฟตมักปกติหรือสูง — ต้องยืนยันด้วย **intact PTH ที่สูงหรือสูงไม่เหมาะสม** และตรวจ 24-hour urine calcium เพื่อแยก FHH", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "B9.3(5)"]}, {"id": "N-OLD-003", "kind": "old", "stem": "A patient with bone metastases presents with drowsiness, polyuria and constipation. Which electrolyte abnormality is most likely?", "choices": ["Hypophosphataemia", "Hypercalcaemia", "Hyponatraemia", "Hypokalaemia", "Hypermagnesaemia"], "answer": 1, "explain": "**อาการของ hypercalcaemia จำว่า 'stones, bones, abdominal groans, psychic moans'** — ปัสสาวะมากเพราะแคลเซียมสูงทำให้ไตตอบสนองต่อ ADH ลดลง (nephrogenic DI) จึงขาดน้ำและ Ca ยิ่งสูงขึ้นเป็นวงจร", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 7 / MED31 MCQ", "ref": [], "nl": ["B9.2.5(2)", "2.1.42", "2.3.2"]}, {"id": "N-OLD-004", "kind": "old", "stem": "A woman has calcium 12.5 mg/dL with phosphate 1.9 mg/dL and elevated intact PTH. What is the mechanism?", "choices": ["Excess parathyroid hormone increasing bone resorption, renal calcium reabsorption and phosphate excretion", "Increased calcitonin secretion", "Increased intestinal calcium absorption from vitamin D excess", "Osteolytic metastasis releasing calcium", "Reduced renal calcium excretion from thiazide"], "answer": 0, "explain": "**PTH ออกฤทธิ์ 3 ที่**: สลายกระดูก, ดูดแคลเซียมกลับที่ distal tubule, และ **ขับฟอสเฟตทิ้ง** พร้อมกระตุ้น 1-alpha-hydroxylase ให้สร้าง calcitriol เพิ่มการดูดซึมแคลเซียมที่ลำไส้ — จึงได้ภาพ Ca สูง PO4 ต่ำ", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 48", "ref": [], "nl": ["B9.1.2(8)", "B9.2.5(2)"]}, {"id": "N-OLD-014", "kind": "old", "stem": "A 77-year-old woman has severe back pain, anaemia, creatinine 2.8 mg/dL and calcium 12.8 mg/dL with lytic bone lesions. What is the most likely diagnosis?", "choices": ["Multiple myeloma", "Paget disease of bone", "Metastatic prostate cancer", "Primary hyperparathyroidism", "Osteoporosis with vertebral fracture"], "answer": 0, "explain": "**CRAB** = hyperCalcaemia, Renal failure, Anaemia, Bone lesion → multiple myeloma; ส่งต่อด้วย **serum/urine protein electrophoresis, free light chain, skeletal survey หรือ low-dose CT และไขกระดูก**; ต่างจาก primary hyperparathyroidism ซึ่งไม่ทำให้ซีดและรอยโรคกระดูกเป็นแบบ subperiosteal resorption", "pearl": "", "topic": "", "src": "MED30 MCQ ข้อ 38 / MED35 สอบลงกองครั้งที่ 1 MCQ", "ref": [], "nl": ["2.3.2", "B9.2.5(2)", "B9.2.7(1)"]}]}, {"id": "nephro-05-04", "title": "Hypercalcemia — การรักษาตามลำดับ", "minutes": 8, "summary": "สารน้ำก่อนเสมอ · calcitonin ซื้อเวลา · bisphosphonate คือตัวจริง · steroid เฉพาะบางกลุ่ม", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.4(2)", "2.3.2"], "md": "**ความรุนแรงเป็นตัวกำหนดความเร่งด่วน** — แต่สิ่งที่ตัดสินจริงคือ **อาการ** และ **ความเร็วที่แคลเซียมขึ้น** ไม่ใช่ตัวเลขอย่างเดียว · แคลเซียมที่ค่อย ๆ ขึ้นถึง 12 mg/dL อาจไม่มีอาการเลย ขณะที่ขึ้นเร็วถึง 12 ในไม่กี่วันทำให้ซึมได้\n\n### ลำดับการรักษา\n\n**1 · สารน้ำ — ทำก่อนเสมอ**\n- **0.9% NaCl 200 – 500 mL/ชั่วโมง** ปรับตามสภาพหัวใจและไตของผู้ป่วย\n- **กลไก** — แก้ภาวะขาดน้ำ ฟื้น GFR และ **การที่โซเดียมถูกขับออกมากจะพาแคลเซียมออกไปด้วย** (แคลเซียมตามโซเดียมที่ PCT และ TAL)\n- **ผลข้างเคียงที่ต้องระวังคือน้ำเกินจนหัวใจล้มเหลว** โดยเฉพาะผู้สูงอายุและผู้ป่วยไตเสื่อม\n\n**2 · Furosemide — เฉพาะเมื่อให้สารน้ำเพียงพอแล้ว**\n- **20 – 40 mg IV หลังจากแก้ภาวะขาดน้ำได้แล้วเท่านั้น**\n- กลไก: ยับยั้ง NKCC2 ที่ TAL → ลบแรงดันไฟฟ้าบวกในท่อ → ขับแคลเซียมออก\n- **ผลข้างเคียง: ขาดน้ำซ้ำ · โพแทสเซียมต่ำ · แมกนีเซียมต่ำ**\n- **ห้ามใช้เป็นตัวแรก** — ถ้าให้ตอนยังขาดน้ำจะยิ่งทำให้ GFR ตกและแคลเซียมสูงขึ้น\n\n**3 · Calcitonin — ตัวที่ออกฤทธิ์เร็วที่สุด ใช้ซื้อเวลา**\n- **4 – 8 U/kg ฉีดใต้ผิวหนังหรือเข้ากล้าม ทุก 12 ชั่วโมง**\n- ลดแคลเซียมได้ภายใน **4 – 6 ชั่วโมง** (เร็วกว่า bisphosphonate ที่ต้องรอ 2 – 4 วัน) แต่ลดได้เพียง 1 – 2 mg/dL\n- **ข้อจำกัดสำคัญคือ escape phenomenon** — ประสิทธิภาพหายไปภายใน **48 ชั่วโมง** เพราะตัวรับถูก downregulate **จึงต้องให้คู่กับ bisphosphonate เสมอ ไม่ใช่ให้เดี่ยว**\n- ผลข้างเคียง: หน้าแดง คลื่นไส้\n\n**4 · Bisphosphonate ทางหลอดเลือดดำ — ยาหลักของ hypercalcemia จากมะเร็ง**\n| ยา | ขนาด | หมายเหตุ |\n|---|---|---|\n| **Zoledronate** | **4 mg IV ใน 15 นาที** ผสมใน NSS 50 mL | แรงกว่าและให้เร็วกว่า เป็นตัวเลือกแรกในมะเร็ง |\n| **Pamidronate** | **60 – 90 mg IV ใน 2 ชั่วโมง** ผสมใน NSS หรือ D5W 50 – 200 mL | ทางเลือกเมื่อไม่มี zoledronate |\n\n- **กลไก: ยับยั้ง osteoclast** จึงหยุดการปล่อยแคลเซียมออกจากกระดูก\n- **ออกฤทธิ์ช้า — เริ่มเห็นผล 24 – 48 ชั่วโมง เต็มที่ 2 – 4 วัน** จึงต้องให้พร้อมสารน้ำและ calcitonin ตั้งแต่ต้น\n- **ผลข้างเคียง: AKI (ต้องปรับขนาดตาม GFR) · อาการคล้ายไข้หวัดชั่วคราว · กระดูกขากรรไกรตาย (ONJ) เมื่อใช้ยาว**\n\n**5 · ยาอันดับรอง**\n- **Glucocorticoid** — เช่น prednisone **60 mg ต่อวัน นาน 10 วัน** · **ได้ผลเฉพาะกลุ่มที่แคลเซียมสูงจาก 1,25(OH)₂D เกิน** คือ **granulomatous disease, lymphoma และวิตามินดีเกิน** เพราะกด 1α-hydroxylase · **ไม่ได้ผลใน primary hyperparathyroidism และ HHM**\n- **Denosumab 120 mg** วันที่ 1, 8, 15, 29 แล้วทุก 4 สัปดาห์ — **ใช้เมื่อ bisphosphonate ใช้ไม่ได้เพราะไตเสื่อม หรือดื้อต่อ bisphosphonate** · ผลข้างเคียง: **แคลเซียมต่ำ ฟอสเฟตต่ำ ONJ กระดูกต้นขาหักผิดปกติ**\n- **Calcimimetic (cinacalcet)** — สำหรับ parathyroid carcinoma และ hyperparathyroidism ที่ผ่าตัดไม่ได้\n- **ฟอกเลือดด้วยน้ำยาที่มีแคลเซียมต่ำ** — เมื่อแคลเซียมสูงมากร่วมกับไตวายหรือหัวใจล้มเหลวจนให้สารน้ำไม่ได้\n\n### กับดักที่คนพลาดจริง\n- **ให้ furosemide ก่อนสารน้ำ** คือความผิดพลาดที่พบบ่อยที่สุดของหัวข้อนี้\n- **ให้ calcitonin เดี่ยวแล้วคิดว่าจบ** — escape ใน 48 ชั่วโมง ต้องมี bisphosphonate ตามเสมอ\n- **ให้ steroid ใน HHM** ไม่ได้ผล เพราะกลไกไม่ได้ผ่านวิตามินดี\n- **ลืมรักษาต้นเหตุ** — hypercalcemia จากมะเร็งคือ **สัญญาณพยากรณ์โรคที่แย่** การรักษาที่ยั่งยืนคือรักษามะเร็ง\n- **ผู้ป่วยที่ได้ digoxin ต้องระวังเป็นพิเศษ** เพราะแคลเซียมสูงเสริมฤทธิ์ digoxin จนเกิดหัวใจเต้นผิดจังหวะ", "pearls": ["ลำดับคือสารน้ำ → calcitonin ซื้อเวลา → bisphosphonate ตัวจริง · furosemide เฉพาะหลังให้สารน้ำพอแล้ว", "Calcitonin ออกฤทธิ์ใน 4–6 ชม. แต่ escape ใน 48 ชม. จึงห้ามให้เดี่ยว", "Zoledronate 4 mg IV 15 นาที ออกฤทธิ์เต็มที่ 2–4 วัน — ต้องปรับตาม GFR", "Steroid ได้ผลเฉพาะแคลเซียมสูงจาก 1,25(OH)₂D เกิน คือ granulomatous disease, lymphoma และวิตามินดีเกิน", "Denosumab เป็นทางเลือกเมื่อไตเสื่อมจนให้ bisphosphonate ไม่ได้"], "items": [{"id": "N-MCQ-02", "kind": "mcq", "stem": "A 68-year-old woman with known breast cancer presents with 5 days of progressive drowsiness, polyuria, constipation and vomiting. Vital signs: PR 104/min, BP 96/62 mmHg, dry mucous membranes. Laboratory results: corrected calcium 14.8 mg/dL, phosphate 4.6 mg/dL, creatinine 2.6 mg/dL (baseline 0.8), intact PTH 4 pg/mL (low), albumin 3.2 g/dL. Which of the following is the most appropriate initial treatment?", "choices": ["Haemodialysis", "Intravenous furosemide to promote calciuresis before fluid replacement", "Intravenous zoledronic acid as the single first step", "Intravenous isotonic saline to restore intravascular volume", "Subcutaneous calcitonin alone"], "answer": 3, "explain": "กลไกของวงจรเลวร้ายที่ต้องเข้าใจ: hypercalcemia → **ยับยั้ง NKCC2 ที่ thick ascending limb ผ่าน calcium-sensing receptor** และ **ทำให้ collecting duct ดื้อต่อ ADH (nephrogenic diabetes insipidus)** → **polyuria → volume depletion**\n→ เมื่อ volume ต่ำ ไตจะ **ดูดซึม Na กลับมากขึ้นที่ proximal tubule และ Ca ตามมาด้วย (paracellular, ตาม Na/น้ำ)** → **ขับ Ca ออกได้น้อยลง → Ca ยิ่งสูง** → ปัสสาวะออกมากขึ้น → วนซ้ำ\n\n**ดังนั้นการรักษาลำดับแรกคือ \"เติมน้ำ\" ด้วย IV isotonic saline** — แก้ทั้ง volume depletion, เพิ่ม GFR, และ **เพิ่มการขับ Ca ทางปัสสาวะ** ทำให้ Ca เริ่มลงภายในชั่วโมงแรกๆ และยังช่วยแก้ prerenal AKI\n\n**ลำดับการรักษาทั้งชุด**: (1) **IV isotonic saline** (2) **calcitonin** สำหรับผลเร็วใน 12-48 ชม. แต่เกิด **tachyphylaxis** จึงใช้เป็นสะพาน (3) **bisphosphonate (zoledronic acid) หรือ denosumab** สำหรับผลยั่งยืน (onset 2-4 วัน) เพราะกลไกคือยับยั้ง osteoclast-mediated bone resorption ซึ่งเป็นต้นเหตุใน malignancy (4) รักษามะเร็งต้นเหตุ (5) **หยุด thiazide, calcium และ vitamin D**\n\nทำไมข้ออื่นผิด:\n- **Zoledronic acid เป็นขั้นแรกเดี่ยวๆ**: onset ช้า 2-4 วัน (แก้ภาวะฉุกเฉินไม่ทัน) และ **มี nephrotoxicity** — การให้ขณะที่ยัง volume depleted และ Cr 2.6 เสี่ยงทำให้ไตแย่ลง; ต้องให้**หลัง**เติมน้ำและปรับขนาดตาม renal function (ถ้า GFR ต่ำมากพิจารณา **denosumab** แทนเพราะไม่ถูกขับทางไต)\n- **Furosemide ก่อนเติมน้ำ**: ผิดกลไกอย่างร้ายแรง — loop diuretic ยับยั้ง NKCC2 ทำให้ขับ Ca จริง แต่การให้ในผู้ป่วยที่ **volume depleted อยู่แล้ว** จะยิ่งทำให้ volume ลด → Ca สูงขึ้นและไตแย่ลง; ปัจจุบัน **ไม่แนะนำเป็นกิจวัตร** ใช้เฉพาะเมื่อเกิด volume overload จากการให้น้ำ\n- **Hemodialysis**: สงวนไว้เมื่อ Ca สูงรุนแรงร่วมกับ **ไตวายที่ให้น้ำไม่ได้ (oliguric/volume overload)** หรือมีอาการทางระบบประสาท/หัวใจรุนแรงที่ไม่ตอบสนอง — ไม่ใช่ขั้นแรกในผู้ป่วยที่ยังให้น้ำได้\n- **Calcitonin เดี่ยวๆ**: ลด Ca ได้เพียง 1-2 mg/dL และหมดฤทธิ์ใน 48 ชม. จาก tachyphylaxis — ใช้เป็น adjunct ไม่ใช่การรักษาหลัก", "pearl": "อาการของ hypercalcemia จำด้วย **\"stones, bones, groans, thrones, psychiatric overtones\"** (นิ่วไต, ปวดกระดูก, ปวดท้อง/ท้องผูก, ปัสสาวะมาก, ซึม/สับสน). ถ้าเป็นมะเร็งร่วมกับ **CRAB (hyperCalcemia, Renal failure, Anemia, Bone lesion)** ต้องนึกถึง **multiple myeloma**", "topic": "Symptomatic hypercalcaemia of malignancy with AKI – management", "src": "", "ref": ["MED32 MEQ ข้อ 2 – Symptomatic hypercalcemia from malignancy with acute kidney injury: แปลผลแลป (anemia, mild hyponatremia, hypokalemia, hypercalcemia), definitive diagnosis, ให้การรักษาภาวะ hypercalcemia, และ normal saline ช่วยลด hypercalcemia อย่างไร", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia", "MED30 MCQ ข้อ 38 – Ca สูง มี sign ของ MM (CRAB: hypercalcemia, renal failure, anemia, osteolytic bone lesion)", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 94 – หญิง 77 ปี ปวดหลังมาก hypercalcemia CRAB → Multiple myeloma"], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.14(3)"]}, {"id": "N-OLD-013", "kind": "old", "stem": "A patient with metastatic cancer has calcium 14 mg/dL, drowsiness and creatinine 2.4 mg/dL. What is the correct order of treatment?", "choices": ["Bisphosphonate first, then fluids", "Furosemide first in all patients", "Intravenous isotonic saline first, then a bisphosphonate (with calcitonin for rapid effect)", "Oral prednisolone alone", "Haemodialysis as first-line therapy"], "answer": 2, "explain": "**Hypercalcaemia รุนแรงเริ่มด้วยสารน้ำ isotonic ปริมาณมาก** เพื่อแก้ภาวะขาดน้ำและเพิ่มการขับแคลเซียม แล้วจึงให้ **bisphosphonate (ออกฤทธิ์ใน 2-4 วัน)** และ **calcitonin เมื่อต้องการผลเร็วภายในชั่วโมง**; **furosemide ให้เฉพาะเมื่อมีน้ำเกินแล้ว** ไม่ใช่ยาหลัก และฟอกเลือดสงวนไว้เมื่อไตวายหรือรุนแรงมาก", "pearl": "", "topic": "", "src": "MED32 MEQ ข้อ 2", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "B9.4(1)"]}]}, {"id": "nephro-05-05", "title": "Hypocalcemia — จาก PTH, วิตามินดี, แมกนีเซียม หรือฟอสเฟตล้น", "minutes": 10, "summary": "ตัด spurious ออกก่อน แล้วไล่ด้วย Mg และ PTH · อาการ tetany และ QTc ยาว · hungry bone syndrome", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.1.2(8)", "2.2.21"], "md": "### ขั้นที่ 1 — ตัด **spurious hypocalcemia** ออกก่อนเสมอ\nอาจารย์ย้ำว่า **ให้ยืนยันด้วย ionized calcium ไม่ใช่พึ่งการปรับตามอัลบูมินอย่างเดียว** (แม้ hypocalcemia เทียมจะพบน้อยกว่า hyperkalemia เทียมและ hyponatremia เทียมก็ตาม) · และมีสารทึบรังสีสองตัวที่รบกวนการตรวจโดยตรง — **gadodiamide และ gadoversetamide** ที่ใช้ใน MRI/MRA **ไปรบกวน colorimetric calcium assay ทำให้ค่าออกมาต่ำเทียม**\n\n### ขั้นที่ 2 — ส่ง **แมกนีเซียม** และ **PTH** พร้อมกัน\n\n| PTH | แปลว่า | คิดถึง |\n|---|---|---|\n| **ต่ำ หรือ \"ปกติ\" อย่างไม่เหมาะสม** | **Hypoparathyroidism** | **หลังผ่าตัดคอ (พบบ่อยที่สุด)** · autoimmune · หลังฉายรังสี · แทรกซึมจากเหล็กหรือทองแดง · **แมกนีเซียมต่ำรุนแรง** หรือ **แมกนีเซียมสูง** · DiGeorge · CaSR activating mutation |\n| **สูง** | ต่อมทำงานปกติแต่แก้ไม่ไหว | **CKD** · **ขาดวิตามินดี** · **pseudohypoparathyroidism** (ดื้อต่อ PTH) |\n\n> **ถ้าแก้แมกนีเซียมแล้วแคลเซียมกลับมาปกติ แปลว่าต้นเหตุคือแมกนีเซียมต่ำ** — เป็นการทดสอบเชิงรักษาที่อาจารย์ระบุไว้ในสไลด์\n\n### สาเหตุที่ต้องจำเป็นกลุ่ม\n- **PTH ไม่พอ** — **หลังผ่าตัดไทรอยด์หรือพาราไทรอยด์** · autoimmune · polyglandular failure type I · การแทรกซึม\n- **ดื้อต่อ PTH** — **pseudohypoparathyroidism** (Albright hereditary osteodystrophy: **หน้ากลม ตัวเตี้ย กระดูกฝ่ามือชิ้นที่ 4 สั้น** ร่วมกับ **แคลเซียมต่ำ ฟอสเฟตสูง แต่ PTH สูง**)\n- **วิตามินดีไม่พอ** — ขาดสารอาหาร ไม่โดนแดด **malabsorption** ตับแข็ง **CKD** (ไตสร้าง 1,25(OH)₂D ไม่ได้)\n- **ฟอสเฟตล้น** — **tumor lysis syndrome** · **rhabdomyolysis** · ไตวาย · **สวนอุจจาระด้วยยาที่มีฟอสเฟต**\n- **แคลเซียมถูกจับหรือถูกดึงไป** — **citrate จากการให้เลือดจำนวนมาก** · **ตับอ่อนอักเสบเฉียบพลัน** (saponification ของไขมันรอบตับอ่อน) · **osteoblastic metastasis** (มะเร็งต่อมลูกหมากและเต้านม)\n- **ยา** — foscarnet · **bisphosphonate โดยเฉพาะเมื่อขาดวิตามินดีอยู่ก่อน** · **denosumab**\n- **Hungry bone syndrome**\n\n### Hungry bone syndrome — ที่อาจารย์อธิบายละเอียด\nเกิด **หลังผ่าตัดพาราไทรอยด์** โดยเฉพาะในผู้ป่วย **ไตวายที่ฟอกเลือดหรือหลังปลูกถ่ายไต** · ส่วนใหญ่มีแคลเซียมต่ำเล็กน้อยและหายเอง แต่บางรายรุนแรงและนาน\n\n**กลไก** — ก่อนผ่าตัดมี **hyperparathyroidism รุนแรงมานาน กระดูกจึงถูกสลายจนพรุน** พอตัดต่อมออก **ฤทธิ์ของ PTH หายไปทันที** กระดูกที่ \"หิว\" จึง **ดูดแคลเซียม ฟอสเฟต และแมกนีเซียมกลับเข้ากระดูกอย่างรวดเร็วผ่าน osteoblast จนเร็วกว่าการสลายกระดูกโดย osteoclast** → **แคลเซียมต่ำ ฟอสเฟตต่ำ และแมกนีเซียมต่ำพร้อมกันทั้งสามตัว** · สไลด์ระบุว่า **มักพบโพแทสเซียมสูงร่วมด้วยโดยยังไม่ทราบกลไก**\n\n> **จุดแยกที่ใช้สอบ** — **hypoparathyroidism หลังผ่าตัดให้ แคลเซียมต่ำ + ฟอสเฟตสูง** ส่วน **hungry bone syndrome ให้ แคลเซียมต่ำ + ฟอสเฟตต่ำ** — ดูฟอสเฟตก็แยกได้ทันที\n\n### อาการ\n| ระบบ | อาการ |\n|---|---|\n| **ประสาทกล้ามเนื้อ** | ชาปลายมือปลายเท้าและรอบปาก · กล้ามเนื้อกระตุกและเป็นตะคริว · **tetany, carpopedal spasm** · **Chvostek sign, Trousseau sign** · **กล่องเสียงและหลอดลมหดเกร็ง** |\n| **ระบบประสาทกลาง** | หงุดหงิด ซึมเศร้า สับสน **ชักเกร็งกระตุกทั้งตัว** · papilledema · หินปูนในสมอง |\n| **หัวใจ** | **QTc ยาว** · หัวใจเต้นผิดจังหวะ · **ความดันต่ำ** · หัวใจล้มเหลว |\n| **ผิวหนังและตา** | ผิวแห้ง ผมหยาบ เล็บเปราะ · **ต้อกระจก** |\n\n### การรักษา\n- **มีอาการ tetany, ชัก, กล่องเสียงหดเกร็ง หรือ QTc ยาวมาก** → **calcium gluconate 10% 10 – 20 mL IV ช้า ๆ ใน 10 นาที** แล้วต่อด้วย drip · **ใช้ calcium gluconate ทางเส้นเลือดส่วนปลายได้ ส่วน calcium chloride ต้องให้ทางเส้นกลางเพราะทำให้เนื้อตายถ้ารั่ว**\n- **แก้แมกนีเซียมให้ได้ก่อนหรือพร้อมกันเสมอ** มิฉะนั้นแคลเซียมจะไม่ขึ้น\n- **ระวังในผู้ป่วยที่ฟอสเฟตสูงอยู่** (tumor lysis, ไตวาย) — การให้แคลเซียมจะเร่ง **การตกตะกอนแคลเซียมฟอสเฟตในเนื้อเยื่อ** ให้เฉพาะเมื่อมีอาการจริงเท่านั้น\n- ระยะยาว: **แคลเซียมและวิตามินดีชนิดออกฤทธิ์ (calcitriol)** โดยเฉพาะใน hypoparathyroidism และ CKD\n\n### กับดักที่คนพลาดจริง\n- **แก้แคลเซียมไม่ขึ้นเลย ให้ตรวจแมกนีเซียม** — ข้อนี้ออกทั้งฝั่งโพแทสเซียมและฝั่งแคลเซียม\n- **ผู้ป่วยได้เลือดปริมาณมากแล้วชาปากและมือจีบ** = **citrate จับแคลเซียมอิสระ** total calcium อาจปกติ ต้องดู ionized\n- **ด่างจากการหายใจเร็วทำให้ ionized ตกจนเกิด tetany** ทั้งที่แคลเซียมรวมปกติ — รักษาด้วยการทำให้หายใจช้าลง ไม่ใช่ให้แคลเซียม", "pearls": ["ตัด spurious ด้วย ionized calcium ก่อน แล้วส่ง Mg กับ PTH พร้อมกัน", "แคลเซียมต่ำ + ฟอสเฟตสูง = PTH ไม่พอหรือฟอสเฟตล้น · แคลเซียมต่ำ + ฟอสเฟตต่ำ = ขาดวิตามินดีหรือ hungry bone", "Hungry bone syndrome หลังตัดพาราไทรอยด์ = แคลเซียม ฟอสเฟต และแมกนีเซียมต่ำพร้อมกันสามตัว", "Pseudohypoparathyroidism: หน้ากลม ตัวเตี้ย กระดูกฝ่ามือที่ 4 สั้น + แคลเซียมต่ำ ฟอสเฟตสูง แต่ PTH สูง", "Calcium gluconate ให้เส้นปลายได้ · calcium chloride ต้องเส้นกลางเพราะทำเนื้อตาย", "ให้เลือดมากแล้วมือจีบ = citrate จับแคลเซียม ต้องดู ionized ไม่ใช่ total"], "items": [{"id": "N-MCQ-04", "kind": "mcq", "stem": "A 54-year-old man with end-stage renal disease on maintenance haemodialysis has a corrected calcium of 7.2 mg/dL, phosphate 6.8 mg/dL, intact PTH 620 pg/mL and alkaline phosphatase 320 U/L. He is not taking calcium or vitamin D supplements. Which of the following best explains his hypocalcaemia?", "choices": ["Reduced renal 1-alpha-hydroxylase activity with hyperphosphataemia-driven suppression of calcitriol synthesis", "Autoimmune destruction of the parathyroid glands", "Reduced dietary calcium intake as the sole mechanism", "Magnesium excess inhibiting parathyroid hormone secretion", "Increased renal calcium excretion from impaired distal tubular reabsorption"], "answer": 0, "explain": "กลไกของ **CKD-mineral and bone disorder (CKD-MBD)** ไล่เป็นลำดับ:\n1. **GFR ลด → ขับ phosphate ไม่ได้ → phosphate retention** (เริ่มเห็นชัดเมื่อ eGFR <30)\n2. Phosphate ที่สูงกระตุ้น **FGF-23** จากกระดูก และ FGF-23 **ยับยั้ง 1α-hydroxylase** ที่ proximal tubule; ร่วมกับ **การสูญเสียเนื้อไตทำให้ 1α-hydroxylase น้อยลงโดยตรง**\n3. ผลคือ **calcitriol (1,25-(OH)2 vitamin D) ต่ำ** → **ดูดซึม Ca ที่ลำไส้ลดลง** → **hypocalcaemia**\n4. นอกจากนี้ phosphate ที่สูง **จับกับ Ca เกิด calcium-phosphate complex ตกตะกอน** → Ca อิสระยิ่งต่ำ (เป็นกลไกเสริมที่สำคัญ)\n5. Ca ต่ำ + PO4 สูง + calcitriol ต่ำ → กระตุ้น **PTH สูงขึ้นเรื้อรัง = secondary hyperparathyroidism** (PTH 620 ในโจทย์) → **bone resorption เพิ่ม (ALP สูง)** เกิด renal osteodystrophy\n\nทำไมข้ออื่นผิด:\n- **Autoimmune parathyroid destruction**: จะให้ **PTH ต่ำ** (hypoparathyroidism) — โจทย์ PTH **สูงถึง 620** ซึ่งตรงข้ามโดยสิ้นเชิง\n- **การกินแคลเซียมน้อยเพียงอย่างเดียว**: ลำพังอาหารไม่พอที่จะทำให้เกิดภาพ PO4 สูง + PTH สูงถึงระดับนี้; ปัญหาแกนคือ **การสร้าง calcitriol ล้มเหลว** ไม่ใช่แค่ปริมาณที่กิน\n- **ขับ Ca ออกทางไตมากขึ้น**: ใน CKD **PTH ที่สูงกลับเพิ่มการดูดซึม Ca** ที่ distal tubule และ GFR ที่ต่ำก็ทำให้ filtered load ของ Ca ลดลง → ไม่ใช่กลไกของ Ca ต่ำใน ESRD\n- **Magnesium สูงกด PTH**: hypermagnesemia พบได้ใน CKD จริง และ Mg **สูงมาก** กด PTH ได้ แต่โจทย์มี **PTH สูงลิ่ว** แสดงว่า parathyroid ตอบสนองเต็มที่ — ขัดกับกลไกนี้\n\nการรักษาตามกลไก: **จำกัด phosphate ในอาหาร + phosphate binder (พิจารณา non-calcium-based ถ้ามี vascular calcification) + active vitamin D หรือ vitamin D analogue + calcimimetic (cinacalcet) เพื่อลด PTH**; ถ้า refractory → **parathyroidectomy**", "pearl": "ระวังภาวะ **tertiary hyperparathyroidism** — ต่อมกลายเป็น autonomous ทำให้ **Ca สูง** ได้ในที่สุด; และระวัง **calciphylaxis** เมื่อ Ca x PO4 product สูงมาก. ข้อสอบชอบถาม \"most common cause of hypocalcemia\" ซึ่งโดยทั่วไปตอบ **iatrogenic/post-surgical (hypoparathyroidism หลังผ่าตัดคอ)** แต่ในบริบท **ESRD ตอบ CKD-MBD**", "topic": "Hypocalcaemia in end-stage renal disease", "src": "", "ref": ["MED33 MCQ – เป็น ESRD > Most common cause of Hypocalcemia > มีชอย low small intestinal absorption, low vitamin D diet, low vitamin D → น่าจะตอบข้อ Phosphate", "MED31 past paper – Which one is the most common cause of hypocalcemia? (choices: iatrogenic, autoimmune, infiltrative disease, maternal neonatal complications, development disorder)", "MED32 SAQ – hypocalcemia", "MED30 สรุป Renal – phosphate, magnesium", "MED28 MED421 – ข้อที่ถาม hyperphosphatemia/hypercalcemia/hyperkalemia ในบริบทไตวาย"], "nl": ["B9.2.7(2)", "B9.1.2(8)", "2.3.14(3)"]}, {"id": "N-MCQ-06", "kind": "mcq", "stem": "A 34-year-old man with massive upper gastrointestinal bleeding receives 12 units of packed red cells and 6 units of fresh frozen plasma over 3 hours. He then develops peri-oral numbness, carpopedal spasm and a positive Trousseau sign. ECG shows a prolonged QT interval. Which electrolyte abnormality is most likely responsible?", "choices": ["Hypocalcaemia", "Hypernatraemia", "Hypermagnesaemia", "Hyperkalaemia", "Hypophosphataemia"], "answer": 0, "explain": "กลไก: **citrate เป็นสารกันเลือดแข็ง (anticoagulant) ในถุงเลือด** โดยออกฤทธิ์ด้วยการ **จับ (chelate) calcium ที่เป็น free ionised Ca2+** ซึ่งเป็น cofactor จำเป็นของ coagulation cascade\n\nในภาวะปกติตับจะ **metabolise citrate เป็น bicarbonate ได้เร็ว** → ไม่เกิดปัญหา แต่เมื่อ\n- ให้เลือดปริมาณมากเร็ว (**massive transfusion**: ≥10 units ใน 24 ชม. หรือ ≥4 units ใน 1 ชม.)\n- หรือผู้ป่วยมี **การทำงานของตับบกพร่อง / hypoperfusion / hypothermia**\n→ citrate สะสม → **จับ ionised calcium ในเลือด → ionised hypocalcaemia** (โดยที่ **total calcium อาจดูปกติ** เพราะ Ca ที่จับกับ citrate ยังถูกนับรวม — จึงต้องวัด **ionised calcium** ไม่ใช่ total)\n\nอาการตรงกับ hypocalcaemia แบบฉบับ: **peri-oral numbness, paraesthesia, carpopedal spasm, Trousseau sign, Chvostek sign, tetany, ชัก, QT ยาว, hypotension และ myocardial depression**\n\nการรักษา: **IV calcium gluconate (หรือ calcium chloride ในภาวะวิกฤต) โดยให้ผ่านคนละเส้นกับเลือด**, อุ่นเลือด/ผู้ป่วยเพื่อแก้ hypothermia, ติดตาม ionised calcium และ ECG\n\nทำไมข้ออื่นผิด — ทุกข้อพบได้ใน massive transfusion แต่ไม่อธิบายอาการชุดนี้:\n- **Hyperkalaemia**: เกิดจาก K ที่รั่วออกจาก RBC ใน stored blood (ยิ่งเก่ายิ่งสูง) — จะให้ **peaked T wave, QRS กว้าง, กล้ามเนื้ออ่อนแรง** ไม่ใช่ tetany และทำให้ **QT สั้น** ไม่ใช่ยาว\n- **Hypernatraemia**: ไม่ใช่ปัญหาเด่นของ transfusion และไม่ทำให้ tetany\n- **Hypophosphataemia**: ทำให้กล้ามเนื้ออ่อนแรง, rhabdomyolysis, hemolysis, respiratory failure — ไม่ใช่ tetany กับ Trousseau sign\n- **Hypermagnesaemia**: จะ **กด** neuromuscular transmission → **DTR หาย, อ่อนแรง, hypotension, bradycardia** ซึ่งตรงข้ามกับภาวะ hyperexcitability ในโจทย์", "pearl": "ภาวะแทรกซ้อนของ massive transfusion ที่ต้องจำ: **hypocalcaemia (citrate), hyperkalaemia, hypothermia, metabolic alkalosis (citrate → bicarbonate) หรือ acidosis จาก hypoperfusion, dilutional coagulopathy, TACO/TRALI**. ข้อสอบ MED ออกทั้ง \"citrate toxicity ทำให้ electrolyte ใดตก\" และ \"ให้เลือดแล้ว volume overload → TACO\"", "topic": "Citrate toxicity after massive transfusion", "src": "", "ref": ["MED31 past paper loop C&D – What electrolyte may fall in level as a result of citrate toxicity from massive blood transfusion? (choices: calcium, phosphorus, sodium, potassium, magnesium)", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 25 – ให้เลือดผ่าตัดแล้วเลือดออกเยอะ → dilutional coagulopathy จาก massive infusion", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 26 – ให้เลือดแล้ว volume overload, CXR เจอ pulmonary edema → TACO"], "nl": ["B9.2.5(2)", "2.2.21"]}, {"id": "N-OLD-007", "kind": "old", "stem": "What is the most common cause of hypocalcaemia in adults?", "choices": ["Iatrogenic post-surgical hypoparathyroidism (e.g. after thyroidectomy)", "Autoimmune hypoparathyroidism", "DiGeorge syndrome", "Pseudohypoparathyroidism", "Infiltrative parathyroid disease"], "answer": 0, "explain": "**สาเหตุที่พบบ่อยที่สุดคือหลังผ่าตัดคอ** (thyroidectomy, parathyroidectomy, neck dissection) จากการตัดหรือทำลายเลือดที่เลี้ยงต่อมพาราไทรอยด์; อาการคือ ชารอบปาก มือจีบเกร็ง **Chvostek และ Trousseau sign** และ QT ยาว — ถ้ามีอาการให้ **IV calcium gluconate** ทันที", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "B9.3(5)"]}, {"id": "N-OLD-008", "kind": "old", "stem": "What is the main mechanism of hypocalcaemia in end-stage renal disease?", "choices": ["Phosphate retention with reduced calcitriol production by the failing kidney", "Increased calcitonin secretion", "Excess intestinal calcium absorption", "Primary parathyroid gland failure", "Excessive urinary calcium loss"], "answer": 0, "explain": "ไตวายทำให้ **ขับฟอสเฟตไม่ได้ (PO4 สูง) และสร้าง 1,25-dihydroxyvitamin D ไม่ได้** → แคลเซียมต่ำ → PTH หลั่งเพิ่มเรื้อรังกลายเป็น **secondary hyperparathyroidism และ renal osteodystrophy**; การรักษาเน้นจำกัดฟอสเฟตในอาหาร ให้ยาจับฟอสเฟต และให้ active vitamin D ตามข้อบ่งชี้", "pearl": "", "topic": "", "src": "MED33 MCQ", "ref": [], "nl": ["B9.2.7(2)", "B9.1.2(8)", "B9.1.2(4)"]}, {"id": "N-OLD-009", "kind": "old", "stem": "Which electrolyte falls as a result of citrate toxicity after massive blood transfusion?", "choices": ["Sodium", "Chloride", "Potassium", "Ionised calcium", "Bicarbonate"], "answer": 3, "explain": "**Citrate ในถุงเลือดจับแคลเซียมอิสระ** และเมื่อให้เลือดปริมาณมากเร็วกว่าที่ตับจะเผาผลาญ citrate ได้ จะเกิด **ionised hypocalcaemia** ทำให้ความดันตกและการแข็งตัวของเลือดแย่ลง — ต้องติดตาม ionised calcium และให้แคลเซียมทดแทนระหว่าง massive transfusion", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "2.2.21", "B9.3(5)"]}, {"id": "N-OLD-012", "kind": "old", "stem": "A patient with a round face, short stature and shortened fourth metacarpals has low calcium, high phosphate and a high PTH level. What is the diagnosis?", "choices": ["Pseudohypoparathyroidism (Albright hereditary osteodystrophy)", "Primary hypoparathyroidism", "Vitamin D deficiency", "Primary hyperparathyroidism", "Renal osteodystrophy"], "answer": 0, "explain": "**Pseudohypoparathyroidism = อวัยวะเป้าหมายดื้อต่อ PTH** (ความผิดปกติของ Gs alpha) จึงได้ **Ca ต่ำ, PO4 สูง แต่ PTH สูง** ต่างจาก hypoparathyroidism จริงที่ PTH ต่ำ; ลักษณะภายนอกคือหน้ากลม ตัวเตี้ย และกระดูกฝ่ามือชิ้นที่ 4-5 สั้น", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 34", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)"]}]}, {"id": "nephro-05-06", "title": "ฟอสเฟต — สมดุลปกติและ hyperphosphatemia", "minutes": 9, "summary": "PCT ดูดกลับ 85% · FE < 15% · FGF-23 และ PTH กด NaPi · tumor lysis คือเหตุฉุกเฉินที่พบบ่อยที่สุด", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.1.2(4)", "B9.2.5(2)", "2.3.2"], "md": "### สมดุลฟอสเฟตปกติ\n- **กินวันละ 800 – 1,200 mg ดูดซึมประมาณสองในสาม** ที่ **duodenum และ jejunum**\n- **แหล่งอาหารต่างกันมาก** — **โปรตีนสัตว์และนมดูดซึมได้ดี** · **ฟอสเฟตในพืชอยู่ในรูป phytate ซึ่งดูดซึมได้แย่** เพราะคนไม่มีเอนไซม์ phytase · **ฟอสเฟตอนินทรีย์ในวัตถุเจือปนอาหารดูดซึมได้ดีที่สุด** → **อาหารแปรรูปทำให้ได้ฟอสเฟตเกินความต้องการมาก** (ประเด็นสำคัญในการให้คำแนะนำผู้ป่วย CKD)\n- **การกระจาย: 80 – 85% อยู่ในกระดูก · 14% ในเซลล์ · เพียง 1% อยู่นอกเซลล์**\n- ดูดซึมผ่าน **paracellular แบบ passive เป็นหลักเมื่อฟอสเฟตปกติ** และเปลี่ยนไปใช้ **transcellular ผ่าน NaPi-2b ซึ่งถูกเหนี่ยวนำโดย 1,25(OH)₂D เมื่อฟอสเฟตต่ำ**\n\n### ไตจัดการฟอสเฟตอย่างไร\n**ไตที่ปกติขับฟอสเฟตได้ถึงวันละ 4,000 mg โดยที่ระดับในเลือดแทบไม่ขึ้น** — เป็นระบบที่มีประสิทธิภาพสูงมาก\n\n| ตำแหน่ง | สัดส่วนที่ดูดกลับ |\n|---|---|\n| **PCT** | **85%** |\n| LOH | 10% |\n| DCT | 3% |\n| Collecting duct | 2% |\n\n- ตัวขนส่งที่ PCT: **NaPi-2a, NaPi-2c และ PiT-2**\n- **FE ฟอสเฟตปกติ < 15%**\n- **FGF-23 (ผ่าน FGFR–klotho) และ PTH (ผ่าน PTH1R) ต่างก็กดการแสดงออกของ NaPi-2a และ NaPi-2c ที่ผิวท่อ → ขับฟอสเฟตออกมากขึ้น**\n- **SGLT2 inhibitor กลับเพิ่มการดูดฟอสเฟตกลับที่ PCT → ฟอสเฟตขึ้นเล็กน้อย**\n\n| เพิ่มการดูดฟอสเฟตกลับ | ลดการดูดฟอสเฟตกลับ |\n|---|---|\n| อาหารฟอสเฟตต่ำ · **1,25(OH)₂D** · ฮอร์โมนไทรอยด์ | **PTH** · **FGF-23** · อาหารฟอสเฟตสูง · **ภาวะเลือดเป็นกรด** · **ขาดโพแทสเซียม** · glucocorticoid · dopamine · estrogen |\n\n### ทำไม CKD ถึงยังไม่มีฟอสเฟตสูงในระยะแรก\n**GFR ตก → กรองฟอสเฟตได้น้อยลง → FGF-23 ขึ้น → กด NaPi-2a/2c → เพิ่ม FE ฟอสเฟตชดเชย** และ **FGF-23 ยังกด 1,25(OH)₂D → เกิด secondary hyperparathyroidism → PTH ที่สูงขึ้นยิ่งช่วยขับฟอสเฟต** · **ฟอสเฟตในเลือดจึงยังปกติจนกว่า GFR จะตกมากจนกลไกชดเชยเอาไม่อยู่** — นี่คือเหตุผลที่ **FGF-23 ขึ้นเป็นความผิดปกติแรกสุดของ CKD-MBD ก่อนที่ฟอสเฟตจะสูง**\n\n### Hyperphosphatemia เฉียบพลัน\n> **อันตรายหลักไม่ใช่ตัวฟอสเฟตเอง แต่คือ hypocalcemia รุนแรงที่ตามมา** และ **การตกตะกอนแคลเซียมฟอสเฟตที่ไต หัวใจ ข้อ และหลอดเลือด** · เมื่อตกตะกอนในท่อไตและเนื้อไตจะเกิด **acute phosphate nephropathy → AKI รุนแรง ซึ่งยิ่งทำให้ขับฟอสเฟตไม่ได้ วนเป็นวงจร**\n\n**สาเหตุ**\n- **Tumor lysis syndrome — สาเหตุฉุกเฉินที่พบบ่อยที่สุด** เซลล์มะเร็งแตกพร้อมกันจำนวนมาก ทั้งเองหรือหลังเริ่มเคมีบำบัดในมะเร็งที่แบ่งตัวเร็ว เช่น **high-grade lymphoma และ leukemia** → ปล่อย **โพแทสเซียม กรดนิวคลีอิก และฟอสเฟต** ออกมา → **โพแทสเซียมสูง · กรดยูริกสูง · ฟอสเฟตสูง และแคลเซียมต่ำตามมา**\n- **Rhabdomyolysis** — กลไกเดียวกันจากการสลายของกล้ามเนื้อ\n- **การสวนอุจจาระหรือยาระบายที่มีโซเดียมฟอสเฟต** โดยเฉพาะการเตรียมลำไส้ก่อนส่องกล้อง — **ต้องระวังอย่างยิ่งในผู้ป่วย CKD**\n- **Fosphenytoin และ bisphosphonate**\n\n### Hyperphosphatemia เรื้อรัง\n- **ไตวายคือสาเหตุที่พบบ่อยที่สุด** — ฟอสเฟตจากอาหารบวกกับที่ถูกปล่อยจากกระดูกโดย PTH มากเกินกว่าที่ไตและการฟอกเลือดมาตรฐานจะขับออกได้\n- **Hypoparathyroidism และ pseudohypoparathyroidism** — PTH ไม่พอจึงดูดฟอสเฟตกลับมาก **มาพร้อมแคลเซียมต่ำ**\n- **FGF-23 ขาดหรือออกฤทธิ์ไม่ได้** — รวมถึง **ยากลุ่ม FGFR inhibitor (erdafitinib, pemigatinib, infigratinib) ซึ่งทำให้ฟอสเฟตสูงเป็น class effect**\n\n### การวินิจฉัย\n> **ในผู้ป่วยฟอสเฟตสูง การวัดฟอสเฟตในปัสสาวะแทบไม่มีประโยชน์** เพราะไตเป็นทางขับที่ควบคุมได้ทางเดียว **ไม่ว่าจะขับออกเท่าไรก็ถือว่าไม่พอ** · ให้มุ่งไปที่ **(1) ทำไมไตถึงขับไม่ได้ และ (2) ฟอสเฟตล้นมาจากไหน** ด้วยประวัติ การตรวจร่างกาย และแล็บพื้นฐานรวมถึงแคลเซียม · ส่ง PTH, 1,25(OH)₂D หรือ FGF-23 เฉพาะบางกรณี\n\n### กับดักที่คนพลาดจริง\n- **ใน tumor lysis ห้ามรีบให้แคลเซียมถ้าไม่มีอาการ** เพราะจะเร่งการตกตะกอนแคลเซียมฟอสเฟต — ให้สารน้ำมาก ๆ และ **rasburicase หรือ allopurinol** เป็นหลัก\n- **แคลเซียมสูงไม่ใช่สิ่งที่คาดหวังใน tumor lysis** — ที่ถูกคือ **แคลเซียมต่ำ** เพราะถูกฟอสเฟตจับ (เป็นตัวลวงยอดนิยม)\n- **ผู้ป่วย CKD ที่ต้องส่องกล้องลำไส้ ห้ามใช้ยาเตรียมลำไส้ชนิดฟอสเฟต**", "pearls": ["PCT ดูดฟอสเฟตกลับ 85% และ FE ปกติน้อยกว่า 15% — FGF-23 กับ PTH กด NaPi-2a/2c ทำให้ขับออก", "FGF-23 ที่สูงขึ้นคือความผิดปกติแรกสุดของ CKD-MBD ก่อนฟอสเฟตจะสูง", "Tumor lysis = K สูง · uric acid สูง · ฟอสเฟตสูง · แคลเซียมต่ำ (แคลเซียมสูงเป็นตัวลวง)", "อันตรายของฟอสเฟตสูงเฉียบพลันคือแคลเซียมต่ำและการตกตะกอนแคลเซียมฟอสเฟตในไต", "ฟอสเฟตในปัสสาวะไม่มีประโยชน์เมื่อฟอสเฟตในเลือดสูง — ให้หาว่าไตขับไม่ได้เพราะอะไรแทน"], "items": [{"id": "N-MCQ-05", "kind": "mcq", "stem": "A 42-year-old man with acute lymphoblastic leukaemia and a high white cell count develops oliguria, nausea and muscle cramps 24 hours after his first cycle of chemotherapy. Which of the following laboratory findings would NOT be expected in this condition?", "choices": ["Hypercalcaemia", "Acute kidney injury with rising creatinine", "Hyperphosphataemia", "Hyperkalaemia", "Hyperuricaemia"], "answer": 0, "explain": "กลไก: **tumour lysis syndrome (TLS)** เกิดจากเซลล์มะเร็งจำนวนมากแตกพร้อมกัน (มักใน 12-72 ชม. หลังเริ่มเคมีบำบัด ในมะเร็งที่ **โตเร็ว, ก้อนใหญ่, LDH สูง, WBC สูง** เช่น ALL, Burkitt lymphoma, AML)\n\nสิ่งที่อยู่ในเซลล์ไหลออกมาในเลือด:\n- **K+ ในเซลล์สูงมาก (~140 mEq/L)** → **hyperkalaemia** (อันตรายที่สุด ทำให้ arrhythmia/cardiac arrest)\n- **phosphate ในเซลล์สูง** → **hyperphosphataemia**\n- **nucleic acid → purine → xanthine → uric acid** → **hyperuricaemia**\n- **hypocalcaemia (ไม่ใช่ hyper!)** เพราะ **phosphate ที่สูงจับกับ calcium เกิด calcium-phosphate ตกตะกอนในเนื้อเยื่อ** → Ca อิสระต่ำ → เกิดอาการ **muscle cramps, tetany, ชัก, QT ยาว, arrhythmia** (ตรงกับ muscle cramps ในโจทย์)\n- **AKI** จากหลายกลไกร่วมกัน: **uric acid ตกผลึกใน tubule (urate nephropathy), calcium-phosphate ตกตะกอนใน tubule (nephrocalcinosis), volume depletion และ cytokine-mediated injury**\n\n→ ดังนั้น **hypercalcaemia เป็นสิ่งที่ \"ไม่\" คาดว่าจะพบ** = คำตอบ\n\nการป้องกันและรักษาตามกลไก:\n- **IV fluid ปริมาณมากเพื่อเพิ่ม urine flow** (มาตรการสำคัญที่สุด) — ปัจจุบัน **ไม่แนะนำ urine alkalinization เป็นกิจวัตร** เพราะทำให้ calcium-phosphate ตกตะกอนง่ายขึ้น\n- **Allopurinol** (xanthine oxidase inhibitor) สำหรับ **ป้องกัน** ในความเสี่ยงปานกลาง\n- **Rasburicase** (recombinant urate oxidase เปลี่ยน uric acid เป็น allantoin ที่ละลายน้ำดี) สำหรับความเสี่ยงสูงหรือมี TLS แล้ว — **ห้ามใช้ใน G6PD deficiency** (ทำให้เกิด hemolysis รุนแรง ซึ่งเป็น pitfall ที่สำคัญในไทย)\n- **แก้ hyperkalaemia อย่างเร่งด่วน** (calcium gluconate, insulin+glucose, binder, dialysis)\n- **ไม่ควรให้ calcium เพื่อแก้ hypocalcaemia ถ้าไม่มีอาการ** เพราะจะยิ่งเพิ่มการตกตะกอนของ calcium-phosphate\n- **Dialysis** เมื่อมีข้อบ่งชี้ (hyperkalaemia/acidosis/overload ที่ดื้อต่อการรักษา, phosphate สูงมาก, oliguric AKI)", "pearl": "Cairo-Bishop criteria: **laboratory TLS** = ความผิดปกติอย่างน้อย 2 อย่างใน (uric acid, K, PO4 สูง / Ca ต่ำ) ภายใน 3 วันก่อน–7 วันหลังเริ่มรักษา; **clinical TLS** = laboratory TLS + **Cr สูงขึ้น / arrhythmia / ชัก**", "topic": "Tumour lysis syndrome – which finding is NOT expected", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 12 – Tumor lysis syndrome ข้อใดผิด → ตอบ hypercalcemia", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (Hemato ข้อ 5) – คนไข้เป็นมะเร็งได้รับยา chemotherapy มา 1 วัน มีอาการต่างๆ และมี K 5.6 → Tumor lysis syndrome", "MED32 MCQ ข้อ 29 – ALL ได้รับ 1st chemotherapy K 5.6 Ca 7.8 → tumor lysis syndrome", "MED31 MCQ ข้อ 26 – คนไข้ AML ไปทำ chemotherapy แล้ว hyperkalemia / MED31 MCQ – มี hypocalcemia ตอบ tumor lysis syndrome", "MED31 MCQ ข้อ 49 – ทำ chemo ไตพัง BUN Cr K สูง เกิดจากอะไร"], "nl": ["B9.2.5(2)", "B9.2.7(1)"]}, {"id": "N-OLD-005", "kind": "old", "stem": "Which finding is NOT expected in tumour lysis syndrome?", "choices": ["Hyperuricaemia", "Hyperkalaemia", "Hyperphosphataemia", "Hypercalcaemia", "Acute kidney injury"], "answer": 3, "explain": "**TLS = เซลล์มะเร็งแตกปล่อยสารในเซลล์ออกมา** จึงได้ K สูง, PO4 สูง, uric acid สูง และ **แคลเซียมต่ำ** (เพราะฟอสเฟตที่สูงไปจับแคลเซียมตกตะกอน) ตามด้วยไตวายจาก urate และ calcium-phosphate nephropathy", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 12", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.2"]}, {"id": "N-OLD-006", "kind": "old", "stem": "A patient with acute leukaemia develops K 5.6 mEq/L, calcium 7.8 mg/dL, phosphate 6.8 mg/dL and creatinine rising 1 day after the first chemotherapy. What is the diagnosis and the key preventive measure?", "choices": ["Sepsis; start antibiotics only", "Hypercalcaemia of malignancy; give bisphosphonate", "Tumour lysis syndrome; aggressive intravenous hydration with rasburicase or allopurinol in high-risk patients", "Contrast-induced nephropathy; withhold fluids", "Acute interstitial nephritis; give corticosteroid"], "answer": 2, "explain": "**TLS เกิดใน 12-72 ชั่วโมงแรกหลังเริ่มเคมีบำบัดในมะเร็งที่ไวต่อยาและมีมวลก้อนมาก** (ALL, Burkitt, high-grade lymphoma); ป้องกันด้วย **สารน้ำปริมาณมาก + rasburicase (ความเสี่ยงสูง) หรือ allopurinol (ความเสี่ยงปานกลาง)** และเฝ้าระวังอิเล็กโทรไลต์ทุก 6-8 ชั่วโมง — **ไม่แนะนำให้ urine alkalinisation แล้ว** เพราะเร่งการตกตะกอนของแคลเซียมฟอสเฟต", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (Hemato ข้อ 5)", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.2.15"]}]}, {"id": "nephro-05-07", "title": "Hypophosphatemia — ATP หมดเซลล์ และการแยกว่าไตรั่วหรือย้ายเข้าเซลล์", "minutes": 8, "summary": "FE ฟอสเฟต > 20% หรือปัสสาวะ > 100 mg/วัน = ไตรั่ว · refeeding syndrome · tumor-induced osteomalacia", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"], "md": "### ทำไมฟอสเฟตต่ำถึงอันตราย\n**ฟอสเฟตเป็นวัตถุดิบของ ATP และ 2,3-DPG** เมื่อฟอสเฟตต่ำมาก **เซลล์จึงขาดพลังงาน** — อาการจึงออกที่อวัยวะที่ใช้พลังงานสูงทั้งหมด\n\n- **ฟอสเฟตต่ำเล็กน้อยมักไม่มีอาการ**\n- **ฟอสเฟตต่ำรุนแรง** (โดยทั่วไป < 1.0 mg/dL)\n  - **กล้ามเนื้อลายอ่อนแรงทั้งตัว · proximal myopathy · rhabdomyolysis**\n  - **กล้ามเนื้อหายใจอ่อนแรงจนหายใจล้มเหลว** ← เป็นเหตุผลที่คนหย่าเครื่องช่วยหายใจไม่ได้\n  - **กล้ามเนื้อหัวใจอ่อนแรงจนหัวใจล้มเหลว**\n  - **เม็ดเลือดแดงแตก (hemolysis)** เพราะเยื่อหุ้มเซลล์ขาด ATP\n  - กลืนลำบาก · ลำไส้ไม่เคลื่อนไหว\n  - **ชา สับสน ชักทั้งตัว จนถึงโคม่า**\n- **เรื้อรัง** → **กระดูกและฟันเสียแร่ธาตุ** → **rickets ในเด็ก** หรือ **osteomalacia ในผู้ใหญ่** (แล้วแต่ว่าเกิดก่อนหรือหลัง growth plate ปิด)\n\n### แยกกลไก — ไตรั่ว หรือย้ายเข้าเซลล์\nมีสามกลไก แต่ **การดูดซึมจากลำไส้ที่ลดลงแทบไม่เคยทำให้ฟอสเฟตต่ำได้ด้วยตัวเอง** (เป็นแค่ตัวเสริม)\n\n> **ตัววัดที่ตัดสิน** — ไตเก่งมากในการเก็บฟอสเฟตกลับ ฉะนั้นเมื่อฟอสเฟตในเลือดต่ำ **ปัสสาวะควรแทบไม่มีฟอสเฟตเลย**\n> - **ฟอสเฟตในปัสสาวะ > 100 mg/วัน ขณะที่ฟอสเฟตในเลือดต่ำ = ไม่เหมาะสม = ไตรั่ว**\n> - **FE ฟอสเฟต > 20% = ไตรั่ว**\n>\n> **FE ฟอสเฟต = 100 × (ฟอสเฟตในปัสสาวะ × Cr ในเลือด) ÷ (ฟอสเฟตในเลือด × Cr ในปัสสาวะ)**\n\n**กลุ่มที่ 1 · ย้ายเข้าเซลล์ (FE ฟอสเฟตต่ำ)**\n- **Refeeding syndrome** — ให้อาหารแก่ผู้ที่อดมานาน → อินซูลินพุ่ง → กลูโคสและฟอสเฟตเข้าเซลล์พร้อมกันเพื่อสร้าง ATP → **ฟอสเฟต โพแทสเซียม และแมกนีเซียมตกพร้อมกันทั้งสามตัว** ภายใน 24 – 72 ชั่วโมง\n- **การรักษา DKA ด้วยอินซูลิน** · **respiratory alkalosis** (หายใจเร็ว ทำให้ glycolysis ในเซลล์เร่งขึ้น) · **hungry bone syndrome**\n\n**กลุ่มที่ 2 · ไตรั่ว (FE ฟอสเฟต > 20%)** — เป็นสาเหตุของฟอสเฟตต่ำเรื้อรังส่วนใหญ่ แบ่งย่อยด้วย **แคลเซียม**\n| แคลเซียม | แปลว่า | ตัวอย่าง |\n|---|---|---|\n| **สูง** | **PTH เกิน** | **primary hyperparathyroidism** |\n| **ปกติหรือต่ำ** | **FGF-23 เกิน** | **tumor-induced osteomalacia** · X-linked hypophosphatemic rickets |\n| — | ท่อไตส่วนต้นเสียหาย | **Fanconi syndrome** (มาพร้อมน้ำตาลในปัสสาวะทั้งที่น้ำตาลในเลือดปกติ กรดอะมิโนรั่ว และ **RTA ชนิดที่ 2**) |\n\n**Tumor-induced osteomalacia (TIO)** — กลุ่มอาการพารานีโอพลาสติกที่พบน้อย เกิดจาก **ก้อนหลั่ง FGF-23 นอกตำแหน่ง** ส่วนใหญ่เป็น **เนื้องอก mesenchymal ชนิดไม่ร้ายที่เล็กจนหายาก** · มาด้วย **ฟอสเฟตต่ำ ปวดกระดูก กระดูกหัก และกล้ามเนื้ออ่อนแรง** · หาตำแหน่งด้วย **CT, MRI, Ga-68 DOTATATE PET, octreotide scan และการเจาะเลือดตามหลอดเลือดดำใหญ่หาจุดที่ FGF-23 กระโดดขึ้น** · **ตัดก้อนออกแล้วอาการหายเร็วมาก** · ถ้าหาไม่เจอหรือตัดไม่ได้ ใช้ **burosumab (แอนติบอดีต่อ FGF-23)**\n\n**กลุ่มที่ 3 · สถานการณ์เฉพาะที่อาจารย์ระบุ**\n- **หลังปลูกถ่ายไต — พบได้ถึง 85 – 90% ในระยะแรก** เพราะ GFR กลับมาทันทีขณะที่ **FGF-23 และ PTH ยังค้างสูงจากช่วงไตวาย** จึงขับฟอสเฟตทิ้งมหาศาล · FGF-23 ใช้เวลาเป็นสัปดาห์กว่าจะลง ส่วน **PTH อาจสูงอยู่นานเป็นปี**\n- **ผู้ป่วยที่ทำ CRRT หรือฟอกเลือดเข้มข้น** — ถูกกรองฟอสเฟตออกมากเกิน **แก้ด้วยการเติมฟอสเฟตกลับได้ผลดี**\n\n### กับดักที่คนพลาดจริง\n- **ผู้ป่วยขาดอาหารมานานแล้วเริ่มให้อาหารทันที** — ต้องเริ่มช้า ๆ เฝ้าระวังและเติม **ฟอสเฟต โพแทสเซียม แมกนีเซียม และไทอามีน** ล่วงหน้า\n- **หย่าเครื่องช่วยหายใจไม่สำเร็จโดยไม่ทราบสาเหตุ ให้ตรวจฟอสเฟต**\n- **ฟอสเฟตในเลือดตอนเริ่มรักษา DKA อาจปกติหรือสูง แล้วค่อยตกหลังให้อินซูลิน** — ต้องตรวจซ้ำ ไม่ใช่ดูค่าแรกอย่างเดียว", "pearls": ["ฟอสเฟตต่ำรุนแรงทำให้ ATP หมด — กล้ามเนื้อหายใจอ่อนแรง หัวใจล้มเหลว rhabdomyolysis และเม็ดเลือดแดงแตก", "ฟอสเฟตในปัสสาวะเกิน 100 mg/วัน หรือ FE ฟอสเฟตเกิน 20% ขณะฟอสเฟตในเลือดต่ำ = ไตรั่ว", "ไตรั่วฟอสเฟต + แคลเซียมสูง = PTH เกิน · ไตรั่วฟอสเฟต + แคลเซียมไม่สูง = FGF-23 เกิน", "Refeeding syndrome ทำให้ฟอสเฟต โพแทสเซียม และแมกนีเซียมตกพร้อมกันสามตัวใน 24–72 ชม.", "หย่าเครื่องช่วยหายใจไม่ได้โดยไม่ทราบสาเหตุ ให้ตรวจฟอสเฟต"], "items": [{"id": "NEPHRO-05-07-Q1", "kind": "own", "stem": "A 48-year-old man with chronic alcohol use and 3 weeks of minimal oral intake is admitted for malnutrition. Enteral feeding is started at full caloric goal. Forty-eight hours later he is confused and weak and cannot be weaned from pressure support. Lab: phosphate 0.9 mg/dL (2.7-4.5), potassium 2.9 mEq/L, magnesium 1.2 mg/dL, glucose 118 mg/dL. Which mechanism best explains these findings?", "choices": ["Alcohol directly damages the proximal tubule, causing renal phosphate wasting with a fractional excretion above 20%", "Insulin released in response to refeeding drives phosphate, potassium and magnesium into cells for ATP synthesis", "Ectopic FGF-23 secretion from an occult mesenchymal tumour is suppressing tubular phosphate reabsorption", "Primary hyperparathyroidism is driving phosphaturia, which would also produce hypercalcaemia", "Respiratory acidosis has shifted phosphate out of the extracellular space into bone"], "answer": 1, "explain": "**Refeeding syndrome** — ในภาวะอดอาหารร่างกายใช้ไขมันเป็นเชื้อเพลิงและ **คลังฟอสเฟต โพแทสเซียม แมกนีเซียมในเซลล์พร่องลงแล้ว แม้ค่าในเลือดจะยังปกติ** · เมื่อเริ่มให้อาหารเต็มที่ **อินซูลินพุ่ง** ผลักกลูโคสเข้าเซลล์พร้อม **ฟอสเฟต โพแทสเซียม และแมกนีเซียม** เพื่อสร้าง ATP → ทั้งสามค่าตกพร้อมกันภายใน **24 – 72 ชั่วโมง** · ฟอสเฟตที่ต่ำมากทำให้ **กล้ามเนื้อหายใจอ่อนแรงจนหย่าเครื่องไม่ได้** และ **สับสน**\n\n- **ท่อไตเสียหายจากสุรา** จะให้ **FE ฟอสเฟต > 20%** ซึ่งเป็นกลไกไตรั่ว ไม่ใช่การย้ายเข้าเซลล์ และไม่อธิบายว่าทำไมทุกค่าตกพร้อมกันพอดีหลังเริ่มอาหาร 48 ชั่วโมง\n- **TIO จาก FGF-23** เป็นโรคเรื้อรังที่ค่อยเป็นค่อยไปด้วยอาการปวดกระดูกและกระดูกหัก **ไม่เกิดเฉียบพลันตามการให้อาหาร** และไม่ทำให้โพแทสเซียมกับแมกนีเซียมตก\n- **Primary hyperparathyroidism** ต้องมี **แคลเซียมสูง** และไม่ได้เกิดขึ้นทันทีหลังเริ่มอาหาร\n- **กรดในเลือด (acidosis) ดันฟอสเฟตออกนอกเซลล์ทำให้ฟอสเฟตสูงขึ้น** ไม่ใช่ต่ำลง — ตัวที่ดันฟอสเฟตเข้าเซลล์คือ **ด่างจากการหายใจเร็ว (respiratory alkalosis)**", "pearl": "เริ่มให้อาหารผู้ที่อดมานาน ต้องเริ่มช้า ๆ และเติมฟอสเฟต โพแทสเซียม แมกนีเซียม กับไทอามีนล่วงหน้า แล้วตรวจซ้ำที่ 24–72 ชั่วโมง", "topic": "Hypophosphatemia — ATP หมดเซลล์ และการแยกว่าไตรั่วหรือย้ายเข้าเซลล์", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)", "2.3.4"]}]}, {"id": "nephro-05-08", "title": "แมกนีเซียม — ตัวที่ทำให้แก้โพแทสเซียมและแคลเซียมไม่ขึ้น", "minutes": 10, "summary": "TAL ดูดกลับมากที่สุดแบบ paracellular · FEMg > 3-4% = ไตรั่ว · ROMK คือกลไกที่เชื่อม Mg กับ K", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.1.2(4)", "B9.2.5(2)", "2.2.15"], "md": "แมกนีเซียมเป็น **แคตไอออนที่มีมากเป็นอันดับสี่ของร่างกาย** เป็น **โคแฟกเตอร์ของทุกปฏิกิริยาที่ใช้ ATP** รวมถึง **Na⁺-K⁺-ATPase** และยังคุมการหลั่ง **PTH** — สองข้อนี้อธิบายอาการเกือบทั้งหมดของหัวข้อนี้\n\n### ไตจัดการแมกนีเซียมอย่างไร\n| ตำแหน่ง | สัดส่วน | กลไก |\n|---|---|---|\n| **PCT** | **20 – 25%** | paracellular |\n| **TAL** | **ส่วนใหญ่** | **Paracellular ผ่าน claudin-16 และ claudin-19** ขับเคลื่อนด้วยแรงดันไฟฟ้าบวกในท่อจาก **NKCC2 + ROMK** (**กลไกเดียวกับแคลเซียมเป๊ะ**) |\n| **DCT** | **10% สุดท้าย** | **Transcellular ผ่าน TRPM6** — **เป็นตัวกำหนดปริมาณที่ขับออกทางปัสสาวะจริง** · EGFR ที่ถูกกระตุ้นจะเพิ่ม TRPM6 ที่ผิวท่อ |\n\n- **เมื่อแมกนีเซียมสูง claudin-14 จะเข้าไปขวาง claudin-16/19 → ลดการซึมผ่าน → ขับแมกนีเซียมออกมากขึ้น**\n- **โรคทางพันธุกรรมที่ไตรั่วแมกนีเซียมเกิดจากการกลายพันธุ์ของ claudin-16 และ 19**\n- **ที่พบบ่อยในเวชปฏิบัติคือยาขับปัสสาวะกลุ่ม loop ซึ่งยับยั้ง NKCC2** จึงทำให้แมกนีเซียมรั่ว\n- **ยาต้าน EGFR (cetuximab, panitumumab) ทำให้ TRPM6 ลดลง → แมกนีเซียมต่ำรุนแรง**\n\n### แยกว่าไตรั่วหรือเสียทางอื่น\n> - **แมกนีเซียมในปัสสาวะ > 24 mg/วัน ขณะที่แมกนีเซียมในเลือดต่ำ = ผิดปกติ = ไตรั่ว**\n> - **FEMg = [U.Mg × P.Cr] ÷ [0.7 × P.Mg × U.Cr] × 100** — ตัวคูณ **0.7** ใช้ประมาณแมกนีเซียมอิสระจากค่ารวม\n> - **FEMg > 3 – 4% เมื่อ GFR ปกติ = ไตรั่วอย่างไม่เหมาะสม** · ถ้าตัดไตรั่วออกได้ แปลว่าเสียทางลำไส้หรือกินไม่พอ\n\n**สาเหตุที่พบบ่อย** — **ยาขับปัสสาวะ loop และ thiazide · amphotericin B · cisplatin · aminoglycoside · calcineurin inhibitor · PPI ระยะยาว · ยาต้าน EGFR · ท้องเสียเรื้อรัง · ติดสุรา · ขาดอาหาร**\n\n### สองผลกระทบที่ออกสอบมากที่สุด\n\n**1 · ทำให้โพแทสเซียมต่ำแบบดื้อการแก้**\n> **กลไก** — ปกติ **แมกนีเซียมในไซโทซอลจะอุดช่อง ROMK ไว้จากด้านใน** ไม่ให้โพแทสเซียมรั่วออกไปในท่อไต · เมื่อ **แมกนีเซียมในเซลล์พร่อง การอุดนั้นหายไป → ROMK เปิดโล่ง → ไตขับโพแทสเซียมทิ้งตลอดเวลา** · **เติมโพแทสเซียมเท่าไรก็ไม่ขึ้นจนกว่าจะแก้แมกนีเซียมก่อน**\n\n**2 · ทำให้แคลเซียมต่ำ**\n- **พบแคลเซียมต่ำใน 50% ของผู้ป่วยที่แมกนีเซียมต่ำ**\n- **กลไกหลักคือการหลั่ง PTH ถูกกด** — **กลับเป็นปกติภายใน 24 ชั่วโมงหลังเติมแมกนีเซียม**\n- ร่วมกับ **1,25(OH)₂D ต่ำ** และ **การดื้อต่อ PTH และวิตามินดีที่อวัยวะเป้าหมาย**\n\n### อาการอื่น\n- **หัวใจ** — Na⁺-K⁺-ATPase ทำงานบกพร่อง → โพแทสเซียมในเซลล์ตก → **เยื่อหุ้มเซลล์อยู่ในสภาพ depolarize → เกิดจุดกำเนิดไฟฟ้าผิดที่และหัวใจเต้นเร็วผิดจังหวะ** · ECG: **T สองยอด (bifid T) · U wave · QT หรือ QU ยาว** · **torsades de pointes, monomorphic VT, VF ที่อาจดื้อต่อการรักษามาตรฐานและตอบสนองต่อแมกนีเซียมเท่านั้น** · **เสริมพิษของ digoxin** เพราะทั้งคู่ยับยั้ง Na⁺-K⁺-ATPase\n- **ประสาทกล้ามเนื้อ** — สั่น กล้ามเนื้อกระตุก **Trousseau และ Chvostek บวก** tetany · **ชัก** ทั้งแบบเกร็งกระตุกทั้งตัวและแบบ multifocal **ซึ่งบางครั้งถูกกระตุ้นด้วยเสียงดัง** · กลไกคือ **ปกติแมกนีเซียมนอกเซลล์อุดตัวรับ NMDA ไว้ เมื่อแมกนีเซียมต่ำการอุดหายไป กลูตาเมตจึงกระตุ้นเซลล์ประสาทได้เต็มที่**\n- **Vertical nystagmus** — พบน้อยแต่มีค่าทางวินิจฉัยสูง **สาเหตุทางเมตาบอลิกมีเพียงสองอย่างคือ Wernicke encephalopathy และแมกนีเซียมต่ำรุนแรง**\n\n### การรักษา\n**ใครควรได้รับการเติม** (ตามสไลด์) — ผู้ที่มี **โรคหัวใจหรือโรคลมชักอยู่เดิม** · ผู้ที่มี **แคลเซียมต่ำหรือโพแทสเซียมต่ำรุนแรงร่วมด้วย** · และผู้ที่ **แมกนีเซียมต่ำรุนแรง < 1.4 mg/dL แม้ไม่มีอาการ**\n\n| สถานการณ์ | ขนาด |\n|---|---|\n| **กำลังชักหรือหัวใจเต้นผิดจังหวะ** | **MgSO₄ 8 – 16 mEq (1 – 2 g) IV ใน 2 – 4 นาที** |\n| **ไม่ฉุกเฉิน** | **64 mEq (8 g) ใน 24 ชั่วโมงแรก แล้ว 32 mEq (4 g) ต่อวัน อีก 2 – 6 วัน** |\n| **ทางกิน** | magnesium oxide 140 mg ครั้งละ 1 เม็ด **วันละ 4 – 5 ครั้ง** (ชีวปริมาณออกฤทธิ์เพียง **33%**) |\n\n- **ปริมาณที่พร่องโดยเฉลี่ย 1 – 2 mEq/kg**\n- > **ข้อที่อาจารย์ย้ำ — ระดับในเลือดขึ้นเร็วแต่คลังในเซลล์เติมช้ากว่ามาก จึงต้องให้ต่ออีกอย่างน้อย 1 – 2 วันหลังค่าในเลือดกลับปกติแล้ว**\n- **ผู้ป่วย GFR ลดลง ให้ลดอัตราลง 25 – 50% และตรวจติดตามถี่ ๆ**\n- **การตรวจรีเฟล็กซ์เอ็นคือการทดสอบข้างเตียงที่ดีที่สุดในการจับภาวะแมกนีเซียมเกินขนาด**\n- **การให้ MgSO₄ ปริมาณมากทำให้ ionized calcium ตกทันที** (เพิ่มการขับแคลเซียมทางปัสสาวะ + ซัลเฟตจับแคลเซียม) — **ในผู้ที่แคลเซียมต่ำอยู่แล้วอาจกระตุ้นให้เกิด tetany ได้**\n- ยากินทุกชนิด **ทำให้ท้องเสีย** ซึ่งเป็นตัวจำกัดขนาด · **Mg hydroxide และ oxide เป็นเกลือด่างจึงอาจทำให้เลือดเป็นด่าง** · **เกลือ sulfate และ gluconate ส่งประจุลบที่ดูดกลับไม่ได้ไปยัง collecting duct จึงอาจทำให้เสียโพแทสเซียมมากขึ้น**\n- **ไตรั่วแมกนีเซียมที่ดื้อต่อการเติมทางกิน** → ใช้ **amiloride หรือ triamterene** ซึ่งปิด ENaC ที่ท่อไตส่วนปลาย ช่วยลดการสูญเสียแมกนีเซียม\n\n### กับดักที่คนพลาดจริง\n- **โพแทสเซียมต่ำที่เติมเท่าไรก็ไม่ขึ้น = ตรวจแมกนีเซียม** — เป็นข้อที่ออกซ้ำที่สุดของคาบนี้\n- **ระดับแมกนีเซียมในเลือดปกติไม่ตัดภาวะพร่องแมกนีเซียม** เพราะ 99% อยู่ในเซลล์และกระดูก\n- **ผู้ป่วยได้ amphotericin B แล้วอ่อนแรง** ให้ส่งอิเล็กโทรไลต์ทั้งชุดรวม **โพแทสเซียมและแมกนีเซียม** ก่อนคิดถึงอย่างอื่น (ยาตัวนี้ทำให้เกิด **distal RTA และเสียทั้ง K และ Mg ทางไต**)", "pearls": ["โพแทสเซียมต่ำที่ดื้อการแก้ = แมกนีเซียมต่ำ เพราะ Mg ในเซลล์ที่พร่องทำให้ ROMK เปิดโล่งจนไตขับ K ทิ้ง", "แคลเซียมต่ำพบใน 50% ของผู้ที่ Mg ต่ำ กลไกคือ PTH ถูกกด และกลับปกติใน 24 ชม. หลังเติม Mg", "FEMg เกิน 3–4% หรือ Mg ในปัสสาวะเกิน 24 mg/วัน ขณะ Mg ในเลือดต่ำ = ไตรั่ว", "ระดับ Mg ในเลือดปกติไม่ตัดภาวะพร่อง เพราะ 99% อยู่ในเซลล์และกระดูก", "เติม Mg ต่ออีก 1–2 วันหลังค่าในเลือดปกติแล้ว เพราะคลังในเซลล์เติมช้ากว่า", "Torsades de pointes ที่ดื้อการรักษามาตรฐาน ให้ MgSO4 — และตรวจรีเฟล็กซ์เอ็นเพื่อจับ Mg เกินขนาด"], "items": [{"id": "N-MCQ-03", "kind": "mcq", "stem": "A 16-year-old girl with acute lymphoblastic leukaemia has been hospitalised for 2 months and has received multiple courses of amphotericin B for candidaemia. Over the past 2 weeks she has had persistent hypokalaemia (potassium 2.8-3.1 mEq/L) despite daily oral and intravenous potassium replacement. Renal function is normal and she is not vomiting or taking diuretics. Which additional laboratory value should be checked, and would it be expected to be high or low?", "choices": ["Calcium, expected to be high", "Sodium, expected to be high", "Calcium, expected to be low", "Magnesium, expected to be low", "Magnesium, expected to be high"], "answer": 3, "explain": "กลไก (เป็นคำถามที่วัดความเข้าใจสรีรวิทยาระดับ channel): **hypomagnesaemia ทำให้ hypokalaemia ดื้อต่อการให้ potassium**\n\nเหตุผลเชิงโมเลกุล: การขับ K ออกที่ **cortical collecting duct** เกิดผ่าน **ROMK channel**; ภายในเซลล์ **Mg2+ ทำหน้าที่เป็นตัวอุดรูจากด้านใน (intracellular Mg blocks ROMK)**\n- เมื่อ **Mg ในเซลล์ต่ำ** → การอุดรูหายไป → **ROMK เปิดกว้าง → K รั่วออกทางปัสสาวะไม่หยุด**\n- ดังนั้นไม่ว่าจะเติม K เท่าไร K ก็จะถูกขับทิ้ง → **ต้องแก้ Mg ก่อน K จึงจะขึ้น**\n\nในโจทย์มีปัจจัยเสี่ยงของ Mg ต่ำชัดเจน: **amphotericin B** (ทำให้ renal tubular wasting ของ Mg และ K, เกิด distal RTA), การรักษาด้วยยาอื่นที่ทิ้ง Mg (เช่น aminoglycoside, cisplatin), ภาวะโภชนาการไม่ดีจากการนอน รพ. นาน, ท้องเสียจากเคมีบำบัด\n\nทำไมข้ออื่นผิด:\n- **Magnesium สูง**: hypermagnesaemia พบในไตวายหรือได้รับ Mg มากเกิน และจะ **กด** การขับ K ไม่ได้ทำให้ K ต่ำดื้อ — ทิศทางกลับกัน\n- **Calcium สูง**: hypercalcemia ไม่ใช่กลไกของ refractory hypokalemia (และในผู้ป่วย leukemia ที่ได้ chemo มักเจอ **hypocalcemia** จาก tumor lysis มากกว่า)\n- **Calcium ต่ำ**: พบร่วมกับ Mg ต่ำได้จริง (เพราะ Mg ต่ำ **กดการหลั่ง PTH และทำให้ end-organ ดื้อต่อ PTH** → hypocalcemia ที่แก้ด้วย Ca เฉยๆไม่หาย) แต่ **hypocalcemia ไม่ใช่สาเหตุที่ทำให้ K ต่ำดื้อ** — คำถามถามตัวที่อธิบาย K ต่ำ จึงต้องตอบ Mg\n- **Sodium สูง**: ไม่มีความเชื่อมโยงเชิงกลไกกับ refractory hypokalemia\n\nการรักษา: ให้ **MgSO4 IV** (หรือ Mg oral ถ้าไม่รุนแรง) พร้อมกับ K; ระวังว่า **serum Mg สะท้อน total body Mg ได้แย่** (Mg ส่วนใหญ่อยู่ในกระดูกและเซลล์) จึงอาจต้องเติมแม้ค่าจะ \"เกือบปกติ\" และต้องระวังในผู้ป่วยไตเสื่อม", "pearl": "ท่องเป็นกฎ: **\"แก้ K ไม่ขึ้น ให้ดู Mg; แก้ Ca ไม่ขึ้น ให้ดู Mg\"** — Mg ต่ำทำให้ทั้ง hypokalemia และ hypocalcemia ดื้อต่อการรักษา และเป็นสาเหตุของ **torsades de pointes**", "topic": "Refractory hypokalaemia – the role of magnesium", "src": "", "ref": ["MED31 past paper loop C&D – A 16 year old girl with ALL hospitalized >2 months, Candida septicemia, persistent hypokalemia despite daily repletion. What laboratory value should the physician check and is it expected to be high or low? (choices: Ca high/low, Mg high/low, Na high)", "MED31 past paper – ผู้ป่วยหญิง 21 ปี HIV CD4 29 admit ด้วย cryptococcal meningitis ได้ amphotericin B 1 สัปดาห์ แขนขาไม่มีแรง proximal grade 3 → ส่งตรวจ electrolyte และ Mg", "MED31 MCQ – Ans hypokalemia"], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}, {"id": "N-OLD-010", "kind": "old", "stem": "A 16-year-old girl with leukaemia on prolonged amphotericin B has persistent hypokalaemia despite daily potassium replacement. Which additional test is most useful?", "choices": ["Serum uric acid", "Serum amylase", "Serum lactate", "Serum ammonia", "Serum magnesium"], "answer": 4, "explain": "**Hypokalaemia ที่แก้ไม่ขึ้นต้องตรวจแมกนีเซียมเสมอ** — เมื่อ Mg ต่ำ ช่อง ROMK ที่ collecting duct ถูกยับยั้งน้อยลงทำให้ไตขับโพแทสเซียมทิ้งต่อเนื่อง จึงต้อง **แก้ Mg ก่อนหรือพร้อมกัน** โพแทสเซียมจึงจะขึ้น; amphotericin B ทำให้เสียทั้ง K และ Mg ทางไต", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}, {"id": "N-OLD-011", "kind": "old", "stem": "A patient with HIV on amphotericin B for 1 week develops proximal muscle weakness grade 3. Which investigation should be sent first?", "choices": ["Muscle biopsy", "Serum electrolytes including potassium and magnesium", "Nerve conduction study", "Creatine kinase only", "Thyroid function test"], "answer": 1, "explain": "**Amphotericin B ทำให้เกิด distal renal tubular acidosis และเสีย K/Mg ทางไต** จนเกิดกล้ามเนื้ออ่อนแรงจาก hypokalaemia — ตรวจอิเล็กโทรไลต์ก่อนเสมอเพราะแก้ได้เร็วและเป็นสาเหตุที่พบบ่อยที่สุดในบริบทนี้", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(3)", "2.1.22"]}, {"id": "N-OLD-015", "kind": "old", "stem": "Which statement about magnesium is correct?", "choices": ["Magnesium level always parallels the potassium level", "Proton pump inhibitors raise serum magnesium", "Hypomagnesaemia causes refractory hypokalaemia and hypocalcaemia and must be corrected first", "Magnesium is not required for PTH secretion", "Hypomagnesaemia typically causes bradycardia and a short QT interval"], "answer": 2, "explain": "**Mg ต่ำมีผลสองทาง**: ทำให้ไตขับ K ทิ้งจน hypokalaemia ดื้อการแก้ และ **กดการหลั่ง PTH พร้อมทำให้ดื้อต่อ PTH** จนแคลเซียมต่ำ; ทางคลื่นไฟฟ้าหัวใจสัมพันธ์กับ **QT ยาวและ torsades de pointes**; ยาที่ทำให้ Mg ต่ำได้แก่ **PPI ระยะยาว, ยาขับปัสสาวะ, amphotericin B, aminoglycoside, cisplatin**", "pearl": "", "topic": "", "src": "MED30 สรุป Renal (หน้า 283-287)", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}]}, {"id": "nephro-05-09", "title": "Hypermagnesemia — เกิดได้แค่สองสถานการณ์", "minutes": 7, "summary": "ไตเสื่อมบวกกับได้แมกนีเซียมเข้าไป · ลำดับอาการตามระดับ · แก้ด้วยแคลเซียมทางหลอดเลือดดำ", "source": "สไลด์ อ.ธิติยา ภูวิไล — Fluid electrolyte: Divalent (Ca, P, Mg) 2567 · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.4(2)", "B9.2.7(2)"], "md": "**ไตมีความสามารถขับแมกนีเซียมสูงมาก** เมื่อเกินระดับที่ไตรับได้ ส่วนเกินจะถูกขับทิ้งไปแทบทั้งหมด **ระดับในเลือดจึงถูกกำหนดโดย GFR เป็นหลัก** — ด้วยเหตุนี้ **แมกนีเซียมสูงจึงเกิดได้เพียงสองสถานการณ์เท่านั้น**\n\n### สถานการณ์ที่ 1 · ไตทำงานบกพร่อง\n- ใน CKD **เนฟรอนที่เหลือปรับตัวโดยเพิ่ม FEMg อย่างมาก** ระดับแมกนีเซียมจึง **ปกติอยู่จนกว่า CrCl จะตกต่ำกว่าประมาณ 20 mL/min**\n- **แม้ในโรคไตระยะท้าย แมกนีเซียมสูงอย่างมีนัยสำคัญก็ยังพบน้อย เว้นแต่ได้รับแมกนีเซียมจากภายนอก** ในรูป **ยาลดกรด ยาระบาย หรือยาสวนทวาร**\n- **อายุที่มากขึ้นเป็นปัจจัยเสี่ยงสำคัญ** แม้ในผู้ที่ดูเหมือนไตปกติ เพราะ GFR ลดลงตามวัย\n\n### สถานการณ์ที่ 2 · ได้รับแมกนีเซียมมากเกิน\n- **กินยาลดกรดหรือยาระบายที่มีแมกนีเซียมมากเกิน** · **สวนทวารด้วย MgSO₄**\n- **ให้แมกนีเซียมทางหลอดเลือดดำขนาดสูง เช่นในการรักษาครรภ์เป็นพิษ**\n- **พิษจากแมกนีเซียมทางลำไส้พบบ่อยเป็นพิเศษในผู้ที่มีโรคลำไส้อักเสบ ลำไส้อุดตัน หรือลำไส้ทะลุ** เพราะการดูดซึมเพิ่มขึ้น\n- สาเหตุอื่นที่พบน้อย: **lithium · หลังผ่าตัด · มะเร็งแพร่กระจายไปกระดูก · milk-alkali · FHH · ไทรอยด์ต่ำ · Addison disease**\n\n### ลำดับอาการตามระดับ — ท่องเป็นขั้นบันได\n\n| ระดับแมกนีเซียม | อาการ |\n|---|---|\n| **> 4 – 6 mg/dL** | **ความดันต่ำ · คลื่นไส้อาเจียน · หน้าแดง · ปัสสาวะคั่ง · ลำไส้ไม่เคลื่อนไหว** |\n| **> 8 – 12 mg/dL** | **กล้ามเนื้อลายอ่อนปวกเปียกและรีเฟล็กซ์หายไป** |\n| **สูงขึ้นอีก** | **หัวใจเต้นช้าและ conduction block · กดการหายใจ · โคม่า · หัวใจหยุดเต้น** |\n\n**กลไก**\n- **ความดันต่ำและหน้าแดงเป็นอาการแรกสุด** เกิดจาก **การขยายตัวของกล้ามเนื้อเรียบหลอดเลือด และการยับยั้งการหลั่ง norepinephrine จากปลายประสาทซิมพาเทติก**\n- **แมกนีเซียมที่สูงยับยั้งการหลั่ง acetylcholine ที่รอยต่อประสาทกล้ามเนื้อ** → **อัมพาตแบบอ่อนปวกเปียกและรีเฟล็กซ์หาย** · กล้ามเนื้อเรียบก็เป็นอัมพาตด้วย จึงเกิด **ปัสสาวะคั่ง ลำไส้อืด และรูม่านตาขยาย**\n- **ECG เปลี่ยนแปลงได้บ่อยแต่ไม่จำเพาะ** — หัวใจเต้นช้าแบบ sinus หรือ junctional, block ที่ SA/AV/His · **จบด้วย asystole**\n- > **เบาะแสทางแล็บที่อาจารย์ระบุ — anion gap ที่ต่ำผิดปกติหรือถึงขั้นติดลบ อาจเป็นสัญญาณของแมกนีเซียมสูง** (แต่ไม่พบเสมอไป ขึ้นกับว่าประจุลบที่มาคู่กันคืออะไร)\n\n### การรักษา\n1. **หยุดแมกนีเซียมทุกทาง** — ในผู้ที่ไตดี มักไม่ต้องทำอะไรมากกว่านี้ เพราะไตขับได้เร็ว **ค่าครึ่งชีวิตของแมกนีเซียมในเลือดประมาณ 28 ชั่วโมง**\n2. **พิษรุนแรงโดยเฉพาะทางหัวใจ → ให้แคลเซียมทางหลอดเลือดดำเพื่อต้านฤทธิ์ชั่วคราว**\n   - **Calcium chloride 1 g เข้าเส้นเลือดดำส่วนกลางใน 2 – 5 นาที** หรือ **calcium gluconate ทางเส้นเลือดส่วนปลาย** · **ให้ซ้ำได้หลัง 5 นาทีถ้าจำเป็น**\n3. **เร่งการขับทางไต** — **ให้สารน้ำร่วมกับ furosemide** ซึ่งยับยั้งการดูดแมกนีเซียมกลับที่ TAL\n4. **ผู้ป่วยไตวายระยะสุดท้าย → ฟอกเลือดหรือ hemofiltration เป็นทางเดียว** · น้ำยาฟอกเลือดทั่วไปมีแมกนีเซียม 0.6 – 1.2 mg/dL และใช้น้ำยาที่ไม่มีแมกนีเซียมได้ (ผลข้างเคียงคือตะคริว) · **HD ขจัดแมกนีเซียมได้ดีมาก คลียร์แรนซ์ถึง 100 mL/min**\n\n### กับดักที่คนพลาดจริง\n- **ผู้ป่วย CKD ที่ท้องผูกแล้วซื้อยาระบายหรือยาลดกรดกินเอง** เป็นภาพคลาสสิกของ hypermagnesemia รุนแรง — ต้องถามยาที่ซื้อเองทุกครั้ง\n- **หญิงตั้งครรภ์ที่ได้ MgSO₄ ต้องตรวจรีเฟล็กซ์เอ็น อัตราการหายใจ และปริมาณปัสสาวะเป็นระยะ** — **รีเฟล็กซ์ที่หายไปคือสัญญาณเตือนก่อนการกดการหายใจ**\n- **การให้แคลเซียมแก้ได้เพียงชั่วคราว** ไม่ได้ขจัดแมกนีเซียมออก ต้องตามด้วยการเร่งขับหรือฟอกเลือดเสมอ", "pearls": ["แมกนีเซียมสูงเกิดได้แค่สองสถานการณ์ — ไตเสื่อม และได้รับแมกนีเซียมมากเกิน มักเกิดพร้อมกันทั้งคู่", "ลำดับอาการ: 4–6 mg/dL ความดันต่ำ หน้าแดง ลำไส้อืด → 8–12 mg/dL รีเฟล็กซ์หายและอ่อนปวกเปียก → กดการหายใจและหัวใจหยุด", "รีเฟล็กซ์เอ็นที่หายไปคือสัญญาณเตือนก่อนการกดการหายใจ ใช้เฝ้าระวังข้างเตียงได้ดีที่สุด", "แก้พิษเฉียบพลันด้วยแคลเซียมทางหลอดเลือดดำ แล้วตามด้วยสารน้ำ+furosemide หรือฟอกเลือด", "Anion gap ที่ต่ำผิดปกติหรือติดลบอาจเป็นเบาะแสของแมกนีเซียมสูง"], "items": [{"id": "NEPHRO-05-09-Q1", "kind": "own", "stem": "An 82-year-old woman with CKD stage 4 (baseline creatinine 2.6 mg/dL) takes a magnesium hydroxide laxative for constipation over several days. She is brought in drowsy and flushed. PE: BP 84/50 mmHg, PR 48/min, absent deep tendon reflexes, abdominal distension with absent bowel sounds. Magnesium is 9.6 mg/dL (1.7-2.4). Which is the most appropriate immediate treatment?", "choices": ["Give intravenous magnesium-free crystalloid alone and recheck the level in 24 hours", "Start oral calcium carbonate as a magnesium binder and continue the laxative at a reduced dose", "Stop all magnesium, give intravenous calcium gluconate to antagonise the cardiac and neuromuscular effects, then give saline with furosemide and arrange dialysis if needed", "Give intravenous potassium chloride, because hypermagnesaemia always coexists with hypokalaemia", "Give neostigmine to reverse the neuromuscular blockade caused by magnesium"], "answer": 2, "explain": "ภาพนี้คือ **hypermagnesemia รุนแรง** จากสองปัจจัยที่มาพร้อมกันตามสไลด์ — **ไตเสื่อม (CKD stage 4) บวกกับได้รับแมกนีเซียมจากยาระบาย** · ระดับ 9.6 mg/dL อยู่ในช่วง **8 – 12 ที่ทำให้รีเฟล็กซ์หายและกล้ามเนื้ออ่อนปวกเปียก** และมี **ความดันต่ำ หัวใจเต้นช้า ลำไส้อืด** ครบ\n\n**ลำดับการรักษาคือ หยุดแมกนีเซียม → ให้แคลเซียมทางหลอดเลือดดำเพื่อต้านฤทธิ์ที่หัวใจและรอยต่อประสาทกล้ามเนื้อทันที → เร่งขับด้วยสารน้ำร่วมกับ furosemide (ยับยั้งการดูดกลับที่ TAL) → ฟอกเลือดถ้าไตขับเองไม่ไหว**\n\n- **ให้สารน้ำอย่างเดียวแล้วรอ 24 ชั่วโมง** ช้าเกินไปสำหรับผู้ป่วยที่รีเฟล็กซ์หายแล้ว ซึ่งเป็นสัญญาณเตือนก่อน **การกดการหายใจและหัวใจหยุดเต้น**\n- **โพแทสเซียม** ไม่เกี่ยวข้อง — แมกนีเซียมสูงไม่ได้มาคู่กับโพแทสเซียมต่ำเป็นกฎ และการให้ KCl ในผู้ป่วย CKD เสี่ยงต่อโพแทสเซียมสูง\n- **Neostigmine** ใช้กับยาคลายกล้ามเนื้อชนิด non-depolarizing **ไม่ใช่ยาแก้พิษแมกนีเซียม** — ตัวต้านคือ **แคลเซียม**\n- **แคลเซียมคาร์บอเนตทางกินไม่จับแมกนีเซียม** (เป็นตัวจับฟอสเฟต) และ **การให้ยาระบายต่อคือการเติมสารพิษซ้ำ**", "pearl": "CKD + ยาระบายหรือยาลดกรดที่มีแมกนีเซียม = hypermagnesemia — แก้ด้วยแคลเซียม IV ก่อน แล้วเร่งขับหรือฟอกเลือด", "topic": "Hypermagnesemia — เกิดได้แค่สองสถานการณ์", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(2)", "B9.4(2)"]}]}], "date": "พฤ. 17 ก.ย."}, {"lec": "14", "title": "Approach to glomerular disease", "subtitle": "กำแพงกรอง 3 ชั้น · การแปลผล proteinuria และ hematuria · กลุ่มอาการทางโกลเมอรูลัส 5 แบบ · MCD · FSGS · MN · IgA nephropathy · APSGN · lupus nephritis", "objectives": ["อธิบายกำแพงกรอง 3 ชั้นของโกลเมอรูลัสและเชื่อมโยงได้ว่าชั้นไหนเสียหายแล้วเกิดอาการใด", "เลือกวิธีวัดโปรตีนในปัสสาวะได้ถูกสถานการณ์ และรู้ว่า **dipstick ตรวจจับได้แทบเฉพาะ albumin** จึงพลาด light chain", "แยก proteinuria ออกเป็น functional · orthostatic · overflow · tubular · glomerular ได้จากปริมาณและบริบท", "ไล่ผู้ป่วยปัสสาวะสีแดงตามลำดับ dipstick → ปั่นดู supernatant → แยก **glomerular ออกจาก non-glomerular hematuria** ได้", "จัดผู้ป่วยเข้ากลุ่มอาการทั้ง 5 (asymptomatic · nephrotic · nephritic · RPGN · CGN) ตามเกณฑ์วินิจฉัยได้", "บอกภาพ LM / IF / EM ของ MCD, FSGS, MN, IgA nephropathy, APSGN และ lupus nephritis ได้", "แยก **primary ออกจาก secondary glomerular disease** และรู้ว่าต้องสืบค้นอะไรก่อนตัดสินใจให้ยากดภูมิคุ้มกัน", "วางแผนการรักษาเบื้องต้นของแต่ละโรคตามแนวทาง KDIGO และจัดชั้น lupus nephritis ตาม ISN/RPS เพื่อเลือกการรักษาได้"], "meq": [{"id": "N-MEQ-01", "part": "MEQ", "lec": "14", "lecture": "Nephrotic / Nephritic syndrome (อ.ฉันทิศา)", "topic": "Acute post-streptococcal glomerulonephritis presenting as hypertensive emergency", "vignette": "ผู้ป่วยชายไทยอายุ 30 ปี มาโรงพยาบาลด้วยอาการปวดศีรษะ 3 ชั่วโมงก่อนมาโรงพยาบาล\nPI:\n- 3 ชั่วโมงก่อน ปวดตื้อๆบริเวณท้ายทอย ไม่ร้าวไปที่ใด ไม่มีไข้\n- 2 ชั่วโมงก่อน อาการไม่ดีขึ้น จึงรับประทานพาราเซตามอล\n- 1 ชั่วโมงก่อน อาการยังไม่ดีขึ้น วัดความดันที่ร้านขายยาได้สูงกว่าทุกครั้ง\nPast history:\n- 2 สัปดาห์ก่อน มีไข้ เจ็บคอ ซื้อยาแก้อักเสบกินเอง 3 วันแล้วหาย\n- 2 วันก่อน ปัสสาวะเป็นสีน้ำล้างเนื้อ ไม่มีฟอง ไม่แสบขัด ไม่ปวดหลัง ปริมาณปัสสาวะน้อยลงเล็กน้อย\nPE: V/S BT ปกติ, PR ปกติ, RR ปกติ, BP 180/106 mmHg, SpO2 ปกติ, BMI 27 kg/m2\nGA: good consciousness, ไม่ซีด ไม่เหลือง\nHEENT: not pale, no injected pharynx, no tonsillar exudate\nCVS: regular rhythm, PMI at 6th mid-ICS, normal S1 S2, no murmur\nRS: no adventitious sound\nAbd: soft, no CVA tenderness, no mass\nExt: no rash, periorbital puffiness เล็กน้อยในตอนเช้า, pitting edema 1+ ทั้งสองข้าง\nNeuro: no focal neurological deficit, no papilledema", "questions": [{"q": "1. จงซักประวัติเพิ่มเติม", "a": "**ลักษณะของปัสสาวะและอาการทางไต**\n- สีปัสสาวะแบบไหน (สีน้ำล้างเนื้อ/โคล่า vs แดงสด), มีลิ่มเลือดหรือไม่ (**ลิ่มเลือดบ่งชี้ non-glomerular**), แดงตอนต้น/ปลาย/ทั้งสาย\n- **มีฟองเยอะหรือไม่** (บ่ง heavy proteinuria), ปริมาณปัสสาวะลดลงเท่าไร, ปัสสาวะกลางคืน\n- แสบขัด ปัสสาวะบ่อย ปวดหลัง ปวดสีข้าง ไข้หนาวสั่น (แยก UTI/pyelonephritis), ปวดร้าวลงขาหนีบ (แยกนิ่ว)\n- บวมที่ไหนก่อน (**ตาบวม
