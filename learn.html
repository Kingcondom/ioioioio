ษาเร็ว", "minutes": 9, "summary": "หน้าต่างเวลา 3 เดือนแรก · methotrexate เป็นยาหลัก · และพิษที่ต้องเฝ้าระวัง", "nl": ["B5.2.2-3(4)", "2.3.13-3(12)", "B5.4(3)"], "md": "### วินิจฉัย\n- **ข้ออักเสบสมมาตรของข้อเล็ก** — **MCP, PIP, ข้อมือ, MTP** · **ฝืดตอนเช้ามากกว่า 1 ชั่วโมง** · **ไม่จับ DIP**\n- ตรวจพบ **บวมนุ่มมีน้ำ กดเจ็บ MCP squeeze test บวก** · ระยะท้ายพบ ulnar deviation, swan-neck, boutonnière\n- แล็บ: **RF และ anti-CCP** (anti-CCP จำเพาะกว่าและทำนายโรคที่กร่อนกระดูก) · ESR/CRP สูง · **ภาพรังสีเห็น marginal erosion และ periarticular osteopenia** (แต่ระยะแรกภาพปกติ — **อย่ารอ erosion ก่อนเริ่มรักษา**) · อัลตราซาวด์หรือ MRI ช่วยจับ synovitis ระยะแรก\n- อาการนอกข้อ: rheumatoid nodule, ILD, scleritis, **Felty syndrome**, ภาวะโลหิตจางเรื้อรัง, **ความเสี่ยงโรคหัวใจและหลอดเลือดเพิ่มขึ้นชัดเจน**\n\n### หลักการรักษา\n> **Window of opportunity** — เริ่ม DMARD ภายใน **3 เดือนแรก** ให้ผลระยะยาวดีที่สุด NSAIDs และ steroid เพียงคุมอาการ **ไม่ชะลอการกร่อนของข้อ** จึงห้ามใช้เดี่ยว ๆ เป็นการรักษาหลัก\n\n1. **Methotrexate คือยาหลัก (anchor drug)** — เริ่ม 7.5–15 mg **สัปดาห์ละครั้ง** ปรับขึ้นถึง 20–25 mg/สัปดาห์ **ร่วมกับ folic acid 5 mg/สัปดาห์** (คนละวันกับ MTX) เพื่อลดพิษ\n2. ใช้ **steroid ขนาดต่ำเป็นสะพาน (bridging)** ระหว่างรอ DMARD ออกฤทธิ์ (6–12 สัปดาห์) แล้วลดลง\n3. รักษาแบบ **treat-to-target** — ประเมินด้วย DAS28 ทุก 1–3 เดือน เป้าหมายคือโรคสงบหรือ low disease activity\n4. ไม่ถึงเป้า → เพิ่ม conventional DMARD อื่น (sulfasalazine, hydroxychloroquine, leflunomide) หรือเริ่ม **biologic (anti-TNF, tocilizumab, abatacept, rituximab) หรือ JAK inhibitor**\n\n### พิษที่ต้องเฝ้าระวัง\n- **Methotrexate** — กดไขกระดูก · ตับอักเสบ · **แผลในปาก** · **pneumonitis (ไข้ ไอแห้ง หอบ ฝ้าสองข้าง เกิดได้ทุกเวลา ต้องหยุดยาทันทีและให้ steroid)** · **ห้ามในหญิงตั้งครรภ์และต้องคุมกำเนิด** · ระวังในผู้ที่ไตเสื่อม (ขับทางไต) · **ห้ามใช้ร่วมกับ cotrimoxazole** เพราะเสริมฤทธิ์ยับยั้ง folate ทำให้เกิด pancytopenia\n  - ติดตาม **CBC, Cr, LFT ทุก 2–4 สัปดาห์ช่วงแรก แล้วทุก 3 เดือน** · งดสุรา\n- **ก่อนเริ่ม anti-TNF ต้องคัดกรอง latent TB (TST/IGRA + CXR) และไวรัสตับอักเสบบีเสมอ** — ถ้าพบ latent TB ต้องรักษาก่อนหรือพร้อมกันตามแนวทาง (isoniazid) เพราะ TNF จำเป็นต่อการคง granuloma\n- **Hydroxychloroquine** ตรวจตา · **Sulfasalazine** ตรวจ CBC และ LFT · **Leflunomide** ตับและความดัน\n", "pearls": ["RA จับ MCP/PIP/ข้อมือ ฝืดเช้า > 1 ชั่วโมง ไม่จับ DIP", "เริ่ม DMARD ภายใน 3 เดือนแรก — methotrexate สัปดาห์ละครั้ง + folic acid", "MTX + cotrimoxazole = pancytopenia · MTX pneumonitis ต้องหยุดยาทันที", "ก่อน anti-TNF ต้องคัดกรองวัณโรคแฝงและไวรัสตับอักเสบบี"], "items": [{"id": "AIR-MCQ-46", "kind": "mcq", "stem": "A 44-year-old woman has had symmetric swelling of the metacarpophalangeal and wrist joints with 90 minutes of morning stiffness for 10 weeks. RF and anti-CCP are positive, ESR 48 mm/hr, and radiographs show no erosion yet. Which of the following is the most appropriate management?", "choices": ["Start a biologic agent as first-line therapy in all newly diagnosed patients", "Start long-term prednisolone 10 mg daily as the sole therapy", "Start methotrexate with folic acid promptly, using a short course of corticosteroid as a bridge", "Wait for radiographic erosions to appear before starting any disease-modifying therapy", "Start NSAID alone and reassess in 6 months before considering a DMARD"], "answer": 2, "explain": "**RA ทำลายข้ออย่างถาวรเร็วที่สุดใน 2 ปีแรก จึงมีแนวคิด 'window of opportunity' — ต้องเริ่ม DMARD ภายใน 3 เดือนแรกของอาการ ไม่ใช่รอให้เห็น erosion**\n\n**Methotrexate คือ anchor drug** เริ่ม 7.5–15 mg **สัปดาห์ละครั้ง** (ห้ามให้ทุกวัน — เป็นความผิดพลาดที่ทำให้เสียชีวิตได้) ร่วมกับ **folic acid** เพื่อลดแผลในปาก คลื่นไส้ และพิษต่อตับ ติดตาม CBC, LFT, creatinine ทุก 2–4 สัปดาห์ในช่วงแรก **ห้ามใช้ในหญิงตั้งครรภ์หรือวางแผนมีบุตร (teratogen)** และเลี่ยงเมื่อดื่มสุราหนักหรือมีโรคตับ\n\n**Corticosteroid ใช้เป็น 'สะพาน'** ขนาดต่ำระยะสั้นระหว่างรอ methotrexate ออกฤทธิ์ (6–12 สัปดาห์) แล้วลดลงจนหยุด ไม่ใช่ยาหลักระยะยาว\n\n**ก่อนให้ biologic (anti-TNF) ต้องคัดกรอง latent TB (IGRA/TST + CXR) และไวรัสตับอักเสบบีเสมอ** เพราะเสี่ยง reactivation\n\n**ทำไมข้ออื่นผิด** — NSAID ลดปวดแต่ไม่หยุดการทำลายข้อ; biologic ไม่ใช่ first line ตามแนวทางเมื่อยังไม่ได้ลอง conventional DMARD (และราคาสูง); การรอ erosion คือการรอให้เกิดความพิการถาวร; สเตียรอยด์เดี่ยวระยะยาวทำให้กระดูกพรุน เบาหวาน ติดเชื้อ", "pearl": "RA: **เริ่ม methotrexate สัปดาห์ละครั้ง + folic acid ให้เร็วที่สุด** ใช้สเตียรอยด์เป็นสะพาน และคัดกรอง TB/HBV ก่อน biologic", "topic": "Early rheumatoid arthritis — treatment", "src": "", "ref": ["MED33 โพย MCQ RA treatment", "ACR RA Treatment Guideline 2021; EULAR 2022"], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "B5.4(3)", "B5.3(5)"]}, {"id": "AIR-OLD-28", "kind": "old", "stem": "A 46-year-old woman has symmetric swelling of the MCP and PIP joints of both hands with morning stiffness of more than 30 minutes for 4 months. What is the most likely diagnosis?", "choices": ["Rheumatoid arthritis", "Reactive arthritis", "Gouty arthritis", "Septic arthritis", "Osteoarthritis"], "answer": 0, "explain": "**ข้อเล็กสองข้างสมมาตร + ฝืดเช้านาน + เป็นเรื้อรังเกิน 6 สัปดาห์ = RA**; โพยเก่าใช้เกณฑ์ 'morning stiffness > 30 นาที' แต่เกณฑ์ ACR/EULAR 2010 ให้น้ำหนักกับ **จำนวนและขนาดของข้อที่บวม ระยะเวลา ≥ 6 สัปดาห์ RF/anti-CCP และ ESR/CRP** — ฝืดเช้าเป็นเพียงลักษณะประกอบที่บ่งว่าเป็น inflammatory", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 4 'Morning stiffness more than 30 minutes — a. Rheumatoid arthritis b. Reactive arthritis' และ Joint ข้อ 2", "ref": [], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "2.1.27"]}, {"id": "AIR-OLD-42", "kind": "old", "stem": "Which conventional DMARD is the anchor drug for newly diagnosed rheumatoid arthritis, and how is it given?", "choices": ["Prednisolone 10 mg daily as monotherapy", "Methotrexate, given once weekly with folic acid supplementation", "Allopurinol 100 mg daily", "Colchicine 0.6 mg twice daily", "Methotrexate, given once daily with folic acid"], "answer": 1, "explain": "**Methotrexate สัปดาห์ละครั้ง** (การสั่งเป็นทุกวันเป็นความผิดพลาดที่ทำให้เกิด pancytopenia และเสียชีวิตได้) ร่วมกับ **folic acid** เพื่อลดแผลในปากและพิษต่อตับ; ติดตาม CBC, LFT, creatinine; **ห้ามในหญิงตั้งครรภ์**; สเตียรอยด์ใช้เป็นสะพานระยะสั้นเท่านั้น", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED33 โพย RA treatment (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.13-3(12)"]}, {"id": "AIR-MCQ-47", "kind": "mcq", "stem": "A 50-year-old woman with rheumatoid arthritis on methotrexate 15 mg weekly for 2 years presents with fever, cough and progressive dyspnea for 2 weeks. CXR shows diffuse interstitial infiltrates. Lab: WBC 3,200/mm3, platelet 98,000/mm3, AST/ALT 95/110 U/L, creatinine 1.0 mg/dL. Which of the following is the most appropriate immediate management?", "choices": ["Give folic acid only and repeat the chest radiograph in 1 month", "Start an anti-TNF agent immediately to control the underlying disease", "Increase methotrexate because the arthritis is likely flaring", "Continue methotrexate and add an inhaled corticosteroid", "Stop methotrexate, evaluate for both opportunistic infection and methotrexate pneumonitis, and give folinic acid if cytopenia is significant"], "answer": 4, "explain": "**ผู้ป่วย RA ที่ใช้ methotrexate แล้วมีไข้ + ฝ้าในปอด ต้องแยกสองภาวะที่ต้องหยุดยาทั้งคู่**\n1. **Methotrexate pneumonitis** — hypersensitivity ต่อยา เกิดได้ทุกช่วงเวลา มาด้วยไอแห้ง เหนื่อย ไข้ ฝ้า interstitial\n2. **การติดเชื้อฉวยโอกาส** — PCP, วัณโรค, เชื้อรา จากภาวะภูมิคุ้มกันต่ำ (ยิ่งถ้าใช้สเตียรอยด์ร่วม)\n\nทั้งสองอย่างจัดการเริ่มต้นเหมือนกันคือ **หยุด methotrexate ทันที ให้ออกซิเจน ส่งตรวจหาเชื้อ (sputum, BAL) และให้ยาปฏิชีวนะครอบคลุมจนกว่าจะตัดการติดเชื้อออก**\n\n**พิษอื่นของ methotrexate** — กดไขกระดูก (เม็ดเลือดขาวและเกล็ดเลือดต่ำอย่างในเคสนี้ ให้ **folinic acid/leucovorin** ช่วยกู้), ตับอักเสบและพังผืด, แผลในปาก, คลื่นไส้ ความเสี่ยงสูงขึ้นเมื่อไตเสื่อม ใช้ร่วมกับ **trimethoprim-sulfamethoxazole** (เสริมฤทธิ์ต้าน folate จนเกิด pancytopenia ได้), NSAID ขนาดสูง หรือลืมกินโฟลิก\n\n**ทำไมข้ออื่นผิด** — การใช้ยาต่อหรือเพิ่มขนาดในภาวะนี้อันตรายถึงชีวิต; ให้โฟลิกแล้วรออีกเดือนช้าเกินไปเมื่อมีทั้งฝ้าปอดและเม็ดเลือดต่ำ; การเริ่ม anti-TNF ขณะสงสัยติดเชื้อเป็นข้อห้าม", "pearl": "Methotrexate: ไข้ + ฝ้าปอด = **หยุดยา แล้วแยก pneumonitis กับการติดเชื้อฉวยโอกาสเสมอ**; ระวังคู่กับ TMP-SMX เพราะเสี่ยง pancytopenia", "topic": "Methotrexate toxicity", "src": "", "ref": ["MED34 โพย MCQ methotrexate toxicity", "ACR RA Guideline 2021"], "nl": ["B5.4(3)", "2.3.3-3(5)", "2.3.13-3(12)"]}, {"id": "AIR-OLD-47", "kind": "old", "stem": "A patient with rheumatoid arthritis on methotrexate develops fever, dry cough and diffuse interstitial infiltrates with leukopenia. What should be done first?", "choices": ["Stop methotrexate and evaluate for both opportunistic infection and drug-induced pneumonitis", "Add an NSAID and observe", "Increase the methotrexate dose for a presumed flare", "Give folic acid and continue the same dose", "Start an anti-TNF agent immediately"], "answer": 0, "explain": "**หยุด methotrexate ทันที** แล้วแยกสองภาวะที่ต้องหยุดยาทั้งคู่: **methotrexate pneumonitis** กับ **การติดเชื้อฉวยโอกาส (PCP, TB, เชื้อรา)** ให้ยาปฏิชีวนะครอบคลุมจนกว่าจะตัดการติดเชื้อออก และให้ **folinic acid** เมื่อมี cytopenia ชัดเจน — **ห้ามเริ่ม biologic ขณะสงสัยติดเชื้อ**", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย methotrexate toxicity (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.3-3(5)"]}, {"id": "AIR-OLD-43", "kind": "old", "stem": "Before starting an anti-TNF biologic agent in rheumatoid arthritis, which screening is mandatory?", "choices": ["Latent tuberculosis (chest radiograph plus tuberculin skin test or IGRA) and hepatitis B and C serology", "Thyroid function test only", "Echocardiography in all patients only", "Serum uric acid and synovial fluid analysis", "Bone mineral density only"], "answer": 0, "explain": "**Anti-TNF ทำให้ latent TB กำเริบเป็นวัณโรคแพร่กระจาย และทำให้ไวรัสตับอักเสบบี reactivate จนตับวาย** จึงต้องคัดกรองก่อนเสมอ; นอกจากนี้ต้องประเมินการติดเชื้อที่ยังรักษาไม่หาย ประวัติมะเร็ง และภาวะหัวใจล้มเหลว (anti-TNF ทำให้แย่ลง) และควรฉีดวัคซีนเชื้อตายให้ครบก่อนเริ่มยา", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย biologic therapy (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.3-3(5)", "2.3.13-3(12)"]}]}, {"id": "air-33-11", "title": "Axial spondyloarthritis", "minutes": 5, "summary": "ปวดหลังแบบอักเสบในคนอายุน้อย — ขยับแล้วดีขึ้น พักแล้วแย่ลง", "nl": ["B5.2.2-3(3)", "2.3.13-3(13)"], "md": "### ปวดหลังแบบอักเสบ (inflammatory back pain) — เกณฑ์ที่ต้องจำ\n- เริ่มก่อน **อายุ 45 ปี** · เป็นมานาน **> 3 เดือน** · **ค่อยเป็นค่อยไป**\n- **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก** · **ปวดตอนกลางคืนจนตื่น และดีขึ้นเมื่อลุกเดิน** · **ฝืดตอนเช้า > 30 นาที**\n- ตรวจร่างกาย: การเคลื่อนไหวของกระดูกสันหลังลดลง (**Schober test**) การขยายของทรวงอกลดลง กดเจ็บข้อ sacroiliac\n\n### เบาะแสนอกกระดูกสันหลัง\n**Enthesitis (เอ็นร้อยหวาย ฝ่าเท้า) · dactylitis · uveitis ด้านหน้าเฉียบพลัน · สะเก็ดเงิน · โรคลำไส้อักเสบเรื้อรัง (IBD)** และประวัติครอบครัว\n\n### การตรวจ\n- **ภาพรังสีเชิงกรานหา sacroiliitis เป็นอันดับแรก** — ระยะท้ายเห็น **syndesmophyte และ bamboo spine**\n- **ถ้าภาพรังสีปกติแต่ยังสงสัยมาก ให้ทำ MRI ของ sacroiliac joint** ซึ่งเห็น **bone marrow edema** ได้ตั้งแต่ระยะที่ยังไม่เห็นในภาพรังสี (non-radiographic axSpA)\n- **HLA-B27 ช่วยสนับสนุนแต่ไม่ใช่การวินิจฉัย** (คนปกติก็บวกได้) · CRP อาจปกติ\n- อย่าสั่ง MRI กระดูกสันหลังส่วนเอวเป็นอันดับแรกโดยไม่ประเมิน sacroiliac joint\n\n### การรักษา\n1. **กายภาพบำบัดและการออกกำลังกายอย่างสม่ำเสมอเป็นหัวใจ** — ช่วยคงท่าทางและการเคลื่อนไหว\n2. **NSAIDs อย่างต่อเนื่องเป็นยาอันดับแรก**\n3. ไม่ตอบสนอง → **anti-TNF หรือ anti-IL-17 (secukinumab)** — **conventional DMARD เช่น methotrexate และ sulfasalazine ไม่ได้ผลกับโรคที่แกนกลาง** ใช้ได้เฉพาะข้อส่วนปลาย\n4. เลิกบุหรี่ · ประเมินกระดูกพรุนซึ่งพบร่วมบ่อย · เฝ้าระวังกระดูกสันหลังหักแม้อุบัติเหตุเบา\n", "pearls": ["ปวดหลังที่ดีขึ้นเมื่อขยับและปวดจนตื่นกลางคืน = inflammatory back pain", "ภาพรังสีปกติแต่สงสัยมาก ให้ทำ MRI ของ sacroiliac joint", "Methotrexate ไม่ได้ผลกับโรคแกนกลาง — ใช้ NSAIDs แล้วต่อด้วย anti-TNF"], "items": [{"id": "AIR-MCQ-49", "kind": "mcq", "stem": "A 27-year-old man has had low back pain for 18 months. The pain wakes him in the second half of the night, is associated with more than 45 minutes of morning stiffness, improves with exercise and worsens with rest. He had one episode of painful red eye with photophobia last year. Which of the following is the most appropriate initial management after confirming sacroiliitis?", "choices": ["Bed rest for 2 weeks and opioid analgesia", "Methotrexate as first-line therapy for axial disease", "Systemic corticosteroid as long-term maintenance therapy", "Regular exercise and physiotherapy with a full-dose NSAID, escalating to a biologic if the response is inadequate", "Lumbar spine surgery"], "answer": 3, "explain": "**Inflammatory back pain แยกจาก mechanical back pain ด้วย 5 ข้อ**: เริ่มก่อนอายุ 45, ค่อยเป็นค่อยไป, **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก**, **ตื่นกลางดึกช่วงครึ่งหลัง**, ข้อฝืดเช้านานเกิน 30 นาที — เคสนี้เข้าทุกข้อ และมี **acute anterior uveitis** ซึ่งเป็นอาการนอกข้อที่พบบ่อยที่สุดของ spondyloarthritis (สัมพันธ์กับ HLA-B27)\n\n**การรักษา**\n1. **ออกกำลังกายและกายภาพบำบัดสม่ำเสมอ เป็นรากฐานที่สำคัญที่สุด** เพื่อรักษาพิสัยการเคลื่อนไหวและป้องกันหลังยึดติด\n2. **NSAID ขนาดเต็ม** เป็นยาตัวแรก (ตอบสนองดีมากจนใช้ช่วยวินิจฉัยได้) ลองอย่างน้อย 2 ตัว ตัวละ 2–4 สัปดาห์\n3. ถ้ายังคุมไม่ได้ → **anti-TNF หรือ anti-IL-17** (คัดกรอง TB/HBV ก่อน)\n\n**ข้อที่ออกสอบบ่อย** — **conventional DMARD เช่น methotrexate และ sulfasalazine ไม่ได้ผลกับโรคแกนกลาง (axial)** ใช้ได้เฉพาะเมื่อมีข้อส่วนปลายอักเสบร่วม\n\n**ทำไมข้ออื่นผิด** — การนอนพักทำให้อาการแย่ลงและเร่งการยึดติด; สเตียรอยด์ระบบระยะยาวไม่มีประโยชน์ในโรคแกนกลางและมีโทษ; การผ่าตัดสงวนไว้สำหรับความผิดรูปรุนแรงหรือกระดูกหัก", "pearl": "Inflammatory back pain (ดีขึ้นเมื่อขยับ ตื่นกลางดึก ฝืดเช้านาน) + uveitis = axial SpA → **ออกกำลังกาย + NSAID เต็มขนาด; methotrexate ไม่ช่วยโรคแกนกลาง**", "topic": "Axial spondyloarthritis", "src": "", "ref": ["MED31 โพย MCQ ankylosing spondylitis", "ASAS-EULAR axial SpA recommendations 2022"], "nl": ["B5.2.2-3(3)", "2.3.13-3(13)", "2.1.26"]}, {"id": "AIR-OLD-45", "kind": "old", "stem": "A 27-year-old man has chronic low back pain that improves with exercise, wakes him in the early morning, with morning stiffness of 1 hour and a past episode of acute anterior uveitis. What is the most likely diagnosis?", "choices": ["Mechanical low back pain", "Lumbar disc herniation", "Axial spondyloarthritis (ankylosing spondylitis)", "Vertebral compression fracture", "Fibromyalgia"], "answer": 2, "explain": "**Inflammatory back pain**: อายุน้อยกว่า 45, ค่อยเป็นค่อยไป, **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก**, ตื่นกลางดึกช่วงครึ่งหลัง, ฝืดเช้า > 30 นาที + **uveitis** ซึ่งเป็นอาการนอกข้อที่พบบ่อยที่สุด (สัมพันธ์กับ HLA-B27); รักษาด้วย **ออกกำลังกาย + NSAID เต็มขนาด** และ anti-TNF/anti-IL-17 เมื่อไม่ตอบสนอง — **methotrexate ไม่ได้ผลกับโรคแกนกลาง**", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED31 โพย ankylosing spondylitis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(3)", "2.3.13-3(13)", "2.1.26"]}]}, {"id": "air-33-12", "title": "ไข้ ผื่น ปวดข้อ — Still disease และโรคเลียนแบบ", "minutes": 6, "summary": "วินิจฉัยแยกโรคเมื่อไข้ไม่ทราบสาเหตุร่วมกับข้ออักเสบ", "nl": ["2.1.1", "2.3.13"], "md": "### Adult-onset Still disease (AOSD)\n- **ไข้สูงเป็นแบบ quotidian** (สูงลอยวันละ 1–2 ครั้ง มักช่วงเย็น แล้วลงเป็นปกติ) ติดต่อกันหลายสัปดาห์\n- **ผื่นสีส้มแซลมอน (evanescent salmon-coloured rash)** ที่ขึ้นพร้อมไข้แล้วจางหายไปเมื่อไข้ลง\n- **ข้ออักเสบหรือปวดข้อ** · **เจ็บคอ** เป็นอาการนำที่พบบ่อยและมักถูกมองข้าม · ต่อมน้ำเหลืองโต ตับม้ามโต\n- แล็บ: **เม็ดเลือดขาวสูงมากโดยเด่น neutrophil · ESR/CRP สูงมาก · ferritin สูงผิดปกติ (มักเกิน 5 เท่าของค่าปกติ) · ANA และ RF ลบ** · ตับอักเสบเล็กน้อย\n- **เป็นการวินิจฉัยแยกโรค** — ต้องตัด **การติดเชื้อ (hemoculture, เยื่อบุหัวใจอักเสบ, วัณโรค, ไวรัส) มะเร็งต่อมน้ำเหลือง และโรคภูมิต้านตนเองอื่น** ให้ได้ก่อนเสมอ ใช้เกณฑ์ Yamaguchi ช่วย\n- ภาวะแทรกซ้อนที่อันตรายคือ **macrophage activation syndrome** — ไข้ไม่ลด **เม็ดเลือดต่ำลงทุกสาย ferritin สูงมาก ไตรกลีเซอไรด์สูง fibrinogen ต่ำ** ต้องรีบรักษาด้วย steroid ขนาดสูง ± anakinra\n- รักษา: NSAIDs ในรายเบา · **corticosteroid เป็นหลัก** · methotrexate ช่วยลด steroid · **anti-IL-1 (anakinra) หรือ anti-IL-6 (tocilizumab)** ในรายดื้อ\n\n### ต้องแยกจากอะไรบ้าง\n| กลุ่มอาการ | เบาะแส |\n|---|---|\n| **การติดเชื้อไวรัสเฉียบพลัน (HIV acute retroviral syndrome, dengue, chikungunya, parvovirus B19, rubella)** | **ไข้ ผื่น ปวดข้อ ต่อมน้ำเหลืองโต แผลในปาก ในคนหนุ่มสาว — ต้องซักประวัติเสี่ยงและตรวจ HIV (ใช้ HIV RNA หรือ 4th-generation antigen/antibody เพราะ antibody อย่างเดียวอาจยังลบ)** · parvovirus ทำให้ปวดข้อเหมือน RA แต่หายเอง · chikungunya ปวดข้อรุนแรงและอาจเรื้อรังเป็นเดือน |\n| **เยื่อบุหัวใจอักเสบติดเชื้อ** | ไข้ + เสียงฟู่ใหม่ + emboli — ต้องเจาะ hemoculture ก่อนให้ยา |\n| **มะเร็งเม็ดเลือดและต่อมน้ำเหลือง** | น้ำหนักลด เหงื่อออกกลางคืน ต่อมน้ำเหลืองโตแข็งไม่เจ็บ LDH สูง |\n| **SLE** | ANA/anti-dsDNA บวก complement ต่ำ ปัสสาวะผิดปกติ |\n| **ไข้จากยา** | สัมพันธ์กับการเริ่มยา eosinophilia |\n", "pearls": ["ไข้สูงลอยรายวัน + ผื่นส้มแซลมอนที่มาพร้อมไข้ + ferritin สูงมาก + ANA/RF ลบ = AOSD", "AOSD เป็นการวินิจฉัยแยกโรค ต้องตัดการติดเชื้อและมะเร็งก่อนเสมอ", "คนหนุ่มสาวที่มีไข้ ผื่น ปวดข้อ ต่อมน้ำเหลืองโต ต้องนึกถึง acute HIV และตรวจด้วยวิธีที่จับระยะแรกได้"], "items": [{"id": "AIR-MCQ-50", "kind": "mcq", "stem": "A 28-year-old woman has 3 weeks of daily fever spiking to 39.5 C in the evening, a salmon-coloured evanescent rash appearing with the fever, sore throat, and arthralgia of the wrists and knees. Lab: WBC 19,000/mm3 with 88% neutrophils, ferritin 8,400 ng/mL, ESR 95 mm/hr, ANA and RF negative, blood cultures negative twice, echocardiography normal. Which of the following is the most likely diagnosis?", "choices": ["Adult-onset Still disease", "Rheumatoid arthritis with extra-articular features", "Infective endocarditis", "Acute leukemia", "Systemic lupus erythematosus"], "answer": 0, "explain": "**ไข้สูงเป็นเวลาเดิมทุกวัน + ผื่นสีปลาแซลมอนที่โผล่พร้อมไข้แล้วหายไป + เจ็บคอ + ปวดข้อ + เม็ดเลือดขาวสูงชนิด neutrophil + ferritin สูงลิ่ว + ANA/RF ลบ = adult-onset Still disease (AOSD)**\n\n**Ferritin ที่สูงเกิน 5 เท่าของค่าปกติ มีความไวสูงมากสำหรับ AOSD** (ยิ่งจำเพาะขึ้นเมื่อ glycosylated ferritin ต่ำกว่า 20%) เพราะเป็น autoinflammatory ที่ IL-1, IL-6 และ IL-18 สูง\n\n**AOSD เป็นการวินิจฉัยแบบตัดโรคอื่นออกก่อน (Yamaguchi criteria)** — ต้องตัดการติดเชื้อ (โดยเฉพาะ **infective endocarditis, วัณโรค, ไวรัส**), มะเร็ง (**ลิมโฟมาและมะเร็งเม็ดเลือดขาว**) และโรคภูมิต้านตนเองอื่นออกให้หมดก่อน ซึ่งโจทย์ทำให้แล้วด้วยการเพาะเชื้อและ echocardiography\n\n**ภาวะแทรกซ้อนที่ต้องระวังคือ macrophage activation syndrome** — ไข้ไม่ลด เม็ดเลือดต่ำลงทุกซีรีส์ ferritin พุ่งสูงขึ้นอีก ไตรกลีเซอไรด์สูง fibrinogen ต่ำ ตับวาย ต้องรีบให้สเตียรอยด์ขนาดสูง\n\n**การรักษา** — NSAID ในรายที่ไม่รุนแรง, สเตียรอยด์เป็นหลัก, ตามด้วย methotrexate หรือยาต้าน IL-1/IL-6 ในรายที่ต้องพึ่งสเตียรอยด์", "pearl": "ไข้รายวัน + ผื่นแซลมอนตามไข้ + เจ็บคอ + **ferritin สูงมาก + ANA/RF ลบ = AOSD** แต่ต้องตัดติดเชื้อและมะเร็งออกก่อนเสมอ", "topic": "Adult-onset Still disease versus infection", "src": "", "ref": ["MED34 โพย MCQ ไข้ไม่ทราบสาเหตุ", "Yamaguchi criteria; Harrison 21st ed."], "nl": ["2.1.1", "2.1.27", "2.1.50", "2.3.13-3(12)"]}, {"id": "AIR-OLD-50", "kind": "old", "stem": "A 28-year-old woman has daily evening fever for 3 weeks, an evanescent salmon-coloured rash, sore throat, arthralgia, neutrophilic leukocytosis and ferritin 8,000 ng/mL, with negative ANA, RF and blood cultures. What is the most likely diagnosis?", "choices": ["Adult-onset Still disease", "Systemic lupus erythematosus", "Infective endocarditis", "Lymphoma", "Rheumatoid arthritis"], "answer": 0, "explain": "**ไข้รายวัน + ผื่นสีปลาแซลมอนที่มาพร้อมไข้ + เจ็บคอ + เม็ดเลือดขาวสูงชนิด neutrophil + ferritin สูงมาก + ANA/RF ลบ = adult-onset Still disease** ซึ่งเป็นการวินิจฉัยแบบตัดโรคอื่นออก (ต้องตัดการติดเชื้อ โดยเฉพาะ endocarditis และวัณโรค กับมะเร็งต่อมน้ำเหลืองออกก่อน); ระวังภาวะแทรกซ้อน **macrophage activation syndrome** เมื่อเม็ดเลือดต่ำลงทุกซีรีส์และ ferritin พุ่งขึ้นอีก", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย ไข้ไม่ทราบสาเหตุ (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.1.1", "2.1.27", "2.1.50"]}, {"id": "AIR-OLD-13", "kind": "old", "stem": "A 20-year-old man presents with fever, arthralgia, a maculopapular rash over the trunk and extremities, and swelling with warmth and limited movement of both knees, ankles and elbows. Hct 40%, WBC 3,500/mm3 (N 45%, L 50%, atypical lymphocyte 5%), platelet 45,000/mm3. What is the most likely diagnosis?", "choices": ["Acute gouty arthritis", "Septic arthritis", "Chikungunya virus infection", "Systemic lupus erythematosus", "Rickettsial infection"], "answer": 2, "explain": "**ไข้ + ผื่น + ปวดข้อหลายข้อสมมาตร + เม็ดเลือดขาวต่ำ + เกล็ดเลือดต่ำ + atypical lymphocyte = ไวรัส (chikungunya หรือ dengue)** ไม่ใช่เก๊าท์ซึ่งไม่ทำให้เม็ดเลือดต่ำและมักเป็นข้อเดียวในชายที่มีปัจจัยเสี่ยง; chikungunya เด่นที่ **ปวดข้อรุนแรงหลายข้อและอาจปวดต่อเนื่องเป็นเดือน** ส่วน dengue เด่นที่ไข้สูง ปวดเมื่อย และเกล็ดเลือดต่ำมากกว่า", "pearl": "", "topic": "", "src": "MED34 โพย MCQ '20 year old man fever, arthralgia, rash ... Diag? A. Chikungunya B. Acute gout C. Rickettsia'", "ref": [], "nl": ["2.1.27", "2.1.1", "2.1.50"]}]}], "date": "TBD — แก้ใน config.lectures"}], "label": "AIR", "thai": "ภูมิแพ้ ภูมิคุ้มกัน และโรคข้อรูมาติก", "accent": {"light": "#8a5a12", "soft": "#f4ecdd", "ink": "#6d460c", "dark": "#d9ab63", "darkSoft": "#241d12", "darkInk": "#ecc98f"}}]</script>

/* ---------- tiny markdown (เหมือน drill.html) ---------- */
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(t){return esc(t)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");}
function md(src){
  var lines=String(src==null?"":src).split("\n"),out=[],i=0,para=[];
  function flushPara(){if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[];}}
  function flushTable(){
    var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
    if(!rows.length)return;
    var cells=rows.map(function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});});
    var hasSep=cells.length>1&&cells[1].every(function(c){return /^:?-{2,}:?$/.test(c);});
    var head=cells[0],body=hasSep?cells.slice(2):cells.slice(1);
    var h="<div class='tablewrap'><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
    body.forEach(function(r){h+="<tr>"+r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>";});
    out.push(h+"</tbody></table></div>");
  }
  function flushList(ordered){
    var tag=ordered?"ol":"ul",items=[];
    while(i<lines.length){
      var m=ordered?lines[i].match(/^\s*\d+[.)]\s+(.*)$/):lines[i].match(/^\s*[-•]\s+(.*)$/);
      if(!m)break;
      var txt=m[1];i++;
      while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*[-•]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*\|/.test(lines[i])){txt+=" "+lines[i].trim();i++;}
      items.push("<li>"+inline(txt)+"</li>");
    }
    out.push("<"+tag+">"+items.join("")+"</"+tag+">");
  }
  while(i<lines.length){
    var L=lines[i];
    if(/^\s*>\s?/.test(L)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      flushPara();out.push("<div class='callout'>"+md(q.join("\n"))+"</div>");continue;}
    if(/^\s*####\s+/.test(L)){flushPara();out.push("<h4>"+inline(L.replace(/^\s*####\s+/,""))+"</h4>");i++;continue;}
    if(/^\s*###\s+/.test(L)){flushPara();out.push("<h3>"+inline(L.replace(/^\s*###\s+/,""))+"</h3>");i++;continue;}
    if(/^\s*\|/.test(L)){flushPara();flushTable();continue;}
    if(/^\s*[-•]\s+/.test(L)){flushPara();flushList(false);continue;}
    if(/^\s*\d+[.)]\s+/.test(L)){flushPara();flushList(true);continue;}
    if(!L.trim()){flushPara();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();return out.join("");
}

/* ---------- data helpers ---------- */
function course(){return COURSES.filter(function(c){return c.set===state.course;})[0]||COURSES[0];}
function lectures(){return course().lectures;}
function lecOf(id){return lectures().filter(function(l){return l.lec===id;})[0];}
function secOf(lec,id){return (lec?lec.sections:[]).filter(function(s){return s.id===id;})[0];}
function allSections(){var o=[];lectures().forEach(function(l){l.sections.forEach(function(s){o.push({lec:l,sec:s});});});return o;}
function secStat(sec){
  var n=sec.items.length,a=0,ok=0;
  sec.items.forEach(function(it){var v=state.ans[it.id];if(v!=null){a++;if(v===it.answer)ok++;}});
  return {n:n,answered:a,correct:ok,read:!!state.done[sec.id],
          complete:!!state.done[sec.id]&&(n===0||a===n)};
}
function courseProgress(){
  var all=allSections(),done=0;
  all.forEach(function(x){if(secStat(x.sec).complete)done++;});
  return {done:done,total:all.length,pct:all.length?Math.round(done*100/all.length):0};
}
function letter(i){return "ABCDE".charAt(i)||String(i+1);}
function nlChips(codes){
  if(!codes||!codes.length)return "";
  return codes.map(function(c){var e=NL[c];
    return "<span class='chip nl' title='"+esc(e?(e.section+" · หน้า "+e.page):"")+"'>NL "+esc(c)+(e?" · "+esc(e.title):"")+"</span>";}).join(" ");
}

/* ---------- outline ---------- */
function renderOutline(){
  var html="<h4>หัวข้อทั้งหมด</h4>";
  lectures().forEach(function(l){
    var open=state.lec===l.lec;
    html+="<div class='olec'><button data-lec='"+l.lec+"' class='"+(open?"on":"")+"'>"+
      "<span class='num'>"+esc(l.lec)+"</span><span>"+esc(l.title)+"</span></button>";
    html+="<ul class='osec"+(open?"":" hide")+"'>"+l.sections.map(function(s){
      var st=secStat(s),cls=st.complete?"done":(st.answered||st.read?"part":"");
      return "<li><button data-sec='"+s.id+"' data-slec='"+l.lec+"' class='"+(state.sec===s.id?"on":"")+"'>"+
        "<span class='tick "+cls+"'>✓</span><span>"+esc(s.title)+"</span></button></li>";
    }).join("")+"</ul></div>";
  });
  document.getElementById('outline').innerHTML=html;
}

     "<span class='chip'>"+s.items.length+" ข้อ</span>"+
     "<span class='chip'>ตอบถูก "+st.correct+"/"+(st.answered||0)+" ที่ทำไปแล้ว</span></div>"+
     "<p class='lede'>ตอบให้ครบทุกข้อเพื่อปิดหัวข้อนี้ — ข้อสอบดึงจากคลัง MED28–MED35 และข้อใหม่ของชุดนี้</p>";
  h+=s.items.map(qHtml).join("");
  if(!s.items.length)h+="<p class='lede'>หัวข้อนี้ยังไม่มีข้อสอบผูกไว้</p>";

  h+="<div class='scorebar'>"+
     (st.answered===st.n&&st.n?("<b>ทำครบแล้ว "+st.correct+"/"+st.n+" ข้อ</b>"+
       (st.correct===st.n?" · เก่งมาก ไปหัวข้อถัดไปได้เลย":" · ข้อที่ผิดอ่านคำอธิบายซ้ำอีกรอบก่อนไปต่อ"))
      :("<b>ทำไปแล้ว "+st.answered+"/"+st.n+" ข้อ</b>"))+
     "<span style='flex:1'></span>"+
     "<button class='btn ghost' data-act='resetsec'>ล้างคำตอบหัวข้อนี้</button>"+
     "<button class='btn "+(st.complete?"":"primary")+"' data-act='markread'>"+(state.done[s.id]?"✓ ทำเครื่องหมายว่าเรียนแล้ว":"ทำเครื่องหมายว่าเรียนแล้ว")+"</button>"+
     "</div>";
  h+="<div class='nav' style='margin-top:14px'>"+
     (idx>0?"<button class='btn' data-goto='"+list[idx-1].sec.id+"' data-golec='"+list[idx-1].lec.lec+"'>← "+esc(list[idx-1].sec.title)+"</button>":"")+
     (idx<list.length-1?"<button class='btn primary' data-goto='"+list[idx+1].sec.id+"' data-golec='"+list[idx+1].lec.lec+"'>"+esc(list[idx+1].sec.title)+" →</button>":"<button class='btn primary' data-tab='meq'>ไปฝึก MEQ ต่อ →</button>")+
     "</div></div></section>";
  return h;
}

function qHtml(it){
  var picked=state.ans[it.id],shown=picked!=null;
  var h="<div class='q' id='q-"+esc(it.id)+"'><div class='qid'>"+esc(it.id)+
        (it.kind==="old"?" · คลังข้อสอบเก่า":"")+(it.topic?" · "+esc(it.topic):"")+"</div>"+
        "<div class='stem'>"+md(it.stem)+"</div><div class='choices'>";
  it.choices.forEach(function(c,i){
    var cls="ch";
    if(shown&&i===it.answer)cls+=" correct";
    else if(shown&&i===picked)cls+=" wrong";
    h+="<button class='"+cls+"' data-q='"+esc(it.id)+"' data-i='"+i+"'"+(shown?" disabled":"")+
       "><span class='k'>"+letter(i)+"</span><span>"+inline(c)+"</span></button>";
  });
  h+="</div>";
  if(shown){
    var ok=picked===it.answer;
    h+="<div class='verdict "+(ok?"ok":"no")+"'>"+(ok?"✓ ถูกต้อง":"✗ ยังไม่ใช่ — เฉลยคือข้อ "+letter(it.answer))+"</div>";
    if(it.explain)h+="<div class='explain prose'>"+md(it.explain)+"</div>";
    if(it.pearl)h+="<div class='pearl'><b>Pearl · </b>"+inline(it.pearl)+"</div>";
    var m=[];
    if(it.src)m.push("<span class='chip'>โพย: "+esc(String(it.src).slice(0,90))+"</span>");
    (it.ref||[]).forEach(function(r){m.push("<span class='chip'>"+esc(r)+"</span>");});
    var nl=nlChips(it.nl);
    if(m.length||nl)h+="<div class='meta'>"+m.join("")+nl+"</div>";
  }
  return h+"</div>";
}

function viewPractice(kind){
  var title=kind==="meq"?"Practice · MEQ":"Practice · OSCE / SAQ";
  var all=[];lectures().forEach(function(l){(kind==="meq"?l.meq:l.osce).forEach(function(it){all.push({l:l,it:it});});});
  if(state.pid){
    var hit=all.filter(function(x){return x.it.id===state.pid;})[0];
    if(hit)return kind==="meq"?viewMeq(hit.l,hit.it):viewOsce(hit.l,hit.it);
  }
  var h="<section class='card'><div class='eyebrow'>"+esc(title)+"</div><h2>"+
    (kind==="meq"?"โจทย์ MEQ — เขียนตอบทีละข้อแล้วเทียบแนวคำตอบ":"สถานี OSCE / SAQ — จับเวลา เขียนตอบ แล้วตรวจตามเกณฑ์")+"</h2>"+
    "<p class='lede'>"+(kind==="meq"
      ? "อ่านโจทย์ให้จบ เขียนคำตอบของตัวเองก่อนกดดูเฉลยเสมอ แล้วให้คะแนนตัวเองตามความตรงของคำตอบ"
      : "กดเริ่มจับเวลาแล้วเขียนตอบให้ทันเวลาเหมือนสอบจริง จากนั้นจึงเปิดเกณฑ์ให้คะแนน")+"</p>";
  lectures().forEach(function(l){
    var items=kind==="meq"?l.meq:l.osce;
    if(!items.length)return;
    h+="<h3>คาบ "+esc(l.lec)+" · "+esc(l.title)+"</h3><div class='grid'>"+items.map(function(it){
      var r=state.rate[it.id];
      return "<button class='tile' data-pid='"+esc(it.id)+"'><b>"+esc(it.topic||it.id)+"</b>"+
        "<span>"+esc(it.station||("MEQ · "+((it.questions||[]).length)+" คำถามย่อย"))+"</span>"+
        "<span class='chip"+(r?" acc":"")+"' style='align-self:flex-start;margin-top:4px'>"+(r?("ประเมินตัวเองแล้ว: "+r):"ยังไม่ได้ทำ")+"</span></button>";
    }).join("")+"</div>";
  });
  return h+"</section>";
}

function viewMeq(l,it){
  var h="<section class='card'><div class='eyebrow'>MEQ · คาบ "+esc(l.lec)+" · "+esc(l.lecture||l.title)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2><div class='vignette'>"+esc(it.vignette)+"</div>";
  (it.questions||[]).forEach(function(q,i){
    var kid=it.id+"#"+i,open=!!state.notes[kid+"!shown"];
    h+="<div class='hr'></div><div class='prose'><strong>"+inline(q.q)+"</strong></div>"+
      "<textarea data-note='"+esc(kid)+"' placeholder='เขียนคำตอบของคุณก่อนดูเฉลย…'>"+esc(state.notes[kid]||"")+"</textarea>"+
      "<div class='nav' style='margin-top:9px'><button class='btn"+(open?"":" primary")+"' data-reveal='"+esc(kid)+"'>"+(open?"ซ่อนแนวคำตอบ":"ดูแนวคำตอบ")+"</button></div>"+
      (open?"<div class='explain prose'>"+md(q.a)+"</div>":"");
  });
  h+="<div class='hr'></div>"+rateBar(it)+
     "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='meq'>← กลับไปเลือกโจทย์อื่น</button></div></section>";
  return h;
}

function viewOsce(l,it){
  var mins=(String(it.station||"").match(/(\d+)\s*นาที/)||[])[1]||5;
  var h="<section class='card'><div class='eyebrow'>OSCE / SAQ · คาบ "+esc(l.lec)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2>"+
    "<div class='meta'><span class='chip acc'>"+esc(it.station||"")+"</span>"+
    "<span class='timer' id='timer'>"+mins+":00</span>"+
    "<button class='btn' data-timer='"+mins+"'>เริ่มจับเวลา</button></div>"+
    "<div class='vignette'>"+esc(it.instruction)+"</div>"+
    "<textarea data-note='"+esc(it.id)+"' placeholder='เขียนคำตอบของคุณ…'>"+esc(state.notes[it.id]||"")+"</textarea>"+
    "<div class='nav' style='margin-top:10px'><button class='btn"+(state.notes[it.id+"!shown"]?"":" primary")+"' data-reveal='"+esc(it.id)+"'>"+
      (state.notes[it.id+"!shown"]?"ซ่อนเฉลย":"ดูเฉลยและเกณฑ์ให้คะแนน")+"</button></div>"+
    (state.notes[it.id+"!shown"]?"<div class='explain prose'>"+md(it.answer)+"</div>":"")+
    "<div class='hr'></div>"+rateBar(it)+
    "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='osce'>← กลับไปเลือกสถานีอื่น</button></div></section>";
  return h;
}

function rateBar(it){
  var r=state.rate[it.id];
  return "<div class='selfrate'><span class='lede'>ประเมินตัวเอง:</span>"+
    ["ตอบได้ครบ","ตอบได้บางส่วน","ยังไม่ได้"].map(function(x){
      return "<button class='btn"+(r===x?" on":"")+"' data-rate='"+esc(it.id)+"' data-val='"+x+"'>"+x+"</button>";
    }).join("")+"</div>";
}

function viewReview(){
  var wrong=[];
  allSections().forEach(function(x){x.sec.items.forEach(function(it){
    var v=state.ans[it.id];if(v!=null&&v!==it.answer)wrong.push({s:x.sec,l:x.lec,it:it});});});
  var h="<section class='card'><div class='eyebrow'>ทบทวน</div><h2>ข้อที่เคยตอบผิด</h2>"+
    "<p class='lede'>รวมทุกข้อที่ตอบผิดไว้ที่เดียว — กด “ล้างคำตอบ” เพื่อกลับไปทำใหม่แบบไม่เห็นเฉลย</p>";
  if(!wrong.length)return h+"<p class='lede'>ยังไม่มีข้อที่ตอบผิด — เริ่มทำข้อในหัวข้อต่าง ๆ ก่อน</p></section>";
  h+="<div class='meta'><span class='chip acc'>"+wrong.length+" ข้อ</span>"+
     "<button class='btn ghost' data-act='resetwrong'>ล้างคำตอบทุกข้อที่ผิด</button></div>";
  var byLec={};wrong.forEach(function(w){(byLec[w.l.lec]=byLec[w.l.lec]||[]).push(w);});
  Object.keys(byLec).forEach(function(lc){
    h+="<h3>คาบ "+esc(lc)+" · "+esc(lecOf(lc).title)+"</h3>";
    byLec[lc].forEach(function(w){h+="<div class='lede' style='margin-top:10px'>หัวข้อ: "+esc(w.s.title)+"</div>"+qHtml(w.it);});
  });
  return h+"</section>";
}

/* ---------- render ---------- */
function render(){
  renderMast();renderOutline();
  var m=document.getElementById('main'),h;
  if(state.view==="section")h=viewSection();
  else if(state.view==="meq")h=viewPractice("meq");
  else if(state.view==="osce")h=viewPractice("osce");
  else if(state.view==="review")h=viewReview();
  else if(state.view==="learn"){h=viewHome();}
  else h=viewHome();
  m.innerHTML=h;
  save();
}

function openSection(lec,sec){state.view="section";state.lec=lec;state.sec=sec;render();window.scrollTo({top:0});}
function firstUnfinished(){
  var list=allSections();
  for(var i=0;i<list.length;i++)if(!secStat(list[i].sec).complete)return list[i];
  return list[0];
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==="themeBtn"){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"":"dark");
    if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
    state.theme=nx;save();return;
  }
  if(t.dataset.tab){
    state.view=t.dataset.tab;state.pid=null;
    if(state.view==="learn"){var f=firstUnfinished();openSection(f.lec.lec,f.sec.id);return;}
    render();window.scrollTo({top:0});return;
  }
  if(t.dataset.go==="next"){var f2=firstUnfinished();openSection(f2.lec.lec,f2.sec.id);return;}
  if(t.dataset.lec){state.lec=(state.lec===t.dataset.lec?null:t.dataset.lec);renderOutline();save();return;}
  if(t.dataset.sec){openSection(t.dataset.slec,t.dataset.sec);return;}
  if(t.dataset.goto){openSection(t.dataset.golec,t.dataset.goto);return;}
  if(t.dataset.q){
    if(state.ans[t.dataset.q]==null){
      state.ans[t.dataset.q]=+t.dataset.i;
      var sec=secOf(lecOf(state.lec),state.sec);
      if(sec&&secStat(sec).answered===sec.items.length)state.done[sec.id]=true;
      var id=t.dataset.q;render();
      var el=document.getElementById('q-'+id);if(el)el.scrollIntoView({block:"nearest"});
    }
    return;
  }
  if(t.dataset.act==="markread"){state.done[state.sec]=!state.done[state.sec];render();return;}
  if(t.dataset.act==="resetsec"){
    var s2=secOf(lecOf(state.lec),state.sec);
    s2.items.forEach(function(it){delete state.ans[it.id];});delete state.done[s2.id];render();return;
  }
  if(t.dataset.act==="resetwrong"){
    allSections().forEach(function(x){x.sec.items.forEach(function(it){
      if(state.ans[it.id]!=null&&state.ans[it.id]!==it.answer){delete state.ans[it.id];delete state.done[x.sec.id];}});});
    render();return;
  }
  if(t.dataset.pid!==undefined&&t.dataset.pid!==""){state.pid=t.dataset.pid;render();window.scrollTo({top:0});return;}
  if(t.dataset.back){state.pid=null;state.view=t.dataset.back;render();window.scrollTo({top:0});return;}
  if(t.dataset.reveal){var k=t.dataset.reveal+"!shown";state.notes[k]=!state.notes[k];render();return;}
  if(t.dataset.rate){state.rate[t.dataset.rate]=t.dataset.val;render();return;}
  if(t.dataset.timer){startTimer(+t.dataset.timer);return;}
});
document.addEventListener('input',function(e){
  var ta=e.target;if(ta.tagName!=="TEXTAREA"||!ta.dataset.note)return;
  state.notes[ta.dataset.note]=ta.value;save();
});
var timer=null;
function startTimer(mins){
  if(timer)clearInterval(timer);
  var left=mins*60,el=document.getElementById('timer');
  timer=setInterval(function(){
    left--;el=document.getElementById('timer');
    if(!el){clearInterval(timer);timer=null;return;}
    if(left<=0){clearInterval(timer);timer=null;el.textContent="หมดเวลา";return;}
    el.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  },1000);
}
render();
})();
</script>
