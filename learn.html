ละข้อมือ นานเกิน 6 สัปดาห์ ร่วมกับ **inflammatory pattern** (ฝืดเช้า > 1 ชั่วโมง ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก) และมี systemic inflammation (ESR/CRP สูง, anemia of chronic disease, thrombocytosis)\n**วินิจฉัยแยกโรค**\n1) **Rheumatoid arthritis** — เข้าได้มากที่สุด: ตำแหน่ง MCP/PIP/ข้อมือ สมมาตร เว้น DIP, ฝืดเช้านาน, ประวัติครอบครัว, สูบบุหรี่ (ปัจจัยเสี่ยงสำคัญ)\n2) **SLE** — ให้ polyarthritis สมมาตรได้เช่นกัน ต้องหาอาการระบบอื่น (ผื่น แผลในปาก ไต เม็ดเลือดต่ำ)\n3) **Psoriatic arthritis** — มองหาผื่นสะเก็ดเงิน เล็บผิดปกติ dactylitis และการเป็นที่ DIP\n4) **Viral arthritis (chikungunya, parvovirus B19, hepatitis B/C) หรือ polyarticular gout/CPPD** — ไวรัสมักหายใน 6 สัปดาห์; เก๊าท์หลายข้อพบในผู้สูงอายุที่เป็นมานาน"}, {"q": "2. จงส่งตรวจเพิ่มเติมพร้อมเหตุผล", "a": "1) **RF และ anti-CCP** — anti-CCP จำเพาะต่อ RA สูง (> 95%) และทำนายโรครุนแรง/erosion\n2) **ANA** (และ anti-dsDNA ถ้า ANA บวก) — แยก SLE\n3) **Plain film มือและเท้าสองข้าง** — หา periarticular osteopenia, marginal erosion, ช่องข้อแคบ (เท้ามัก erode ก่อนมือ) ใช้เป็นภาพพื้นฐานเปรียบเทียบ\n4) **Ultrasound หรือ MRI ข้อ** เมื่อภาพรังสียังปกติ เพื่อยืนยัน synovitis/erosion ระยะแรก\n5) **พื้นฐานก่อนเริ่ม DMARD**: CBC, LFT, creatinine, **HBsAg/anti-HBc, anti-HCV, anti-HIV, CXR และคัดกรองวัณโรคแฝง**, urine pregnancy test\n6) ตรวจไวรัสตามบริบทระบาด (chikungunya/dengue) ถ้าประวัติเข้าได้"}, {"q": "3. ผล anti-CCP บวกสูง RF บวก ANA ลบ ภาพรังสีพบ periarticular osteopenia ที่ MCP ยังไม่มี erosion จงวางแผนการรักษาและอธิบายแนวคิด treat-to-target", "a": "**วินิจฉัย: rheumatoid arthritis (seropositive) ระยะแรก ยังไม่มี erosion — อยู่ใน window of opportunity**\n**แผนการรักษา**\n1) เริ่ม **methotrexate 10–15 mg สัปดาห์ละครั้ง** (ย้ำว่า **สัปดาห์ละครั้ง ไม่ใช่ทุกวัน**) ปรับขึ้นตามการตอบสนองถึง 20–25 mg/สัปดาห์ ร่วมกับ **folic acid 5 mg/สัปดาห์** (คนละวันกับ methotrexate)\n2) **Bridging corticosteroid** — prednisolone ขนาดต่ำระยะสั้น หรือฉีดเข้าข้อ แล้วลดจนหยุดภายใน 3 เดือน\n3) NSAID ตามอาการปวด (ไม่ใช่ยาปรับโรค)\n4) **แนะนำเลิกบุหรี่** — บุหรี่ทำให้โรครุนแรงขึ้นและลดการตอบสนองต่อยา\n5) กายภาพบำบัด ออกกำลังกาย ป้องกันข้อผิดรูป และประเมินความเสี่ยงหัวใจและหลอดเลือด (RA เพิ่มความเสี่ยงชัดเจน)\n**Treat-to-target**: ตั้งเป้าให้โรค **remission หรือ low disease activity** วัดด้วยดัชนีเช่น DAS28/CDAI **ประเมินทุก 1–3 เดือน** ถ้ายังไม่ถึงเป้าให้ปรับการรักษาทันที (เพิ่มขนาด, เปลี่ยน/เพิ่ม conventional DMARD, หรือเพิ่ม biologic/JAK inhibitor) ไม่ปล่อยให้โรค active ลอยไปเป็นปี"}, {"q": "4. ผู้ป่วยกลับมาหลังใช้ methotrexate 8 สัปดาห์ ด้วยแผลในปากหลายแผล คลื่นไส้ และ WBC 2,900 /uL จงอธิบายกลไกและการจัดการ", "a": "**กลไก**: methotrexate เป็น folate antagonist — พิษต่อเยื่อบุ (mucositis) และไขกระดูกเกิดจากการขาด folate ในเซลล์ที่แบ่งตัวเร็ว ปัจจัยส่งเสริมคือ **ลืมกิน folic acid**, ไตเสื่อม, ขนาดยาสูงเกินไป, **กินยาผิดเป็นทุกวันแทนสัปดาห์ละครั้ง** และยาที่เสริมฤทธิ์เช่น **trimethoprim-sulfamethoxazole** หรือ NSAID ขนาดสูง\n**การจัดการ**\n1) **หยุด methotrexate ทันที** และทบทวนว่าผู้ป่วยกินยาถูกวิธีหรือไม่ (ถามให้ชัดว่ากินสัปดาห์ละกี่เม็ด วันไหน)\n2) ให้ **folinic acid (leucovorin)** เมื่อ cytopenia ชัดเจน; ดูแลแผลในปาก ให้สารน้ำและอาหารอ่อน\n3) ตรวจ CBC, LFT, creatinine ซ้ำ และเฝ้าระวังการติดเชื้อ (ถ้าไข้ร่วมกับ neutropenia ให้ยาปฏิชีวนะทันที)\n4) เมื่อค่าเลือดกลับปกติ พิจารณาเริ่มใหม่ในขนาดต่ำลง **พร้อม folic acid ที่ถูกต้อง** หรือเปลี่ยนเป็น DMARD ตัวอื่น (sulfasalazine, leflunomide) และหลีกเลี่ยงยาที่เสริมฤทธิ์"}], "ref": ["MED33 โพย Joint ข้อ 2 'ปวดข้อนิ้วมือ MCP, PIP สองข้างเท่ากัน ปวดมากขึ้นตอนเช้า'", "ACR RA Treatment Guideline 2021"], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "B5.3(5)", "B5.4(3)", "2.1.27"], "_kind": "meq", "_set": "air"}], "osce": [{"id": "AIR-OSCE-02", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Palpable purpura", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ชายไทยอายุ 19 ปี มาด้วยผื่นที่ขาสองข้าง 3 วัน ร่วมกับปวดท้องบิดเป็นพัก ๆ และปวดข้อเท้าสองข้าง 1 สัปดาห์ก่อนหน้านี้เป็นไข้หวัด\nให้ภาพถ่ายผื่น: ผื่นจุดเลือดออกสีแดงคล้ำ ขนาด 2–5 มิลลิเมตร กระจายที่หน้าแข้งและก้นทั้งสองข้าง **คลำได้นูน** กดไม่จาง\nผลตรวจ: Plt 320,000 /uL, PT/aPTT ปกติ, UA: protein 1+, RBC 20–30/HPF\n\n3.1 จงบรรยายลักษณะผื่นที่เห็นด้วยศัพท์ทางการแพทย์ (2 คะแนน)\n3.2 การที่ผื่น 'คลำได้นูน' ร่วมกับเกล็ดเลือดปกติ บอกกลไกอะไร (2 คะแนน)\n3.3 จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด พร้อมเหตุผล (2 คะแนน)\n3.4 จงบอกการตรวจที่ต้องติดตามและภาวะแทรกซ้อนที่กำหนดพยากรณ์โรค (2 คะแนน)\n3.5 จงให้การวินิจฉัยแยกโรคของ palpable purpura มาอีก 3 โรค (2 คะแนน)", "answer": "**3.1 บรรยายผื่น (2 คะแนน)** — **palpable purpura**: จุดเลือดออกสีแดงคล้ำถึงม่วง ขนาด 2–5 มม. **กดไม่จาง (non-blanching)** **คลำได้นูนเหนือผิวหนัง** กระจายแบบสมมาตรบริเวณ **dependent area** (หน้าแข้ง ก้น) บางจุดรวมกันเป็นปื้น\n\n**3.2 กลไก (2 คะแนน)**\n- **กดไม่จาง** = เลือดออกนอกหลอดเลือดแล้ว (extravasated RBC) ไม่ใช่หลอดเลือดขยาย\n- **คลำได้นูน** = มีการอักเสบและเซลล์อักเสบแทรกในผนังหลอดเลือด (**leukocytoclastic vasculitis**) ทำให้ผนังบวมหนา\n- **เกล็ดเลือดและการแข็งตัวปกติ** = ไม่ใช่ ITP, DIC หรือความผิดปกติของการแข็งตัวของเลือด (ซึ่งจ้ำจะ **ราบ** ไม่นูน)\n\n**3.3 การวินิจฉัย (2 คะแนน)** — **IgA vasculitis (Henoch-Schonlein purpura)** จาก tetrad: palpable purpura ที่ขาและก้น + ปวดข้อ + ปวดท้องบิด + ไตอักเสบ (โปรตีนและเม็ดเลือดแดงในปัสสาวะ) เกิดตามหลังการติดเชื้อทางเดินหายใจส่วนบน\n\n**3.4 การติดตาม (2 คะแนน)** — **ไตคือตัวกำหนดพยากรณ์โรค** ต้องตรวจ **urinalysis และวัดความดันโลหิตเป็นระยะ** (ทุก 1–2 สัปดาห์ในเดือนแรก แล้วต่อเนื่องนาน 6–12 เดือน) เพราะ nephritis อาจปรากฏภายหลังผื่นหาย; ภาวะแทรกซ้อนอื่นที่ต้องระวังคือ **เลือดออกในทางเดินอาหารและลำไส้กลืนกัน (intussusception)** โดยเฉพาะในเด็ก\n\n**3.5 วินิจฉัยแยกโรคของ palpable purpura (2 คะแนน)** ตอบ 3 ใน\n- **ANCA-associated vasculitis** (GPA, MPA, EGPA)\n- **Cryoglobulinemic vasculitis** (สัมพันธ์กับไวรัสตับอักเสบซี)\n- **Hypersensitivity/drug-induced (leukocytoclastic) vasculitis**\n- **Meningococcemia หรือ infective endocarditis** (ติดเชื้อ ต้องแยกก่อนเสมอเพราะรักษาต่างกันสิ้นเชิง)\n- **SLE-associated vasculitis**", "ref": ["MED32 โพย SAQ ผื่น purpura", "Harrison 21st ed., The Vasculitis Syndromes"], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"], "_kind": "meq", "_set": "air"}, {"id": "AIR-OSCE-03", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Hand radiograph: rheumatoid arthritis versus osteoarthritis", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "หญิงไทยอายุ 48 ปี ปวดข้อมือและข้อนิ้วมือสองข้าง 6 เดือน ฝืดตอนเช้า 1 ชั่วโมง\nให้ภาพรังสีมือสองข้าง: พบ **soft tissue swelling รอบ MCP, periarticular osteopenia, ช่องข้อ MCP และข้อมือแคบลงอย่างสม่ำเสมอ และมี marginal erosion ที่ MCP ที่ 2 และ 3** ไม่พบ osteophyte\n\n4.1 จงบรรยายภาพรังสีที่เห็นเป็นข้อ ๆ (2 คะแนน)\n4.2 จงให้การวินิจฉัยและบอกลักษณะที่ใช้แยกจาก osteoarthritis (3 คะแนน)\n4.3 จงบอกการตรวจทางห้องปฏิบัติการที่ช่วยยืนยันการวินิจฉัย 2 อย่าง (2 คะแนน)\n4.4 ก่อนเริ่มยากลุ่ม biologic ต้องคัดกรองอะไรบ้าง และเพราะเหตุใด (3 คะแนน)", "answer": "**4.1 บรรยายภาพรังสี (2 คะแนน)**\n1) soft tissue swelling รอบข้อ MCP ทั้งสองข้าง (สะท้อน synovitis)\n2) **periarticular osteopenia** — กระดูกบางเฉพาะรอบข้อที่อักเสบ\n3) **ช่องข้อแคบลงอย่างสม่ำเสมอ (uniform/concentric joint space narrowing)** ที่ MCP และข้อมือ\n4) **marginal erosion** ที่ขอบข้อ MCP ที่ 2 และ 3 บริเวณ bare area\n5) **ไม่พบ osteophyte หรือ subchondral sclerosis**\n\n**4.2 การวินิจฉัยและการแยกโรค (3 คะแนน)** — **Rheumatoid arthritis**\n\n| | **RA** | **OA** |\n|---|---|---|\n| ข้อที่เป็น | **MCP, PIP, ข้อมือ** เว้น DIP | **DIP, PIP**, CMC นิ้วโป้ง |\n| ความหนาแน่นกระดูก | **periarticular osteopenia** | ปกติหรือหนาขึ้น |\n| ช่องข้อ | **แคบสม่ำเสมอทั้งข้อ** | แคบเฉพาะด้านที่รับน้ำหนัก |\n| รอยกร่อน | **marginal erosion** | ไม่มี (ยกเว้น erosive OA ที่ DIP แบบ gull-wing) |\n| **Osteophyte / subchondral sclerosis** | ไม่มี | **มีเด่น** |\n\n**4.3 การตรวจยืนยัน (2 คะแนน)** — **Rheumatoid factor** และ **anti-cyclic citrullinated peptide (anti-CCP)** antibody (anti-CCP จำเพาะสูงกว่าและทำนายโรครุนแรง) เสริมด้วย ESR/CRP เพื่อประเมินความ active\n\n**4.4 การคัดกรองก่อนให้ biologic (3 คะแนน)**\n1) **วัณโรคแฝง** — ซักประวัติสัมผัส, **CXR** และ **tuberculin skin test หรือ IGRA** เพราะยาต้าน TNF ทำให้ latent TB กำเริบเป็นวัณโรคแพร่กระจายได้ ถ้าพบต้องรักษา latent TB ก่อนหรือพร้อมกันตามแนวทาง\n2) **ไวรัสตับอักเสบบีและซี** — HBsAg, anti-HBc, anti-HCV เพราะเสี่ยง HBV reactivation ที่รุนแรงถึงตับวาย\n3) **การติดเชื้อที่ยังไม่ได้รักษา, anti-HIV, ประวัติมะเร็ง และภาวะหัวใจล้มเหลว** (anti-TNF ทำให้ HF แย่ลง) รวมถึงจัดวัคซีนเชื้อตายให้ครบก่อนเริ่มยา และหลีกเลี่ยงวัคซีนเชื้อเป็นระหว่างใช้ยา", "ref": ["MED34 โพย 'Osteopenia at PIP, MCP, mild joint space narrowing, no erosion — Diag? A. Osteoarthritis B. RA'", "ACR RA Guideline 2021"], "nl": ["B5.3(1)", "3.2.5", "2.3.13-3(12)", "B5.3(5)", "B5.4(3)"], "_kind": "meq", "_set": "air"}, {"id": "AIR-OSCE-06", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Proximal muscle weakness with raised enzymes", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "หญิงอายุ 52 ปี มาด้วยลุกจากเก้าอี้และหวีผมลำบากมากขึ้น 3 เดือน ไม่ปวดกล้ามเนื้อมาก ไม่ชา\nPE: กล้ามเนื้อต้นแขนต้นขาแรง 3/5 ทั้งสองข้าง ปลายมือปลายเท้าแรง 5/5 reflex ปกติ ไม่มี sensory loss\nมีผื่นสีม่วงที่เปลือกตาบนสองข้าง และผื่นแดงเป็นขุยที่ข้อนิ้วมือด้านหลัง\nLab: CK 4,200 U/L, AST 180 U/L, ALT 120 U/L, ALP 90 U/L, GGT 22 U/L, TSH ปกติ\n\n6.1 จงบรรยายผื่นทั้งสองตำแหน่งด้วยศัพท์เฉพาะ (2 คะแนน)\n6.2 จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด (2 คะแนน)\n6.3 ผู้ป่วยถูกส่งไปเจาะตับเพราะ AST/ALT สูง ท่านเห็นด้วยหรือไม่ เพราะเหตุใด (2 คะแนน)\n6.4 จงบอกการตรวจเพิ่มเติมที่จำเป็น 4 อย่าง พร้อมเหตุผล (4 คะแนน)", "answer": "**6.1 (2 คะแนน)**\n- ผื่นสีม่วงแดงที่เปลือกตาบนสองข้าง (อาจมีบวมร่วม) = **heliotrope rash**\n- ผื่นแดงนูนเป็นขุยบน **ข้อนิ้วมือด้านหลัง (MCP, PIP)** = **Gottron papules** (ถ้าเป็นปื้นราบเรียกว่า Gottron sign)\n\n**6.2 (2 คะแนน)** — **Dermatomyositis** (idiopathic inflammatory myopathy) จากกล้ามเนื้ออ่อนแรงส่วนต้นสองข้างแบบค่อยเป็นค่อยไป ไม่ปวดเด่น + CK สูงมาก + ผื่นจำเพาะสองอย่าง\n\n**6.3 (2 คะแนน)** — **ไม่เห็นด้วย** เพราะ **AST และ ALT ไม่ได้จำเพาะต่อตับ — พบในกล้ามเนื้อลายด้วย** ในเคสนี้ **ALP และ GGT ปกติ** ซึ่งบ่งว่าไม่มีพยาธิสภาพที่ตับหรือทางเดินน้ำดีจริง ค่าที่สูงจึงอธิบายได้ด้วยการสลายของกล้ามเนื้อ (สอดคล้องกับ CK 4,200) ควรยืนยันด้วย **aldolase** และประเมินกล้ามเนื้อต่อ แทนการเจาะตับ\n\n**6.4 การตรวจเพิ่มเติม (4 คะแนน) — ตอบ 4 ใน**\n1) **Myositis-specific/associated antibodies** (ANA, **anti-Jo-1** และ antisynthetase อื่น, anti-Mi-2, **anti-MDA5**, anti-TIF1-γ ซึ่งสัมพันธ์กับมะเร็ง) — ช่วยจัดกลุ่มและทำนายภาวะแทรกซ้อน\n2) **EMG** — ดู myopathic pattern และเลือกตำแหน่งตัดชิ้นเนื้อ\n3) **MRI กล้ามเนื้อต้นขา** — หาบริเวณอักเสบ (edema) เพื่อชี้ตำแหน่ง biopsy\n4) **Muscle biopsy** — ยืนยันการวินิจฉัยและแยกจาก necrotizing myopathy/inclusion body myositis\n5) **ประเมินปอด: CXR, HRCT และ pulmonary function test** — interstitial lung disease พบบ่อยโดยเฉพาะกลุ่ม anti-Jo-1/anti-MDA5 และเป็นสาเหตุการตายสำคัญ\n6) **ประเมินการกลืนและเสียง** — dysphagia จากกล้ามเนื้อคอหอย เสี่ยงสำลัก\n7) **คัดกรองมะเร็งตามอายุและเพศ** — mammogram, Pap smear, CT ทรวงอก/ช่องท้อง/อุ้งเชิงกราน, ตรวจโพรงหลังจมูก (nasopharyngeal carcinoma พบบ่อยในคนเอเชีย), ส่องกล้องทางเดินอาหารตามข้อบ่งชี้ เพราะ **dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งแฝงราว 15–25%**", "ref": ["MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "MED33 โพย Rheumato ข้อ 5 (statin myopathy)"], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22", "2.1.26"], "_kind": "meq", "_set": "air"}], "sections": [{"id": "air-33-01", "title": "การตรวจ autoantibody อย่างมีเหตุผล", "minutes": 7, "summary": "ANA ใช้คัดกรอง ไม่ใช่ใช้ยืนยัน — และแอนติบอดีแต่ละตัวบอกอะไร", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "**สั่งตรวจแอนติบอดีเมื่อมีอาการที่เข้าได้กับโรคเนื้อเยื่อเกี่ยวพันเท่านั้น** การสั่ง ANA ในคนที่มีเพียงอาการปวดเมื่อยทั่วตัวจะให้ผลบวกลวงบ่อย (ประชากรปกติราวร้อยละ 5–15 มี ANA บวกที่ไทเตอร์ต่ำ และพบมากขึ้นตามอายุ)\n\n| แอนติบอดี | บทบาท | ความหมาย |\n|---|---|---|\n| **ANA (IIF บน HEp-2)** | **การตรวจคัดกรองที่ไวที่สุดของ SLE (ไวราว 95–99%)** | **ลบแทบตัด SLE ออกได้** แต่บวกไม่ได้แปลว่าเป็น — ต้องดูไทเตอร์และรูปแบบการย้อม |\n| **Anti-dsDNA** | **จำเพาะต่อ SLE** | สัมพันธ์กับ **lupus nephritis** และไทเตอร์ขึ้นลงตามการกำเริบ ใช้ติดตามได้ |\n| **Anti-Sm** | **จำเพาะต่อ SLE มากที่สุด** | ไวต่ำ (พบ ~20–30%) ไม่ใช้ติดตามโรค |\n| Anti-Ro (SSA) / La (SSB) | Sjögren, SCLE | **สำคัญในหญิงตั้งครรภ์ — สัมพันธ์กับ neonatal lupus และ congenital heart block** |\n| Anti-U1RNP | MCTD (ไทเตอร์สูงมาก) | มักมี Raynaud และมือบวม |\n| **Anti-centromere** | **limited cutaneous SSc (CREST)** | สัมพันธ์กับ **pulmonary arterial hypertension** |\n| **Anti-Scl-70 (topoisomerase I)** | **diffuse cutaneous SSc** | สัมพันธ์กับ **interstitial lung disease** |\n| **Anti-RNA polymerase III** | diffuse SSc | สัมพันธ์กับ **scleroderma renal crisis** และมะเร็งร่วม |\n| **Anti-Jo-1 (anti-synthetase)** | myositis | ILD + mechanic's hand + Raynaud |\n| **RF / anti-CCP** | RA | **anti-CCP จำเพาะกว่า** และบอกโรคที่รุนแรงกว่า |\n| **ANCA (PR3, MPO)** | vasculitis หลอดเลือดเล็ก | PR3 → GPA · MPO → MPA/EGPA |\n| C3, C4 | **ต่ำเมื่อโรคกำเริบ** โดยเฉพาะ lupus nephritis | ใช้ติดตามคู่กับ anti-dsDNA |\n\n### หลักการแปลผลที่ออกสอบบ่อย\n- **ANA ลบแต่ยังสงสัยมาก** — บางรายมี anti-Ro เดี่ยว ๆ หรือใช้ชุดตรวจแบบ ELISA ที่ไวน้อยกว่า ให้ **ขอตรวจ ANA ด้วยวิธี indirect immunofluorescence บนเซลล์ HEp-2 และส่งแอนติบอดีจำเพาะ** ก่อนจะตัดโรคทิ้ง\n- **แอนติบอดีบวกโดยไม่มีอาการไม่ใช่โรค** — ห้ามเริ่มยากดภูมิคุ้มกันจากผลเลือดเพียงอย่างเดียว\n- **anti-dsDNA + C3/C4 ต่ำ + โปรตีนรั่วในปัสสาวะ** = ภาพของ lupus nephritis ที่กำลังกำเริบ\n", "pearls": ["ANA ไวสูงแต่ไม่จำเพาะ — ใช้คัดกรอง ผลลบช่วยตัด SLE", "Anti-Sm จำเพาะที่สุดต่อ SLE · anti-dsDNA ใช้ติดตามการกำเริบและสัมพันธ์กับไตอักเสบ", "Anti-centromere → PAH · anti-Scl-70 → ILD · anti-RNA pol III → renal crisis"], "items": [{"id": "AIR-OLD-14", "kind": "old", "stem": "Which of the following is the best initial screening test in a patient with suspected systemic lupus erythematosus?", "choices": ["Antinuclear antibody", "Erythrocyte sedimentation rate", "Anti-Smith antibody", "Rheumatoid factor", "Anti-double-stranded DNA antibody"], "answer": 0, "explain": "**ANA = การตรวจคัดกรอง** ความไวสูงกว่า 95% — **ลบแทบตัด SLE ออกได้** แต่จำเพาะต่ำ (บวกได้ในคนปกติ 5-15%, ผู้สูงอายุ, ไทรอยด์อักเสบ); **anti-dsDNA และ anti-Sm คือการตรวจยืนยัน** และ anti-dsDNA ยังใช้ติดตามความ active โดยเฉพาะโรคไต", "pearl": "", "topic": "", "src": "MED34 โพย MCQ ข้อ 34 'ANA'", "ref": [], "nl": ["B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-48", "kind": "old", "stem": "Which antibody pattern is most specific for systemic lupus erythematosus?", "choices": ["Anti-Smith and anti-double-stranded DNA", "Anti-Jo-1 and anti-Mi-2", "Anti-mitochondrial and anti-smooth muscle", "Rheumatoid factor and anti-CCP", "Anti-Scl-70 and anticentromere"], "answer": 0, "explain": "**ANA คือการคัดกรอง (ไวแต่ไม่จำเพาะ) ส่วน anti-Sm และ anti-dsDNA คือการยืนยัน (จำเพาะสูง)**; anti-CCP สำหรับ RA, Scl-70/centromere สำหรับ systemic sclerosis, Jo-1/Mi-2 สำหรับ inflammatory myopathy, anti-mitochondrial สำหรับ primary biliary cholangitis", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย MCQ ข้อ 34 (ANA) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["B5.3(5)", "2.3.13-3(15)"]}]}, {"id": "air-33-02", "title": "SLE — วินิจฉัยและ lupus nephritis", "minutes": 9, "summary": "หญิงวัยเจริญพันธุ์ที่มีอาการหลายระบบ + ANA บวก และเมื่อไรต้องเจาะไต", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### คิดถึง SLE เมื่อไร\nหญิงวัยเจริญพันธุ์ (หญิง:ชาย ราว 9:1) ที่มีอาการ **หลายระบบพร้อมกัน** — ไข้ อ่อนเพลีย น้ำหนักลด ผมร่วง **ผื่นโหนกแก้ม (สงวนร่องแก้ม)** แพ้แสง **แผลในปากที่ไม่เจ็บ** ปวดข้อหลายข้อแบบไม่กร่อน เยื่อหุ้มปอด/หัวใจอักเสบ **เม็ดเลือดต่ำหลายสาย** ปัสสาวะผิดปกติ อาการทางระบบประสาท\n\nเกณฑ์ปัจจุบัน (EULAR/ACR 2019) ใช้ **ANA ≥ 1:80 เป็นประตูทางเข้า** แล้วจึงนับคะแนนตามระบบอวัยวะและภูมิคุ้มกัน (≥ 10 คะแนนจึงจัดเป็น SLE) — แต่ในเวชปฏิบัติ **การวินิจฉัยยังอาศัยภาพรวมทางคลินิกร่วมกับการตัดโรคเลียนแบบ** เช่น การติดเชื้อ ยา และมะเร็งเม็ดเลือด\n\n### แล็บที่ต้องส่งทุกรายเมื่อสงสัย\nCBC with differential · Cr และ eGFR · **urinalysis พร้อมดูตะกอนปัสสาวะ และ urine protein–creatinine ratio** · ANA · anti-dsDNA · anti-Sm · **C3, C4** · **antiphospholipid antibody ทั้งสามชนิด** · LFT · ESR/CRP\n\n> **ผู้ป่วย SLE ทุกรายต้องตรวจปัสสาวะทุกครั้งที่มาตรวจตามนัด** เพราะ lupus nephritis ระยะแรก **ไม่มีอาการ** — ตรวจพบได้จากปัสสาวะเท่านั้น\n\n### Lupus nephritis\n- พบในผู้ป่วย SLE ราวร้อยละ 40–60 และเป็นตัวกำหนดพยากรณ์โรคหลัก\n- **ข้อบ่งชี้ของการเจาะชิ้นเนื้อไต** — โปรตีนในปัสสาวะ **≥ 0.5 g/วัน (หรือ UPCR ≥ 500 mg/g)** · มี **active urinary sediment** (เม็ดเลือดแดงผิดรูป, RBC cast) · Cr สูงขึ้นโดยไม่มีเหตุอธิบาย\n- **การเจาะไตเปลี่ยนการรักษาจริง** เพราะชั้น (class) กำหนดยา — class I–II ดูแลประคับประคอง · **class III/IV (proliferative) ต้องให้ยากดภูมิคุ้มกันแบบเข้มข้น** (mycophenolate หรือ cyclophosphamide ขนาดต่ำแบบ Euro-Lupus ร่วมกับ corticosteroid ± belimumab/voclosporin) · class V (membranous) พิจารณาตามระดับโปรตีน\n- **ให้ hydroxychloroquine แก่ผู้ป่วย SLE ทุกรายถ้าไม่มีข้อห้าม** — ลดการกำเริบ ลดการเกิดไตอักเสบ ลดลิ่มเลือด และเพิ่มอัตรารอดชีวิต\n- ควบคุมความดันและลดโปรตีนรั่วด้วย **ACEI/ARB** ร่วมเสมอ\n", "pearls": ["SLE = หญิงวัยเจริญพันธุ์ + อาการหลายระบบ + ANA บวก และตัดการติดเชื้อออกแล้ว", "โปรตีนในปัสสาวะ ≥ 0.5 g/วัน หรือมี active sediment = ข้อบ่งชี้เจาะชิ้นเนื้อไต", "Hydroxychloroquine ให้ทุกรายที่ไม่มีข้อห้าม"], "items": [{"id": "AIR-MCQ-31", "kind": "mcq", "stem": "A 24-year-old woman has 3 months of fatigue, malar rash sparing the nasolabial folds, painless oral ulcers, and symmetric arthritis of the hands without erosion. Lab: WBC 3,100/mm3, lymphocyte 800/mm3, platelet 130,000/mm3, urinalysis protein 2+, RBC 15–20/HPF with red cell casts. Which of the following investigations best supports the diagnosis?", "choices": ["Rheumatoid factor and anti-cyclic citrullinated peptide antibody", "Antinuclear antibody with anti-double-stranded DNA and complement C3/C4 levels", "Serum uric acid and synovial fluid crystal analysis", "Antineutrophil cytoplasmic antibody with anti-glomerular basement membrane antibody", "Anti-Jo-1 antibody and creatine kinase"], "answer": 1, "explain": "**SLE = โรคภูมิต้านตนเองที่มี immune complex ไปสะสมหลายอวัยวะ** เคสนี้มีครบทั้งผิวหนัง เยื่อบุ ข้อ เลือด และไต ซึ่งเป็นภาพคลาสสิก\n\n**การตรวจตามลำดับ**\n1. **ANA** เป็นการตรวจคัดกรอง ความไวสูงมาก (> 95%) — **ANA ลบแทบตัด SLE ออกได้** แต่ความจำเพาะต่ำ (พบบวกได้ในคนปกติ ผู้สูงอายุ ไทรอยด์อักเสบ ตับอักเสบเรื้อรัง)\n2. **Anti-dsDNA และ anti-Smith** จำเพาะสูงต่อ SLE; anti-dsDNA ยัง **สัมพันธ์กับความรุนแรงของ lupus nephritis** และใช้ติดตามโรค\n3. **C3/C4 ต่ำ** สะท้อนการใช้ complement ไปกับ immune complex = โรคกำลัง active\n\n**เบาะแสที่สำคัญที่สุดในเคสนี้คือ RBC cast + โปรตีนในปัสสาวะ = glomerulonephritis** ต้องประเมินเพื่อทำ renal biopsy ต่อ\n\n**ทำไมข้ออื่นผิด** — RF/anti-CCP ใช้กับ RA (RF บวกได้ใน SLE แต่ไม่ช่วยวินิจฉัย), ANCA/anti-GBM ใช้กับ pulmonary-renal syndrome จาก vasculitis, uric acid/ผลึกใช้กับเก๊าท์, anti-Jo-1/CK ใช้กับ inflammatory myopathy", "pearl": "**ANA = คัดกรอง (ลบแทบตัดออก) · anti-dsDNA + anti-Sm = ยืนยัน · C3/C4 ต่ำ = active** — และ RBC cast แปลว่าไตอักเสบจนกว่าจะพิสูจน์เป็นอื่น", "topic": "Diagnosis of systemic lupus erythematosus", "src": "", "ref": ["MED34 โพย MCQ SLE", "EULAR/ACR SLE Classification Criteria 2019"], "nl": ["2.3.13-3(15)", "B5.2.2-3(5)", "B5.3(5)", "2.1.50"]}, {"id": "AIR-MCQ-32", "kind": "mcq", "stem": "A 26-year-old woman with newly diagnosed SLE has urine protein-to-creatinine ratio 1.8 g/g, active urine sediment with red cell casts, and creatinine 1.3 mg/dL (was 0.8 mg/dL 4 months ago). Which of the following is the most appropriate next step?", "choices": ["Percutaneous renal biopsy to determine the class of lupus nephritis before immunosuppressive therapy", "Start pulse methylprednisolone and cyclophosphamide without biopsy in all cases", "Repeat anti-double-stranded DNA and treat only if the titre is rising", "Start an ACE inhibitor and repeat the urine studies in 6 months", "Refer for dialysis planning"], "answer": 0, "explain": "**Lupus nephritis แบ่งเป็น class I–VI ตาม ISN/RPS และ 'class เป็นตัวกำหนดการรักษา' ซึ่งดูจากเลือดหรือปัสสาวะไม่ได้**\n\n- **Class I–II (mesangial)** — ให้การรักษาประคับประคอง คุมความดัน ให้ ACEI/ARB ไม่ต้องกดภูมิแรง\n- **Class III/IV (focal/diffuse proliferative)** — รุนแรงที่สุด ต้อง induction ด้วย **สเตียรอยด์ขนาดสูง + mycophenolate หรือ cyclophosphamide** (พิจารณาเพิ่ม belimumab/voclosporin)\n- **Class V (membranous)** — โปรตีนรั่วมาก เสี่ยง thrombosis แนวทางต่างจาก proliferative\n- **Class VI (sclerotic)** — เนื้อไตพังแล้ว การกดภูมิไม่ช่วย\n\n**ข้อบ่งชี้ biopsy** — proteinuria ≥ 0.5 g/วัน (หรือ UPCR ≥ 0.5 g/g) โดยเฉพาะเมื่อมี **active sediment** หรือ creatinine สูงขึ้นโดยไม่มีสาเหตุอื่น — เคสนี้เข้าครบ\n\n**ทำไมข้ออื่นผิด** — การให้ cyclophosphamide ทุกรายโดยไม่รู้ class ทำให้ผู้ป่วย class II หรือ VI ได้รับพิษยาโดยไม่จำเป็น (มีบุตรยาก ติดเชื้อ มะเร็งกระเพาะปัสสาวะ); การให้ ACEI แล้วรอ 6 เดือนปล่อยให้ไตเสียถาวร; anti-dsDNA ใช้ติดตามไม่ใช่ตัดสินการรักษา; ยังไม่มีข้อบ่งชี้ฟอกไต", "pearl": "SLE + โปรตีนรั่ว ≥ 0.5 g/วัน หรือ active sediment → **biopsy ก่อนเสมอ เพราะ class เป็นตัวเลือกยา**", "topic": "Lupus nephritis — indication for renal biopsy", "src": "", "ref": ["MED34 โพย MCQ lupus nephritis", "KDIGO Glomerular Diseases Guideline 2021"], "nl": ["2.3.13-3(15)", "B5.2.2-3(5)"]}, {"id": "AIR-OLD-49", "kind": "old", "stem": "A woman with SLE and lupus nephritis wishes to become pregnant. Which drug must be stopped and replaced before conception?", "choices": ["Calcium and vitamin D supplements", "Prednisolone, stopped completely", "Mycophenolate mofetil, replaced by azathioprine", "Low-dose aspirin, stopped without replacement", "Hydroxychloroquine, replaced by no alternative"], "answer": 2, "explain": "**Mycophenolate เป็น teratogen ต้องหยุดอย่างน้อย 6 สัปดาห์ก่อนตั้งครรภ์ และเปลี่ยนเป็น azathioprine** (เช่นเดียวกับ cyclophosphamide, methotrexate, ACEI/ARB ที่ต้องหยุด); **hydroxychloroquine ต้องใช้ต่อ** เพราะลด flare และลดความเสี่ยง congenital heart block; **low-dose aspirin ควรให้** เพื่อลด preeclampsia; และควรตั้งครรภ์เมื่อโรคสงบอย่างน้อย 6 เดือน", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย SLE in pregnancy (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(15)", "B5.4(3)"]}]}, {"id": "air-33-03", "title": "Drug-induced lupus", "minutes": 4, "summary": "ยาเก่าไม่กี่ตัว · anti-histone บวก · ไตและสมองมักไม่ถูกทำลาย · หยุดยาแล้วหาย", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### ยาที่เป็นสาเหตุคลาสสิก\n**Hydralazine · procainamide · isoniazid · minocycline · methyldopa · quinidine · chlorpromazine · anti-TNF · ยากันชักบางตัว**\n\n### ลักษณะที่ต่างจาก SLE แท้\n| | Drug-induced lupus | SLE |\n|---|---|---|\n| เพศ | หญิง ≈ ชาย | หญิงมากกว่าชายมาก |\n| อายุ | มักสูงอายุ | วัยเจริญพันธุ์ |\n| อาการเด่น | **ไข้ ปวดข้อ ปวดกล้ามเนื้อ เยื่อหุ้มปอด/หัวใจอักเสบ** | หลายระบบรวมถึงไตและระบบประสาท |\n| **ไตและระบบประสาท** | **มักไม่ถูกทำลาย** | ถูกทำลายได้บ่อย |\n| **Anti-histone** | **บวกกว่า 95%** | บวกได้ราว 50–80% (ไม่จำเพาะ) |\n| Anti-dsDNA / C3, C4 | **มักลบ / ปกติ** | บวก / ต่ำเมื่อกำเริบ |\n| การรักษา | **หยุดยาต้นเหตุ** อาการดีขึ้นในสัปดาห์–เดือน ± NSAIDs/steroid ระยะสั้น | ยากดภูมิคุ้มกันระยะยาว |\n\n**กับดัก** — ผู้ป่วยที่กิน hydralazine หรือ isoniazid มานานแล้วมีไข้ ปวดข้อ เจ็บหน้าอกแบบ pleuritic อย่าเพิ่งวินิจฉัย SLE แล้วเริ่มยากดภูมิคุ้มกัน ให้ **ตรวจ anti-histone และหยุดยาต้นเหตุก่อน** ส่วนผู้ป่วยที่เกิดจาก anti-TNF อาจมี anti-dsDNA บวกได้ ซึ่งเป็นข้อยกเว้นของตาราง\n", "pearls": ["Hydralazine, procainamide, isoniazid, minocycline = ยาหลักของ drug-induced lupus", "Anti-histone บวก · anti-dsDNA ลบ · complement ปกติ · ไตไม่ถูกทำลาย", "การรักษาคือหยุดยา ไม่ใช่เริ่มยากดภูมิคุ้มกัน"], "items": [{"id": "AIR-MCQ-33", "kind": "mcq", "stem": "A 62-year-old man treated with hydralazine for 8 months develops fever, arthralgia and pleuritic chest pain. ANA is positive at 1:640 in a homogeneous pattern, anti-histone antibody is positive, anti-double-stranded DNA is negative, and C3/C4 are normal. Renal function and urinalysis are normal. Which of the following is the most appropriate management?", "choices": ["Start cyclophosphamide because pleural involvement indicates severe lupus", "Start hydroxychloroquine and continue hydralazine at a lower dose", "Start high-dose prednisolone with mycophenolate and continue hydralazine", "Stop hydralazine; symptoms usually resolve over weeks, with NSAID or short-course corticosteroid if needed", "Perform renal biopsy before any change in therapy"], "answer": 3, "explain": "**Drug-induced lupus (DIL) ต่างจาก SLE แท้อย่างชัดเจน และการรักษาคือ 'หยุดยา'**\n\n| | **Drug-induced lupus** | **Idiopathic SLE** |\n|---|---|---|\n| ยาต้นเหตุ | **hydralazine, procainamide, isoniazid, minocycline, anti-TNF, quinidine** | — |\n| อายุ/เพศ | สูงอายุ ชาย:หญิง ใกล้เคียงกัน | หญิงวัยเจริญพันธุ์เป็นหลัก |\n| อาการ | **ไข้ ปวดข้อ serositis** | หลายระบบ |\n| ไตและสมอง | **แทบไม่เป็น** | เป็นได้บ่อยและรุนแรง |\n| **Anti-histone** | **บวก > 95%** | บวกได้ ~50% |\n| **Anti-dsDNA / Sm** | **ลบ** | บวก |\n| Complement | **ปกติ** | **ต่ำเมื่อ active** |\n| การรักษา | **หยุดยา** | กดภูมิระยะยาว |\n\nอาการมักดีขึ้นภายในไม่กี่สัปดาห์หลังหยุดยา แม้ ANA อาจบวกอยู่ได้เป็นเดือนถึงปี ให้ NSAID หรือสเตียรอยด์สั้น ๆ ถ้าอาการมาก\n\n**ทำไมข้ออื่นผิด** — การใช้ยากดภูมิแรงหรือ cyclophosphamide ในภาวะที่หายเองเมื่อหยุดยาคือการทำร้ายผู้ป่วย; การใช้ยาต้นเหตุต่อไม่ว่าขนาดใดทำให้โรคคงอยู่; renal biopsy ไม่มีข้อบ่งชี้เมื่อปัสสาวะและการทำงานของไตปกติ", "pearl": "**Anti-histone บวก + anti-dsDNA ลบ + complement ปกติ + ไม่เข้าไตเข้าสมอง = drug-induced lupus → หยุดยา**", "topic": "Drug-induced lupus", "src": "", "ref": ["MED33 โพย MCQ ข้อ 7 'SLE ยา hydralazine'", "Harrison 21st ed., Drug-induced lupus"], "nl": ["2.3.13-3(15)", "B5.3(5)", "2.1.1"]}, {"id": "AIR-OLD-15", "kind": "old", "stem": "A 45-year-old woman on hydralazine for 1 year develops arthralgia, fever and pleuritic chest pain. ANA is positive, anti-double-stranded DNA is negative, anti-histone antibody is positive and complement levels are normal. What is the diagnosis?", "choices": ["Rheumatoid arthritis with serositis", "Systemic lupus erythematosus with renal involvement", "Drug-induced lupus erythematosus", "Viral pleuritis", "Acute rheumatic fever"], "answer": 2, "explain": "**Anti-histone บวก + anti-dsDNA ลบ + complement ปกติ + ไม่เข้าไตและสมอง = drug-induced lupus** ยาคลาสสิกคือ **hydralazine, procainamide, isoniazid, minocycline, anti-TNF** — รักษาโดย **หยุดยา** อาการหายในไม่กี่สัปดาห์ (ANA อาจบวกอยู่ได้เป็นเดือนถึงปี)", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 7 'SLE ยา hydralazine'", "ref": [], "nl": ["2.3.13-3(15)", "B5.3(5)"]}]}, {"id": "air-33-04", "title": "Antiphospholipid syndrome", "minutes": 7, "summary": "ลิ่มเลือดหรือการสูญเสียการตั้งครรภ์ + แอนติบอดีที่ยังบวกซ้ำหลัง 12 สัปดาห์", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### เกณฑ์วินิจฉัย — ต้องมีทั้งทางคลินิกและทางห้องปฏิบัติการ\n**ทางคลินิก** (อย่างน้อยหนึ่งข้อ)\n- **ลิ่มเลือดอุดตัน** ในหลอดเลือดดำ หลอดเลือดแดง หรือหลอดเลือดฝอย (DVT, PE, stroke ในคนอายุน้อย)\n- **ภาวะแทรกซ้อนของการตั้งครรภ์** — แท้งไม่ทราบสาเหตุ **≥ 3 ครั้งก่อนอายุครรภ์ 10 สัปดาห์** · เสียชีวิตในครรภ์ **≥ 1 ครั้งหลัง 10 สัปดาห์** · คลอดก่อนกำหนดก่อน 34 สัปดาห์จาก **ครรภ์เป็นพิษรุนแรงหรือรกเสื่อม**\n\n**ทางห้องปฏิบัติการ** — ต้องบวก **อย่างน้อยหนึ่งใน 3 ตัว และตรวจซ้ำยังบวกอีกครั้งห่างกันอย่างน้อย 12 สัปดาห์**\n1. **Lupus anticoagulant**\n2. **Anticardiolipin IgG/IgM** ไทเตอร์ปานกลางถึงสูง\n3. **Anti-β2-glycoprotein I IgG/IgM**\n\n> เหตุผลที่ต้องตรวจซ้ำ — การติดเชื้อเฉียบพลันและภาวะลิ่มเลือดเองทำให้แอนติบอดีบวกชั่วคราวได้บ่อย การวินิจฉัยจากผลครั้งเดียวในช่วงที่เพิ่งเกิดลิ่มเลือดจึงไม่ถูกต้อง\n\n### เบาะแสในห้องแล็บ\n- **aPTT ยาวขึ้นและไม่แก้ด้วย mixing study** (ตรงข้ามกับการขาดปัจจัยการแข็งตัว) — ชื่อ “lupus anticoagulant” จึงหลอก เพราะในร่างกายจริงทำให้ **เลือดแข็งตัวง่ายขึ้น** ไม่ใช่เลือดออก\n- อาจพบ **VDRL บวกลวง** และเกล็ดเลือดต่ำเล็กน้อย\n\n### การรักษา\n- **มีลิ่มเลือดแล้ว** — **warfarin ระยะยาว เป้าหมาย INR 2–3** (แดงหลอดเลือดแดงหรือเกิดซ้ำอาจพิจารณา INR สูงขึ้นหรือเพิ่ม aspirin) · **ห้ามใช้ DOAC โดยเฉพาะในรายที่มีแอนติบอดีบวกทั้งสามตัว** เพราะการศึกษาพบการเกิดซ้ำสูงกว่า warfarin\n- **Obstetric APS** — **low-dose aspirin ร่วมกับ heparin ขนาดป้องกัน (LMWH) ตลอดการตั้งครรภ์และต่อไปอีก 6 สัปดาห์หลังคลอด** · **ห้าม warfarin ระหว่างตั้งครรภ์** เพราะทำให้ทารกพิการ · การให้ prednisolone หรือ IVIG ไม่ใช่การรักษามาตรฐาน\n- **Catastrophic APS** (ลิ่มเลือดหลายอวัยวะพร้อมกันในเวลาไม่กี่วัน) — ให้ heparin + steroid ขนาดสูง + plasma exchange หรือ IVIG และรักษาปัจจัยกระตุ้น\n- ผู้ป่วยที่มีแอนติบอดีบวกแต่ไม่เคยมีลิ่มเลือด: ควบคุมปัจจัยเสี่ยงหลอดเลือด พิจารณา aspirin ขนาดต่ำเป็นรายบุคคล และให้ hydroxychloroquine เมื่อมี SLE ร่วม\n", "pearls": ["ต้องยืนยันแอนติบอดีซ้ำห่างกันอย่างน้อย 12 สัปดาห์", "aPTT ยาวที่ไม่แก้ด้วย mixing study แต่เลือดแข็งตัวง่าย = lupus anticoagulant", "APS ที่มีลิ่มเลือดใช้ warfarin INR 2–3 ไม่ใช้ DOAC", "ตั้งครรภ์ใช้ aspirin + LMWH ห้าม warfarin"], "items": [{"id": "AIR-MCQ-34", "kind": "mcq", "stem": "A 32-year-old woman has had three unexplained first-trimester miscarriages and one fetal death at 22 weeks. She also had an unprovoked deep vein thrombosis 2 years ago. Which of the following laboratory tests should be ordered to confirm the suspected diagnosis?", "choices": ["Anti-SSA (Ro) and anti-SSB (La) antibodies", "Factor V Leiden mutation alone", "Antineutrophil cytoplasmic antibody", "Lupus anticoagulant, anticardiolipin antibody and anti-beta-2-glycoprotein I, repeated at least 12 weeks apart", "Anti-histone antibody and complement levels"], "answer": 3, "explain": "**Antiphospholipid syndrome (APS) = การเกิดลิ่มเลือด (หลอดเลือดดำ แดง หรือหลอดเลือดขนาดเล็ก) และ/หรือภาวะแทรกซ้อนทางสูติกรรม ร่วมกับ antiphospholipid antibody ที่บวกซ้ำ**\n\n**ต้องครบทั้งเกณฑ์คลินิกและเกณฑ์แล็บ**\n- **คลินิกทางสูติกรรม**: แท้งก่อน 10 สัปดาห์ ≥ 3 ครั้งติดต่อกัน **หรือ** ทารกตายในครรภ์ ≥ 10 สัปดาห์ ≥ 1 ครั้ง **หรือ** คลอดก่อนกำหนดจาก preeclampsia/placental insufficiency\n- **แล็บ**: LA, anticardiolipin (IgG/IgM titer กลาง-สูง), anti-β2GPI ข้อใดข้อหนึ่ง และ **ต้องบวกซ้ำอีกครั้งห่างกันอย่างน้อย 12 สัปดาห์** เพื่อตัด antibody ชั่วคราวหลังติดเชื้อออก\n\n**ทำไมข้ออื่นผิด**\n- **Anti-SSA/SSB** สัมพันธ์กับ Sjogren และ **neonatal lupus/congenital heart block** ไม่ใช่สาเหตุของลิ่มเลือดและแท้งซ้ำ (เป็นตัวลวงที่โพยเก่าใส่ไว้)\n- **Anti-histone** ใช้กับ drug-induced lupus\n- **ANCA** ใช้กับ small-vessel vasculitis\n- **Factor V Leiden** อธิบาย venous thrombosis ได้แต่ไม่อธิบายการแท้งซ้ำ และพบน้อยมากในคนเอเชีย", "pearl": "แท้งซ้ำ + ลิ่มเลือด = **APS → ส่ง LA, anticardiolipin, anti-β2GPI และต้องยืนยันซ้ำที่ 12 สัปดาห์**", "topic": "Antiphospholipid syndrome — investigation", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 3 'หญิงตั้งครรภ์ ประวัติแท้ง 4 ครั้ง แบบ antiphospholipid syndrome ตรวจอะไร — a. Anti SSA (Ro) b. Anti-cardiolipin'", "Sydney/2023 ACR-EULAR APS criteria"], "nl": ["2.3.13-3(15)", "B5.3(5)"]}, {"id": "AIR-OLD-18", "kind": "old", "stem": "A woman with four unexplained pregnancy losses and a past unprovoked deep vein thrombosis is suspected of having antiphospholipid syndrome. Which antibody should be tested?", "choices": ["Anti-SSA (Ro) antibody", "Anti-topoisomerase I (Scl-70) antibody", "Anticardiolipin antibody (with lupus anticoagulant and anti-beta-2-glycoprotein I)", "Anti-histone antibody", "Anti-mitochondrial antibody"], "answer": 2, "explain": "โพยเก่าให้ตัวเลือก 'Anti SSA (Ro)' กับ 'Anti-cardiolipin' — **ตอบ anticardiolipin** และต้องส่งครบสามตัว (LA, aCL, anti-β2GPI) พร้อม **ยืนยันซ้ำห่างกันอย่างน้อย 12 สัปดาห์**; anti-SSA สัมพันธ์กับ Sjogren และ neonatal lupus/congenital heart block ไม่ใช่การแท้งซ้ำจากลิ่มเลือด", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 3 'ผู้หญิงตั้งครรภ์ มีประวัติแท้ง 4 ครั้ง ประวัติแบบ antiphospholipid syndrome ตรวจอะไร'", "ref": [], "nl": ["2.3.13-3(15)", "B5.3(5)"]}, {"id": "AIR-MCQ-35", "kind": "mcq", "stem": "The same patient is now 6 weeks pregnant. Antiphospholipid antibodies were positive on two occasions 12 weeks apart. Which of the following is the most appropriate management during this pregnancy?", "choices": ["No therapy because antiphospholipid antibodies do not affect pregnancy outcome", "Warfarin with a target INR of 2 to 3 throughout pregnancy", "High-dose prednisolone throughout pregnancy", "Low-dose aspirin alone with no anticoagulation", "Low-dose aspirin plus prophylactic low-molecular-weight heparin throughout pregnancy and postpartum"], "answer": 4, "explain": "**Obstetric APS รักษาด้วย low-dose aspirin + heparin** — aspirin เริ่มตั้งแต่ก่อนตั้งครรภ์หรือทันทีที่ทราบ และเติม LMWH เมื่อยืนยันการตั้งครรภ์ กลไก: ลดการเกิดลิ่มเลือดที่รก และ heparin ยังยับยั้งการจับของ antibody กับ trophoblast และลด complement activation → เพิ่มอัตราคลอดมีชีพจากราว 50% เป็น 70–80%\n\n**ผู้ป่วยรายนี้เคยมี thrombosis มาก่อน จึงต้องใช้ heparin ขนาดรักษาและให้ต่อหลังคลอดอย่างน้อย 6 สัปดาห์** ซึ่งเป็นช่วงที่เสี่ยงลิ่มเลือดสูงที่สุด\n\n**ทำไมข้ออื่นผิด**\n- **Warfarin ในไตรมาสแรกเป็นสารก่อวิรูป** (warfarin embryopathy: nasal hypoplasia, stippled epiphyses) และข้ามรกทำให้ทารกเลือดออก — heparin ไม่ข้ามรกจึงปลอดภัย\n- **Aspirin อย่างเดียว** ไม่พอเมื่อเข้าเกณฑ์ APS โดยเฉพาะรายที่มีประวัติ thrombosis\n- **Prednisolone ขนาดสูง** ไม่ช่วยผลลัพธ์การตั้งครรภ์ใน APS และเพิ่ม GDM, ความดันสูง, คลอดก่อนกำหนด\n- **ไม่ทำอะไรเลย** ปล่อยให้แท้งซ้ำทั้งที่ป้องกันได้", "pearl": "Obstetric APS = **aspirin ขนาดต่ำ + heparin** (ห้าม warfarin ในไตรมาสแรก) และให้ต่อหลังคลอด 6 สัปดาห์", "topic": "Obstetric antiphospholipid syndrome — management", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 3 (ต่อ)", "EULAR recommendations for APS in adults 2019"], "nl": ["2.3.13-3(15)"]}]}, {"id": "air-33-05", "title": "ดูแลผู้ป่วย SLE ระยะยาว — ติดเชื้อ พิษยา และการตั้งครรภ์", "minutes": 8, "summary": "แยกกำเริบจากติดเชื้อ · ตรวจตาเมื่อใช้ HCQ · ปวดสะโพกในคนกิน steroid · ยาที่ห้ามในครรภ์", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)", "B5.4(3)"], "md": "### ไข้ในผู้ป่วย SLE ที่ได้ยากดภูมิคุ้มกัน\n**การติดเชื้อคือสาเหตุการตายอันดับต้น ๆ** ให้ถือว่าเป็นการติดเชื้อไว้ก่อนจนกว่าจะพิสูจน์เป็นอย่างอื่น\n\n| ชี้ไปทางการติดเชื้อ | ชี้ไปทางโรคกำเริบ |\n|---|---|\n| **CRP สูงมาก** (โรคกำเริบมักขึ้น ESR แต่ CRP ไม่สูงนัก ยกเว้น serositis หรือข้ออักเสบ) | anti-dsDNA สูงขึ้น |\n| **เม็ดเลือดขาวชนิด neutrophil สูง** | **C3/C4 ต่ำลง** |\n| procalcitonin สูง | เม็ดเลือดขาวต่ำ โปรตีนรั่วเพิ่ม ตะกอนปัสสาวะกลับมา active |\n| มีจุดโฟกัสชัด (ปอด ทางเดินปัสสาวะ ผิวหนัง) | ผื่น ผมร่วง แผลในปาก ปวดข้อ กลับมาพร้อมกัน |\n\n**ต้องเพาะเชื้อและหาจุดติดเชื้อเสมอ ก่อนเพิ่มขนาดยากดภูมิคุ้มกัน** และในผู้ป่วยที่ได้ steroid ขนาดสูงมานาน อย่าลืม **PJP, วัณโรค, cryptococcus, salmonella, CMV และเชื้อรา**\n\n### พิษของยาที่ต้องเฝ้าระวัง\n- **Hydroxychloroquine → retinopathy** ซึ่งทำให้ตาบอดถาวรและ **ไม่มีอาการในระยะแรก** จึงต้อง **ตรวจตาเมื่อเริ่มยา (baseline) และตรวจซ้ำทุกปีหลังใช้ครบ 5 ปี** (เร็วกว่านั้นถ้าไตเสื่อม ใช้ขนาดสูง หรือใช้ tamoxifen ร่วม) ด้วย automated visual field และ SD-OCT — ควบคุมขนาดยา **≤ 5 mg/kg ของน้ำหนักจริงต่อวัน**\n- **Corticosteroid ระยะยาว → osteonecrosis (avascular necrosis) ของหัวกระดูกต้นขา** — ปวดขาหนีบขณะลงน้ำหนัก **ภาพรังสีปกติในระยะแรก การตรวจที่ไวที่สุดคือ MRI** และยังต้องเฝ้าระวังกระดูกพรุน เบาหวาน ต้อกระจก ต้อหิน กล้ามเนื้ออ่อนแรง และการติดเชื้อ\n- **Cyclophosphamide** — hemorrhagic cystitis (ป้องกันด้วยน้ำและ mesna) · ภาวะมีบุตรยาก (พิจารณาเก็บไข่/อสุจิและใช้ GnRH agonist) · มะเร็งกระเพาะปัสสาวะในระยะยาว\n- **Mycophenolate** — กดไขกระดูก ท้องเสีย และ **ทำให้ทารกพิการ**\n\n### การตั้งครรภ์\n- วางแผนให้ตั้งครรภ์เมื่อ **โรคสงบอย่างน้อย 6 เดือน** โดยเฉพาะ lupus nephritis\n- **ยาที่ต้องหยุดก่อนตั้งครรภ์** — **mycophenolate, cyclophosphamide, methotrexate, leflunomide** และหลีกเลี่ยง ACEI/ARB\n- **ยาที่ใช้ต่อได้และควรใช้** — **hydroxychloroquine (ห้ามหยุด)**, azathioprine, tacrolimus, prednisolone ขนาดต่ำ · เพิ่ม **แอสไพรินขนาดต่ำตั้งแต่ไตรมาสแรกเพื่อลดครรภ์เป็นพิษ**\n- ตรวจ **anti-Ro/La** — ถ้าบวกต้องเฝ้าระวัง **congenital heart block** ด้วยการตรวจอัลตราซาวด์หัวใจทารกเป็นระยะ\n- แยก **lupus nephritis กำเริบ ออกจาก preeclampsia** — ไตอักเสบมักมี **ตะกอนปัสสาวะ active, complement ต่ำ, anti-dsDNA สูง** ขณะที่ครรภ์เป็นพิษมักมี **กรดยูริกสูง เกล็ดเลือดต่ำ ตับผิดปกติ หลังอายุครรภ์ 20 สัปดาห์**\n", "pearls": ["ไข้ในผู้ป่วย SLE ที่กินยากดภูมิ = ติดเชื้อไว้ก่อน · CRP สูงมากชี้ไปทางติดเชื้อ", "HCQ ต้องตรวจตา baseline และทุกปีหลังใช้ครบ 5 ปี", "ปวดขาหนีบในคนกิน steroid + ภาพรังสีปกติ = ส่ง MRI หา osteonecrosis", "Mycophenolate, cyclophosphamide, methotrexate ห้ามในครรภ์ · hydroxychloroquine ใช้ต่อ"], "items": [{"id": "AIR-MCQ-36", "kind": "mcq", "stem": "A 30-year-old man with lupus nephritis on prednisolone 30 mg daily and mycophenolate presents with 1 week of dry cough, fever and progressive dyspnea. PE: T 38.6 C, RR 28/min, SpO2 88% on room air, clear breath sounds. CXR shows bilateral interstitial infiltrates. Lab: WBC 9,000/mm3 with lymphocyte 600/mm3, LDH 520 U/L. Which of the following is the most appropriate initial management?", "choices": ["Perform bronchoscopy first and withhold all treatment until results return", "Increase prednisolone to 60 mg daily for a presumed lupus flare and observe", "Start intravenous cyclophosphamide for presumed lupus pneumonitis", "Start oral amoxicillin for community-acquired pneumonia and review in 1 week", "Treat empirically for Pneumocystis jirovecii pneumonia with trimethoprim-sulfamethoxazole and corticosteroid while confirming the diagnosis"], "answer": 4, "explain": "**ผู้ป่วยภูมิต้านตนเองที่ได้ยากดภูมิแล้วมาด้วยไข้ ต้องคิด 'ติดเชื้อ' ก่อน 'โรคกำเริบ' เสมอ** เพราะทั้งสองภาวะหน้าตาเหมือนกัน แต่การเดาผิดทางแล้วเพิ่มยากดภูมิอาจทำให้ผู้ป่วยเสียชีวิต\n\n**ภาพในเคสนี้เข้าได้กับ PCP อย่างยิ่ง** — ไอแห้ง ขาดออกซิเจนมากกว่าที่ฟังปอดได้ (ฟังปอดมักปกติ) ฝ้าแบบ interstitial สองข้าง LDH สูง และ **lymphopenia ในผู้ที่ได้ prednisolone ≥ 20 mg/วันนานเกิน 1 เดือน** ซึ่งเป็นกลุ่มที่ควรได้ **TMP-SMX ป้องกัน** อยู่แล้ว\n\n**การรักษา** — เริ่ม TMP-SMX ขนาดรักษาทันที และเพิ่ม **corticosteroid เสริมเมื่อ PaO2 < 70 mmHg หรือ A-a gradient > 35** (ป้องกันการแย่ลงจากการอักเสบเมื่อเชื้อถูกทำลาย) ระหว่างนั้นส่ง induced sputum หรือ BAL เพื่อยืนยัน และคัดกรอง HIV เสมอ\n\n**ทำไมข้ออื่นผิด** — การเพิ่มสเตียรอยด์หรือให้ cyclophosphamide โดยยังไม่ตัดการติดเชื้อออกคือความผิดพลาดที่อันตรายที่สุด; amoxicillin ไม่ครอบคลุมเชื้อฉวยโอกาสและอาการหนักเกินกว่าจะรักษาแบบผู้ป่วยนอก; การรอ bronchoscopy โดยไม่ให้ยาในผู้ที่ SpO2 88% ทำให้ผู้ป่วยแย่ลงระหว่างรอ", "pearl": "ผู้ป่วยกดภูมิ + ไข้ + ฝ้า interstitial + LDH สูง + ฟังปอดปกติ = **PCP จนกว่าจะพิสูจน์เป็นอื่น** — รักษาก่อน ยืนยันคู่กันไป", "topic": "Fever in a lupus patient on immunosuppression", "src": "", "ref": ["MED34 โพย MCQ 'ช. 30 ปี SLE, lupus nephritis on prednisolone มาด้วยไอ…'", "IDSA/ATS opportunistic infection guidance"], "nl": ["2.3.3-3(5)", "2.3.13-3(15)", "2.1.1"]}, {"id": "AIR-MCQ-37", "kind": "mcq", "stem": "A 38-year-old woman with SLE has taken hydroxychloroquine for 6 years. She is asymptomatic. Which of the following is the most appropriate monitoring plan for this drug?", "choices": ["Annual audiometry because ototoxicity is the main concern", "No eye screening is required because hydroxychloroquine does not affect the eye", "Annual liver function tests only", "Baseline eye examination within the first year, then annual screening after 5 years using automated visual fields and optical coherence tomography", "Weekly complete blood count for the first year"], "answer": 3, "explain": "**Hydroxychloroquine เป็นยาหลักของ SLE ที่ควรให้ทุกรายถ้าไม่มีข้อห้าม** (ลด flare ลดการเกิด lupus nephritis ลดลิ่มเลือด และเพิ่มอัตรารอด) แลกกับพิษที่สำคัญที่สุดคือ **retinopathy แบบ bull's-eye maculopathy** ซึ่งเมื่อเกิดแล้ว **แก้ไม่ได้** จึงต้องคัดกรองก่อนสูญเสียการมองเห็น\n\n**แนวทาง American Academy of Ophthalmology**\n- ตรวจตาพื้นฐานภายในปีแรก แล้ว **เริ่มคัดกรองทุกปีหลังใช้ยาครบ 5 ปี** (เร็วกว่านั้นถ้ามีปัจจัยเสี่ยง: ขนาด > 5 mg/kg/วันของน้ำหนักจริง, CKD, ใช้ tamoxifen, มีโรคจอตาเดิม)\n- เครื่องมือ: **automated visual field 10-2 (หรือ 24-2 ในคนเอเชียเพราะรอยโรคมักอยู่นอกกว่า) ร่วมกับ spectral-domain OCT**\n\n**หมายเหตุจากโพยเก่า** — ข้อเดิมเขียนว่า \"maculopathy ห้ามให้ **hydroxyurea**\" ซึ่งสับสนชื่อยา; ยาที่ทำให้เกิด maculopathy คือ **hydroxychloroquine** ส่วน hydroxyurea ใช้ในโรคเลือดและมีพิษหลักคือกดไขกระดูกและแผลที่ขา\n\n**ทำไมข้ออื่นผิด** — การตรวจตับ การได้ยิน หรือ CBC ถี่ ๆ ไม่ใช่การติดตามหลักของยานี้ (LFT/CBC เป็นการติดตามของ methotrexate และ azathioprine)", "pearl": "Hydroxychloroquine = ยาหลักของ SLE ที่ต้อง **คัดกรองจอตาปีละครั้งหลังใช้ครบ 5 ปี** และคุมขนาดไม่เกิน 5 mg/kg/วัน", "topic": "Hydroxychloroquine retinopathy", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 2 'Maculopathy ห้ามให้ยา (โพยเขียน hydroxyurea)'", "AAO Hydroxychloroquine Screening Recommendations 2016"], "nl": ["2.3.13-3(15)", "B5.4(3)"]}, {"id": "AIR-OLD-17", "kind": "old", "stem": "Which drug used in systemic lupus erythematosus requires periodic ophthalmologic screening because of the risk of irreversible maculopathy?", "choices": ["Azathioprine", "Prednisolone", "Hydroxyurea", "Hydroxychloroquine", "Mycophenolate mofetil"], "answer": 3, "explain": "โพยเก่าเขียนชื่อยาเป็น 'hydroxyurea' ซึ่ง **ผิด** — ยาที่ทำให้เกิด **bull's-eye maculopathy คือ hydroxychloroquine** ต้องตรวจตาพื้นฐานในปีแรกและตรวจทุกปีหลังใช้ครบ 5 ปี (เร็วกว่านั้นถ้าขนาด > 5 mg/kg/วัน หรือมีโรคไต) ด้วย visual field และ OCT; ส่วนสเตียรอยด์ทำให้เกิดต้อกระจกและต้อหิน ซึ่งเป็นคนละภาวะ", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 2 'Maculopathy ห้ามให้ยา — a. Hydroxyurea'", "ref": [], "nl": ["2.3.13-3(15)", "B5.4(3)"]}, {"id": "AIR-MCQ-48", "kind": "mcq", "stem": "A 34-year-old woman with SLE who has received prednisolone 30–60 mg daily for 2 years develops progressive right groin pain, worse on weight bearing, for 6 weeks. Range of motion of the hip is painful at the extremes but the joint is not hot or swollen. ESR 20 mm/hr. Plain radiograph of the hip is normal. Which of the following is the most appropriate next investigation?", "choices": ["Magnetic resonance imaging of both hips", "Hip joint aspiration for culture", "Dual-energy X-ray absorptiometry", "Bone scan of the whole skeleton as the definitive test", "Repeat plain radiograph in 3 months"], "answer": 0, "explain": "**ปวดขาหนีบเมื่อลงน้ำหนัก ในผู้ที่ได้สเตียรอยด์ขนาดสูงนาน = osteonecrosis (avascular necrosis) ของหัวกระดูกต้นขา จนกว่าจะพิสูจน์เป็นอื่น** — สเตียรอยด์และแอลกอฮอล์เป็นสาเหตุที่พบบ่อยที่สุดในผู้ใหญ่ (กลไก: ไขมันในไขกระดูกโตขึ้นและ microthrombosis ทำให้ความดันในกระดูกสูงและเลือดไปเลี้ยงลดลง) และ SLE เองก็เพิ่มความเสี่ยง โดยเฉพาะเมื่อมี antiphospholipid antibody\n\n**ฟิล์มธรรมดาปกติในระยะแรกเสมอ** (กว่าจะเห็น crescent sign หรือหัวกระดูกยุบคือสายแล้ว) — **MRI คือการตรวจที่ไวและจำเพาะที่สุด** และต้องถ่าย **ทั้งสองข้าง** เพราะเป็นสองข้างได้ถึง 50–80% แม้อีกข้างยังไม่ปวด\n\n**เหตุผลที่ต้องรีบ** — ถ้าจับได้ก่อนหัวกระดูกยุบ (pre-collapse) ยังมีทางเลือกรักษาข้อไว้ได้ เช่น ลดการลงน้ำหนัก ลดสเตียรอยด์ให้ต่ำที่สุด core decompression; เมื่อยุบแล้วมักจบที่การเปลี่ยนข้อสะโพก\n\n**ทำไมข้ออื่นผิด** — การรอถ่ายฟิล์มซ้ำอีก 3 เดือนปล่อยให้โรคเข้าสู่ระยะยุบ; bone scan ไวน้อยกว่า MRI ในระยะแรก; การเจาะข้อเหมาะกับข้อติดเชื้อซึ่งจะมีไข้ ข้อบวมร้อน; DXA ประเมินกระดูกพรุนซึ่งเป็นคนละภาวะ (แม้ผู้ป่วยรายนี้ควรได้รับการประเมินด้วยก็ตาม)", "pearl": "ปวดสะโพกในคนกินสเตียรอยด์นาน + ฟิล์มปกติ = **ส่ง MRI สองข้างหา osteonecrosis** อย่ารอฟิล์มซ้ำ", "topic": "Glucocorticoid complications — osteonecrosis", "src": "", "ref": ["MED32 โพย MCQ ภาวะแทรกซ้อนของสเตียรอยด์", "Harrison 21st ed., Osteonecrosis"], "nl": ["2.3.13-3(8)", "2.3.13-3(15)", "B5.2.5(2)"]}, {"id": "AIR-OLD-44", "kind": "old", "stem": "A 34-year-old woman with SLE on long-term high-dose prednisolone develops progressive right groin pain on weight bearing. Hip radiograph is normal. What is the most appropriate next investigation?", "choices": ["Hip joint aspiration", "Serum uric acid", "Repeat plain radiograph in 3 months", "MRI of both hips", "Bone mineral density"], "answer": 3, "explain": "**Osteonecrosis ของหัวกระดูกต้นขาจากสเตียรอยด์** — ฟิล์มธรรมดาปกติในระยะแรกเสมอ **MRI ไวที่สุดและต้องถ่ายทั้งสองข้าง** เพราะเป็นสองข้างได้ 50-80%; ถ้าจับได้ก่อนหัวกระดูกยุบยังมีทางรักษาข้อไว้ได้", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย ภาวะแทรกซ้อนของสเตียรอยด์ (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(8)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-12", "kind": "old", "stem": "A woman with SLE has been on prednisolone for 3 years and now presents in pregnancy with fasting plasma glucose 138 mg/dL and HbA1c 7.2% at 8 weeks of gestation. How should her hyperglycemia be classified?", "choices": ["Gestational diabetes mellitus", "Pre-existing (overt) diabetes mellitus detected in pregnancy, likely glucocorticoid-induced", "Stress hyperglycemia from pregnancy", "Impaired fasting glucose", "Type 1 diabetes mellitus"], "answer": 1, "explain": "โพยเก่าตอบว่า **ไม่ใช่ gestational DM แต่เป็นเบาหวานที่มีอยู่ก่อน** — เพราะตรวจพบ **ตั้งแต่ไตรมาสแรกและค่าถึงเกณฑ์เบาหวานทั่วไป (FPG ≥ 126 หรือ HbA1c ≥ 6.5%)** GDM ตามนิยามคือความผิดปกติที่ตรวจพบครั้งแรกในไตรมาสที่ 2-3 และค่าต่ำกว่าเกณฑ์เบาหวานชัดเจน; สเตียรอยด์ระยะยาวทำให้ดื้ออินซูลินและเป็นสาเหตุที่พบบ่อยในผู้ป่วยโรคภูมิต้านตนเอง", "pearl": "", "topic": "", "src": "MED34 โพย MCQ 'ข้อคนท้อง gestational diabetes เป็น SLE ใช้ Prednisolone 3 ปี ตอบ DM type 2'", "ref": [], "nl": ["2.3.13-3(15)"]}]}, {"id": "air-33-06", "title": "Systemic sclerosis และ Raynaud phenomenon", "minutes": 8, "summary": "แยก limited กับ diffuse · แอนติบอดีทำนายภาวะแทรกซ้อน · renal crisis คือภาวะฉุกเฉิน", "nl": ["B4.2.2-3(9)", "2.3.13"], "md": "### สองรูปแบบใหญ่\n| | **Limited cutaneous (CREST)** | **Diffuse cutaneous** |\n|---|---|---|\n| ผิวแข็ง | ปลายมือถึงข้อศอก/เข่า และใบหน้า | **ลามเหนือข้อศอก เข่า และลำตัว** |\n| ดำเนินโรค | ช้า Raynaud มานานหลายปีก่อน | เร็ว ผิวแข็งภายในเดือน–ปี |\n| แอนติบอดี | **anti-centromere** | **anti-Scl-70** หรือ **anti-RNA polymerase III** |\n| ภาวะแทรกซ้อนเด่น | **pulmonary arterial hypertension** | **ILD และ scleroderma renal crisis** |\n\nCREST = Calcinosis · Raynaud · Esophageal dysmotility · Sclerodactyly · Telangiectasia\n\n### Raynaud — แยกปฐมภูมิจากทุติยภูมิ\n| | ปฐมภูมิ | ทุติยภูมิ |\n|---|---|---|\n| อายุเริ่ม | วัยรุ่น–20 ต้น ๆ | **> 30–40 ปี** |\n| ความรุนแรง | สมมาตร ไม่มีแผล | **ไม่สมมาตร มีแผลหรือเนื้อตายที่ปลายนิ้ว** |\n| ANA | ลบ | **บวก** |\n| **Nailfold capillaroscopy** | ปกติ | **capillary ขยายผิดรูปและหายไปเป็นหย่อม** |\n\n**เครื่องมือที่แยกได้ดีที่สุดคือ nailfold capillaroscopy ร่วมกับ ANA** — ผู้ที่มี Raynaud เริ่มตอนอายุมาก มีแผลที่ปลายนิ้ว หรือ capillary ผิดปกติ ต้องตามหาโรคเนื้อเยื่อเกี่ยวพันเสมอ\n\nการดูแล Raynaud: ให้ความอบอุ่น เลิกบุหรี่ หลีกเลี่ยงยาหดหลอดเลือด (**β-blocker ที่ไม่เลือก, ergot, sympathomimetic**) · ยาอันดับแรกคือ **dihydropyridine calcium channel blocker (nifedipine, amlodipine)** · แผลที่ปลายนิ้วอาจต้องใช้ PDE-5 inhibitor, iloprost หรือ bosentan เพื่อป้องกันแผลใหม่\n\n### Scleroderma renal crisis — ภาวะฉุกเฉิน\n- **ความดันโลหิตสูงขึ้นอย่างรวดเร็ว + ไตวายเฉียบพลัน + microangiopathic hemolytic anemia (schistocyte) และเกล็ดเลือดต่ำ** อาจมี papilledema, ชัก หรือปอดบวมน้ำ\n- ปัจจัยเสี่ยง: **diffuse SSc ระยะแรก · anti-RNA polymerase III · และการได้ corticosteroid ขนาด ≥ 15 mg/วัน** — นี่คือเหตุผลที่ **หลีกเลี่ยง steroid ขนาดสูงในผู้ป่วย systemic sclerosis**\n- **การรักษาคือ ACE inhibitor ขนาดสูง (captopril ปรับขึ้นเร็ว) ทันที** และให้ต่อแม้ครีแอตินินจะสูงขึ้นในช่วงแรกหรือแม้ต้องฟอกไตชั่วคราว — **ห้ามใช้ยาลดความดันกลุ่มอื่นแทน ARB ก็ไม่ใช่ยาที่พิสูจน์แล้ว**\n- อวัยวะอื่นที่ต้องเฝ้าระวังทุกปี: **ILD (PFT + HRCT)** และ **PAH (echocardiogram)** · GERD รุนแรงให้ PPI ขนาดสูง · dysphagia จาก esophageal dysmotility\n", "pearls": ["Anti-centromere → PAH (limited) · anti-Scl-70 → ILD · anti-RNA pol III → renal crisis (diffuse)", "Raynaud + ANA บวก + capillaroscopy ผิดปกติ = ทุติยภูมิ ต้องตามหา CTD", "Scleroderma renal crisis รักษาด้วย ACE inhibitor ทันที และเลี่ยง steroid ขนาดสูงในผู้ป่วย SSc"], "items": [{"id": "AIR-MCQ-38", "kind": "mcq", "stem": "A 45-year-old woman has 1 year of Raynaud phenomenon, thickening of the skin of the fingers extending to the forearms, and fine inspiratory crackles at both lung bases. ANA by immunofluorescence is reported negative at the screening dilution. Which of the following is the most appropriate next investigation?", "choices": ["Anti-double-stranded DNA antibody", "Anti-histone antibody", "Rheumatoid factor", "Erythrocyte sedimentation rate alone", "Anti-topoisomerase I (anti-Scl-70) and anticentromere antibody testing with high-resolution CT of the chest"], "answer": 4, "explain": "**อาการทางคลินิกมาก่อนแอนติบอดีเสมอ** — Raynaud + skin thickening ที่ลามเหนือข้อมือ + crackles ที่ฐานปอด = **diffuse cutaneous systemic sclerosis ที่มี interstitial lung disease** ซึ่งเป็นสาเหตุการตายอันดับหนึ่งของโรคนี้\n\n**ANA ที่รายงานว่า 'ลบ' ไม่ตัดโรคออก** เพราะบางห้องปฏิบัติการใช้วิธีหรือ dilution ที่ไวไม่พอ และ nucleolar/centromere pattern อาจถูกอ่านพลาด จึงต้องส่ง **antibody จำเพาะ** ต่อ\n\n| Antibody | สัมพันธ์กับ |\n|---|---|\n| **Anti-Scl-70 (topoisomerase I)** | **diffuse cutaneous SSc + interstitial lung disease** |\n| **Anticentromere** | **limited cutaneous SSc (CREST) + pulmonary arterial hypertension** |\n| Anti-RNA polymerase III | ผิวหนังหนาเร็ว + **scleroderma renal crisis** + มะเร็งร่วม |\n\nและต้องประเมินอวัยวะเสมอ: **HRCT + PFT (FVC, DLCO)** สำหรับปอด, **echocardiography** สำหรับ pulmonary hypertension, วัดความดันโลหิตเองที่บ้านเพื่อจับ renal crisis\n\n**ทำไมข้ออื่นผิด** — anti-dsDNA สำหรับ SLE, RF สำหรับ RA (บวกได้หลายโรคจึงไม่ช่วย), anti-histone สำหรับ drug-induced lupus, ESR อย่างเดียวไม่จำเพาะและไม่บอกอวัยวะที่ถูกทำลาย", "pearl": "Scleroderma: **Scl-70 → ปอด (ILD) · centromere → ความดันปอดสูง · RNA pol III → renal crisis**; ANA ลบไม่ตัดโรคออกเมื่อคลินิกชัด", "topic": "Systemic sclerosis — autoantibody testing", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 1 'Systemic sclerosis ฟังปอดได้บางอย่าง ANA negative ตรวจอะไรเพิ่ม'", "EULAR SSc recommendations 2017"], "nl": ["B4.2.2-3(9)", "B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-34", "kind": "old", "stem": "A patient with features of systemic sclerosis has a negative ANA on the standard screening assay. Which test should be sent next?", "choices": ["Anti-double-stranded DNA", "Erythrocyte sedimentation rate", "Anti-histone antibody", "Anti-topoisomerase I (anti-Scl-70) and anticentromere antibodies", "Rheumatoid factor"], "answer": 3, "explain": "โพยเก่าให้ตัวเลือก ESR / anti-dsDNA / RF — ทั้งสามไม่ช่วยวินิจฉัย systemic sclerosis; **ANA ที่ลบไม่ตัดโรคออกเมื่อคลินิกชัด** ต้องส่ง **antibody จำเพาะ**: anti-Scl-70 (สัมพันธ์กับ ILD), anticentromere (limited SSc, ความดันปอดสูง), anti-RNA polymerase III (renal crisis) และประเมินอวัยวะด้วย HRCT, PFT, echocardiography", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 1 'อาการ Systemic sclerosis ฟังปอดได้อะไรซักอย่าง ANA negative ตรวจอะไรเพิ่ม — a. ESR b. Anti-dsDNA c. Anti-Rheumatoid factor'", "ref": [], "nl": ["B4.2.2-3(9)", "B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-MCQ-39", "kind": "mcq", "stem": "A 49-year-old woman with diffuse systemic sclerosis for 8 months, recently given prednisolone 20 mg daily for arthralgia, presents with headache and blurred vision. BP 220/130 mmHg, creatinine 3.2 mg/dL (was 0.9 mg/dL), platelet 88,000/mm3, blood smear shows schistocytes, urinalysis shows mild proteinuria without casts. Which of the following is the most appropriate treatment?", "choices": ["Start pulse methylprednisolone and cyclophosphamide", "Start plasma exchange for thrombotic thrombocytopenic purpura", "Start a short-acting ACE inhibitor such as captopril and titrate rapidly", "Start amlodipine and arrange outpatient follow-up in 1 week", "Start intravenous nitroprusside and avoid ACE inhibitors because creatinine is rising"], "answer": 2, "explain": "**Scleroderma renal crisis (SRC) = ความดันสูงวิกฤต + ไตวายเฉียบพลัน + microangiopathic hemolytic anemia** ในผู้ป่วย diffuse SSc ระยะแรก ปัจจัยกระตุ้นที่สำคัญที่สุดคือ **corticosteroid ตั้งแต่ 15 mg/วันขึ้นไป** (จึงต้องเลี่ยงสเตียรอยด์ขนาดสูงใน SSc)\n\n**กลไก** — intimal proliferation ของหลอดเลือดแดงเล็กในไต → ไตขาดเลือด → **renin หลั่งพุ่ง** → angiotensin II สูงมาก → ความดันพุ่งและหลอดเลือดฝอยถูกทำลายจนเม็ดเลือดแดงแตก\n\n**การรักษา** — **ACE inhibitor ออกฤทธิ์สั้น (captopril) คือยาที่เปลี่ยนโรคนี้จากอัตราตายเกือบ 100% ให้รอดได้** ปรับขนาดขึ้นเร็วทุก 4–8 ชั่วโมงจนคุมความดัน **ห้ามหยุดยาเพียงเพราะ creatinine สูงขึ้นในช่วงแรก** ซึ่งเป็นสิ่งที่คาดไว้อยู่แล้ว ผู้ป่วยบางรายต้องฟอกไตชั่วคราวแล้วไตฟื้นภายหลัง\n\n**ทำไมข้ออื่นผิด** — ยาลดความดันกลุ่มอื่นไม่แก้กลไก renin-angiotensin; สเตียรอยด์/cyclophosphamide ยิ่งกระตุ้นหรือไม่ช่วย; ภาพ MAHA ที่นี่มาจาก SRC ไม่ใช่ TTP (TTP จะไม่มีความดันสูงวิกฤตนำและ ADAMTS13 ต่ำมาก); การนัดผู้ป่วยนอกในภาวะ hypertensive emergency คือความผิดพลาดร้ายแรง", "pearl": "SSc + ความดันพุ่ง + Cr ขึ้น + schistocyte = **scleroderma renal crisis → captopril ทันที และห้ามหยุดแม้ Cr จะขึ้น**", "topic": "Scleroderma renal crisis", "src": "", "ref": ["MED32 โพย MCQ systemic sclerosis", "EULAR SSc recommendations 2017"], "nl": ["B4.2.2-3(9)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-35", "kind": "old", "stem": "A patient with diffuse systemic sclerosis recently started on prednisolone develops blood pressure 210/120 mmHg, acute kidney injury and schistocytes on blood smear. Which drug should be started immediately?", "choices": ["Captopril", "Labetalol", "Nifedipine", "Hydralazine", "Furosemide"], "answer": 0, "explain": "**Scleroderma renal crisis** เกิดจาก renin-angiotensin ที่ถูกกระตุ้นอย่างรุนแรง — **ACE inhibitor ออกฤทธิ์สั้น (captopril) คือยาที่ช่วยชีวิต** ปรับขนาดขึ้นเร็วทุก 4-8 ชั่วโมง **ห้ามหยุดแม้ creatinine จะสูงขึ้นในช่วงแรก**; **สเตียรอยด์ตั้งแต่ 15 mg/วันขึ้นไปเป็นตัวกระตุ้นสำคัญ** จึงควรเลี่ยงใน SSc", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย systemic sclerosis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B4.2.2-3(9)", "2.3.13-3(15)"]}, {"id": "AIR-MCQ-40", "kind": "mcq", "stem": "A 20-year-old woman reports that her fingers turn white then blue then red in cold air, symmetrically in both hands, for 4 years. There is no digital ulcer or pitting scar, peripheral pulses are normal, ANA is negative and nailfold capillaroscopy is normal. Which of the following is the most appropriate management?", "choices": ["Immediate treatment with intravenous iloprost", "Start warfarin to prevent digital thrombosis", "Refer for urgent digital sympathectomy", "Reassurance with cold avoidance and smoking avoidance; drug therapy only if symptoms interfere with daily life", "Start high-dose corticosteroid to prevent progression to systemic sclerosis"], "answer": 3, "explain": "**แยก primary จาก secondary Raynaud คือคำถามหลักเสมอ เพราะ secondary แปลว่ามีโรคเนื้อเยื่อเกี่ยวพันซ่อนอยู่และเสี่ยงนิ้วขาดเลือด**\n\n| | **Primary** | **Secondary** |\n|---|---|---|\n| อายุที่เริ่ม | **< 30 ปี** | > 30 ปี |\n| ความสมมาตร | **สองข้างเท่ากัน** | ไม่สมมาตรได้ |\n| แผล/รอยบุ๋มปลายนิ้ว | **ไม่มี** | **มี** |\n| ANA | **ลบ** | บวก (Scl-70, centromere) |\n| **Nailfold capillaroscopy** | **ปกติ** | **หลอดเลือดโป่ง/หาย (megacapillary, dropout)** |\n| อาการอื่น | ไม่มี | ผิวหนังหนา ข้ออักเสบ กลืนติด |\n\nเคสนี้เข้าเกณฑ์ primary ทุกข้อ → **รักษาแบบไม่ใช้ยา**: หลีกเลี่ยงความเย็น ใส่ถุงมือ เลิกบุหรี่ เลี่ยงยาหดหลอดเลือด (เช่น beta-blocker, ยาแก้หวัดที่มี pseudoephedrine, ergotamine) และจัดการความเครียด ถ้าอาการรบกวนชีวิตจึงให้ **dihydropyridine calcium channel blocker (nifedipine)** เป็นยาตัวแรก\n\n**ทำไมข้ออื่นผิด** — iloprost ทางหลอดเลือดดำสงวนไว้สำหรับ **digital ulcer หรือ critical ischemia** ใน secondary Raynaud; สเตียรอยด์ไม่ป้องกันการเกิด SSc และมีโทษ; sympathectomy เป็นทางเลือกท้าย ๆ ของรายที่ดื้อการรักษา; warfarin ไม่มีบทบาทเพราะพยาธิกำเนิดคือ vasospasm ไม่ใช่ลิ่มเลือด", "pearl": "Primary Raynaud: **อายุน้อย สองข้างเท่ากัน ไม่มีแผลปลายนิ้ว ANA ลบ capillaroscopy ปกติ → ไม่ต้องใช้ยา**", "topic": "Raynaud phenomenon — primary versus secondary", "src": "", "ref": ["MED31 โพย MCQ Raynaud", "EULAR/ACR SSc-related vasculopathy guidance"], "nl": ["B4.2.2-3(9)", "2.1.50"]}]}, {"id": "air-33-07", "title": "กล้ามเนื้ออักเสบ และกล้ามเนื้อเป็นพิษจากยา", "minutes": 8, "summary": "อ่อนแรงต้นแขนต้นขาแบบสมมาตร + เอนไซม์สูง — และอย่าลืมว่า AST สูงอาจมาจากกล้ามเนื้อ", "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22"], "md": "### ภาพทางคลินิก\n- **อ่อนแรงกล้ามเนื้อต้นแขนต้นขาสองข้างแบบสมมาตร ค่อยเป็นค่อยไปเป็นสัปดาห์–เดือน** — ลุกจากเก้าอี้ ขึ้นบันได หวีผมลำบาก โดย **ไม่ชา** (ถ้าชาให้คิดถึงโรคเส้นประสาท)\n- **ปวดกล้ามเนื้อเป็นอาการรอง** — ผู้ป่วยจำนวนมากไม่ปวดเลย จุดสำคัญคืออ่อนแรง\n- **Dermatomyositis** มีผื่นจำเพาะ: **heliotrope rash (ผื่นม่วงรอบเบ้าตา) · Gottron papule บนข้อนิ้ว · shawl sign · mechanic's hand**\n- ต้องมองหาภาวะร่วม: **ILD (โดยเฉพาะกลุ่ม anti-synthetase/anti-Jo-1) · กลืนลำบากจากกล้ามเนื้อคอหอย · กล้ามเนื้อหัวใจอักเสบ**\n- **Dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็ง** (รังไข่ ปอด ตับอ่อน กระเพาะอาหาร ลำไส้ใหญ่ โพรงหลังจมูก) จึง **ต้องคัดกรองมะเร็งตามอายุและอาการเสมอ**\n\n### การตรวจ\n1. **CK** (มักสูงหลายพันถึงหลายหมื่น) · **AST/ALT, LDH, aldolase สูงตามได้**\n   > **AST สูงโดยที่ ALP, GGT และ bilirubin ปกติ ในผู้ป่วยที่อ่อนแรงกล้ามเนื้อ = เอนไซม์มาจากกล้ามเนื้อไม่ใช่ตับ — ให้ส่ง CK ก่อนจะไปตามหาโรคตับ**\n2. **EMG** — ลักษณะ myopathic · **MRI ของกล้ามเนื้อ** ช่วยเลือกตำแหน่งตัดชิ้นเนื้อ\n3. **การตัดชิ้นเนื้อกล้ามเนื้อยังเป็นการยืนยันมาตรฐาน** (dermatomyositis มีอาการทางผิวหนังจำเพาะอาจไม่ต้องตัด)\n4. **Myositis-specific antibody** — anti-Jo-1 และกลุ่ม anti-synthetase (ILD, mechanic's hand, Raynaud) · anti-Mi-2 (ผื่นเด่น ตอบสนองดี) · **anti-TIF1-γ และ anti-NXP2 (สัมพันธ์กับมะเร็ง)** · anti-MDA5 (ILD รุนแรงและแผลที่ผิวหนัง)\n5. รักษาด้วย **corticosteroid ขนาดสูงเป็นอันดับแรก** แล้วเติมยากดภูมิคุ้มกัน (methotrexate, azathioprine, mycophenolate, IVIG ในรายรุนแรงหรือกลืนลำบาก)\n\n### กล้ามเนื้อเป็นพิษจากสแตติน\n- อาการที่พบบ่อยที่สุดคือ **ปวดเมื่อยกล้ามเนื้อโดย CK ปกติหรือสูงเล็กน้อย** — จัดการโดยหยุดยาชั่วคราวแล้วลองยาตัวใหม่หรือขนาดใหม่ (rechallenge)\n- **ขั้นแรกที่ควรทำเมื่อมีอาการกล้ามเนื้อคือ ส่ง CK** เพื่อแยกกลุ่มที่อันตราย\n- **ตรวจ TSH ด้วยเสมอ** เพราะภาวะไทรอยด์ต่ำทำให้ปวดกล้ามเนื้อและ CK สูงได้ และเพิ่มความเสี่ยงต่อพิษของสแตติน\n- **CK > 10 เท่าของค่าปกติ หรือมีปัสสาวะสีเข้มและไตวาย = rhabdomyolysis** ต้องหยุดยาทันทีและให้สารน้ำ\n- **Statin-associated immune-mediated necrotizing myopathy (IMNM)** — อ่อนแรงและ CK สูงมาก **ที่ไม่ดีขึ้นหลังหยุดยา** ตรวจพบ **anti-HMGCR antibody** ต้องรักษาด้วยยากดภูมิคุ้มกัน\n- ปัจจัยเสี่ยง: อายุมาก ตัวเล็ก ไตหรือตับเสื่อม ใช้ร่วมกับ **fibrate (gemfibrozil), macrolide, azole, ciclosporin** และการดื่มสุรา\n", "pearls": ["อ่อนแรงต้นแขนต้นขาแบบสมมาตรโดยไม่ชา = myopathy ให้ส่ง CK", "AST สูงแต่ ALP/GGT ปกติ ให้คิดถึงกล้ามเนื้อก่อนตับ", "Dermatomyositis ในผู้ใหญ่ต้องคัดกรองมะเร็ง", "อาการกล้ามเนื้อจากสแตติน: ส่ง CK และ TSH ก่อนเสมอ · ไม่ดีขึ้นหลังหยุดยาให้คิดถึง IMNM"], "items": [{"id": "AIR-MCQ-41", "kind": "mcq", "stem": "A 52-year-old woman has 3 months of progressive difficulty climbing stairs and combing her hair, without pain. PE: symmetric proximal muscle weakness grade 3/5, violaceous rash over the eyelids and scaly erythematous papules over the knuckles. Lab: creatine kinase 4,200 U/L, AST 180 U/L, ALT 120 U/L. Which of the following is the most appropriate next step in addition to starting treatment?", "choices": ["Serum uric acid and joint aspiration", "Bone mineral density as the first priority", "Age-appropriate malignancy screening, because dermatomyositis is strongly associated with occult cancer", "Nerve conduction study to confirm peripheral neuropathy", "Liver biopsy to evaluate the raised transaminases"], "answer": 2, "explain": "**กล้ามเนื้ออ่อนแรงส่วนต้นทั้งสองข้างแบบค่อยเป็นค่อยไป ไม่ปวด + CK สูงมาก + ผื่น heliotrope (เปลือกตาสีม่วง) และ Gottron papules (ที่ข้อนิ้ว) = dermatomyositis**\n\n**จุดที่ต้องทำเสมอคือค้นหามะเร็งแฝง** — dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งอย่างมีนัยสำคัญ (ราว 15–25% โดยเฉพาะ 1–3 ปีแรกหลังวินิจฉัย): รังไข่ ปอด ตับอ่อน กระเพาะอาหาร ลำไส้ใหญ่ และ **nasopharyngeal carcinoma ซึ่งพบมากในคนเอเชีย** จึงต้องตรวจตามอายุและเพศ + CT ทรวงอกและช่องท้อง + ตรวจโพรงหลังจมูก\n\n**จุดที่พลาดบ่อย** — AST/ALT ที่สูงในเคสนี้ **มาจากกล้ามเนื้อ ไม่ใช่ตับ** (transaminase อยู่ในกล้ามเนื้อลายด้วย) ให้ยืนยันด้วย CK, aldolase และ GGT ที่ปกติ ก่อนจะไปเจาะตับโดยไม่จำเป็น\n\n**การประเมินอื่น** — myositis-specific antibody (anti-Jo-1 = antisynthetase syndrome ที่มี ILD, mechanic's hands, ข้ออักเสบ; anti-MDA5 = ผิวหนังเด่นแต่ ILD รุนแรง), EMG, MRI กล้ามเนื้อหรือชิ้นเนื้อ และประเมินการกลืนกับปอด\n\n**ทำไมข้ออื่นผิด** — nerve conduction study ใช้แยกโรคเส้นประสาทซึ่งจะอ่อนแรงส่วนปลายและมีอาการชา; uric acid/เจาะข้อไม่เกี่ยว; BMD สำคัญเมื่อเริ่มสเตียรอยด์แต่ไม่ใช่ลำดับแรก", "pearl": "อ่อนแรงส่วนต้น + CK สูง + heliotrope/Gottron = dermatomyositis → **ต้องคัดกรองมะเร็ง**; AST/ALT ที่สูงอาจมาจากกล้ามเนื้อ ไม่ใช่ตับ", "topic": "Inflammatory myopathy", "src": "", "ref": ["MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "Harrison 21st ed., Inflammatory Myopathies"], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22", "2.1.26"]}, {"id": "AIR-OLD-38", "kind": "old", "stem": "A 55-year-old woman has proximal muscle weakness, a violaceous periorbital rash and scaly papules over the knuckles. Apart from treating the myositis, what must not be missed?", "choices": ["Screening for an underlying malignancy", "Screening for iron deficiency", "Screening for hepatitis A", "Screening for diabetes mellitus", "Screening for osteoporosis before treatment"], "answer": 0, "explain": "**Dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งแฝงราว 15-25%** โดยเฉพาะ 1-3 ปีแรก — ไทย/เอเชียต้องระวัง **nasopharyngeal carcinoma** เป็นพิเศษ ร่วมกับรังไข่ ปอด กระเพาะอาหาร ลำไส้ใหญ่ ตับอ่อน; ประเมินตามอายุและเพศ + CT ทรวงอก-ช่องท้อง-อุ้งเชิงกราน + ตรวจโพรงหลังจมูก และอย่าลืมประเมิน **ILD และการกลืน**", "pearl": "", "topic": "", "src": "ต่อยอดจากโพย MED33 (inflammatory myopathy) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22"]}, {"id": "AIR-OLD-37", "kind": "old", "stem": "A patient has proximal muscle weakness with AST 1,000 U/L but normal ALT, ALP and GGT. What is the most appropriate next investigation?", "choices": ["Serum ammonia", "Liver biopsy", "Creatine kinase", "Hepatitis serology", "Abdominal ultrasound"], "answer": 2, "explain": "**AST อยู่ในกล้ามเนื้อลายด้วย** จึงสูงได้จากโรคกล้ามเนื้อโดยที่ตับปกติ — เบาะแสคือ **ALP และ GGT ปกติ** และมีอาการอ่อนแรงส่วนต้น ให้ยืนยันด้วย **CK (และ aldolase)** ก่อนจะไปสืบค้นตับหรือเจาะตับโดยไม่จำเป็น", "pearl": "", "topic": "", "src": "MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "ref": [], "nl": ["2.1.22", "2.1.26", "B5.2.5-3(1)"]}, {"id": "AIR-MCQ-42", "kind": "mcq", "stem": "A 58-year-old man with dyslipidemia on simvastatin 40 mg daily for 6 months complains of symmetric aching of the thigh and shoulder muscles for 3 weeks, without weakness or dark urine. Which of the following is the most appropriate initial investigation?", "choices": ["Serum myoglobin only", "Muscle biopsy", "Electromyography", "Serum creatine kinase", "Anti-HMG-CoA reductase antibody as the first test"], "answer": 3, "explain": "**ปวดกล้ามเนื้อในผู้ที่กิน statin ต้องวัด CK ก่อนเสมอ** เพราะ CK เป็นตัวแยกกลุ่มอาการและกำหนดการจัดการทั้งหมด\n\n| ภาวะ | CK | การจัดการ |\n|---|---|---|\n| Myalgia (พบบ่อยที่สุด) | **ปกติหรือสูงเล็กน้อย** | หยุด statin ชั่วคราว 2–4 สัปดาห์ ดูว่าอาการหายไหม แล้วลองยาตัวอื่น/ขนาดต่ำ/วันเว้นวัน |\n| Myopathy | สูง > 10 เท่า ULN | หยุดยา หาสาเหตุร่วม |\n| **Rhabdomyolysis** | **> 40 เท่า ULN + ปัสสาวะสีเข้ม + ไตวาย** | **หยุดทันที ให้สารน้ำเข้มข้น** |\n| Immune-mediated necrotizing myopathy | สูงมากและ **ไม่ดีขึ้นหลังหยุดยา** | **anti-HMGCR antibody บวก** ต้องใช้ยากดภูมิ |\n\n**ปัจจัยที่เพิ่มความเสี่ยง** — อายุมาก ตัวเล็ก ไตหรือตับบกพร่อง ไทรอยด์ต่ำ (ต้องตรวจ TSH เสมอ) วิตามินดีต่ำ ออกกำลังหนัก และยาที่ยับยั้ง CYP3A4 เช่น **clarithromycin, itraconazole, ciclosporin, gemfibrozil, น้ำเกรปฟรุต** โดย simvastatin ไวต่อปฏิกิริยาเหล่านี้มากเป็นพิเศษ\n\n**ทำไมข้ออื่นผิด** — EMG และชิ้นเนื้อกล้ามเนื้อสงวนไว้เมื่อ CK สูงต่อเนื่องหรือมีอ่อนแรงจริงหลังหยุดยา; anti-HMGCR ตรวจเมื่ออาการไม่หายหลังหยุดยา; myoglobin ไม่ไวและไม่จำเพาะเท่า CK", "pearl": "ปวดกล้ามเนื้อ + กิน statin = **ส่ง CK ก่อน** และมองหายาที่ยับยั้ง CYP3A4 ร่วมด้วยเสมอ", "topic": "Statin-associated muscle symptoms", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 5 'ปวดกล้ามเนื้อ มี dyslipidemia กินยา statin ควรส่งตรวจอะไร — CPK level'", "ACC/AHA statin safety statement"], "nl": ["2.1.26", "2.3.13-3(7)", "B5.2.5-3(1)"]}, {"id": "AIR-OLD-36", "kind": "old", "stem": "A 58-year-old man on simvastatin complains of symmetric proximal muscle aching. Which investigation should be ordered first?", "choices": ["Electromyography", "Nerve conduction study", "Serum aldolase only", "Serum creatine kinase", "Muscle biopsy"], "answer": 3, "explain": "โพยเก่าตอบ **CPK (creatine kinase)** — เป็นตัวแยกระหว่าง myalgia (CK ปกติ), myopathy (CK สูง > 10 เท่า), **rhabdomyolysis** (CK สูงมาก + ปัสสาวะสีเข้ม + ไตวาย) และ immune-mediated necrotizing myopathy (CK สูงและไม่ดีขึ้นหลังหยุดยา → ส่ง anti-HMGCR); อย่าลืมตรวจ **TSH** และทบทวนยาที่ยับยั้ง CYP3A4 เช่น clarithromycin, itraconazole, gemfibrozil", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 5 'มาด้วยอาการปวดกล้ามเนื้อ มี dyslipidemia กินยา statin ควรส่งตรวจอะไร — a. CPK Level'", "ref": [], "nl": ["2.1.26", "2.3.13-3(7)", "B5.2.5-3(1)"]}]}, {"id": "air-33-08", "title": "Polymyalgia rheumatica และ giant cell arteritis", "minutes": 6, "summary": "ปวดไหล่สะโพกในผู้สูงอายุ และอาการทางตาที่ต้องให้ steroid ทันที", "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)"], "md": "### Polymyalgia rheumatica (PMR)\n- **อายุ > 50 ปีเสมอ** — ปวดและ **ฝืด** ที่ **ไหล่และสะโพกสองข้าง** ตอนเช้านานกว่า 45–60 นาที ยกแขนลำบากเพราะเจ็บ **ไม่ใช่อ่อนแรงจริง** (CK ปกติ ต่างจาก myositis)\n- ESR/CRP สูงชัดเจน · อาจมีไข้ต่ำ น้ำหนักลด\n- **ตอบสนองต่อ prednisolone 12.5–25 mg/วัน อย่างรวดเร็วภายใน 2–3 วัน** — ถ้าไม่ดีขึ้นชัดเจนให้ทบทวนการวินิจฉัย (RA ในผู้สูงอายุ, myositis, ไทรอยด์ต่ำ, มะเร็ง, การติดเชื้อ)\n- ค่อย ๆ ลดยาในเวลาราว 1–2 ปี และเสริมแคลเซียม วิตามินดี และยาป้องกันกระดูกพรุน\n\n### Giant cell arteritis (GCA)\n- เกิดร่วมกับ PMR ได้ราวร้อยละ 15–20 (และผู้ป่วย GCA ราวครึ่งหนึ่งมีอาการ PMR)\n- อาการเตือน: **ปวดศีรษะบริเวณขมับที่เพิ่งเกิดใหม่ · หนังศีรษะกดเจ็บ (หวีผมแล้วเจ็บ) · ขากรรไกรล้าขณะเคี้ยว (jaw claudication) · ตามัวหรือมองไม่เห็นชั่วคราว** · คลำหลอดเลือดขมับได้แข็งและคดเคี้ยว ชีพจรเบา\n- **ภาวะแทรกซ้อนที่กลัวที่สุดคือ ตาบอดถาวรจาก anterior ischemic optic neuropathy ซึ่งป้องกันได้ด้วยการให้ steroid ทันที**\n\n> **ถ้าสงสัย GCA ให้เริ่ม corticosteroid ทันทีโดยไม่ต้องรอผลชิ้นเนื้อ** — prednisolone 40–60 mg/วัน หรือ **methylprednisolone ทางหลอดเลือดดำเมื่อมีอาการทางตาแล้ว** จากนั้นจึง **ตัดชิ้นเนื้อ temporal artery ภายใน 1–2 สัปดาห์** (ผลยังบวกได้เพราะรอยโรคอยู่นาน) หรือทำอัลตราซาวด์หลอดเลือดขมับหา **halo sign**\n- ชิ้นเนื้อควรยาวพอ (≥ 1–2 ซม.) เพราะรอยโรคเป็น **skip lesion** · **ผลลบไม่ตัดโรค** ถ้าภาพทางคลินิกชัด\n- ยาลดการใช้ steroid: **tocilizumab (anti-IL-6)** · ให้ aspirin ขนาดต่ำพิจารณาเป็นรายบุคคล\n", "pearls": ["PMR: ปวดฝืดไหล่และสะโพกสองข้างในคน > 50 ปี CK ปกติ ตอบสนอง prednisolone ขนาดต่ำใน 2–3 วัน", "สงสัย GCA ให้ steroid ทันที อย่ารอผลชิ้นเนื้อ", "ชิ้นเนื้อ temporal artery ผลลบไม่ตัดโรค เพราะเป็น skip lesion"], "items": [{"id": "AIR-MCQ-43", "kind": "mcq", "stem": "A 72-year-old woman has 6 weeks of severe aching and morning stiffness of both shoulders and hips lasting 2 hours, with fatigue and low-grade fever. For 5 days she has had a new right temporal headache, scalp tenderness and pain in the jaw while chewing. ESR is 92 mm/hr. Vision is currently normal. Which of the following is the most appropriate immediate management?", "choices": ["Start NSAID and physiotherapy for polymyalgia rheumatica", "Arrange temporal artery biopsy first and start corticosteroid only after the result", "Start low-dose prednisolone 15 mg daily and review in 2 weeks", "Start high-dose corticosteroid immediately and arrange temporal artery biopsy or vascular imaging without delaying treatment", "Start methotrexate as the initial treatment"], "answer": 3, "explain": "**Jaw claudication + ปวดศีรษะขมับใหม่ + หนังศีรษะกดเจ็บ + ESR สูงมาก ในผู้สูงอายุ = giant cell arteritis (GCA) ซึ่งเป็นภาวะฉุกเฉินทางตา** — หลอดเลือด ophthalmic/posterior ciliary อุดตันทำให้ **ตาบอดถาวรภายในไม่กี่ชั่วโมงถึงวัน และเมื่อบอดแล้วแก้ไม่ได้**\n\n**หลักการที่ต้องจำ: ให้สเตียรอยด์ก่อน ตรวจยืนยันตามหลัง** — prednisolone 40–60 mg/วัน (หรือ pulse methylprednisolone ถ้ามีอาการทางตาแล้ว) แล้วค่อยทำ **temporal artery biopsy ภายใน 1–2 สัปดาห์** ซึ่งยังให้ผลบวกได้ แม้เริ่มสเตียรอยด์ไปแล้ว (skip lesion ทำให้ผลลบไม่ตัดโรค จึงตัดชิ้นยาว ≥ 1 ซม.) หรือใช้ **ultrasound หา halo sign**\n\n**ความสัมพันธ์กับ PMR** — ผู้ป่วย PMR (ปวดเมื่อยไหล่และสะโพกสองข้าง ฝืดเช้านาน ESR สูง ตอบสนองดีมากต่อ prednisolone 12.5–25 mg/วัน) ประมาณ 15% มี GCA ร่วม และผู้ป่วย GCA ราวครึ่งหนึ่งมีอาการ PMR — **ต้องถามอาการทางตาและ jaw claudication ทุกครั้งที่เจอ PMR**\n\n**ทำไมข้ออื่นผิด** — การรอผลชิ้นเนื้อคือเหตุผลอันดับหนึ่งที่ผู้ป่วยตาบอด; ขนาด 15 mg เหมาะกับ PMR เพียงอย่างเดียวและไม่พอสำหรับ GCA; NSAID ไม่ป้องกันตาบอด; methotrexate/tocilizumab เป็นยาช่วยลดสเตียรอยด์ ไม่ใช่ยาเริ่มต้น", "pearl": "ผู้สูงอายุ + ปวดขมับ + **jaw claudication** + ESR สูง = GCA → **ให้สเตียรอยด์ทันที อย่ารอ biopsy**", "topic": "Polymyalgia rheumatica and giant cell arteritis", "src": "", "ref": ["MED32 โพย MCQ temporal arteritis", "EULAR large vessel vasculitis recommendations 2018"], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.26", "2.1.1"]}, {"id": "AIR-OLD-39", "kind": "old", "stem": "A 72-year-old woman has new temporal headache, scalp tenderness, jaw claudication and ESR 95 mm/hr. Vision is normal. What should be done first?", "choices": ["Arrange temporal artery biopsy and wait for the result before treatment", "Start high-dose corticosteroid immediately, then arrange temporal artery biopsy", "Start an NSAID and review in 1 week", "Arrange CT brain and treat only if abnormal", "Start low-dose prednisolone 10 mg daily"], "answer": 1, "explain": "**Giant cell arteritis เป็นภาวะฉุกเฉินทางตา** — ตาบอดถาวรเกิดได้ภายในไม่กี่ชั่วโมงถึงวัน จึง **ให้สเตียรอยด์ก่อน แล้วค่อยตัดชิ้นเนื้อภายใน 1-2 สัปดาห์** ซึ่งยังให้ผลบวกได้; **jaw claudication เป็นอาการที่มี likelihood ratio สูงที่สุด** ของโรคนี้", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย temporal arteritis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.1"]}, {"id": "AIR-OLD-46", "kind": "old", "stem": "A 68-year-old woman has 2 months of bilateral shoulder and hip girdle aching with prolonged morning stiffness, ESR 88 mm/hr, normal creatine kinase and no true weakness on testing. What is the most likely diagnosis and treatment?", "choices": ["Polymyositis; high-dose prednisolone plus methotrexate", "Hypothyroid myopathy; levothyroxine", "Fibromyalgia; exercise and amitriptyline", "Osteoarthritis of both shoulders; NSAID", "Polymyalgia rheumatica; low-dose prednisolone 12.5-25 mg daily with a dramatic response expected"], "answer": 4, "explain": "**PMR: ปวดเมื่อยไหล่และสะโพกสองข้าง ฝืดเช้านาน ESR สูงมาก แต่ CK ปกติและไม่มีอ่อนแรงจริง** (ขยับไม่ไหวเพราะเจ็บ ไม่ใช่แรงตก) — ตอบสนองต่อ prednisolone ขนาดต่ำอย่างรวดเร็วภายใน 24-72 ชั่วโมง (ถ้าไม่ตอบสนองให้ทบทวนการวินิจฉัย); **ต้องถามอาการของ giant cell arteritis ทุกครั้ง** เพราะพบร่วมกันได้ ~15%", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย PMR/GCA (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.1.26", "B5.2.2-3(2b)", "2.3.13-3(16)"]}]}, {"id": "air-33-09", "title": "หลอดเลือดอักเสบ — ANCA-associated และ IgA vasculitis", "minutes": 8, "summary": "ผื่นจ้ำนูนคลำได้ + ไตอักเสบ = vasculitis จนกว่าจะพิสูจน์เป็นอย่างอื่น", "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.3.13-3(2)"], "md": "**Palpable purpura** (จ้ำเลือดที่นูนคลำได้ ไม่จางเมื่อกด) คือสัญญาณของ **small-vessel vasculitis** ให้ประเมินอวัยวะภายในทันที โดยเฉพาะ **ไต (urinalysis หา dysmorphic RBC และ RBC cast) และปอด**\n\n### ANCA-associated vasculitis\n| | **GPA** (Wegener) | **MPA** | **EGPA** (Churg–Strauss) |\n|---|---|---|---|\n| ANCA | **PR3 (c-ANCA)** | **MPO (p-ANCA)** | MPO (บวกราว 40%) |\n| ลักษณะเด่น | **ทางเดินหายใจส่วนบน** — ไซนัสอักเสบเรื้อรัง น้ำมูกปนเลือด **แผลในจมูก จมูกยุบเป็นอานม้า** ก้อนในปอดที่เป็นโพรง | ไตอักเสบรุนแรง **เลือดออกในถุงลม** ไม่ค่อยมีอาการทางเดินหายใจส่วนบน | **หืดที่คุมยาก · eosinophil สูงมาก · เส้นประสาทอักเสบ (mononeuritis multiplex)** |\n| ไต | **pauci-immune crescentic GN** | เหมือนกัน | พบน้อยกว่า |\n\n**สัญญาณที่ต้องรีบที่สุด — pulmonary–renal syndrome**: ไอเป็นเลือด ภาพปอดฝ้าสองข้าง Hb ลดลง ร่วมกับ **creatinine ขึ้นเร็วและปัสสาวะมีเม็ดเลือดแดงผิดรูป**\n- ส่ง **ANCA (PR3/MPO), anti-GBM, ANA, complement, urinalysis + sediment, CXR/CT** และ **เจาะชิ้นเนื้อไตเพื่อยืนยันและบอกความรุนแรง**\n- **การรักษาระยะเหนี่ยวนำ** — **corticosteroid ขนาดสูง ร่วมกับ rituximab หรือ cyclophosphamide** · เพิ่ม **plasma exchange** เมื่อมีเลือดออกในถุงลมรุนแรงหรือไตวายรุนแรงมาก · ตามด้วยการรักษาต่อเนื่องด้วย rituximab หรือ azathioprine\n- อย่าลืม **PJP prophylaxis** และคัดกรองการติดเชื้อก่อนเริ่มยา\n\n### IgA vasculitis (Henoch–Schönlein purpura)\n- **สี่อาการหลัก**: **palpable purpura ที่ขาและก้น · ปวดข้อ · ปวดท้อง (เสี่ยง intussusception ในเด็ก) · ไตอักเสบ**\n- พบในเด็กบ่อยกว่าแต่ **ในผู้ใหญ่โรคไตรุนแรงกว่า** · มักตามหลังการติดเชื้อทางเดินหายใจส่วนบน\n- ชิ้นเนื้อพบ **IgA deposit ในผนังหลอดเลือด** (ไตเหมือน IgA nephropathy) · **complement ปกติ** ซึ่งช่วยแยกจาก SLE และ cryoglobulinemia\n- ส่วนใหญ่ **หายเองภายใน 4–8 สัปดาห์** — รักษาตามอาการและ **ติดตามปัสสาวะและความดันโลหิตต่ออีกอย่างน้อย 6 เดือน** · ให้ corticosteroid เมื่อปวดท้องรุนแรงหรือไตอักเสบรุนแรง\n", "pearls": ["Palpable purpura = small-vessel vasculitis → ตรวจปัสสาวะทันที", "PR3/c-ANCA + ทางเดินหายใจส่วนบน + ก้อนปอดเป็นโพรง = GPA", "หืดคุมยาก + eosinophil สูง + ปลายประสาทอักเสบ = EGPA", "IgA vasculitis: complement ปกติ ส่วนใหญ่หายเอง แต่ต้องตามปัสสาวะและความดัน 6 เดือน"], "items": [{"id": "AIR-MCQ-44", "kind": "mcq", "stem": "A 56-year-old man has 2 months of chronic sinusitis with bloody nasal discharge, then develops hemoptysis and acute kidney injury. Lab: creatinine 3.8 mg/dL, urinalysis protein 2+, dysmorphic RBC with red cell casts. CXR shows bilateral nodular infiltrates, some with cavitation. Which of the following is the most likely diagnosis?", "choices": ["Systemic lupus erythematosus with lupus nephritis", "Community-acquired pneumonia with acute tubular necrosis", "Granulomatosis with polyangiitis (ANCA-associated vasculitis)", "Pulmonary tuberculosis with tuberculous glomerulonephritis", "Goodpasture disease from anti-glomerular basement membrane antibody"], "answer": 2, "explain": "**Pulmonary–renal syndrome = เลือดออกในปอด + glomerulonephritis พร้อมกัน** วินิจฉัยแยกโรคหลักมี 3 กลุ่ม: ANCA-associated vasculitis, anti-GBM disease (Goodpasture) และ SLE\n\n**สิ่งที่ชี้ไปที่ granulomatosis with polyangiitis (GPA) ในเคสนี้คือ 'ทางเดินหายใจส่วนบน'** — ไซนัสอักเสบเรื้อรัง เลือดออกทางจมูก แผลในจมูก จมูกยุบ (saddle nose) ร่วมกับ **nodule ที่ปอดซึ่งเป็นโพรงได้** ซึ่ง anti-GBM และ SLE ไม่ทำ\n\n| | **GPA** | **Anti-GBM** | **SLE** |\n|---|---|---|---|\n| ทางเดินหายใจส่วนบน | **เป็นเด่น** | ไม่เป็น | ไม่เป็น |\n| ปอด | **nodule/cavity, DAH** | DAH | pleuritis |\n| แอนติบอดี | **c-ANCA (anti-PR3)** | **anti-GBM** | ANA, anti-dsDNA, **C3/C4 ต่ำ** |\n| ชิ้นเนื้อไต | pauci-immune crescentic GN | **linear IgG** | **full-house immune complex** |\n\n**การรักษา** — เป็นภาวะคุกคามอวัยวะ ต้อง induction ด้วย **สเตียรอยด์ขนาดสูง + rituximab หรือ cyclophosphamide** และพิจารณา plasma exchange ในรายที่ creatinine สูงมากหรือมี DAH รุนแรง — ยิ่งเริ่มช้า ยิ่งเสียไตถาวร\n\n**ทำไมข้ออื่นผิด** — วัณโรคมีโพรงที่ปอดได้แต่ไม่ทำให้เกิด RBC cast และ AFB จะช่วยแยก; Goodpasture ไม่เข้าไซนัส; SLE มักมี complement ต่ำและอาการหลายระบบอื่น; ปอดบวมธรรมดาไม่ทำให้เกิด glomerulonephritis", "pearl": "**ไซนัสเรื้อรัง + ปอดเป็นโพรง + ไตอักเสบ = GPA (c-ANCA/PR3)** — pulmonary-renal syndrome ต้องรีบให้ยากดภูมิ", "topic": "ANCA-associated vasculitis", "src": "", "ref": ["MED34 โพย MCQ vasculitis", "EULAR/ERA-EDTA ANCA-associated vasculitis recommendations 2022"], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.1"]}, {"id": "AIR-OLD-41", "kind": "old", "stem": "A 56-year-old man with chronic sinusitis and bloody nasal discharge develops hemoptysis, cavitating lung nodules and glomerulonephritis with red cell casts. Which antibody is most likely to be positive?", "choices": ["Anti-glomerular basement membrane antibody", "Anti-proteinase 3 (c-ANCA)", "Anti-centromere antibody", "Anti-double-stranded DNA", "Anti-mitochondrial antibody"], "answer": 1, "explain": "**ทางเดินหายใจส่วนบน + ปอดเป็นโพรง + ไตอักเสบ = granulomatosis with polyangiitis → c-ANCA (anti-PR3)**; anti-GBM (Goodpasture) ไม่เข้าไซนัสและไม่ทำให้เกิดโพรงในปอด; SLE จะมี complement ต่ำและอาการหลายระบบอื่น — เป็น **pulmonary-renal syndrome** ที่ต้องรีบให้สเตียรอยด์ขนาดสูงร่วมกับ rituximab หรือ cyclophosphamide", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย vasculitis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)"]}, {"id": "AIR-MCQ-45", "kind": "mcq", "stem": "A 19-year-old man develops palpable purpura over both lower legs and buttocks 1 week after an upper respiratory tract infection, together with colicky abdominal pain and pain in both ankles. Lab: platelet 320,000/mm3, normal coagulation, urinalysis shows RBC 20–30/HPF with protein 1+. Which of the following is the most likely diagnosis?", "choices": ["Immune thrombocytopenia", "Meningococcemia", "Disseminated intravascular coagulation", "Acute rheumatic fever", "IgA vasculitis (Henoch-Schonlein purpura)"], "answer": 4, "explain": "**Tetrad ของ IgA vasculitis: palpable purpura ที่ขาและก้น (บริเวณที่แรงดันน้ำหนักสูง) + ปวดข้อ + ปวดท้อง + ไตอักเสบ** หลังติดเชื้อทางเดินหายใจส่วนบน — เป็น small-vessel vasculitis จากการสะสม **IgA immune complex**\n\n**จุดตัดสินที่โจทย์ให้มาคือ 'purpura ที่คลำได้นูน ร่วมกับเกล็ดเลือดปกติ'**\n- **คลำได้นูน = มีการอักเสบของผนังหลอดเลือด (vasculitis)**\n- **เกล็ดเลือดปกติและการแข็งตัวปกติ = ไม่ใช่ ITP หรือ DIC** ซึ่งจ้ำจะราบ\n\n**สิ่งที่ต้องเฝ้าระวัง** — ภาวะแทรกซ้อนที่กำหนดพยากรณ์โรคคือ **ไต** (IgA nephropathy แบบเดียวกัน) ต้องตรวจปัสสาวะและความดันเป็นระยะหลายเดือน และในเด็กต้องระวัง **intussusception** จากผนังลำไส้บวม\n\n**การรักษา** — ส่วนใหญ่หายเอง ให้ประคับประคองและ NSAID สำหรับปวดข้อ (ระวังเมื่อมีไตอักเสบ); สเตียรอยด์ใช้เมื่อปวดท้องรุนแรงหรือมีไตอักเสบมาก\n\n**ทำไมข้ออื่นผิด** — meningococcemia ป่วยหนักและ purpura ลามเร็วพร้อม shock; acute rheumatic fever ให้ข้ออักเสบย้ายที่ + หัวใจอักเสบ + erythema marginatum ไม่ใช่ purpura นูน", "pearl": "**Palpable purpura + เกล็ดเลือดปกติ = vasculitis**; ที่ขา/ก้น + ปวดท้อง + ปัสสาวะมีเลือด หลังเป็นหวัด = IgA vasculitis", "topic": "IgA vasculitis (Henoch-Schonlein purpura)", "src": "", "ref": ["MED32 โพย MCQ purpura", "Harrison 21st ed., The Vasculitis Syndromes"], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"]}, {"id": "AIR-OLD-40", "kind": "old", "stem": "A 19-year-old man has palpable purpura over both legs and buttocks, colicky abdominal pain, arthralgia and hematuria one week after an upper respiratory infection. Platelet count and coagulation tests are normal. What is the diagnosis?", "choices": ["Disseminated intravascular coagulation", "IgA vasculitis (Henoch-Schonlein purpura)", "Acute rheumatic fever", "Meningococcemia", "Immune thrombocytopenia"], "answer": 1, "explain": "**Palpable purpura + เกล็ดเลือดปกติ = vasculitis ไม่ใช่ความผิดปกติของเกล็ดเลือด**; tetrad ของ IgA vasculitis คือ purpura ที่ขาและก้น + ปวดข้อ + ปวดท้อง + ไตอักเสบ — **ไตเป็นตัวกำหนดพยากรณ์โรค** ต้องตรวจปัสสาวะและความดันเป็นระยะหลายเดือน", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย purpura (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"]}]}, {"id": "air-33-10", "title": "Rheumatoid arthritis — วินิจฉัยเร็ว รัก
