ollowing is the most likely diagnosis?", "choices": ["Tumour-induced osteomalacia from ectopic FGF-23 secretion", "Primary hyperparathyroidism", "Vitamin D deficiency osteomalacia", "Multiple myeloma with cast nephropathy", "Refeeding syndrome"], "answer": 0, "explain": "**กลไก** — คนไข้มี **ฟอสเฟตต่ำจากไตรั่วชัดเจน (FE phosphate 35% ซึ่งเกิน 20% ไปมาก)** ขั้นต่อไปตามที่สไลด์วางไว้คือ **ดูแคลเซียม** — ที่นี่ **แคลเซียมปกติและ PTH ปกติ** จึงตัด PTH ออก และชี้ไปที่ **FGF-23 เกิน** เมื่อเกิดในผู้ใหญ่ที่ไม่เคยมีอาการมาก่อน (ไม่ใช่โรคพันธุกรรมอย่าง XLH ที่แสดงตั้งแต่เด็ก) ร่วมกับ **ปวดกระดูก กระดูกหักง่าย และกล้ามเนื้อต้นแขนต้นขาอ่อนแรง** ภาพนี้คือ **tumour-induced osteomalacia** จากเนื้องอก mesenchymal ที่หลั่ง FGF-23\n\n**FGF-23 ที่สูงทำสองอย่าง** — ดึง NaPi-2a/2c ออกจาก PCT (ฟอสเฟตรั่ว) และ **ยับยั้ง 1α-hydroxylase** ดังนั้น **25-OH vitamin D จะปกติ แต่ 1,25(OH)₂D จะต่ำหรือ 'ปกติอย่างไม่เหมาะสม'** ทั้งที่ฟอสเฟตต่ำซึ่งควรจะกระตุ้นให้สูงขึ้น\n\n**ทำไมตัวลวงจึงผิด**\n- *Primary hyperparathyroidism* — ทำให้ฟอสเฟตต่ำจากไตรั่วได้จริง แต่ต้องมี **แคลเซียมสูงและ PTH สูง** ซึ่งคนไข้รายนี้ปกติทั้งคู่\n- *ขาดวิตามินดี* — **25-OH vitamin D ปกติ** ตัดออกได้ และภาวะขาดวิตามินดีจะมี **PTH สูงเป็นการชดเชย**\n- *Myeloma ที่มี cast nephropathy* — myeloma ทำให้ฟอสเฟตรั่วได้ผ่าน **Fanconi syndrome** แต่ต้องมีกรดอะมิโนและน้ำตาลรั่ว เลือดเป็นกรด ครีแอตินินสูง ซีด และมักมี **แคลเซียมสูง** ไม่ใช่ปกติ\n- *Refeeding syndrome* — เป็นการ **ย้ายเข้าเซลล์** จึงต้องมี **FE phosphate ต่ำ** และเกิดเฉียบพลันหลังเริ่มให้อาหาร ไม่ใช่ค่อยเป็นค่อยไป 2 ปี\n\n**การรักษา** — ตามหาก้อนด้วย Ga-68 DOTATATE PET หรือ octreotide scan และการเจาะหา FGF-23 step up ตามหลอดเลือดดำ **ตัดออกได้คือหายขาด** ถ้าหาไม่เจอใช้ **burosumab**", "pearl": "ฟอสเฟตต่ำจากไตรั่ว + แคลเซียมและ PTH ปกติ ในผู้ใหญ่ = FGF-23 เกิน ให้ตามหาเนื้องอก", "topic": "ภาวะฟอสเฟตต่ำ — แยกด้วย FE phosphate", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)"]}]}, {"id": "nephro-05-10", "title": "สมดุลแมกนีเซียมและการจัดการของไต", "minutes": 8, "summary": "ที่เดียวที่ไม่เหมือน Na และ Ca — PCT ดูดกลับน้อย TAL ทำงานหนัก", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(4)", "B9.1.2(3)", "B9.3(5)"], "md": "### แมกนีเซียมอยู่ที่ไหนและทำอะไร\n- **แคตไอออนที่มีมากเป็นอันดับ 4 ของร่างกาย** เก็บอยู่ใน **กระดูกเป็นหลัก ในรูปส่วนประกอบของผลึกไฮดรอกซีอะพาไทต์** และในเซลล์ — **ในเลือดมีสัดส่วนน้อยมาก**\n- ผลที่ตามมา: **ระดับแมกนีเซียมในเลือดสะท้อนปริมาณในร่างกายได้ไม่ดี** — **พร่องแมกนีเซียมทั้งที่ระดับในเลือดปกติได้** (สไลด์ระบุไว้ตรง ๆ ว่า \"Mg-deficient with normal serum Mg levels\")\n- หน้าที่: **สร้างกระดูก โปรตีน และ DNA · ควบคุมการทำงานของเส้นประสาทและกล้ามเนื้อ · เป็น cofactor ของปฏิกิริยาเอนไซม์จำนวนมาก โดยเฉพาะทุกปฏิกิริยาที่ใช้ ATP · ควบคุมฮอร์โมน PTH, ACTH และคอร์ติซอล**\n\n### ลำไส้\nดูดซึมสองทาง — **paracellular** (แบบพาสซีฟ ขับเคลื่อนด้วยความต่างของความเข้มข้น) และ **transcellular ผ่าน TRPM6 และ TRPM7**\n\n### ไต — จุดที่ต่างจากแคลเซียมและโซเดียม\n| ส่วนของหน่วยไต | ดูดกลับ | กลไก |\n|---|---|---|\n| **PCT** | **เพียง 20−25%** | (ต่างจาก Na และ Ca ที่ PCT ดูดกลับเป็นส่วนใหญ่) |\n| **TAL** | **ส่วนใหญ่** | **paracellular ผ่าน claudin-16 และ claudin-19** · ขับเคลื่อนด้วย **ศักย์ไฟฟ้าบวกในลูเมนจาก NKCC2 ร่วมกับ K⁺ ที่รั่วกลับผ่าน ROMK** — **กลไกเดียวกับแคลเซียมเป๊ะ ๆ** |\n| **DCT** | **10% สุดท้าย** | **transcellular ผ่าน TRPM6** → ออกด้านข้างผ่าน **SLC41A1** · **เป็นจุดที่กำหนดปริมาณแมกนีเซียมที่ออกมาในปัสสาวะจริง ๆ** |\n\n**รายละเอียดที่สไลด์ลงลึกและออกสอบได้**\n- ที่ **DCT** การดูดกลับเกลือผ่าน **NCC ไม่สร้างความต่างศักย์** จึงต้องอาศัย **K⁺ ที่ถูกขับออกสู่ลูเมนผ่านช่อง Kv1.1** เพื่อสร้างศักย์ไฟฟ้าที่เอื้อต่อการดูดกลับ Mg²⁺\n- **EGFR ที่ถูกกระตุ้นจะเพิ่มจำนวน TRPM6 ที่ผิวลูเมน** → จึงเป็นเหตุผลที่ **ยาต้าน EGFR เช่น cetuximab ทำให้แมกนีเซียมต่ำ**\n- **เมื่อแมกนีเซียม (หรือแคลเซียม) สูง → claudin-14 จะเข้าไปแทรกรบกวน claudin-16/19 ที่ TAL → ลดการซึมผ่านแบบ paracellular → ขับแมกนีเซียมออกทางปัสสาวะมากขึ้น** เป็นกลไกป้อนกลับที่ควบคุมโดย CaSR\n- **ความผิดปกติทางพันธุกรรมของการเก็บแมกนีเซียม = การกลายพันธุ์ของ claudin-16 และ 19** ส่วน **ที่เกิดภายหลังที่พบบ่อยที่สุดคือยาขับปัสสาวะกลุ่ม loop ซึ่งยับยั้ง NKCC2**\n\n### แยกไตรั่วออกจากสาเหตุนอกไต — FEMg\n> **FEMg = [ Mg ในปัสสาวะ × Cr ในเลือด ] ÷ [ Mg ในเลือด × Cr ในปัสสาวะ × 0.7 ] × 100**\n\n- **ตัวเลข 0.7 คือค่าแก้ที่มีเฉพาะแมกนีเซียม** เพราะ **แมกนีเซียมในเลือดเพียงราว 70% เท่านั้นที่เป็นอิสระและถูกกรองได้** (ที่เหลือจับกับโปรตีน) — **ลืมหารด้วย 0.7 แล้วค่าจะต่ำกว่าความจริง**\n- **ในคนที่แมกนีเซียมต่ำและ GFR ปกติ ถ้า FEMg > 3−4% = ไตรั่ว**\n- เกณฑ์จากปัสสาวะ 24 ชั่วโมง: **ขับแมกนีเซียม > 24 mg/วัน ทั้งที่แมกนีเซียมในเลือดต่ำ ถือว่าผิดปกติ และชี้ไปที่ไตรั่ว**\n- **ถ้าตัดไตรั่วออกไปแล้ว = เสียทางอื่น** ซึ่งมักหาสาเหตุได้จากประวัติ (ท้องเสีย ดูดซึมผิดปกติ กินได้น้อย สุรา)\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยกรูป **\"Magnesium transport: TAL\"** และ **\"Magnesium transport: DCT\"** ไว้คนละหน้า และย้ำว่ากลไกที่ TAL **\"[~ Ca]\"** คือเหมือนแคลเซียมทุกประการ\n- สไลด์เขียนสูตร **FEMg พร้อมตัวคูณ 1/0.7** ไว้ชัดเจน และระบุว่า **\"Correction factor of 0.7 applied to plasma total [Mg] to estimate free [Mg]\"**\n- สไลด์แบ่งสาเหตุของการพร่องแมกนีเซียมเป็นสามข้อสั้น ๆ: **(1) กินหรือดูดซึมได้น้อย (2) เสียทางทางเดินอาหาร ไต หรือผิวหนัง (3) พบน้อย — ถูกกักไว้ในกระดูก**\n", "pearls": ["แมกนีเซียมส่วนใหญ่อยู่ในกระดูกและในเซลล์ — ระดับในเลือดปกติไม่ได้แปลว่าไม่พร่อง", "ไตดูดกลับ Mg ที่ PCT เพียง 20−25% · TAL เป็นส่วนใหญ่ (claudin-16/19) · DCT 10% สุดท้ายผ่าน TRPM6 เป็นตัวกำหนดปัสสาวะ", "FEMg ต้องหารด้วย 0.7 เพราะ Mg ในเลือดเป็นอิสระเพียง 70% · FEMg > 3−4% = ไตรั่ว", "Loop diuretic ยับยั้ง NKCC2 → เสีย Mg · ยาต้าน EGFR (cetuximab) ลด TRPM6 ที่ DCT → เสีย Mg", "claudin-14 ถูกกระตุ้นเมื่อ Mg หรือ Ca สูง → ขวาง claudin-16/19 → ขับ Mg ออกมากขึ้น"], "items": [{"id": "NEPHRO-05-10-Q1", "kind": "own", "stem": "A 52-year-old woman receiving cetuximab for metastatic colorectal cancer has a serum magnesium of 1.1 mg/dL (normal 1.7-2.4). She has no diarrhoea and is not taking diuretics or proton pump inhibitors. Serum creatinine is 0.9 mg/dL. A spot urine gives a fractional excretion of magnesium of 8%. Which mechanism best explains her hypomagnesaemia?", "choices": ["Inhibition of NKCC2 abolishes the lumen-positive voltage in the thick ascending limb", "Reduced intestinal absorption of magnesium through TRPM6 and TRPM7", "Increased claudin-14 expression reduces paracellular magnesium permeability in the proximal tubule", "Mutation of claudin-16 and claudin-19 causes familial renal magnesium wasting", "Blockade of EGFR reduces TRPM6 in the luminal membrane of the distal convoluted tubule"], "answer": 4, "explain": "**กลไก** — **FEMg 8% ในคนที่แมกนีเซียมต่ำและครีแอตินินปกติ ยืนยันว่าเป็นการรั่วทางไต** (เกณฑ์คือมากกว่า 3−4%) ไม่ใช่เสียทางลำไส้ สไลด์อธิบายว่า **การกระตุ้น EGFR จะเพิ่มจำนวน TRPM6 ที่ luminal membrane ของ DCT** ซึ่งเป็นจุดที่กำหนดปริมาณแมกนีเซียมในปัสสาวะขั้นสุดท้าย ดังนั้น **ยาต้าน EGFR อย่าง cetuximab จึงลด TRPM6 → ดูดกลับแมกนีเซียมที่ DCT ไม่ได้ → รั่วออกทางปัสสาวะ** เป็นผลข้างเคียงที่พบบ่อยและอาจรุนแรงจนต้องให้แมกนีเซียมทางหลอดเลือดเป็นระยะ\n\n**ทำไมตัวลวงจึงผิด**\n- *ยับยั้ง NKCC2 ที่ TAL* — เป็นกลไกของ **ยาขับปัสสาวะกลุ่ม loop** ซึ่งโจทย์ระบุว่าไม่ได้ใช้\n- *ลำไส้ดูดซึมน้อยลง* — ถ้าเป็นการเสียทางลำไส้ ไตจะต้องเก็บแมกนีเซียมไว้อย่างเต็มที่ **FEMg จะต่ำ ไม่ใช่ 8%**\n- *claudin-14 ที่ PCT* — ผิดตำแหน่ง claudin-14 ทำงานที่ **TAL** และถูกกระตุ้นเมื่อ **แมกนีเซียมหรือแคลเซียมสูง** ซึ่งตรงข้ามกับสถานการณ์นี้\n- *การกลายพันธุ์ claudin-16/19* — เป็นสาเหตุ **ทางพันธุกรรม** ที่แสดงอาการมาตั้งแต่เด็กพร้อมแคลเซียมรั่วและนิ่วไต ไม่ใช่เพิ่งเกิดตอนได้ยาเคมีบำบัด", "pearl": "แมกนีเซียมต่ำในคนที่ได้ cetuximab = EGFR ถูกบล็อก → TRPM6 ที่ DCT ลดลง → ไตรั่ว", "topic": "สมดุลแมกนีเซียมและการจัดการของไต", "src": "", "ref": [], "nl": ["B9.1.2(3)", "B9.3(5)"]}]}, {"id": "nephro-05-11", "title": "ภาวะแมกนีเซียมต่ำ — ตัวการเบื้องหลังโพแทสเซียมและแคลเซียมที่แก้ไม่ขึ้น", "minutes": 11, "summary": "หัวข้อที่ออกสอบมากที่สุดของคาบนี้ — จำกลไก ROMK ให้ได้", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "2.2.15", "B9.4(2)"], "md": "### สาเหตุ\nสไลด์แบ่งเป็นสามข้อ: **กินหรือดูดซึมได้น้อย · เสียทางทางเดินอาหาร ไต หรือผิวหนัง · (พบน้อย) ถูกกักไว้ในกระดูก**\n\n| กลุ่ม | ตัวอย่างที่ต้องนึกถึง |\n|---|---|\n| **กิน/ดูดซึมน้อย** | ขาดสารอาหาร **สุราเรื้อรัง** ลำไส้ดูดซึมผิดปกติ ลำไส้สั้น **PPI ระยะยาว (กด TRPM6 ที่ลำไส้)** |\n| **เสียทางทางเดินอาหาร** | **ท้องเสียเรื้อรัง** (น้ำย่อยส่วนล่างมีแมกนีเซียมสูง จึงเสียมากกว่าการอาเจียนมาก) ท่อระบายลำไส้ |\n| **เสียทางไต** | **ยาขับปัสสาวะกลุ่ม loop และ thiazide · amphotericin B · aminoglycoside · cisplatin · calcineurin inhibitor (cyclosporine, tacrolimus) · cetuximab** · เบาหวานที่มีน้ำตาลในปัสสาวะสูง · ระยะปัสสาวะออกมากหลัง ATN · **Gitelman และ Bartter syndrome** |\n| **เคลื่อนที่ผิดที่** | **Hungry bone syndrome · refeeding syndrome** |\n\n### กลไกที่ต้องไล่ให้ได้ — และเป็นหัวใจของข้อสอบทั้งหมวด\n\n**1. โพแทสเซียมต่ำที่ดื้อต่อการเติม (ข้อที่ออกสอบบ่อยที่สุด)**\n- ปกติ **แมกนีเซียมในไซโทซอลทำหน้าที่ \"อุด\" ช่อง ROMK จากด้านใน** ไม่ให้โพแทสเซียมไหลออกสู่ลูเมนมากเกินไป\n- เมื่อ **แมกนีเซียมในเซลล์พร่อง → การอุดนั้นหายไป → ROMK เปิดโล่ง → หน่วยไตส่วนปลายหลั่งโพแทสเซียมทิ้งมากขึ้น**\n- ผลคือ **โพแทสเซียมต่ำที่ดื้อต่อการเติมโพแทสเซียม จนกว่าจะแก้แมกนีเซียมก่อน**\n> **ในข้อสอบ: คนไข้เติมโพแทสเซียมทุกวันแล้วยังต่ำอยู่ → คำตอบคือส่งและแก้แมกนีเซียม**\n\n**2. แคลเซียมต่ำ — พบใน 50% ของคนที่แมกนีเซียมต่ำ**\n- **สาเหตุหลักคือแมกนีเซียมที่พร่องกด \"การหลั่ง\" PTH** ซึ่ง **กลับคืนได้ภายใน 24 ชั่วโมงหลังเติมแมกนีเซียม**\n- ร่วมกับ **calcitriol ในเลือดต่ำ** และ **การดื้อต่อ PTH และวิตามินดีที่อวัยวะเป้าหมาย**\n- จึงได้ภาพ **แคลเซียมต่ำ ร่วมกับ PTH ที่ต่ำหรือ \"ปกติ\" ทั้งที่ควรจะสูง**\n\n**3. หัวใจ**\n- **แมกนีเซียมเป็น cofactor บังคับของทุกปฏิกิริยาที่ใช้ ATP รวมถึง Na⁺-K⁺-ATPase**\n- พร่องแมกนีเซียม → **Na⁺-K⁺-ATPase ทำงานบกพร่อง → โพแทสเซียมในเซลล์ลดลง → ศักย์พักเยื่อหุ้มเซลล์เป็นลบน้อยลง (depolarized) → เกิดจุดกำเนิดไฟฟ้าผิดที่และหัวใจเต้นเร็วผิดจังหวะ**\n- **แรงขับให้โพแทสเซียมไหลออกลดลง → การรีโพลาไรซ์ช้าลง → QT/QU ยาว**\n- คลื่นไฟฟ้าหัวใจ: **T ยอดคู่ (bifid T) · คลื่น U · QT หรือ QU ยาว** และพบน้อยคือ **electrical alternans ของ T หรือ U**\n- **Torsades de pointes · VT ชนิด monomorphic · VF ที่ดื้อต่อการรักษามาตรฐานและตอบสนองต่อการเติมแมกนีเซียมเท่านั้น**\n- **เสริมฤทธิ์ความเป็นพิษของดิจอกซิน** เพราะ **ทั้งดิจอกซินและการพร่องแมกนีเซียมต่างยับยั้ง Na⁺-K⁺-ATPase → ผลบวกกันในการทำให้โพแทสเซียมในเซลล์พร่อง**\n\n**4. ระบบประสาทและกล้ามเนื้อ**\n- **มือสั่น กล้ามเนื้อกระตุก Trousseau และ Chvostek sign มือจีบเต็มขั้น**\n- **ชัก** — ทั้งแบบเกร็งกระตุกทั้งตัว และแบบ **multifocal motor seizure ที่บางครั้งถูกกระตุ้นด้วยเสียงดัง**\n- **กลไก:** ปกติ **แมกนีเซียมนอกเซลล์ทำหน้าที่อุดช่องของตัวรับ NMDA** ไว้ เมื่อแมกนีเซียมต่ำ **การอุดนั้นหายไป → กลูตาเมตกระตุ้นให้เยื่อหลังไซแนปส์ดีโพลาไรซ์ได้เต็มที่ → เกิดกิจกรรมไฟฟ้าแบบลมชัก**\n- **Vertical nystagmus** — พบน้อยแต่ **มีค่าในการวินิจฉัยมาก** เพราะเมื่อไม่มีรอยโรคทางโครงสร้างของซีรีเบลลัมหรือระบบทรงตัว **สาเหตุทางเมตาบอลิกมีเพียงสองอย่างคือ Wernicke encephalopathy และการพร่องแมกนีเซียมรุนแรง**\n\n**5. กระดูกและอื่น ๆ**\nสร้างกระดูกน้อยลงและสลายมากขึ้น → **มวลกระดูกลดลง** · สัมพันธ์กับ **ภาวะดื้ออินซูลินและกลุ่มอาการเมตาบอลิกในเบาหวานชนิดที่ 2 · ไมเกรน · หืด** (แมกนีเซียมคลายกล้ามเนื้อเรียบ)\n\n### การรักษา\n**ใครควรได้รับการเติม** — สไลด์ระบุไว้ชัด\n- **มีอาการ** → เติมแน่นอน\n- ไม่มีอาการแต่ **มีโรคหัวใจหรือโรคลมชักอยู่เดิม**\n- **มีแคลเซียมต่ำหรือโพแทสเซียมต่ำรุนแรงร่วมด้วย**\n- **แมกนีเซียมต่ำเดี่ยว ๆ ที่รุนแรง คือต่ำกว่า 1.4 mg/dL**\n*(การรักษาคนที่ไม่มีอาการและไม่รุนแรงยัง **เป็นที่ถกเถียง**)*\n\n**ทางหลอดเลือด — ใช้ MgSO₄·7H₂O**\n| สถานการณ์ | ขนาดและอัตรา |\n|---|---|\n| **กำลังชักหรือหัวใจเต้นผิดจังหวะ** | **8−16 mEq (1−2 g) IV ใน 2−4 นาที** |\n| **ไม่ฉุกเฉิน** | **64 mEq (8 g) ใน 24 ชั่วโมงแรก แล้วตามด้วย 32 mEq (4 g) ต่อวัน อีก 2−6 วัน** |\n\n- **ปริมาณที่พร่องโดยเฉลี่ยคือ 1−2 mEq/kg**\n- **ให้ช้ากว่าดีกว่าเสมอ** — ถ้าให้เร็ว ระดับในเลือดจะพุ่งขึ้นแล้ว **ไตขับทิ้งทันที** การให้ช้าและนานจึงเติมคลังในร่างกายได้จริง\n- **ระดับในเลือดขึ้นก่อน แต่คลังในเซลล์ใช้เวลานานกว่า → ต้องให้ต่ออีกอย่างน้อย 1−2 วันหลังระดับในเลือดกลับเป็นปกติแล้ว**\n- **GFR ลดลง → ลดอัตราการให้ลง 25−50% และเจาะติดตามถี่ ๆ**\n- **เฝ้าระวังการให้เกินด้วยการตรวจรีเฟล็กซ์เอ็นลึกข้างเตียง**\n- **ข้อควรระวังสำคัญ** — การให้ MgSO₄ ปริมาณมากทางหลอดเลือด **ทำให้ ionized calcium ลดลงเฉียบพลัน** จากการ **ขับแคลเซียมออกทางปัสสาวะมากขึ้น และซัลเฟตจับแคลเซียมไว้** → **ในคนที่แคลเซียมต่ำอยู่แล้ว อาจกระตุ้นให้เกิดมือจีบได้**\n\n**ทางปาก**\n- **Magnesium oxide 140 mg ครั้งละ 1 เม็ด วันละ 4−5 ครั้ง** หรือเกลือแมกนีเซียมชนิดอื่นในขนาดเทียบเท่า\n- **ชีวปริมาณออกฤทธิ์ทางปากราว 33%** ในคนที่ลำไส้ปกติ · ความต้องการเพื่อคงระดับทางหลอดเลือดเทียบเท่าคือ **10 mEq/วัน**\n- **เกลือแมกนีเซียมทุกชนิดทำให้ท้องเสีย ซึ่งเป็นตัวจำกัดขนาดยา**\n- **Magnesium hydroxide และ magnesium oxide เป็นเกลือที่ทำให้เป็นด่าง** อาจเกิดภาวะเลือดเป็นด่างทั้งร่างกาย\n- **เกลือซัลเฟตและกลูโคเนตส่งประจุลบที่ดูดกลับไม่ได้ไปถึงท่อรวม จึงอาจซ้ำเติมการเสียโพแทสเซียม**\n- **ชนิดออกฤทธิ์เนิ่น (magnesium chloride แบบ Slow-Mag, magnesium l-lactate แบบ Mag-Tab SR)** ดูดซึมช้า **จึงถูกไตขับทิ้งน้อยลง ใช้ขนาดต่ำลงได้ และท้องเสียน้อยกว่า**\n- คนที่ลำไส้ดูดซึมผิดปกติ **ต้องเพิ่มขนาดเป็น 2−4 เท่า**\n\n**ยาขับปัสสาวะกลุ่มประหยัดโพแทสเซียม** — **amiloride และ triamterene** (ปิด ENaC ที่ท่อส่วนปลาย) **ช่วยลดการเสียแมกนีเซียมทางไต** ใช้ในคนที่ **ดื้อต่อการเติมทางปาก หรือกินขนาดสูงจนท้องเสีย**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์อธิบายกลไกโพแทสเซียมต่ำจากแมกนีเซียมพร่องไว้ตรง ๆ ว่าเกิดจาก **\"cytosolic Mg depletion ซึ่งปลดการอุดช่อง ROMK จากด้านใน\"** และย้ำว่า **คนไข้มักดื้อต่อการเติมโพแทสเซียมจนกว่าจะแก้แมกนีเซียม**\n- สไลด์ย้ำว่าอาการทางหัวใจและระบบประสาทที่โทษว่าเกิดจากแมกนีเซียม **ส่วนหนึ่งอธิบายได้ด้วยภาวะโพแทสเซียมต่ำและแคลเซียมต่ำที่มักเกิดร่วมกันในคนไข้คนเดียวกัน**\n- สไลด์ให้ค่าความต้องการแมกนีเซียมต่อวัน: **ผู้ชาย 420 mg (35 mEq) · ผู้หญิง 320 mg (27 mEq)**\n", "pearls": ["โพแทสเซียมต่ำที่เติมเท่าไรก็ไม่ขึ้น = แมกนีเซียมต่ำ — Mg ในเซลล์ปกติอุด ROMK ไว้ เมื่อพร่องจึงรั่ว K ทิ้ง", "แคลเซียมต่ำพบใน 50% ของคนที่แมกนีเซียมต่ำ จากการกดการหลั่ง PTH ซึ่งกลับคืนได้ใน 24 ชม.", "แมกนีเซียมนอกเซลล์อุดช่อง NMDA ไว้ — พร่องแล้วจึงชัก และชักอาจถูกกระตุ้นด้วยเสียงดัง", "Vertical nystagmus จากสาเหตุเมตาบอลิกมีแค่สองอย่าง — Wernicke และแมกนีเซียมพร่องรุนแรง", "ให้แมกนีเซียมช้า ๆ ดีกว่าเร็ว และต้องให้ต่ออีก 1−2 วันหลังระดับในเลือดปกติแล้ว", "MgSO₄ ปริมาณมากทำให้ ionized calcium ตก อาจกระตุ้นมือจีบในคนที่แคลเซียมต่ำอยู่เดิม"], "items": [{"id": "N-MCQ-03", "kind": "mcq", "stem": "A 16-year-old girl with acute lymphoblastic leukaemia has been hospitalised for 2 months and has received multiple courses of amphotericin B for candidaemia. Over the past 2 weeks she has had persistent hypokalaemia (potassium 2.8-3.1 mEq/L) despite daily oral and intravenous potassium replacement. Renal function is normal and she is not vomiting or taking diuretics. Which additional laboratory value should be checked, and would it be expected to be high or low?", "choices": ["Calcium, expected to be high", "Sodium, expected to be high", "Calcium, expected to be low", "Magnesium, expected to be low", "Magnesium, expected to be high"], "answer": 3, "explain": "กลไก (เป็นคำถามที่วัดความเข้าใจสรีรวิทยาระดับ channel): **hypomagnesaemia ทำให้ hypokalaemia ดื้อต่อการให้ potassium**\n\nเหตุผลเชิงโมเลกุล: การขับ K ออกที่ **cortical collecting duct** เกิดผ่าน **ROMK channel**; ภายในเซลล์ **Mg2+ ทำหน้าที่เป็นตัวอุดรูจากด้านใน (intracellular Mg blocks ROMK)**\n- เมื่อ **Mg ในเซลล์ต่ำ** → การอุดรูหายไป → **ROMK เปิดกว้าง → K รั่วออกทางปัสสาวะไม่หยุด**\n- ดังนั้นไม่ว่าจะเติม K เท่าไร K ก็จะถูกขับทิ้ง → **ต้องแก้ Mg ก่อน K จึงจะขึ้น**\n\nในโจทย์มีปัจจัยเสี่ยงของ Mg ต่ำชัดเจน: **amphotericin B** (ทำให้ renal tubular wasting ของ Mg และ K, เกิด distal RTA), การรักษาด้วยยาอื่นที่ทิ้ง Mg (เช่น aminoglycoside, cisplatin), ภาวะโภชนาการไม่ดีจากการนอน รพ. นาน, ท้องเสียจากเคมีบำบัด\n\nทำไมข้ออื่นผิด:\n- **Magnesium สูง**: hypermagnesaemia พบในไตวายหรือได้รับ Mg มากเกิน และจะ **กด** การขับ K ไม่ได้ทำให้ K ต่ำดื้อ — ทิศทางกลับกัน\n- **Calcium สูง**: hypercalcemia ไม่ใช่กลไกของ refractory hypokalemia (และในผู้ป่วย leukemia ที่ได้ chemo มักเจอ **hypocalcemia** จาก tumor lysis มากกว่า)\n- **Calcium ต่ำ**: พบร่วมกับ Mg ต่ำได้จริง (เพราะ Mg ต่ำ **กดการหลั่ง PTH และทำให้ end-organ ดื้อต่อ PTH** → hypocalcemia ที่แก้ด้วย Ca เฉยๆไม่หาย) แต่ **hypocalcemia ไม่ใช่สาเหตุที่ทำให้ K ต่ำดื้อ** — คำถามถามตัวที่อธิบาย K ต่ำ จึงต้องตอบ Mg\n- **Sodium สูง**: ไม่มีความเชื่อมโยงเชิงกลไกกับ refractory hypokalemia\n\nการรักษา: ให้ **MgSO4 IV** (หรือ Mg oral ถ้าไม่รุนแรง) พร้อมกับ K; ระวังว่า **serum Mg สะท้อน total body Mg ได้แย่** (Mg ส่วนใหญ่อยู่ในกระดูกและเซลล์) จึงอาจต้องเติมแม้ค่าจะ \"เกือบปกติ\" และต้องระวังในผู้ป่วยไตเสื่อม", "pearl": "ท่องเป็นกฎ: **\"แก้ K ไม่ขึ้น ให้ดู Mg; แก้ Ca ไม่ขึ้น ให้ดู Mg\"** — Mg ต่ำทำให้ทั้ง hypokalemia และ hypocalcemia ดื้อต่อการรักษา และเป็นสาเหตุของ **torsades de pointes**", "topic": "Refractory hypokalaemia – the role of magnesium", "src": "", "ref": ["MED31 past paper loop C&D – A 16 year old girl with ALL hospitalized >2 months, Candida septicemia, persistent hypokalemia despite daily repletion. What laboratory value should the physician check and is it expected to be high or low? (choices: Ca high/low, Mg high/low, Na high)", "MED31 past paper – ผู้ป่วยหญิง 21 ปี HIV CD4 29 admit ด้วย cryptococcal meningitis ได้ amphotericin B 1 สัปดาห์ แขนขาไม่มีแรง proximal grade 3 → ส่งตรวจ electrolyte และ Mg", "MED31 MCQ – Ans hypokalemia"], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}, {"id": "N-OLD-010", "kind": "old", "stem": "A 16-year-old girl with leukaemia on prolonged amphotericin B has persistent hypokalaemia despite daily potassium replacement. Which additional test is most useful?", "choices": ["Serum uric acid", "Serum amylase", "Serum lactate", "Serum ammonia", "Serum magnesium"], "answer": 4, "explain": "**Hypokalaemia ที่แก้ไม่ขึ้นต้องตรวจแมกนีเซียมเสมอ** — เมื่อ Mg ต่ำ ช่อง ROMK ที่ collecting duct ถูกยับยั้งน้อยลงทำให้ไตขับโพแทสเซียมทิ้งต่อเนื่อง จึงต้อง **แก้ Mg ก่อนหรือพร้อมกัน** โพแทสเซียมจึงจะขึ้น; amphotericin B ทำให้เสียทั้ง K และ Mg ทางไต", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}, {"id": "N-OLD-011", "kind": "old", "stem": "A patient with HIV on amphotericin B for 1 week develops proximal muscle weakness grade 3. Which investigation should be sent first?", "choices": ["Muscle biopsy", "Serum electrolytes including potassium and magnesium", "Nerve conduction study", "Creatine kinase only", "Thyroid function test"], "answer": 1, "explain": "**Amphotericin B ทำให้เกิด distal renal tubular acidosis และเสีย K/Mg ทางไต** จนเกิดกล้ามเนื้ออ่อนแรงจาก hypokalaemia — ตรวจอิเล็กโทรไลต์ก่อนเสมอเพราะแก้ได้เร็วและเป็นสาเหตุที่พบบ่อยที่สุดในบริบทนี้", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(3)", "2.1.22"]}, {"id": "N-OLD-015", "kind": "old", "stem": "Which statement about magnesium is correct?", "choices": ["Magnesium level always parallels the potassium level", "Proton pump inhibitors raise serum magnesium", "Hypomagnesaemia causes refractory hypokalaemia and hypocalcaemia and must be corrected first", "Magnesium is not required for PTH secretion", "Hypomagnesaemia typically causes bradycardia and a short QT interval"], "answer": 2, "explain": "**Mg ต่ำมีผลสองทาง**: ทำให้ไตขับ K ทิ้งจน hypokalaemia ดื้อการแก้ และ **กดการหลั่ง PTH พร้อมทำให้ดื้อต่อ PTH** จนแคลเซียมต่ำ; ทางคลื่นไฟฟ้าหัวใจสัมพันธ์กับ **QT ยาวและ torsades de pointes**; ยาที่ทำให้ Mg ต่ำได้แก่ **PPI ระยะยาว, ยาขับปัสสาวะ, amphotericin B, aminoglycoside, cisplatin**", "pearl": "", "topic": "", "src": "MED30 สรุป Renal (หน้า 283-287)", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}]}, {"id": "nephro-05-12", "title": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "minutes": 8, "summary": "เกิดได้แค่สองสถานการณ์ และอาการเรียงตามระดับอย่างคาดเดาได้", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "B9.2.7(2)", "B9.4(2)"], "md": "### เกิดได้เพียงสองสถานการณ์\nไต **มีความสามารถในการขับแมกนีเซียมสูงมาก** เมื่อเกินระดับเกณฑ์ของไต แมกนีเซียมส่วนเกินที่ถูกกรองจะถูกขับออกไปแทบทั้งหมด **ระดับในเลือดจึงถูกกำหนดด้วย GFR เป็นหลัก** ดังนั้นแมกนีเซียมสูงเกิดได้แค่\n1. **การทำงานของไตบกพร่อง**\n2. **ได้รับแมกนีเซียมมากเกินไป**\n\n**โรคไต**\n- ใน CKD **หน่วยไตที่เหลือปรับตัวโดยเพิ่ม FEMg อย่างมาก** ระดับในเลือดจึง **ยังปกติไปจนกว่า CrCl จะต่ำกว่าราว 20 mL/min**\n- แม้ในโรคไตระยะท้าย **แมกนีเซียมสูงอย่างมีนัยสำคัญก็ยังพบน้อย เว้นแต่ได้รับแมกนีเซียมจากภายนอก** — **ยาลดกรด ยาระบาย ยาสวนทวาร**\n- **อายุที่มากขึ้นเป็นปัจจัยเสี่ยงสำคัญ** แม้การทำงานของไตจะดู \"ปกติ\" เพราะ GFR ลดลงตามวัยโดยไม่แสดงในค่าครีแอตินิน\n\n**ได้รับมากเกินไป (แม้ GFR ปกติ)**\n- **ยาลดกรดและยาระบายที่มีแมกนีเซียมในขนาดสูง · ยาสวนทวาร MgSO₄ · การให้ทางหลอดเลือดขนาดสูงเช่นในภาวะครรภ์เป็นพิษ**\n- **การได้รับทางลำไส้เป็นพิษได้ง่ายเป็นพิเศษในคนที่ลำไส้อักเสบ อุดตัน หรือทะลุ** เพราะการดูดซึมเพิ่มขึ้น\n\n**สาเหตุที่ทำให้สูงขึ้นเล็กน้อย** — ลิเทียม ผู้ป่วยหลังผ่าตัด มะเร็งแพร่กระจายไปกระดูก milk-alkali syndrome FHH ภาวะพร่องไทรอยด์ Addison disease\n\n### อาการเรียงตามระดับ — ตารางที่ควรท่อง\n| ระดับ Mg | อาการและอาการแสดง |\n|---|---|\n| **> 4−6 mg/dL** | **ความดันต่ำ คลื่นไส้ อาเจียน หน้าแดง ปัสสาวะคั่ง ลำไส้ไม่เคลื่อนไหว** |\n| **> 8−12 mg/dL** | **รีเฟล็กซ์เอ็นลึกหายไป กล้ามเนื้อลายอ่อนปวกเปียก (flaccid paralysis)** |\n| **สูงขึ้นอีก** | **หัวใจเต้นช้า บล็อกที่ SA, AV และ His bundle · กดการหายใจ · โคม่า · หัวใจหยุดเต้นแบบ asystole** |\n\n**กลไก**\n- **ความดันต่ำและหน้าแดงเป็นอาการแรก ๆ** จาก **การขยายตัวของกล้ามเนื้อเรียบหลอดเลือด และการยับยั้งการหลั่งนอร์อิพิเนฟรินจากปลายประสาทซิมพาเทติก**\n- **แมกนีเซียมที่สูงยับยั้งการหลั่งอะเซทิลโคลีนที่แผ่นปลายประสาท-กล้ามเนื้อ** → **รีเฟล็กซ์หายและอัมพาตอ่อนปวกเปียก** → **กดการหายใจ** ซึ่งเป็นภาวะแทรกซ้อนร้ายแรงของพิษแมกนีเซียมขั้นสูง\n- **กล้ามเนื้อเรียบเป็นอัมพาต** → **ปัสสาวะคั่ง ลำไส้ไม่เคลื่อนไหว รูม่านตาขยาย**\n- **อาจพบ anion gap ในเลือดต่ำผิดปกติหรือถึงกับติดลบ** เป็นเบาะแสได้ แต่ **ไม่พบสม่ำเสมอ** ขึ้นกับว่าประจุลบที่มากับแมกนีเซียมเป็นชนิดใด\n\n> **การตรวจรีเฟล็กซ์เอ็นลึกคือเครื่องมือเฝ้าระวังข้างเตียงที่ดีที่สุด** — เป็นเหตุผลที่สูติแพทย์ตรวจรีเฟล็กซ์ทุกครั้งขณะให้ MgSO₄ ในภาวะครรภ์เป็นพิษ **รีเฟล็กซ์ที่หายไปคือสัญญาณเตือนก่อนที่การหายใจจะถูกกด**\n\n### การรักษา\n1. **พิษไม่รุนแรงและไตยังดี → หยุดแมกนีเซียมอย่างเดียวก็พอ** เพราะไตขับได้เร็ว — **ค่าครึ่งชีวิตของแมกนีเซียมในเลือดปกติคือราว 28 ชั่วโมง**\n2. **พิษรุนแรงโดยเฉพาะต่อหัวใจ → ให้แคลเซียมทางหลอดเลือดเพื่อต้านฤทธิ์ชั่วคราว**\n   - **Calcium chloride 1 g หยดทางหลอดเลือดดำใหญ่นาน 2−5 นาที** หรือ **calcium gluconate ทางหลอดเลือดส่วนปลาย ให้ซ้ำได้หลัง 5 นาทีถ้าจำเป็น**\n3. **เร่งการขับทางไต** — **ให้น้ำเกลือร่วมกับ furosemide** ซึ่ง **ยับยั้งการดูดกลับแมกนีเซียมที่ TAL ส่วนเมดัลลา**\n4. **โรคไตระยะท้าย → ฟอกเลือดหรือ hemofiltration เป็นทางเดียว** — **HD ได้ผลดีมาก กำจัดได้ถึง 100 mL/min** น้ำยาฟอกมาตรฐานมีแมกนีเซียม **0.6−1.2 mg/dL** และใช้น้ำยาที่ไม่มีแมกนีเซียมได้ **โดยทั่วไปทนได้ดี ยกเว้นเป็นตะคริว**\n\n> **จุดละเอียดที่สไลด์ทิ้งท้ายและเป็นกับดักที่ดี** — ถ้าใช้น้ำยาฟอกที่มีแมกนีเซียม **\"รวม\" เท่ากับในเลือดของคนไข้ แมกนีเซียมจะเคลื่อนเข้าสู่ตัวคนไข้แทนที่จะออก** เพราะ **แมกนีเซียมในเลือดเป็นอิสระเพียงราว 70%** ความเข้มข้นของ **แมกนีเซียมอิสระในน้ำยาจึงสูงกว่าในเลือด** ทำให้ความต่างระดับวิ่งจากน้ำยาเข้าสู่เลือด\n> การประมาณคร่าว ๆ: **หลังฟอก 3−4 ชั่วโมงด้วยเยื่อประสิทธิภาพสูง ระดับจะเปลี่ยนไปราวหนึ่งในสามถึงครึ่งหนึ่งของผลต่างระหว่างแมกนีเซียมในน้ำยากับแมกนีเซียมอิสระในเลือดก่อนฟอก (ประมาณ 70% ของค่ารวม)**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์จัดอาการเป็น **\"predictable sequence\"** ตามระดับที่สูงขึ้น และให้จุดตัด **4−6 mg/dL** กับ **8−12 mg/dL** ไว้ชัดเจน — เป็นตัวเลขที่ออกสอบตรง\n- สไลด์ระบุว่าใน CKD **ระดับแมกนีเซียมจะยังคงปกติจนกว่า CrCl จะต่ำกว่าราว 20 mL/min**\n- สไลด์เน้นว่า **การได้รับแมกนีเซียมจากภายนอก (ยาลดกรด ยาระบาย ยาสวน) คือสิ่งที่เปลี่ยนคนไข้ CKD ให้กลายเป็นพิษแมกนีเซียม** ไม่ใช่โรคไตเพียงลำพัง\n", "pearls": ["แมกนีเซียมสูงเกิดได้แค่สองทาง — ไตเสีย หรือได้รับมากเกิน (ยาลดกรด ยาระบาย ยาสวน MgSO₄)", "Mg > 4−6 ความดันต่ำ หน้าแดง อาเจียน ลำไส้ไม่เคลื่อน · > 8−12 รีเฟล็กซ์หายและอัมพาตอ่อนปวกเปียก", "รีเฟล็กซ์เอ็นลึกที่หายไปคือสัญญาณเตือนก่อนการหายใจถูกกด — ใช้เฝ้าระวังข้างเตียง", "แก้พิษเฉียบพลันด้วยแคลเซียมทางหลอดเลือด แล้วเร่งขับด้วยน้ำเกลือ + furosemide · ESKD ต้องฟอกเลือด", "ใน CKD ระดับแมกนีเซียมยังปกติจนกว่า CrCl จะต่ำกว่าราว 20 mL/min"], "items": [{"id": "NEPHRO-05-12-Q1", "kind": "own", "stem": "A 78-year-old woman with chronic kidney disease (eGFR 22 mL/min/1.73 m2) is admitted with drowsiness and constipation after taking a magnesium-containing laxative daily for a week. Blood pressure is 88/54 mmHg, heart rate 48/min, and her deep tendon reflexes are absent. Serum magnesium is 9.8 mg/dL (normal 1.7-2.4). Which of the following is the most appropriate immediate treatment?", "choices": ["Give intravenous furosemide alone without volume replacement", "Stop the laxative and give intravenous calcium gluconate", "Start an insulin and dextrose infusion", "Stop the laxative and observe, since the half-life of magnesium is short", "Give oral sodium polystyrene sulfonate"], "answer": 1, "explain": "**กลไก** — คนไข้มีพิษแมกนีเซียมที่รุนแรงแล้ว: **รีเฟล็กซ์เอ็นลึกหายไป (เข้ากับช่วง 8−12 mg/dL) ร่วมกับความดันต่ำและหัวใจเต้นช้า** ซึ่งเป็นสัญญาณว่า **การหายใจอาจถูกกดเป็นลำดับถัดไป** จึงต้อง **ต้านฤทธิ์ที่เยื่อหุ้มเซลล์ทันทีด้วยแคลเซียมทางหลอดเลือด** แคลเซียมเป็นปฏิปักษ์ทางสรีรวิทยาโดยตรงต่อแมกนีเซียมที่ยับยั้งการหลั่งอะเซทิลโคลีนและกดการนำไฟฟ้าของหัวใจ พร้อมกับ **หยุดแหล่งของแมกนีเซียม** แล้วจึงตามด้วยการเร่งขับ (น้ำเกลือร่วมกับ furosemide) และ **ฟอกเลือดถ้าไตไม่สามารถขับออกได้**\n\n**ทำไมตัวลวงจึงผิด**\n- *หยุดยาแล้วเฝ้าดู* — ใช้ได้เฉพาะ **พิษไม่รุนแรงในคนที่ไตยังดี** ค่าครึ่งชีวิต 28 ชั่วโมงนั้นตั้งอยู่บนสมมติฐานว่าไตขับได้ คนไข้รายนี้ **eGFR 22 และมีอาการรุนแรงแล้ว** การรอคือปล่อยให้เดินไปสู่การกดการหายใจ\n- *ให้ furosemide อย่างเดียวโดยไม่เติมน้ำ* — คนไข้ความดัน 88/54 อยู่แล้ว การขับปัสสาวะโดยไม่เติมปริมาตรจะทำให้ความดันตกและ GFR แย่ลง ยิ่งขับแมกนีเซียมไม่ออก · furosemide ต้องใช้ **ร่วมกับน้ำเกลือ**\n- *อินซูลินร่วมกับน้ำตาล* — เป็นการรักษา **โพแทสเซียมสูง** ไม่ได้ย้ายแมกนีเซียมเข้าเซลล์อย่างมีนัยสำคัญ\n- *Sodium polystyrene sulfonate* — เรซินจับ **โพแทสเซียม** ไม่ใช่แมกนีเซียม", "pearl": "รีเฟล็กซ์หาย + ความดันต่ำ + หัวใจช้า ในคนไข้ CKD ที่กินยาระบายแมกนีเซียม = ให้แคลเซียมทางหลอดเลือดทันที", "topic": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)"]}, {"id": "NEPHRO-05-12-Q2", "kind": "own", "stem": "A 29-year-old woman with severe pre-eclampsia is receiving an intravenous magnesium sulfate infusion. Which bedside finding should prompt the infusion to be stopped first?", "choices": ["Facial flushing and nausea", "Urinary retention requiring catheterisation", "Loss of the patellar deep tendon reflex", "A fall in systolic blood pressure of 10 mmHg", "A respiratory rate of 10 per minute"], "answer": 2, "explain": "**กลไก** — พิษแมกนีเซียมดำเนินไปตามลำดับที่คาดเดาได้ตามระดับที่สูงขึ้น: **หน้าแดง คลื่นไส้ ความดันต่ำ (> 4−6 mg/dL) → รีเฟล็กซ์เอ็นลึกหายและกล้ามเนื้ออ่อนปวกเปียก (> 8−12 mg/dL) → กดการหายใจ โคม่า หัวใจหยุดเต้น** ดังนั้น **การหายไปของรีเฟล็กซ์เอ็นลึกคือสัญญาณเตือนสุดท้ายที่ยังกลับได้ ก่อนจะถึงขั้นกดการหายใจ** สไลด์ระบุตรง ๆ ว่า **การตรวจรีเฟล็กซ์เป็นการทดสอบข้างเตียงที่มีประโยชน์ในการตรวจจับการได้รับแมกนีเซียมเกินขนาด** จึงเป็นเหตุผลที่ต้องตรวจรีเฟล็กซ์ซ้ำ ๆ ตลอดการให้ยา\n\n**ทำไมตัวลวงจึงผิด**\n- *อัตราการหายใจ 10 ครั้งต่อนาที* — เป็นสัญญาณที่ **ช้าเกินไป** เพราะการกดการหายใจอยู่ **หลัง** การเสียรีเฟล็กซ์ในลำดับของพิษ จุดประสงค์ของการเฝ้ารีเฟล็กซ์คือเพื่อ **ไม่ให้เดินมาถึงจุดนี้** (ถ้ามาถึงแล้วต้องหยุดยา ให้แคลเซียม และช่วยหายใจทันที)\n- *หน้าแดงและคลื่นไส้* — เป็นอาการของช่วงระดับต่ำสุด พบได้บ่อยและไม่จำเพาะ ไม่ใช่จุดที่ต้องหยุดยาทันที\n- *ความดันซิสโตลิกลดลง 10 mmHg* — แมกนีเซียมขยายหลอดเลือดอยู่แล้ว และการลดความดันคือผลที่ต้องการส่วนหนึ่งในภาวะครรภ์เป็นพิษ\n- *ปัสสาวะคั่ง* — เป็นอาการของกล้ามเนื้อเรียบเป็นอัมพาต อยู่ในช่วงระดับต้น ๆ และแก้ได้ด้วยการสวนปัสสาวะ ไม่ใช่ตัวชี้ขาด\n\n**ข้อควรรู้เพิ่ม** — ถ้าคนไข้มีปัสสาวะออกน้อยหรือไตเสื่อม ต้องลดขนาดยาลงและเจาะระดับแมกนีเซียมถี่ขึ้น เพราะไตคือทางออกทางเดียว", "pearl": "เฝ้าระวังพิษ MgSO₄ ด้วยรีเฟล็กซ์เอ็นลึก — รีเฟล็กซ์หายมาก่อนการกดการหายใจเสมอ", "topic": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)"]}]}], "meq": [{"id": "N-MEQ-04", "part": "MEQ", "lec": "05", "lecture": "Fluid electrolyte: Divalent (อ.ธิติยา)", "topic": "Symptomatic hypercalcaemia with acute kidney injury from malignancy", "vignette": "ผู้ป่วยหญิงไทยอายุ 66 ปี มาโรงพยาบาลด้วยอาการซึมลง 2 วัน\nPI:\n- 1 เดือนก่อน ปวดหลังช่วงล่างมากขึ้นเรื่อยๆ รับประทาน NSAID ที่ซื้อเองเกือบทุกวัน น้ำหนักลด 6 กิโลกรัมใน 3 เดือน\n- 1 สัปดาห์ก่อน ปัสสาวะบ่อยมากทั้งวันทั้งคืน กระหายน้ำ ท้องผูก เบื่ออาหาร คลื่นไส้อาเจียน\n- 2 วันก่อน ซึมลง พูดสับสน ญาติกระตุ้นแล้วลืมตาแต่ตอบไม่ตรงคำถาม\nPE: V/S BT 36.9 C, PR 104/min, RR 18/min, BP 96/58 mmHg, นั่งแล้วความดันตก\nGA: drowsy (E3V4M6), mucous membrane แห้ง, skin turgor ลดลง, ซีดเล็กน้อย\nHEENT: JVP ไม่เห็น; CVS/RS: ปกติ; Abd: soft, ไม่กดเจ็บ, ไม่คลำได้ก้อน\nSpine: กดเจ็บที่ lumbar spine L2-L3; Neuro: ไม่มี focal deficit, DTR ลดลงทั่ว\nLab: CBC Hb 8.6 g/dL, Hct 26%, MCV 88 fL, WBC 5,200/mm3, platelet 190,000/mm3, ESR 112 mm/hr\nBUN 48 mg/dL, creatinine 3.1 mg/dL (ไม่ทราบ baseline), Na 132, K 3.3, Cl 98, HCO3 20 mEq/L\n**Corrected calcium 14.2 mg/dL, phosphate 4.8 mg/dL, albumin 3.0 g/dL, total protein 9.8 g/dL, intact PTH 5 pg/mL (ต่ำ)**\nUA: spgr 1.008, protein 1+ by dipstick, no RBC, no WBC, no cast\nFilm lumbosacral spine: multiple lytic lesions ที่ vertebral body", "questions": [{"q": "1. จงแปลผลความผิดปกติทางห้องปฏิบัติการทั้งหมด", "a": "1. **Severe hypercalcaemia**: corrected calcium 14.2 mg/dL (ปกติ 8.6-10.2) — ระดับที่ทำให้เกิดอาการทางระบบประสาทและต้องรักษาเร่งด่วน\n2. **Intact PTH ต่ำ (5 pg/mL)** → **PTH-independent hypercalcaemia** → บ่งว่าไม่ใช่ primary hyperparathyroidism (ต่อมถูกกดอย่างเหมาะสม) → ต้องหาสาเหตุจาก **มะเร็ง, vitamin D excess, granulomatous disease, thyrotoxicosis, ยา**\n3. **Acute kidney injury**: creatinine 3.1 mg/dL ร่วมกับ BUN 48 (**BUN/Cr ratio ≈ 15-16**) โดยมีองค์ประกอบ **prerenal จาก volume depletion**\n4. **Normochromic normocytic anaemia (Hb 8.6, MCV 88)**\n5. **ESR สูงมาก 112 mm/hr** — บ่งการอักเสบ/โรคมะเร็งทางโลหิตวิทยา\n6. **Total protein สูง (9.8) ขณะที่ albumin ต่ำ (3.0)** → **globulin gap กว้างมาก (6.8 g/dL)** → **ชี้ชัดไปที่ monoclonal gammopathy**\n7. **Hyponatraemia เล็กน้อย (132)** และ **hypokalaemia (3.3)** — จาก volume depletion, อาเจียน และ hypercalcaemia-induced nephrogenic DI\n8. **Metabolic acidosis เล็กน้อย (HCO3 20)** — อาจจากไตวายและ/หรือ **proximal tubular dysfunction จาก light chain (type 2 RTA)**\n9. **Urine specific gravity ต่ำ (1.008)** แม้ผู้ป่วยจะขาดน้ำ → **ไตทำให้ปัสสาวะเข้มข้นไม่ได้ = nephrogenic diabetes insipidus จาก hypercalcaemia** (อธิบาย polyuria ท่ามกลางภาวะขาดน้ำ)\n10. **UA: protein 1+ โดยไม่มี RBC/WBC/cast** — dipstick ตรวจจับ albumin ได้ไม่ดีสำหรับ light chain → **ต้องส่ง urine protein electrophoresis/immunofixation โดยเฉพาะ (Bence Jones protein)**\n11. **Multiple lytic lesions ที่ vertebral body พร้อม ESR สูงและ globulin gap** — ภาพของ **multiple myeloma**"}, {"q": "2. จงให้การวินิจฉัยและอธิบายกลไกของอาการทั้งหมดที่ผู้ป่วยมี", "a": "**Definitive diagnosis: Symptomatic severe hypercalcaemia with acute kidney injury, most likely from multiple myeloma (CRAB complete: hyperCalcaemia, Renal failure, Anaemia, Bone lytic lesion)** โดยมี NSAID เป็นปัจจัยซ้ำเติมไต\n\n**กลไกของ hypercalcaemia ใน multiple myeloma**\n- plasma cell ที่เป็นมะเร็งหลั่ง **osteoclast-activating factor** (RANKL, MIP-1α, IL-6, DKK1 ที่ยับยั้ง osteoblast) → **osteoclastic bone resorption เพิ่มขึ้นขณะที่การสร้างกระดูกถูกกด** → **ปล่อย calcium ออกจากกระดูกจำนวนมาก** และเกิด **lytic lesion โดยที่ alkaline phosphatase มักไม่สูง** (ต่างจาก bone metastasis ของมะเร็งแข็ง)\n- (เทียบกับกลไกอื่นของ hypercalcaemia of malignancy: **PTH-rP ใน squamous cell carcinoma, renal cell, breast** = humoral; **calcitriol ที่สร้างโดยเนื้องอกใน lymphoma**; **osteolytic metastasis**)\n\n**กลไกของอาการแต่ละอย่าง (ลูกโซ่จาก hypercalcaemia)**\n- **Polyuria และ polydipsia**: Ca สูงจับ **calcium-sensing receptor ที่ thick ascending limb → ยับยั้ง NKCC2** และ **ทำให้ collecting duct ดื้อต่อ ADH (ลด aquaporin-2)** → **nephrogenic diabetes insipidus** → ปัสสาวะเจือจางปริมาณมาก (spgr 1.008)\n- **Volume depletion → hypotension, orthostatic drop, mucous membrane แห้ง**: จาก polyuria + อาเจียน + กินได้น้อย\n- **AKI**: (1) **prerenal จาก volume depletion** (2) **Ca ทำให้ renal vasoconstriction** (3) **light chain เป็นพิษต่อ tubule และเกิด cast nephropathy (myeloma kidney)** (4) **nephrocalcinosis** (5) **NSAID ที่ลด prostaglandin-mediated afferent vasodilatation** — หลายกลไกซ้อนกัน\n- **วงจรเลวร้าย (vicious cycle)**: volume depletion → ไตดูดซึม Na กลับมากขึ้นที่ proximal tubule → **Ca ถูกดูดกลับตามไปด้วย** → **ขับ Ca ออกได้น้อยลง → Ca ยิ่งสูง → polyuria มากขึ้น** → วนซ้ำ **นี่คือเหตุผลที่การให้สารน้ำเป็นการรักษาลำดับแรก**\n- **ซึมลง สับสน, DTR ลดลง, อ่อนเพลีย**: Ca สูงลด neuronal excitability และ neuromuscular transmission (ตรงข้ามกับ hypocalcaemia ที่เกิด hyperexcitability/tetany)\n- **ท้องผูก คลื่นไส้อาเจียน เบื่ออาหาร**: Ca สูงลด smooth muscle motility ของทางเดินอาหาร\n- **ปวดหลังและกดเจ็บที่ lumbar spine**: **osteolytic lesion** เสี่ยงต่อ **pathological fracture และ spinal cord compression**\n- **ซีด**: จากการที่ plasma cell แทนที่ไขกระดูก, erythropoietin ลดจากไตวาย และ chronic inflammation"}, {"q": "3. จงให้การรักษาภาวะ hypercalcaemia เรียงตามลำดับ และอธิบายว่า normal saline ช่วยลด hypercalcaemia ได้อย่างไร", "a": "**ลำดับการรักษา**\n**1. IV isotonic saline (0.9% NaCl) — ลำดับแรกและสำคัญที่สุด**\nให้ค่อนข้างเร็วในระยะแรก (เช่น 200-300 mL/ชั่วโมง ปรับตามสถานะหัวใจและปัสสาวะ) โดยติดตามสถานะสารน้ำอย่างใกล้ชิด\n\n**2. Calcitonin (subcutaneous/IM) — สำหรับผลเร็วใน 12-48 ชั่วโมง**\nยับยั้ง osteoclast ทันทีและเพิ่มการขับ Ca ทางปัสสาวะ; **เกิด tachyphylaxis ภายใน 48 ชั่วโมง** จึงใช้เป็น **\"สะพาน\" รอให้ bisphosphonate ออกฤทธิ์**\n\n**3. Antiresorptive agent — การรักษาที่ยั่งยืน**\n- **Zoledronic acid IV** (หรือ pamidronate) — ยับยั้ง farnesyl pyrophosphate synthase ใน osteoclast → **หยุด bone resorption ซึ่งเป็นต้นเหตุจริง**; **onset 2-4 วัน, ออกฤทธิ์นาน 2-4 สัปดาห์**; **ต้องให้หลังเติมสารน้ำแล้วและปรับขนาดตาม renal function**\n- ถ้า **ไตเสื่อมรุนแรง** → พิจารณา **denosumab** (anti-RANKL monoclonal antibody) ซึ่ง **ไม่ถูกขับทางไต** แต่ระวัง **hypocalcaemia** ตามหลัง\n\n**4. รักษาโรคต้นเหตุ** — เริ่มการรักษา multiple myeloma (ซึ่งมักใช้ **corticosteroid** เป็นส่วนหนึ่ง และ steroid เองก็ลด Ca ได้ในมะเร็งทางโลหิตวิทยาและในภาวะที่ calcitriol สูง)\n\n**5. หยุดสิ่งที่ซ้ำเติม** — **หยุด NSAID, thiazide (ลดการขับ Ca), calcium และ vitamin D supplement, ยาที่เป็น nephrotoxin** และให้ผู้ป่วยเคลื่อนไหวร่างกายเท่าที่ทำได้ (การนอนนิ่งเพิ่ม bone resorption)\n\n**6. Haemodialysis** — เมื่อ **Ca สูงรุนแรงร่วมกับไตวายที่ให้สารน้ำไม่ได้ (oliguric/volume overload)** หรือมีอาการทางระบบประสาท/หัวใจรุนแรงที่ไม่ตอบสนอง\n\n**7. Loop diuretic (furosemide)** — **ไม่ใช่การรักษาตามกิจวัตรอีกต่อไป**; ใช้เฉพาะเมื่อเกิด **volume overload จากการให้สารน้ำ** — การให้ก่อนหรือขณะที่ยังขาดน้ำจะทำให้ Ca สูงขึ้นและไตแย่ลง\n\n**Normal saline ช่วยลด hypercalcaemia อย่างไร (กลไก 3 ชั้น — เป็นคำถามที่ออกสอบจริง)**\n1. **แก้ volume depletion → เพิ่ม GFR → เพิ่ม filtered load ของ calcium** ที่ถูกกรองออกมา\n2. **ตัดวงจรการดูดซึมกลับที่ proximal tubule**: เมื่อ volume ต่ำ ไตจะดูดซึม Na กลับอย่างเต็มที่ที่ proximal tubule และ **Ca ถูกดูดกลับตามไปด้วยแบบ paracellular (ตาม Na และน้ำ)** → การเติม volume ทำให้ **การดูดซึม Na ลดลง จึงดูดซึม Ca กลับน้อยลง → ขับ Ca ออกทางปัสสาวะมากขึ้น (calciuresis)**\n3. **Sodium load ที่มากับ saline แข่งขันกับการดูดซึมกลับของ calcium** ที่ thick ascending limb ด้วย (Na และ Ca ใช้เส้นทาง paracellular ร่วมกันซึ่งขับเคลื่อนด้วย lumen-positive potential จาก NKCC2) → เสริมการขับ Ca\n\n**ข้อจำกัดที่ต้องเข้าใจ**: saline **ไม่ได้แก้ต้นเหตุคือ bone resorption** → Ca จะกลับสูงอีกถ้าไม่ให้ antiresorptive agent และไม่รักษามะเร็ง"}, {"q": "4. จะส่งตรวจอะไรเพิ่มเพื่อยืนยันการวินิจฉัยโรคต้นเหตุ และต้องเฝ้าระวังภาวะแทรกซ้อนอะไร", "a": "**การตรวจเพื่อยืนยัน multiple myeloma**\n1. **Serum protein electrophoresis (SPEP) + immunofixation** — หา **M-protein (monoclonal spike)**\n2. **Serum free light chain assay (kappa/lambda ratio)** — ไวกว่าและใช้ติดตามโรค โดยเฉพาะใน light chain-only myeloma\n3. **Urine protein electrophoresis + immunofixation (24-hour urine)** — หา **Bence Jones protein** (dipstick ตรวจไม่พบ light chain)\n4. **Quantitative immunoglobulin (IgG, IgA, IgM)**\n5. **Bone marrow aspiration and biopsy** — นับ **clonal plasma cell ≥10%** พร้อม **cytogenetics/FISH** เพื่อประเมินความเสี่ยง\n6. **Peripheral blood smear** — คาดว่าพบ **rouleaux formation** (จาก M-protein ที่ทำให้ RBC เกาะกันเป็นแถว)\n7. **Whole-body imaging**: low-dose whole-body CT, PET-CT หรือ whole-body MRI (ไวกว่า skeletal survey แบบเดิม) เพื่อประเมิน lytic lesion และ extramedullary disease\n8. **Beta-2 microglobulin, LDH, albumin** — สำหรับ **Revised International Staging System (R-ISS)**\n9. **พิจารณา renal biopsy** ถ้าสาเหตุของไตวายไม่ชัด (แยก **light chain cast nephropathy, AL amyloidosis, light chain deposition disease, monoclonal immunoglobulin deposition**)\n10. คัด **amyloidosis**: ตรวจหา macroglossia, carpal tunnel, cardiac involvement (NT-proBNP, troponin, echo) และพิจารณา fat pad/bone marrow Congo red staining\n\n**ภาวะแทรกซ้อนที่ต้องเฝ้าระวังและจัดการ**\n- **Spinal cord compression** — **ภาวะฉุกเฉิน**: ปวดหลังรุนแรง อ่อนแรงขา ชาแบบมีระดับ ปัสสาวะ/อุจจาระราด → **MRI ทั้งแนวกระดูกสันหลังทันที + steroid ขนาดสูง + ปรึกษาศัลยกรรมกระดูกและรังสีรักษาฉุกเฉิน**\n- **Pathological fracture** — จำกัดการลงน้ำหนักที่เสี่ยง, พิจารณา bisphosphonate/denosumab ระยะยาว, ปรึกษาศัลยกรรมกระดูก, ควบคุมความปวดอย่างเหมาะสม (**หลีกเลี่ยง NSAID ในผู้ป่วยไตวาย**)\n- **Myeloma kidney ที่แย่ลง** — ให้สารน้ำเพียงพอ, **หลีกเลี่ยง NSAID และ contrast**, รักษามะเร็งอย่างรวดเร็วเพื่อลด light chain, ปรับขนาดยาทุกตัวตาม renal function, พิจารณาการบำบัดทดแทนไตตามข้อบ่งชี้\n- **Hypercalcaemia ที่กลับเป็นซ้ำ** — ติดตาม Ca อย่างใกล้ชิดและให้ antiresorptive agent ต่อเนื่อง\n- **การติดเชื้อ** — myeloma ทำให้ **humoral immunity บกพร่อง** → เสี่ยง **encapsulated organism (pneumococcus, Haemophilus)**; ให้วัคซีนและเฝ้าระวังอย่างใกล้ชิด (การติดเชื้อเป็นสาเหตุการตายอันดับต้นของ myeloma)\n- **Hyperviscosity syndrome** — ปวดศีรษะ ตามัว เลือดออกตามเยื่อเมือก สับสน (พบมากใน IgA/IgM สูง) → ต้องทำ **plasmapheresis**\n- **Anaemia** — ประเมินและรักษา (เหล็ก, B12/folate, ESA ตามข้อบ่งชี้)\n- **Tumour lysis syndrome** เมื่อเริ่มการรักษา — ให้สารน้ำ, allopurinol และติดตาม K/PO4/Ca/uric acid\n- **Venous thromboembolism** — ความเสี่ยงสูงขึ้นมากถ้าใช้ **immunomodulatory drug (thalidomide/lenalidomide) ร่วมกับ steroid** → ต้องให้ thromboprophylaxis"}], "ref": ["MED32 MEQ ข้อ 2 – Symptomatic hypercalcemia from malignancy with acute kidney injury: 2.4 แปลผลแลปที่ผิดปกติ (anemia, mild hyponatremia, hypokalemia, hypercalcemia) 2.5 definitive diagnosis 2.6 ให้การรักษาภาวะ hypercalcemia 2.7 normal saline ช่วยลด hypercalcemia อย่างไร", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 94 – หญิงแก่ 77 ปี ปวดหลังมาก Hypercalcium ให้อาการ CRAB → Multiple myeloma", "MED30 MCQ ข้อ 38 – Ca สูง มี sign ของ MM (CRAB – Hypercalcemia, Renal failure, Anemia, Osteolytic bone lesion)", "MED34 MCQ ครั้งที่ 4 ข้อ 34 – ให้รูป PBS Rouleaux formation + back pain → multiple myeloma", "MED31 MCQ ข้อ 21 – ปวดหลัง PBS มี RBC เกาะติดกันยาวๆ → multiple myeloma", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia", "MED31 past paper – ผู้ป่วยอายุ 70 ปี ตรวจสุขภาพพบ Ca 11, PO4 1.1 (choices รวม Malignancy, Familial hypocalciuric hypercalcemia)"], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.2"], "_kind": "meq", "_set": "nephro"}], "osce": [], "date": "พฤ. 17 ก.ย."}], "label": "Nephro", "thai": "ระบบไตและสมดุลเกลือแร่", "accent": {"light": "#14585f", "soft": "#e4eef0", "ink": "#0f464b", "dark": "#58b3b8", "darkSoft": "#10262a", "darkInk": "#8ad2d6"}}, {"set": "neuro", "title": "Neuro · ระบบประสาท", "intro": "เริ่มจากคาบ acute ischemic stroke ของงานประสาทวิทยา รพ.ราชวิถี — ไล่ตั้งแต่การแปลอาการกลับเป็นตำแหน่งหลอดเลือด ไปจนถึงการตัดสินใจให้ยาละลายลิ่มเลือดภายในหน้าต่างเวลา เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับแนวทาง AHA/ASA ที่อาจารย์อ้างอิงไว้ จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบแล้วไปฝึก **MEQ** และ **OSCE/SAQ** ต่อได้เลย\n\n**ลำดับที่แนะนำ** — หัวข้อ 2 (core กับ penumbra) คือแนวคิดที่อธิบายทุกอย่างที่เหลือ เพราะการรักษาเฉียบพลันทั้งหมดมีเป้าหมายเดียวคือกอบกู้ penumbra ก่อนมันจะกลายเป็น core · จากนั้นหัวข้อ 3−6 คือการวินิจฉัย (ตำแหน่งและกลไก) และหัวข้อ 7−10 คือการรักษาเรียงตามเวลา\n\n**หมายเหตุ** — ชุด Neuro เพิ่งเริ่ม ข้อสอบในคลังยังเป็นข้อที่เขียนใหม่จากสไลด์เท่านั้น ยังไม่มีคลังข้อสอบเก่า MED28–MED35 ของระบบนี้ และคาบอื่นของ Neuro ยังไม่ได้ทำ", "lectures": [{"lec": "07", "title": "Acute ischemic stroke — pathophysiology and management", "subtitle": "ชนิดและสัดส่วน · core กับ penumbra · กลุ่มอาการตามหลอดเลือด · OCSP และ TOAST · BEFAST · NIHSS · CT และ ASPECTS · ยาละลายลิ่มเลือดและการลากลิ่มเลือด", "objectives": ["อธิบายแนวคิด **ischemic core กับ penumbra** และเชื่อมโยงกับเหตุผลของคำว่า **time is brain** ได้", "แปลอาการทางคลินิกกลับเป็น **ตำแหน่งและซีกของรอยโรค** ได้ ทั้ง **MCA ซ้าย/ขวา · ก้านสมอง · lacunar**", "จำแนก stroke ด้วย **OCSP (TACI, PACI, LACI, POCI)** จากอาการข้างเตียงโดยไม่ต้องรอภาพถ่าย", "จำแนกกลไกด้วย **TOAST** และเลือก **การป้องกันการเป็นซ้ำ** ให้ตรงกับกลไกได้", "ใช้ **BEFAST** และเกณฑ์คัดกรอง **LVO** และตัด **ภาวะที่เลียนแบบ stroke** โดยเฉพาะ **น้ำตาลต่ำ** ออกได้", "ระบุ **เวลาเริ่มอาการด้วย last seen well** และบอกได้ว่าผู้ป่วยอยู่ในหน้าต่างเวลาใด", "ประเมินความรุนแรงด้วย **NIHSS** และรู้ว่าการเพิ่มขึ้น 2 คะแนนหมายถึงอะไร", "อ่าน **สัญญาณ early ischemic change** บน CT และคิด **ASPECTS** ได้", "ตัดสินใจเรื่อง **IV rtPA** ได้ครบทั้งข้อบ่งชี้ ข้อห้ามเด็ดขาดและสัมพัทธ์ ขนาดยา การคุมความดัน และการเฝ้าระวัง", "ระบุผู้ป่วยที่ควรส่ง **mechanical thrombectomy** และวางแผน **การดูแลทั่วไปและการป้องกันการเป็นซ้ำ** ได้"], "sections": [{"id": "neuro-07-01", "title": "นิยาม ชนิด และสัดส่วนของโรคหลอดเลือดสมอง", "minutes": 7, "summary": "ตัวเลขที่ต้องจำก่อนอย่างอื่น และเหตุผลที่ต้องส่ง CT ทุกราย", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.3.6"], "md": "### นิยามของ ischemic stroke ตามสไลด์\n> **ความบกพร่องทางระบบประสาทที่เกิดขึ้นทันทีทันใด จากการตีบหรืออุดตันของหลอดเลือด**\n> **อาการและอาการแสดงคงอยู่ไม่น้อยกว่า 24 ชั่วโมง**\n> **อาการสัมพันธ์กับเขตที่หลอดเลือดนั้นเลี้ยง (vascular territory)**\n\n**สามข้อนี้ใช้งานได้จริงอย่างไร**\n- **\"ทันทีทันใด\"** — โรคที่ค่อยเป็นค่อยไปเป็นสัปดาห์ให้คิดถึงเนื้องอกหรือการติดเชื้อ\n- **\"ไม่น้อยกว่า 24 ชั่วโมง\"** — ถ้าอาการหายสนิทภายใน 24 ชั่วโมงเรียกว่า **TIA** ซึ่ง **ไม่ใช่เรื่องเล็ก** แต่เป็นสัญญาณเตือนว่า stroke จริงกำลังจะตามมา\n- **\"สัมพันธ์กับเขตหลอดเลือด\"** — ข้อนี้คือกุญแจของการวินิจฉัย **ถ้าอาการกระจายไม่เข้ากับเขตหลอดเลือดใดเลย ให้สงสัยภาวะอื่นที่เลียนแบบ stroke**\n\n### สัดส่วนที่ต้องจำ\n\n| ชนิด | สัดส่วน |\n|---|---|\n| **Ischemic stroke (ขาดเลือด)** | **85%** |\n| **Hemorrhagic stroke (เลือดออก)** | **15%** — แบ่งเป็นเลือดออกในเนื้อสมอง และ **เลือดออกใต้เยื่อหุ้มสมอง (subarachnoid) ราว 15% ของกลุ่มเลือดออก** |\n\n**แล้วในกลุ่มขาดเลือด 85% นั้น แบ่งตามสาเหตุได้อีก**\n\n| สาเหตุ | สัดส่วน |\n|---|---|\n| **Small vessel disease (lacunar)** | **25%** |\n| **Large artery atherosclerosis** | **20%** |\n| **Cardioembolism** | **20%** |\n| **Other determined etiology** | **5%** |\n| **Undetermined etiology** | **30%** |\n\n> **สองข้อที่ต้องสังเกตจากตารางนี้**\n> **1. กลุ่มที่ใหญ่ที่สุดคือ \"หาสาเหตุไม่ได้\" ถึง 30%** — สะท้อนว่าการสืบค้นหาสาเหตุต้องทำอย่างเป็นระบบและบางครั้งก็ยังไม่พบ\n> **2. สามสาเหตุหลักรวมกันราว 65%** และแต่ละอันมี **การป้องกันการเป็นซ้ำที่ต่างกันสิ้นเชิง** จึงเป็นเหตุผลที่ต้องจำแนกให้ได้\n\n### ทำไมต้องส่ง CT สมองทุกราย\n> **การขาดเลือดกับเลือดออก แยกจากกันด้วยอาการทางคลินิกไม่ได้** — ทั้งคู่มาด้วยอาการเฉพาะที่ที่เกิดทันทีทันใดเหมือนกัน แต่ **การรักษาตรงข้ามกันโดยสิ้นเชิง** (ขาดเลือดต้องละลายลิ่มเลือด ส่วนเลือดออกห้ามเด็ดขาด)\n> สไลด์จึงระบุบทบาทแรกของ CT ไว้สั้น ๆ ว่า **\"R/O Bleed\"**\n\n*(ลักษณะที่เอนไปทางเลือดออก เช่น ปวดศีรษะรุนแรงทันที อาเจียน ระดับความรู้สึกตัวลดลงเร็ว และความดันสูงมาก ช่วยเพิ่มความน่าจะเป็นได้ แต่ **ไม่เพียงพอที่จะตัดสินใจโดยไม่มีภาพถ่าย**)*\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์วางโครงทั้งคาบไว้สองส่วนคือ **Stroke awareness** และ **Acute management** แล้วเปิดด้วย **เคสตัวอย่างสามเคส** ก่อนสอนเนื้อหา เพื่อให้ผู้เรียนลองคิดเองก่อน\n- สไลด์ย้ำนิยามข้อที่สามว่า **อาการต้องสัมพันธ์กับเขตหลอดเลือด** และตั้งหัวข้อถัดมาว่า **\"Clinical neurovascular syndrome\"** ซึ่งเป็นแกนของการวินิจฉัยตำแหน่ง\n", "pearls": ["Ischemic 85% · hemorrhagic 15% — และแยกจากกันด้วยอาการไม่ได้ ต้องส่ง CT ทุกราย", "ในกลุ่มขาดเลือด: lacunar 25% · หลอดเลือดใหญ่แข็ง 20% · จากหัวใจ 20% · หาสาเหตุไม่ได้ 30%", "อาการที่ไม่เข้ากับเขตหลอดเลือดใดเลย ให้สงสัยภาวะที่เลียนแบบ stroke", "อาการหายสนิทใน 24 ชั่วโมง = TIA ซึ่งเป็นสัญญาณเตือนว่า stroke จริงกำลังจะตามมา"], "items": [{"id": "NEURO-07-01-Q1", "kind": "own", "stem": "A 58-year-old man has sudden right-sided weakness. Which of the following statements about distinguishing ischaemic from haemorrhagic stroke is correct?", "choices": ["Ischaemic stroke can be excluded if the deficit is maximal at onset", "Blood pressure above 200/120 mmHg is diagnostic of haemorrhagic stroke", "Severe headache at onset reliably excludes ischaemic stroke", "They cannot be reliably distinguished clinically, so non-contrast computed tomography is required in every patient", "A normal level of consciousness reliably excludes haemorrhagic stroke"], "answer": 3, "explain": "**หลักการ** — ทั้งการขาดเลือดและเลือดออกในสมองทำให้เกิด **ความบกพร่องทางระบบประสาทเฉพาะที่ที่เกิดทันทีทันใด** เหมือนกัน เพราะผลลัพธ์สุดท้ายคือเนื้อสมองบริเวณนั้นทำงานไม่ได้เหมือนกัน แต่ **การรักษาตรงข้ามกันโดยสิ้นเชิง** — ขาดเลือดต้องรีบเปิดหลอดเลือด ส่วนเลือดออก **ยาละลายลิ่มเลือดเป็นข้อห้ามเด็ดขาด** สไลด์จึงระบุบทบาทแรกของ CT ในระยะเฉียบพลันว่า **\"R/O Bleed\"**\n\n**ทำไมตัวลวงจึงผิด**\n- *ปวดศีรษะรุนแรงตัด ischemic ออกได้* — ปวดศีรษะ **พบบ่อยกว่าในเลือดออกก็จริง แต่เกิดใน ischemic stroke ได้เช่นกัน** โดยเฉพาะ stroke ของระบบไหลเวียนด้านหลังและกรณีหลอดเลือดฉีกขาด จึงเป็นเพียงข้อมูลเชิงความน่าจะเป็น\n- *รู้สึกตัวดีตัดเลือดออกได้* — **เลือดออกปริมาณน้อยในตำแหน่งที่ไม่กดก้านสมอง ผู้ป่วยอาจรู้สึกตัวดีทุกประการ**\n- *ความดันสูงมากวินิจฉัยเลือดออกได้* — ความดันสูงเฉียบพลัน **พบได้ในทั้งสองภาวะ** เพราะเป็นการตอบสนองของร่างกายเพื่อรักษาการไหลเวียนของสมอง จึงไม่จำเพาะ\n- *อาการรุนแรงที่สุดตั้งแต่แรกตัด ischemic ออกได้* — กลับกัน **การที่อาการรุนแรงที่สุดตั้งแต่วินาทีแรกเป็นลักษณะของ stroke จากลิ่มเลือดที่หลุดมาจากหัวใจ** ซึ่งเป็น ischemic stroke", "pearl": "ไม่มีอาการใดแยกขาดเลือดออกจากเลือดออกได้ — CT ก่อนตัดสินใจรักษาเสมอ", "topic": "นิยาม ชนิด และสัดส่วนของโรคหลอดเลือดสมอง", "src": "", "ref": [], "nl": ["2.3.9-3(3)", "3.3.20"]}]}, {"id": "neuro-07-02", "title": "หลอดเลือดสมองและแนวคิด core กับ penumbra", "minutes": 8, "summary": "เหตุผลทั้งหมดที่ทำให้ stroke เป็นภาวะที่ต้องแข่งกับเวลา", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.6", "2.3.9-3(3)"], "md": "### กายวิภาคที่ต้องรู้เท่าที่ใช้จริง\n**เลือดเข้าสู่สมองสองระบบ**\n- **ระบบด้านหน้า (anterior circulation)** — จาก **internal carotid artery** แตกเป็น **ACA และ MCA**\n- **ระบบด้านหลัง (posterior circulation)** — จาก **vertebral artery** สองข้างรวมกันเป็น **basilar artery** แล้วแตกเป็น **PCA** เลี้ยงก้านสมอง สมองน้อย และสมองกลีบท้ายทอย\n- ทั้งสองระบบเชื่อมกันที่ **Circle of Willis** ซึ่งเป็นทางเบี่ยงสำรองเวลามีการอุดตัน\n\n**หลักที่ทำให้แปลอาการเป็นตำแหน่งได้ — homunculus**\n> **เปลือกสมองแต่ละส่วนควบคุมการเคลื่อนไหวและความรู้สึกของร่างกาย \"ด้านตรงข้าม\" อย่างจำเพาะเจาะจง**\n> และการเรียงตัวของ homunculus ทำให้ **ACA เลี้ยงส่วนที่ควบคุมขา ส่วน MCA เลี้ยงส่วนที่ควบคุมใบหน้าและแขน** — จึงเป็นเหตุผลว่าทำไม **MCA จึงทำให้แขนอ่อนแรงมากกว่าขา และ ACA กลับกัน**\n\n**แขนงส่วนลึกที่สำคัญ** — ทั้ง ACA, MCA และ PCA ต่างแตกแขนงเล็ก ๆ ลงไปเลี้ยงเนื้อสมองส่วนลึก คือ **caudate, putamen, globus pallidus, thalamus และ internal capsule** แขนงเหล่านี้เองที่เป็นที่เกิดของ **lacunar infarction**\n\n### แนวคิดที่สำคัญที่สุดของทั้งคาบ — core กับ penumbra\nเมื่อหลอดเลือดถูกอุด เลือดที่ไปเลี้ยงจะลดลงไม่เท่ากันทั่วบริเวณ เกิดเป็นวงซ้อนกันสามชั้น\n\n| ชั้น | เลือดที่ไปเลี้ยง | ชะตากรรม |\n|---|---|---|\n| **Ischemic core** | **ต่ำที่สุด** | **เซลล์ตายไปแล้ว กู้คืนไม่ได้** |\n| **Penumbra** | **ลดลงแต่ยังพอมี** จากหลอดเลือดข้างเคียง (collateral) | **เซลล์ยังไม่ตาย หยุดทำงานชั่วคราว — กู้คืนได้ถ้าเปิดหลอดเลือดทัน** |\n| **Oligaemia** | ลดลงเล็กน้อย | มักรอดได้เอง |\n\n> **นี่คือเหตุผลทั้งหมดของคำว่า \"time is brain\"** — เป้าหมายของการรักษาเฉียบพลันทุกอย่าง ไม่ว่าจะเป็นยาละลายลิ่มเลือดหรือการลากลิ่มเลือดออกด้วยสายสวน คือ **การกอบกู้ penumbra ก่อนที่มันจะกลายเป็น core**\n> **ยิ่งเวลาผ่านไป penumbra จะหดลงและ core จะขยายขึ้นเรื่อย ๆ** จนถึงจุดที่การเปิดหลอดเลือดไม่เหลือประโยชน์และมีแต่ความเสี่ยงเลือดออก\n\n**ทำไมบางคนจึงทนได้นานกว่าคนอื่น** — ขึ้นกับ **หลอดเลือดข้างเคียง (collateral circulation)** ที่แต่ละคนมีไม่เท่ากัน คนที่มี collateral ดีจะมี penumbra ใหญ่และอยู่ได้นานกว่า สไลด์แสดงภาพ **CTA แบบหลายช่วงเวลา (multiphase) ที่เห็น collateral** และ **DSA ระยะท้ายที่เห็นเลือดไหลย้อนเข้ามาเลี้ยงแขนงของสมองซีกขวาผ่านทางเบี่ยง** ซึ่งเป็นเหตุผลที่ปัจจุบันการคัดเลือกผู้ป่วยในหน้าต่างเวลากว้าง ๆ ใช้ภาพถ่ายมากกว่าใช้นาฬิกาอย่างเดียว\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดงภาพ **Circle of Willis และหลอดเลือดที่คอ** พร้อมแผนภาพเขตที่ **ACA, MCA, PCA และแขนงส่วนลึก** แต่ละเส้นเลี้ยง เพื่อให้แปลอาการกลับเป็นตำแหน่งได้\n- สไลด์แสดงแผนภาพ **core, penumbra และ oligaemia เป็นวงซ้อนกัน** พร้อมคำว่า **\"with neuroprotection\"** เพื่อชี้ว่าเป้าหมายคือการรักษาชั้นกลางไว้\n- สไลด์ให้ความสำคัญกับ **collateral circulation** ถึงขั้นแสดงภาพ CTA หลายช่วงเวลาและ DSA เปรียบเทียบ\n", "pearls": ["MCA เลี้ยงส่วนที่ควบคุมใบหน้าและแขน · ACA เลี้ยงส่วนที่ควบคุมขา — จึงแยกกันด้วยว่าแขนหรือขาอ่อนแรงมากกว่า", "Core = ตายแล้วกู้ไม่ได้ · penumbra = ยังไม่ตาย กู้ได้ถ้าเปิดหลอดเลือดทัน", "เวลาผ่านไป penumbra หดและ core ขยาย — นี่คือความหมายของ time is brain", "Collateral circulation ที่ดีทำให้ penumbra ใหญ่และอยู่ได้นานกว่า จึงคัดผู้ป่วยด้วยภาพถ่าย ไม่ใช่นาฬิกาอย่างเดียว"], "items": [{"id": "NEURO-07-02-Q1", "kind": "own", "stem": "In acute ischaemic stroke, which statement best describes the ischaemic penumbra?", "choices": ["The region supplied by collateral vessels that never becomes ischaemic", "Irreversibly infarcted tissue at the centre of the lesion", "Hypoperfused but still viable tissue that can recover if blood flow is restored in time", "Oedematous tissue that always progresses to haemorrhagic transformation", "Tissue with normal perfusion surrounding the infarct"], "answer": 2, "explain": "**ไล่กลไก** — เมื่อหลอดเลือดถูกอุด เลือดที่ไปเลี้ยงลดลงไม่เท่ากันทั่วบริเวณ ตรงกลางที่ไกลจากหลอดเลือดข้างเคียงที่สุดจะขาดเลือดรุนแรงที่สุดและ **เซลล์ตายภายในไม่กี่นาที เรียกว่า core** ส่วนรอบนอกยังได้เลือดจาก **หลอดเลือดข้างเคียง (collateral)** พอประทังไว้ ปริมาณเลือดตรงนั้น **ต่ำกว่าระดับที่เซลล์จะทำงานได้ แต่ยังสูงกว่าระดับที่เซลล์จะตาย** เซลล์จึง **หยุดทำงานแต่ยังไม่ตาย** — นี่คือ **penumbra** และเป็นที่มาของอาการทางคลินิกส่วนใหญ่ที่ยังกลับคืนได้\n\n**ความหมายทางคลินิก** — penumbra คือ **เป้าหมายเดียวของการรักษาเฉียบพลันทั้งหมด** และมันจะ **ค่อย ๆ ถูกกลืนกลายเป็น core ตามเวลาที่ผ่านไป** จึงเป็นเหตุผลของคำว่า **time is brain** และของหน้าต่างเวลาที่เข้มงวด\n\n**ทำไมตัวลวงจึงผิด**\n- *เนื้อตายถาวรตรงกลาง* — นั่นคือนิยามของ **core** ไม่ใช่ penumbra\n- *เนื้อเยื่อที่เลือดไปเลี้ยงปกติ* — ถ้าเลือดไปเลี้ยงปกติก็ไม่ใช่บริเวณที่ขาดเลือด และไม่ใช่เป้าหมายของการรักษา\n- *บวมน้ำและกลายเป็นเลือดออกเสมอ* — **เลือดออกแทรกเป็นภาวะแทรกซ้อนที่เกิดในบางราย ไม่ใช่ชะตากรรมที่แน่นอน** และไม่ใช่นิยามของ penumbra\n- *บริเวณที่ไม่เคยขาดเลือดเลย* — ขัดกับนิยาม penumbra **ขาดเลือดจริงแต่ยังไม่ถึงขั้นตาย**", "pearl": "Penumbra = ขาดเลือดแต่ยังไม่ตาย กู้ได้ถ้าเปิดหลอดเลือดทัน — เป็นเป้าหมายเดียวของการรักษาเฉียบพลัน", "topic": "หลอดเลือดสมองและแนวคิด core กับ penumbra", "src": "", "ref": [], "nl": ["2.3.9-3(3)", "2.3.6"]}]}, {"id": "neuro-07-03", "title": "กลุ่มอาการตามหลอดเลือด — แปลอาการกลับเป็นตำแหน่ง", "minutes": 11, "summary": "สี่ภาพจำที่ตอบได้ทั้งตำแหน่งและซีก", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.3.6", "2.1.22"], "md": "### 1. MCA infarction — ซีกซ้ายกับซีกขวาต่างกันที่อะไร\n\n| | **MCA ซ้าย (ซีกเด่น)** | **MCA ขวา (ซีกไม่เด่น)** |\n|---|---|---|\n| **สมองระดับสูง** | **Aphasia** — พูดไม่ได้ ฟังไม่เข้าใจ หรือทั้งสองอย่าง | **Neglect หรือ extinction** — ไม่สนใจร่างกายและสิ่งแวดล้อมด้านซ้าย |\n| **กำลังและความรู้สึก** | **อ่อนแรงและชาซีกขวา** | **อ่อนแรงและชาซีกซ้าย** |\n| **ลานสายตา** | **Right homonymous hemianopsia** | **Left homonymous hemianopsia** |\n| **การกลอกตา** | **ตาเบนไปทางซ้าย** | **ตาเบนไปทางขวา** |\n\n> **กฎของ gaze preference ที่ตอบได้ทุกข้อ — ตามองไปทางเดียวกับรอยโรค และมองหนีจากด้านที่อ่อนแรง**\n> **กลไก** — frontal eye field ของแต่ละซีกดันตาไปด้านตรงข้าม เมื่อซีกหนึ่งเสีย อีกซีกจึงดันตาไปทางซีกที่เสียโดยไม่มีคู่ต้าน\n\n**และจำ homunculus ไว้** — **MCA ทำให้แขนและใบหน้าอ่อนแรงมากกว่าขา** ส่วน **ACA ทำให้ขาอ่อนแรงมากกว่าแขน** (ร่วมกับเฉื่อยชา ไม่ริเริ่ม และกลั้นปัสสาวะไม่ได้)\n\n### 2. Posterior circulation — ก้านสมองและสมองน้อย\nสไลด์ไล่อาการไว้ครบ: **ระดับความรู้สึกตัวเสีย · เดินเซหรือทำงานประสานกันไม่ได้ · เวียนศีรษะบ้านหมุน · เห็นภาพซ้อน · ตากระตุก (nystagmus) · กลืนลำบาก · พูดไม่ชัด**\n\n> **ลายเซ็นของก้านสมองคืออาการที่ \"ไขว้กัน\" — เส้นประสาทสมองเสียข้างเดียวกับรอยโรค ร่วมกับแขนขาอ่อนแรงด้านตรงข้าม**\n> **กลไก** — นิวเคลียสของเส้นประสาทสมองไปเลี้ยงด้านเดียวกัน ส่วนทางเดินสั่งการยังไม่ไขว้ (จะไปไขว้ที่ medulla ส่วนล่าง) จึงไปควบคุมแขนขาด้านตรงข้าม รอยโรคเดียวจึงให้อาการสองข้างคนละแบบ\n\n**กับดักที่พลาดบ่อยที่สุดในเวชปฏิบัติ** — ผู้ป่วยมาด้วย **เวียนศีรษะบ้านหมุน** แล้วถูกวินิจฉัยเป็นโรคหูชั้นใน · **จุดแยกคือ stroke จะมีอาการอื่นของก้านสมองร่วมด้วยเสมอ** เช่น เห็นภาพซ้อน กลืนลำบาก พูดไม่ชัด ชาใบหน้า หรือเดินเซจนลุกไม่ได้\n\n### 3. Lacunar syndrome — โรคหลอดเลือดขนาดเล็ก\n**กลไก** — **ความดันโลหิตสูงเรื้อรังทำให้หลอดเลือดแดงเล็ก ๆ ที่แทงเข้าเนื้อสมอง (penetrating arteries ขนาดราว 100 ไมโครเมตร) มีผนังหนาตัวและมีสาร fibrinoid สะสม** จนรูหลอดเลือดตีบเกือบสนิท — สไลด์แสดงภาพหลอดเลือดที่ **ผนังหนาจนโตขึ้นราวสามเท่าของปกติ** และภาพ **lacune หลายจุดสองข้างใน thalamus, putamen, globus pallidus, caudate และ internal capsule**\n\n**สี่กลุ่มอาการที่สไลด์ระบุว่าพบบ่อย**\n| กลุ่มอาการ | ตำแหน่งที่พบบ่อย |\n|---|---|\n| **Pure motor stroke** | **internal capsule หรือ pons** |\n| **Pure sensory stroke** | **thalamus** |\n| **Ataxia-hemiparesis** | pons หรือ internal capsule |\n| **Clumsy hand dysarthria** | pons |\n\n> **จุดที่ชี้ขาดคือสิ่งที่ \"ไม่มี\" — ไม่มี aphasia ไม่มี neglect ไม่มีลานสายตาผิดปกติ และไม่ซึม** เพราะรอยโรคอยู่ลึกใต้เปลือกสมอง **ถ้ามีอาการเปลือกสมองแม้ข้อเดียว ให้ตัด lacunar ออกทันที**\n>\n> **สไลด์ระบุว่าพยากรณ์โรคของ lacunar stroke ดีมาก (excellent prognosis for recovery)**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยกหน้า **Left MCA infarction** กับ **Right MCA infarction** ออกจากกันชัดเจน โดยวางคู่ **aphasia กับ neglect** เป็นตัวแยกซีก\n- สไลด์ใช้ภาพ **Netter** แสดงพยาธิสภาพของหลอดเลือดขนาดเล็กใน lacunar infarction พร้อมคำบรรยายว่า **รูหลอดเลือดถูกอุดเกือบสนิทจากผนังชั้นกลางที่หนาตัว และมีสาร fibrinoid ติดสีชมพูในผนัง**\n- สไลด์ระบุว่า lacune ใน **base of pons ที่ตัดทางเดิน corticospinal บางส่วน ทำให้เกิดอ่อนแรงซีกแบบไม่รุนแรง**\n", "pearls": ["MCA ซ้าย = aphasia · MCA ขวา = neglect · ที่เหลืออ่อนแรงและลานสายตาเป็นภาพกระจกกัน", "ตามองไปทางเดียวกับรอยโรค และมองหนีจากด้านที่อ่อนแรง", "MCA แขนอ่อนแรงมากกว่าขา · ACA ขาอ่อนแรงมากกว่าแขน", "เส้นประสาทสมองเสียข้างหนึ่ง + แขนขาอ่อนแรงอีกข้าง = ก้านสมอง", "Lacunar วินิจฉัยด้วยสิ่งที่ไม่มี — ไม่มี aphasia neglect ลานสายตาผิดปกติ หรือซึม · พยากรณ์โรคดีมาก"], "items": [{"id": "NEU-MCQ-01", "kind": "mcq", "stem": "A 65-year-old woman is watching television when she suddenly develops right-sided weakness and numbness, and speaks in short broken phrases. She follows simple commands only after repeated prompting. Vital signs: BP 180/100 mmHg, PR 100/min irregularly irregular. Examination shows a grade 3 apical murmur, gaze preference to the left, right upper motor neuron facial weakness, right arm power grade 3 and right leg power grade 4, and an extensor plantar response on the right. Which vascular territory is most likely involved?", "choices": ["Right middle cerebral artery", "Left anterior cerebral artery", "Left posterior cerebral artery", "Basilar artery", "Left middle cerebral artery"], "answer": 4, "explain": "**ไล่กลไก** — เปลือกสมองควบคุมการเคลื่อนไหวและความรู้สึกของร่างกาย **ด้านตรงข้าม** ดังนั้น **อ่อนแรงซีกขวา = รอยโรคซีกซ้าย** และในคนถนัดขวาเกือบทั้งหมด **ซีกซ้ายเป็นซีกเด่น (dominant) ที่ควบคุมภาษา** การที่ผู้ป่วยพูดเป็นวลีสั้น ๆ ขาดตอนแต่ยังพอเข้าใจคำสั่งได้บ้าง จึงเป็น **aphasia จากซีกซ้าย**\n\n**Gaze preference ช่วยยืนยัน** — ศูนย์ควบคุมการกลอกตาที่ frontal eye field ทำให้ตามองไป **ด้านตรงข้ามกับซีกตัวเอง** เมื่อซีกซ้ายเสีย ซีกขวาจึงดึงตาไปทางซ้ายโดยไม่มีคู่ต้าน ผู้ป่วยจึง **มองไปทางซ้าย คือมองไปทางเดียวกับรอยโรค และมองหนีจากด้านที่อ่อนแรง**\n\n**ทำไมจึงเป็น MCA ไม่ใช่เส้นอื่น**\n\n| หลอดเลือด | ลักษณะเด่น |\n|---|---|\n| **MCA** | **แขนและใบหน้าอ่อนแรงมากกว่าขา** · aphasia (ซ้าย) หรือ neglect (ขวา) · hemianopia · gaze preference |\n| **ACA** | **ขาอ่อนแรงมากกว่าแขน** · abulia กลั้นปัสสาวะไม่ได้ |\n| **PCA** | **hemianopia เด่น** โดยกำลังกล้ามเนื้อมักปกติ |\n| **Basilar** | ระดับความรู้สึกตัวเสีย · เส้นประสาทสมองผิดปกติ · อาการสองข้าง |\n\nผู้ป่วยรายนี้ **แขน (grade 3) อ่อนแรงมากกว่าขา (grade 4)** ซึ่งเข้ากับ MCA พอดี\n\n**ทำไมตัวลวงจึงผิด**\n- *MCA ขวา* — ต้องทำให้อ่อนแรงซีกซ้ายและเกิด neglect ไม่ใช่ aphasia\n- *ACA ซ้าย* — ต้องให้ขาอ่อนแรงมากกว่าแขน ซึ่งกลับกับผู้ป่วยรายนี้\n- *PCA ซ้าย* — มักไม่ทำให้อ่อนแรงชัดเจนขนาดนี้\n- *Basilar* — ต้องมีอาการของก้านสมอง เช่น ซึม เห็นภาพซ้อน เดินเซ ซึ่งไม่มี\n\n**เบาะแสของสาเหตุ** — **ชีพจรเต้นไม่สม่ำเสมออย่างสิ้นเชิงร่วมกับเสียงฟู่ที่ยอดหัวใจ** ชี้ไปที่ **atrial fibrillation และลิ่มเลือดหลุดจากหัวใจ (cardioembolic)**", "pearl": "อ่อนแรงซีกขวา + aphasia + ตามองไปทางซ้าย = MCA ซ้าย · ตามองไปทางเดียวกับรอยโรคเสมอ", "topic": "Left MCA syndrome – localisation", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6", "2.1.22"]}, {"id": "NEU-MCQ-03", "kind": "mcq", "stem": "A 68-year-old man with long-standing hypertension and diabetes develops weakness of the left face, arm and leg over a few hours. He is fully alert with normal speech comprehension and expression, no visual field defect, no neglect, and completely normal sensation. Which of the following is the most likely diagnosis and expected outcome?", "choices": ["Lacunar (pure motor) stroke from small vessel disease, with an excellent prognosis for recovery", "Posterior circulation infarct involving the brainstem, with a risk of respiratory failure", "Total anterior circulation infarct from carotid occlusion, with a poor prognosis", "Intracerebral haemorrhage in the basal ganglia, requiring urgent blood pressure lowering", "Cardioembolic cortical infarct, with a high risk of early recurrence"], "answer": 0, "explain": "**ไล่กลไก** — ความดันโลหิตสูงเรื้อรังทำให้ **หลอดเลือดแดงเล็ก ๆ ที่แทงเข้าไปในเนื้อสมอง (penetrating arteries ขนาดราว 100 ไมโครเมตร)** มีผนังหนาตัวขึ้นและมีสาร fibrinoid สะสม จนรูหลอดเลือดตีบเกือบสนิท เกิดเนื้อสมองตายเป็นโพรงเล็ก ๆ เรียกว่า **lacune** ตำแหน่งที่พบบ่อยคือ **internal capsule, pons, thalamus, putamen, globus pallidus, caudate**\n\n**จุดที่ชี้ขาดคือสิ่งที่ 'ไม่มี'** — เพราะรอยโรคอยู่ลึกใต้เปลือกสมอง จึงไม่มีอาการของเปลือกสมองเลย คือ **ไม่มี aphasia ไม่มี neglect ไม่มีลานสายตาผิดปกติ และไม่ซึม** ถ้ามีอาการเหล่านี้แม้ข้อเดียว ให้ตัด lacunar ออกทันที\n\n**กลุ่มอาการ lacunar ที่พบบ่อย 4 แบบตามสไลด์**\n- **Pure motor stroke** (พบบ่อยที่สุด — internal capsule หรือ pons)\n- **Pure sensory stroke** (thalamus)\n- **Ataxia-hemiparesis**\n- **Clumsy hand dysarthria**\n\nผู้ป่วยรายนี้อ่อนแรงใบหน้า แขน และขาเท่ากันทั้งสามส่วน โดยความรู้สึกปกติสนิท = **pure motor stroke**\n\n**สไลด์ระบุว่าพยากรณ์โรคของ lacunar stroke ดีมาก (excellent prognosis for recovery)** เพราะเนื้อสมองที่เสียมีปริมาณน้อย\n\n**ทำไมตัวลวงจึงผิด**\n- *TACI* — ตามนิยาม OCSP ต้องมี **ทั้งความผิดปกติของสมองระดับสูง (เช่น aphasia) ลานสายตาผิดปกติ และอ่อนแรง/ชา** ครบสามอย่าง ผู้ป่วยรายนี้มีแค่อย่างเดียว\n- *Cardioembolic cortical infarct* — ต้องมีอาการของเปลือกสมอง\n- *Posterior circulation* — ต้องมีอาการก้านสมองหรือสมองน้อย เช่น เห็นภาพซ้อน เดินเซ กลืนลำบาก\n- *เลือดออกในสมอง* — แยกจากการขาดเลือดด้วยอาการอย่างเดียวไม่ได้ **ต้องส่ง CT สมองเสมอ** แต่โจทย์ถามถึงการวินิจฉัยที่น่าจะเป็นที่สุดจากภาพทางคลินิกซึ่งเข้ากับ lacunar และ **การลดความดันอย่างรวดเร็วเป็นแนวทางของเลือดออก ไม่ใช่ของสมองขาดเลือด**", "pearl": "อ่อนแรงหน้า แขน ขา เท่ากัน โดยไม่มี aphasia neglect หรือลานสายตาผิดปกติ = pure motor lacunar stroke พยากรณ์โรคดี", "topic": "Lacunar syndrome – pure motor stroke", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.9(4)", "2.1.22"]}, {"id": "NEU-MCQ-04", "kind": "mcq", "stem": "A 58-year-old man develops sudden vertigo, double vision and difficulty swallowing. Examination shows nystagmus, a left sixth nerve palsy, right-sided limb weakness and left-sided limb ataxia. Which of the following best explains this combination of findings?", "choices": ["A right parietal infarct producing sensory neglect", "A large left middle cerebral artery infarct with mass effect", "A left thalamic lacunar infarct", "A brainstem lesion producing ipsilateral cranial nerve signs with contralateral long tract signs", "Bilateral anterior cerebral artery infarction"], "answer": 3, "explain": "**ไล่กลไก — ทำไมจึงเกิดอาการ 'ไขว้กัน'** ก้านสมองเป็นที่ที่ **นิวเคลียสของเส้นประสาทสมองอยู่ติดกับทางเดินประสาทยาว (long tract) ที่วิ่งผ่าน** โดย\n- **เส้นประสาทสมองออกจากก้านสมองแล้วไปเลี้ยงด้านเดียวกัน (ipsilateral)**\n- **ทางเดินสั่งการ (corticospinal tract) ยังไม่ไขว้ จะไปไขว้ที่ medulla ส่วนล่าง จึงไปควบคุมแขนขาด้านตรงข้าม (contralateral)**\n\nรอยโรคเดียวที่ก้านสมองจึงให้ **เส้นประสาทสมองเสียข้างเดียวกับรอยโรค ร่วมกับแขนขาอ่อนแรงด้านตรงข้าม** — ผู้ป่วยรายนี้ **เส้นประสาทคู่ที่ 6 ซ้ายเสีย (รอยโรคอยู่ซ้าย) แขนขาขวาอ่อนแรง (ด้านตรงข้าม) และเดินเซซ้าย (สมองน้อยด้านเดียวกัน)** คือภาพคลาสสิกของ **pontine syndrome**\n\n**สไลด์ระบุอาการของ posterior circulation ไว้ครบ** — ระดับความรู้สึกตัวเสีย · เดินเซหรือทำงานประสานกันไม่ได้ · เวียนศีรษะบ้านหมุน · **เห็นภาพซ้อน** · ตากระตุก · **กลืนลำบาก** · พูดไม่ชัด\n\n> **การมี 'เส้นประสาทสมองเสียข้างหนึ่งพร้อมแขนขาอ่อนแรงอีกข้างหนึ่ง' คือลายเซ็นของก้านสมอง และไม่มีทางเกิดจากรอยโรคในซีกสมองใหญ่**\n\n**ทำไมตัวลวงจึงผิด**\n- *MCA ซ้ายขนาดใหญ่* — ทำให้อ่อนแรงและชาซีกขวาพร้อม aphasia แต่ **ไม่ทำให้เส้นประสาทสมองคู่ที่ 6 เสียและไม่ทำให้เดินเซด้านตรงข้าม**\n- *Thalamic lacune* — ให้ **pure sensory stroke** ไม่ให้เส้นประสาทสมองเสีย\n- *ACA สองข้าง* — ทำให้ขาอ่อนแรงสองข้างและเฉื่อยชา ไม่มีอาการเส้นประสาทสมอง\n- *Parietal ขวา* — ให้ neglect ไม่ให้ภาพซ้อนหรือกลืนลำบาก\n\n**ความสำคัญทางคลินิก** — stroke ของระบบไหลเวียนด้านหลังถูกวินิจฉัยพลาดบ่อยที่สุด เพราะมาด้วย **เวียนศีรษะ** ซึ่งถูกคิดว่าเป็นโรคหูชั้นใน จุดแยกคือ **มีอาการอื่นของก้านสมองร่วมด้วยเสมอ**", "pearl": "เส้นประสาทสมองเสียข้างเดียวกับรอยโรค + แขนขาอ่อนแรงด้านตรงข้าม = ก้านสมอง", "topic": "Posterior circulation stroke – crossed findings", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6", "2.1.4"]}]}, {"id": "neuro-07-04", "title": "OCSP (Oxfordshire) classification", "minutes": 7, "summary": "จำแนกด้วยอาการล้วน ๆ ที่ข้างเตียง โดยไม่ต้องรอภาพถ่าย", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.3.6"], "md": "### ทำไมต้องมีระบบนี้\n**OCSP (Oxford Community Stroke Project) จำแนกด้วยอาการทางคลินิกล้วน ๆ** จึงใช้ได้ **ทันทีที่ข้างเตียงก่อนเห็นภาพถ่าย** และบอก **พยากรณ์โรคและความน่าจะเป็นของการอุดตันหลอดเลือดใหญ่** ได้ดี\n\n### สี่กลุ่ม\n\n| กลุ่ม | เกณฑ์ |\n|---|---|\n| **TACI**<br>Total anterior circulation infarct | **ครบทั้งสามข้อ** — **(1) ความผิดปกติของสมองระดับสูงที่เกิดใหม่** เช่น aphasia · **(2) ลานสายตาผิดปกติแบบ homonymous** · **(3) อ่อนแรงและ/หรือชาด้านเดียวกัน อย่างน้อย 2 ใน 3 ส่วน (ใบหน้า แขน ขา)** |\n| **PACI**<br>Partial anterior circulation infarct | **ได้เพียง 2 ใน 3 ข้อของ TACI** · **หรือมีเฉพาะความผิดปกติของสมองระดับสูงอย่างเดียว** · **หรืออ่อนแรง/ชาที่จำกัดกว่าเกณฑ์ของ LACI เช่นเป็นเฉพาะแขนข้างเดียว** |\n| **LACI**<br>Lacunar infarct | **pure motor · pure sensory · sensorimotor · หรือ ataxic hemiparesis** |\n| **POCI**<br>Posterior circulation infarct | **ข้อใดข้อหนึ่งต่อไปนี้** — **เส้นประสาทสมองข้างเดียวกันเสียร่วมกับอ่อนแรง/ชาด้านตรงข้าม** · **อ่อนแรงและ/หรือชาสองข้าง** · **การกลอกตาประสานกันผิดปกติ** · **สมองน้อยทำงานผิดปกติ** · **ลานสายตาผิดปกติแบบ homonymous เดี่ยว ๆ** |\n\n### วิธีใช้ที่เร็วที่สุด — ไล่สามคำถาม\n> **1. มีอาการของก้านสมองหรือสมองน้อยไหม** → **มี = POCI** (จบ)\n> **2. ไม่มี — แล้วมีอาการของเปลือกสมอง (aphasia, neglect, ลานสายตาผิดปกติ) ไหม** → **ไม่มีเลย = LACI** (จบ)\n> **3. มี — แล้วครบทั้งสามองค์ประกอบไหม** → **ครบ = TACI · ไม่ครบ = PACI**\n\n### ความหมายทางคลินิกของแต่ละกลุ่ม\n| กลุ่ม | สิ่งที่บอก |\n|---|---|\n| **TACI** | **หลอดเลือดใหญ่ส่วนต้นถูกอุด (ICA หรือ MCA ส่วน M1)** — **พยากรณ์โรคแย่ที่สุด** และเป็นกลุ่มที่ **ควรรีบประเมินเพื่อทำ mechanical thrombectomy** |\n| **PACI** | แขนงย่อยของ MCA หรือ ACA — **เสี่ยงต่อการเป็นซ้ำเร็วสูง** |\n| **LACI** | หลอดเลือดขนาดเล็ก — **พยากรณ์โรคระยะสั้นดีที่สุด** แต่สะท้อนโรคหลอดเลือดขนาดเล็กทั่วสมองที่ต้องคุมความดันเข้มงวด |\n| **POCI** | ระบบไหลเวียนด้านหลัง — **วินิจฉัยพลาดบ่อยที่สุด** และการอุดตันของ basilar artery อันตรายถึงชีวิต |\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้เกณฑ์ทั้งสี่กลุ่มไว้เต็มหนึ่งหน้าโดยเขียนละเอียดถึงขั้นระบุว่า PACI รวมกรณี **\"อ่อนแรง/ชาที่จำกัดกว่าที่จัดเป็น LACI เช่นจำกัดอยู่ที่แขนข้างเดียว\"** ซึ่งเป็นรายละเอียดที่มักถูกข้าม\n- สไลด์วาง OCSP ไว้ใน **ขั้นตอนแรกของ step approach** คู่กับ **NIHSS และการแยก LVO/non-LVO และ anterior/posterior circulation** แสดงว่าตั้งใจให้ใช้เป็นเครื่องมือคัดกรองข้างเตียงก่อนส่งภาพถ่าย\n", "pearls": ["TACI = ครบสามข้อ (สมองระดับสูง + ลานสายตา + อ่อนแรง 2 ใน 3 ส่วน) · PACI = ได้ 2 ใน 3", "LACI = ไม่มีอาการเปลือกสมองเลย · POCI = มีอาการก้านสมองหรือสมองน้อย", "ไล่สามคำถาม — ก้านสมองไหม → เปลือกสมองไหม → ครบสามข้อไหม", "TACI บ่งชี้การอุดหลอดเลือดใหญ่ส่วนต้น พยากรณ์โรคแย่สุด และควรรีบประเมินเพื่อลากลิ่มเลือด"], "items": [{"id": "NEU-MCQ-05", "kind": "mcq", "stem": "A 70-year-old woman presents with global aphasia, a right homonymous hemianopia, and dense right-sided weakness affecting the face, arm and leg. According to the Oxford Community Stroke Project (OCSP) classification, which subtype of cerebral infarction does she have?", "choices": ["Partial anterior circulation infarct (PACI)", "Total anterior circulation infarct (TACI)", "Watershed (borderzone) infarct", "Lacunar infarct (LACI)", "Posterior circulation infarct (POCI)"], "answer": 1, "explain": "**หลักของ OCSP** — เป็นการจำแนกด้วย **อาการทางคลินิกล้วน ๆ โดยไม่ต้องรอภาพถ่าย** จึงใช้ได้ทันทีที่ข้างเตียง และบอกพยากรณ์โรคได้ดี\n\n**TACI ต้องมีครบทั้งสามองค์ประกอบ**\n1. **ความผิดปกติของสมองระดับสูงที่เกิดใหม่** เช่น **aphasia** หรือ neglect\n2. **ลานสายตาผิดปกติแบบ homonymous**\n3. **อ่อนแรงและ/หรือชาด้านเดียวกัน อย่างน้อย 2 ใน 3 ส่วน (ใบหน้า แขน ขา)**\n\nผู้ป่วยรายนี้มีครบทั้งสามข้อ = **TACI** ซึ่งแปลว่า **หลอดเลือดใหญ่ต้นทางถูกอุด (MCA ส่วนต้นหรือ ICA)** จึงเป็นกลุ่มที่ **พยากรณ์โรคแย่ที่สุด และเป็นกลุ่มที่ควรได้รับการประเมินเพื่อทำ mechanical thrombectomy มากที่สุด**\n\n**ตารางสรุป OCSP**\n\n| ชนิด | เกณฑ์ |\n|---|---|\n| **TACI** | **ครบทั้ง 3 ข้อ** |\n| **PACI** | **ได้ 2 ใน 3 ข้อของ TACI** · หรือ **มีเฉพาะความผิดปกติของสมองระดับสูงอย่างเดียว** · หรือ **อ่อนแรง/ชาที่จำกัดกว่าเกณฑ์ LACI เช่นเป็นเฉพาะแขนข้างเดียว** |\n| **LACI** | **pure motor · pure sensory · sensorimotor · ataxic hemiparesis** (ไม่มีอาการเปลือกสมอง) |\n| **POCI** | **เส้นประสาทสมองข้างเดียวกันเสียร่วมกับอ่อนแรง/ชาด้านตรงข้าม · อ่อนแรง/ชาสองข้าง · การกลอกตาประสานกันผิดปกติ · สมองน้อยผิดปกติ · ลานสายตาผิดปกติเดี่ยว ๆ** |\n\n**ทำไมตัวลวงจึงผิด**\n- *PACI* — จะใช้ก็ต่อเมื่อได้ไม่ครบสามข้อ แต่รายนี้ครบ\n- *LACI* — ตัดออกทันทีเพราะ **มี aphasia และลานสายตาผิดปกติ** ซึ่งเป็นอาการของเปลือกสมอง\n- *POCI* — ไม่มีอาการก้านสมองหรือสมองน้อย\n- *Watershed infarct* — ไม่ใช่หมวดของ OCSP แต่เป็นกลไก (เกิดตอนความดันตกหรือเสียเลือด) และมักให้อาการอ่อนแรงต้นแขนต้นขาแบบ 'man in a barrel'", "pearl": "TACI = สมองระดับสูงผิดปกติ + ลานสายตาผิดปกติ + อ่อนแรง/ชาอย่างน้อย 2 ใน 3 ส่วน — ครบสามข้อ", "topic": "Oxfordshire (OCSP) classification – TACI", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6"]}]}, {"id": "neuro-07-05", "title": "Stroke awareness — BEFAST, การคัดกรอง LVO และภาวะที่เลียนแบบ stroke", "minutes": 8, "summary": "สองตัวอักษรที่เพิ่มเข้ามา และสี่กลุ่มโรคที่ต้องตัดออกก่อน", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.1.4", "2.2.17"], "md": "### จาก FAST สู่ BEFAST\n**FAST เดิมครอบคลุมเฉพาะระบบไหลเวียนด้านหน้า** จึงพลาด stroke ของระบบไหลเวียนด้านหลังไปมาก **BEFAST จึงเพิ่มสองตัวอักษรเข้ามาข้างหน้า**\n\n| อักษร | ความหมายตามสไลด์ |\n|---|---|\n| **B = Balance** | **เดินเซ ไม่มั่นคง ทรงตัวไม่ได้ เดินโคลงเคลงหรือรู้สึกโคลงเคลง บ้านหมุน** |\n| **E = Eyes** | **การมองเห็นผิดปกติ เช่น ตามองไม่เห็นข้างหนึ่ง ภาพขาดหายไปครึ่งซีก ภาพซ้อน** |\n| **F = Facial weakness** | **อ่อนแรงที่ใบหน้าซีกใดซีกหนึ่ง ดูจากเวลาผู้ป่วยยิ้มแล้วหน้าสองข้างไม่เท่ากัน** |\n| **A = Arm weakness** | **ตรวจว่ามีแขนหรือขาด้านหนึ่งด้านใดอ่อนแรงหรือไม่** |\n| **S = Speech disturbance** | **พูดไม่ชัด พูดไม่ออก หรือไม่เข้าใจภาษา** |\n| **T = Time of onset** | **ระยะเวลาที่เกิดอาการ ให้โทรตามรถพยาบาลฉุกเฉินตั้งแต่ที่พบผู้ป่วยมีอาการ แม้ว่าอาการจะหายไปก็ตาม** |\n\n> **ประโยคสุดท้ายของ T สำคัญที่สุด — แม้อาการจะหายไปแล้วก็ต้องรีบมา** เพราะนั่นคือ **TIA** ซึ่งเป็นสัญญาณเตือนว่า stroke จริงกำลังจะตามมา และช่วงที่เสี่ยงที่สุดคือ **ไม่กี่วันแรก**\n\n**สไลด์ระบุว่าการตระหนักรู้นี้ใช้กับทุกคน** — ประชาชนทั่วไป บุคลากรสาธารณสุข บุคลากรของโรงพยาบาลที่ปฏิบัติงานภายนอกโรงพยาบาล และแพทย์\n\n### การคัดกรองการอุดตันหลอดเลือดใหญ่ (LVO screening)\nสไลด์ให้สามข้อที่ใช้คัดว่าควรส่งตรงไปศูนย์ที่ทำการลากลิ่มเลือดได้\n> **1. ตาเบนไปข้างหนึ่ง หรือลานสายตาผิดปกติ**\n> **2. เรียกชื่อสิ่งของไม่ได้**\n> **3. ไม่สนใจร่างกายด้านซ้าย (neglect)**\n\n**ทำไมสามข้อนี้จึงชี้ไปที่หลอดเลือดใหญ่** — เพราะทั้งหมดเป็น **อาการของเปลือกสมองบริเวณกว้าง** ซึ่งเกิดได้ก็ต่อเมื่อหลอดเลือดต้นทางถูกอุด ไม่ใช่แขนงเล็ก ๆ\n\n### ภาวะที่เลียนแบบ stroke (stroke mimics)\nสไลด์แบ่งไว้สี่กลุ่ม\n| กลุ่ม | ตัวอย่าง |\n|---|---|\n| **อุบัติเหตุ** | เลือดออกใต้เยื่อหุ้มสมองจากการกระแทก |\n| **ก้อนในสมองที่เสียสมดุล** | **เนื้องอก** ที่โตจนมีเลือดออกหรือบวมเฉียบพลัน |\n| **ชักที่มีอาการทางประสาทค้างอยู่** | **Todd's paresis** หลังชัก |\n| **ความผิดปกติทางเมตาบอลิก** | **น้ำตาลผิดปกติ (สูงหรือต่ำ) · โซเดียมต่ำ · ยาและสารเสพติด** |\n\n> **ข้อที่ต้องทำทุกรายและทำได้ใน 30 วินาทีคือ เจาะน้ำตาลปลายนิ้ว** — **ระดับน้ำตาลต่ำเลียนแบบ stroke ได้เหมือนจริงทุกประการ และหายสนิทเมื่อแก้แล้ว** สไลด์กำหนดเกณฑ์ไว้ที่ **POCT glucose < 50 mg% (หรือน้ำตาลที่ยืนยันแล้ว < 60 mg/dL) ให้รักษาด้วย 50% glucose 50 mL เข้าหลอดเลือดดำ**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์อธิบายความหมายของแต่ละตัวอักษรเป็นภาษาไทยอย่างละเอียด ไม่ใช่แค่ให้ตัวย่อ ซึ่งสะท้อนว่าเครื่องมือนี้ออกแบบมาให้สื่อสารกับประชาชนได้จริง\n- สไลด์แยก **VAN** ไว้เป็นอีกเครื่องมือหนึ่งคู่กับ FAST และ BEFAST\n- สไลด์วาง **stroke mimics** ไว้ต่อจาก stroke awareness ทันที เพื่อย้ำว่าการตระหนักรู้ที่ดีต้องมาพร้อมการตัดภาวะอื่นออก ไม่ใช่วินิจฉัย stroke กับทุกคนที่มีอาการเฉพาะที่\n", "pearls": ["BEFAST — B ทรงตัวผิดปกติ และ E การมองเห็นผิดปกติ เพิ่มมาเพื่อจับ stroke ของระบบไหลเวียนด้านหลัง", "อาการหายไปแล้วก็ต้องรีบมา เพราะนั่นคือ TIA และ stroke จริงมักตามมาในไม่กี่วัน", "คัดกรอง LVO ด้วยสามข้อ — ตาเบน/ลานสายตาผิดปกติ · เรียกชื่อสิ่งของไม่ได้ · neglect", "เจาะน้ำตาลปลายนิ้วทุกราย — น้ำตาลต่ำเลียนแบบ stroke ได้เหมือนจริง", "Stroke mimics สี่กลุ่ม — อุบัติเหตุ · ก้อนในสมอง · ชักที่มีอาการค้าง · เมตาบอลิก"], "items": [{"id": "NEU-MCQ-06", "kind": "mcq", "stem": "A 62-year-old man with type 2 diabetes on insulin is found confused with right-sided weakness and slurred speech. Blood pressure is 150/90 mmHg. A point-of-care glucose reading is 38 mg/dL. Which of the following is the most appropriate immediate action?", "choices": ["Lower the blood pressure with intravenous labetalol before imaging", "Give aspirin 300 mg orally and admit for observation", "Perform lumbar puncture to exclude central nervous system infection", "Activate the stroke pathway and take him directly for intravenous thrombolysis", "Give 50 mL of 50% glucose intravenously and reassess the neurological deficit"], "answer": 4, "explain": "**ไล่กลไก** — สมองใช้กลูโคสเป็นเชื้อเพลิงหลักและแทบไม่มีคลังสำรอง เมื่อระดับน้ำตาลต่ำมาก บริเวณที่เคยมีรอยโรคเดิมหรือบริเวณที่เลือดมาเลี้ยงชายขอบจะทำงานเสียก่อน ทำให้เกิด **อาการเฉพาะที่ที่เลียนแบบ stroke ได้เหมือนจริงทุกประการ** และ **หายสนิทเมื่อแก้น้ำตาลแล้ว**\n\n**สไลด์ระบุขั้นตอนก่อนส่งทำภาพถ่ายไว้ชัด**\n- ประเมิน **ABC และสัญญาณชีพ**\n- **ให้ออกซิเจนเมื่อ SpO₂ < 94% และหลีกเลี่ยงการทำให้หายใจเร็วเกิน**\n- **ตรวจระดับน้ำตาลในเลือด** — **น้ำตาลต่ำหมายถึง POCT glucose < 50 mg% (หรือน้ำตาลในเลือดที่ยืนยันแล้ว < 60 mg/dL) ให้รักษาด้วย 50% glucose 50 mL เข้าหลอดเลือดดำ**\n- **งดน้ำงดอาหารทางปาก**\n- **เปิดหลอดเลือดดำด้วยเข็มเบอร์ 18 ให้ 0.9% NaCl**\n- **ส่งเลือดตรวจ CBC, coagulogram, BUN, Cr** และทำ **EKG** ในบางราย\n\n**ทำไมตัวลวงจึงผิด**\n- *เข้าทางด่วน stroke และให้ยาละลายลิ่มเลือดทันที* — **ระดับน้ำตาลต่ำกว่า 50 mg/dL เป็นข้อห้ามสัมพัทธ์ของ rtPA อยู่แล้วตามตารางในสไลด์** และแนวทางระบุให้ **พิจารณา rtPA ก็ต่อเมื่อแก้น้ำตาลแล้วอาการยังคงอยู่** การให้ยาละลายลิ่มเลือดกับคนที่ไม่ได้เป็น stroke คือการรับความเสี่ยงเลือดออกในสมองโดยไม่มีประโยชน์\n- *ให้แอสไพรินแล้วสังเกตอาการ* — ไม่แก้ปัญหาที่เป็นอยู่ และปล่อยให้สมองขาดน้ำตาลต่อจนเสียหายถาวรได้\n- *ลดความดันก่อนทำภาพถ่าย* — ความดัน 150/90 ไม่ได้สูงถึงเกณฑ์ที่ต้องลด และการลดความดันใน stroke เฉียบพลันโดยไม่จำเป็นทำให้เลือดไปเลี้ยงบริเวณ penumbra ลดลง\n- *เจาะหลัง* — ไม่ใช่ลำดับแรก และมีภาวะที่อธิบายอาการได้ครบอยู่ตรงหน้าแล้ว\n\n**ภาวะอื่นที่เลียนแบบ stroke ตามสไลด์** — **อุบัติเหตุ · ก้อนในสมองที่เสียสมดุล (เช่นเนื้องอก) · ชักที่มีอาการทางประสาทค้างอยู่ (Todd's paresis) · ความผิดปกติทางเมตาบอลิก ได้แก่ น้ำตาลผิดปกติ โซเดียมต่ำ และยาหรือสารเสพติด**", "pearl": "เจาะน้ำตาลปลายนิ้วในคนที่สงสัย stroke ทุกราย — น้ำตาลต่ำเลียนแบบ stroke ได้เหมือนจริงและแก้ได้ทันที", "topic": "Stroke mimic – hypoglycaemia", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.2.17", "2.3.9-3(3)", "B9.2.5(2)"]}, {"id": "NEU-MCQ-17", "kind": "mcq", "stem": "A public stroke-awareness campaign uses the mnemonic BEFAST. Which of the following correctly describes what the letters B and E add to the older FAST mnemonic?", "choices": ["B for behaviour change and E for emotional lability, which detect frontal lobe strokes", "B for breathing difficulty and E for ear pain, which identify airway compromise", "B for bleeding risk and E for eligibility, which screen for thrombolysis contraindications", "B for balance problems and E for visual disturbance, which capture posterior circulation strokes missed by FAST", "B for blood pressure and E for electrocardiogram, which are the first two investigations"], "answer": 3, "explain": "**หลักการ** — FAST เดิมครอบคลุมเฉพาะอาการของ **ระบบไหลเวียนด้านหน้า** คือ **F = ใบหน้าเบี้ยว · A = แขนอ่อนแรง · S = พูดผิดปกติ · T = เวลาที่เริ่มอาการ** ทำให้ **stroke ของระบบไหลเวียนด้านหลังถูกมองข้ามบ่อย** เพราะมาด้วยเวียนศีรษะและการมองเห็นผิดปกติ ซึ่งไม่อยู่ในสี่ตัวอักษรเดิม\n\n**สไลด์ให้ความหมายของตัวอักษรไว้ครบ**\n- **B = Balance** — **เดินเซ ไม่มั่นคง ทรงตัวไม่ได้ เดินโคลงเคลงหรือรู้สึกโคลงเคลง บ้านหมุน**\n- **E = Eyes** — **การมองเห็นผิดปกติ เช่น ตามองไม่เห็นข้างหนึ่ง ภาพขาดหายไปครึ่งซีก ภาพซ้อน**\n- **F = Facial weakness or asymmetry** — **ดูจากเวลาผู้ป่วยยิ้มแล้วหน้าสองข้างไม่เท่ากัน**\n- **A = Arm weakness** — **ตรวจว่ามีแขนหรือขาด้านหนึ่งด้านใดอ่อนแรงหรือไม่**\n- **S = Speech disturbance** — **พูดไม่ชัด พูดไม่ออก หรือไม่เข้าใจภาษา**\n- **T = Time of onset** — **ระยะเวลาที่เกิดอาการ ให้โทรตามรถพยาบาลฉุกเฉินตั้งแต่ที่พบผู้ป่วยมีอาการ แม้ว่าอาการจะหายไปก็ตาม**\n\n> **ประโยคสุดท้ายสำคัญมาก — แม้อาการจะหายไปแล้วก็ต้องรีบมาโรงพยาบาล** เพราะนั่นคือ **TIA** ซึ่งเป็นสัญญาณเตือนว่า stroke จริงกำลังจะตามมา และช่วงที่เสี่ยงที่สุดคือไม่กี่วันแรก\n\n**สไลด์ยังระบุเครื่องมือคัดกรอง LVO** — **ตาเบนไปข้างหนึ่งหรือลานสายตาผิดปกติ · เรียกชื่อสิ่งของไม่ได้ · ไม่สนใจร่างกายด้านซ้าย** ซึ่งใช้คัดผู้ป่วยที่ควรส่งตรงไปศูนย์ที่ทำการลากลิ่มเลือดได้\n\n**ทำไมตัวลวงจึงผิด** — อีกสี่ตัวเลือกเป็นคำที่แต่งขึ้นให้ตัวอักษรตรงกัน แต่ **ไม่ใช่ความหมายที่ใช้จริง** และไม่ได้แก้ปัญหาที่ BEFAST ถูกสร้างขึ้นมาแก้ คือการมองข้าม stroke ของระบบไหลเวียนด้านหลัง\n\n**สไลด์ระบุว่าการตระหนักรู้นี้ใช้ได้กับทั้งประชาชนทั่วไป บุคลากรสาธารณสุข บุคลากรของโรงพยาบาลที่ปฏิบัติงานภายนอกโรงพยาบาล และแพทย์**", "pearl": "BEFAST — B คือทรงตัวผิดปกติ E คือการมองเห็นผิดปกติ เพิ่มเข้ามาเพื่อจับ stroke ของระบบไหลเวียนด้านหลัง", "topic": "Stroke awareness – BEFAST", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.1.4", "2.3.6"]}, {"id": "NEU-MCQ-19", "kind": "mcq", "stem": "A 68-year-old man with hypertension had 20 minutes of right arm weakness and slurred speech yesterday, which resolved completely. He is now neurologically normal. Which of the following is the most appropriate management?", "choices": ["Urgent evaluation and start of secondary prevention now, because the risk of completed stroke is highest in the first few days", "Repeat brain computed tomography in 3 months and treat only if an infarct appears", "Admit for intravenous alteplase even though symptoms have resolved", "Reassure him and arrange an outpatient appointment in 6 weeks, since the deficit has resolved", "Start anticoagulation empirically without investigating the mechanism"], "answer": 0, "explain": "**ไล่กลไก** — TIA คือการอุดตันชั่วคราวที่เปิดออกเองก่อนเนื้อสมองจะตาย **กลไกที่ทำให้เกิดยังอยู่ครบ** ไม่ว่าจะเป็นคราบไขมันที่มีลิ่มเลือดเกาะ หรือลิ่มเลือดจากหัวใจ ดังนั้นสิ่งเดียวที่ต่างจาก stroke คือ **โชค** ไม่ใช่ความรุนแรงของโรค\n\n> **ความเสี่ยงต่อ stroke สมบูรณ์สูงที่สุดใน 48 ชั่วโมงถึงไม่กี่วันแรก** สไลด์จึงเน้นในหัวข้อ **T = Time of onset** ว่า **\"ให้โทรตามรถพยาบาลฉุกเฉินตั้งแต่ที่พบผู้ป่วยมีอาการ แม้ว่าอาการจะหายไปก็ตาม\"**\n\n**สิ่งที่ต้องทำทันที** — **ภาพถ่ายสมองและหลอดเลือด (CTA หรืออัลตราซาวด์ carotid) · ECG และติดตามจังหวะการเต้นเพื่อหา AF · เจาะไขมันและน้ำตาล** แล้ว **เริ่มยาต้านเกล็ดเลือดและ s
