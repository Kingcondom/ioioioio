tatin ทันที** พร้อมคุมความดัน · ถ้าพบ **AF ให้ยาต้านการแข็งตัวของเลือด** · ถ้าพบ **carotid ตีบมากและมีอาการ ให้พิจารณาผ่าตัดภายในไม่กี่วัน**\n\n**ทำไมตัวลวงจึงผิด**\n- *นัด 6 สัปดาห์* — เป็นความผิดพลาดที่คลาสสิกที่สุด ผู้ป่วยจำนวนมากเกิด stroke จริงก่อนถึงวันนัด\n- *ให้ alteplase ทั้งที่อาการหายแล้ว* — **อาการที่หายสนิทเป็นข้อห้ามสัมพัทธ์** (อาการเล็กน้อยไม่ก่อความพิการหรือกำลังดีขึ้นเร็ว) และไม่มีอะไรให้รักษาแล้ว มีแต่ความเสี่ยงเลือดออก\n- *ให้ยาต้านการแข็งตัวของเลือดโดยไม่หากลไก* — การป้องกันต้องตรงกับกลไกตาม TOAST การให้ยาผิดกลุ่มทั้งไม่ได้ผลและเสี่ยงเลือดออก\n- *รอ 3 เดือนแล้วค่อยรักษา* — ปล่อยให้ผู้ป่วยผ่านช่วงที่เสี่ยงที่สุดโดยไม่มีการป้องกันใด ๆ", "pearl": "TIA คือ stroke ที่ยังไม่เกิด — เสี่ยงสูงสุดในไม่กี่วันแรก ต้องสืบค้นและเริ่มป้องกันทันที ไม่ใช่นัดทีหลัง", "topic": "TIA – urgency of evaluation", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6"]}]}, {"id": "neuro-07-06", "title": "TOAST classification — รู้กลไกเพื่อเลือกการป้องกัน", "minutes": 9, "summary": "ห้ากลุ่ม และเหตุผลว่าทำไมต้องแยกให้ได้ก่อนเลือกยา", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.3.9(1)", "2.3.9(3)"], "md": "### ห้ากลุ่มตาม TOAST\n**Large artery atherosclerosis · Cardioembolism · Small vessel disease · Stroke of other determined etiology · Stroke of undetermined etiology**\n\n> **จุดประสงค์ของการจำแนกนี้ไม่ใช่การตั้งชื่อ แต่คือ \"การเลือกวิธีป้องกันการเป็นซ้ำ\"** — สไลด์จึงวาง TOAST ไว้ในขั้นตอนสุดท้ายของ step approach คู่กับคำว่า **Prevention**\n\n### 1. Large artery atherosclerosis (LAA)\n**กลไกตามที่สไลด์ไล่ไว้เป็นขั้น**\n> **คราบไขมันที่จุดแยกของหลอดเลือด → ผิวชั้นในฉีกขาดเป็นแผล (ulcer) → เกล็ดเลือดและไฟบรินมาเกาะบนผิวที่ขรุขระ → ลิ่มเลือดก่อตัวทับ → หลุดไปอุดปลายทาง หรืออุดสนิทที่เดิม**\n\n**ลักษณะทางคลินิกสามข้อ**\n- **ดำเนินโรคแบบเป็นขั้นบันได (stepwise progression)**\n- **มี TIA ซ้ำ ๆ ในหลอดเลือดแขนงเดียวกัน** · **เสียงฟู่ที่หลอดเลือด carotid หรือชีพจรที่เบาลง ช่วยสนับสนุน** · อาจมีประวัติ **ปวดน่องเวลาเดิน (intermittent claudication)** ซึ่งสะท้อนหลอดเลือดแข็งทั่วร่างกาย\n- **ขนาดของเนื้อสมองตายใหญ่กว่า 1.5 ซม.** บน CT หรือ MRI\n\n**สามกลไกย่อย**\n| กลไกย่อย | คำอธิบาย |\n|---|---|\n| **Thrombosis** | ลิ่มเลือดก่อตัวและอุดที่ตำแหน่งเดิม (จากหลอดเลือดแข็ง หรือ **ผนังหลอดเลือดฉีกขาด**) |\n| **Embolism** | **เศษคราบไขมันหรือลิ่มเลือดหลุดไปอุดปลายทาง** (artery-to-artery embolism) |\n| **Watershed infarction** | เกิดตอน **ระบบไหลเวียนล้มเหลว ความดันตก หรือซีดเฉียบพลัน** |\n\n### 2. Cardioembolism\n**ลักษณะทางคลินิกตามสไลด์**\n- **เริ่มทันทีทันใด และอาการรุนแรงที่สุดตั้งแต่วินาทีแรก (maximal deficit at onset)**\n- **มักเกิดขณะทำกิจวัตรหรือออกแรง** ไม่ใช่เฉพาะตอนพัก\n- **มีหลักฐานของ TIA หรือ stroke ในหลอดเลือดมากกว่าหนึ่งแขนง หรือมีลิ่มเลือดอุดที่อวัยวะอื่น** ซึ่งเป็นลายเซ็นสำคัญ เพราะแหล่งกำเนิดอยู่ต้นน้ำจึงกระจายได้หลายทิศ\n\n**สาเหตุตามสไลด์**\n- **จากหัวใจ** — **Atrial fibrillation** (อันดับแรก) · โรคลิ้นหัวใจ · ลิ่มเลือดในห้องบน · **กล้ามเนื้อหัวใจตายเมื่อไม่นาน** · กล้ามเนื้อหัวใจโตชนิดห้องขยาย · **เยื่อบุหัวใจอักเสบติดเชื้อ** · หลังผ่าตัดทางเบี่ยงหลอดเลือดหัวใจ\n- **อื่น ๆ** — **ลิ่มเลือดดำที่ขาแล้วข้ามผ่านรูรั่วที่ผนังกั้นหัวใจ (paradoxical embolus)**\n\n### 3. Small vessel disease\nหลอดเลือดแดงเล็กในเนื้อสมองตีบจากความดันโลหิตสูงเรื้อรังและเบาหวาน → **lacunar infarction ขนาดไม่เกิน 1.5 ซม.** ให้กลุ่มอาการ lacunar โดยไม่มีอาการเปลือกสมอง\n\n### ตารางแยกสามกลุ่มหลัก\n\n| | **LAA** | **Cardioembolism** | **Small vessel** |\n|---|---|---|---|\n| **การเริ่มต้น** | **เป็นขั้นบันได** | **ทันทีทันใด รุนแรงสุดตั้งแต่แรก** | ทันทีหรือค่อยเป็นในชั่วโมง |\n| **TIA นำมาก่อน** | **ซ้ำในแขนงเดียวกัน** | **คนละแขนง** | มักไม่มี |\n| **ขนาดรอยโรค** | **> 1.5 ซม.** | **รูปลิ่มที่เปลือกสมอง** | **≤ 1.5 ซม. ในเนื้อสมองส่วนลึก** |\n| **อาการเปลือกสมอง** | มี | **มี** | **ไม่มี** |\n| **เบาะแสอื่น** | **เสียงฟู่ที่คอ · ชีพจรเบา · ปวดน่องเวลาเดิน** | **AF · เสียงฟู่ที่หัวใจ · ลิ่มเลือดที่อวัยวะอื่น** | **ความดันสูงเรื้อรัง · เบาหวาน** |\n| **การป้องกันหลัก** | **ยาต้านเกล็ดเลือด + statin ขนาดสูง** · พิจารณาผ่าตัด carotid | **ยาต้านการแข็งตัวของเลือด** | **ยาต้านเกล็ดเลือด + คุมความดันเข้มงวด** |\n\n> **แถวสุดท้ายคือเหตุผลทั้งหมดของการจำแนก** — ให้ยาผิดกลุ่มแปลว่าป้องกันไม่ได้จริง โดยเฉพาะ **การให้ยาต้านเกล็ดเลือดกับผู้ป่วย AF ซึ่งด้อยกว่ายาต้านการแข็งตัวของเลือดอย่างชัดเจน** เพราะลิ่มเลือดใน AF เกิดจาก **เลือดคั่งนิ่งแล้วแข็งตัวผ่าน coagulation cascade ไม่ใช่การเกาะกลุ่มของเกล็ดเลือด**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดงภาพขั้นตอนของ **atherosclerosis → ulceration → platelet-fibrin aggregation → thrombosis → embolization** แบบทีละขั้น พร้อมระบุ **ตำแหน่งที่เกิดคราบไขมันบ่อยที่สุดคือจุดแยกของหลอดเลือด**\n- สไลด์เน้นประโยค **\"Most often begin suddenly and maximum deficit at the onset\"** สำหรับ cardioembolic ซึ่งเป็นตัวแยกที่ใช้ได้จริงที่สุดจากประวัติ\n- สไลด์วาง **TOAST classification ไว้ในกล่อง Prevention ของ step approach** ไม่ใช่กล่องการวินิจฉัย ซึ่งสื่อว่าเป้าหมายของการจำแนกคือการเลือกวิธีป้องกัน\n", "pearls": ["LAA เป็นขั้นบันได + TIA ซ้ำแขนงเดียว + รอยโรค > 1.5 ซม. + เสียงฟู่ที่คอ", "Cardioembolic ทันทีทันใด รุนแรงสุดตั้งแต่แรก + TIA คนละแขนง + AF", "Small vessel ไม่มีอาการเปลือกสมอง และรอยโรค ≤ 1.5 ซม. ในเนื้อสมองส่วนลึก", "จำแนกเพื่อเลือกการป้องกัน — AF ให้ยาต้านการแข็งตัวของเลือด · หลอดเลือดแข็งให้ยาต้านเกล็ดเลือดกับ statin", "หาสาเหตุไม่ได้ถึง 30% จึงต้องสืบค้นอย่างเป็นระบบก่อนสรุป"], "items": [{"id": "NEU-MCQ-02", "kind": "mcq", "stem": "A 72-year-old man develops maximal left-sided weakness instantly while eating breakfast. He had a transient episode of right-sided visual loss 2 months ago and an episode of left arm numbness last year. His pulse is irregularly irregular. Computed tomography of the brain 6 hours later shows a wedge-shaped cortical infarct in the right middle cerebral artery territory. Which TOAST subtype does this presentation best fit?", "choices": ["Cardioembolism", "Large artery atherosclerosis", "Small vessel occlusion", "Stroke of other determined aetiology", "Stroke of undetermined aetiology"], "answer": 0, "explain": "**ไล่กลไก** — ลิ่มเลือดจากหัวใจหลุดออกมาอุดหลอดเลือดสมองแบบ **ทันทีทันใด** ก้อนลิ่มเลือดที่ลอยมาตามกระแสเลือดจะไปติดตรงจุดที่หลอดเลือดเริ่มแคบลง ทำให้เนื้อสมองตายเป็น **รูปลิ่มที่กินถึงเปลือกสมอง (cortical wedge)**\n\n**สามข้อที่สไลด์ให้ไว้สำหรับ cardioembolic**\n1. **เริ่มแบบทันทีทันใด และอาการรุนแรงที่สุดตั้งแต่วินาทีแรก (maximal deficit at onset)** — ไม่ค่อย ๆ แย่ลง\n2. **มักเกิดขณะทำกิจวัตรหรือออกแรง** ไม่ใช่เฉพาะตอนพัก\n3. **มีหลักฐานของ TIA หรือ stroke ในหลอดเลือดมากกว่าหนึ่งแขนง หรือมีลิ่มเลือดอุดที่อวัยวะอื่น** — ผู้ป่วยรายนี้เคยตาบอดชั่วคราวข้างขวา (แขนง ophthalmic ของ carotid ขวา) และเคยชาแขนซ้าย (แขนง MCA ขวา) คือ **คนละแขนงกัน** ซึ่งเป็นลายเซ็นของลิ่มเลือดที่มาจากหัวใจ เพราะแหล่งกำเนิดอยู่ต้นน้ำและกระจายไปได้หลายทิศ\n\n**และมี atrial fibrillation** ซึ่งสไลด์ระบุเป็นสาเหตุอันดับแรกของ cardioembolism\n\n**ทำไมตัวลวงจึงผิด**\n- *Large artery atherosclerosis* — สไลด์ระบุว่ามักดำเนินแบบ **เป็นขั้นบันได (stepwise progression)** และมี **TIA ซ้ำในหลอดเลือดแขนงเดียวกัน** ไม่ใช่หลายแขนง · มักมีเสียงฟู่ที่คอหรือชีพจรเบาลง\n- *Small vessel occlusion* — ทำให้เกิด **lacunar syndrome ที่ไม่มีอาการของเปลือกสมอง** และรอยโรคเล็ก **ไม่เกิน 1.5 ซม.** ในเนื้อสมองส่วนลึก ไม่ใช่รูปลิ่มที่เปลือกสมอง\n- *Other determined aetiology* — สงวนไว้สำหรับสาเหตุจำเพาะ เช่น หลอดเลือดฉีกขาด หลอดเลือดอักเสบ ภาวะเลือดแข็งตัวง่าย ซึ่งไม่มีในโจทย์\n- *Undetermined* — ใช้เมื่อหาสาเหตุไม่ได้ หรือพบสาเหตุที่เป็นไปได้มากกว่าหนึ่งอย่างพร้อมกัน แต่รายนี้มี AF ที่อธิบายได้ครบ", "pearl": "ทันทีทันใด + รุนแรงสุดตั้งแต่แรก + TIA คนละแขนง + AF = cardioembolic", "topic": "TOAST subtype – cardioembolic stroke", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.9(1)", "B7.2.5(5)"]}, {"id": "NEU-MCQ-16", "kind": "mcq", "stem": "A 69-year-old man with diabetes and a 40 pack-year smoking history has had three episodes over 2 weeks of transient right arm weakness and slurred speech, each lasting about 10 minutes and resolving completely. He now has a persistent mild right hemiparesis that worsened in a stepwise fashion over 2 days. A bruit is audible over the left carotid artery. Magnetic resonance imaging shows a 2.5 cm infarct in the left corona radiata. Which TOAST subtype is most likely?", "choices": ["Small vessel occlusion (lacunar infarction)", "Large artery atherosclerosis", "Stroke of other determined aetiology", "Watershed infarction from systemic hypotension", "Cardioembolism"], "answer": 1, "explain": "**ไล่กลไก** — คราบไขมันที่ผนังหลอดเลือดแดงใหญ่ (มักที่ **จุดแยกของหลอดเลือด carotid**) จะมีขั้นตอนตามที่สไลด์ไล่ไว้: **คราบไขมันที่จุดแยก → ผิวชั้นในฉีกขาดเป็นแผล → เกล็ดเลือดและไฟบรินมาเกาะบนผิวที่ขรุขระ → เกิดลิ่มเลือดทับ → หลุดไปอุดปลายทาง หรืออุดสนิทที่เดิม**\n\n**สไลด์ให้ลักษณะทางคลินิกไว้สามข้อ ซึ่งผู้ป่วยรายนี้มีครบ**\n1. **ดำเนินโรคแบบเป็นขั้นบันได (stepwise progression)**\n2. **มีประวัติ TIA ซ้ำ ๆ ในหลอดเลือดแขนงเดียวกัน** (รายนี้ซ้ำสามครั้งในแขนงเดียวกัน) · **เสียงฟู่ที่หลอดเลือด carotid หรือชีพจรที่เบาลง ช่วยสนับสนุน**\n3. **ขนาดของเนื้อสมองตายใหญ่กว่า 1.5 ซม. บน CT หรือ MRI** (รายนี้ 2.5 ซม.)\n\n**สามกลไกย่อยของ LAA ที่สไลด์แยกไว้**\n- **Thrombosis** — ลิ่มเลือดก่อตัวและอุดที่ตำแหน่งเดิม (จากหลอดเลือดแข็ง หรือผนังหลอดเลือดฉีกขาด)\n- **Embolism** — เศษคราบไขมันหรือลิ่มเลือดหลุดไปอุดปลายทาง (artery-to-artery embolism)\n- **Watershed infarction** — เกิดตอนระบบไหลเวียนล้มเหลว ความดันตก หรือซีดเฉียบพลัน\n\n**ทำไมตัวลวงจึงผิด**\n- *Lacunar* — **ขนาดต้องไม่เกิน 1.5 ซม.** รายนี้ 2.5 ซม. จึงตัดออก และ lacunar ไม่สัมพันธ์กับเสียงฟู่ที่คอ\n- *Cardioembolism* — มักเกิด **ทันทีทันใดและรุนแรงที่สุดตั้งแต่แรก** ไม่ใช่ค่อย ๆ แย่ลงเป็นขั้น และ TIA ที่นำมาก่อนมักอยู่ **คนละแขนง** ไม่ใช่แขนงเดียวซ้ำ ๆ · รายนี้ไม่มีหลักฐานของโรคหัวใจ\n- *Other determined aetiology* — ต้องมีสาเหตุจำเพาะ เช่น หลอดเลือดฉีกขาด หลอดเลือดอักเสบ หรือภาวะเลือดแข็งตัวง่าย\n- *Watershed* — เป็นกลไกย่อยที่ต้องมีประวัติ **ความดันตก ระบบไหลเวียนล้มเหลว หรือซีดเฉียบพลัน** ซึ่งไม่มีในโจทย์", "pearl": "เป็นขั้นบันได + TIA ซ้ำในแขนงเดียวกัน + เสียงฟู่ที่คอ + รอยโรคเกิน 1.5 ซม. = large artery atherosclerosis", "topic": "Large artery atherosclerosis – clinical pattern", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.9(3)", "B7.2.5(6)"]}, {"id": "NEU-MCQ-23", "kind": "mcq", "stem": "A 34-year-old woman develops left-sided neck pain and headache after a chiropractic neck manipulation, followed 2 days later by vertigo, ataxia and right-sided numbness. She has no vascular risk factors. Which of the following is the most likely mechanism of her stroke?", "choices": ["Cardioembolism from atrial fibrillation", "Venous sinus thrombosis", "Vertebral artery dissection with artery-to-artery embolism", "Primary central nervous system vasculitis", "Small vessel disease from chronic hypertension"], "answer": 2, "explain": "**ไล่กลไก** — การฉีกขาดของผนังหลอดเลือด (**dissection**) เกิดเมื่อผนังชั้นในฉีก เลือดจึงแทรกเข้าไปในผนังหลอดเลือด ทำให้ **รูหลอดเลือดแคบลง และผิวที่ฉีกกลายเป็นจุดก่อลิ่มเลือดซึ่งหลุดไปอุดปลายทางได้** สไลด์ระบุ **dissection ไว้ในกลไกย่อยของ thrombosis ในกลุ่ม large artery** ว่าเป็นสาเหตุของการอุดตันในตำแหน่งนั้นเอง\n\n**ลายเซ็นทางคลินิกที่ต้องจับให้ได้**\n- **อายุน้อยและไม่มีปัจจัยเสี่ยงของหลอดเลือดแข็ง** — เป็นสาเหตุอันดับต้นของ stroke ในคนอายุน้อย\n- **ปวดคอหรือปวดศีรษะนำมาก่อนอาการทางประสาท** ซึ่งเป็นความเจ็บจากตัวผนังหลอดเลือดที่ฉีก\n- **มีเหตุกระตุ้นทางกล** เช่น **การจัดกระดูกคอ** อุบัติเหตุ ไอรุนแรง หรือแม้แต่การหันคอแรง ๆ\n- **อาการของระบบไหลเวียนด้านหลัง** (เวียนศีรษะ เดินเซ ชาแบบไขว้) เข้ากับ **vertebral artery** ส่วนถ้าเป็น **carotid dissection** จะได้อาการซีกสมองร่วมกับ **Horner syndrome ข้างเดียวกัน**\n\n**การวินิจฉัย** — **CTA หรือ MRA ของหลอดเลือดคอ** (MRI แบบ fat-suppressed เห็น mural hematoma ได้ดี)\n\n**ทำไมตัวลวงจึงผิด**\n- *Small vessel disease* — เป็นโรคของผู้สูงอายุที่มีความดันสูงเรื้อรัง และให้ **lacunar syndrome ที่ไม่มีอาการก้านสมองหลายอย่างพร้อมกัน**\n- *Cardioembolism จาก AF* — ไม่มีข้อมูลว่ามีโรคหัวใจ และ AF พบน้อยมากในคนอายุ 34 ที่แข็งแรงดี\n- *หลอดเลือดสมองอักเสบปฐมภูมิ* — พบน้อยมาก มักดำเนินโรคแบบค่อยเป็นค่อยไปหลายสัปดาห์ร่วมกับปวดศีรษะเรื้อรังและการรู้คิดถดถอย ไม่ใช่เกิดทันทีหลังเหตุกระตุ้นทางกล\n- *ลิ่มเลือดอุดหลอดเลือดดำในสมอง* — มักมาด้วย **ปวดศีรษะที่แย่ลงเรื่อย ๆ ชัก และอาการที่ไม่เข้ากับเขตหลอดเลือดแดงใด** ร่วมกับปัจจัยเสี่ยงเช่นยาคุมกำเนิดหรือการตั้งครรภ์", "pearl": "Stroke ในคนอายุน้อย + ปวดคอหรือศีรษะนำมาก่อน + มีเหตุกระตุ้นทางกล = หลอดเลือดฉีกขาด", "topic": "Stroke in the young – cervical artery dissection", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6", "2.1.4"]}]}, {"id": "neuro-07-07", "title": "การประเมิน — เวลาเริ่มอาการ การดูแลเบื้องต้น และ NIHSS", "minutes": 10, "summary": "คำถามเดียวที่สำคัญที่สุดคือผู้ป่วยเป็นปกติครั้งสุดท้ายเมื่อไร", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.2.17", "2.3.6"], "md": "### เวลาเริ่มอาการ — สองคำที่ต้องแยกให้ออก\n| คำ | ความหมาย |\n|---|---|\n| **Last seen well (LSW)** | **เวลาสุดท้ายที่เห็นผู้ป่วยเป็นปกติ** |\n| **First seen abnormal (FSA)** | **เวลาแรกที่พบว่าผิดปกติ** |\n\n> **เวลาเริ่มอาการที่ใช้ตัดสินใจรักษา คือ LSW เสมอ**\n> **เหตุผล** — สมองอาจขาดเลือดตั้งแต่วินาทีถัดจากที่เห็นเป็นปกติครั้งสุดท้าย การใช้ FSA จะทำให้ **ประเมินระยะเวลาต่ำกว่าความจริง** แล้วให้ยาละลายลิ่มเลือดกับผู้ป่วยที่พ้นหน้าต่างเวลาไปแล้ว ซึ่งเสี่ยงต่อเลือดออกในสมอง\n\n**สองตัวอย่างที่สไลด์ยกไว้**\n- **Wake-up stroke หรือไม่มีพยาน** (ผู้ป่วยให้ข้อมูลไม่ได้) — **LSW 22.00 น., FSA 05.00 น. → onset = 22.00 น.**\n- **เกิดขณะทำกิจกรรมและมีพยานเห็น** — **LSW และ FSA เป็นเวลาเดียวกัน → onset ชัดเจน**\n\n**ประวัติอื่นที่ต้องถามให้ครบ** — **อาการเข้าได้กับ stroke หรือไม่** · **โรคประจำตัวและประวัติในอดีต โดยเฉพาะยาที่ใช้ ประวัติ stroke เดิม การบาดเจ็บศีรษะ และการผ่าตัด** ซึ่งทั้งหมดคือ **เกณฑ์คัดออกของ IV rtPA**\n\n### กรอบเวลาที่ต้องจำ\nสไลด์แสดงเป็นแถบเวลาจากจุดเริ่มอาการ\n> **3 ชั่วโมง → 4.5 ชั่วโมง → 6 ชั่วโมง → 24 ชั่วโมง**\n- **ภายใน 3 ชั่วโมง** — rtPA ได้ประโยชน์สูงสุด (**Class I, Level of Evidence A**)\n- **3 ถึง 4.5 ชั่วโมง** — ยังให้ rtPA ได้ในผู้ป่วยที่เข้าเกณฑ์ (**Class I, Level of Evidence B**)\n- **ถึง 24 ชั่วโมง** — **การลากลิ่มเลือดออกด้วยสายสวนในผู้ป่วยที่คัดเลือกด้วยภาพถ่าย**\n\n### การดูแลเบื้องต้นก่อนส่งทำภาพถ่าย (สไลด์ให้เป็นรายการ)\n1. **ประเมิน ABC (airway, breathing, circulation) และสัญญาณชีพ**\n2. **ให้ออกซิเจนเมื่อ SpO₂ < 94% และหลีกเลี่ยงการทำให้หายใจเร็วเกิน (hyperventilation)**\n3. **ตรวจระดับน้ำตาลในเลือด** — **น้ำตาลต่ำหมายถึง POCT glucose < 50 mg% (หรือน้ำตาลที่ยืนยันแล้ว < 60 mg/dL) ให้รักษาด้วย 50% glucose 50 mL เข้าหลอดเลือดดำ**\n4. **งดน้ำงดอาหารทางปาก**\n5. **เปิดหลอดเลือดดำด้วยเข็มเบอร์ 18 และให้ 0.9% NaCl**\n6. **ส่งเลือดตรวจ CBC, coagulogram, BUN, Cr**\n7. **ทำ EKG ในบางราย**\n\n*(ข้อ 4 สำคัญกว่าที่คิด — ผู้ป่วย stroke กลืนผิดปกติได้บ่อย การให้กินก่อนประเมินการกลืนทำให้เกิดปอดอักเสบจากการสำลัก)*\n\n### การตรวจร่างกาย\n**สัญญาณชีพ (อุณหภูมิ ชีพจร ความดัน ความอิ่มตัวของออกซิเจน) · คลำชีพจร · ฟังเสียงฟู่ที่หลอดเลือด carotid · ตรวจหัวใจ · ตรวจระบบประสาท**\n\n### NIHSS — มาตรวัดความรุนแรง\n**คะแนนรวม 0−42 ยิ่งสูงยิ่งรุนแรง** ประเมิน 11 หมวด ได้แก่ **ระดับความรู้สึกตัว · การตอบคำถามสองข้อ · การทำตามคำสั่งสองอย่าง · การกลอกตา · ลานสายตา · ใบหน้า · กำลังแขนและขาทั้งสี่ข้าง · การทำงานประสานของแขนขา · ความรู้สึก · neglect · การออกเสียง · ภาษา**\n\n| คะแนน | ความรุนแรง |\n|---|---|\n| **> 25** | **รุนแรงมากที่สุด** |\n| **15−24** | **รุนแรง** |\n| **5−14** | **รุนแรงปานกลาง** |\n| **0−4** | **เล็กน้อย** |\n\n> **ประโยคที่สไลด์เน้น — การเพิ่มขึ้น 2 คะแนนหรือมากกว่าเมื่อประเมินซ้ำ บ่งชี้ว่า stroke กำลังดำเนินโรคแย่ลง และควรรายงาน**\n\n**NIHSS ยังทำนายปลายทางหลังออกจากโรงพยาบาลได้** — **< 5 มักกลับบ้านได้ · 6−13 มักต้องไปฟื้นฟูสมรรถภาพ · > 13 มักต้องไปสถานดูแลระยะยาว**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดงแบบฟอร์ม **NIHSS ของโรงพยาบาลราชวิถี** จริง ๆ พร้อมช่องให้คะแนนรายหมวด เพื่อให้คุ้นกับเอกสารที่ต้องใช้จริง\n- สไลด์อ้างอิงช่วงคะแนนจาก **Adams HP et al. Neurology 1999;53:126-131** และการทำนายปลายทางจาก **Schlegel et al. 2003**\n- สไลด์วาง **step approach** ไว้สี่ขั้นและย้ำซ้ำสองครั้งในคาบ: **รู้จักอาการและกลุ่มอาการ → ประเมินและดูแลฉุกเฉินพร้อมบันทึกเวลาเริ่มอาการ → รักษาเฉียบพลัน → ป้องกันการเป็นซ้ำ**\n", "pearls": ["ใช้ last seen well เป็นเวลาเริ่มอาการเสมอ ไม่ใช่เวลาที่พบว่าผิดปกติ", "กรอบเวลา 3 → 4.5 → 6 → 24 ชั่วโมง · rtPA ถึง 4.5 ชม. · ลากลิ่มเลือดถึง 24 ชม.", "ก่อนส่งภาพถ่ายต้องเจาะน้ำตาล งดน้ำงดอาหาร เปิดเส้นเบอร์ 18 และส่ง coagulogram", "NIHSS 0−42 · 5−14 คือรุนแรงปานกลาง · เพิ่มขึ้น ≥ 2 คะแนน = โรคดำเนินแย่ลง ต้องรายงาน", "NIHSS < 5 มักกลับบ้าน · 6−13 ไปฟื้นฟู · > 13 ไปสถานดูแลระยะยาว"], "items": [{"id": "NEU-MCQ-07", "kind": "mcq", "stem": "A 66-year-old woman was last seen normal at 22:00 when she went to bed. She woke at 05:00 unable to move her left arm and was brought to hospital at 06:00. Which time should be used as the onset time when deciding eligibility for intravenous thrombolysis?", "choices": ["02:30, the midpoint between last seen well and first seen abnormal", "22:00, the time she was last seen well", "Onset cannot be defined, so thrombolysis is absolutely contraindicated regardless of imaging", "05:00, the time she first noticed the deficit", "06:00, the time of arrival at hospital"], "answer": 1, "explain": "**หลักการ** — สไลด์แยกสองคำนี้ไว้ชัดเจน\n- **Last seen well (LSW)** = เวลาสุดท้ายที่เห็นผู้ป่วยเป็นปกติ\n- **First seen abnormal (FSA)** = เวลาแรกที่พบว่าผิดปกติ\n\n> **เวลาเริ่มอาการ (onset) ที่ใช้ตัดสินใจ คือ LSW เสมอ** เพราะสมองอาจขาดเลือดตั้งแต่วินาทีถัดจากที่เห็นครั้งสุดท้าย การใช้ FSA จะทำให้ **ประเมินระยะเวลาต่ำกว่าความจริง** แล้วให้ยาละลายลิ่มเลือดกับคนที่พ้นหน้าต่างเวลาไปแล้ว ซึ่งเสี่ยงต่อ **เลือดออกในสมอง**\n\n**ตัวอย่างที่สไลด์ยกไว้**\n- **Wake-up stroke / ไม่มีพยาน** — ผู้ป่วยให้ข้อมูลไม่ได้ · **LSW 22:00, FSA 05:00 → onset = 22:00**\n- **เกิดขณะทำกิจกรรมและมีพยานเห็น** — **LSW และ FSA เป็นเวลาเดียวกัน → onset ชัดเจน**\n\nผู้ป่วยรายนี้ **onset = 22:00** ซึ่งถึงเวลาที่มาถึงโรงพยาบาล 06:00 คือ **ผ่านไปแล้ว 8 ชั่วโมง เกินหน้าต่าง 4.5 ชั่วโมงของ rtPA**\n\n**ทำไมตัวลวงจึงผิด**\n- *05:00 (FSA)* — เป็นความผิดพลาดที่อันตรายที่สุดในข้อนี้ จะทำให้คิดว่าเพิ่งผ่านไป 1 ชั่วโมงและให้ยาโดยไม่ควรให้\n- *06:00 (เวลามาถึง)* — เวลามาถึงไม่เกี่ยวกับการเริ่มอาการ ใช้สำหรับวัดคุณภาพบริการ (door-to-needle) เท่านั้น\n- *จุดกึ่งกลาง* — ไม่ใช่หลักที่ใช้ในเวชปฏิบัติ และเป็นการเดา\n- *ห้ามให้ยาเด็ดขาดไม่ว่าภาพถ่ายจะเป็นอย่างไร* — เกินความจริง ปัจจุบัน **ผู้ป่วย wake-up stroke ยังมีทางเลือกอยู่** คือประเมินด้วยภาพถ่ายขั้นสูง (เช่น DWI-FLAIR mismatch หรือ perfusion imaging) และ **พิจารณาการลากลิ่มเลือดออกด้วยสายสวนได้ถึง 24 ชั่วโมง** ตามแผนภาพเวลาในสไลด์ ดังนั้นการรีบสรุปว่าทำอะไรไม่ได้เลยก็ผิด", "pearl": "ใช้ last seen well เป็นเวลาเริ่มอาการเสมอ ไม่ใช่เวลาที่พบว่าผิดปกติ", "topic": "Onset time – wake-up stroke", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6"]}, {"id": "NEU-MCQ-08", "kind": "mcq", "stem": "A patient with acute ischaemic stroke has an initial National Institutes of Health Stroke Scale (NIHSS) score of 8. Four hours later the score is 11. Which of the following statements is correct?", "choices": ["NIHSS is used only for research and has no role in predicting discharge destination", "A rise of 2 points or more on serial NIHSS indicates stroke progression and should be reported", "The NIHSS ranges from 0 to 20, so a score of 11 is more than half the maximum", "A rise of 3 points is within normal measurement variation and needs no action", "The initial score of 8 indicates very severe neurological impairment"], "answer": 1, "explain": "**หลักการ** — NIHSS เป็นมาตรวัดความรุนแรงของ stroke ที่ให้คะแนน **0−42 โดยคะแนนยิ่งสูงยิ่งรุนแรง**\n\n**ช่วงคะแนนที่สไลด์ให้ไว้ (Adams HP et al. Neurology 1999)**\n\n| คะแนน | ความรุนแรง |\n|---|---|\n| **> 25** | **รุนแรงมากที่สุด** |\n| **15−24** | **รุนแรง** |\n| **5−14** | **รุนแรงปานกลาง** |\n| **0−4** | **เล็กน้อย** |\n\n**ประโยคที่สไลด์เน้น** — **\"การเพิ่มขึ้น 2 คะแนนหรือมากกว่าเมื่อประเมินซ้ำ บ่งชี้ว่า stroke กำลังดำเนินโรคแย่ลง และควรรายงาน\"** ผู้ป่วยรายนี้เพิ่มขึ้น 3 คะแนน จึงเข้าเกณฑ์และต้องแจ้งทีมทันที เพราะอาจหมายถึง **ลิ่มเลือดขยายตัว สมองบวม มีเลือดออกแทรก หรือหลอดเลือดอุดซ้ำ** ซึ่งต้องส่งภาพถ่ายซ้ำ\n\n**NIHSS ยังทำนายปลายทางหลังออกจากโรงพยาบาลได้ (Schlegel et al. 2003)**\n- **< 5** → มักกลับบ้านได้\n- **6−13** → มักต้องไปฟื้นฟูสมรรถภาพ\n- **> 13** → มักต้องไปสถานดูแลระยะยาว\n\n**ทำไมตัวลวงจึงผิด**\n- *3 คะแนนอยู่ในความคลาดเคลื่อนปกติ* — ขัดกับเกณฑ์ 2 คะแนนที่สไลด์ระบุไว้โดยตรง\n- *คะแนน 8 คือรุนแรงมากที่สุด* — 8 อยู่ในช่วง **5−14 คือรุนแรงปานกลาง**\n- *ช่วงคะแนน 0−20* — ผิด ช่วงที่ถูกคือ **0−42**\n- *ใช้เพื่อการวิจัยเท่านั้น* — ผิด เพราะใช้ทั้งคัดเลือกผู้ป่วยสำหรับการรักษา ติดตามการดำเนินโรค และวางแผนการฟื้นฟู", "pearl": "NIHSS 0−42 · เพิ่มขึ้น ≥ 2 คะแนน = โรคดำเนินแย่ลง ต้องรายงานและส่งภาพถ่ายซ้ำ", "topic": "NIHSS – interpretation and serial change", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6"]}]}, {"id": "neuro-07-08", "title": "ภาพถ่ายสมอง — สัญญาณระยะแรกและ ASPECTS", "minutes": 9, "summary": "CT ที่ดู 'เกือบปกติ' มีข้อมูลมากกว่าที่คิด", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["3.3.20", "2.3.9-3(3)"], "md": "### บทบาทของ CT แบบไม่ฉีดสารทึบรังสี\n> **หน้าที่แรกและสำคัญที่สุดคือ \"R/O Bleed\" — ตัดเลือดออกในสมองให้ได้ก่อน** เพราะเป็นสิ่งที่เปลี่ยนการรักษาทันที\n\n**ข้อจำกัดที่ต้องเข้าใจ** — สไลด์ระบุว่า **ความไวของ CT ต่อ stroke ขาดเลือดจะดีขึ้นมากหลัง 24 ชั่วโมง** แปลว่า **ในระยะเฉียบพลัน CT อาจดูเกือบปกติได้ ซึ่งไม่ตัด stroke ออก และไม่ห้ามให้ยาละลายลิ่มเลือด**\n\n### สัญญาณระยะแรก (early ischemic change) ที่ต้องอ่านให้ออก\n**กลไก** — เมื่อเลือดหยุดไปเลี้ยง เซลล์สมองบวมน้ำภายในไม่กี่สิบนาที น้ำที่เพิ่มขึ้นทำให้ **ความหนาแน่นของเนื้อสมองลดลงเล็กน้อย** จึงเห็นเป็นการเลือนของขอบเขต ก่อนจะเห็นเป็นรอยดำชัดเจนในวันถัด ๆ ไป\n\n**สี่สัญญาณตามสไลด์**\n1. **สูญเสียความแตกต่างระหว่างเนื้อสมองสีเทาและสีขาว (loss of gray-white differentiation)**\n2. **ร่องสมองและรอยหยักถูกลบเรียบ (effacement of sulci-gyri)**\n3. **โครงสร้างปกติเลือนหายไป** — **basal ganglia หรือ lentiform nucleus เบลอ** และ **เสีย insular ribbon**\n4. **Hyperdense MCA sign** — **หลอดเลือด MCA ขาวขึ้นผิดปกติ ซึ่งคือตัวลิ่มเลือดเอง**\n\n*(สไลด์ยังเพิ่ม **ความหนาแน่นลดลงเฉียบพลันและ mass effect** ไว้ในภาพประกอบ)*\n\n> **สไลด์ระบุว่าการพบสัญญาณระยะแรกภายใน 6 ชั่วโมง อาจบ่งชี้พยากรณ์โรคที่แย่กว่า** เพราะแปลว่าเนื้อสมองเสียหายเร็วและกว้าง\n\n**ข้อแตกต่างจากรอยโรคเก่า** — **แผลเป็นเก่าจะเป็นรอยดำสนิทขอบคม ร่วมกับเนื้อสมองฝ่อและโพรงสมองข้างนั้นขยาย** ส่วนเลือดออกเฉียบพลันจะเป็น **รอยขาวสว่างชัดเจน**\n\n### ASPECTS — ให้คะแนนขนาดของเนื้อตาย\n> **แบ่งเขตที่ MCA เลี้ยงออกเป็น 10 บริเวณ** — **M1, M2, M3, M4, M5, M6 · caudate (C) · lentiform (L) · internal capsule (IC) · insular cortex (I)**\n> **เริ่มจากคะแนนเต็ม 10 แล้วหัก 1 คะแนนต่อทุกบริเวณที่มีการขาดเลือด**\n\n| คะแนน | ความหมาย |\n|---|---|\n| **10** | CT ปกติสมบูรณ์ |\n| **สูง (โดยทั่วไป ≥ 6)** | **core เล็ก ยังมี penumbra ให้กอบกู้ → ได้ประโยชน์จากการเปิดหลอดเลือด** |\n| **ต่ำ** | **เนื้อตายไปมากแล้ว → ได้ประโยชน์น้อยลงและเสี่ยงเลือดออกมากขึ้น** |\n\n> **จุดที่คนพลาดคือลืมว่า insula, lentiform, caudate และ internal capsule นับรวมอยู่ใน 10 บริเวณด้วย ไม่ได้นับเฉพาะ M1−M6**\n\n### ภาพถ่ายอื่น\n| การตรวจ | สิ่งที่ได้ |\n|---|---|\n| **CT angiogram (CTA)** | **ดูว่ามีการอุดตันของหลอดเลือดใหญ่หรือไม่ และอยู่ตำแหน่งใด** — จำเป็นสำหรับการตัดสินใจลากลิ่มเลือด · **CTA แบบหลายช่วงเวลา (multiphase) ยังเห็นหลอดเลือดข้างเคียง (collateral) ได้** |\n| **MRI (T1/T2, DWI)** | **ประเมินการขาดเลือดได้ทันที ไวกว่า CT มากในระยะเฉียบพลัน** แต่สไลด์ระบุว่า **ไม่สามารถใช้ในภาวะฉุกเฉินได้ในหลายสถานที่** |\n| **DSA** | ภาพหลอดเลือดที่ละเอียดที่สุด · สไลด์แสดงภาพ **ระยะท้ายที่เห็นเลือดไหลย้อนเข้ามาเลี้ยงแขนงของสมองผ่านทางเบี่ยง** |\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดงภาพ CT จริงหลายภาพเทียบกัน — **รอยโรคเก่า · เลือดออกเฉียบพลัน · เนื้อสมองตายเฉียบพลัน** เพื่อฝึกแยกด้วยตา\n- สไลด์มีภาพที่ชี้ **loss of insular ribbon, loss of gray-white interface, loss of sulci, acute hypodensity, mass effect และ dense MCA sign** ไว้ในภาพเดียวกัน\n- สไลด์แสดงแผนภาพ **10 บริเวณของ ASPECTS** พร้อมระบุว่า **แต่ละบริเวณที่ขาดเลือดหักหนึ่งคะแนนจากคะแนนเต็ม 10**\n", "pearls": ["หน้าที่แรกของ CT คือตัดเลือดออก — CT ที่ดูเกือบปกติไม่ตัด stroke ออกและไม่ห้ามให้ยาละลายลิ่มเลือด", "สี่สัญญาณระยะแรก — เสีย gray-white differentiation · ร่องสมองถูกลบ · insular ribbon และ lentiform เบลอ · hyperdense MCA", "ASPECTS เริ่มที่ 10 หัก 1 ต่อบริเวณที่ขาดเลือด จาก M1−M6 + caudate + lentiform + internal capsule + insula", "ASPECTS ต่ำ = เนื้อตายมาก ได้ประโยชน์จากการเปิดหลอดเลือดน้อยลงและเสี่ยงเลือดออกมากขึ้น", "CTA จำเป็นก่อนตัดสินใจลากลิ่มเลือด เพราะต้องรู้ว่าหลอดเลือดใหญ่อุดตรงไหน"], "items": [{"id": "NEU-MCQ-09", "kind": "mcq", "stem": "A 59-year-old man presents 2 hours after the sudden onset of right hemiparesis and aphasia. Non-contrast computed tomography of the brain shows loss of grey-white differentiation, obscuration of the left lentiform nucleus and loss of the left insular ribbon. What is the correct interpretation?", "choices": ["These findings represent an old, chronic infarct", "The computed tomography scan is normal for this time frame and no acute change is present", "These findings are diagnostic of a brain tumour with surrounding oedema", "These findings represent an acute intracerebral haemorrhage", "These are early ischaemic changes of an acute left middle cerebral artery infarct"], "answer": 4, "explain": "**ไล่กลไก** — เมื่อเลือดหยุดไปเลี้ยง เซลล์สมองจะบวมน้ำ (cytotoxic edema) ภายในไม่กี่สิบนาที น้ำที่เพิ่มขึ้นทำให้ **ความหนาแน่นของเนื้อสมองลดลงเล็กน้อย** จึงเห็นเป็นการ **เลือนของขอบเขตระหว่างเนื้อสมองสีเทากับสีขาว** ก่อนที่จะเห็นเป็นรอยดำชัดเจนในวันถัด ๆ ไป\n\n**สัญญาณระยะแรก (early ischemic change) ที่สไลด์ระบุไว้**\n- **สูญเสียความแตกต่างระหว่าง gray กับ white matter**\n- **ร่องสมองและรอยหยักถูกลบเรียบ (effacement of sulci-gyri)**\n- **โครงสร้างปกติเลือนหายไป เช่น basal ganglia หรือ lentiform nucleus เบลอ และเสีย insular ribbon**\n- **Hyperdense MCA sign** — เห็นหลอดเลือด MCA ขาวขึ้นผิดปกติ ซึ่งคือ **ตัวลิ่มเลือดเอง**\n\n**สไลด์ยังระบุว่าการพบสัญญาณระยะแรกเหล่านี้ภายใน 6 ชั่วโมง อาจบ่งชี้พยากรณ์โรคที่แย่กว่า** และ **ความไวของ CT ต่อ stroke ขาดเลือดจะดีขึ้นมากหลัง 24 ชั่วโมง**\n\n> **บทบาทหลักของ CT ในระยะเฉียบพลันคือ \"R/O Bleed\" — ตัดเลือดออกในสมองให้ได้ก่อน** เพราะเป็นสิ่งที่เปลี่ยนการรักษาทันที การที่ CT ยังดูเกือบปกติ **ไม่ตัด stroke ขาดเลือดออก** และไม่ได้ห้ามให้ยาละลายลิ่มเลือด\n\n**ทำไมตัวลวงจึงผิด**\n- *เลือดออกเฉียบพลัน* — เลือดสดจะเห็นเป็น **รอยขาวสว่างชัดเจน (hyperdense)** ไม่ใช่การเลือนของขอบเขตเนื้อสมอง\n- *รอยโรคเก่า* — แผลเป็นเก่าจะเป็น **รอยดำสนิทขอบคม ร่วมกับเนื้อสมองฝ่อและโพรงสมองข้างนั้นขยาย** ไม่ใช่การเบลอแบบนี้ และไม่เข้ากับอาการที่เพิ่งเกิด 2 ชั่วโมง\n- *ปกติ ไม่มีความผิดปกติ* — มีความผิดปกติจริงและอ่านได้ ซึ่งสำคัญเพราะใช้คิด **ASPECTS**\n- *เนื้องอก* — ดำเนินโรคเป็นสัปดาห์ถึงเดือน มีบวมรอบก้อนและมักรับสารทึบรังสี ไม่เข้ากับอาการที่เกิดทันทีทันใด", "pearl": "สูญเสีย gray-white differentiation · insular ribbon หาย · lentiform เบลอ · hyperdense MCA = สัญญาณ stroke ระยะแรก ไม่ใช่ CT ปกติ", "topic": "Early ischaemic changes on non-contrast CT", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["3.3.20", "2.3.9-3(3)"]}, {"id": "NEU-MCQ-10", "kind": "mcq", "stem": "The Alberta Stroke Program Early CT Score (ASPECTS) is applied to a non-contrast computed tomography scan of a patient with a left middle cerebral artery syndrome. Early ischaemic change is seen in the insular cortex, the lentiform nucleus and the M1, M2 and M3 cortical regions. What is the ASPECTS score?", "choices": ["0", "10", "3", "5", "7"], "answer": 3, "explain": "**หลักการ** — ASPECTS แบ่งเขตที่ MCA เลี้ยงออกเป็น **10 บริเวณ** ตามที่สไลด์ระบุ คือ **M1, M2, M3, M4, M5, M6 · caudate nucleus (C) · lentiform nucleus (L) · internal capsule (IC) · insular cortex (I)**\n\n> **เริ่มจากคะแนนเต็ม 10 แล้วหัก 1 คะแนนต่อทุกบริเวณที่มีการขาดเลือด**\n\nผู้ป่วยรายนี้มีความผิดปกติ **5 บริเวณ** คือ **insula · lentiform · M1 · M2 · M3** → **10 − 5 = 5**\n\n**ทำไมตัวเลขนี้จึงสำคัญ** — ASPECTS บอก **ขนาดของเนื้อสมองที่ตายไปแล้ว (core)** ยิ่งคะแนนต่ำแปลว่าเนื้อตายมาก\n- **คะแนนสูง (โดยทั่วไป ≥ 6) = core เล็ก ยังมี penumbra ให้กอบกู้ → ได้ประโยชน์จากการเปิดหลอดเลือด**\n- **คะแนนต่ำ = เนื้อตายไปมากแล้ว → การเปิดหลอดเลือดได้ประโยชน์น้อยลงและเสี่ยงเลือดออกมากขึ้น**\n\nจึงเป็นเครื่องมือหลักในการ **คัดเลือกผู้ป่วยสำหรับการลากลิ่มเลือดออกด้วยสายสวน**\n\n**ทำไมตัวลวงจึงผิด**\n- *10* — คือคะแนนของ CT ที่ปกติสมบูรณ์ ไม่มีบริเวณใดขาดเลือดเลย\n- *7* — ได้จากการหักเพียง 3 บริเวณ คือนับเฉพาะ M1−M3 แล้วลืมนับ insula และ lentiform\n- *3* — หักเกินไป\n- *0* — แปลว่าทั้ง 10 บริเวณเสียหมด ซึ่งเป็น stroke ขนาดมหึมา\n\n> **จุดที่คนพลาดคือลืมว่า insula, lentiform, caudate และ internal capsule นับรวมอยู่ใน 10 บริเวณด้วย ไม่ได้นับเฉพาะ M1−M6**", "pearl": "ASPECTS เริ่มที่ 10 หัก 1 ต่อบริเวณที่ขาดเลือด จาก 10 เขต — M1−M6, caudate, lentiform, internal capsule, insula", "topic": "ASPECTS scoring", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["3.3.20", "2.3.9-3(3)"]}]}, {"id": "neuro-07-09", "title": "ยาละลายลิ่มเลือดทางหลอดเลือดดำ (IV thrombolysis)", "minutes": 12, "summary": "หน้าต่างเวลา ข้อห้าม ขนาดยา ความดัน และสิ่งที่ต้องเฝ้าระวัง", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.2.4", "B7.2.5(1)", "3.3.20"], "md": "### ข้อบ่งชี้และหน้าต่างเวลา\n> **rt-PA แนะนำในผู้ป่วยที่คัดเลือกแล้วซึ่งรักษาได้ภายใน 3 ชั่วโมงหลังเริ่มอาการ (Class I, Level of Evidence A)**\n> **และควรให้ในผู้ป่วยที่เข้าเกณฑ์ซึ่งรักษาได้ในช่วง 3 ถึง 4.5 ชั่วโมงหลังเริ่มอาการ (Class I, Level of Evidence B)**\n\n**ข้อบ่งชี้สามข้อตามตารางในสไลด์**\n- **วินิจฉัยเป็น stroke ขาดเลือดที่มีความบกพร่องทางประสาทซึ่งก่อความพิการและวัดได้**\n- **เริ่มอาการ < 4.5 ชั่วโมงก่อนเริ่มให้ยา**\n- **อายุตั้งแต่ 18 ปีขึ้นไป**\n\n### ข้อห้ามเด็ดขาด\n**บาดเจ็บศีรษะรุนแรงใน 3 เดือน · อาการที่ชวนคิดถึงเลือดออกใต้เยื่อหุ้มสมอง · เคยมีเลือดออกในสมองมาก่อน · ผ่าตัดในกะโหลกหรือไขสันหลังใน 3 เดือน · เนื้องอกในสมอง · เยื่อบุหัวใจอักเสบติดเชื้อ · หลอดเลือดเอออร์ตาส่วนโค้งฉีกขาด · ความดันสูง (ซิสโตลิก > 185 หรือไดแอสโตลิก > 110 mmHg) ที่ลดลงอย่างปลอดภัยไม่ได้ · มีเลือดออกภายในที่ยังไม่หยุด**\n\n**ภาวะเลือดออกง่ายเฉียบพลัน** — **เกล็ดเลือด < 100,000/mm³ · ได้เฮปารินใน 48 ชั่วโมงที่ aPTT ยาว (> 40 วินาที) · ได้ LMWH ขนาดรักษาใน 24 ชั่วโมง (ขนาดป้องกันไม่นับ) · INR > 1.7 หรือ PT > 15 วินาที · กำลังใช้ยาต้านทรอมบินหรือ factor Xa โดยตรง**\n\n**จากภาพถ่าย** — **CT พบเนื้อสมองตายเกินหนึ่งในสามของซีกสมอง** · **CT พบเลือดออกเฉียบพลัน**\n\n### ข้อห้ามสัมพัทธ์ (ชั่งน้ำหนักเป็นราย ๆ ไป)\n**อาการเล็กน้อยไม่ก่อความพิการหรือกำลังดีขึ้นเร็ว · NIHSS > 25 ในช่วง 3−4.5 ชั่วโมง · การตั้งครรภ์ · ชักตอนเริ่มอาการ (พิจารณาให้ได้ถ้าเชื่อว่าความบกพร่องเกิดจาก stroke จริง) · แทงหลอดเลือดแดงในตำแหน่งที่กดห้ามเลือดไม่ได้ใน 7 วัน · AVM ที่ยังไม่ได้รักษา · หลอดเลือดโป่งพองขนาดใหญ่ที่ยังไม่ได้รักษา · ผ่าตัดใหญ่หรือบาดเจ็บรุนแรงใน 14 วัน · เลือดออกทางเดินอาหารหรือทางเดินปัสสาวะใน 21 วัน · stroke ขาดเลือดใน 3 เดือน · กล้ามเนื้อหัวใจตายชนิด ST ยกใน 3 เดือน · น้ำตาลในเลือด < 50 mg/dL (พิจารณาให้ได้ถ้าแก้น้ำตาลแล้วอาการยังคงอยู่)**\n\n> **จุดที่ออกสอบบ่อยที่สุดคือการสลับข้อห้ามเด็ดขาดกับสัมพัทธ์** — **การตั้งครรภ์ ชักตอนเริ่มอาการ ผ่าตัดใน 14 วัน และ NIHSS > 25 ล้วนเป็นข้อห้าม \"สัมพัทธ์\"** ส่วน **เลือดออกใน CT และเนื้อตายเกินหนึ่งในสามของซีกสมอง เป็น \"เด็ดขาด\"**\n\n### ขนาดยาและวิธีให้\n> **Alteplase 0.9 mg/kg ขนาดสูงสุด 90 mg**\n> **ให้ 10% ของขนาดทั้งหมดเป็น bolus ใน 1 นาที แล้วหยดส่วนที่เหลือใน 60 นาที**\n\n**ทางเลือกอื่น — Tenecteplase**\nสไลด์ระบุว่า **ขนาด 0.25 mg/kg สูงสุด 25 mg ให้เป็น IV bolus ครั้งเดียว** และ **มีประสิทธิภาพและความปลอดภัยใกล้เคียงกับ alteplase** ทั้งอัตราผลลัพธ์ทางการทำงานที่ดีเยี่ยม อัตราเลือดออกในสมองที่มีอาการ และอัตราตายที่ 90 วัน\n\n### การจัดการความดันโลหิต\n**ก่อนให้ยา — ต้อง ≤ 185/110 mmHg**\n- **Labetalol 10−20 mg IV ช้า ๆ ใน 1−2 นาที ให้ซ้ำได้ 1 ครั้ง** หรือ\n- **Nicardipine 5 mg/ชม. IV ปรับเพิ่มครั้งละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n- ยาอื่น เช่น hydralazine หรือ enalaprilat พิจารณาได้\n- **ถ้าคุมไม่ได้ ห้ามให้ rtPA**\n\n**ระหว่างและหลังให้ยา — ต้อง ≤ 180/105 mmHg**\n- **ซิสโตลิก 180−230 หรือไดแอสโตลิก 105−120** → **labetalol 10 mg IV แล้วหยดต่อเนื่อง 2−8 mg/นาที** หรือ **nicardipine 5 mg/ชม. ปรับขึ้นทีละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n- **คุมไม่ได้ หรือไดแอสโตลิก > 140** → พิจารณา **sodium nitroprusside IV**\n\n### การเฝ้าระวังหลังให้ยา\n1. **รับไว้ใน ICU หรือหอผู้ป่วย stroke**\n2. **วัดความดันและประเมินอาการทางประสาท — ทุก 15 นาที นาน 2 ชั่วโมง → ทุก 30 นาที นาน 6 ชั่วโมง → ทุก 1 ชั่วโมงจนครบ 24 ชั่วโมง**\n3. **เลื่อนการใส่สายให้อาหารทางจมูก สายสวนปัสสาวะ และสายวัดความดันในหลอดเลือดแดง** ถ้าดูแลได้อย่างปลอดภัยโดยไม่ใช้\n4. **ทำ CT หรือ MRI ซ้ำที่ 24 ชั่วโมง ก่อนเริ่มยาต้านการแข็งตัวของเลือดหรือยาต้านเกล็ดเลือด**\n\n> **สัญญาณที่ต้องหยุดยาทันที — ปวดศีรษะรุนแรง ความดันสูงเฉียบพลัน คลื่นไส้ อาเจียน หรือการตรวจทางประสาทแย่ลง → หยุดหยดยาและส่ง CT ฉุกเฉิน** เพราะชวนให้คิดถึงเลือดออกในสมอง\n\n### เป้าหมายด้านเวลาในโรงพยาบาล\n> **แพทย์ประเมิน 10 นาที → ติดต่อทีม stroke 15 นาที → ทำภาพถ่าย 25 นาที → แปลผล 45 นาที → เริ่มยาละลายลิ่มเลือด 60 นาที**\n\n**ปัจจัยที่ทำนายว่าจะได้ผลดี** — **รักษาเร็ว · อาการไม่รุนแรงมาก · อายุน้อย · ไม่มีความดันซิสโตลิกสูง · ระดับน้ำตาลปกติ**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ยกตารางข้อบ่งชี้และข้อห้ามเต็มหนึ่งหน้า **โดยแยกหัวข้อ contraindications กับ relative contraindications ออกจากกันชัดเจน**\n- สไลด์แยกการจัดการความดันเป็นสองหน้า คือ **ก่อนให้ยา (185/110)** กับ **ระหว่างและหลังให้ยา (180/105)** พร้อมขนาดยาละเอียด\n- สไลด์ให้ **door-to-needle 60 นาที** และตัวเลขย่อยทุกขั้นตอน ซึ่งเป็นตัวชี้วัดคุณภาพที่โรงพยาบาลใช้จริง\n", "pearls": ["rtPA ภายใน 3 ชม. (Class I A) และขยายถึง 4.5 ชม. (Class I B)", "Alteplase 0.9 mg/kg สูงสุด 90 mg — bolus 10% ใน 1 นาที ที่เหลือหยด 60 นาที", "ก่อนให้ยาคุมความดัน ≤ 185/110 · หลังให้คุม ≤ 180/105 · คุมไม่ได้คือห้ามให้", "เลือดออกใน CT และเนื้อตายเกิน 1 ใน 3 ของซีกสมอง = ข้อห้ามเด็ดขาด · ตั้งครรภ์ ชัก ผ่าตัดใน 14 วัน = สัมพัทธ์", "ปวดศีรษะรุนแรง อาเจียน ความดันพุ่ง หรืออาการแย่ลงระหว่างหยดยา = หยุดยาและส่ง CT ทันที", "รอ CT ซ้ำที่ 24 ชั่วโมงก่อนเริ่มยาต้านเกล็ดเลือดหรือยาต้านการแข็งตัวของเลือด"], "items": [{"id": "NEU-MCQ-11", "kind": "mcq", "stem": "A 61-year-old man arrives 90 minutes after the onset of right hemiparesis and aphasia. Computed tomography shows no haemorrhage and he has no other contraindication to thrombolysis. His blood pressure is persistently 196/118 mmHg. Which of the following is the most appropriate management?", "choices": ["Withhold alteplase permanently, because hypertension at this level is an absolute contraindication", "Give oral captopril and recheck the blood pressure in 1 hour before deciding", "Give alteplase immediately, since lowering blood pressure would reduce perfusion of the penumbra", "Lower the blood pressure to 185/110 mmHg or below with intravenous labetalol or nicardipine, then give alteplase", "Give alteplase at half the usual dose to reduce the risk of intracerebral haemorrhage"], "answer": 3, "explain": "**ไล่กลไก** — ความดันที่สูงมากขณะได้รับยาละลายลิ่มเลือด **เพิ่มความเสี่ยงของเลือดออกในสมองอย่างมีนัยสำคัญ** เพราะหลอดเลือดที่ผนังเสียหายจากการขาดเลือดอยู่แล้วต้องรับแรงดันสูงร่วมกับภาวะที่เลือดแข็งตัวยาก\n\n**เกณฑ์ที่สไลด์ให้ไว้**\n> **ถ้าผู้ป่วยเข้าเกณฑ์ทุกอย่างยกเว้นความดัน > 185/110 mmHg ให้ลดความดันก่อน ด้วย**\n> - **Labetalol 10−20 mg IV ช้า ๆ ใน 1−2 นาที ให้ซ้ำได้ 1 ครั้ง** หรือ\n> - **Nicardipine 5 mg/ชม. IV แล้วปรับเพิ่มครั้งละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n> - ยาอื่น เช่น hydralazine หรือ enalaprilat พิจารณาได้ตามความเหมาะสม\n>\n> **และถ้าคุมความดันให้อยู่ที่หรือต่ำกว่า 185/110 mmHg ไม่ได้ ห้ามให้ rtPA**\n\n**หลังให้ยาแล้วต้องคุมความดันไว้ที่หรือต่ำกว่า 180/105 mmHg**\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้ยาเลยโดยไม่ลดความดัน* — เหตุผลเรื่อง penumbra ถูกในกรณีทั่วไปของ stroke ที่ไม่ได้ให้ยาละลายลิ่มเลือด (ซึ่งยอมให้ความดันสูงได้) แต่ **เมื่อจะให้ rtPA เกณฑ์เปลี่ยนเป็น 185/110 เพราะความเสี่ยงเลือดออกมาก่อน**\n- *งดยาถาวรเพราะเป็นข้อห้ามเด็ดขาด* — สไลด์เขียนข้อห้ามข้อนี้ว่า **\"ความดันสูงที่ไม่สามารถลดลงได้อย่างปลอดภัย\"** คือเป็นข้อห้ามก็ต่อเมื่อ **ลดไม่ลง** ไม่ใช่ห้ามทันทีที่เห็นตัวเลขสูง\n- *ให้ captopril แล้วรอ 1 ชั่วโมง* — ยากินออกฤทธิ์ช้าและคาดเดาไม่ได้ และการรอหนึ่งชั่วโมงคือการเผาผลาญหน้าต่างเวลาทิ้งไป (**time is brain**)\n- *ให้ยาครึ่งขนาด* — ไม่มีหลักฐานรองรับ ได้ทั้งประสิทธิภาพที่ลดลงและความเสี่ยงที่ยังอยู่", "pearl": "ก่อนให้ rtPA ต้องคุมความดันให้ ≤ 185/110 · หลังให้แล้วคุม ≤ 180/105 · ลดไม่ลงคือห้ามให้", "topic": "Blood pressure threshold before thrombolysis", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.2.4", "B7.2.5(1)"]}, {"id": "NEU-MCQ-12", "kind": "mcq", "stem": "Which of the following is an ABSOLUTE contraindication to intravenous alteplase in a patient who is otherwise within 4.5 hours of stroke onset?", "choices": ["A National Institutes of Health Stroke Scale score above 25 in the 3- to 4.5-hour window", "Pregnancy", "Computed tomography showing hypodensity involving more than one-third of the cerebral hemisphere", "A seizure at the onset of symptoms", "Major surgery within the previous 14 days"], "answer": 2, "explain": "**หลักการ** — สไลด์แยกตารางเป็น **ข้อห้ามเด็ดขาด (contraindications)** กับ **ข้อห้ามสัมพัทธ์ (relative contraindications)** ซึ่งเป็นจุดที่ข้อสอบชอบสลับมาหลอก\n\n**ข้อห้ามเด็ดขาดตามสไลด์** — บาดเจ็บศีรษะรุนแรงใน 3 เดือน · อาการที่ชวนคิดถึงเลือดออกใต้เยื่อหุ้มสมอง · **เคยมีเลือดออกในสมองมาก่อน** · ผ่าตัดในกะโหลกหรือไขสันหลังใน 3 เดือน · เนื้องอกในสมอง · **เยื่อบุหัวใจอักเสบติดเชื้อ** · **หลอดเลือดเอออร์ตาส่วนโค้งฉีกขาด** · ความดันสูงที่ลดลงอย่างปลอดภัยไม่ได้ · มีเลือดออกภายในที่ยังไม่หยุด · ภาวะเลือดออกง่ายเฉียบพลัน (เกล็ดเลือด < 100,000 · ได้เฮปารินใน 48 ชม. ที่ aPTT ยาว · ได้ LMWH ขนาดรักษาใน 24 ชม. · INR > 1.7 หรือ PT > 15 วินาที · กำลังใช้ยาต้านทรอมบินหรือ factor Xa โดยตรง) · **CT พบเนื้อสมองตายเกินหนึ่งในสามของซีกสมอง** · **CT พบเลือดออกเฉียบพลัน**\n\n> **เหตุผลของข้อที่ถูก** — เนื้อสมองที่ตายไปแล้วเกินหนึ่งในสามของซีกสมอง แปลว่า **เนื้อเยื่อเสียหายกว้างและหลอดเลือดในบริเวณนั้นเปราะมาก** การให้ยาละลายลิ่มเลือดจึงมีความเสี่ยงเลือดออกสูงมากโดยแทบไม่เหลือ penumbra ให้กอบกู้\n\n**ทำไมตัวลวงจึงผิด — ทั้งสี่ข้อเป็นข้อห้าม \"สัมพัทธ์\" ทั้งหมด** คือชั่งน้ำหนักได้เป็นราย ๆ ไป\n- *การตั้งครรภ์* — สัมพัทธ์ ให้ชั่งประโยชน์กับความเสี่ยง\n- *ชักตอนเริ่มอาการ* — สัมพัทธ์ และสไลด์ระบุชัดว่า **\"พิจารณาให้ alteplase ได้ถ้าเชื่อว่าความบกพร่องทางประสาทเกิดจาก stroke จริง\"** ไม่ใช่จาก Todd's paresis\n- *NIHSS > 25 ในช่วง 3−4.5 ชั่วโมง* — สัมพัทธ์ (และเป็นข้อที่ระบุเฉพาะช่วงเวลาหลัง 3 ชั่วโมงเท่านั้น)\n- *ผ่าตัดใหญ่ใน 14 วัน* — สัมพัทธ์\n\n**ข้อห้ามสัมพัทธ์อื่นที่ควรจำ** — อาการเล็กน้อยไม่ก่อความพิการหรือกำลังดีขึ้นเร็ว · แทงหลอดเลือดแดงในตำแหน่งที่กดห้ามเลือดไม่ได้ใน 7 วัน · AVM หรือหลอดเลือดโป่งพองขนาดใหญ่ที่ยังไม่ได้รักษา · เลือดออกทางเดินอาหารหรือทางเดินปัสสาวะใน 21 วัน · **stroke ขาดเลือดใน 3 เดือน** · **กล้ามเนื้อหัวใจตายชนิด ST ยกใน 3 เดือน** · **น้ำตาลในเลือด < 50 mg/dL**", "pearl": "CT ที่มีเนื้อสมองตายเกินหนึ่งในสามของซีกสมอง หรือมีเลือดออก = ข้อห้ามเด็ดขาด · ตั้งครรภ์ ชักตอนเริ่ม และผ่าตัดใน 14 วัน เป็นข้อห้ามสัมพัทธ์", "topic": "Absolute contraindication to alteplase", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20", "B7.2.6-3(1)"]}, {"id": "NEU-MCQ-13", "kind": "mcq", "stem": "A 70 kg man with acute ischaemic stroke is eligible for intravenous alteplase. Which of the following dosing regimens is correct?", "choices": ["0.9 mg/kg given entirely as a bolus over 1 minute, to a maximum of 90 mg", "100 mg infused over 90 minutes regardless of body weight", "0.9 mg/kg, with 10% given as a bolus over 1 minute and the remainder infused over 60 minutes, to a maximum of 90 mg", "1.5 mg/kg, with 20% as a bolus and the remainder infused over 30 minutes", "0.25 mg/kg as a single bolus, to a maximum of 25 mg"], "answer": 2, "explain": "**ขนาดยาที่ต้องจำ**\n> **Alteplase 0.9 mg/kg ขนาดสูงสุด 90 mg** โดย **ให้ 10% ของขนาดทั้งหมดเป็น bolus ใน 1 นาที แล้วหยดส่วนที่เหลือใน 60 นาที**\n\nผู้ป่วยหนัก 70 กก. → **ขนาดรวม 63 mg** → **bolus 6.3 mg ใน 1 นาที แล้วหยด 56.7 mg ใน 60 นาที**\n\n**สิ่งที่ต้องทำควบคู่ตามสไลด์**\n- **รับไว้ใน ICU หรือหอผู้ป่วย stroke เพื่อเฝ้าระวัง**\n- **วัดความดันและประเมินอาการทางประสาททั้งระหว่างและหลังให้ยา** — **ทุก 15 นาที นาน 2 ชั่วโมง → ทุก 30 นาที นาน 6 ชั่วโมง → ทุก 1 ชั่วโมงจนครบ 24 ชั่วโมง**\n- **คุมความดันไว้ที่หรือต่ำกว่า 180/105 mmHg**\n- **เลื่อนการใส่สายให้อาหารทางจมูก สายสวนปัสสาวะ และสายวัดความดันในหลอดเลือดแดงออกไปก่อน ถ้าดูแลผู้ป่วยได้อย่างปลอดภัยโดยไม่ใช้**\n- **ทำ CT หรือ MRI ซ้ำที่ 24 ชั่วโมงก่อนเริ่มยาต้านการแข็งตัวของเลือดหรือยาต้านเกล็ดเลือด**\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้ทั้งหมดเป็น bolus* — ทำให้ระดับยาพุ่งสูงเกินและเพิ่มความเสี่ยงเลือดออกอย่างมาก\n- *1.5 mg/kg* — เป็นขนาดที่สูงเกินไป (ขนาดที่ใช้ในลิ่มเลือดอุดกั้นปอดต่างออกไปและไม่ใช้กับ stroke)\n- *100 mg คงที่ไม่คิดตามน้ำหนัก* — ขัดกับหลักการคิดตามน้ำหนักและเกินขนาดสูงสุด 90 mg\n- *0.25 mg/kg สูงสุด 25 mg เป็น bolus เดียว* — เป็นขนาดของ **tenecteplase** ไม่ใช่ alteplase · สไลด์ระบุว่า tenecteplase **ให้เป็น IV bolus ครั้งเดียว และมีประสิทธิภาพและความปลอดภัยใกล้เคียงกับ alteplase** ทั้งอัตราผลลัพธ์ทางการทำงานที่ดีเยี่ยม อัตราเลือดออกในสมองที่มีอาการ และอัตราตายที่ 90 วัน — ข้อนี้จึงเป็นตัวลวงที่ดี เพราะเป็นยาจริงแต่ผิดตัว", "pearl": "Alteplase 0.9 mg/kg สูงสุด 90 mg — bolus 10% ใน 1 นาที ที่เหลือหยด 60 นาที · tenecteplase คือ 0.25 mg/kg สูงสุด 25 mg bolus เดียว", "topic": "Alteplase dosing", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6"]}, {"id": "NEU-MCQ-14", "kind": "mcq", "stem": "Thirty minutes into an alteplase infusion, a patient develops a severe headache, acute hypertension and vomiting, and his National Institutes of Health Stroke Scale score rises by 4 points. Which of the following is the most appropriate immediate action?", "choices": ["Stop the infusion and give aspirin 300 mg immediately", "Continue the infusion and give intravenous mannitol for presumed cerebral oedema", "Continue the infusion but slow the rate by half and recheck in 30 minutes", "Continue the infusion and give an antiemetic and analgesia", "Stop the infusion and obtain an emergency computed tomography scan of the brain"], "answer": 4, "explain": "**ไล่กลไก** — อาการชุดนี้คือ **สัญญาณเตือนของเลือดออกในสมองที่มีอาการ (symptomatic intracerebral haemorrhage)** ซึ่งเป็นภาวะแทรกซ้อนที่ร้ายแรงที่สุดของยาละลายลิ่มเลือด ยาที่กำลังหยดอยู่จะ **ทำให้เลือดที่ออกอยู่ขยายตัวต่อไปเรื่อย ๆ** ทุกนาทีที่ปล่อยให้ไหลต่อ\n\n**สไลด์ระบุไว้ตรงตัว** — **\"ถ้าผู้ป่วยเกิดปวดศีรษะรุนแรง ความดันสูงเฉียบพลัน คลื่นไส้ อาเจียน หรือการตรวจทางประสาทแย่ลง → หยุดการหยดยา (ถ้ากำลังให้ IV rtPA อยู่) และส่ง CT ฉุกเฉิน\"**\n\n**ลำดับที่ทำจริง** — หยุดยา → ส่ง CT ทันที → ส่งเลือดตรวจการแข็งตัวและกรุ๊ปเลือด → ถ้ายืนยันว่ามีเลือดออก ให้แก้ภาวะเลือดออกด้วย **cryoprecipitate หรือ fibrinogen concentrate และยาต้านการสลายลิ่มเลือด** พร้อมปรึกษาประสาทศัลยแพทย์\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้ยาต่อพร้อมยาแก้อาเจียนและยาแก้ปวด* — เป็นการรักษาตามอาการโดยไม่สนสาเหตุ และปล่อยให้เลือดออกมากขึ้น เป็นตัวเลือกที่อันตรายที่สุด\n- *ลดอัตราการหยดลงครึ่งหนึ่งแล้วรอดู* — การชะลอไม่ได้หยุดความเสี่ยง และ **การรอ 30 นาทีในภาวะเลือดออกในสมองคือเวลาที่เสียไปโดยเปล่าประโยชน์**\n- *หยุดยาแล้วให้แอสไพริน* — หยุดยาถูก แต่การให้ยาต้านเกล็ดเลือดทับเข้าไปขณะสงสัยเลือดออก **ทำให้เลือดออกมากขึ้นอีก** · สไลด์ระบุว่าต้องรอ **CT หรือ MRI ซ้ำที่ 24 ชั่วโมงก่อนเริ่มยาต้านเกล็ดเลือดหรือยาต้านการแข็งตัวของเลือด**\n- *ให้ mannitol โดยสันนิษฐานว่าสมองบวม* — เป็นการเดาสาเหตุโดยไม่ยืนยัน และไม่ได้จัดการกับยาที่ยังไหลเข้าร่างกายอยู่", "pearl": "ระหว่างหยด rtPA ถ้าปวดศีรษะรุนแรง อาเจียน ความดันพุ่ง หรืออาการแย่ลง — หยุดยาทันทีและส่ง CT ฉุกเฉิน", "topic": "Neurological deterioration during alteplase infusion", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20"]}, {"id": "NEU-MCQ-20", "kind": "mcq", "stem": "Twelve hours after receiving alteplase, a patient's National Institutes of Health Stroke Scale score has risen from 12 to 19 and he has become drowsy. Repeat computed tomography shows blood within the infarcted territory with mass effect. Which of the following is the most appropriate next step?", "choices": ["Stop all antithrombotic agents, correct the coagulopathy with cryoprecipitate or fibrinogen concentrate, and consult neurosurgery", "Give aspirin 300 mg and observe on the ward", "Give intravenous heparin to prevent further clot propagation", "Repeat the alteplase infusion because the vessel has probably re-occluded", "Start mannitol alone and repeat imaging in 24 hours"], "answer": 0, "explain": "**ไล่กลไก** — เนื้อสมองที่ขาดเลือดจะมี **ผนังหลอดเลือดและ blood-brain barrier ที่เสียหาย** เมื่อเลือดไหลกลับเข้ามา (ไม่ว่าจะเปิดเองหรือจากยา) เลือดจะ **ซึมออกนอกหลอดเลือดเข้าสู่เนื้อที่ตายแล้ว** เรียกว่า **haemorrhagic transformation** · ยาละลายลิ่มเลือดเพิ่มความเสี่ยงนี้เพราะทำให้ระบบห้ามเลือดทำงานไม่ได้ชั่วคราว\n\n**สัญญาณที่ต้องสงสัย** — **อาการทางประสาทแย่ลง ซึมลง ปวดศีรษะรุนแรง อาเจียน หรือความดันพุ่ง** — สไลด์ระบุให้ **หยุดหยดยาและส่ง CT ฉุกเฉิน** ทันทีที่พบ\n\n**การรักษาเมื่อยืนยันแล้ว**\n1. **หยุดยาต้านลิ่มเลือดทุกชนิด**\n2. **แก้ภาวะเลือดแข็งตัวไม่ได้** — **cryoprecipitate หรือ fibrinogen concentrate** (เพราะ alteplase ทำให้ไฟบริโนเจนต่ำ) ร่วมกับ **ยาต้านการสลายลิ่มเลือด** เช่น tranexamic acid\n3. **ส่งเลือดตรวจการแข็งตัว ไฟบริโนเจน และจองเลือด**\n4. **คุมความดันและความดันในกะโหลก · ปรึกษาประสาทศัลยแพทย์**\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้เฮปาริน* และ *ให้แอสไพริน* — เติมยาต้านลิ่มเลือดทับเข้าไปขณะที่กำลังเลือดออก ทำให้เลือดออกมากขึ้น เป็นสองตัวเลือกที่อันตรายที่สุด\n- *ให้ alteplase ซ้ำ* — ตรงข้ามกับสิ่งที่ต้องทำโดยสิ้นเชิง\n- *ให้ mannitol อย่างเดียวแล้วรอ 24 ชั่วโมง* — mannitol ช่วยลดสมองบวมได้จริง แต่ **ไม่ได้แก้ภาวะเลือดแข็งตัวไม่ได้ที่ทำให้เลือดยังออกต่อ** การรอ 24 ชั่วโมงในภาวะนี้ช้าเกินไป", "pearl": "อาการแย่ลงหลัง rtPA = สงสัยเลือดออกแทรก — หยุดยาต้านลิ่มเลือด แก้การแข็งตัวด้วย cryoprecipitate และปรึกษาศัลยแพทย์", "topic": "Haemorrhagic transformation after thrombolysis", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20"]}]}, {"id": "neuro-07-10", "title": "การลากลิ่มเลือด การดูแลทั่วไป และการป้องกันการเป็นซ้ำ", "minutes": 9, "summary": "ใครควรได้สายสวน และหลังพ้นวิกฤตต้องทำอะไรต่อ", "source": "สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)", "nl": ["2.3.9-3(3)", "2.3.9(1)", "2.3.9(4)", "2.3.6"], "md": "### Mechanical thrombectomy — การลากลิ่มเลือดออกด้วยสายสวน\n> **ผู้ที่เหมาะสมตามสไลด์ — ผู้ป่วย stroke ขาดเลือดที่เกิดจากการอุดตันของหลอดเลือดแดงใหญ่ส่วนต้นในระบบไหลเวียนด้านหน้า (proximal large artery occlusion in the anterior circulation)**\n\n**เหตุผล** — **ยาละลายลิ่มเลือดทางหลอดเลือดดำเปิดลิ่มเลือดขนาดใหญ่ได้ไม่ดีนัก** การใช้สายสวนไปลากลิ่มเลือดออกโดยตรงจึงได้อัตราการเปิดหลอดเลือดสูงกว่ามากในกลุ่มนี้\n\n**องค์ประกอบที่ใช้ตัดสินใจ**\n| ข้อมูล | ที่มา |\n|---|---|\n| **สงสัย LVO ทางคลินิก** | **ตาเบน/ลานสายตาผิดปกติ · เรียกชื่อสิ่งของไม่ได้ · neglect** · NIHSS สูง · OCSP แบบ **TACI** |\n| **ยืนยันตำแหน่งที่อุด** | **CTA** |\n| **ขนาดของเนื้อตาย** | **ASPECTS** |\n| **เวลา** | **ถึง 24 ชั่วโมง** ในผู้ป่วยที่คัดเลือกด้วยภาพถ่าย |\n\n> **การให้ rtPA ไม่ได้ตัดสิทธิ์การลากลิ่มเลือด** — ผู้ป่วยที่เข้าเกณฑ์ทั้งคู่ให้ **rtPA ก่อนแล้วส่งลากลิ่มเลือดต่อ** ตามที่สไลด์ระบุไว้ในกล่อง **\"IV rtPA + Mechanical thrombectomy\"**\n\n### การดูแลทั่วไปของ stroke เฉียบพลัน\nสไลด์แบ่งเป็น **general management** กับ **specific management**\n\n**General management — สี่เรื่องที่ต้องคุม**\n| เรื่อง | หลักการ |\n|---|---|\n| **ทางเดินหายใจและออกซิเจน** | **ให้ออกซิเจนเมื่อ SpO₂ < 94%** · หลีกเลี่ยงการทำให้หายใจเร็วเกิน |\n| **ความดันโลหิต** | **ในผู้ที่จะได้ยาละลายลิ่มเลือด คุมตามเกณฑ์ 185/110 และ 180/105** · **ในผู้ที่ไม่ได้ยา ยอมให้ความดันสูงได้มากกว่า** เพราะการลดความดันเร็วเกินทำให้เลือดไปเลี้ยง penumbra ผ่านหลอดเลือดข้างเคียงลดลง · **และต้องไม่ปล่อยให้ความดันต่ำด้วย** |\n| **ระดับน้ำตาล** | คุมไม่ให้สูงหรือต่ำเกิน — **ทั้งสองขั้วทำให้ผลลัพธ์แย่ลง** |\n| **ไข้** | **ลดไข้** เพราะอุณหภูมิที่สูงเร่งการตายของเซลล์ในบริเวณ penumbra |\n\n**Specific management** — **การเปิดหลอดเลือด (reperfusion therapy)** และ **การดูแลในหอผู้ป่วย stroke (stroke unit)**\n\n> **การรับไว้ในหอผู้ป่วย stroke เป็นการรักษาที่มีหลักฐานชัดเจนว่าลดการเสียชีวิตและความพิการ** แม้ในผู้ป่วยที่ไม่ได้รับยาละลายลิ่มเลือด เพราะได้การเฝ้าระวัง การประเมินการกลืน การป้องกันภาวะแทรกซ้อน และการฟื้นฟูสมรรถภาพอย่างเป็นระบบ\n\n### การป้องกันการเป็นซ้ำ — เลือกตาม TOAST\n| กลไก | การป้องกันหลัก |\n|---|---|\n| **Cardioembolism (โดยเฉพาะ AF)** | **ยาต้านการแข็งตัวของเลือดชนิดกิน** |\n| **Large artery atherosclerosis** | **ยาต้านเกล็ดเลือด + statin ขนาดสูง** · พิจารณา **ผ่าตัดลอกคราบไขมันหลอดเลือด carotid** เมื่อตีบมากและมีอาการ |\n| **Small vessel disease** | **ยาต้านเกล็ดเลือด + คุมความดันอย่างเข้มงวด** |\n\n**จังหวะเวลาที่เริ่มยาต้านลิ่มเลือด** — ต้องพ้นความเสี่ยงของ **เลือดออกแทรกในเนื้อสมองที่เพิ่งตาย** ก่อน **ยิ่งเนื้อตายใหญ่ ยิ่งต้องรอนาน** และถ้าเพิ่งได้ rtPA **ต้องทำ CT ซ้ำที่ 24 ชั่วโมงก่อนเสมอ**\n\n**สิ่งที่ต้องทำควบคู่ทุกราย**\n- **คุมความดันโลหิตระยะยาว** — ปัจจัยเสี่ยงที่แก้ไขได้และสำคัญที่สุดของ stroke ทุกชนิด\n- **คุมเบาหวานและไขมันในเลือด · หยุดสูบบุหรี่**\n- **ประเมินการกลืนก่อนให้อาหารทางปาก** เพื่อป้องกันปอดอักเสบจากการสำลัก\n- **เริ่มฟื้นฟูสมรรถภาพเร็ว** และวางแผนปลายทางตาม NIHSS\n- **ป้องกันภาวะแทรกซ้อน** — หลอดเลือดดำอุดตัน แผลกดทับ ภาวะซึมเศร้าหลัง stroke\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์วาง **step approach ทั้งสี่ขั้นซ้ำอีกครั้งก่อนเข้าเรื่องการรักษา** โดยกล่องสุดท้ายคือ **Prevention ที่ผูกกับ TOAST classification** — เป็นการย้ำว่าการรักษาเฉียบพลันกับการป้องกันเป็นคนละเรื่องที่ต้องทำทั้งคู่\n- สไลด์แสดงแถบเวลาของ **reperfusion management** เป็นสามช่วงคือ **ภายใน 4.5 ชั่วโมง · 4.5−6 ชั่วโมง · 6−24 ชั่วโมง** ซึ่งสะท้อนว่าทางเลือกเปลี่ยนไปตามเวลา\n- สไลด์ระบุ general management ไว้สี่ข้อคือ **ทางเดินหายใจและออกซิเจน · ความดันสูงหรือต่ำ · การคุมน้ำตาล · ไข้**\n", "pearls": ["ลากลิ่มเลือดสำหรับการอุดหลอดเลือดใหญ่ส่วนต้นของระบบไหลเวียนด้านหน้า ได้ถึง 24 ชั่วโมงในผู้ที่คัดเลือกด้วยภาพถ่าย", "ได้ rtPA แล้วยังส่งลากลิ่มเลือดต่อได้ ไม่ใช่ทางเลือกที่ตัดกัน", "ผู้ที่ไม่ได้ยาละลายลิ่มเลือด ยอมให้ความดันสูงได้มากกว่า เพราะต้องรักษาเลือดที่ไปเลี้ยง penumbra", "คุมไข้และน้ำตาลด้วย — ทั้งสองอย่างทำให้ผลลัพธ์แย่ลง", "หอผู้ป่วย stroke ลดการเสียชีวิตและความพิการได้แม้ในผู้ที่ไม่ได้รับยาละลายลิ่มเลือด", "ประเมินการกลืนก่อนให้อาหารทางปากทุกราย"], "items": [{"id": "NEU-MCQ-15", "kind": "mcq", "stem": "A 64-year-old woman presents 5 hours after the onset of a dense left hemiparesis, left neglect and a forced gaze to the right. Her National Institutes of Health Stroke Scale score is 18. Non-contrast computed tomography shows no haemorrhage with an ASPECTS of 8, and computed tomography angiography shows occlusion of the right middle cerebral artery M1 segment. She is outside the window for intravenous thrombolysis. Which of the following is the most appropriate management?", "choices": ["Give intravenous alteplase anyway, since the deficit is severe", "Give aspirin 300 mg and admit to the stroke unit without further intervention", "Lower the blood pressure aggressively to reduce the risk of haemorrhagic transformation", "Refer urgently for mechanical thrombectomy", "Start full-dose anticoagulation with intravenous heparin to prevent clot propagation"], "answer": 3, "explain": "**ไล่กลไก** — การอุดตันของหลอดเลือดใหญ่ส่วนต้น (**large vessel occlusion, LVO**) ทำให้เนื้อสมองบริเวณกว้างขาดเลือด และ **ยาละลายลิ่มเลือดทางหลอดเลือดดำเปิดลิ่มเลือดขนาดใหญ่ได้ไม่ดีนัก** การลากลิ่มเลือดออกด้วยสายสวนจึงเป็นการรักษาที่ได้ผลกว่าในกลุ่มนี้\n\n**สไลด์ระบุผู้ที่เหมาะสมว่า** — **ผู้ป่วย stroke ขาดเลือดที่เกิดจากการอุดตันของหลอดเลือดแดงใหญ่ส่วนต้นในระบบไหลเวียนด้านหน้า (proximal large artery occlusion in the anterior circulation)**\n\n**ผู้ป่วยรายนี้เข้าเกณฑ์ทุกข้อ**\n- **มีสัญญาณของ LVO ทางคลินิกครบ** ตามที่สไลด์ใช้คัดกรอง — **ตาเบนไปข้างหนึ่ง/ลานสายตาผิดปกติ · เรียกชื่อสิ่งของไม่ได้ · ไม่สนใจร่างกายด้านหนึ่ง (neglect)** — รายนี้มี neglect ซ้ายและตาเบนไปขวา\n- **NIHSS 18 คือระดับรุนแรง**\n- **ยืนยัน M1 occlusion ด้วย CTA แล้ว**\n- **ASPECTS 8 คือ core ยังเล็ก มี penumbra ให้กอบกู้**\n- **ยังอยู่ในกรอบเวลา** — แผนภาพเวลาในสไลด์ระบุว่าการลากลิ่มเลือดทำได้ **ถึง 24 ชั่วโมง** ในผู้ป่วยที่คัดเลือกแล้ว ขณะที่ rtPA จำกัดที่ 4.5 ชั่วโมง\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้ rtPA ทั้งที่พ้นเวลาแล้ว* — ความรุนแรงของอาการไม่ได้ขยายหน้าต่างเวลา และการให้ยานอกกรอบเวลาเพิ่มความเสี่ยงเลือดออกโดยไม่มีประโยชน์ที่พิสูจน์แล้ว\n- *ให้แอสไพรินแล้วนอนโรงพยาบาลเฉย ๆ* — เป็นการละทิ้งโอกาสเปิดหลอดเลือดในผู้ป่วยที่เข้าเกณฑ์ชัดเจน ซึ่งเปลี่ยนผลลัพธ์ได้มาก\n- *ให้เฮปารินขนาดรักษา* — **ไม่มีที่ใช้ในระยะเฉียบพลันของ stroke ขาดเลือดทั่วไป** และเพิ่มความเสี่ยงเลือดออกแทรกในเนื้อสมองที่เพิ่งตาย\n- *ลดความดันอย่างเข้มงวด* — ในผู้ป่วยที่ **ยังไม่ได้เปิดหลอดเลือด** การลดความดันมากเกินไปทำให้เลือดไปเลี้ยง penumbra ผ่านหลอดเลือดข้างเคียงลดลงและเนื้อตายขยายตัว", "pearl": "อาการรุนแรง + สัญญาณ LVO (ตาเบน neglect เรียกชื่อไม่ได้) + CTA พบ M1 อุด + ASPECTS ดี = ส่งลากลิ่มเลือด ได้ถึง 24 ชั่วโมง", "topic": "Mechanical thrombectomy – patient selection", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20", "2.3.6"]}, {"id": "NEU-MCQ-18", "kind": "mcq", "stem": "A 74-year-old woman has a cortical infarct in the right middle cerebral artery territory. Electrocardiography and telemetry show persistent atrial fibrillation. Her computed tomography at 24 hours shows no haemorrhagic transformation and the infarct is small. Which of the following is the most appropriate secondary prevention?", "choices": ["No antithrombotic therapy, because the risk of haemorrhagic transformation is too high", "Aspirin alone, lifelong", "Dual antiplatelet therapy with aspirin and clopidogrel, lifelong", "Oral anticoagulation", "Carotid endarterectomy"], "answer": 3, "explain": "**หลักการ** — สไลด์วางขั้นตอนสุดท้ายของการดูแล stroke ไว้ว่า **การป้องกันการเป็นซ้ำต้องเลือกตาม TOAST classification** คือ **รู้กลไกก่อน แล้วจึงเลือกยา**\n\n**จับคู่กลไกกับการป้องกัน**\n\n| กลไก (TOAST) | การป้องกันหลัก |\n|---|---|\n| **Cardioembolism (โดยเฉพาะ AF)** | **ยาต้านการแข็งตัวของเลือดชนิดกิน** |\n| **Large artery atherosclerosis** | **ยาต้านเกล็ดเลือด + statin ขนาดสูง + คุมปัจจัยเสี่ยง** · พิจารณา **ผ่าตัดลอกคราบไขมันหลอดเลือด carotid** เมื่อตีบมากและมีอาการ |\n| **Small vessel disease** | **ยาต้านเกล็ดเลือด + คุมความดันอย่างเข้มงวด** |\n\n**ทำไมข้อที่ถูกจึงถูก** — ลิ่มเลือดใน AF เกิดจาก **เลือดคั่งนิ่งใน left atrial appendage** ซึ่งเป็นการแข็งตัวของเลือดผ่านระบบ **coagulation cascade ไม่ใช่การเกาะกลุ่มของเกล็ดเลือด** ยาต้านเกล็ดเลือดจึงป้องกันได้ไม่ดี ขณะที่ **ยาต้านการแข็งตัวของเลือดลดการเป็นซ้ำได้ราวสองในสาม**\n\n**เรื่องจังหวะเวลา** — ต้องรอให้พ้นความเสี่ยงของ **การมีเลือดออกแทรกในเนื้อสมองที่เพิ่งตาย** ก่อน โดยทั่วไป **ยิ่งเนื้อตายใหญ่ ยิ่งต้องรอนาน** ผู้ป่วยรายนี้ **รอยโรคเล็ก และ CT ที่ 24 ชั่วโมงไม่มีเลือดออก** จึงเริ่มได้ · สไลด์ระบุหลักการเดียวกันว่า **ต้องทำ CT หรือ MRI ซ้ำที่ 24 ชั่วโมงหลัง rtPA ก่อนเริ่มยาต้านการแข็งตัวของเลือดหรือยาต้านเกล็ดเลือด**\n\n**ทำไมตัวลวงจึงผิด**\n- *แอสไพรินอย่างเดียวตลอดชีวิต* — ด้อยกว่ายาต้านการแข็งตัวของเลือดอย่างชัดเจนใน stroke จาก AF\n- *ยาต้านเกล็ดเลือดสองตัวตลอดชีวิต* — ใช้ได้เพียง **ระยะสั้น** ในบางบริบทของ stroke จากหลอดเลือดแข็ง และ **การใช้ยาวเพิ่มความเสี่ยงเลือดออกโดยไม่เพิ่มประโยชน์** ทั้งยังไม่ตรงกับกลไกของรายนี้\n- *ผ่าตัดลอกคราบไขมันหลอดเลือด carotid* — ใช้กับ **การตีบของ carotid ที่มีอาการ** ไม่ใช่ AF และโจทย์ไม่มีหลักฐานว่า carotid ตีบ\n- *ไม่ให้ยาต้านลิ่มเลือดเลย* — ปล่อยให้ผู้ป่วยเสี่ยงต่อการเป็นซ้ำสูงมาก และเหตุผลเรื่องเลือดออกแทรกไม่สมเหตุสมผลเมื่อ **รอยโรคเล็กและ CT ที่ 24 ชั่วโมงสะอาด**", "pearl": "เลือกการป้องกันตามกลไก — AF ให้ยาต้านการแข็งตัวของเลือด · หลอดเลือดแข็งให้ยาต้านเกล็ดเลือดกับ statin", "topic": "Secondary prevention by stroke mechanism", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.9(1)", "B7.2.5(5)"]}, {"id": "NEU-MCQ-21", "kind": "mcq", "stem": "A 52-year-old woman with a complete left middle cerebral artery infarct becomes progressively drowsy on day 2. Computed tomography shows infarction of more than two-thirds of the middle cerebral artery territory with 8 mm of midline shift. Which intervention has been shown to reduce mortality in this situation?", "choices": ["Therapeutic hypothermia to 32 degrees Celsius", "Prophylactic antiepileptic drugs", "Intravenous alteplase given late", "High-dose intravenous corticosteroids", "Decompressive hemicraniectomy"], "answer": 4, "explain": "**ไล่กลไก** — เนื้อสมองที่ตายเป็นบริเวณกว้างจะ **บวมมากที่สุดในวันที่ 2−5** กะโหลกเป็นกล่องแข็งที่ขยายไม่ได้ ความดันในกะโหลกจึงพุ่งขึ้น ดัน **เนื้อสมองเคลื่อนข้ามแนวกลางและเลื่อนลงกดก้านสมอง (herniation)** ซึ่งเป็นสาเหตุการเสียชีวิต ไม่ใช่ตัว stroke เอง · เรียกภาวะนี้ว่า **malignant MCA infarction** อัตราตายถ้ารักษาแบบประคับประคองอย่างเดียวสูงราว 80%\n\n**การผ่าตัดเปิดกะโหลกลดความดัน (decompressive hemicraniectomy)** คือการ **เอากระดูกกะโหลกออกเพื่อให้สมองที่บวมมีที่ขยาย** จึงแก้ปัญหาที่ต้นเหตุเชิงกลไกโดยตรง **ลดอัตราตายได้อย่างชัดเจน** และได้ประโยชน์มากที่สุดเมื่อ **ทำเร็ว (ภายใน 48 ชั่วโมง) และในผู้ป่วยอายุน้อย**\n\n> **ประเด็นที่ต้องคุยกับญาติ — การผ่าตัดลดการเสียชีวิต แต่ผู้รอดชีวิตจำนวนหนึ่งยังมีความพิการอยู่** จึงเป็นการตัดสินใจร่วมกัน ไม่ใช่การผ่าตัดอัตโนมัติ\n\n**ทำไมตัวลวงจึงผิด**\n- *สเตียรอยด์ขนาดสูง* — **ไม่มีประโยชน์ในสมองบวมจาก stroke** (ต่างจากสมองบวมรอบเนื้องอกซึ่งเป็น vasogenic edema ที่ตอบสนองดี) และเพิ่มการติดเชื้อกับน้ำตาลสูง\n- *ลดอุณหภูมิร่างกาย* — ยังไม่มีหลักฐานว่าลดอัตราตายใน stroke และมีภาวะแทรกซ้อนมาก · สิ่งที่ทำจริงคือ **ลดไข้ไม่ให้สูง** ตามที่สไลด์ระบุใน general management\n- *ให้ alteplase ช้า* — พ้นหน้าต่างเวลาไปแล้ว และในเนื้อสมองที่ตายกว้างขนาดนี้ **CT ที่มีเนื้อตายเกินหนึ่งในสามของซีกสมองเป็นข้อห้ามเด็ดขาด**\n- *ให้ยากันชักป้องกัน* — **ไม่แนะนำให้ป้องกันในผู้ที่ยังไม่เคยชัก** และไม่ได้แก้ปัญหาสมองบวม", "pearl": "Malignant MCA infarction ตายจากสมองบวมและ herniation — การผ่าตัดเปิดกะโหลกลดความดันลดอัตราตาย ส่วนสเตียรอยด์ไม่ช่วย", "topic": "Malignant middle cerebral artery infarction", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20", "2.3.6"]}, {"id": "NEU-MCQ-22", "kind": "mcq", "stem": "A 70-year-old man had a right hemispheric transient ischaemic attack 5 days ago and has recovered fully. Carotid duplex and computed tomography angiography show 80 percent stenosis of the right internal carotid artery. He is otherwise fit for surgery. Which of the following is the most appropriate management?", "choices": ["Carotid endarterectomy deferred for 6 months to allow the plaque to stabilise", "Immediate bilateral carotid endarterectomy regardless of which side caused symptoms", "Carotid endarterectomy within the next 2 weeks, in addition to antiplatelet therapy and a statin", "Lifelong warfarin instead of antiplatelet therapy", "Medical therapy alone, because endarterectomy is only indicated for asymptomatic stenosis"], "answer": 2, "explain": "**ไล่กลไก** — คราบไขมันที่ **ตีบมากและเพิ่งทำให้เกิดอาการ** คือคราบที่ **ผิวแตกและมีลิ่มเลือดเกาะอยู่** จึงพร้อมจะปล่อยเศษหลุดไปอุดสมองซ้ำได้ทุกเมื่อ · **ความเสี่ยงต่อ stroke ซ้ำสูงที่สุดในสองสัปดาห์แรกหลังมีอาการ** การผ่าตัดลอกคราบไขมันออกจึงต้องทำเร็ว\n\n> **หลักที่ต้องจำ — ยิ่งเร็วยิ่งได้ประโยชน์** โดยทั่วไปแนะนำ **ภายใน 2 สัปดาห์หลังมีอาการ** ในผู้ป่วยที่อาการคงที่แล้ว และ **ประโยชน์ชัดเจนที่สุดเมื่อตีบ 70−99% และมีอาการในด้านเดียวกับที่ตีบ**\n\n**ต้องทำควบคู่เสมอ** — **ยาต้านเกล็ดเลือด · statin ขนาดสูง · คุมความดันและเบาหวาน · หยุดสูบบุหรี่** เพราะการผ่าตัดแก้ได้เฉพาะจุดเดียว แต่โรคหลอดเลือดแข็งอยู่ทั่วร่างกาย\n\n**ทำไมตัวลวงจึงผิด**\n- *รักษาด้วยยาอย่างเดียว เพราะผ่าตัดใช้เฉพาะรายที่ไม่มีอาการ* — **กลับด้านโดยสิ้นเชิง** กลุ่มที่ได้ประโยชน์ชัดเจนที่สุดคือ **กลุ่มที่มีอาการ** ส่วนกลุ่มไม่มีอาการประโยชน์น้อยกว่ามากและยังเป็นที่ถกเถียง\n- *เลื่อนไป 6 เดือน* — ปล่อยให้ผู้ป่วยผ่านช่วงที่เสี่ยงที่สุดไปโดยไม่ได้แก้ต้นเหตุ\n- *ให้ warfarin แทนยาต้านเกล็ดเลือด* — กลไกคือ **คราบไขมันกับเกล็ดเลือด** ไม่ใช่เลือดคั่งนิ่งแบบใน AF ยาต้านการแข็งตัวของเลือดจึงไม่ได้เหนือกว่าและเพิ่มความเสี่ยงเลือดออก\n- *ผ่าตัดสองข้างพร้อมกัน* — เพิ่มความเสี่ยงอย่างมากโดยไม่จำเป็น **ผ่าข้างที่เป็นต้นเหตุของอาการก่อน**", "pearl": "Carotid ตีบ 70−99% และมีอาการข้างเดียวกัน = ผ่าตัดภายใน 2 สัปดาห์ ควบคู่กับยาต้านเกล็ดเลือดและ statin", "topic": "Symptomatic carotid stenosis", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.9(3)", "B7.2.5(6)"]}, {"id": "NEU-MCQ-24", "kind": "mcq", "stem": "A 75-year-old woman admitted with an acute middle cerebral artery infarct is alert but has slurred speech. Her daughter asks whether she can have her usual breakfast. Which of the following is the most appropriate action before allowing oral intake?", "choices": ["Allow thickened fluids only, without any swallowing assessment", "Insert a nasogastric tube in all stroke patients on admission", "Allow a normal diet, since she is alert and able to follow commands", "Delay all oral intake for 7 days regardless of swallowing ability", "Perform a bedside swallowing screen, and keep her nil by mouth until it is passed"], "answer": 4, "explain": "**ไล่กลไก** — การกลืนอาศัยการทำงานประสานของเส้นประสาทสมองหลายคู่และเปลือกสมองทั้งสองซีก **stroke จึงทำให้กลืนผิดปกติได้บ่อยมาก แม้ผู้ป่วยจะรู้สึกตัวดีและพูดคุยได้** · ที่อันตรายคือ **silent aspiration** คือสำลักโดยไม่ไอ เพราะการรับความรู้สึกที่คอหอยเสียไปด้วย ผู้ป่วยจึงไม่แสดงอาการให้เห็น\n\n**ผลที่ตามมาคือ ปอดอักเสบจากการสำลัก** ซึ่งเป็น **สาเหตุการเสียชีวิตที่พบบ่อยที่สุดในช่วงหลังของการนอนโรงพยาบาลด้วย stroke** และเป็นภาวะแทรกซ้อนที่ป้องกันได้\n\n> สไลด์จึงระบุไว้ในรายการดูแลเบื้องต้นว่า **\"งดน้ำงดอาหารทางปาก\"** ตั้งแต่ก่อนส่งทำภาพถ่าย และให้เริ่มกินได้เมื่อ **ผ่านการประเมินการกลืนแล้วเท่านั้น**\n\n**การประเมินข้างเตียง** — ดูระดับความรู้สึกตัว ความสามารถในการนั่ง การควบคุมน้ำลาย เสียงพูดเปลี่ยนหลังกลืน แล้วทดสอบกลืนน้ำปริมาณน้อยภายใต้การเฝ้าดู · ถ้าไม่ผ่านให้ส่งนักกิจกรรมบำบัดหรือประเมินละเอียดต่อ\n\n**ภาวะแทรกซ้อนอื่นที่ต้องป้องกันตั้งแต่วันแรก** — **หลอดเลือดดำที่ขาอุดตัน** (ให้ลุกเคลื่อนไหวเร็ว ใช้ถุงน่องหรือยาป้องกันตามความเหมาะสม) · **แผลกดทับ** · **ติดเชื้อทางเดินปัสสาวะจากการคาสายสวนโดยไม่จำเป็น** · **ภาวะซึมเศร้าหลัง stroke**\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้กินได้เลยเพราะรู้สึกตัวดี* — เป็นความเข้าใจผิดที่พบบ่อยที่สุด **ระดับความรู้สึกตัวไม่ได้ทำนายความสามารถในการกลืน** และ **พูดไม่ชัดเป็นสัญญาณเตือนว่ากล้ามเนื้อกลุ่มเดียวกันอาจทำงานผิดปกติ**\n- *ใส่สายให้อาหารทางจมูกทุกราย* — เกินความจำเป็น รุกล้ำ และผู้ป่วยส่วนใหญ่ผ่านการประเมินการกลืนได้ · สไลด์ยังระบุให้ **เลื่อนการใส่สายออกไปก่อนในผู้ที่เพิ่งได้ rtPA**\n- *ให้อาหารข้นโดยไม่ประเมิน* — การปรับความข้นต้องมาจากผลการประเมิน ไม่ใช่เดา และ **ผู้ที่สำลักเงียบก็ยังสำลักอาหารข้นได้**\n- *งดอาหาร 7 วันทุกราย* — ทำให้ขาดสารอาหารโดยไม่จำเป็นและทำให้ฟื้นตัวช้าลง", "pearl": "ประเมินการกลืนก่อนให้กินทุกราย — รู้สึกตัวดีไม่ได้แปลว่ากลืนได้ และ silent aspiration ไม่แสดงอาการ", "topic": "Early complications and supportive care", "src": "", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6", "2.3.10(5)"]}]}], "meq": [{"id": "NEU-MEQ-01", "part": "MEQ", "lec": "07", "lecture": "Acute ischemic stroke (งานประสาทวิทยา)", "topic": "Acute ischaemic stroke – onset time, eligibility and thrombolysis", "vignette": "ผู้ป่วยหญิงไทยอายุ 65 ปี ถูกนำส่งห้องฉุกเฉินเวลา 10.30 น. ด้วยอาการแขนขาขวาอ่อนแรงและพูดลำบาก\n\nU/D: ความดันโลหิตสูง 8 ปี · เบาหวานชนิดที่ 2 · ไม่เคยเป็นอัมพาตมาก่อน · ไม่เคยผ่าตัดหรือบาดเจ็บศีรษะ\n\nPI: ญาติเล่าว่าขณะนั่งดูโทรทัศน์ด้วยกันเวลา 09.30 น. ผู้ป่วยยังพูดคุยปกติ ต่อมาเวลา 10.00 น. ญาติสังเกตว่าผู้ป่วยพูดไม่เป็นประโยค แขนขาขวาไม่ขยับ จึงรีบนำส่งโรงพยาบาล\n\nยาที่ใช้ประจำ: amlodipine, metformin (ไม่ได้กินยาต้านการแข็งตัวของเลือดหรือยาต้านเกล็ดเลือด)\n\nV/S: BT 36.8 °C, PR 104/min เต้นไม่สม่ำเสมออย่างสิ้นเชิง, RR 20/min, BP 196/112 mmHg, SpO2 96% room air\n\nPE:\n- Heart: เสียงหัวใจเต้นไม่สม่ำเสมอ ได้ยินเสียงฟู่ระดับ 3 ที่ยอดหัวใจ\n- Neuro: รู้สึกตัวดี · พูดเป็นวลีสั้น ๆ ไม่เป็นประโยค ทำตามคำสั่งง่าย ๆ ได้ · ตาเบนไปทางซ้าย · ใบหน้าขวาอ่อนแรงแบบ upper motor neuron · แขนขวากำลัง grade 2 ขาขวา grade 3 · ลานสายตาด้านขวาบกพร่อง · Babinski บวกด้านขวา\n\nLab: POCT glucose 148 mg/dL · CBC ปกติ เกล็ดเลือด 245,000/mm³ · INR 1.0 · BUN 14, Cr 0.9 mg/dL\n\nCT brain non-contrast: ไม่พบเลือดออก · พบ loss of insular ribbon ด้านซ้าย และ lentiform nucleus ด้านซ้ายเบลอ · ASPECTS 8", "questions": [{"q": "1. จงระบุ 'เวลาเริ่มอาการ' ที่ใช้ตัดสินใจรักษา พร้อมเหตุผล และบอกว่าขณะนี้ผู้ป่วยอยู่ในหน้าต่างเวลาใด", "a": "**เวลาเริ่มอาการ = 09.30 น.** ซึ่งเป็นเวลา **last seen well (LSW)** คือเวลาสุดท้ายที่ญาติเห็นผู้ป่วยเป็นปกติ\n\n**เหตุผล** — สมองอาจเริ่มขาดเลือดตั้งแต่วินาทีถัดจากที่เห็นเป็นปกติครั้งสุดท้าย ถ้าใช้ **first seen abnormal (FSA) = 10.00 น.** จะทำให้ **ประเมินระยะเวลาต่ำกว่าความจริง** แล้วอาจให้ยาละลายลิ่มเลือดกับผู้ป่วยที่พ้นหน้าต่างเวลาไปแล้ว ซึ่งเพิ่มความเสี่ยงเลือดออกในสมอง\n\n**ขณะนี้เวลา 10.30 น. คือผ่านไป 1 ชั่วโมง** จึงอยู่ใน **หน้าต่าง 0−3 ชั่วโมง ซึ่งเป็นช่วงที่ได้ประโยชน์สูงสุดจาก IV rtPA** (Class I, Level of Evidence A) และยังอยู่ในกรอบ 4.5 ชั่วโมงอย่างสบาย ๆ\n\n> **เวลาที่มาถึงโรงพยาบาลไม่ใช่เวลาเริ่มอาการ** ใช้สำหรับวัดคุณภาพบริการ (door-to-needle ≤ 60 นาที) เท่านั้น"}, {"q": "2. จงระบุตำแหน่งรอยโรคและกลุ่มอาการตาม OCSP classification พร้อมเหตุผล", "a": "**ตำแหน่ง: หลอดเลือด middle cerebral artery ด้านซ้าย**\n\n**เหตุผลที่ระบุข้างซ้าย**\n- **อ่อนแรงซีกขวา** → รอยโรคซีกซ้าย (ทางเดินสั่งการไขว้กัน)\n- **พูดเป็นวลีสั้น ๆ ไม่เป็นประโยค (aphasia)** → ซีกซ้ายเป็นซีกเด่นด้านภาษา\n- **ตาเบนไปทางซ้าย** → มองไปทางเดียวกับรอยโรค เพราะ frontal eye field ซ้ายเสีย ซีกขวาจึงดึงตาไปซ้ายโดยไม่มีคู่ต้าน\n- **แขน (grade 2) อ่อนแรงมากกว่าขา (grade 3)** → เข้ากับ MCA มากกว่า ACA\n- **CT พบ loss of insular ribbon และ lentiform nucleus เบลอด้านซ้าย** → ยืนยันเขต MCA ซ้าย\n\n**OCSP: Total anterior circulation infarct (TACI)** เพราะมีครบทั้งสามองค์ประกอบ\n1. **ความผิดปกติของสมองระดับสูง** — aphasia\n2. **ลานสายตาผิดปกติแบบ homonymous** — ลานสายตาขวาบกพร่อง\n3. **อ่อนแรงอย่างน้อย 2 ใน 3 ส่วน** — ใบหน้า แขน และขา ครบทั้งสาม\n\n**ความหมายทางคลินิก** — TACI บ่งชี้ **การอุดตันของหลอดเลือดใหญ่ส่วนต้น (LVO)** เป็นกลุ่มที่พยากรณ์โรคแย่ที่สุดถ้าไม่ได้เปิดหลอดเลือด และเป็นกลุ่มที่ **ควรประเมินเพื่อทำ mechanical thrombectomy ควบคู่ไปด้วย**"}, {"q": "3. ผู้ป่วยรายนี้มีข้อห้ามของการให้ IV rtPA หรือไม่ ถ้ามีจะจัดการอย่างไรก่อนให้ยา", "a": "**มีหนึ่งข้อที่ต้องจัดการก่อน คือความดันโลหิต 196/112 mmHg ซึ่งสูงเกินเกณฑ์ 185/110 mmHg**\n\n**การจัดการ — ลดความดันให้อยู่ที่หรือต่ำกว่า 185/110 mmHg ก่อนให้ยา**\n- **Labetalol 10−20 mg IV ช้า ๆ ใน 1−2 นาที ให้ซ้ำได้ 1 ครั้ง** หรือ\n- **Nicardipine 5 mg/ชม. IV ปรับเพิ่มครั้งละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n- ยาอื่นเช่น hydralazine หรือ enalaprilat พิจารณาได้ตามความเหมาะสม\n\n> **ถ้าคุมความดันให้อยู่ที่หรือต่ำกว่า 185/110 mmHg ไม่ได้ ห้ามให้ rtPA**\n\n**ข้ออื่นตรวจสอบแล้วผ่านหมด**\n- อายุ ≥ 18 ปี · มีความบกพร่องทางประสาทที่ก่อความพิการและวัดได้ · เริ่มอาการ < 4.5 ชั่วโมง\n- **ไม่มีเลือดออกใน CT · เนื้อสมองตายไม่เกินหนึ่งในสามของซีกสมอง (ASPECTS 8)**\n- **เกล็ดเลือด 245,000 (> 100,000) · INR 1.0 (≤ 1.7) · ไม่ได้รับยาต้านการแข็งตัวของเลือด**\n- ไม่มีประวัติบาดเจ็บศีรษะรุนแรงหรือผ่าตัดในกะโหลกใน 3 เดือน · ไม่เคยมีเลือดออกในสมอง · ไม่มีเลือดออกภายในที่ยังไม่หยุด\n- **น้ำตาล 148 mg/dL** ไม่ต่ำกว่า 50 mg/dL\n\n**ข้อควรระวัง** — มีเสียงฟู่ที่ยอดหัวใจร่วมกับ AF ควรนึกถึง **เยื่อบุหัวใจอักเสบติดเชื้อ ซึ่งเป็นข้อห้ามเด็ดขาด** ถ้ามีไข้ ประวัติเข้าได้ หรือมีเสียงฟู่ที่เกิดใหม่ ต้องประเมินเพิ่มก่อนให้ยา · ในรายนี้ไม่มีไข้และเสียงฟู่เข้าได้กับลิ้นไมทรัลรั่วจากโรคลิ้นหัวใจเดิม"}, {"q": "4. จงระบุขนาดยา วิธีให้ และแผนการเฝ้าระวังหลังให้ IV rtPA", "a": "**ขนาดและวิธีให้**\n> **Alteplase 0.9 mg/kg ขนาดสูงสุด 90 mg** — **ให้ 10% ของขนาดทั้งหมดเป็น bolus ใน 1 นาที แล้วหยดส่วนที่เหลือใน 60 นาที**\n\nสมมติผู้ป่วยหนัก 55 กก. → ขนาดรวม **49.5 mg** → **bolus 4.95 mg ใน 1 นาที แล้วหยด 44.55 mg ใน 60 นาที**\n\n**แผนการเฝ้าระวัง**\n1. **รับไว้ใน ICU หรือหอผู้ป่วย stroke**\n2. **วัดความดันและประเมินอาการทางประสาท**\n   - **ทุก 15 นาที นาน 2 ชั่วโมง**\n   - **แล้วทุก 30 นาที นาน 6 ชั่วโมง**\n   - **แล้วทุก 1 ชั่วโมงจนครบ 24 ชั่วโมง**\n3. **คุมความดันไว้ที่หรือต่ำกว่า 180/105 mmHg** — ถ้าซิสโตลิก > 180 หรือไดแอสโตลิก > 105 ให้วัดถี่ขึ้นและให้ยาลดความดัน\n   - **ซิสโตลิก 180−230 หรือไดแอสโตลิก 105−120** → **labetalol 10 mg IV แล้วหยดต่อเนื่อง 2−8 mg/นาที** หรือ **nicardipine 5 mg/ชม. ปรับขึ้นทีละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n   - **คุมไม่ได้หรือไดแอสโตลิก > 140** → พิจารณา **sodium nitroprusside IV**\n4. **เลื่อนการใส่สายให้อาหารทางจมูก สายสวนปัสสาวะ และสายวัดความดันในหลอดเลือดแดง** ออกไปก่อนถ้าดูแลได้อย่างปลอดภัยโดยไม่ใช้\n5. **ทำ CT หรือ MRI ซ้ำที่ 24 ชั่วโมง ก่อนเริ่มยาต้านการแข็งตัวของเลือดหรือยาต้านเกล็ดเลือด**\n\n**สิ่งที่ต้องหยุดยาทันที** — **ปวดศีรษะรุนแรง ความดันสูงเฉียบพลัน คลื่นไส้อาเจียน หรือการตรวจทางประสาทแย่ลง → หยุดหยดยาและส่ง CT ฉุกเฉิน**"}, {"q": "5. หลังพ้น 24 ชั่วโมง CT ซ้ำไม่พบเลือดออก จงวางแผนการป้องกันการเป็นซ้ำ พร้อมเหตุผลเชิงกลไก", "a": "**กลไกของ stroke รายนี้ = Cardioembolism จาก atrial fibrillation** (TOAST subtype) — สนับสนุนด้วย **ชีพจรเต้นไม่สม่ำเสมออย่างสิ้นเชิง · เสียงฟู่ที่ยอดหัวใจ · เนื้อสมองตายเป็นรูปลิ่มที่เปลือกสมองในเขต MCA · อาการรุนแรงที่สุดตั้งแต่เริ่มต้น**\n\n**การป้องกันหลัก: ยาต้านการแข็งตัวของเลือดชนิดกิน**\n\n**เหตุผลเชิงกลไก** — ลิ่มเลือดใน AF เกิดจาก **เลือดคั่งนิ่งใน left atrial appendage** แล้วแข็งตัวผ่าน **coagulation cascade** ไม่ใช่ผ่านการเกาะกลุ่มของเกล็ดเลือดบนคราบไขมันแบบหลอดเลือดแข็ง **ยาต้านเกล็ดเลือดจึงป้องกันได้ไม่ดี** ขณะที่ยาต้านการแข็งตัวของเลือดลดการเป็นซ้ำได้ราวสองในสาม\n\n**จังหวะเวลาที่เริ่ม** — ต้องรอให้พ้นความเสี่ยงของ **เลือดออกแทรกในเนื้อสมองที่เพิ่งตาย** โดยหลักคือ **ยิ่งเนื้อตายใหญ่ ยิ่งรอนาน** และต้องมี **CT ซ้ำที่ยืนยันว่าไม่มีเลือดออก** ก่อนเริ่มเสมอ — ผู้ป่วยรายนี้เป็น TACI ซึ่งรอยโรคค่อนข้างใหญ่ จึงควรรอตามขนาดของเนื้อตายและประเมินซ้ำ ไม่รีบเริ่มในวันแรก\n\n**สิ่งที่ต้องทำควบคู่**\n- **คุมความดันโลหิตระยะยาว** — เป็นปัจจัยเสี่ยงที่แก้ไขได้และสำคัญที่สุดของ stroke ทุกชนิด\n- **คุมเบาหวานและไขมันในเลือด** · **หยุดสูบบุหรี่**\n- **ประเมินการกลืนก่อนให้อาหารทางปาก** เพื่อป้องกันปอดอักเสบจากการสำลัก\n- **เริ่มการฟื้นฟูสมรรถภาพเร็ว** และวางแผนปลายทางตาม NIHSS\n- **ป้องกันภาวะแทรกซ้อน** — หลอดเลือดดำอุดตัน แผลกดทับ ภาวะซึมเศร้าหลัง stroke"}], "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "2.3.6", "2.3.9(1)", "3.3.20", "2.2.4"], "_kind": "meq", "_set": "neuro"}], "osce": [{"id": "NEU-OSCE-01", "part": "OSCE/SAQ", "lec": "07", "lecture": "Acute ischemic stroke (งานประสาทวิทยา)", "topic": "SAQ – Non-contrast CT brain in acute stroke and decision making", "station": "SAQ (เขียนตอบ) 8 นาที", "instruction": "ผู้ป่วยชายไทยอายุ 60 ปี U/D ความดันโลหิตสูง 10 ปี มีอาการชาและอ่อนแรงแขนขาและใบหน้าด้านซ้ายขณะนั่งดูโทรทัศน์ 3 ชั่วโมงก่อนมาโรงพยาบาล\n\nV/S: BP 230/110 mmHg, PR 100/min สม่ำเสมอ\nPE: H&L ปกติ · พูดไม่ชัด (dysarthria) · ใบหน้าซ้ายอ่อนแรงแบบ upper motor neuron · แขนขาซ้ายกำลัง grade 2 · ชาซีกซ้ายทั้งซีก · Babinski บวกด้านซ้าย\n\nจงตอบคำถามต่อไปนี้\n\n**2.1** จงระบุตำแหน่งรอยโรคและซีกของสมอง พร้อมเหตุผล (2 คะแนน)\n\n**2.2** จงบอกสัญญาณ 'early ischemic change' บนภาพ CT สมองแบบไม่ฉีดสารทึบรังสี มาอย่างน้อย 4 ข้อ (2 คะแนน)\n\n**2.3** ระบบคะแนน ASPECTS คืออะไร ใช้ประเมินอะไร และคิดคะแนนอย่างไร (2 คะแนน)\n\n**2.4** ผู้ป่วยรายนี้มาถึงภายใน 3 ชั่วโมง แต่ความดัน 230/110 mmHg จงบอกว่าจะให้ IV rtPA ได้หรือไม่ ต้องทำอะไรก่อน และถ้าทำไม่สำเร็จจะทำอย่างไร (2 คะแนน)\n\n**2.5** จงบอกขั้นตอนการดูแลเบื้องต้นก่อนนำผู้ป่วยส่งทำภาพถ่ายสมอง มาอย่างน้อย 5 ข้อ (2 คะแนน)", "answer": "**2.1 ตำแหน่งรอยโรค (2 คะแนน)**\n- **ซีกขวาของสมอง** (0.5) เพราะ **อ่อนแรงและชาซีกซ้าย** ซึ่งทางเดินประสาทไขว้กัน (0.5)\n- **เขตหลอดเลือด middle cerebral artery ขวา หรือรอยโรคในเนื้อสมองส่วนลึก เช่น internal capsule/basal ganglia** (0.5)\n- **ไม่มี aphasia** เข้ากับซีกขวาซึ่งไม่ใช่ซีกเด่นด้านภาษา และมี **dysarthria** ซึ่งเป็นความผิดปกติของการออกเสียง ไม่ใช่ความผิดปกติของภาษา (0.5)\n- *(ให้คะแนนเพิ่มถ้าระบุว่าอ่อนแรงร่วมกับชาทั้งซีกโดยไม่มีอาการเปลือกสมอง เข้าได้กับ **sensorimotor lacunar syndrome** จากความดันโลหิตสูงเรื้อรัง ซึ่งเป็น OCSP แบบ **LACI**)*\n\n**2.2 Early ischemic change บน non-contrast CT (2 คะแนน — ข้อละ 0.5)**\n1. **สูญเสียความแตกต่างระหว่างเนื้อสมองสีเทาและสีขาว (loss of gray-white differentiation)**\n2. **ร่องสมองและรอยหยักถูกลบเรียบ (effacement of sulci-gyri)**\n3. **โครงสร้างปกติเลือนหาย เช่น basal ganglia หรือ lentiform nucleus เบลอ และเสีย insular ribbon**\n4. **Hyperdense MCA sign** — หลอดเลือด MCA ขาวขึ้นผิดปกติ ซึ่งคือตัวลิ่มเลือดเอง\n*(อาจเพิ่ม: เนื้อสมองมีความหนาแน่นลดลงเฉียบพลัน และมี mass effect)*\n\n**2.3 ASPECTS (2 คะแนน)**\n- **เป็นระบบให้คะแนนความผิดปกติระยะแรกบน CT ในเขตที่ MCA เลี้ยง** (0.5)\n- **ใช้ประเมินขนาดของเนื้อสมองที่ตายไปแล้ว (core) เพื่อคัดเลือกผู้ป่วยสำหรับการเปิดหลอดเลือด โดยเฉพาะการลากลิ่มเลือดด้วยสายสวน** (0.5)\n- **แบ่งเป็น 10 บริเวณ** คือ **M1, M2, M3, M4, M5, M6 · caudate (C) · lentiform (L) · internal capsule (IC) · insular cortex (I)** (0.5)\n- **เริ่มจากคะแนนเต็ม 10 แล้วหัก 1 คะแนนต่อทุกบริเวณที่มีการขาดเลือด** — คะแนนยิ่งต่ำแปลว่าเนื้อตายยิ่งมากและได้ประโยชน์จากการเปิดหลอดเลือดน้อยลง (0.5)\n\n**2.4 การให้ rtPA เมื่อความดัน 230/110 mmHg (2 คะแนน)**\n- **ยังให้ไม่ได้ทันที** เพราะเกณฑ์คือ **ต้องคุมความดันให้อยู่ที่หรือต่ำกว่า 185/110 mmHg ก่อน** (0.5)\n- **ต้องลดความดันก่อนด้วย** (1.0)\n  - **Labetalol 10−20 mg IV ช้า ๆ ใน 1−2 นาที ให้ซ้ำได้ 1 ครั้ง** หรือ\n  - **Nicardipine 5 mg/ชม. IV ปรับเพิ่มครั้งละ 2.5 mg/ชม. ทุก 5−15 นาที สูงสุด 15 mg/ชม.**\n  - หรือยาอื่นเช่น hydralazine, enalaprilat ตามความเหมาะสม\n- **ถ้าคุมความดันให้อยู่ที่หรือต่ำกว่า 185/110 mmHg ไม่ได้ → ห้ามให้ rtPA** (0.5)\n- *(ให้คะแนนเพิ่มถ้าระบุว่าเมื่อให้ยาแล้วต้องคุมความดันไว้ที่หรือต่ำกว่า **180/105 mmHg** และต้องส่ง CT ก่อนเสมอเพื่อตัดเลือดออก เพราะความดันสูงขนาดนี้ทำให้ต้องนึกถึงเลือดออกในสมองเป็นอันดับต้น)*\n\n**2.5 การดูแลเบื้องต้นก่อนส่งทำภาพถ่าย (2 คะแนน — ข้อละ 0.4)**\n1. **ประเมิน ABC (airway, breathing, circulation) และสัญญาณชีพ**\n2. **ให้ออกซิเจนเมื่อ SpO₂ < 94% และหลีกเลี่ยงการทำให้หายใจเร็วเกิน (hyperventilation)**\n3. **ตรวจระดับน้ำตาลในเลือด** — ถ้า **POCT glucose < 50 mg% (หรือน้ำตาลที่ยืนยันแล้ว < 60 mg/dL)** ให้ **50% glucose 50 mL เข้าหลอดเลือดดำ**\n4. **งดน้ำงดอาหารทางปาก**\n5. **เปิดหลอดเลือดดำด้วยเข็มเบอร์ 18 และให้ 0.9% NaCl**\n6. **ส่งเลือดตรวจ CBC, coagulogram, BUN, Cr** และทำ **EKG** ในบางราย\n7. **บันทึกเวลา last seen well และ first seen abnormal ให้ชัดเจน**", "ref": ["สไลด์ Acute ischemic stroke: Pathophysiology and management — งานประสาทวิทยา กลุ่มงานอายุรศาสตร์ รพ.ราชวิถี (2567)"], "nl": ["2.3.9-3(3)", "3.3.20", "2.2.4", "2.3.6"], "_kind": "meq", "_set": "neuro"}], "date": "TBD — แก้ใน config.lectures"}], "label": "Neuro", "thai": "ระบบประสาท", "accent": {"light": "#6b3f8c", "soft": "#efe8f5", "ink": "#542f70", "dark": "#b998d8", "darkSoft": "#1d1526", "darkInk": "#cdb6e3"}}]</script>
