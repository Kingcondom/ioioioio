<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MED421 · เรียนเนื้อหา Internal Medicine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#f6f7f9; --surface:#ffffff; --surface-sunk:#eef1f5;
  --ink:#121a22; --ink-2:#3f4b58; --ink-3:#6b7886;
  --rule:#dde3ea; --rule-strong:#c3ccd6;
  --accent:#8a5a12; --accent-soft:#f4ecdd; --accent-ink:#6d460c;
  --ok:#136c45; --ok-soft:#e6f1eb; --miss:#8a5608; --miss-soft:#f7efdf;
  --bad:#a3271f; --bad-soft:#f8e9e7;
  --focus:#1f6feb;
  --shadow:0 1px 2px rgba(18,26,34,.06),0 8px 24px -16px rgba(18,26,34,.28);
  --serif:"Noto Serif Thai",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans Thai","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1319; --surface:#161d25; --surface-sunk:#1d262f;
    --ink:#e9edf2; --ink-2:#b3bec9; --ink-3:#838f9d;
    --rule:#27313b; --rule-strong:#3a4651;
    --accent:#d9ab63; --accent-soft:#241d12; --accent-ink:#ecc98f;
    --ok:#5ec08f; --ok-soft:#15251d; --miss:#d9a84b; --miss-soft:#262015;
    --bad:#e8877c; --bad-soft:#2a1715;
    --focus:#6aa3ff;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1319; --surface:#161d25; --surface-sunk:#1d262f;
  --ink:#e9edf2; --ink-2:#b3bec9; --ink-3:#838f9d;
  --rule:#27313b; --rule-strong:#3a4651;
  --accent:#d9ab63; --accent-soft:#241d12; --accent-ink:#ecc98f;
  --ok:#5ec08f; --ok-soft:#15251d; --miss:#d9a84b; --miss-soft:#262015;
  --bad:#e8877c; --bad-soft:#2a1715;
  --focus:#6aa3ff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.64;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.wrap{max-width:1220px;margin:0 auto;padding-inline:18px}

/* ---------- masthead ---------- */
.mast{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.01em}
.brand span{color:var(--ink-3);font-size:12.5px}
.btn{font:inherit;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule-strong);
     border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-style:dashed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.bar{width:110px;height:6px;border-radius:999px;background:var(--surface-sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;padding-block:22px 60px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:14px}}
aside{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto}
@media (max-width:900px){aside{position:static;max-height:none;order:2}main{order:1}}
@media (max-width:560px){.mast .wrap{gap:8px}.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;padding-bottom:2px}.ring{order:3}.brand b{font-size:16px}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.outline{padding:12px 12px 14px}
.outline h4{font-size:12px;font-family:var(--sans);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:10px 6px 6px}
.olec{margin-bottom:6px}
.olec>button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;font:inherit;font-weight:600;font-size:13.5px;
  color:var(--ink);background:transparent;border:0;border-radius:9px;padding:7px 8px;cursor:pointer}
.olec>button:hover{background:var(--surface-sunk)}
.olec>button.on{background:var(--accent-soft);color:var(--accent-ink)}
.olec .num{font:600 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--rule-strong);border-radius:5px;padding:3px 4px}
.osec{list-style:none;margin:2px 0 8px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.osec li button{display:flex;gap:7px;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--ink-2);
  background:transparent;border:0;border-radius:8px;padding:5px 8px;cursor:pointer}
.osec li button:hover{background:var(--surface-sunk);color:var(--ink)}
.osec li button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tick{flex:0 0 15px;height:15px;margin-top:3px;border-radius:50%;border:1.5px solid var(--rule-strong);font:700 9px/13px var(--sans);text-align:center;color:transparent}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.part{border-color:var(--miss);background:var(--miss-soft);color:var(--miss)}

/* ---------- content ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
@media (max-width:560px){.card{padding:18px 15px;border-radius:13px}}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.card h2{font-size:23px;margin:6px 0 4px;line-height:1.35}
.card h3{font-size:18px;margin:22px 0 6px}
.lede{color:var(--ink-2);font-size:14.5px}
.prose{font-size:15.5px}
.prose p{margin:11px 0}
.prose ul,.prose ol{margin:9px 0;padding-left:22px}
.prose li{margin:4px 0}
.prose strong{color:var(--ink);font-weight:600}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-sunk);padding:1px 5px;border-radius:5px}
.prose h4{font-size:15.5px;font-family:var(--sans);font-weight:700;margin:18px 0 4px;color:var(--accent-ink)}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.6px;min-width:460px}
th,td{border-bottom:1px solid var(--rule);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--surface-sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.callout{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:0 11px 11px 0;padding:12px 15px;margin:16px 0;font-size:14.5px}
.callout b{color:var(--accent-ink)}
.pearls{margin:18px 0 0;padding:14px 16px;border:1px dashed var(--rule-strong);border-radius:12px;background:var(--surface-sunk)}
.pearls h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans)}
.pearls ul{margin:0;padding-left:20px;font-size:14.4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:12.3px;margin-top:8px}
.chip{display:inline-block;border:1px solid var(--rule-strong);border-radius:999px;padding:2px 9px;font-size:11.8px;color:var(--ink-3);background:var(--surface)}
.chip.nl{border-style:dashed}
.chip.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

/* ---------- quiz ---------- */
.quiz{border-top:2px solid var(--accent);margin-top:26px;padding-top:18px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qhead h3{margin:0;font-size:19px}
.q{border:1px solid var(--rule);border-radius:13px;padding:16px 17px;margin-top:14px;background:var(--surface)}
.q .qid{font:600 11px/1 var(--mono);color:var(--ink-3)}
.stem{margin:7px 0 12px;font-size:15.2px}
.choices{display:flex;flex-direction:column;gap:7px}
.ch{display:flex;gap:10px;text-align:left;font:inherit;font-size:14.6px;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:9px 12px;color:var(--ink)}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.ch:disabled{cursor:default}
.ch .k{font:700 13px/1.5 var(--mono);color:var(--ink-3);flex:0 0 16px}
.ch.correct{border-color:var(--ok);background:var(--ok-soft)}
.ch.correct .k{color:var(--ok)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.wrong .k{color:var(--bad)}
.verdict{margin-top:12px;font-weight:600;font-size:14.4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.explain{margin-top:8px;border-top:1px dashed var(--rule);padding-top:10px;font-size:14.6px}
.pearl{margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:9px 13px;font-size:14.3px}
.pearl b{color:var(--accent-ink)}
.scorebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:12px 14px;
  border-radius:12px;background:var(--surface-sunk);font-size:14px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* ---------- practice ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin-top:14px}
.tile{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:13px;
  padding:14px 15px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:14.8px;font-family:var(--serif)}
.tile span{font-size:12.6px;color:var(--ink-3)}
.vignette{white-space:pre-wrap;font-size:14.6px;background:var(--surface-sunk);border-radius:12px;padding:14px 16px;margin:12px 0 4px}
textarea{width:100%;min-height:104px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:11px;padding:10px 12px;resize:vertical}
.selfrate{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.timer{font:600 15px/1 var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:6px 12px}
.hr{height:1px;background:var(--rule);margin:18px 0}
footer{color:var(--ink-3);font-size:12.4px;padding:26px 0 40px;text-align:center}
.hide{display:none!important}
</style>

ไม่ตอบสนอง adrenaline ให้พิจารณา **glucagon**)"}, {"q": "3. ผู้ป่วยอาการดีขึ้นใน 1 ชั่วโมง ญาติขอกลับบ้านทันที ท่านจะอธิบายอย่างไร และจะสังเกตอาการนานเท่าใด", "a": "อธิบายว่า **anaphylaxis มีโอกาสกลับเป็นซ้ำแบบ biphasic reaction ได้ประมาณ 1–20% โดยมักเกิดภายใน 1–12 ชั่วโมงหลังอาการแรกสงบ** แม้จะดูดีแล้วก็ตาม\n**ระยะเวลาสังเกตอาการ** — อย่างน้อย 4–6 ชั่วโมง และ **ควรสังเกตนานถึง 12–24 ชั่วโมงหรือรับไว้ในโรงพยาบาล** เมื่อมีปัจจัยเสี่ยง: มีความดันตก (รายนี้มี), ต้องให้ adrenaline มากกว่า 1 ครั้ง, มี laryngeal edema, มีโรคหืดร่วม, มาจากบ้านที่ห่างไกลจากโรงพยาบาล"}, {"q": "4. จงวางแผนการดูแลก่อนจำหน่ายและการส่งต่อ", "a": "1) **จ่าย adrenaline auto-injector 2 เข็ม + สอนวิธีใช้จนผู้ป่วยและญาติสาธิตได้** (ถ้าไม่มีในระบบ ให้วางแผนเข้าถึงบริการฉุกเฉินและบัตรแพ้ยา)\n2) **เขียน anaphylaxis action plan** และสอนให้ฉีดทันทีเมื่อมีอาการ แล้วโทร 1669 ทุกครั้ง\n3) **ออกบัตรแพ้ยา (drug allergy card)** ระบุ **diclofenac และ NSAID กลุ่ม COX-1 inhibitor ทั้งหมด** พร้อมบันทึกในเวชระเบียนและระบบโรงพยาบาล\n4) **สอนชื่อยาที่ต้องเลี่ยง** — NSAID ทุกชนิด (ibuprofen, naproxen, aspirin, ยาชุด ยาแก้ปวดข้อที่ไม่ทราบส่วนประกอบ) และให้ใช้ **paracetamol** เป็นยาแก้ปวดแทน\n5) **ส่งต่อ allergist** เพื่อยืนยันชนิดของปฏิกิริยา (NSAID hypersensitivity แบ่งได้หลายแบบ) และประเมินว่าจะใช้ **selective COX-2 inhibitor** ได้หรือไม่ภายใต้การดูแล\n6) นัดติดตามและย้ำว่า **ห้ามทดลองกินยาเดิมซ้ำเองเด็ดขาด**"}], "ref": ["MED33 โพย MCQ 'กินยา → ผื่นขึ้น → Anaphylaxis → Adrenaline IM' และข้อ 45 การดูแลหลังจำหน่าย", "WAO Anaphylaxis Guidance 2020"], "nl": ["2.2.7", "B4.2.2(12)", "2.1.50", "2.1.51"], "_kind": "meq", "_set": "air"}], "osce": [{"id": "AIR-OSCE-04", "part": "OSCE/SAQ", "lec": "08", "lecture": "Allergy and clinical immunology", "topic": "OSCE – History taking in suspected drug allergy", "station": "สถานีซักประวัติผู้ป่วยจำลอง 8 นาที", "instruction": "ผู้ป่วยหญิงอายุ 40 ปี มาที่แผนกผู้ป่วยนอกด้วยเรื่อง 'แพ้ยา' ต้องการมาขอบัตรแพ้ยา\nคำสั่ง: จงซักประวัติเพื่อประเมินว่าผู้ป่วยแพ้ยาจริงหรือไม่ ชนิดของปฏิกิริยาคืออะไร และสรุปคำแนะนำให้ผู้ป่วยฟังในช่วงท้าย (ไม่ต้องตรวจร่างกาย)\n\nหมายเหตุสำหรับผู้ป่วยจำลอง: 2 เดือนก่อน ได้ยา cotrimoxazole รักษาการติดเชื้อทางเดินปัสสาวะ วันที่ 8 ของยามีไข้ 38.5 C ผื่นแดงทั้งตัว ตาแดง มีแผลในปากจนกินไม่ได้ ผิวหนังลอกเป็นแผ่นที่หน้าอกประมาณฝ่ามือ 2-3 ฝ่ามือ ต้องนอนโรงพยาบาล 10 วัน", "answer": "**สิ่งที่ต้องซักให้ได้ (คะแนนเต็ม 20)**\n\n**1. ลักษณะของปฏิกิริยา (6 คะแนน)**\n- อาการคืออะไรบ้าง: ผื่นแบบไหน (ราบ/นูน/ตุ่มน้ำ/ลอก), คันหรือเจ็บ, มีไข้ไหม\n- **เยื่อบุมีแผลหรือไม่** (ปาก ตา อวัยวะเพศ) — จุดชี้ขาดของ SJS/TEN\n- **ผิวหนังลอกหรือไม่ และประมาณกี่เปอร์เซ็นต์ของพื้นที่ผิว**\n- มีอาการระบบอื่นไหม: บวมปาก/หน้า เสียงแหบ แน่นหน้าอก หายใจลำบาก เป็นลม (บ่งชี้ anaphylaxis)\n\n**2. เวลา (4 คะแนน)**\n- **เริ่มอาการวันที่เท่าไรของการกินยา** (รายนี้วันที่ 8 = delayed) — ทันที/ภายในชั่วโมง = IgE-mediated, หลายวัน–สัปดาห์ = T-cell mediated\n- เคยได้ยานี้มาก่อนหรือไม่ และครั้งนั้นเป็นอย่างไร\n- อาการดีขึ้นเมื่อไรหลังหยุดยา\n\n**3. ยาและสิ่งที่ได้รับร่วม (4 คะแนน)**\n- **ชื่อยาทุกตัวที่ได้ในช่วงนั้น** ทั้งยาที่แพทย์สั่ง ยาซื้อเอง สมุนไพร อาหารเสริม และวันที่เริ่มแต่ละตัว\n- ถ้าไม่ทราบชื่อ ให้ขอดูซองยา ใบสั่งยา หรือประวัติจากโรงพยาบาลเดิม\n\n**4. ความรุนแรงและการรักษาที่ได้รับ (3 คะแนน)** — ต้องนอนโรงพยาบาลไหม กี่วัน ได้สเตียรอยด์หรือสารน้ำหรือไม่ มีผลกระทบต่อดวงตาหลงเหลือไหม\n\n**5. ประวัติอื่นที่เกี่ยวข้อง (3 คะแนน)** — โรคประจำตัว (ไต ตับ HIV ซึ่งเพิ่มความเสี่ยงแพ้ cotrimoxazole), ประวัติแพ้ยาอื่นในอดีต, ประวัติแพ้ยาในครอบครัว\n\n**สรุปที่ควรบอกผู้ป่วย**\n- ปฏิกิริยานี้เข้าได้กับ **Stevens-Johnson syndrome จาก cotrimoxazole** ซึ่งเป็นการแพ้ยาชนิดรุนแรง **ห้ามใช้ยานี้และยากลุ่ม sulfonamide อีกตลอดชีวิต** และ **ห้ามทดสอบหรือ desensitize**\n- ออก **บัตรแพ้ยา** ระบุชื่อยาและอาการ พกติดตัวตลอด แจ้งทุกครั้งที่พบแพทย์ ทันตแพทย์ หรือซื้อยา\n- บันทึกในเวชระเบียนและระบบแพ้ยาของโรงพยาบาล\n- ให้รายชื่อยาทางเลือกสำหรับการติดเชื้อทางเดินปัสสาวะครั้งต่อไป และแนะนำให้มาพบแพทย์ทันทีถ้ามีผื่นร่วมกับไข้หรือแผลในปากหลังเริ่มยาใหม่", "ref": ["MED34 โพย OSCE สถานีซักประวัติแพ้ยา", "Harrison 21st ed., Cutaneous Drug Reactions"], "nl": ["B4.2.2(13)", "2.3.12(13)", "2.1.50"], "_kind": "meq", "_set": "air"}, {"id": "AIR-OSCE-05", "part": "OSCE/SAQ", "lec": "08", "lecture": "Allergy and clinical immunology", "topic": "SAQ – Transfusion reaction", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "หญิงอายุ 62 ปี ได้รับ packed red cell เนื่องจากซีด หลังเริ่มให้เลือดได้ 15 นาที มีไข้ 39.0 C หนาวสั่น ปวดเอวสองข้าง ความดันโลหิต 88/54 mmHg ชีพจร 124 ครั้ง/นาที และปัสสาวะสีแดงเข้ม\n\n5.1 จงให้การวินิจฉัยและกลไกการเกิด (3 คะแนน)\n5.2 จงเรียงลำดับสิ่งที่ต้องทำทันที 4 ข้อ (4 คะแนน)\n5.3 จงบอกสิ่งส่งตรวจที่ต้องส่งกลับธนาคารเลือดและการตรวจที่ต้องส่งจากผู้ป่วย (3 คะแนน)\n5.4 ถ้าผู้ป่วยมีเพียงผื่นลมพิษ ไม่มีไข้ ไม่มีอาการอื่น จะจัดการต่างจากเดิมอย่างไร (2 คะแนน)", "answer": "**5.1 (3 คะแนน)** — **Acute hemolytic transfusion reaction (AHTR)** จากการให้เลือดผิดหมู่ ABO\nกลไก: แอนติบอดีของผู้รับ (anti-A/anti-B ชนิด IgM) จับกับแอนติเจนบนเม็ดเลือดแดงของผู้ให้ → **กระตุ้น complement ครบวงจนเกิด intravascular hemolysis** → hemoglobinemia/hemoglobinuria (ปัสสาวะสีแดงเข้ม), การหลั่ง cytokine ทำให้ไข้และความดันตก, เกิด **DIC และ acute kidney injury** ตามมา — เป็น **type II hypersensitivity**\n\n**5.2 สิ่งที่ต้องทำทันที (4 คะแนน)**\n1) **หยุดให้เลือดทันที** และคาสายไว้ **เปลี่ยนชุดให้สารน้ำใหม่ ให้ 0.9% NSS**\n2) **ตรวจสอบชื่อ-นามสกุล เลขประจำตัวผู้ป่วย และฉลากถุงเลือดซ้ำทันที** (ความผิดพลาดของการระบุตัวผู้ป่วยเป็นสาเหตุอันดับหนึ่ง)\n3) **ประคับประคองระบบไหลเวียนและไต** — ให้สารน้ำอย่างเพียงพอให้ปัสสาวะออก ≥ 1 mL/kg/ชม., เฝ้าระวังความดัน ใส่สายสวนปัสสาวะเพื่อวัดปริมาณ, พิจารณายากระตุ้นความดันถ้าจำเป็น\n4) **แจ้งธนาคารเลือดทันที** ส่งถุงเลือดและตัวอย่างเลือดกลับ พร้อมเฝ้าระวัง DIC และภาวะไตวาย\n\n**5.3 สิ่งส่งตรวจ (3 คะแนน)**\n- **ส่งกลับธนาคารเลือด**: ถุงเลือดที่เหลือพร้อมชุดให้เลือด และตัวอย่างเลือดผู้ป่วยหลังเกิดเหตุ เพื่อ **ตรวจหมู่เลือดซ้ำและ cross-match ใหม่ทั้งก่อนและหลัง**\n- **จากผู้ป่วย**: **direct antiglobulin (Coombs) test**, CBC และ blood smear (หา schistocyte), **plasma free hemoglobin, LDH, haptoglobin, bilirubin**, BUN/creatinine, **coagulogram + fibrinogen + D-dimer** (ประเมิน DIC) และ **urinalysis หา hemoglobinuria**, เพาะเชื้อจากเลือดผู้ป่วยและถุงเลือดถ้าสงสัยการปนเปื้อนเชื้อแบคทีเรีย\n\n**5.4 (2 คะแนน)** — ผื่นลมพิษอย่างเดียวคือ **allergic (urticarial) transfusion reaction** ซึ่งเป็น **ชนิดเดียวที่ให้เลือดต่อได้**: หยุดชั่วคราว ให้ **antihistamine** รอจนผื่นยุบ แล้วเริ่มให้เลือดใหม่ช้า ๆ พร้อมเฝ้าสังเกต; ถ้าเป็นซ้ำบ่อยครั้งต่อไปพิจารณา **washed red cells**", "ref": ["MED33 โพย Hemato ข้อ 3 และ MCQ ข้อ 41 เรื่องปฏิกิริยาจากการให้เลือด", "AABB Technical Manual 20th ed."], "nl": ["2.2.21", "2.3.3(4)", "B4.2.2(12)"], "_kind": "meq", "_set": "air"}], "sections": [{"id": "air-08-01", "title": "ภูมิไวเกิน 4 ชนิด (Gell & Coombs)", "minutes": 7, "summary": "กลไกบอกเวลา บอกการตรวจ และบอกยาที่ต้องใช้", "nl": ["2.1.50", "2.2.7"], "md": "ทุกครั้งที่เจอคำว่า “แพ้” ให้ถามสามคำถามตามลำดับ — **นานเท่าไรหลังได้สาร · อาการอยู่ที่ระบบใดบ้าง · เคยได้สารนี้มาก่อนหรือไม่** คำตอบสามข้อนี้จะพาไปหากลไกได้เกือบทุกครั้ง และกลไกคือสิ่งที่กำหนดทั้งการตรวจและการรักษา\n\n### กลไกทั้งสี่แบบ\n\n| Type | กลไก | เวลาเริ่มอาการ | ตัวอย่างที่ออกสอบ | ตรวจยืนยัน |\n|---|---|---|---|---|\n| **I** — immediate | IgE บน mast cell/basophil → histamine, tryptase, leukotriene | นาที–2 ชม. | anaphylaxis, urticaria เฉียบพลัน, allergic rhinitis/asthma | skin prick test, serum specific IgE, **serum tryptase** (เจาะภายใน 1–2 ชม.) |\n| **II** — cytotoxic | IgG/IgM จับ antigen บนผิวเซลล์ → complement + phagocytosis | ชม.–วัน | AIHA, ITP, **acute hemolytic transfusion reaction**, drug-induced neutropenia | **direct Coombs test**, CBC + smear |\n| **III** — immune complex | complex ตกตะกอนที่หลอดเลือดเล็ก → complement | 1–3 สัปดาห์ | serum sickness, SLE, vasculitis หลังยา | C3/C4 ต่ำ, biopsy, ANA |\n| **IV** — delayed, T-cell | CD4/CD8 T cell + macrophage | 2 วัน–6 สัปดาห์ | contact dermatitis, **SJS/TEN, DRESS**, tuberculin reaction | **patch test**, biopsy ผิวหนัง |\n\n### จุดที่คนพลาดบ่อย\n- **ผื่นจากยา “ไม่ใช่ type I เสมอ”** — ผื่นที่ขึ้นวันที่ 7–14 หลังเริ่มยาคือ type IV ไม่ใช่ IgE การให้ antihistamine จึงไม่ค่อยได้ผล และการทำ skin prick test ไม่ช่วยอะไร\n- **ปฏิกิริยาที่เหมือน anaphylaxis แต่ไม่ผ่าน IgE** (เดิมเรียก anaphylactoid) เช่น radiocontrast, vancomycin infusion reaction (red man), NSAIDs — เกิดได้ตั้งแต่ครั้งแรกที่ได้ยาเพราะ mast cell ถูกกระตุ้นตรง ๆ **แต่รักษาเหมือนกันทุกอย่าง คือ adrenaline**\n- การแพ้แบบ type I ต้องเคย **sensitized** มาก่อน ฉะนั้นประวัติ “เคยได้ยานี้แล้วไม่เป็นอะไร” ไม่ได้แปลว่าครั้งนี้ไม่แพ้ ตรงกันข้ามมันคือเงื่อนไขที่ทำให้แพ้ได้\n\n> **วิธีคิดที่ใช้ได้จริงข้างเตียง** — เร็วเป็นนาที คิด IgE (type I) · ผื่นหรือไข้หลังยาเป็นสัปดาห์ คิด T cell (type IV) · เม็ดเลือดหาย คิด antibody จับเซลล์ (type II) · ปวดข้อ ไข้ ผื่น ไตอักเสบ หลังยา 1–3 สัปดาห์ คิด immune complex (type III)\n", "pearls": ["เวลา = กลไก: นาที → IgE · สัปดาห์ → T cell หรือ immune complex", "Serum tryptase ต้องเจาะภายใน 1–2 ชั่วโมงหลังเกิดอาการ ถ้าเจาะช้าค่าปกติแปลผลไม่ได้", "Non-IgE anaphylaxis (contrast, vancomycin, NSAIDs) เกิดครั้งแรกได้ และรักษาด้วย adrenaline เหมือนกัน"], "items": [{"id": "AIR-MCQ-03", "kind": "mcq", "stem": "A 27-year-old woman develops itchy wheals over the trunk within 20 minutes of taking a first dose of amoxicillin. The lesions are transient, each lasting less than 24 hours, and resolve completely without scarring. Which immunologic mechanism best explains this reaction?", "choices": ["Type IVa — T helper 1 cell and macrophage activation", "Type IVc — cytotoxic T cell mediated keratinocyte death", "Type III — immune complex deposition with complement activation", "Type I — IgE-mediated mast cell degranulation", "Type II — IgG antibody directed against cell-surface antigen"], "answer": 3, "explain": "**Urticaria ที่เกิดภายในนาทีถึงชั่วโมง หลังได้ยาครั้งแรกของ course และผื่นแต่ละตุ่มอยู่ไม่เกิน 24 ชั่วโมง = type I (immediate, IgE-mediated)**\n\n| Type (Gell & Coombs) | กลไก | ตัวอย่างทางคลินิก | เวลาเกิด |\n|---|---|---|---|\n| **I** | **IgE + mast cell** | **urticaria, angioedema, anaphylaxis** | **นาที–1 ชม.** |\n| II | IgG ต่อ antigen บนผิวเซลล์ | drug-induced hemolytic anemia, ITP | วัน |\n| III | immune complex + complement | serum sickness, vasculitis, SLE | 1–3 สัปดาห์ |\n| IVa/IVb | Th1 / Th2 + macrophage, eosinophil | contact dermatitis, DRESS | 2 วัน–6 สัปดาห์ |\n| IVc | cytotoxic T cell | **SJS / TEN** | 4 วัน–4 สัปดาห์ |\n\n**ทำไมข้ออื่นผิด** — type II และ III ใช้เวลาหลายวันถึงสัปดาห์และไม่ทำให้เกิด wheal ชั่วคราว, type IV เป็น delayed cell-mediated (ผื่นคงที่หลายวัน มักมี scaling หรือ bullae) ซึ่งไม่ตรงกับผื่นลมพิษที่ย้ายที่และหายภายในวันเดียว", "pearl": "ผื่นลมพิษย้ายที่ ตุ่มละไม่เกิน 24 ชม. + เกิดเร็ว = **type I**; ผื่นคงที่นานหลายวันหรือหลุดลอก = **type IV**", "topic": "Hypersensitivity classification", "src": "", "ref": ["MED33 โพย MCQ ข้อ 44 'Urticaria hypersensitivity type 1'", "Middleton's Allergy 9th ed."], "nl": ["B4.2.2(12)", "2.3.12(12)", "2.1.51"]}, {"id": "AIR-OLD-01", "kind": "old", "stem": "A 32-year-old man develops generalized itchy wheals within 30 minutes of taking an oral antibiotic. The lesions blanch on pressure and each individual wheal disappears within a few hours. Which type of hypersensitivity reaction is this?", "choices": ["Type IV (delayed, T-cell mediated)", "Type I (IgE-mediated immediate hypersensitivity)", "Type II (antibody-dependent cytotoxic)", "Type III (immune complex)", "Non-immunologic idiosyncratic reaction"], "answer": 1, "explain": "**Urticaria ที่เกิดภายในนาที–ชั่วโมง = type I** IgE จับ mast cell แล้วปล่อย histamine ทำให้หลอดเลือดขยายและรั่ว เกิด wheal ที่ **กดจางและย้ายที่ภายในวันเดียว** — ถ้าตุ่มเดิมอยู่นานเกิน 24 ชั่วโมงและทิ้งรอยจ้ำ ให้คิดถึง urticarial vasculitis แทน", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 44 'Urticaria hypersensitivity type 1'", "ref": [], "nl": ["B4.2.2(12)", "2.3.12(12)", "2.1.51"]}]}, {"id": "air-08-02", "title": "Anaphylaxis — รู้ให้เร็ว ฉีดให้ถูกที่", "minutes": 9, "summary": "เกณฑ์วินิจฉัย · adrenaline IM · การสังเกตอาการและแผนกลับบ้าน", "nl": ["2.2.7", "2.1.50"], "md": "Anaphylaxis คือปฏิกิริยาแพ้เฉียบพลันที่กระทบ **มากกว่าหนึ่งระบบ** หรือทำให้ความดันตก — เป็นการวินิจฉัย **ทางคลินิกล้วน ๆ** ห้ามรอผล tryptase หรือผลตรวจใด ๆ ก่อนให้ยา\n\n### เกณฑ์วินิจฉัย (เข้าข้อใดข้อหนึ่งก็พอ)\n1. อาการทางผิวหนัง/เยื่อบุ (ลมพิษ คัน บวมริมฝีปาก) **ร่วมกับ** อาการทางเดินหายใจ (หายใจลำบาก wheeze เสียงแหบ stridor) **หรือ** ความดันตก\n2. หลังสัมผัสสารที่น่าจะเป็นสาเหตุ มีอาการ **≥ 2 ระบบ** อย่างรวดเร็ว (ผิวหนัง · หายใจ · ความดัน · ทางเดินอาหาร เช่น อาเจียน ปวดบิด)\n3. **ความดันตกอย่างเดียว** หลังสัมผัสสารที่ผู้ป่วยเคยแพ้มาก่อน\n\nจำไว้ว่า **ร้อยละ 10–20 ไม่มีผื่น** — ผู้ป่วยที่ความดันตกทันทีหลังฉีดยาโดยไม่มีลมพิษยังเป็น anaphylaxis ได้\n\n### การรักษา — เรียงตามลำดับจริง\n1. **Adrenaline (1:1,000) 0.01 mg/kg สูงสุด 0.5 mg ฉีดเข้ากล้ามที่ต้นขาด้านนอก (vastus lateralis)** ซ้ำได้ทุก 5–15 นาที\n   - ต้นขาด้านนอกให้ระดับยาในเลือดสูงและเร็วกว่า deltoid และกว่าการฉีดใต้ผิวหนังชัดเจน\n   - α1 ดึงความดันกลับและลดบวมของกล่องเสียง · β1 เพิ่ม cardiac output · β2 ขยายหลอดลมและยับยั้งการหลั่ง mediator\n   - **ไม่มีข้อห้ามสัมบูรณ์** ในภาวะนี้ ความล่าช้าของ adrenaline คือปัจจัยเดียวที่สัมพันธ์กับการเสียชีวิต\n2. จัดท่า **นอนราบยกขาสูง** (ห้ามลุกนั่งหรือยืนทันที — มีรายงานเสียชีวิตจาก empty ventricle syndrome), ให้ออกซิเจน, เปิดเส้น ให้ **crystalloid bolus 20 mL/kg** ถ้าความดันยังตก\n3. ถ้าไม่ตอบสนองหลังฉีดซ้ำ 2–3 ครั้ง → **adrenaline drip** และคิดถึงผู้ป่วยที่กิน **β-blocker** ซึ่งอาจต้องใช้ **glucagon 1–5 mg IV**\n4. **ยาเสริมเท่านั้น** — antihistamine (แก้ผื่นคัน ไม่แก้ความดันหรือกล่องเสียงบวม) และ corticosteroid (ออกฤทธิ์เป็นชั่วโมง หวังลด biphasic ซึ่งหลักฐานยังไม่ชัด) **ห้ามใช้แทน adrenaline**\n\n### หลังพ้นวิกฤต\n- สังเกตอาการต่อ **4–6 ชั่วโมง** (นานขึ้นถ้าอาการรุนแรง ต้องฉีดซ้ำหลายครั้ง หรือมี asthma ร่วม) เพราะ **biphasic reaction** เกิดได้ราวร้อยละ 1–5 ภายใน 72 ชั่วโมง\n- **แผนกลับบ้านที่ถูกต้อง** = สั่ง **adrenaline auto-injector พร้อมสอนใช้** + เขียน **written action plan** + ระบุสารที่ต้องหลีกเลี่ยง + **ส่งพบ allergist** เพื่อยืนยันสารก่อภูมิแพ้\n- ห้ามทำ oral challenge กับสารที่เพิ่งทำให้เกิด anaphylaxis ในระยะเฉียบพลัน และไม่ต้องให้ prednisolone ยาวเป็นสัปดาห์\n", "pearls": ["Adrenaline IM ต้นขาด้านนอกคือคำตอบเสมอ — ทาง SC และ deltoid ผิดทั้งคู่", "ไม่มีผื่นก็เป็น anaphylaxis ได้ (10–20%)", "ให้ผู้ป่วยนอนราบยกขาสูง อย่าให้ลุกนั่งทันทีหลังฉีด", "กลับบ้านต้องได้ auto-injector + action plan + ส่งต่อ allergist"], "items": [{"id": "AIR-MCQ-01", "kind": "mcq", "stem": "A 24-year-old woman develops generalized urticaria, lip swelling, hoarseness and wheezing 10 minutes after eating shrimp. PE: T 37.0 C, PR 124/min, RR 28/min, BP 82/50 mmHg, SpO2 93% room air, diffuse wheezing and angioedema of the lips. Which of the following is the most appropriate immediate treatment?", "choices": ["Intramuscular adrenaline 0.3–0.5 mg (1:1,000) into the anterolateral thigh", "Nebulized salbutamol 2.5 mg", "Intravenous chlorpheniramine 10 mg", "Subcutaneous adrenaline 0.3 mg into the upper arm", "Intravenous dexamethasone 5 mg"], "answer": 0, "explain": "**Anaphylaxis = ปฏิกิริยา IgE-mediated (type I) ที่ทำให้ mast cell/basophil ปล่อย histamine, tryptase, leukotriene พร้อมกันทั้งตัว** → vasodilatation + capillary leak (ความดันตก), bronchoconstriction (หอบ), laryngeal edema (เสียงแหบ = สัญญาณอันตราย)\n\n**Adrenaline คือยาเดียวที่แก้ทุกกลไกพร้อมกัน**\n- α1 → vasoconstriction ดึงความดันกลับ และลด mucosal edema\n- β1 → เพิ่ม cardiac output\n- β2 → ขยายหลอดลม และยับยั้งการหลั่ง mediator เพิ่ม\n\n**ตำแหน่งและทาง** — ฉีด **IM ที่ anterolateral thigh (vastus lateralis)** เพราะระดับยาในเลือดขึ้นเร็วและสูงกว่า SC หรือ IM ที่ deltoid ชัดเจน ขนาด 0.01 mg/kg สูงสุด 0.5 mg ซ้ำได้ทุก 5–15 นาที\n\n**ทำไมข้ออื่นผิด**\n- **Antihistamine** แก้ได้แค่ผื่นและคัน ไม่แก้ความดันตกหรือ laryngeal edema — ใช้เป็นยาเสริมเท่านั้น และห้ามใช้แทน adrenaline\n- **Corticosteroid** ออกฤทธิ์ช้าเป็นชั่วโมง หวังผลป้องกัน biphasic reaction (ซึ่งหลักฐานยังไม่ชัด) ไม่ใช่ยาช่วยชีวิต\n- **Salbutamol** แก้เฉพาะ bronchospasm ไม่แก้ shock\n- **SC route** ดูดซึมช้าและไม่แน่นอนโดยเฉพาะเมื่อ perfusion แย่จาก shock อยู่แล้ว", "pearl": "เห็น anaphylaxis ให้ **adrenaline IM ต้นขาด้านนอกทันที** — antihistamine/steroid เป็นแค่ตัวประกอบ ความล่าช้าของ adrenaline คือปัจจัยเดียวที่สัมพันธ์กับการเสียชีวิต", "topic": "Anaphylaxis — first-line treatment", "src": "", "ref": ["MED33 โพย MCQ ข้อ 'กินข้าว → ผื่นขึ้น → Anaphylaxis → treat โดย Adrenaline IM'", "WAO Anaphylaxis Guidance 2020"], "nl": ["2.2.7", "2.1.50", "B4.2.2(12)"]}, {"id": "AIR-OLD-03", "kind": "old", "stem": "A 28-year-old woman develops itching, generalized flushing, wheezing and hypotension 15 minutes after eating at a restaurant. Which is the most appropriate first drug and route?", "choices": ["Adrenaline 0.3-0.5 mg intramuscularly", "Hydrocortisone 200 mg intravenously", "Chlorpheniramine 10 mg intravenously", "Adrenaline 0.3 mg subcutaneously", "Salbutamol nebulization"], "answer": 0, "explain": "**Adrenaline IM ที่ต้นขาด้านนอกคือคำตอบเสมอ** ไม่ใช่ SC (ดูดซึมช้าและไม่แน่นอนโดยเฉพาะเมื่อ shock) ยาแก้แพ้และสเตียรอยด์เป็นยาเสริมที่ออกฤทธิ์ช้าเกินกว่าจะช่วยชีวิต", "pearl": "", "topic": "", "src": "MED33 โพย MCQ 'กินข้าว > ผื่นขึ้น > ให้รูปผื่น > โรค Anaphylaxis > treat โดย Adrenaline IM'", "ref": [], "nl": ["2.2.7", "2.1.50"]}, {"id": "AIR-MCQ-02", "kind": "mcq", "stem": "A 19-year-old man is observed for 6 hours after a severe anaphylactic reaction to peanuts that responded to intramuscular adrenaline. He is now asymptomatic with normal vital signs and is ready for discharge. Which of the following is the most appropriate discharge plan?", "choices": ["Prescribe an adrenaline auto-injector with training, a written action plan and allergist referral", "Prescribe a 2-week tapering course of oral prednisolone", "Prescribe a daily second-generation antihistamine indefinitely", "Arrange immediate peanut oral challenge in the outpatient clinic to confirm the allergen", "Advise that no specific medication is needed because the reaction has fully resolved"], "answer": 0, "explain": "**หลังรอด anaphylaxis ครั้งหนึ่ง ความเสี่ยงของครั้งต่อไปยังอยู่ตลอดชีวิต** เพราะ sensitization ไม่หายไปเอง งานที่ต้องทำก่อนจำหน่ายมี 3 อย่างเสมอ\n1. **จ่าย adrenaline auto-injector 2 เข็ม + สอนวิธีใช้จริง** (ให้ผู้ป่วยสาธิตซ้ำ)\n2. **เขียน anaphylaxis action plan** ระบุอาการที่ต้องฉีดทันทีและให้โทร 1669 ทุกครั้งหลังฉีด\n3. **ส่งต่อ allergist** เพื่อยืนยันสารก่อภูมิแพ้ (skin prick / specific IgE) และวางแผนหลีกเลี่ยง\n\n**ทำไมข้ออื่นผิด**\n- **Antihistamine ทุกวัน** ไม่ป้องกัน anaphylaxis เลย และอาจกลบอาการเริ่มต้น (ผื่น/คัน) ทำให้ผู้ป่วยฉีด adrenaline ช้าลง — เป็นตัวลวงที่โพยเก่าจงใจวางไว้\n- **Prednisolone ยาว 2 สัปดาห์** ไม่มีหลักฐานว่าลด biphasic reaction และเพิ่มผลข้างเคียง\n- **Oral challenge** กับสารที่เพิ่งทำให้เกิด anaphylaxis เป็นข้อห้ามชัดเจน\n- **ไม่ให้ยาอะไรเลย** คือสาเหตุการตายที่พบบ่อยที่สุดของ food anaphylaxis ในวัยรุ่น", "pearl": "ออกจาก ER ต้องได้ **ปากกา adrenaline + action plan + นัด allergist** — ไม่ใช่ antihistamine กินทุกวัน", "topic": "Anaphylaxis — discharge plan", "src": "", "ref": ["MED33 โพย MCQ ข้อ 45 'Anaphylactic shock d/c แล้วทำไรต่อ > พกปากกา, ฉีด antihistamine ทุกวัน'", "EAACI Anaphylaxis Guideline 2021"], "nl": ["2.2.7", "2.1.50"]}, {"id": "AIR-OLD-02", "kind": "old", "stem": "A patient who survived anaphylactic shock from a bee sting is being discharged. Which of the following is the most appropriate advice?", "choices": ["Return for skin testing before any further treatment is given", "Carry an adrenaline auto-injector at all times and use it immediately when symptoms begin", "Avoid all outdoor activity permanently", "Take a daily low-dose corticosteroid to prevent further reactions", "Take a daily antihistamine for life to prevent further reactions"], "answer": 1, "explain": "โพยเก่าให้ตัวเลือก 'พกปากกา' กับ 'ฉีด/กิน antihistamine ทุกวัน' — **คำตอบคือพกปากกา (adrenaline auto-injector)**; ยาแก้แพ้กินทุกวันไม่ป้องกัน anaphylaxis และอาจกลบอาการเตือนจนฉีด adrenaline ช้า ควรให้ action plan และส่ง allergist เพื่อพิจารณา venom immunotherapy ซึ่งลดการเกิดซ้ำได้จริงในกรณีแพ้พิษผึ้ง/ต่อ", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 45 'Anaphylactic shock d/c แล้วทำไรต่อ > พกปากกา, ฉีด antihistamine ทุกวัน'", "ref": [], "nl": ["2.2.7", "2.1.50"]}]}, {"id": "air-08-03", "title": "ลมพิษและ angioedema", "minutes": 8, "summary": "CSU ใช้ antihistamine ขนาดสูง · angioedema จาก ACEI และ HAE ไม่ตอบสนอง antihistamine", "nl": ["B4.2.2(12)", "2.3.12(12)"], "md": "**Urticaria (ลมพิษ)** = ผื่นนูนแดง คัน **ย้ายที่ และแต่ละผื่นอยู่ไม่เกิน 24 ชั่วโมง** ไม่ทิ้งรอย ถ้าผื่นเดียวอยู่นานกว่า 24 ชั่วโมง เจ็บมากกว่าคัน หรือหายแล้วทิ้งรอยคล้ำ ให้คิดถึง **urticarial vasculitis** และต้องตัดชิ้นเนื้อ\n\n**Angioedema** = บวมชั้นลึก (หนังตา ริมฝีปาก ลิ้น กล่องเสียง ลำไส้) มักตึงมากกว่าคัน แบ่งเป็นสองกลุ่มใหญ่ตามสารตัวกลาง\n\n| | Histamine-mediated | Bradykinin-mediated |\n|---|---|---|\n| ตัวอย่าง | แพ้อาหาร/ยา, ร่วมกับลมพิษ | **ACE inhibitor**, hereditary angioedema (C1-INH ต่ำ) |\n| มีลมพิษร่วมไหม | มี | **ไม่มี** |\n| ตอบสนอง antihistamine/steroid/adrenaline | ตอบสนอง | **ไม่ตอบสนอง** |\n| การรักษา | antihistamine ± adrenaline | หยุดยา ACEI ตลอดชีวิต · ดูแลทางเดินหายใจ · ยาจำเพาะ (icatibant, C1-INH concentrate, FFP) |\n\n### ACE inhibitor angioedema — จุดที่ออกสอบบ่อย\n- ACEI ยับยั้งการสลาย **bradykinin** ทำให้บวมได้ **ทุกเวลา แม้กินยามาแล้วเป็นปี** (มัธยฐานราว 1–2 สัปดาห์แรก แต่ช่วงเวลากว้างมาก)\n- อุบัติการณ์สูงขึ้นในคนเชื้อสายแอฟริกัน\n- **ต้องหยุดยาถาวรและห้ามเปลี่ยนไปใช้ ACEI ตัวอื่น** — ARB ใช้ได้ในผู้ป่วยส่วนใหญ่แต่ต้องเฝ้าระวังเพราะมีรายงานเกิดซ้ำได้ราวร้อยละ 2–10\n- สิ่งสำคัญที่สุดในห้องฉุกเฉินคือ **ประเมินทางเดินหายใจ** — ลิ้นหรือกล่องเสียงบวมต้องเตรียมใส่ท่อช่วยหายใจแต่เนิ่น ๆ\n\n### Chronic spontaneous urticaria (CSU)\n- นิยาม: ลมพิษเกือบทุกวัน **นานเกิน 6 สัปดาห์** โดยไม่มีตัวกระตุ้นชัดเจน ราวร้อยละ 30–50 เป็นกลไก **autoimmune** (autoantibody ต่อ FcεRI)\n- **ไม่ต้องส่งตรวจภูมิแพ้เป็นชุดใหญ่ ไม่ต้องตรวจอาหารทีละชนิด** — ส่งเพียง CBC และ ESR/CRP เพื่อคัดกรองโรคระบบ\n- ขั้นการรักษา: **second-generation H1-antihistamine ขนาดมาตรฐาน → เพิ่มได้ถึง 4 เท่า** → ถ้ายังคุมไม่ได้จึงพิจารณา **omalizumab** หรือ ciclosporin\n- **หลีกเลี่ยงการใช้ steroid ยาว ๆ** ใช้ได้เพียงช่วงสั้นเมื่อกำเริบรุนแรง และ first-generation antihistamine ทำให้ง่วงและรบกวนการนอนโดยไม่ได้ผลดีกว่า\n", "pearls": ["ผื่นลมพิษแต่ละผื่นอยู่ไม่เกิน 24 ชม. — ถ้าอยู่นานกว่านั้นคิด urticarial vasculitis", "Angioedema ที่ไม่มีลมพิษและไม่ตอบสนอง adrenaline/antihistamine = bradykinin (ACEI หรือ HAE)", "CSU รักษาโดยเพิ่ม second-generation antihistamine ได้ถึง 4 เท่าของขนาดมาตรฐาน"], "items": [{"id": "AIR-MCQ-04", "kind": "mcq", "stem": "A 32-year-old woman has had daily itchy wheals for 8 months. Individual lesions last less than 24 hours and leave no bruising. She has no fever, arthralgia or weight loss, and no identifiable trigger. A standard dose of a second-generation antihistamine gives only partial relief. Which of the following is the most appropriate next step?", "choices": ["Switch to a first-generation sedating antihistamine at bedtime only", "Order an extensive allergy panel including food-specific IgE for 40 foods", "Increase the second-generation antihistamine up to fourfold the standard dose", "Perform skin biopsy in every patient before escalating treatment", "Start long-term daily prednisolone 10 mg"], "answer": 2, "explain": "**Chronic spontaneous urticaria (CSU) = ลมพิษเกือบทุกวันนานเกิน 6 สัปดาห์ โดยไม่มีสิ่งกระตุ้นชัดเจน** ส่วนใหญ่เป็น autoimmune (autoantibody ต่อ FcεRI หรือ IgE) ไม่ใช่แพ้อาหาร\n\n**ขั้นตอนการรักษาตาม EAACI/WAO**\n1. second-generation H1-antihistamine ขนาดมาตรฐาน\n2. **เพิ่มขนาดได้ถึง 4 เท่า** (ขั้นที่ควรทำในข้อนี้)\n3. เพิ่ม omalizumab\n4. เพิ่ม ciclosporin\n\n**ทำไมข้ออื่นผิด**\n- **Prednisolone ระยะยาว** ห้าม — ผลข้างเคียงสะสม (osteoporosis, DM, Cushing) ใช้ได้แค่ course สั้น ๆ ตอน exacerbation\n- **Allergy panel เหวี่ยงแห** ให้ผลบวกลวงสูงและไม่เปลี่ยนการรักษาใน CSU\n- **Skin biopsy** ทำเฉพาะเมื่อสงสัย **urticarial vasculitis** คือผื่นแต่ละตุ่มอยู่เกิน 24 ชั่วโมง เจ็บมากกว่าคัน และหายแล้วทิ้งรอยจ้ำ — เคสนี้ไม่มี\n- **First-generation antihistamine** ทำให้ง่วงและรบกวน REM sleep โดยไม่ได้ผลดีกว่า จึงไม่ใช่ทางเลือกแรก", "pearl": "ลมพิษเรื้อรังคุมไม่อยู่ ให้ **เพิ่มขนาด antihistamine ได้ถึง 4 เท่า** ก่อนคิดถึง steroid; ตุ่มอยู่เกิน 24 ชม. + ทิ้งรอยจ้ำ = urticarial vasculitis ต้อง biopsy", "topic": "Chronic spontaneous urticaria", "src": "", "ref": ["EAACI/GA2LEN/EuroGuiDerm Urticaria Guideline 2021", "MED32 โพย MCQ urticaria"], "nl": ["B4.2.2(12)", "2.3.12(12)", "2.1.51"]}, {"id": "AIR-MCQ-05", "kind": "mcq", "stem": "A 58-year-old man with hypertension treated with enalapril for 2 years presents with painless swelling of the lips and tongue for 6 hours. There is no urticaria and no itching. He denies new foods or drugs. PE: T 37.0 C, PR 88/min, BP 150/90 mmHg, no wheeze, no rash, tongue swollen without airway compromise at present. Which of the following is the most appropriate management?", "choices": ["Perform skin prick testing to enalapril to confirm the diagnosis", "Stop enalapril permanently, monitor the airway closely and switch to a different antihypertensive class", "Switch enalapril to losartan and continue long-term antihistamine", "Continue enalapril and add a second-generation antihistamine", "Give high-dose intravenous hydrocortisone, which reliably reverses the swelling"], "answer": 1, "explain": "**Angioedema ที่ไม่มีลมพิษและไม่คัน = bradykinin-mediated ไม่ใช่ histamine-mediated**\n\nACE inhibitor ยับยั้ง **kininase II** ซึ่งเป็นเอนไซม์เดียวกับ ACE ที่ทำหน้าที่สลาย bradykinin → bradykinin คั่ง → หลอดเลือดรั่วเฉพาะที่ริมฝีปาก ลิ้น กล่องเสียง เกิดได้ **ทุกช่วงเวลา** ตั้งแต่วันแรกจนถึงหลายปีหลังเริ่มยา (จึงไม่ใช่ข้อแก้ต่างว่ากินมา 2 ปีแล้วไม่น่าจะแพ้)\n\n**การรักษา** — หยุดยาถาวร (ห้ามกลับมาใช้ ACEI ตัวใดอีก) เฝ้าระวังทางเดินหายใจอย่างใกล้ชิด เตรียม intubation ถ้าลิ้นหรือกล่องเสียงบวมมาก ยาแก้แพ้ สเตียรอยด์ และ adrenaline **มักไม่ได้ผล** เพราะกลไกไม่ใช่ histamine (ให้ adrenaline ได้เมื่อแยกจาก anaphylaxis ไม่ออก แต่อย่าหวังผล)\n\n**ทำไมข้ออื่นผิด**\n- **ใช้ ACEI ต่อ** = เสี่ยงตายจาก laryngeal edema รอบถัดไป\n- **เปลี่ยนเป็น ARB** ยังมีรายงาน cross-reaction ได้ประมาณ 2–10% แม้กลไกต่างกัน จึงไม่ใช่คำตอบที่ปลอดภัยที่สุด และ antihistamine ระยะยาวไม่มีบทบาท\n- **Steroid** ไม่ได้ผลใน bradykinin-mediated angioedema\n- **Skin prick test** ใช้ทดสอบ IgE-mediated เท่านั้น ไม่มีที่ใช้ในกลไกนี้", "pearl": "**บวมโดยไม่มีลมพิษ ไม่คัน = bradykinin** — นึกถึง ACEI และ hereditary angioedema ไว้ก่อน, ยาแก้แพ้กับสเตียรอยด์ไม่ช่วย", "topic": "ACE inhibitor angioedema", "src": "", "ref": ["MED31 โพย MCQ angioedema จาก ACEI", "Harrison 21st ed., Urticaria and Angioedema"], "nl": ["B4.2.2(12)", "2.2.7", "2.1.50"]}]}, {"id": "air-08-04", "title": "แพ้ยารุนแรงทางผิวหนัง — SJS/TEN, DRESS และ HLA", "minutes": 10, "summary": "สัญญาณอันตราย หยุดยาต้นเหตุทันที และยาที่ต้องตรวจ HLA ก่อนเริ่ม", "nl": ["2.1.50", "B4.2.2(12)"], "md": "ผื่นจากยาส่วนใหญ่เป็น **maculopapular exanthem** ที่ไม่อันตราย แต่มีไม่กี่รูปแบบที่ฆ่าคนได้ หน้าที่แรกคือ **แยกผื่นธรรมดาออกจากผื่นอันตราย**\n\n### สัญญาณอันตราย (เจอข้อใดข้อหนึ่ง ให้หยุดยาที่สงสัยทันทีและรับไว้ในโรงพยาบาล)\n- **เยื่อบุถูกทำลาย** — ปาก ตา อวัยวะเพศ เป็นแผล\n- ผิวหนัง **เจ็บ** มากกว่าคัน, **Nikolsky sign บวก**, ผิวลอกเป็นแผ่น\n- **ไข้สูง** ร่วมกับผื่น, หน้าบวม, ต่อมน้ำเหลืองโต\n- ตรวจเลือดผิดปกติ — **eosinophilia, atypical lymphocyte, transaminitis, Cr ขึ้น**\n\n### สามกลุ่มที่ต้องแยกให้ออก\n\n| | SJS / TEN | DRESS | AGEP |\n|---|---|---|---|\n| เริ่มหลังเริ่มยา | 4 วัน – 4 สัปดาห์ | **2–8 สัปดาห์ (ช้าที่สุด)** | 1–2 วัน |\n| ผื่น | targetoid, ตุ่มน้ำ, **ผิวลอก**, เยื่อบุเป็นแผล | ผื่นแดงทั่วตัว **หน้าบวม** ต่อมน้ำเหลืองโต | ตุ่มหนองเล็กจำนวนมากบนผิวแดง ซอกพับ |\n| แล็บเด่น | ผิวลอก %BSA เป็นตัวบอกความรุนแรง (SJS <10%, overlap 10–30%, TEN >30%) | **eosinophilia + atypical lymphocyte + ตับอักเสบ/ไตอักเสบ** (HHV-6 reactivation) | neutrophilia |\n| ยาที่พบบ่อย | allopurinol, carbamazepine, phenytoin, cotrimoxazole, nevirapine, NSAIDs (oxicam) | allopurinol, anticonvulsant, sulfonamide, vancomycin, minocycline | aminopenicillin, macrolide, diltiazem |\n| หัวใจของการรักษา | **หยุดยาต้นเหตุทันที** + ดูแลแบบแผลไฟไหม้ (สารน้ำ อุณหภูมิ ตา เยื่อบุ) ± ciclosporin/IVIG | **หยุดยา + systemic corticosteroid** และค่อย ๆ ลดยานาน 6–8 สัปดาห์ เฝ้าระวังตับ ไต หัวใจ ไทรอยด์ | หยุดยา ส่วนใหญ่หายเอง |\n\n> สิ่งที่ทำให้พยากรณ์โรค SJS/TEN ดีขึ้นที่สุดคือ **ความเร็วในการหยุดยาต้นเหตุ** ไม่ใช่ยาเฉพาะตัวใด ใช้ **SCORTEN** ประเมินความรุนแรง และย้ายผู้ป่วย TEN ไปหน่วยดูแลแผลไฟไหม้\n\n### HLA กับการแพ้ยา — โจทย์ยอดนิยมของคนไทย\n| ยา | HLA | ประชากรที่ต้องตรวจก่อนใช้ |\n|---|---|---|\n| **Allopurinol** | **HLA-B*58:01** | เชื้อสายจีน/ไทย/เกาหลี — เสี่ยง SJS/TEN/DRESS สูงมาก |\n| **Carbamazepine** | **HLA-B*15:02** | เชื้อสายเอเชีย (ไทย จีน มาเลย์) — เสี่ยง SJS/TEN |\n| Abacavir | HLA-B*57:01 | ทุกเชื้อชาติ — hypersensitivity syndrome |\n| Phenytoin | HLA-B*15:02, CYP2C9*3 | เอเชีย |\n\n**ผู้ป่วยที่เคยเกิด SJS/TEN จากยาตัวใด ห้ามได้ยานั้นซ้ำตลอดชีวิต** และต้องบันทึกในบัตรแพ้ยาให้ชัดเจน ส่วนการตรวจ HLA มีประโยชน์เป็น **การคัดกรองก่อนเริ่มยา** ไม่ใช่การวินิจฉัยย้อนหลัง\n", "pearls": ["ผื่น + เยื่อบุเป็นแผล + ผิวเจ็บ/ลอก = SJS/TEN จนกว่าจะพิสูจน์เป็นอย่างอื่น", "ผื่น + ไข้ + หน้าบวม + eosinophilia + ตับอักเสบ หลังยา 2–8 สัปดาห์ = DRESS", "ก่อนเริ่ม allopurinol ในคนไทยควรตรวจ HLA-B*58:01 · carbamazepine ตรวจ HLA-B*15:02", "การรักษาที่สำคัญที่สุดคือหยุดยาต้นเหตุให้เร็วที่สุด"], "items": [{"id": "AIR-MCQ-07", "kind": "mcq", "stem": "A 46-year-old woman develops fever and a painful rash 3 weeks after starting phenytoin. PE: T 38.8 C, dusky targetoid macules coalescing over the trunk with epidermal detachment of about 12% of body surface area, positive Nikolsky sign, erosions of the lips, oral mucosa and conjunctivae. Which of the following is the most important immediate management?", "choices": ["Apply potent topical corticosteroid to the detached areas and discharge with follow-up", "Stop phenytoin immediately and transfer for intensive supportive care with fluid, wound and eye care", "Start high-dose intravenous immunoglobulin as the definitive treatment before stopping the drug", "Continue phenytoin because the seizure risk outweighs the skin reaction", "Start empirical intravenous antibiotics prophylactically in all patients"], "answer": 1, "explain": "**ผื่นเจ็บ + mucosa อย่างน้อย 2 ตำแหน่ง + epidermal detachment + Nikolsky positive หลังได้ยา 1–4 สัปดาห์ = SJS/TEN (type IVc, cytotoxic T cell ทำลาย keratinocyte ผ่าน granulysin)**\n\nจำแนกตามพื้นที่ลอก: **SJS < 10% · SJS/TEN overlap 10–30% · TEN > 30%** (เคสนี้ 12% = overlap)\n\n**สิ่งที่กำหนดอัตราตายมากที่สุดคือ 'หยุดยาต้นเหตุให้เร็วที่สุด'** ทุกวันที่ช้าออกไปเพิ่มอัตราตาย จากนั้นดูแลแบบผู้ป่วยไฟไหม้: สารน้ำ ควบคุมอุณหภูมิ แผล ตา (ป้องกัน symblepharon ต้องปรึกษาจักษุแพทย์ทันที) ปาก โภชนาการ และประเมินความรุนแรงด้วย **SCORTEN**\n\n**ทำไมข้ออื่นผิด**\n- **ใช้ยาต่อ** ไม่มีทางถูก — ต้องเปลี่ยนไปยากันชักที่โครงสร้างต่างกัน (เช่น valproate, levetiracetam) และ **ห้ามใช้ aromatic anticonvulsant ทุกตัว** เพราะ cross-reactivity สูง\n- **IVIG** หลักฐานยังขัดแย้ง และไม่มีทางมาก่อนการหยุดยา\n- **ยาปฏิชีวนะ prophylaxis** ไม่แนะนำ ให้เมื่อมีหลักฐานติดเชื้อเท่านั้น (เพาะเชื้อเฝ้าระวังแทน)\n- **ให้กลับบ้าน** ในผู้ป่วยผิวหนังลอก 12% คือความผิดพลาดร้ายแรง", "pearl": "SJS/TEN: **หยุดยาต้นเหตุทันที = การรักษาที่สำคัญที่สุด** แล้วดูแลแบบแผลไฟไหม้ + ปรึกษาจักษุวันแรก", "topic": "Stevens-Johnson syndrome / TEN", "src": "", "ref": ["MED32 โพย Skin — SJS จากยากันชัก", "Harrison 21st ed., Cutaneous Drug Reactions"], "nl": ["B4.2.2(13)", "2.3.12(13)", "2.1.50", "2.1.1"]}, {"id": "AIR-OLD-05", "kind": "old", "stem": "A patient taking allopurinol develops a widespread painful rash with erosions of the lips, oral mucosa and conjunctivae, with skin detachment of about 8% of body surface area. What is the diagnosis?", "choices": ["Staphylococcal scalded skin syndrome", "Drug reaction with eosinophilia and systemic symptoms", "Acute generalized exanthematous pustulosis", "Erythema multiforme minor", "Stevens-Johnson syndrome"], "answer": 4, "explain": "**การมีเยื่อบุอย่างน้อย 2 ตำแหน่งเป็นแผลร่วมกับผิวหนังลอก = SJS** (ลอก < 10% = SJS, 10-30% = overlap, > 30% = TEN) ต่างจาก erythema multiforme ที่เป็น target lesion ปลายแขนขาและมักจากเริม; การรักษาที่สำคัญที่สุดคือ **หยุดยาต้นเหตุทันที** แล้วดูแลแบบผู้ป่วยไฟไหม้ พร้อมปรึกษาจักษุแพทย์ตั้งแต่วันแรก", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 2 'Allopurinol แพ้ยาแบบ involve mucosa > SJS'", "ref": [], "nl": ["B4.2.2(13)", "2.3.12(13)", "2.1.50"]}, {"id": "AIR-MCQ-08", "kind": "mcq", "stem": "A 40-year-old man develops fever and a diffuse maculopapular rash 5 weeks after starting allopurinol. PE: T 39.0 C, generalized morbilliform rash with facial edema and cervical lymphadenopathy. Lab: WBC 14,800/mm3 with eosinophils 18%, atypical lymphocytes present, AST/ALT 320/410 U/L, creatinine 1.6 mg/dL (baseline 1.0). Which of the following is the most likely diagnosis?", "choices": ["Simple morbilliform drug eruption", "Drug reaction with eosinophilia and systemic symptoms (DRESS)", "Adult-onset Still disease", "Stevens-Johnson syndrome", "Acute generalized exanthematous pustulosis"], "answer": 1, "explain": "**DRESS = ผื่นยาที่มาช้า (2–8 สัปดาห์) + ไข้ + หน้าบวม + ต่อมน้ำเหลืองโต + eosinophilia + อวัยวะภายในอักเสบ** (ตับบ่อยที่สุด รองมาคือไตและปอด) เกี่ยวข้องกับการ reactivation ของ HHV-6/EBV ยาต้นเหตุคลาสสิกคือ **allopurinol, ยากันชัก aromatic, sulfonamide, vancomycin, dapsone**\n\n**จุดแยกจากโรคอื่น**\n\n| | เวลา | ผื่น | ลักษณะเด่น |\n|---|---|---|---|\n| **DRESS** | **2–8 สัปดาห์** | morbilliform + **หน้าบวม** | **eosinophilia + ตับอักเสบ + ต่อมน้ำเหลืองโต** |\n| SJS/TEN | 4 วัน–4 สัปดาห์ | ผื่นเจ็บ ลอก **mucosa** | Nikolsky +, ไม่ค่อยมี eosinophilia |\n| AGEP | **1–2 วัน** | ตุ่มหนองเล็กบน erythema | neutrophilia เด่น หายเร็วหลังหยุดยา |\n| Morbilliform eruption | 4–14 วัน | ผื่นราบ ไม่เจ็บ | **ไม่มี** ไข้สูง ตับอักเสบ หรือ eosinophilia |\n\n**การรักษา** — หยุดยาทันที ให้ systemic corticosteroid (prednisolone 0.5–1 mg/kg/วัน) **แล้วค่อย ๆ ลดยาวหลายสัปดาห์** เพราะ DRESS กลับเป็นซ้ำได้ง่าย และต้องติดตามการทำงานของตับ ไต และไทรอยด์ไปอีกหลายเดือน", "pearl": "ผื่นยา + **eosinophilia + ตับอักเสบ + หน้าบวม** ที่มาช้าเป็นสัปดาห์ = DRESS; ต้องหยุดยาและให้สเตียรอยด์ลดยาว ไม่ใช่ course สั้น", "topic": "DRESS syndrome", "src": "", "ref": ["MED34 โพย ผื่นแพ้ยา allopurinol", "RegiSCAR DRESS criteria"], "nl": ["B4.2.2(13)", "2.1.50", "2.1.1", "2.3.3(4)"]}, {"id": "AIR-MCQ-06", "kind": "mcq", "stem": "A 55-year-old Thai man with gout and stage 3 chronic kidney disease is about to start urate-lowering therapy with allopurinol. Which of the following tests should be performed before starting the drug to reduce the risk of severe cutaneous adverse reaction?", "choices": ["HLA-B*58:01 genotyping", "HLA-B*57:01 genotyping", "HLA-B*15:02 genotyping", "Serum tryptase level", "Allopurinol skin prick test"], "answer": 0, "explain": "**Severe cutaneous adverse reaction (SCAR) จาก allopurinol — SJS/TEN และ DRESS — สัมพันธ์กับ HLA-B\\*58:01 อย่างชัดเจนในคนไทยและเอเชีย** (odds ratio หลายสิบเท่า) และความเสี่ยงยิ่งสูงขึ้นเมื่อมี CKD เพราะ oxypurinol คั่ง\n\n| Allele | ยาที่ต้องระวัง | ปฏิกิริยา |\n|---|---|---|\n| **HLA-B\\*58:01** | **Allopurinol** | **SJS/TEN, DRESS** |\n| HLA-B\\*15:02 | Carbamazepine (และ phenytoin บางส่วน) | SJS/TEN |\n| HLA-B\\*57:01 | Abacavir | hypersensitivity syndrome |\n\n**คำแนะนำปฏิบัติ** — ถ้าตรวจพบ HLA-B\\*58:01 positive ให้เลี่ยงไปใช้ **febuxostat** หรือ probenecid; ถ้าไม่ได้ตรวจ ให้เริ่ม allopurinol ขนาดต่ำ (50–100 mg/วัน ปรับตาม eGFR) แล้วค่อย ๆ เพิ่ม ซึ่งลดอุบัติการณ์ SCAR ได้\n\n**ทำไมข้ออื่นผิด** — B\\*15:02 เป็นของ carbamazepine (โพยเก่าตอบสับกันบ่อยมาก), B\\*57:01 ของ abacavir, tryptase ใช้ยืนยัน anaphylaxis ย้อนหลัง ไม่ทำนาย SCAR, skin prick test ไม่ใช้กับ delayed T-cell reaction", "pearl": "**Allopurinol → B\\*58:01 · Carbamazepine → B\\*15:02 · Abacavir → B\\*57:01** ท่องสามคู่นี้ให้ขึ้นใจ", "topic": "Allopurinol hypersensitivity and HLA screening", "src": "", "ref": ["MED33 โพย Skin ข้อ 2 'คนไข้มาด้วย SJS ก่อนหน้านี้ได้ Allopurinol ไม่ได้ส่งตรวจยีน — A. HLA-B1502 B. HLA-B5802'", "ACR Gout Guideline 2020"], "nl": ["B4.2.2(13)", "2.3.12(13)", "B5.4(4)"]}, {"id": "AIR-OLD-04", "kind": "old", "stem": "A patient develops Stevens-Johnson syndrome after receiving allopurinol. Testing for which allele would have identified the risk before prescribing?", "choices": ["HLA-B27", "HLA-DR4", "HLA-B*15:02", "HLA-B*57:01", "HLA-B*58:01"], "answer": 4, "explain": "โพยเก่าให้ตัวเลือก 'HLA-B1502' กับ 'HLA-B5802' — ที่ถูกต้องคือ **HLA-B\\*58:01 สำหรับ allopurinol**; **B\\*15:02 คู่กับ carbamazepine**, B\\*57:01 คู่กับ abacavir, HLA-DR4 สัมพันธ์กับ RA และ B27 กับ spondyloarthropathy", "pearl": "", "topic": "", "src": "MED33 โพย Skin ข้อ 2 'คนไข้มาด้วย SJS ก่อนหน้านี้มีประวัติให้ยา Allopurinol ซึ่งไม่ได้ส่งตรวจยีนอะไรก่อนให้'", "ref": [], "nl": ["B4.2.2(13)", "2.3.12(13)", "B5.4(4)"]}]}, {"id": "air-08-05", "title": "ประเมินประวัติแพ้ยา และการ de-label penicillin", "minutes": 7, "summary": "คนส่วนใหญ่ที่บอกว่าแพ้ penicillin ไม่ได้แพ้จริง และการติดป้ายผิดทำให้ผลการรักษาแย่ลง", "nl": ["2.1.50"], "md": "ราวร้อยละ 10 ของผู้ป่วยบอกว่า “แพ้ penicillin” แต่เมื่อประเมินจริง **มากกว่าร้อยละ 90 ไม่ได้แพ้แบบ IgE** เพราะ IgE ต่อ penicillin จะจางหายไปตามเวลา (หลัง 10 ปี ผู้ที่เคยแพ้จริงราวร้อยละ 80 ทดสอบได้ผลลบ) การติดป้ายแพ้ไว้โดยไม่ประเมินทำให้ผู้ป่วยได้ยากลุ่มที่กว้างเกินจำเป็น เกิด MRSA, C. difficile และการรักษาล้มเหลวมากขึ้น\n\n### ประวัติที่ต้องซักให้ครบ (ใช้ได้ทั้งในหอผู้ป่วยและในสถานี OSCE)\n1. **ยาอะไร ขนาดเท่าไร ทางไหน** และแพ้เมื่อกี่ปีก่อน\n2. **ห่างจากมื้อยากี่นาที/กี่วัน** — นาที = IgE · วัน–สัปดาห์ = T cell\n3. **อาการจริงคืออะไร** ให้ผู้ป่วยบรรยาย ไม่ใช่ถามนำ (ผื่นแบบไหน · บวมตรงไหน · หายใจลำบากไหม · ความดันตกไหม · เยื่อบุเป็นแผลไหม)\n4. อาการนั้น **หายได้อย่างไร** ต้องฉีด adrenaline หรือนอนโรงพยาบาลไหม\n5. **เคยได้ยากลุ่มเดียวกันอีกหลังจากนั้นหรือไม่** — ถ้าเคยได้แล้วไม่เป็นอะไร แปลว่าไม่ได้แพ้\n6. อาการที่ไม่ใช่การแพ้ — คลื่นไส้ ท้องเสีย ปวดหัว ใจสั่น = **ผลข้างเคียง ไม่ใช่ข้อห้าม**\n\n### เส้นทางการ de-label\n- **ประวัติไม่เข้าได้กับการแพ้เลย** (เช่น ท้องเสียอย่างเดียว หรือจำอะไรไม่ได้และเคยได้ยาซ้ำแล้วปกติ) → ลบป้ายแพ้ได้เลย\n- **ความเสี่ยงต่ำ** (ผื่นคันไม่รุนแรงเมื่อนานกว่า 10 ปีก่อน ไม่มี anaphylaxis) → **direct oral amoxicillin challenge** ภายใต้การเฝ้าระวัง เป็นวิธีที่มาตรฐานปัจจุบันแนะนำ\n- **ประวัติ IgE ชัดเจนหรือไม่แน่ใจ** → **skin test (major/minor determinant) แล้วตามด้วย challenge** ถ้าผลลบ\n- **เคยเกิด SJS/TEN, DRESS หรือ AIHA จากยานั้น** → **ห้ามทดสอบและห้ามให้ยานั้นซ้ำเด็ดขาด** ไม่ว่ากรณีใด\n- ปฏิกิริยาข้ามกลุ่มระหว่าง penicillin กับ **cephalosporin รุ่นใหม่ต่ำมาก (~1–2%)** เพราะโครงสร้าง side chain ต่างกัน ไม่ใช่ร้อยละ 10 อย่างที่เคยเชื่อกัน\n", "pearls": ["ประวัติแพ้ยาที่ดีต้องได้ 3 อย่าง: ยาอะไร · ห่างกี่นาที/กี่วัน · อาการอะไรจริง ๆ", "ผู้ป่วยความเสี่ยงต่ำ de-label ได้ด้วย direct oral amoxicillin challenge", "เคยเป็น SJS/TEN หรือ DRESS จากยาใด = ห้ามยานั้นตลอดชีวิต ห้าม challenge"], "items": [{"id": "AIR-MCQ-09", "kind": "mcq", "stem": "A 30-year-old woman needs treatment for acute pyelonephritis. Her record says 'penicillin allergy' because she had a non-pruritic maculopapular rash at age 5 while taking amoxicillin for pharyngitis, with no swelling, no breathing difficulty and no hospitalization. Which of the following statements is most accurate?", "choices": ["Desensitization is required before any beta-lactam can be used in this patient", "She should receive prophylactic corticosteroid and antihistamine before any beta-lactam", "She must avoid all beta-lactam antibiotics for life, including cephalosporins and carbapenems", "A childhood benign maculopapular rash is a low-risk history, and she can receive a cephalosporin or be evaluated for penicillin de-labeling", "The risk of anaphylaxis from cephalosporin in this patient exceeds 10 percent"], "answer": 3, "explain": "**กว่า 90% ของผู้ที่ถูกติดป้ายว่า 'แพ้ penicillin' แท้จริงไม่แพ้** — ส่วนใหญ่เป็นผื่นจากไวรัสตอนเด็กที่บังเอิญกินยาอยู่ หรือ IgE หายไปตามเวลา (ประมาณ 80% ของผู้ที่แพ้จริงจะสูญเสีย IgE ภายใน 10 ปี)\n\n**ต้นทุนของป้ายแพ้ยาที่ผิด** — ได้ยาทางเลือกที่ด้อยกว่า (vancomycin, fluoroquinolone) → ผลการรักษาแย่ลง เชื้อดื้อยา และ C. difficile มากขึ้น\n\n**การประเมินความเสี่ยง**\n- **Low risk** = ผื่นราบล้วนตอนเด็ก, อาการที่ไม่ใช่ภูมิแพ้ (คลื่นไส้ ปวดหัว), หรือประวัติคลุมเครือเกิน 10 ปี → ให้ cephalosporin ที่ side chain ต่างกันได้เลย หรือทำ direct oral challenge\n- **High risk** = anaphylaxis, angioedema, ผื่นลมพิษทันที → ส่ง allergist เพื่อทำ skin test หรือ desensitization\n- **ห้ามใช้ซ้ำเด็ดขาด** = เคยเกิด SJS/TEN หรือ DRESS จากยานั้น (การ desensitize ก็ห้าม)\n\n**ทำไมข้ออื่นผิด** — cross-reactivity ระหว่าง penicillin กับ cephalosporin รุ่นใหม่จริง ๆ อยู่ที่ **ราว 1–2%** ไม่ใช่ 10% และขึ้นกับ **side chain** ไม่ใช่วง beta-lactam; การให้ยาแก้แพ้ล่วงหน้าไม่ป้องกัน IgE-mediated reaction และกลบอาการเตือน", "pearl": "ป้าย 'แพ้ penicillin' ต้อง **ซักให้ได้ว่าอาการคืออะไร เมื่อไร** — ผื่นราบตอนเด็ก = low risk ให้ beta-lactam ต่อได้ แต่ SJS/TEN หรือ DRESS = ห้ามตลอดชีวิต", "topic": "Penicillin allergy de-labeling", "src": "", "ref": ["MED35 โพย MCQ drug allergy history", "IDSA/AAAAI Penicillin Allergy Evaluation 2022"], "nl": ["B4.2.2(13)", "2.2.7"]}]}, {"id": "air-08-06", "title": "ปฏิกิริยาจากการให้เลือด", "minutes": 8, "summary": "แยกชนิดจากเวลาและอาการ — ข้อแรกที่ต้องทำเสมอคือหยุดให้เลือด", "nl": ["2.2.21", "2.3.3(4)"], "md": "ทุกปฏิกิริยาเริ่มด้วยขั้นเดียวกัน — **หยุดให้เลือดทันที เปิดเส้นด้วย NSS เส้นใหม่ ตรวจสอบป้ายชื่อผู้ป่วยกับถุงเลือด** แล้วจึงแยกชนิดจากเวลาและอาการ\n\n| ปฏิกิริยา | เวลา | อาการเด่น | กลไก | จัดการ |\n|---|---|---|---|---|\n| **Acute hemolytic (AHTR)** | นาที–1 ชม. | ไข้ หนาวสั่น ปวดหลัง/สีข้าง **ปัสสาวะสีโคล่า** ความดันตก เลือดออกจากรอยเจาะ (DIC) | **ABO incompatibility — type II** (มัก error ที่ป้ายชื่อ) | หยุดเลือด · สารน้ำเยอะ รักษาปัสสาวะออก · ส่งถุงเลือด + เลือดผู้ป่วยตรวจซ้ำ · **direct Coombs บวก** |\n| **Allergic / urticarial** | นาที–2 ชม. | ลมพิษ คัน **ไม่มีไข้** | IgE ต่อโปรตีนในพลาสมา | หยุดชั่วคราว ให้ antihistamine ถ้าผื่นหายดีให้ต่อได้ |\n| **Anaphylactic** | นาที | ความดันตก หลอดลมตีบ (พบในผู้ขาด **IgA**) | IgE/anti-IgA | **adrenaline IM** · ใช้เลือดที่ล้างแล้ว (washed) ครั้งต่อไป |\n| **FNHTR** | 1–6 ชม. | ไข้ขึ้น ≥1 °C หนาวสั่น **ไม่มีเม็ดเลือดแดงแตก ปัสสาวะสีปกติ** | cytokine จากเม็ดเลือดขาวผู้บริจาค | หยุดเลือด ให้ paracetamol · ป้องกันด้วย **leukoreduced blood** |\n| **TACO** | ระหว่าง–6 ชม. | หอบ นอนราบไม่ได้ ความดัน **สูง** JVP สูง | ปริมาตรเกิน | หยุด/ชะลอ · ให้ยาขับปัสสาวะ · ออกซิเจน |\n| **TRALI** | ภายใน 6 ชม. | หอบเฉียบพลัน **ความดันต่ำ** ไข้ CXR แบบ ARDS **JVP ไม่สูง** | anti-HLA/HNA antibody ของผู้บริจาค | ประคับประคองทางเดินหายใจ **ห้ามให้ยาขับปัสสาวะ** |\n| **Delayed hemolytic** | 3–14 วัน | Hb ไม่ขึ้นตามคาด ตัวเหลืองเล็กน้อย | anamnestic response ต่อ minor antigen (Kidd, Rh) | ติดตาม ไม่ต้องรักษาจำเพาะ |\n| **Septic** | ระหว่าง–ไม่กี่ชม. | ไข้สูงมาก ความดันตก | ถุงเลือดปนเชื้อ (พบมากใน platelet) | หยุด · เพาะเชื้อทั้งผู้ป่วยและถุงเลือด · ยาปฏิชีวนะ |\n\n### กับดักที่ออกสอบบ่อย\n- **ไข้ + ปัสสาวะสีปกติ + ไม่มีหลักฐานเม็ดเลือดแดงแตก** → FNHTR ไม่ใช่ AHTR\n- **ลมพิษเดี่ยว ๆ ไม่มีไข้** → allergic reaction ให้ antihistamine และ **ให้เลือดต่อได้** ถ้าอาการหายดี เป็นปฏิกิริยาชนิดเดียวที่ทำเช่นนี้ได้\n- แยก **TACO กับ TRALI** ด้วยความดันและ JVP — TACO ความดันสูง JVP สูง ตอบสนองยาขับปัสสาวะ · TRALI ความดันต่ำ JVP ปกติ ห้ามขับปัสสาวะ\n", "pearls": ["ทุกปฏิกิริยา: หยุดเลือดก่อน เปิด NSS เส้นใหม่ แล้วตรวจป้ายชื่อ", "ปัสสาวะสีโคล่า + ปวดหลัง + ความดันตก = AHTR จาก ABO mismatch", "ลมพิษอย่างเดียวไม่มีไข้ = allergic reaction ให้ antihistamine แล้วให้เลือดต่อได้", "TRALI ห้ามให้ยาขับปัสสาวะ · TACO ต้องให้"], "items": [{"id": "AIR-MCQ-10", "kind": "mcq", "stem": "A 62-year-old woman receiving packed red cells develops fever 39.0 C, chills, flank pain and dark red urine 15 minutes after the transfusion starts. BP 88/54 mmHg, PR 124/min. Which of the following is the most appropriate immediate action?", "choices": ["Stop the transfusion and give intramuscular adrenaline as the first drug", "Stop the transfusion immediately, keep the intravenous line open with normal saline and send blood and the unit for investigation", "Change to leukocyte-poor red cells and restart immediately", "Slow the transfusion rate and give intravenous paracetamol and chlorpheniramine", "Continue the transfusion and give furosemide to protect the kidney"], "answer": 1, "explain": "**ไข้ + ปวดสีข้าง + ปัสสาวะสีแดงเข้ม ภายในนาทีแรก ๆ ของการให้เลือด = acute hemolytic transfusion reaction (AHTR)** จาก ABO incompatibility — เป็น **type II hypersensitivity**: IgM/IgG ของผู้รับจับ RBC ผู้ให้ → complement activation ครบวง → intravascular hemolysis, hemoglobinuria, DIC และ acute kidney injury\n\n**ลำดับการทำทันที**\n1. **หยุดให้เลือดทันที** และเปลี่ยนสาย/ให้ NSS ต่อเพื่อรักษาปริมาตรและ urine output\n2. ตรวจสอบชื่อผู้ป่วยกับถุงเลือดซ้ำ ส่งถุงเลือด + เลือดผู้ป่วยกลับธนาคารเลือด (repeat cross-match, direct Coombs, plasma free Hb)\n3. ประคับประคอง: สารน้ำให้ urine ออกดี เฝ้า DIC และไตวาย\n\n**แยกจากปฏิกิริยาอื่น**\n\n| ปฏิกิริยา | เวลา | อาการเด่น | จัดการ |\n|---|---|---|---|\n| **AHTR** | **นาที** | ไข้ ปวดสีข้าง **ปัสสาวะดำ/แดง** ความดันตก | **หยุดถาวร** + ประคับประคอง |\n| Febrile non-hemolytic | 1–6 ชม. | ไข้ หนาวสั่น **ไม่มี** ปัสสาวะสีผิดปกติ | หยุด ให้ยาลดไข้ ครั้งหน้าใช้ leukocyte-poor |\n| Allergic/urticarial | นาที–ชม. | ผื่นลมพิษอย่างเดียว | หยุดชั่วคราว ให้ antihistamine แล้วให้ต่อช้า ๆ ได้ |\n| TACO | 1–6 ชม. | เหนื่อย ความดัน**สูง** JVP สูง | หยุด + furosemide |\n\n**ทำไมข้ออื่นผิด** — การให้ยาลดไข้แล้วให้เลือดต่อเหมาะกับ FNHTR เท่านั้น, furosemide ไม่ใช่หัวใจของการรักษา AHTR และห้ามให้เลือดต่อ, adrenaline สงวนไว้สำหรับ anaphylactic transfusion reaction (หอบ ความดันตก ไม่มี hemolysis)", "pearl": "ให้เลือดแล้ว **ไข้ + ปวดหลัง + ปัสสาวะดำ = AHTR หยุดทันที**; ไข้อย่างเดียวไม่มีปัสสาวะผิดปกติ = FNHTR", "topic": "Acute hemolytic transfusion reaction", "src": "", "ref": ["MED33 โพย Hemato ข้อ 3 'ให้เลือดแล้วมีไข้ ไม่มี dark urine → febrile non-hemolytic'", "AABB Technical Manual 20th ed."], "nl": ["2.2.21", "2.3.3(4)", "2.1.1"]}, {"id": "AIR-OLD-07", "kind": "old", "stem": "A patient develops fever and chills 2 hours into a red cell transfusion. Urine colour is normal, blood pressure is stable and there is no flank pain. What is the most likely diagnosis and the measure to prevent recurrence?", "choices": ["Transfusion-associated circulatory overload; give diuretics", "Febrile non-hemolytic transfusion reaction; use leukocyte-reduced blood components in future transfusions", "Bacterial contamination; culture the unit and give antibiotics", "Transfusion-related acute lung injury; use plasma from male donors", "Acute hemolytic transfusion reaction; recheck ABO compatibility"], "answer": 1, "explain": "**ไข้และหนาวสั่นโดยไม่มี hemolysis = FNHTR** จาก cytokine ที่สะสมจากเม็ดเลือดขาวของผู้ให้ หรือแอนติบอดีของผู้รับต่อ HLA ของเม็ดเลือดขาว — ป้องกันด้วย **leukocyte-reduced (leukocyte-poor) blood** ไม่ใช่การให้ยาลดไข้ล่วงหน้าเป็นประจำ; ที่สำคัญคือ **ต้องหยุดให้เลือดและตรวจแยก AHTR กับการปนเปื้อนเชื้อก่อนเสมอ**", "pearl": "", "topic": "", "src": "MED33 โพย Hemato ข้อ 3 'ให้เลือดแล้วมีไข้ ไม่มี dark urine > febrile non hemolytic transfusion reaction' และข้อ 'ให้ leukocyte poor RBC'", "ref": [], "nl": ["2.2.21", "2.1.1"]}, {"id": "AIR-MCQ-11", "kind": "mcq", "stem": "A 28-year-old man with thalassemia develops itchy urticarial wheals over the chest 15 minutes into a packed red cell transfusion. He has no fever, no dyspnea, normal blood pressure and normal urine colour. Which of the following is the most appropriate management?", "choices": ["Continue the transfusion at the same rate and give paracetamol", "Give intravenous furosemide for suspected circulatory overload", "Stop the transfusion permanently and report acute hemolytic transfusion reaction", "Give intramuscular adrenaline and admit to intensive care", "Pause the transfusion, give an antihistamine, and resume slowly if the wheals resolve and no other symptom appears"], "answer": 4, "explain": "**ผื่นลมพิษอย่างเดียว ไม่มีไข้ ไม่มีอาการระบบอื่น = allergic (urticarial) transfusion reaction** เกิดจาก IgE ของผู้รับต่อโปรตีนในพลาสมาผู้ให้ เป็นปฏิกิริยาที่พบบ่อยและไม่รุนแรง\n\n**เป็นชนิดเดียวที่อนุญาตให้ 'ให้เลือดต่อ' ได้** — หยุดชั่วคราว ให้ antihistamine รอผื่นยุบ แล้วเริ่มใหม่ช้า ๆ พร้อมเฝ้าอาการ ถ้าเป็นซ้ำบ่อยครั้งหน้าให้พิจารณา washed red cells\n\n**ทำไมข้ออื่นผิด**\n- **AHTR** ต้องมีไข้ ปวดสีข้าง ปัสสาวะสีเข้ม หรือความดันตก — เคสนี้ไม่มี และเวลา 15 นาทีเพียงอย่างเดียวไม่พอวินิจฉัย (โพยเก่าหลอกด้วยเวลา 15 นาทีเสมอ)\n- **Adrenaline/ICU** ใช้เมื่อมี anaphylaxis คือมี bronchospasm, angioedema หรือความดันตกร่วมด้วย\n- **ให้ต่อในอัตราเดิม + paracetamol** เหมาะกับ FNHTR ไม่ใช่ผื่นลมพิษ และการไม่หยุดเลยทำให้พลาด anaphylaxis ที่กำลังก่อตัว\n- **Furosemide** ใช้ใน TACO ซึ่งจะมีเหนื่อยและความดันสูง", "pearl": "ผื่นลมพิษล้วนระหว่างให้เลือด = allergic reaction — **ชนิดเดียวที่ให้เลือดต่อได้** หลังผื่นยุบ", "topic": "Allergic transfusion reaction", "src": "", "ref": ["MED33 โพย MCQ ข้อ 41 'Blood transfusion ทำไป 15 นาทีเกิดผื่นขึ้น (delay, acute, allergy, purpura)'", "AABB Technical Manual 20th ed."], "nl": ["2.2.21", "B4.2.2(12)", "2.1.51"]}, {"id": "AIR-OLD-06", "kind": "old", "stem": "Fifteen minutes after a packed red cell transfusion is started, a patient develops itchy urticarial wheals only, with no fever, no hypotension and normal urine colour. What is the most likely type of reaction?", "choices": ["Febrile non-hemolytic transfusion reaction", "Delayed hemolytic transfusion reaction", "Allergic (urticarial) transfusion reaction", "Post-transfusion purpura", "Acute hemolytic transfusion reaction"], "answer": 2, "explain": "โพยเก่าให้ตัวเลือก delayed / acute / allergy / purpura — **ตอบ allergic** เพราะมีแต่ผื่นลมพิษ ไม่มีไข้ ไม่มี hemolysis; **เวลา 15 นาทีอย่างเดียวไม่ได้แปลว่าเป็น acute hemolytic** ต้องดูอาการร่วม (ไข้ ปวดเอว ปัสสาวะดำ ความดันตก) เป็นชนิดเดียวที่ให้เลือดต่อได้หลังให้ antihistamine", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 41 'Blood transfusion ทำไป 15 นาทีเกิดผื่นขึ้น (delay, acute, allergy, purpura)'", "ref": [], "nl": ["2.2.21", "B4.2.2(12)"]}]}, {"id": "air-08-07", "title": "ภูมิคุ้มกันทำลายเม็ดเลือดตัวเอง — AIHA และ ITP", "minutes": 6, "summary": "ตัวอย่างคลาสสิกของ type II hypersensitivity ที่ต้องแยกจากสาเหตุอื่นก่อนรักษา", "nl": ["2.3.3(4)"], "md": "**Autoimmune hemolytic anemia (AIHA)** — antibody จับเม็ดเลือดแดงตัวเอง (type II)\n- เบาะแส: ซีดเร็ว **ตัวเหลือง ปัสสาวะเข้ม ม้ามโต** · **reticulocyte สูง · indirect bilirubin สูง · LDH สูง · haptoglobin ต่ำ**\n- **smear เห็น spherocyte และ polychromasia** — spherocyte เกิดจากม้ามแทะเยื่อหุ้มเซลล์ที่มี antibody เกาะบางส่วน\n- **การตรวจยืนยันคือ direct antiglobulin (Coombs) test** ไม่ใช่ osmotic fragility (ซึ่งบวกได้ทั้ง AIHA และ hereditary spherocytosis จึงแยกสองโรคนี้ไม่ได้)\n- warm type (IgG, พบบ่อยสุด, สัมพันธ์กับ SLE/CLL/ยา) รักษาด้วย **corticosteroid** เป็นอันดับแรก · cold agglutinin (IgM) ให้ทำให้ร่างกายอุ่นและรักษาโรคต้นเหตุ steroid ได้ผลไม่ดี\n\n**Immune thrombocytopenia (ITP)**\n- **เกล็ดเลือดต่ำเดี่ยว ๆ** โดย Hb และ WBC ปกติ ไม่มีม้ามโต ร่างกายแข็งแรงดี — เป็น **การวินิจฉัยแยกโรค** ไม่มีการตรวจยืนยันจำเพาะ\n- ต้องตัดสาเหตุอื่นก่อนเสมอ: **ตรวจ HIV และ hepatitis C ทุกราย** · ดู smear เพื่อตัด pseudothrombocytopenia (platelet clump จาก EDTA), TTP (schistocyte), leukemia\n- **ITP จาก HIV รักษาโดยเริ่ม antiretroviral therapy ก่อน** เกล็ดเลือดมักขึ้นตามโดยไม่ต้องใช้ steroid ยาว\n- เริ่มรักษาเมื่อ **เกล็ดเลือด < 20,000–30,000/µL หรือมีเลือดออก** ด้วย corticosteroid ± IVIG (IVIG ใช้เมื่อต้องการให้ขึ้นเร็ว เช่น เลือดออกรุนแรงหรือก่อนผ่าตัด)\n- **ไม่ต้องเจาะไขกระดูกทุกราย** — พิจารณาเมื่ออายุมาก มีความผิดปกติของเม็ดเลือดสายอื่น หรือไม่ตอบสนองการรักษา\n", "pearls": ["Spherocyte + reticulocyte สูง + ตัวเหลือง → ส่ง direct Coombs test", "ITP คือการวินิจฉัยแยกโรค — ต้องตรวจ HIV และ HCV ทุกราย", "ITP ในผู้ป่วย HIV เริ่มด้วย ART ไม่ใช่ steroid"], "items": [{"id": "AIR-OLD-08", "kind": "old", "stem": "A 25-year-old woman has anemia and jaundice. Blood smear shows spherocytes and polychromasia; direct Coombs test is positive. Which additional investigation should be sent to look for an underlying cause?", "choices": ["Anti-cyclic citrullinated peptide", "Antinuclear antibody", "Serum uric acid", "Rheumatoid factor", "Serum ferritin"], "answer": 1, "explain": "**Warm autoimmune hemolytic anemia (Coombs บวก) ต้องหาโรคที่ซ่อนอยู่เสมอ** — โดยเฉพาะ **SLE** (ส่ง ANA), lymphoproliferative disorder, ยา และการติดเชื้อ; AIHA อาจเป็นอาการนำของ SLE ก่อนอาการอื่นหลายเดือนถึงปี", "pearl": "", "topic": "", "src": "MED33 โพย 'ข้อ AIHA > ANA' และโพย OSCE 'Ddx WAIHA, HS — investigation: Coomb's test, ANA, CBC'", "ref": [], "nl": ["2.3.3(4)", "B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-09", "kind": "old", "stem": "A newly diagnosed HIV-positive man has isolated thrombocytopenia (platelet 80,000/mm3) with normal hemoglobin and white cell count, and no bleeding. What is the most appropriate management?", "choices": ["Splenectomy", "Start antiretroviral therapy and monitor the platelet count", "Bone marrow transplantation", "High-dose intravenous immunoglobulin as lifelong maintenance", "Immediate platelet transfusion"], "answer": 1, "explain": "**HIV-associated immune thrombocytopenia มักดีขึ้นเมื่อได้ ART** เพราะการติดเชื้อเองเป็นตัวขับกระบวนการภูมิคุ้มกัน; เกล็ดเลือด 80,000 โดยไม่มีเลือดออก **ไม่มีข้อบ่งชี้ให้เกล็ดเลือด**; IVIG หรือสเตียรอยด์สงวนไว้เมื่อเลือดออกหรือเกล็ดเลือดต่ำมาก (การเจาะไขกระดูกพิจารณาเมื่อภาพเลือดผิดปกติหลายซีรีส์)", "pearl": "", "topic": "", "src": "MED34 โพย MCQ 'First diag HIV Plt 80,000 invest thrombocytopenia?' และ 'Management ของคนแรก diagnosis HIV ที่ Plt ต่ำ'", "ref": [], "nl": ["2.3.3(5)", "2.3.3-3(5)"]}, {"id": "AIR-OLD-10", "kind": "old", "stem": "A young woman presents with easy bruising for 1 week. CBC shows isolated thrombocytopenia with giant platelets on smear; hemoglobin and white cells are normal. Besides a bone marrow study if indicated, which screening tests are most appropriate to look for secondary causes?", "choices": ["Antinuclear antibody, anti-HIV and anti-hepatitis C virus", "Serum uric acid and rheumatoid factor", "Coagulogram and fibrinogen only", "Direct Coombs test and haptoglobin only", "Serum protein electrophoresis"], "answer": 0, "explain": "**Immune thrombocytopenia (ITP) เป็นการวินิจฉัยแบบตัดโรคอื่นออก** — โรคที่ทำให้เกิด ITP ทุติยภูมิและต้องคัดกรองคือ **SLE (ANA), HIV และ HCV** (บวก H. pylori ในบางแนวทาง); giant platelet สะท้อนว่าไขกระดูกสร้างชดเชยเต็มที่ ซึ่งเข้าได้กับการทำลายที่ม้าม", "pearl": "", "topic": "", "src": "MED35 OSCE ข้อ 2 'ให้รูป PBS ... Plt decreased, giant platelet จะส่ง invest อะไร 2 อย่าง วินิจฉัยอะไร ตอบ ITP ส่ง ANA titer, anti HIV, HCV'", "ref": [], "nl": ["2.3.3(5)", "B5.3(5)"]}]}, {"id": "air-08-08", "title": "ผู้ป่วยที่ได้ยากดภูมิคุ้มกัน — วัคซีนและการติดเชื้อฉวยโอกาส", "minutes": 7, "summary": "วัคซีนเชื้อเป็นเป็นข้อห้าม · ไข้ + หอบ + CXR ฝ้าสองข้างในคนกิน steroid ให้คิดถึง PJP ก่อน", "nl": ["2.1.1"], "md": "### เกณฑ์ว่า “กดภูมิคุ้มกันอย่างมีนัยสำคัญ”\n- **Prednisolone ≥ 20 mg/วัน (หรือ ≥ 2 mg/kg/วันในเด็ก) นานกว่า 14 วัน**\n- ยากลุ่ม cytotoxic/biologic: cyclophosphamide, azathioprine, mycophenolate, methotrexate ขนาดสูง, **anti-TNF, rituximab**\n- โรคเอง: HIV ที่ CD4 ต่ำ, มะเร็งเม็ดเลือด, ปลูกถ่ายอวัยวะ\n\n### วัคซีน\n- **วัคซีนเชื้อเป็นเป็นข้อห้าม** ขณะกดภูมิคุ้มกัน — MMR, varicella, **zoster ชนิดเชื้อเป็น**, yellow fever, BCG, OPV, ไข้หวัดใหญ่ชนิดพ่นจมูก\n- **วัคซีนเชื้อตายให้ได้และควรให้** — influenza ชนิดฉีดทุกปี, pneumococcal (PCV แล้วตามด้วย PPSV23), hepatitis B, COVID-19, **recombinant zoster vaccine (ชนิด subunit ให้ได้)**\n- **ให้ก่อนเริ่มยากดภูมิอย่างน้อย 2–4 สัปดาห์ได้ผลดีที่สุด** ถ้าจำเป็นต้องให้ระหว่างรักษา ให้ได้แต่ภูมิอาจขึ้นไม่ดี\n- คนในบ้านฉีดวัคซีนเชื้อเป็นได้ตามปกติ (ยกเว้น OPV) — ช่วยป้องกันผู้ป่วยแบบ cocooning\n\n### การป้องกันและมองหาการติดเชื้อฉวยโอกาส\n- **PJP prophylaxis ด้วย cotrimoxazole** เมื่อได้ prednisolone ≥ 20 mg/วัน นานกว่า 4 สัปดาห์ โดยเฉพาะเมื่อใช้ร่วมกับ cyclophosphamide หรือในผู้ป่วย vasculitis/SLE ที่ได้ยากดภูมิหลายตัว\n- คัดกรอง **latent TB (TST/IGRA + CXR) และ HBsAg/anti-HBc ก่อนเริ่ม anti-TNF หรือ rituximab** เสมอ — anti-TNF ทำให้ TB เดิมกำเริบและมักเป็นนอกปอด, rituximab ทำให้ HBV reactivate รุนแรง\n- **ภาพคลาสสิกของ PJP**: ไข้ ไอแห้ง **หอบเมื่อออกแรง** ตรวจปอดค่อนข้างปกติ แต่ **SpO2 ตกเมื่อเดิน** CXR เห็น bilateral perihilar/interstitial infiltrate และ **LDH สูง** → รักษาด้วย cotrimoxazole ขนาดสูง และเพิ่ม corticosteroid เมื่อ PaO2 < 70 mmHg หรือ A-a gradient > 35\n- ในคนกิน steroid ยาว ไข้อาจต่ำและอาการปวดท้องจากภาวะฉุกเฉิน (เช่น ลำไส้ทะลุ) ถูกกลบได้ — **อย่าเชื่อว่าอาการน้อยแปลว่าโรคไม่รุนแรง**\n", "pearls": ["Prednisolone ≥ 20 mg/วัน นานเกิน 14 วัน = ห้ามวัคซีนเชื้อเป็น", "Recombinant zoster vaccine และวัคซีนเชื้อตายอื่นให้ได้ทั้งหมด", "ก่อน anti-TNF ต้องคัดกรอง TB และไวรัสตับอักเสบบีเสมอ", "ไข้ ไอแห้ง หอบ SpO2 ตกเวลาเดิน + LDH สูง ในคนกิน steroid = PJP"], "items": [{"id": "AIR-MCQ-12", "kind": "mcq", "stem": "A 45-year-old woman with systemic lupus erythematosus takes prednisolone 30 mg daily and azathioprine. She asks about vaccination before the rainy season. Which of the following is most appropriate?", "choices": ["Give varicella vaccine now to prevent zoster during immunosuppression", "Give live attenuated influenza vaccine because it gives better mucosal immunity", "Withhold all vaccines until prednisolone is completely stopped", "Give measles-mumps-rubella vaccine now because she was never vaccinated as a child", "Give inactivated influenza vaccine now and defer live attenuated vaccines while she is immunosuppressed"], "answer": 4, "explain": "**ผู้ป่วยที่ได้ prednisolone ตั้งแต่ 20 mg/วัน (หรือ 2 mg/kg/วันในเด็ก) นาน 2 สัปดาห์ขึ้นไป หรือได้ยากดภูมิอื่น ถือว่าอยู่ในภาวะกดภูมิคุ้มกันอย่างมีนัยสำคัญ**\n\n- **วัคซีนเชื้อตาย/หน่วยย่อย (inactivated, subunit, mRNA)** — ปลอดภัย **ให้ได้เลยและควรให้** เพราะกลุ่มนี้เสี่ยงติดเชื้อรุนแรง: influenza รายปี, pneumococcal, hepatitis B, COVID-19 ภูมิที่ขึ้นอาจต่ำกว่าคนปกติแต่ยังคุ้มค่า\n- **วัคซีนเชื้อเป็นอ่อนฤทธิ์ (live attenuated)** — MMR, varicella, LAIV, yellow fever, BCG, OPV — **ห้าม** เพราะอาจกลายเป็นโรคจริง ควรให้ก่อนเริ่มยากดภูมิอย่างน้อย 4 สัปดาห์ หรือรอหลังหยุดสเตียรอยด์ขนาดสูงอย่างน้อย 1 เดือน (ยากดภูมิชนิดอื่นรอ 3 เดือน)\n\n**ทำไมข้ออื่นผิด** — ข้อ 2, 3, 5 เป็นวัคซีนเชื้อเป็นทั้งหมด, ส่วนการ **รอจนหยุดสเตียรอยด์หมดก่อนค่อยฉีดทุกชนิด** ทำให้ผู้ป่วยเสี่ยงไข้หวัดใหญ่รุนแรงโดยไม่จำเป็น เพราะวัคซีนเชื้อตายให้ได้ทันที ถ้าจะให้ zoster ในกลุ่มนี้ต้องใช้ **recombinant zoster vaccine** ซึ่งไม่ใช่เชื้อเป็น", "pearl": "กดภูมิอยู่: **วัคซีนเชื้อตายให้ได้ทันที · วัคซีนเชื้อเป็นห้าม** — และควรวางแผนฉีดเชื้อเป็นให้เสร็จก่อนเริ่มยากดภูมิ 4 สัปดาห์", "topic": "Vaccination in the immunosuppressed", "src": "", "ref": ["MED34 โพย MCQ วัคซีนในผู้ป่วยกดภูมิ", "IDSA Vaccination of the Immunocompromised Host 2013; ACR 2022 vaccination guidance"], "nl": ["2.3.3-3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-11", "kind": "old", "stem": "A patient on long-term prednisolone 30 mg daily for lupus nephritis asks about vaccination. Which vaccine is contraindicated?", "choices": ["Live attenuated varicella vaccine", "Inactivated influenza vaccine", "Hepatitis B vaccine", "Recombinant zoster vaccine", "Pneumococcal polysaccharide vaccine"], "answer": 0, "explain": "**Prednisolone ≥ 20 mg/วันนานเกิน 2 สัปดาห์ = กดภูมิอย่างมีนัยสำคัญ → ห้ามวัคซีนเชื้อเป็น** (varicella, MMR, LAIV, BCG, yellow fever); วัคซีนเชื้อตายและ recombinant ให้ได้และควรให้ เพราะกลุ่มนี้ติดเชื้อรุนแรงกว่าคนทั่วไป", "pearl": "", "topic": "", "src": "MED34 โพย MCQ วัคซีนในผู้ป่วยที่ได้ยากดภูมิ", "ref": [], "nl": ["2.3.3-3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-16", "kind": "old", "stem": "A patient with SLE on prednisolone and immunosuppressants presents with 1 week of dry cough, fever and dyspnea with bilateral interstitial infiltrates and marked hypoxemia but an unremarkable lung examination. What should be done first?", "choices": ["Increase the corticosteroid dose for a presumed lupus flare", "Start cyclophosphamide for lupus pneumonitis", "Give oral amoxicillin and discharge", "Treat empirically for Pneumocystis pneumonia while investigating for infection", "Observe and repeat the chest radiograph in 1 week"], "answer": 3, "explain": "**ผู้ป่วยกดภูมิที่มีไข้ ต้องคิดถึงการติดเชื้อก่อนโรคกำเริบเสมอ** — ภาพไอแห้ง ขาดออกซิเจนมากกว่าที่ฟังปอดได้ + ฝ้า interstitial สองข้าง + LDH สูง = **PCP** ให้ TMP-SMX ทันทีและเพิ่มสเตียรอยด์เสริมเมื่อ PaO2 < 70 mmHg พร้อมส่งตรวจยืนยัน; การเพิ่มยากดภูมิโดยยังไม่ตัดการติดเชื้ออาจทำให้ผู้ป่วยเสียชีวิต", "pearl": "", "topic": "", "src": "MED34 โพย MCQ 'ช. 30 ปี มีโรคประจำตัว SLE, Lupus nephritis on prednisolone มาด้วยไอ...'", "ref": [], "nl": ["2.3.3-3(5)", "2.3.13-3(15)", "2.1.1"]}]}, {"id": "air-08-09", "title": "เมื่อไรต้องคิดถึงภูมิคุ้มกันบกพร่องปฐมภูมิในผู้ใหญ่", "minutes": 5, "summary": "ติดเชื้อซ้ำ ๆ ที่ผิดปกติทั้งความถี่ ความรุนแรง และชนิดเชื้อ", "nl": ["2.1.1"], "md": "ผู้ใหญ่ที่ติดเชื้อบ่อยส่วนใหญ่ **ไม่ได้** มีภูมิคุ้มกันบกพร่องปฐมภูมิ — ให้มองหาสาเหตุทุติยภูมิก่อนเสมอ (HIV, เบาหวาน, ยากดภูมิ, มะเร็งเม็ดเลือด, ภาวะขาดสารอาหาร, โรคปอดเรื้อรังที่มีโครงสร้างผิดปกติ) แต่มีรูปแบบที่ต้องสะดุดใจ\n\n### สัญญาณเตือน\n- **ปอดอักเสบที่ต้องใช้ยาปฏิชีวนะ ≥ 2 ครั้งต่อปี ติดกันหลายปี** หรือมี **bronchiectasis** โดยไม่มีเหตุอธิบาย\n- ไซนัสอักเสบ/หูชั้นกลางอักเสบเรื้อรังร่วมด้วย (คือติดเชื้อ **แบคทีเรียมีแคปซูล** ซ้ำ ๆ: *S. pneumoniae*, *H. influenzae*)\n- ท้องเสียเรื้อรังจาก *Giardia*, น้ำหนักลด, ต่อมน้ำเหลืองโต ม้ามโต\n- มีภาวะภูมิต้านตนเองร่วม เช่น ITP หรือ AIHA ในคนที่ติดเชื้อบ่อย\n\nรูปแบบข้างต้นคือภาพของ **common variable immunodeficiency (CVID)** ซึ่งเป็น primary immunodeficiency ที่พบบ่อยที่สุดในผู้ใหญ่ (มักเริ่มแสดงอาการช่วงอายุ 20–40 ปี)\n\n### การตรวจเบื้องต้นที่ทำได้ทุกโรงพยาบาล\n1. **CBC with differential** (ดู lymphopenia, neutropenia)\n2. **ตรวจ HIV เสมอ** — เป็นสาเหตุทุติยภูมิที่พบบ่อยที่สุดและรักษาได้\n3. **วัดระดับ immunoglobulin: IgG, IgA, IgM** — CVID จะพบ **IgG ต่ำ ร่วมกับ IgA และ/หรือ IgM ต่ำ** และตอบสนองต่อวัคซีนไม่ดี\n4. ตรวจ complement (CH50) เมื่อสงสัยการติดเชื้อ *Neisseria* ซ้ำ ๆ\n5. ส่งต่อผู้เชี่ยวชาญเพื่อทดสอบการตอบสนองต่อวัคซีนและตรวจ lymphocyte subset\n\nการรักษาหลักของ CVID คือ **immunoglobulin replacement** ร่วมกับการรักษาการติดเชื้อเชิงรุกและเฝ้าระวังภาวะแทรกซ้อน (bronchiectasis, autoimmune cytopenia, มะเร็งต่อมน้ำเหลือง)\n", "pearls": ["ผู้ใหญ่ติดเชื้อซ้ำ ๆ ให้ตัด HIV และสาเหตุทุติยภูมิก่อนเสมอ", "ปอดอักเสบซ้ำ + ไซนัสอักเสบเรื้อรัง + ท้องเสียจาก Giardia = คิดถึง CVID ให้ตรวจระดับ IgG/IgA/IgM"], "items": [{"id": "AIR-MCQ-13", "kind": "mcq", "stem": "A 24-year-old man has had four episodes of bacterial pneumonia and two episodes of bacterial sinusitis in the past 2 years, plus chronic diarrhea from giardiasis. He is HIV-negative. CBC shows normal white cell count and differential. Which of the following is the most appropriate next investigation?", "choices": ["Total hemolytic complement (CH50) as the single first-line test", "Nitroblue tetrazolium or dihydrorhodamine test for neutrophil oxidative burst", "Bone marrow aspiration and biopsy", "Repeat HIV testing every month for 6 months", "Serum immunoglobulin levels (IgG, IgA, IgM)"], "answer": 4, "explain": "**ผู้ใหญ่ที่ติดเชื้อแบคทีเรียมีแคปซูลซ้ำ ๆ ที่ทางเดินหายใจ (sinopulmonary) ร่วมกับ giardiasis เรื้อรัง และ HIV negative → นึกถึง antibody deficiency โดยเฉพาะ common variable immunodeficiency (CVID)** ซึ่งเป็น primary immunodeficiency ที่วินิจฉัยในผู้ใหญ่บ่อยที่สุด\n\n**การตรวจแรกที่ให้ผลคุ้มที่สุดคือระดับ immunoglobulin** — ใน CVID จะพบ IgG ต่ำร่วมกับ IgA หรือ IgM ต่ำ และตอบสนองต่อวัคซีนไม่ดี (วัด specific antibody ต่อ tetanus/pneumococcus ต่อได้)\n\n**ทำไมข้ออื่นผิด** — แต่ละการตรวจผูกกับ 'ลายเซ็นการติดเชื้อ' คนละแบบ\n\n| เบาะแสการติดเชื้อ | ส่วนของภูมิคุ้มกันที่บกพร่อง | ตรวจอะไร |\n|---|---|---|\n| **แบคทีเรียมีแคปซูล ติดซ้ำที่ไซนัส/ปอด, giardia** | **B cell / antibody** | **Ig levels** |\n| ฝีหนองซ้ำ ๆ, catalase-positive (S. aureus, Burkholderia), granuloma | neutrophil oxidative burst | DHR/NBT |\n| **Neisseria ซ้ำ ๆ** | terminal complement C5–C9 | CH50 |\n| เชื้อฉวยโอกาส เชื้อรา ไวรัสรุนแรง | T cell | CD4, HIV, lymphocyte subset |\n\nBone marrow ไม่ใช่การตรวจเริ่มต้นเมื่อ CBC ปกติ และการตรวจ HIV ซ้ำทุกเดือนโดยไม่มีความเสี่ยงใหม่ไม่ช่วยอะไร", "pearl": "**ติดเชื้อ sinopulmonary ซ้ำ + giardia ในผู้ใหญ่ = สงสัย CVID → ส่ง IgG/IgA/IgM ก่อน**; Neisseria ซ้ำ = complement, ฝีหนองซ้ำ = phagocyte", "topic": "Primary immunodeficiency clue in an adult", "src": "", "ref": ["MED32 โพย MCQ recurrent infection", "Harrison 21st ed., Primary Immune Deficiency Diseases"], "nl": ["2.3.3-3(5)", "2.1.1"]}]}], "date": "TBD — แก้ใน config.lectures"}, {"lec": "23", "title": "Approach to arthritis / crystal and infective arthropathy", "subtitle": "เข้าหาอาการปวดข้ออย่างเป็นระบบ · น้ำไขข้อ · เกาต์และ CPPD · ข้ออักเสบติดเชื้อ · ข้อเสื่อม · กระดูกพรุน", "objectives": ["แยกข้ออักเสบจริงออกจากปวดรอบข้อ และแยก inflammatory ออกจาก mechanical ด้วยประวัติและการตรวจร่างกาย", "ระบุข้อบ่งชี้ในการเจาะน้ำไขข้อ และแปลผลน้ำไขข้อทั้งจำนวนเซลล์ ผลึก และการย้อมเชื้อ", "รักษาเกาต์เฉียบพลันได้เหมาะกับโรคร่วม และรู้ข้อบ่งชี้ เป้าหมาย และวิธีเริ่มยาลดกรดยูริก", "วินิจฉัยข้ออักเสบติดเชื้อให้ทันและเริ่มการรักษาที่ถูกต้องภายในชั่วโมงแรก", "วางแผนรักษาข้อเข่าเสื่อมโดยเริ่มจากสิ่งที่ได้ผลที่สุดก่อน และประเมินกระดูกพรุนหลังกระดูกหักจากอุบัติเหตุเล็กน้อย"], "meq": [{"id": "AIR-MEQ-01", "part": "MEQ", "lec": "23", "lecture": "Approach to arthritis / crystal and infective arthropathy", "topic": "Acute monoarthritis — gout versus septic arthritis", "vignette": "ผู้ป่วยชายไทยอายุ 52 ปี อาชีพขับรถบรรทุก มาห้องฉุกเฉินด้วยปวดเข่าขวามากจนเดินไม่ได้ 1 วันก่อนมาโรงพยาบาล\nPI: เมื่อคืนก่อนมามีงานเลี้ยง ดื่มเบียร์ประมาณ 6 ขวด ตื่นเช้ามาปวดเข่าขวาบวมแดงร้อน ปวดมากจนแตะไม่ได้ มีไข้ต่ำ ๆ เคยมีอาการแบบนี้ที่โคนนิ้วโป้งเท้าขวา 3 ครั้งใน 2 ปี แต่ละครั้งหายเองใน 5-7 วัน ไม่เคยตรวจรักษาจริงจัง\nU/D: ความดันโลหิตสูง กิน hydrochlorothiazide (25) 1x1 เช้า มา 3 ปี, ไขมันในเลือดสูง\nประวัติอื่น: ดื่มเบียร์ประจำ 3-4 ครั้ง/สัปดาห์ ไม่สูบบุหรี่ ไม่มีประวัติเพศสัมพันธ์นอกสมรส ไม่มีแผลหรือฝีที่ผิวหนัง ไม่มีประวัติฉีดยาเข้าเส้น\nPE: GA: ผู้ป่วยชายรูปร่างท้วม ดูเจ็บปวดมาก BW 88 kg Ht 170 cm\nV/S: BT 37.9 C, PR 96/min, RR 20/min, BP 148/92 mmHg, SpO2 98% room air\nExtremities: เข่าขวาบวม ผิวแดงเป็นมัน ร้อน กดเจ็บมาก มี ballottement of patella บวก ขยับได้ช่วงแคบมากเพราะเจ็บ, ข้ออื่นปกติ, ไม่พบ tophus ชัดเจน แต่คลำได้ก้อนแข็งเล็ก ๆ ที่ใบหูขวา\nLab แรกรับ: Hb 14.2 g/dL, WBC 13,800 /uL (N 78%, L 16%), Plt 265,000 /uL, BUN 16 mg/dL, Cr 1.2 mg/dL (eGFR 66), uric acid 6.8 mg/dL, CRP 62 mg/L", "questions": [{"q": "1. จงให้การวินิจฉัยแยกโรคที่เป็นไปได้มากที่สุด 4 โรค พร้อมเหตุผลสั้น ๆ", "a": "1) **Acute gouty arthritis** — ประวัติปวดข้อเฉียบพลันเป็นซ้ำที่ MTP ที่ 1 หายเองได้, ดื่มเบียร์, ใช้ thiazide, อ้วน, มีก้อนที่ใบหูซึ่งอาจเป็น tophus\n2) **Septic arthritis** — ข้อเดียวบวมแดงร้อน มีไข้ WBC และ CRP สูง **ต้องตัดออกก่อนเสมอ** แม้ประวัติจะเข้าได้กับเก๊าท์\n3) **Pseudogout (CPPD)** — ข้อเข่าเป็นตำแหน่งที่พบบ่อยที่สุด อาการเลียนแบบเก๊าท์ได้ทุกอย่าง\n4) **Trauma / hemarthrosis หรือ reactive arthritis** — พิจารณาเมื่อมีประวัติบาดเจ็บหรือการติดเชื้อนำมาก่อน\n\n(หมายเหตุ: **uric acid 6.8 mg/dL ที่ดู 'ปกติ' ไม่ตัดเก๊าท์ออก** เพราะช่วง flare ค่าจะลดลงได้จากการตกตะกอนลงข้อและการขับออกเพิ่มขึ้น)"}, {"q": "2. ท่านจะทำหัตถการใดเป็นอันดับแรก และจะส่งตรวจน้ำไขข้ออะไรบ้าง", "a": "**Arthrocentesis (เจาะข้อเข่าขวา)** ภายใต้เทคนิคปลอดเชื้อ ก่อนให้ยาปฏิชีวนะ\nส่งตรวจ 4 อย่างเสมอ\n1) **Cell count and differential**\n2) **Crystal examination ด้วย polarized light microscopy**\n3) **Gram stain**\n4) **Culture and sensitivity** (พิจารณาเพาะเชื้อวัณโรคหรือเชื้อราเมื่อเรื้อรัง)\nเพิ่มเติม: glucose/protein ไม่จำเป็นและไม่ช่วยตัดสิน; ส่ง **hemoculture 2 ชุด** คู่กันเมื่อมีไข้"}, {"q": "3. ผลน้ำไขข้อ: ขุ่น สีเหลือง ความหนืดลดลง WBC 32,000 /uL (PMN 88%) Gram stain ไม่พบเชื้อ และพบผลึกรูปเข็ม nega
