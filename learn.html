e anion gap เป็นบวก = RTA · เป็นลบ = ท้องเสีย"], "nl": ["B9.2.5(2)", "B9.1.2(6)"], "items": [{"id": "CH-MCQ-15", "kind": "mcq", "stem": "A patient has Na 140, Cl 107, HCO3 12 mEq/L and albumin 4.0 g/dL. The arterial pH is 7.30 with PaCO2 26 mmHg. What does the delta ratio indicate?", "choices": ["The delta ratio is approximately 2.5, indicating a coexisting metabolic alkalosis", "The delta ratio is approximately 0.8, indicating a coexisting normal anion gap metabolic acidosis", "The delta ratio cannot be calculated because the albumin is normal", "The delta ratio is approximately 1.5, indicating a pure high anion gap metabolic acidosis", "The delta ratio is approximately 0.8, indicating a coexisting metabolic alkalosis"], "answer": 1, "explain": "**การคำนวณทีละขั้น**\n1. **Anion gap** = Na − (Cl + HCO3) = 140 − (107 + 12) = **21** (สูงกว่าปกติ = high AG acidosis)\n2. **ΔAG** = AG ที่วัดได้ − AG ปกติ = 21 − 12 = **9**\n3. **ΔHCO3** = 24 − HCO3 ที่วัดได้ = 24 − 12 = **12**\n4. **Delta ratio = ΔAG / ΔHCO3 = 9 / 12 = 0.75 ≈ 0.8**\n\n→ **HCO3 ตกลงไป 12 แต่ anion gap ขึ้นมาแค่ 9** แปลว่า **มีกรดอีกชนิดที่กิน bicarbonate ไปโดยไม่เพิ่ม anion gap** ซ้อนอยู่ = **normal anion gap (hyperchloraemic) metabolic acidosis ร่วมด้วย** — สังเกตว่า **Cl 107 สูงค่อนไปทางขอบบน** ซึ่งเป็นเบาะแสสนับสนุน (สาเหตุที่พบบ่อย: **ท้องเสีย, renal tubular acidosis, การให้ NSS ปริมาณมาก**)\n\n**การแปลผลมาตรฐาน**\n| Delta ratio | ความหมาย |\n|---|---|\n| **< 0.4** | **normal AG (hyperchloraemic) acidosis ล้วน** |\n| **0.4 - 0.8** | **high AG acidosis ร่วมกับ normal AG acidosis** |\n| **1 - 2** | **high AG metabolic acidosis ล้วน** |\n| **> 2** | **high AG acidosis ร่วมกับ metabolic alkalosis** (หรือ chronic respiratory acidosis ที่มี HCO3 สูงอยู่ก่อน) |\n\n**ตรรกะเบื้องหลัง**: ในกรดชนิด high AG ล้วน **ทุก 1 mEq ของกรดที่เพิ่มขึ้นควรกิน bicarbonate ไป 1 mEq** → อัตราส่วนควรใกล้ 1 ถ้า **HCO3 ตกมากเกินกว่าที่ AG ขึ้น** แปลว่ามีกรดอีกชนิดที่ไม่เพิ่ม AG (เช่นท้องเสีย, RTA, ให้ NSS ปริมาณมาก) ซ้อนอยู่\n\n**Winter's formula ในเคสนี้** = 1.5(12) + 8 ± 2 = **24-28** → PaCO2 26 อยู่ในเกณฑ์ = **ชดเชยเหมาะสม ไม่มีความผิดปกติทางการหายใจซ้อน**\n\n**อย่าลืมปรับ AG ตาม albumin**: **corrected AG = AG + 2.5 × (4.0 − albumin)** — ในเคสนี้ albumin ปกติจึงไม่ต้องปรับ แต่ในผู้ป่วยที่ albumin 2.0 การไม่ปรับจะทำให้ **พลาด high AG acidosis ไปเลย**", "pearl": "ลำดับการอ่าน ABG ที่ไม่ควรข้าม: **(1) pH (2) ความผิดปกติปฐมภูมิ (3) การชดเชยด้วยสูตร (4) anion gap ที่ปรับ albumin แล้ว (5) delta ratio** — ทำครบ 5 ขั้นจะไม่พลาด mixed disorder", "topic": "Delta ratio and identification of a mixed disorder", "src": "", "ref": ["MED35 LMS – delta anion gap to delta HCO3 is over 2, reflect mixed wide anion gap and metabolic alkalosis", "MED30 MCQ ข้อ 49 – Simple wide anion gap metabolic acidosis (โพยเก่าเฉลย metabolic acidosis with compensate respiratory alkalosis แต่คำนวณแล้วได้ predicted PCO2 22.5-26.5)", "MED29 โพย – Anion gap = Na − Cl − HCO3 ปกติ = 12", "MED28 MED421 ข้อ 66 – Wide gap metabolic acidosis with normal gap metabolic acidosis"], "nl": ["3.3.17", "B6.3(2)", "B9.1.2(6)"]}, {"id": "CH-OLD-21", "kind": "old", "stem": "A patient with diabetic ketoacidosis has an arterial blood gas showing pH 7.26, PaCO2 23 mmHg and HCO3 10 mEq/L, with Na 140, Cl 100 mEq/L. Which interpretation is correct?", "choices": ["Primary respiratory alkalosis with metabolic compensation", "High anion gap metabolic acidosis with appropriate respiratory compensation", "High anion gap metabolic acidosis with superimposed respiratory acidosis", "Mixed metabolic acidosis and metabolic alkalosis", "Normal anion gap metabolic acidosis with respiratory compensation"], "answer": 1, "explain": "**AG** = 140 − (100 + 10) = **30** → high anion gap metabolic acidosis (จาก ketoacid)\n**Winter's**: 1.5(10) + 8 ± 2 = **21-25 mmHg**; วัดได้ **23** → **ชดเชยเหมาะสม** (ไม่มีความผิดปกติทางการหายใจซ้อน)\n**ตรวจความสอดคล้อง**: pH = 6.1 + log[10 ÷ (0.03 × 23)] = 6.1 + log 14.5 = **7.26** ✔\n\nข้อควรรู้เพิ่มใน DKA: ผู้ป่วยมักมี **normal AG (hyperchloraemic) acidosis ซ้อน** ระหว่างการรักษาเมื่อได้ NSS ปริมาณมากและเสีย ketoanion ทางปัสสาวะ — ทำให้ **delta ratio <1** (โพยเก่ามีข้อที่ตอบ \"wide gap metabolic acidosis with normal gap metabolic acidosis\")\n\nอย่าลืม: **hyperventilation ใน DKA คือ Kussmaul breathing** ซึ่งเป็นการชดเชย **ห้ามกด** และการรักษาคือ **isotonic saline → insulin → เติม K ก่อนถ้า K < 3.3**", "pearl": "", "topic": "", "src": "MED28 MED421 ข้อ 97 – ABG interpretation of a DKA patient → Metabolic acidosis with partially compensated respiratory alkalosis; MED28 ข้อ 66 – Wide gap metabolic acidosis with normal gap metabolic acidosis; MED32 MCQ – ABG pH 7.12, PCO2 23", "ref": [], "nl": ["3.3.17", "B9.1.2(6)", "2.2.16"]}]}], "date": "อ. 6 ต.ค."}], "label": "Chest", "thai": "ระบบการหายใจและทรวงอก", "accent": {"light": "#4a5a86", "soft": "#e6e9f2", "ink": "#38456b", "dark": "#9aaad8", "darkSoft": "#171c2b", "darkInk": "#b6c2e6"}}, {"set": "nephro", "title": "Nephro · ระบบไตและสมดุลเกลือแร่", "intro": "เริ่มจากคาบ 05 — Fluid electrolyte: Divalent ของ อ.ธิติยา ซึ่งเป็นคาบที่วางรากฐานของทั้งชุด เพราะแคลเซียม ฟอสเฟต และแมกนีเซียม ถูกควบคุมด้วยแกนฮอร์โมนชุดเดียวกัน เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับ AJKD 2024 และ Brenner & Rector ฉบับที่ 11 ตามที่อาจารย์อ้างอิงไว้ในสไลด์ จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจจากคลัง MED28–MED35 และข้อใหม่ของชุด Nephro ทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบแล้วไปฝึก **MEQ** ต่อได้เลย\n\n**ลำดับที่แนะนำ** — หัวข้อ 1 (แกนฮอร์โมนสามตัว) คือกุญแจของทั้งคาบ ถ้าจำตารางในหัวข้อนั้นได้ หัวข้อที่เหลือจะไล่ตามได้เองเกือบทั้งหมด จากนั้นแต่ละแร่ธาตุเรียงแบบเดียวกันเสมอคือ **สมดุลปกติ → ภาวะสูง → ภาวะต่ำ**\n\nคาบที่เหลือของชุด Nephro (nephrotic/nephritic · CKD · dysnatremia & dyskalemia · urine analysis · UTI · AKI) ยังไม่ได้ทำบทเรียน แต่ข้อสอบมีอยู่ครบใน drill.html แล้ว", "lectures": [{"lec": "05", "title": "Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium]", "subtitle": "แกน PTH · FGF-23 · 1,25(OH)₂D · สมดุลและความผิดปกติของแคลเซียม ฟอสเฟต และแมกนีเซียม", "objectives": ["อธิบายการควบคุมซึ่งกันและกันของ **PTH, FGF-23 และ 1,25(OH)₂D** และผลต่อแคลเซียมและฟอสเฟตที่กระดูก ไต และลำไส้ได้", "บอกสัดส่วนและตำแหน่งการดูดกลับ **แคลเซียม ฟอสเฟต และแมกนีเซียม** ในแต่ละส่วนของหน่วยไต พร้อมชื่อตัวขนส่งหลักได้", "แยกสาเหตุของ **ภาวะแคลเซียมสูง** ด้วย PTH ร่วมกับฟอสเฟตและแคลเซียมในปัสสาวะ และเรียงลำดับการรักษาได้ถูกต้อง", "แยกสาเหตุของ **ภาวะแคลเซียมต่ำ** ด้วย PTH คู่กับฟอสเฟต และรู้ว่าเมื่อไรต้องส่ง ionized calcium และแมกนีเซียม", "ใช้ **FE phosphate** และ **FEMg** แยกการรั่วทางไตออกจากการเคลื่อนเข้าเซลล์หรือการเสียทางลำไส้ได้", "อธิบายกลไกที่ **แมกนีเซียมต่ำทำให้เกิดโพแทสเซียมต่ำและแคลเซียมต่ำที่ดื้อต่อการรักษา** และวางแผนการเติมแมกนีเซียมได้", "รู้จักอาการของ **พิษแมกนีเซียม** ตามระดับที่สูงขึ้น และการรักษาเบื้องต้นรวมถึงข้อบ่งชี้ของการฟอกเลือด", "วินิจฉัยและป้องกัน **tumor lysis syndrome** รวมถึงบอกได้ว่าแคลเซียมในภาวะนี้ต่ำ ไม่ใช่สูง"], "sections": [{"id": "nephro-05-01", "title": "แกนฮอร์โมนสามตัว — PTH · FGF-23 · 1,25(OH)₂D", "minutes": 9, "summary": "ถ้าจำแกนนี้ได้ ข้อสอบ divalent เกือบทุกข้อตอบได้จากตารางเดียว", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(8)", "B9.1.2(4)", "B9.2.5(2)"], "md": "แคลเซียมและฟอสเฟตไม่ได้ถูกคุมแยกกัน แต่ถูกคุมด้วย **ฮอร์โมนสามตัวที่คุมกันเองเป็นวงป้อนกลับ (classic negative endocrine feedback loops)** และออกฤทธิ์ที่ **อวัยวะสามแห่ง — กระดูก ไต ลำไส้** เสมอ\n\n### ไล่กลไกทีละตัว\n\n**1. PTH — ฮอร์โมนที่ \"ดึงแคลเซียมขึ้น ไล่ฟอสเฟตออก\"**\n- ต่อมพาราไทรอยด์รับรู้ **ionized Ca ที่ลดลง** ผ่าน **CaSR (calcium-sensing receptor)** → หลั่ง PTH\n- **กระดูก** — กระตุ้น osteoclast ทางอ้อม (ผ่าน RANKL ของ osteoblast) → สลายกระดูก ปล่อยทั้ง **Ca และ PO₄** เข้ากระแสเลือด\n- **ไต** — เพิ่มการดูดกลับ Ca ที่ **DCT** · **ยับยั้งการดูดกลับฟอสเฟตที่ PCT** (ดึง NaPi-2a/2c ออกจากผิวเซลล์) → **ฟอสฟาตูเรีย** · กระตุ้น **1α-hydroxylase**\n- **ลำไส้** — ไม่มีฤทธิ์โดยตรง ต้องผ่าน calcitriol\n- ผลสุทธิ: **Ca ขึ้น · PO₄ ลง** — แม้กระดูกจะปล่อยฟอสเฟตออกมาด้วย แต่ฤทธิ์ขับฟอสเฟตทางไตแรงกว่ามาก\n\n**2. 1,25(OH)₂D (calcitriol) — ฮอร์โมนที่ \"ดูดซึมขึ้นทั้งคู่\"**\n- สร้างที่ **PCT ของไต** โดย 1α-hydroxylase · ถูกกระตุ้นด้วย **PTH และฟอสเฟตต่ำ** ถูกยับยั้งด้วย **FGF-23**\n- **ลำไส้** — เพิ่มการดูดซึม **ทั้ง Ca และ PO₄** (นี่คือฤทธิ์หลัก)\n- ป้อนกลับ: ยับยั้งการหลั่ง PTH และ **กระตุ้นให้ osteocyte หลั่ง FGF-23**\n- ผลสุทธิ: **Ca ขึ้น · PO₄ ขึ้น**\n\n**3. FGF-23 — ฮอร์โมนที่ \"ไล่ฟอสเฟตออกอย่างเดียว\"**\n- สร้างจาก **osteocyte/osteoblast** เมื่อ **ฟอสเฟตสูง หรือ calcitriol สูง**\n- ต้องจับกับ **FGFR ร่วมกับ klotho เป็น co-receptor** จึงจะออกฤทธิ์ที่ไตได้ — ไตเป็นอวัยวะที่มี klotho มากที่สุด\n- **ไต** — ดึง **NaPi-2a/2c** ออกจากผิว PCT → ขับฟอสเฟต **และยับยั้ง 1α-hydroxylase** → calcitriol ลด\n- ยับยั้งการหลั่ง PTH ด้วย\n- ผลสุทธิ: **PO₄ ลง · calcitriol ลง · Ca แทบไม่ขึ้น**\n\n> **จุดที่ทำให้แยกโรคได้** — PTH กับ FGF-23 ขับฟอสเฟตเหมือนกัน แต่ **PTH ดันแคลเซียมขึ้นด้วย ส่วน FGF-23 ไม่ดัน** ดังนั้นคนไข้ **ฟอสเฟตต่ำจากไตรั่ว + แคลเซียมสูง = PTH เกิน** แต่ **ฟอสเฟตต่ำจากไตรั่ว + แคลเซียมปกติ = FGF-23 เกิน**\n\n### ตารางสรุปที่ต้องจำให้ได้\n\n| ฮอร์โมน | ถูกกระตุ้นโดย | กระดูก | ไต | ลำไส้ | Ca ในเลือด | PO₄ ในเลือด |\n|---|---|---|---|---|---|---|\n| **PTH** | ionized Ca ต่ำ (CaSR) | สลายกระดูก ↑ | ดูดกลับ Ca ↑ (DCT) · **ขับ PO₄ ↑** · 1α-OHase ↑ | ทางอ้อมผ่าน calcitriol | **↑** | **↓** |\n| **1,25(OH)₂D** | PTH ↑ · PO₄ ต่ำ | เสริมฤทธิ์ PTH | ดูดกลับ Ca ↑ | **ดูดซึม Ca และ PO₄ ↑** | **↑** | **↑** |\n| **FGF-23** | PO₄ สูง · calcitriol ↑ | (osteocyte เป็นผู้สร้าง) | **ขับ PO₄ ↑** · **1α-OHase ↓** | ลดทางอ้อม (calcitriol ลด) | ≈ คงที่ | **↓** |\n\n### กับดักที่คนพลาดจริง\n- **\"PTH สูง = hyperparathyroidism\" ไม่จริงเสมอ** — ต้องดู Ca คู่กันเสมอ: PTH สูงพร้อม Ca **สูง** = primary/tertiary · PTH สูงพร้อม Ca **ต่ำ** = secondary (CKD, ขาดวิตามินดี) ซึ่งเป็นการตอบสนองที่ถูกต้องของร่างกาย\n- **PTH \"ปกติ\" ในคนที่ Ca สูง คือผลผิดปกติ** — ถ้าแคลเซียมสูงจริง PTH ต้องถูกกดจนต่ำ การที่ยัง \"ปกติ\" แปลว่าต่อมทำงานเองโดยไม่ฟัง feedback\n- FGF-23 ต้องมี **klotho** — ใน CKD ระดับ klotho ลดลง เกิดภาวะ **ดื้อต่อ FGF-23** ทั้งที่ระดับ FGF-23 สูงลิ่ว\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์เปิดด้วยรูป **\"Axis of PTH, FGF-23, and 1,25-dihydroxy vitamin D\"** จาก **AJKD Vol 83, Iss 2, February 2024** และย้ำว่าทั้งสามตัว **\"interact & regulate one another via classic negative endocrine feedback loops\"** โดยควบคุมการขนส่ง Ca และฟอสเฟตที่ **ไต กระดูก ลำไส้**\n- ทั้งคาบเรียงตามลำดับนี้เสมอ: **homeostasis → ภาวะสูง → ภาวะต่ำ** ของแต่ละ divalent — ใช้ลำดับนี้ทบทวนก่อนสอบได้เลย\n", "pearls": ["PTH: Ca ขึ้น PO₄ ลง · calcitriol: ขึ้นทั้งคู่ · FGF-23: PO₄ ลง calcitriol ลง Ca ไม่ขึ้น", "ฟอสเฟตต่ำจากไตรั่ว + Ca สูง = PTH เกิน · ฟอสเฟตต่ำจากไตรั่ว + Ca ปกติ = FGF-23 เกิน", "FGF-23 ต้องมี klotho เป็น co-receptor — CKD มี klotho ต่ำจึงดื้อต่อ FGF-23", "PTH ที่ 'ปกติ' ในคนที่แคลเซียมสูง คือค่าที่ผิดปกติ"], "items": [{"id": "N-OLD-004", "kind": "old", "stem": "A woman has calcium 12.5 mg/dL with phosphate 1.9 mg/dL and elevated intact PTH. What is the mechanism?", "choices": ["Excess parathyroid hormone increasing bone resorption, renal calcium reabsorption and phosphate excretion", "Increased calcitonin secretion", "Increased intestinal calcium absorption from vitamin D excess", "Osteolytic metastasis releasing calcium", "Reduced renal calcium excretion from thiazide"], "answer": 0, "explain": "**PTH ออกฤทธิ์ 3 ที่**: สลายกระดูก, ดูดแคลเซียมกลับที่ distal tubule, และ **ขับฟอสเฟตทิ้ง** พร้อมกระตุ้น 1-alpha-hydroxylase ให้สร้าง calcitriol เพิ่มการดูดซึมแคลเซียมที่ลำไส้ — จึงได้ภาพ Ca สูง PO4 ต่ำ", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 48", "ref": [], "nl": ["B9.1.2(8)", "B9.2.5(2)"]}, {"id": "NEPHRO-05-01-Q1", "kind": "own", "stem": "Which of the following best describes the direct action of FGF-23 on the kidney?", "choices": ["It inhibits paracellular calcium reabsorption in the thick ascending limb via claudin-14", "It increases calcium reabsorption in the distal convoluted tubule via TRPV5", "It upregulates NaPi-2a and NaPi-2c in the proximal tubule and stimulates 1-alpha-hydroxylase", "It stimulates 1-alpha-hydroxylase and thereby increases intestinal phosphate absorption", "It downregulates NaPi-2a and NaPi-2c in the proximal tubule and inhibits 1-alpha-hydroxylase"], "answer": 4, "explain": "**กลไก** — FGF-23 สร้างจาก osteocyte เมื่อฟอสเฟตหรือ calcitriol สูง แล้วจับกับ **FGFR ร่วมกับ klotho** ที่ PCT ผลคือ **ดึง NaPi-2a และ NaPi-2c ออกจาก apical membrane** → ดูดกลับฟอสเฟตน้อยลง → ขับฟอสเฟตออกมากขึ้น **และยับยั้ง 1α-hydroxylase** พร้อมกัน → calcitriol ลดลง → ลำไส้ดูดซึมฟอสเฟตน้อยลงอีกทาง เป็นการลดฟอสเฟตสองทางพร้อมกัน\n\n**ทำไมตัวลวงจึงผิด**\n- *upregulate NaPi + กระตุ้น 1α-OHase* — กลับทิศทั้งคู่ นี่คือสิ่งที่เกิดเมื่อ **ขาด** FGF-23 (จึงเกิดฟอสเฟตสูงและ calcitriol สูง)\n- *เพิ่มการดูดกลับ Ca ผ่าน TRPV5 ที่ DCT* — เป็นฤทธิ์ของ **PTH และ calcitriol** ไม่ใช่ FGF-23\n- *กระตุ้น 1α-OHase แล้วเพิ่มการดูดซึมฟอสเฟต* — ตรงข้ามกับความจริง FGF-23 **ยับยั้ง** 1α-OHase\n- *claudin-14 ที่ TAL* — claudin-14 ถูกคุมโดย **CaSR** เมื่อ Ca หรือ Mg สูง ไม่ใช่เส้นทางของ FGF-23", "pearl": "FGF-23 ลดฟอสเฟตสองทาง — ขับออกทางไต และตัด calcitriol ไม่ให้ลำไส้ดูดซึม", "topic": "แกนฮอร์โมนสามตัว — PTH · FGF-23 · 1,25(OH)₂D", "src": "", "ref": [], "nl": ["B9.1.2(8)", "B9.1.2(3)"]}]}, {"id": "nephro-05-02", "title": "สมดุลแคลเซียม — total เทียบกับ ionized และการจัดการของไต", "minutes": 9, "summary": "ทำไมต้องวัด ionized ไม่ใช่แค่ปรับตามอัลบูมิน และไตดูดกลับแคลเซียมที่ไหนบ้าง", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(4)", "B9.1.2(1)", "B9.3(5)"], "md": "### แคลเซียมอยู่ที่ไหนในร่างกาย\n- **ส่วนใหญ่อย่างท่วมท้นอยู่ในกระดูก** — เลือดมีแค่ราว **1%** ของแคลเซียมทั้งร่างกาย\n- แคลเซียมที่ไหลเวียนในเลือดแบ่งเป็นสามส่วน\n  - **40% จับกับโปรตีน** (อัลบูมินเป็นหลัก) — ไม่ออกฤทธิ์ และ **ถูกกรองผ่านโกลเมอรูลัสไม่ได้**\n  - **10% จับกับประจุลบ** (ซิเตรต ฟอสเฟต ไบคาร์บอเนต) — ถูกกรองได้\n  - **50% เป็น free \"ionized\" calcium** — **ส่วนนี้เท่านั้นที่ออกฤทธิ์ทางสรีรวิทยา** และเป็นตัวที่ CaSR ตรวจจับ\n- แคลเซียมมีบทบาทต่อระบบประสาท หัวใจ และกล้ามเนื้อ จึงต้องคุม ionized Ca ให้อยู่ในช่วงแคบ ๆ **แบบนาทีต่อนาที**\n\n### ลำไส้\nดูดซึมที่ **duodenum และ upper jejunum** สองทาง — **transcellular ที่ต้องพึ่ง 1,25(OH)₂D** และ **paracellular ที่ไม่พึ่งวิตามินดี** โดยรวมแล้วการดูดซึมแคลเซียมจากอาหาร **มีประสิทธิภาพค่อนข้างต่ำ แต่ถูกเร่งขึ้นอย่างมากด้วย calcitriol**\n\n### ไตดูดกลับแคลเซียมที่ไหนบ้าง\n**เฉพาะแคลเซียมที่เป็นอิสระหรือจับกับประจุลบเท่านั้นที่ถูกกรอง** และ **95% ของที่ถูกกรองจะถูกดูดกลับ**\n\n| ส่วนของหน่วยไต | ดูดกลับ | เส้นทาง | กลไก/โปรตีนหลัก |\n|---|---|---|---|\n| **PCT** | **60%** | paracellular | รูจาก **claudin-2 และ claudin-12** · อาศัย passive diffusion และ **solvent drag** ตามน้ำและ Na ที่ถูกดูดกลับ · แรงขับเคลื่อนมาจากการหลั่ง H⁺ และดูดกลับ Na ผ่าน **NHE3** |\n| **TAL** | **25%** | paracellular | รูจาก **claudin-16 และ claudin-19** · ขับเคลื่อนด้วย **ศักย์ไฟฟ้าบวกในลูเมน** ที่เกิดจาก **NKCC2 ร่วมกับ K⁺ ที่รั่วกลับเข้าลูเมนผ่าน ROMK** |\n| **DCT** | **15%** | **transcellular เท่านั้น** | เข้าเซลล์ทาง **TRPV5** → จับกับ **calbindin-D28k** ในเซลล์ → ออกด้านข้างทาง **PMCA4** หรือ **NCX1 (SLC8A1)** · เป็นจุดที่ PTH ปรับละเอียด |\n\n> **จุดเชื่อมที่ออกสอบบ่อย** — เมื่อ **แคลเซียมในเลือดสูง CaSR ที่ TAL จะถูกกระตุ้น → ยับยั้ง ROMK → K⁺ รั่วกลับเข้าลูเมนน้อยลง → ศักย์ไฟฟ้าบวกในลูเมนหายไป → ดูดกลับแคลเซียมได้น้อยลง** ร่างกายจึงขับแคลเซียมทิ้งเอง นี่คือกลไกเดียวกับที่ **ยาขับปัสสาวะกลุ่ม loop (ยับยั้ง NKCC2) ทำให้ขับแคลเซียมออก** ส่วน **thiazide ออกฤทธิ์ที่ DCT ทำให้ดูดกลับแคลเซียมมากขึ้น จึงทำให้แคลเซียมสูง**\n\n### กับดักของค่าแล็บ — เรื่องที่อาจารย์ย้ำที่สุด\n- **แคลเซียมต่ำปลอม (spurious hypocalcemia) ต้องตัดออกก่อนเสมอ ด้วยการส่ง ionized calcium ไม่ใช่อาศัยการปรับตามอัลบูมิน**\n- สูตรปรับ **corrected Ca = Ca ที่วัดได้ + 0.8 × (4.0 − อัลบูมิน)** ใช้ประมาณคร่าว ๆ ได้ แต่ **เชื่อไม่ได้ในคนไข้วิกฤต ตับแข็ง ไตวาย หรือมีความผิดปกติกรด-ด่าง** เพราะการจับกับอัลบูมินเปลี่ยนตามค่า pH (**ด่างขึ้น → จับโปรตีนมากขึ้น → ionized ลดลง** ทั้งที่ total เท่าเดิม — จึงเป็นเหตุผลที่คนหายใจเร็วจากตื่นตระหนกมีอาการชามือและมือจีบ)\n- **สารทึบรังสีกลุ่มแกโดลิเนียมสองตัวคือ gadodiamide และ gadoversetamide รบกวนการวัดแคลเซียมด้วยวิธี colorimetric ทำให้ได้ค่าต่ำกว่าความจริง** — ถ้าเจอแคลเซียมต่ำฮวบหลังทำ MRI/MRA ให้นึกถึงข้อนี้ก่อนรักษา\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แจกแจงสัดส่วนแคลเซียมในเลือดเป็นตัวเลขชัดเจน: **1% อยู่ในเลือด · 40% จับโปรตีน · 10% จับประจุลบ · 50% ionized** — เป็นตัวเลขที่ออกสอบตรง ๆ ได้\n- สไลด์ไล่การดูดกลับเป็น **60 : 25 : 15** ที่ PCT : TAL : DCT พร้อมรูปตัวขนส่งรายส่วนจาก **AJKD 2024** และเน้นชื่อโปรตีน **claudin-2/12 · claudin-16/19 · TRPV5 · calbindin-D28k · PMCA4 · NCX1 (SLC8A1)**\n- สไลด์ระบุว่า **hypocalcemia ปลอมพบน้อยกว่าโพแทสเซียมสูงปลอมหรือโซเดียมต่ำปลอมมาก** แต่ต้องคิดถึงไว้เสมอ\n", "pearls": ["ionized Ca คือ 50% ของแคลเซียมในเลือด และเป็นส่วนเดียวที่ออกฤทธิ์ — ส่วนที่จับโปรตีนกรองผ่านไตไม่ได้", "ดูดกลับแคลเซียม PCT 60% (claudin-2/12) · TAL 25% (claudin-16/19) · DCT 15% (TRPV5 — จุดที่ PTH ปรับ)", "Loop diuretic ล้างศักย์ไฟฟ้าบวกที่ TAL → ขับแคลเซียม · thiazide ที่ DCT → เก็บแคลเซียม", "ด่างขึ้นทำให้ ionized Ca ลดลงทั้งที่ total เท่าเดิม — จึงเกิดมือจีบในคนหายใจเร็ว", "แคลเซียมต่ำฮวบหลัง MRI ให้นึกถึง gadodiamide/gadoversetamide รบกวนการตรวจ"], "items": [{"id": "NEPHRO-05-02-Q1", "kind": "own", "stem": "A 61-year-old man in the intensive care unit with septic shock and cirrhosis has a total serum calcium of 6.8 mg/dL (normal 8.6-10.2) and an albumin of 1.8 g/dL. He has no paresthesia, no carpopedal spasm, a negative Trousseau sign and a normal QTc interval. Which of the following is the most appropriate next step?", "choices": ["Start oral calcium carbonate with calcitriol", "Repeat the total calcium after an albumin infusion", "Measure the ionized calcium", "Give 2 g of intravenous calcium gluconate immediately", "Calculate the corrected calcium and treat if it remains below 8.0 mg/dL"], "answer": 2, "explain": "**กลไก** — อัลบูมิน 1.8 g/dL ทำให้ total calcium ต่ำลงโดยที่ **ionized calcium ซึ่งเป็นส่วนที่ออกฤทธิ์อาจปกติทุกประการ** คนไข้จึงไม่มีอาการเลย ในคนไข้วิกฤตที่มีทั้งตับแข็ง ภาวะกรด-ด่างผิดปกติ และอัลบูมินต่ำ **สูตรปรับตามอัลบูมินเชื่อถือไม่ได้** อาจารย์ย้ำในสไลด์ว่าต้อง **ตัดภาวะแคลเซียมต่ำปลอมออกด้วยการวัด ionized calcium ไม่ใช่อาศัยการปรับตามอัลบูมิน**\n\n**ทำไมตัวลวงจึงผิด**\n- *คำนวณ corrected calcium แล้วรักษา* — เป็นสิ่งที่สไลด์บอกตรง ๆ ว่าไม่ควรพึ่ง สูตรนี้สร้างจากคนทั่วไป ไม่ใช่คนไข้ ICU\n- *ให้แคลเซียมทางหลอดเลือดทันที* — คนไข้ไม่มีอาการและ QTc ปกติ การให้แคลเซียมโดยไม่จำเป็นในภาวะติดเชื้อรุนแรงไม่มีประโยชน์และอาจมีโทษ\n- *เริ่มแคลเซียมกินร่วมกับ calcitriol* — รักษาภาวะที่ยังไม่พิสูจน์ว่ามีจริง\n- *ให้อัลบูมินแล้วเจาะซ้ำ* — total calcium จะขึ้นตามอัลบูมินก็จริง แต่ไม่ได้บอกอะไรเกี่ยวกับ ionized calcium และไม่ใช่ข้อบ่งชี้ของการให้อัลบูมิน", "pearl": "อัลบูมินต่ำ + ไม่มีอาการ = ส่ง ionized calcium ก่อน อย่าเพิ่งรักษาตาม corrected calcium", "topic": "สมดุลแคลเซียม — total เทียบกับ ionized และการจัดการของไต", "src": "", "ref": [], "nl": ["B9.3(5)", "B9.2.5(2)"]}]}, {"id": "nephro-05-03", "title": "ภาวะแคลเซียมสูง — สาเหตุ อาการ และการไล่วินิจฉัย", "minutes": 11, "summary": "PTH คือการตรวจแรกเสมอ แล้วค่อยแยกสองขั้วออกจากกัน", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "2.3.2", "B9.1.2(8)"], "md": "### เริ่มจากตัวเลขระบาดวิทยาที่ออกสอบทุกปี\n**สองสาเหตุรวมกันเป็นราว 90% ของภาวะแคลเซียมสูงทั้งหมด** คือ **hyperparathyroidism ปฐมภูมิ** และ **มะเร็ง** — แต่คนละบริบทกัน\n\n| บริบท | สาเหตุอันดับหนึ่ง | ลักษณะที่มักเจอ |\n|---|---|---|\n| **ผู้ป่วยนอก ตรวจสุขภาพ ไม่มีอาการ** | **Primary hyperparathyroidism** | Ca สูงไม่มาก ค่อยเป็นค่อยไปเป็นปี ๆ |\n| **ผู้ป่วยใน มีอาการ Ca สูงมาก** | **มะเร็ง** | Ca สูงเร็วและมาก มักมีมะเร็งที่รู้อยู่แล้ว พยากรณ์โรคแย่ |\n\n### ขั้นตอนการไล่ — ตรวจ intact PTH ก่อนเสมอ\nการตรวจชิ้นเดียวที่แยกสาเหตุออกเป็นสองขั้วได้คือ **intact PTH**\n\n**ขั้วที่ 1 — PTH สูง หรือ \"ปกติ\" ทั้งที่แคลเซียมสูง (PTH-mediated)**\n- **Primary hyperparathyroidism** — adenoma (พบบ่อยที่สุด), hyperplasia, carcinoma, MEN type 1 และ 2a\n- **Familial hypocalciuric hypercalcemia (FHH)** — CaSR กลายพันธุ์ชนิดเสียหน้าที่ ต่อมจึง \"คิดว่า\" แคลเซียมยังต่ำ\n- **Tertiary hyperparathyroidism** ใน CKD ที่เป็นมานาน · **ลิเทียม** (ยกระดับ set point ของ CaSR)\n\n**ขั้วที่ 2 — PTH ถูกกดจนต่ำ (non-PTH-mediated)**\n- **มะเร็ง** — สไลด์แยกไว้ 4 กลไก\n  - **HHM (humoral hypercalcemia of malignancy)** จาก **PTHrP** ที่ก้อนมะเร็งหลั่ง (squamous cell, ไต, เต้านม)\n  - **LOH (local osteolytic hypercalcemia)** จากการทำลายกระดูกเฉพาะที่ (**myeloma**, มะเร็งเต้านมที่กระจายไปกระดูก)\n  - **ก้อนมะเร็งสร้าง 1,25(OH)₂D เอง** — lymphoma, germinoma\n  - **ก้อนมะเร็งหลั่ง PTH จริง (ectopic PTH)** — พบน้อยมาก\n- **โรคที่มีแกรนูโลมา** — sarcoidosis, **วัณโรค**, เชื้อรา, leprosy ฯลฯ: macrophage ที่ถูกกระตุ้นมี **1α-hydroxylase ที่ไม่ถูกควบคุมด้วยวงป้อนกลับ** → calcitriol สูง\n- **วิตามินดีหรือวิตามินเอเกินขนาด · milk-alkali syndrome · thiazide · teriparatide**\n- **ฮอร์โมนอื่น** — hyperthyroidism, acromegaly, pheochromocytoma, ต่อมหมวกไตวายเฉียบพลัน\n- **การอยู่นิ่งนาน (immobilization)** · ระยะปัสสาวะออกมากของ AKI โดยเฉพาะจาก **rhabdomyolysis** · หลังปลูกถ่ายไต\n\n### ตารางแยกโรคด้วยแล็บสามตัว — PTH, ฟอสเฟต, calcitriol\n\n| สาเหตุ | PTH | PO₄ | 1,25(OH)₂D | เบาะแสที่ชี้ขาด |\n|---|---|---|---|---|\n| **Primary hyperparathyroidism** | **สูง / ปกติทั้งที่ Ca สูง** | **ต่ำ** | ปกติ-สูง | ไม่มีอาการ ตรวจเจอบังเอิญ · นิ่วไต กระดูกบาง |\n| **FHH** | สูง / ปกติ | ปกติ-ต่ำ | ปกติ | **แคลเซียมในปัสสาวะต่ำ — Ca/Cr clearance ratio < 0.01** · เป็นมาตลอดชีวิต มีในครอบครัว · **ห้ามผ่าตัด** |\n| **HHM จาก PTHrP** | **ต่ำ** | **ต่ำ** | ต่ำ | มะเร็งระยะลุกลาม · Ca ขึ้นเร็วและสูงมาก |\n| **Local osteolysis** | ต่ำ | ปกติ-สูง | ต่ำ | **myeloma** · รอยโรคกระดูกแบบ lytic |\n| **Lymphoma / แกรนูโลมา (sarcoid, TB)** | ต่ำ | ปกติ-สูง | **สูง** | ตอบสนองดีต่อ **สเตียรอยด์** |\n| **วิตามินดีเกิน · milk-alkali** | ต่ำ | สูง | สูง (วิตามินดี) | ประวัติกินอาหารเสริมหรือยาลดกรด |\n\n> **ทางลัดที่ใช้ได้จริง** — ทั้ง **primary hyperparathyroidism และ HHM จาก PTHrP ทำให้ฟอสเฟตต่ำ** เพราะฮอร์โมนทั้งคู่ขับฟอสเฟต ส่วนสาเหตุที่ทำงานผ่าน **การสลายกระดูกหรือวิตามินดี จะมีฟอสเฟตปกติถึงสูง** เพราะกระดูกและลำไส้ปล่อยฟอสเฟตออกมาพร้อมแคลเซียม\n\n### อาการ — \"stones, bones, groans, psychic moans\" และที่มากกว่านั้น\n- **ไต** — **ปัสสาวะมาก ปัสสาวะกลางคืน** จาก **nephrogenic DI** (แคลเซียมสูงกระตุ้น CaSR ที่ท่อรวม → AQP2 ลดลง และยับยั้ง NKCC2 ที่ TAL → เสียความสามารถในการทำปัสสาวะเข้มข้น) · นิ่วไต · nephrocalcinosis · ไตวายทั้งเฉียบพลันและเรื้อรัง\n- **ทางเดินอาหาร** — เบื่ออาหาร คลื่นไส้ อาเจียน **ท้องผูก** ปวดท้อง แผลในกระเพาะ **ตับอ่อนอักเสบเฉียบพลัน**\n- **ระบบประสาท** — สมาธิสั้นลง ความจำเสีย ซึม สับสน ซึมลึกจนโคม่า\n- **กล้ามเนื้อ** — อ่อนแรง **รีเฟล็กซ์ลดลงหรือหายไป** ปวดกระดูกปวดข้อ chondrocalcinosis\n- **หัวใจ** — **QT สั้น** หัวใจเต้นช้า AV block ระดับ 1 ความดันสูง หลอดเลือดมีหินปูน\n- **การตกตะกอนแคลเซียมตามอวัยวะ** — band keratopathy, ตาแดง, คัน\n\n> **วงจรอุบาทว์ที่ต้องเข้าใจก่อนจะเข้าใจการรักษา** — แคลเซียมสูง → ปัสสาวะมากจาก nephrogenic DI + คลื่นไส้อาเจียนกินไม่ได้ → **ขาดน้ำ** → GFR ลด → กรองแคลเซียมออกได้น้อยลง → **แคลเซียมยิ่งสูงขึ้นอีก** นี่คือเหตุผลที่ **น้ำเกลือคือการรักษาอันดับแรกเสมอ**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ยกตารางสาเหตุเต็มหน้าจาก **Brenner & Rector's The Kidney ฉบับที่ 11** แยกเป็นหมวด **มะเร็ง · hyperparathyroidism · FHH · โรคต่อมไร้ท่ออื่น · แกรนูโลมา · วิตามินเกิน · การอยู่นิ่ง · โรคไต · ยา** และมี **algorithm สำหรับไล่วินิจฉัยภาวะแคลเซียมสูง** เต็มหนึ่งสไลด์\n- ในหมวดยา สไลด์ระบุไว้ครบ: **milk-alkali, thiazide, ลิเทียม, foscarnet, growth hormone, teriparatide (PTH 1-34), theophylline/aminophylline เป็นพิษ, estrogen และ SERMs, VIP, สารอาหารทางหลอดเลือด**\n- สไลด์ยังเตือนเรื่อง **แคลเซียมสูงปลอมจากโปรตีนในเลือดสูง** — ทั้งจากเลือดข้น (hemoconcentration) และ **globulin สูงใน multiple myeloma**\n", "pearls": ["ผู้ป่วยนอกไม่มีอาการ = primary hyperparathyroidism · ผู้ป่วยในมีอาการ Ca สูงมาก = มะเร็ง · รวมกันราว 90%", "ตรวจ intact PTH ก่อนเสมอ — แยกเป็น PTH-mediated กับ PTH-suppressed", "PTH เกินและ PTHrP เกิน ทำให้ฟอสเฟตต่ำ · สาเหตุจากกระดูกสลายหรือวิตามินดีเกิน ฟอสเฟตปกติถึงสูง", "FHH มีแคลเซียมในปัสสาวะต่ำ (Ca/Cr clearance ratio < 0.01) และห้ามผ่าตัดพาราไทรอยด์", "แคลเซียมสูงทำให้ปัสสาวะมากจาก nephrogenic DI → ขาดน้ำ → แคลเซียมยิ่งสูง"], "items": [{"id": "N-MCQ-01", "kind": "mcq", "stem": "A 62-year-old woman is found to have a serum calcium of 11.2 mg/dL (normal 8.6-10.2) on a routine health check-up. She has no symptoms, takes no medication and no vitamin supplements. Serum phosphate is 2.1 mg/dL (normal 2.7-4.5), albumin 4.2 g/dL, creatinine 0.9 mg/dL. Which of the following is the most likely cause of her hypercalcaemia?", "choices": ["Vitamin D intoxication", "Primary hyperparathyroidism", "Thyrotoxicosis", "Malignancy with bone metastasis", "Milk-alkali syndrome"], "answer": 1, "explain": "กลไกและหลักการแยก: **primary hyperparathyroidism (PHPT)** เป็นสาเหตุอันดับหนึ่งของ hypercalcemia ใน **ผู้ป่วยนอก/คนที่ไม่มีอาการ** (ส่วนใหญ่มาจาก solitary parathyroid adenoma) ขณะที่ **malignancy เป็นอันดับหนึ่งในผู้ป่วยใน (inpatient)** — นี่คือจุดที่ข้อสอบหลอกโดยสลับบริบท\n\nสรีรวิทยาที่ต้องใช้ตัดสินในโจทย์นี้: PTH ส่วนเกินออกฤทธิ์\n- **กระดูก**: กระตุ้น osteoclast (ผ่าน RANKL บน osteoblast) → ปล่อย Ca และ PO4\n- **ไต**: เพิ่มการดูดซึม **Ca** กลับที่ distal tubule แต่ **ยับยั้ง NaPi cotransporter ที่ proximal tubule → ขับ phosphate ออก**\n- **ลำไส้**: กระตุ้น 1α-hydroxylase → **calcitriol สูง** → ดูดซึม Ca เพิ่ม\n→ ผลคือ **Ca สูง + PO4 ต่ำ** ซึ่งตรงกับโจทย์ (PO4 2.1) = ลายเซ็นของ PTH-mediated hypercalcemia\n\nทำไมข้ออื่นผิด:\n- **Malignancy**: มักมีอาการ (น้ำหนักลด ปวดกระดูก) และ **มาเร็ว Ca สูงมาก**; กลไกหลักคือ **PTH-rP** (humoral hypercalcemia of malignancy) ซึ่งก็ทำให้ PO4 ต่ำได้ แต่ **PTH จะถูกกด** และผู้ป่วยไม่ใช่ภาพ \"ตรวจสุขภาพแล้วเจอโดยไม่มีอาการ\"\n- **Milk-alkali syndrome**: จากการกิน calcium carbonate/ยาลดกรดปริมาณมาก → Ca สูง, **metabolic alkalosis, ไตวาย** และ **PO4 มักปกติหรือสูง**; โจทย์ระบุว่าไม่กินอาหารเสริมและ Cr ปกติ\n- **Vitamin D intoxication**: calcitriol สูงจะเพิ่มการดูดซึมทั้ง Ca **และ PO4** จากลำไส้ → **PO4 สูงหรือปกติ ไม่ใช่ต่ำ**; และโจทย์บอกว่าไม่กินวิตามิน\n- **Thyrotoxicosis**: thyroid hormone เพิ่ม bone turnover → Ca สูงได้เล็กน้อย แต่ต้องมีอาการ hyperthyroid (น้ำหนักลด ใจสั่น ขี้ร้อน มือสั่น) และ PO4 มักปกติ\n\nขั้นต่อไปทางคลินิก: **วัด intact PTH** — ถ้า **สูงหรือ inappropriately normal** → PTH-dependent (PHPT, tertiary HPT, familial hypocalciuric hypercalcemia); ถ้า **ถูกกด** → PTH-independent (malignancy, vitamin D, granulomatous disease, myeloma, ยา)", "pearl": "แยก PHPT จาก **familial hypocalciuric hypercalcemia (FHH)** ด้วย **24-hour urine calcium และ calcium/creatinine clearance ratio** (FHH ขับ Ca ในปัสสาวะต่ำ <0.01) เพราะ FHH **ไม่ต้องผ่าตัด** — ถ้าผ่าไปจะไม่หาย", "topic": "Most common cause of hypercalcaemia – outpatient vs inpatient", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 2 – Most common cause of hypercalcemia in out patient (choices: milk-alkali, medication, malignancies, primary hyperparathyroid)", "MED31 past paper – ผู้ป่วยอายุ 70 ปี ไม่มีอาการ ตรวจสุขภาพพบ Ca 11 mg/dl (8.6-10.2) PO4 1.1 (2.7-4.5) ไม่มีประวัติใช้ยา สาเหตุของ hypercalcemia", "MED31 MCQ – Ans hypercalcemia", "MED30 สรุป – parathyroid → hypercalcemia", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia"], "nl": ["B9.2.5(2)", "B9.3(5)", "B9.1.2(4)"]}, {"id": "N-OLD-001", "kind": "old", "stem": "What is the most common cause of hypercalcaemia in the outpatient setting?", "choices": ["Milk-alkali syndrome", "Thiazide diuretic", "Primary hyperparathyroidism", "Malignancy", "Vitamin D intoxication"], "answer": 2, "explain": "**ผู้ป่วยนอก = primary hyperparathyroidism (มักไม่มีอาการ ตรวจเจอโดยบังเอิญ) ส่วนผู้ป่วยใน = มะเร็ง** (PTHrP, osteolytic metastasis, myeloma) ซึ่งมักมีอาการชัดและ Ca สูงเร็ว — สองสาเหตุนี้รวมกันกว่า 90% ของ hypercalcaemia ทั้งหมด", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 2", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)", "B9.1.2(4)"]}, {"id": "N-OLD-002", "kind": "old", "stem": "A 70-year-old asymptomatic man has calcium 11.0 mg/dL (8.6-10.2) and phosphate 1.1 mg/dL (2.7-4.5) with no drug history. What is the most likely cause?", "choices": ["Malignancy-associated hypercalcaemia", "Thyrotoxicosis", "Vitamin D intoxication", "Familial hypocalciuric hypercalcaemia", "Primary hyperparathyroidism"], "answer": 4, "explain": "**Ca สูงคู่กับ PO4 ต่ำ = PTH ทำงานมากเกิน** เพราะ PTH เพิ่มการขับฟอสเฟตที่ท่อไตส่วนต้น; ถ้าเป็นมะเร็งหรือได้วิตามินดีเกิน ฟอสเฟตมักปกติหรือสูง — ต้องยืนยันด้วย **intact PTH ที่สูงหรือสูงไม่เหมาะสม** และตรวจ 24-hour urine calcium เพื่อแยก FHH", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "B9.3(5)"]}, {"id": "N-OLD-003", "kind": "old", "stem": "A patient with bone metastases presents with drowsiness, polyuria and constipation. Which electrolyte abnormality is most likely?", "choices": ["Hypophosphataemia", "Hypercalcaemia", "Hyponatraemia", "Hypokalaemia", "Hypermagnesaemia"], "answer": 1, "explain": "**อาการของ hypercalcaemia จำว่า 'stones, bones, abdominal groans, psychic moans'** — ปัสสาวะมากเพราะแคลเซียมสูงทำให้ไตตอบสนองต่อ ADH ลดลง (nephrogenic DI) จึงขาดน้ำและ Ca ยิ่งสูงขึ้นเป็นวงจร", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 7 / MED31 MCQ", "ref": [], "nl": ["B9.2.5(2)", "2.1.42", "2.3.2"]}, {"id": "N-OLD-014", "kind": "old", "stem": "A 77-year-old woman has severe back pain, anaemia, creatinine 2.8 mg/dL and calcium 12.8 mg/dL with lytic bone lesions. What is the most likely diagnosis?", "choices": ["Multiple myeloma", "Paget disease of bone", "Metastatic prostate cancer", "Primary hyperparathyroidism", "Osteoporosis with vertebral fracture"], "answer": 0, "explain": "**CRAB** = hyperCalcaemia, Renal failure, Anaemia, Bone lesion → multiple myeloma; ส่งต่อด้วย **serum/urine protein electrophoresis, free light chain, skeletal survey หรือ low-dose CT และไขกระดูก**; ต่างจาก primary hyperparathyroidism ซึ่งไม่ทำให้ซีดและรอยโรคกระดูกเป็นแบบ subperiosteal resorption", "pearl": "", "topic": "", "src": "MED30 MCQ ข้อ 38 / MED35 สอบลงกองครั้งที่ 1 MCQ", "ref": [], "nl": ["2.3.2", "B9.2.5(2)", "B9.2.7(1)"]}]}, {"id": "nephro-05-04", "title": "การรักษาภาวะแคลเซียมสูง — ลำดับสำคัญกว่าตัวยา", "minutes": 9, "summary": "น้ำเกลือก่อนเสมอ แล้วค่อยเลือกยาตามว่าอยากได้เร็วหรือได้นาน", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.4(2)", "B9.4(1)", "2.3.2"], "md": "### หลักคิดเดียวที่ต้องจำ\nคนไข้แคลเซียมสูงรุนแรง **ขาดน้ำเสมอ** (จาก nephrogenic DI บวกกับกินไม่ได้) การรักษาจึงเรียงเป็น **เติมน้ำ → กดการสลายกระดูก → แก้ที่ต้นเหตุ** และยาแต่ละตัวต่างกันที่ **ความเร็วในการออกฤทธิ์** ไม่ใช่ความแรง\n\n### 1. น้ำเกลือไอโซโทนิก — อันดับแรกเสมอ\n- **0.9% NaCl 200−500 mL/ชม. ปรับตามสภาพหัวใจและไตของคนไข้**\n- ได้ผลสามทางพร้อมกัน: **เพิ่มปริมาตรในหลอดเลือด → GFR ขึ้น → กรองแคลเซียมออกได้มากขึ้น** และ **โซเดียมที่ถูกขับออกจะลากแคลเซียมออกไปด้วย** (เพราะการดูดกลับแคลเซียมที่ PCT อาศัย solvent drag ตาม Na)\n- ผลข้างเคียงที่ต้องเฝ้า: **ภาวะหัวใจล้มเหลวจากน้ำเกิน**\n\n### 2. Furosemide — ให้ \"หลังเติมน้ำพอแล้ว\" เท่านั้น\n- **20−40 mg IV หลังเติมน้ำจนเพียงพอแล้ว**\n- ออกฤทธิ์ที่ **NKCC2 ที่ TAL → ล้างศักย์ไฟฟ้าบวกในลูเมน → ขับแคลเซียม**\n- **กับดักคลาสสิก** — การให้ furosemide **ก่อน** เติมน้ำ (แนวคิด \"forced diuresis\" แบบเก่า) ทำให้ **ขาดน้ำหนักขึ้น GFR ตกลงอีก และแคลเซียมสูงขึ้นกว่าเดิม** ปัจจุบันจึงให้เฉพาะเมื่อ **มีน้ำเกินหรือหัวใจล้มเหลว** ไม่ใช่ให้ทุกราย\n- ผลข้างเคียง: **ขาดน้ำ โพแทสเซียมต่ำ แมกนีเซียมต่ำ**\n\n### 3. ยาลดการสลายกระดูก — ตัวที่แก้ปัญหาจริง\n| ยา | ขนาด | เริ่มออกฤทธิ์ | จุดเด่น/ข้อควรระวัง |\n|---|---|---|---|\n| **Calcitonin** | **4−8 U/kg ฉีดใต้ผิวหนังหรือเข้ากล้าม ทุก 12 ชม.** | **เร็วที่สุด — ภายใน 4−6 ชม.** | ใช้ขัดตาทัพระหว่างรอ bisphosphonate ออกฤทธิ์ · **เกิด escape phenomenon (ดื้อยา) ภายใน 48 ชม.** · หน้าแดง คลื่นไส้ |\n| **Zoledronate** | **4 mg IV หยดนาน 15 นาที** | 24−72 ชม. สูงสุด 2−4 วัน | แรงกว่าและสะดวกกว่า pamidronate · **ไตวายเฉียบพลัน** · ไข้หนาวสั่นปวดเมื่อยแบบไข้หวัดชั่วคราว |\n| **Pamidronate** | **60−90 mg IV หยดนาน 2 ชม.** | 24−72 ชม. | ทางเลือกเมื่อกังวลเรื่องไต |\n| **Denosumab** | **120 mg วันที่ 1, 8, 15, 29 แล้วทุก 4 สัปดาห์** | 2−4 วัน | **ไม่ต้องปรับตาม GFR — ใช้ได้เมื่อไตเสียหรือดื้อ bisphosphonate** · **แคลเซียมต่ำและฟอสเฟตต่ำรุนแรง** · กระดูกขากรรไกรตาย · กระดูกต้นขาหักผิดปกติ |\n\n### 4. สเตียรอยด์ — เฉพาะกลุ่มที่ผ่าน calcitriol\n**Prednisolone 60 mg/วัน นาน 10 วัน** ใช้กับ **lymphoma, โรคแกรนูโลมา (sarcoidosis, วัณโรค) และวิตามินดีเกิน** โดยลดการสร้าง calcitriol จาก macrophage และลดการดูดซึมแคลเซียมที่ลำไส้ · ระวังการรบกวนเคมีบำบัด น้ำตาลสูง ความดันสูง กดภูมิ\n\n### 5. การฟอกเลือด\nใช้เมื่อ **แคลเซียมสูงรุนแรงร่วมกับไตวายหรือปัสสาวะออกน้อย** จนให้น้ำเกลือไม่ได้\n\n### ลำดับที่ตอบในข้อสอบ\n> **น้ำเกลือ → (calcitonin ถ้าต้องการผลเร็วภายในวันเดียว) → bisphosphonate ทางหลอดเลือด → รักษามะเร็งต้นเหตุ** และ **หยุดยาที่ทำให้แคลเซียมสูง (thiazide, ลิเทียม, วิตามินดี/เอ, แคลเซียมเสริม) ทุกราย**\n\n### กับดักที่คนพลาดจริง\n- **ให้ furosemide ก่อนเติมน้ำ** — ผิดลำดับ ทำให้แย่ลง\n- **รอ bisphosphonate ออกฤทธิ์ในคนไข้ซึม** — ต้องเติม calcitonin คู่ไปด้วยเพราะ bisphosphonate ใช้เวลาอย่างน้อย 1−3 วัน\n- **ให้ bisphosphonate ในคนที่ขาดวิตามินดีอยู่ก่อน** → แคลเซียมต่ำรุนแรงตามมา\n- ในภาวะที่ไม่ใช่มะเร็ง เช่น **FHH ห้ามผ่าตัดและไม่ต้องรักษาลดแคลเซียม**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยกตารางยาเป็น **first-line = น้ำเกลือ/furosemide และ bisphosphonate ทางหลอดเลือด** กับ **second-line = สเตียรอยด์, mithramycin, calcitonin, gallium nitrate, denosumab** พร้อมขนาดยาและผลข้างเคียงรายตัว\n- สไลด์ยังคง **mithramycin (25 μg/kg หยดนาน 4−6 ชม.)** และ **gallium nitrate (100−200 mg/m² หยดต่อเนื่อง 24 ชม. นาน 5 วัน)** ไว้ในตาราง — ปัจจุบัน **แทบไม่ใช้แล้วเพราะพิษสูง** (เกล็ดเลือดต่ำ เลือดออก ตับอักเสบ ไตวาย) ให้รู้จักไว้ตอบข้อสอบ แต่ในเวชปฏิบัติจริงใช้ bisphosphonate หรือ denosumab แทน\n- ตำแหน่งของ **furosemide ในสไลด์ระบุชัดว่า \"after rehydration has been achieved\"** — เป็นจุดที่ข้อสอบชอบสลับลำดับมาหลอก\n", "pearls": ["น้ำเกลือไอโซโทนิกก่อนเสมอ — furosemide ให้ต่อเมื่อเติมน้ำพอแล้วหรือมีน้ำเกิน", "Calcitonin เร็วที่สุด (4−6 ชม.) แต่ดื้อยาใน 48 ชม. · bisphosphonate ช้ากว่าแต่แก้ปัญหาจริง", "Denosumab ไม่ต้องปรับตาม GFR — เป็นทางเลือกเมื่อไตเสีย แต่ทำให้แคลเซียมต่ำรุนแรงได้", "สเตียรอยด์ใช้เฉพาะภาวะที่ผ่าน calcitriol — lymphoma, sarcoidosis, วัณโรค, วิตามินดีเกิน", "หยุด thiazide ลิเทียม และวิตามินดี/เอ ในคนไข้แคลเซียมสูงทุกราย"], "items": [{"id": "N-MCQ-02", "kind": "mcq", "stem": "A 68-year-old woman with known breast cancer presents with 5 days of progressive drowsiness, polyuria, constipation and vomiting. Vital signs: PR 104/min, BP 96/62 mmHg, dry mucous membranes. Laboratory results: corrected calcium 14.8 mg/dL, phosphate 4.6 mg/dL, creatinine 2.6 mg/dL (baseline 0.8), intact PTH 4 pg/mL (low), albumin 3.2 g/dL. Which of the following is the most appropriate initial treatment?", "choices": ["Haemodialysis", "Intravenous furosemide to promote calciuresis before fluid replacement", "Intravenous zoledronic acid as the single first step", "Intravenous isotonic saline to restore intravascular volume", "Subcutaneous calcitonin alone"], "answer": 3, "explain": "กลไกของวงจรเลวร้ายที่ต้องเข้าใจ: hypercalcemia → **ยับยั้ง NKCC2 ที่ thick ascending limb ผ่าน calcium-sensing receptor** และ **ทำให้ collecting duct ดื้อต่อ ADH (nephrogenic diabetes insipidus)** → **polyuria → volume depletion**\n→ เมื่อ volume ต่ำ ไตจะ **ดูดซึม Na กลับมากขึ้นที่ proximal tubule และ Ca ตามมาด้วย (paracellular, ตาม Na/น้ำ)** → **ขับ Ca ออกได้น้อยลง → Ca ยิ่งสูง** → ปัสสาวะออกมากขึ้น → วนซ้ำ\n\n**ดังนั้นการรักษาลำดับแรกคือ \"เติมน้ำ\" ด้วย IV isotonic saline** — แก้ทั้ง volume depletion, เพิ่ม GFR, และ **เพิ่มการขับ Ca ทางปัสสาวะ** ทำให้ Ca เริ่มลงภายในชั่วโมงแรกๆ และยังช่วยแก้ prerenal AKI\n\n**ลำดับการรักษาทั้งชุด**: (1) **IV isotonic saline** (2) **calcitonin** สำหรับผลเร็วใน 12-48 ชม. แต่เกิด **tachyphylaxis** จึงใช้เป็นสะพาน (3) **bisphosphonate (zoledronic acid) หรือ denosumab** สำหรับผลยั่งยืน (onset 2-4 วัน) เพราะกลไกคือยับยั้ง osteoclast-mediated bone resorption ซึ่งเป็นต้นเหตุใน malignancy (4) รักษามะเร็งต้นเหตุ (5) **หยุด thiazide, calcium และ vitamin D**\n\nทำไมข้ออื่นผิด:\n- **Zoledronic acid เป็นขั้นแรกเดี่ยวๆ**: onset ช้า 2-4 วัน (แก้ภาวะฉุกเฉินไม่ทัน) และ **มี nephrotoxicity** — การให้ขณะที่ยัง volume depleted และ Cr 2.6 เสี่ยงทำให้ไตแย่ลง; ต้องให้**หลัง**เติมน้ำและปรับขนาดตาม renal function (ถ้า GFR ต่ำมากพิจารณา **denosumab** แทนเพราะไม่ถูกขับทางไต)\n- **Furosemide ก่อนเติมน้ำ**: ผิดกลไกอย่างร้ายแรง — loop diuretic ยับยั้ง NKCC2 ทำให้ขับ Ca จริง แต่การให้ในผู้ป่วยที่ **volume depleted อยู่แล้ว** จะยิ่งทำให้ volume ลด → Ca สูงขึ้นและไตแย่ลง; ปัจจุบัน **ไม่แนะนำเป็นกิจวัตร** ใช้เฉพาะเมื่อเกิด volume overload จากการให้น้ำ\n- **Hemodialysis**: สงวนไว้เมื่อ Ca สูงรุนแรงร่วมกับ **ไตวายที่ให้น้ำไม่ได้ (oliguric/volume overload)** หรือมีอาการทางระบบประสาท/หัวใจรุนแรงที่ไม่ตอบสนอง — ไม่ใช่ขั้นแรกในผู้ป่วยที่ยังให้น้ำได้\n- **Calcitonin เดี่ยวๆ**: ลด Ca ได้เพียง 1-2 mg/dL และหมดฤทธิ์ใน 48 ชม. จาก tachyphylaxis — ใช้เป็น adjunct ไม่ใช่การรักษาหลัก", "pearl": "อาการของ hypercalcemia จำด้วย **\"stones, bones, groans, thrones, psychiatric overtones\"** (นิ่วไต, ปวดกระดูก, ปวดท้อง/ท้องผูก, ปัสสาวะมาก, ซึม/สับสน). ถ้าเป็นมะเร็งร่วมกับ **CRAB (hyperCalcemia, Renal failure, Anemia, Bone lesion)** ต้องนึกถึง **multiple myeloma**", "topic": "Symptomatic hypercalcaemia of malignancy with AKI – management", "src": "", "ref": ["MED32 MEQ ข้อ 2 – Symptomatic hypercalcemia from malignancy with acute kidney injury: แปลผลแลป (anemia, mild hyponatremia, hypokalemia, hypercalcemia), definitive diagnosis, ให้การรักษาภาวะ hypercalcemia, และ normal saline ช่วยลด hypercalcemia อย่างไร", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia", "MED30 MCQ ข้อ 38 – Ca สูง มี sign ของ MM (CRAB: hypercalcemia, renal failure, anemia, osteolytic bone lesion)", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 94 – หญิง 77 ปี ปวดหลังมาก hypercalcemia CRAB → Multiple myeloma"], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.14(3)"]}, {"id": "N-OLD-013", "kind": "old", "stem": "A patient with metastatic cancer has calcium 14 mg/dL, drowsiness and creatinine 2.4 mg/dL. What is the correct order of treatment?", "choices": ["Bisphosphonate first, then fluids", "Furosemide first in all patients", "Intravenous isotonic saline first, then a bisphosphonate (with calcitonin for rapid effect)", "Oral prednisolone alone", "Haemodialysis as first-line therapy"], "answer": 2, "explain": "**Hypercalcaemia รุนแรงเริ่มด้วยสารน้ำ isotonic ปริมาณมาก** เพื่อแก้ภาวะขาดน้ำและเพิ่มการขับแคลเซียม แล้วจึงให้ **bisphosphonate (ออกฤทธิ์ใน 2-4 วัน)** และ **calcitonin เมื่อต้องการผลเร็วภายในชั่วโมง**; **furosemide ให้เฉพาะเมื่อมีน้ำเกินแล้ว** ไม่ใช่ยาหลัก และฟอกเลือดสงวนไว้เมื่อไตวายหรือรุนแรงมาก", "pearl": "", "topic": "", "src": "MED32 MEQ ข้อ 2", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "B9.4(1)"]}]}, {"id": "nephro-05-05", "title": "ภาวะแคลเซียมต่ำ — ไล่ด้วย PTH คู่กับฟอสเฟต", "minutes": 10, "summary": "สองค่านี้คู่กันแยกได้เกือบทุกสาเหตุ และอย่าลืมส่งแมกนีเซียม", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "B9.2.7(2)", "B9.1.2(8)"], "md": "### ลำดับการคิดที่อาจารย์วางไว้\n1. **ตัดภาวะแคลเซียมต่ำปลอมออกก่อน ด้วย ionized calcium** (ไม่ใช่การปรับตามอัลบูมิน) และนึกถึง **gadodiamide/gadoversetamide** ถ้าเพิ่งทำ MRI\n2. ถ้าต่ำจริง → **ส่ง magnesium และ PTH เสมอ**\n3. **ถ้าแก้แมกนีเซียมแล้วแคลเซียมขึ้นตาม = แมกนีเซียมต่ำคือต้นเหตุ**\n4. ที่เหลือแยกด้วย **PTH คู่กับฟอสเฟต**\n\n### แยกสองขั้วด้วย PTH\n- **PTH ต่ำ หรือ \"ปกติ\" ทั้งที่แคลเซียมต่ำ → hypoparathyroidism** (ค่าปกติในสถานการณ์นี้คือค่าที่ไม่เหมาะสม เพราะร่างกายควรหลั่ง PTH พุ่งขึ้น)\n- **PTH สูง → เป็นการตอบสนองที่ถูกต้อง** ปัญหาอยู่ที่อื่น — **CKD · ขาดวิตามินดี · pseudohypoparathyroidism**\n\n### ตารางแยกโรค\n\n| ภาวะ | Ca | PO₄ | PTH | เบาะแสที่ชี้ขาด |\n|---|---|---|---|---|\n| **Hypoparathyroidism หลังผ่าตัดคอ** | ต่ำ | **สูง** | **ต่ำ / ปกติทั้งที่ Ca ต่ำ** | **แผลผ่าตัดไทรอยด์/พาราไทรอยด์ — เป็นสาเหตุที่พบบ่อยที่สุดของแคลเซียมต่ำในผู้ใหญ่** |\n| **Pseudohypoparathyroidism** | ต่ำ | **สูง** | **สูง** | **Albright hereditary osteodystrophy — หน้ากลม เตี้ย กระดูกฝ่ามือชิ้นที่ 4 สั้น** · ดื้อต่อ PTH |\n| **CKD / ESRD** | ต่ำ | **สูง** | **สูง** | Cr สูง · ALP สูง · calcitriol ต่ำ |\n| **ขาดวิตามินดี** | ต่ำ | **ต่ำ** | สูง | ไม่โดนแดด ดูดซึมผิดปกติ ตับแข็ง · ALP สูง |\n| **แมกนีเซียมต่ำรุนแรง** | ต่ำ | ปกติ | **ต่ำ/ปกติ ทั้งที่ควรสูง** | **ดื้อต่อการให้แคลเซียมจนกว่าจะแก้ Mg** |\n\n> **ตัวแยกที่ทรงพลังที่สุดคือฟอสเฟต** — **ฟอสเฟตสูง** แปลว่าปัญหาอยู่ที่ **PTH ไม่ทำงานหรือไตไม่ขับ** (hypoparathyroidism, pseudohypoparathyroidism, CKD) ส่วน **ฟอสเฟตต่ำ** แปลว่า **PTH ทำงานเต็มที่แล้วแต่วัตถุดิบไม่พอ** คือ **ขาดวิตามินดี**\n\n### กลไกใน CKD — ข้อที่ออกสอบซ้ำ ๆ\nไตที่เสียทำสองอย่างพร้อมกัน: **สูญเสีย 1α-hydroxylase → calcitriol ต่ำ → ลำไส้ดูดซึมแคลเซียมไม่ได้** และ **ขับฟอสเฟตไม่ออก → ฟอสเฟตคั่ง ซึ่งกดการสร้าง calcitriol ซ้ำอีกชั้น และจับแคลเซียมตกตะกอน** ผลคือ **แคลเซียมต่ำ ฟอสเฟตสูง calcitriol ต่ำ → PTH ถูกกระตุ้นเรื้อรังจนเป็น secondary hyperparathyroidism และ ALP สูงจาก renal osteodystrophy**\n\n### สาเหตุอื่นที่สไลด์ไล่ไว้\n- **พันธุกรรม** — PTH gene mutation, **autosomal dominant hypoparathyroidism จาก CaSR ชนิดทำงานเกิน**, **DiGeorge syndrome**\n- **ได้มาภายหลัง** — ผ่าตัด, ภูมิต้านตนเอง (เดี่ยว ๆ หรือร่วมกับ **polyglandular failure type I**), แอนติบอดีต่อ CaSR, ฉายรังสี, มะเร็งแทรก, **เหล็กหรือทองแดงสะสม**\n- **PTH หลั่งไม่ได้ชั่วคราว** — **แมกนีเซียมต่ำรุนแรง และแมกนีเซียมสูง (ได้ทั้งสองทาง)**\n- **ฟอสเฟตสูง** — ไตวาย, สวนล้างลำไส้ด้วยฟอสเฟต, **tumor lysis, กล้ามเนื้อสลาย**\n- **ยา** — **foscarnet, bisphosphonate (โดยเฉพาะเมื่อขาดวิตามินดีอยู่ก่อน), denosumab**\n- **ตับอ่อนอักเสบเฉียบพลัน · มะเร็งกระจายไปกระดูกชนิด osteoblastic · ภาวะวิกฤตเฉียบพลัน**\n\n### อาการ\n- **ระบบประสาทกล้ามเนื้อ** — ชารอบปากและปลายมือปลายเท้า กล้ามเนื้อกระตุก เป็นตะคริว **มือจีบ (carpopedal spasm) · Chvostek sign · Trousseau sign · กล่องเสียงหดเกร็ง**\n- **ระบบประสาทส่วนกลาง** — หงุดหงิด ซึมเศร้า สับสน **ชักเกร็งกระตุกทั้งตัว** สมองบวมเทียม **หินปูนเกาะในสมอง**\n- **หัวใจ** — **QTc ยาว** หัวใจเต้นผิดจังหวะ ความดันต่ำ **หัวใจล้มเหลว**\n- **ผิวหนังและตา** — ผิวแห้ง ผมหยาบ เล็บเปราะ **ต้อกระจก**\n\n> **Trousseau sign จำเพาะกว่า Chvostek sign** — Chvostek ให้ผลบวกได้ในคนปกติราว 10% ส่วน Trousseau (รัดปลอกวัดความดันเหนือ systolic 3 นาทีแล้วมือจีบ) จำเพาะกว่ามาก\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์สรุปเป็นประโยคตรง ๆ ว่า **\"Hypocalcemia with low or inappropriately normal PTH = hypoparathyroidism\"** และ **\"Hypocalcemia with elevated PTH = CKD, ขาดวิตามินดี, pseudohypoparathyroidism\"** — ท่องสองบรรทัดนี้ตอบได้หลายข้อ\n- สไลด์ย้ำว่า **การที่แคลเซียมขึ้นหลังให้แมกนีเซียม เป็นการยืนยันว่าแมกนีเซียมต่ำคือสาเหตุ**\n- มี **algorithm การไล่วินิจฉัยภาวะแคลเซียมต่ำ** และตาราง **genetic syndromes with hypoparathyroidism** พร้อมรหัส OMIM เต็มหนึ่งสไลด์\n", "pearls": ["แคลเซียมต่ำ + PTH ต่ำหรือปกติ = hypoparathyroidism · แคลเซียมต่ำ + PTH สูง = CKD, ขาดวิตามินดี, pseudohypoPTH", "ฟอสเฟตสูง = PTH ไม่ทำงานหรือไตไม่ขับ · ฟอสเฟตต่ำ = ขาดวิตามินดี", "สาเหตุที่พบบ่อยที่สุดของแคลเซียมต่ำในผู้ใหญ่คือ hypoparathyroidism หลังผ่าตัดคอ", "หน้ากลม เตี้ย กระดูกฝ่ามือชิ้นที่ 4 สั้น + Ca ต่ำ PO₄ สูง PTH สูง = pseudohypoparathyroidism", "ส่งแมกนีเซียมทุกรายที่แคลเซียมต่ำ — ทั้ง Mg ต่ำรุนแรงและ Mg สูงต่างกดการหลั่ง PTH ได้"], "items": [{"id": "N-OLD-007", "kind": "old", "stem": "What is the most common cause of hypocalcaemia in adults?", "choices": ["Iatrogenic post-surgical hypoparathyroidism (e.g. after thyroidectomy)", "Autoimmune hypoparathyroidism", "DiGeorge syndrome", "Pseudohypoparathyroidism", "Infiltrative parathyroid disease"], "answer": 0, "explain": "**สาเหตุที่พบบ่อยที่สุดคือหลังผ่าตัดคอ** (thyroidectomy, parathyroidectomy, neck dissection) จากการตัดหรือทำลายเลือดที่เลี้ยงต่อมพาราไทรอยด์; อาการคือ ชารอบปาก มือจีบเกร็ง **Chvostek และ Trousseau sign** และ QT ยาว — ถ้ามีอาการให้ **IV calcium gluconate** ทันที", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "B9.3(5)"]}, {"id": "N-OLD-012", "kind": "old", "stem": "A patient with a round face, short stature and shortened fourth metacarpals has low calcium, high phosphate and a high PTH level. What is the diagnosis?", "choices": ["Pseudohypoparathyroidism (Albright hereditary osteodystrophy)", "Primary hypoparathyroidism", "Vitamin D deficiency", "Primary hyperparathyroidism", "Renal osteodystrophy"], "answer": 0, "explain": "**Pseudohypoparathyroidism = อวัยวะเป้าหมายดื้อต่อ PTH** (ความผิดปกติของ Gs alpha) จึงได้ **Ca ต่ำ, PO4 สูง แต่ PTH สูง** ต่างจาก hypoparathyroidism จริงที่ PTH ต่ำ; ลักษณะภายนอกคือหน้ากลม ตัวเตี้ย และกระดูกฝ่ามือชิ้นที่ 4-5 สั้น", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 34", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)"]}, {"id": "N-MCQ-04", "kind": "mcq", "stem": "A 54-year-old man with end-stage renal disease on maintenance haemodialysis has a corrected calcium of 7.2 mg/dL, phosphate 6.8 mg/dL, intact PTH 620 pg/mL and alkaline phosphatase 320 U/L. He is not taking calcium or vitamin D supplements. Which of the following best explains his hypocalcaemia?", "choices": ["Reduced renal 1-alpha-hydroxylase activity with hyperphosphataemia-driven suppression of calcitriol synthesis", "Autoimmune destruction of the parathyroid glands", "Reduced dietary calcium intake as the sole mechanism", "Magnesium excess inhibiting parathyroid hormone secretion", "Increased renal calcium excretion from impaired distal tubular reabsorption"], "answer": 0, "explain": "กลไกของ **CKD-mineral and bone disorder (CKD-MBD)** ไล่เป็นลำดับ:\n1. **GFR ลด → ขับ phosphate ไม่ได้ → phosphate retention** (เริ่มเห็นชัดเมื่อ eGFR <30)\n2. Phosphate ที่สูงกระตุ้น **FGF-23** จากกระดูก และ FGF-23 **ยับยั้ง 1α-hydroxylase** ที่ proximal tubule; ร่วมกับ **การสูญเสียเนื้อไตทำให้ 1α-hydroxylase น้อยลงโดยตรง**\n3. ผลคือ **calcitriol (1,25-(OH)2 vitamin D) ต่ำ** → **ดูดซึม Ca ที่ลำไส้ลดลง** → **hypocalcaemia**\n4. นอกจากนี้ phosphate ที่สูง **จับกับ Ca เกิด calcium-phosphate complex ตกตะกอน** → Ca อิสระยิ่งต่ำ (เป็นกลไกเสริมที่สำคัญ)\n5. Ca ต่ำ + PO4 สูง + calcitriol ต่ำ → กระตุ้น **PTH สูงขึ้นเรื้อรัง = secondary hyperparathyroidism** (PTH 620 ในโจทย์) → **bone resorption เพิ่ม (ALP สูง)** เกิด renal osteodystrophy\n\nทำไมข้ออื่นผิด:\n- **Autoimmune parathyroid destruction**: จะให้ **PTH ต่ำ** (hypoparathyroidism) — โจทย์ PTH **สูงถึง 620** ซึ่งตรงข้ามโดยสิ้นเชิง\n- **การกินแคลเซียมน้อยเพียงอย่างเดียว**: ลำพังอาหารไม่พอที่จะทำให้เกิดภาพ PO4 สูง + PTH สูงถึงระดับนี้; ปัญหาแกนคือ **การสร้าง calcitriol ล้มเหลว** ไม่ใช่แค่ปริมาณที่กิน\n- **ขับ Ca ออกทางไตมากขึ้น**: ใน CKD **PTH ที่สูงกลับเพิ่มการดูดซึม Ca** ที่ distal tubule และ GFR ที่ต่ำก็ทำให้ filtered load ของ Ca ลดลง → ไม่ใช่กลไกของ Ca ต่ำใน ESRD\n- **Magnesium สูงกด PTH**: hypermagnesemia พบได้ใน CKD จริง และ Mg **สูงมาก** กด PTH ได้ แต่โจทย์มี **PTH สูงลิ่ว** แสดงว่า parathyroid ตอบสนองเต็มที่ — ขัดกับกลไกนี้\n\nการรักษาตามกลไก: **จำกัด phosphate ในอาหาร + phosphate binder (พิจารณา non-calcium-based ถ้ามี vascular calcification) + active vitamin D หรือ vitamin D analogue + calcimimetic (cinacalcet) เพื่อลด PTH**; ถ้า refractory → **parathyroidectomy**", "pearl": "ระวังภาวะ **tertiary hyperparathyroidism** — ต่อมกลายเป็น autonomous ทำให้ **Ca สูง** ได้ในที่สุด; และระวัง **calciphylaxis** เมื่อ Ca x PO4 product สูงมาก. ข้อสอบชอบถาม \"most common cause of hypocalcemia\" ซึ่งโดยทั่วไปตอบ **iatrogenic/post-surgical (hypoparathyroidism หลังผ่าตัดคอ)** แต่ในบริบท **ESRD ตอบ CKD-MBD**", "topic": "Hypocalcaemia in end-stage renal disease", "src": "", "ref": ["MED33 MCQ – เป็น ESRD > Most common cause of Hypocalcemia > มีชอย low small intestinal absorption, low vitamin D diet, low vitamin D → น่าจะตอบข้อ Phosphate", "MED31 past paper – Which one is the most common cause of hypocalcemia? (choices: iatrogenic, autoimmune, infiltrative disease, maternal neonatal complications, development disorder)", "MED32 SAQ – hypocalcemia", "MED30 สรุป Renal – phosphate, magnesium", "MED28 MED421 – ข้อที่ถาม hyperphosphatemia/hypercalcemia/hyperkalemia ในบริบทไตวาย"], "nl": ["B9.2.7(2)", "B9.1.2(8)", "2.3.14(3)"]}, {"id": "N-OLD-008", "kind": "old", "stem": "What is the main mechanism of hypocalcaemia in end-stage renal disease?", "choices": ["Phosphate retention with reduced calcitriol production by the failing kidney", "Increased calcitonin secretion", "Excess intestinal calcium absorption", "Primary parathyroid gland failure", "Excessive urinary calcium loss"], "answer": 0, "explain": "ไตวายทำให้ **ขับฟอสเฟตไม่ได้ (PO4 สูง) และสร้าง 1,25-dihydroxyvitamin D ไม่ได้** → แคลเซียมต่ำ → PTH หลั่งเพิ่มเรื้อรังกลายเป็น **secondary hyperparathyroidism และ renal osteodystrophy**; การรักษาเน้นจำกัดฟอสเฟตในอาหาร ให้ยาจับฟอสเฟต และให้ active vitamin D ตามข้อบ่งชี้", "pearl": "", "topic": "", "src": "MED33 MCQ", "ref": [], "nl": ["B9.2.7(2)", "B9.1.2(8)", "B9.1.2(4)"]}]}, {"id": "nephro-05-06", "title": "แคลเซียมต่ำเฉียบพลัน — ซิเตรต hungry bone และการแก้", "minutes": 8, "summary": "สองภาวะที่ total calcium หลอกตา และการให้แคลเซียมที่ถูกวิธี", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "2.2.21", "B9.4(2)"], "md": "### 1. พิษจากซิเตรตหลังให้เลือดปริมาณมาก\n**กลไก** — เลือดที่เก็บไว้ใช้ **ซิเตรตเป็นสารกันเลือดแข็ง** โดยซิเตรต **จับ (chelate) ionized calcium** ปกติตับเปลี่ยนซิเตรตเป็นไบคาร์บอเนตได้เร็วมาก แต่เมื่อ **ให้เลือดเร็วและมาก หรือคนไข้ตับวาย ตัวเย็น หรือช็อก** ซิเตรตจะคั่ง → **ionized calcium ตกฮวบ**\n\n> **จุดที่หลอกตาและออกสอบแน่นอน** — **total calcium อาจปกติ** เพราะแคลเซียมยังอยู่ในเลือด แค่ถูกซิเตรตจับไว้ **ต้องวัด ionized calcium เท่านั้นจึงจะเห็นปัญหา**\n\nอาการที่ชี้: **ชารอบปาก มือจีบ Trousseau บวก QT ยาว** หลังได้เลือดหลายถุง · เจอกลไกเดียวกันใน **regional citrate anticoagulation ของ CRRT**\n**รักษา** — ให้แคลเซียมทางหลอดเลือด ชะลออัตราการให้เลือด และอุ่นร่างกาย\n\n### 2. Hungry bone syndrome\n**เกิดเมื่อไหร่** — **หลังผ่าตัดพาราไทรอยด์** โดยเฉพาะในคนไข้ **ไตวายที่ฟอกเลือดอยู่ หรือหลังปลูกถ่ายไต** ที่มี **hyperparathyroidism รุนแรงมานาน**\n\n**กลไก** — PTH ที่สูงเรื้อรังทำให้กระดูก **ถูกสลายจนบางมานาน** เมื่อ **ตัดต่อมออก ฤทธิ์ของ PTH ต่อกระดูกหายไปทันที** → **osteoblast ดูดแคลเซียม ฟอสเฟต และแมกนีเซียมกลับเข้ากระดูกอย่างรวดเร็ว เร็วกว่าที่ osteoclast จะสลายออกมา** → กระดูก \"หิว\" ดูดแร่ธาตุทั้งสามเข้าไปพร้อมกัน\n\n**ผลที่ได้จึงเป็นสามตัวต่ำพร้อมกัน — แคลเซียมต่ำ ฟอสเฟตต่ำ แมกนีเซียมต่ำ** และมักรุนแรง มีอาการ และลากยาวหลายสัปดาห์\nสไลด์ระบุด้วยว่า **มักพบโพแทสเซียมสูงร่วมด้วย แต่ยังไม่ทราบกลไก**\n\n> **ตัวแยกที่ชี้ขาด** — คนไข้สองคนแคลเซียมต่ำหลังผ่าตัดคอเหมือนกัน ให้ดู **ฟอสเฟต**\n\n| | Hungry bone syndrome | Hypoparathyroidism หลังผ่าตัด |\n|---|---|---|\n| Ca | ต่ำ | ต่ำ |\n| **PO₄** | **ต่ำ** (ถูกดูดเข้ากระดูกด้วย) | **สูง** (ไม่มี PTH มาขับฟอสเฟต) |\n| Mg | **ต่ำ** | ปกติ |\n| PTH | ปกติหรือสูง | **ต่ำ** |\n| ALP | **สูงมาก** | ปกติ |\n| ระยะเวลา | เป็นสัปดาห์ถึงเดือน | ถาวรหรือชั่วคราว |\n\n*(คนไข้ส่วนใหญ่ที่ผ่าตัดพาราไทรอยด์มีแค่แคลเซียมต่ำเล็กน้อยและหายเอง — hungry bone คือส่วนน้อยที่รุนแรงและยืดเยื้อ)*\n\n### 3. สาเหตุเฉียบพลันอื่นที่ต้องนึกถึง\n**Tumor lysis syndrome · กล้ามเนื้อสลาย · ตับอ่อนอักเสบเฉียบพลัน** (ไขมันที่ถูกย่อยจับแคลเซียมเป็นสบู่) · **การได้ฟอสเฟตปริมาณมาก** (สวนล้างลำไส้) · **foscarnet, bisphosphonate, denosumab**\n\n### การรักษาแคลเซียมต่ำที่มีอาการ\n- **มีอาการชัก มือจีบ กล่องเสียงเกร็ง หรือ QT ยาว → ให้แคลเซียมทางหลอดเลือดทันที**\n- **Calcium gluconate 1−2 g (10−20 mL ของ 10%) เจือจางใน D5W 50−100 mL หยดนาน 10−20 นาที** แล้วตามด้วยการหยดต่อเนื่องถ้ายังมีอาการ\n- **เลือก gluconate สำหรับเส้นเลือดส่วนปลาย** — **calcium chloride มีแคลเซียมอิสระมากกว่าราว 3 เท่า แต่กัดเนื้อเยื่อรุนแรง ต้องให้ทางเส้นเลือดใหญ่เท่านั้น**\n- **แก้แมกนีเซียมไปพร้อมกันเสมอ** มิฉะนั้นแคลเซียมจะไม่ขึ้น\n- **ระวังเมื่อฟอสเฟตสูงอยู่ด้วย** (เช่นใน tumor lysis) — การให้แคลเซียมจะเร่งการตกตะกอนแคลเซียม-ฟอสเฟตในเนื้อเยื่อและไต **จึงให้เฉพาะเมื่อมีอาการจริง** และควรลดฟอสเฟตลงก่อนถ้าทำได้\n- คนที่ไม่มีอาการ → แก้ด้วยแคลเซียมกินร่วมกับ **calcitriol** (โดยเฉพาะใน hypoparathyroidism ที่ไม่มี PTH มากระตุ้น 1α-hydroxylase)\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์อธิบาย hungry bone syndrome ไว้เต็มหนึ่งหน้า และเน้นคำว่า **\"rapid osteoblast-mediated uptake of calcium, phosphate, and magnesium into bone outpaces osteoclast-mediated bone resorption\"** — คือที่มาของสามตัวต่ำพร้อมกัน\n- สไลด์ระบุว่าคนไข้ผ่าตัดพาราไทรอยด์ **ส่วนใหญ่มีแคลเซียมต่ำเล็กน้อยและหายได้เอง** ส่วน hungry bone คือรายที่ **รุนแรง มีอาการ และนานผิดปกติ**\n", "pearls": ["ซิเตรตจับ ionized calcium — total calcium ปกติหลอกตาได้ ต้องวัด ionized", "Hungry bone = Ca ต่ำ PO₄ ต่ำ Mg ต่ำ ALP สูง · hypoparathyroidism หลังผ่าตัด = Ca ต่ำ แต่ PO₄ สูง", "Calcium gluconate ให้ทางเส้นเลือดส่วนปลายได้ · calcium chloride ต้องเส้นเลือดใหญ่เพราะกัดเนื้อเยื่อ", "แคลเซียมต่ำที่ดื้อต่อการรักษา ให้นึกถึงแมกนีเซียมต่ำเสมอ", "ฟอสเฟตสูงร่วมด้วย → ให้แคลเซียมเฉพาะเมื่อมีอาการ เพราะเร่งการตกตะกอนแคลเซียม-ฟอสเฟต"], "items": [{"id": "N-MCQ-06", "kind": "mcq", "stem": "A 34-year-old man with massive upper gastrointestinal bleeding receives 12 units of packed red cells and 6 units of fresh frozen plasma over 3 hours. He then develops peri-oral numbness, carpopedal spasm and a positive Trousseau sign. ECG shows a prolonged QT interval. Which electrolyte abnormality is most likely responsible?", "choices": ["Hypocalcaemia", "Hypernatraemia", "Hypermagnesaemia", "Hyperkalaemia", "Hypophosphataemia"], "answer": 0, "explain": "กลไก: **citrate เป็นสารกันเลือดแข็ง (anticoagulant) ในถุงเลือด** โดยออกฤทธิ์ด้วยการ **จับ (chelate) calcium ที่เป็น free ionised Ca2+** ซึ่งเป็น cofactor จำเป็นของ coagulation cascade\n\nในภาวะปกติตับจะ **metabolise citrate เป็น bicarbonate ได้เร็ว** → ไม่เกิดปัญหา แต่เมื่อ\n- ให้เลือดปริมาณมากเร็ว (**massive transfusion**: ≥10 units ใน 24 ชม. หรือ ≥4 units ใน 1 ชม.)\n- หรือผู้ป่วยมี **การทำงานของตับบกพร่อง / hypoperfusion / hypothermia**\n→ citrate สะสม → **จับ ionised calcium ในเลือด → ionised hypocalcaemia** (โดยที่ **total calcium อาจดูปกติ** เพราะ Ca ที่จับกับ citrate ยังถูกนับรวม — จึงต้องวัด **ionised calcium** ไม่ใช่ total)\n\nอาการตรงกับ hypocalcaemia แบบฉบับ: **peri-oral numbness, paraesthesia, carpopedal spasm, Trousseau sign, Chvostek sign, tetany, ชัก, QT ยาว, hypotension และ myocardial depression**\n\nการรักษา: **IV calcium gluconate (หรือ calcium chloride ในภาวะวิกฤต) โดยให้ผ่านคนละเส้นกับเลือด**, อุ่นเลือด/ผู้ป่วยเพื่อแก้ hypothermia, ติดตาม ionised calcium และ ECG\n\nทำไมข้ออื่นผิด — ทุกข้อพบได้ใน massive transfusion แต่ไม่อธิบายอาการชุดนี้:\n- **Hyperkalaemia**: เกิดจาก K ที่รั่วออกจาก RBC ใน stored blood (ยิ่งเก่ายิ่งสูง) — จะให้ **peaked T wave, QRS กว้าง, กล้ามเนื้ออ่อนแรง** ไม่ใช่ tetany และทำให้ **QT สั้น** ไม่ใช่ยาว\n- **Hypernatraemia**: ไม่ใช่ปัญหาเด่นของ transfusion และไม่ทำให้ tetany\n- **Hypophosphataemia**: ทำให้กล้ามเนื้ออ่อนแรง, rhabdomyolysis, hemolysis, respiratory failure — ไม่ใช่ tetany กับ Trousseau sign\n- **Hypermagnesaemia**: จะ **กด** neuromuscular transmission → **DTR หาย, อ่อนแรง, hypotension, bradycardia** ซึ่งตรงข้ามกับภาวะ hyperexcitability ในโจทย์", "pearl": "ภาวะแทรกซ้อนของ massive transfusion ที่ต้องจำ: **hypocalcaemia (citrate), hyperkalaemia, hypothermia, metabolic alkalosis (citrate → bicarbonate) หรือ acidosis จาก hypoperfusion, dilutional coagulopathy, TACO/TRALI**. ข้อสอบ MED ออกทั้ง \"citrate toxicity ทำให้ electrolyte ใดตก\" และ \"ให้เลือดแล้ว volume overload → TACO\"", "topic": "Citrate toxicity after massive transfusion", "src": "", "ref": ["MED31 past paper loop C&D – What electrolyte may fall in level as a result of citrate toxicity from massive blood transfusion? (choices: calcium, phosphorus, sodium, potassium, magnesium)", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 25 – ให้เลือดผ่าตัดแล้วเลือดออกเยอะ → dilutional coagulopathy จาก massive infusion", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 26 – ให้เลือดแล้ว volume overload, CXR เจอ pulmonary edema → TACO"], "nl": ["B9.2.5(2)", "2.2.21"]}, {"id": "N-OLD-009", "kind": "old", "stem": "Which electrolyte falls as a result of citrate toxicity after massive blood transfusion?", "choices": ["Sodium", "Chloride", "Potassium", "Ionised calcium", "Bicarbonate"], "answer": 3, "explain": "**Citrate ในถุงเลือดจับแคลเซียมอิสระ** และเมื่อให้เลือดปริมาณมากเร็วกว่าที่ตับจะเผาผลาญ citrate ได้ จะเกิด **ionised hypocalcaemia** ทำให้ความดันตกและการแข็งตัวของเลือดแย่ลง — ต้องติดตาม ionised calcium และให้แคลเซียมทดแทนระหว่าง massive transfusion", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "2.2.21", "B9.3(5)"]}]}, {"id": "nephro-05-07", "title": "สมดุลฟอสเฟตและการจัดการของไต", "minutes": 9, "summary": "ไตคือทางออกทางเดียวที่ถูกควบคุม และ FGF-23 คือคนคุมประตู", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(4)", "B9.1.2(3)", "B9.2.7(2)", "B9.3(5)"], "md": "### ฟอสเฟตอยู่ที่ไหนและทำอะไร\n- **80−85% อยู่ในกระดูก · 14% อยู่ในเซลล์ · เหลือใน ECF เพียง 1%**\n- ผลที่ตามมาเชิงคลินิก: **ระดับฟอสเฟตในเลือดสะท้อนปริมาณฟอสเฟตทั้งร่างกายได้ไม่ดีเลย** — ฟอสเฟตในเลือดปกติไม่ได้แปลว่าไม่พร่อง\n- หน้าที่: **สร้าง ATP และกรดนิวคลีอิก · ส่งสัญญาณในเซลล์ · เป็นโครงของเยื่อหุ้มเซลล์ (phospholipid) · สร้างกระดูก · 2,3-DPG ในเม็ดเลือดแดง**\n\n### ลำไส้ — แหล่งของฟอสเฟตต่างกันมาก\n- กินวันละ **800−1,200 mg ดูดซึมราวสองในสาม** ที่ **duodenum และ jejunum**\n- **ระดับฟอสเฟตปกติ → ดูดซึมแบบ paracellular เป็นหลัก** · **ฟอสเฟตต่ำและ calcitriol สูง → เปลี่ยนไปใช้ transcellular ผ่าน NaPi-2b ที่ถูกเหนี่ยวนำด้วย calcitriol**\n- **แหล่งของฟอสเฟตสำคัญกว่าปริมาณ** — จุดนี้คือหัวใจของการให้คำแนะนำเรื่องอาหารใน CKD\n\n| แหล่ง | การดูดซึม | ตัวอย่าง |\n|---|---|---|\n| **ฟอสเฟตอนินทรีย์ในวัตถุเจือปนอาหาร** | **ดูดซึมได้เกือบหมด — มากที่สุด** | อาหารแปรรูป น้ำอัดลมสีเข้ม ไส้กรอก อาหารสำเร็จรูป |\n| **โปรตีนจากสัตว์และนม** | ดูดซึมได้ดี | เนื้อสัตว์ ไข่ นม ชีส |\n| **พืช (อยู่ในรูป phytate)** | **ดูดซึมได้น้อย** เพราะ **มนุษย์ไม่มีเอนไซม์ phytase** | ถั่ว ธัญพืชเต็มเมล็ด |\n\n> **ประเด็นที่ใช้ได้จริง** — คนไข้ CKD ที่กินอาหารแปรรูปมาก จะได้รับฟอสเฟตเกินความต้องการทางสรีรวิทยาไปไกล **ทั้งที่ปริมาณโปรตีนในอาหารอาจไม่มาก** การจำกัดวัตถุเจือปนจึงได้ผลกว่าการห้ามโปรตีนแบบเหมารวม\n\n### ไต — ทางออกทางเดียวที่ถูกควบคุม\n- **ไตปกติขับฟอสเฟตได้ถึงวันละ 4,000 mg โดยระดับในเลือดแทบไม่ขึ้น** — ประสิทธิภาพสูงมาก\n- **FE ของฟอสเฟตในคนปกติมักต่ำกว่า 15%**\n\n| ส่วนของหน่วยไต | ดูดกลับ |\n|---|---|\n| **PCT** | **85%** (ส่วนใหญ่) |\n| Loop of Henle | 10% |\n| DCT | 3% |\n| Collecting duct | 2% (ยังไม่ทราบตัวขนส่ง) |\n\n- ตัวขนส่งที่ **apical membrane ของ PCT** คือ **NaPi-2a, NaPi-2c และ PiT-2** (ตัวขนส่งด้านข้างยังไม่ทราบชนิด)\n- **FGF-23 (ผ่าน FGFR-klotho) และ PTH (ผ่าน PTH1R) ต่างก็ดึง NaPi-2a และ NaPi-2c ออกจากผิวเซลล์** → ดูดกลับน้อยลง → **ขับฟอสเฟตออกมากขึ้น**\n- **ยากลุ่ม SGLT2 inhibitor ทำตรงข้าม** — เพิ่มการดูดกลับฟอสเฟตที่ PCT ทำให้ฟอสเฟตสูงขึ้นเล็กน้อย\n\n### สิ่งที่เพิ่มและลดการดูดกลับฟอสเฟต (จากสไลด์)\n\n| เพิ่มการดูดกลับ | ลดการดูดกลับ |\n|---|---|\n| อาหารฟอสเฟตต่ำ · **1,25(OH)₂D₃** · ฮอร์โมนไทรอยด์ | อาหารฟอสเฟตสูง · **PTH** · **phosphatonin เช่น FGF-23** · ภาวะเลือดเป็นกรดจากเมตาบอลิก · ขาดโพแทสเซียม · กลูโคคอร์ติคอยด์ · โดพามีน · ความดันโลหิตสูง · เอสโตรเจน |\n\n### การปรับตัวใน CKD — \"trade-off\" ที่ต้องเข้าใจ\nเมื่อ GFR ลดลง **ฟอสเฟตที่ถูกกรองลดลงตามไปด้วย** ร่างกายจึงชดเชยเป็นลำดับ\n1. **FGF-23 สูงขึ้นก่อนเป็นตัวแรก** → ลด NaPi-2a/2c → **เพิ่ม FE ของฟอสเฟต** ทำให้ระดับในเลือดยังปกติ\n2. FGF-23 ที่สูง **กด calcitriol** → **แคลเซียมต่ำลง → เกิด secondary hyperparathyroidism**\n3. **PTH ที่สูงขึ้นช่วยขับฟอสเฟตเพิ่มอีกทาง**\n\n> **ผลสุทธิ — ฟอสเฟตในเลือดจะยังปกติไปได้นานมาก และจะสูงก็ต่อเมื่อ GFR ตกจนต่ำมากจนกลไกชดเชยของ FGF-23 และ PTH เอาไม่อยู่แล้ว** ดังนั้น **ฟอสเฟตปกติใน CKD ไม่ได้แปลว่าไม่มีความผิดปกติของแกนนี้ — FGF-23 และ PTH สูงไปนานแล้ว**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้สัดส่วนการดูดกลับรายส่วนเป็นตัวเลขชัด **PCT 85% · LOH 10% · DCT 3% · CD 2%** อ้างจาก **Clin J Am Soc Nephrol 10: 1257−1272, 2015**\n- สไลด์ย้ำประโยค **\"Hyperphosphatemia does not occur until critical reductions in GFR overcome the compensatory effects of FGF-23 and PTH\"**\n- สไลด์กล่าวถึง **SGLT2 inhibitor เพิ่มการดูดกลับฟอสเฟต** ไว้ด้วย ซึ่งเป็นประเด็นใหม่ที่เพิ่งเข้ามาในตำรา\n", "pearls": ["ฟอสเฟต 80−85% อยู่ในกระดูก ใน ECF แค่ 1% — ระดับในเลือดไม่สะท้อนปริมาณรวมในร่างกาย", "ฟอสเฟตอนินทรีย์ในวัตถุเจือปนอาหารดูดซึมได้เกือบหมด ส่วน phytate จากพืชดูดซึมได้น้อย", "PCT ดูดกลับฟอสเฟต 85% ผ่าน NaPi-2a/2c/PiT-2 · FGF-23 และ PTH ต่างดึงตัวขนส่งออกจากผิวเซลล์", "FE ฟอสเฟตปกติ < 15% · ไตปกติขับได้ถึง 4,000 mg/วันโดยระดับในเลือดแทบไม่ขึ้น", "ใน CKD ฟอสเฟตจะยังปกติจนกว่า GFR จะตกมาก เพราะ FGF-23 ขึ้นก่อนแล้วตามด้วย PTH"], "items": [{"id": "NEPHRO-05-07-Q1", "kind": "own", "stem": "A 58-year-old man with stage 3b chronic kidney disease (eGFR 34 mL/min/1.73 m2) has a serum phosphate of 3.6 mg/dL (normal 2.7-4.5), calcium 9.1 mg/dL, intact PTH 180 pg/mL (high) and a markedly elevated FGF-23. Which of the following best explains why his serum phosphate is still normal?", "choices": ["The proximal tubule has upregulated NaPi-2a and NaPi-2c to compensate for the reduced filtered load", "FGF-23 and PTH have increased the fractional excretion of phosphate by the remaining nephrons", "Intestinal absorption of phosphate has fallen because calcitriol levels are elevated", "Phosphate has shifted from the extracellular fluid into bone because of the high PTH level", "The reduced glomerular filtration rate has been offset by an increase in renal phosphate secretion"], "answer": 1, "explain": "**กลไก** — เมื่อ GFR ลดลง ปริมาณฟอสเฟตที่ถูกกรองลดลงตามไปด้วย ร่างกายชดเชยด้วยการ **ให้หน่วยไตที่เหลือขับฟอสเฟตออกในสัดส่วนที่สูงขึ้น** โดย **FGF-23 ขึ้นก่อนเป็นตัวแรก** แล้ว **PTH ตามมา** ทั้งคู่ดึง **NaPi-2a และ NaPi-2c** ออกจาก apical membrane ของ PCT → **FE ของฟอสเฟตเพิ่มขึ้น** ฟอสเฟตในเลือดจึงยังปกติ ราคาที่จ่ายคือ **calcitriol ต่ำและ secondary hyperparathyroidism** ซึ่งเห็นได้จาก PTH 180 ในคนไข้รายนี้\n\n**ทำไมตัวลวงจึงผิด**\n- *PCT เพิ่ม NaPi-2a/2c* — กลับทิศ การเพิ่มตัวขนส่งจะยิ่งเก็บฟอสเฟตไว้และทำให้สูงขึ้น\n- *calcitriol สูงจึงดูดซึมน้อยลง* — ผิดสองชั้น: ใน CKD **calcitriol ต่ำ** ไม่ใช่สูง และ calcitriol ที่สูง **เพิ่ม** การดูดซึมฟอสเฟต ไม่ใช่ลด\n- *ฟอสเฟตถูกดึงเข้ากระดูกเพราะ PTH สูง* — PTH **สลาย** กระดูกและ **ปล่อย** ฟอสเฟตออกมา ไม่ใช่ดึงเข้า (การดึงแร่ธาตุเข้ากระดูกอย่างรวดเร็วเกิดใน hungry bone syndrome ซึ่งเป็นภาวะที่ PTH หายไปทันที)\n- *ไตหลั่งฟอสเฟตเพิ่ม* — ไตของมนุษย์ควบคุมฟอสเฟตด้วย **การปรับการดูดกลับที่ PCT** ไม่ได้ใช้การหลั่งเป็นกลไกควบคุม", "pearl": "ฟอสเฟตปกติใน CKD ระยะกลางคือผลของ FGF-23 และ PTH ที่สูงไปแล้ว ไม่ใช่สัญญาณว่าแกนนี้ยังปกติ", "topic": "สมดุลฟอสเฟตและการจัดการของไต", "src": "", "ref": [], "nl": ["B9.2.7(2)", "B9.1.2(8)"]}]}, {"id": "nephro-05-08", "title": "ภาวะฟอสเฟตสูง — tumor lysis และไตวาย", "minutes": 9, "summary": "อันตรายไม่ได้อยู่ที่ฟอสเฟตเอง แต่อยู่ที่แคลเซียมที่ตกตามลงไป", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "2.3.2", "B9.2.7(1)", "B9.3(5)"], "md": "### ทำไมฟอสเฟตสูงเฉียบพลันจึงอันตรายถึงชีวิต\nไม่ใช่เพราะตัวฟอสเฟตเอง แต่เพราะ\n1. **ทำให้แคลเซียมต่ำรุนแรงพร้อมกัน** — ฟอสเฟตจับแคลเซียมตกตะกอนออกจากกระแสเลือด → ชัก หัวใจเต้นผิดจังหวะ\n2. **แคลเซียม-ฟอสเฟตตกตะกอนตามอวัยวะ** — **ไต หัวใจ ข้อ และผนังหลอดเลือด**\n3. **การตกตะกอนในท่อไตและเนื้อไตทำให้เกิดไตวายเฉียบพลัน** ซึ่ง **ยิ่งขับฟอสเฟตไม่ออก ฟอสเฟตยิ่งสูงขึ้นอีก** — เป็นวงจรเลวร้าย เห็นชัดใน **acute phosphate nephropathy** จากการใช้ **ยาสวนล้างลำไส้ที่มีฟอสเฟตเตรียมส่องกล้องลำไส้ใหญ่ในคนที่มี CKD อยู่เดิม**\n\n### สามกลไกของฟอสเฟตสูง\n| กลไก | ตัวอย่าง |\n|---|---|\n| **ได้รับฟอสเฟตปริมาณมาก** | ยาสวนล้างลำไส้/ยาระบายที่มีโซเดียมฟอสเฟต · **fosphenytoin** · สารอาหารทางหลอดเลือด |\n| **ฟอสเฟตเคลื่อนจากในเซลล์ออกนอกเซลล์** | **Tumor lysis syndrome · กล้ามเนื้อสลาย · เม็ดเลือดแดงแตก · ภาวะเลือดเป็นกรด** |\n| **ไตขับออกไม่ได้** | **AKI และ CKD (สาเหตุที่พบบ่อยที่สุดของฟอสเฟตสูงเรื้อรัง)** · hypoparathyroidism และ pseudohypoparathyroidism · ขาด FGF-23 หรือดื้อต่อ FGF-23 |\n\n> **GFR ที่ลดลงไม่ได้เป็นแค่สาเหตุเดี่ยว ๆ แต่เป็นตัวขยายทุกกลไก** — คนที่มี CKD อยู่เดิมจะเกิดฟอสเฟตสูงรุนแรงจากการได้ฟอสเฟตหรือจากการสลายเซลล์ได้ง่ายกว่าคนไตปกติมาก\n\n### Tumor lysis syndrome — สาเหตุที่พบบ่อยที่สุดของฟอสเฟตสูงฉุกเฉิน\n**เกิดเมื่อไหร่** — หลังเริ่มเคมีบำบัดใน **มะเร็งที่แบ่งตัวเร็ว เช่น lymphoma เกรดสูงและมะเร็งเม็ดเลือดขาว** (หรือเกิดเองก่อนรักษาก็ได้) มักภายใน **12−72 ชั่วโมง**\n\n**กลไก** — เซลล์มะเร็งแตกพร้อมกันจำนวนมาก → ปล่อยของในเซลล์ออกมา\n- **โพแทสเซียม → hyperkalemia** (ตัวที่ฆ่าคนไข้เร็วที่สุด)\n- **กรดนิวคลีอิก → เปลี่ยนเป็นกรดยูริก → hyperuricemia**\n- **ฟอสเฟต → hyperphosphatemia → จับแคลเซียม → hypocalcemia ตามมาเป็นผลทุติยภูมิ**\n- ทั้งกรดยูริกและแคลเซียม-ฟอสเฟตตกตะกอนในท่อไต → **AKI**\n\n> **กับดักที่ออกสอบซ้ำที่สุดของหัวข้อนี้ — tumor lysis ทำให้แคลเซียม \"ต่ำ\" ไม่ใช่สูง** ถ้าโจทย์ถามว่าข้อใด **ไม่** พบใน TLS คำตอบคือ **แคลเซียมสูง**\n> จำเป็นชุด: **K สูง · ฟอสเฟตสูง · กรดยูริกสูง · แคลเซียมต่ำ · Cr สูง**\n> **กล้ามเนื้อสลาย (rhabdomyolysis) ให้ภาพเดียวกันทุกประการ** เพราะเป็นการแตกของเซลล์เหมือนกัน\n\n**การป้องกันและรักษา**\n- **ให้สารน้ำทางหลอดเลือดอย่างเพียงพอ** คือหัวใจ — เพิ่มปริมาณปัสสาวะ ชะล้างไม่ให้ตกตะกอน\n- **Rasburicase** ในกลุ่มเสี่ยงสูง · **allopurinol** ในกลุ่มเสี่ยงปานกลาง\n- **ไม่ทำให้ปัสสาวะเป็นด่างแล้วในปัจจุบัน** — แม้จะละลายกรดยูริกได้ดีขึ้น แต่กลับ **เร่งการตกตะกอนของแคลเซียม-ฟอสเฟตในท่อไต**\n- **อย่ารีบให้แคลเซียมถ้าไม่มีอาการ** — จะยิ่งเพิ่มการตกตะกอน ให้เฉพาะเมื่อมีอาการจากแคลเซียมต่ำจริง\n- ฟอกเลือดเมื่อ K สูงคุมไม่ได้ ฟอสเฟตสูงมาก หรือ AKI ที่ปัสสาวะไม่ออก\n\n### การวินิจฉัย — สิ่งที่ \"ไม่ต้อง\" ส่ง\n> **ในภาวะฟอสเฟตสูง การวัดฟอสเฟตในปัสสาวะแทบไม่มีประโยชน์** เพราะไตเป็นทางออกทางเดียวที่ถูกควบคุม ค่าที่วัดได้เท่าไรก็ตาม **ล้วนแปลว่า \"ยังไม่พอ\"** อยู่ดี\nการวินิจฉัยจึงมุ่งไปที่ **(1) ทำไมไตจึงขับฟอสเฟตไม่ได้ และ (2) ฟอสเฟตมาจากไหน** ด้วยประวัติ ตรวจร่างกาย และแล็บพื้นฐาน **โดยเฉพาะแคลเซียม** ส่วน PTH, calcitriol และ FGF-23 ส่งเฉพาะเมื่อจำเป็น\n\n### ฟอสเฟตสูงเรื้อรังเมื่อไตยังดี\nเมื่อ **ไม่มีไตวาย** ให้คิดถึง **hypoparathyroidism และ pseudohypoparathyroidism** (ขาด PTH → NaPi เพิ่มขึ้น → ดูดกลับฟอสเฟตมากขึ้น พร้อมกับ **แคลเซียมต่ำ**) และ **ภาวะขาดหรือดื้อต่อ FGF-23** ซึ่งรวมถึง **ยากลุ่ม FGFR inhibitor — erdafitinib (มะเร็งท่อปัสสาวะ), pemigatinib และ infigratinib (มะเร็งท่อน้ำดี)** ที่ทำให้ฟอสเฟตสูงเป็น class effect\nกลุ่มที่ขาดฤทธิ์ FGF-23 นี้ **ยังทำให้แคลเซียมในปัสสาวะสูงและบางรายแคลเซียมในเลือดสูง** เพราะไม่มี FGF-23 มากด calcitriol\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ระบุชัดว่าฟอสเฟตสูงเฉียบพลัน **\"life threatening primarily by inducing severe concomitant hypocalcemia\"** และยกตัวอย่าง **acute phosphate nephropathy จากยาสวนเตรียมส่องกล้อง** เป็นกรณีศึกษา\n- สไลด์ย้ำว่า **tumor lysis syndrome เป็นสาเหตุที่พบบ่อยที่สุดของฟอสเฟตสูงแบบฉุกเฉิน** และไล่กลไกว่าเป็น **hyperkalemia + hyperuricemia + hyperphosphatemia with secondary hypocalcemia**\n- สไลด์เตือนเรื่อง **fosphenytoin, bisphosphonate และยาระบายโซเดียมฟอสเฟต ว่าต้องใช้อย่างระมัดระวังอย่างยิ่งในคนไข้ CKD**\n", "pearls": ["Tumor lysis = K สูง ฟอสเฟตสูง กรดยูริกสูง แคลเซียมต่ำ Cr สูง — แคลเซียมสูงคือสิ่งที่ 'ไม่' พบ", "อันตรายของฟอสเฟตสูงเฉียบพลันคือแคลเซียมต่ำรุนแรงและแคลเซียม-ฟอสเฟตตกตะกอนในไต", "ป้องกัน TLS ด้วยสารน้ำเป็นหลัก + rasburicase หรือ allopurinol · เลิกทำให้ปัสสาวะเป็นด่างแล้ว", "ไม่มีประโยชน์ในการวัดฟอสเฟตในปัสสาวะเมื่อฟอสเฟตในเลือดสูง", "ฟอสเฟตสูงเรื้อรังที่ไตยังดี ให้คิดถึง hypoparathyroidism และยากลุ่ม FGFR inhibitor"], "items": [{"id": "N-MCQ-05", "kind": "mcq", "stem": "A 42-year-old man with acute lymphoblastic leukaemia and a high white cell count develops oliguria, nausea and muscle cramps 24 hours after his first cycle of chemotherapy. Which of the following laboratory findings would NOT be expected in this condition?", "choices": ["Hypercalcaemia", "Acute kidney injury with rising creatinine", "Hyperphosphataemia", "Hyperkalaemia", "Hyperuricaemia"], "answer": 0, "explain": "กลไก: **tumour lysis syndrome (TLS)** เกิดจากเซลล์มะเร็งจำนวนมากแตกพร้อมกัน (มักใน 12-72 ชม. หลังเริ่มเคมีบำบัด ในมะเร็งที่ **โตเร็ว, ก้อนใหญ่, LDH สูง, WBC สูง** เช่น ALL, Burkitt lymphoma, AML)\n\nสิ่งที่อยู่ในเซลล์ไหลออกมาในเลือด:\n- **K+ ในเซลล์สูงมาก (~140 mEq/L)** → **hyperkalaemia** (อันตรายที่สุด ทำให้ arrhythmia/cardiac arrest)\n- **phosphate ในเซลล์สูง** → **hyperphosphataemia**\n- **nucleic acid → purine → xanthine → uric acid** → **hyperuricaemia**\n- **hypocalcaemia (ไม่ใช่ hyper!)** เพราะ **phosphate ที่สูงจับกับ calcium เกิด calcium-phosphate ตกตะกอนในเนื้อเยื่อ** → Ca อิสระต่ำ → เกิดอาการ **muscle cramps, tetany, ชัก, QT ยาว, arrhythmia** (ตรงกับ muscle cramps ในโจทย์)\n- **AKI** จากหลายกลไกร่วมกัน: **uric acid ตกผลึกใน tubule (urate nephropathy), calcium-phosphate ตกตะกอนใน tubule (nephrocalcinosis), volume depletion และ cytokine-mediated injury**\n\n→ ดังนั้น **hypercalcaemia เป็นสิ่งที่ \"ไม่\" คาดว่าจะพบ** = คำตอบ\n\nการป้องกันและรักษาตามกลไก:\n- **IV fluid ปริมาณมากเพื่อเพิ่ม urine flow** (มาตรการสำคัญที่สุด) — ปัจจุบัน **ไม่แนะนำ urine alkalinization เป็นกิจวัตร** เพราะทำให้ calcium-phosphate ตกตะกอนง่ายขึ้น\n- **Allopurinol** (xanthine oxidase inhibitor) สำหรับ **ป้องกัน** ในความเสี่ยงปานกลาง\n- **Rasburicase** (recombinant urate oxidase เปลี่ยน uric acid เป็น allantoin ที่ละลายน้ำดี) สำหรับความเสี่ยงสูงหรือมี TLS แล้ว — **ห้ามใช้ใน G6PD deficiency** (ทำให้เกิด hemolysis รุนแรง ซึ่งเป็น pitfall ที่สำคัญในไทย)\n- **แก้ hyperkalaemia อย่างเร่งด่วน** (calcium gluconate, insulin+glucose, binder, dialysis)\n- **ไม่ควรให้ calcium เพื่อแก้ hypocalcaemia ถ้าไม่มีอาการ** เพราะจะยิ่งเพิ่มการตกตะกอนของ calcium-phosphate\n- **Dialysis** เมื่อมีข้อบ่งชี้ (hyperkalaemia/acidosis/overload ที่ดื้อต่อการรักษา, phosphate สูงมาก, oliguric AKI)", "pearl": "Cairo-Bishop criteria: **laboratory TLS** = ความผิดปกติอย่างน้อย 2 อย่างใน (uric acid, K, PO4 สูง / Ca ต่ำ) ภายใน 3 วันก่อน–7 วันหลังเริ่มรักษา; **clinical TLS** = laboratory TLS + **Cr สูงขึ้น / arrhythmia / ชัก**", "topic": "Tumour lysis syndrome – which finding is NOT expected", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 12 – Tumor lysis syndrome ข้อใดผิด → ตอบ hypercalcemia", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (Hemato ข้อ 5) – คนไข้เป็นมะเร็งได้รับยา chemotherapy มา 1 วัน มีอาการต่างๆ และมี K 5.6 → Tumor lysis syndrome", "MED32 MCQ ข้อ 29 – ALL ได้รับ 1st chemotherapy K 5.6 Ca 7.8 → tumor lysis syndrome", "MED31 MCQ ข้อ 26 – คนไข้ AML ไปทำ chemotherapy แล้ว hyperkalemia / MED31 MCQ – มี hypocalcemia ตอบ tumor lysis syndrome", "MED31 MCQ ข้อ 49 – ทำ chemo ไตพัง BUN Cr K สูง เกิดจากอะไร"], "nl": ["B9.2.5(2)", "B9.2.7(1)"]}, {"id": "N-OLD-005", "kind": "old", "stem": "Which finding is NOT expected in tumour lysis syndrome?", "choices": ["Hyperuricaemia", "Hyperkalaemia", "Hyperphosphataemia", "Hypercalcaemia", "Acute kidney injury"], "answer": 3, "explain": "**TLS = เซลล์มะเร็งแตกปล่อยสารในเซลล์ออกมา** จึงได้ K สูง, PO4 สูง, uric acid สูง และ **แคลเซียมต่ำ** (เพราะฟอสเฟตที่สูงไปจับแคลเซียมตกตะกอน) ตามด้วยไตวายจาก urate และ calcium-phosphate nephropathy", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 FA MCQ ข้อ 12", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.2"]}, {"id": "N-OLD-006", "kind": "old", "stem": "A patient with acute leukaemia develops K 5.6 mEq/L, calcium 7.8 mg/dL, phosphate 6.8 mg/dL and creatinine rising 1 day after the first chemotherapy. What is the diagnosis and the key preventive measure?", "choices": ["Sepsis; start antibiotics only", "Hypercalcaemia of malignancy; give bisphosphonate", "Tumour lysis syndrome; aggressive intravenous hydration with rasburicase or allopurinol in high-risk patients", "Contrast-induced nephropathy; withhold fluids", "Acute interstitial nephritis; give corticosteroid"], "answer": 2, "explain": "**TLS เกิดใน 12-72 ชั่วโมงแรกหลังเริ่มเคมีบำบัดในมะเร็งที่ไวต่อยาและมีมวลก้อนมาก** (ALL, Burkitt, high-grade lymphoma); ป้องกันด้วย **สารน้ำปริมาณมาก + rasburicase (ความเสี่ยงสูง) หรือ allopurinol (ความเสี่ยงปานกลาง)** และเฝ้าระวังอิเล็กโทรไลต์ทุก 6-8 ชั่วโมง — **ไม่แนะนำให้ urine alkalinisation แล้ว** เพราะเร่งการตกตะกอนของแคลเซียมฟอสเฟต", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (Hemato ข้อ 5)", "ref": [], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.2.15"]}]}, {"id": "nephro-05-09", "title": "ภาวะฟอสเฟตต่ำ — แยกด้วย FE phosphate", "minutes": 9, "summary": "ไตรั่วหรือแค่ย้ายเข้าเซลล์ ตัดสินด้วยปัสสาวะใบเดียว", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "B9.1.2(3)", "2.1.22"], "md": "### สามกลไก (เรียงตามความสำคัญที่สไลด์วางไว้)\n1. **ฟอสเฟตเคลื่อนจากนอกเซลล์เข้าในเซลล์ (redistribution)**\n2. **ไตขับทิ้ง (renal phosphate wasting)**\n3. **ลำไส้ดูดซึมได้น้อย** — สไลด์ระบุว่า **ข้อนี้เพียงลำพังแทบไม่เคยทำให้ฟอสเฟตต่ำ** แต่ไปซ้ำเติมสาเหตุอื่น\n\n### การตรวจที่ตัดสิน — FE phosphate\n> **FE phosphate = 100 × (ฟอสเฟตในปัสสาวะ × ครีแอตินินในเลือด) ÷ (ฟอสเฟตในเลือด × ครีแอตินินในปัสสาวะ)**\n\n- ไตเก่งมากในการเก็บฟอสเฟตกลับ ดังนั้นเมื่อฟอสเฟตในเลือด **ต่ำ** ไตควรขับออกให้น้อยที่สุด\n- **ในภาวะฟอสเฟตต่ำ ถ้า FE phosphate > 20% = ไตรั่ว** · ถ้าต่ำกว่านั้น = **เคลื่อนเข้าเซลล์หรือเสียทางลำไส้**\n- เกณฑ์เทียบเท่าจากปัสสาวะ 24 ชั่วโมง: **ขับฟอสเฟต > 100 mg/วัน ทั้งที่ฟอสเฟตในเลือดต่ำ ถือว่าไม่เหมาะสมและยืนยันว่าไตรั่ว**\n\n### เมื่อพบว่าไตรั่ว ให้ดูแคลเซียมต่อทันที\n| ฟอสเฟตต่ำจากไตรั่ว + | กลไก | ตัวอย่าง |\n|---|---|---|\n| **แคลเซียมสูง** | **PTH เกิน** (ผลหลักของ PTH คือดันแคลเซียมขึ้น) | primary/tertiary hyperparathyroidism |\n| **แคลเซียมปกติ** | **FGF-23 เกิน** | **XLH, tumor-induced osteomalacia**, FGF-23 สูงหลังปลูกถ่ายไต |\n| **แคลเซียมปกติ + กรดในเลือด + น้ำตาลในปัสสาวะ + กรดอะมิโนรั่ว** | **Fanconi syndrome** (PCT เสียทั้งชุด) | tenofovir, ifosfamide, **myeloma**, Wilson disease |\n\n### สาเหตุที่ต้องนึกถึงเป็นรายภาวะ\n- **Refeeding syndrome** — เริ่มให้อาหารในคนที่อดมานาน → อินซูลินพุ่ง → **ฟอสเฟต โพแทสเซียม และแมกนีเซียมถูกดึงเข้าเซลล์พร้อมกัน** ป้องกันด้วยการ **เริ่มแคลอรีช้า ๆ ให้ไทอามีนก่อน และเจาะแร่ธาตุทุกวัน**\n- **การรักษา DKA** — อินซูลินดันฟอสเฟตเข้าเซลล์\n- **ภาวะเลือดเป็นด่างจากการหายใจ** — กระตุ้น phosphofructokinase เร่ง glycolysis → ดึงฟอสเฟตเข้าเซลล์ (เป็นสาเหตุของ redistribution ที่แรงที่สุด)\n- **หลังปลูกถ่ายไต — พบได้ถึง 85−90% ในระยะแรก** เพราะ GFR กลับมาทันทีขณะที่ **FGF-23 และ PTH ยังค้างสูงจากช่วงไตวาย** → ขับฟอสเฟตทิ้งมหาศาล · **FGF-23 ใช้เวลาเป็นสัปดาห์จึงกลับปกติ ส่วน PTH อาจค้างสูงเป็นปี**\n- **CRRT หรือฟอกเลือดเข้มข้น** — ถูกกรองทิ้งไปกับเครื่อง แก้ด้วยการเติมฟอสเฟตกลับ\n- **สุราเรื้อรัง** — หลายกลไกรวมกัน (กินน้อย ท้องเสีย Mg ต่ำ ไตรั่ว refeeding)\n\n### Tumor-induced osteomalacia (TIO)\nกลุ่มอาการพารานีโอพลาสติกที่พบน้อยมาก เกิดจาก **เนื้องอกหลั่ง FGF-23 นอกตำแหน่ง** มาด้วย **ฟอสเฟตต่ำ ปวดกระดูก กระดูกหัก และกล้ามเนื้ออ่อนแรง**\nส่วนใหญ่เป็น **เนื้องอก mesenchymal ชนิดไม่ร้ายที่ก้อนเล็กมากจนหายาก** — ต้องใช้ **CT, MRI, ภาพถ่ายเชิงหน้าที่ (Ga-68 DOTATATE PET, octreotide scan) และการเจาะเลือดตามหลอดเลือดดำใหญ่หาจุดที่ FGF-23 \"step up\"**\n**ตัดก้อนออกได้ = หายขาดและอาการหายเร็วมาก** ถ้าหาไม่เจอหรือตัดไม่ได้ ใช้ **burosumab (แอนติบอดีต่อ FGF-23)** ซึ่งได้ผลดีแต่ราคาสูงมาก\n\n### อาการ\n- **เล็กน้อย → มักไม่มีอาการ**\n- **รุนแรง → ATP ในเซลล์พร่อง** จึงออกอาการที่กล้ามเนื้อเป็นหลัก\n  - **กล้ามเนื้ออ่อนแรงทั่วตัวและกล้ามเนื้อต้นแขนต้นขา (proximal myopathy)**\n  - **กล้ามเนื้อหายใจอ่อนแรงจนเกิดภาวะหายใจล้มเหลว** — และเป็นสาเหตุที่ **ถอดเครื่องช่วยหายใจไม่สำเร็จ**\n  - **กล้ามเนื้อหัวใจอ่อนแรงจนหัวใจล้มเหลว**\n  - **กล้ามเนื้อสลาย · เม็ดเลือดแดงแตก · กลืนลำบาก · ลำไส้ไม่เคลื่อนไหว**\n  - **ชา เพ้อสับสน ชักทั้งตัว โคม่า**\n- **เรื้อรัง → กระดูกและฟันเสียแร่ธาตุ** กลายเป็น **rickets ถ้าเกิดก่อน growth plate ปิด และ osteomalacia ถ้าเกิดหลังจากนั้น**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้สูตร **FE phosphate** และเกณฑ์ **> 20% = renal phosphate wasting** พร้อมเกณฑ์ปัสสาวะ 24 ชั่วโมง **> 100 mg/วัน** ไว้คู่กัน\n- สไลด์แยกประโยคชี้ขาดไว้ว่า **ฟอสเฟตต่ำจากไตรั่ว \"ในภาวะที่ไม่มีแคลเซียมสูง\" ให้สงสัย FGF-23 เกินเป็นหลัก**\n- สไลด์ให้ตัวเลข **85−90% ของผู้ป่วยหลังปลูกถ่ายไตในระยะแรกมีฟอสเฟตต่ำ** และอธิบายว่ามาจาก FGF-23 และ PTH ที่ยังค้างสูง\n", "pearls": ["ฟอสเฟตต่ำ + FE phosphate > 20% (หรือปัสสาวะ 24 ชม. > 100 mg/วัน) = ไตรั่ว", "ไตรั่ว + แคลเซียมสูง = PTH เกิน · ไตรั่ว + แคลเซียมปกติ = FGF-23 เกิน", "ฟอสเฟตต่ำรุนแรงทำให้ถอดเครื่องช่วยหายใจไม่สำเร็จ เพราะกล้ามเนื้อหายใจอ่อนแรงจาก ATP พร่อง", "Refeeding syndrome ดึงฟอสเฟต โพแทสเซียม และแมกนีเซียมเข้าเซลล์พร้อมกัน", "หลังปลูกถ่ายไต 85−90% มีฟอสเฟตต่ำ จาก FGF-23 และ PTH ที่ยังค้างสูงจากช่วงไตวาย"], "items": [{"id": "NEPHRO-05-09-Q1", "kind": "own", "stem": "A 46-year-old man is admitted after 3 weeks of almost no oral intake. On the second day of enteral feeding he develops generalised weakness and is unable to be weaned from the ventilator. Serum phosphate is 1.0 mg/dL (normal 2.7-4.5), potassium 2.9 mEq/L and magnesium 1.2 mg/dL. Spot urine studies give a fractional excretion of phosphate of 6%. Which of the following best explains his hypophosphataemia?", "choices": ["Renal phosphate wasting caused by a rise in fibroblast growth factor 23", "Proximal tubular injury producing a Fanconi syndrome", "Insulin-driven shift of phosphate from the extracellular fluid into cells after refeeding", "Renal phosphate wasting caused by secondary hyperparathyroidism", "Reduced intestinal phosphate absorption during the period of starvation"], "answer": 2, "explain": "**กลไก** — คนที่อดอาหารมานานมีปริมาณฟอสเฟตทั้งร่างกายพร่องอยู่แล้ว (แม้ระดับในเลือดจะยังปกติเพราะ ECF มีฟอสเฟตแค่ 1% ของทั้งร่างกาย) เมื่อเริ่มให้อาหาร **คาร์โบไฮเดรตกระตุ้นอินซูลินพุ่ง → ดึงกลูโคสพร้อมกับฟอสเฟต โพแทสเซียม และแมกนีเซียมเข้าเซลล์พร้อมกัน** เพื่อสร้าง ATP และสารมัธยันตร์ที่ถูกฟอสโฟรีเลต นี่คือ **refeeding syndrome** ซึ่งเข้ากับภาพ **สามตัวต่ำพร้อมกัน** ของคนไข้รายนี้พอดี\n\n**FE phosphate 6% คือกุญแจ** — ต่ำกว่าเกณฑ์ 20% มาก แปลว่า **ไตกำลังเก็บฟอสเฟตไว้อย่างเหมาะสม ปัญหาจึงไม่ได้อยู่ที่ไต** และฟอสเฟตที่หายไปถูกย้ายเข้าเซลล์\n\n**ทำไมตัวลวงจึงผิด**\n- *FGF-23 เกิน* และ *secondary hyperparathyroidism* — ทั้งคู่เป็นการ **รั่วทางไต** ซึ่งต้องมี **FE phosphate > 20%** ค่า 6% ตัดออกไปได้เลย\n- *ลำไส้ดูดซึมน้อยระหว่างอดอาหาร* — มีส่วนทำให้พร่องสะสม แต่สไลด์ระบุว่าการดูดซึมลดลงเพียงลำพัง **แทบไม่เคยทำให้ฟอสเฟตต่ำ** และไม่อธิบายว่าทำไมจึงตกฮวบ**หลังเริ่มให้อาหาร**\n- *Fanconi syndrome* — เป็นการรั่วทางไตเช่นกัน (FE สูง) และควรมีน้ำตาลในปัสสาวะทั้งที่น้ำตาลในเลือดปกติ กรดอะมิโนรั่ว และเลือดเป็นกรดร่วมด้วย\n\n**ประเด็นการรักษา** — เติมฟอสเฟต โพแทสเซียม และแมกนีเซียม ให้ไทอามีน และ **ลดอัตราการให้อาหารลง** แล้วค่อย ๆ เพิ่ม", "pearl": "ฟอสเฟตต่ำ + K ต่ำ + Mg ต่ำ หลังเริ่มให้อาหาร = refeeding syndrome · FE phosphate ต่ำยืนยันว่าไตไม่ได้รั่ว", "topic": "ภาวะฟอสเฟตต่ำ — แยกด้วย FE phosphate", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)"]}, {"id": "NEPHRO-05-09-Q2", "kind": "own", "stem": "A 39-year-old woman has had 2 years of progressive bone pain, proximal muscle weakness and two low-trauma fractures. Serum phosphate is 1.4 mg/dL (normal 2.7-4.5), calcium 9.4 mg/dL, intact PTH normal, 25-hydroxyvitamin D normal and the fractional excretion of phosphate is 35%. Which of the f
