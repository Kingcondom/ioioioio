— การแยกจึงเปลี่ยนการรักษาโดยสิ้นเชิง; ในไทย **TB คือสาเหตุอันดับหนึ่งของ constrictive pericarditis**", "topic": "Constrictive pericarditis vs restrictive cardiomyopathy", "src": "", "ref": ["MED30 สรุป Cardio – gtx constrictive pericarditis / pericardial knock", "MED30 สรุป Cardio – pericardial effusion (electrical alternans), pericardial friction rub", "MED31 MCQ ข้อ 75 – ฟังได้ murmur, ขาบวม, liver span 2 cm"], "nl": ["B7.2.2-3(3)", "2.3.9-3(6)", "3.3.23"]}, {"id": "CARDIO-04-10-Q1", "kind": "own", "stem": "A 58-year-old man has ascites, leg oedema and an elevated jugular venous pressure. Echocardiography shows normal ventricular size and an ejection fraction of 60%, with bi-atrial enlargement. Tissue Doppler shows a medial mitral annular e' of 12 cm/s and a lateral e' of 7 cm/s. Which of the following does this tissue Doppler pattern most support?", "choices": ["Severe tricuspid regurgitation without pericardial disease", "Constrictive pericarditis", "Restrictive cardiomyopathy from cardiac amyloidosis", "Decompensated cirrhosis with portal hypertension", "Cardiac tamponade"], "answer": 1, "explain": "**กลไก** — ปกติ **e′ ที่ผนังด้านข้าง (lateral) จะสูงกว่าที่ผนังกั้น (medial)** เพราะผนังด้านข้างเคลื่อนได้อิสระกว่า คนไข้รายนี้กลับด้าน คือ **medial 12 สูงกว่า lateral 7** ซึ่งคือ **annulus reversus** และ **medial e′ ที่สูงถึง 12 cm/s ทั้งที่มีภาวะหัวใจล้มเหลวชัดเจน** คือ **annulus paradoxus**\n\nทั้งสองอย่างเกิดจากกลไกเดียวกัน: ใน constriction **เนื้อกล้ามเนื้อหัวใจเองยังปกติ** แต่ถูก **กล่องเยื่อหุ้มที่แข็งตรึงการเคลื่อนไหวไว้ทางด้านข้าง** การเคลื่อนตัวตามแนวยาวจึงถูกผลักไปรวมที่ผนังกั้นแทน ทำให้ medial e′ สูงผิดปกติ ขณะที่ lateral e′ ถูกกดลง\n\n**ทำไมตัวลวงจึงผิด**\n- *Restrictive cardiomyopathy จากแอมีลอยด์* — เป็นโรคของ **เนื้อกล้ามเนื้อหัวใจเอง** ดังนั้น **e′ ต่ำทั้งสองตำแหน่ง** (มักต่ำกว่า 8 cm/s ทั้งคู่) และยังคงลำดับปกติคือ lateral สูงกว่า medial · ภาพ bi-atrial enlargement พบได้ทั้งสองโรคจึงแยกไม่ได้ด้วยข้อนี้\n- *Cardiac tamponade* — เป็นภาวะเฉียบพลันที่มี **ความดันต่ำ หัวใจเต้นเร็ว และมีน้ำในเยื่อหุ้มหัวใจ** ซึ่งโจทย์ไม่ได้บรรยาย และ tamponade ไม่ทำให้เกิด annulus reversus\n- *ลิ้นไตรคัสปิดรั่วรุนแรง* — ทำให้ JVP สูงและบวมได้ แต่ไม่อธิบายรูปแบบ TDI ที่กลับด้าน\n- *ตับแข็ง* — **ไม่ทำให้ JVP สูง** ซึ่งเป็นตัวแยกที่สำคัญที่สุดข้างเตียง และไม่เกี่ยวกับ TDI ของหัวใจ", "pearl": "Medial e′ สูงกว่า lateral e′ (annulus reversus) ในคนที่มี JVP สูงและ EF ปกติ = constrictive pericarditis", "topic": "แยก constriction จาก restriction และการรักษา", "src": "", "ref": [], "nl": ["B7.2.2-3(3)", "3.3.23"]}]}, {"id": "cardio-04-11", "title": "กล้ามเนื้อหัวใจอักเสบ — สาเหตุ อาการ และเกณฑ์วินิจฉัย", "minutes": 10, "summary": "ชายหนุ่ม ไข้หวัดนำมาก่อน แล้วเหนื่อย — และ CMR คือตัวตัดสิน", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(4)", "2.3.9-3(6)", "B7.2.5(2)", "2.1.34"], "md": "### สาเหตุ (สไลด์แบ่งไว้ 4 เสา)\n\n| เสา | ตัวอย่าง |\n|---|---|\n| **ไวรัส (พบบ่อยที่สุดในคนปกติ)** | **Cardiotropic — Coxsackie** · **Vasculotropic — parvovirus B19** · **Lymphotropic — CMV, EBV, HHV-6** · **Cardiotoxic — HCV, HIV, influenza, SARS-CoV-2** |\n| **สารพิษและยา** | **วัคซีน — COVID ชนิด mRNA, ฝีดาษ, ไข้หวัดใหญ่** · ASA, clozapine · **ยากลุ่ม immune checkpoint inhibitor (anti-CTLA-4, anti-PD-1)** · ยาขับปัสสาวะกลุ่ม loop · dobutamine |\n| **การติดเชื้ออื่น** | **คอตีบ** · Lyme · **ไข้รูมาติก** · rickettsia · mycoplasma · **วัณโรค** · **Chagas** · มาลาเรีย |\n| **โรคของระบบ** | **SLE** · **ภาวะอีโอซิโนฟิลสูง** · **sarcoidosis** · **amyloidosis** · ไทรอยด์เป็นพิษ · pheochromocytoma · โรคลำไส้อักเสบ · **Kawasaki** |\n\n> **คำตอบมาตรฐานของข้อสอบ — สาเหตุที่พบบ่อยที่สุดของกล้ามเนื้อหัวใจอักเสบในผู้ใหญ่ที่แข็งแรงดีมาก่อน คือ \"การติดเชื้อไวรัส\"**\n> กลไกมีสองระยะ: **ระยะแรกไวรัสทำลายเซลล์กล้ามเนื้อหัวใจโดยตรง** จากนั้น **ระยะที่สองเป็นการตอบสนองทางภูมิคุ้มกันของร่างกายเองที่ทำลายต่อ** — ระยะที่สองนี้เองที่อธิบายว่าทำไมบางรายจึงลุกลามเป็น inflammatory cardiomyopathy แม้ไวรัสจะหายไปแล้ว\n\n### อาการ\n| อาการ | ความถี่ |\n|---|---|\n| **เจ็บหน้าอกเฉียบพลัน (แบบ infarct-like)** | **> 80%** |\n| **เหนื่อย** | **20−50%** |\n| **อ่อนเพลีย ใจสั่น เป็นลม** | ~5% |\n\n**เบาะแสที่สไลด์ให้ไว้**\n- **อายุน้อยถึงกลางคน (20−50 ปี) และเป็นผู้ชาย** โดยเฉพาะกลุ่มที่เกิดจากไวรัสหรือวัคซีน\n- **มีการติดเชื้อร่วมด้วย หรือเพิ่งได้รับยาใหม่ หรือมีโรคประจำตัวที่เป็นปัจจัยเสี่ยง**\n- **ต้องตัดสาเหตุอื่นออกให้ได้ก่อน** — โรคหลอดเลือดหัวใจ โรคลิ้นหัวใจ และกล้ามเนื้อหัวใจผิดปกติชนิดอื่น\n- **อาการแย่ลงเรื่อย ๆ ทั้งที่รักษาหัวใจล้มเหลวมาตรฐานเต็มที่แล้ว**\n\n### การแบ่งความเสี่ยงทางคลินิก — ใช้ตัดสินว่าจะสืบค้นแค่ไหน\nสไลด์เรียงกลุ่มอาการจากเบาไปหนัก\n1. **เจ็บหน้าอก ไม่มีหัวใจล้มเหลว** — ความเสี่ยงต่ำ พบบ่อยที่สุด พยากรณ์โรคดี\n2. **หัวใจล้มเหลวเฉียบพลัน EF ลดลง**\n3. **AV block หรือ VT/VF**\n4. **ช็อกจากหัวใจ หรือหัวใจหยุดเต้น** — ความเสี่ยงสูงสุด\n\n### เกณฑ์วินิจฉัย\n> **Definite = อาการทางคลินิกเข้าได้ + พิสูจน์ได้ด้วย CMR หรือการตัดชิ้นเนื้อกล้ามเนื้อหัวใจ (EMB)**\n> **Possible = อาการทางคลินิกเข้าได้ แต่ CMR/EMB ไม่ชัดเจน หรือยังทำไม่ได้**\n\n**เกณฑ์เสริมนอกเหนือจากอาการ**\n| กลุ่ม | สิ่งที่พบ |\n|---|---|\n| **Clinical** | อาการไม่จำเพาะ |\n| **ECG** | **ST-T เปลี่ยนแปลง** |\n| **Biomarker** | **Troponin สูงขึ้น** |\n| **Imaging** | **strain ผิดปกติ · การเคลื่อนไหวของผนังผิดปกติ · EF ลดลง · บวมน้ำของกล้ามเนื้อหัวใจ และ/หรือ LGE จาก CMR** |\n\n### CMR — เกณฑ์ Lake Louise ฉบับปรับปรุง\nต้องมีทั้ง **สองแกน** จึงเรียกว่า CMR-proven\n| แกน | สิ่งที่วัด |\n|---|---|\n| **แกนบวมน้ำ (edema)** | **T2-weighted หรือ T2 mapping สูงขึ้น เป็นบริเวณหรือทั่วไป** |\n| **แกนบาดเจ็บ/พังผืด** | **native T1 สูงขึ้น หรือ ECV สูงขึ้น หรือ LGE ที่กระจายแบบ non-ischaemic** |\n\n> **CMR-proven = เข้าเกณฑ์หลัก 2 ใน 2 แกน · CMR-uncertain = เข้าเพียง 1 ใน 2**\n> **จุดที่ทำให้แยกจากกล้ามเนื้อหัวใจตายได้ — LGE ของ myocarditis กระจายแบบ \"ไม่ใช่การขาดเลือด\" คือเกาะที่ชั้นกลางผนังหรือใต้เยื่อหุ้มหัวใจ (subepicardial) มักที่ผนังด้านข้างล่าง** ส่วน LGE ของกล้ามเนื้อหัวใจตายจะเริ่มจาก **ใต้เยื่อบุหัวใจ (subendocardial) และตามแนวหลอดเลือด**\n\n**การตัดชิ้นเนื้อกล้ามเนื้อหัวใจ (EMB)** — เก็บไว้สำหรับ **รายที่เสี่ยงสูงถึงปานกลาง** เพราะเป็นทางเดียวที่แยก **giant cell, eosinophilic และ sarcoidosis** ออกจากกันได้ ซึ่งสามโรคนี้ **เปลี่ยนการรักษาไปเป็นการกดภูมิคุ้มกัน**\n\n### กับดัก\n- **\"ST ยกขึ้นพร้อม troponin สูงในชายหนุ่ม แต่หลอดเลือดหัวใจปกติ\"** — อย่าเพิ่งสรุปว่าเป็น myocarditis ทันที ต้องแยก **MINOCA, กลุ่มอาการทาโกะสึโบะ และหลอดเลือดหัวใจหดเกร็ง** ออกไปด้วย ซึ่ง **CMR เป็นตัวช่วยที่ดีที่สุด**\n- การวินิจฉัย myocarditis **ไม่ได้อาศัย troponin เพียงอย่างเดียว** — troponin ที่ปกติก็ไม่ตัดโรคออก โดยเฉพาะในระยะหลัง\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดง **spectrum of myocarditis presentations and outcomes** โดยขนาดรูปสัมพันธ์กับความถี่ — เพื่อย้ำว่า **กลุ่มที่พบบ่อยที่สุดคือเจ็บหน้าอกแล้วหายดี** ส่วนกลุ่มที่จบด้วย **dilated cardiomyopathy หรือเสียชีวิต เป็นส่วนน้อย**\n- สไลด์วางอัลกอริทึมไว้สามเส้นทางตามอาการนำ: **เจ็บหน้าอกเฉียบพลัน · หัวใจล้มเหลวเฉียบพลัน · หัวใจเต้นผิดจังหวะ** โดยทุกเส้นทางเริ่มเหมือนกันด้วย **ประวัติ สัญญาณชีพ ECG 12 lead การตรวจทางห้องปฏิบัติการ และเอคโค่** แล้วจึงแยกไปตามความเสี่ยง\n- ทุกอัลกอริทึมมีขั้น **\"ตัดโรคหลอดเลือดหัวใจออกก่อน\"** เป็นขั้นแรก ๆ เสมอ\n", "pearls": ["สาเหตุที่พบบ่อยที่สุดของ myocarditis ในผู้ใหญ่ที่แข็งแรงดีมาก่อนคือการติดเชื้อไวรัส", "กลไกสองระยะ — ไวรัสทำลายโดยตรง แล้วภูมิคุ้มกันของร่างกายทำลายต่อ", "Definite myocarditis ต้องมี CMR หรือ EMB ยืนยัน · possible คือมีอาการแต่ภาพยังไม่ชัด", "Lake Louise ฉบับปรับปรุง: ต้องเข้าทั้งแกนบวมน้ำ (T2) และแกนบาดเจ็บ (T1/ECV/LGE) จึงเป็น CMR-proven", "LGE ของ myocarditis อยู่ชั้นกลางผนังหรือใต้เยื่อหุ้มหัวใจ ต่างจาก MI ที่เริ่มใต้เยื่อบุหัวใจ", "EMB เก็บไว้สำหรับรายเสี่ยงสูง เพราะแยก giant cell, eosinophilic และ sarcoidosis ที่ต้องกดภูมิ"], "items": [{"id": "C-MCQ-04", "kind": "mcq", "stem": "A 22-year-old previously healthy man presents with 5 days of fever, myalgia and diarrhoea, followed by 2 days of progressive dyspnoea and orthopnoea. Vital signs: BT 38.0 C, PR 118/min, BP 96/64 mmHg. There is an S3 gallop and bibasilar crepitations. ECG shows sinus tachycardia with diffuse low-amplitude T wave inversion and no ST elevation. Troponin-I is 4.8 ng/mL (normal <0.04). Echocardiogram shows globally reduced LV systolic function (LVEF 32%) with no segmental pattern. Coronary angiography shows normal coronary arteries. Which of the following is the most likely aetiology of his condition?", "choices": ["Coronary atherosclerotic plaque rupture", "Systemic lupus erythematosus", "Chronic alcohol consumption", "Rheumatic carditis from group A streptococcus", "Viral infection"], "answer": 4, "explain": "กลไก: **viral myocarditis** (enterovirus/coxsackie B, adenovirus, parvovirus B19, HHV-6, SARS-CoV-2) เป็นสาเหตุที่พบบ่อยที่สุดทั่วโลก ไวรัสเข้า cardiomyocyte ผ่าน receptor (เช่น CAR สำหรับ coxsackie) → direct cytotoxicity ระยะแรก ตามด้วย **immune-mediated injury** (T cell + molecular mimicry ต่อ cardiac myosin) → myocyte necrosis กระจายทั่ว\n\nเบาะแสในโจทย์ที่ชี้ myocarditis:\n1. **prodrome ไข้/ท้องเสีย/ปวดเมื่อย** นำมาก่อน 1-2 สัปดาห์\n2. trop ขึ้นสูงแต่ **ECG ไม่มี ST elevation แบบ territorial**\n3. **global hypokinesis ไม่เป็นตาม coronary territory**\n4. **coronary ปกติ** (MINOCA-like picture)\n\nทำไมข้ออื่นผิด:\n- **Plaque rupture**: ถูกตัดด้วย normal coronary angiogram + global (ไม่ใช่ regional) dysfunction + อายุ 22 ไม่มี risk factor\n- **Rheumatic carditis**: ต้องมีหลักฐาน GAS pharyngitis + Jones criteria (migratory polyarthritis, new murmur เช่น MR/AR, erythema marginatum, subcutaneous nodules, chorea) และ **valvulitis เป็นแกน** ไม่ใช่ global myocyte necrosis เดี่ยวๆ; โจทย์ไม่มี murmur ไม่มีปวดข้อ\n- **SLE**: ทำให้เกิด pericarditis/myocarditis ได้ แต่ต้องมี multisystem features (malar rash, photosensitivity, arthritis, cytopenia, proteinuria) เพศหญิงวัยเจริญพันธุ์เป็นหลัก\n- **Alcoholic cardiomyopathy**: ต้องดื่มหนักต่อเนื่องหลายปี (>80-90 g/day >5 ปี), onset ค่อยเป็นค่อยไป, ไม่มี trop ขึ้นสูงและไม่มี viral prodrome", "pearl": "Gold standard วินิจฉัย = endomyocardial biopsy (Dallas criteria) แต่ practice ใช้ **cardiac MRI (Lake Louise criteria)** แทน; การรักษาคือ supportive HF therapy + **ห้ามออกกำลังกาย 3-6 เดือน** และ **ห้ามให้ NSAID ขนาดสูง** เมื่อ EF ตก", "topic": "Acute myocarditis – most common cause", "src": "", "ref": ["MED31 MCQ ข้อ 65 – common cause myocarditis → viral", "MED28 MED421 Medicine I ข้อ 4 – Which of the following is the most common cause of myocarditis?"], "nl": ["B7.2.2-3(4)", "2.3.9-3(6)"]}, {"id": "C-OLD-11", "kind": "old", "stem": "What is the most common cause of myocarditis in previously healthy adults?", "choices": ["Doxorubicin toxicity", "Bacterial sepsis", "Systemic lupus erythematosus", "Viral infection", "Rheumatic fever"], "answer": 3, "explain": "**ไวรัสเป็นสาเหตุอันดับหนึ่ง** (enterovirus/coxsackie B, adenovirus, parvovirus B19, HHV-6 และไวรัสทางเดินหายใจ) มักมีอาการนำคล้ายไข้หวัดแล้วตามด้วยเหนื่อย ใจสั่น เจ็บหน้าอก troponin ขึ้นโดยหลอดเลือดหัวใจปกติ; สาเหตุอื่นเช่นยา สารพิษ และโรคภูมิต้านตนเองพบน้อยกว่า", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 65 / MED28 MED421 Medicine I ข้อ 4", "ref": [], "nl": ["B7.2.2-3(4)", "2.3.9-3(6)"]}]}, {"id": "cardio-04-12", "title": "Myocarditis ชนิดจำเพาะ การรักษา และการติดตาม", "minutes": 12, "summary": "ห้าชนิดที่เปลี่ยนการรักษา และตัวเลขที่อาจารย์ให้มาครบ", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(4)", "2.3.9-3(6)", "B7.2.5(2)", "2.3.2"], "md": "### 1. Fulminant myocarditis\n- **เสื่อมลงอย่างรวดเร็วเป็นหัวใจล้มเหลวเฉียบพลันที่ไม่เคยเป็นมาก่อน แล้วเข้าสู่ช็อกจากหัวใจ**\n- **เลียนแบบภาวะช็อกจากการติดเชื้อได้ และอาจมาด้วยปวดใต้ชายโครงขวา** (จากตับคั่งเลือด) จึงถูกวินิจฉัยผิดบ่อย\n- **ECG: ไฟฟ้าต่ำ QRS กว้างขึ้น โดยเฉพาะที่กว้างขึ้นเร็ว**\n- **VT/VF/หัวใจหยุดเต้น มากกว่า 50%**\n- **เอคโค่: EF ต่ำมากโดยที่ขนาดห้องหัวใจยังปกติ อาจมีผนังหนาขึ้น (จากบวมน้ำ) และ RV ทำงานแย่**\n- **Troponin-T สูงมาก (แต่บางรายกลับต่ำ)**\n- **แม้รอดจากระยะเฉียบพลัน ก็ยังเสี่ยงสูงต่อการเสียชีวิตหรือต้องปลูกถ่ายหัวใจในภายหลัง**\n\n> **จุดที่ต้องจำ — ห้องหัวใจ \"ไม่โต\" แต่ EF ต่ำมาก คือภาพที่แยก fulminant myocarditis ออกจาก dilated cardiomyopathy เรื้อรัง** เพราะโรคเกิดเร็วเกินกว่าห้องหัวใจจะขยายตัวทัน\n\n### 2. Giant cell myocarditis\n- มาแบบ **fulminant หรือหัวใจล้มเหลวกึ่งเฉียบพลันที่ไม่ตอบสนองต่อการรักษามาตรฐาน**\n- **VT/VF/หัวใจหยุดเต้นตอนมาโรงพยาบาล 14−50%** และ **ระหว่างการดำเนินโรคเกิดซ้ำหรือดื้อยาถึง 80%**\n- **AV block ขั้นสูง 5−13%**\n- **1 ใน 5 มีโรคภูมิต้านตนเองร่วมด้วย**\n- **ค่ามัธยฐานของการรอดชีวิตเพียง 3 เดือนถ้าไม่รักษา · เพิ่มเป็น 12 เดือนเมื่อให้สเตียรอยด์ร่วมกับ cyclosporine หรือ azathioprine**\n- **กลับเป็นซ้ำ 26%** แม้หลังปลูกถ่ายหัวใจ\n\n### 3. Eosinophilic myocarditis\n- **อายุเฉลี่ย 41 ปี ชายเท่ากับหญิง · มีหอบหืดร่วม 20%**\n- **เลียนแบบ STEMI ราว 1 ใน 3**\n- **มีอีโอซิโนฟิลในเลือดสูง 65−75%** (แปลว่า **25−35% ไม่มี** — จึงตัดโรคออกด้วยเลือดอย่างเดียวไม่ได้)\n- **VT/VF 11−36% · AV block 10%**\n- **เสี่ยงต่อการเสียชีวิตหรือปลูกถ่ายหัวใจพอ ๆ กับ giant cell** โดย **กลุ่มที่เกิดจากการแพ้ยา (hypersensitivity) เสี่ยงสูงที่สุด**\n\n### 4. Immune checkpoint inhibitor (ICI) myocarditis\n- **กลไก: ที-เซลล์ที่ถูกปลดเบรกไปโจมตีเนื้อเยื่อปกติที่ไม่ใช่มะเร็ง**\n- **เกิดใน 1% ของผู้ได้รับ ICI · เพิ่มขึ้นเป็น OR 4.3 ถ้าใช้ ICI สองตัวร่วมกัน**\n- **ค่ามัธยฐานของช่วงเวลา 30 วัน มักภายใน 3 เดือนแรกหลังเริ่มยา คือหลังได้ยาเพียง 1−2 ครั้ง**\n- **มาได้หลายรูปแบบ · พบร่วมกับกล้ามเนื้ออักเสบและกลุ่มอาการคล้าย myasthenia ถึง 30%**\n- **อัตราตายสูงถึง 50% → ให้ methylprednisolone ขนาดพัลส์ทันทีที่มีอาการหรือมีการทำงานของ LV ผิดปกติ**\n- **การป้องกัน: ตรวจ ECG และ troponin-T ที่พื้นฐาน และก่อนรอบที่ 2, 3, 4 จากนั้นทุก 3 รอบ**\n\n### 5. Myocarditis หลังวัคซีน mRNA และจาก SARS-CoV-2\n| | **หลังวัคซีน mRNA** | **จากการติดเชื้อ SARS-CoV-2** |\n|---|---|---|\n| **ความถี่** | **1−5 ต่อแสนคน** · สูงกว่าเล็กน้อยกับ Moderna · **สูงสุดในชายวัยรุ่น 1 ต่อ 10,000** | **2−4 ต่อ 1,000 รายที่นอนโรงพยาบาลด้วยโควิด** |\n| **ใคร** | ชายวัยรุ่น | **ชาย 61% อายุมัธยฐาน 38 ปี** |\n| **เวลา** | **1−3 วันหลังเข็มที่สอง** | ระหว่างการติดเชื้อ |\n| **อาการ** | **เจ็บหน้าอก 90% · เหนื่อย 30% · EF ลดลงเพียง 12%** | **troponin 21 เท่าของค่าปกติสูงสุด (สูงได้ถึง 100 เท่า)** · **มีน้ำในเยื่อหุ้มหัวใจ 46%** |\n| **การรักษา** | **NSAID 87% · สเตียรอยด์ 12%** | **สเตียรอยด์ 55%** |\n| **ผลลัพธ์** | **ไม่มีรายใดต้องใช้เครื่องพยุงการไหลเวียน ปลูกถ่ายหัวใจ หรือเสียชีวิต** | **EF ฟื้นจาก 40% เป็น 55% เมื่อกลับบ้าน** · การเสียชีวิตสัมพันธ์กับปอดอักเสบ |\n\n> **ประเด็นที่ควรสื่อสารกับผู้ป่วยได้** — myocarditis หลังวัคซีน **พบน้อย อาการไม่รุนแรง และหายได้เกือบทุกราย** ในขณะที่ **myocarditis จากการติดเชื้อโควิดเองรุนแรงกว่าอย่างชัดเจน** สไลด์เสนอกลไกของกลุ่มวัคซีนว่าอาจเกิดจาก **การคงอยู่ของ spike protein แล้วกระตุ้นการตอบสนองทางภูมิคุ้มกันที่ผิดปกติ**\n\n### 6. โรคภูมิต้านตนเองและโรคอักเสบของระบบ\n- ทำให้เกิดทั้ง **หลอดเลือดแดงแข็งเร็วกว่าปกติ และการมีส่วนร่วมของหัวใจแบบอื่น** · **CMR ช่วยยืนยัน**\n- **อาจลุกลามเป็นแผลเป็นและกล้ามเนื้อหัวใจผิดปกติ** → **ต้องเพิ่มความเข้มของการกดภูมิคุ้มกัน**\n- **พิจารณา EMB เพื่อตัดสาเหตุอื่นออก** — **กล้ามเนื้อหัวใจผิดปกติจากคลอโรควิน · กล้ามเนื้อหัวใจอักเสบจากการติดเชื้อ · หลอดเลือดอักเสบ**\n\n### การรักษา myocarditis (สไลด์แบ่งไว้ 4 ขา)\n1. **การประคับประคองทั่วไป** — และ **จำกัดกิจกรรมทางกาย** เหมือน pericarditis\n2. **การรักษาที่ไม่เจาะจงสาเหตุ** — **การรักษาหัวใจล้มเหลวตามแนวทางมาตรฐาน**\n3. **การรักษาหัวใจเต้นผิดจังหวะ**\n4. **การรักษาที่เจาะจงสาเหตุ** — **กดภูมิคุ้มกันใน giant cell, eosinophilic, sarcoidosis และ ICI** · **ยาต้านไวรัสหรือยาปฏิชีวนะตามเชื้อ** · **หยุดยาที่เป็นต้นเหตุ**\n\n**การรักษาเชิงหัตถการและผ่าตัด**\n- **เครื่องพยุงการไหลเวียน (เช่น VA-ECMO, IABP, ventricular assist device) และการปลูกถ่ายหัวใจ** ในรายที่ช็อกจากหัวใจ\n- **การป้องกันการเสียชีวิตเฉียบพลัน** — พิจารณา **เสื้อกระตุกหัวใจแบบสวมใส่ (wearable cardioverter-defibrillator)** ในระยะเฉียบพลันที่การทำงานของหัวใจอาจฟื้นได้ **แทนการฝัง ICD ทันที** เพราะ EF มักฟื้นตัว จึงควรรอประเมินซ้ำก่อนตัดสินใจฝังถาวร\n- **ยาที่ทำให้กล้ามเนื้อหัวใจเสียหายแบบขึ้นกับขนาดสะสมคือ doxorubicin (กลุ่ม anthracycline)** ซึ่งเป็นคนละกลไกกับ myocarditis จากภูมิคุ้มกัน แต่เป็นตัวที่ต้องนึกถึงเสมอในผู้ป่วยมะเร็งที่หัวใจล้มเหลว\n\n### การติดตาม (สไลด์วางตารางไว้)\n> **ประเมินอาการและ ECG · ตัวชี้วัด (troponin I, CRP) · จังหวะการเต้น (เดินสายพานและ/หรือ Holter) · ภาพถ่ายหัวใจ**\n> **นัดที่ภายใน 1 เดือน → 3−6 เดือน → 12 เดือน → หลัง 1 ปีและระยะยาว**\n\n- กลุ่มที่ต้องติดตามยาวเป็นพิเศษคือ **remission with residuals** คือยังมี **LGE ค้างหรือ EF ยังไม่กลับเต็ม** เพราะเสี่ยงต่อ **dilated cardiomyopathy และหัวใจเต้นผิดจังหวะร้ายแรงในอนาคต**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้ตัวเลขรายโรคไว้ครบมาก — **giant cell รอดมัธยฐาน 3 เดือนถ้าไม่รักษา 12 เดือนถ้ารักษา และกลับเป็นซ้ำ 26%** · **eosinophilic มีอีโอซิโนฟิลในเลือดสูงเพียง 65−75%** · **ICI เสี่ยง 1% แต่ตาย 50%** — ตัวเลขเหล่านี้ออกสอบได้ตรง\n- สไลด์ของ ICI ให้ **ตารางเฝ้าระวังที่ชัดเจน** คือ **ECG และ TnT ที่พื้นฐาน ก่อนรอบ 2, 3, 4 แล้วทุก 3 รอบ** อ้างอิง **2022 ESC guidelines on cardio-oncology**\n- สไลด์ปิดท้ายด้วยแผนภาพ **ทีมสหสาขาของ IMPS** — อายุรแพทย์โรคหัวใจ ผู้เชี่ยวชาญภาพถ่ายหัวใจ พยาธิแพทย์ แพทย์สรีรวิทยาไฟฟ้าหัวใจ แพทย์หัตถการ ศัลยแพทย์หัวใจและทรวงอก แพทย์โรคติดเชื้อ แพทย์ภูมิคุ้มกัน/รูมาติสซั่ม แพทย์เวชบำบัดวิกฤต นักจิตวิทยา และแพทย์พันธุศาสตร์\n", "pearls": ["Fulminant myocarditis: EF ต่ำมากแต่ห้องหัวใจไม่โต ผนังอาจหนาจากบวมน้ำ VT/VF เกิน 50%", "Giant cell: ไม่ตอบสนองการรักษามาตรฐาน รอดมัธยฐาน 3 เดือนถ้าไม่รักษา กลับเป็นซ้ำ 26%", "Eosinophilic: อีโอซิโนฟิลในเลือดสูงเพียง 65−75% เลือดปกติไม่ตัดโรคออก", "ICI myocarditis: เกิด 1% มัธยฐาน 30 วันหลังเริ่มยา ตาย 50% — ให้ pulse methylprednisolone ทันที", "Myocarditis หลังวัคซีน mRNA สูงสุดในชายวัยรุ่น 1:10,000 เกิด 1−3 วันหลังเข็มสอง และไม่มีรายเสียชีวิต", "ระยะเฉียบพลันใช้เสื้อกระตุกหัวใจแบบสวมใส่แทนการฝัง ICD ทันที เพราะ EF มักฟื้นตัว"], "items": [{"id": "C-OLD-13", "kind": "old", "stem": "Which chemotherapeutic agent is most characteristically associated with dose-dependent cardiomyopathy?", "choices": ["Doxorubicin", "Cisplatin", "Bleomycin", "Methotrexate", "Vincristine"], "answer": 0, "explain": "**Anthracycline (doxorubicin) ทำให้เกิด dilated cardiomyopathy แบบสัมพันธ์กับขนาดสะสม** ผ่านการสร้างอนุมูลอิสระและทำลาย topoisomerase 2β ของกล้ามเนื้อหัวใจ ต้องติดตาม LVEF ก่อนและระหว่างให้ยา; **bleomycin เป็นพิษต่อปอด ไม่ใช่หัวใจ** (พังผืดในปอด) ส่วน cisplatin เป็นพิษต่อไตและหู", "pearl": "", "topic": "", "src": "MED34 FA MCQ ข้อ 10 / MED32 MCQ ข้อ 12, 64", "ref": [], "nl": ["B7.2.5(2)", "2.3.2", "2.3.9(5)"]}, {"id": "CARDIO-04-12-Q1", "kind": "own", "stem": "A 63-year-old man with metastatic melanoma received his second dose of combined nivolumab and ipilimumab 3 weeks ago. He now has fatigue, ptosis and proximal muscle weakness. ECG shows new first-degree atrioventricular block, troponin T is markedly elevated and echocardiography shows an ejection fraction of 42%. Which of the following is the most appropriate immediate management?", "choices": ["Continue the checkpoint inhibitors and start guideline-directed heart failure therapy alone", "Start high-dose aspirin plus colchicine", "Withhold the checkpoint inhibitors and observe with serial troponin measurement", "Withhold the checkpoint inhibitors and start pulse-dose methylprednisolone", "Proceed directly to permanent pacemaker implantation"], "answer": 3, "explain": "**กลไก** — ยากลุ่ม immune checkpoint inhibitor ปลดเบรกของที-เซลล์ ทำให้ **ที-เซลล์ที่ถูกกระตุ้นไปโจมตีเนื้อเยื่อที่ไม่ใช่มะเร็ง** รวมถึงกล้ามเนื้อหัวใจ สไลด์ระบุว่าเกิดใน **1% ของผู้ได้รับ ICI และเพิ่มเป็น OR 4.3 เมื่อใช้ ICI สองตัวร่วมกัน** ซึ่งตรงกับคนไข้รายนี้ที่ได้ทั้ง nivolumab และ ipilimumab · **ช่วงเวลามัธยฐาน 30 วัน คือหลังได้ยาเพียง 1−2 ครั้ง** ก็ตรงกัน\n\n**อาการที่ยืนยัน** — สไลด์ระบุว่าพบร่วมกับ **กล้ามเนื้ออักเสบและกลุ่มอาการคล้าย myasthenia ถึง 30%** ซึ่งอธิบาย **หนังตาตกและกล้ามเนื้อต้นแขนต้นขาอ่อนแรง** ของคนไข้รายนี้ · **AV block ที่เกิดใหม่เป็นสัญญาณอันตราย** เพราะการอักเสบลุกลามเข้าระบบนำไฟฟ้า และอาจดำเนินไปเป็นบล็อกสมบูรณ์อย่างรวดเร็ว\n\n**เหตุผลที่ต้องรีบ** — **อัตราตายสูงถึง 50%** สไลด์จึงระบุให้ **ให้ methylprednisolone ขนาดพัลส์เมื่อมีอาการหรือมีการทำงานของ LV ผิดปกติ** พร้อมกับ **หยุดยา ICI**\n\n**ทำไมตัวลวงจึงผิด**\n- *ให้ยา ICI ต่อ* — เป็นการเติมเชื้อให้ไฟ ต้องหยุดยาที่เป็นต้นเหตุเสมอ\n- *หยุดยาแล้วเฝ้าดู* — หยุดยาถูกแล้ว แต่ **การเฝ้าดูเฉย ๆ ในภาวะที่ตาย 50% และมี AV block ใหม่ ถือว่าช้าเกินไป** การอักเสบจะดำเนินต่อแม้หยุดยาแล้ว\n- *ASA + colchicine* — เป็นการรักษา **เยื่อหุ้มหัวใจอักเสบ** ไม่ได้กดการโจมตีของที-เซลล์ที่กล้ามเนื้อหัวใจ\n- *ฝังเครื่องกระตุ้นหัวใจถาวรทันที* — **AV block จากการอักเสบมักกลับคืนได้เมื่อกดการอักเสบสำเร็จ** การฝังถาวรทันทีจึงเร็วเกินไป ถ้าจำเป็นให้ใช้เครื่องกระตุ้นชั่วคราวระหว่างรักษา\n\n**การป้องกันที่สไลด์แนะนำ** — ตรวจ **ECG และ troponin-T ที่พื้นฐาน ก่อนรอบที่ 2, 3, 4 แล้วทุก 3 รอบ**", "pearl": "กล้ามเนื้ออ่อนแรง + หนังตาตก + troponin สูง + AV block ใหม่ ในคนที่ได้ ICI = หยุดยาและให้สเตียรอยด์ขนาดพัลส์ทันที", "topic": "Myocarditis ชนิดจำเพาะ การรักษา และการติดตาม", "src": "", "ref": [], "nl": ["B7.2.2-3(4)", "2.3.2"]}]}], "meq": [{"id": "C-MEQ-03", "part": "MEQ", "lec": "04", "lecture": "Pericarditis, Myocarditis (อ.เจตวรงค์) / Shock (อ.เจตวรงค์)", "topic": "Acute pericarditis progressing to cardiac tamponade", "vignette": "ผู้ป่วยชายไทยอายุ 34 ปี มาด้วยเจ็บหน้าอก 4 วันก่อนมาโรงพยาบาล และเหนื่อยมากขึ้น 6 ชั่วโมงก่อนมา\n- 10 วันก่อน มีไข้ต่ำ เจ็บคอ ปวดเมื่อยตัว\n- 4 วันก่อน เจ็บแหลมกลางหน้าอก เจ็บมากขึ้นเวลานอนราบและหายใจเข้าลึก ดีขึ้นเวลานั่งโน้มตัวไปข้างหน้า\n- 6 ชั่วโมงก่อน เหนื่อยมากขึ้น หน้ามืดเวลาลุกนั่ง\nPE: V/S BT 37.9 C, PR 128/min, RR 28/min, BP 82/64 mmHg (inspiratory fall of systolic BP 18 mmHg), SpO2 95% room air\nGA: alert แต่กระสับกระส่าย, ปลายมือปลายเท้าเย็น, capillary refill 4 วินาที\nHEENT: distended neck vein, JVP ไม่ยุบลงขณะหายใจเข้า\nHeart: distant heart sounds, คลำ apex beat ไม่ชัด, ไม่ได้ยิน friction rub แล้ว\nRS: clear both lungs; Abd: tender hepatomegaly; Ext: no pitting edema", "questions": [{"q": "1. จงตั้ง problem list และบอกภาวะที่นึกถึงมากที่สุด พร้อมเหตุผล", "a": "**Problem list**\n1. Pleuritic chest pain relieved by leaning forward 4 days, preceded by viral prodrome\n2. Hypotension with hypoperfusion (BP 82/64, ปลายมือเท้าเย็น, capillary refill 4 วินาที, กระสับกระส่าย) = **shock**\n3. Elevated jugular venous pressure with absent inspiratory collapse\n4. Pulsus paradoxus 18 mmHg\n5. Distant heart sounds / impalpable apex beat\n6. Sinus tachycardia 128/min\n7. Clear lungs\n\n**ภาวะที่นึกถึงมากที่สุด: Acute (viral/idiopathic) pericarditis with pericardial effusion complicated by cardiac tamponade → obstructive shock**\n\n**เหตุผล**: มี **Beck triad ครบ** (hypotension + distended neck vein + muffled heart sound) ร่วมกับ **pulsus paradoxus** และ **ปอด clear** ซึ่งแยก obstructive shock จาก cardiogenic shock (ที่ต้องมี pulmonary congestion); การที่ **friction rub หายไป** เป็นเบาะแสว่ามีน้ำมาคั่นระหว่างสองชั้นของ pericardium มากขึ้น"}, {"q": "2. จง differential diagnosis ของภาวะ shock ในผู้ป่วยรายนี้ 3 ภาวะ พร้อมจุดแยก", "a": "1. **Cardiac tamponade (obstructive shock)** — JVP สูง + ปอด clear + pulsus paradoxus + muffled heart sound; echo จะเห็น effusion ร่วมกับ RA/RV diastolic collapse และ respirophasic variation ของ mitral/tricuspid inflow\n2. **Fulminant myocarditis with cardiogenic shock** — ก็มี viral prodrome และ trop ขึ้นเช่นกัน แต่จะมี **S3, crepitation, pulmonary edema** และ echo พบ **global hypokinesis EF ต่ำ** โดยไม่มี effusion มาก\n3. **Massive pulmonary embolism (obstructive shock)** — JVP สูง ปอด clear เหมือนกัน แต่มักมี **hypoxemia ชัดเจน, pleuritic pain, DVT signs**; ECG เห็น S1Q3T3, RV strain, echo เห็น **RV dilatation กับ septal flattening** แต่ไม่มี pericardial effusion\n4. **Septic shock (distributive)** — มีไข้เหมือนกัน แต่ปลายมือเท้า **อุ่น**, pulse pressure กว้าง, SVR ต่ำ และไม่มี pulsus paradoxus\n5. **Tension pneumothorax** — JVP สูง + hypotension แต่ต้องมี **unilateral absent breath sound + hyperresonance + trachea shift** (โจทย์บอกปอดใสเท่ากัน)"}, {"q": "3. จะส่งตรวจอะไรเพื่อยืนยันการวินิจฉัย และคาดว่าจะพบอะไร", "a": "1. **Bedside echocardiography — การตรวจสำคัญที่สุดและต้องทำทันที** คาดว่าพบ: pericardial effusion ปริมาณมากรอบหัวใจ, **right atrial systolic collapse และ right ventricular diastolic collapse**, **respirophasic variation ของ transvalvular flow >25-40%**, IVC plethora (โตและไม่ยุบตามหายใจ), swinging heart\n2. **ECG 12 leads** — คาดว่าพบ sinus tachycardia, **electrical alternans** (QRS amplitude สลับไปมา), low voltage, PR depression และ concave ST elevation กระจาย (ร่องรอยของ pericarditis)\n3. **Chest radiograph** — **water-bottle/globular cardiac silhouette** โดยที่ **lung field ใส** (ไม่มี pulmonary congestion) — สำคัญในการแยกจาก LV failure\n4. **Troponin, CBC, CRP/ESR, electrolytes, BUN/Cr, coagulogram** — ประเมิน myocardial involvement และเตรียมหัตถการ\n5. **หาสาเหตุของ effusion**: hemoculture, HIV serology, **TB workup (sputum AFB/molecular test, IGRA)** — สำคัญมากในไทย, ANA, thyroid function test, malignancy workup ตามบริบท\n6. **การวิเคราะห์น้ำในเยื่อหุ้มหัวใจที่เจาะได้**: cell count and differential, protein, LDH, glucose, **ADA และ TB molecular test**, Gram stain, AFB, bacterial/mycobacterial/fungal culture, **cytology**"}, {"q": "4. จงให้การรักษาอย่างเร่งด่วน พร้อมระบุสิ่งที่ \"ห้ามทำ\" และเหตุผลเชิงกลไก", "a": "**ต้องทำ**\n1. **Echo-guided pericardiocentesis อย่างเร่งด่วน** — เป็นการรักษาที่แท้จริง (definitive): การระบายน้ำออกลด intrapericardial pressure ทันที → ventricular filling กลับมา → cardiac output และ BP ดีขึ้น; ถ้าน้ำกลับมาซ้ำหรือเป็น loculated/purulent/malignant พิจารณา **surgical pericardial window**\n2. **IV isotonic fluid เป็นมาตรการชั่วคราว (bridge)** — เพิ่ม venous pressure ให้ชนะ intrapericardial pressure เพื่อคง filling ไว้ระหว่างรอหัตถการ (ได้ประโยชน์ชัดเจนเมื่อผู้ป่วยมี hypovolemia ร่วม)\n3. **O2, monitor ECG/BP ต่อเนื่อง, เปิด IV line ใหญ่, เตรียมทีมและอุปกรณ์**\n4. ถ้าจำเป็นใช้ **vasopressor/inotrope (norepinephrine ± dobutamine)** พยุงระหว่างรอ\n5. หลังระบายน้ำแล้ว: รักษา pericarditis ด้วย **NSAID ขนาดสูง + colchicine**, รักษาสาเหตุจำเพาะ (เช่น anti-TB drug ถ้าเป็น TB pericarditis ซึ่งต้องพิจารณา adjunctive corticosteroid)\n\n**ห้ามทำ และเหตุผลเชิงกลไก**\n- **ห้ามให้ยาที่ลด preload: nitrate, diuretic, morphine ขนาดสูง** — tamponade เป็นภาวะที่ **preload-dependent อย่างยิ่ง**; การลด venous return จะทำให้ filling ยิ่งตก → cardiac output ล่มและเกิด cardiac arrest\n- **หลีกเลี่ยงการ intubate และใส่ positive pressure ventilation/PEEP โดยไม่จำเป็น** — positive intrathoracic pressure ลด venous return → อาจเกิด **cardiac arrest ทันทีขณะ induction** (\"peri-intubation arrest\") ถ้าจำเป็นต้องทำ ควรระบายน้ำก่อนหรือเตรียมพร้อมอย่างยิ่ง\n- **ห้ามให้ beta-blocker หรือยาที่ลด HR** — tachycardia เป็นกลไกชดเชยเดียวที่เหลือเพื่อรักษา cardiac output (เพราะ stroke volume ถูกจำกัด)\n- **ไม่ควรเสียเวลารอ CT scan หรือรอผลแลปก่อนระบายน้ำ** ในผู้ป่วยที่ช็อกอยู่"}, {"q": "5. หลังเจาะระบายน้ำได้ 600 mL ผู้ป่วยดีขึ้น BP 118/76 mmHg ผลน้ำพบ lymphocyte predominate, protein สูง, ADA 68 U/L, AFB negative, cytology negative จงให้การวินิจฉัยและวางแผนการรักษาต่อ", "a": "**การวินิจฉัย: Tuberculous pericarditis with cardiac tamponade**\n\nเหตุผล: น้ำในเยื่อหุ้มหัวใจเป็น **exudate ที่ lymphocyte เด่น ร่วมกับ ADA สูง (>40 U/L)** ในประเทศที่ TB ยังชุก สนับสนุน TB pericarditis อย่างมาก (AFB smear ความไวต่ำจึงไม่ตัดโรค); cytology ลบช่วยลดโอกาส malignant effusion\n\n**แผนการรักษาต่อ**\n1. **ยาต้านวัณโรคสูตรมาตรฐาน 2HRZE/4HR** (6 เดือน) — ปรับตามผล culture/drug susceptibility\n2. **Corticosteroid เสริม (adjunctive prednisolone)** — พิจารณาในรายที่มีการอักเสบมากเพื่อ **ลดการเกิด constrictive pericarditis** ซึ่งเป็น complication ระยะยาวที่สำคัญ; **ต้องระวังและโดยทั่วไปหลีกเลี่ยงในผู้ติดเชื้อ HIV** เพราะเพิ่มความเสี่ยงมะเร็งที่สัมพันธ์กับ HIV\n3. **ส่งตรวจ HIV** ในผู้ป่วยทุกรายที่เป็น TB\n4. **ติดตาม echocardiography ซ้ำเป็นระยะ** เพื่อเฝ้าระวัง (ก) การกลับมาของ effusion (ข) การเกิด **constrictive pericarditis** (JVP สูง + Kussmaul sign + pericardial knock + ascites เด่นกว่าขาบวม) ซึ่งถ้าเกิดขึ้นต้องพิจารณา **pericardiectomy**\n5. **ติดตามผลข้างเคียงยา**: LFT (INH/RIF/PZA hepatitis), visual acuity และ color vision (ethambutol optic neuropathy), uric acid/ข้ออักเสบ (pyrazinamide), peripheral neuropathy (INH → ให้ pyridoxine ป้องกัน)\n6. **การควบคุมโรคติดต่อ**: สอบสวนโรคและคัดกรองผู้สัมผัสใกล้ชิด, ประเมินว่ามี pulmonary TB ร่วมหรือไม่ (ถ่ายภาพรังสีปอดและส่งเสมหะ), ให้คำแนะนำเรื่อง DOT และความสำคัญของการกินยาครบ"}], "ref": ["MED31 past paper – A 28 year-old female with acute pericarditis develops jugular venous obstruction and hypotension. The ECG shows electrical alternans", "MED34 FA MCQ ข้อ 4 และข้อ 10 – EKG Electrical alternans → Cardiac tamponade / Cardiac tamponade เป็น shock แบบไหน → Obstructive shock", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 7 – Beck triad (muffled heart sound, hypotension, distended neck vein) → Obstructive shock", "MED31 MCQ ข้อ 28 และ 36 – ให้ EKG cardiac tamponade ถามว่าทำอะไรต่อ → pericardiocentesis", "MED32 OSCE – Dx: pericardial effusion, Mx: pericardiocentesis / อ่าน CXR คนไข้เหนื่อย (CXR ของ cardiac tamponade)", "MED31 OSCE ข้อ 3 – อ่าน CXR pericardial effusion + treatment"], "nl": ["B7.2.2-3(3)", "2.2.2", "B7.2.3(1)"], "_kind": "meq", "_set": "cardio"}], "osce": [], "date": "อ. 15 ก.ย."}, {"lec": "10", "title": "Circulatory Shock", "subtitle": "พยาธิสรีรวิทยาและสมการการส่งออกซิเจน · จำแนกชนิด · ระยะของช็อก · การประเมิน · การรักษาเบื้องต้น", "objectives": ["อธิบายช็อกจากสมการ **DO₂ = CO × CaO₂** และบอกได้ว่าช็อกแต่ละชนิดเกิดจากตัวแปรใดในสมการที่เสียไป", "จำแนกช็อกทั้งห้ากลุ่มด้วยโปรไฟล์ **CVP · PCWP · CO · SVR** และแยกได้ข้างเตียงด้วย **อุณหภูมิปลายมือเท้าและ JVP**", "แยก **compensated shock** ออกจาก decompensated ได้ และรู้ว่าทำไมความดันปกติจึงไม่ตัดช็อกออก", "ใช้ **หน้าต่างสามบาน (สมอง ไต ผิวหนัง)** ประเมินว่าอวัยวะเริ่มเสียหรือยัง", "อ่าน **ECG สี่รูปแบบ** ที่บ่งชี้สาเหตุของช็อก และรู้ว่า **POCUS** ตอบอะไรได้บ้าง", "วางแผนการให้สารน้ำโดยใช้แนวคิด **Starling curve และ passive leg raise** และรู้ว่าเมื่อไรการเติมน้ำเป็นโทษ", "เลือก **norepinephrine หรือ dobutamine** ให้ตรงกับกลไกที่เสีย และตั้งเป้าหมาย **MAP และลักเตท** ได้", "ระบุช็อกที่ต้องทำ **หัตถการช่วยชีวิตทันที** โดยเฉพาะ **anaphylaxis** และ **หัวใจเต้นผิดจังหวะที่เป็นต้นเหตุ**"], "sections": [{"id": "cardio-10-01", "title": "ช็อกคืออะไร — ไล่จากสมการการส่งออกซิเจน", "minutes": 8, "summary": "สมการเดียวที่อธิบายช็อกได้ทุกชนิด และบอกด้วยว่าจะแก้ตรงไหน", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.2.5(4)", "B7.1.2(2)"], "md": "### นิยามที่ใช้ได้จริง\n**ช็อกคือภาวะที่การส่งออกซิเจนไปยังเนื้อเยื่อไม่พอกับความต้องการของเซลล์** จนเกิดการเผาผลาญแบบไม่ใช้ออกซิเจนและอวัยวะเริ่มทำงานผิดปกติ\n\n> **ช็อกไม่เท่ากับความดันต่ำ** — คนไข้อาจช็อกโดยที่ความดันยังปกติ (**compensated shock**) และคนความดันต่ำเรื้อรังบางคนก็ไม่ได้ช็อก สิ่งที่นิยามช็อกคือ **หลักฐานว่าเนื้อเยื่อขาดออกซิเจน** ไม่ใช่ตัวเลขความดัน\n\n### สมการที่เป็นแกนของทั้งคาบ\n> **DO₂ = CO × CaO₂**\n\nแตกออกมาได้เป็น\n- **CO (cardiac output) = HR × SV**\n- **SV ∝ (Preload × Contractility) ÷ SVR**\n- **CaO₂ = (Hb × 1.39 × SaO₂) + (PaO₂ × 0.03)**\n\n**อ่านสมการนี้ให้เป็น แล้วจะรู้ว่าช็อกเกิดได้ตรงไหนบ้าง**\n\n| ตัวแปรที่เสีย | เกิดเป็นช็อกชนิด | ตัวอย่าง |\n|---|---|---|\n| **Preload ต่ำ** | **Hypovolemic** | เสียเลือด ท้องเสีย อาเจียน |\n| **Contractility เสีย** | **Cardiogenic** | กล้ามเนื้อหัวใจตาย กล้ามเนื้อหัวใจอักเสบ ลิ้นหัวใจพิการระยะท้าย |\n| **HR ผิดปกติมาก** | **Cardiogenic** | หัวใจเต้นเร็วหรือช้าผิดจังหวะ |\n| **มีสิ่งขัดขวางเชิงกล** | **Obstructive** | ลิ่มเลือดอุดกั้นปอด · **cardiac tamponade** · tension pneumothorax · constrictive pericarditis · **aortic dissection** |\n| **SVR ต่ำมาก** | **Distributive** | **ติดเชื้อรุนแรง · แพ้รุนแรง** |\n| **CaO₂ ต่ำ** | ซ้ำเติมทุกชนิด | ซีดมาก · ออกซิเจนในเลือดต่ำ · พิษคาร์บอนมอนอกไซด์ |\n\n### สองกลไกที่สไลด์แยกไว้ในกลุ่ม peripheral\n- **แรงต้านหลอดเลือดส่วนปลายลดลง (decreased SVR)**\n- **ความสามารถในการดึงออกซิเจนไปใช้เปลี่ยนไป (altered oxygen extraction)**\n\n> **ข้อที่สองสำคัญมากในภาวะติดเชื้อรุนแรง** — คนไข้บางรายมี **CO สูงและ DO₂ พอ แต่เซลล์ดึงออกซิเจนไปใช้ไม่ได้** เพราะไมโทคอนเดรียเสียหายและการไหลเวียนระดับจุลภาคผิดปกติ นี่คือเหตุผลที่ **ลักเตทยังสูงทั้งที่ความดันกลับมาปกติแล้ว** และเป็นเหตุผลที่การไล่ตัวเลข DO₂ ให้สูงเกินความจำเป็นไม่ได้ช่วยให้รอดมากขึ้น\n\n### กับดักแรกของหัวข้อนี้\n- **ความดันปกติไม่ตัดช็อกออก** — ต้องมองหา **ลักเตทที่สูง ปัสสาวะออกน้อย ซึมสับสน ปลายมือเท้าเย็น**\n- **หัวใจเต้นเร็วมักมาก่อนความดันตก** เป็นกลไกชดเชยแรก ๆ · ในคนที่กิน **beta-blocker** อยู่ หรือผู้สูงอายุ **อาจไม่มีหัวใจเต้นเร็วให้เห็น** ทำให้ประเมินต่ำกว่าความจริง\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์วางโครงทั้งคาบไว้ห้าหัวข้อ: **Pathophysiological Mechanism → Classification → Stage → Evaluation → Initial Treatment** และอ้างอิง **Harrison's Principles of Internal Medicine ฉบับที่ 21 (2022)** ตลอดทั้งคาบ\n- สไลด์เริ่มจาก **สมการ DO₂ ก่อนพูดถึงชนิดของช็อก** — เป็นวิธีวางเนื้อหาที่ทำให้ชนิดของช็อกไม่ใช่การท่องจำ แต่เป็นผลของการที่ตัวแปรใดตัวแปรหนึ่งในสมการเสียไป\n- สไลด์แยกกลุ่มสาเหตุออกเป็น **peripheral · hypovolemia · cardiogenic factor · obstruction · distributive factor** อ้างอิง **N Engl J Med 2013;369:1726-34**\n", "pearls": ["DO₂ = CO × CaO₂ · CO = HR × SV · SV ∝ (preload × contractility) ÷ SVR — ช็อกคือการที่ตัวใดตัวหนึ่งพัง", "ช็อกไม่เท่ากับความดันต่ำ — นิยามคือเนื้อเยื่อขาดออกซิเจน ความดันอาจยังปกติได้", "ในภาวะติดเชื้อ ลักเตทที่ยังสูงทั้งที่ความดันปกติ อธิบายด้วย altered oxygen extraction", "หัวใจเต้นเร็วมาก่อนความดันตก — แต่คนที่กิน beta-blocker อาจไม่มีให้เห็น"], "items": [{"id": "CARDIO-10-01-Q1", "kind": "own", "stem": "A 24-year-old woman with severe iron-deficiency anaemia has a haemoglobin of 4.2 g/dL. Her blood pressure is 112/70 mmHg, heart rate 118/min, and she has a wide pulse pressure with warm extremities. Serum lactate is 3.8 mmol/L. Which component of oxygen delivery is primarily responsible for her tissue hypoxia?", "choices": ["Preload, because intravascular volume is depleted", "Cardiac output, because stroke volume has fallen", "Systemic vascular resistance, because it is pathologically low", "Arterial oxygen content, because haemoglobin is the dominant term in CaO2", "Arterial oxygen saturation, because SaO2 has fallen below 90%"], "answer": 3, "explain": "**กลไก** — จากสมการ **CaO₂ = (Hb × 1.39 × SaO₂) + (PaO₂ × 0.03)** จะเห็นว่า **ฮีโมโกลบินเป็นตัวหลักของปริมาณออกซิเจนในเลือด** ส่วนออกซิเจนที่ละลายในพลาสมา (PaO₂ × 0.03) มีสัดส่วนน้อยมากจนแทบไม่มีความหมาย\n\nลองคิดเป็นตัวเลข: **Hb 4.2 กับ SaO₂ 100% ให้ CaO₂ ราว 5.8 mL/dL** เทียบกับคนปกติ **Hb 14 ที่ได้ราว 19.5 mL/dL** คือ **เหลือไม่ถึงหนึ่งในสาม** ร่างกายจึงชดเชยด้วยการ **เพิ่ม CO (หัวใจเต้นเร็ว ชีพจรแรง ความดันช่วงกว้าง ปลายมือเท้าอุ่น)** แต่เมื่อชดเชยไม่พอ ลักเตทจึงขึ้น\n\n**ทำไมตัวลวงจึงผิด**\n- *Cardiac output / preload* — คนไข้รายนี้ **CO สูงขึ้น ไม่ได้ต่ำ** (ชีพจรเร็ว ความดันช่วงกว้าง ปลายมืออุ่น) และไม่มีหลักฐานว่าปริมาตรในหลอดเลือดพร่อง\n- *SVR ต่ำผิดปกติ* — SVR ที่ลดลงเป็นการตอบสนองตามหลังความหนืดเลือดที่ลดลงและการชดเชยของ CO ที่สูง ไม่ใช่ต้นเหตุ และไม่มีไข้หรือแหล่งติดเชื้อที่จะทำให้คิดถึง distributive shock\n- *SaO₂ ต่ำกว่า 90%* — โจทย์ไม่ได้ระบุว่าพร่องออกซิเจน และในภาวะซีด **SaO₂ มักปกติ** เพราะปัญหาอยู่ที่ *จำนวนตัวพา* ไม่ใช่ *ความอิ่มตัวของตัวพา*\n\n**ประเด็นการรักษา** — การให้ออกซิเจนช่วยได้น้อยมากเพราะเพิ่มได้แค่เทอมที่เล็กที่สุด สิ่งที่แก้ตรงจุดคือ **การให้เลือด**", "pearl": "ฮีโมโกลบินคือตัวหลักของ CaO₂ — ซีดรุนแรงทำให้เนื้อเยื่อขาดออกซิเจนได้แม้ SaO₂ 100% และให้ออกซิเจนก็ไม่ช่วย", "topic": "ช็อกคืออะไร — ไล่จากสมการการส่งออกซิเจน", "src": "", "ref": [], "nl": ["B7.1.2(2)", "2.2.7"]}]}, {"id": "cardio-10-02", "title": "จำแนกชนิดของช็อกด้วยโปรไฟล์ไหลเวียน", "minutes": 10, "summary": "ตารางสี่ช่อง CVP · PCWP · CO · SVR ที่ตอบได้เกือบทุกข้อของคาบนี้", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.2.5(4)", "B7.1.2(2)", "B7.2.3(1)"], "md": "### สไลด์แบ่งไว้ 6 กลุ่ม\n**Distributive · Cardiogenic · Hypovolemic · Obstructive · Mixed · Undifferentiated**\n\nสองกลุ่มหลังไม่ใช่กลไกใหม่ แต่เป็นสภาพจริงที่เจอข้างเตียง\n- **Mixed shock** — มีมากกว่าหนึ่งกลไกพร้อมกัน เช่น **ติดเชื้อรุนแรงในคนที่มีกล้ามเนื้อหัวใจเสียอยู่เดิม**\n- **Undifferentiated shock** — ยังไม่รู้ว่าชนิดไหน ซึ่งเป็นสภาพตอนคนไข้เพิ่งมาถึงห้องฉุกเฉิน **และต้องเริ่มรักษาไปพร้อมกับสืบค้น**\n\n### ตารางที่ต้องจำให้แม่น\n\n| ชนิด | **CVP** | **PCWP** | **CO** | **SVR** | มือเท้า |\n|---|---|---|---|---|---|\n| **Hypovolemic** | **↓** | **↓** | **↓** | **↑** | **เย็น** |\n| **Cardiogenic** | **↑** | **↑** | **↓** | **↑** | **เย็น** |\n| **Obstructive** | **↑** | **↓ หรือ ↑** | **↓** | **↑** | **เย็น** |\n| **Distributive** | **↓** | **↓** | **↑ หรือปกติ** | **↓↓↓** | **อุ่น** |\n\n> **ทางลัดข้างเตียงที่ใช้ได้จริง — ไล่สองคำถามนี้ตามลำดับ**\n> **1. ปลายมือเท้าอุ่นหรือเย็น** → **อุ่น = distributive (CO สูง)** · **เย็น = อีกสามชนิด (CO ต่ำ)**\n> **2. ถ้าเย็น ให้ดู JVP** → **JVP ต่ำ/แฟบ = hypovolemic** · **JVP สูง = cardiogenic หรือ obstructive**\n\n### แยก cardiogenic ออกจาก obstructive\nทั้งคู่ **JVP สูง CO ต่ำ SVR สูง** เหมือนกัน ต้องใช้เบาะแสอื่น\n\n| | **Cardiogenic** | **Obstructive** |\n|---|---|---|\n| **ปอด** | **มีเสียงกรอบแกรบ น้ำท่วมปอด** | **มักปอดโล่ง** (ยกเว้น tension pneumothorax ที่เสียงหายไปข้างเดียว) |\n| **PCWP** | **สูง** | **ต่ำใน PE และ tension pneumothorax · สูงเท่ากันทุกห้องใน tamponade** |\n| **เอคโค่** | **การบีบตัวเสีย ห้องหัวใจโต** | **น้ำรอบหัวใจ · RV โตกดผนังกั้น · หัวใจไฮเปอร์ไดนามิกแต่ตัวเล็ก** |\n| **เบาะแสอื่น** | **ECG แบบกล้ามเนื้อหัวใจตาย · หัวใจเต้นผิดจังหวะ** | **เสียงหัวใจเบา pulsus paradoxus (tamponade) · S1Q3T3 (PE) · หลอดลมเบนและเสียงหายข้างเดียว (tension pneumothorax)** |\n\n### กับดักที่ทำให้แยกผิด\n- **ภาวะติดเชื้อรุนแรงในระยะแรกที่ยังขาดน้ำอยู่ อาจมือเท้าเย็นและ JVP แฟบ** เหมือน hypovolemic — จะเห็นภาพ **CO สูง SVR ต่ำ** ก็ต่อเมื่อเติมน้ำพอแล้ว จึงเรียก **\"cold septic shock\"**\n- **คนไข้หัวใจล้มเหลวที่ได้ยาขับปัสสาวะมานาน อาจ JVP ไม่สูง** ทั้งที่เป็น cardiogenic\n- **Tamponade ในคนที่เสียเลือดมาก อาจ JVP ไม่สูง** (low-pressure tamponade)\n- **อย่ารอความดันตกจึงจะเรียกช็อก** — คนอายุน้อยชดเชยได้ดีมาก ความดันจะตกก็ต่อเมื่อเสียไปมากแล้ว\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ไล่ตารางทีละชนิดโดยเน้น **CO = SV × HR** เป็นแกนกลาง แล้วใส่ลูกศรของ **CVP, PCWP, SVR** ล้อมรอบ — ให้ท่องเป็นภาพว่าแต่ละชนิดลูกศรชี้ทางไหน\n- สไลด์ระบุ **distributive shock ว่ามี \"↓↓↓ SVR\" (ลูกศรสามตัว)** เพื่อย้ำว่าเป็นการลดลงอย่างมาก และมี **\"+/- third space loss\"** กำกับไว้ คือมีการรั่วของสารน้ำออกนอกหลอดเลือดร่วมด้วย จึงต้องเติมน้ำมากกว่าที่คิด\n- สไลด์ใส่ **obstructive shock** ไว้ครบทั้ง **PE · tamponade · tension pneumothorax · constrictive pericarditis · aortic dissection** ซึ่งเชื่อมกับคาบ 04 โดยตรง\n", "pearls": ["อุ่น = distributive · เย็น = อีกสามชนิด แล้วค่อยแยกด้วย JVP", "JVP แฟบ + เย็น = hypovolemic · JVP สูง + เย็น = cardiogenic หรือ obstructive", "Cardiogenic มีน้ำท่วมปอดและ PCWP สูง · obstructive ปอดมักโล่ง", "Cold septic shock — ติดเชื้อระยะแรกที่ยังขาดน้ำ อาจมือเย็นและ JVP แฟบ หลอกให้คิดว่า hypovolemic", "Mixed และ undifferentiated ไม่ใช่กลไกใหม่ แต่คือสภาพจริงตอนคนไข้มาถึง"], "items": [{"id": "C-MCQ-06", "kind": "mcq", "stem": "A 46-year-old woman is brought to the emergency department with dyspnoea and near-syncope. Vital signs: PR 130/min, BP 76/58 mmHg, RR 30/min. Heart sounds are muffled, neck veins are engorged and there is a 16 mmHg inspiratory fall in systolic blood pressure. Bedside echocardiography shows a large circumferential pericardial effusion with right atrial and right ventricular diastolic collapse. Which haemodynamic profile best matches her type of shock?", "choices": ["High central venous pressure, high cardiac output, low systemic vascular resistance", "Normal central venous pressure, normal cardiac output, low systemic vascular resistance", "Low central venous pressure, high cardiac output, low systemic vascular resistance", "High central venous pressure, low cardiac output, high systemic vascular resistance", "Low central venous pressure, low cardiac output, high systemic vascular resistance"], "answer": 3, "explain": "กลไก: tamponade = **obstructive shock** — มีสิ่งกีดขวางทาง mechanical ขัดการ fill ของ ventricle ทั้งที่หัวใจบีบตัวได้ดี\n\nไล่ตามสรีรวิทยา:\n- เลือดกลับเข้าหัวใจไม่ได้ → คั่งต้นน้ำ → **CVP/JVP สูง**\n- preload ต่ำจริงที่ระดับ ventricle → stroke volume ต่ำ → **cardiac output ต่ำ**\n- ร่างกายชดเชยด้วย sympathetic activation → vasoconstriction → **SVR สูง** (มือเท้าเย็น, narrow pulse pressure, capillary refill ช้า)\n\nดังนั้น **CVP สูง + CO ต่ำ + SVR สูง**\n\nทำไมข้ออื่นผิด (ใช้เป็นตารางจำ):\n- **CVP ต่ำ + CO ต่ำ + SVR สูง** = **hypovolemic shock** (เสียเลือด/น้ำ) — JVP แฟบ, ตอบสนองต่อ fluid challenge\n- **CVP ต่ำ + CO สูง + SVR ต่ำ** = **distributive shock ระยะแรก** (septic/anaphylactic/neurogenic) — มือเท้าอุ่น, wide pulse pressure\n- **CVP สูง + CO สูง + SVR ต่ำ** = ภาวะ high-output เช่น septic shock ที่ได้ volume เยอะแล้ว, thyrotoxicosis, AV fistula, cirrhosis — ไม่เข้ากับ tamponade\n- **ทุกอย่างปกติยกเว้น SVR ต่ำ** = ไม่ใช่ shock pattern ที่เข้ากับ hypotension รุนแรงแบบนี้\n\nข้อควรระวังทางคลินิก: ใน tamponade **ห้ามให้ยาลด preload (nitrate, diuretic) และห้าม intubate/PEEP โดยไม่จำเป็น** เพราะจะทำให้ venous return ตกยิ่งขึ้น — ให้ IV fluid ชั่วคราวเพื่อ bridge แล้วรีบ **pericardiocentesis** ซึ่งเป็นการรักษาที่แท้จริง", "pearl": "Obstructive shock มี 4 ตัวหลักที่ต้องนึกถึง: cardiac tamponade, massive PE, tension pneumothorax, severe dynamic hyperinflation (auto-PEEP) — ทุกตัวมี **JVP สูง + ปอดไม่มี congestion** (ยกเว้น tension PTX ที่ breath sound หาย)", "topic": "Classification of shock – obstructive", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 7 – Beck triad แล้วเกิด shock ต่อ shock นั้นเป็นประเภทอะไร → Obstructive shock", "MED34 FA MCQ ข้อ 10 – Cardiac tamponade เป็น shock แบบไหน → Obstructive shock", "MED30 สรุป Cardio – cardiogenic / obstructive / hypovolemic / distributive shock", "MED31 MCQ ข้อ 18 – EKG pericarditis + BP ต่ำ → Cardiac shock"], "nl": ["B7.2.5(4)", "2.2.7"]}, {"id": "C-OLD-18", "kind": "old", "stem": "Cardiac tamponade causes which category of shock?", "choices": ["Neurogenic shock", "Hypovolaemic shock", "Cardiogenic shock", "Obstructive shock", "Distributive shock"], "answer": 3, "explain": "**Obstructive shock** = มีสิ่งขวางการไหลเวียนนอกกล้ามเนื้อหัวใจ (tamponade, tension pneumothorax, massive PE) กล้ามเนื้อหัวใจยังบีบตัวดีแต่เติมเลือดไม่ได้ จึงมี **JVP สูงร่วมกับปลายมือเย็น**; ต่างจาก cardiogenic ที่ตัวปั๊มเสียเอง", "pearl": "", "topic": "", "src": "MED34 FA MCQ ข้อ 10 / MED35 สอบลงกองครั้งที่ 1 ข้อ 7", "ref": [], "nl": ["B7.2.5(4)", "2.2.7", "B7.2.3(1)"]}, {"id": "C-OLD-19", "kind": "old", "stem": "A patient admitted with pneumonia develops fever 39 C, BP 80/45 mmHg, warm extremities and bounding pulses 2 days after starting antibiotics. What type of shock is most likely?", "choices": ["Cardiogenic shock", "Obstructive shock", "Hypovolaemic shock", "Septic (distributive) shock", "Anaphylactic shock"], "answer": 3, "explain": "**ไข้สูง + ปลายมือ 'อุ่น' + pulse pressure กว้าง 2 วันหลังเริ่มยา = septic shock** จากการติดเชื้อที่ยังคุมไม่ได้ (vasodilatation + capillary leak); **anaphylaxis จะเกิดภายในนาทีถึงชั่วโมงหลังได้ยาและมีผื่น/หลอดลมตีบ** ไม่ใช่ 2 วันให้หลัง — เป็นตัวลวงของโพยข้อนี้", "pearl": "", "topic": "", "src": "MED34 FA MCQ", "ref": [], "nl": ["2.2.7", "B7.2.5(4)", "2.3.1"]}, {"id": "C-OLD-20", "kind": "old", "stem": "A patient with cardiomegaly presents with shock, heart rate 130/min and an irregularly irregular pulse, with crepitations at both lung bases and cold extremities. What type of shock is this?", "choices": ["Obstructive shock", "Hypovolaemic shock", "Distributive shock", "Neurogenic shock", "Cardiogenic shock"], "answer": 4, "explain": "**หัวใจโต + AF เร็ว + ปอดมีน้ำ + ปลายมือเย็น = cardiogenic shock** จาก tachyarrhythmia ที่ทำให้เวลาเติมเลือดสั้นลงในหัวใจที่ทำงานไม่ดีอยู่แล้ว; การรักษาคือคุมอัตราเต้น/ช็อกไฟฟ้าเมื่อไม่คงที่ ไม่ใช่การให้สารน้ำปริมาณมาก", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 4 MCQ ข้อ 19", "ref": [], "nl": ["B7.2.5(4)", "2.2.7", "2.3.9(1)"]}, {"id": "C-OLD-23", "kind": "old", "stem": "Anaphylactic shock belongs to which category of shock?", "choices": ["Distributive shock", "Obstructive shock", "Neurogenic shock", "Hypovolaemic shock", "Cardiogenic shock"], "answer": 0, "explain": "**Anaphylaxis เป็น distributive shock** — mediator จาก mast cell ทำให้หลอดเลือดขยายและรั่ว ปริมาตรในหลอดเลือดจึงไม่พอทั้งที่ปริมาตรรวมในร่างกายยังปกติ (กลุ่มเดียวกับ septic และ neurogenic shock)", "pearl": "", "topic": "", "src": "MED30 SAQ ข้อ 11", "ref": [], "nl": ["2.2.7", "B7.2.5(4)"]}, {"id": "C-OLD-32", "kind": "old", "stem": "Which haemodynamic pattern fits distributive (septic) shock before fluid resuscitation?", "choices": ["Low cardiac output with pulmonary oedema", "High systemic vascular resistance with low cardiac output", "Low systemic vascular resistance with high or normal cardiac output", "High central venous pressure with pulsus paradoxus", "Bradycardia with warm dry skin from loss of sympathetic tone"], "answer": 2, "explain": "**Septic shock = SVR ต่ำ, cardiac output ปกติหรือสูง (warm shock)** ต่างจาก cardiogenic/hypovolaemic ที่ SVR สูงเพื่อชดเชยและ output ต่ำ; จำคู่กับการรักษา — ให้สารน้ำ ยาปฏิชีวนะเร็วภายใน 1 ชั่วโมง และ **noradrenaline เป็น vasopressor ตัวแรก**", "pearl": "", "topic": "", "src": "MED30 สรุป Cardio (หน้า 272-274)", "ref": [], "nl": ["2.2.7", "B7.2.5(4)", "B7.4(6)"]}]}, {"id": "cardio-10-03", "title": "ระยะของช็อก — ทำไมต้องจับให้ได้ตั้งแต่ยังไม่ความดันตก", "minutes": 7, "summary": "สามระยะ และหน้าต่างที่ยังแก้กลับได้", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.2.5(4)", "B9.2.5(2)"], "md": "### สามระยะตามสไลด์\n\n**1. Compensated shock (preshock)**\n- ร่างกายตอบสนองหลายอย่างเพื่อ **ต้านการกระทบครั้งแรกและพยายามรักษาการไหลเวียนและการส่งออกซิเจนให้พอ**\n- **ยังไม่มีสัญญาณของอวัยวะทำงานผิดปกติที่ชัดเจน**\n- **ตรวจทางห้องปฏิบัติการจึงจะเห็น** — อวัยวะทำงานผิดปกติเล็กน้อย หรือ **ลักเตทสูงขึ้นเล็กน้อย**\n- ตัวอย่างที่สไลด์ให้ไว้\n  - **ติดเชื้อ** → **หัวใจเต้นเร็วและ CO เพิ่มขึ้นเป็นการชดเชย**\n  - **เสียเลือด** → **SVR และ HR เพิ่มขึ้นเป็นการชดเชย**\n\n**2. Shock (decompensated shock)**\n- **กลไกชดเชยของร่างกายเอาไม่อยู่แล้ว**\n- **มีหลักฐานว่าอวัยวะทำงานผิดปกติ**\n\n**3. Irreversible shock**\n- **ถ้าไม่ได้รับการรักษา จะเข้าสู่ระยะที่แก้กลับไม่ได้ และเสียชีวิตจากอวัยวะล้มเหลวหลายระบบ (MSOF)**\n\n### ทำไมระยะแรกจึงสำคัญที่สุด\n> **หน้าต่างที่การรักษาได้ผลดีที่สุดคือระยะ compensated ซึ่งเป็นระยะที่ความดันยังปกติ** ถ้ารอให้ความดันตกจึงเริ่มรักษา แปลว่าปล่อยให้คนไข้เดินผ่านหน้าต่างนั้นไปแล้ว\n\n**สิ่งที่บอกว่าเป็น compensated shock ทั้งที่ความดันยังปกติ**\n- **หัวใจเต้นเร็วโดยไม่มีคำอธิบายอื่น**\n- **ความดันช่วง (pulse pressure) แคบลง** — เป็นสัญญาณแรก ๆ ของ SV ที่ลดลงใน hypovolemic และ cardiogenic\n- **ปัสสาวะออกน้อยลง (< 0.5 mL/kg/ชม.)**\n- **ลักเตทสูงขึ้น** แม้เพียงเล็กน้อย\n- **ปลายมือเท้าเย็น ลายเป็นร่างแห (mottling) เวลาเติมเลือดฝอยกลับช้า**\n- **ซึมลงหรือสับสน**\n\n> **ในคนอายุน้อยและหญิงตั้งครรภ์ กลไกชดเชยดีมาก** — อาจเสียเลือดไปถึง 30−40% โดยความดันยังปกติ แล้วตกฮวบทีเดียว · ตรงกันข้าม **ผู้สูงอายุและคนที่กิน beta-blocker จะไม่มีหัวใจเต้นเร็วให้เห็น** ทั้งสองกลุ่มจึงถูกประเมินต่ำกว่าความจริงได้ง่าย\n\n### ลักเตท — ตัวชี้วัดที่ใช้ได้ทั้งวินิจฉัยและติดตาม\n- สูงขึ้นเพราะ **เซลล์เปลี่ยนไปเผาผลาญแบบไม่ใช้ออกซิเจน** (และในภาวะติดเชื้อยังมีกลไกอื่นร่วม เช่นการเร่ง glycolysis จากฤทธิ์ beta-adrenergic และการกำจัดลักเตทที่ตับลดลง)\n- **ใช้ติดตามการตอบสนองได้** — สไลด์ระบุเป้าหมายว่า **ลดลงอย่างน้อย 20% ใน 2 ชั่วโมง สัมพันธ์กับอัตราตายในโรงพยาบาลที่ลดลง**\n- **ลักเตทที่ไม่ลดลงหลังรักษา เป็นสัญญาณเตือนที่หนักแน่นกว่าความดันที่ดูดีขึ้น**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ใช้คำว่า **\"preshock\"** คู่กับ compensated shock และย้ำว่าระยะนี้ **\"no overt signs of organ dysfunction\"** ต้องอาศัย **การตรวจทางห้องปฏิบัติการ** จึงจะจับได้\n- สไลด์ยกตัวอย่างการชดเชยที่ต่างกันระหว่าง **ติดเชื้อ (เพิ่ม HR และ CO)** กับ **เสียเลือด (เพิ่ม SVR และ HR)** — สองตัวอย่างนี้สะท้อนตารางโปรไฟล์ไหลเวียนในหัวข้อที่แล้วพอดี\n", "pearls": ["Compensated shock = ความดันยังปกติ แต่ลักเตทขึ้นและปัสสาวะเริ่มน้อย — นี่คือหน้าต่างที่รักษาได้ผลที่สุด", "Pulse pressure ที่แคบลงมาก่อนความดันซิสโตลิกตก", "เป้าหมายคือลักเตทลดลงอย่างน้อย 20% ใน 2 ชั่วโมง", "คนอายุน้อยชดเชยได้จนเสียเลือด 30−40% แล้วตกฮวบ · ผู้สูงอายุและคนกิน beta-blocker ไม่มีหัวใจเต้นเร็วให้เห็น"], "items": [{"id": "C-OLD-31", "kind": "old", "stem": "A patient in prolonged shock is found to have AST 1,800 U/L and ALT 1,600 U/L with normal alkaline phosphatase, which fall rapidly over 3 days after blood pressure is restored. What is the most likely diagnosis?", "choices": ["Acute viral hepatitis", "Paracetamol toxicity", "Biliary obstruction", "Ischaemic hepatitis (shock liver)", "Alcoholic hepatitis"], "answer": 3, "explain": "**Ischaemic hepatitis**: ตับขาดเลือดช่วง shock ทำให้ transaminase พุ่งขึ้นหลักพันภายใน 1-3 วันแล้ว **ลดลงเร็วเมื่อการไหลเวียนกลับมาปกติ** ต่างจากไวรัสตับอักเสบที่ค่อย ๆ ขึ้นลง และ alcoholic hepatitis ที่ AST:ALT ~2:1 แต่ค่าไม่สูงถึงหลักพัน", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 52 / MED33 MCQ", "ref": [], "nl": ["2.2.7", "2.3.11", "B7.1.2(2)"]}]}, {"id": "cardio-10-04", "title": "ประเมินข้างเตียง — หน้าต่างสามบานและ JVP", "minutes": 9, "summary": "สมอง ไต ผิวหนัง คือสามหน้าต่างที่มองเห็นการไหลเวียนได้โดยไม่ต้องใช้เครื่องมือ", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.2.5(4)", "2.1.5"], "md": "### หลักการรักษาช็อกที่สไลด์วางไว้ก่อนอย่างอื่น\n> 1. **จับช็อกให้ได้เร็ว (recognize shock early)**\n> 2. **ประเมินว่าเป็นช็อกชนิดไหน**\n> 3. **เริ่มการรักษาไปพร้อมกับการสืบค้นหาสาเหตุ** — ไม่ใช่รอให้รู้สาเหตุก่อนแล้วค่อยรักษา\n> 4. **ใช้ทีมสหสาขา**\n> 5. **เป้าหมายของการรักษาคือคืนการส่งออกซิเจนให้เนื้อเยื่อ**\n\n**ข้อ 3 คือหัวใจของเวชปฏิบัติจริง** — คนไข้ undifferentiated shock ต้องได้สารน้ำ ออกซิเจน และเลือดเจาะส่งตรวจ **ขณะที่ยังไม่รู้ว่าช็อกชนิดไหน**\n\n### ประวัติ\n- **ต้องกระชับและมีเป้าหมาย**\n- แยกให้ออกว่าอาการนั้น **เป็นอาการของโรคที่ทำให้ช็อก หรือเป็นผลจากการที่เนื้อเยื่อได้ออกซิเจนไม่พอ**\n- **สองอาการสำคัญที่สไลด์ทำเครื่องหมายว่าเป็น key**\n  - **ระดับความรู้สึกตัวเปลี่ยนไป**\n  - **ปัสสาวะออกน้อยลง (oliguria)**\n\n### การตรวจร่างกาย\n**เกณฑ์ความดันที่สไลด์ให้ไว้**\n> **ความดันซิสโตลิก < 90 mmHg หรือ MAP < 65 mmHg**\n> **หัวใจเต้นเร็วเป็นกลไกชดเชยที่พบบ่อยที่สุด**\n\n**หน้าต่างสามบานที่ใช้ดูว่าอวัยวะเริ่มเสียหรือยัง**\n\n| หน้าต่าง | สิ่งที่พบ |\n|---|---|\n| **ระบบประสาทส่วนกลาง** | **สับสน ซึม สมองทำงานผิดปกติ (encephalopathy)** |\n| **ไต** | **ปัสสาวะออกน้อยกว่า 0.5 mL/kg/ชม.** |\n| **ผิวหนัง** | **เย็นชื้น → ลายเป็นร่างแห (mottling) → เวลาเติมเลือดฝอยกลับนานขึ้น** |\n\n**แยกชนิดด้วยการคลำและดูสองอย่าง**\n\n| | **CO ต่ำ** (cardiogenic, obstructive, hypovolemic) | **CO สูง** (distributive) |\n|---|---|---|\n| ปลายมือเท้า | **เย็น** | **อุ่น** |\n| เวลาเติมเลือดฝอย | **ช้า** | **ปกติ (< 2 วินาที)** |\n| ชีพจร | **เบา ความดันช่วงแคบ** | **แรง ความดันช่วงกว้าง (ตัวล่างต่ำ)** |\n\n**แล้วใช้ JVP แยกต่อ**\n\n| JVP | ความหมาย | ชนิด |\n|---|---|---|\n| **< 8 ซม. (ต่ำ/แฟบ)** | **ปริมาตรในหลอดเลือดพร่อง** | **Hypovolemic** |\n| **สูง (± บวมรอบนอก)** | **ความดันเติมเลือดสูง** | **Cardiogenic และ Obstructive** |\n\n> **JVP คือสัญญาณเดียวที่ให้ข้อมูลมากที่สุดข้างเตียงในคนไข้ช็อกที่ไม่รู้ประวัติ** เพราะแยก \"ขาดน้ำ\" ออกจาก \"หัวใจหรือมีสิ่งขัดขวาง\" ได้ทันที ซึ่งเปลี่ยนการรักษาคนละทาง — **กลุ่มแรกต้องเติมน้ำเร็ว ส่วนกลุ่มหลังการเติมน้ำมากอาจทำให้แย่ลง**\n\n### กับดักของการตรวจร่างกาย\n- **ปลายมือเท้าอุ่นไม่ได้แปลว่าไม่ช็อก** — distributive shock อุ่นเสมอ\n- **Mottling ที่หัวเข่าเป็นสัญญาณพยากรณ์โรคที่ไม่ดี** และมักมาก่อนความดันตกในภาวะติดเชื้อ\n- **คนไข้ที่หนาวสั่นหรืออยู่ห้องเย็น ปลายมือเท้าจะเย็นโดยไม่ได้ช็อก** ต้องดูร่วมกับสัญญาณอื่น\n- **เป็นลมจากปฏิกิริยา vasovagal** ให้ภาพความดันต่ำร่วมกับ **หัวใจเต้นช้า** ซึ่งต่างจากช็อกจริงที่มักเต้นเร็ว และมักหายเองเมื่อนอนราบยกขาสูง\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ใช้คำว่า **\"Windows\" which we can identify organ dysfunction** สำหรับสมอง ไต และผิวหนัง — เป็นกรอบที่จำง่ายและใช้ได้จริงตอนราวด์\n- สไลด์แยกภาพการตรวจร่างกายเป็นสองหน้า หน้าแรกแยก **CO ต่ำกับ CO สูง** ด้วยอุณหภูมิปลายมือเท้า เวลาเติมเลือดฝอย และความดันช่วง หน้าที่สองแยก **ปริมาตรในหลอดเลือด** ด้วย **JVP < 8 ซม.** กับ **JVP สูงและบวมรอบนอก**\n", "pearls": ["เริ่มรักษาไปพร้อมกับสืบค้นสาเหตุ อย่ารอให้รู้ชนิดก่อน", "หน้าต่างสามบาน — สมอง (สับสน) ไต (ปัสสาวะ < 0.5 mL/kg/ชม.) ผิวหนัง (เย็นชื้น mottling)", "JVP < 8 ซม. = hypovolemic · JVP สูง = cardiogenic หรือ obstructive", "ความดันช่วงกว้างกับปลายมืออุ่น = CO สูง = distributive", "เป็นลม vasovagal ให้ความดันต่ำร่วมกับหัวใจเต้นช้า ไม่ใช่เต้นเร็วแบบช็อกจริง"], "items": [{"id": "C-MCQ-10", "kind": "mcq", "stem": "A 55-year-old man is hypotensive in the emergency department with BP 78/50 mmHg, PR 126/min and cool extremities. No history is available. Which single bedside finding is most useful to distinguish hypovolaemic shock from cardiogenic shock in this patient?", "choices": ["Heart rate", "Skin temperature of the extremities", "Presence of metabolic acidosis on blood gas", "Jugular venous pressure", "Urine output over the past hour"], "answer": 3, "explain": "กลไก: shock ทั้ง hypovolemic และ cardiogenic มี **CO ต่ำ + SVR สูง** เหมือนกัน → ปลายน้ำเหมือนกันหมด (มือเท้าเย็น, tachycardia, oliguria, lactate/metabolic acidosis) **แยกกันไม่ได้ด้วยอาการปลายน้ำ**\n\nจุดที่ต่างกันคือ **preload ที่ต้นน้ำ**:\n- **Hypovolemic**: เสีย intravascular volume → venous return ต่ำ → **JVP แฟบ / IVC collapse** → ตอบสนองดีต่อ fluid\n- **Cardiogenic**: ปั๊มเสีย ปริมาตรยังอยู่ แต่ดันไปข้างหน้าไม่ได้ → คั่งย้อนขึ้น → **JVP สูง + อาจมี S3, crepitation, hepatomegaly**\n\nการดู JVP (หรือ IVC ด้วย POCUS) จึงเปลี่ยนการรักษาแบบพลิกขั้ว: **JVP แฟบ → ให้น้ำ**, **JVP สูง → ห้ามให้น้ำ ต้องให้ inotrope/ลด afterload/decongest**\n\nทำไมข้ออื่นผิด:\n- **Skin temperature**: แยก **distributive (อุ่น) ออกจาก low-output shock (เย็น)** ได้ แต่ hypovolemic กับ cardiogenic **เย็นทั้งคู่**\n- **Heart rate**: tachycardia เป็น compensatory response ทั่วไปในทุกชนิด (และอาจหายไปในผู้ป่วยที่กิน β-blocker หรือสูงอายุ)\n- **Urine output**: ทั้งสองกลุ่มมี renal hypoperfusion → oliguria เหมือนกัน\n- **Metabolic acidosis**: lactate ขึ้นจาก tissue hypoperfusion ใน shock ทุกชนิด ไม่จำเพาะ", "pearl": "สอบ OSCE มักให้ \"flatted neck vein + แห้งจัด\" → ตอบ **ให้ IV isotonic fluid**; ถ้า \"JVP สูง + crepitation\" → ห้ามให้น้ำ. ที่ bedside ใช้ **POCUS 3 จุด** ช่วย: IVC (volume), heart (EF/effusion/RV), lung (B-line) แยกได้ทั้ง 4 ชนิดในไม่กี่นาที", "topic": "Bedside differentiation of shock – jugular venous pressure", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 43 – คนไข้ flatted neck vein ดูแห้งมาก ทำไงดี → ให้น้ำ", "MED32 MCQ ข้อ 84 – JVP flat → 0.9% NSS load", "MED34 OSCE+SAQ – ตรวจ dehydration: skin turgor, JVP, capillary refill time", "MED30 สรุป Cardio – hypovolemic / cardiogenic / obstructive / distributive shock"], "nl": ["B7.1.2(2)", "2.2.7", "B7.2.5(4)"]}, {"id": "C-OLD-28", "kind": "old", "stem": "Which bedside finding best distinguishes hypovolaemic shock from cardiogenic and obstructive shock?", "choices": ["Narrow pulse pressure", "Cold peripheries", "Flat (low) jugular venous pressure", "Oliguria", "Tachycardia"], "answer": 2, "explain": "**JVP คือตัวแยกที่เร็วและแม่นที่สุดข้างเตียง**: ต่ำ = hypovolaemic หรือ distributive; สูง = cardiogenic หรือ obstructive (tamponade, tension pneumothorax, PE); ส่วน tachycardia ปลายมือเย็น ปัสสาวะน้อย พบได้ในทุกชนิดจึงแยกไม่ได้", "pearl": "", "topic": "", "src": "MED35 FA MCQ ข้อ 18", "ref": [], "nl": ["2.2.7", "B7.1.2(2)", "B7.2.5(4)"]}, {"id": "C-OLD-30", "kind": "old", "stem": "During thoracentesis a patient becomes light-headed with cold extremities. BP 80/60 mmHg, pulse 40/min, and breath sounds are equal bilaterally. What is the most likely cause?", "choices": ["Intercostal artery injury with haemorrhage", "Tension pneumothorax", "Cardiogenic shock", "Vasovagal reaction", "Anaphylaxis to local anaesthetic"], "answer": 3, "explain": "**ความดันตกพร้อมชีพจรช้า (bradycardia) = vasovagal** จากการกระตุ้น vagus ระหว่างหัตถการ — ต่างจากทุกภาวะช็อกอื่นที่ชีพจรจะเร็ว; ฟังปอดเท่ากันสองข้างช่วยตัด tension pneumothorax และยังไม่มีหลักฐานเสียเลือด รักษาโดยหยุดหัตถการ นอนราบยกขา ให้สารน้ำ และให้ atropine ถ้าจำเป็น", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["2.2.7", "2.1.5", "B6.3(1)"]}]}, {"id": "cardio-10-05", "title": "การตรวจเพิ่มเติม — แล็บ ECG ภาพรังสี และ POCUS", "minutes": 8, "summary": "ECG สี่แบบที่ต้องอ่านออกทันที และเหตุผลที่อัลตราซาวด์ข้างเตียงเปลี่ยนเกม", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "3.1.12", "B7.3(3)", "3.3.23"], "md": "### ชุดตรวจที่สไลด์ให้ส่งในคนไข้ช็อก\n**ลักเตท · การทำงานของไต · การทำงานของตับ · เอนไซม์หัวใจ · CBC พร้อม differential · PT, PTT, INR · การตรวจการตั้งครรภ์ · ปัสสาวะและตะกอนปัสสาวะ · ก๊าซในเลือดแดง · ECG · ภาพรังสีทรวงอก**\n\n> **ข้อที่คนลืมบ่อยคือการตรวจการตั้งครรภ์** — หญิงวัยเจริญพันธุ์ที่ช็อกโดยไม่ทราบสาเหตุ **ต้องนึกถึงการตั้งครรภ์นอกมดลูกแตก** ซึ่งเป็นช็อกจากการเสียเลือดในช่องท้องที่มองไม่เห็นจากภายนอก\n\n### ECG — สี่รูปแบบที่สไลด์ระบุว่าต้องจับให้ได้\n\n| สิ่งที่พบ | ชี้ไปที่ |\n|---|---|\n| **หัวใจเต้นช้าหรือเร็วผิดจังหวะแบบร้ายแรง** | **ภาวะหัวใจเต้นผิดจังหวะที่เป็นต้นเหตุของช็อก** |\n| **ST ยกขึ้น** | **กล้ามเนื้อหัวใจตาย** |\n| **S1Q3T3** | **ลิ่มเลือดอุดกั้นปอด** |\n| **ไฟฟ้าต่ำ ร่วมกับ electrical alternans** | **ภาวะบีบรัดหัวใจ (tamponade)** |\n\n**ข้อควรรู้เพิ่มเกี่ยวกับ S1Q3T3** — เป็นรูปแบบที่ **จำเพาะพอสมควรแต่ไวต่ำมาก** พบเพียงส่วนน้อยของผู้ป่วยลิ่มเลือดอุดกั้นปอด สิ่งที่พบบ่อยกว่าคือ **หัวใจเต้นเร็วธรรมดา** และ **T inversion ใน V1−V4** ดังนั้น **ECG ที่ปกติไม่ตัด PE ออก**\n\n### ภาพรังสีทรวงอก\nใช้แยกได้เร็วหลายอย่าง — **น้ำท่วมปอด (cardiogenic) · ปอดอักเสบ (septic) · เงาหัวใจทรงขวดน้ำ (tamponade) · ปอดแฟบจากลมรั่วและหลอดลมเบน (tension pneumothorax) · ช่องอกเมดิแอสตินัมกว้าง (aortic dissection)**\n\n> **แต่ถ้าสงสัย tension pneumothorax อย่ารอฟิล์ม** — เป็นการวินิจฉัยทางคลินิกที่ต้อง **เจาะระบายลมทันที**\n\n### POCUS — อัลตราซาวด์ข้างเตียง\nสไลด์ระบุว่ามีบทบาทมากขึ้นเรื่อย ๆ เพราะ **ราคาถูก ทำได้เร็ว และไม่รุกล้ำ** โดยดูได้ที่ **หัวใจ ปอด ช่องเยื่อหุ้มปอด IVC หลอดเลือดแดงใหญ่ในช่องท้อง ช่องท้อง และอุ้งเชิงกราน**\n\n**สิ่งที่ตอบได้ภายในไม่กี่นาที**\n| ดูอะไร | บอกอะไร |\n|---|---|\n| **การบีบตัวของหัวใจ** | **เสีย = cardiogenic** · **แรงมากแต่ห้องเล็ก = hypovolemic หรือ distributive** |\n| **น้ำรอบหัวใจ + ห้องขวายุบ** | **tamponade** |\n| **ห้องขวาโต ผนังกั้นเบน** | **ลิ่มเลือดอุดกั้นปอดขนาดใหญ่** |\n| **IVC เล็กและยุบตามหายใจ** | **ปริมาตรพร่อง — เติมน้ำได้** |\n| **IVC ใหญ่และไม่ยุบ** | **ความดันเติมเลือดสูง — ระวังการเติมน้ำ** |\n| **ปอด: B-line กระจาย** | **น้ำท่วมปอด** |\n| **ปอด: ไม่มี lung sliding** | **ลมรั่วในช่องเยื่อหุ้มปอด** |\n| **ช่องท้อง: มีน้ำอิสระ** | **เลือดออกในช่องท้อง** |\n| **เอออร์ตาในช่องท้องโป่ง** | **หลอดเลือดแดงใหญ่โป่งพองแตก** |\n\n> **POCUS คือสิ่งที่เปลี่ยน \"undifferentiated shock\" ให้กลายเป็นชนิดที่ระบุได้เร็วที่สุด** และตอบคำถามที่สำคัญที่สุดข้างเตียงพร้อมกันสองข้อ: **เป็นช็อกชนิดไหน** และ **เติมน้ำได้อีกไหม**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยก **ECG เป็นหัวข้อของตัวเองเต็มหนึ่งหน้า** และบอกว่าเป็น **\"essential part of the evaluation of the patient with shock\"** พร้อมยกสี่รูปแบบข้างต้นเป็นตัวอย่าง\n- สไลด์ระบุเหตุผลของ POCUS ไว้สามข้อคือ **low cost, rapidity, noninvasive** และไล่รายการอวัยวะที่ต้องกวาดดูไว้ครบ\n- ชุดแล็บในสไลด์ครอบคลุมทั้ง **การหาสาเหตุ (เอนไซม์หัวใจ ปัสสาวะ CBC) และการประเมินความรุนแรง (ลักเตท ก๊าซในเลือด การทำงานของตับและไต)**\n", "pearls": ["ECG สี่แบบในคนช็อก — จังหวะร้ายแรง · ST ยก · S1Q3T3 · ไฟฟ้าต่ำกับ electrical alternans", "ECG ปกติไม่ตัดลิ่มเลือดอุดกั้นปอดออก — S1Q3T3 ไวต่ำมาก", "สงสัย tension pneumothorax ให้เจาะระบายลมทันที อย่ารอฟิล์ม", "POCUS ตอบสองคำถามพร้อมกัน — ช็อกชนิดไหน และเติมน้ำได้อีกไหม", "หญิงวัยเจริญพันธุ์ที่ช็อกไม่ทราบสาเหตุ ต้องส่งตรวจการตั้งครรภ์เสมอ"], "items": [{"id": "CARDIO-10-05-Q1", "kind": "own", "stem": "A 61-year-old man presents with hypotension and dyspnoea of sudden onset. Blood pressure is 82/54 mmHg, heart rate 124/min, and his extremities are cool. Bedside ultrasound shows a dilated, poorly contracting right ventricle with septal flattening, a vigorously contracting and underfilled left ventricle, no pericardial effusion, normal lung sliding bilaterally and a plethoric inferior vena cava that does not collapse. Which diagnosis do these findings most support?", "choices": ["Septic shock with fluid-responsive hypovolaemia", "Tension pneumothorax causing obstructive shock", "Cardiac tamponade causing obstructive shock", "Acute left ventricular infarction causing cardiogenic shock", "Massive pulmonary embolism causing obstructive shock"], "answer": 4, "explain": "**กลไก** — ภาพ POCUS ชุดนี้บอกได้ครบทุกอย่าง **ห้องล่างขวาโตและบีบตัวแย่ ร่วมกับผนังกั้นแบนราบ** คือภาพของ **ห้องขวาที่ต้องสู้กับแรงต้านในปอดที่เพิ่มขึ้นกะทันหัน** (acute cor pulmonale) ส่วน **ห้องล่างซ้ายบีบตัวแรงแต่มีเลือดน้อย** เพราะเลือดผ่านปอดมาถึงห้องซ้ายไม่ได้ และ **IVC ที่อิ่มและไม่ยุบ** ยืนยันว่าความดันหลอดเลือดดำสูง ไม่ใช่ปริมาตรพร่อง\n\n**ทำไมตัวลวงจึงผิด**\n- *Tamponade* — ต้องมี **น้ำรอบหัวใจ** ซึ่งโจทย์ระบุชัดว่าไม่มี และภาพของ tamponade คือ **ห้องขวายุบตัว ไม่ใช่ห้องขวาโต**\n- *กล้ามเนื้อหัวใจห้องซ้ายตาย* — จะเห็น **ห้องซ้ายบีบตัวแย่** แต่ในโจทย์ห้องซ้าย **บีบตัวแรงมาก** ซึ่งตรงข้ามกัน\n- *Tension pneumothorax* — ทำให้ JVP สูงและช็อกแบบ obstructive ได้จริง แต่ POCUS จะพบ **lung sliding หายไปข้างหนึ่ง** ซึ่งโจทย์ระบุว่าปกติทั้งสองข้าง\n- *Septic shock ที่เติมน้ำได้* — จะมี **IVC เล็กและยุบตามหายใจ ปลายมือเท้าอุ่น** ตรงข้ามกับโจทย์ทั้งสองข้อ\n\n**ประเด็นการรักษา** — ช็อกจาก PE ขนาดใหญ่ **การเติมน้ำมากเกินไปทำให้แย่ลง** เพราะยิ่งถ่างห้องขวาและเบียดห้องซ้ายผ่านผนังกั้น สิ่งที่ต้องทำคือ **ให้น้ำอย่างระมัดระวัง ใช้ norepinephrine ประคองความดัน และพิจารณาการสลายลิ่มเลือด**", "pearl": "RV โตกับผนังกั้นแบน + LV เล็กแต่บีบแรง + IVC อิ่ม + ไม่มีน้ำรอบหัวใจ = PE ขนาดใหญ่ และอย่าเติมน้ำเยอะ", "topic": "การตรวจเพิ่มเติม — แล็บ ECG ภาพรังสี และ POCUS", "src": "", "ref": [], "nl": ["2.2.7", "3.3.23"]}]}, {"id": "cardio-10-06", "title": "การให้สารน้ำ — ให้เท่าไรและรู้ได้อย่างไรว่าพอ", "minutes": 8, "summary": "Starling curve, passive leg raise และเหตุผลที่การให้น้ำเกินก็ฆ่าคนได้", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B9.4(2)", "B7.1.2(2)"], "md": "### หลักการ\n- **การคืนการไหลเวียนให้เนื้อเยื่อคือหัวใจของการรักษาช็อก** และสารน้ำมักเป็นสิ่งแรกที่ให้\n- **เป้าหมายคือดันคนไข้ไปให้ถึงช่วงของ Starling curve ที่ไม่ขึ้นกับ preload อีกแล้ว (preload-independent portion)**\n\n> **อ่าน Starling curve ให้เป็น** — ช่วงต้นของกราฟ **ชัน** คือการเติมน้ำเพิ่ม preload แล้ว **SV เพิ่มขึ้นชัดเจน** เรียกว่า **fluid responsive** แต่เมื่อขึ้นถึงส่วนที่ **ราบ** แล้ว การเติมน้ำต่อ **ไม่เพิ่ม SV อีก มีแต่ทำให้บวม ปอดมีน้ำ และความดันในช่องท้องสูงขึ้น** จุดประสงค์ของการประเมินจึงไม่ใช่ \"ให้ครบเท่าไร\" แต่คือ **\"ยังอยู่ช่วงชันหรือช่วงราบแล้ว\"**\n\n### Distributive shock ให้น้ำเยอะได้\nสไลด์ระบุว่า **ในกรณีของ distributive shock ความจำเป็นของการเติมสารน้ำเร็วและมากตั้งแต่ต้นเป็นสิ่งที่มีหลักฐานชัดเจนแล้ว** — เพราะมีทั้ง **การขยายตัวของหลอดเลือด (ปริมาตรสัมพัทธ์พร่อง)** และ **การรั่วของสารน้ำออกนอกหลอดเลือด (third space loss)** ตามที่สไลด์กำกับไว้ในตารางโปรไฟล์\n- ในภาวะติดเชื้อรุนแรง ขนาดเริ่มต้นที่ใช้กันคือ **คริสตัลลอยด์ 30 mL/kg ในชั่วโมงแรก ๆ** แล้วประเมินซ้ำ\n\n### ชนิดของสารน้ำ\n- **คริสตัลลอยด์ไอโซโทนิกเป็นตัวเลือกแรก** — **0.9% NaCl หรือ balanced crystalloid (Ringer's lactate, Acetar)**\n- **เสียเลือดต้องให้เลือด** ไม่ใช่คริสตัลลอยด์อย่างเดียว\n- **หลีกเลี่ยงสารละลายที่มีน้ำตาลอย่างเดียว (D5W)** เพราะกระจายเข้าเซลล์ ไม่อยู่ในหลอดเลือด\n\n### การประเมินว่ายังเติมน้ำได้อีกไหม\n> **Passive leg raise (PLR) test** — สไลด์ระบุว่าใช้ **ทำนายการตอบสนองต่อสารน้ำที่จะให้เพิ่ม** โดย **เป็นการให้ก้อนสารน้ำจากในตัวคนไข้เอง (endogenous volume bolus)**\n\n**วิธีและหลักการ** — ยกขาทั้งสองข้างขึ้นราว 45 องศาจากท่ากึ่งนั่ง ทำให้ **เลือดจากขาไหลกลับเข้าสู่ระบบไหลเวียนส่วนกลางราว 300 mL ชั่วคราว** ถ้า **CO หรือ SV เพิ่มขึ้นชัดเจน (มักใช้เกณฑ์ราว 10%)** แปลว่า **ยังอยู่ช่วงชันของกราฟ เติมน้ำได้อีก**\n**ข้อดีคือกลับคืนได้เอง** — ถ้าไม่ตอบสนองก็แค่วางขาลง ไม่ได้ให้สารน้ำที่เอาออกไม่ได้เข้าไปจริง\n\n**ตัวช่วยอื่น** — **IVC ที่เล็กและยุบตามการหายใจ** จาก POCUS · การแปรผันของความดันชีพจรตามการหายใจในคนที่ใส่เครื่องช่วยหายใจ\n\n### กับดักที่สำคัญที่สุดของหัวข้อนี้\n- **การให้น้ำมากเกินไปมีอันตรายจริง** — ทำให้ **ปอดมีน้ำ ถอดเครื่องช่วยหายใจยาก ไตบวมจากความดันดำสูงจนไตวายแย่ลง และความดันในช่องท้องสูง**\n- **Cardiogenic shock ที่ JVP สูงและมีน้ำท่วมปอดอยู่แล้ว การให้น้ำมากทำให้แย่ลงทันที** — กลุ่มนี้ต้องการ **ยาเพิ่มแรงบีบหัวใจ ไม่ใช่สารน้ำ**\n- **Obstructive shock ต้องแก้ที่สิ่งขัดขวาง** สารน้ำเป็นเพียงการประคองชั่วคราว\n- ทั้งสองข้อข้างบนคือเหตุผลที่ต้อง **แยกชนิดของช็อกก่อนหรืออย่างน้อยพร้อมกับการเติมน้ำ**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ใช้คำว่า **\"aim to preload-independent portion of the Starling curve\"** เป็นเป้าหมายของการให้สารน้ำ ซึ่งเป็นการวางเป้าหมายเชิงสรีรวิทยา ไม่ใช่เชิงปริมาตร\n- สไลด์อธิบาย PLR ว่าเป็น **\"providing the patient with an endogenous volume bolus\"** — เป็นนิยามที่จำง่ายและอธิบายข้อดีของการทดสอบนี้ในตัวเอง\n", "pearls": ["เป้าหมายของสารน้ำคือไปให้ถึงช่วงราบของ Starling curve ไม่ใช่ให้ครบตามสูตร", "Passive leg raise = ให้ก้อนสารน้ำจากในตัวคนไข้เอง ประมาณ 300 mL และกลับคืนได้", "Distributive shock ต้องเติมน้ำเร็วและมาก เพราะมีทั้งหลอดเลือดขยายและ third space loss", "Cardiogenic shock ที่ JVP สูงและปอดมีน้ำ การเติมน้ำมากทำให้แย่ลง — ต้องการยาเพิ่มแรงบีบหัวใจ", "น้ำเกินทำให้ปอดมีน้ำ ถอดเครื่องยาก และไตวายแย่ลงจากความดันดำที่สูง"], "items": [{"id": "C-OLD-27", "kind": "old", "stem": "A hypotensive patient has flat neck veins, dry mucous membranes, poor skin turgor and a history of profuse diarrhoea. What is the most appropriate initial management?", "choices": ["Rapid infusion of isotonic crystalloid (0.9% normal saline)", "Intravenous noradrenaline as the first step", "Packed red cell transfusion", "Pericardiocentesis", "Intravenous furosemide"], "answer": 0, "explain": "**JVP แฟบ + ขาดน้ำชัดเจน = hypovolaemic shock → ให้สารน้ำ isotonic อย่างรวดเร็วก่อน** แล้วประเมินซ้ำ; ยากระตุ้นความดันใช้เมื่อให้สารน้ำเพียงพอแล้วยังไม่ดีขึ้น ไม่ใช่ทางเลือกแรกในผู้ป่วยที่ปริมาตรพร่อง", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 43 / MED32 MCQ ข้อ 84", "ref": [], "nl": ["2.2.7", "B9.2.5(2)", "B9.4(2)"]}, {"id": "C-OLD-29", "kind": "old", "stem": "A patient with severe vomiting and diarrhoea has BP 85/50 mmHg, Na 120 mEq/L, BUN 40 mg/dL and creatinine 1.8 mg/dL. What is the most appropriate initial fluid?", "choices": ["3% hypertonic saline", "Albumin 20% infusion", "0.9% normal saline", "5% dextrose in water", "0.45% saline"], "answer": 2, "explain": "เป็น **hypovolaemic hyponatraemia** — เสียทั้งน้ำและเกลือ ร่างกายหลั่ง ADH เพื่อรักษาปริมาตร ทำให้ Na เจือจาง; การให้ **isotonic saline แก้ทั้งความดันและโซเดียมพร้อมกัน** โดยไม่ต้องใช้ 3% NaCl (สงวนไว้เมื่อมีอาการทางสมอง เช่น ชัก ซึม) และต้องระวังแก้ Na เร็วเกิน 8-10 mEq/L ต่อวัน", "pearl": "", "topic": "", "src": "MED33 MCQ", "ref": [], "nl": ["B9.2.5(2)", "2.2.7", "B9.4(2)"]}]}, {"id": "cardio-10-07", "title": "ยากระตุ้นหลอดเลือด ยาเพิ่มแรงบีบหัวใจ และการช่วยหายใจ", "minutes": 9, "summary": "เลือกยาตามกลไกที่เสีย ไม่ใช่ตามความดันที่เห็น", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.4(6)", "B7.2.5(4)"], "md": "### เมื่อไรจึงเริ่มยา\n> **เริ่มเมื่อเติมสารน้ำจนเหมาะสมแล้ว แต่ความดันยังต่ำและเนื้อเยื่อยังได้เลือดไม่พอ**\n> **และต้องเลือกยาให้ตรงกับความผิดปกติทางสรีรวิทยาที่เป็นต้นเหตุ**\n\n*(ในทางปฏิบัติ ถ้าความดันต่ำมากจนอวัยวะเสี่ยงทันที สามารถเริ่มยาไปพร้อมกับการเติมน้ำได้เลย ไม่ต้องรอให้เติมครบ)*\n\n### สองตัวเลือกแรกที่สไลด์ระบุชัด\n\n| ชนิดของช็อก | เป้าหมายทางสรีรวิทยา | ยาตัวแรก | ฤทธิ์ |\n|---|---|---|---|\n| **Distributive** | **เพิ่ม SVR** | **Norepinephrine** | **α₁ แรง ร่วมกับ β₁ พอควร** |\n| **Cardiogenic** | **เพิ่มแรงบีบตัว** | **Dobutamine** | **ออกฤทธิ์ผ่าน β เป็นหลัก มีฤทธิ์ α น้อยมาก** |\n\n> **ตรรกะเบื้องหลัง — ถามว่า \"อะไรพัง\" แล้วจึงเลือกยา**\n> **SVR พัง → ให้ยาที่บีบหลอดเลือด (norepinephrine)**\n> **แรงบีบหัวใจพัง → ให้ยาที่เพิ่มแรงบีบ (dobutamine)**\n> การให้ยาบีบหลอดเลือดแรง ๆ ในคนที่หัวใจบีบตัวไม่ไหว จะ **เพิ่ม afterload จน CO ยิ่งตก** ส่วนการให้ dobutamine ในคนติดเชื้อที่ SVR ต่ำอยู่แล้ว จะ **ทำให้ความดันตกลงอีก** เพราะ β₂ ขยายหลอดเลือด\n\n### ยาที่ควรรู้จักเพิ่ม\n| ยา | ฤทธิ์เด่น | ใช้เมื่อ |\n|---|---|---|\n| **Norepinephrine** | **α₁ > β₁** | **ตัวแรกของช็อกจากการติดเชื้อและช็อกจากหัวใจที่ความดันต่ำมาก** |\n| **Adrenaline (epinephrine)** | **α และ β ทั้งคู่แรง** | **ช็อกจากการแพ้รุนแรง (ตัวแรกและสำคัญที่สุด)** · ภาวะหัวใจหยุดเต้น · เสริมเมื่อดื้อ |\n| **Dobutamine** | **β₁ > β₂** | **เพิ่ม CO ในช็อกจากหัวใจ** — มักใช้ควบกับ norepinephrine |\n| **Vasopressin** | **V₁ ไม่ผ่านตัวรับอะดรีเนอร์จิก** | **เสริม norepinephrine ในช็อกติดเชื้อเพื่อลดขนาด norepinephrine** |\n| **Dopamine** | ขึ้นกับขนาด | **ปัจจุบันไม่ใช่ตัวแรก** เพราะ **เพิ่มหัวใจเต้นผิดจังหวะมากกว่า norepinephrine** |\n\n**ข้อควรระวังที่ใช้บ่อย** — ยาบีบหลอดเลือดควรให้ทาง **เส้นเลือดดำส่วนกลาง** เมื่อทำได้ เพราะรั่วออกนอกเส้นแล้วทำให้เนื้อเยื่อตาย · แต่ **ห้ามรอเปิดเส้นกลางจนคนไข้ทรุด** เริ่มทางเส้นส่วนปลายเส้นใหญ่ไปก่อนได้แล้วค่อยเปลี่ยน\n\n### ออกซิเจนและการช่วยหายใจ\n> **ให้ออกซิเจนเสริมและปรับให้ SpO₂ อยู่ที่ 92−95%**\n\n**ข้อบ่งชี้ของการใส่เครื่องช่วยหายใจตามสไลด์**\n- **เพื่อลดระยะเวลาที่เนื้อเยื่อขาดออกซิเจน**\n- **เมื่อคนไข้ไม่สามารถหายใจชดเชยภาวะเลือดเป็นกรดจากเมตาบอลิกได้อีกต่อไป**\n\n**และเมื่อใส่แล้วให้ใช้กลยุทธ์ปกป้องปอด**\n- **ปริมาตรลมหายใจต่ำ (low tidal volume)**\n- **ปรับ PEEP ให้เหมาะสมเพื่อลดการบาดเจ็บของปอดจากเครื่องช่วยหายใจ**\n\n> **กับดักที่ต้องระวังตอนใส่ท่อช่วยหายใจในคนไข้ช็อก** — **ยานำสลบทำให้หลอดเลือดขยายและความดันตก** และ **ความดันบวกในช่องอกลดเลือดดำที่กลับเข้าหัวใจ** ทั้งสองอย่างรวมกันทำให้ **หัวใจหยุดเต้นรอบการใส่ท่อได้** จึงควร **เติมน้ำและเตรียมยากระตุ้นหลอดเลือดให้พร้อมก่อนเสมอ** · ข้อนี้ร้ายแรงเป็นพิเศษใน **obstructive shock เช่น tamponade และ PE ขนาดใหญ่** ที่พึ่ง preload มาก\n\n### ยาปฏิชีวนะ\n- ใน **undifferentiated shock** สไลด์ระบุว่า **ภาวะติดเชื้อและช็อกจากการติดเชื้อเป็นสาเหตุที่พบบ่อยที่สุดของช็อก**\n- **ให้ยาปฏิชีวนะครอบคลุมกว้างหลังเก็บเพาะเชื้อที่เหมาะสมแล้ว** — และไม่ควรรอผลเพาะเชื้อ\n- **เมื่อตัดการติดเชื้อออกไปแล้ว การหยุดยาปฏิชีวนะทั้งหมดคือส่วนสำคัญของการใช้ยาอย่างรับผิดชอบ (antibiotic stewardship)**\n\n### สามคำที่สไลด์ใช้สรุปการกู้ชีพ\n> **Ventilate (ให้ออกซิเจน) · Infuse (เติมสารน้ำ) · Pump (ยาที่ออกฤทธิ์ต่อหลอดเลือดและหัวใจ)** — อ้างอิง N Engl J Med 2013\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์เขียนฤทธิ์ของยาไว้ในวงเล็บชัดเจน: **norepinephrine \"with potent α1 and β1 adrenergic effects\"** และ **dobutamine \"primarily β-mediated effects and minimal α adrenergic effects\"** — เป็นเหตุผลที่ยาสองตัวนี้ถูกจับคู่กับช็อกคนละชนิด\n- สไลด์ให้เป้าหมาย **SpO₂ 92−95%** ซึ่งเป็นช่วงที่ไม่สูงเกินไป สะท้อนหลักฐานปัจจุบันว่าออกซิเจนที่มากเกินจำเป็นก็มีโทษ\n- สไลด์ย้ำเรื่อง **การหยุดยาปฏิชีวนะเมื่อตัดการติดเชื้อออกแล้ว** ซึ่งเป็นประเด็นที่มักถูกลืมในเวชปฏิบัติ\n", "pearls": ["Distributive → norepinephrine (เพิ่ม SVR) · cardiogenic → dobutamine (เพิ่มแรงบีบ)", "เลือกยาตามกลไกที่พัง ไม่ใช่ตามตัวเลขความดัน", "SpO₂ เป้าหมาย 92−95% · ใส่เครื่องช่วยหายใจใช้ปริมาตรลมต่ำและปรับ PEEP", "ระวังหัวใจหยุดเต้นรอบการใส่ท่อช่วยหายใจ — เติมน้ำและเตรียมยากระตุ้นหลอดเลือดก่อน", "Ventilate · Infuse · Pump คือสามเสาของการกู้ชีพช็อก", "ตัดการติดเชื้อออกได้แล้วต้องหยุดยาปฏิชีวนะ"], "items": [{"id": "C-MCQ-08", "kind": "mcq", "stem": "A 68-year-old man with pyelonephritis remains hypotensive after receiving 30 mL/kg of balanced crystalloid. Vital signs: BT 38.9 C, PR 118/min, BP 82/40 mmHg, RR 26/min. Extremities are warm with brisk capillary refill and the pulse pressure is wide. Serum lactate is 4.2 mmol/L. Echocardiography shows a hyperdynamic left ventricle with LVEF 65% and a non-collapsed inferior vena cava. Which of the following is the most appropriate next step?", "choices": ["Transfuse packed red cells to a haemoglobin target of 10 g/dL", "Start intravenous dopamine infusion at 5 micrograms/kg/min", "Give an additional 2 litres of crystalloid before starting any vasopressor", "Start intravenous norepinephrine infusion targeting a mean arterial pressure of 65 mmHg", "Start intravenous dobutamine infusion to augment cardiac output"], "answer": 3, "explain": "กลไก: septic shock = **distributive** — endotoxin/PAMPs กระตุ้น innate immunity → NO synthase (iNOS) ↑, prostacyclin ↑, ATP-sensitive K channel เปิด → **vascular smooth muscle ไม่ตอบสนองต่อ catecholamine (vasoplegia)** → SVR ต่ำ, CO สูงชดเชย → มือเท้าอุ่น, wide pulse pressure, hyperdynamic LV (ตรงกับโจทย์ทุกข้อ)\n\nเมื่อ **fluid resuscitation เพียงพอแล้ว (30 mL/kg) + IVC ไม่ collapse** แต่ MAP ยังต่ำ ปัญหาคือ **SVR ไม่ใช่ preload** → ต้องให้ vasopressor\n\n**Norepinephrine เป็น first-line** (Surviving Sepsis Campaign): α1 เด่น → vasoconstriction แก้ vasoplegia ตรงกลไก, β1 อ่อนๆ ช่วย CO โดยไม่เพิ่ม HR มาก → **arrhythmia น้อยกว่า dopamine** (ยืนยันจาก SOAP II trial ซึ่ง dopamine มี arrhythmia และแนวโน้ม mortality สูงกว่า). เป้าหมาย **MAP ≥ 65 mmHg**\n\nทำไมข้ออื่นผิด:\n- **ให้ fluid เพิ่มอีก 2 L**: เคสนี้ตัวชี้วัด fluid responsiveness เป็นลบ (IVC ไม่ collapse, LV hyperdynamic) → ให้ต่อจะได้แต่ **interstitial/pulmonary edema, ↑ venous congestion, AKI แย่ลง** และเสีย time-to-vasopressor (ทุก 1 ชม.ที่ช้า mortality เพิ่ม)\n- **Dopamine**: เคยเป็น first-line แต่ถูกถอดไปแล้ว — เสี่ยง tachyarrhythmia สูงกว่า, ฤทธิ์เปลี่ยนตาม dose (dopaminergic/β/α) คาดเดายาก, \"renal-dose dopamine\" พิสูจน์แล้วว่าไม่ป้องกัน AKI\n- **Dobutamine**: β1 agonist เพิ่ม inotropy + **β2 ทำให้ vasodilate → BP ตกยิ่งขึ้น**; ใช้เมื่อมี septic cardiomyopathy (EF ตก, CO ต่ำ) — เคสนี้ EF 65% hyperdynamic อยู่แล้ว ให้ไปจะซ้ำเติม\n- **Transfusion เป้า Hb 10**: TRISS trial แสดงว่า restrictive threshold **Hb 7 g/dL** ไม่แย่กว่า; โจทย์ไม่ได้บอกว่าซีดหรือมี active bleeding", "pearl": "Bundle 1 ชั่วโมงแรกของ septic shock: วัด **lactate**, เจาะ **hemoculture ก่อนให้ยา**, ให้ **broad-spectrum antibiotic**, ให้ **crystalloid 30 mL/kg**, และ **เริ่ม vasopressor ถ้า MAP <65 ระหว่างหรือหลังให้น้ำ**; ตัวที่ 2 คือ vasopressin, ถ้ายังไม่พอพิจารณา hydrocortisone", "topic": "Septic shock – first-line vasopressor", "src": "", "ref": ["MED34 FA MCQ – Patient develops shock 2 days after starting antibiotics → Septic shock", "MED31 past paper loop C&D – A 75 year old woman with fever, leukocyte 13,000, UA 20-25 WBC/HPF, urine & blood culture E. coli → Sepsis / severe sepsis terminology", "MED31 MCQ – ผู้ป่วยชายอายุ 40 ปี septic shock 6 ชั่วโมง ไม่มี urine ประมาณค่า GFR"], "nl": ["2.2.7", "B7.4(6)"]}, {"id": "CARDIO-10-07-Q1", "kind": "own", "stem": "A 70-year-old man with an anterior ST-elevation myocardial infarction has a blood pressure of 84/56 mmHg, heart rate 108/min, cold mottled extremities, a jugular venous pressure of 12 cm and bibasilar crepitations. Echocardiography shows an ejection fraction of 20%. He has already received 500 mL of crystalloid without improvement. Which of the following is the most appropriate next step in haemodynamic support?", "choices": ["Start intravenous furosemide alone and withhold vasoactive drugs", "Start dobutamine, adding norepinephrine if the mean arterial pressure remains below 65 mmHg", "Start high-dose phenylephrine to raise the systemic vascular resistance", "Give a further 30 mL/kg of crystalloid before starting any vasoactive drug", "Start dopamine as the first-line agent because it supports both rate and pressure"], "answer": 1, "explain": "**กลไก** — คนไข้รายนี้เป็น **cardiogenic shock** ชัดเจน: **JVP สูง 12 ซม. มีน้ำในปอด ปลายมือเท้าเย็น และ EF 20%** สิ่งที่พังคือ **แรงบีบตัวของหัวใจ** สไลด์จึงระบุให้ **dobutamine เป็นยาตัวแรกของช็อกจากหัวใจ** เพราะออกฤทธิ์ผ่าน **β เป็นหลักและมีฤทธิ์ α น้อยมาก** จึงเพิ่ม CO โดยไม่เพิ่ม afterload มาก\n\n**ทำไมต้องเติม norepinephrine เมื่อ MAP ยังต่ำ** — dobutamine มีฤทธิ์ **β₂ ที่ขยายหลอดเลือด** จึงอาจทำให้ความดันตกลงอีกในระยะแรก การใช้คู่กันจึงเป็นมาตรฐานเมื่อความดันยังต่ำ: **norepinephrine ประคองความดันเพื่อให้หลอดเลือดหัวใจได้เลือดเลี้ยง ส่วน dobutamine ดัน CO**\n\n**ทำไมตัวลวงจึงผิด**\n- *เติมน้ำอีก 30 mL/kg* — เป็นขนาดของ **septic shock** คนไข้รายนี้ **JVP สูงและมีน้ำในปอดอยู่แล้ว** การเติมน้ำต่อจะทำให้ปอดแย่ลงทันที และเขาก็ **ไม่ตอบสนองต่อ 500 mL แรกไปแล้ว**\n- *Phenylephrine ขนาดสูง* — เป็นยา **α บริสุทธิ์** จึงเพิ่ม afterload โดยไม่ช่วยแรงบีบเลย ในหัวใจที่ EF 20% การเพิ่ม afterload จะทำให้ **CO ตกลงไปอีก** เป็นตัวลวงที่อันตรายที่สุดในข้อนี้\n- *Furosemide อย่างเดียว* — คนไข้น้ำท่วมปอดก็จริง แต่ **กำลังช็อก** การลด preload โดยไม่ประคองการไหลเวียนก่อนจะทำให้ความดันตกลงอีก ยาขับปัสสาวะใช้ได้หลังการไหลเวียนนิ่งแล้ว\n- *Dopamine เป็นตัวแรก* — ปัจจุบัน **ไม่ใช่ตัวเลือกแรก** เพราะมีหลักฐานว่า **ทำให้หัวใจเต้นผิดจังหวะมากกว่า norepinephrine และในกลุ่มช็อกจากหัวใจสัมพันธ์กับอัตราตายที่สูงกว่า**\n\n**สิ่งที่ต้องทำควบคู่** — คนไข้รายนี้ต้อง **เปิดหลอดเลือดหัวใจอย่างเร่งด่วน** ซึ่งเป็นการรักษาที่ตรงต้นเหตุ และพิจารณาเครื่องพยุงการไหลเวียนถ้ายังไม่ดีขึ้น", "pearl": "Cardiogenic shock ให้ dobutamine เพิ่ม CO และเติม norepinephrine ประคองความดัน — ห้ามให้ยา α บริสุทธิ์เพราะเพิ่ม afterload จน CO ยิ่งตก", "topic": "ยากระตุ้นหลอดเลือด ยาเพิ่มแรงบีบหัวใจ และการช่วยหายใจ", "src": "", "ref": [], "nl": ["B7.4(6)", "2.2.7"]}]}, {"id": "cardio-10-08", "title": "การรักษาจำเพาะตามสาเหตุ เป้าหมาย และสี่ระยะของการกู้ชีพ", "minutes": 10, "summary": "ช็อกบางชนิดยาไม่ช่วย ต้องแก้ที่ต้นเหตุทันที", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Circulatory Shock (อ้างอิง Harrison's 21e และ N Engl J Med 2013;369:1726-34)", "nl": ["2.2.7", "B7.2.5(4)", "2.3.9(1)", "B7.4(6)"], "md": "### ช็อกที่ต้องทำหัตถการช่วยชีวิตทันที ไม่ใช่แค่ให้ยา\nสไลด์ไล่ไว้เป็นตัวอย่าง\n\n| สาเหตุ | สิ่งที่ต้องทำเพิ่มจากการประคอง |\n|---|---|\n| **แพ้รุนแรง (anaphylaxis)** | **เอาสิ่งกระตุ้นออก · ให้อะดรีนาลีน · เติมสารน้ำและยากระตุ้นหลอดเลือด** |\n| **ต่อมหมวกไตบกพร่อง** | **ให้สเตียรอยด์ขนาดเครียดทางหลอดเลือด** |\n| **กล้ามเนื้อหัวใจขาดเลือดเฉียบพลัน** | **เปิดหลอดเลือดหัวใจ และใช้เครื่องพยุงการไหลเวียนชั่วคราว** |\n| **ช็อกจากการเสียเลือด** | **ผ่าตัดในรายอุบัติเหตุ · ส่องกล้องหรือทำหัตถการทางรังสีร่วมรักษาในรายเลือดออกทางเดินอาหาร** |\n| **Tension pneumothorax** | **เจาะระบายลมทันที** |\n\n*(จากคาบ 04 เพิ่มอีกสองข้อในกลุ่ม obstructive — **tamponade ต้องเจาะระบายน้ำ** และ **PE ขนาดใหญ่พิจารณาสลายลิ่มเลือด**)*\n\n### ช็อกจากการแพ้รุนแรง — จุดที่ออกสอบซ้ำที่สุด\n- เป็น **ปฏิกิริยาภูมิไวเกินชนิดที่ 1 ผ่าน IgE** → mast cell หลั่งฮิสตามีนและตัวกลางอื่น → **หลอดเลือดขยายและรั่ว** จึงเป็น **distributive shock**\n- **อะดรีนาลีนคือยาตัวแรกและไม่มีอะไรมาแทนได้**\n  - **0.5 mg (1:1000) ฉีดเข้ากล้ามเนื้อที่ต้นขาด้านหน้าข้าง (anterolateral thigh)** ซ้ำได้ทุก 5−15 นาที\n  - **เข้ากล้ามที่ต้นขา ไม่ใช่ใต้ผิวหนังและไม่ใช่ที่ต้นแขน** เพราะดูดซึมเร็วกว่าและได้ระดับยาสูงกว่า\n- **ยาแก้แพ้และสเตียรอยด์เป็นยาเสริม ไม่ใช่ยาหลัก** — ออกฤทธิ์ช้าเกินกว่าจะช่วยชีวิต การให้ยาเหล่านี้แทนอะดรีนาลีนคือความผิดพลาดที่ทำให้เสียชีวิต\n- **ก่อนกลับบ้านต้องให้อะดรีนาลีนชนิดพกพา (auto-injector) พร้อมสอนวิธีใช้และแผนปฏิบัติเป็นลายลักษณ์อักษร** และนัดติดตาม เพราะอาจเกิด **ปฏิกิริยาสองระลอก (biphasic reaction)**\n\n### ช็อกจากหัวใจเต้นผิดจังหวะ\n- **ถ้าหัวใจเต้นเร็วผิดจังหวะเป็นต้นเหตุของความดันต่ำ ต้องช็อกไฟ
