นแรงจาก hypokalaemia — ตรวจอิเล็กโทรไลต์ก่อนเสมอเพราะแก้ได้เร็วและเป็นสาเหตุที่พบบ่อยที่สุดในบริบทนี้", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(3)", "2.1.22"]}, {"id": "N-OLD-015", "kind": "old", "stem": "Which statement about magnesium is correct?", "choices": ["Magnesium level always parallels the potassium level", "Proton pump inhibitors raise serum magnesium", "Hypomagnesaemia causes refractory hypokalaemia and hypocalcaemia and must be corrected first", "Magnesium is not required for PTH secretion", "Hypomagnesaemia typically causes bradycardia and a short QT interval"], "answer": 2, "explain": "**Mg ต่ำมีผลสองทาง**: ทำให้ไตขับ K ทิ้งจน hypokalaemia ดื้อการแก้ และ **กดการหลั่ง PTH พร้อมทำให้ดื้อต่อ PTH** จนแคลเซียมต่ำ; ทางคลื่นไฟฟ้าหัวใจสัมพันธ์กับ **QT ยาวและ torsades de pointes**; ยาที่ทำให้ Mg ต่ำได้แก่ **PPI ระยะยาว, ยาขับปัสสาวะ, amphotericin B, aminoglycoside, cisplatin**", "pearl": "", "topic": "", "src": "MED30 สรุป Renal (หน้า 283-287)", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "B9.3(5)"]}]}, {"id": "nephro-05-12", "title": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "minutes": 8, "summary": "เกิดได้แค่สองสถานการณ์ และอาการเรียงตามระดับอย่างคาดเดาได้", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.2.5(2)", "B9.3(5)", "B9.2.7(2)", "B9.4(2)"], "md": "### เกิดได้เพียงสองสถานการณ์\nไต **มีความสามารถในการขับแมกนีเซียมสูงมาก** เมื่อเกินระดับเกณฑ์ของไต แมกนีเซียมส่วนเกินที่ถูกกรองจะถูกขับออกไปแทบทั้งหมด **ระดับในเลือดจึงถูกกำหนดด้วย GFR เป็นหลัก** ดังนั้นแมกนีเซียมสูงเกิดได้แค่\n1. **การทำงานของไตบกพร่อง**\n2. **ได้รับแมกนีเซียมมากเกินไป**\n\n**โรคไต**\n- ใน CKD **หน่วยไตที่เหลือปรับตัวโดยเพิ่ม FEMg อย่างมาก** ระดับในเลือดจึง **ยังปกติไปจนกว่า CrCl จะต่ำกว่าราว 20 mL/min**\n- แม้ในโรคไตระยะท้าย **แมกนีเซียมสูงอย่างมีนัยสำคัญก็ยังพบน้อย เว้นแต่ได้รับแมกนีเซียมจากภายนอก** — **ยาลดกรด ยาระบาย ยาสวนทวาร**\n- **อายุที่มากขึ้นเป็นปัจจัยเสี่ยงสำคัญ** แม้การทำงานของไตจะดู \"ปกติ\" เพราะ GFR ลดลงตามวัยโดยไม่แสดงในค่าครีแอตินิน\n\n**ได้รับมากเกินไป (แม้ GFR ปกติ)**\n- **ยาลดกรดและยาระบายที่มีแมกนีเซียมในขนาดสูง · ยาสวนทวาร MgSO₄ · การให้ทางหลอดเลือดขนาดสูงเช่นในภาวะครรภ์เป็นพิษ**\n- **การได้รับทางลำไส้เป็นพิษได้ง่ายเป็นพิเศษในคนที่ลำไส้อักเสบ อุดตัน หรือทะลุ** เพราะการดูดซึมเพิ่มขึ้น\n\n**สาเหตุที่ทำให้สูงขึ้นเล็กน้อย** — ลิเทียม ผู้ป่วยหลังผ่าตัด มะเร็งแพร่กระจายไปกระดูก milk-alkali syndrome FHH ภาวะพร่องไทรอยด์ Addison disease\n\n### อาการเรียงตามระดับ — ตารางที่ควรท่อง\n| ระดับ Mg | อาการและอาการแสดง |\n|---|---|\n| **> 4−6 mg/dL** | **ความดันต่ำ คลื่นไส้ อาเจียน หน้าแดง ปัสสาวะคั่ง ลำไส้ไม่เคลื่อนไหว** |\n| **> 8−12 mg/dL** | **รีเฟล็กซ์เอ็นลึกหายไป กล้ามเนื้อลายอ่อนปวกเปียก (flaccid paralysis)** |\n| **สูงขึ้นอีก** | **หัวใจเต้นช้า บล็อกที่ SA, AV และ His bundle · กดการหายใจ · โคม่า · หัวใจหยุดเต้นแบบ asystole** |\n\n**กลไก**\n- **ความดันต่ำและหน้าแดงเป็นอาการแรก ๆ** จาก **การขยายตัวของกล้ามเนื้อเรียบหลอดเลือด และการยับยั้งการหลั่งนอร์อิพิเนฟรินจากปลายประสาทซิมพาเทติก**\n- **แมกนีเซียมที่สูงยับยั้งการหลั่งอะเซทิลโคลีนที่แผ่นปลายประสาท-กล้ามเนื้อ** → **รีเฟล็กซ์หายและอัมพาตอ่อนปวกเปียก** → **กดการหายใจ** ซึ่งเป็นภาวะแทรกซ้อนร้ายแรงของพิษแมกนีเซียมขั้นสูง\n- **กล้ามเนื้อเรียบเป็นอัมพาต** → **ปัสสาวะคั่ง ลำไส้ไม่เคลื่อนไหว รูม่านตาขยาย**\n- **อาจพบ anion gap ในเลือดต่ำผิดปกติหรือถึงกับติดลบ** เป็นเบาะแสได้ แต่ **ไม่พบสม่ำเสมอ** ขึ้นกับว่าประจุลบที่มากับแมกนีเซียมเป็นชนิดใด\n\n> **การตรวจรีเฟล็กซ์เอ็นลึกคือเครื่องมือเฝ้าระวังข้างเตียงที่ดีที่สุด** — เป็นเหตุผลที่สูติแพทย์ตรวจรีเฟล็กซ์ทุกครั้งขณะให้ MgSO₄ ในภาวะครรภ์เป็นพิษ **รีเฟล็กซ์ที่หายไปคือสัญญาณเตือนก่อนที่การหายใจจะถูกกด**\n\n### การรักษา\n1. **พิษไม่รุนแรงและไตยังดี → หยุดแมกนีเซียมอย่างเดียวก็พอ** เพราะไตขับได้เร็ว — **ค่าครึ่งชีวิตของแมกนีเซียมในเลือดปกติคือราว 28 ชั่วโมง**\n2. **พิษรุนแรงโดยเฉพาะต่อหัวใจ → ให้แคลเซียมทางหลอดเลือดเพื่อต้านฤทธิ์ชั่วคราว**\n   - **Calcium chloride 1 g หยดทางหลอดเลือดดำใหญ่นาน 2−5 นาที** หรือ **calcium gluconate ทางหลอดเลือดส่วนปลาย ให้ซ้ำได้หลัง 5 นาทีถ้าจำเป็น**\n3. **เร่งการขับทางไต** — **ให้น้ำเกลือร่วมกับ furosemide** ซึ่ง **ยับยั้งการดูดกลับแมกนีเซียมที่ TAL ส่วนเมดัลลา**\n4. **โรคไตระยะท้าย → ฟอกเลือดหรือ hemofiltration เป็นทางเดียว** — **HD ได้ผลดีมาก กำจัดได้ถึง 100 mL/min** น้ำยาฟอกมาตรฐานมีแมกนีเซียม **0.6−1.2 mg/dL** และใช้น้ำยาที่ไม่มีแมกนีเซียมได้ **โดยทั่วไปทนได้ดี ยกเว้นเป็นตะคริว**\n\n> **จุดละเอียดที่สไลด์ทิ้งท้ายและเป็นกับดักที่ดี** — ถ้าใช้น้ำยาฟอกที่มีแมกนีเซียม **\"รวม\" เท่ากับในเลือดของคนไข้ แมกนีเซียมจะเคลื่อนเข้าสู่ตัวคนไข้แทนที่จะออก** เพราะ **แมกนีเซียมในเลือดเป็นอิสระเพียงราว 70%** ความเข้มข้นของ **แมกนีเซียมอิสระในน้ำยาจึงสูงกว่าในเลือด** ทำให้ความต่างระดับวิ่งจากน้ำยาเข้าสู่เลือด\n> การประมาณคร่าว ๆ: **หลังฟอก 3−4 ชั่วโมงด้วยเยื่อประสิทธิภาพสูง ระดับจะเปลี่ยนไปราวหนึ่งในสามถึงครึ่งหนึ่งของผลต่างระหว่างแมกนีเซียมในน้ำยากับแมกนีเซียมอิสระในเลือดก่อนฟอก (ประมาณ 70% ของค่ารวม)**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์จัดอาการเป็น **\"predictable sequence\"** ตามระดับที่สูงขึ้น และให้จุดตัด **4−6 mg/dL** กับ **8−12 mg/dL** ไว้ชัดเจน — เป็นตัวเลขที่ออกสอบตรง\n- สไลด์ระบุว่าใน CKD **ระดับแมกนีเซียมจะยังคงปกติจนกว่า CrCl จะต่ำกว่าราว 20 mL/min**\n- สไลด์เน้นว่า **การได้รับแมกนีเซียมจากภายนอก (ยาลดกรด ยาระบาย ยาสวน) คือสิ่งที่เปลี่ยนคนไข้ CKD ให้กลายเป็นพิษแมกนีเซียม** ไม่ใช่โรคไตเพียงลำพัง\n", "pearls": ["แมกนีเซียมสูงเกิดได้แค่สองทาง — ไตเสีย หรือได้รับมากเกิน (ยาลดกรด ยาระบาย ยาสวน MgSO₄)", "Mg > 4−6 ความดันต่ำ หน้าแดง อาเจียน ลำไส้ไม่เคลื่อน · > 8−12 รีเฟล็กซ์หายและอัมพาตอ่อนปวกเปียก", "รีเฟล็กซ์เอ็นลึกที่หายไปคือสัญญาณเตือนก่อนการหายใจถูกกด — ใช้เฝ้าระวังข้างเตียง", "แก้พิษเฉียบพลันด้วยแคลเซียมทางหลอดเลือด แล้วเร่งขับด้วยน้ำเกลือ + furosemide · ESKD ต้องฟอกเลือด", "ใน CKD ระดับแมกนีเซียมยังปกติจนกว่า CrCl จะต่ำกว่าราว 20 mL/min"], "items": [{"id": "NEPHRO-05-12-Q1", "kind": "own", "stem": "A 78-year-old woman with chronic kidney disease (eGFR 22 mL/min/1.73 m2) is admitted with drowsiness and constipation after taking a magnesium-containing laxative daily for a week. Blood pressure is 88/54 mmHg, heart rate 48/min, and her deep tendon reflexes are absent. Serum magnesium is 9.8 mg/dL (normal 1.7-2.4). Which of the following is the most appropriate immediate treatment?", "choices": ["Give intravenous furosemide alone without volume replacement", "Stop the laxative and give intravenous calcium gluconate", "Start an insulin and dextrose infusion", "Stop the laxative and observe, since the half-life of magnesium is short", "Give oral sodium polystyrene sulfonate"], "answer": 1, "explain": "**กลไก** — คนไข้มีพิษแมกนีเซียมที่รุนแรงแล้ว: **รีเฟล็กซ์เอ็นลึกหายไป (เข้ากับช่วง 8−12 mg/dL) ร่วมกับความดันต่ำและหัวใจเต้นช้า** ซึ่งเป็นสัญญาณว่า **การหายใจอาจถูกกดเป็นลำดับถัดไป** จึงต้อง **ต้านฤทธิ์ที่เยื่อหุ้มเซลล์ทันทีด้วยแคลเซียมทางหลอดเลือด** แคลเซียมเป็นปฏิปักษ์ทางสรีรวิทยาโดยตรงต่อแมกนีเซียมที่ยับยั้งการหลั่งอะเซทิลโคลีนและกดการนำไฟฟ้าของหัวใจ พร้อมกับ **หยุดแหล่งของแมกนีเซียม** แล้วจึงตามด้วยการเร่งขับ (น้ำเกลือร่วมกับ furosemide) และ **ฟอกเลือดถ้าไตไม่สามารถขับออกได้**\n\n**ทำไมตัวลวงจึงผิด**\n- *หยุดยาแล้วเฝ้าดู* — ใช้ได้เฉพาะ **พิษไม่รุนแรงในคนที่ไตยังดี** ค่าครึ่งชีวิต 28 ชั่วโมงนั้นตั้งอยู่บนสมมติฐานว่าไตขับได้ คนไข้รายนี้ **eGFR 22 และมีอาการรุนแรงแล้ว** การรอคือปล่อยให้เดินไปสู่การกดการหายใจ\n- *ให้ furosemide อย่างเดียวโดยไม่เติมน้ำ* — คนไข้ความดัน 88/54 อยู่แล้ว การขับปัสสาวะโดยไม่เติมปริมาตรจะทำให้ความดันตกและ GFR แย่ลง ยิ่งขับแมกนีเซียมไม่ออก · furosemide ต้องใช้ **ร่วมกับน้ำเกลือ**\n- *อินซูลินร่วมกับน้ำตาล* — เป็นการรักษา **โพแทสเซียมสูง** ไม่ได้ย้ายแมกนีเซียมเข้าเซลล์อย่างมีนัยสำคัญ\n- *Sodium polystyrene sulfonate* — เรซินจับ **โพแทสเซียม** ไม่ใช่แมกนีเซียม", "pearl": "รีเฟล็กซ์หาย + ความดันต่ำ + หัวใจช้า ในคนไข้ CKD ที่กินยาระบายแมกนีเซียม = ให้แคลเซียมทางหลอดเลือดทันที", "topic": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)"]}, {"id": "NEPHRO-05-12-Q2", "kind": "own", "stem": "A 29-year-old woman with severe pre-eclampsia is receiving an intravenous magnesium sulfate infusion. Which bedside finding should prompt the infusion to be stopped first?", "choices": ["Facial flushing and nausea", "Urinary retention requiring catheterisation", "Loss of the patellar deep tendon reflex", "A fall in systolic blood pressure of 10 mmHg", "A respiratory rate of 10 per minute"], "answer": 2, "explain": "**กลไก** — พิษแมกนีเซียมดำเนินไปตามลำดับที่คาดเดาได้ตามระดับที่สูงขึ้น: **หน้าแดง คลื่นไส้ ความดันต่ำ (> 4−6 mg/dL) → รีเฟล็กซ์เอ็นลึกหายและกล้ามเนื้ออ่อนปวกเปียก (> 8−12 mg/dL) → กดการหายใจ โคม่า หัวใจหยุดเต้น** ดังนั้น **การหายไปของรีเฟล็กซ์เอ็นลึกคือสัญญาณเตือนสุดท้ายที่ยังกลับได้ ก่อนจะถึงขั้นกดการหายใจ** สไลด์ระบุตรง ๆ ว่า **การตรวจรีเฟล็กซ์เป็นการทดสอบข้างเตียงที่มีประโยชน์ในการตรวจจับการได้รับแมกนีเซียมเกินขนาด** จึงเป็นเหตุผลที่ต้องตรวจรีเฟล็กซ์ซ้ำ ๆ ตลอดการให้ยา\n\n**ทำไมตัวลวงจึงผิด**\n- *อัตราการหายใจ 10 ครั้งต่อนาที* — เป็นสัญญาณที่ **ช้าเกินไป** เพราะการกดการหายใจอยู่ **หลัง** การเสียรีเฟล็กซ์ในลำดับของพิษ จุดประสงค์ของการเฝ้ารีเฟล็กซ์คือเพื่อ **ไม่ให้เดินมาถึงจุดนี้** (ถ้ามาถึงแล้วต้องหยุดยา ให้แคลเซียม และช่วยหายใจทันที)\n- *หน้าแดงและคลื่นไส้* — เป็นอาการของช่วงระดับต่ำสุด พบได้บ่อยและไม่จำเพาะ ไม่ใช่จุดที่ต้องหยุดยาทันที\n- *ความดันซิสโตลิกลดลง 10 mmHg* — แมกนีเซียมขยายหลอดเลือดอยู่แล้ว และการลดความดันคือผลที่ต้องการส่วนหนึ่งในภาวะครรภ์เป็นพิษ\n- *ปัสสาวะคั่ง* — เป็นอาการของกล้ามเนื้อเรียบเป็นอัมพาต อยู่ในช่วงระดับต้น ๆ และแก้ได้ด้วยการสวนปัสสาวะ ไม่ใช่ตัวชี้ขาด\n\n**ข้อควรรู้เพิ่ม** — ถ้าคนไข้มีปัสสาวะออกน้อยหรือไตเสื่อม ต้องลดขนาดยาลงและเจาะระดับแมกนีเซียมถี่ขึ้น เพราะไตคือทางออกทางเดียว", "pearl": "เฝ้าระวังพิษ MgSO₄ ด้วยรีเฟล็กซ์เอ็นลึก — รีเฟล็กซ์หายมาก่อนการกดการหายใจเสมอ", "topic": "ภาวะแมกนีเซียมสูง — ไล่ตามระดับที่สูงขึ้น", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)"]}]}], "meq": [{"id": "N-MEQ-04", "part": "MEQ", "lec": "05", "lecture": "Fluid electrolyte: Divalent (อ.ธิติยา)", "topic": "Symptomatic hypercalcaemia with acute kidney injury from malignancy", "vignette": "ผู้ป่วยหญิงไทยอายุ 66 ปี มาโรงพยาบาลด้วยอาการซึมลง 2 วัน\nPI:\n- 1 เดือนก่อน ปวดหลังช่วงล่างมากขึ้นเรื่อยๆ รับประทาน NSAID ที่ซื้อเองเกือบทุกวัน น้ำหนักลด 6 กิโลกรัมใน 3 เดือน\n- 1 สัปดาห์ก่อน ปัสสาวะบ่อยมากทั้งวันทั้งคืน กระหายน้ำ ท้องผูก เบื่ออาหาร คลื่นไส้อาเจียน\n- 2 วันก่อน ซึมลง พูดสับสน ญาติกระตุ้นแล้วลืมตาแต่ตอบไม่ตรงคำถาม\nPE: V/S BT 36.9 C, PR 104/min, RR 18/min, BP 96/58 mmHg, นั่งแล้วความดันตก\nGA: drowsy (E3V4M6), mucous membrane แห้ง, skin turgor ลดลง, ซีดเล็กน้อย\nHEENT: JVP ไม่เห็น; CVS/RS: ปกติ; Abd: soft, ไม่กดเจ็บ, ไม่คลำได้ก้อน\nSpine: กดเจ็บที่ lumbar spine L2-L3; Neuro: ไม่มี focal deficit, DTR ลดลงทั่ว\nLab: CBC Hb 8.6 g/dL, Hct 26%, MCV 88 fL, WBC 5,200/mm3, platelet 190,000/mm3, ESR 112 mm/hr\nBUN 48 mg/dL, creatinine 3.1 mg/dL (ไม่ทราบ baseline), Na 132, K 3.3, Cl 98, HCO3 20 mEq/L\n**Corrected calcium 14.2 mg/dL, phosphate 4.8 mg/dL, albumin 3.0 g/dL, total protein 9.8 g/dL, intact PTH 5 pg/mL (ต่ำ)**\nUA: spgr 1.008, protein 1+ by dipstick, no RBC, no WBC, no cast\nFilm lumbosacral spine: multiple lytic lesions ที่ vertebral body", "questions": [{"q": "1. จงแปลผลความผิดปกติทางห้องปฏิบัติการทั้งหมด", "a": "1. **Severe hypercalcaemia**: corrected calcium 14.2 mg/dL (ปกติ 8.6-10.2) — ระดับที่ทำให้เกิดอาการทางระบบประสาทและต้องรักษาเร่งด่วน\n2. **Intact PTH ต่ำ (5 pg/mL)** → **PTH-independent hypercalcaemia** → บ่งว่าไม่ใช่ primary hyperparathyroidism (ต่อมถูกกดอย่างเหมาะสม) → ต้องหาสาเหตุจาก **มะเร็ง, vitamin D excess, granulomatous disease, thyrotoxicosis, ยา**\n3. **Acute kidney injury**: creatinine 3.1 mg/dL ร่วมกับ BUN 48 (**BUN/Cr ratio ≈ 15-16**) โดยมีองค์ประกอบ **prerenal จาก volume depletion**\n4. **Normochromic normocytic anaemia (Hb 8.6, MCV 88)**\n5. **ESR สูงมาก 112 mm/hr** — บ่งการอักเสบ/โรคมะเร็งทางโลหิตวิทยา\n6. **Total protein สูง (9.8) ขณะที่ albumin ต่ำ (3.0)** → **globulin gap กว้างมาก (6.8 g/dL)** → **ชี้ชัดไปที่ monoclonal gammopathy**\n7. **Hyponatraemia เล็กน้อย (132)** และ **hypokalaemia (3.3)** — จาก volume depletion, อาเจียน และ hypercalcaemia-induced nephrogenic DI\n8. **Metabolic acidosis เล็กน้อย (HCO3 20)** — อาจจากไตวายและ/หรือ **proximal tubular dysfunction จาก light chain (type 2 RTA)**\n9. **Urine specific gravity ต่ำ (1.008)** แม้ผู้ป่วยจะขาดน้ำ → **ไตทำให้ปัสสาวะเข้มข้นไม่ได้ = nephrogenic diabetes insipidus จาก hypercalcaemia** (อธิบาย polyuria ท่ามกลางภาวะขาดน้ำ)\n10. **UA: protein 1+ โดยไม่มี RBC/WBC/cast** — dipstick ตรวจจับ albumin ได้ไม่ดีสำหรับ light chain → **ต้องส่ง urine protein electrophoresis/immunofixation โดยเฉพาะ (Bence Jones protein)**\n11. **Multiple lytic lesions ที่ vertebral body พร้อม ESR สูงและ globulin gap** — ภาพของ **multiple myeloma**"}, {"q": "2. จงให้การวินิจฉัยและอธิบายกลไกของอาการทั้งหมดที่ผู้ป่วยมี", "a": "**Definitive diagnosis: Symptomatic severe hypercalcaemia with acute kidney injury, most likely from multiple myeloma (CRAB complete: hyperCalcaemia, Renal failure, Anaemia, Bone lytic lesion)** โดยมี NSAID เป็นปัจจัยซ้ำเติมไต\n\n**กลไกของ hypercalcaemia ใน multiple myeloma**\n- plasma cell ที่เป็นมะเร็งหลั่ง **osteoclast-activating factor** (RANKL, MIP-1α, IL-6, DKK1 ที่ยับยั้ง osteoblast) → **osteoclastic bone resorption เพิ่มขึ้นขณะที่การสร้างกระดูกถูกกด** → **ปล่อย calcium ออกจากกระดูกจำนวนมาก** และเกิด **lytic lesion โดยที่ alkaline phosphatase มักไม่สูง** (ต่างจาก bone metastasis ของมะเร็งแข็ง)\n- (เทียบกับกลไกอื่นของ hypercalcaemia of malignancy: **PTH-rP ใน squamous cell carcinoma, renal cell, breast** = humoral; **calcitriol ที่สร้างโดยเนื้องอกใน lymphoma**; **osteolytic metastasis**)\n\n**กลไกของอาการแต่ละอย่าง (ลูกโซ่จาก hypercalcaemia)**\n- **Polyuria และ polydipsia**: Ca สูงจับ **calcium-sensing receptor ที่ thick ascending limb → ยับยั้ง NKCC2** และ **ทำให้ collecting duct ดื้อต่อ ADH (ลด aquaporin-2)** → **nephrogenic diabetes insipidus** → ปัสสาวะเจือจางปริมาณมาก (spgr 1.008)\n- **Volume depletion → hypotension, orthostatic drop, mucous membrane แห้ง**: จาก polyuria + อาเจียน + กินได้น้อย\n- **AKI**: (1) **prerenal จาก volume depletion** (2) **Ca ทำให้ renal vasoconstriction** (3) **light chain เป็นพิษต่อ tubule และเกิด cast nephropathy (myeloma kidney)** (4) **nephrocalcinosis** (5) **NSAID ที่ลด prostaglandin-mediated afferent vasodilatation** — หลายกลไกซ้อนกัน\n- **วงจรเลวร้าย (vicious cycle)**: volume depletion → ไตดูดซึม Na กลับมากขึ้นที่ proximal tubule → **Ca ถูกดูดกลับตามไปด้วย** → **ขับ Ca ออกได้น้อยลง → Ca ยิ่งสูง → polyuria มากขึ้น** → วนซ้ำ **นี่คือเหตุผลที่การให้สารน้ำเป็นการรักษาลำดับแรก**\n- **ซึมลง สับสน, DTR ลดลง, อ่อนเพลีย**: Ca สูงลด neuronal excitability และ neuromuscular transmission (ตรงข้ามกับ hypocalcaemia ที่เกิด hyperexcitability/tetany)\n- **ท้องผูก คลื่นไส้อาเจียน เบื่ออาหาร**: Ca สูงลด smooth muscle motility ของทางเดินอาหาร\n- **ปวดหลังและกดเจ็บที่ lumbar spine**: **osteolytic lesion** เสี่ยงต่อ **pathological fracture และ spinal cord compression**\n- **ซีด**: จากการที่ plasma cell แทนที่ไขกระดูก, erythropoietin ลดจากไตวาย และ chronic inflammation"}, {"q": "3. จงให้การรักษาภาวะ hypercalcaemia เรียงตามลำดับ และอธิบายว่า normal saline ช่วยลด hypercalcaemia ได้อย่างไร", "a": "**ลำดับการรักษา**\n**1. IV isotonic saline (0.9% NaCl) — ลำดับแรกและสำคัญที่สุด**\nให้ค่อนข้างเร็วในระยะแรก (เช่น 200-300 mL/ชั่วโมง ปรับตามสถานะหัวใจและปัสสาวะ) โดยติดตามสถานะสารน้ำอย่างใกล้ชิด\n\n**2. Calcitonin (subcutaneous/IM) — สำหรับผลเร็วใน 12-48 ชั่วโมง**\nยับยั้ง osteoclast ทันทีและเพิ่มการขับ Ca ทางปัสสาวะ; **เกิด tachyphylaxis ภายใน 48 ชั่วโมง** จึงใช้เป็น **\"สะพาน\" รอให้ bisphosphonate ออกฤทธิ์**\n\n**3. Antiresorptive agent — การรักษาที่ยั่งยืน**\n- **Zoledronic acid IV** (หรือ pamidronate) — ยับยั้ง farnesyl pyrophosphate synthase ใน osteoclast → **หยุด bone resorption ซึ่งเป็นต้นเหตุจริง**; **onset 2-4 วัน, ออกฤทธิ์นาน 2-4 สัปดาห์**; **ต้องให้หลังเติมสารน้ำแล้วและปรับขนาดตาม renal function**\n- ถ้า **ไตเสื่อมรุนแรง** → พิจารณา **denosumab** (anti-RANKL monoclonal antibody) ซึ่ง **ไม่ถูกขับทางไต** แต่ระวัง **hypocalcaemia** ตามหลัง\n\n**4. รักษาโรคต้นเหตุ** — เริ่มการรักษา multiple myeloma (ซึ่งมักใช้ **corticosteroid** เป็นส่วนหนึ่ง และ steroid เองก็ลด Ca ได้ในมะเร็งทางโลหิตวิทยาและในภาวะที่ calcitriol สูง)\n\n**5. หยุดสิ่งที่ซ้ำเติม** — **หยุด NSAID, thiazide (ลดการขับ Ca), calcium และ vitamin D supplement, ยาที่เป็น nephrotoxin** และให้ผู้ป่วยเคลื่อนไหวร่างกายเท่าที่ทำได้ (การนอนนิ่งเพิ่ม bone resorption)\n\n**6. Haemodialysis** — เมื่อ **Ca สูงรุนแรงร่วมกับไตวายที่ให้สารน้ำไม่ได้ (oliguric/volume overload)** หรือมีอาการทางระบบประสาท/หัวใจรุนแรงที่ไม่ตอบสนอง\n\n**7. Loop diuretic (furosemide)** — **ไม่ใช่การรักษาตามกิจวัตรอีกต่อไป**; ใช้เฉพาะเมื่อเกิด **volume overload จากการให้สารน้ำ** — การให้ก่อนหรือขณะที่ยังขาดน้ำจะทำให้ Ca สูงขึ้นและไตแย่ลง\n\n**Normal saline ช่วยลด hypercalcaemia อย่างไร (กลไก 3 ชั้น — เป็นคำถามที่ออกสอบจริง)**\n1. **แก้ volume depletion → เพิ่ม GFR → เพิ่ม filtered load ของ calcium** ที่ถูกกรองออกมา\n2. **ตัดวงจรการดูดซึมกลับที่ proximal tubule**: เมื่อ volume ต่ำ ไตจะดูดซึม Na กลับอย่างเต็มที่ที่ proximal tubule และ **Ca ถูกดูดกลับตามไปด้วยแบบ paracellular (ตาม Na และน้ำ)** → การเติม volume ทำให้ **การดูดซึม Na ลดลง จึงดูดซึม Ca กลับน้อยลง → ขับ Ca ออกทางปัสสาวะมากขึ้น (calciuresis)**\n3. **Sodium load ที่มากับ saline แข่งขันกับการดูดซึมกลับของ calcium** ที่ thick ascending limb ด้วย (Na และ Ca ใช้เส้นทาง paracellular ร่วมกันซึ่งขับเคลื่อนด้วย lumen-positive potential จาก NKCC2) → เสริมการขับ Ca\n\n**ข้อจำกัดที่ต้องเข้าใจ**: saline **ไม่ได้แก้ต้นเหตุคือ bone resorption** → Ca จะกลับสูงอีกถ้าไม่ให้ antiresorptive agent และไม่รักษามะเร็ง"}, {"q": "4. จะส่งตรวจอะไรเพิ่มเพื่อยืนยันการวินิจฉัยโรคต้นเหตุ และต้องเฝ้าระวังภาวะแทรกซ้อนอะไร", "a": "**การตรวจเพื่อยืนยัน multiple myeloma**\n1. **Serum protein electrophoresis (SPEP) + immunofixation** — หา **M-protein (monoclonal spike)**\n2. **Serum free light chain assay (kappa/lambda ratio)** — ไวกว่าและใช้ติดตามโรค โดยเฉพาะใน light chain-only myeloma\n3. **Urine protein electrophoresis + immunofixation (24-hour urine)** — หา **Bence Jones protein** (dipstick ตรวจไม่พบ light chain)\n4. **Quantitative immunoglobulin (IgG, IgA, IgM)**\n5. **Bone marrow aspiration and biopsy** — นับ **clonal plasma cell ≥10%** พร้อม **cytogenetics/FISH** เพื่อประเมินความเสี่ยง\n6. **Peripheral blood smear** — คาดว่าพบ **rouleaux formation** (จาก M-protein ที่ทำให้ RBC เกาะกันเป็นแถว)\n7. **Whole-body imaging**: low-dose whole-body CT, PET-CT หรือ whole-body MRI (ไวกว่า skeletal survey แบบเดิม) เพื่อประเมิน lytic lesion และ extramedullary disease\n8. **Beta-2 microglobulin, LDH, albumin** — สำหรับ **Revised International Staging System (R-ISS)**\n9. **พิจารณา renal biopsy** ถ้าสาเหตุของไตวายไม่ชัด (แยก **light chain cast nephropathy, AL amyloidosis, light chain deposition disease, monoclonal immunoglobulin deposition**)\n10. คัด **amyloidosis**: ตรวจหา macroglossia, carpal tunnel, cardiac involvement (NT-proBNP, troponin, echo) และพิจารณา fat pad/bone marrow Congo red staining\n\n**ภาวะแทรกซ้อนที่ต้องเฝ้าระวังและจัดการ**\n- **Spinal cord compression** — **ภาวะฉุกเฉิน**: ปวดหลังรุนแรง อ่อนแรงขา ชาแบบมีระดับ ปัสสาวะ/อุจจาระราด → **MRI ทั้งแนวกระดูกสันหลังทันที + steroid ขนาดสูง + ปรึกษาศัลยกรรมกระดูกและรังสีรักษาฉุกเฉิน**\n- **Pathological fracture** — จำกัดการลงน้ำหนักที่เสี่ยง, พิจารณา bisphosphonate/denosumab ระยะยาว, ปรึกษาศัลยกรรมกระดูก, ควบคุมความปวดอย่างเหมาะสม (**หลีกเลี่ยง NSAID ในผู้ป่วยไตวาย**)\n- **Myeloma kidney ที่แย่ลง** — ให้สารน้ำเพียงพอ, **หลีกเลี่ยง NSAID และ contrast**, รักษามะเร็งอย่างรวดเร็วเพื่อลด light chain, ปรับขนาดยาทุกตัวตาม renal function, พิจารณาการบำบัดทดแทนไตตามข้อบ่งชี้\n- **Hypercalcaemia ที่กลับเป็นซ้ำ** — ติดตาม Ca อย่างใกล้ชิดและให้ antiresorptive agent ต่อเนื่อง\n- **การติดเชื้อ** — myeloma ทำให้ **humoral immunity บกพร่อง** → เสี่ยง **encapsulated organism (pneumococcus, Haemophilus)**; ให้วัคซีนและเฝ้าระวังอย่างใกล้ชิด (การติดเชื้อเป็นสาเหตุการตายอันดับต้นของ myeloma)\n- **Hyperviscosity syndrome** — ปวดศีรษะ ตามัว เลือดออกตามเยื่อเมือก สับสน (พบมากใน IgA/IgM สูง) → ต้องทำ **plasmapheresis**\n- **Anaemia** — ประเมินและรักษา (เหล็ก, B12/folate, ESA ตามข้อบ่งชี้)\n- **Tumour lysis syndrome** เมื่อเริ่มการรักษา — ให้สารน้ำ, allopurinol และติดตาม K/PO4/Ca/uric acid\n- **Venous thromboembolism** — ความเสี่ยงสูงขึ้นมากถ้าใช้ **immunomodulatory drug (thalidomide/lenalidomide) ร่วมกับ steroid** → ต้องให้ thromboprophylaxis"}], "ref": ["MED32 MEQ ข้อ 2 – Symptomatic hypercalcemia from malignancy with acute kidney injury: 2.4 แปลผลแลปที่ผิดปกติ (anemia, mild hyponatremia, hypokalemia, hypercalcemia) 2.5 definitive diagnosis 2.6 ให้การรักษาภาวะ hypercalcemia 2.7 normal saline ช่วยลด hypercalcemia อย่างไร", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 94 – หญิงแก่ 77 ปี ปวดหลังมาก Hypercalcium ให้อาการ CRAB → Multiple myeloma", "MED30 MCQ ข้อ 38 – Ca สูง มี sign ของ MM (CRAB – Hypercalcemia, Renal failure, Anemia, Osteolytic bone lesion)", "MED34 MCQ ครั้งที่ 4 ข้อ 34 – ให้รูป PBS Rouleaux formation + back pain → multiple myeloma", "MED31 MCQ ข้อ 21 – ปวดหลัง PBS มี RBC เกาะติดกันยาวๆ → multiple myeloma", "MED32 MCQ ข้อ 7 – drowsiness, polyuria, constipation u/d CA bone metastasis → hypercalcemia", "MED31 past paper – ผู้ป่วยอายุ 70 ปี ตรวจสุขภาพพบ Ca 11, PO4 1.1 (choices รวม Malignancy, Familial hypocalciuric hypercalcemia)"], "nl": ["B9.2.5(2)", "B9.2.7(1)", "2.3.2"], "_kind": "meq", "_set": "nephro"}], "osce": [], "date": "พฤ. 17 ก.ย."}], "label": "Nephro", "thai": "ระบบไตและสมดุลเกลือแร่", "accent": {"light": "#14585f", "soft": "#e4eef0", "ink": "#0f464b", "dark": "#58b3b8", "darkSoft": "#10262a", "darkInk": "#8ad2d6"}}]</script>

/* ---------- tiny markdown (เหมือน drill.html) ---------- */
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(t){return esc(t)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");}
function md(src){
  var lines=String(src==null?"":src).split("\n"),out=[],i=0,para=[];
  function flushPara(){if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[];}}
  function flushTable(){
    var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
    if(!rows.length)return;
    var cells=rows.map(function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});});
    var hasSep=cells.length>1&&cells[1].every(function(c){return /^:?-{2,}:?$/.test(c);});
    var head=cells[0],body=hasSep?cells.slice(2):cells.slice(1);
    var h="<div class='tablewrap'><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
    body.forEach(function(r){h+="<tr>"+r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>";});
    out.push(h+"</tbody></table></div>");
  }
  function flushList(ordered){
    var tag=ordered?"ol":"ul",items=[];
    while(i<lines.length){
      var m=ordered?lines[i].match(/^\s*\d+[.)]\s+(.*)$/):lines[i].match(/^\s*[-•]\s+(.*)$/);
      if(!m)break;
      var txt=m[1];i++;
      while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*[-•]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*\|/.test(lines[i])){txt+=" "+lines[i].trim();i++;}
      items.push("<li>"+inline(txt)+"</li>");
    }
    out.push("<"+tag+">"+items.join("")+"</"+tag+">");
  }
  while(i<lines.length){
    var L=lines[i];
    if(/^\s*>\s?/.test(L)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      flushPara();out.push("<div class='callout'>"+md(q.join("\n"))+"</div>");continue;}
    if(/^\s*####\s+/.test(L)){flushPara();out.push("<h4>"+inline(L.replace(/^\s*####\s+/,""))+"</h4>");i++;continue;}
    if(/^\s*###\s+/.test(L)){flushPara();out.push("<h3>"+inline(L.replace(/^\s*###\s+/,""))+"</h3>");i++;continue;}
    if(/^\s*\|/.test(L)){flushPara();flushTable();continue;}
    if(/^\s*[-•]\s+/.test(L)){flushPara();flushList(false);continue;}
    if(/^\s*\d+[.)]\s+/.test(L)){flushPara();flushList(true);continue;}
    if(!L.trim()){flushPara();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();return out.join("");
}

/* ---------- data helpers ---------- */
function course(){return COURSES.filter(function(c){return c.set===state.course;})[0]||COURSES[0];}
function lectures(){return course().lectures;}
function lecOf(id){return lectures().filter(function(l){return l.lec===id;})[0];}
function secOf(lec,id){return (lec?lec.sections:[]).filter(function(s){return s.id===id;})[0];}
function allSections(){var o=[];lectures().forEach(function(l){l.sections.forEach(function(s){o.push({lec:l,sec:s});});});return o;}
function secStat(sec){
  var n=sec.items.length,a=0,ok=0;
  sec.items.forEach(function(it){var v=state.ans[it.id];if(v!=null){a++;if(v===it.answer)ok++;}});
  return {n:n,answered:a,correct:ok,read:!!state.done[sec.id],
          complete:!!state.done[sec.id]&&(n===0||a===n)};
}
function courseProgress(){
  var all=allSections(),done=0;
  all.forEach(function(x){if(secStat(x.sec).complete)done++;});
  return {done:done,total:all.length,pct:all.length?Math.round(done*100/all.length):0};
}
function letter(i){return "ABCDE".charAt(i)||String(i+1);}
function nlChips(codes){
  if(!codes||!codes.length)return "";
  return codes.map(function(c){var e=NL[c];
    return "<span class='chip nl' title='"+esc(e?(e.section+" · หน้า "+e.page):"")+"'>NL "+esc(c)+(e?" · "+esc(e.title):"")+"</span>";}).join(" ");
}

function darkNow(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark")return true; if(t==="light")return false;
  try{return window.matchMedia("(prefers-color-scheme:dark)").matches;}catch(e){return false;}
}
function applyAccent(c){
  var a=c.accent||{},d=darkNow(),r=document.documentElement.style;
  var acc=d?a.dark:a.light, soft=d?a.darkSoft:a.soft, ink=d?a.darkInk:a.ink;
  if(acc)r.setProperty("--accent",acc); if(soft)r.setProperty("--accent-soft",soft);
  if(ink)r.setProperty("--accent-ink",ink);
}
function renderMast(){
  var c=course();

  var h="<section class='card'><div class='eyebrow'>คาบ "+esc(l.lec)+" · "+esc(l.title)+"</div>"+
    "<h2>"+esc(s.title)+"</h2>"+(s.summary?"<p class='lede'>"+esc(s.summary)+"</p>":"")+
    "<div class='meta'>"+(s.minutes?"<span class='chip'>อ่าน ~"+s.minutes+" นาที</span>":"")+
    (s.source?"<span class='chip'>อ้างอิง: "+esc(s.source)+"</span>":"")+nlChips(s.nl)+"</div>"+
    "<div class='prose'>"+md(s.md)+"</div>";
  if(s.pearls&&s.pearls.length)
    h+="<div class='pearls'><h4>จำไปสอบ</h4><ul>"+s.pearls.map(function(p){return "<li>"+inline(p)+"</li>";}).join("")+"</ul></div>";

  h+="<div class='quiz'><div class='qhead'><h3>เช็คความเข้าใจ</h3>"+
     "<span class='chip'>"+s.items.length+" ข้อ</span>"+
     "<span class='chip'>ตอบถูก "+st.correct+"/"+(st.answered||0)+" ที่ทำไปแล้ว</span></div>"+
     "<p class='lede'>ตอบให้ครบทุกข้อเพื่อปิดหัวข้อนี้ — ข้อสอบดึงจากคลัง MED28–MED35 และข้อใหม่ของชุดนี้</p>";
  h+=s.items.map(qHtml).join("");
  if(!s.items.length)h+="<p class='lede'>หัวข้อนี้ยังไม่มีข้อสอบผูกไว้</p>";

  h+="<div class='scorebar'>"+
     (st.answered===st.n&&st.n?("<b>ทำครบแล้ว "+st.correct+"/"+st.n+" ข้อ</b>"+
       (st.correct===st.n?" · เก่งมาก ไปหัวข้อถัดไปได้เลย":" · ข้อที่ผิดอ่านคำอธิบายซ้ำอีกรอบก่อนไปต่อ"))
      :("<b>ทำไปแล้ว "+st.answered+"/"+st.n+" ข้อ</b>"))+
     "<span style='flex:1'></span>"+
     "<button class='btn ghost' data-act='resetsec'>ล้างคำตอบหัวข้อนี้</button>"+
     "<button class='btn "+(st.complete?"":"primary")+"' data-act='markread'>"+(state.done[s.id]?"✓ ทำเครื่องหมายว่าเรียนแล้ว":"ทำเครื่องหมายว่าเรียนแล้ว")+"</button>"+
     "</div>";
  h+="<div class='nav' style='margin-top:14px'>"+
     (idx>0?"<button class='btn' data-goto='"+list[idx-1].sec.id+"' data-golec='"+list[idx-1].lec.lec+"'>← "+esc(list[idx-1].sec.title)+"</button>":"")+
     (idx<list.length-1?"<button class='btn primary' data-goto='"+list[idx+1].sec.id+"' data-golec='"+list[idx+1].lec.lec+"'>"+esc(list[idx+1].sec.title)+" →</button>":"<button class='btn primary' data-tab='meq'>ไปฝึก MEQ ต่อ →</button>")+
     "</div></div></section>";
  return h;
}

function qHtml(it){
  var picked=state.ans[it.id],shown=picked!=null;
  var h="<div class='q' id='q-"+esc(it.id)+"'><div class='qid'>"+esc(it.id)+
        (it.kind==="old"?" · คลังข้อสอบเก่า":"")+(it.topic?" · "+esc(it.topic):"")+"</div>"+
        "<div class='stem'>"+md(it.stem)+"</div><div class='choices'>";
  it.choices.forEach(function(c,i){
    var cls="ch";
    if(shown&&i===it.answer)cls+=" correct";
    else if(shown&&i===picked)cls+=" wrong";
    h+="<button class='"+cls+"' data-q='"+esc(it.id)+"' data-i='"+i+"'"+(shown?" disabled":"")+
       "><span class='k'>"+letter(i)+"</span><span>"+inline(c)+"</span></button>";
  });
  h+="</div>";
  if(shown){
    var ok=picked===it.answer;
    h+="<div class='verdict "+(ok?"ok":"no")+"'>"+(ok?"✓ ถูกต้อง":"✗ ยังไม่ใช่ — เฉลยคือข้อ "+letter(it.answer))+"</div>";
    if(it.explain)h+="<div class='explain prose'>"+md(it.explain)+"</div>";
    if(it.pearl)h+="<div class='pearl'><b>Pearl · </b>"+inline(it.pearl)+"</div>";
    var m=[];
    if(it.src)m.push("<span class='chip'>โพย: "+esc(String(it.src).slice(0,90))+"</span>");
    (it.ref||[]).forEach(function(r){m.push("<span class='chip'>"+esc(r)+"</span>");});
    var nl=nlChips(it.nl);
    if(m.length||nl)h+="<div class='meta'>"+m.join("")+nl+"</div>";
  }
  return h+"</div>";
}

function viewPractice(kind){
  var title=kind==="meq"?"Practice · MEQ":"Practice · OSCE / SAQ";
  var all=[];lectures().forEach(function(l){(kind==="meq"?l.meq:l.osce).forEach(function(it){all.push({l:l,it:it});});});
  if(state.pid){
    var hit=all.filter(function(x){return x.it.id===state.pid;})[0];
    if(hit)return kind==="meq"?viewMeq(hit.l,hit.it):viewOsce(hit.l,hit.it);
  }
  var h="<section class='card'><div class='eyebrow'>"+esc(title)+"</div><h2>"+
    (kind==="meq"?"โจทย์ MEQ — เขียนตอบทีละข้อแล้วเทียบแนวคำตอบ":"สถานี OSCE / SAQ — จับเวลา เขียนตอบ แล้วตรวจตามเกณฑ์")+"</h2>"+
    "<p class='lede'>"+(kind==="meq"
      ? "อ่านโจทย์ให้จบ เขียนคำตอบของตัวเองก่อนกดดูเฉลยเสมอ แล้วให้คะแนนตัวเองตามความตรงของคำตอบ"
      : "กดเริ่มจับเวลาแล้วเขียนตอบให้ทันเวลาเหมือนสอบจริง จากนั้นจึงเปิดเกณฑ์ให้คะแนน")+"</p>";
  lectures().forEach(function(l){
    var items=kind==="meq"?l.meq:l.osce;
    if(!items.length)return;
    h+="<h3>คาบ "+esc(l.lec)+" · "+esc(l.title)+"</h3><div class='grid'>"+items.map(function(it){
      var r=state.rate[it.id];
      return "<button class='tile' data-pid='"+esc(it.id)+"'><b>"+esc(it.topic||it.id)+"</b>"+
        "<span>"+esc(it.station||("MEQ · "+((it.questions||[]).length)+" คำถามย่อย"))+"</span>"+
        "<span class='chip"+(r?" acc":"")+"' style='align-self:flex-start;margin-top:4px'>"+(r?("ประเมินตัวเองแล้ว: "+r):"ยังไม่ได้ทำ")+"</span></button>";
    }).join("")+"</div>";
  });
  return h+"</section>";
}

function viewMeq(l,it){
  var h="<section class='card'><div class='eyebrow'>MEQ · คาบ "+esc(l.lec)+" · "+esc(l.lecture||l.title)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2><div class='vignette'>"+esc(it.vignette)+"</div>";
  (it.questions||[]).forEach(function(q,i){
    var kid=it.id+"#"+i,open=!!state.notes[kid+"!shown"];
    h+="<div class='hr'></div><div class='prose'><strong>"+inline(q.q)+"</strong></div>"+
      "<textarea data-note='"+esc(kid)+"' placeholder='เขียนคำตอบของคุณก่อนดูเฉลย…'>"+esc(state.notes[kid]||"")+"</textarea>"+
      "<div class='nav' style='margin-top:9px'><button class='btn"+(open?"":" primary")+"' data-reveal='"+esc(kid)+"'>"+(open?"ซ่อนแนวคำตอบ":"ดูแนวคำตอบ")+"</button></div>"+
      (open?"<div class='explain prose'>"+md(q.a)+"</div>":"");
  });
  h+="<div class='hr'></div>"+rateBar(it)+
     "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='meq'>← กลับไปเลือกโจทย์อื่น</button></div></section>";
  return h;
}

function viewOsce(l,it){
  var mins=(String(it.station||"").match(/(\d+)\s*นาที/)||[])[1]||5;
  var h="<section class='card'><div class='eyebrow'>OSCE / SAQ · คาบ "+esc(l.lec)+"</div>"+
    "<h2>"+esc(it.topic||it.id)+"</h2>"+
    "<div class='meta'><span class='chip acc'>"+esc(it.station||"")+"</span>"+
    "<span class='timer' id='timer'>"+mins+":00</span>"+
    "<button class='btn' data-timer='"+mins+"'>เริ่มจับเวลา</button></div>"+
    "<div class='vignette'>"+esc(it.instruction)+"</div>"+
    "<textarea data-note='"+esc(it.id)+"' placeholder='เขียนคำตอบของคุณ…'>"+esc(state.notes[it.id]||"")+"</textarea>"+
    "<div class='nav' style='margin-top:10px'><button class='btn"+(state.notes[it.id+"!shown"]?"":" primary")+"' data-reveal='"+esc(it.id)+"'>"+
      (state.notes[it.id+"!shown"]?"ซ่อนเฉลย":"ดูเฉลยและเกณฑ์ให้คะแนน")+"</button></div>"+
    (state.notes[it.id+"!shown"]?"<div class='explain prose'>"+md(it.answer)+"</div>":"")+
    "<div class='hr'></div>"+rateBar(it)+
    "<div class='nav' style='margin-top:14px'><button class='btn' data-pid='' data-back='osce'>← กลับไปเลือกสถานีอื่น</button></div></section>";
  return h;
}

function rateBar(it){
  var r=state.rate[it.id];
  return "<div class='selfrate'><span class='lede'>ประเมินตัวเอง:</span>"+
    ["ตอบได้ครบ","ตอบได้บางส่วน","ยังไม่ได้"].map(function(x){
      return "<button class='btn"+(r===x?" on":"")+"' data-rate='"+esc(it.id)+"' data-val='"+x+"'>"+x+"</button>";
    }).join("")+"</div>";
}

function viewReview(){
  var wrong=[];
  allSections().forEach(function(x){x.sec.items.forEach(function(it){
    var v=state.ans[it.id];if(v!=null&&v!==it.answer)wrong.push({s:x.sec,l:x.lec,it:it});});});
  var h="<section class='card'><div class='eyebrow'>ทบทวน</div><h2>ข้อที่เคยตอบผิด</h2>"+
    "<p class='lede'>รวมทุกข้อที่ตอบผิดไว้ที่เดียว — กด “ล้างคำตอบ” เพื่อกลับไปทำใหม่แบบไม่เห็นเฉลย</p>";
  if(!wrong.length)return h+"<p class='lede'>ยังไม่มีข้อที่ตอบผิด — เริ่มทำข้อในหัวข้อต่าง ๆ ก่อน</p></section>";
  h+="<div class='meta'><span class='chip acc'>"+wrong.length+" ข้อ</span>"+
     "<button class='btn ghost' data-act='resetwrong'>ล้างคำตอบทุกข้อที่ผิด</button></div>";
  var byLec={};wrong.forEach(function(w){(byLec[w.l.lec]=byLec[w.l.lec]||[]).push(w);});
  Object.keys(byLec).forEach(function(lc){
    h+="<h3>คาบ "+esc(lc)+" · "+esc(lecOf(lc).title)+"</h3>";
    byLec[lc].forEach(function(w){h+="<div class='lede' style='margin-top:10px'>หัวข้อ: "+esc(w.s.title)+"</div>"+qHtml(w.it);});
  });
  return h+"</section>";
}

/* ---------- render ---------- */
function render(){
  renderMast();renderOutline();
  var m=document.getElementById('main'),h;
  if(state.view==="section")h=viewSection();
  else if(state.view==="meq")h=viewPractice("meq");
  else if(state.view==="osce")h=viewPractice("osce");
  else if(state.view==="review")h=viewReview();
  else if(state.view==="learn"){h=viewHome();}
  else h=viewHome();
  m.innerHTML=h;
  save();
}

function openSection(lec,sec){state.view="section";state.lec=lec;state.sec=sec;render();window.scrollTo({top:0});}
function firstUnfinished(){
  var list=allSections();
  for(var i=0;i<list.length;i++)if(!secStat(list[i].sec).complete)return list[i];
  return list[0];
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==="themeBtn"){
    var cur=document.documentElement.getAttribute("data-theme");
    var nx=cur==="dark"?"light":(cur==="light"?"":"dark");
    if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
    state.theme=nx;save();return;
  }
  if(t.dataset.course){
    if(t.dataset.course!==state.course){
      state.course=t.dataset.course;state.view="home";state.lec=null;state.sec=null;state.pid=null;
      render();window.scrollTo({top:0});
    }
    return;
  }
  if(t.dataset.tab){
    state.view=t.dataset.tab;state.pid=null;
    if(state.view==="learn"){var f=firstUnfinished();openSection(f.lec.lec,f.sec.id);return;}
    render();window.scrollTo({top:0});return;
  }
  if(t.dataset.go==="next"){var f2=firstUnfinished();openSection(f2.lec.lec,f2.sec.id);return;}
  if(t.dataset.lec){state.lec=(state.lec===t.dataset.lec?null:t.dataset.lec);renderOutline();save();return;}
  if(t.dataset.sec){openSection(t.dataset.slec,t.dataset.sec);return;}
  if(t.dataset.goto){openSection(t.dataset.golec,t.dataset.goto);return;}
  if(t.dataset.q){
    if(state.ans[t.dataset.q]==null){
      state.ans[t.dataset.q]=+t.dataset.i;
      var sec=secOf(lecOf(state.lec),state.sec);
      if(sec&&secStat(sec).answered===sec.items.length)state.done[sec.id]=true;
      var id=t.dataset.q;render();
      var el=document.getElementById('q-'+id);if(el)el.scrollIntoView({block:"nearest"});
    }
    return;
  }
  if(t.dataset.act==="markread"){state.done[state.sec]=!state.done[state.sec];render();return;}
  if(t.dataset.act==="resetsec"){
    var s2=secOf(lecOf(state.lec),state.sec);
    s2.items.forEach(function(it){delete state.ans[it.id];});delete state.done[s2.id];render();return;
  }
  if(t.dataset.act==="resetwrong"){
    allSections().forEach(function(x){x.sec.items.forEach(function(it){
      if(state.ans[it.id]!=null&&state.ans[it.id]!==it.answer){delete state.ans[it.id];delete state.done[x.sec.id];}});});
    render();return;
  }
  if(t.dataset.pid!==undefined&&t.dataset.pid!==""){state.pid=t.dataset.pid;render();window.scrollTo({top:0});return;}
  if(t.dataset.back){state.pid=null;state.view=t.dataset.back;render();window.scrollTo({top:0});return;}
  if(t.dataset.reveal){var k=t.dataset.reveal+"!shown";state.notes[k]=!state.notes[k];render();return;}
  if(t.dataset.rate){state.rate[t.dataset.rate]=t.dataset.val;render();return;}
  if(t.dataset.timer){startTimer(+t.dataset.timer);return;}
});
document.addEventListener('input',function(e){
  var ta=e.target;if(ta.tagName!=="TEXTAREA"||!ta.dataset.note)return;
  state.notes[ta.dataset.note]=ta.value;save();
});
var timer=null;
function startTimer(mins){
  if(timer)clearInterval(timer);
  var left=mins*60,el=document.getElementById('timer');
  timer=setInterval(function(){
    left--;el=document.getElementById('timer');
    if(!el){clearInterval(timer);timer=null;return;}
    if(left<=0){clearInterval(timer);timer=null;el.textContent="หมดเวลา";return;}
    el.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  },1000);
}
render();
})();
</script>
