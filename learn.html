มกับความเสี่ยงสูงจาก **FRAX**\n\n### สิ่งที่ต้องทำเมื่อพบ fragility fracture\n1. **ตรวจหาสาเหตุทุติยภูมิ** — CBC, Ca, PO4, ALP, Cr, **25-OH vitamin D**, TSH, PTH, โปรตีนในเลือดและปัสสาวะ (มองหา multiple myeloma), testosterone ในผู้ชาย, คัดกรองโรคตับและการดูดซึมผิดปกติ\n2. **แก้ปัจจัยเสี่ยง** — งดบุหรี่และสุรา ทบทวนยา (**steroid ยาว, PPI, anticonvulsant, heparin, aromatase inhibitor, androgen deprivation**) ประเมินความเสี่ยงล้ม ตรวจสายตา ทบทวนยาที่ทำให้มึนงง\n3. **แคลเซียม 1,000–1,200 mg/วัน และวิตามินดี 800–1,000 IU/วัน** ร่วมกับการออกกำลังกายแบบลงน้ำหนัก\n4. **เริ่มยาต้านการสลายกระดูก** — **bisphosphonate เป็นอันดับแรก** (alendronate สัปดาห์ละครั้ง หรือ zoledronic acid ปีละครั้งเมื่อกินยาไม่ได้) · denosumab เมื่อไตเสื่อม · **teriparatide/romosozumab เมื่อเสี่ยงสูงมากหรือหักซ้ำระหว่างรักษา**\n- **ต้องแก้ระดับวิตามินดีและแคลเซียมให้ปกติก่อนให้ยากลุ่ม bisphosphonate หรือ denosumab** มิฉะนั้นเกิด hypocalcemia รุนแรงได้\n- **ห้ามหยุด denosumab เฉย ๆ** — ต้องต่อด้วยยาอื่นเพราะมีการสูญเสียมวลกระดูกอย่างรวดเร็วและกระดูกสันหลังหักหลายระดับ\n- ผู้ที่ได้ **prednisolone ≥ 2.5–7.5 mg/วัน นาน ≥ 3 เดือน** ต้องประเมินและมักต้องเริ่มยาป้องกันกระดูกพรุนตั้งแต่ต้น\n", "pearls": ["กระดูกสะโพกหรือสันหลังหักจากล้มระดับพื้นในคนอายุ ≥ 50 ปี = osteoporosis ไม่ต้องรอ BMD", "ก่อนให้ bisphosphonate ต้องแก้วิตามินดีและแคลเซียมให้พอก่อน", "หยุด denosumab โดยไม่มียาต่อ = เสี่ยงกระดูกสันหลังหักหลายระดับ"], "items": [{"id": "AIR-MCQ-30", "kind": "mcq", "stem": "A 68-year-old woman sustains a wrist fracture after falling from standing height. She has taken prednisolone 7.5 mg daily for 3 years for rheumatoid arthritis. Bone mineral density T-score at the femoral neck is -2.7. Serum calcium, phosphate and creatinine are normal. Which of the following is the most appropriate management?", "choices": ["Start calcitonin nasal spray as first-line therapy", "Start an oral bisphosphonate with calcium and vitamin D, and review the need for continued corticosteroid", "Start calcium and vitamin D supplements alone", "Start denosumab only after two further fragility fractures", "Repeat bone mineral density in 2 years before starting any drug"], "answer": 1, "explain": "**กระดูกหักจากแรงกระแทกต่ำ (fragility fracture) ในผู้สูงอายุ = osteoporosis ทางคลินิก ต้องรักษาทันที ไม่ว่าค่า BMD จะเป็นเท่าไร** และเคสนี้ยังมี **glucocorticoid-induced osteoporosis** ซ้อนอยู่ (prednisolone ตั้งแต่ 2.5–7.5 mg/วันนานเกิน 3 เดือน เพิ่มความเสี่ยงกระดูกหักชัดเจน โดยเสี่ยงเพิ่มตั้งแต่ก่อน BMD จะลด เพราะสเตียรอยด์ลด bone formation และเพิ่ม apoptosis ของ osteocyte)\n\n**การรักษา** — **bisphosphonate เป็นยาหลัก** (alendronate/risedronate สัปดาห์ละครั้ง หรือ zoledronate ปีละครั้ง) ร่วมกับแคลเซียม 1,000–1,200 mg และวิตามินดี และต้องพยายามลดขนาดสเตียรอยด์ให้ต่ำที่สุดเท่าที่คุมโรคได้\n\n**ทำไมข้ออื่นผิด**\n- **แคลเซียมและวิตามินดีอย่างเดียว** ไม่ลดการหักซ้ำในผู้ที่มี fracture แล้ว เป็นเพียงยาเสริมพื้นฐาน\n- **รอวัด BMD ซ้ำอีก 2 ปี** เสียเวลาในผู้ที่หักแล้วซึ่งเสี่ยงหักซ้ำสูงสุดในปีแรก\n- **รอให้หักอีก 2 ครั้ง** ไม่มีแนวทางใดแนะนำ\n- **Calcitonin** ประสิทธิภาพต่ำและมีข้อกังวลเรื่องมะเร็ง ไม่ใช่ first line", "pearl": "หักจากล้มระดับพื้น = รักษา osteoporosis **ทันที**; ได้สเตียรอยด์ ≥ 2.5–7.5 mg นานกว่า 3 เดือน ต้องประเมินกระดูกทุกราย", "topic": "Osteoporosis after fragility fracture", "src": "", "ref": ["MED31 โพย MCQ osteoporosis", "ACR Glucocorticoid-Induced Osteoporosis Guideline 2022"], "nl": ["B5.2.5(2)", "2.3.13(6)", "B5.4(5)"]}]}], "date": "TBD — แก้ใน config.lectures"}, {"lec": "33", "title": "Connective tissue disease, vasculitis and inflammatory arthritis", "subtitle": "SLE และ lupus nephritis · APS · systemic sclerosis · myositis · PMR/GCA · ANCA และ IgA vasculitis · RA · spondyloarthritis · Still disease", "objectives": ["เลือกและแปลผล autoantibody ให้ถูกจังหวะ — รู้ว่าอะไรใช้คัดกรอง อะไรใช้ยืนยัน และอะไรบอกการกำเริบ", "วินิจฉัย SLE ระบุอวัยวะที่ถูกทำลาย และรู้ข้อบ่งชี้ของการเจาะชิ้นเนื้อไต", "แยกการกำเริบของโรคออกจากการติดเชื้อในผู้ป่วยที่ได้ยากดภูมิคุ้มกัน", "จับภาวะฉุกเฉินทางรูมาติก — scleroderma renal crisis, GCA, ANCA vasculitis ที่มีเลือดออกในปอดหรือไตวายเร็ว", "เริ่ม DMARD ใน RA ให้เร็วภายในหน้าต่างเวลา และรู้พิษของยาที่ต้องเฝ้าระวัง"], "meq": [{"id": "AIR-MEQ-02", "part": "MEQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "Systemic lupus erythematosus with lupus nephritis", "vignette": "ผู้ป่วยหญิงไทยอายุ 24 ปี นักศึกษา มาโรงพยาบาลด้วยบวมหน้าและขาสองข้าง 2 สัปดาห์ก่อนมาโรงพยาบาล\nPI: 3 เดือนก่อนมีผื่นแดงที่โหนกแก้มสองข้างเป็นมากขึ้นเมื่อออกแดด ผมร่วง ปวดข้อนิ้วมือและข้อมือสองข้างตอนเช้าประมาณ 1 ชั่วโมง มีแผลในปากไม่เจ็บเป็น ๆ หาย ๆ อ่อนเพลีย น้ำหนักลด 4 กิโลกรัม 2 สัปดาห์ก่อนเริ่มบวมรอบตาตอนเช้าและบวมขาสองข้าง ปัสสาวะเป็นฟองมากขึ้น ไม่มีไข้สูง ไม่มีเจ็บหน้าอก ไม่เหนื่อย\nU/D: ปฏิเสธโรคประจำตัว ไม่เคยตั้งครรภ์ ประจำเดือนปกติ\nยาที่ใช้: ยาแก้ปวดพาราเซตามอลเป็นครั้งคราว ไม่ได้ใช้สมุนไพร\nPE: GA: หญิงสาว ดูอ่อนเพลีย ไม่ซีดมาก\nV/S: BT 37.4 C, PR 92/min, RR 20/min, BP 152/96 mmHg, BW 54 kg (เพิ่มจาก 51 kg ใน 2 สัปดาห์)\nSkin: malar rash เว้นร่อง nasolabial, ไม่มี discoid lesion, ผมบาง\nOral: aphthous ulcer ที่เพดานแข็ง 2 แผล ไม่เจ็บ\nLung: clear both lungs; Heart: normal S1 S2 no murmur no rub\nAbdomen: soft, no hepatosplenomegaly, shifting dullness negative\nExtremities: pitting edema 2+ ทั้งสองข้าง, ข้อ MCP และ PIP บวมกดเจ็บเล็กน้อย ไม่มี deformity\nLab: Hb 9.6 g/dL (MCV 88), WBC 3,200 /uL (N 68%, L 22%), Plt 118,000 /uL, reticulocyte 1.2%\nBUN 24 mg/dL, Cr 1.4 mg/dL (eGFR 48), albumin 2.6 g/dL, cholesterol 288 mg/dL\nUA: protein 3+, RBC 20-30/HPF (dysmorphic), WBC 5-10/HPF, **RBC cast 2-3/LPF**\nUrine protein-creatinine ratio 3.8 g/g", "questions": [{"q": "1. จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด พร้อมข้อมูลสนับสนุนจากประวัติ ตรวจร่างกาย และแล็บ", "a": "**Systemic lupus erythematosus ที่มี lupus nephritis (nephritic-nephrotic picture)**\nข้อมูลสนับสนุน\n- **ผิวหนัง/เยื่อบุ**: malar rash ที่เว้นร่อง nasolabial, photosensitivity, ผมร่วง, แผลในปากที่ไม่เจ็บ\n- **ข้อ**: polyarthritis สมมาตรที่ข้อเล็ก ฝืดเช้า 1 ชั่วโมง ไม่มี deformity\n- **เลือด**: leukopenia + lymphopenia + thrombocytopenia + anemia (cytopenia หลายซีรีส์)\n- **ไต**: ความดันสูง, บวม, โปรตีนรั่วระดับ nephrotic (UPCR 3.8 g/g), **active sediment ที่มี dysmorphic RBC และ RBC cast** = glomerulonephritis, Cr สูงขึ้น\n- อายุและเพศเข้าได้ (หญิงวัยเจริญพันธุ์)"}, {"q": "2. จงส่งการตรวจเพิ่มเติมเพื่อยืนยันการวินิจฉัยและประเมินความรุนแรง พร้อมเหตุผล อย่างน้อย 5 อย่าง", "a": "1) **ANA** — คัดกรอง ความไวสูงมาก ถ้าลบแทบตัด SLE ออก\n2) **Anti-dsDNA และ anti-Smith** — จำเพาะต่อ SLE; anti-dsDNA สัมพันธ์กับไตอักเสบและใช้ติดตามโรค\n3) **Complement C3, C4** — ต่ำเมื่อโรค active จากการใช้ complement ไปกับ immune complex\n4) **Direct Coombs test, LDH, haptoglobin, blood smear** — ประเมิน autoimmune hemolytic anemia และแยก microangiopathy\n5) **Antiphospholipid antibodies (LA, anticardiolipin, anti-β2GPI)** — มีผลต่อความเสี่ยงลิ่มเลือดและการตั้งครรภ์\n6) **24-hour urine protein หรือ UPCR (มีแล้ว), urine microscopy ซ้ำ, ultrasound ไต** — ประเมินไตก่อน biopsy\n7) **Renal biopsy** — เพื่อจัดชั้น ISN/RPS ซึ่งกำหนดแผนการรักษา\n8) ตรวจพื้นฐานก่อนให้ยากดภูมิ: **CXR, anti-HIV, HBsAg/anti-HBc, anti-HCV, ตรวจวัณโรคแฝง, urine pregnancy test**"}, {"q": "3. ผล ANA 1:1280 speckled, anti-dsDNA บวกสูง, C3 46 mg/dL (ต่ำ), C4 8 mg/dL (ต่ำ) — ผล renal biopsy: diffuse proliferative glomerulonephritis (class IV) with activity index สูง จงวางแผนการรักษา", "a": "**Induction therapy** (เป้าหมาย: หยุดการอักเสบของไตให้เร็วที่สุด)\n- **Corticosteroid**: pulse methylprednisolone 500 mg IV วันละครั้ง 3 วัน แล้วตามด้วย prednisolone 0.5–1 mg/kg/วัน ค่อย ๆ ลดขนาด\n- **ร่วมกับยากดภูมิ**: **mycophenolate mofetil 2–3 g/วัน** หรือ **cyclophosphamide (Euro-Lupus low dose 500 mg IV ทุก 2 สัปดาห์ 6 ครั้ง)** — เลือก MMF ในหญิงวัยเจริญพันธุ์ที่ยังต้องการมีบุตร เพราะ cyclophosphamide ทำให้รังไข่เสื่อม (ถ้าจำเป็นต้องใช้ให้พิจารณา GnRH agonist ป้องกัน)\n- พิจารณาเพิ่ม **belimumab หรือ voclosporin** ตามแนวทางปัจจุบัน\n**การรักษาเสริมที่ต้องมีทุกราย**\n- **Hydroxychloroquine 5 mg/kg/วัน** — ลด flare, ลดการเกิดลิ่มเลือด, เพิ่มอัตรารอด (ตรวจตาตามแนวทาง)\n- **ACEI หรือ ARB** ลดโปรตีนรั่วและคุมความดัน เป้าหมาย < 130/80\n- ควบคุมไขมัน, งดบุหรี่, กันแดด (ครีมกันแดด SPF สูง เสื้อแขนยาว)\n- **ป้องกัน PCP ด้วย TMP-SMX** เมื่อได้สเตียรอยด์ขนาดสูงร่วมกับยากดภูมิ, ประเมินกระดูกและให้แคลเซียม/วิตามินดี\n- คุมกำเนิดที่เหมาะสมระหว่างโรค active และระหว่างได้ยาที่เป็น teratogen"}, {"q": "4. หลังได้สเตียรอยด์ขนาดสูงและ MMF 6 สัปดาห์ ผู้ป่วยกลับมาด้วยไข้ 38.5 C ไอแห้ง เหนื่อย SpO2 89% room air, CXR มีฝ้า interstitial สองข้าง จงให้การวินิจฉัยแยกโรคและการจัดการเบื้องต้น", "a": "**ต้องคิดถึงการติดเชื้อฉวยโอกาสก่อนโรคกำเริบเสมอ**\nวินิจฉัยแยกโรค: **Pneumocystis jirovecii pneumonia** (เข้าได้มากที่สุด: ไอแห้ง ขาดออกซิเจนมากกว่าที่ฟังปอดได้ ฝ้า interstitial LDH สูง), วัณโรคปอด, การติดเชื้อไวรัส/CMV, **lupus pneumonitis หรือ diffuse alveolar hemorrhage** (แต่ต้องตัดการติดเชื้อออกก่อน), ปอดบวมจากแบคทีเรียทั่วไป\nการจัดการ: ให้ออกซิเจน, ส่ง induced sputum/BAL หา PCP และ AFB, เพาะเชื้อ, ส่ง LDH, **เริ่ม TMP-SMX ขนาดรักษาทันทีโดยไม่รอผล** และเพิ่มสเตียรอยด์เสริมเมื่อ PaO2 < 70 mmHg, ทบทวน/ชะลอยากดภูมิ, ตรวจ HIV\n**ห้ามเพิ่มยากดภูมิเพราะคิดว่าเป็น flare จนกว่าจะตัดการติดเชื้อออก**"}, {"q": "5. ผู้ป่วยถามว่าจะตั้งครรภ์ได้หรือไม่ ท่านจะให้คำแนะนำอย่างไร", "a": "- **ไม่ควรตั้งครรภ์ขณะโรค active โดยเฉพาะไตอักเสบ** เพราะเสี่ยง preeclampsia, แท้ง, ทารกโตช้า, คลอดก่อนกำหนด และ SLE กำเริบ\n- แนะนำให้ **โรคสงบอย่างน้อย 6 เดือน** และไตทำงานคงที่ก่อนวางแผนตั้งครรภ์\n- ต้อง **เปลี่ยนยาที่เป็น teratogen** ก่อนตั้งครรภ์: หยุด MMF (เปลี่ยนเป็น **azathioprine**), หยุด cyclophosphamide, methotrexate, ACEI/ARB\n- ยาที่ **ใช้ต่อได้และควรใช้** ระหว่างตั้งครรภ์: **hydroxychloroquine** (ลด flare และลดความเสี่ยง congenital heart block), prednisolone ขนาดต่ำ, azathioprine, และ **low-dose aspirin ตั้งแต่ไตรมาสแรกเพื่อลด preeclampsia**\n- ตรวจ **anti-SSA/SSB** เพราะสัมพันธ์กับ neonatal lupus และ congenital heart block ต้องเฝ้าติดตามการเต้นหัวใจทารก และตรวจ antiphospholipid antibody เพื่อวางแผนป้องกันลิ่มเลือด\n- ระหว่างยังไม่พร้อม ให้คุมกำเนิดที่เหมาะสม (หลีกเลี่ยงฮอร์โมนเอสโตรเจนเมื่อมี antiphospholipid antibody บวกหรือโรค active)"}], "ref": ["MED34 โพย MCQ/MEQ SLE with lupus nephritis", "EULAR/ACR SLE 2019; KDIGO Glomerular Diseases 2021"], "nl": ["2.3.13-3(15)", "B5.2.2-3(5)", "B5.3(5)", "2.3.3-3(5)", "2.1.50"], "_kind": "meq", "_set": "air"}, {"id": "AIR-MEQ-04", "part": "MEQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "Polyarthritis — approach and early rheumatoid arthritis", "vignette": "ผู้ป่วยหญิงไทยอายุ 46 ปี แม่ค้า มาโรงพยาบาลด้วยปวดข้อมือและข้อนิ้วมือสองข้าง 3 เดือนก่อนมาโรงพยาบาล\nPI: เริ่มปวดและบวมที่ข้อนิ้วมือสองข้างพร้อม ๆ กัน ต่อมาลามมาที่ข้อมือและข้อเท้า ข้อฝืดตอนตื่นนอนนานประมาณ 1 ชั่วโมงครึ่ง ต้องแช่น้ำอุ่นจึงขยับได้ อาการดีขึ้นเมื่อได้ขยับใช้งาน แต่แย่ลงเมื่ออยู่นิ่ง กำมือไม่ถนัด หยิบของหลุด อ่อนเพลีย ไม่มีไข้สูง ไม่มีผื่น ไม่มีแผลในปาก ไม่มีตาแดง ไม่มีปัสสาวะผิดปกติ ไม่มีท้องเสียหรือการติดเชื้อนำมาก่อน\nU/D: ปฏิเสธโรคประจำตัว\nประวัติอื่น: สูบบุหรี่ 10 มวน/วัน 20 ปี ไม่ดื่มสุรา มารดาเป็นโรคข้ออักเสบรูมาตอยด์\nPE: V/S: BT 37.2 C, PR 84/min, RR 18/min, BP 126/78 mmHg\nHand: บวมกดเจ็บที่ MCP ที่ 2-4 และ PIP ทั้งสองข้างสมมาตร, ข้อมือบวมทั้งสองข้าง, squeeze test บวก, **ไม่พบการอักเสบที่ DIP**, ยังไม่มี deformity\nSkin: ไม่มีผื่น ไม่มี subcutaneous nodule\nLung/Heart/Abdomen: ปกติ\nLab: Hb 10.8 g/dL (MCV 86), WBC 8,600 /uL, Plt 452,000 /uL, ESR 62 mm/hr, CRP 38 mg/L, Cr 0.8 mg/dL, AST/ALT 22/26 U/L, uric acid 4.2 mg/dL", "questions": [{"q": "1. จงอธิบายลักษณะของข้ออักเสบรายนี้ (จำนวนข้อ ความสมมาตร ชนิดของอาการ) และให้การวินิจฉัยแยกโรค 4 โรค", "a": "**ลักษณะ**: chronic **symmetric polyarthritis** ของข้อเล็กที่มือ (MCP, PIP) และข้อมือ นานเกิน 6 สัปดาห์ ร่วมกับ **inflammatory pattern** (ฝืดเช้า > 1 ชั่วโมง ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก) และมี systemic inflammation (ESR/CRP สูง, anemia of chronic disease, thrombocytosis)\n**วินิจฉัยแยกโรค**\n1) **Rheumatoid arthritis** — เข้าได้มากที่สุด: ตำแหน่ง MCP/PIP/ข้อมือ สมมาตร เว้น DIP, ฝืดเช้านาน, ประวัติครอบครัว, สูบบุหรี่ (ปัจจัยเสี่ยงสำคัญ)\n2) **SLE** — ให้ polyarthritis สมมาตรได้เช่นกัน ต้องหาอาการระบบอื่น (ผื่น แผลในปาก ไต เม็ดเลือดต่ำ)\n3) **Psoriatic arthritis** — มองหาผื่นสะเก็ดเงิน เล็บผิดปกติ dactylitis และการเป็นที่ DIP\n4) **Viral arthritis (chikungunya, parvovirus B19, hepatitis B/C) หรือ polyarticular gout/CPPD** — ไวรัสมักหายใน 6 สัปดาห์; เก๊าท์หลายข้อพบในผู้สูงอายุที่เป็นมานาน"}, {"q": "2. จงส่งตรวจเพิ่มเติมพร้อมเหตุผล", "a": "1) **RF และ anti-CCP** — anti-CCP จำเพาะต่อ RA สูง (> 95%) และทำนายโรครุนแรง/erosion\n2) **ANA** (และ anti-dsDNA ถ้า ANA บวก) — แยก SLE\n3) **Plain film มือและเท้าสองข้าง** — หา periarticular osteopenia, marginal erosion, ช่องข้อแคบ (เท้ามัก erode ก่อนมือ) ใช้เป็นภาพพื้นฐานเปรียบเทียบ\n4) **Ultrasound หรือ MRI ข้อ** เมื่อภาพรังสียังปกติ เพื่อยืนยัน synovitis/erosion ระยะแรก\n5) **พื้นฐานก่อนเริ่ม DMARD**: CBC, LFT, creatinine, **HBsAg/anti-HBc, anti-HCV, anti-HIV, CXR และคัดกรองวัณโรคแฝง**, urine pregnancy test\n6) ตรวจไวรัสตามบริบทระบาด (chikungunya/dengue) ถ้าประวัติเข้าได้"}, {"q": "3. ผล anti-CCP บวกสูง RF บวก ANA ลบ ภาพรังสีพบ periarticular osteopenia ที่ MCP ยังไม่มี erosion จงวางแผนการรักษาและอธิบายแนวคิด treat-to-target", "a": "**วินิจฉัย: rheumatoid arthritis (seropositive) ระยะแรก ยังไม่มี erosion — อยู่ใน window of opportunity**\n**แผนการรักษา**\n1) เริ่ม **methotrexate 10–15 mg สัปดาห์ละครั้ง** (ย้ำว่า **สัปดาห์ละครั้ง ไม่ใช่ทุกวัน**) ปรับขึ้นตามการตอบสนองถึง 20–25 mg/สัปดาห์ ร่วมกับ **folic acid 5 mg/สัปดาห์** (คนละวันกับ methotrexate)\n2) **Bridging corticosteroid** — prednisolone ขนาดต่ำระยะสั้น หรือฉีดเข้าข้อ แล้วลดจนหยุดภายใน 3 เดือน\n3) NSAID ตามอาการปวด (ไม่ใช่ยาปรับโรค)\n4) **แนะนำเลิกบุหรี่** — บุหรี่ทำให้โรครุนแรงขึ้นและลดการตอบสนองต่อยา\n5) กายภาพบำบัด ออกกำลังกาย ป้องกันข้อผิดรูป และประเมินความเสี่ยงหัวใจและหลอดเลือด (RA เพิ่มความเสี่ยงชัดเจน)\n**Treat-to-target**: ตั้งเป้าให้โรค **remission หรือ low disease activity** วัดด้วยดัชนีเช่น DAS28/CDAI **ประเมินทุก 1–3 เดือน** ถ้ายังไม่ถึงเป้าให้ปรับการรักษาทันที (เพิ่มขนาด, เปลี่ยน/เพิ่ม conventional DMARD, หรือเพิ่ม biologic/JAK inhibitor) ไม่ปล่อยให้โรค active ลอยไปเป็นปี"}, {"q": "4. ผู้ป่วยกลับมาหลังใช้ methotrexate 8 สัปดาห์ ด้วยแผลในปากหลายแผล คลื่นไส้ และ WBC 2,900 /uL จงอธิบายกลไกและการจัดการ", "a": "**กลไก**: methotrexate เป็น folate antagonist — พิษต่อเยื่อบุ (mucositis) และไขกระดูกเกิดจากการขาด folate ในเซลล์ที่แบ่งตัวเร็ว ปัจจัยส่งเสริมคือ **ลืมกิน folic acid**, ไตเสื่อม, ขนาดยาสูงเกินไป, **กินยาผิดเป็นทุกวันแทนสัปดาห์ละครั้ง** และยาที่เสริมฤทธิ์เช่น **trimethoprim-sulfamethoxazole** หรือ NSAID ขนาดสูง\n**การจัดการ**\n1) **หยุด methotrexate ทันที** และทบทวนว่าผู้ป่วยกินยาถูกวิธีหรือไม่ (ถามให้ชัดว่ากินสัปดาห์ละกี่เม็ด วันไหน)\n2) ให้ **folinic acid (leucovorin)** เมื่อ cytopenia ชัดเจน; ดูแลแผลในปาก ให้สารน้ำและอาหารอ่อน\n3) ตรวจ CBC, LFT, creatinine ซ้ำ และเฝ้าระวังการติดเชื้อ (ถ้าไข้ร่วมกับ neutropenia ให้ยาปฏิชีวนะทันที)\n4) เมื่อค่าเลือดกลับปกติ พิจารณาเริ่มใหม่ในขนาดต่ำลง **พร้อม folic acid ที่ถูกต้อง** หรือเปลี่ยนเป็น DMARD ตัวอื่น (sulfasalazine, leflunomide) และหลีกเลี่ยงยาที่เสริมฤทธิ์"}], "ref": ["MED33 โพย Joint ข้อ 2 'ปวดข้อนิ้วมือ MCP, PIP สองข้างเท่ากัน ปวดมากขึ้นตอนเช้า'", "ACR RA Treatment Guideline 2021"], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "B5.3(5)", "B5.4(3)", "2.1.27"], "_kind": "meq", "_set": "air"}], "osce": [{"id": "AIR-OSCE-02", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Palpable purpura", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ชายไทยอายุ 19 ปี มาด้วยผื่นที่ขาสองข้าง 3 วัน ร่วมกับปวดท้องบิดเป็นพัก ๆ และปวดข้อเท้าสองข้าง 1 สัปดาห์ก่อนหน้านี้เป็นไข้หวัด\nให้ภาพถ่ายผื่น: ผื่นจุดเลือดออกสีแดงคล้ำ ขนาด 2–5 มิลลิเมตร กระจายที่หน้าแข้งและก้นทั้งสองข้าง **คลำได้นูน** กดไม่จาง\nผลตรวจ: Plt 320,000 /uL, PT/aPTT ปกติ, UA: protein 1+, RBC 20–30/HPF\n\n3.1 จงบรรยายลักษณะผื่นที่เห็นด้วยศัพท์ทางการแพทย์ (2 คะแนน)\n3.2 การที่ผื่น 'คลำได้นูน' ร่วมกับเกล็ดเลือดปกติ บอกกลไกอะไร (2 คะแนน)\n3.3 จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด พร้อมเหตุผล (2 คะแนน)\n3.4 จงบอกการตรวจที่ต้องติดตามและภาวะแทรกซ้อนที่กำหนดพยากรณ์โรค (2 คะแนน)\n3.5 จงให้การวินิจฉัยแยกโรคของ palpable purpura มาอีก 3 โรค (2 คะแนน)", "answer": "**3.1 บรรยายผื่น (2 คะแนน)** — **palpable purpura**: จุดเลือดออกสีแดงคล้ำถึงม่วง ขนาด 2–5 มม. **กดไม่จาง (non-blanching)** **คลำได้นูนเหนือผิวหนัง** กระจายแบบสมมาตรบริเวณ **dependent area** (หน้าแข้ง ก้น) บางจุดรวมกันเป็นปื้น\n\n**3.2 กลไก (2 คะแนน)**\n- **กดไม่จาง** = เลือดออกนอกหลอดเลือดแล้ว (extravasated RBC) ไม่ใช่หลอดเลือดขยาย\n- **คลำได้นูน** = มีการอักเสบและเซลล์อักเสบแทรกในผนังหลอดเลือด (**leukocytoclastic vasculitis**) ทำให้ผนังบวมหนา\n- **เกล็ดเลือดและการแข็งตัวปกติ** = ไม่ใช่ ITP, DIC หรือความผิดปกติของการแข็งตัวของเลือด (ซึ่งจ้ำจะ **ราบ** ไม่นูน)\n\n**3.3 การวินิจฉัย (2 คะแนน)** — **IgA vasculitis (Henoch-Schonlein purpura)** จาก tetrad: palpable purpura ที่ขาและก้น + ปวดข้อ + ปวดท้องบิด + ไตอักเสบ (โปรตีนและเม็ดเลือดแดงในปัสสาวะ) เกิดตามหลังการติดเชื้อทางเดินหายใจส่วนบน\n\n**3.4 การติดตาม (2 คะแนน)** — **ไตคือตัวกำหนดพยากรณ์โรค** ต้องตรวจ **urinalysis และวัดความดันโลหิตเป็นระยะ** (ทุก 1–2 สัปดาห์ในเดือนแรก แล้วต่อเนื่องนาน 6–12 เดือน) เพราะ nephritis อาจปรากฏภายหลังผื่นหาย; ภาวะแทรกซ้อนอื่นที่ต้องระวังคือ **เลือดออกในทางเดินอาหารและลำไส้กลืนกัน (intussusception)** โดยเฉพาะในเด็ก\n\n**3.5 วินิจฉัยแยกโรคของ palpable purpura (2 คะแนน)** ตอบ 3 ใน\n- **ANCA-associated vasculitis** (GPA, MPA, EGPA)\n- **Cryoglobulinemic vasculitis** (สัมพันธ์กับไวรัสตับอักเสบซี)\n- **Hypersensitivity/drug-induced (leukocytoclastic) vasculitis**\n- **Meningococcemia หรือ infective endocarditis** (ติดเชื้อ ต้องแยกก่อนเสมอเพราะรักษาต่างกันสิ้นเชิง)\n- **SLE-associated vasculitis**", "ref": ["MED32 โพย SAQ ผื่น purpura", "Harrison 21st ed., The Vasculitis Syndromes"], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"], "_kind": "meq", "_set": "air"}, {"id": "AIR-OSCE-03", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Hand radiograph: rheumatoid arthritis versus osteoarthritis", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "หญิงไทยอายุ 48 ปี ปวดข้อมือและข้อนิ้วมือสองข้าง 6 เดือน ฝืดตอนเช้า 1 ชั่วโมง\nให้ภาพรังสีมือสองข้าง: พบ **soft tissue swelling รอบ MCP, periarticular osteopenia, ช่องข้อ MCP และข้อมือแคบลงอย่างสม่ำเสมอ และมี marginal erosion ที่ MCP ที่ 2 และ 3** ไม่พบ osteophyte\n\n4.1 จงบรรยายภาพรังสีที่เห็นเป็นข้อ ๆ (2 คะแนน)\n4.2 จงให้การวินิจฉัยและบอกลักษณะที่ใช้แยกจาก osteoarthritis (3 คะแนน)\n4.3 จงบอกการตรวจทางห้องปฏิบัติการที่ช่วยยืนยันการวินิจฉัย 2 อย่าง (2 คะแนน)\n4.4 ก่อนเริ่มยากลุ่ม biologic ต้องคัดกรองอะไรบ้าง และเพราะเหตุใด (3 คะแนน)", "answer": "**4.1 บรรยายภาพรังสี (2 คะแนน)**\n1) soft tissue swelling รอบข้อ MCP ทั้งสองข้าง (สะท้อน synovitis)\n2) **periarticular osteopenia** — กระดูกบางเฉพาะรอบข้อที่อักเสบ\n3) **ช่องข้อแคบลงอย่างสม่ำเสมอ (uniform/concentric joint space narrowing)** ที่ MCP และข้อมือ\n4) **marginal erosion** ที่ขอบข้อ MCP ที่ 2 และ 3 บริเวณ bare area\n5) **ไม่พบ osteophyte หรือ subchondral sclerosis**\n\n**4.2 การวินิจฉัยและการแยกโรค (3 คะแนน)** — **Rheumatoid arthritis**\n\n| | **RA** | **OA** |\n|---|---|---|\n| ข้อที่เป็น | **MCP, PIP, ข้อมือ** เว้น DIP | **DIP, PIP**, CMC นิ้วโป้ง |\n| ความหนาแน่นกระดูก | **periarticular osteopenia** | ปกติหรือหนาขึ้น |\n| ช่องข้อ | **แคบสม่ำเสมอทั้งข้อ** | แคบเฉพาะด้านที่รับน้ำหนัก |\n| รอยกร่อน | **marginal erosion** | ไม่มี (ยกเว้น erosive OA ที่ DIP แบบ gull-wing) |\n| **Osteophyte / subchondral sclerosis** | ไม่มี | **มีเด่น** |\n\n**4.3 การตรวจยืนยัน (2 คะแนน)** — **Rheumatoid factor** และ **anti-cyclic citrullinated peptide (anti-CCP)** antibody (anti-CCP จำเพาะสูงกว่าและทำนายโรครุนแรง) เสริมด้วย ESR/CRP เพื่อประเมินความ active\n\n**4.4 การคัดกรองก่อนให้ biologic (3 คะแนน)**\n1) **วัณโรคแฝง** — ซักประวัติสัมผัส, **CXR** และ **tuberculin skin test หรือ IGRA** เพราะยาต้าน TNF ทำให้ latent TB กำเริบเป็นวัณโรคแพร่กระจายได้ ถ้าพบต้องรักษา latent TB ก่อนหรือพร้อมกันตามแนวทาง\n2) **ไวรัสตับอักเสบบีและซี** — HBsAg, anti-HBc, anti-HCV เพราะเสี่ยง HBV reactivation ที่รุนแรงถึงตับวาย\n3) **การติดเชื้อที่ยังไม่ได้รักษา, anti-HIV, ประวัติมะเร็ง และภาวะหัวใจล้มเหลว** (anti-TNF ทำให้ HF แย่ลง) รวมถึงจัดวัคซีนเชื้อตายให้ครบก่อนเริ่มยา และหลีกเลี่ยงวัคซีนเชื้อเป็นระหว่างใช้ยา", "ref": ["MED34 โพย 'Osteopenia at PIP, MCP, mild joint space narrowing, no erosion — Diag? A. Osteoarthritis B. RA'", "ACR RA Guideline 2021"], "nl": ["B5.3(1)", "3.2.5", "2.3.13-3(12)", "B5.3(5)", "B5.4(3)"], "_kind": "meq", "_set": "air"}, {"id": "AIR-OSCE-06", "part": "OSCE/SAQ", "lec": "33", "lecture": "Connective tissue diseases and vasculitis", "topic": "SAQ – Proximal muscle weakness with raised enzymes", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "หญิงอายุ 52 ปี มาด้วยลุกจากเก้าอี้และหวีผมลำบากมากขึ้น 3 เดือน ไม่ปวดกล้ามเนื้อมาก ไม่ชา\nPE: กล้ามเนื้อต้นแขนต้นขาแรง 3/5 ทั้งสองข้าง ปลายมือปลายเท้าแรง 5/5 reflex ปกติ ไม่มี sensory loss\nมีผื่นสีม่วงที่เปลือกตาบนสองข้าง และผื่นแดงเป็นขุยที่ข้อนิ้วมือด้านหลัง\nLab: CK 4,200 U/L, AST 180 U/L, ALT 120 U/L, ALP 90 U/L, GGT 22 U/L, TSH ปกติ\n\n6.1 จงบรรยายผื่นทั้งสองตำแหน่งด้วยศัพท์เฉพาะ (2 คะแนน)\n6.2 จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด (2 คะแนน)\n6.3 ผู้ป่วยถูกส่งไปเจาะตับเพราะ AST/ALT สูง ท่านเห็นด้วยหรือไม่ เพราะเหตุใด (2 คะแนน)\n6.4 จงบอกการตรวจเพิ่มเติมที่จำเป็น 4 อย่าง พร้อมเหตุผล (4 คะแนน)", "answer": "**6.1 (2 คะแนน)**\n- ผื่นสีม่วงแดงที่เปลือกตาบนสองข้าง (อาจมีบวมร่วม) = **heliotrope rash**\n- ผื่นแดงนูนเป็นขุยบน **ข้อนิ้วมือด้านหลัง (MCP, PIP)** = **Gottron papules** (ถ้าเป็นปื้นราบเรียกว่า Gottron sign)\n\n**6.2 (2 คะแนน)** — **Dermatomyositis** (idiopathic inflammatory myopathy) จากกล้ามเนื้ออ่อนแรงส่วนต้นสองข้างแบบค่อยเป็นค่อยไป ไม่ปวดเด่น + CK สูงมาก + ผื่นจำเพาะสองอย่าง\n\n**6.3 (2 คะแนน)** — **ไม่เห็นด้วย** เพราะ **AST และ ALT ไม่ได้จำเพาะต่อตับ — พบในกล้ามเนื้อลายด้วย** ในเคสนี้ **ALP และ GGT ปกติ** ซึ่งบ่งว่าไม่มีพยาธิสภาพที่ตับหรือทางเดินน้ำดีจริง ค่าที่สูงจึงอธิบายได้ด้วยการสลายของกล้ามเนื้อ (สอดคล้องกับ CK 4,200) ควรยืนยันด้วย **aldolase** และประเมินกล้ามเนื้อต่อ แทนการเจาะตับ\n\n**6.4 การตรวจเพิ่มเติม (4 คะแนน) — ตอบ 4 ใน**\n1) **Myositis-specific/associated antibodies** (ANA, **anti-Jo-1** และ antisynthetase อื่น, anti-Mi-2, **anti-MDA5**, anti-TIF1-γ ซึ่งสัมพันธ์กับมะเร็ง) — ช่วยจัดกลุ่มและทำนายภาวะแทรกซ้อน\n2) **EMG** — ดู myopathic pattern และเลือกตำแหน่งตัดชิ้นเนื้อ\n3) **MRI กล้ามเนื้อต้นขา** — หาบริเวณอักเสบ (edema) เพื่อชี้ตำแหน่ง biopsy\n4) **Muscle biopsy** — ยืนยันการวินิจฉัยและแยกจาก necrotizing myopathy/inclusion body myositis\n5) **ประเมินปอด: CXR, HRCT และ pulmonary function test** — interstitial lung disease พบบ่อยโดยเฉพาะกลุ่ม anti-Jo-1/anti-MDA5 และเป็นสาเหตุการตายสำคัญ\n6) **ประเมินการกลืนและเสียง** — dysphagia จากกล้ามเนื้อคอหอย เสี่ยงสำลัก\n7) **คัดกรองมะเร็งตามอายุและเพศ** — mammogram, Pap smear, CT ทรวงอก/ช่องท้อง/อุ้งเชิงกราน, ตรวจโพรงหลังจมูก (nasopharyngeal carcinoma พบบ่อยในคนเอเชีย), ส่องกล้องทางเดินอาหารตามข้อบ่งชี้ เพราะ **dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งแฝงราว 15–25%**", "ref": ["MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "MED33 โพย Rheumato ข้อ 5 (statin myopathy)"], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22", "2.1.26"], "_kind": "meq", "_set": "air"}], "sections": [{"id": "air-33-01", "title": "การตรวจ autoantibody อย่างมีเหตุผล", "minutes": 7, "summary": "ANA ใช้คัดกรอง ไม่ใช่ใช้ยืนยัน — และแอนติบอดีแต่ละตัวบอกอะไร", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "**สั่งตรวจแอนติบอดีเมื่อมีอาการที่เข้าได้กับโรคเนื้อเยื่อเกี่ยวพันเท่านั้น** การสั่ง ANA ในคนที่มีเพียงอาการปวดเมื่อยทั่วตัวจะให้ผลบวกลวงบ่อย (ประชากรปกติราวร้อยละ 5–15 มี ANA บวกที่ไทเตอร์ต่ำ และพบมากขึ้นตามอายุ)\n\n| แอนติบอดี | บทบาท | ความหมาย |\n|---|---|---|\n| **ANA (IIF บน HEp-2)** | **การตรวจคัดกรองที่ไวที่สุดของ SLE (ไวราว 95–99%)** | **ลบแทบตัด SLE ออกได้** แต่บวกไม่ได้แปลว่าเป็น — ต้องดูไทเตอร์และรูปแบบการย้อม |\n| **Anti-dsDNA** | **จำเพาะต่อ SLE** | สัมพันธ์กับ **lupus nephritis** และไทเตอร์ขึ้นลงตามการกำเริบ ใช้ติดตามได้ |\n| **Anti-Sm** | **จำเพาะต่อ SLE มากที่สุด** | ไวต่ำ (พบ ~20–30%) ไม่ใช้ติดตามโรค |\n| Anti-Ro (SSA) / La (SSB) | Sjögren, SCLE | **สำคัญในหญิงตั้งครรภ์ — สัมพันธ์กับ neonatal lupus และ congenital heart block** |\n| Anti-U1RNP | MCTD (ไทเตอร์สูงมาก) | มักมี Raynaud และมือบวม |\n| **Anti-centromere** | **limited cutaneous SSc (CREST)** | สัมพันธ์กับ **pulmonary arterial hypertension** |\n| **Anti-Scl-70 (topoisomerase I)** | **diffuse cutaneous SSc** | สัมพันธ์กับ **interstitial lung disease** |\n| **Anti-RNA polymerase III** | diffuse SSc | สัมพันธ์กับ **scleroderma renal crisis** และมะเร็งร่วม |\n| **Anti-Jo-1 (anti-synthetase)** | myositis | ILD + mechanic's hand + Raynaud |\n| **RF / anti-CCP** | RA | **anti-CCP จำเพาะกว่า** และบอกโรคที่รุนแรงกว่า |\n| **ANCA (PR3, MPO)** | vasculitis หลอดเลือดเล็ก | PR3 → GPA · MPO → MPA/EGPA |\n| C3, C4 | **ต่ำเมื่อโรคกำเริบ** โดยเฉพาะ lupus nephritis | ใช้ติดตามคู่กับ anti-dsDNA |\n\n### หลักการแปลผลที่ออกสอบบ่อย\n- **ANA ลบแต่ยังสงสัยมาก** — บางรายมี anti-Ro เดี่ยว ๆ หรือใช้ชุดตรวจแบบ ELISA ที่ไวน้อยกว่า ให้ **ขอตรวจ ANA ด้วยวิธี indirect immunofluorescence บนเซลล์ HEp-2 และส่งแอนติบอดีจำเพาะ** ก่อนจะตัดโรคทิ้ง\n- **แอนติบอดีบวกโดยไม่มีอาการไม่ใช่โรค** — ห้ามเริ่มยากดภูมิคุ้มกันจากผลเลือดเพียงอย่างเดียว\n- **anti-dsDNA + C3/C4 ต่ำ + โปรตีนรั่วในปัสสาวะ** = ภาพของ lupus nephritis ที่กำลังกำเริบ\n\n### ที่อาจารย์เน้นในสไลด์\n\n- **ANA พบในผู้ป่วย SLE อย่างน้อยร้อยละ 95** และเป็นแอนติบอดีที่เป็นลักษณะเฉพาะที่สุดของโรค\n- **แอนติบอดีตรวจพบได้ล่วงหน้าถึง 9 ปีก่อนผู้ป่วยมีอาการแรก** — อธิบายว่าทำไมคนที่ ANA บวกโดยไม่มีอาการจึงไม่ใช่ผู้ป่วย และทำไมต้องตามดูอาการ ไม่ใช่ตามดูผลเลือด\n- SLE เป็น **prototype ของโรค immune complex** — รอยโรคเฉพาะได้แก่ **hematoxylin body, Libman–Sacks endocarditis, vasculitis, thrombotic microangiopathy และ glomerulonephritis** · **ภาวะพร่อง complement** ทำให้กำจัด immune complex ได้แย่ลงและเป็นปัจจัยเสี่ยงของโรค\n\n**MCTD — เมื่อผู้ป่วยมีหลายโรคปนกัน**\nลักษณะผสมของ **lupus + scleroderma + polymyositis** ร่วมกับ **anti-U1RNP ไทเตอร์สูง** อวัยวะที่ต้องเฝ้าระวังคือ **pulmonary hypertension, ILD, myocarditis** ส่วนไตมักถูกกระทบไม่มาก และมักมี **Raynaud, มือบวม, sicca symptom**\n\n### ที่อาจารย์เน้นในสไลด์ (SLE and systemic autoimmune diseases)\n\n**ภูมิคุ้มกันเสียสมดุลได้สองทาง** — ทำงาน **มากเกิน** ไปเป็น allergy (ตอบสนองต่อสิ่งภายนอกเกินเหตุ) และ **autoimmunity (เสีย self tolerance ต่อสิ่งภายในตัวเอง)** ส่วนทำงาน **น้อยเกิน** ไปเป็นการติดเชื้อและมะเร็ง\n\n**กลไกการเกิดโรคภูมิต้านตนเอง** = **พันธุกรรม (ยีน MHC/HLA และ non-MHC) + สิ่งแวดล้อม (การติดเชื้อ · แสง UV · ยาและสารพิษ)** → ภูมิคุ้มกันเสีย self tolerance → **B cell สร้าง autoantibody + เกิดการอักเสบ** → อาการ\n\n**แยกสองกลุ่มให้ออก**\n| กลุ่ม | ตัวอย่างและแอนติเจนเป้าหมาย |\n|---|---|\n| **Organ-specific** | Graves (**TSH receptor**) · myasthenia gravis (**ACh receptor**) · **AIHA** (แอนติเจนผิวเม็ดเลือดแดง) · **ITP** (**GpIIb:IIIa**) · pemphigus vulgaris (**desmoglein 3**) · เบาหวานชนิดที่ 1 (เซลล์เบตา) · multiple sclerosis |\n| **Systemic (connective tissue disease)** | **RA · SLE · APS · SSc · IIM · Sjögren · MCTD · UCTD · vasculitis** — ลักษณะร่วมคือ **อาการทั่วกาย · หลายอวัยวะ · อาการทางกล้ามเนื้อและข้อ · ผื่นและ Raynaud · มี autoantibody** |\n\n**ANA ทำด้วยวิธี indirect immunofluorescence บนเซลล์ HEp-2** — **ผลบวกเริ่มที่ 1:80 แต่ที่ถือว่ามีนัยสำคัญคือ 1:160 ขึ้นไป** ส่วนแอนติบอดีจำเพาะตรวจต่อด้วย ELISA\nรูปแบบการย้อม (pattern) ช่วยเดาแอนติบอดีได้ และ **dense fine speckled** มักพบในคนปกติ ไม่ใช่โรค\n\n| โรค | แอนติบอดี | ANA pattern | ความหมายทางคลินิก |\n|---|---|---|---|\n| **SLE** | **anti-dsDNA** | **Homogeneous** | **สัมพันธ์กับกิจกรรมของโรคและ lupus nephritis** |\n| **SLE** | **anti-Sm** | Coarse speckled | **จำเพาะต่อ SLE · พยากรณ์โรคดีกว่า** |\n| SLE / MCTD | **anti-U1RNP** | Coarse speckled | **Raynaud's phenomenon** |\n| SLE / Sjögren | **anti-SSA (Ro)** | Fine speckled | **SCLE · neonatal lupus · sicca · ILD** |\n| SLE / Sjögren | anti-SSB (La) | Fine speckled | sicca · neonatal lupus |\n| **SSc** | **anti-Scl-70 (topoisomerase I)** | Homogeneous/nucleolar, speckled | **diffuse cutaneous SSc** |\n| **SSc** | **anti-centromere** | **Centromere** | **limited cutaneous SSc** |\n| **IIM** | **anti-Jo-1** | **Cytoplasm** | **anti-synthetase syndrome** |\n| RA | RF, anti-CCP | — | — |\n| Vasculitis | ANCA | — | — |\n\n**ระบาดวิทยาเปรียบเทียบ (จำไว้ใช้เดาโรคจากอายุและเพศ)**\n\n| โรค | ลักษณะเด่น | ความชุก | หญิง:ชาย | อายุที่เริ่ม (ปี) | ANA บวก |\n|---|---|---|---|---|---|\n| **SLE** | ผื่น ข้ออักเสบ **LN** AIHA | 1:1,000 | **9:1** | **20–30** | **99–100%** |\n| **Sjögren** | **sicca** ต่อมน้ำลายโต | 1:1,000 | **20:1** | **50–60** | 48–96% |\n| **SSc** | **Raynaud** ผิวแข็ง ILD | 1:10,000 | 8:1 | 30–50 | 97% |\n| **IIM** | กล้ามเนื้ออักเสบ ผื่น | 1:100,000 | 2.5:1 | **45–65** | 40–80% |\n| **MCTD** | Raynaud, sclerodactyly, myositis, ข้ออักเสบ | < 1:10,000 | 9:1 | 35–40 | **100%** |\n", "pearls": ["ANA ไวสูงแต่ไม่จำเพาะ — ใช้คัดกรอง ผลลบช่วยตัด SLE", "Anti-Sm จำเพาะที่สุดต่อ SLE · anti-dsDNA ใช้ติดตามการกำเริบและสัมพันธ์กับไตอักเสบ", "Anti-centromere → PAH · anti-Scl-70 → ILD · anti-RNA pol III → renal crisis", "ANA บวกได้ล่วงหน้าถึง 9 ปีก่อนมีอาการ — ผลบวกโดยไม่มีอาการจึงไม่ใช่โรค"], "source": "สไลด์ อ.โชคชัย — SLE and systemic autoimmune disease · สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "items": [{"id": "AIR-OLD-14", "kind": "old", "stem": "Which of the following is the best initial screening test in a patient with suspected systemic lupus erythematosus?", "choices": ["Antinuclear antibody", "Erythrocyte sedimentation rate", "Anti-Smith antibody", "Rheumatoid factor", "Anti-double-stranded DNA antibody"], "answer": 0, "explain": "**ANA = การตรวจคัดกรอง** ความไวสูงกว่า 95% — **ลบแทบตัด SLE ออกได้** แต่จำเพาะต่ำ (บวกได้ในคนปกติ 5-15%, ผู้สูงอายุ, ไทรอยด์อักเสบ); **anti-dsDNA และ anti-Sm คือการตรวจยืนยัน** และ anti-dsDNA ยังใช้ติดตามความ active โดยเฉพาะโรคไต", "pearl": "", "topic": "", "src": "MED34 โพย MCQ ข้อ 34 'ANA'", "ref": [], "nl": ["B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-48", "kind": "old", "stem": "Which antibody pattern is most specific for systemic lupus erythematosus?", "choices": ["Anti-Smith and anti-double-stranded DNA", "Anti-Jo-1 and anti-Mi-2", "Anti-mitochondrial and anti-smooth muscle", "Rheumatoid factor and anti-CCP", "Anti-Scl-70 and anticentromere"], "answer": 0, "explain": "**ANA คือการคัดกรอง (ไวแต่ไม่จำเพาะ) ส่วน anti-Sm และ anti-dsDNA คือการยืนยัน (จำเพาะสูง)**; anti-CCP สำหรับ RA, Scl-70/centromere สำหรับ systemic sclerosis, Jo-1/Mi-2 สำหรับ inflammatory myopathy, anti-mitochondrial สำหรับ primary biliary cholangitis", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย MCQ ข้อ 34 (ANA) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["B5.3(5)", "2.3.13-3(15)"]}]}, {"id": "air-33-02", "title": "SLE — วินิจฉัยและ lupus nephritis", "minutes": 9, "summary": "หญิงวัยเจริญพันธุ์ที่มีอาการหลายระบบ + ANA บวก และเมื่อไรต้องเจาะไต", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### คิดถึง SLE เมื่อไร\nหญิงวัยเจริญพันธุ์ (หญิง:ชาย ราว 9:1) ที่มีอาการ **หลายระบบพร้อมกัน** — ไข้ อ่อนเพลีย น้ำหนักลด ผมร่วง **ผื่นโหนกแก้ม (สงวนร่องแก้ม)** แพ้แสง **แผลในปากที่ไม่เจ็บ** ปวดข้อหลายข้อแบบไม่กร่อน เยื่อหุ้มปอด/หัวใจอักเสบ **เม็ดเลือดต่ำหลายสาย** ปัสสาวะผิดปกติ อาการทางระบบประสาท\n\nเกณฑ์ปัจจุบัน (EULAR/ACR 2019) ใช้ **ANA ≥ 1:80 เป็นประตูทางเข้า** แล้วจึงนับคะแนนตามระบบอวัยวะและภูมิคุ้มกัน (≥ 10 คะแนนจึงจัดเป็น SLE) — แต่ในเวชปฏิบัติ **การวินิจฉัยยังอาศัยภาพรวมทางคลินิกร่วมกับการตัดโรคเลียนแบบ** เช่น การติดเชื้อ ยา และมะเร็งเม็ดเลือด\n\n### แล็บที่ต้องส่งทุกรายเมื่อสงสัย\nCBC with differential · Cr และ eGFR · **urinalysis พร้อมดูตะกอนปัสสาวะ และ urine protein–creatinine ratio** · ANA · anti-dsDNA · anti-Sm · **C3, C4** · **antiphospholipid antibody ทั้งสามชนิด** · LFT · ESR/CRP\n\n> **ผู้ป่วย SLE ทุกรายต้องตรวจปัสสาวะทุกครั้งที่มาตรวจตามนัด** เพราะ lupus nephritis ระยะแรก **ไม่มีอาการ** — ตรวจพบได้จากปัสสาวะเท่านั้น\n\n### Lupus nephritis\n- พบในผู้ป่วย SLE ราวร้อยละ 40–60 และเป็นตัวกำหนดพยากรณ์โรคหลัก\n- **ข้อบ่งชี้ของการเจาะชิ้นเนื้อไต** — โปรตีนในปัสสาวะ **≥ 0.5 g/วัน (หรือ UPCR ≥ 500 mg/g)** · มี **active urinary sediment** (เม็ดเลือดแดงผิดรูป, RBC cast) · Cr สูงขึ้นโดยไม่มีเหตุอธิบาย\n- **การเจาะไตเปลี่ยนการรักษาจริง** เพราะชั้น (class) กำหนดยา — class I–II ดูแลประคับประคอง · **class III/IV (proliferative) ต้องให้ยากดภูมิคุ้มกันแบบเข้มข้น** (mycophenolate หรือ cyclophosphamide ขนาดต่ำแบบ Euro-Lupus ร่วมกับ corticosteroid ± belimumab/voclosporin) · class V (membranous) พิจารณาตามระดับโปรตีน\n- **ให้ hydroxychloroquine แก่ผู้ป่วย SLE ทุกรายถ้าไม่มีข้อห้าม** — ลดการกำเริบ ลดการเกิดไตอักเสบ ลดลิ่มเลือด และเพิ่มอัตรารอดชีวิต\n- ควบคุมความดันและลดโปรตีนรั่วด้วย **ACEI/ARB** ร่วมเสมอ\n\n### ที่อาจารย์เน้นในสไลด์\n\n**ระบาดวิทยาที่ใช้ตอบข้อสอบได้**\n- ยอดอุบัติการณ์อยู่ที่ **อายุ 15–45 ปี** แต่เป็นได้ทุกวัย · ก่อนวัยเจริญพันธุ์พบในเด็กหญิงมากกว่าเด็กชายราว 2 เท่า\n- **ผู้ชายที่เป็น SLE มักรุนแรงกว่า** ดำเนินโรคเร็วกว่า และพยากรณ์โรคแย่กว่า\n- **เด็กและวัยรุ่นที่เป็น SLE มีไตอักเสบมากกว่าและรุนแรงกว่า** ได้ยามากกว่า จึงสะสมความเสียหายจาก steroid มากกว่า · ผู้ที่เริ่มเป็นหลังหมดประจำเดือนมักรุนแรงน้อยกว่า\n- ความรุนแรงสัมพันธ์กับ **ความยากจน การศึกษาน้อย และการเข้าถึงบริการสุขภาพที่ด้อยกว่า** ไม่ใช่แค่ปัจจัยทางชีววิทยา\n\n**ปัจจัยสิ่งแวดล้อมที่มีหลักฐาน** — **การสูบบุหรี่ปัจจุบัน (สัมพันธ์กับการมี anti-dsDNA)** · **ผลึกซิลิกา** · **แสงแดด (ประวัติผิวไหม้รุนแรงก่อนอายุ 20 ปี)** · **EBV** · ยาคุมกำเนิดและฮอร์โมนหลังหมดประจำเดือน · ซิลิโคนเสริมเต้านม · ตัวทำละลายปิโตรเลียม · ระดับ **androgen ต่ำ estradiol และ prolactin สูง** (พบ hyperprolactinemia ราวร้อยละ 20–30 และสัมพันธ์กับโรคที่กำลังกำเริบ)\n\n**ตัวเลขอาการทางคลินิกจากสไลด์**\n- **ร้อยละ 42 ของผู้ป่วยที่โรคกำเริบมีไข้** และ **ร้อยละ 4 ของผู้ป่วยไข้ไม่ทราบสาเหตุเป็น SLE**\n- **ข้อ** — ปวดข้อ/ข้ออักเสบ พบได้บ่อยที่สุด รวมถึง **Jaccoud arthropathy** (ข้อผิดรูปแบบดัดกลับเข้าที่ได้ ไม่มี erosion), **Rhupus** (ซ้อนทับกับ RA), myositis, **osteonecrosis, เอ็นขาด และ septic arthritis**\n- **ปอด** — เยื่อหุ้มปอด 30–60% · pneumonitis · **pulmonary hemorrhage** · PHT 0.5–14% (อัตราตายสูงกว่า idiopathic PHT) · **shrinking lung syndrome** (หอบโดยไม่มีสาเหตุ ปอดเล็กลง แบบ restrictive)\n- **หัวใจ** — พบ **pericardial effusion ~37%** · **Libman–Sacks endocarditis** · **myocarditis ~10%** (สงสัยเมื่อหัวใจเต้นผิดจังหวะ หัวใจโตไม่ทราบสาเหตุ หรือใจเต้นเร็วตลอด) · **หลอดเลือดหัวใจตีบจากหลอดเลือดแข็งเร่งตัว**\n- **ระบบประสาท (NPSLE)** — วินิจฉัยทางคลินิกและ **ต้องตัด sepsis, uremia และความดันสูงรุนแรงออกก่อน** · น้ำไขสันหลังและ EEG ไม่จำเพาะ · **anti-ribosomal P สัมพันธ์กับอาการซึมเศร้าและโรคจิต** · anti-NMDA receptor สัมพันธ์กับอาการแบบกระจาย\n- **ทางเดินอาหาร** — **lupus enteritis, protein-losing enteropathy, mesenteric vasculitis/thrombosis** (ปวดท้องในผู้ป่วย SLE เป็นเรื่องที่ห้ามมองข้าม), ตับอ่อนอักเสบ, cholecystitis\n- **ไต** — นอกจาก lupus nephritis ยังพบ **RTA ชนิดที่ 1 และ 4**, renal vein thrombosis และ **lupus cystitis** (มักมาพร้อมอาการทาง CNS และ GI ที่รุนแรง)\n- **ต่อมน้ำเหลืองโตพบบ่อยและไม่จำเพาะ** — ถ้าโตมากผิดปกติให้นึกถึง **Kikuchi–Fujimoto disease (histiocytic necrotizing lymphadenitis)** ซึ่งพบร่วมกับ SLE\n- **เลือด** — ซีดจากโรคเรื้อรังและขาดเหล็กพบบ่อยที่สุด ส่วนที่จำเพาะคือ **AIHA** · leukopenia/lymphopenia · เกล็ดเลือดต่ำ · **pancytopenia ให้คิดถึง myelofibrosis, ยากดภูมิ, การติดเชื้อ และ hemophagocytic syndrome**\n\n**ผื่นของลูปัสแบ่งตาม Gilliam**\n- **LE-specific** — **acute** (malar “butterfly” rash, generalized erythema) · **subacute (SCLE)** แบบ annular/polycyclic และ papulosquamous · **chronic** (discoid ทั้งเฉพาะที่และกระจาย, hypertrophic, lupus profundus, mucosal LE, lupus tumidus, chilblain lupus)\n- **LE-non-specific** — **leukocytoclastic vasculitis (palpable purpura), urticarial vasculitis** · vasculopathy (periungual telangiectasia, livedo reticularis, Raynaud) · **ผมร่วงชนิดไม่เป็นแผลเป็น “lupus hair”** · แผลในปาก · calcinosis cutis\nผื่นกลุ่ม non-specific บอก **กิจกรรมของโรคหรือภาวะแทรกซ้อน** ส่วนกลุ่ม specific ใช้ช่วยวินิจฉัย\n\n### ที่อาจารย์เน้นในสไลด์ (SLE and systemic autoimmune diseases)\n\n> **SLE ไม่มี “diagnostic criteria” มีแต่ classification criteria** ซึ่งสร้างไว้เพื่อคัดผู้ป่วยเข้างานวิจัยให้เป็นกลุ่มเดียวกัน — ใช้ช่วยคิดได้ แต่ **การวินิจฉัยยังเป็นดุลยพินิจทางคลินิก และต้องตัดสาเหตุอื่นของทุกข้อออกก่อน**\n\n**ความถี่ของอาการรายระบบ (ตัวเลขจากสไลด์)**\n| ระบบ | พบราว |\n|---|---|\n| **กล้ามเนื้อและข้อ** | **85%** |\n| **ผิวหนังและเยื่อบุ** | **70%** |\n| **อาการทั่วกาย** (ไข้ อ่อนเพลีย น้ำหนักลด) | **70%** |\n| **ไต** | **30–70%** |\n| **ระบบประสาท** | **50%** |\n| **เลือด** | **50%** |\n| เยื่อหุ้มปอด | 40% |\n| ทางเดินอาหาร | 30–50% |\n| เยื่อหุ้มหัวใจ | 20% |\n| Raynaud | 20% |\n\n**แล็บที่ต้องส่ง แบ่งตามวัตถุประสงค์ — วิธีจัดกลุ่มที่ใช้ตอบข้อสอบ MEQ ได้ทันที**\n| วัตถุประสงค์ | ส่งอะไร |\n|---|---|\n| **วินิจฉัยและประเมินอวัยวะ** | **CBC · UA · UPCR · CXR/EKG · LFT** |\n| **วินิจฉัยทางภูมิคุ้มกัน** | **ANA · anti-dsDNA · anti-Sm · complement (C3/C4) · antiphospholipid antibodies** |\n| **ประเมินภาวะแทรกซ้อน** | BUN, Cr, electrolytes |\n| **เตรียมก่อนให้ยากดภูมิคุ้มกัน** | **CXR · ตรวจอุจจาระหาพยาธิ (โดยเฉพาะ _Strongyloides_) · ตรวจฟัน** |\n\n**ภาวะซีดในผู้ป่วย SLE — อย่าด่วนสรุปว่าเป็น AIHA**\n- **AIHA** ต้องครบทั้ง **reticulocyte สูง · haptoglobin ต่ำ · indirect bilirubin สูง · LDH สูง ร่วมกับ direct Coombs test บวก**\n- สาเหตุอื่นที่ต้องไล่: **สร้างน้อย** (anemia of inflammation, ขาดเหล็ก/B12/folate) · **ไขกระดูกล้มเหลว** (aplastic anemia, PRCA, hemophagocytosis, myelofibrosis, myelodysplasia) · **MAHA** (DIC, TTP, **catastrophic APS**, scleroderma renal crisis, ความดันสูงขั้นวิกฤต, vasculitis) · **ซีดจาก CKD** · **ผลของยา** (cyclophosphamide, methotrexate, azathioprine, เลือดออกทางเดินอาหารจาก NSAIDs/steroid) · **hypersplenism**\n\n**Lupus nephritis รายชั้น — ตัวเลขที่บอกว่าทำไมต้องเจาะไต**\n| Class | นิยาม | ตะกอนปัสสาวะ active | โปรตีนรั่ว | Nephrotic | ไตเสื่อม | **อัตรารอดของไตที่ 5 ปี** |\n|---|---|---|---|---|---|---|\n| **I** | minimal mesangial | 0 | 0 | 0 | 0 | **100%** |\n| **II** | mesangial proliferative | < 25% | 25–50% | 0 | < 15% | **> 90%** |\n| **III** | focal (< 50% ของ glomeruli) | 50% | 67% | 25–33% | 10–25% | **70–80%** |\n| **IV** | diffuse (≥ 50% ของ glomeruli) | **75%** | **> 95%** | **50%** | **> 50%** | **60–80%** |\n| **V** | membranous (± ร่วมกับ III/IV) | 30% | > 95% | **90%** | 10% | 80–90% |\n\n**เยื่อหุ้มปอดและเยื่อหุ้มหัวใจอักเสบ**\n- **เยื่อหุ้มปอดอักเสบมัก “สองข้าง” มากกว่าข้างเดียว ปริมาณน้ำน้อยถึงปานกลาง เป็น exudate** และอาจเป็นแบบ **“dry” pleuritis ที่ไม่มีน้ำเลย** · มักพบเยื่อหุ้มหัวใจอักเสบร่วม\n- **Acute pericarditis วินิจฉัยเมื่อเข้า 2 ใน 4 ข้อ** — (1) **เจ็บหน้าอกแบบแหลม แย่ลงเมื่อหายใจเข้า ดีขึ้นเมื่อโน้มตัวไปข้างหน้า** (2) **pericardial rub** (3) **EKG: ST ยกขึ้นทั่วไปหรือ PR depression** (4) **น้ำในเยื่อหุ้มหัวใจใหม่หรือมากขึ้นจากภาพถ่าย**\n", "pearls": ["SLE = หญิงวัยเจริญพันธุ์ + อาการหลายระบบ + ANA บวก และตัดการติดเชื้อออกแล้ว", "โปรตีนในปัสสาวะ ≥ 0.5 g/วัน หรือมี active sediment = ข้อบ่งชี้เจาะชิ้นเนื้อไต", "Hydroxychloroquine ให้ทุกรายที่ไม่มีข้อห้าม", "ไข้พบใน 42% ของ SLE ที่กำลังกำเริบ และ 4% ของ FUO เป็น SLE", "Jaccoud arthropathy = ข้อผิดรูปที่ดัดกลับได้และไม่มี erosion · Rhupus = ซ้อนทับกับ RA", "ปวดท้องในผู้ป่วย SLE ต้องคิดถึง lupus enteritis และ mesenteric vasculitis/thrombosis"], "source": "สไลด์ อ.โชคชัย — SLE and systemic autoimmune disease · สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "items": [{"id": "AIR-MCQ-31", "kind": "mcq", "stem": "A 24-year-old woman has 3 months of fatigue, malar rash sparing the nasolabial folds, painless oral ulcers, and symmetric arthritis of the hands without erosion. Lab: WBC 3,100/mm3, lymphocyte 800/mm3, platelet 130,000/mm3, urinalysis protein 2+, RBC 15–20/HPF with red cell casts. Which of the following investigations best supports the diagnosis?", "choices": ["Rheumatoid factor and anti-cyclic citrullinated peptide antibody", "Antinuclear antibody with anti-double-stranded DNA and complement C3/C4 levels", "Serum uric acid and synovial fluid crystal analysis", "Antineutrophil cytoplasmic antibody with anti-glomerular basement membrane antibody", "Anti-Jo-1 antibody and creatine kinase"], "answer": 1, "explain": "**SLE = โรคภูมิต้านตนเองที่มี immune complex ไปสะสมหลายอวัยวะ** เคสนี้มีครบทั้งผิวหนัง เยื่อบุ ข้อ เลือด และไต ซึ่งเป็นภาพคลาสสิก\n\n**การตรวจตามลำดับ**\n1. **ANA** เป็นการตรวจคัดกรอง ความไวสูงมาก (> 95%) — **ANA ลบแทบตัด SLE ออกได้** แต่ความจำเพาะต่ำ (พบบวกได้ในคนปกติ ผู้สูงอายุ ไทรอยด์อักเสบ ตับอักเสบเรื้อรัง)\n2. **Anti-dsDNA และ anti-Smith** จำเพาะสูงต่อ SLE; anti-dsDNA ยัง **สัมพันธ์กับความรุนแรงของ lupus nephritis** และใช้ติดตามโรค\n3. **C3/C4 ต่ำ** สะท้อนการใช้ complement ไปกับ immune complex = โรคกำลัง active\n\n**เบาะแสที่สำคัญที่สุดในเคสนี้คือ RBC cast + โปรตีนในปัสสาวะ = glomerulonephritis** ต้องประเมินเพื่อทำ renal biopsy ต่อ\n\n**ทำไมข้ออื่นผิด** — RF/anti-CCP ใช้กับ RA (RF บวกได้ใน SLE แต่ไม่ช่วยวินิจฉัย), ANCA/anti-GBM ใช้กับ pulmonary-renal syndrome จาก vasculitis, uric acid/ผลึกใช้กับเก๊าท์, anti-Jo-1/CK ใช้กับ inflammatory myopathy", "pearl": "**ANA = คัดกรอง (ลบแทบตัดออก) · anti-dsDNA + anti-Sm = ยืนยัน · C3/C4 ต่ำ = active** — และ RBC cast แปลว่าไตอักเสบจนกว่าจะพิสูจน์เป็นอื่น", "topic": "Diagnosis of systemic lupus erythematosus", "src": "", "ref": ["MED34 โพย MCQ SLE", "EULAR/ACR SLE Classification Criteria 2019"], "nl": ["2.3.13-3(15)", "B5.2.2-3(5)", "B5.3(5)", "2.1.50"]}, {"id": "AIR-MCQ-32", "kind": "mcq", "stem": "A 26-year-old woman with newly diagnosed SLE has urine protein-to-creatinine ratio 1.8 g/g, active urine sediment with red cell casts, and creatinine 1.3 mg/dL (was 0.8 mg/dL 4 months ago). Which of the following is the most appropriate next step?", "choices": ["Percutaneous renal biopsy to determine the class of lupus nephritis before immunosuppressive therapy", "Start pulse methylprednisolone and cyclophosphamide without biopsy in all cases", "Repeat anti-double-stranded DNA and treat only if the titre is rising", "Start an ACE inhibitor and repeat the urine studies in 6 months", "Refer for dialysis planning"], "answer": 0, "explain": "**Lupus nephritis แบ่งเป็น class I–VI ตาม ISN/RPS และ 'class เป็นตัวกำหนดการรักษา' ซึ่งดูจากเลือดหรือปัสสาวะไม่ได้**\n\n- **Class I–II (mesangial)** — ให้การรักษาประคับประคอง คุมความดัน ให้ ACEI/ARB ไม่ต้องกดภูมิแรง\n- **Class III/IV (focal/diffuse proliferative)** — รุนแรงที่สุด ต้อง induction ด้วย **สเตียรอยด์ขนาดสูง + mycophenolate หรือ cyclophosphamide** (พิจารณาเพิ่ม belimumab/voclosporin)\n- **Class V (membranous)** — โปรตีนรั่วมาก เสี่ยง thrombosis แนวทางต่างจาก proliferative\n- **Class VI (sclerotic)** — เนื้อไตพังแล้ว การกดภูมิไม่ช่วย\n\n**ข้อบ่งชี้ biopsy** — proteinuria ≥ 0.5 g/วัน (หรือ UPCR ≥ 0.5 g/g) โดยเฉพาะเมื่อมี **active sediment** หรือ creatinine สูงขึ้นโดยไม่มีสาเหตุอื่น — เคสนี้เข้าครบ\n\n**ทำไมข้ออื่นผิด** — การให้ cyclophosphamide ทุกรายโดยไม่รู้ class ทำให้ผู้ป่วย class II หรือ VI ได้รับพิษยาโดยไม่จำเป็น (มีบุตรยาก ติดเชื้อ มะเร็งกระเพาะปัสสาวะ); การให้ ACEI แล้วรอ 6 เดือนปล่อยให้ไตเสียถาวร; anti-dsDNA ใช้ติดตามไม่ใช่ตัดสินการรักษา; ยังไม่มีข้อบ่งชี้ฟอกไต", "pearl": "SLE + โปรตีนรั่ว ≥ 0.5 g/วัน หรือ active sediment → **biopsy ก่อนเสมอ เพราะ class เป็นตัวเลือกยา**", "topic": "Lupus nephritis — indication for renal biopsy", "src": "", "ref": ["MED34 โพย MCQ lupus nephritis", "KDIGO Glomerular Diseases Guideline 2021"], "nl": ["2.3.13-3(15)", "B5.2.2-3(5)"]}, {"id": "AIR-OLD-49", "kind": "old", "stem": "A woman with SLE and lupus nephritis wishes to become pregnant. Which drug must be stopped and replaced before conception?", "choices": ["Calcium and vitamin D supplements", "Prednisolone, stopped completely", "Mycophenolate mofetil, replaced by azathioprine", "Low-dose aspirin, stopped without replacement", "Hydroxychloroquine, replaced by no alternative"], "answer": 2, "explain": "**Mycophenolate เป็น teratogen ต้องหยุดอย่างน้อย 6 สัปดาห์ก่อนตั้งครรภ์ และเปลี่ยนเป็น azathioprine** (เช่นเดียวกับ cyclophosphamide, methotrexate, ACEI/ARB ที่ต้องหยุด); **hydroxychloroquine ต้องใช้ต่อ** เพราะลด flare และลดความเสี่ยง congenital heart block; **low-dose aspirin ควรให้** เพื่อลด preeclampsia; และควรตั้งครรภ์เมื่อโรคสงบอย่างน้อย 6 เดือน", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย SLE in pregnancy (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(15)", "B5.4(3)"]}]}, {"id": "air-33-02b", "title": "เกณฑ์ EULAR/ACR 2019 และผื่นของลูปัส", "summary": "ใช้เกณฑ์ให้เป็น และเรียกชื่อผื่นให้ถูกชนิด", "minutes": 8, "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "md": "### EULAR/ACR 2019 classification criteria\n\n**Entry criterion — ANA ≥ 1:80 บนเซลล์ HEp-2 (หรือการตรวจที่เทียบเท่า)**\nถ้า ANA ไม่ถึงเกณฑ์นี้ **ไม่เข้าเกณฑ์จำแนกโรคตั้งแต่ต้น** (แต่ไม่ได้แปลว่าผู้ป่วยไม่เป็นโรค — ยังต้องใช้ดุลยพินิจทางคลินิก)\n\n**จากนั้นนับคะแนนตามกลุ่มอาการ (additive criteria)** โดยมีเกณฑ์ตัวเลขที่ต้องจำ\n- **ไข้ > 38.3 °C**\n- **เม็ดเลือดขาว < 4,000/µL** · **เกล็ดเลือด < 100,000/µL**\n- **ผมร่วงและแผลในปาก ต้องเป็นสิ่งที่แพทย์ตรวจเห็นเอง** (observed by clinician) ไม่ใช่แค่ผู้ป่วยเล่า\n- **เยื่อหุ้มปอด/หัวใจอักเสบ ต้องมีหลักฐานจากภาพถ่าย** (imaging evidence)\n- **โปรตีนในปัสสาวะใช้ค่า spot UPCR ได้**\n\n**กติกาการนับที่คนทำข้อสอบพลาดบ่อยที่สุด**\n1. **ห้ามนับข้อใดถ้ามีคำอธิบายอื่นที่น่าจะเป็นมากกว่า SLE** — ไข้ที่อธิบายด้วยการติดเชื้อได้ ห้ามนับ\n2. **เกิดเพียงครั้งเดียวในอดีตก็นับได้** ไม่ต้องกำลังเป็นอยู่ขณะตรวจ\n3. **ในแต่ละกลุ่มอาการ (domain) ให้นับเฉพาะข้อที่มีคะแนนสูงสุดข้อเดียว**\n4. **ต้องมีอย่างน้อย 1 ข้อที่เป็นอาการทางคลินิก และคะแนนรวม ≥ 10** จึงจัดเป็น SLE\n\n### ผื่นของลูปัส — แบ่งเป็น LE-specific กับ LE-non-specific\n\n**LE-specific**\n| ชนิด | รูปแบบย่อย | ลักษณะสำคัญ |\n|---|---|---|\n| **ACLE** (เฉียบพลัน) | localized | **ผื่นปีกผีเสื้อ (malar rash)** และ **ผื่นที่หลังนิ้วบริเวณระหว่างข้อ (interknuckle) ซึ่งเว้นข้อนิ้ว** |\n| | disseminated | ผื่น maculopapular ทั่วตัว · ผื่นแพ้แสง |\n| **SCLE** (กึ่งเฉียบพลัน) | annular | ผื่นวงกลมขอบแดง |\n| | papulosquamous | ผื่นแดงลอกเป็นขุยคล้ายสะเก็ดเงิน |\n| **CCLE** (เรื้อรัง) | **chronic DLE** | **รอยโรคที่ทิ้งแผลเป็น** · **follicular plugging** · **carpet tack sign** (สะเก็ดที่ลอกออกมีเดือยคล้ายตะปูพรม) · hyperkeratosis · **ตรงกลางฝ่อเป็นแผลเป็น ขอบมีสีคล้ำ** |\n\n**LE-non-specific** — **ผมร่วงชนิดไม่เป็นแผลเป็น (non-scarring alopecia)** · **แผลในปาก** · **Raynaud's phenomenon**\n> จุดที่ต้องแยก — **ผมร่วงแบบไม่เป็นแผลเป็นคือ non-specific และงอกกลับได้** ส่วน **ผมร่วงแบบเป็นแผลเป็นคือ discoid lupus (CCLE) ซึ่งเป็น LE-specific และงอกกลับไม่ได้** จึงต้องรีบรักษาก่อนผมหายถาวร\n\n### ข้ออักเสบใน SLE\nเข้าเกณฑ์เมื่อ **(1) มี synovitis ตั้งแต่ 2 ข้อขึ้นไป โดยบวมหรือมีน้ำในข้อ** หรือ **(2) กดเจ็บตั้งแต่ 2 ข้อขึ้นไป ร่วมกับข้อฝืดตอนเช้านานอย่างน้อย 30 นาที**\n- **Jaccoud's arthropathy** — ข้อผิดรูปคล้าย RA แต่ **เกิดจากเอ็นและเยื่อหุ้มข้อหย่อน ดัดกลับเข้าที่ได้ และภาพรังสีไม่มี erosion**\n- **ต้องแยกจาก** — **ข้อติดเชื้อ** (ผู้ป่วยได้ยากดภูมิคุ้มกันอยู่) · **rhupus** (ซ้อนทับกับ RA จริง มี erosion) · **osteonecrosis** จากสเตียรอยด์\n", "pearls": ["Entry criterion ของเกณฑ์ 2019 คือ ANA ≥ 1:80 บน HEp-2 · ต้องมีอาการทางคลินิกอย่างน้อย 1 ข้อ และรวม ≥ 10 คะแนน", "ห้ามนับเกณฑ์ข้อที่มีคำอธิบายอื่นน่าจะเป็นมากกว่า และในแต่ละ domain นับเฉพาะข้อคะแนนสูงสุด", "ผมร่วงไม่เป็นแผลเป็น = non-specific · ผมร่วงเป็นแผลเป็น = discoid lupus ซึ่งงอกกลับไม่ได้", "Jaccoud's arthropathy ดัดกลับได้และไม่มี erosion — ต่างจาก rhupus"], "nl": ["B5.2.2-3(5)", "2.3.13-3(15)", "B4.2.2-3(6)"], "items": [{"id": "AIR-33-02B-Q1", "kind": "own", "stem": "A 24-year-old woman has a 2-month history of photosensitive malar rash, painless oral ulcers seen by the physician, and morning stiffness with swelling of both wrists and several MCP joints. Investigations: ANA 1:640 speckled, anti-dsDNA positive, C3 and C4 low, platelet 96,000/uL, urinalysis normal. She also has a fever of 38.5 C on the day she is seen; blood cultures are negative and there is no localizing source. Which of the following statements about applying the EULAR/ACR 2019 criteria to this patient is correct?", "choices": ["Oral ulcers reported by the patient in the past would score the same as ulcers observed by the clinician, so documentation does not matter", "The fever must be excluded from scoring because any fever requires at least 2 weeks of documented negative cultures before it can be attributed to SLE", "The fever may be counted because no more likely explanation than SLE has been found, and only the highest-weighted criterion within each domain is counted", "A positive ANA at 1:640 alone is sufficient to classify the patient as having SLE", "Because her urinalysis is normal she cannot reach the threshold for classification regardless of her other findings"], "answer": 2, "explain": "เกณฑ์ **EULAR/ACR 2019** มีกติกาสามข้อที่ต้องใช้พร้อมกัน\n\n1. **Entry criterion — ANA ≥ 1:80** ผู้ป่วยรายนี้ผ่าน แต่ **ANA อย่างเดียวไม่ใช่การวินิจฉัย** ต้องมีคะแนนรวม ≥ 10 และมีอาการทางคลินิกอย่างน้อย 1 ข้อ\n2. **ห้ามนับข้อที่มีคำอธิบายอื่นน่าจะเป็นมากกว่า SLE** — ไข้รายนี้หาสาเหตุแล้วไม่พบจุดติดเชื้อและเพาะเชื้อไม่ขึ้น จึง **นับได้** (เกณฑ์ใช้คำว่า *more likely explanation*ไม่ได้กำหนดว่าต้องรอผลเพาะเชื้อสองสัปดาห์)\n3. **ในแต่ละ domain นับเฉพาะข้อที่มีคะแนนสูงสุดข้อเดียว** และ **เกิดเพียงครั้งเดียวในอดีตก็นับได้**\n\n**ทำไมข้ออื่นผิด**\n- ไม่มีกติกาเรื่อง “เพาะเชื้อเป็นลบ 2 สัปดาห์” ในเกณฑ์นี้\n- **ไตปกติไม่ได้ปิดกั้นการเข้าเกณฑ์** — ผู้ป่วยรายนี้มีทั้ง ผื่น ACLE, แผลในปาก, ข้ออักเสบ, เกล็ดเลือดต่ำ, complement ต่ำ และ anti-dsDNA บวก ซึ่งรวมกันเกิน 10 คะแนนได้สบาย\n- **แผลในปากต้องเป็นสิ่งที่แพทย์ตรวจเห็น (observed by clinician)** ตามที่เกณฑ์กำหนด การบันทึกจึงสำคัญ\n- ANA บวกอย่างเดียวพบได้ในคนปกติราวร้อยละ 5–15 จึงใช้วินิจฉัยไม่ได้", "pearl": "เกณฑ์ 2019 = ANA ≥ 1:80 เป็นประตูเข้า + ≥ 1 อาการทางคลินิก + คะแนนรวม ≥ 10 โดยห้ามนับข้อที่โรคอื่นอธิบายได้ดีกว่า และนับข้อคะแนนสูงสุดข้อเดียวในแต่ละ domain", "topic": "เกณฑ์ EULAR/ACR 2019 และผื่นของลูปัส", "src": "", "ref": [], "nl": ["B5.2.2-3(5)"]}, {"id": "AIR-33-02B-Q2", "kind": "own", "stem": "A 32-year-old woman has scaly, coin-shaped plaques on the scalp and cheeks for the past year. The plaques have a depressed, atrophic centre with surrounding hyperpigmentation, and hair does not regrow within them. Peeling a scale reveals keratin spikes on its undersurface. Which of the following is the most appropriate description and implication of this lesion?", "choices": ["Chronic discoid lupus erythematosus, an LE-specific lesion that scars permanently, so treatment should be started promptly to preserve hair follicles", "Tinea capitis, which should be treated with a topical antifungal before any immunologic testing", "Subacute cutaneous lupus erythematosus, which characteristically heals without scarring and is strongly associated with anti-Sm antibody", "Non-scarring alopecia of active systemic lupus, which will regrow completely once disease activity is controlled", "Acute cutaneous lupus erythematosus, which indicates active systemic disease and requires renal biopsy"], "answer": 0, "explain": "ลักษณะที่บรรยายคือ **chronic discoid lupus erythematosus (CCLE)** — รอยโรคเป็นแผ่นกลม **ตรงกลางฝ่อเป็นแผลเป็น ขอบมีสีคล้ำ (central atrophic scar with peripheral hyperpigmentation)** และ **carpet tack sign** คือเมื่อลอกสะเก็ดออกจะเห็นเดือย keratin ที่ติดมากับรูขุมขน (**follicular plugging**)\n\n**ความสำคัญคือมันทำลายรูขุมขนถาวร** — ผมที่ร่วงจาก DLE เป็น **scarring alopecia ซึ่งไม่งอกกลับ** จึงต้องรีบรักษา (ยาทาสเตียรอยด์แรงหรือ calcineurin inhibitor ที่ใบหน้า, **hydroxychloroquine**, เลี่ยงแดดและใช้ครีมกันแดดชนิด broad-spectrum, งดบุหรี่ซึ่งทำให้ตอบสนองต่อ HCQ แย่ลง)\n\n**ทำไมข้ออื่นผิด**\n- **ผมร่วงแบบ non-scarring** เป็นรอยโรคชนิด **LE-non-specific** ของ SLE ที่กำลังกำเริบและงอกกลับได้ — ต่างจากรายนี้ที่ผมไม่งอก\n- **SCLE** หายโดยไม่ทิ้งแผลเป็น (อาจทิ้งรอยด่างขาวชั่วคราว) และสัมพันธ์กับ **anti-Ro/SSA** ไม่ใช่ anti-Sm\n- **ACLE** คือผื่นปีกผีเสื้อ ไม่ทิ้งแผลเป็น และการเจาะไตพิจารณาจากปัสสาวะผิดปกติ ไม่ใช่จากชนิดของผื่น\n- Tinea capitis ไม่ทำให้เกิดขอบสีคล้ำและตรงกลางฝ่อแบบนี้ และไม่มี carpet tack sign", "pearl": "Carpet tack sign + follicular plugging + ตรงกลางฝ่อขอบคล้ำ = discoid lupus ซึ่งทำให้ผมร่วงถาวร ต้องรีบรักษา", "topic": "เกณฑ์ EULAR/ACR 2019 และผื่นของลูปัส", "src": "", "ref": [], "nl": ["B4.2.2-3(6)", "B5.2.2-3(5)"]}]}, {"id": "air-33-02c", "title": "การรักษา SLE ตามความรุนแรงและการดูแลระยะยาว", "summary": "ตารางเลือกยาตามอวัยวะและขนาดสเตียรอยด์ · สิ่งที่ต้องทำทุกรายนอกจากยากดภูมิคุ้มกัน", "minutes": 9, "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "md": "### ก่อนจะบอกว่า “โรคกำเริบ” ต้องทำสองอย่างเสมอ\n1. **ตัดสาเหตุอื่นออก — การติดเชื้อ และพิษจากยา** (อาการเหมือนกันได้มาก และการเพิ่มยากดภูมิคุ้มกันในผู้ป่วยติดเชื้อคือความผิดพลาดที่อันตรายที่สุด)\n2. **ประเมินว่าอวัยวะใดถูกกระทบและรุนแรงแค่ไหน** เพราะขนาดยาขึ้นกับข้อนี้ล้วน ๆ\n\n### ตารางเลือกการรักษาตามระบบอวัยวะ (จากสไลด์)\n\n| ระบบ | **Prednisolone < 20 มก./วัน (เบา)** | **20–40 มก./วัน (ปานกลาง)** | **> 40 มก./วัน (รุนแรง)** | ยากดภูมิคุ้มกันที่ใช้ร่วม |\n|---|---|---|---|---|\n| **กล้ามเนื้อและข้อ** | ปวดข้อ/ปวดกล้ามเนื้อ | **ข้ออักเสบ / กล้ามเนื้ออักเสบ** | ไม่ตอบสนองขนาดปานกลาง | **NSAIDs, HCQ, methotrexate** |\n| **ผิวหนัง** | ผื่นทั่วไป **< 9% BSA (ใช้ยาทา)** | **9–18% BSA · vasculitis** | **DLE รุนแรง · vasculitis** | **HCQ, methotrexate** |\n| **Serositis** | ไม่ตอบสนอง NSAIDs | ไม่ตอบสนองขนาดต่ำ | ไม่ตอบสนองขนาดปานกลาง | NSAIDs, HCQ, methotrexate |\n| **เลือด** | **เกล็ดเลือด < 100,000** | **เกล็ดเลือด < 50,000** | **AIHA · เกล็ดเลือด < 25,000 (ให้ IVMP)** | **azathioprine** |\n| **Lupus nephritis** | — | **ให้ RAAS blocker ร่วมเสมอ** | **class III, IV, V (ให้ IVMP)** | **cyclophosphamide, mycophenolate mofetil, cyclosporin** |\n\n- **Pulse methylprednisolone (IVMP)** ใช้เมื่อ **อวัยวะสำคัญหรือชีวิตถูกคุกคาม และต้องการผลเร็ว**\n- **NSAIDs** ใช้กับข้ออักเสบและ serositis · **Hydroxychloroquine ให้ทุกรายที่ไม่มีข้อห้าม** เพราะช่วยทั้งผื่น ข้อ serositis และ **ป้องกันการกำเริบ**\n- **ก่อนเริ่มยากดภูมิคุ้มกันต้องคัดกรองการติดเชื้อที่ซ่อนอยู่ — CXR · ตรวจอุจจาระหาพยาธิ · ตรวจฟัน**\n- **ผู้ป่วยที่ได้ HCQ หรือ chloroquine ทุกราย ต้องตรวจตาเพื่อคัดกรอง maculopathy** — ภาพคลาสสิกคือ **bull's eye maculopathy**\n\n### ผลข้างเคียงของกลูโคคอร์ติคอยด์ที่ต้องท่องให้ครบ\n**หน้ากลม (moon face) · น้ำตาลในเลือดสูงและเบาหวาน · กล้ามเนื้อต้นแขนต้นขาอ่อนแรง · ขนดก · กระดูกพรุน · ความดันโลหิตสูง · หนอกควาย (buffalo hump) · ผิวแตกลายสีม่วง · ช้ำง่ายและสิวจากสเตียรอยด์ · อ้วนลงพุง · ผลข้างเคียงทางเดินอาหาร · ต้อกระจกชนิด posterior subcapsular · อาการทางจิต · การติดเชื้อ**\n\n### การดูแลระยะยาวที่ต้องทำทุกราย (นอกเหนือจากยากดภูมิคุ้มกัน)\n**ตัวกระตุ้นการกำเริบ: แสงแดด · การติดเชื้อ · ความเครียด · การตั้งครรภ์**\n\n| ด้าน | สิ่งที่ต้องทำ |\n|---|---|\n| **หัวใจและหลอดเลือด** | ปรับพฤติกรรม (**เลิกบุหรี่** คุมน้ำหนัก ออกกำลังกาย) · **คุมไขมันและความดัน** · **aPL บวกให้แอสไพริน · aPL บวกร่วมกับมีลิ่มเลือดให้ warfarin** |\n| **การติดเชื้อ** | **คัดกรอง HBV, HCV, HIV และฉีดวัคซีนไวรัสตับอักเสบบี** · **ป้องกัน _Pneumocystis jirovecii_** · **วัคซีนไข้หวัดใหญ่และนิวโมคอคคัส** · **วัคซีน HPV ในหญิงอายุน้อยเพื่อป้องกันมะเร็งปากมดลูก** · พิจารณา **recombinant zoster vaccine** เป็นรายบุคคล |\n| **กระดูก** | **ประเมินความเสี่ยงกระดูกหักและวัดมวลกระดูก** · **แคลเซียมและวิตามินดี** · **bisphosphonate เมื่อมีข้อบ่งชี้** |\n| **แสงแดด** | **ครีมกันแดด broad-spectrum** และลดการสัมผัสแสงอัลตราไวโอเลต |\n| **การตั้งครรภ์** | ให้คำปรึกษาเรื่องการคุมกำเนิดที่เหมาะกับความเสี่ยงลิ่มเลือดและอายุ · **เมื่อตั้งครรภ์ให้แอสไพรินขนาดต่ำเพื่อลดครรภ์เป็นพิษ (ตาม EULAR)** |\n", "pearls": ["ก่อนบอกว่ากำเริบ ต้องตัดการติดเชื้อและพิษยาออกก่อนเสมอ", "ขนาด prednisolone เลือกตามอวัยวะและความรุนแรง — เกล็ดเลือด < 25,000 หรือ AIHA หรือ LN class III/IV/V ใช้ pulse methylprednisolone", "HCQ ให้ทุกรายและต้องตรวจตาคัดกรอง bull's eye maculopathy", "ก่อนให้ยากดภูมิคุ้มกัน: CXR + ตรวจอุจจาระหาพยาธิ + ตรวจฟัน"], "nl": ["B5.2.2-3(5)", "2.3.13-3(15)", "B5.4(3)"], "items": [{"id": "AIR-33-02C-Q1", "kind": "own", "stem": "A 27-year-old woman with SLE on hydroxychloroquine alone presents with a 2-week history of easy bruising. She has no fever, no rash, and no new joint symptoms. Hb 12.4 g/dL, WBC 5,200/uL, platelet 18,000/uL, reticulocyte 1.2%, direct Coombs test negative, urinalysis normal, C3 low, anti-dsDNA rising. A blood smear confirms true thrombocytopenia without schistocytes. Which of the following is the most appropriate initial treatment?", "choices": ["Cyclophosphamide as first-line therapy for isolated thrombocytopenia", "Pulse intravenous methylprednisolone, continuing hydroxychloroquine", "Prednisolone 10 mg/day and observation, since she has no bleeding", "Platelet transfusion to keep the count above 50,000/uL, without immunosuppression", "Start warfarin because a low platelet count in lupus indicates antiphospholipid syndrome"], "answer": 1, "explain": "**เกล็ดเลือด < 25,000/µL ในผู้ป่วย SLE จัดเป็นภาวะรุนแรง** ตารางการรักษาตามความรุนแรงระบุให้ใช้ **pulse methylprednisolone (IVMP)** เพราะต้องการผลเร็วเพื่อป้องกันเลือดออกในอวัยวะสำคัญ จากนั้นจึงตามด้วย prednisolone และยากดภูมิคุ้มกันประคับประคอง (เช่น **azathioprine** ซึ่งเป็นตัวเลือกสำหรับความผิดปกติทางเลือดใน SLE) และ **ให้ hydroxychloroquine ต่อเสมอ**\n\nข้อมูลที่ช่วยยืนยันว่าเป็นกลไกภูมิคุ้มกันของ SLE เอง: **เกล็ดเลือดต่ำเดี่ยว ๆ · ไม่มี schistocyte (ตัด TTP/MAHA) · Coombs ลบ (ไม่ใช่ Evans syndrome) · complement ต่ำและ anti-dsDNA สูงขึ้นบอกว่าโรคกำลัง active**\n\n**ทำไมข้ออื่นผิด**\n- **Prednisolone 10 มก./วันแล้วรอดู** เป็นการรักษาของกลุ่มที่เกล็ดเลือดยังสูงกว่า 50,000 — ที่ 18,000 ถือว่าเสี่ยงเลือดออกเองแล้ว\n- **การให้เกล็ดเลือดไม่ใช่การรักษาหลัก** เพราะถูกทำลายโดยแอนติบอดีอย่างรวดเร็ว ใช้เฉพาะเมื่อมีเลือดออกรุนแรงหรือก่อนหัตถการ และต้องให้ร่วมกับการกดภูมิคุ้มกันเสมอ\n- **เกล็ดเลือดต่ำไม่ได้แปลว่าเป็น APS** และการให้ warfarin ขณะเกล็ดเลือด 18,000 อันตรายมาก การวินิจฉัย APS ต้องมีลิ่มเลือดหรือภาวะแทรกซ้อนการตั้งครรภ์ ร่วมกับแอนติบอดีที่ยืนยันซ้ำห่างกัน 12 สัปดาห์\n- **Cyclophosphamide** เก็บไว้สำหรับอวัยวะสำคัญ เช่น lupus nephritis class III/IV หรือ NPSLE ไม่ใช่ทางเลือกแรกของเกล็ดเลือดต่ำ", "pearl": "เกล็ดเลือด < 25,000 หรือ AIHA ใน SLE = ให้ pulse methylprednisolone ไม่ใช่ steroid ขนาดต่ำ และให้ HCQ ต่อเสมอ", "topic": "การรักษา SLE ตามความรุนแรงและการดูแลระยะยาว", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"]}, {"id": "AIR-33-02C-Q2", "kind": "own", "stem": "A 30-year-old woman is about to start prednisolone 40 mg/day plus mycophenolate mofetil for class IV lupus nephritis. Which of the following pre-treatment and long-term measures is most appropriate?", "choices": ["Give the live attenuated zoster vaccine now, before immunosuppression takes effect", "Defer bone protection until a fragility fracture occurs, since she is young and premenopausal", "Screen with chest radiograph, stool examination for parasites and a dental examination, give Pneumocystis prophylaxis, and add calcium, vitamin D and fracture-risk assessment", "Avoid all vaccination indefinitely because vaccines trigger lupus flares", "Stop hydroxychloroquine because it adds no benefit once mycophenolate is started"], "answer": 2, "explain": "**ก่อนเริ่มยากดภูมิคุ้มกันในบ้านเรา ต้องคัดกรองการติดเชื้อที่ซ่อนอยู่เสมอ — CXR (วัณโรค) · ตรวจอุจจาระหาพยาธิ (โดยเฉพาะ _Strongyloides_ ซึ่งเกิด hyperinfection syndrome ได้เมื่อได้สเตียรอยด์) · และตรวจฟัน** เพื่อกำจัดแหล่งติดเชื้อเรื้อรัง\n\nจากนั้นตามแนวทางการดูแลระยะยาว: **ป้องกัน _Pneumocystis jirovecii_** ในผู้ที่ได้สเตียรอยด์ขนาดสูงร่วมกับยากดภูมิคุ้มกัน · **คัดกรอง HBV, HCV, HIV และให้วัคซีนไวรัสตับอักเสบบี ไข้หวัดใหญ่ นิวโมคอคคัส และ HPV** · และ **ประเมินความเสี่ยงกระดูกหักพร้อมให้แคลเซียมและวิตามินดีตั้งแต่ต้น** (ไม่ต้องรอให้กระดูกหักก่อน)\n\n**ทำไมข้ออื่นผิด**\n- **วัคซีนเชื้อเป็นเป็นข้อห้ามเมื่อกดภูมิคุ้มกันแล้ว** และถ้าจะให้ต้องให้ล่วงหน้าอย่างน้อย 2–4 สัปดาห์ · ปัจจุบันแนะนำ **recombinant (subunit) zoster vaccine** ซึ่งไม่ใช่เชื้อเป็น\n- **hydroxychloroquine ต้องให้ต่อ** — ลดการกำเริบ ลดลิ่มเลือด และเพิ่มอัตรารอดชีวิต\n- วัคซีนเชื้อตายไม่ได้ทำให้ลูปัสกำเริบ และการติดเชื้อที่ป้องกันได้คือสาเหตุการตายอันดับต้นของผู้ป่วยกลุ่มนี้\n- ผู้ป่วยที่ได้สเตียรอยด์ขนาดสูงนานเสี่ยงกระดูกพรุนตั้งแต่เดือนแรก ๆ แม้อายุน้อย", "pearl": "ก่อนกดภูมิคุ้มกัน: CXR + อุจจาระหาพยาธิ + ตรวจฟัน แล้วตามด้วย PJP prophylaxis วัคซีนเชื้อตาย และการดูแลกระดูกตั้งแต่ต้น", "topic": "การรักษา SLE ตามความรุนแรงและการดูแลระยะยาว", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.1.1"]}]}, {"id": "air-33-03", "title": "Drug-induced lupus", "minutes": 4, "summary": "ยาเก่าไม่กี่ตัว · anti-histone บวก · ไตและสมองมักไม่ถูกทำลาย · หยุดยาแล้วหาย", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### ยาที่เป็นสาเหตุคลาสสิก\n**Hydralazine · procainamide · isoniazid · minocycline · methyldopa · quinidine · chlorpromazine · anti-TNF · ยากันชักบางตัว**\n\n### ลักษณะที่ต่างจาก SLE แท้\n| | Drug-induced lupus | SLE |\n|---|---|---|\n| เพศ | หญิง ≈ ชาย | หญิงมากกว่าชายมาก |\n| อายุ | มักสูงอายุ | วัยเจริญพันธุ์ |\n| อาการเด่น | **ไข้ ปวดข้อ ปวดกล้ามเนื้อ เยื่อหุ้มปอด/หัวใจอักเสบ** | หลายระบบรวมถึงไตและระบบประสาท |\n| **ไตและระบบประสาท** | **มักไม่ถูกทำลาย** | ถูกทำลายได้บ่อย |\n| **Anti-histone** | **บวกกว่า 95%** | บวกได้ราว 50–80% (ไม่จำเพาะ) |\n| Anti-dsDNA / C3, C4 | **มักลบ / ปกติ** | บวก / ต่ำเมื่อกำเริบ |\n| การรักษา | **หยุดยาต้นเหตุ** อาการดีขึ้นในสัปดาห์–เดือน ± NSAIDs/steroid ระยะสั้น | ยากดภูมิคุ้มกันระยะยาว |\n\n**กับดัก** — ผู้ป่วยที่กิน hydralazine หรือ isoniazid มานานแล้วมีไข้ ปวดข้อ เจ็บหน้าอกแบบ pleuritic อย่าเพิ่งวินิจฉัย SLE แล้วเริ่มยากดภูมิคุ้มกัน ให้ **ตรวจ anti-histone และหยุดยาต้นเหตุก่อน** ส่วนผู้ป่วยที่เกิดจาก anti-TNF อาจมี anti-dsDNA บวกได้ ซึ่งเป็นข้อยกเว้นของตาราง\n", "pearls": ["Hydralazine, procainamide, isoniazid, minocycline = ยาหลักของ drug-induced lupus", "Anti-histone บวก · anti-dsDNA ลบ · complement ปกติ · ไตไม่ถูกทำลาย", "การรักษาคือหยุดยา ไม่ใช่เริ่มยากดภูมิคุ้มกัน"], "items": [{"id": "AIR-MCQ-33", "kind": "mcq", "stem": "A 62-year-old man treated with hydralazine for 8 months develops fever, arthralgia and pleuritic chest pain. ANA is positive at 1:640 in a homogeneous pattern, anti-histone antibody is positive, anti-double-stranded DNA is negative, and C3/C4 are normal. Renal function and urinalysis are normal. Which of the following is the most appropriate management?", "choices": ["Start cyclophosphamide because pleural involvement indicates severe lupus", "Start hydroxychloroquine and continue hydralazine at a lower dose", "Start high-dose prednisolone with mycophenolate and continue hydralazine", "Stop hydralazine; symptoms usually resolve over weeks, with NSAID or short-course corticosteroid if needed", "Perform renal biopsy before any change in therapy"], "answer": 3, "explain": "**Drug-induced lupus (DIL) ต่างจาก SLE แท้อย่างชัดเจน และการรักษาคือ 'หยุดยา'**\n\n| | **Drug-induced lupus** | **Idiopathic SLE** |\n|---|---|---|\n| ยาต้นเหตุ | **hydralazine, procainamide, isoniazid, minocycline, anti-TNF, quinidine** | — |\n| อายุ/เพศ | สูงอายุ ชาย:หญิง ใกล้เคียงกัน | หญิงวัยเจริญพันธุ์เป็นหลัก |\n| อาการ | **ไข้ ปวดข้อ serositis** | หลายระบบ |\n| ไตและสมอง | **แทบไม่เป็น** | เป็นได้บ่อยและรุนแรง |\n| **Anti-histone** | **บวก > 95%** | บวกได้ ~50% |\n| **Anti-dsDNA / Sm** | **ลบ** | บวก |\n| Complement | **ปกติ** | **ต่ำเมื่อ active** |\n| การรักษา | **หยุดยา** | กดภูมิระยะยาว |\n\nอาการมักดีขึ้นภายในไม่กี่สัปดาห์หลังหยุดยา แม้ ANA อาจบวกอยู่ได้เป็นเดือนถึงปี ให้ NSAID หรือสเตียรอยด์สั้น ๆ ถ้าอาการมาก\n\n**ทำไมข้ออื่นผิด** — การใช้ยากดภูมิแรงหรือ cyclophosphamide ในภาวะที่หายเองเมื่อหยุดยาคือการทำร้ายผู้ป่วย; การใช้ยาต้นเหตุต่อไม่ว่าขนาดใดทำให้โรคคงอยู่; renal biopsy ไม่มีข้อบ่งชี้เมื่อปัสสาวะและการทำงานของไตปกติ", "pearl": "**Anti-histone บวก + anti-dsDNA ลบ + complement ปกติ + ไม่เข้าไตเข้าสมอง = drug-induced lupus → หยุดยา**", "topic": "Drug-induced lupus", "src": "", "ref": ["MED33 โพย MCQ ข้อ 7 'SLE ยา hydralazine'", "Harrison 21st ed., Drug-induced lupus"], "nl": ["2.3.13-3(15)", "B5.3(5)", "2.1.1"]}, {"id": "AIR-OLD-15", "kind": "old", "stem": "A 45-year-old woman on hydralazine for 1 year develops arthralgia, fever and pleuritic chest pain. ANA is positive, anti-double-stranded DNA is negative, anti-histone antibody is positive and complement levels are normal. What is the diagnosis?", "choices": ["Rheumatoid arthritis with serositis", "Systemic lupus erythematosus with renal involvement", "Drug-induced lupus erythematosus", "Viral pleuritis", "Acute rheumatic fever"], "answer": 2, "explain": "**Anti-histone บวก + anti-dsDNA ลบ + complement ปกติ + ไม่เข้าไตและสมอง = drug-induced lupus** ยาคลาสสิกคือ **hydralazine, procainamide, isoniazid, minocycline, anti-TNF** — รักษาโดย **หยุดยา** อาการหายในไม่กี่สัปดาห์ (ANA อาจบวกอยู่ได้เป็นเดือนถึงปี)", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 7 'SLE ยา hydralazine'", "ref": [], "nl": ["2.3.13-3(15)", "B5.3(5)"]}]}, {"id": "air-33-04", "title": "Antiphospholipid syndrome", "minutes": 7, "summary": "ลิ่มเลือดหรือการสูญเสียการตั้งครรภ์ + แอนติบอดีที่ยังบวกซ้ำหลัง 12 สัปดาห์", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)"], "md": "### เกณฑ์วินิจฉัย — ต้องมีทั้งทางคลินิกและทางห้องปฏิบัติการ\n**ทางคลินิก** (อย่างน้อยหนึ่งข้อ)\n- **ลิ่มเลือดอุดตัน** ในหลอดเลือดดำ หลอดเลือดแดง หรือหลอดเลือดฝอย (DVT, PE, stroke ในคนอายุน้อย)\n- **ภาวะแทรกซ้อนของการตั้งครรภ์** — แท้งไม่ทราบสาเหตุ **≥ 3 ครั้งก่อนอายุครรภ์ 10 สัปดาห์** · เสียชีวิตในครรภ์ **≥ 1 ครั้งหลัง 10 สัปดาห์** · คลอดก่อนกำหนดก่อน 34 สัปดาห์จาก **ครรภ์เป็นพิษรุนแรงหรือรกเสื่อม**\n\n**ทางห้องปฏิบัติการ** — ต้องบวก **อย่างน้อยหนึ่งใน 3 ตัว และตรวจซ้ำยังบวกอีกครั้งห่างกันอย่างน้อย 12 สัปดาห์**\n1. **Lupus anticoagulant**\n2. **Anticardiolipin IgG/IgM** ไทเตอร์ปานกลางถึงสูง\n3. **Anti-β2-glycoprotein I IgG/IgM**\n\n> เหตุผลที่ต้องตรวจซ้ำ — การติดเชื้อเฉียบพลันและภาวะลิ่มเลือดเองทำให้แอนติบอดีบวกชั่วคราวได้บ่อย การวินิจฉัยจากผลครั้งเดียวในช่วงที่เพิ่งเกิดลิ่มเลือดจึงไม่ถูกต้อง\n\n### เบาะแสในห้องแล็บ\n- **aPTT ยาวขึ้นและไม่แก้ด้วย mixing study** (ตรงข้ามกับการขาดปัจจัยการแข็งตัว) — ชื่อ “lupus anticoagulant” จึงหลอก เพราะในร่างกายจริงทำให้ **เลือดแข็งตัวง่ายขึ้น** ไม่ใช่เลือดออก\n- อาจพบ **VDRL บวกลวง** และเกล็ดเลือดต่ำเล็กน้อย\n\n### การรักษา\n- **มีลิ่มเลือดแล้ว** — **warfarin ระยะยาว เป้าหมาย INR 2–3** (แดงหลอดเลือดแดงหรือเกิดซ้ำอาจพิจารณา INR สูงขึ้นหรือเพิ่ม aspirin) · **ห้ามใช้ DOAC โดยเฉพาะในรายที่มีแอนติบอดีบวกทั้งสามตัว** เพราะการศึกษาพบการเกิดซ้ำสูงกว่า warfarin\n- **Obstetric APS** — **low-dose aspirin ร่วมกับ heparin ขนาดป้องกัน (LMWH) ตลอดการตั้งครรภ์และต่อไปอีก 6 สัปดาห์หลังคลอด** · **ห้าม warfarin ระหว่างตั้งครรภ์** เพราะทำให้ทารกพิการ · การให้ prednisolone หรือ IVIG ไม่ใช่การรักษามาตรฐาน\n- **Catastrophic APS** (ลิ่มเลือดหลายอวัยวะพร้อมกันในเวลาไม่กี่วัน) — ให้ heparin + steroid ขนาดสูง + plasma exchange หรือ IVIG และรักษาปัจจัยกระตุ้น\n- ผู้ป่วยที่มีแอนติบอดีบวกแต่ไม่เคยมีลิ่มเลือด: ควบคุมปัจจัยเสี่ยงหลอดเลือด พิจารณา aspirin ขนาดต่ำเป็นรายบุคคล และให้ hydroxychloroquine เมื่อมี SLE ร่วม\n\n### ที่อาจารย์เน้นในสไลด์\n\n**เกณฑ์ทางห้องปฏิบัติการฉบับละเอียด**\n- **Anticardiolipin (IgG หรือ IgM) ที่ไทเตอร์ปานกลางถึงสูง — มากกว่า 40 GPL/MPL หรือเกินเปอร์เซ็นไทล์ที่ 99**\n- **Anti-β2-glycoprotein I (IgG หรือ IgM) บวก**\n- **Lupus anticoagulant บวก**\n\n**ลำดับการแปลผล lupus anticoagulant ที่ออกสอบ**\n**aPTT ยาว → ทำ mixing test แล้วยังไม่แก้ (uncorrected) → เติม phospholipid แล้วแก้ (corrected with PL)** = มีสารยับยั้งที่ขึ้นกับ phospholipid นั่นคือ **lupus anticoagulant** (ถ้า mixing test แก้ได้แปลว่าขาดปัจจัยการแข็งตัวของเลือด ไม่ใช่ APS)\n\n**APS แบ่งเป็น primary (ไม่มีโรคอื่น) และ secondary (พบร่วมกับ SLE)** อาการหลักคือ **ลิ่มเลือดในหลอดเลือดแดง · ลิ่มเลือดในหลอดเลือดดำ · และภาวะแทรกซ้อนของการตั้งครรภ์ (แท้งซ้ำติดกัน และคลอดก่อนกำหนดจากครรภ์เป็นพิษ)**\n", "pearls": ["ต้องยืนยันแอนติบอดีซ้ำห่างกันอย่างน้อย 12 สัปดาห์", "aPTT ยาวที่ไม่แก้ด้วย mixing study แต่เลือดแข็งตัวง่าย = lupus anticoagulant", "APS ที่มีลิ่มเลือดใช้ warfarin INR 2–3 ไม่ใช้ DOAC", "ตั้งครรภ์ใช้ aspirin + LMWH ห้าม warfarin"], "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "items": [{"id": "AIR-MCQ-34", "kind": "mcq", "stem": "A 32-year-old woman has had three unexplained first-trimester miscarriages and one fetal death at 22 weeks. She also had an unprovoked deep vein thrombosis 2 years ago. Which of the following laboratory tests should be ordered to confirm the suspected diagnosis?", "choices": ["Anti-SSA (Ro) and anti-SSB (La) antibodies", "Factor V Leiden mutation alone", "Antineutrophil cytoplasmic antibody", "Lupus anticoagulant, anticardiolipin antibody and anti-beta-2-glycoprotein I, repeated at least 12 weeks apart", "Anti-histone antibody and complement levels"], "answer": 3, "explain": "**Antiphospholipid syndrome (APS) = การเกิดลิ่มเลือด (หลอดเลือดดำ แดง หรือหลอดเลือดขนาดเล็ก) และ/หรือภาวะแทรกซ้อนทางสูติกรรม ร่วมกับ antiphospholipid antibody ที่บวกซ้ำ**\n\n**ต้องครบทั้งเกณฑ์คลินิกและเกณฑ์แล็บ**\n- **คลินิกทางสูติกรรม**: แท้งก่อน 10 สัปดาห์ ≥ 3 ครั้งติดต่อกัน **หรือ** ทารกตายในครรภ์ ≥ 10 สัปดาห์ ≥ 1 ครั้ง **หรือ** คลอดก่อนกำหนดจาก preeclampsia/placental insufficiency\n- **แล็บ**: LA, anticardiolipin (IgG/IgM titer กลาง-สูง), anti-β2GPI ข้อใดข้อหนึ่ง และ **ต้องบวกซ้ำอีกครั้งห่างกันอย่างน้อย 12 สัปดาห์** เพื่อตัด antibody ชั่วคราวหลังติดเชื้อออก\n\n**ทำไมข้ออื่นผิด**\n- **Anti-SSA/SSB** สัมพันธ์กับ Sjogren และ **neonatal lupus/congenital heart block** ไม่ใช่สาเหตุของลิ่มเลือดและแท้งซ้ำ (เป็นตัวลวงที่โพยเก่าใส่ไว้)\n- **Anti-histone** ใช้กับ drug-induced lupus\n- **ANCA** ใช้กับ small-vessel vasculitis\n- **Factor V Leiden** อธิบาย venous thrombosis ได้แต่ไม่อธิบายการแท้งซ้ำ และพบน้อยมากในคนเอเชีย", "pearl": "แท้งซ้ำ + ลิ่มเลือด = **APS → ส่ง LA, anticardiolipin, anti-β2GPI และต้องยืนยันซ้ำที่ 12 สัปดาห์**", "topic": "Antiphospholipid syndrome — investigation", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 3 'หญิงตั้งครรภ์ ประวัติแท้ง 4 ครั้ง แบบ antiphospholipid syndrome ตรวจอะไร — a. Anti SSA (Ro) b. Anti-cardiolipin'", "Sydney/2023 ACR-EULAR APS criteria"], "nl": ["2.3.13-3(15)", "B5.3(5)"]}, {"id": "AIR-OLD-18", "kind": "old", "stem": "A woman with four unexplained pregnancy losses and a past unprovoked deep vein thrombosis is suspected of having antiphospholipid syndrome. Which antibody should be tested?", "choices": ["Anti-SSA (Ro) antibody", "Anti-topoisomerase I (Scl-70) antibody", "Anticardiolipin antibody (with lupus anticoagulant and anti-beta-2-glycoprotein I)", "Anti-histone antibody", "Anti-mitochondrial antibody"], "answer": 2, "explain": "โพยเก่าให้ตัวเลือก 'Anti SSA (Ro)' กับ 'Anti-cardiolipin' — **ตอบ anticardiolipin** และต้องส่งครบสามตัว (LA, aCL, anti-β2GPI) พร้อม **ยืนยันซ้ำห่างกันอย่างน้อย 12 สัปดาห์**; anti-SSA สัมพันธ์กับ Sjogren และ neonatal lupus/congenital heart block ไม่ใช่การแท้งซ้ำจากลิ่มเลือด", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 3 'ผู้หญิงตั้งครรภ์ มีประวัติแท้ง 4 ครั้ง ประวัติแบบ antiphospholipid syndrome ตรวจอะไร'", "ref": [], "nl": ["2.3.13-3(15)", "B5.3(5)"]}, {"id": "AIR-MCQ-35", "kind": "mcq", "stem": "The same patient is now 6 weeks pregnant. Antiphospholipid antibodies were positive on two occasions 12 weeks apart. Which of the following is the most appropriate management during this pregnancy?", "choices": ["No therapy because antiphospholipid antibodies do not affect pregnancy outcome", "Warfarin with a target INR of 2 to 3 throughout pregnancy", "High-dose prednisolone throughout pregnancy", "Low-dose aspirin alone with no anticoagulation", "Low-dose aspirin plus prophylactic low-molecular-weight heparin throughout pregnancy and postpartum"], "answer": 4, "explain": "**Obstetric APS รักษาด้วย low-dose aspirin + heparin** — aspirin เริ่มตั้งแต่ก่อนตั้งครรภ์หรือทันทีที่ทราบ และเติม LMWH เมื่อยืนยันการตั้งครรภ์ กลไก: ลดการเกิดลิ่มเลือดที่รก และ heparin ยังยับยั้งการจับของ antibody กับ trophoblast และลด complement activation → เพิ่มอัตราคลอดมีชีพจากราว 50% เป็น 70–80%\n\n**ผู้ป่วยรายนี้เคยมี thrombosis มาก่อน จึงต้องใช้ heparin ขนาดรักษาและให้ต่อหลังคลอดอย่างน้อย 6 สัปดาห์** ซึ่งเป็นช่วงที่เสี่ยงลิ่มเลือดสูงที่สุด\n\n**ทำไมข้ออื่นผิด**\n- **Warfarin ในไตรมาสแรกเป็นสารก่อวิรูป** (warfarin embryopathy: nasal hypoplasia, stippled epiphyses) และข้ามรกทำให้ทารกเลือดออก — heparin ไม่ข้ามรกจึงปลอดภัย\n- **Aspirin อย่างเดียว** ไม่พอเมื่อเข้าเกณฑ์ APS โดยเฉพาะรายที่มีประวัติ thrombosis\n- **Prednisolone ขนาดสูง** ไม่ช่วยผลลัพธ์การตั้งครรภ์ใน APS และเพิ่ม GDM, ความดันสูง, คลอดก่อนกำหนด\n- **ไม่ทำอะไรเลย** ปล่อยให้แท้งซ้ำทั้งที่ป้องกันได้", "pearl": "Obstetric APS = **aspirin ขนาดต่ำ + heparin** (ห้าม warfarin ในไตรมาสแรก) และให้ต่อหลังคลอด 6 สัปดาห์", "topic": "Obstetric antiphospholipid syndrome — management", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 3 (ต่อ)", "EULAR recommendations for APS in adults 2019"], "nl": ["2.3.13-3(15)"]}]}, {"id": "air-33-05", "title": "ดูแลผู้ป่วย SLE ระยะยาว — ติดเชื้อ พิษยา และการตั้งครรภ์", "minutes": 8, "summary": "แยกกำเริบจากติดเชื้อ · ตรวจตาเมื่อใช้ HCQ · ปวดสะโพกในคนกิน steroid · ยาที่ห้ามในครรภ์", "nl": ["B5.2.2-3(5)", "2.3.13-3(15)", "B5.4(3)"], "md": "### ไข้ในผู้ป่วย SLE ที่ได้ยากดภูมิคุ้มกัน\n**การติดเชื้อคือสาเหตุการตายอันดับต้น ๆ** ให้ถือว่าเป็นการติดเชื้อไว้ก่อนจนกว่าจะพิสูจน์เป็นอย่างอื่น\n\n| ชี้ไปทางการติดเชื้อ | ชี้ไปทางโรคกำเริบ |\n|---|---|\n| **CRP สูงมาก** (โรคกำเริบมักขึ้น ESR แต่ CRP ไม่สูงนัก ยกเว้น serositis หรือข้ออักเสบ) | anti-dsDNA สูงขึ้น |\n| **เม็ดเลือดขาวชนิด neutrophil สูง** | **C3/C4 ต่ำลง** |\n| procalcitonin สูง | เม็ดเลือดขาวต่ำ โปรตีนรั่วเพิ่ม ตะกอนปัสสาวะกลับมา active |\n| มีจุดโฟกัสชัด (ปอด ทางเดินปัสสาวะ ผิวหนัง) | ผื่น ผมร่วง แผลในปาก ปวดข้อ กลับมาพร้อมกัน |\n\n**ต้องเพาะเชื้อและหาจุดติดเชื้อเสมอ ก่อนเพิ่มขนาดยากดภูมิคุ้มกัน** และในผู้ป่วยที่ได้ steroid ขนาดสูงมานาน อย่าลืม **PJP, วัณโรค, cryptococcus, salmonella, CMV และเชื้อรา**\n\n### พิษของยาที่ต้องเฝ้าระวัง\n- **Hydroxychloroquine → retinopathy** ซึ่งทำให้ตาบอดถาวรและ **ไม่มีอาการในระยะแรก** จึงต้อง **ตรวจตาเมื่อเริ่มยา (baseline) และตรวจซ้ำทุกปีหลังใช้ครบ 5 ปี** (เร็วกว่านั้นถ้าไตเสื่อม ใช้ขนาดสูง หรือใช้ tamoxifen ร่วม) ด้วย automated visual field และ SD-OCT — ควบคุมขนาดยา **≤ 5 mg/kg ของน้ำหนักจริงต่อวัน**\n- **Corticosteroid ระยะยาว → osteonecrosis (avascular necrosis) ของหัวกระดูกต้นขา** — ปวดขาหนีบขณะลงน้ำหนัก **ภาพรังสีปกติในระยะแรก การตรวจที่ไวที่สุดคือ MRI** และยังต้องเฝ้าระวังกระดูกพรุน เบาหวาน ต้อกระจก ต้อหิน กล้ามเนื้ออ่อนแรง และการติดเชื้อ\n- **Cyclophosphamide** — hemorrhagic cystitis (ป้องกันด้วยน้ำและ mesna) · ภาวะมีบุตรยาก (พิจารณาเก็บไข่/อสุจิและใช้ GnRH agonist) · มะเร็งกระเพาะปัสสาวะในระยะยาว\n- **Mycophenolate** — กดไขกระดูก ท้องเสีย และ **ทำให้ทารกพิการ**\n\n### การตั้งครรภ์\n- วางแผนให้ตั้งครรภ์เมื่อ **โรคสงบอย่างน้อย 6 เดือน** โดยเฉพาะ lupus nephritis\n- **ยาที่ต้องหยุดก่อนตั้งครรภ์** — **mycophenolate, cyclophosphamide, methotrexate, leflunomide** และหลีกเลี่ยง ACEI/ARB\n- **ยาที่ใช้ต่อได้และควรใช้** — **hydroxychloroquine (ห้ามหยุด)**, azathioprine, tacrolimus, prednisolone ขนาดต่ำ · เพิ่ม **แอสไพรินขนาดต่ำตั้งแต่ไตรมาสแรกเพื่อลดครรภ์เป็นพิษ**\n- ตรวจ **anti-Ro/La** — ถ้าบวกต้องเฝ้าระวัง **congenital heart block** ด้วยการตรวจอัลตราซาวด์หัวใจทารกเป็นระยะ\n- แยก **lupus nephritis กำเริบ ออกจาก preeclampsia** — ไตอักเสบมักมี **ตะกอนปัสสาวะ active, complement ต่ำ, anti-dsDNA สูง** ขณะที่ครรภ์เป็นพิษมักมี **กรดยูริกสูง เกล็ดเลือดต่ำ ตับผิดปกติ หลังอายุครรภ์ 20 สัปดาห์**\n", "pearls": ["ไข้ในผู้ป่วย SLE ที่กินยากดภูมิ = ติดเชื้อไว้ก่อน · CRP สูงมากชี้ไปทางติดเชื้อ", "HCQ ต้องตรวจตา baseline และทุกปีหลังใช้ครบ 5 ปี", "ปวดขาหนีบในคนกิน steroid + ภาพรังสีปกติ = ส่ง MRI หา osteonecrosis", "Mycophenolate, cyclophosphamide, methotrexate ห้ามในครรภ์ · hydroxychloroquine ใช้ต่อ"], "items": [{"id": "AIR-MCQ-36", "kind": "mcq", "stem": "A 30-year-old man with lupus nephritis on prednisolone 30 mg daily and mycophenolate presents with 1 week of dry cough, fever and progressive dyspnea. PE: T 38.6 C, RR 28/min, SpO2 88% on room air, clear breath sounds. CXR shows bilateral interstitial infiltrates. Lab: WBC 9,000/mm3 with lymphocyte 600/mm3, LDH 520 U/L. Which of the following is the most appropriate initial management?", "choices": ["Perform bronchoscopy first and withhold all treatment until results return", "Increase prednisolone to 60 mg daily for a presumed lupus flare and observe", "Start intravenous cyclophosphamide for presumed lupus pneumonitis", "Start oral amoxicillin for community-acquired pneumonia and review in 1 week", "Treat empirically for Pneumocystis jirovecii pneumonia with trimethoprim-sulfamethoxazole and corticosteroid while confirming the diagnosis"], "answer": 4, "explain": "**ผู้ป่วยภูมิต้านตนเองที่ได้ยากดภูมิแล้วมาด้วยไข้ ต้องคิด 'ติดเชื้อ' ก่อน 'โรคกำเริบ' เสมอ** เพราะทั้งสองภาวะหน้าตาเหมือนกัน แต่การเดาผิดทางแล้วเพิ่มยากดภูมิอาจทำให้ผู้ป่วยเสียชีวิต\n\n**ภาพในเคสนี้เข้าได้กับ PCP อย่างยิ่ง** — ไอแห้ง ขาดออกซิเจนมากกว่าที่ฟังปอดได้ (ฟังปอดมักปกติ) ฝ้าแบบ interstitial สองข้าง LDH สูง และ **lymphopenia ในผู้ที่ได้ prednisolone ≥ 20 mg/วันนานเกิน 1 เดือน** ซึ่งเป็นกลุ่มที่ควรได้ **TMP-SMX ป้องกัน** อยู่แล้ว\n\n**การรักษา** — เริ่ม TMP-SMX ขนาดรักษาทันที และเพิ่ม **corticosteroid เสริมเมื่อ PaO2 < 70 mmHg หรือ A-a gradient > 35** (ป้องกันการแย่ลงจากการอักเสบเมื่อเชื้อถูกทำลาย) ระหว่างนั้นส่ง induced sputum หรือ BAL เพื่อยืนยัน และคัดกรอง HIV เสมอ\n\n**ทำไมข้ออื่นผิด** — การเพิ่มสเตียรอยด์หรือให้ cyclophosphamide โดยยังไม่ตัดการติดเชื้อออกคือความผิดพลาดที่อันตรายที่สุด; amoxicillin ไม่ครอบคลุมเชื้อฉวยโอกาสและอาการหนักเกินกว่าจะรักษาแบบผู้ป่วยนอก; การรอ bronchoscopy โดยไม่ให้ยาในผู้ที่ SpO2 88% ทำให้ผู้ป่วยแย่ลงระหว่างรอ", "pearl": "ผู้ป่วยกดภูมิ + ไข้ + ฝ้า interstitial + LDH สูง + ฟังปอดปกติ = **PCP จนกว่าจะพิสูจน์เป็นอื่น** — รักษาก่อน ยืนยันคู่กันไป", "topic": "Fever in a lupus patient on immunosuppression", "src": "", "ref": ["MED34 โพย MCQ 'ช. 30 ปี SLE, lupus nephritis on prednisolone มาด้วยไอ…'", "IDSA/ATS opportunistic infection guidance"], "nl": ["2.3.3-3(5)", "2.3.13-3(15)", "2.1.1"]}, {"id": "AIR-MCQ-37", "kind": "mcq", "stem": "A 38-year-old woman with SLE has taken hydroxychloroquine for 6 years. She is asymptomatic. Which of the following is the most appropriate monitoring plan for this drug?", "choices": ["Annual audiometry because ototoxicity is the main concern", "No eye screening is required because hydroxychloroquine does not affect the eye", "Annual liver function tests only", "Baseline eye examination within the first year, then annual screening after 5 years using automated visual fields and optical coherence tomography", "Weekly complete blood count for the first year"], "answer": 3, "explain": "**Hydroxychloroquine เป็นยาหลักของ SLE ที่ควรให้ทุกรายถ้าไม่มีข้อห้าม** (ลด flare ลดการเกิด lupus nephritis ลดลิ่มเลือด และเพิ่มอัตรารอด) แลกกับพิษที่สำคัญที่สุดคือ **retinopathy แบบ bull's-eye maculopathy** ซึ่งเมื่อเกิดแล้ว **แก้ไม่ได้** จึงต้องคัดกรองก่อนสูญเสียการมองเห็น\n\n**แนวทาง American Academy of Ophthalmology**\n- ตรวจตาพื้นฐานภายในปีแรก แล้ว **เริ่มคัดกรองทุกปีหลังใช้ยาครบ 5 ปี** (เร็วกว่านั้นถ้ามีปัจจัยเสี่ยง: ขนาด > 5 mg/kg/วันของน้ำหนักจริง, CKD, ใช้ tamoxifen, มีโรคจอตาเดิม)\n- เครื่องมือ: **automated visual field 10-2 (หรือ 24-2 ในคนเอเชียเพราะรอยโรคมักอยู่นอกกว่า) ร่วมกับ spectral-domain OCT**\n\n**หมายเหตุจากโพยเก่า** — ข้อเดิมเขียนว่า \"maculopathy ห้ามให้ **hydroxyurea**\" ซึ่งสับสนชื่อยา; ยาที่ทำให้เกิด maculopathy คือ **hydroxychloroquine** ส่วน hydroxyurea ใช้ในโรคเลือดและมีพิษหลักคือกดไขกระดูกและแผลที่ขา\n\n**ทำไมข้ออื่นผิด** — การตรวจตับ การได้ยิน หรือ CBC ถี่ ๆ ไม่ใช่การติดตามหลักของยานี้ (LFT/CBC เป็นการติดตามของ methotrexate และ azathioprine)", "pearl": "Hydroxychloroquine = ยาหลักของ SLE ที่ต้อง **คัดกรองจอตาปีละครั้งหลังใช้ครบ 5 ปี** และคุมขนาดไม่เกิน 5 mg/kg/วัน", "topic": "Hydroxychloroquine retinopathy", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 2 'Maculopathy ห้ามให้ยา (โพยเขียน hydroxyurea)'", "AAO Hydroxychloroquine Screening Recommendations 2016"], "nl": ["2.3.13-3(15)", "B5.4(3)"]}, {"id": "AIR-OLD-17", "kind": "old", "stem"
