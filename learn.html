tively birefringent อยู่ในเซลล์ จงแปลผลให้ครบและให้การวินิจฉัยที่แน่นอน", "a": "**แปลผล**: เป็นน้ำไขข้อแบบ **inflammatory** (WBC 2,000–50,000, PMN > 50%, ความหนืดลดลง) ยังไม่เข้าเกณฑ์ septic ซึ่งมักเกิน 50,000 และ PMN > 90%\n**ผลึกรูปเข็ม negatively birefringent (เหลืองเมื่อขนานแกน compensator) ที่อยู่ภายในเซลล์เม็ดเลือดขาว = monosodium urate**\n**Definite diagnosis: acute gouty arthritis**\nข้อควรระวัง: **การพบผลึกไม่ตัด septic arthritis ออก** เพราะเกิดพร้อมกันได้ จึงต้องรอผลเพาะเชื้อและติดตามอาการ ถ้าไข้ไม่ลดหรือผลเพาะขึ้นต้องรักษาเป็นข้อติดเชื้อทันที"}, {"q": "4. จงวางแผนการรักษาระยะเฉียบพลันในผู้ป่วยรายนี้ พร้อมเหตุผลของการเลือกยา", "a": "เป้าหมายคือลดการอักเสบให้เร็วที่สุด เลือกยาตามโรคร่วม — ผู้ป่วยมี **eGFR 66 และความดันโลหิตสูง**\n- **ทางเลือกที่เหมาะที่สุด**: **colchicine ขนาดต่ำ** (1.2 mg แล้วตามด้วย 0.6 mg ใน 1 ชั่วโมง จากนั้น 0.6 mg วันละ 1-2 ครั้ง) **หรือ prednisolone 30-35 mg/วัน 5 วัน** หรือ **ฉีดสเตียรอยด์เข้าข้อ** (ทำได้เมื่อผลเพาะเชื้อไม่ขึ้นและมั่นใจว่าไม่ติดเชื้อ)\n- **NSAID** ใช้ได้แต่ต้องระวังไตและความดัน ถ้าใช้ให้ระยะสั้นที่สุดพร้อมยาป้องกันกระเพาะ\n- ประคบเย็น พักข้อ ยกสูง\n- **ห้าม** เริ่ม allopurinol เดี่ยว ๆ ระหว่าง flare และ **ห้าม** หยุด ULT ที่กินอยู่เดิม (รายนี้ยังไม่เคยได้)"}, {"q": "5. หลังอาการสงบ 3 สัปดาห์ ผู้ป่วยกลับมาตรวจ จงวางแผนการรักษาระยะยาวและคำแนะนำ", "a": "**ข้อบ่งชี้ ULT**: flare ≥ 2 ครั้ง/ปี และมี tophus ที่ใบหู → **เริ่ม urate-lowering therapy**\n1) **คัดกรอง HLA-B\\*58:01** ก่อนเริ่ม allopurinol (คนไทย)\n2) **Allopurinol เริ่ม 100 mg/วัน** ปรับขึ้นทุก 2–5 สัปดาห์ จน **urate < 6 mg/dL** (มี tophus ให้ < 5) แล้วกินต่อเนื่องตลอด\n3) **Prophylaxis** ด้วย colchicine 0.6 mg วันละครั้ง ต่ออีก 3–6 เดือน\n4) **เปลี่ยน hydrochlorothiazide** เป็น **losartan** หรือ amlodipine ซึ่งไม่เพิ่ม (losartan ช่วยลด) urate\n5) **คำแนะนำ**: ลดน้ำหนัก, งด/ลดเบียร์และสุรา, ลดเครื่องดื่มน้ำตาลฟรุกโตสสูง เครื่องในสัตว์ อาหารทะเลบางชนิด, ดื่มน้ำให้พอ, ออกกำลังกายสม่ำเสมอ\n6) ติดตาม uric acid, ไต และตับเป็นระยะ และอธิบายว่า **ห้ามหยุดยาเมื่อ flare** และหากมีผื่นหลังเริ่ม allopurinol ต้องหยุดยาและมาพบแพทย์ทันที (เสี่ยง SCAR)"}], "ref": ["MED35 MEQ 'ผช. ปวดเข่ามากจนเดินไม่ได้ + ไข้ — ddx 4 โรค, วิธีดูน้ำที่เจาะ, definite dx acute gouty attack, รักษาระยะแรกและต่อไป'", "ACR Gout Guideline 2020"], "nl": ["2.1.27", "B5.2.5(1)", "2.3.13(2)", "B5.3(3)", "B5.3(4)", "B5.4(4)", "3.1.7"], "_kind": "meq", "_set": "air"}], "osce": [{"id": "AIR-OSCE-01", "part": "OSCE/SAQ", "lec": "23", "lecture": "Approach to arthritis / crystal and infective arthropathy", "topic": "SAQ – Synovial fluid crystal under polarized light", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ชายไทยอายุ 50 ปี มาด้วยปวดบวมแดงร้อนที่โคนนิ้วหัวแม่เท้าขวาอย่างเฉียบพลัน 1 วัน แพทย์เจาะน้ำไขข้อส่งตรวจ ได้ภาพจากกล้องจุลทรรศน์แบบ polarized light ดังรูป (ผลึกรูปเข็มยาว อยู่ทั้งในและนอกเซลล์เม็ดเลือดขาว เรืองสีเหลืองเมื่อวางขนานกับแกนของ compensator)\n\n2.1 จงบรรยายลักษณะผลึกที่เห็นในสไลด์ (2 คะแนน)\n2.2 ผลึกนี้คือสารใด และการวินิจฉัยคืออะไร (2 คะแนน)\n2.3 ถ้าผลึกเป็นรูปสี่เหลี่ยมขนมเปียกปูนและเรืองสีน้ำเงินเมื่อขนานกับแกน compensator จะเป็นสารใดและโรคใด (2 คะแนน)\n2.4 จงบอกค่าน้ำไขข้อ (ลักษณะ จำนวนเม็ดเลือดขาว สัดส่วน PMN) ที่ทำให้ท่านต้องคิดถึง septic arthritis (2 คะแนน)\n2.5 ผู้ป่วยรายนี้มีโรคไตเรื้อรังระยะ 3 และเคยมีแผลในกระเพาะอาหาร ท่านจะเลือกยารักษาอาการเฉียบพลันตัวใด (2 คะแนน)", "answer": "**2.1 บรรยายผลึก (2 คะแนน)**\n- ผลึก **รูปเข็มยาวปลายแหลม (needle-shaped)** ยาวประมาณ 5–20 ไมครอน\n- **negatively birefringent อย่างแรง** — เรือง **สีเหลือง** เมื่อวางขนานกับแกนของ compensator และเปลี่ยนเป็นสีน้ำเงินเมื่อวางตั้งฉาก\n- พบผลึก **อยู่ภายในเซลล์เม็ดเลือดขาว (intracellular)** ซึ่งยืนยันว่าเป็นสาเหตุของการอักเสบขณะนี้ ไม่ใช่ผลึกที่ค้างอยู่เฉย ๆ\n\n**2.2 (2 คะแนน)** สารคือ **monosodium urate (MSU)** → วินิจฉัย **acute gouty arthritis (โรคเก๊าท์กำเริบเฉียบพลัน)** ตำแหน่งที่โคนนิ้วหัวแม่เท้าเรียกว่า **podagra**\n\n**2.3 (2 คะแนน)** ผลึกรูป **rhomboid** ที่ **weakly positively birefringent** (น้ำเงินเมื่อขนานแกน) คือ **calcium pyrophosphate dihydrate (CPPD)** → โรค **pseudogout (calcium pyrophosphate deposition disease)** มักพบที่เข่าและข้อมือ และเห็น **chondrocalcinosis** บนภาพรังสี\n\n**2.4 (2 คะแนน)** คิดถึง septic arthritis เมื่อ\n- น้ำไขข้อ **ขุ่นข้นคล้ายหนอง ความหนืดลดลงมาก**\n- **WBC > 50,000 /uL** (โดยเฉพาะเมื่อ > 100,000)\n- **PMN > 90%**\n- Gram stain หรือ culture พบเชื้อ (ส่งเสมอแม้พบผลึก เพราะเกิดร่วมกันได้)\n\n**2.5 (2 คะแนน)** มี **CKD stage 3 + ประวัติแผลในกระเพาะอาหาร** จึง **หลีกเลี่ยง NSAID** → เลือก **colchicine ขนาดต่ำ (1.2 mg แล้วตาม 0.6 mg ใน 1 ชั่วโมง ปรับตามการทำงานของไต)** หรือ **prednisolone 30–35 mg/วัน 5 วัน** หรือ **ฉีดสเตียรอยด์เข้าข้อ** เมื่อมั่นใจว่าไม่ใช่ข้อติดเชื้อ\n\n**เกณฑ์ให้คะแนนรวม 10 คะแนน** — ตอบชื่อผลึกและโรคถูกแต่ไม่บรรยาย birefringence ได้ครึ่งคะแนนของข้อนั้น", "ref": ["MED35 OSCE/SAQ ข้อ 7 'ให้ประวัติชายอายุ 50 ปวดข้อ ให้บรรยายภาพสไลด์ uric acid crystal needle shape และวินิจฉัย ตอบ gout'"], "nl": ["B5.3(3)", "3.1.7", "B5.2.5(1)", "2.3.13(2)"], "_kind": "meq", "_set": "air"}], "sections": [{"id": "air-23-01", "title": "เข้าหาอาการปวดข้ออย่างเป็นระบบ และการแปลผลน้ำไขข้อ", "minutes": 9, "summary": "สี่คำถามที่ตัดโรคได้เกือบหมด และตัวเลขน้ำไขข้อที่ต้องจำ", "nl": ["2.1.27", "2.1.26"], "md": "### สี่คำถามที่ต้องตอบให้ได้ก่อนคิดชื่อโรค\n1. **ปวดในข้อจริงหรือรอบข้อ** — ข้ออักเสบจริงจะเจ็บเมื่อขยับ **ทุกทิศทาง ทั้ง active และ passive** และมักบวมมีน้ำในข้อ ส่วน bursitis/tendinitis เจ็บเฉพาะทิศที่ดึงเอ็นนั้นและกดเจ็บเป็นจุด\n2. **อักเสบหรือกลไก (inflammatory vs mechanical)**\n   - inflammatory: **ข้อฝืดตอนเช้านานกว่า 30–60 นาที** ดีขึ้นเมื่อขยับ บวมแดงร้อน มีอาการทั่วกาย ESR/CRP สูง\n   - mechanical: ฝืดตอนเช้าน้อยกว่า 30 นาที **แย่ลงเมื่อใช้งาน ดีขึ้นเมื่อพัก** ไม่ค่อยมีอาการทั่วกาย\n3. **กี่ข้อ** — 1 ข้อ (mono) · 2–4 ข้อ (oligo) · ≥ 5 ข้อ (poly)\n4. **เฉียบพลันหรือเรื้อรัง** (เกิน 6 สัปดาห์) และ **สมมาตรหรือไม่ · ข้อไหน**\n\n| รูปแบบ | โรคที่ต้องนึกถึง |\n|---|---|\n| Acute monoarthritis | **septic arthritis · gout · CPPD** (± trauma, hemarthrosis) |\n| Acute oligoarthritis ในคนหนุ่มสาว | reactive arthritis, **disseminated gonococcal infection**, spondyloarthritis |\n| Chronic symmetric polyarthritis ข้อเล็ก | **rheumatoid arthritis**, SLE, viral |\n| Chronic asymmetric ข้อใหญ่ + ปวดหลังอักเสบ | spondyloarthritis, psoriatic arthritis |\n| Mechanical ข้อรับน้ำหนัก + DIP | **osteoarthritis** |\n\n### การเจาะน้ำไขข้อ (arthrocentesis)\n**ข้ออักเสบเฉียบพลันข้อเดียวต้องเจาะน้ำไขข้อเสมอ** จนกว่าจะพิสูจน์ได้ว่าไม่ใช่การติดเชื้อ — ส่งอย่างน้อย 3 อย่าง: **cell count + differential · Gram stain และเพาะเชื้อ · ตรวจผลึกด้วย polarized light**\n\n| ชนิด | ลักษณะ | WBC (/µL) | PMN | ตัวอย่าง |\n|---|---|---|---|---|\n| Normal | ใส หนืด | < 200 | < 25% | — |\n| Non-inflammatory | ใสเหลืองอ่อน | 200–2,000 | < 25% | **osteoarthritis**, trauma |\n| Inflammatory | ขุ่นเหลือง | **2,000–50,000** | > 50% | **gout, CPPD, RA, reactive** |\n| Septic | ขุ่นข้นคล้ายหนอง | **> 50,000 (มัก > 100,000)** | **> 75–90%** | bacterial septic arthritis |\n| Hemarthrosis | เลือด | — | — | trauma, ภาวะเลือดออกง่าย, PVNS |\n\n> **ข้อควรระวังที่ออกสอบเสมอ** — น้ำไขข้อที่มีผลึกเกาต์ **ไม่ตัดการติดเชื้อออก** ผู้ป่วยเป็นทั้งสองอย่างพร้อมกันได้ ถ้า WBC สูงมากหรือมีไข้และดูป่วยหนัก ให้รักษาเหมือนติดเชื้อไปก่อนจนกว่าผลเพาะเชื้อจะออก\n\n### สิ่งที่ต้องไม่ทำ\n- **อย่าเริ่มยาปฏิชีวนะก่อนเจาะข้อและเจาะ hemoculture** ถ้าผู้ป่วยไม่ได้อยู่ในภาวะช็อก\n- อย่าเจาะผ่านผิวหนังที่มีการติดเชื้อ (cellulitis) เพราะจะพาเชื้อเข้าข้อ\n- **ระดับกรดยูริกในเลือดขณะกำเริบ ใช้วินิจฉัยหรือตัดโรคเกาต์ไม่ได้** — ขณะกำเริบค่าอาจปกติหรือต่ำได้ถึงหนึ่งในสาม\n- MRI หรือ CT ไม่ใช่การตรวจอันดับแรกของข้ออักเสบเฉียบพลันข้อเดียว\n\n### ที่อาจารย์เน้นในสไลด์\n\n**Articular หรือ periarticular — แยกด้วยสามข้อนี้**\n\n| | Articular | Periarticular |\n|---|---|---|\n| บวมแดง | รอบข้อทั้งข้อ | เฉพาะจุดเดียว |\n| เจ็บเมื่อ | ขยับเอง **และ** ถูกขยับ (active + passive) | ขยับเองเท่านั้น (active) |\n| ตำแหน่งที่เจ็บ | อยู่ในแนวข้อ (articular line) | ไม่อยู่ในแนวข้อ |\n| Effusion | **มี** | ไม่มี |\n\nถ้าเป็น nonarticular ให้คิดถึง trauma/fracture · fibromyalgia · **polymyalgia rheumatica** · bursitis · tendinitis · การติดเชื้อเนื้อเยื่ออ่อน · เนื้องอกกระดูก\n\n**Inflammation หรือ degenerative**\n\n| | Inflammation | Degenerative |\n|---|---|---|\n| อายุ | ทุกวัย | สูงอายุ |\n| ข้อฝืด | นาน | สั้น |\n| ปวดตอน | **พัก** | **ใช้งาน** |\n| อ่อนแรง | ทั้งตัว | เฉพาะรอบข้อนั้น |\n| อ่อนเพลีย/อาการทั่วกาย | มี | ไม่มี |\n| บวมและ effusion | ชัดเจน | เล็กน้อย |\n| ร้อนแดง | มักมี | มักไม่มี |\n| Crepitus | ละเอียดถึงปานกลาง | หยาบถึงปานกลาง |\n| Osteophyte | อาจมี | มักมี |\n\n**ลักษณะการกำเริบ (character of attack) ที่ต้องซักให้ได้** — เป็น ๆ หาย ๆ (intermittent) · สะสมเพิ่มข้อ (additive) · ย้ายที่ (migratory) และเส้นแบ่งเฉียบพลันกับเรื้อรังที่อาจารย์ใช้คือ **6 สัปดาห์**\n\n**อัลกอริทึมที่ใช้สอบ**\n- **เรื้อรัง ไม่อักเสบ** → จับ **DIP, CMC ที่ 1, สะโพก หรือเข่า** ไหม? จับ = **osteoarthritis** · ไม่จับ = คิดถึง **osteonecrosis, Charcot arthritis**\n- **เรื้อรัง อักเสบ** → กี่ข้อ? **1–4 ข้อ** = indolent infection, psoriatic, reactive, pauciarticular JIA · **> 4 ข้อ** → สมมาตรไหม → จับ **PIP/MCP/MTP** ไหม → จับ = **rheumatoid arthritis** · ไม่เข้ากับ RA = คิดถึง **SLE, systemic sclerosis, PM/DM**\n\n**ค่าน้ำไขข้อฉบับสไลด์ (มีค่าที่ไม่ค่อยมีใครจำ)**\n\n| | Normal | Non-inflam | Inflam | Purulent | Hemarthrosis |\n|---|---|---|---|---|---|\n| Viscosity | สูงมาก | สูง | ต่ำ | ต่ำมาก | ต่ำ |\n| Mucin clot | ดี | พอใช้–ดี | พอใช้–แย่ | แย่ | ± |\n| WBC (/µL) | < 50 | < 3,000 | **3,000–50,000** | **50,000–100,000** | แปรผัน |\n| PMN | < 25% | < 25% | > 70% | **> 90%** | แปรผัน |\n| Organism | – | – | ± | **++/–** | ± |\n\nดูความหนืดข้างเตียงด้วย **string test (spinnbarkeit)** และ **mucin clot test** (หยดน้ำไขข้อลงกรดอะซิติก)\n\n**เซลล์พิเศษในน้ำไขข้อ** — **LE cell** (neutrophil กลืน immune complex) · **ragocyte** (เม็ดเลือดขาวที่มีเม็ดของ immune complex — พบใน septic arthritis, RA, gout, pseudogout) · **Reiter cell** (mononuclear ขนาดใหญ่กลืน neutrophil ที่กำลัง apoptosis — ReA, RA) · **eosinophilic synovitis** (เลือดออกในข้อ หลังฉีดสารทึบรังสี พยาธิ)\n\n**ข้อห้ามของการเจาะข้อ** — ภาวะเลือดออกง่าย · **ผิวหนังเหนือข้อติดเชื้อ หรือกำลังมีเชื้อในกระแสเลือด** · **ข้อเทียม** (ต้องให้ออร์โธปิดิกส์ทำ) · เจาะหลายครั้งไม่สำเร็จ · ผู้ทำไม่มีประสบการณ์ · ผู้ป่วยปฏิเสธ\n", "pearls": ["ข้ออักเสบเฉียบพลันข้อเดียว = เจาะน้ำไขข้อก่อนเสมอ", "ฝืดตอนเช้า > 30–60 นาที = inflammatory · ใช้งานแล้วแย่ลง = mechanical", "เจอผลึกแล้วยังตัด septic arthritis ไม่ได้ — เป็นพร้อมกันได้", "กรดยูริกปกติขณะกำเริบไม่ตัดเกาต์", "เส้นแบ่งเฉียบพลัน/เรื้อรังของอาจารย์คือ 6 สัปดาห์ และต้องระบุ character ให้ได้ว่า intermittent · additive หรือ migratory", "ข้อห้ามเจาะข้อ: ผิวหนังเหนือข้อติดเชื้อ · กำลังมีเชื้อในกระแสเลือด · ข้อเทียม"], "source": "สไลด์ อ.โชคชัย — How to approach in arthritis patients", "items": [{"id": "AIR-MCQ-14", "kind": "mcq", "stem": "A 58-year-old man presents with a hot, swollen, exquisitely tender right knee for 2 days and fever 38.5 C. He has had three similar self-limited episodes in the past 2 years. He cannot bear weight. Which of the following is the most appropriate initial investigation?", "choices": ["Arthrocentesis for synovial fluid cell count, crystal examination and Gram stain with culture", "Blood culture alone before any joint procedure", "Serum uric acid level", "Magnetic resonance imaging of the right knee", "Plain radiograph of both knees"], "answer": 0, "explain": "**ข้ออักเสบเฉียบพลันข้อเดียว + ไข้ = ต้องตัด septic arthritis ออกก่อนเสมอ เพราะทำลายกระดูกอ่อนภายใน 24–48 ชั่วโมงและมีอัตราตายสูง** การเจาะข้อเป็นการตรวจเดียวที่ตอบได้ทั้งติดเชื้อและผลึก\n\n**อ่านน้ำไขข้ออย่างไร**\n\n| | ปกติ | Non-inflammatory (OA) | Inflammatory (gout, CPPD, RA) | **Septic** |\n|---|---|---|---|---|\n| สี/ความใส | ใส | ใส เหลืองอ่อน | ขุ่น | **ขุ่นข้น เป็นหนอง** |\n| WBC (/mm3) | < 200 | **< 2,000** | **2,000–50,000** | **> 50,000 (มักเกิน 100,000)** |\n| PMN | < 25% | < 25% | > 50% | **> 90%** |\n| ความหนืด | สูง | สูง | ต่ำ | ต่ำมาก |\n\n**ทำไมข้ออื่นผิด**\n- **Serum uric acid** ตอนกำลังปวดอาจ **ปกติหรือต่ำ** ได้ถึง 1 ใน 3 (เพราะ urate ตกตะกอนลงข้อ) และค่าที่สูงก็ไม่ตัด septic arthritis ออก — เป็นกับดักคลาสสิก\n- **Plain film** ในเก๊าท์ระยะแรกมักปกติ; ที่เห็น punched-out erosion คือระยะเรื้อรัง\n- **Blood culture อย่างเดียว** ขึ้นเชื้อเพียงครึ่งหนึ่งของ septic arthritis และไม่ควรทำแทนการเจาะข้อ (ส่งคู่กันได้)\n- **MRI** ใช้ดู osteomyelitis หรือเมื่อเจาะไม่ได้ ไม่ใช่การตรวจแรก", "pearl": "ข้ออักเสบเฉียบพลันข้อเดียว = **เจาะข้อก่อน** เสมอ; uric acid ปกติไม่ตัดเก๊าท์ และ uric acid สูงก็ไม่ตัดข้อติดเชื้อ", "topic": "Acute monoarthritis — first investigation", "src": "", "ref": ["MED35 MEQ 'ผช. ปวดเข่ามากจนเดินไม่ได้ + ไข้ — บอกวิธีการดูน้ำที่เจาะ'", "ACR Gout Guideline 2020"], "nl": ["2.1.27", "B5.3(3)", "3.1.7", "2.3.13(2)", "2.3.13-3(6)"]}, {"id": "AIR-OLD-26", "kind": "old", "stem": "A 45-year-old man presents with acute arthritis. Which of the following history items is most important to obtain?", "choices": ["Only current occupation", "Sexual history, alcohol intake, recent infection and family history of arthritis", "Only a history of previous trauma", "Only the response to paracetamol", "Only the duration of pain"], "answer": 1, "explain": "โพยเก่าตอบ **'sex, drinking, smoking, family'** — เหตุผลคือประวัติแต่ละข้อชี้โรคคนละโรค: **เพศสัมพันธ์** → gonococcal arthritis และ reactive arthritis, **สุรา** → เก๊าท์และ osteonecrosis, **การติดเชื้อทางเดินอาหาร/ปัสสาวะนำมาก่อน** → reactive arthritis, **ประวัติครอบครัว** → RA, spondyloarthropathy, สะเก็ดเงิน; บวก **ยาที่ใช้** (thiazide, pyrazinamide) และ **ประวัติฉีดยาเข้าเส้น**", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 16 'Arthritis ถามว่าต้องถามประวัติอะไร > sex, drinking, smoking, fam'", "ref": [], "nl": ["2.1.27", "2.3.13(2)", "2.3.13-3(6)"]}]}, {"id": "air-23-02", "title": "เกาต์เฉียบพลัน — ผลึกและการรักษาช่วงกำเริบ", "minutes": 8, "summary": "ผลึกรูปเข็ม negatively birefringent และการเลือกยาตามโรคร่วม", "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.4(4)"], "md": "### กลไก\nกรดยูริกเป็นผลผลิตสุดท้ายของการสลาย purine ในมนุษย์ (เราไม่มี uricase) เมื่อระดับในเลือดเกินจุดอิ่มตัวราว **6.8 mg/dL** จะตกผลึกเป็น **monosodium urate (MSU)** ในข้อและเนื้อเยื่อ ผลึกถูก phagocyte กลืนแล้วกระตุ้น **NLRP3 inflammasome → IL-1β** จึงเกิดการอักเสบรุนแรงเฉียบพลัน — นี่คือเหตุผลที่ยาต้าน IL-1 ได้ผลในผู้ป่วยที่ใช้ยาอื่นไม่ได้\n\nราวร้อยละ 90 ของผู้ป่วยเกิดจาก **การขับกรดยูริกทางไตลดลง** ไม่ใช่สร้างมากเกิน ตัวกระตุ้นที่พบบ่อย: **เบียร์และสุรา · อาหารทะเล เครื่องในสัตว์ · เครื่องดื่มผสมฟรุกโตส · ยาขับปัสสาวะ · ภาวะขาดน้ำ · การผ่าตัด · การเริ่มหรือหยุดยาลดกรดยูริกกะทันหัน**\n\n### ภาพทางคลินิกและผลึก\n- ปวดรุนแรงถึงขีดสุดภายใน **6–12 ชั่วโมง** บวมแดงร้อนจนแตะไม่ได้ ตำแหน่งคลาสสิกคือ **โคนนิ้วหัวแม่เท้า (podagra)** รองลงมาคือ ข้อเท้า หลังเท้า เข่า\n- **ผลึก MSU: รูปเข็มยาว ปลายแหลม · negatively birefringent อย่างแรง · เรืองสีเหลืองเมื่อวางขนานกับแกน compensator** และอยู่ในเซลล์เม็ดเลือดขาวขณะกำเริบ\n- จำด้วยประโยค **“yellow when parallel = urate”**\n\n### รักษาช่วงกำเริบ — เลือกตามโรคร่วม ไม่ใช่ตามความชอบ\n| สถานการณ์ | เลือกใช้ | เหตุผล |\n|---|---|---|\n| ไตปกติ ไม่มีแผลในกระเพาะ ไม่ใช้ยาต้านการแข็งตัว | **NSAIDs ขนาดเต็ม** | ออกฤทธิ์เร็ว |\n| **CKD หรือประวัติแผลในกระเพาะ / ได้ยาต้านการแข็งตัว** | **corticosteroid** (prednisolone 30–35 mg/วัน 5 วัน หรือฉีดในข้อเมื่อเป็นข้อเดียวและตัดการติดเชื้อแล้ว) | ปลอดภัยต่อไตและกระเพาะที่สุด |\n| ต้องการยาทางเลือก | **colchicine ขนาดต่ำ** 1.2 mg แล้วตามด้วย 0.6 mg ใน 1 ชั่วโมง | ขนาดสูงแบบเดิมทำให้ท้องเสียรุนแรงโดยไม่ได้ผลดีกว่า |\n| ใช้ยาข้างต้นไม่ได้ทั้งหมด | anti-IL-1 (anakinra) | ตรงกลไก |\n\n**ข้อควรจำเรื่อง colchicine** — ต้องลดขนาดใน CKD และในผู้ที่ได้ **clarithromycin, ketoconazole, ciclosporin, verapamil (ยับยั้ง CYP3A4/P-gp)** เพราะเสี่ยงต่อ myotoxicity และไขกระดูกกดการทำงาน\n\n> **อย่าเริ่มหรืออย่าหยุดยาลดกรดยูริกขณะกำเริบโดยไม่มีมาตรการป้องกัน** — การเปลี่ยนระดับกรดยูริกอย่างรวดเร็วทำให้ผลึกหลุดและอักเสบซ้ำ ถ้าผู้ป่วยกิน allopurinol อยู่แล้ว **ให้กินต่อไม่ต้องหยุด**\n\n### ที่อาจารย์เน้นในสไลด์\n\n- **ร้อยละ 75 ของการกำเริบครั้งแรกอยู่ที่ MTP ที่ 1 ข้อเท้า และเข่า** · มักเริ่ม **กลางดึก** · ส่วนใหญ่ข้อเดียวแต่เป็นหลายข้อได้ · **หายเองใน 3–10 วัน** แล้วกลับมาเป็นซ้ำ\n- **กรดยูริกในเลือดจะสูงหรือไม่สูงก็ได้** — สิ่งที่ยืนยันคือผลึกยูเรตในน้ำไขข้อ\n\n**Overproduction เทียบกับ under-excretion (อาจารย์แยกเป็นสองคอลัมน์)**\n\n| สร้างมากเกิน (~10%) | ขับออกน้อย (~90%) |\n|---|---|\n| **PRPP synthetase ทำงานมากเกิน** · **ขาด HGPRT** (Lesch–Nyhan) | **การทำงานของไตลดลง** |\n| อาหาร purine สูง | **กรดคั่งในเลือด (anion) ยับยั้งการหลั่งที่ท่อไต** |\n| **เซลล์สลายตัวมาก** — myeloproliferative/lymphoproliferative, สะเก็ดเงิน, เคมีบำบัด | **ขาดน้ำ · ยาขับปัสสาวะ** เพิ่มการดูดกลับ |\n| **ATP สลายตัวมาก** — glycogen storage disease, ภาวะพร่องออกซิเจน, **แอลกอฮอล์** | กลไกยังไม่ชัด — ความดันสูง ไทรอยด์เป็นพิษ ยา **ตะกั่ว** |\n\n**ธรรมชาติของโรค 4 ระยะ** — asymptomatic hyperuricemia → acute flare (สั้น หายเอง) → intercritical period (ยาวขึ้นเรื่อย ๆ กำเริบถี่และนานขึ้น) → **chronic tophaceous gout** · อาการทางคลินิกทั้งหมดของเกาต์คือ **ข้ออักเสบเฉียบพลัน · tophi · chronic urate nephropathy · นิ่วกรดยูริก**\n\n**ตารางเลือกยาช่วงกำเริบตามโรคร่วม (X = ควรเลี่ยง, ยิ่งหลายตัวยิ่งห้าม)**\n\n| โรคร่วม | NSAIDs | Steroid | Colchicine |\n|---|---|---|---|\n| ความดันโลหิตสูง | X | | |\n| เบาหวาน | | XX | |\n| **CKD** | **XXX** | | **X** |\n| **การติดเชื้อ** | | **XXX** | |\n| เลือดออกทางเดินอาหาร | XX | X | |\n| โรคตับ | X | | X |\n| ได้ยาต้านการแข็งตัวของเลือด | X | | X |\n\nอ่านตารางนี้กลับหัวก็คือ — **CKD ให้ steroid · กำลังสงสัยติดเชื้อให้ NSAIDs หรือ colchicine ไม่ใช่ steroid**\n", "pearls": ["ผลึกเกาต์: เข็มยาว negatively birefringent เหลืองเมื่อขนานกับแกน compensator", "ผู้ป่วย CKD หรือมีแผลในกระเพาะ เลือก corticosteroid เป็นอันดับแรกในช่วงกำเริบ", "Colchicine ใช้ขนาดต่ำ และต้องระวังยาที่ยับยั้ง CYP3A4/P-gp", "กำลังกิน allopurinol อยู่แล้วเกิดกำเริบ ให้กินต่อ ห้ามหยุด", "75% ของการกำเริบครั้งแรกอยู่ที่ MTP ที่ 1 ข้อเท้า และเข่า หายเองใน 3–10 วัน", "90% ของผู้ป่วยเกาต์เกิดจากขับกรดยูริกได้น้อย ไม่ใช่สร้างมาก"], "source": "สไลด์ อ.โชคชัย — Crystal induced arthritis for RSU", "items": [{"id": "AIR-MCQ-15", "kind": "mcq", "stem": "Synovial fluid from an acutely inflamed first metatarsophalangeal joint shows 28,000 WBC/mm3 with 85% neutrophils, and polarized light microscopy reveals needle-shaped crystals that are strongly negatively birefringent (yellow when parallel to the compensator axis). Which of the following is the most likely diagnosis?", "choices": ["Septic arthritis", "Acute gouty arthritis", "Rheumatoid arthritis", "Calcium pyrophosphate deposition disease (pseudogout)", "Reactive arthritis"], "answer": 1, "explain": "**จำสองผลึกให้แม่น — ออกสอบทุกปีทั้ง MCQ และ SAQ**\n\n| | **Monosodium urate (gout)** | **Calcium pyrophosphate (CPPD)** |\n|---|---|---|\n| รูปร่าง | **เข็มยาว (needle)** | **สี่เหลี่ยมขนมเปียกปูน (rhomboid)** |\n| Birefringence | **negative, แรง** | **positive, อ่อน** |\n| สีเมื่อขนานแกน compensator | **เหลือง** | น้ำเงิน |\n| ข้อที่ชอบเป็น | **MTP ที่ 1 (podagra)**, ข้อเท้า เข่า | **เข่า ข้อมือ** |\n| ภาพรังสี | punched-out erosion ขอบยื่น (overhanging edge) | **chondrocalcinosis** (แคลเซียมในกระดูกอ่อน) |\n\nตัวช่วยจำ: **\"ye**ll**ow\" + \"**ne**edle\" ไปด้วยกันเมื่อ **pa**rallel (Yellow–Needle–Parallel = gout)\n\n**ทำไมข้ออื่นผิด** — CPPD ให้ผลึก rhomboid positive birefringent; septic arthritis WBC มักเกิน 50,000 พร้อม Gram stain หรือ culture บวก (และ **พบผลึกร่วมกับติดเชื้อพร้อมกันได้** จึงต้องส่ง culture เสมอแม้เจอผลึก); RA เป็นข้อเล็กหลายข้อสองข้างพร้อมกัน; reactive arthritis เป็น oligoarthritis ขาส่วนล่างหลังติดเชื้อทางเดินอาหารหรือปัสสาวะ 1–4 สัปดาห์", "pearl": "**Needle + negative + เหลืองเมื่อขนาน = gout**; rhomboid + positive = CPPD — และเจอผลึกแล้วก็ยังต้องส่งเพาะเชื้อ", "topic": "Synovial fluid crystal identification — gout", "src": "", "ref": ["MED35 OSCE/SAQ ข้อ 7 'ให้ประวัติชายอายุ 50 ปวดข้อ ให้บรรยายภาพสไลด์ uric acid crystal needle shape และวินิจฉัย — ตอบ gout'", "MED33 โพย MEQ acute gouty attack"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(3)", "3.1.7"]}, {"id": "AIR-OLD-21", "kind": "old", "stem": "A 50-year-old man with acute pain of the first metatarsophalangeal joint has synovial fluid showing needle-shaped, strongly negatively birefringent crystals. What is the diagnosis?", "choices": ["Osteoarthritis with effusion", "Pseudogout", "Reactive arthritis", "Acute gouty arthritis", "Psoriatic arthritis"], "answer": 3, "explain": "**เข็ม + negative birefringent (เหลืองเมื่อขนานแกน compensator) = monosodium urate → gout**; ตำแหน่งโคนนิ้วหัวแม่เท้าเรียก **podagra**; การพบผลึก **ภายในเซลล์เม็ดเลือดขาว** ยืนยันว่าเป็นสาเหตุของการอักเสบครั้งนี้จริง", "pearl": "", "topic": "", "src": "MED35 OSCE/SAQ ข้อ 7 'ให้รูป uric acid crystal needle shape และวินิจฉัย ตอบ gout'", "ref": [], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(3)"]}, {"id": "AIR-MCQ-17", "kind": "mcq", "stem": "A 52-year-old man with an acute gout flare of the left ankle for 18 hours has stage 2 chronic kidney disease (eGFR 68 mL/min/1.73 m2), well-controlled hypertension and peptic ulcer disease treated 6 months ago. He takes no urate-lowering therapy. Which of the following is the most appropriate treatment for this flare?", "choices": ["Intravenous colchicine 2 mg", "Oral colchicine or a short course of oral prednisolone", "Start allopurinol 300 mg daily alone to lower the serum urate quickly", "High-dose indomethacin for 10 days", "Aspirin 300 mg three times daily"], "answer": 1, "explain": "**การรักษา flare มี 3 ทางเลือกที่มีประสิทธิภาพเท่า ๆ กัน — NSAID, colchicine, corticosteroid — เลือกตามโรคร่วม**\n\n- **NSAID** เลี่ยงเมื่อมี **แผลในกระเพาะ, CKD, หัวใจล้มเหลว, กินยาต้านการแข็งตัวของเลือด** → เคสนี้มีประวัติ PUD จึงไม่ควรใช้ indomethacin ขนาดสูง\n- **Colchicine** ได้ผลดีที่สุดเมื่อเริ่มภายใน 24 ชั่วโมง ขนาดปัจจุบันคือ **1.2 mg แล้วตาม 0.6 mg ใน 1 ชั่วโมง** (ขนาดต่ำ ได้ผลเท่าขนาดสูงแต่ท้องเสียน้อยกว่ามาก) ต้องลดขนาดใน CKD และระวังร่วมกับ clarithromycin, ciclosporin, statin (เสี่ยง myopathy/รุนแรงถึง pancytopenia)\n- **Corticosteroid** ทางเลือกที่ดีเมื่อมีทั้ง CKD และ PUD หรือฉีดเข้าข้อเมื่อเป็นข้อเดียวและตัด septic arthritis ออกแล้ว\n\n**ทำไมข้ออื่นผิด**\n- **เริ่ม allopurinol เดี่ยว ๆ ตอนกำลังอักเสบ** ทำให้ urate แกว่งและ flare นานขึ้น — ถ้าจะเริ่มต้องให้ร่วมกับยากันอักเสบ (colchicine prophylaxis) ต่ออีก 3–6 เดือน และห้ามหยุด allopurinol ที่กินอยู่เดิมเมื่อเกิด flare\n- **Colchicine ทางหลอดเลือดดำ** ถูกถอนออกจากตลาดเพราะเสียชีวิตจาก bone marrow suppression\n- **Aspirin ขนาดต่ำถึงกลาง** ลดการขับ urate ทางไต ทำให้แย่ลง", "pearl": "Flare เก๊าท์เลือกยาตาม**โรคร่วม**: PUD/CKD → colchicine ขนาดต่ำหรือสเตียรอยด์; **ห้ามเริ่ม allopurinol เดี่ยว ๆ ตอนอักเสบ แต่ก็ห้ามหยุดตัวที่กินอยู่**", "topic": "Acute gout — first-line treatment", "src": "", "ref": ["MED33 โพย MCQ ข้อ 21 'Gout ให้ colchicine'", "ACR Gout Guideline 2020"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.4(1)", "B5.4(4)"]}, {"id": "AIR-OLD-22", "kind": "old", "stem": "Which drug is the most appropriate first-line treatment for an acute gout flare in a patient with peptic ulcer disease?", "choices": ["Allopurinol", "Naproxen", "Colchicine", "Aspirin", "Indomethacin"], "answer": 2, "explain": "โพยเก่าตอบ **colchicine** — เหมาะเมื่อใช้ NSAID ไม่ได้ (แผลในกระเพาะ ไตเสื่อม หัวใจล้มเหลว) ใช้ขนาดต่ำ 1.2 mg แล้วตาม 0.6 mg ใน 1 ชั่วโมง; **สเตียรอยด์กินหรือฉีดเข้าข้อก็เป็นทางเลือกที่ดีเท่ากัน**; **allopurinol ไม่ใช่ยารักษา flare** และ aspirin ขนาดต่ำ-กลางยิ่งทำให้ urate สูงขึ้น", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 21 'Gout ให้ colchicine'", "ref": [], "nl": ["B5.2.5(1)", "B5.4(4)", "B5.4(1)"]}]}, {"id": "air-23-03", "title": "เกาต์ระยะยาว — ยาลดกรดยูริก เป้าหมาย และกับดัก", "minutes": 9, "summary": "ใครควรได้ ULT · เป้าหมาย < 6 (หรือ < 5) · เริ่มต่ำ ปรับขึ้น และให้ยาป้องกันการกำเริบร่วม", "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.4(4)"], "md": "### ใครควรเริ่มยาลดกรดยูริก (urate-lowering therapy, ULT)\nเริ่มเมื่อมีข้อใดข้อหนึ่ง\n- **กำเริบ ≥ 2 ครั้งต่อปี**\n- มี **tophus** ที่เห็นหรือคลำได้ หรือเห็นจากภาพถ่าย\n- มี **ความเสียหายของข้อจากเกาต์บนภาพรังสี** (erosion)\n- มี **นิ่วไตจากกรดยูริก** หรือ **CKD ระยะ 3 ขึ้นไป** ร่วมกับเกาต์\n\n**ภาวะกรดยูริกสูงที่ไม่มีอาการ (asymptomatic hyperuricemia) ไม่ต้องรักษาด้วยยา** — ส่วนใหญ่ไม่เคยเป็นเกาต์ แนวทางแนะนำเพียงปรับพฤติกรรมและทบทวนยา (เช่น เปลี่ยน thiazide) ยกเว้นกรณีก่อนให้เคมีบำบัดที่เสี่ยง tumor lysis\n\n### หลักการใช้ยา\n- **Allopurinol เป็นยาหลัก** เริ่ม **100 mg/วัน (50 mg ใน CKD ระยะ 4–5)** แล้ว **ค่อย ๆ ปรับขึ้นทุก 2–5 สัปดาห์จนถึงเป้าหมาย** — ขนาดสูงสุดขึ้นได้ถึง 800–900 mg/วัน\n- **เป้าหมาย serum urate < 6 mg/dL** และ **< 5 mg/dL เมื่อมี tophus** เพื่อให้ผลึกละลาย\n- **ไตเสื่อมไม่ใช่ข้อห้ามของ allopurinol** — เพียงเริ่มต่ำและปรับขึ้นช้ากว่าปกติ (การเริ่มขนาดสูงทันทีคือปัจจัยเสี่ยงของ hypersensitivity syndrome)\n- **ให้ยาป้องกันการกำเริบร่วมเสมอในช่วง 3–6 เดือนแรก** — colchicine 0.6 mg วันละ 1–2 ครั้ง (หรือ NSAIDs/prednisolone ขนาดต่ำ)\n- **คนเชื้อสายไทย/จีน/เกาหลีควรตรวจ HLA-B*58:01 ก่อนเริ่ม allopurinol**\n- ทางเลือกเมื่อใช้ allopurinol ไม่ได้: **febuxostat** (ระวังในผู้ป่วยโรคหัวใจและหลอดเลือด) · **probenecid** (ห้ามใช้เมื่อ eGFR ต่ำหรือมีนิ่วไต) · pegloticase ในรายดื้อมาก\n\n### ยาที่ทำให้กรดยูริกสูง — ต้องนึกถึงในโจทย์เสมอ\n- **Pyrazinamide และ ethambutol** ในสูตรยาวัณโรค (PZA เป็นตัวหลัก) — ปวดข้อระหว่างรักษา TB ให้คิดถึงข้อนี้ก่อน ถ้าอาการไม่รุนแรงมักรักษาตามอาการและ **ไม่ต้องหยุดสูตรยา**\n- **Thiazide และ loop diuretics** — ถ้าเป็นไปได้เปลี่ยนเป็นยาลดความดันกลุ่มอื่น เช่น **losartan** ซึ่งมีฤทธิ์ขับกรดยูริกเล็กน้อย หรือ CCB\n- **Low-dose aspirin** ลดการขับกรดยูริก แต่ **ไม่ต้องหยุดถ้าให้เพื่อป้องกันโรคหัวใจ**\n- Ciclosporin, tacrolimus, levodopa, nicotinic acid\n\n### เกาต์เรื้อรังและ tophus\n- **Tophus** = ก้อนผลึกยูเรตสะสม พบที่ใบหู ข้อศอก เอ็นร้อยหวาย นิ้วมือ อาจแตกเป็นสารขาวคล้ายชอล์ก\n- ภาพรังสีคลาสสิก: **punched-out erosion ที่มีขอบยื่นออกมา (overhanging edge) และช่องข้อยังกว้างปกติ** ต่างจาก RA ที่ช่องข้อแคบและมี periarticular osteopenia\n- เกาต์ในผู้สูงอายุอาจมาแบบ **หลายข้อ สมมาตร ที่มือ** จนดูเหมือน RA — เบาะแสคือประวัติใช้ยาขับปัสสาวะ tophus ที่นิ้ว และการเจาะพบผลึก\n\n### ที่อาจารย์เน้นในสไลด์\n\n**แบ่งยาลดกรดยูริกเป็น 3 กลุ่มตามกลไก**\n\n| กลุ่ม | ยา | กลไก |\n|---|---|---|\n| **Uricostatic** (ลดการสร้าง) | **allopurinol** (purine analog), **febuxostat** (non-purine) | ยับยั้ง xanthine oxidase |\n| **Uricosuric** (เพิ่มการขับ) | probenecid, sulfinpyrazone, benzbromarone · ฤทธิ์เสริมจาก **fenofibrate, losartan, estrogen** | ยับยั้งการดูดกลับที่ท่อไต |\n| **Uricolytic** (ย่อยทิ้ง) | **rasburicase, PEG-uricase** | เติมเอนไซม์ uricase ที่มนุษย์ไม่มี |\n\n> **หลักสองข้อที่อาจารย์ย้ำ — “treat to target” และ “start slow, go slow”** คือเริ่มขนาดต่ำ ปรับขึ้นช้า ๆ จนกรดยูริกถึงเป้า ไม่ใช่ให้ขนาดคงที่แล้วปล่อย\n- **Allopurinol hypersensitivity syndrome** สัมพันธ์กับ **HLA-B*58:01** และการเริ่มขนาดสูงตั้งแต่แรก โดยเฉพาะผู้ป่วยไตเสื่อมที่ได้ยาขับปัสสาวะ\n- ยาที่ใช้แทนกันได้ในผู้ป่วยความดันสูงหรือไขมันสูงคือ **losartan และ fenofibrate** ซึ่งช่วยลดกรดยูริกไปในตัว\n", "pearls": ["เป้าหมาย urate < 6 mg/dL และ < 5 เมื่อมี tophus", "Allopurinol เริ่มต่ำ ปรับขึ้นช้า ไม่ห้ามใน CKD และต้องให้ colchicine ป้องกัน 3–6 เดือนแรก", "Asymptomatic hyperuricemia ไม่ต้องให้ยา", "ปวดข้อระหว่างกินยา TB ให้คิดถึง pyrazinamide", "ยาลดกรดยูริก 3 กลุ่ม: uricostatic (allopurinol/febuxostat) · uricosuric (probenecid, losartan, fenofibrate) · uricolytic (rasburicase)", "หลักของอาจารย์: treat to target และ start slow go slow"], "source": "สไลด์ อ.โชคชัย — Crystal induced arthritis for RSU", "items": [{"id": "AIR-MCQ-18", "kind": "mcq", "stem": "A 49-year-old man has had four gout flares in the past year and a tophus over the right elbow. Serum urate is 9.2 mg/dL, creatinine 1.1 mg/dL. His last flare resolved 3 weeks ago. Which of the following is the most appropriate management?", "choices": ["Start probenecid as first-line therapy regardless of urinary urate excretion", "Treat flares as they occur and avoid urate-lowering therapy because his renal function is normal", "Start allopurinol 300 mg daily immediately without prophylaxis and stop when urate normalizes", "Start allopurinol at a low dose with anti-inflammatory prophylaxis and titrate to a serum urate below 6 mg/dL", "Restrict purine-rich food alone, which reliably lowers serum urate below 6 mg/dL"], "answer": 3, "explain": "**ข้อบ่งชี้ของ urate-lowering therapy (ULT)** — flare ตั้งแต่ 2 ครั้ง/ปี, มี **tophus**, มี **กระดูกถูกทำลายจากเก๊าท์**, หรือมีนิ่วไตจาก urate (พิจารณาเมื่อ CKD stage 3 ขึ้นไป หรือ urate > 9 mg/dL) — เคสนี้เข้าเกณฑ์หลายข้อ\n\n**หลักการให้ที่มักออกสอบ**\n1. **Start low, go slow** — allopurinol เริ่ม 100 mg/วัน (50 mg ถ้า CKD) ค่อยเพิ่มทุก 2–5 สัปดาห์ ลดทั้งความเสี่ยง flare และ SCAR\n2. **ให้ prophylaxis** ด้วย colchicine ขนาดต่ำ (หรือ NSAID ขนาดต่ำ) ต่ออีก **3–6 เดือน** เพราะช่วงที่ urate ลดเร็วจะกระตุ้น flare\n3. **Treat to target** — ลดให้ **< 6 mg/dL** (และ < 5 mg/dL เมื่อมี tophus) แล้ว **ให้ยาต่อไปตลอด** ไม่ใช่หยุดเมื่อค่าปกติ\n4. คัดกรอง **HLA-B\\*58:01** ในคนเอเชียก่อนเริ่ม allopurinol\n\n**ทำไมข้ออื่นผิด** — เริ่มขนาดสูงทันทีโดยไม่มี prophylaxis ทำให้ flare และเสี่ยง hypersensitivity; การไม่ให้ ULT ทั้งที่มี tophus ปล่อยให้ข้อถูกทำลาย; probenecid เป็นยาทางเลือกรอง ห้ามใช้เมื่อมีนิ่วหรือ urate ในปัสสาวะสูง; การคุมอาหารอย่างเดียวลด urate ได้เพียงราว 1 mg/dL", "pearl": "ULT: **เริ่มต่ำ ค่อยเพิ่ม + colchicine กัน flare 3–6 เดือน + คุม urate < 6 (มี tophus < 5) แล้วกินตลอด**", "topic": "Urate-lowering therapy — indication and target", "src": "", "ref": ["MED32 โพย MCQ gout management", "ACR Gout Guideline 2020; EULAR 2016"], "nl": ["B5.2.5(1)", "B5.4(4)", "B5.3(4)", "2.3.13(2)"]}, {"id": "AIR-OLD-30", "kind": "old", "stem": "Which of the following is an indication to start urate-lowering therapy?", "choices": ["Presence of tophi or two or more gout flares per year", "A single gout flare in a young patient", "Family history of gout alone", "Dietary purine excess alone", "Asymptomatic hyperuricemia of 8 mg/dL"], "answer": 0, "explain": "**ข้อบ่งชี้ ULT**: tophus, flare ≥ 2 ครั้ง/ปี, กระดูกถูกทำลายจากเก๊าท์, นิ่วไตจาก urate (พิจารณาเมื่อ CKD ≥ stage 3 หรือ urate > 9); **asymptomatic hyperuricemia ไม่ต้องให้ยา**; เริ่มขนาดต่ำ ปรับขึ้นช้า ๆ พร้อม colchicine prophylaxis 3-6 เดือน เป้าหมาย urate < 6 (มี tophus < 5)", "pearl": "", "topic": "", "src": "ต่อยอดจากโพย MED32-MED34 เรื่อง gout management (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(4)", "B5.3(4)", "2.3.13(2)"]}, {"id": "AIR-MCQ-19", "kind": "mcq", "stem": "A 45-year-old man on the intensive phase of anti-tuberculous treatment develops an acutely painful, swollen right first metatarsophalangeal joint at week 6. Serum uric acid is 11 mg/dL. Which drug in his regimen is most responsible for this problem?", "choices": ["Streptomycin", "Rifampicin", "Pyrazinamide", "Levofloxacin", "Isoniazid"], "answer": 2, "explain": "**Pyrazinamide คือยาต้านวัณโรคที่ทำให้ uric acid สูงชัดเจนที่สุด** กลไก: metabolite **pyrazinoic acid** ยับยั้งการขับ urate ที่ท่อไตส่วนต้น (URAT1) → urate คั่ง → เก๊าท์กำเริบหรือปวดข้อแบบ non-gouty arthralgia\n\n**Ethambutol ก็ลดการขับ urate ได้เช่นกันแต่รุนแรงน้อยกว่า** — โพยเก่าจึงมีทั้งตัวเลือก \"pyrazinamide\" และ \"pyrazinamide + ethambutol\" ถ้าโจทย์ให้เลือก **ยาตัวเดียวที่รับผิดชอบมากที่สุด ตอบ pyrazinamide**\n\n**การจัดการ** — ถ้าเป็นเพียง **hyperuricemia ที่ไม่มีอาการ ไม่ต้องหยุดยาและไม่ต้องรักษา**; ถ้ามี flare ให้รักษาอาการด้วย NSAID/colchicine/สเตียรอยด์ตามโรคร่วม และมักหายเองหลังจบ intensive phase; หยุด pyrazinamide เฉพาะเมื่อข้ออักเสบรุนแรงคุมไม่ได้\n\n**ทำไมข้ออื่นผิด** — isoniazid ทำให้เกิด peripheral neuropathy (ป้องกันด้วย pyridoxine), drug-induced lupus และตับอักเสบ; rifampicin ทำให้สารคัดหลั่งสีส้ม, ตับอักเสบ และเป็นตัวเหนี่ยวนำเอนไซม์; streptomycin เป็นพิษต่อหูและไต; fluoroquinolone ทำให้เอ็นอักเสบหรือขาด", "pearl": "ยาวัณโรคทำให้ **uric acid สูง = pyrazinamide** (ethambutol เสริมได้) — ถ้าไม่มีอาการ ไม่ต้องรักษาและไม่ต้องหยุดยา", "topic": "Drug-induced hyperuricemia", "src": "", "ref": ["MED33 โพย MCQ ข้อ 5 และข้อ 72 'ยา TB ปวดข้อเป็น gout > pyrazinamide (+ethambutol)'", "WHO TB treatment guideline 2022"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(4)"]}, {"id": "AIR-OLD-23", "kind": "old", "stem": "A patient on anti-tuberculous therapy develops joint pain with a serum uric acid of 10 mg/dL. Which drug is responsible?", "choices": ["Pyrazinamide", "Rifampicin", "Ethionamide", "Streptomycin", "Isoniazid"], "answer": 0, "explain": "**Pyrazinamide** — metabolite pyrazinoic acid ยับยั้งการขับ urate ที่ท่อไต (ethambutol เสริมฤทธิ์นี้ได้เล็กน้อย จึงมีตัวเลือก 'pyrazinamide + ethambutol' ในโพยบางปี ถ้าให้เลือกยาตัวเดียวให้ตอบ pyrazinamide); **hyperuricemia ที่ไม่มีอาการไม่ต้องรักษาและไม่ต้องหยุดยา** ถ้ามีข้ออักเสบให้รักษาตามอาการ", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 5, 72 และ 82 'ยา TB ปวดข้อเป็น gout > pyrazinamide (+ ethambutol)'", "ref": [], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(4)"]}, {"id": "AIR-MCQ-26", "kind": "mcq", "stem": "A 46-year-old man has a serum uric acid of 8.4 mg/dL found on a health check-up. He has never had joint pain, tophi or kidney stones. Renal function is normal. Which of the following is the most appropriate management?", "choices": ["Start allopurinol to prevent future gout in all patients with uric acid above 8 mg/dL", "Start colchicine prophylaxis indefinitely", "Lifestyle advice and periodic follow-up without urate-lowering drug therapy", "Perform joint ultrasound of every large joint annually", "Start probenecid and increase fluid intake"], "answer": 2, "explain": "**Hyperuricemia ที่ไม่มีอาการ ไม่ใช่โรค** — คนที่ urate สูงส่วนใหญ่ไม่เคยเป็นเก๊าท์เลยตลอดชีวิต (อุบัติการณ์เกิด flare ราว 1–5% ต่อปีแม้ urate > 9)\n\n**ACR 2020 แนะนำ 'ไม่ให้' ULT ในผู้ที่ไม่มีอาการ** ไม่ว่าค่าจะสูงเท่าไร (conditional recommendation) เพราะประโยชน์ไม่ชัดขณะที่มีความเสี่ยง SCAR โดยเฉพาะในคนเอเชียที่มี HLA-B\\*58:01\n\n**สิ่งที่ควรทำแทน** — หาสาเหตุที่แก้ได้: ยาขับปัสสาวะกลุ่ม thiazide/loop, low-dose aspirin, ciclosporin, pyrazinamide, แอลกอฮอล์โดยเฉพาะเบียร์, เครื่องดื่มฟรุกโตสสูง, อ้วน, metabolic syndrome และคัดกรองโรคร่วมหัวใจและไต\n\n**ทำไมข้ออื่นผิด** — การให้ ULT หรือ colchicine ป้องกันในคนไม่มีอาการเป็นการรักษาตัวเลขไม่ใช่รักษาคน; probenecid ยิ่งไม่เหมาะเพราะเสี่ยงนิ่วไต; การอัลตราซาวด์ทุกข้อทุกปีไม่มีข้อบ่งชี้ (ultrasound มีประโยชน์เมื่อสงสัยเก๊าท์แต่เจาะข้อไม่ได้ — จะเห็น double contour sign)", "pearl": "**urate สูงแต่ไม่มีอาการ = ไม่ต้องให้ยา** — ไปแก้ยาและพฤติกรรมที่ทำให้สูงแทน", "topic": "Asymptomatic hyperuricemia", "src": "", "ref": ["ACR Gout Guideline 2020", "MED31 โพย MCQ asymptomatic hyperuricemia"], "nl": ["B5.3(4)", "B5.4(4)", "2.3.13(2)"]}, {"id": "AIR-MCQ-27", "kind": "mcq", "stem": "A 68-year-old man with untreated gout for 15 years has firm, chalky white nodules over the olecranon and the helix of the ear, and deformed fingers. Radiograph of the hand shows well-defined 'punched-out' erosions with sclerotic margins and overhanging edges, with preserved joint space until late. Which of the following best explains these radiographic findings?", "choices": ["Pannus formation from proliferating synovium causing marginal erosion with early joint space loss", "Deposition of monosodium urate aggregates in and around bone that erode cortex while cartilage is relatively spared", "Direct bacterial destruction of subchondral bone", "Periarticular osteopenia from local inflammatory cytokines", "Subchondral bone sclerosis and osteophyte formation from mechanical overload"], "answer": 1, "explain": "**Tophus คือก้อนของผลึก monosodium urate ที่มี granulomatous reaction ล้อมรอบ** เมื่อสะสมข้างกระดูกจะกดและกัดกร่อนกระดูกจากนอกเข้าใน ได้ภาพ **punched-out (rat-bite) erosion ขอบชัด มี sclerotic margin และ overhanging edge** ในขณะที่ **ช่องข้อยังกว้างปกติจนระยะท้าย** เพราะกระดูกอ่อนถูกทำลายช้ากว่า\n\n**เทียบกับโรคอื่นบนฟิล์ม**\n\n| โรค | ลักษณะเด่น | ช่องข้อ |\n|---|---|---|\n| **Chronic gout** | **punched-out erosion, overhanging edge, tophus เนื้อเยื่ออ่อน** | **กว้างปกติจนระยะท้าย** |\n| RA | marginal erosion + **periarticular osteopenia** | **แคบสม่ำเสมอเร็ว** |\n| OA | **osteophyte, subchondral sclerosis/cyst** | แคบเฉพาะด้านที่รับน้ำหนัก |\n| Septic arthritis | ทำลายกระดูกทั้งสองด้านเร็วมากในไม่กี่สัปดาห์ | แคบเร็ว |\n\n**การรักษา tophaceous gout** — ULT เป้าหมาย **urate < 5 mg/dL** เพื่อละลาย tophus (ยิ่งต่ำยิ่งละลายเร็ว) ใช้เวลาหลายเดือนถึงปี ร่วมกับ prophylaxis กัน flare ระหว่างลดค่า", "pearl": "Tophaceous gout บนฟิล์ม = **punched-out erosion + overhanging edge + ช่องข้อยังกว้าง**; รักษาโดยคุม urate < 5 เพื่อละลาย tophus", "topic": "Chronic tophaceous gout", "src": "", "ref": ["MED32 โพย MCQ chronic gout", "ACR Gout Guideline 2020"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(1)", "B5.4(4)"]}, {"id": "AIR-OLD-29", "kind": "old", "stem": "Which radiographic finding is most characteristic of long-standing tophaceous gout?", "choices": ["Bamboo spine", "Punched-out erosion with sclerotic margin and overhanging edge, with preserved joint space", "Marginal erosion with periarticular osteopenia and uniform joint space narrowing", "Chondrocalcinosis of the menisci", "Osteophyte with subchondral sclerosis"], "answer": 1, "explain": "**Punched-out erosion + overhanging edge + ช่องข้อกว้างปกติ = chronic gout**; marginal erosion + periarticular osteopenia = RA; osteophyte = OA; **chondrocalcinosis = CPPD**; bamboo spine = ankylosing spondylitis", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย MCQ chronic gout (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.3(1)", "3.2.5", "B5.2.5(1)"]}, {"id": "AIR-MCQ-28", "kind": "mcq", "stem": "A 76-year-old woman on hydrochlorothiazide for hypertension has a 6-month history of pain and swelling of multiple small joints of both hands, including some distal interphalangeal joints, with firm nodules over the finger pads. RF and anti-CCP are negative. Aspiration of a nodular joint shows negatively birefringent needle-shaped crystals. Which of the following is the most likely diagnosis?", "choices": ["Seronegative rheumatoid arthritis", "Polyarticular tophaceous gout mimicking rheumatoid arthritis", "Calcium pyrophosphate deposition disease", "Psoriatic arthritis", "Erosive osteoarthritis of the hands"], "answer": 1, "explain": "**เก๊าท์ในผู้สูงอายุหญิงมักไม่มาแบบ podagra คลาสสิก** แต่มาเป็น **polyarticular ที่มือ รวม DIP และมี tophus บนปุ่มนิ้วซึ่งดูคล้าย Heberden node หรือ rheumatoid nodule** ปัจจัยเสี่ยงเด่นคือ **ยาขับปัสสาวะ thiazide** (ลดการขับ urate) ร่วมกับไตเสื่อมตามวัยและภาวะหลังหมดประจำเดือน (estrogen ช่วยขับ urate จึงมาเป็นหลังวัยทอง)\n\n**สิ่งที่ตัดสินคือการเจาะพบผลึก** — ผลึกเข็ม negatively birefringent ยืนยันเก๊าท์โดยไม่ต้องเดาจากภาพรวม และ RF/anti-CCP ที่ลบยิ่งลดน้ำหนักของ RA\n\n**ทำไมข้ออื่นผิด** — seronegative RA และ psoriatic arthritis ไม่ทำให้พบผลึก urate; erosive OA เป็น DIP/PIP แต่ไม่มีผลึกและไม่มี tophus; CPPD ให้ผลึก rhomboid positive birefringent\n\n**บทเรียนการรักษา** — เปลี่ยน thiazide เป็นยาลดความดันที่เป็นกลางหรือช่วยขับ urate เช่น **losartan** หรือ amlodipine แล้วเริ่ม ULT พร้อม prophylaxis", "pearl": "หญิงสูงอายุกิน thiazide + ปุ่มที่นิ้วคล้าย RA/OA — **เจาะดูผลึกก่อนสรุป**; losartan เป็นยาลดความดันที่ช่วยลด urate", "topic": "Polyarticular gout in the elderly", "src": "", "ref": ["MED32 โพย MCQ gout ในผู้สูงอายุ", "ACR Gout Guideline 2020"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(3)", "B5.3(4)"]}, {"id": "AIR-MCQ-29", "kind": "mcq", "stem": "A 60-year-old man with gout and stage 4 chronic kidney disease (eGFR 24 mL/min/1.73 m2) needs urate-lowering therapy. HLA-B*58:01 is negative. Which of the following is the most appropriate approach?", "choices": ["Give repeated courses of high-dose NSAID instead of urate-lowering therapy", "Start allopurinol 300 mg daily, the standard dose regardless of renal function", "Start probenecid as the preferred agent in chronic kidney disease", "Avoid all urate-lowering therapy because of the renal impairment", "Start allopurinol at 50 mg daily and titrate slowly with monitoring, aiming for urate below 6 mg/dL"], "answer": 4, "explain": "**CKD ไม่ใช่ข้อห้ามของ allopurinol — เป็นเหตุผลให้เริ่มขนาดต่ำและปรับขึ้นช้า ๆ**\n\n- **ขนาดเริ่ม** 50 mg/วันเมื่อ eGFR < 30 (100 mg/วันเมื่อไตปกติ) แล้วเพิ่มทีละ 50 mg ทุก 2–5 สัปดาห์ **จนถึงเป้าหมาย urate ไม่ใช่จนถึงขนาดตายตัว** — ACR 2020 อนุญาตให้เพิ่มเกินขนาดที่ปรับตาม creatinine clearance ได้ถ้าค่อย ๆ เพิ่มและติดตาม เพราะการจำกัดขนาดตาม eGFR อย่างเดียวทำให้คุม urate ไม่ได้\n- **ทำไมต้องช้า** — oxypurinol คั่งใน CKD และการเพิ่มขนาดเร็วคือปัจจัยเสี่ยงหลักของ allopurinol hypersensitivity syndrome\n- **Febuxostat** เป็นทางเลือกเมื่อ allopurinol ใช้ไม่ได้ ไม่ต้องปรับขนาดมากใน CKD แต่มีคำเตือนเรื่องโรคหัวใจและหลอดเลือด\n\n**ทำไมข้ออื่นผิด**\n- **ไม่ให้ ULT เลย** ปล่อยให้ข้อถูกทำลายและ flare บ่อยขึ้น ทั้งที่ CKD คือกลุ่มที่ควรได้ ULT มากขึ้นด้วยซ้ำ\n- **300 mg ทันที** เสี่ยง SCAR สูงสุด\n- **Probenecid** ไม่ได้ผลเมื่อ eGFR < 30 เพราะออกฤทธิ์ที่ท่อไต และเพิ่มความเสี่ยงนิ่ว\n- **NSAID ซ้ำ ๆ ใน CKD stage 4** ทำให้ไตแย่ลงและเลือดออกในทางเดินอาหาร", "pearl": "CKD: **allopurinol เริ่ม 50 mg เพิ่มช้า ๆ จนได้ urate < 6** — ไม่ใช่ห้ามใช้ และไม่ใช่ยิงขนาดมาตรฐานทันที", "topic": "Gout with chronic kidney disease", "src": "", "ref": ["ACR Gout Guideline 2020", "MED34 โพย MCQ gout with CKD"], "nl": ["B5.4(4)", "B5.3(4)", "2.3.13(2)"]}]}, {"id": "air-23-04", "title": "CPPD และ pseudogout", "minutes": 6, "summary": "ผลึกสี่เหลี่ยมขนมเปียกปูน เรืองน้ำเงินเมื่อขนาน และ chondrocalcinosis", "nl": ["B5.2.5(1)", "2.3.13(2)"], "md": "**Calcium pyrophosphate deposition disease (CPPD)** คือการสะสมผลึก calcium pyrophosphate dihydrate ในกระดูกอ่อน พบมากขึ้นตามอายุ (พบ chondrocalcinosis ในผู้สูงอายุกว่า 80 ปีได้ถึงราวร้อยละ 15–20)\n\n| | Gout (MSU) | CPPD |\n|---|---|---|\n| รูปผลึก | **เข็มยาวปลายแหลม** | **สี่เหลี่ยมขนมเปียกปูน/แท่งสั้น** |\n| Birefringence | **negative อย่างแรง** | **positive อย่างอ่อน** |\n| สีเมื่อขนานกับ compensator | **เหลือง** | **น้ำเงิน** |\n| ข้อที่พบบ่อย | MTP ที่ 1, ข้อเท้า, เข่า | **เข่า ข้อมือ** (โดยเฉพาะ triangular fibrocartilage) |\n| ภาพรังสี | punched-out erosion + overhanging edge | **chondrocalcinosis** — เส้นแคลเซียมในกระดูกอ่อนข้อ |\n\n### สิ่งที่ต้องทำเมื่อวินิจฉัย CPPD ในคนอายุน้อยกว่า 60 ปีหรือเป็นหลายข้อ\nมองหาโรคที่ทำให้เกิด CPPD ทุติยภูมิ — **hyperparathyroidism · hemochromatosis · hypophosphatasia · hypomagnesemia · hypothyroidism** (ตรวจ calcium, phosphate, PTH, ferritin/transferrin saturation, Mg, TSH, ALP)\n\n### การรักษา\n- ไม่มียาละลายผลึก CPPD — จึงรักษา **ตามอาการ** เหมือนเกาต์เฉียบพลัน: NSAIDs · corticosteroid (กินหรือฉีดในข้อ) · colchicine\n- ถ้ากำเริบบ่อยใช้ **colchicine ขนาดต่ำป้องกัน**\n- **ห้ามให้ allopurinol** เพราะไม่เกี่ยวกับกรดยูริก\n- ข้ออักเสบเฉียบพลันในผู้ป่วยฟอกไต ผู้สูงอายุ หรือหลังผ่าตัด ให้คิดถึง CPPD ควบคู่กับการติดเชื้อเสมอ และยังต้องเจาะข้อส่งเพาะเชื้อ\n\n### ที่อาจารย์เน้นในสไลด์\n\n**CPPD ปลอมเป็นโรคอื่นได้เกือบทุกโรค** — pseudogout (พบบ่อยสุด) · **pseudo-RA** · **pseudo-OA** · pseudo-AS · **pseudosepsis** · pseudoneuropathic (คล้าย Charcot) · และชนิดที่ไม่มีอาการเลย เจอ chondrocalcinosis จากภาพรังสีโดยบังเอิญ\n\n**สาเหตุทุติยภูมิที่ต้องไล่ (เพิ่มจากที่ท่องกันมา)** — ข้อเสื่อมและอายุมาก · **acromegaly** · **hyperparathyroidism** · **hypothyroidism** · **Wilson disease (ทองแดง)** · **hemochromatosis (เหล็ก)** · **hypomagnesemia** · **hypophosphatasia**\n\n**การรักษาแยกตามจำนวนข้อ** — ข้อเดียว → **ฉีด steroid เข้าข้อ** (หลังตัดการติดเชื้อแล้ว) · หลายข้อ → **NSAIDs หรือ steroid ทั้งระบบ** · กำเริบบ่อย → **colchicine ขนาดต่ำ**\n", "pearls": ["Blue when parallel = CPPD · yellow when parallel = urate", "เห็น chondrocalcinosis ที่เข่าหรือข้อมือ + ข้ออักเสบเฉียบพลัน = pseudogout", "CPPD ในคนอายุน้อยต้องหา hyperparathyroidism และ hemochromatosis", "CPPD ปลอมเป็นได้ทุกโรค — pseudo-RA, pseudo-OA, pseudosepsis", "CPPD ข้อเดียวรักษาด้วยการฉีด steroid เข้าข้อหลังตัดการติดเชื้อแล้ว"], "source": "สไลด์ อ.โชคชัย — Crystal induced arthritis for RSU", "items": [{"id": "AIR-MCQ-16", "kind": "mcq", "stem": "A 74-year-old woman has acute pain and swelling of the right knee. Synovial fluid shows 18,000 WBC/mm3 and rhomboid-shaped crystals that are weakly positively birefringent. Plain radiograph shows linear calcification of the meniscal cartilage. Which of the following is the most likely diagnosis and the associated metabolic condition to screen for?", "choices": ["Osteoarthritis with effusion; screen for obesity and previous joint injury", "Calcium pyrophosphate deposition disease; screen for hyperparathyroidism, hemochromatosis and hypomagnesemia", "Gout; screen for chronic kidney disease and diuretic use", "Septic arthritis; screen for diabetes mellitus and intravenous drug use", "Basic calcium phosphate (hydroxyapatite) disease; screen for hyperphosphatemia in dialysis patients"], "answer": 1, "explain": "**ผลึก rhomboid, weakly positive birefringent + chondrocalcinosis บนฟิล์ม = CPPD (pseudogout)** ชื่อเต็มคือ **calcium PYROPHOSPHATE dihydrate** ไม่ใช่ calcium phosphate (โพยเก่าหลายฉบับเขียนผิดเป็น 'calcium phosphate dihydrate' — ให้จำชื่อที่ถูกไว้ใช้ตอบ)\n\n**CPPD ในคนอายุน้อยกว่า 55 ปี หรือเป็นหลายข้อ ต้องหาโรคทางเมตาบอลิกเบื้องหลัง** จำด้วย **4 H**: **H**yperparathyroidism, **H**emochromatosis, **H**ypophosphatasia, **H**ypomagnesemia (บวก hypothyroidism)\n\n**การรักษา acute attack** เหมือนเก๊าท์คือ NSAID, colchicine หรือ corticosteroid (ฉีดเข้าข้อได้ผลดีเมื่อเป็นข้อเดียว) แต่ **ไม่มียาละลายผลึก CPPD** ต่างจากเก๊าท์ที่ลด urate ได้\n\n**ทำไมข้ออื่นผิด** — gout ให้ผลึกเข็ม negative birefringent; septic arthritis WBC สูงกว่านี้มากและมีเชื้อ; hydroxyapatite ไม่เห็นด้วย polarized light ทั่วไป (ต้องย้อม alizarin red) และมักเป็น periarthritis ที่ไหล่ (Milwaukee shoulder); OA ให้น้ำไขข้อ WBC < 2,000", "pearl": "Pseudogout = **calcium PYROPHOSPHATE** + chondrocalcinosis; เป็นในคนอายุน้อยหรือหลายข้อให้หา **hyperparathyroidism / hemochromatosis / hypomagnesemia**", "topic": "Pseudogout — CPPD", "src": "", "ref": ["MED33 โพย Joint ข้อ 1 'rhomboid-shaped crystals weakly positively birefringent'", "MED33 โพย MCQ ข้อ 11 'Synovial fluid rhomboid shape'"], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(3)", "B5.3(1)"]}, {"id": "AIR-OLD-19", "kind": "old", "stem": "Synovial fluid from a painful knee contains rhomboid-shaped crystals that are weakly positively birefringent under polarized light. What is the diagnosis?", "choices": ["Gout", "Hydroxyapatite deposition disease", "Calcium pyrophosphate deposition disease (pseudogout)", "Rheumatoid arthritis", "Septic arthritis"], "answer": 2, "explain": "**Rhomboid + weakly POSITIVE birefringent = calcium PYROPHOSPHATE dihydrate (CPPD)** — โพยเก่าบางฉบับเขียนชื่อผิดเป็น 'calcium phosphate dihydrate' ให้จำชื่อที่ถูก; เทียบกับเก๊าท์ที่เป็น **เข็ม negative birefringent**; ฟิล์มมักเห็น **chondrocalcinosis** ที่หมอนรองกระดูกเข่าหรือข้อมือ", "pearl": "", "topic": "", "src": "MED33 โพย Joint ข้อ 1 'ตะกอน rhomboid-shaped crystals weakly positively birefringent — a. Calcium phosphate dihydrate deposition (cppd)'", "ref": [], "nl": ["B5.2.5(1)", "2.3.13(2)", "B5.3(3)"]}, {"id": "AIR-OLD-20", "kind": "old", "stem": "In the same patient with pseudogout of the knee, which additional synovial fluid profile is expected?", "choices": ["Inflammatory fluid with WBC 2,000-50,000/mm3, predominantly neutrophils, and reduced viscosity", "Clear fluid with normal viscosity and WBC below 200/mm3", "Purulent fluid with WBC above 100,000/mm3 and positive Gram stain", "Bloody fluid with fat globules", "Non-inflammatory fluid with WBC below 2,000/mm3 and high viscosity"], "answer": 0, "explain": "**CPPD เป็น crystal-induced inflammation** จึงให้ profile แบบ inflammatory: ขุ่น ความหนืดลดลง (เพราะ hyaluronate ถูกย่อย) WBC 2,000-50,000 โดย PMN เด่น — ถ้า WBC > 50,000 และ PMN > 90% ต้องคิด septic arthritis และรักษาแบบติดเชื้อจนกว่าผลเพาะเชื้อจะออก **แม้จะพบผลึกแล้วก็ตาม**", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 11 'Synovial fluid rhomboid shape > ถามว่าจะเจออะไรอีก viscosity, wbc อะไรที่ match cppd'", "ref": [], "nl": ["B5.3(3)", "3.1.7", "2.3.13(2)"]}]}, {"id": "air-23-04b", "title": "ผลึกอื่นที่ต้องรู้จัก — BCP และ calcium oxalate", "summary": "ผลึกที่มองไม่เห็นด้วย polarized light และผลึกของผู้ป่วยฟอกไต", "minutes": 5, "nl": ["B5.2.5(1)", "2.3.13(2)"], "source": "สไลด์ อ.โชคชัย — Crystal induced arthritis for RSU", "md": "ผลึกที่ทำให้ข้ออักเสบไม่ได้มีแค่ยูเรตกับ CPPD — สองชนิดนี้ออกสอบในบริบทผู้ป่วยไตวายเสมอ\n\n### Basic calcium phosphate (BCP / hydroxyapatite)\n- **มองไม่เห็นใน polarized light เพราะไม่หักเหแสง** — ต้องย้อม **alizarin red** จึงเห็นเป็นก้อนสีแดงส้ม\n- กลุ่มอาการที่พบ: **periarthritis และ calcific tendinitis** (คลาสสิกคือเอ็นไหล่ — เห็นหินปูนในเอ็นจากภาพรังสี) · **Milwaukee shoulder syndrome** (ผู้สูงอายุหญิง ไหล่ถูกทำลาย มีน้ำในข้อปริมาณมากและมักปนเลือด rotator cuff ขาด) · ข้อเสื่อม · erosive arthritis\n- พบบ่อยขึ้นในผู้ป่วย **ไตวายเรื้อรังที่ฟอกไต** เพราะสมดุลแคลเซียม–ฟอสเฟตผิดปกติ\n- **รักษาตามอาการ** — เจาะระบายน้ำในข้อซ้ำเพื่อลดปริมาณผลึก · NSAIDs · steroid ทั้งระบบหรือฉีดเข้าข้อ · colchicine ขนาดต่ำ · และควบคุมแคลเซียม–ฟอสเฟต\n\n### Calcium oxalate\n- พบใน **ผู้ป่วยไตวายระยะสุดท้ายที่ฟอกไต** · **short bowel syndrome** · อาหารที่มีออกซาเลตสูง (**ผักโขม รูบาร์บ วิตามินซีขนาดสูง**) · ขาด **ไทอามีนหรือไพริดอกซีน** · primary oxalosis\n- มักเป็นข้อเดียวถึงไม่กี่ข้อ และชอบจับ **PIP และ MCP**\n- วินิจฉัยโดยเห็นผลึก calcium oxalate ในน้ำไขข้อ (รูป bipyramidal หักเหแสงแบบ positive)\n- รักษาตามอาการด้วย NSAIDs, steroid, colchicine และ **พิจารณาเพิ่มความถี่ของการฟอกไต**\n", "pearls": ["ข้ออักเสบที่ไม่พบผลึกใน polarized light แต่ย้อม alizarin red ติด = BCP (hydroxyapatite)", "ไหล่ถูกทำลาย + น้ำในข้อมากและปนเลือดในหญิงสูงอายุ = Milwaukee shoulder", "ผู้ป่วยฟอกไตที่ข้ออักเสบ ให้คิดถึง CPPD · BCP · calcium oxalate และการติดเชื้อเสมอ"], "items": [{"id": "AIR-OLD-31", "kind": "old", "stem": "A 70-year-old man on hemodialysis develops an acutely painful shoulder. Aspiration shows no crystals under polarized light but the fluid contains clumps that stain with alizarin red. What is the most likely diagnosis?", "choices": ["Basic calcium phosphate (hydroxyapatite) associated arthritis", "Rotator cuff tear", "Septic arthritis", "Pseudogout", "Gout"], "answer": 0, "explain": "**Hydroxyapatite ไม่หักเหแสงใน polarized light จึง 'มองไม่เห็น' ต้องย้อม alizarin red** — พบในผู้ป่วยไตวายเรื้อรังและกลุ่มอาการ **Milwaukee shoulder** (ข้อไหล่ถูกทำลายพร้อมน้ำในข้อปริมาณมาก); รักษาตามอาการด้วย NSAID/สเตียรอยด์และคุมสมดุลแคลเซียม-ฟอสเฟต", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED33 โพย Joint (crystal arthropathy) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["B5.2.5(1)", "B5.3(3)"]}, {"id": "AIR-23-04B-Q1", "kind": "own", "stem": "A 62-year-old man with end-stage kidney disease on maintenance hemodialysis develops pain and swelling of both second and third proximal interphalangeal joints. Joint aspiration shows 6,500 WBC/µL, Gram stain is negative, and polarized microscopy shows bipyramidal, strongly positively birefringent crystals. Which of the following is the most likely diagnosis?", "choices": ["Basic calcium phosphate (hydroxyapatite) arthropathy", "Septic arthritis", "Acute gouty arthritis", "Calcium oxalate arthropathy", "Calcium pyrophosphate deposition disease"], "answer": 3, "explain": "**ผลึก calcium oxalate มีรูปทรงพีระมิดคู่ (bipyramidal/envelope) และหักเหแสงแบบ positive อย่างแรง** พบในผู้ป่วยไตวายระยะสุดท้ายที่ฟอกไต เพราะออกซาเลตเป็นสารที่ต้องขับทางไตและการฟอกไตขจัดออกได้ไม่หมด นอกจากนี้ยังพบใน short bowel syndrome, การกินวิตามินซีขนาดสูง (ถูกเปลี่ยนเป็นออกซาเลต), ผักโขมและรูบาร์บ และการขาดไทอามีน/ไพริดอกซีน\n\n**ทำไมข้ออื่นผิด**\n- **Gout** — ผลึกยูเรตเป็น **เข็มยาว negatively birefringent** ไม่ใช่พีระมิดคู่\n- **CPPD** — ผลึกสี่เหลี่ยมขนมเปียกปูน **positive แต่อ่อน** และชอบจับเข่ากับข้อมือมากกว่า PIP/MCP\n- **BCP** — **มองไม่เห็นใน polarized light** ต้องย้อม alizarin red\n- **Septic arthritis** — เม็ดเลือดขาว 6,500/µL ต่ำเกินไป (มักเกิน 50,000) และย้อมเชื้อไม่พบ แต่ยังต้องรอผลเพาะเชื้อเสมอ", "pearl": "ผู้ป่วยฟอกไต + ผลึกพีระมิดคู่ positively birefringent ที่ PIP/MCP = calcium oxalate arthropathy รักษาตามอาการและพิจารณาเพิ่มความถี่การฟอกไต", "topic": "ผลึกอื่นที่ต้องรู้จัก — BCP และ calcium oxalate", "src": "", "ref": [], "nl": ["B5.2.5(1)"]}]}, {"id": "air-23-05", "title": "ข้ออักเสบติดเชื้อ", "minutes": 8, "summary": "ภาวะฉุกเฉินทางออร์โธปิดิกส์ — เจาะข้อ เพาะเชื้อ ระบายหนอง แล้วให้ยาปฏิชีวนะ", "nl": ["B5.2.2-3(1)", "2.3.13-3(6)"], "md": "**ข้ออักเสบติดเชื้อทำลายกระดูกอ่อนได้ภายในไม่กี่วัน และมีอัตราตายราวร้อยละ 10** จึงถือเป็นภาวะฉุกเฉิน ข้อที่พบบ่อยที่สุดคือ **เข่า** ปัจจัยเสี่ยง: ข้อที่ผิดปกติอยู่เดิม (RA, OA, ข้อเทียม) · เบาหวาน · ผู้สูงอายุ · ยากดภูมิ · ฉีดยาเข้าเส้น · แผลหรือฝีที่ผิวหนัง\n\n### ลำดับการจัดการ\n1. **เจาะน้ำไขข้อก่อนให้ยาปฏิชีวนะ** (ถ้าไม่ช็อก) — ส่ง cell count, Gram stain, culture, ผลึก และ **เจาะ hemoculture ด้วยเสมอ** (บวกได้ถึงราวครึ่งหนึ่ง)\n2. **ระบายหนองออกจากข้อ** — เจาะซ้ำทุกวัน หรือส่องกล้อง/ผ่าตัดล้างข้อ โดยเฉพาะข้อสะโพก ข้อที่เข้าถึงยาก หรือข้อเทียม การให้ยาปฏิชีวนะอย่างเดียวโดยไม่ระบายหนองถือว่าไม่เพียงพอ\n3. **ยาปฏิชีวนะทางหลอดเลือดดำตามผล Gram stain**\n\n| Gram stain | เชื้อที่คาด | ยาเริ่มต้น |\n|---|---|---|\n| **Gram-positive cocci เป็นกลุ่ม** | *S. aureus* | **cloxacillin/nafcillin** IV · ถ้าเสี่ยง MRSA (เคยนอนโรงพยาบาล ฟอกไต ติดเชื้อในสถานพยาบาล) ใช้ **vancomycin** |\n| Gram-negative diplococci / คนหนุ่มสาวมีเพศสัมพันธ์ | *N. gonorrhoeae* | **ceftriaxone** + รักษา chlamydia ร่วม |\n| Gram-negative bacilli | Enterobacterales, *Pseudomonas* | ceftriaxone หรือ antipseudomonal ตามความเสี่ยง |\n| ย้อมไม่พบเชื้อ | ครอบคลุมตามความเสี่ยง | vancomycin ± ceftriaxone |\n\n**ระยะเวลา** โดยรวมราว **2 สัปดาห์แรกทางหลอดเลือดดำ แล้วเปลี่ยนเป็นยากินจนครบ 3–4 สัปดาห์** เมื่อผู้ป่วยดีขึ้นชัดเจน ไข้ลง CRP ลดลง และเชื้อไวต่อยากินที่ดูดซึมดี — ไม่ใช่หยุดยาทันทีที่อาการดี\n\n### Disseminated gonococcal infection — โจทย์คลาสสิกในคนหนุ่มสาว\nสองรูปแบบ: (1) **arthritis–dermatitis syndrome** — ปวดข้อย้ายที่ **tenosynovitis** ของข้อมือ/ข้อเท้า และ **ตุ่มหนองกระจายไม่กี่เม็ด** หรือ (2) ข้ออักเสบเป็นหนองข้อเดียว\n- น้ำไขข้อเพาะเชื้อขึ้นน้อยกว่าครึ่ง ให้ **ส่ง NAAT จากปัสสาวะ ท่อปัสสาวะ ปากมดลูก คอหอย และทวารหนัก** ร่วมด้วย\n- รักษาด้วย **ceftriaxone** และรักษาคู่นอน ตรวจ HIV และซิฟิลิสเสมอ\n\n### ข้อควรระวังเรื่องยา\nผู้ป่วยที่ได้ **beta-lactam ขนาดสูงทางหลอดเลือดดำนานเกิน 10–14 วัน** อาจเกิด **neutropenia จากยา** (idiosyncratic) — เจอเม็ดเลือดขาวต่ำลงระหว่างรักษา ให้คิดถึงยาก่อนเสมอ **หยุดหรือเปลี่ยนยา แล้วนับเม็ดเลือดจะกลับมาปกติเองภายใน 1–2 สัปดาห์** ไม่ต้องรีบเจาะไขกระดูกหรือให้ G-CSF ในรายที่ไม่มีไข้\n\n### ที่อาจารย์เน้นในสไลด์\n\n**ตัวเลขที่ควรจำ** — อุบัติการณ์ในประชากรทั่วไป 2–5 ต่อแสนต่อปี แต่ใน **RA สูงเป็น 28–38** และใน **ข้อเทียม 40–60 ต่อแสนต่อปี** · **ร้อยละ 75 ของผู้ใหญ่ที่เป็นมีปัจจัยเสี่ยงอยู่ก่อน**\n\n**เชื้อที่พบใน non-gonococcal septic arthritis** — *S. aureus* ~60% · **β-hemolytic streptococci ~15%** · แบคทีเรียแกรมลบรูปแท่ง ~15% · *S. pneumoniae* ~5% · อื่น ๆ และหลายเชื้อร่วม ~5%\n\n**เชื้อตามบริบทผู้ป่วย — ตารางนี้คือหัวใจของข้อสอบไทย**\n\n| บริบท | เชื้อที่ต้องนึกถึง |\n|---|---|\n| ทารกแรกเกิด | Streptococcus group B, *E. coli*, *S. aureus* |\n| อายุ 1–2 ปี | *H. influenzae*, *S. pyogenes*, *S. pneumoniae*, *S. aureus* |\n| ผู้สูงอายุ (มัก UTI นำมาก่อน) | *E. coli*, streptococci |\n| **เบาหวาน / โรคไตเรื้อรัง** | **_Burkholderia pseudomallei_ (เมลิออยโดสิส)** |\n| **ภูมิคุ้มกันบกพร่อง / SLE** | **non-typhoidal _Salmonella_**, *M. tuberculosis* |\n| **ผู้ใช้ยาเสพติดฉีดเข้าเส้น** | ***P. aeruginosa*** |\n| ถูกสัตว์กัด | *C. canimorsus*, *P. multocida*, *S. aureus* · หนูกัด — *Streptobacillus moniliformis*, *Spirillum minus* |\n\n**ความไวของการตรวจ** — Gram stain บวก **~75% เมื่อเป็น *S. aureus*** แต่เพียง **30–50% เมื่อเป็นแกรมลบ** · เพาะน้ำไขข้อขึ้น **~90%** · **hemoculture บวก 50–70%** · ถ้าได้ยาปฏิชีวนะไปก่อนหรือเพาะไม่ขึ้นให้ใช้ **PCR**\n\n**ภาพรังสี** — ระยะแรกเห็นเพียงเนื้อเยื่ออ่อนบวมและช่องข้อกว้างขึ้น ใช้เป็น baseline · **การกร่อนและช่องข้อแคบเกิดหลัง 2–3 สัปดาห์** จึงไม่ใช้ภาพรังสีเพื่อวินิจฉัยระยะเฉียบพลัน และ **GC arthritis ไม่จำเป็นต้องถ่ายภาพรังสี**\n\n**ข้อบ่งชี้ของการผ่าตัดระบายหนอง** — เด็ก · น้ำไขข้อเป็นหนองข้น · **ข้อที่เจาะยาก (สะโพก ไหล่)** · มีการติดเชื้อของโครงสร้างข้างเคียง (osteomyelitis, cellulitis) · **ไม่ตอบสนองการรักษาใน 5–7 วัน** · หนองแบ่งเป็นช่อง (loculated) · เชื้อดื้อยา\n\n**หลักการรักษาที่มักถูกถามเป็นข้อเขียน**\n- ยาปฏิชีวนะ **ทางหลอดเลือดดำ** เลือกตาม Gram stain อายุ และปัจจัยเสี่ยง แล้วปรับตามผลเพาะเชื้อ\n- **เจาะระบายน้ำในข้อทุกวัน** ในข้อที่เข้าถึงได้ และติดตาม **จำนวนเม็ดเลือดขาวในน้ำไขข้อและผลเพาะเชื้อ** เป็นตัวชี้ว่าตอบสนองหรือไม่\n- **หลีกเลี่ยง NSAIDs จนกว่าจะยืนยันการวินิจฉัยได้** เพราะจะกลบไข้และอาการจนประเมินการตอบสนองไม่ได้\n- ดามข้อเพื่อลดปวดช่วงแรก แต่ **เริ่มขยับข้อแบบ passive ภายใน 2–3 วัน** และ **ยังไม่ลงน้ำหนัก** จนกว่าการอักเสบจะสงบ\n\n**Disseminated gonococcal infection — ความไวของการเพาะเชื้อตามตำแหน่ง**\n\n| ตำแหน่งที่ส่งตรวจ | โอกาสพบเชื้อ |\n|---|---|\n| **ท่อปัสสาวะ** | **90%** |\n| ช่องคลอด | 50–70% |\n| **น้ำไขข้อ** | **< 50%** (ระยะ bacteremia ~0%) |\n| ช่องปาก / คอหอย | 20% |\n| ทวารหนัก | 15% |\n| รอยโรคผิวหนัง | < 10% |\n| เลือด (ระยะ bacteremia) | ~10% |\n\nจึงต้อง **ส่งเพาะจากเยื่อบุทุกตำแหน่งเสมอ ไม่ใช่ส่งเฉพาะน้ำไขข้อ** — เพาะบน **chocolate agar หรือ Thayer–Martin (modified New York)** ใน candle jar\nรักษาด้วย **ceftriaxone 1 g IV วันละครั้ง 7–14 วัน ร่วมกับ azithromycin 1 g กินครั้งเดียวเพื่อคลุม chlamydia** · ระบายหนองทุกวันถ้าน้ำในข้อเป็นหนอง · **รักษาคู่นอน** และมองหา **endocarditis กับ Fitz-Hugh–Curtis syndrome** พร้อมตรวจ **HIV และซิฟิลิส**\n", "pearls": ["สงสัยข้อติดเชื้อ: เจาะข้อ + hemoculture ก่อนยาปฏิชีวนะ แล้วต้องระบายหนอง", "Gram-positive cocci ในน้ำไขข้อ = S. aureus ให้ cloxacillin (vancomycin ถ้าเสี่ยง MRSA)", "คนหนุ่มสาว + ปวดข้อย้ายที่ + tenosynovitis + ตุ่มหนอง = gonococcal ให้ ceftriaxone", "เม็ดเลือดขาวต่ำหลังได้ beta-lactam นาน ๆ ให้นึกถึงยาเป็นเหตุ", "เบาหวานหรือไตเรื้อรัง + ข้อติดเชื้อ ให้คิดถึงเมลิออยโดสิส (B. pseudomallei) · SLE/ภูมิคุ้มกันบกพร่องให้คิดถึง non-typhoidal Salmonella · ผู้ฉีดยาเข้าเส้นให้คิดถึง Pseudomonas", "หลีกเลี่ยง NSAIDs จนกว่าจะยืนยันการวินิจฉัย เพราะจะกลบการตอบสนอง", "DGI: ท่อปัสสาวะเพาะขึ้น 90% แต่น้ำไขข้อขึ้นไม่ถึงครึ่ง — ต้องส่งเยื่อบุทุกตำแหน่ง"], "source": "สไลด์ อ.โชคชัย — Septic arthritis for RSU", "items": [{"id": "AIR-MCQ-20", "kind": "mcq", "stem": "A 63-year-old man with diabetes has a hot swollen left knee and fever for 2 days. Synovial fluid shows 78,000 WBC/mm3 with 93% neutrophils, no crystals, and Gram stain shows gram-positive cocci in clusters. Which of the following is the most appropriate initial management?", "choices": ["Oral dicloxacillin as an outpatient with follow-up in 1 week", "Joint drainage plus intravenous cloxacillin", "Colchicine plus intravenous fluids while awaiting culture", "Intra-articular corticosteroid injection plus oral NSAID", "Intravenous ceftriaxone alone without drainage"], "answer": 1, "explain": "**Gram-positive cocci เป็นกลุ่ม (cluster) = Staphylococcus aureus ซึ่งเป็นเชื้อก่อ septic arthritis ที่พบบ่อยที่สุดในผู้ใหญ่** (ในผู้ป่วยหนุ่มสาวที่มีเพศสัมพันธ์หลายคู่ ให้นึกถึง **Neisseria gonorrhoeae** ซึ่งมักมา triad: tenosynovitis + ผื่นตุ่มหนอง + migratory polyarthralgia และตอบสนองต่อ ceftriaxone)\n\n**การรักษามี 2 ขาเสมอ: ระบายหนอง + ยาปฏิชีวนะทางหลอดเลือดดำ**\n- **ระบายหนอง** ด้วยการเจาะซ้ำทุกวัน, arthroscopic lavage หรือผ่าตัด — เพราะหนองในข้อทำลายกระดูกอ่อนด้วยเอนไซม์และยาปฏิชีวนะเข้าไม่ถึงเพียงพอ\n- **ยา** เริ่ม cloxacillin (หรือ cefazolin) สำหรับ MSSA; ถ้าเสี่ยง MRSA ให้ vancomycin ก่อน แล้วปรับตามผลเพาะเชื้อ ให้ IV ประมาณ 2 สัปดาห์แล้วต่อด้วยยากิน รวม 3–4 สัปดาห์\n\n**ทำไมข้ออื่นผิด** — ยาอย่างเดียวโดยไม่ระบายหนองทำให้ข้อพัง; **สเตียรอยด์ฉีดเข้าข้อที่ติดเชื้อเป็นข้อห้ามเด็ดขาด**; ยากินผู้ป่วยนอกในข้อติดเชื้อไม่เพียงพอ; colchicine รักษาผลึกซึ่งเคสนี้ไม่มี", "pearl": "Septic arthritis = **ระบายหนอง + ยาฉีด** เสมอ; GPC cluster = S. aureus → cloxacillin, หนุ่มสาวเพศสัมพันธ์เสี่ยง = gonococcus → ceftriaxone", "topic": "Septic arthritis — organism and initial therapy", "src": "", "ref": ["MED33 โพย MCQ ข้อ 8 'Knee pain c/s gram positive cocci in cluster ให้ IV cloxacillin'", "IDSA/BSR septic arthritis guidance"], "nl": ["2.3.13-3(6)", "B5.2.2-3(1)", "B5.3(3)", "2.1.1"]}, {"id": "AIR-OLD-24", "kind": "old", "stem": "A patient with a hot swollen knee has synovial fluid Gram stain showing gram-positive cocci in clusters. What is the most appropriate antibiotic?", "choices": ["Oral doxycycline", "Intravenous ceftriaxone", "Intravenous cloxacillin", "Intravenous metronidazole", "Oral amoxicillin"], "answer": 2, "explain": "**GPC in clusters = Staphylococcus aureus** ซึ่งเป็นเชื้อที่พบบ่อยที่สุดของ septic arthritis ในผู้ใหญ่ → **cloxacillin หรือ cefazolin สำหรับ MSSA** (ถ้าเสี่ยง MRSA ให้ vancomycin ไปก่อน) และต้อง **ระบายหนองออกจากข้อ** ควบคู่เสมอ มิฉะนั้นกระดูกอ่อนถูกทำลายถาวร", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 8 'Knee pain c/s gram positive cocci in cluster ให้ iv cloxacillin'", "ref": [], "nl": ["2.3.13-3(6)", "B5.2.2-3(1)", "B5.3(3)"]}, {"id": "AIR-OLD-32", "kind": "old", "stem": "A 30-year-old sexually active man has migratory polyarthralgia, tenosynovitis of the wrist and a few pustular skin lesions, then develops a hot swollen knee. What is the most likely organism?", "choices": ["Salmonella species", "Mycobacterium tuberculosis", "Neisseria gonorrhoeae", "Streptococcus pyogenes", "Staphylococcus aureus"], "answer": 2, "explain": "**Disseminated gonococcal infection** มาด้วย triad: **tenosynovitis + ผื่นตุ่มหนอง + migratory polyarthralgia** แล้วตามด้วยข้ออักเสบเป็นหนอง; ต้องเพาะเชื้อจากทุกตำแหน่ง (ข้อ เลือด ท่อปัสสาวะ คอ ทวาร) และรักษาด้วย **ceftriaxone** ร่วมกับการรักษา chlamydia และตามคู่นอน", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED33 โพย (arthritis + sexual history) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["2.3.13-3(6)", "B5.2.2-3(1)", "2.1.27"]}, {"id": "AIR-OLD-25", "kind": "old", "stem": "A patient with septic arthritis on intravenous cloxacillin for 12 days is clinically well but the neutrophil count has fallen to 900/mm3. What is the most appropriate next step?", "choices": ["Recognize drug-induced neutropenia and switch to another effective antibiotic class with monitoring", "Continue the same antibiotic and repeat the count in 1 month", "Stop all antibiotics and observe", "Add granulocyte colony-stimulating factor and continue the same drug", "Perform bone marrow biopsy before any change"], "answer": 0, "explain": "โพยเก่าตอบ 'ให้ cloxacillin ต่อ' ซึ่ง **ไม่ปลอดภัยเมื่อ ANC ต่ำถึง 900 และยังต้องให้ยาต่ออีกหลายสัปดาห์** — beta-lactam ขนาดสูงนานเกิน 10-14 วันทำให้เกิด neutropenia ได้บ่อย และค่าจะฟื้นภายใน 1-2 สัปดาห์หลังเปลี่ยนยา แนวทางที่เหมาะคือ **เปลี่ยนกลุ่มยาที่ยังครอบคลุมเชื้อเดิมแล้วติดตาม CBC**; ถ้าค่าไม่ฟื้นหลังหยุดยาจึงพิจารณาเจาะไขกระดูก", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 8 (ต่อ) 'ให้ iv cloxacillin ไป 5 วัน มาตรวจติดตาม neutrophil ลด ทำไรต่อ > ให้ iv cloxacillin ต่อ'", "ref": [], "nl": ["2.3.3-3(5)", "2.3.13-3(6)"]}, {"id": "AIR-MCQ-21", "kind": "mcq", "stem": "The same patient improves clinically on intravenous cloxacillin. On day 12 of therapy he is afebrile with a normal-looking knee, but routine CBC shows WBC 2,800/mm3 with absolute neutrophil count 900/mm3 (previously normal). There is no new fever or mucosal ulcer. Which of the following is the most appropriate management?", "choices": ["Recognize drug-induced neutropenia, change to an alternative antibiotic class and monitor the blood count", "Stop all antibiotics immediately and observe off therapy", "Start granulocyte colony-stimulating factor and continue cloxacillin", "Perform bone marrow biopsy before making any change to therapy", "Continue the same dose of cloxacillin and repeat the CBC in 1 month"], "answer": 0, "explain": "**Beta-lactam ขนาดสูงนานเกิน 10–14 วัน ทำให้เกิด neutropenia ได้บ่อย** (cloxacillin, piperacillin, nafcillin เป็นตัวที่รายงานมากที่สุด) กลไกเป็น immune-mediated หรือกดไขกระดูกโดยตรง ลักษณะสำคัญคือ **เกิดช่วงสัปดาห์ที่ 2–3 ของการรักษา และกลับเป็นปกติภายใน 1–2 สัปดาห์หลังหยุดยา**\n\n**แนวทาง** — ANC 500–1,000 และผู้ป่วยดีขึ้นแล้ว ให้ **เปลี่ยนไปกลุ่มยาอื่นที่ครอบคลุมเชื้อเดิม** (เช่น cefazolin หรือ clindamycin ตามผลความไว) แล้วติดตาม CBC ซ้ำ 2–3 วัน ไม่ต้อง G-CSF ในผู้ป่วยที่ไม่มีไข้และ ANC ไม่ต่ำมาก\n\n**ทำไมข้ออื่นผิด**\n- **ให้ยาเดิมต่อแล้วตรวจอีกเดือนหน้า** เสี่ยง agranulocytosis (ANC < 500) และ febrile neutropenia\n- **G-CSF พร้อมยาเดิม** ไม่แก้ต้นเหตุและไม่ใช่ข้อบ่งชี้มาตรฐาน\n- **Bone marrow biopsy** ไม่จำเป็นเมื่อสาเหตุจากยาชัดเจนและซีรีส์อื่นปกติ ให้ทำเมื่อค่าไม่ฟื้นหลังหยุดยา\n- **หยุดยาทั้งหมดทันที** ในข้อติดเชื้อที่ยังรักษาไม่ครบ course เสี่ยงกำเริบ", "pearl": "Neutropenia สัปดาห์ที่ 2 ของ beta-lactam ขนาดสูง = **drug-induced** — เปลี่ยนกลุ่มยา ไม่ใช่หยุดยาทั้งหมดหรือเจาะไขกระดูก", "topic": "Beta-lactam induced neutropenia", "src": "", "ref": ["MED33 โพย MCQ ข้อ 8 (ต่อ) 'ให้ IV cloxacillin 5 วัน มาตรวจติดตาม neutrophil ลด ทำไรต่อ'", "Harrison 21st ed., Drug-induced agranulocytosis"], "nl": ["2.3.3-3(5)", "2.3.13-3(6)"]}]}, {"id": "air-23-06", "title": "ข้อเสื่อม (osteoarthritis)", "minutes": 7, "summary": "วินิจฉัยจากคลินิก และเริ่มการรักษาจากสิ่งที่ได้ผลมากที่สุดคือออกกำลังกายและลดน้ำหนัก", "nl": ["B5.2.7(1)", "2.3.13(5)", "B5.4(1)"], "md": "### ภาพทางคลินิก\n- ปวดแบบ **mechanical** — ใช้งานแล้วปวด พักแล้วดีขึ้น **ฝืดตอนเช้าน้อยกว่า 30 นาที**\n- ข้อที่พบบ่อย: **เข่า สะโพก ข้อมือหัวแม่มือ (CMC ที่ 1) และข้อนิ้วส่วนปลาย**\n- ตรวจพบ **crepitus, bony enlargement, ช่วงการเคลื่อนไหวลดลง** โดย **ไม่ร้อนแดง**\n- **Heberden node ที่ DIP และ Bouchard node ที่ PIP** — ต่างจาก RA ที่จับ **MCP และ PIP แต่ไม่จับ DIP**\n- ในผู้ป่วยที่มีอาการตรงแบบและอายุมากกว่า 45 ปี **วินิจฉัยได้จากคลินิกโดยไม่ต้องถ่ายภาพรังสี**\n\n| | Osteoarthritis | Rheumatoid arthritis |\n|---|---|---|\n| ฝืดตอนเช้า | < 30 นาที | **> 1 ชั่วโมง** |\n| ข้อที่จับ | DIP, CMC ที่ 1, เข่า, สะโพก | **MCP, PIP, ข้อมือ — ไม่จับ DIP** |\n| ลักษณะบวม | แข็งเป็นกระดูก | นุ่ม มีน้ำ อุ่น |\n| ESR/CRP | ปกติ | สูง |\n| ภาพรังสี | **ช่องข้อแคบไม่สมมาตร · osteophyte · subchondral sclerosis และ cyst** | **ช่องข้อแคบสมมาตร · marginal erosion · periarticular osteopenia** |\n| แอนติบอดี | ไม่มี | RF, **anti-CCP** |\n\n### การรักษาตามลำดับความสำคัญ\n1. **การออกกำลังกาย (เสริมความแข็งแรงกล้ามเนื้อ quadriceps + แอโรบิก) และการลดน้ำหนัก** — ได้ผลมากที่สุดและควรเป็นคำตอบอันดับแรกเสมอ ลดน้ำหนักร้อยละ 5–10 ลดอาการปวดได้ชัดเจน\n2. ให้ความรู้ ปรับกิจกรรม อุปกรณ์ช่วย (ไม้เท้าถือด้านตรงข้ามข้อที่ปวด) กายภาพบำบัด\n3. ยาเฉพาะที่ — **topical NSAIDs** เป็นตัวเลือกที่ปลอดภัยที่สุดโดยเฉพาะผู้สูงอายุ\n4. ยากิน — NSAIDs ระยะสั้นในขนาดต่ำที่สุด (ระวังไต กระเพาะ หัวใจ) · paracetamol ได้ผลน้อย\n5. **ฉีด corticosteroid ในข้อ** ช่วยลดปวดได้ราว 2–4 สัปดาห์ ใช้เมื่อกำเริบ ไม่ควรฉีดบ่อยเกิน 3–4 ครั้งต่อปี\n6. **ผ่าตัดเปลี่ยนข้อ** เมื่ออาการรุนแรง คุณภาพชีวิตแย่ และรักษาแบบไม่ผ่าตัดล้มเหลว\n- **Glucosamine/chondroitin ไม่มีหลักฐานชัดเจน** และไม่แนะนำเป็นการรักษาหลัก\n", "pearls": ["OA จับ DIP · RA ไม่จับ DIP", "การรักษาอันดับแรกของข้อเข่าเสื่อมคือออกกำลังกายและลดน้ำหนัก ไม่ใช่ยา", "ภาพรังสี OA: ช่องข้อแคบไม่สมมาตร + osteophyte + subchondral sclerosis/cyst"], "items": [{"id": "AIR-MCQ-22", "kind": "mcq", "stem": "A 64-year-old woman with BMI 31 kg/m2 has bilateral knee pain worse with walking and improving with rest, with morning stiffness of 10 minutes and crepitus. There is no warmth or effusion. Radiographs show joint space narrowing and osteophytes. Which of the following is the most appropriate first-line management?", "choices": ["Long-term oral corticosteroid", "Intra-articular hyaluronic acid injection as first-line therapy", "Long-term opioid analgesia", "Early referral for total knee arthroplasty", "Structured exercise, quadriceps strengthening and weight reduction, with topical NSAID for pain"], "answer": 4, "explain": "**Osteoarthritis คือความล้มเหลวของทั้งข้อ (กระดูกอ่อน กระดูกใต้ผิวข้อ เยื่อหุ้มข้อ กล้ามเนื้อ) จากภาระเชิงกลสะสม ไม่ใช่โรคอักเสบเป็นหลัก** จึงอธิบายอาการได้ครบ: ปวดเมื่อใช้งาน ดีขึ้นเมื่อพัก **ข้อฝืดตอนเช้าไม่เกิน 30 นาที** และไม่มีอาการทั่วร่างกาย\n\n**ลำดับการรักษาที่มีหลักฐานดีที่สุดคือสิ่งที่ไม่ใช่ยา** — การออกกำลังกายเพิ่มความแข็งแรงของ quadriceps และการลดน้ำหนัก (ลด 5–10% ลดปวดชัดเจน เพราะแรงที่ผ่านเข่าเท่ากับ 3–6 เท่าของน้ำหนักตัว) ตามด้วย **topical NSAID** ซึ่งแนะนำก่อนยา NSAID ชนิดกินในผู้สูงอายุเพราะผลข้างเคียงระบบน้อยกว่ามาก\n\n**ทำไมข้ออื่นผิด**\n- **สเตียรอยด์กินระยะยาว** ไม่มีบทบาทใน OA และทำให้กระดูกพรุน (ฉีดเข้าข้อได้เป็นครั้งคราวเมื่อปวดมาก แต่ไม่เกิน 3–4 ครั้ง/ปี)\n- **Hyaluronic acid** หลักฐานประโยชน์น้อย ไม่ใช่ first line\n- **ผ่าตัดเปลี่ยนข้อ** สงวนไว้เมื่อการรักษาแบบประคับประคองเต็มที่แล้วยังปวดจนกระทบคุณภาพชีวิต\n- **Opioid ระยะยาว** ไม่แนะนำใน OA เพราะประโยชน์น้อยและเสี่ยงติด", "pearl": "OA = **ออกกำลังกาย + ลดน้ำหนัก + topical NSAID มาก่อนเสมอ**; ข้อฝืดเช้า < 30 นาทีและไม่มีการอักเสบทั่วร่างกาย", "topic": "Osteoarthritis of the knee — first-line management", "src": "", "ref": ["MED31 โพย MCQ OA เข่า", "ACR/AF Osteoarthritis Guideline 2019"], "nl": ["B5.2.7(1)", "2.3.13(5)", "2.1.27", "B5.4(1)", "B5.3(1)"]}, {"id": "AIR-OLD-27", "kind": "old", "stem": "A 60-year-old woman has bilateral knee pain worse with walking, relieved by rest, with 10 minutes of morning stiffness and bony enlargement of the distal interphalangeal joints. ANA and rheumatoid factor are negative. Radiograph shows joint space narrowing with osteophytes. What is the diagnosis?", "choices": ["Psoriatic arthritis", "Rheumatoid arthritis", "Osteoarthritis", "Polymyalgia rheumatica", "Systemic lupus erythematosus"], "answer": 2, "explain": "**ฝืดเช้าสั้น + ปวดเมื่อใช้งาน + ปุ่มกระดูกที่ DIP (Heberden node) + osteophyte บนฟิล์ม = OA**; RA จะเป็น MCP/PIP/ข้อมือ ฝืดเช้า > 1 ชั่วโมง และฟิล์มเห็น periarticular osteopenia กับ marginal erosion ไม่ใช่ osteophyte", "pearl": "", "topic": "", "src": "MED34 โพย MCQ 'Osteopenia at PIP, MCP, mild joint space narrowing no erosion, ANA negative RF negative — Diag? A. Osteoarthritis B. RA'", "ref": [], "nl": ["B5.2.7(1)", "2.3.13(5)", "B5.3(1)"]}, {"id": "AIR-MCQ-23", "kind": "mcq", "stem": "A 55-year-old woman has painful hands. Which of the following findings best distinguishes rheumatoid arthritis from osteoarthritis?", "choices": ["Joint space narrowing on radiograph", "Pain that worsens with use and improves with rest", "Bony enlargement of the distal interphalangeal joints", "Symmetric swelling of the metacarpophalangeal and proximal interphalangeal joints with morning stiffness lasting more than 1 hour", "Crepitus on joint movement"], "answer": 3, "explain": "**จุดแยกที่แม่นที่สุดคือ 'ข้อไหน' และ 'ข้อฝืดตอนเช้านานเท่าไร'**\n\n| | **Rheumatoid arthritis** | **Osteoarthritis** |\n|---|---|---|\n| ข้อที่เป็น | **MCP, PIP, ข้อมือ** (สองข้างสมมาตร) เว้น DIP | **DIP (Heberden), PIP (Bouchard)**, CMC นิ้วโป้ง, เข่า สะโพก |\n| ข้อฝืดตอนเช้า | **> 1 ชั่วโมง** | **< 30 นาที** |\n| ปวดสัมพันธ์กับ | พักแล้วแย่ลง ใช้งานแล้วดีขึ้น | **ใช้งานแล้วแย่ลง พักแล้วดีขึ้น** |\n| บวม | นุ่ม อุ่น (synovitis) | **แข็งเป็นปุ่มกระดูก** |\n| อาการทั่วร่างกาย | อ่อนเพลีย ไข้ต่ำ น้ำหนักลด | ไม่มี |\n| ภาพรังสี | **periarticular osteopenia, marginal erosion**, ช่องข้อแคบสม่ำเสมอ | **osteophyte, subchondral sclerosis/cyst**, ช่องข้อแคบไม่สม่ำเสมอ |\n| Lab | RF/anti-CCP บวกได้, ESR/CRP สูง | ปกติ |\n\n**ทำไมข้ออื่นผิด** — DIP บวมเป็นปุ่มกระดูกคือ **Heberden node ของ OA** (RA แทบไม่เป็น DIP), ปวดเมื่อใช้งานคือลักษณะ OA, ส่วนช่องข้อแคบและ crepitus พบได้ทั้งสองโรคจึงแยกไม่ได้\n\n**ข้อควรระวังจากโพยเก่า** — มีข้อที่ให้ 'periarticular osteopenia ที่ PIP/MCP, ช่องข้อแคบเล็กน้อย ไม่มี erosion, ANA และ RF ลบ' แล้วให้เลือกระหว่าง OA กับ RA: ตำแหน่ง MCP/PIP + osteopenia รอบข้อเข้าได้กับ **seronegative RA ระยะแรก** มากกว่า OA เพราะ OA ไม่ทำให้เกิด periarticular osteopenia และไม่ค่อยเป็น MCP — RF ลบพบได้ถึง 20–30% ของ RA", "pearl": "**MCP/PIP + ฝืดเช้า > 1 ชม. = RA · DIP เป็นปุ่มกระดูก + ฝืด < 30 นาที = OA**; RF ลบไม่ตัด RA ออก", "topic": "Osteoarthritis versus rheumatoid arthritis", "src": "", "ref": ["MED33 โพย Joint ข้อ 2 'ปวดข้อนิ้วมือ MCP/PIP สองข้างเท่ากัน ปวดมากขึ้นตอนเช้า → RA'", "MED33 โพย MCQ ข้อ 4 'Morning stiffness more than 30 minutes'", "MED34 โพย 'Osteopenia at PIP, MCP; ANA negative RF negative'"], "nl": ["2.3.13-3(12)", "2.3.13(5)", "B5.2.7(1)", "B5.3(5)", "2.1.27"]}]}, {"id": "air-23-07", "title": "ปวดรอบข้อ และข้ออักเสบหลังติดเชื้อ", "minutes": 6, "summary": "กลุ่มอาการเอ็นและถุงน้ำ · reactive arthritis · และเจ็บหน้าอกที่ไม่ได้มาจากข้อ", "nl": ["2.1.27", "B5.2.2-3(3)", "2.3.13-3(13)"], "md": "### ปวดรอบข้อ (soft-tissue rheumatism)\nตรวจร่างกายแยกได้โดย **จุดกดเจ็บเฉพาะที่ + เจ็บเมื่อขยับ active หรือเมื่อต้านแรง แต่ passive range เกือบปกติ** และ **ไม่มีน้ำในข้อ**\n\n| กลุ่มอาการ | ลักษณะ |\n|---|---|\n| **Rotator cuff tendinopathy** | ปวดไหล่ด้านนอก ยกแขนเหนือศีรษะแล้วเจ็บ ปวดตอนกลางคืนเวลานอนทับ |\n| **Adhesive capsulitis (ไหล่ติด)** | **passive range ลดลงทุกทิศทาง** พบบ่อยในเบาหวาน |\n| **Lateral epicondylitis (tennis elbow)** | กดเจ็บที่ปุ่มกระดูกด้านนอกข้อศอก เจ็บเมื่อกระดกข้อมือต้านแรง |\n| **De Quervain tenosynovitis** | เจ็บโคนนิ้วหัวแม่มือ **Finkelstein test บวก** พบในคุณแม่หลังคลอดและคนใช้มือถือมาก |\n| **Carpal tunnel syndrome** | ชาฝ่ามือด้านนิ้วโป้ง–นิ้วนาง ตื่นกลางคืนต้องสะบัดมือ สัมพันธ์กับไทรอยด์ต่ำ ตั้งครรภ์ เบาหวาน |\n| **Plantar fasciitis** | เจ็บส้นเท้าก้าวแรกหลังตื่นนอน |\n| **Trochanteric bursitis** | เจ็บด้านข้างสะโพก นอนตะแคงทับแล้วเจ็บ |\n\nการรักษาส่วนใหญ่เหมือนกัน — **พักการใช้งานที่ทำให้เจ็บ · กายภาพบำบัดและยืดกล้ามเนื้อ · ยาแก้ปวดเฉพาะที่** และฉีด corticosteroid เฉพาะที่เมื่อไม่ดีขึ้น\n\n### Reactive arthritis\n- ข้ออักเสบแบบ **asymmetric oligoarthritis ของข้อใหญ่ขาส่วนล่าง** เกิด **1–4 สัปดาห์หลังติดเชื้อทางเดินอาหาร** (*Salmonella, Shigella, Campylobacter, Yersinia*) **หรือทางเดินปัสสาวะและอวัยวะเพศ** (*Chlamydia trachomatis*)\n- อาการร่วมที่ช่วยยืนยัน: **conjunctivitis/uveitis · urethritis · enthesitis (เอ็นร้อยหวาย) · dactylitis (นิ้วบวมทั้งนิ้ว) · keratoderma blennorrhagicum**\n- **เพาะเชื้อจากน้ำไขข้อไม่ขึ้น** เพราะไม่ใช่การติดเชื้อในข้อ · สัมพันธ์กับ **HLA-B27**\n- รักษาด้วย **NSAIDs** เป็นอันดับแรก ± ฉีด steroid ในข้อ · ให้ยาปฏิชีวนะเฉพาะเมื่อยังมีการติดเชื้อ chlamydia อยู่ (ไม่ได้ให้เพื่อรักษาข้อ) · รายเรื้อรังใช้ sulfasalazine\n- ส่วนใหญ่หายใน 3–6 เดือน\n\n### ระวัง — เจ็บที่ไม่ได้มาจากข้อ\nเจ็บหน้าอกแบบ **pleuritic ที่ดีขึ้นเมื่อโน้มตัวไปข้างหน้า** ในผู้ป่วยโรคภูมิต้านตนเองคือ **pericarditis** ไม่ใช่อาการทางกล้ามเนื้อ — ต้องตรวจคลื่นไฟฟ้าหัวใจหา **diffuse concave ST elevation ร่วมกับ PR depression** และฟังหา friction rub\n", "pearls": ["ปวดรอบข้อ: passive range เกือบปกติ กดเจ็บเป็นจุด ไม่มีน้ำในข้อ", "Reactive arthritis เกิด 1–4 สัปดาห์หลังท้องเสียหรือติดเชื้อทางเพศสัมพันธ์ น้ำไขข้อเพาะไม่ขึ้น", "เจ็บหน้าอกที่ดีขึ้นเมื่อโน้มตัวไปข้างหน้า = pericarditis"], "items": [{"id": "AIR-MCQ-24", "kind": "mcq", "stem": "A 42-year-old woman who cares for her newborn grandchild has pain over the radial side of the right wrist. Pain is reproduced when she flexes the thumb into the palm and deviates the wrist to the ulnar side (Finkelstein test). There is no joint swelling and no morning stiffness. Which of the following is the most likely diagnosis?", "choices": ["De Quervain tenosynovitis", "Gouty arthritis of the wrist", "Rheumatoid arthritis of the wrist", "First carpometacarpal joint osteoarthritis", "Carpal tunnel syndrome"], "answer": 0, "explain": "**Finkelstein test บวก = de Quervain tenosynovitis** คือการอักเสบของปลอกหุ้มเอ็น **abductor pollicis longus และ extensor pollicis brevis** ที่ first dorsal compartment จากการใช้งานซ้ำ ๆ (อุ้มเด็ก ยกของด้วยนิ้วโป้ง พิมพ์มือถือ) พบบ่อยในหญิงหลังคลอดและผู้ดูแลทารก\n\n**การรักษา** — พัก ใส่ thumb spica splint, topical/oral NSAID, ถ้าไม่ดีขึ้นฉีดสเตียรอยด์เข้าปลอกเอ็น (ได้ผลดีมาก) ผ่าตัดเมื่อล้มเหลว\n\n**ทำไมข้ออื่นผิด**\n- **RA** ต้องมี synovitis บวมหลายข้อสมมาตรและข้อฝืดตอนเช้านาน — เคสนี้ไม่มี\n- **First CMC OA** เจ็บที่ฐานนิ้วโป้งและ **grind test** บวก (กดหมุนข้อ) ไม่ใช่ Finkelstein\n- **Carpal tunnel syndrome** เป็นอาการชาตามแนว median nerve (นิ้วโป้ง ชี้ กลาง) แย่ลงตอนกลางคืน ตรวจ Tinel/Phalen บวก ไม่ใช่ปวดเฉพาะที่เอ็น\n- **Gout ที่ข้อมือ** จะบวมแดงร้อนเฉียบพลัน มีน้ำในข้อและพบผลึกได้\n\n**ภาพรวมของกลุ่ม soft-tissue rheumatism ที่เกณฑ์แพทยสภากำหนดให้วินิจฉัยและรักษาเบื้องต้นได้เอง** ได้แก่ tendinitis, tenosynovitis, bursitis, fasciitis (เช่น plantar fasciitis) และ myofascial pain syndrome — ทั้งหมดเป็น **periarticular** จึงเจ็บเฉพาะจุด กดเจ็บตามแนวเอ็น และเจ็บเมื่อขยับแบบต้านแรง แต่ **ขยับข้อแบบ passive ได้เกือบเต็มพิสัย** ต่างจากโรคในข้อจริง", "pearl": "เจ็บ**เฉพาะจุด + ขยับ passive ได้เกือบเต็ม = periarticular (soft-tissue rheumatism)** ไม่ใช่โรคข้อ; Finkelstein บวก = de Quervain", "topic": "Soft-tissue rheumatism", "src": "", "ref": ["MED31 โพย MCQ soft tissue rheumatism", "ACR primer on regional musculoskeletal pain"], "nl": ["B5.2.3(1)", "2.3.13(7)", "2.1.26"]}, {"id": "AIR-MCQ-25", "kind": "mcq", "stem": "A 26-year-old man develops asymmetric pain and swelling of the right knee and left ankle 3 weeks after an episode of bloody diarrhea. He also has conjunctivitis and dysuria without urethral discharge. Synovial fluid shows 15,000 WBC/mm3, no crystals, and sterile culture. Which of the following is the most likely diagnosis?", "choices": ["Rheumatoid arthritis", "Acute gouty arthritis", "Septic arthritis from Salmonella", "Reactive arthritis", "Systemic lupus erythematosus"], "answer": 3, "explain": "**Oligoarthritis ของข้อใหญ่ขาส่วนล่าง แบบไม่สมมาตร เกิด 1–4 สัปดาห์หลังติดเชื้อทางเดินอาหาร (Salmonella, Shigella, Campylobacter, Yersinia) หรือทางเพศสัมพันธ์ (Chlamydia) = reactive arthritis** ซึ่งอยู่ในกลุ่ม **spondyloarthropathy** (สัมพันธ์กับ HLA-B27)\n\n**Triad คลาสสิก** — ข้ออักเสบ + เยื่อบุตาอักเสบ + ท่อปัสสาวะอักเสบ (\"can't see, can't pee, can't climb a tree\") พบครบไม่ถึงหนึ่งในสาม ลักษณะอื่นที่ช่วย: **enthesitis** (เจ็บที่เอ็นร้อยหวายเกาะกระดูก), dactylitis (นิ้วบวมทั้งนิ้ว), keratoderma blennorrhagicum, ปวดหลังส่วนล่างแบบอักเสบ\n\n**หัวใจคือ 'ข้อปลอดเชื้อ'** — เพาะเชื้อจากน้ำไขข้อไม่ขึ้น เพราะเป็นปฏิกิริยาภูมิคุ้มกันหลังติดเชื้อ ไม่ใช่เชื้ออยู่ในข้อ ต่างจาก septic arthritis ที่ WBC มักเกิน 50,000 และเพาะขึ้น\n\n**การรักษา** — NSAID เป็นหลัก, ฉีดสเตียรอยด์เข้าข้อได้, ให้ยาปฏิชีวนะเฉพาะเมื่อยังมีการติดเชื้อ Chlamydia อยู่ (ไม่ได้รักษาตัวข้ออักเสบ), ถ้าเรื้อรังเกิน 3–6 เดือนใช้ sulfasalazine\n\n**ทำไมข้ออื่นผิด** — gout ไม่มีเยื่อบุตาอักเสบและพบผลึก; SLE เป็น polyarthritis สมมาตรพร้อมอาการหลายระบบและ ANA บวก; RA เป็นข้อเล็กสมมาตรและไม่สัมพันธ์กับการติดเชื้อนำมาก่อน", "pearl": "ท้องเสีย/ติดเชื้อทางเพศสัมพันธ์ → 1–4 สัปดาห์ → **ข้ออักเสบไม่สมมาตรขาส่วนล่าง + ตาแดง + แสบขัด = reactive arthritis ข้อปลอดเชื้อ**", "topic": "Reactive arthritis", "src": "", "ref": ["MED32 โพย MCQ arthritis หลังท้องเสีย", "Harrison 21st ed., Reactive Arthritis"], "nl": ["B5.2.2-3(3)", "2.3.13-3(13)", "2.1.27", "B5.3(3)"]}, {"id": "AIR-OLD-33", "kind": "old", "stem": "A patient with acute pericarditis has pleuritic chest pain relieved by leaning forward. Which drug combination is first-line?", "choices": ["Colchicine alone", "Anticoagulant plus an NSAID", "Antibiotics alone", "Aspirin or an NSAID plus colchicine", "Corticosteroid alone"], "answer": 3, "explain": "โพยเก่าให้ตัวเลือก 'colchicine alone' กับ 'ASA + colchicine' — **คำตอบคือ NSAID/aspirin ร่วมกับ colchicine** เพราะ colchicine ลดอาการและลดการเป็นซ้ำอย่างชัดเจน (ESC 2015) ส่วน **สเตียรอยด์เพิ่มการกลับเป็นซ้ำ** จึงสงวนไว้เมื่อมีข้อห้ามหรือเป็นจากโรคภูมิต้านตนเอง และ **ห้ามให้ยาต้านการแข็งตัวของเลือดโดยไม่จำเป็น** เพราะเสี่ยง hemopericardium", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 7 'First line tx pericarditis (pleuritic chest pain, better when leaning forward) > colchicine alone, asa+colchicine'", "ref": [], "nl": ["2.3.13(1)", "B5.4(1)"]}]}, {"id": "air-23-08", "title": "กระดูกพรุนและกระดูกหักจากอุบัติเหตุเล็กน้อย", "minutes": 6, "summary": "กระดูกหักจากล้มระดับพื้นในคนอายุ ≥ 50 ปี = วินิจฉัยกระดูกพรุนได้เลย", "nl": ["B5.2.5(2)", "2.3.13(6)", "B5.4(5)"], "md": "### วินิจฉัย\nเข้าเกณฑ์ข้อใดข้อหนึ่ง\n- **มี fragility fracture** (กระดูกสะโพกหรือกระดูกสันหลังหักจากแรงกระแทกเบา เช่นล้มจากระดับยืน) — **วินิจฉัยได้ทันทีโดยไม่ต้องรอค่า BMD**\n- **T-score ≤ −2.5** ที่กระดูกสันหลังส่วนเอว คอกระดูกต้นขา หรือสะโพกรวม\n- T-score ระหว่าง −1.0 ถึง −2.5 ร่ว
