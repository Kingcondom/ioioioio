bedaquiline หรือ linezolid", "เสมหะยังบวกสิ้นเดือนที่ 2 ให้สงสัยดื้อยาและส่ง DST", "ห้ามเติมยาตัวเดียวเข้าสูตรที่กำลังล้มเหลว"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-06", "kind": "old", "stem": "What is the definition of multidrug-resistant tuberculosis (MDR-TB)?", "choices": ["Resistance to any two first-line drugs", "Resistance to all four first-line drugs", "Resistance to isoniazid and ethambutol", "Resistance to at least isoniazid and rifampicin", "Resistance to rifampicin and pyrazinamide"], "answer": 3, "explain": "**MDR-TB = ดื้อต่อ isoniazid และ rifampicin เป็นอย่างน้อย** (สองตัวที่ฆ่าเชื้อได้แรงที่สุดของสูตรมาตรฐาน)\n\nนิยามอื่นที่ต้องแยก: **RR-TB** = ดื้อ rifampicin (ตรวจได้เร็วด้วย Xpert MTB/RIF); **pre-XDR** = MDR + ดื้อ fluoroquinolone; **XDR-TB** = MDR + ดื้อ fluoroquinolone + ดื้อยา **กลุ่ม A** อย่างน้อยหนึ่งตัว คือ **bedaquiline หรือ linezolid ซึ่งเป็นยากิน** (นิยามใหม่ปี 2021 เลิกใช้ 'ยาฉีดกลุ่มสอง' แล้ว)\n\n**ผู้ที่เสี่ยง MDR สูงสุดคือผู้สัมผัสใกล้ชิดกับผู้ป่วย MDR-TB** รองลงมาคือเคยรักษาวัณโรคมาก่อน/รักษาไม่ครบ", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 11 และ 26 – Multidrug resistance ใน TB หมายถึง isoniazid & rifampicin; MED32 MCQ ข้อ 19 – คนไหนเสี่ยง MDR TB → close contact MDR TB", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}]}], "date": "อ. 15 ก.ย."}, {"lec": "26", "title": "Arterial blood gas analysis", "subtitle": "การเก็บตัวอย่างและข้อผิดพลาด · oxygenation และ A–a gradient · ventilation และภาวะหายใจล้มเหลว · การแปลผลกรด-ด่างทีละขั้น · anion gap และ delta ratio", "objectives": ["เก็บตัวอย่างเลือดแดงให้ถูกวิธีและรู้ว่าอะไรทำให้ค่าที่ได้ผิดพลาด", "ประเมิน oxygenation จาก PaO2 · SaO2 · oxygen dissociation curve และ **A–a gradient**", "ใช้ A–a gradient และการตอบสนองต่อออกซิเจนแยกกลไกของภาวะพร่องออกซิเจนทั้ง 5 แบบ", "แยก respiratory failure type 1 จาก type 2 และตั้งเป้าหมายออกซิเจนให้เหมาะกับผู้ป่วย", "แปลผลกรด-ด่างอย่างเป็นระบบ — หาความผิดปกติหลัก ตรวจการชดเชย คำนวณ anion gap และ delta ratio แล้วจึงหาสาเหตุ"], "meq": [], "osce": [{"id": "CH-OSCE-03", "part": "OSCE/SAQ", "lec": "26", "lecture": "Pulmonary TB / ABG (แบ่งชั่วโมงสอน) (อ.ศิวพร)", "topic": "SAQ – Arterial blood gas interpretation in COPD", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ผู้ป่วยชายไทยอายุ 71 ปี เป็น COPD มา 12 ปี มาโรงพยาบาลด้วยอาการเหนื่อยมากขึ้นและซึมลง 1 วัน ขณะตรวจได้รับออกซิเจนทาง nasal cannula 2 ลิตร/นาที (ประมาณ FiO2 0.28)\nV/S: BT 37.4 C, PR 104/min, RR 26/min, BP 140/86 mmHg\nPE: drowsy, flapping tremor, warm peripheries, bounding pulse\nABG: pH 7.22, PaCO2 80 mmHg, PaO2 58 mmHg, HCO3 32 mmol/L, SaO2 88%\nSerum electrolytes: Na 140, K 4.2, Cl 96, HCO3 31 mmol/L, albumin 4.0 g/dL\n\nจงตอบคำถามต่อไปนี้\n3.1 จงแปลผล ABG อย่างเป็นระบบ (4 คะแนน)\n3.2 คำนวณ A-a gradient และแปลผล (2 คะแนน)\n3.3 จงอธิบายอาการทางคลินิกที่พบว่าเกิดจากอะไร (2 คะแนน)\n3.4 การรักษาที่เหมาะสมที่สุดในขณะนี้คืออะไร (2 คะแนน)", "answer": "**3.1 การแปลผล ABG อย่างเป็นระบบ**\n\n**ขั้นที่ 1 — pH**: **7.22** → **acidaemia** (ปกติ 7.35-7.45)\n\n**ขั้นที่ 2 — หาความผิดปกติปฐมภูมิ**\n- **PaCO2 80 mmHg (สูงมาก)** → ไปทางเดียวกับ acidaemia = **primary respiratory acidosis**\n- HCO3 32 (สูง) — ถ้าเป็นความผิดปกติปฐมภูมิจะทำให้ **alkalaemia** ซึ่งขัดกับ pH ที่ได้ → **HCO3 ที่สูงจึงเป็นการชดเชย ไม่ใช่ความผิดปกติหลัก**\n\n**ขั้นที่ 3 — ประเมินการชดเชย (acute หรือ chronic)**\n\n| | HCO3 เพิ่มต่อ PaCO2 สูงขึ้น 10 mmHg |\n|---|---|\n| **Acute respiratory acidosis** | **+1 mmol/L** |\n| **Chronic respiratory acidosis** | **+3.5-4 mmol/L** (ไตต้องใช้เวลา 3-5 วันในการเพิ่มการดูดกลับ HCO3 และขับ NH4⁺) |\n\nΔPaCO2 = 80 − 40 = **40 mmHg (4 หน่วยสิบ)**\n- **ถ้า acute ล้วน**: HCO3 ที่คาด = 24 + (4 × 1) = **28**\n- **ถ้า chronic ล้วน**: HCO3 ที่คาด = 24 + (4 × 3.5) = **38**\n- **ค่าจริง = 32** → **อยู่ระหว่างกลาง แต่ต่ำกว่าที่ควรเป็นของ chronic มาก**\n\n→ **Acute-on-chronic respiratory acidosis** — ผู้ป่วยมี **CO2 คั่งเรื้อรังจาก COPD อยู่เดิม (จึงมี HCO3 สูงกว่าปกติ)** แล้วมี **CO2 คั่งเฉียบพลันซ้อนขึ้นมา ซึ่งไตยังชดเชยไม่ทัน** จึงเกิด acidaemia รุนแรง\n\n**ขั้นที่ 4 — ตรวจหาความผิดปกติของเมตาบอลิกที่ซ่อนอยู่**\n**Anion gap = Na − (Cl + HCO3) = 140 − (96 + 31) = 13 mmol/L** → **ปกติ (8-12 ± ปรับตาม albumin ซึ่งปกติที่ 4.0)** → ไม่มี high anion gap metabolic acidosis ซ่อนอยู่\n\n**ขั้นที่ 5 — ตรวจสอบความสอดคล้องของตัวอย่าง**\nHCO3 จาก ABG (32) ใกล้เคียงกับ HCO3 จาก electrolytes (31) ต่างกันไม่เกิน 2 → **ตัวอย่างเลือดน่าเชื่อถือ**\n\n**สรุปคำตอบ**: **Acute-on-chronic hypercapnic (type 2) respiratory failure with acute-on-chronic respiratory acidosis, ไม่มีความผิดปกติทางเมตาบอลิกอื่นร่วม**\n\n**3.2 การคำนวณ A-a gradient**\n\n**PAO2 = FiO2 × (Patm − PH2O) − PaCO2/R**\n= 0.28 × (760 − 47) − 80/0.8\n= 0.28 × 713 − 100\n= 199.6 − 100 = **99.6 mmHg**\n\n**A-a gradient = PAO2 − PaO2 = 99.6 − 58 = ประมาณ 42 mmHg**\n\n**ค่าปกติตามอายุ = อายุ/4 + 4 = 71/4 + 4 ≈ 22 mmHg**\n\n→ **A-a gradient กว้างกว่าปกติอย่างชัดเจน**\n\n**แปลผล**: ภาวะพร่องออกซิเจนของผู้ป่วยรายนี้ **ไม่ได้เกิดจาก hypoventilation เพียงอย่างเดียว** แต่มี **ความผิดปกติที่เนื้อปอดร่วมด้วย — โดยหลักคือ V/Q mismatch จาก COPD** (ถุงลมถูกทำลายและหลอดลมเล็กอุดกั้นไม่สม่ำเสมอ) และอาจมีสาเหตุกระตุ้นอื่นซ่อนอยู่ เช่น **ปอดอักเสบ ภาวะน้ำท่วมปอด หรือลิ่มเลือดอุดกั้นปอด**\n\n> **หลักการ**: **hypoventilation ล้วน → A-a gradient ปกติ**; **A-a กว้าง → มี V/Q mismatch, shunt, หรือ diffusion limitation ร่วม**\n> อย่าลืมว่า **การให้ออกซิเจนเสริมทำให้ค่า A-a gradient แปลผลยากขึ้น** (ในทางปฏิบัติจึงนิยมใช้ **PaO2/FiO2 ratio** ซึ่งรายนี้ = 58/0.28 ≈ **207** → บ่งชี้ความผิดปกติของการแลกเปลี่ยนก๊าซที่ชัดเจน)\n\n**3.3 อาการทางคลินิกเกิดจากอะไร**\n\n| อาการ | กลไก |\n|---|---|\n| **ซึมลง (drowsy) — CO2 narcosis** | **CO2 ผ่าน blood-brain barrier ได้ดีมาก** → **pH ของน้ำไขสันหลังลดลง** → กดการทำงานของเซลล์ประสาท; ระดับการรู้สึกตัวสัมพันธ์กับ **อัตราการเพิ่มขึ้นของ PaCO2** มากกว่าค่าสัมบูรณ์ |\n| **Flapping tremor (asterixis)** | การรบกวนการทำงานของก้านสมองและ reticular formation จาก **metabolic encephalopathy** — พบได้ทั้งใน **hypercapnia, ตับวาย, ไตวาย** จึงไม่จำเพาะ |\n| **Warm peripheries, bounding pulse, และอาจพบ dilated retinal veins/ปวดศีรษะ** | **CO2 เป็นสารขยายหลอดเลือดที่แรง (potent vasodilator)** → หลอดเลือดส่วนปลายและหลอดเลือดสมองขยาย → **ชีพจรเต้นแรง มือเท้าอุ่น และความดันในกะโหลกศีรษะอาจสูงขึ้น (ทำให้ปวดศีรษะตอนเช้า ซึ่งเป็นอาการคลาสสิกของ CO2 คั่งเรื้อรัง)** |\n| **หายใจเร็ว 26/min แต่ยัง CO2 คั่ง** | บ่งชี้ว่า **ventilation ที่มีประสิทธิภาพลดลง** — หายใจเร็วตื้นทำให้สัดส่วน dead space สูง และกล้ามเนื้อหายใจกำลังล้า |\n\n**3.4 การรักษาที่เหมาะสมที่สุดในขณะนี้**\n\n**Non-invasive ventilation (BiPAP) ทันที** พร้อมกับการรักษามาตรฐานของ AECOPD\n\n**เหตุผล**: ผู้ป่วยเข้าเกณฑ์ชัดเจน — **pH < 7.35 (7.22) ร่วมกับ PaCO2 > 45 (80)** และยังรู้สึกตัวพอที่จะให้ความร่วมมือได้ ประโยชน์ที่พิสูจน์แล้วคือ **ลดอัตราการใส่ท่อช่วยหายใจ ลดอัตราตาย และลดวันนอนโรงพยาบาล**\n- **IPAP 12-15 / EPAP 4-5 cmH2O** แล้วปรับ IPAP ขึ้นตามการตอบสนอง (**IPAP เพิ่ม tidal volume → ขับ CO2; EPAP หักล้าง auto-PEEP → ลด work of breathing**)\n- **ตรวจ ABG ซ้ำที่ 1-2 ชั่วโมง — ถ้า pH ไม่ดีขึ้นหรือระดับความรู้สึกตัวแย่ลง ต้องใส่ท่อช่วยหายใจ ไม่ใช่ทนต่อ**\n\n**พร้อมกันนั้น**\n- **ปรับออกซิเจนให้ SpO2 อยู่ที่ 88-92%** (ขณะนี้ SaO2 88% ถือว่ากำลังพอดี **ห้ามเพิ่มออกซิเจนให้สูงกว่านี้** เพราะจะ **คลาย hypoxic pulmonary vasoconstriction → V/Q mismatch แย่ลง + Haldane effect** → CO2 ยิ่งคั่ง)\n- **พ่นยาขยายหลอดลม salbutamol + ipratropium** (ควรใช้อากาศขับ ไม่ใช่ออกซิเจนไหลสูง)\n- **Systemic corticosteroid** (prednisolone 40 mg × 5 วัน)\n- **ยาปฏิชีวนะ** ถ้าเข้าเกณฑ์ Anthonisen\n- **หาปัจจัยกระตุ้น**: **CXR (ปอดอักเสบ, pneumothorax), ECG, ตรวจหา PE ถ้าสงสัย**, ทบทวนยาที่กดการหายใจ\n- **หลีกเลี่ยงยานอนหลับ/ยาแก้ปวดกลุ่ม opioid โดยเด็ดขาด** ในผู้ป่วยที่ยังไม่ได้ใส่ท่อ", "ref": ["MED31 past paper loop C&D — ABG COPD", "MED34 SAQ ABG interpretation", "MED35 สอบลงกองครั้งที่ 2 — ABG"], "nl": ["3.3.17", "B6.3(2)", "2.3.10(3)"], "_kind": "meq", "_set": "chest"}], "sections": [{"id": "chest-26-01", "title": "การเก็บตัวอย่างและข้อผิดพลาดที่ทำให้แปลผลผิด", "minutes": 6, "summary": "ฟองอากาศ heparin และเวลาที่ทิ้งไว้ ทำให้ค่าเปลี่ยนได้จริง", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### ตำแหน่งที่เจาะ\n**Radial artery เป็นตำแหน่งแรกที่เลือก** เพราะตื้น กดห้ามเลือดง่าย และมีเลือดเลี้ยงสำรองจาก ulnar artery — ตำแหน่งอื่นที่ใช้ได้คือ **brachial, femoral, dorsalis pedis และ axillary artery**\n\n**Modified Allen's test** — ให้ผู้ป่วยกำมือแล้วยกมือสูง กดทั้ง radial และ ulnar artery จากนั้นลดมือลง แบมือ แล้ว **ปล่อยเฉพาะ ulnar artery**\n- **สีกลับมาภายใน 6 วินาที = ปกติ** แปลว่า ulnar artery และ superficial palmar arch ยังดี\n- **ใช้เวลา 10 วินาทีขึ้นไป = ผิดปกติ** ควรเลี่ยงการเจาะ radial ข้างนั้น\n\n### เทคนิค\n- เตรียมผิวหนังแบบปลอดเชื้อ · ใช้ **เข็มเล็ก 22–25 G** กับ **syringe ที่เคลือบ heparin** โดยเหลือ heparin ไว้น้อยกว่า 1 มล.\n- **แทงเข็มทำมุม 45 องศากับผิวหนัง** โดยมืออีกข้างคลำชีพจรนำ — เลือดแดงจะดันเข้ากระบอกเอง\n- เก็บเลือด **ประมาณ 2–3 มล.** แล้ว **กดห้ามเลือด 5–10 นาที** (นานกว่านี้ในผู้ที่ได้ยาต้านการแข็งตัวของเลือด)\n- ภาวะแทรกซ้อนพบน้อย — เลือดออกไม่หยุด ก้อนเลือด บาดเจ็บต่อหลอดเลือด และ **ลิ่มเลือดอุดตันที่ตำแหน่งเจาะจนเลือดไปเลี้ยงส่วนปลายลดลง**\n\n### ข้อผิดพลาดของตัวอย่าง — ออกสอบบ่อยกว่าที่คิด\n| สาเหตุ | ผลต่อค่าที่ได้ |\n|---|---|\n| **ฟองอากาศเกิน 1–2% ของปริมาตรเลือด** | **PaO2 สูงเทียม และ PaCO2 ต่ำเทียม** — ต้องไล่ฟองออกเบา ๆ โดยไม่เขย่า และส่งตรวจทันที |\n| **ทิ้งไว้นานที่อุณหภูมิห้อง** | เม็ดเลือดขาวยังใช้ออกซิเจนต่อ → **PaO2 ต่ำเทียม** — ลดปัญหาด้วยการ **แช่น้ำแข็งและวิเคราะห์ภายใน 15 นาที** |\n| **Heparin มากเกินไป** | **เจือจาง PO2, PCO2 และ HCO3 แต่ไม่เปลี่ยน pH** — ใช้ **0.05 มล. ต่อเลือด 1 มล.** และเก็บเลือดอย่างน้อย 2 มล. |\n| เลือดดำปน | PaO2 ต่ำผิดปกติโดยที่อาการผู้ป่วยไม่เข้ากัน |\n\n### ค่าปกติ — และเทียบกับเลือดดำ\n| | Arterial | Venous |\n|---|---|---|\n| pH | **7.35–7.45** | 7.32–7.42 |\n| PaO2 | **85–100 mmHg** | 35–45 mmHg |\n| PaCO2 | **35–45 mmHg** | 40–50 mmHg |\n| O2 saturation | **97–100%** | 70–75% |\n\nค่าอื่นที่เครื่องรายงาน: **HCO3** (คำนวณจาก pH และ PCO2), **base excess**, **%COHb** และ **%MetHb** ซึ่งมีประโยชน์มากเมื่อสงสัยพิษจากคาร์บอนมอนอกไซด์หรือ methemoglobinemia\n", "pearls": ["Allen's test: สีกลับมาภายใน 6 วินาที = ปกติ · 10 วินาทีขึ้นไป = ผิดปกติ", "ฟองอากาศทำให้ PaO2 สูงเทียมและ PaCO2 ต่ำเทียม", "Heparin มากเกินไปเจือจาง PO2/PCO2/HCO3 แต่ไม่เปลี่ยน pH", "ส่งตรวจภายใน 15 นาที หรือแช่น้ำแข็ง มิฉะนั้น PaO2 ต่ำเทียม"], "nl": ["B6.3(2)", "3.3.17"], "items": [{"id": "CHEST-26-01-Q1", "kind": "own", "stem": "An arterial blood gas is drawn from a patient breathing room air. The sample sits at room temperature for 45 minutes before analysis and a visible air bubble was not expelled from the syringe. Compared with the patient's true values, which of the following patterns is most likely to be reported?", "choices": ["PaO2 that may be falsely high from the air bubble and falsely low from delayed analysis, with a falsely low PaCO2", "Falsely low PaO2 and falsely high PaCO2 from both errors acting in the same direction", "No significant change in any value because blood gas values are stable for up to 2 hours", "A falsely low pH with unchanged PaO2 and PaCO2", "Falsely high PaO2 and falsely high PaCO2"], "answer": 0, "explain": "**ฟองอากาศ** มี PO2 ราว 150 mmHg และ PCO2 เกือบเป็นศูนย์ ก๊าซจึงแลกเปลี่ยนกับเลือดจนได้ **PaO2 สูงเทียมและ PaCO2 ต่ำเทียม** (สไลด์ระบุว่าฟองอากาศเกิน 1–2% ของปริมาตรเลือดก็มีผลแล้ว)\n\n**การทิ้งตัวอย่างไว้ที่อุณหภูมิห้อง** ทำให้เม็ดเลือดขาวและเกล็ดเลือดยังใช้ออกซิเจนต่อ (leukocyte oxygen consumption) → **PaO2 ต่ำเทียม** และ PaCO2 สูงขึ้นเล็กน้อย จึงหักล้างกับผลของฟองอากาศบางส่วน ทำให้ค่าที่ได้ **แปลผลไม่ได้เลย** — ทางแก้คือไล่ฟองออกเบา ๆ โดยไม่เขย่า แช่น้ำแข็ง และวิเคราะห์ภายใน 15 นาที\n\n**ทำไมข้ออื่นผิด**\n- ข้อที่บอกว่าทั้งสองปัจจัยไปทางเดียวกันไม่ถูก เพราะฟองอากาศดัน PaO2 ขึ้น ส่วนการตั้งทิ้งไว้ดึง PaO2 ลง\n- ฟองอากาศทำให้ PaCO2 **ต่ำ** ไม่ใช่สูง\n- ค่าก๊าซในเลือดไม่คงที่ 2 ชั่วโมง — เปลี่ยนได้ชัดเจนภายในไม่กี่สิบนาทีถ้าไม่แช่เย็น\n- pH เปลี่ยนตาม PaCO2 ที่เปลี่ยน ไม่ได้เปลี่ยนเดี่ยว ๆ โดยที่ก๊าซคงเดิม", "pearl": "ตัวอย่าง ABG ที่มีฟองอากาศและตั้งทิ้งไว้นาน = แปลผลไม่ได้ ต้องเจาะใหม่ อย่าฝืนอธิบายค่าที่ได้", "topic": "การเก็บตัวอย่างและข้อผิดพลาดที่ทำให้แปลผลผิด", "src": "", "ref": [], "nl": ["B6.3(2)"]}]}, {"id": "chest-26-02", "title": "ประเมิน oxygenation — PaO2, SaO2 และ dissociation curve", "minutes": 8, "summary": "คู่ตัวเลขที่ต้องจำ 99/100 · 90/60 · 75/40 · 50/27 และการเลื่อนของกราฟ", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### สิ่งที่กำหนดการส่งออกซิเจนไปเลี้ยงเนื้อเยื่อ\n**PaO2 · Hb · SaO2 · (A–a)DO2 · CaO2 (ปริมาณออกซิเจนในเลือดแดง) · cardiac output** — จำไว้ว่า **PaO2 เป็นเพียงส่วนที่ละลายในเลือด** ส่วนออกซิเจนเกือบทั้งหมดอยู่บนฮีโมโกลบิน ดังนั้น **ผู้ป่วยซีดมาก ๆ อาจมี PaO2 และ SaO2 ปกติ แต่เนื้อเยื่อยังขาดออกซิเจน**\n\n**Hypoxemia** = PaO2 ในเลือดแดงต่ำกว่าปกติ · **Hypoxia** = ออกซิเจนไปเลี้ยงเนื้อเยื่อไม่พอต่อความต้องการ — สองคำนี้ไม่เหมือนกัน\n\n### ระดับความรุนแรง\n- **Hypoxemia: PaO2 < 80 mmHg** · **hyperoxemia > 120 mmHg**\n- **Mild 60–80 · Moderate 40–60 · Severe < 40 mmHg**\n\n### ค่าที่ควรเป็นในผู้ป่วยแต่ละแบบ (predicted PaO2)\n- ทารกแรกเกิด **40–60 mmHg**\n- อายุมากกว่า 60 ปี: **PaO2 ≈ 100 − (0.25 × อายุ)**\n- ท่านั่ง: **104.2 − (0.27 × อายุ)** · ท่านอน: **103.5 − (0.42 × อายุ)**\n- เมื่อได้ออกซิเจนเสริม: **PaO2 ที่ควรได้ ≈ 500 (ถึง 600) × FiO2**\n- **nasal cannula: FiO2 เพิ่มขึ้นราว 0.04 ต่อออกซิเจน 1 ลิตร/นาที** (เริ่มจาก 0.21)\n\n> ตัวอย่าง — ผู้ป่วยได้ออกซิเจน 3 LPM ทาง cannula (FiO2 ≈ 0.33) แต่ PaO2 ได้เพียง 70 mmHg ทั้งที่ควรได้ราว 165 mmHg แปลว่า **การแลกเปลี่ยนก๊าซผิดปกติชัดเจน** แม้ค่าจะยัง “ปกติ” เมื่อดูลอย ๆ\n\n### Oxygen dissociation curve\nรูปตัว S เพราะ Hb จับออกซิเจนแบบ cooperative — **คู่ตัวเลขที่ต้องจำ**\n\n| SaO2 | PaO2 |\n|---|---|\n| **99%** | **100 mmHg** |\n| **90%** | **60 mmHg** |\n| **75%** | **40 mmHg** (ค่าของเลือดดำผสม) |\n| **50%** | **27 mmHg** (คือค่า P50) |\n\n**จุดหักของกราฟอยู่ที่ PaO2 ≈ 60 mmHg** — ต่ำกว่านี้ SaO2 จะตกลงอย่างรวดเร็ว นี่คือเหตุผลที่ใช้ **SpO2 90% เป็นเส้นแบ่งในการให้ออกซิเจน**\n\n| | **เลื่อนไปทางขวา** (affinity ลด ปล่อย O2 ให้เนื้อเยื่อง่ายขึ้น) | **เลื่อนไปทางซ้าย** (affinity เพิ่ม ปล่อย O2 น้อยลง) |\n|---|---|---|\n| พบเมื่อ | **pH ต่ำ · CO2 สูง · อุณหภูมิสูง · 2,3-DPG สูง** | **pH สูง · CO2 ต่ำ · อุณหภูมิต่ำ · 2,3-DPG ต่ำ · fetal Hb · COHb · methemoglobin** |\n| ผลตามตัวเลข | ที่ SaO2 75% ต้องใช้ PaO2 เพิ่มจาก 40 เป็น **55** mmHg · ที่ PaO2 60 mmHg SaO2 ลดจาก 85 เหลือ **80%** | ที่ SaO2 75% ใช้ PaO2 เพียง **35** mmHg · ที่ PaO2 60 mmHg SaO2 เพิ่มจาก 85 เป็น **90%** |\n\n### ข้อจำกัดของ pulse oximetry ที่ต้องรู้\n- **อ่านค่าผิดสูงในพิษคาร์บอนมอนอกไซด์** เพราะ COHb ดูดกลืนแสงคล้าย oxyHb — **SpO2 อาจ 98% ทั้งที่ผู้ป่วยขาดออกซิเจนรุนแรง** ต้องวัด **%COHb ด้วย co-oximeter**\n- **Methemoglobinemia** ทำให้ SpO2 ค้างอยู่ราว **85%** ไม่ว่าจะให้ออกซิเจนเท่าไร และเลือดมีสีช็อกโกแลต\n- อ่านผิดได้เมื่อ **ปลายมือเย็น ความดันต่ำ ชีพจรเบา ยาหดหลอดเลือด ยาทาเล็บเข้ม ผิวคล้ำมาก และการเคลื่อนไหว**\n- **SpO2 ไม่บอก PaCO2 เลย** — ผู้ป่วยคาร์บอนไดออกไซด์คั่งรุนแรงยังมี SpO2 ปกติได้ถ้าได้ออกซิเจนอยู่\n", "pearls": ["จำคู่ตัวเลข 90/60 และ 75/40 — จุดหักของกราฟอยู่ที่ PaO2 60 mmHg", "กราฟเลื่อนขวาเมื่อ กรด ร้อน CO2 สูง 2,3-DPG สูง (ปล่อยออกซิเจนง่ายขึ้น)", "SpO2 ปกติในพิษ CO เป็นค่าหลอก ต้องวัด COHb", "SpO2 ไม่บอกอะไรเกี่ยวกับ PaCO2"], "nl": ["B6.1.2(5)", "B6.3(2)"], "items": [{"id": "CH-MCQ-13", "kind": "mcq", "stem": "Which set of conditions shifts the oxyhaemoglobin dissociation curve to the RIGHT, favouring oxygen release to the tissues?", "choices": ["Decreased temperature, decreased PaCO2, alkalosis and decreased 2,3-diphosphoglycerate", "Increased temperature, increased PaCO2, acidosis and increased 2,3-diphosphoglycerate", "Methaemoglobinaemia with decreased 2,3-diphosphoglycerate", "Increased carbon monoxide binding and presence of fetal haemoglobin", "Alkalosis with hypothermia and stored transfused blood"], "answer": 1, "explain": "**หลักคิดที่จำง่ายที่สุด: กล้ามเนื้อที่กำลังทำงานหนักต้องการออกซิเจน — สภาพแวดล้อมของมันคือ \"ร้อน เป็นกรด CO2 สูง\" → เส้นโค้งเลื่อนขวาเพื่อปล่อยออกซิเจนให้เนื้อเยื่อ**\n\n**เลื่อนขวา (ปล่อย O2 ง่ายขึ้น, P50 สูงขึ้น, affinity ลดลง)** = **\"CADET, face Right\"**\n- **C**O2 สูง\n- **A**cid (pH ต่ำ) — **Bohr effect**\n- **2,3-D**PG สูง (พบใน **ภาวะซีดเรื้อรัง, ที่สูง, โรคปอดเรื้อรัง, hyperthyroidism** — เป็นการปรับตัว)\n- **E**xercise\n- **T**emperature สูง\n\n**เลื่อนซ้าย (ยึด O2 ไว้แน่น ปล่อยยาก)**: ด่าง, CO2 ต่ำ, อุณหภูมิต่ำ, 2,3-DPG ต่ำ (**เลือดที่เก็บในธนาคารเลือดนาน**), **fetal haemoglobin (HbF)** ซึ่งจับ 2,3-DPG ได้ไม่ดีจึงดึงออกซิเจนจากแม่ได้, **carboxyhaemoglobin** และ **methaemoglobin**\n\n**ความสำคัญทางคลินิกของ CO poisoning (ออกสอบบ่อย)**: CO ไม่เพียงแย่งจับฮีโมโกลบิน (affinity สูงกว่า O2 ~240 เท่า) แต่ยัง **เลื่อนเส้นโค้งไปทางซ้าย** ทำให้ออกซิเจนที่เหลืออยู่ก็ปล่อยให้เนื้อเยื่อได้ยากขึ้นอีก → เนื้อเยื่อขาดออกซิเจนรุนแรง\n**ที่สำคัญ: PaO2 และ pulse oximetry จะดู \"ปกติ\" อย่างหลอกลวง** เพราะ pulse oximeter แยก oxyhaemoglobin จาก carboxyhaemoglobin ไม่ได้ → ต้องวัด **carboxyhaemoglobin ด้วย co-oximetry** และรักษาด้วย **ออกซิเจน 100% (± hyperbaric)**\n\nทำไมข้ออื่นผิด: ทุกข้อที่เหลือเป็นเงื่อนไขที่ทำให้เส้นโค้ง **เลื่อนซ้าย** (ยึดออกซิเจนไว้) ซึ่งตรงข้ามกับที่คำถามต้องการ", "pearl": "**Methaemoglobinaemia** (จาก dapsone, ยาชาเฉพาะที่, nitrate): ผู้ป่วยเขียวคล้ำแต่ **PaO2 ปกติ** และ **pulse oximeter ค้างอยู่ราว 85% ไม่ว่าจะให้ออกซิเจนเท่าไร**; เลือดสีน้ำตาลช็อกโกแลต รักษาด้วย **methylene blue**", "topic": "Oxyhaemoglobin dissociation curve", "src": "", "ref": ["MED30 สรุป Chest – oxygen therapy, hypoxemia", "MED29 SAQ – แปลผล ABG ต้องเขียนทั้ง Oxygenation, Ventilation และ acid-base", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 44 – คำนวณ ABG พร้อม O2 saturation 80%"], "nl": ["B6.1.2(5)", "B6.1.2(4)"]}, {"id": "CH-MCQ-16", "kind": "mcq", "stem": "A 45-year-old man is rescued from a house fire. He is confused with a headache and nausea. SpO2 by pulse oximetry reads 99 percent on room air and arterial PaO2 is 96 mmHg. Which statement best explains the discrepancy between his clinical state and the oxygen readings?", "choices": ["Carbon monoxide lowers PaO2 markedly, so the blood gas must be repeated", "The confusion is unrelated to the fire and requires urgent brain imaging first", "Pulse oximetry cannot distinguish carboxyhaemoglobin from oxyhaemoglobin, so co-oximetry is needed", "A normal PaO2 excludes significant tissue hypoxia in all circumstances", "The pulse oximeter is faulty and should be replaced"], "answer": 2, "explain": "**กลไกของ carbon monoxide poisoning และเหตุที่ตัวเลขหลอก**\n- CO จับฮีโมโกลบินด้วย **affinity สูงกว่าออกซิเจนราว 200-250 เท่า** เกิด **carboxyhaemoglobin (COHb)** → **ปริมาณออกซิเจนที่เลือดขนส่งได้ (oxygen content) ลดลงอย่างมาก**\n- **แต่ PaO2 คือ \"ออกซิเจนที่ละลายในพลาสมา\" ซึ่ง CO ไม่กระทบ** → **PaO2 ปกติ** แม้ผู้ป่วยจะขาดออกซิเจนรุนแรง\n- **Pulse oximeter ใช้แสง 2 ความยาวคลื่น** และ **COHb ดูดกลืนแสงคล้าย oxyhaemoglobin มาก** → เครื่อง **อ่านค่าสูงเกินจริง** (อาจอ่าน 99% ทั้งที่ COHb สูง)\n- CO ยัง **เลื่อน oxyhaemoglobin dissociation curve ไปทางซ้าย** และ **จับกับ cytochrome c oxidase** รบกวนการหายใจระดับเซลล์ → ซ้ำเติมอีกสองทาง\n\n**การวินิจฉัย: ต้องวัด carboxyhaemoglobin ด้วย co-oximetry** (เจาะเลือดแดงหรือดำก็ได้) — ไม่ใช่ pulse oximeter ธรรมดา\n\n**การรักษา**: **ออกซิเจน 100% ทาง non-rebreathing mask ทันที** (ลด half-life ของ COHb จาก ~4-5 ชั่วโมงในอากาศห้อง เหลือ ~60-90 นาที) และพิจารณา **hyperbaric oxygen** (ลดเหลือ ~20-30 นาที) เมื่อมี **หมดสติ, อาการทางระบบประสาท, ischaemia ของหัวใจ, COHb > 25% หรือหญิงตั้งครรภ์ที่ COHb > 15-20%**\n\n**ในผู้ป่วยไฟไหม้ต้องคิดถึงอีก 2 อย่างพร้อมกัน**: **cyanide poisoning** (จากการเผาไหม้พลาสติก/โฟม — ให้สงสัยเมื่อมี lactate สูงมากและ acidosis รุนแรงที่ไม่อธิบายด้วย CO) และ **inhalation injury ของทางเดินหายใจ** (เขม่าในจมูกปาก ขนจมูกไหม้ เสียงแหบ stridor → **ต้องใส่ท่อช่วยหายใจก่อนที่ทางเดินหายใจจะบวมจนใส่ไม่ได้**)\n\nทำไมข้ออื่นผิด: เครื่องไม่ได้เสีย แต่เป็นข้อจำกัดของเทคโนโลยี; PaO2 ปกติ **ไม่ได้** ตัดภาวะขาดออกซิเจนของเนื้อเยื่อ (เช่นเดียวกับในภาวะซีดรุนแรงและ methaemoglobinaemia); การสั่งภาพสมองก่อนโดยไม่ให้ออกซิเจนคือการเสียเวลาที่อันตราย", "pearl": "สถานการณ์อื่นที่ **pulse oximetry เชื่อไม่ได้**: **methaemoglobinaemia (ค้างราว 85%)**, ภาวะซีดรุนแรง, ปลายมือเย็น/perfusion ต่ำ, ยาสีเล็บเข้ม, การเคลื่อนไหวมาก, บิลิรูบินสูงมาก และสีย้อมทางหลอดเลือดดำ", "topic": "Limits of pulse oximetry", "src": "", "ref": ["MED30 สรุป Chest – oxygen therapy / hypoxemia", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 44 – ABG พร้อม O2 saturation", "MED31 OSCE – ให้ blood gas วิเคราะห์และบอกโรคที่ทำให้เกิด hypoxemia 2 อย่าง"], "nl": ["B6.1.2(5)", "2.1.37"]}]}, {"id": "chest-26-03", "title": "A–a gradient และกลไกของภาวะพร่องออกซิเจน", "minutes": 9, "summary": "สมการที่ต้องคำนวณได้ และตารางที่แยกกลไกได้ทั้งห้าแบบ", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### สมการที่ต้องใช้เป็น\n**PAO2 = FiO2 × (PB − PH2O) − PaCO2 / R**\nโดย PB = 760 mmHg, PH2O = 47 mmHg (จึงเหลือ **713**) และ **R (respiratory quotient) = 0.8**\n\nที่ระดับน้ำทะเล หายใจอากาศห้อง PaCO2 40:\n**PAO2 = 0.21 × 713 − 40/0.8 = 149.7 − 50 ≈ 100 mmHg**\n\n**A–a gradient = PAO2 − PaO2**\n- ค่าปกติ **ราว 15 mmHg ที่อายุ 30 ปี และเพิ่มขึ้นราว 3 mmHg ทุก 10 ปี**\n- สูตรลัดที่ใช้บ่อย: **ค่าปกติ ≈ (อายุ/4) + 4**\n- เมื่อ **FiO2 > 0.6** ให้ใช้ **PAO2 = 713 × FiO2 − PaCO2** (ไม่ต้องหารด้วย R)\n\n> **ประโยชน์ของ A–a gradient คือแยก “ปอดเสีย” ออกจาก “ปอดดีแต่หายใจน้อย”** — ผู้ป่วยที่ได้ยากดการหายใจจะมี **PaCO2 สูงแต่ A–a gradient ปกติ** ส่วนผู้ป่วยปอดบวมหรือลิ่มเลือดอุดกั้นปอดจะมี **A–a gradient กว้าง**\n\n### กลไกของภาวะพร่องออกซิเจน 5 แบบ\n\n| กลไก | A–a gradient | ตอบสนองต่อออกซิเจน | ตัวอย่าง |\n|---|---|---|---|\n| **Alveolar hypoventilation** | **ปกติ** | **ดีมาก** | ยากดการหายใจ (opioid, benzodiazepine), โรคระบบประสาทและกล้ามเนื้อ, obesity hypoventilation |\n| **V/Q mismatch** (พบบ่อยที่สุด) | **กว้าง** | **ดีมาก** | COPD, หืด, ปอดบวม, **ลิ่มเลือดอุดกั้นปอด**, ปอดแฟบบางส่วน |\n| **Right-to-left shunt** | **กว้าง** | **ดีขึ้นน้อยมาก** | ถุงลมเต็มไปด้วยของเหลว (ARDS, ปอดบวมรุนแรง, ปอดบวมน้ำ), atelectasis ทั้งกลีบ, โรคหัวใจพิการแต่กำเนิด, AVM |\n| **Diffusion defect** | **กว้าง** | **ดี** | โรคเนื้อปอดอักเสบเป็นพังผืด (ILD), ถุงลมโป่งพอง, **PJP** |\n| **High altitude / FiO2 ต่ำ** | **ปกติ** | **ดี** | ที่สูง, ก๊าซเฉื่อยแทนที่ออกซิเจน |\n\n**นิยามที่ต้องแม่น**\n- **True shunt: มีเลือดไหลผ่าน (Q ปกติ) แต่ไม่มีการระบายอากาศเลย (VA = 0) → V/Q = 0** — ให้ออกซิเจน 100% แล้ว PaO2 ก็ขึ้นน้อยมาก เพราะเลือดส่วนที่ shunt ไม่เคยสัมผัสออกซิเจนเลย\n- **Dead space: มีการระบายอากาศปกติแต่ไม่มีเลือดมาเลย (Q = 0) → V/Q = ∞** — เช่นลิ่มเลือดอุดกั้นปอด\n- **V/Q mismatch คือส่วนผสมของทั้งสองขั้วในสัดส่วนต่าง ๆ กัน** จึงยังตอบสนองต่อออกซิเจนได้ดี\n\n**การทดสอบด้วยออกซิเจน 100%** ใช้แยก shunt ออกจาก V/Q mismatch ได้ — ถ้าให้ออกซิเจนเต็มที่แล้ว PaO2 ยังต่ำอยู่มาก แปลว่าเป็น **shunt จริง** ซึ่งการเพิ่ม FiO2 ต่อไปไม่ช่วย ต้อง **เปิดถุงลมที่ปิดอยู่ (PEEP/recruitment) หรือแก้สาเหตุ**\n", "pearls": ["PAO2 = 713 × FiO2 − PaCO2/0.8 · ค่าปกติของ A–a gradient ≈ อายุ/4 + 4", "Hypoventilation และที่สูง = A–a ปกติ · กลไกอื่นทั้งหมด = A–a กว้าง", "Shunt คือกลไกเดียวที่ให้ออกซิเจนแล้วแทบไม่ดีขึ้น — ต้องใช้ PEEP หรือแก้ที่ต้นเหตุ", "ลิ่มเลือดอุดกั้นปอดทำให้เกิด dead space แต่ผลทางคลินิกออกมาเป็น V/Q mismatch และ A–a กว้าง"], "nl": ["B6.2.5(1)", "B6.3(2)"], "items": [{"id": "CH-MCQ-09", "kind": "mcq", "stem": "A 70-year-old man breathing room air has an arterial blood gas showing pH 7.36, PaCO2 40 mmHg and PaO2 60 mmHg. Assume the respiratory quotient is 0.8. What is his alveolar-arterial oxygen gradient, and what does it indicate?", "choices": ["Approximately 40 mmHg; normal for his age, indicating hypoventilation", "Approximately 10 mmHg; widened, indicating a shunt", "Approximately 10 mmHg; normal, indicating hypoventilation", "Cannot be calculated without knowing the inspired oxygen fraction", "Approximately 40 mmHg; widened, indicating intrinsic lung disease"], "answer": 4, "explain": "**สูตร**\n- **PAO2 = FiO2 × (Patm − PH2O) − PaCO2/R** = 0.21 × (760 − 47) − 40/0.8 = **150 − 50 = 100 mmHg**\n- **A-a gradient = PAO2 − PaO2 = 100 − 60 = 40 mmHg**\n- **ค่าปกติที่คาดตามอายุ ≈ (อายุ/4) + 4 = (70/4) + 4 ≈ 21.5 mmHg**\n→ **40 mmHg กว้างกว่าปกติชัดเจน = มีพยาธิสภาพของเนื้อปอดเอง**\n\n**ทำไม A-a gradient จึงเป็นเครื่องมือที่ทรงพลัง**: มันแยก **ปัญหาที่ \"การระบายอากาศ\"** ออกจาก **ปัญหาที่ \"การแลกเปลี่ยนก๊าซ\"** ได้ทันที\n\n| | **A-a gradient ปกติ** | **A-a gradient กว้าง** |\n|---|---|---|\n| กลไก | ปอดปกติ แต่ระบายอากาศไม่พอ | เนื้อปอดผิดปกติ |\n| ตัวอย่าง | **hypoventilation** (opioid, กล้ามเนื้ออ่อนแรง, CNS depression, obesity hypoventilation), **FiO2 ต่ำ/ที่สูง** | **V/Q mismatch, shunt, diffusion impairment** — pneumonia, ARDS, PE, pulmonary oedema, ILD, COPD |\n\n**ขั้นถัดไปหลังพบว่ากว้าง**: ให้ **ออกซิเจน 100%** แล้วดูการตอบสนอง — **ดีขึ้น = V/Q mismatch; ไม่ดีขึ้น = shunt** (เพราะเลือดที่ผ่าน shunt ไม่ได้สัมผัสก๊าซเลย)\n\nทำไมข้ออื่นผิด\n- \"40 mmHg ปกติตามอายุ\": ค่าปกติของอายุ 70 คือราว 21 ไม่ใช่ 40\n- \"10 mmHg\": คำนวณผิด (น่าจะเผลอเอา PaCO2 ลบตรงๆ)\n- \"คำนวณไม่ได้\": โจทย์ระบุว่าหายใจอากาศห้อง = FiO2 0.21", "pearl": "**ถ้า PaCO2 สูงและ A-a gradient ปกติ → ปัญหาอยู่นอกปอด (การหายใจ)** ให้มองหา CNS depression, ยา, กล้ามเนื้ออ่อนแรง, ผนังทรวงอกผิดรูป; **ถ้า PaCO2 สูงแต่ A-a gradient กว้างด้วย → โรคปอดเอง** เช่น COPD ที่รุนแรง", "topic": "Calculating and interpreting the alveolar-arterial oxygen gradient", "src": "", "ref": ["MED29 SAQ – สูตร ((150) − PaCO2/0.8) − PaO2; แปลผล ABG ต้องเขียนทั้ง Oxygenation, Ventilation และ acid-base", "MED33 MCQ ข้อ 97 – Increase a-a gradient, severe shunt that causes hypoxemia → ARDS", "MED30 MCQ ข้อ 82 – A-a gradient เหมือนจะให้ O2 แล้วดีขึ้น ถามสาเหตุของ hypoxemia", "MED31 OSCE – ให้ blood gas ผู้ป่วยวิเคราะห์ และบอกว่าโรคอะไรทำให้เกิด hypoxemia 2 อย่าง"], "nl": ["B6.1.2(4)", "B6.3(2)", "3.3.17"]}, {"id": "CH-OLD-17", "kind": "old", "stem": "Which statement correctly describes a physiological shunt?", "choices": ["A right-to-left communication at the level of the great vessels only", "Alveolar units with both high ventilation and high perfusion", "An area of lung with reduced diffusion capacity but normal ventilation and perfusion", "Alveolar units that are ventilated but not perfused, causing an increase in dead space", "Alveolar units that are perfused but not ventilated, causing hypoxaemia that does not correct with supplemental oxygen"], "answer": 4, "explain": "**Shunt = perfusion โดยไม่มี ventilation (V/Q = 0)** เช่น **atelectasis, pneumonia ที่ alveoli เต็มไปด้วยหนอง, pulmonary edema, ARDS**\nจุดสำคัญที่ออกสอบ: **shunt ไม่ตอบสนองต่อการให้ออกซิเจน** เพราะเลือดที่ผ่านบริเวณนั้นไม่ได้สัมผัสก๊าซเลย\n\nตรงข้ามคือ **dead space = ventilation โดยไม่มี perfusion (V/Q = ∞)** เช่น **pulmonary embolism, emphysema** — ทำให้ CO2 คั่งเป็นหลัก\n\n**สาเหตุของ hypoxaemia 5 อย่างที่ต้องจำ**: (1) V/Q mismatch (พบบ่อยที่สุด, ให้ O2 แล้วดีขึ้น) (2) shunt (ให้ O2 ไม่ดีขึ้น) (3) hypoventilation (**A-a gradient ปกติ**) (4) diffusion impairment (5) low inspired FiO2/ที่สูง\n→ **ถ้าให้ออกซิเจนแล้วดีขึ้น = V/Q mismatch; ถ้าไม่ดีขึ้น = shunt**", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 10 – Physiologic shunt: area with perfusion but no ventilation (V=0); MED34 FA MCQ (RS ข้อ 1) – Physiologic shunt: High ventilation, Low perfusion; MED30 MCQ ข้อ 82 – A-a gradient ให้ O2 แล้วดีขึ้น ถามสาเหตุ hypoxemia", "ref": [], "nl": ["B6.1.2(4)", "B6.1.2(2)"]}, {"id": "CH-OLD-20", "kind": "old", "stem": "Which of the following causes hypoxaemia with a NORMAL alveolar-arterial oxygen gradient?", "choices": ["Hypoventilation from an opioid overdose", "Acute respiratory distress syndrome", "Interstitial lung disease", "Pulmonary embolism", "Pneumonia with lobar consolidation"], "answer": 0, "explain": "**A-a gradient = PAO2 − PaO2** โดย **PAO2 = FiO2 × (Patm − PH2O) − PaCO2/R** ≈ **150 − PaCO2/0.8** เมื่อหายใจอากาศห้องที่ระดับน้ำทะเล\nค่าปกติ ≈ **(อายุ/4) + 4** mmHg\n\n**Hypoventilation ล้วน** (opioid/benzodiazepine overdose, กล้ามเนื้ออ่อนแรง, CNS depression, obesity hypoventilation) ทำให้ **PaCO2 สูง → PAO2 ลดลงตามสมการ → PaO2 ลดลงตามกัน** แต่ **ความแตกต่างระหว่างถุงลมกับเลือดยังปกติ** เพราะเนื้อปอดปกติดี\n→ ให้ออกซิเจนแล้วดีขึ้นทันที แต่ **การรักษาที่แท้จริงคือแก้การหายใจ (naloxone, ventilation)** ไม่ใช่ให้ออกซิเจนอย่างเดียว\n\nส่วนสาเหตุอื่นทุกข้อเป็นความผิดปกติของเนื้อปอดเอง → **A-a gradient กว้าง**", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 45 และ 68 – อะไรทำให้เกิด hypercapnia / Hypercapnia; MED30 SAQ – Hypoventilation vs Hyperventilation syndrome; MED29 SAQ – สูตร ((150) − PaCO2/0.8) − PaO2", "ref": [], "nl": ["B6.1.2(4)", "B6.2.5(1)"]}, {"id": "CH-OLD-18", "kind": "old", "stem": "A patient has severe hypoxaemia with a markedly increased alveolar-arterial oxygen gradient that does not improve despite a high fraction of inspired oxygen. Bilateral infiltrates are present on chest radiograph and there is no evidence of cardiac failure. Which condition best explains this?", "choices": ["High altitude exposure", "Neuromuscular weakness causing hypoventilation", "Acute respiratory distress syndrome", "Opioid overdose causing hypoventilation", "Pure carbon monoxide poisoning"], "answer": 2, "explain": "**ARDS = shunt รุนแรง** จาก alveoli ที่เต็มไปด้วยของเหลวและ atelectasis → **A-a gradient กว้างมากและ refractory ต่อการให้ออกซิเจน**\n\nเกณฑ์ (Berlin definition): เกิดภายใน **1 สัปดาห์** หลังมีปัจจัยกระตุ้น, **bilateral opacity** ที่อธิบายด้วย effusion/atelectasis/nodule ไม่ได้, **ไม่ได้เกิดจาก cardiac failure/fluid overload** (ประเมินด้วย echo), และแบ่งความรุนแรงตาม **PaO2/FiO2**: mild 200-300, moderate 100-200, severe <100\n\nการรักษาที่ลด mortality: **low tidal volume ventilation 4-6 mL/kg predicted body weight ร่วมกับ plateau pressure ≤30 cmH2O**, PEEP ที่เหมาะสม, **prone position ใน severe ARDS**, conservative fluid strategy และรักษาสาเหตุ\n\nแยกจาก **hypoventilation (opioid, neuromuscular)** ซึ่ง **A-a gradient ปกติ** และ **ที่สูง/FiO2 ต่ำ** ซึ่ง A-a gradient ก็ปกติเช่นกัน", "pearl": "", "topic": "", "src": "MED33 MCQ ข้อ 97 – Increase a-a gradient, severe shunt that causes hypoxemia → ARDS; MED31 MCQ ข้อ 70 – ARDS treat ด้วยอะไร → NIV/positive pressure ventilation", "ref": [], "nl": ["B6.1.2(4)", "B6.2.5(1)"]}, {"id": "CH-OLD-22", "kind": "old", "stem": "A 36-year-old woman with HIV infection presents with 2 weeks of progressive exertional dyspnoea, low-grade fever and dry cough. Examination: BT 38 C, PR 130/min, RR 30/min, mild pallor, oral hairy leukoplakia, normal breath sounds with no adventitious sounds. ABG on room air: pH 7.45, PaO2 55 mmHg, PaCO2 30 mmHg, O2 saturation 80 percent. Apart from oxygen therapy, which treatment is most appropriate?", "choices": ["Ceftriaxone plus ciprofloxacin", "Furosemide with fluid restriction", "Broad-spectrum antifungal therapy", "Cotrimoxazole plus systemic corticosteroid", "Anti-tuberculous drugs"], "answer": 3, "explain": "ภาพคือ **PCP ที่รุนแรง**: ผู้ป่วย HIV (oral hairy leukoplakia บ่งภูมิคุ้มกันต่ำ), ไอแห้ง เหนื่อยเพิ่มขึ้นเป็นสัปดาห์, **ฟังปอดปกติแต่ hypoxaemia รุนแรง** (PaO2 55) ซึ่งเป็นลักษณะที่ \"อาการกับการตรวจร่างกายไม่เข้ากัน\"\n\nABG: **respiratory alkalosis ร่วมกับ hypoxaemia และ A-a gradient กว้าง** = 150 − 30/0.8 − 55 ≈ **57 mmHg** (กว้างมาก)\n\nการรักษา: **cotrimoxazole (TMP-SMX) ขนาดสูง 21 วัน** และ **เพิ่ม corticosteroid เมื่อ PaO2 < 70 mmHg (หรือ A-a gradient > 35)** เพราะลดอัตราการเกิด respiratory failure และ mortality; ตามด้วย **secondary prophylaxis จนกว่า CD4 > 200 นานกว่า 3 เดือน** และเริ่ม ART", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D – ผู้ป่วยหญิง 36 ปี เหนื่อยง่ายขึ้น 2 สัปดาห์ oral hairy leukoplakia positive, ABG pH 7.45 PO2 55 PCO2 30 → Cotrimoxazole, prednisolone", "ref": [], "nl": ["2.3.10(5)", "2.3.3-3(5)", "B6.1.2(4)"]}]}, {"id": "chest-26-04", "title": "Ventilation และภาวะหายใจล้มเหลว", "minutes": 7, "summary": "PaCO2 บอกอะไร · type 1 กับ type 2 ต่างกันอย่างไร · และเป้าหมายออกซิเจน", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### PaCO2 คือกระจกสะท้อน alveolar ventilation\n**PaCO2 = k × (การผลิต CO2) ÷ alveolar ventilation** โดย k = 0.863 และ\n**alveolar ventilation = (Vt × RR) − (Vd × RR)** = minute ventilation − dead space ventilation\n\n- **PaCO2 35–45 = ปกติ · < 35 = hyperventilation · > 45 = hypoventilation**\n- PaCO2 สูงขึ้นได้จาก **หายใจน้อยลง (Vt หรือ RR ลด) · dead space เพิ่ม · หรือผลิต CO2 มากขึ้น** (ไข้ ชัก ให้อาหารคาร์โบไฮเดรตสูง ไทรอยด์เป็นพิษ)\n- ผู้ป่วยที่หายใจเร็วมากแต่ตื้น (Vt เล็ก) จะมี **minute ventilation ดูสูง แต่ alveolar ventilation ต่ำ** และ PaCO2 สูงได้ — **อัตราการหายใจอย่างเดียวจึงบอกความพอเพียงของการหายใจไม่ได้**\n\n### Type 1 กับ type 2 respiratory failure\n| | **Type 1 (hypoxemic)** | **Type 2 (hypercapnic)** |\n|---|---|---|\n| ค่าที่ใช้นิยาม | **PaO2 < 60 mmHg โดย PaCO2 ปกติหรือต่ำ** | **PaCO2 > 45–50 mmHg ร่วมกับ pH ต่ำ** (± PaO2 ต่ำ) |\n| A–a gradient | **กว้าง** | **ปกติ** ถ้าเป็น hypoventilation ล้วน · **กว้าง** ถ้ามีโรคปอดร่วม |\n| กลไก | V/Q mismatch, shunt, diffusion defect | ปั๊มหายใจล้มเหลว — สมองสั่งการน้อยลง, กล้ามเนื้อล้า, ทางเดินหายใจอุดกั้น, dead space เพิ่ม |\n| ตัวอย่าง | ปอดบวม, ปอดบวมน้ำ, ARDS, ลิ่มเลือดอุดกั้นปอด | ยาเกินขนาด, myasthenia/GBS, **COPD กำเริบรุนแรง**, หืดระยะล้า, kyphoscoliosis |\n| การรักษาที่ต่างกัน | ให้ออกซิเจน ± **HFNC** และแก้ที่ต้นเหตุ | **ช่วยการระบายอากาศ — NIV เป็นอันดับแรกใน COPD กำเริบที่มี pH < 7.35** |\n\n### เป้าหมายออกซิเจน\n- ผู้ป่วยทั่วไป **SpO2 94–98%**\n- **ผู้ที่เสี่ยงต่อ CO2 คั่ง (COPD, obesity hypoventilation, โรคระบบประสาทและกล้ามเนื้อ, ผนังทรวงอกผิดรูป) ให้เป้าหมาย SpO2 88–92%**\n  กลไกที่ทำให้ CO2 สูงขึ้นเมื่อให้ออกซิเจนมากเกินไปคือ **การเสียการหดตัวของหลอดเลือดในถุงลมที่ระบายอากาศไม่ดี (V/Q mismatch แย่ลง) และ Haldane effect** ไม่ใช่แค่ “กดศูนย์หายใจ” อย่างที่ท่องกันมา\n- **อย่ากลัวจนไม่ให้ออกซิเจน** — ภาวะพร่องออกซิเจนฆ่าคนเร็วกว่าคาร์บอนไดออกไซด์คั่ง ให้ออกซิเจนพอให้ถึงเป้า แล้วเฝ้าระวังด้วย ABG ซ้ำใน 30–60 นาที\n\n### ตารางสรุปกลไกเมื่อให้ออกซิเจน 100%\n| กลไก | PaCO2 | A–a gradient | PaO2 เมื่อให้ O2 100% |\n|---|---|---|---|\n| Hypoventilation | **สูง** | ปกติ | **ขึ้นชัดเจน** |\n| V/Q mismatch | ปกติหรือแปรผัน | กว้าง | **ขึ้นชัดเจน** |\n| Right-to-left shunt | ปกติหรือต่ำ | กว้าง | **ขึ้นน้อยมาก** |\n", "pearls": ["Type 1 = PaO2 < 60 · Type 2 = PaCO2 > 45–50 พร้อม pH ต่ำ", "COPD กำเริบที่ pH < 7.35 และ PaCO2 สูง ให้ NIV ไม่ใช่เพิ่มออกซิเจนอย่างเดียว", "เป้าหมาย SpO2 88–92% ในผู้เสี่ยง CO2 คั่ง · 94–98% ในคนทั่วไป", "หายใจเร็วแต่ตื้นทำให้ alveolar ventilation ต่ำและ PaCO2 สูงได้"], "nl": ["2.2.9", "B6.2.5(1)", "2.1.34"], "items": [{"id": "CH-MCQ-10", "kind": "mcq", "stem": "Which arterial blood gas result on room air defines type 2 (hypercapnic) respiratory failure?", "choices": ["PaO2 70 mmHg with PaCO2 40 mmHg", "PaO2 55 mmHg with PaCO2 60 mmHg", "PaO2 85 mmHg with PaCO2 48 mmHg", "PaO2 55 mmHg with PaCO2 32 mmHg", "PaO2 95 mmHg with PaCO2 30 mmHg"], "answer": 1, "explain": "**นิยามที่ต้องจำ**\n- **Type 1 (hypoxaemic) respiratory failure**: **PaO2 < 60 mmHg โดยที่ PaCO2 ปกติหรือต่ำ** — ปัญหาอยู่ที่ **การแลกเปลี่ยนออกซิเจน (oxygenation)**\n  สาเหตุ: pneumonia, pulmonary oedema, ARDS, PE, atelectasis, ILD → กลไกคือ **V/Q mismatch และ shunt**\n- **Type 2 (hypercapnic) respiratory failure**: **PaCO2 > 45-50 mmHg** (มักร่วมกับ PaO2 ต่ำ) — ปัญหาอยู่ที่ **การระบายอากาศ (ventilation)**\n  สาเหตุ: **AECOPD, asthma ที่ล้า, obesity hypoventilation, กล้ามเนื้ออ่อนแรง (Guillain-Barré, myasthenia), ยากดการหายใจ, ผนังทรวงอกผิดรูป**\n\nเคสในโจทย์: **PaO2 55 (ต่ำ) ร่วมกับ PaCO2 60 (สูง)** = **type 2**\n\n**ทำไมการแยกจึงเปลี่ยนการรักษา**\n- **Type 1** → แก้ที่ **oxygenation**: ให้ออกซิเจน, **HFNC**, CPAP, PEEP เพื่อ recruit alveoli\n- **Type 2** → ออกซิเจนอย่างเดียว **ไม่พอและอาจเป็นอันตราย**; ต้อง **ช่วยการระบายอากาศด้วย NIV (BiPAP)** เพื่อขับ CO2 และ **คุมเป้า SpO2 88-92%**\n\n**สังเกตว่า \"PaCO2 ปกติ\" ในผู้ป่วยหอบหืดรุนแรงเป็นสัญญาณอันตราย** เพราะผู้ป่วยที่หายใจหอบควรมี CO2 ต่ำ — ถ้ากลับมาปกติหรือสูงแปลว่า **กล้ามเนื้อหายใจกำลังล้า** และกำลังจะเข้าสู่ type 2 failure → **เตรียมใส่ท่อช่วยหายใจ**\n\nทำไมข้ออื่นผิด: ข้อที่ PaO2 55 กับ PaCO2 32 คือ **type 1**; ข้อที่ PaCO2 48 โดย PaO2 ปกติเป็นเพียง hypercapnia เล็กน้อยที่ยังไม่เข้าเกณฑ์ respiratory failure เต็มรูป; อีกสองข้อเป็นค่าปกติหรือ hyperventilation", "pearl": "**Acute-on-chronic**: ผู้ป่วย COPD ที่มี CO2 คั่งเรื้อรังจะมี **HCO3 สูงชดเชยและ pH เกือบปกติ** — สิ่งที่บอกว่า \"เฉียบพลัน\" คือ **pH ที่ตก** ไม่ใช่ระดับ PaCO2", "topic": "Distinguishing type 1 from type 2 respiratory failure", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 OSCE/SAQ ข้อ 7 – COPD ABG pH 7.30 CO2 80 HCO3 38 จงแปลผล", "MED34 FA MCQ (CNS ข้อ 7) – AECOPD low SpO2 despite nasal cannula → NIV vs ET tube vs HFNC", "MED31 MCQ ข้อ 45, 68 – อะไรทำให้เกิด hypercapnia", "MED30 SAQ – Hypoventilation / Good oxygenation"], "nl": ["B6.2.5(1)", "2.2.9", "3.3.17"]}, {"id": "CH-OLD-19", "kind": "old", "stem": "A 45-year-old man is brought to the emergency department confused and drowsy. Arterial blood gas: PaO2 170 mmHg (on supplemental oxygen), PaCO2 56 mmHg, pH 7.28. He has a 15 pack-year smoking history and pulmonary function testing 3 months ago showed severe airway obstruction. What is the most likely cause of his hypercapnic respiratory failure?", "choices": ["Cardiogenic pulmonary oedema", "Acute pneumonia", "Right-to-left intracardiac shunt", "Acute pulmonary embolism", "Chronic obstructive pulmonary disease with excessive oxygen administration"], "answer": 4, "explain": "เบาะแสสำคัญคือ **PaO2 สูงถึง 170 mmHg** ซึ่ง **สูงเกินความจำเป็น** ในผู้ป่วยที่มี severe airway obstruction — บ่งว่าได้รับออกซิเจนมากเกินไป\n\nกลไกที่ O2 มากเกินทำให้ CO2 คั่งใน COPD (3 อย่างร่วมกัน)\n1. **ยกเลิก hypoxic pulmonary vasoconstriction** → เลือดไหลไปยัง alveoli ที่ระบายอากาศแย่ → **V/Q mismatch แย่ลงและ dead space เพิ่ม** (กลไกหลัก)\n2. **Haldane effect** — ฮีโมโกลบินที่อิ่มออกซิเจนปล่อย CO2 ออกมามากขึ้น\n3. ลด hypoxic respiratory drive (บทบาทน้อยที่สุด แม้จะถูกสอนมากที่สุด)\n\n→ **เป้า SpO2 ใน COPD ที่เสี่ยงคั่ง CO2 คือ 88-92%** และเมื่อมี acidosis ต้องใช้ **NIV** ไม่ใช่เพิ่ม O2", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D – A 45 year old man in confused drowsy state, PaO2 170, PaCO2 56, pH 7.28, 15 pack year, severe airway obstruction", "ref": [], "nl": ["3.3.17", "2.2.9", "B6.2.5(1)"]}, {"id": "CH-OLD-14", "kind": "old", "stem": "A patient becomes dyspnoeic 6 hours ago. Arterial blood gas on room air: pH 7.26, PaCO2 60 mmHg, HCO3 26 mEq/L, O2 saturation 80 percent. Which interpretation is correct?", "choices": ["Acute metabolic acidosis without compensation", "Acute metabolic acidosis with respiratory compensation", "Chronic respiratory acidosis with full metabolic compensation", "Chronic metabolic acidosis with respiratory compensation", "Acute respiratory acidosis with minimal metabolic compensation"], "answer": 4, "explain": "**กฎการชดเชยของ respiratory acidosis**\n- **เฉียบพลัน**: PaCO2 ขึ้นทุก 10 mmHg → **HCO3 ขึ้น 1 mEq/L** (จาก buffer ในเซลล์ ทันที)\n- **เรื้อรัง**: PaCO2 ขึ้นทุก 10 mmHg → **HCO3 ขึ้น 3-4 mEq/L** (ไตสร้าง bicarbonate เพิ่ม ใช้เวลา 3-5 วัน)\n\nเคสนี้ PaCO2 ขึ้นจาก 40 → 60 (ขึ้น 20) → ถ้าเฉียบพลัน HCO3 ควรเป็น ~26 (ตรงกับที่วัดได้), ถ้าเรื้อรังควรเป็น ~30-32\n→ **acute respiratory acidosis** ซึ่งสอดคล้องกับประวัติ **6 ชั่วโมง**\n\npH ที่คาดใน acute: PaCO2 ขึ้น 10 → pH ลง 0.08 → 7.40 − 0.16 ≈ **7.24** ✓ (ค่าจริง 7.26)\n\n**ตรวจความสอดคล้อง**: pH = 6.1 + log[26 ÷ (0.03 × 60)] = 6.1 + log 14.4 = **7.26** ✔\n\n**อย่าลืม A-a gradient**: PAO2 = 0.21 × 713 − 60/0.8 = **74.7**; SaO2 80% ≈ PaO2 ~45 → **A-a ≈ 30 ซึ่งกว้าง** แปลว่านอกจาก hypoventilation ยังมีพยาธิสภาพที่เนื้อปอดร่วมด้วย", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 44 – คำนวณ ABG onset 6 hr pH 7.3 paCO2 60 HCO3 26 O2 sat 80%", "ref": [], "nl": ["3.3.17", "B6.2.5(1)", "2.2.9"]}, {"id": "CH-MCQ-14", "kind": "mcq", "stem": "A 72-year-old man with severe COPD is brought to the emergency department with an exacerbation. SpO2 is 84 percent on room air. Which oxygen strategy is most appropriate while awaiting arterial blood gas results?", "choices": ["Withhold all oxygen until the arterial blood gas result is available", "Immediate intubation before any oxygen is given", "High-flow oxygen by non-rebreathing mask targeting SpO2 above 98 percent", "Oxygen only if the patient reports feeling breathless", "Controlled oxygen by nasal cannula or Venturi mask targeting SpO2 88 to 92 percent"], "answer": 4, "explain": "**เป้าหมายคือ \"พอ\" ไม่ใช่ \"มาก\"** — ในผู้ป่วย COPD ที่เสี่ยงคั่ง CO2 ให้ **SpO2 88-92%**\n\n**หลักฐาน**: การทดลองแบบสุ่มในผู้ป่วย AECOPD ก่อนถึงโรงพยาบาล (Austin et al., BMJ 2010) พบว่า **การให้ออกซิเจนแบบควบคุมเป้า 88-92% ลด mortality ลงประมาณครึ่งหนึ่ง** เทียบกับการให้ออกซิเจนแบบ high-flow\n\n**กลไกที่ออกซิเจนมากเกินทำให้ CO2 คั่ง (เรียงตามความสำคัญ)**\n1. **ยกเลิก hypoxic pulmonary vasoconstriction** → เลือดไหลกลับไปยังถุงลมที่ระบายอากาศแย่ → **V/Q mismatch แย่ลง เพิ่ม dead space** (กลไกหลัก)\n2. **Haldane effect** — ฮีโมโกลบินที่อิ่มออกซิเจนปล่อย CO2 กลับเข้าพลาสมามากขึ้น\n3. **ลด hypoxic respiratory drive** — บทบาทน้อยที่สุด แม้จะเป็นคำอธิบายที่ถูกสอนมากที่สุด\n\n**แต่ต้องไม่แกว่งไปอีกทาง**: **ห้ามงดออกซิเจนในผู้ป่วยที่ hypoxaemic** เพราะ **ภาวะขาดออกซิเจนฆ่าคนก่อนภาวะ CO2 คั่ง** — SpO2 84% เป็นระดับที่อันตรายต่ออวัยวะสำคัญ\n\n**ลำดับการดูแล**: ให้ออกซิเจนแบบควบคุม (Venturi mask ควบคุม FiO2 ได้แม่นกว่า) → **เจาะ ABG ภายใน 30-60 นาที** → ถ้า **pH < 7.35 ร่วมกับ PaCO2 สูง → เริ่ม NIV** → ถ้า NIV ล้มเหลวหรือมีข้อห้าม → **ใส่ท่อช่วยหายใจ**\nพร้อมกับให้ **bronchodilator พ่นถี่, systemic corticosteroid และ antibiotic ตามข้อบ่งชี้**\n\nทำไมข้ออื่นผิด: high-flow เป้า >98% คือสิ่งที่หลักฐานบอกว่าเพิ่มการตาย; การงดออกซิเจนรอผลแลปเป็นอันตรายทันที; การให้ตามความรู้สึกของผู้ป่วยไม่ใช่เกณฑ์ทางสรีรวิทยา; และการใส่ท่อทันทีข้ามขั้น NIV ซึ่งเป็นการรักษาที่ดีกว่าในผู้ป่วยที่ยังรู้สึกตัว", "pearl": "ผู้ป่วยกลุ่มอื่นที่ใช้เป้า **88-92%** เช่นกัน: **obesity hypoventilation, ผนังทรวงอกผิดรูป (kyphoscoliosis), โรคกล้ามเนื้ออ่อนแรงเรื้อรัง, bronchiectasis รุนแรง และ cystic fibrosis** — ส่วนผู้ป่วยทั่วไปที่ไม่เสี่ยงคั่ง CO2 ใช้เป้า **94-98%**", "topic": "Oxygen target in acute exacerbation of COPD", "src": "", "ref": ["MED34 MCQ ครั้งที่ 4 ข้อ 13 – COPD ให้ oxygen ยังไง keep SpO2 เท่าไหร่ (cannula กี่ลิตร, non-rebreathing, venturi)", "MED32 MCQ ข้อ 66 – SpO2 88% (RA) ให้ O2 cannula 3 LPM แล้วไม่ดีขึ้น", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 37 – COPD SpO2 88% what is the indication of O2 supplement", "MED31 MCQ ข้อ 79 – COPD ให้ O2 แล้วดีขึ้น"], "nl": ["2.2.11", "B6.2.5(1)", "3.3.17"]}]}, {"id": "chest-26-05", "title": "แปลผลกรด-ด่างทีละขั้น", "minutes": 10, "summary": "หาความผิดปกติหลัก → ตรวจการชดเชย → คำนวณ anion gap → หาสาเหตุ", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### ขั้นตอนมาตรฐาน (stepwise approach)\n1. **หาความผิดปกติหลัก (primary disorder)**\n2. **ตรวจว่าการชดเชยเหมาะสมหรือไม่** — ถ้าไม่เหมาะสมแปลว่ามีความผิดปกติที่สอง\n3. **คำนวณ anion gap** (และ delta ratio เมื่อ AG กว้าง)\n4. **หาสาเหตุจำเพาะ**\n5. **รักษา**\n\n### หลักของการชดเชย\n- **ไตทำงานช้า ปอดทำงานเร็ว** — การชดเชยทางการหายใจเห็นผลในไม่กี่นาทีถึงชั่วโมง ส่วนไตใช้เวลา **12–24 ชั่วโมงถึง 3–5 วัน**\n- **การชดเชยไม่เคยมากเกิน (no overcompensation) และไม่เคยดึง pH กลับมาปกติสนิท** — ถ้า pH กลับมาปกติพอดีหรือชดเชยเกิน ให้สงสัย **mixed disorder** ทันที\n- **การชดเชยที่ขาดไปหรือเกินไป = มีความผิดปกติที่สองซ่อนอยู่**\n\n### ขั้นที่ 1 — หาความผิดปกติหลัก\nดูทิศทางของ **pH, PaCO2 และ HCO3** — **ตัวที่เปลี่ยนไปในทางเดียวกับ pH คือความผิดปกติหลัก**\n\n| | pH | ตัวที่อธิบาย pH | อ่านว่า |\n|---|---|---|---|\n| pH 7.25 · HCO3 12 · PCO2 24 | กรด | **HCO3 ต่ำ** | **Metabolic acidosis** |\n| pH 7.55 · HCO3 30 · PCO2 42 | ด่าง | **HCO3 สูง** | **Metabolic alkalosis** |\n| pH 7.25 · HCO3 28 · PCO2 60 | กรด | **PCO2 สูง** | **Respiratory acidosis** |\n| pH 7.55 · HCO3 19 · PCO2 20 | ด่าง | **PCO2 ต่ำ** | **Respiratory alkalosis** |\n\n**ถ้าทั้ง HCO3 และ PCO2 เปลี่ยนไปทางเดียวกัน ให้เทียบ % การเปลี่ยนแปลง — ตัวที่เปลี่ยนมากกว่าคือความผิดปกติหลัก**\n- pH 7.55 · HCO3 38 · PCO2 30 → (38−24)/24 = **0.58** เทียบกับ (30−40)/40 = 0.25 → **metabolic alkalosis เป็นหลัก**\n- pH 7.25 · HCO3 16 · PCO2 60 → (16−24)/24 = 0.33 เทียบกับ (60−40)/40 = **0.5** → **respiratory acidosis เป็นหลัก** (และมี metabolic acidosis ร่วม)\n\n### ขั้นที่ 2 — สูตรการชดเชยที่ต้องจำ\n| ความผิดปกติหลัก | การชดเชยที่คาดหวัง |\n|---|---|\n| **Metabolic acidosis** | **PaCO2 = (1.5 × HCO3) + 8 ± 2** (Winter's formula) |\n| **Metabolic alkalosis** | **PaCO2 เพิ่ม 0.75 mmHg ต่อ HCO3 ที่เพิ่ม 1** ≈ **(0.7 × HCO3) + 20 ± 2** |\n| **Respiratory acidosis เฉียบพลัน** | **HCO3 เพิ่ม 1** ต่อ PaCO2 ที่เพิ่มทุก 10 · **pH ลด 0.08** ต่อ PaCO2 ที่เพิ่มทุก 10 |\n| **Respiratory acidosis เรื้อรัง** | **HCO3 เพิ่ม 4** ต่อ PaCO2 ที่เพิ่มทุก 10 (ตำราส่วนใหญ่ใช้ 3.5–4) · **pH ลด 0.04** ต่อ 10 |\n| **Respiratory alkalosis เฉียบพลัน** | **HCO3 ลด 2** ต่อ PaCO2 ที่ลดทุก 10 · **pH เพิ่ม 0.08** ต่อ 10 |\n| **Respiratory alkalosis เรื้อรัง** | **HCO3 ลด 5** ต่อ PaCO2 ที่ลดทุก 10 · **pH เพิ่ม 0.02** ต่อ 10 |\n\n**วิธีจำชุดตัวเลขทางการหายใจ — 1, 2 (เฉียบพลัน) และ 4, 5 (เรื้อรัง)** โดย acidosis ใช้ 1 กับ 4 และ alkalosis ใช้ 2 กับ 5 ส่วนการเปลี่ยนของ pH คือ **0.08 เมื่อเฉียบพลัน และ 0.04 (acidosis) / 0.02 (alkalosis) เมื่อเรื้อรัง**\n\n### ตัวอย่างการใช้จริง\nผู้ป่วย COPD: **pH 7.35 · PaCO2 60 · HCO3 32**\n- PaCO2 สูงและ pH ต่ำเล็กน้อย → **respiratory acidosis**\n- PaCO2 เพิ่มจาก 40 เป็น 60 = เพิ่ม 20 → ถ้าเฉียบพลัน HCO3 ควรเป็น ~26 · ถ้าเรื้อรังควรเป็น **~32** → ค่าที่วัดได้ 32 จึงเป็น **chronic respiratory acidosis ที่ชดเชยเต็มที่แล้ว** ไม่ใช่ภาวะเฉียบพลันและ **ไม่ต้องรีบให้ bicarbonate**\n\n### สาเหตุที่ต้องนึกถึง\n- **Respiratory acidosis** — กดการหายใจจากยา, โรคระบบประสาทและกล้ามเนื้อ, **COPD/หืดรุนแรง**, อุดกั้นทางเดินหายใจส่วนบน, ผนังทรวงอกผิดรูป, ตั้งเครื่องช่วยหายใจไม่พอ\n- **Respiratory alkalosis** — **ภาวะพร่องออกซิเจน (สาเหตุที่ต้องตัดออกก่อนเสมอ)**, ปวด, ไข้, วิตกกังวล/hyperventilation syndrome, **ภาวะติดเชื้อในกระแสเลือดระยะแรก**, **ตับวาย**, **ตั้งครรภ์ (progesterone)**, **พิษ salicylate ระยะแรก**, ที่สูง, เครื่องช่วยหายใจตั้งมากเกินไป\n- **Metabolic alkalosis** — **อาเจียนหรือดูดสารคัดหลั่งจากกระเพาะ** (เสีย H+ และ Cl−, chloride-responsive แก้ด้วย NSS), ยาขับปัสสาวะ, **hyperaldosteronism และ Cushing (chloride-resistant)**, ให้ด่างเกิน, **โพแทสเซียมต่ำมาก**\n", "pearls": ["ตัวที่เปลี่ยนไปทางเดียวกับ pH คือความผิดปกติหลัก · ถ้าเปลี่ยนไปทางเดียวกันทั้งคู่ให้เทียบ % การเปลี่ยนแปลง", "Winter's formula: PaCO2 ที่คาด = 1.5 × HCO3 + 8 ± 2", "หายใจ: เฉียบพลัน 1 และ 2 · เรื้อรัง 4 และ 5 (HCO3 ต่อ PaCO2 ทุก 10)", "การชดเชยไม่เคยเกินและไม่เคยดึง pH กลับมาปกติสนิท — ถ้าปกติสนิทให้คิดถึง mixed disorder", "Respiratory alkalosis ต้องตัดภาวะพร่องออกซิเจนออกก่อนเสมอ อย่าด่วนบอกว่าวิตกกังวล"], "nl": ["B6.1.2(3)", "B9.2.5(2)", "3.3.17"], "items": [{"id": "CH-OLD-13", "kind": "old", "stem": "An arterial blood gas shows pH 7.15, PaCO2 30 mmHg and HCO3 10 mEq/L. Which acid-base disorder is present?", "choices": ["Mixed respiratory alkalosis and metabolic alkalosis", "Metabolic alkalosis with respiratory compensation", "Respiratory alkalosis with metabolic compensation", "Mixed metabolic acidosis and respiratory acidosis", "Metabolic acidosis with appropriate respiratory compensation"], "answer": 3, "explain": "ไล่เป็นขั้น: **pH 7.15 → acidaemia รุนแรง**; **HCO3 10 ต่ำมาก → primary metabolic acidosis**; PaCO2 30 ต่ำกว่าปกติ จึงไม่ใช่ต้นเหตุของกรด\n\n**Winter's formula**: expected PaCO2 = 1.5 × HCO3 + 8 ± 2 = 1.5(10) + 8 ± 2 = **21 ถึง 25 mmHg**\nค่าที่วัดได้ **30 mmHg ซึ่งสูงกว่าที่คาด** → ปอดชดเชย **ไม่พอ** → **มี respiratory acidosis ซ้อนอยู่** = **mixed metabolic acidosis + respiratory acidosis**\n\n**กับดักของข้อนี้**: เห็น PaCO2 = 30 (ต่ำกว่า 40) แล้วรีบสรุปว่า \"ปอดชดเชยแล้ว\" หรือ \"มี respiratory alkalosis ซ้อน\" — **ผิดทั้งคู่**\n- **ต่ำกว่า 40 ไม่ได้แปลว่าพอ** ต้องเทียบกับ **ค่าที่ควรจะเป็น** จาก Winter's\n- PaCO2 **สูงกว่า** ค่าที่คาด = **respiratory acidosis ซ้อน** (ปอดล้า/กดการหายใจ/โรคปอด)\n- PaCO2 **ต่ำกว่า** ค่าที่คาด = **respiratory alkalosis ซ้อน** (ปวด วิตกกังวล ไข้ sepsis ตับวาย PE)\n\n> กฎที่ใช้ได้เสมอ: **การชดเชยไม่เคยทำให้ pH กลับมาปกติสนิท และไม่เคยชดเชยเกิน** — ถ้าเห็นค่าที่ \"เกิน\" ที่สูตรทำนาย แปลว่ามีความผิดปกติที่สองซ่อนอยู่\n\n**ตรวจความสอดคล้อง**: pH = 6.1 + log[10 ÷ (0.03 × 30)] = 6.1 + log 11.1 = **7.15** ✔", "pearl": "", "topic": "", "src": "MED31 โพย ข้อ 19 – ph 7.25, PCO2 30, HCO3 10 → Metabolic acidosis with respiratory alkalosis (โพยระบุให้ไปคิดดูว่าอาจเป็น mixed)", "ref": [], "nl": ["3.3.17", "B6.3(2)", "B9.1.2(6)"]}, {"id": "CH-OLD-15", "kind": "old", "stem": "A 60-year-old man with chronic obstructive pulmonary disease presents with worsening dyspnoea. Arterial blood gas: pH 7.30, PaCO2 80 mmHg, HCO3 38 mEq/L. Which interpretation is correct?", "choices": ["Acute-on-chronic respiratory acidosis with partial metabolic compensation", "Fully compensated chronic respiratory acidosis", "Primary metabolic alkalosis with respiratory compensation", "Pure acute respiratory acidosis", "Mixed respiratory acidosis and metabolic acidosis"], "answer": 0, "explain": "**HCO3 38 บ่งว่าไตชดเชยมานานแล้ว (chronic)** — PaCO2 ขึ้น 40 จากปกติ ถ้าเป็น chronic เต็มที่ HCO3 ควรอยู่ราว 24 + (4 × 4) = **~40** ซึ่งใกล้เคียงกับ 38\n\nแต่ **pH 7.30 ยังเป็นกรด** แสดงว่า **มีส่วนเฉียบพลันซ้อนบนภาวะเรื้อรัง (acute-on-chronic)** — ถ้าเป็น chronic ล้วนที่ชดเชยเต็มที่ pH มักจะอยู่ที่ **7.35-7.38** (ไตชดเชยเก่งแต่ไม่เคยทำให้ pH กลับมาปกติสนิท)\n\n**หลักการรักษาที่ต้องรู้**: ให้ออกซิเจนโดย **เป้า SpO2 88-92%** ในผู้ป่วย COPD ที่คั่ง CO2 (การให้ O2 มากเกินทำให้ CO2 คั่งเพิ่มจาก V/Q mismatch, Haldane effect และลด hypoxic drive) และพิจารณา **NIV** ซึ่งลดอัตราการใส่ท่อและลด mortality", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 OSCE/SAQ ข้อ 7 – Thai male 60 y/o with COPD, ABG pH 7.30, CO2 80, HCO3 38 (COPD exacerbation) จงแปลผล", "ref": [], "nl": ["2.2.11", "3.3.17", "B6.2.5(1)"]}, {"id": "CH-MCQ-11", "kind": "mcq", "stem": "A 24-year-old woman presents with breathlessness and tingling around the mouth and fingers. Arterial blood gas on room air: pH 7.52, PaCO2 26 mmHg, PaO2 105 mmHg, HCO3 21 mEq/L. Which finding in the history would most strongly argue AGAINST a benign hyperventilation syndrome and require urgent further investigation?", "choices": ["Symptom onset while arguing with a family member", "Complete resolution of symptoms with reassurance and slow breathing", "A normal chest radiograph and normal D-dimer", "Pleuritic chest pain with unilateral calf swelling", "Recent examination stress with similar previous episodes"], "answer": 3, "explain": "ABG แสดง **acute respiratory alkalosis**: pH สูง, **PaCO2 ต่ำ (สาเหตุปฐมภูมิ)**, HCO3 ลดเล็กน้อยตามการชดเชยแบบเฉียบพลัน (PaCO2 ลด 10 → HCO3 ลด 2)\nอาการ **ชารอบปากและปลายนิ้ว** เกิดจาก **ภาวะด่างทำให้ ionised calcium ลดลง** (H+ หลุดจาก albumin แล้ว Ca2+ เข้าจับแทน) → neuromuscular excitability เพิ่ม → paraesthesia, carpopedal spasm, Chvostek/Trousseau sign\n\n**อันตรายคือการรีบสรุปว่าเป็น \"hyperventilation syndrome\"** ซึ่งเป็น **การวินิจฉัยแยกโรคที่ต้องตัดสาเหตุอื่นออกให้หมดก่อน**\n\n**สาเหตุของ respiratory alkalosis ที่ต้องคัด**\n1. **ภาวะขาดออกซิเจน**: **pulmonary embolism (ตัวที่พลาดแล้วตาย)**, pneumonia, pneumothorax, pulmonary oedema, ที่สูง, ซีดรุนแรง\n2. **โรคปอดโดยตรง**: โรคที่กระตุ้น J-receptor\n3. **สาเหตุกลาง**: ความวิตกกังวล/ความเจ็บปวด, ไข้, **sepsis (มักเป็นสัญญาณแรกสุด)**, เลือดออกในสมอง, **liver failure**\n4. **ยาและสารพิษ**: **salicylate (กระตุ้นศูนย์หายใจโดยตรง)**, progesterone, catecholamine\n5. **การตั้งครรภ์** (progesterone) และ **การช่วยหายใจด้วยเครื่องมากเกินไป**\n\n**เบาะแสในโจทย์ที่เป็นธงแดง: pleuritic chest pain ร่วมกับขาบวมข้างเดียว = DVT/PE** → ต้องประเมินด้วย **Wells score, D-dimer และ CT pulmonary angiography** ตามความเสี่ยง; ใน PE ระยะแรก **PaO2 อาจปกติ** และ **CXR มักปกติ** จึงหลอกได้ง่าย\n\nทำไมข้ออื่นไม่ใช่ธงแดง: ความเครียด เหตุการณ์กระตุ้นทางอารมณ์ อาการหายเมื่อปลอบ และผลตรวจพื้นฐานปกติ ล้วนสนับสนุน hyperventilation syndrome", "pearl": "ใน **salicylate poisoning** จะพบ **respiratory alkalosis ร่วมกับ high anion gap metabolic acidosis พร้อมกัน** ทำให้ pH อาจดูเกือบปกติ — เป็นกับดักที่ออกสอบ (โจทย์ LMS ของ MED35 ก็ใช้รูปแบบนี้)", "topic": "Causes of primary respiratory alkalosis", "src": "", "ref": ["MED35 LMS – A 19 year old man with altered mental status, ABG pH 7.42 PaCO2 20, wide anion gap → Salicylate poisoning (wide AG acidosis + respiratory alkalosis)", "MED30 SAQ – Hyperventilation syndrome", "MED31 MCQ ข้อ 62 / MED34 MCQ ครั้งที่ 4 ข้อ 14 – Sudden dyspnea and syncope, EKG S1Q3T3 → pulmonary embolism", "MED31 past paper – หญิงตั้งครรภ์ 3 เดือน ขาขวาบวม 1 สัปดาห์ แล้วเจ็บหน้าอกฉับพลัน CXR ปกติ → Pulmonary embolism"], "nl": ["B6.1.2(3)", "3.3.17", "2.2.22"]}, {"id": "CH-MCQ-12", "kind": "mcq", "stem": "A 48-year-old man with gastric outlet obstruction has vomited repeatedly for 5 days. Arterial blood gas: pH 7.52, PaCO2 48 mmHg, HCO3 38 mEq/L. Electrolytes: Na 138, K 2.8, Cl 88 mEq/L. Urine chloride is 8 mEq/L. What is the most appropriate treatment?", "choices": ["Fluid restriction with a loop diuretic", "Acetazolamide as first-line therapy", "Intravenous 0.9 percent sodium chloride with potassium chloride replacement", "Intravenous sodium bicarbonate", "Intravenous hydrochloric acid infusion as the initial step"], "answer": 2, "explain": "**การเกิด metabolic alkalosis ต้องมี 2 ขั้นเสมอ**\n1. **Generation** — เสีย H+ หรือได้ base: ในเคสนี้คือ **อาเจียนเสีย HCl จากกระเพาะ** → ทุก H+ ที่เสียไป ตับจะเหลือ HCO3 ไว้ในเลือด\n2. **Maintenance** — ไตต้อง \"เก็บ\" bicarbonate ไว้ไม่ขับทิ้ง ซึ่งเกิดจาก **volume depletion, hypochloraemia และ hypokalaemia** ร่วมกัน\n   - volume ต่ำ → **RAAS ทำงาน → aldosterone สูง → ดูดซึม Na และขับ H+/K+** → ยิ่งด่างและ K ยิ่งต่ำ\n   - **Cl ต่ำ** → ไตดูดซึม Na กลับไม่ได้คู่กับ Cl จึงต้องดูดคู่กับ **HCO3** แทน → ค้าง bicarbonate ไว้\n   - **K ต่ำ** → H+ เคลื่อนเข้าเซลล์แลกกับ K ที่ออกมา และไตเพิ่มการขับ H+ → alkalosis คงอยู่\n\n**Urine chloride คือกุญแจในการแยกชนิด**\n- **Urine Cl < 20 (\"chloride-responsive\")** — อาเจียน, ดูดของออกทาง NG tube, ภายหลังใช้ diuretic, ท้องเสียที่เสีย Cl → **รักษาด้วย NSS + KCl** ก็หายเอง\n- **Urine Cl > 20 (\"chloride-resistant\")** — hyperaldosteronism, Cushing, **Bartter/Gitelman**, ขณะที่ยังใช้ diuretic อยู่ → การให้ NSS ไม่ช่วย ต้องแก้ต้นเหตุ\n\nเคสนี้ **urine Cl 8** → chloride-responsive → **0.9% NaCl เติมทั้ง volume และ Cl พร้อม KCl เติม K** ซึ่งแก้ทั้ง maintenance factor ทั้งสามอย่างพร้อมกัน; ร่วมกับแก้การอุดกั้นของกระเพาะ\n\nทำไมข้ออื่นผิด\n- **NaHCO3**: เติมด่างให้กับผู้ป่วยที่เป็นด่างอยู่แล้ว\n- **Acetazolamide**: ใช้เป็น adjunct ในผู้ที่ **volume overload ร่วมด้วย** (เช่น HF ที่ได้ diuretic มาก) — ไม่ใช่ first-line ในผู้ที่ขาดน้ำ\n- **Loop diuretic**: ทำให้เสีย Cl, K และ volume เพิ่ม → **ซ้ำเติม alkalosis**\n- **HCl infusion**: สงวนไว้ในรายที่รุนแรงมาก (pH > 7.55) ที่แก้ด้วยวิธีอื่นไม่ได้ และต้องให้ทาง central line", "pearl": "การชดเชยของ **metabolic alkalosis**: PaCO2 ขึ้นประมาณ **0.7 mmHg ต่อ HCO3 ที่ขึ้น 1 mEq/L** — เคสนี้ HCO3 ขึ้น 14 → คาด PaCO2 ≈ 40 + 10 = **50** ซึ่งใกล้เคียงค่าที่วัดได้ (48) = ชดเชยเหมาะสม; และการชดเชยมี **เพดานราว PaCO2 55 mmHg** เพราะร่างกายจะไม่ยอม hypoventilate จนขาดออกซิเจน", "topic": "Metabolic alkalosis from vomiting", "src": "", "ref": ["MED35 LMS / MED31 past paper – ผู้ป่วยเบาหวานที่มี pneumonia ร่วมกับอาเจียน: respiratory alkalosis + metabolic alkalosis + high anion gap metabolic acidosis", "MED32 MCQ ข้อ 16 – แปล blood gas ตอบ respiratory alkalosis, metabolic acidosis, metabolic alkalosis", "MED30 สรุป – met acidosis / met alkalosis"], "nl": ["B6.1.2(3)", "3.3.17", "B9.2.5(2)"]}, {"id": "CH-OLD-16", "kind": "old", "stem": "A 56-year-old diabetic man presents with fever, productive cough and vomiting for 3 days. Vital signs: BT 38.5 C, PR 110/min, RR 28/min, BP 95/55 mmHg, moderate dehydration, crepitations at the lower lung. Laboratory results: blood sugar 128 mg/dL, BUN 14, creatinine 1.0 mg/dL, Na 140, K 4.1, Cl 78, HCO3 15 mEq/L, albumin 4.0 g/dL. ABG: pH 7.50, PaO2 70 mmHg, PaCO2 20 mmHg. What best describes the acid-base abnormality?", "choices": ["Respiratory alkalosis from pneumonia, metabolic alkalosis from vomiting and normal anion gap metabolic acidosis from vomiting", "High anion gap metabolic acidosis from lactic acidosis alone", "Respiratory acidosis from pneumonia", "Respiratory alkalosis from pneumonia and high anion gap metabolic acidosis from lactic acidosis", "Respiratory alkalosis from pneumonia, metabolic alkalosis from vomiting and high anion gap metabolic acidosis from lactic acidosis"], "answer": 4, "explain": "**กับดักที่ใหญ่ที่สุดของข้อนี้: pH 7.50 เป็นด่าง แต่ผู้ป่วยมี metabolic acidosis รุนแรงซ่อนอยู่** — ถ้าหยุดอ่านที่ pH จะพลาดทั้งหมด\n\nเป็น **triple acid-base disorder** ต้องคำนวณครบ 3 ขั้น\n1. **Anion gap** = Na − (Cl + HCO3) = 140 − (78 + 15) = **47** (albumin ปกติ ไม่ต้องปรับ) → **high AG metabolic acidosis** (lactic acidosis จาก sepsis/hypoperfusion — BP 95/55, PR 110, ขาดน้ำ)\n2. **Delta ratio** = ΔAG/ΔHCO3 = (47 − 12)/(24 − 15) = 35/9 ≈ **3.9 (> 2)** → **HCO3 ตกน้อยกว่าที่ AG ขึ้นมาก** แปลว่ามี **metabolic alkalosis ซ้อน** (อาเจียน 3 วัน เสีย HCl — สังเกต **Cl 78 ต่ำมาก** เป็นเบาะแสสนับสนุน)\n3. **Winter's formula** = 1.5(15) + 8 ± 2 = **28-32 mmHg** แต่วัดได้ **PaCO2 20** ซึ่ง **ต่ำกว่าที่คาดมาก** → **respiratory alkalosis ซ้อน** (จากปอดอักเสบ ไข้ และภาวะพร่องออกซิเจน)\n\n→ **respiratory alkalosis + metabolic alkalosis + high AG metabolic acidosis พร้อมกัน**\n\n**ตรวจความสอดคล้อง (Henderson-Hasselbalch)**: pH = 6.1 + log[15 ÷ (0.03 × 20)] = 6.1 + log 25 = **7.50** ✔ ตัวเลขทั้งสามสอดคล้องกัน\n\nบทเรียน: **อย่าหยุดที่ pH และอย่าหยุดที่ AG** — ต้องคิด delta ratio และ Winter's ทุกครั้ง มิฉะนั้นจะพลาดความผิดปกติที่ซ่อนอยู่", "pearl": "", "topic": "", "src": "MED35 LMS / MED31 past paper – A 56-year-old diabetic man with fever, productive cough, nausea and vomiting; ABG pH 7.29, PaCO2 20", "ref": [], "nl": ["3.3.17", "2.3.10(5)", "B9.1.2(6)"]}]}, {"id": "chest-26-06", "title": "Anion gap, delta ratio และสาเหตุของ metabolic acidosis", "minutes": 8, "summary": "MUDPILES และ HARDUP กับการจับ mixed disorder ที่ซ่อนอยู่", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Arterial Blood Gas Analysis", "md": "### Anion gap\n**AG = Na − (HCO3 + Cl)** · **ค่าปกติ 10–12 mmol/L**\nตัวอย่างจากสไลด์: Na 135, HCO3 15, Cl 97 → **AG = 135 − (15 + 97) = 23** → **high anion gap metabolic acidosis**\n\n**ต้องแก้ค่าตามอัลบูมินเสมอ** — อัลบูมินเป็นประจุลบหลักในเลือด\n**Corrected AG = AG + 2.5 × (4.0 − albumin)**\nผู้ป่วยวิกฤตที่อัลบูมิน 2.0 g/dL จะมี AG ต่ำกว่าความจริงราว 5 — **AG ที่ดู “ปกติ” จึงอาจเป็น high AG ที่ถูกบัง**\n\n### สาเหตุของ high anion gap metabolic acidosis — **MUDPILES**\n**M**ethanol · **U**remia · **D**KA และ alcoholic/starvation ketoacidosis · **P**araldehyde · **I**NH, iron, **rhabdomyolysis** · **L**actic acidosis (type A จากเนื้อเยื่อขาดออกซิเจน · type B จากยา/ตับ) · **E**thylene glycol · **S**alicylates\n\n### สาเหตุของ normal anion gap (hyperchloremic) metabolic acidosis — **HARDUP**\n**H**yperalimentation / hyperventilation · **A**cetazolamide และ carbonic anhydrase inhibitor, **Addison disease** · **R**TA ชนิดที่ 1, 2, 4 · **D**iarrhea · **U**reterosigmoidostomy และ ileal diversion · **P**ancreatic fistula หรือการระบายน้ำย่อยจากลำไส้เล็ก\n(รวมถึง **saline loading**, การให้กรดอะมิโนทางหลอดเลือด และ interstitial nephritis)\n\n> **แยก RTA ออกจากท้องเสียด้วย urine anion gap** = (Na + K) − Cl ในปัสสาวะ\n> **ค่าติดลบ = ไตขับ NH4+ ได้ดี → สาเหตุนอกไต เช่นท้องเสีย** · **ค่าเป็นบวก = ไตขับกรดไม่ได้ → RTA**\n\n### Delta ratio — เครื่องมือจับความผิดปกติที่ซ่อนอยู่\n**Δ ratio = (AG − 12) ÷ (24 − HCO3)**\n\n| ค่า | แปลว่า |\n|---|---|\n| **< 1** | มี **normal AG metabolic acidosis ร่วมด้วย** (HCO3 ตกมากกว่าที่ AG กว้างขึ้น) |\n| **1–2** | **high AG metabolic acidosis อย่างเดียว** |\n| **> 2** | มี **metabolic alkalosis ซ่อนอยู่ หรือ chronic respiratory acidosis ที่ทำให้ HCO3 สูงอยู่ก่อน** |\n\n**ตัวอย่างคลาสสิก** — ผู้ป่วย DKA ที่อาเจียนมากจะมี delta ratio > 2 เพราะมีทั้ง ketoacidosis และ metabolic alkalosis จากการอาเจียน\n\n### ฝึกอ่าน ABG ชุดท้ายคาบ (จากสไลด์)\n| # | pH | PaCO2 | PaO2 | HCO3 | คำตอบ |\n|---|---|---|---|---|---|\n| 1 | 7.44 | 36 | 84 | 22 | **ปกติ** (pH, PaCO2, HCO3 อยู่ในเกณฑ์) โดยมี **hypoxemia เล็กน้อย** ต้องดูอายุและ FiO2 ประกอบ |\n| 2 | 7.25 | 66 | 64 | 26 | **Acute respiratory acidosis** — PaCO2 เพิ่ม 26 จาก 40 ถ้าเฉียบพลัน HCO3 ควรเพิ่ม ~2.6 เป็น ~27 ซึ่งตรงกับค่าที่วัดได้ |\n| 3 | 7.35 | 50 | 68 | 28 | **Chronic respiratory acidosis ที่ชดเชยแล้ว** — PaCO2 เพิ่ม 10 และ HCO3 เพิ่ม ~4 ตรงกับสูตรเรื้อรัง (ภาพของ COPD) |\n| 4 | 7.31 | 30 | 96 | 14 | **Metabolic acidosis ที่ชดเชยเหมาะสม** — Winter's: PaCO2 ที่คาด = 1.5 × 14 + 8 = 29 ± 2 ตรงกับ 30 ต้องคำนวณ AG ต่อ |\n| 5 | 7.50 | 30 | 96 | 22 | **Acute respiratory alkalosis** — PaCO2 ลด 10 และ HCO3 ลด ~2 ตามสูตรเฉียบพลัน ให้มองหาภาวะพร่องออกซิเจน ปวด ไข้ หรือติดเชื้อในกระแสเลือด |\n", "pearls": ["AG = Na − (Cl + HCO3) ปกติ 10–12 และต้องแก้ตามอัลบูมิน +2.5 ต่อทุก 1 g/dL ที่ต่ำกว่า 4", "Delta ratio < 1 มี normal AG acidosis ร่วม · > 2 มี metabolic alkalosis หรือ chronic resp acidosis ซ่อนอยู่", "Urine anion gap เป็นบวก = RTA · เป็นลบ = ท้องเสีย"], "nl": ["B9.2.5(2)", "B9.1.2(6)"], "items": [{"id": "CH-MCQ-15", "kind": "mcq", "stem": "A patient has Na 140, Cl 107, HCO3 12 mEq/L and albumin 4.0 g/dL. The arterial pH is 7.30 with PaCO2 26 mmHg. What does the delta ratio indicate?", "choices": ["The delta ratio is approximately 2.5, indicating a coexisting metabolic alkalosis", "The delta ratio is approximately 0.8, indicating a coexisting normal anion gap metabolic acidosis", "The delta ratio cannot be calculated because the albumin is normal", "The delta ratio is approximately 1.5, indicating a pure high anion gap metabolic acidosis", "The delta ratio is approximately 0.8, indicating a coexisting metabolic alkalosis"], "answer": 1, "explain": "**การคำนวณทีละขั้น**\n1. **Anion gap** = Na − (Cl + HCO3) = 140 − (107 + 12) = **21** (สูงกว่าปกติ = high AG acidosis)\n2. **ΔAG** = AG ที่วัดได้ − AG ปกติ = 21 − 12 = **9**\n3. **ΔHCO3** = 24 − HCO3 ที่วัดได้ = 24 − 12 = **12**\n4. **Delta ratio = ΔAG / ΔHCO3 = 9 / 12 = 0.75 ≈ 0.8**\n\n→ **HCO3 ตกลงไป 12 แต่ anion gap ขึ้นมาแค่ 9** แปลว่า **มีกรดอีกชนิดที่กิน bicarbonate ไปโดยไม่เพิ่ม anion gap** ซ้อนอยู่ = **normal anion gap (hyperchloraemic) metabolic acidosis ร่วมด้วย** — สังเกตว่า **Cl 107 สูงค่อนไปทางขอบบน** ซึ่งเป็นเบาะแสสนับสนุน (สาเหตุที่พบบ่อย: **ท้องเสีย, renal tubular acidosis, การให้ NSS ปริมาณมาก**)\n\n**การแปลผลมาตรฐาน**\n| Delta ratio | ความหมาย |\n|---|---|\n| **< 0.4** | **normal AG (hyperchloraemic) acidosis ล้วน** |\n| **0.4 - 0.8** | **high AG acidosis ร่วมกับ normal AG acidosis** |\n| **1 - 2** | **high AG metabolic acidosis ล้วน** |\n| **> 2** | **high AG acidosis ร่วมกับ metabolic alkalosis** (หรือ chronic respiratory acidosis ที่มี HCO3 สูงอยู่ก่อน) |\n\n**ตรรกะเบื้องหลัง**: ในกรดชนิด high AG ล้วน **ทุก 1 mEq ของกรดที่เพิ่มขึ้นควรกิน bicarbonate ไป 1 mEq** → อัตราส่วนควรใกล้ 1 ถ้า **HCO3 ตกมากเกินกว่าที่ AG ขึ้น** แปลว่ามีกรดอีกชนิดที่ไม่เพิ่ม AG (เช่นท้องเสีย, RTA, ให้ NSS ปริมาณมาก) ซ้อนอยู่\n\n**Winter's formula ในเคสนี้** = 1.5(12) + 8 ± 2 = **24-28** → PaCO2 26 อยู่ในเกณฑ์ = **ชดเชยเหมาะสม ไม่มีความผิดปกติทางการหายใจซ้อน**\n\n**อย่าลืมปรับ AG ตาม albumin**: **corrected AG = AG + 2.5 × (4.0 − albumin)** — ในเคสนี้ albumin ปกติจึงไม่ต้องปรับ แต่ในผู้ป่วยที่ albumin 2.0 การไม่ปรับจะทำให้ **พลาด high AG acidosis ไปเลย**", "pearl": "ลำดับการอ่าน ABG ที่ไม่ควรข้าม: **(1) pH (2) ความผิดปกติปฐมภูมิ (3) การชดเชยด้วยสูตร (4) anion gap ที่ปรับ albumin แล้ว (5) delta ratio** — ทำครบ 5 ขั้นจะไม่พลาด mixed disorder", "topic": "Delta ratio and identification of a mixed disorder", "src": "", "ref": ["MED35 LMS – delta anion gap to delta HCO3 is over 2, reflect mixed wide anion gap and metabolic alkalosis", "MED30 MCQ ข้อ 49 – Simple wide anion gap metabolic acidosis (โพยเก่าเฉลย metabolic acidosis with compensate respiratory alkalosis แต่คำนวณแล้วได้ predicted PCO2 22.5-26.5)", "MED29 โพย – Anion gap = Na − Cl − HCO3 ปกติ = 12", "MED28 MED421 ข้อ 66 – Wide gap metabolic acidosis with normal gap metabolic acidosis"], "nl": ["3.3.17", "B6.3(2)", "B9.1.2(6)"]}, {"id": "CH-OLD-21", "kind": "old", "stem": "A patient with diabetic ketoacidosis has an arterial blood gas showing pH 7.26, PaCO2 23 mmHg and HCO3 10 mEq/L, with Na 140, Cl 100 mEq/L. Which interpretation is correct?", "choices": ["Primary respiratory alkalosis with metabolic compensation", "High anion gap metabolic acidosis with appropriate respiratory compensation", "High anion gap metabolic acidosis with superimposed respiratory acidosis", "Mixed metabolic acidosis and metabolic alkalosis", "Normal anion gap metabolic acidosis with respiratory compensation"], "answer": 1, "explain": "**AG** = 140 − (100 + 10) = **30** → high anion gap metabolic acidosis (จาก ketoacid)\n**Winter's**: 1.5(10) + 8 ± 2 = **21-25 mmHg**; วัดได้ **23** → **ชดเชยเหมาะสม** (ไม่มีความผิดปกติทางการหายใจซ้อน)\n**ตรวจความสอดคล้อง**: pH = 6.1 + log[10 ÷ (0.03 × 23)] = 6.1 + log 14.5 = **7.26** ✔\n\nข้อควรรู้เพิ่มใน DKA: ผู้ป่วยมักมี **normal AG (hyperchloraemic) acidosis ซ้อน** ระหว่างการรักษาเมื่อได้ NSS ปริมาณมากและเสีย ketoanion ทางปัสสาวะ — ทำให้ **delta ratio <1** (โพยเก่ามีข้อที่ตอบ \"wide gap metabolic acidosis with normal gap metabolic acidosis\")\n\nอย่าลืม: **hyperventilation ใน DKA คือ Kussmaul breathing** ซึ่งเป็นการชดเชย **ห้ามกด** และการรักษาคือ **isotonic saline → insulin → เติม K ก่อนถ้า K < 3.3**", "pearl": "", "topic": "", "src": "MED28 MED421 ข้อ 97 – ABG interpretation of a DKA patient → Metabolic acidosis with partially compensated respiratory alkalosis; MED28 ข้อ 66 – Wide gap metabolic acidosis with normal gap metabolic acidosis; MED32 MCQ – ABG pH 7.12, PCO2 23", "ref": [], "nl": ["3.3.17", "B9.1.2(6)", "2.2.16"]}]}], "date": "อ. 6 ต.ค."}], "label": "Chest", "thai": "ระบบการหายใจและทรวงอก", "accent": {"light": "#4a5a86", "soft": "#e6e9f2", "ink": "#38456b", "dark": "#9aaad8", "darkSoft": "#171c2b", "darkInk": "#b6c2e6"}}, {"set": "nephro", "title": "Nephro · ระบบไตและสมดุลเกลือแร่", "intro": "เริ่มจากคาบ 05 — Fluid electrolyte: Divalent ของ อ.ธิติยา ซึ่งเป็นคาบที่วางรากฐานของทั้งชุด เพราะแคลเซียม ฟอสเฟต และแมกนีเซียม ถูกควบคุมด้วยแกนฮอร์โมนชุดเดียวกัน เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับ AJKD 2024 และ Brenner & Rector ฉบับที่ 11 ตามที่อาจารย์อ้างอิงไว้ในสไลด์ จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจจากคลัง MED28–MED35 และข้อใหม่ของชุด Nephro ทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบแล้วไปฝึก **MEQ** ต่อได้เลย\n\n**ลำดับที่แนะนำ** — หัวข้อ 1 (แกนฮอร์โมนสามตัว) คือกุญแจของทั้งคาบ ถ้าจำตารางในหัวข้อนั้นได้ หัวข้อที่เหลือจะไล่ตามได้เองเกือบทั้งหมด จากนั้นแต่ละแร่ธาตุเรียงแบบเดียวกันเสมอคือ **สมดุลปกติ → ภาวะสูง → ภาวะต่ำ**\n\nคาบที่เหลือของชุด Nephro (nephrotic/nephritic · CKD · dysnatremia & dyskalemia · urine analysis · UTI · AKI) ยังไม่ได้ทำบทเรียน แต่ข้อสอบมีอยู่ครบใน drill.html แล้ว", "lectures": [{"lec": "05", "title": "Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium]", "subtitle": "แกน PTH · FGF-23 · 1,25(OH)₂D · สมดุลและความผิดปกติของแคลเซียม ฟอสเฟต และแมกนีเซียม", "objectives": ["อธิบายการควบคุมซึ่งกันและกันของ **PTH, FGF-23 และ 1,25(OH)₂D** และผลต่อแคลเซียมและฟอสเฟตที่กระดูก ไต และลำไส้ได้", "บอกสัดส่วนและตำแหน่งการดูดกลับ **แคลเซียม ฟอสเฟต และแมกนีเซียม** ในแต่ละส่วนของหน่วยไต พร้อมชื่อตัวขนส่งหลักได้", "แยกสาเหตุของ **ภาวะแคลเซียมสูง** ด้วย PTH ร่วมกับฟอสเฟตและแคลเซียมในปัสสาวะ และเรียงลำดับการรักษาได้ถูกต้อง", "แยกสาเหตุของ **ภาวะแคลเซียมต่ำ** ด้วย PTH คู่กับฟอสเฟต และรู้ว่าเมื่อไรต้องส่ง ionized calcium และแมกนีเซียม", "ใช้ **FE phosphate** และ **FEMg** แยกการรั่วทางไตออกจากการเคลื่อนเข้าเซลล์หรือการเสียทางลำไส้ได้", "อธิบายกลไกที่ **แมกนีเซียมต่ำทำให้เกิดโพแทสเซียมต่ำและแคลเซียมต่ำที่ดื้อต่อการรักษา** และวางแผนการเติมแมกนีเซียมได้", "รู้จักอาการของ **พิษแมกนีเซียม** ตามระดับที่สูงขึ้น และการรักษาเบื้องต้นรวมถึงข้อบ่งชี้ของการฟอกเลือด", "วินิจฉัยและป้องกัน **tumor lysis syndrome** รวมถึงบอกได้ว่าแคลเซียมในภาวะนี้ต่ำ ไม่ใช่สูง"], "sections": [{"id": "nephro-05-01", "title": "แกนฮอร์โมนสามตัว — PTH · FGF-23 · 1,25(OH)₂D", "minutes": 9, "summary": "ถ้าจำแกนนี้ได้ ข้อสอบ divalent เกือบทุกข้อตอบได้จากตารางเดียว", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(8)", "B9.1.2(4)", "B9.2.5(2)"], "md": "แคลเซียมและฟอสเฟตไม่ได้ถูกคุมแยกกัน แต่ถูกคุมด้วย **ฮอร์โมนสามตัวที่คุมกันเองเป็นวงป้อนกลับ (classic negative endocrine feedback loops)** และออกฤทธิ์ที่ **อวัยวะสามแห่ง — กระดูก ไต ลำไส้** เสมอ\n\n### ไล่กลไกทีละตัว\n\n**1. PTH — ฮอร์โมนที่ \"ดึงแคลเซียมขึ้น ไล่ฟอสเฟตออก\"**\n- ต่อมพาราไทรอยด์รับรู้ **ionized Ca ที่ลดลง** ผ่าน **CaSR (calcium-sensing receptor)** → หลั่ง PTH\n- **กระดูก** — กระตุ้น osteoclast ทางอ้อม (ผ่าน RANKL ของ osteoblast) → สลายกระดูก ปล่อยทั้ง **Ca และ PO₄** เข้ากระแสเลือด\n- **ไต** — เพิ่มการดูดกลับ Ca ที่ **DCT** · **ยับยั้งการดูดกลับฟอสเฟตที่ PCT** (ดึง NaPi-2a/2c ออกจากผิวเซลล์) → **ฟอสฟาตูเรีย** · กระตุ้น **1α-hydroxylase**\n- **ลำไส้** — ไม่มีฤทธิ์โดยตรง ต้องผ่าน calcitriol\n- ผลสุทธิ: **Ca ขึ้น · PO₄ ลง** — แม้กระดูกจะปล่อยฟอสเฟตออกมาด้วย แต่ฤทธิ์ขับฟอสเฟตทางไตแรงกว่ามาก\n\n**2. 1,25(OH)₂D (calcitriol) — ฮอร์โมนที่ \"ดูดซึมขึ้นทั้งคู่\"**\n- สร้างที่ **PCT ของไต** โดย 1α-hydroxylase · ถูกกระตุ้นด้วย **PTH และฟอสเฟตต่ำ** ถูกยับยั้งด้วย **FGF-23**\n- **ลำไส้** — เพิ่มการดูดซึม **ทั้ง Ca และ PO₄** (นี่คือฤทธิ์หลัก)\n- ป้อนกลับ: ยับยั้งการหลั่ง PTH และ **กระตุ้นให้ osteocyte หลั่ง FGF-23**\n- ผลสุทธิ: **Ca ขึ้น · PO₄ ขึ้น**\n\n**3. FGF-23 — ฮอร์โมนที่ \"ไล่ฟอสเฟตออกอย่างเดียว\"**\n- สร้างจาก **osteocyte/osteoblast** เมื่อ **ฟอสเฟตสูง หรือ calcitriol สูง**\n- ต้องจับกับ **FGFR ร่วมกับ klotho เป็น co-receptor** จึงจะออกฤทธิ์ที่ไตได้ — ไตเป็นอวัยวะที่มี klotho มากที่สุด\n- **ไต** — ดึง **NaPi-2a/2c** ออกจากผิว PCT → ขับฟอสเฟต **และยับยั้ง 1α-hydroxylase** → calcitriol ลด\n- ยับยั้งการหลั่ง PTH ด้วย\n- ผลสุทธิ: **PO₄ ลง · calcitriol ลง · Ca แทบไม่ขึ้น**\n\n> **จุดที่ทำให้แยกโรคได้** — PTH กับ FGF-23 ขับฟอสเฟตเหมือนกัน แต่ **PTH ดันแคลเซียมขึ้นด้วย ส่วน FGF-23 ไม่ดัน** ดังนั้นคนไข้ **ฟอสเฟตต่ำจากไตรั่ว + แคลเซียมสูง = PTH เกิน** แต่ **ฟอสเฟตต่ำจากไตรั่ว + แคลเซียมปกติ = FGF-23 เกิน**\n\n### ตารางสรุปที่ต้องจำให้ได้\n\n| ฮอร์โมน | ถูกกระตุ้นโดย | กระดูก | ไต | ลำไส้ | Ca ในเลือด | PO₄ ในเลือด |\n|---|---|---|---|---|---|---|\n| **PTH** | ionized Ca ต่ำ (CaSR) | สลายกระดูก ↑ | ดูดกลับ Ca ↑ (DCT) · **ขับ PO₄ ↑** · 1α-OHase ↑ | ทางอ้อมผ่าน calcitriol | **↑** | **↓** |\n| **1,25(OH)₂D** | PTH ↑ · PO₄ ต่ำ | เสริมฤทธิ์ PTH | ดูดกลับ Ca ↑ | **ดูดซึม Ca และ PO₄ ↑** | **↑** | **↑** |\n| **FGF-23** | PO₄ สูง · calcitriol ↑ | (osteocyte เป็นผู้สร้าง) | **ขับ PO₄ ↑** · **1α-OHase ↓** | ลดทางอ้อม (calcitriol ลด) | ≈ คงที่ | **↓** |\n\n### กับดักที่คนพลาดจริง\n- **\"PTH สูง = hyperparathyroidism\" ไม่จริงเสมอ** — ต้องดู Ca คู่กันเสมอ: PTH สูงพร้อม Ca **สูง** = primary/tertiary · PTH สูงพร้อม Ca **ต่ำ** = secondary (CKD, ขาดวิตามินดี) ซึ่งเป็นการตอบสนองที่ถูกต้องของร่างกาย\n- **PTH \"ปกติ\" ในคนที่ Ca สูง คือผลผิดปกติ** — ถ้าแคลเซียมสูงจริง PTH ต้องถูกกดจนต่ำ การที่ยัง \"ปกติ\" แปลว่าต่อมทำงานเองโดยไม่ฟัง feedback\n- FGF-23 ต้องมี **klotho** — ใน CKD ระดับ klotho ลดลง เกิดภาวะ **ดื้อต่อ FGF-23** ทั้งที่ระดับ FGF-23 สูงลิ่ว\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์เปิดด้วยรูป **\"Axis of PTH, FGF-23, and 1,25-dihydroxy vitamin D\"** จาก **AJKD Vol 83, Iss 2, February 2024** และย้ำว่าทั้งสามตัว **\"interact & regulate one another via classic negative endocrine feedback loops\"** โดยควบคุมการขนส่ง Ca และฟอสเฟตที่ **ไต กระดูก ลำไส้**\n- ทั้งคาบเรียงตามลำดับนี้เสมอ: **homeostasis → ภาวะสูง → ภาวะต่ำ** ของแต่ละ divalent — ใช้ลำดับนี้ทบทวนก่อนสอบได้เลย\n", "pearls": ["PTH: Ca ขึ้น PO₄ ลง · calcitriol: ขึ้นทั้งคู่ · FGF-23: PO₄ ลง calcitriol ลง Ca ไม่ขึ้น", "ฟอสเฟตต่ำจากไตรั่ว + Ca สูง = PTH เกิน · ฟอสเฟตต่ำจากไตรั่ว + Ca ปกติ = FGF-23 เกิน", "FGF-23 ต้องมี klotho เป็น co-receptor — CKD มี klotho ต่ำจึงดื้อต่อ FGF-23", "PTH ที่ 'ปกติ' ในคนที่แคลเซียมสูง คือค่าที่ผิดปกติ"], "items": [{"id": "N-OLD-004", "kind": "old", "stem": "A woman has calcium 12.5 mg/dL with phosphate 1.9 mg/dL and elevated intact PTH. What is the mechanism?", "choices": ["Excess parathyroid hormone increasing bone resorption, renal calcium reabsorption and phosphate excretion", "Increased calcitonin secretion", "Increased intestinal calcium absorption from vitamin D excess", "Osteolytic metastasis releasing calcium", "Reduced renal calcium excretion from thiazide"], "answer": 0, "explain": "**PTH ออกฤทธิ์ 3 ที่**: สลายกระดูก, ดูดแคลเซียมกลับที่ distal tubule, และ **ขับฟอสเฟตทิ้ง** พร้อมกระตุ้น 1-alpha-hydroxylase ให้สร้าง calcitriol เพิ่มการดูดซึมแคลเซียมที่ลำไส้ — จึงได้ภาพ Ca สูง PO4 ต่ำ", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 48", "ref": [], "nl": ["B9.1.2(8)", "B9.2.5(2)"]}, {"id": "NEPHRO-05-01-Q1", "kind": "own", "stem": "Which of the following best describes the direct action of FGF-23 on the kidney?", "choices": ["It inhibits paracellular calcium reabsorption in the thick ascending limb via claudin-14", "It increases calcium reabsorption in the distal convoluted tubule via TRPV5", "It upregulates NaPi-2a and NaPi-2c in the proximal tubule and stimulates 1-alpha-hydroxylase", "It stimulates 1-alpha-hydroxylase and thereby increases intestinal phosphate absorption", "It downregulates NaPi-2a and NaPi-2c in the proximal tubule and inhibits 1-alpha-hydroxylase"], "answer": 4, "explain": "**กลไก** — FGF-23 สร้างจาก osteocyte เมื่อฟอสเฟตหรือ calcitriol สูง แล้วจับกับ **FGFR ร่วมกับ klotho** ที่ PCT ผลคือ **ดึง NaPi-2a และ NaPi-2c ออกจาก apical membrane** → ดูดกลับฟอสเฟตน้อยลง → ขับฟอสเฟตออกมากขึ้น **และยับยั้ง 1α-hydroxylase** พร้อมกัน → calcitriol ลดลง → ลำไส้ดูดซึมฟอสเฟตน้อยลงอีกทาง เป็นการลดฟอสเฟตสองทางพร้อมกัน\n\n**ทำไมตัวลวงจึงผิด**\n- *upregulate NaPi + กระตุ้น 1α-OHase* — กลับทิศทั้งคู่ นี่คือสิ่งที่เกิดเมื่อ **ขาด** FGF-23 (จึงเกิดฟอสเฟตสูงและ calcitriol สูง)\n- *เพิ่มการดูดกลับ Ca ผ่าน TRPV5 ที่ DCT* — เป็นฤทธิ์ของ **PTH และ calcitriol** ไม่ใช่ FGF-23\n- *กระตุ้น 1α-OHase แล้วเพิ่มการดูดซึมฟอสเฟต* — ตรงข้ามกับความจริง FGF-23 **ยับยั้ง** 1α-OHase\n- *claudin-14 ที่ TAL* — claudin-14 ถูกคุมโดย **CaSR** เมื่อ Ca หรือ Mg สูง ไม่ใช่เส้นทางของ FGF-23", "pearl": "FGF-23 ลดฟอสเฟตสองทาง — ขับออกทางไต และตัด calcitriol ไม่ให้ลำไส้ดูดซึม", "topic": "แกนฮอร์โมนสามตัว — PTH · FGF-23 · 1,25(OH)₂D", "src": "", "ref": [], "nl": ["B9.1.2(8)", "B9.1.2(3)"]}]}, {"id": "nephro-05-02", "title": "สมดุลแคลเซียม — total เทียบกับ ionized และการจัดการของไต", "minutes": 9, "summary": "ทำไมต้องวัด ionized ไม่ใช่แค่ปรับตามอัลบูมิน และไตดูดกลับแคลเซียมที่ไหนบ้าง", "source": "สไลด์ อ.ธิติยา (Thitiya Puavilai, M.D.) หน่วยโรคไต รพ.ราชวิถี — Fluid electrolyte: Divalent [Calcium, Phosphate, Magnesium] (30 พ.ค. 2567)", "nl": ["B9.1.2(4)", "B9.1.2(1)", "B9.3(5)"], "md": "### แคลเซียมอยู่ที่ไหนในร่างกาย\n- **ส่วนใหญ่อย่างท่วมท้นอยู่ในกระดูก** — เลือดมีแค่ราว **1%** ของแคลเซียมทั้งร่างกาย\n- แคลเซียมที่ไหลเวียนในเลือดแบ่งเป็นสามส่วน\n  - **40% จับกับโปรตีน** (อัลบูมินเป็นหลัก) — ไม่ออกฤทธิ์ และ **ถูกกรองผ่านโกลเมอรูลัสไม่ได้**\n  - **10% จับกับประจุลบ** (ซิเตรต ฟอสเฟต ไบคาร์บอเนต) — ถูกกรองได้\n  - **50% เป็น free \"ionized\" calcium** — **ส่วนนี้เท่านั้นที่ออกฤทธิ์ทางสรีรวิทยา** และเป็นตัวที่ CaSR ตรวจจับ\n- แคลเซียมมีบทบาทต่อระบบประสาท หัวใจ และกล้ามเนื้อ จึงต้องคุม ionized Ca ให้อยู่ในช่วงแคบ ๆ **แบบนาทีต่อนาที**\n\n### ลำไส้\nดูดซึมที่ **duodenum และ upper jejunum** สองทาง — **transcellular ที่ต้องพึ่ง 1,25(OH)₂D** และ **paracellular ที่ไม่พึ่งวิตามินดี** โดยรวมแล้วการดูดซึมแคลเซียมจากอาหาร **มีประสิทธิภาพค่อนข้างต่ำ แต่ถูกเร่งขึ้นอย่างมากด้วย calcitriol**\n\n### ไตดูดกลับแคลเซียมที่ไหนบ้าง\n**เฉพาะแคลเซียมที่เป็นอิสระหรือจับกับประจุลบเท่านั้นที่ถูกกรอง** และ **95% ของที่ถูกกรองจะถูกดูดกลับ**\n\n| ส่วนของหน่วยไต | ดูดกลับ | เส้นทาง | กลไก/โปรตีนหลัก |\n|---|---|---|---|\n| **PCT** | **60%** | paracellular | รูจาก **claudin-2 และ claudin-12** · อาศัย passive diffusion และ **solvent drag** ตามน้ำและ Na ที่ถูกดูดกลับ · แรงขับเคลื่อนมาจากการหลั่ง H⁺ และดูดกลับ Na ผ่าน **NHE3** |\n| **TAL** | **25%** | paracellular | รูจาก **claudin-16 และ claudin-19** · ขับเคลื่อนด้วย **ศักย์ไฟฟ้าบวกในลูเมน** ที่เกิดจาก **NKCC2 ร่วมกับ K⁺ ที่รั่วกลับเข้าลูเมนผ่าน ROMK** |\n| **DCT** | **15%** | **transcellular เท่านั้น** | เข้าเซลล์ทาง **TRPV5** → จับกับ **calbindin-D28k** ในเซลล์ → ออกด้านข้างทาง **PMCA4** หรือ **NCX1 (SLC8A1)** · เป็นจุดที่ PTH ปรับละเอียด |\n\n> **จุดเชื่อมที่ออกสอบบ่อย** — เมื่อ **แคลเซียมในเลือดสูง CaSR ที่ TAL จะถูกกระตุ้น → ยับยั้ง ROMK → K⁺ รั่วกลับเข้าลูเมนน้อยลง → ศักย์ไฟฟ้าบวกในลูเมนหายไป → ดูดกลับแคลเซียมได้น้อยลง** ร่างกายจึงขับแคลเซียมทิ้งเอง นี่คือกลไกเดียวกับที่ **ยาขับปัสสาวะกลุ่ม loop (ยับยั้ง NKCC2) ทำให้ขับแคลเซียมออก** ส่วน **thiazide ออกฤทธิ์ที่ DCT ทำให้ดูดกลับแคลเซียมมากขึ้น จึงทำให้แคลเซียมสูง**\n\n### กับดักของค่าแล็บ — เรื่องที่อาจารย์ย้ำที่สุด\n- **แคลเซียมต่ำปลอม (spurious hypocalcemia) ต้องตัดออกก่อนเสมอ ด้วยการส่ง ionized calcium ไม่ใช่อาศัยการปรับตามอัลบูมิน**\n- สูตรปรับ **corrected Ca = Ca ที่วัดได้ + 0.8 × (4.0 − อัลบูมิน)** ใช้ประมาณคร่าว ๆ ได้ แต่ **เชื่อไม่ได้ในคนไข้วิกฤต ตับแข็ง ไตวาย หรือมีความผิดปกติกรด-ด่าง** เพราะการจับกับอัลบูมินเปลี่ยนตามค่า pH (**ด่างขึ้น → จับโปรตีนมากขึ้น → ionized ลดลง** ทั้งที่ total เท่าเดิม — จึงเป็นเหตุผลที่คนหายใจเร็วจากตื่นตระหนกมีอาการชามือและมือจีบ)\n- **สารทึบรังสีกลุ่มแกโดลิเนียมสองตัวคือ gadodiamide และ gadoversetamide รบกวนการวัดแคลเซียมด้วยวิธี colorimetric ทำให้ได้ค่าต่ำกว่าความจริง** — ถ้าเจอแคลเซียมต่ำฮวบหลังทำ MRI/MRA ให้นึกถึงข้อนี้ก่อนรักษา\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แจกแจงสัดส่วนแคลเซียมในเลือดเป็นตัวเลขชัดเจน: **1% อยู่ในเลือด · 40% จับโปรตีน · 10% จับประจุลบ · 50% ionized** — เป็นตัวเลขที่ออกสอบตรง ๆ ได้\n- สไลด์ไล่การดูดกลับเป็น **60 : 25 : 15** ที่ PCT : TAL : DCT พร้อมรูปตัวขนส่งรายส่วนจาก **AJKD 2024** และเน้นชื่อโปรตีน **claudin-2/12 · claudin-16/19 · TRPV5 · calbindin-D28k · PMCA4 · NCX1 (SLC8A1)**\n- สไลด์ระบุว่า **hypocalcemia ปลอมพบน้อยกว่าโพแทสเซียมสูงปลอมหรือโซเดียมต่ำปลอมมาก** แต่ต้องคิดถึงไว้เสมอ\n", "pearls": ["ionized Ca คือ 50% ของแคลเซียมในเลือด และเป็นส่วนเดียวที่ออกฤทธิ์ — ส่วนที่จับโปรตีนกรองผ่านไตไม่ได้", "ดูดกลับแคลเซียม PCT 60% (claudin-2/12) · TAL 25% (claudin-16/19) · DCT 15% (TRPV5 — จุดที่ PTH ปรับ)", "Loop diuretic ล้างศักย์ไฟฟ้าบวกที่ TAL → ขับแคลเซียม · thiazide ที่ DCT → เก็บแคลเซียม", "ด่างขึ้นทำให้ ionized Ca ลดลงทั้งที่ total เท่าเดิม — จึงเกิดมือจีบในคนหายใจเร็ว", "แคลเซียมต่ำฮวบหลัง MRI ให้นึกถึง gadodiamide/gadoversetamide รบกวนการตรวจ"], "items": [{"id": "NEPHRO-05-02-Q1", "kind": "own", "stem": "A 61-year-old man in the intensive care unit with septic shock and cirrhosis has a total serum calcium of 6.8 mg/dL (normal 8.6-10.2) and an albumin of 1.8 g/dL. He has no paresthesia, no carpopedal spasm, a negative Trousseau sign and a normal QTc interval. Which of the following is the most appropriate next step?", "choices": ["Start oral calcium carbonate with calcitriol", "Repeat the total calcium after an albumin infusion", "Measure the ionized calcium", "Give 2 g of intravenous calcium gluconate immediately", "Calculate the corrected calcium and treat if it remains below 8.0 mg/dL"], "answer": 2, "explain": "**กลไก** — อัลบูมิน 1.8 g/dL ทำให้ total calcium ต่ำลงโดยที่ **ionized calcium ซึ่งเป็นส่วนที่ออกฤทธิ์อาจปกติทุกประการ** คนไข้จึงไม่มีอาการเลย ในคนไข้วิกฤตที่มีทั้งตับแข็ง ภาวะกรด-ด่างผิดปกติ และอัลบูมินต่ำ **สูตรปรับตามอัลบูมินเชื่อถือไม่ได้** อาจารย์ย้ำในสไลด์ว่าต้อง **ตัดภาวะแคลเซียมต่ำปลอมออกด้วยการวัด ionized calcium ไม่ใช่อาศัยการปรับตามอัลบูมิน**\n\n**ทำไมตัวลวงจึงผิด**\n- *คำนวณ corrected calcium แล้วรักษา* — เป็นสิ่งที่สไลด์บอกตรง ๆ ว่าไม่ควรพึ่ง สูตรนี้สร้างจากคนทั่วไป ไม่ใช่คนไข้ ICU\n- *ให้แคลเซียมทางหลอดเลือดทันที* — คนไข้ไม่มีอาการและ QTc ปกติ การให้แคลเซียมโดยไม่จำเป็นในภาวะติดเชื้อรุนแรงไม่มีประโยชน์และอาจมีโทษ\n- *เร
