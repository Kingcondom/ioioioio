lyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.4(1)", "2.3.4"], "md": "### ตารางที่อาจารย์ใช้เป็นแกน — ปริมาตร ECF คู่กับ tonicity\n\n| ภาวะ | ปริมาตร ECF | Tonicity | กระบวนการ |\n|---|---|---|---|\n| **Hypovolemic hyponatremia** | **ลด** | **ลด** | **เสียโซเดียมมากกว่าน้ำ** |\n| **Normovolemic hyponatremia** | ปกติ | **ลด** | **ได้น้ำเพิ่มสุทธิ ± เสียโซเดียม** |\n| **Hypervolemic hyponatremia** | **เพิ่ม** | **ลด** | **ได้ทั้งน้ำและโซเดียมแต่น้ำมากกว่า (hypotonic gain)** |\n| Hypovolemic normonatremia | ลด | ปกติ | เสียน้ำและโซเดียมเท่ากัน (isotonic loss) |\n| Hypovolemic hypernatremia | ลด | **เพิ่ม** | เสียน้ำมากกว่าโซเดียม |\n\n### 1 · Hypovolemic hyponatremia\n**กลไก** — เสียทั้งน้ำและเกลือ แต่ **ผู้ป่วยดื่มน้ำเปล่าทดแทน** และ **ปริมาตรที่พร่องกระตุ้น ADH ผ่าน baroreceptor** จึงกักน้ำไว้อีก\n\n| เสียนอกไต (urine Na < 20–30) | เสียทางไต (urine Na > 30–40) |\n|---|---|\n| **อาเจียน ท้องเสีย** · เสียทางผิวหนัง (เหงื่อ แผลไฟไหม้) · **third spacing** (ตับอ่อนอักเสบ ลำไส้อุดตัน) | **ยาขับปัสสาวะโดยเฉพาะ thiazide** · **ภาวะต่อมหมวกไตบกพร่อง** · **cerebral salt wasting** · โรคไตที่เสียเกลือ · ภาวะขาดแร่ธาตุคอร์ติคอยด์ |\n\n> **Thiazide เป็นตัวการที่พบบ่อยที่สุดในผู้สูงอายุ** — ออกฤทธิ์ที่ **DCT ซึ่งเป็น diluting segment** จึงทำให้ไต **เจือจางปัสสาวะไม่ได้ แต่ยังทำให้เข้มข้นได้ตามปกติ** · เกิดได้ตั้งแต่ **ไม่กี่สัปดาห์แรก** และ **การรักษาหลักคือหยุดยา** · เปรียบเทียบกับ **loop diuretic ที่ทำลาย medullary gradient จึงไม่ค่อยทำให้โซเดียมต่ำ**\n\n**การรักษา = ให้ 0.9% NSS** — เมื่อปริมาตรกลับมา **สัญญาณกระตุ้น ADH จะหายไปทันที ไตจะขับน้ำออกเองอย่างรวดเร็ว** → **นี่คือจุดที่โซเดียมพุ่งขึ้นเร็วเกินโดยไม่ตั้งใจ ต้องเฝ้าระวัง**\n\n### 2 · Euvolemic hyponatremia — SIADH เป็นตัวหลัก\n\n**เกณฑ์วินิจฉัย SIADH**\n1. **Hypotonic hyponatremia** (POsm < 275)\n2. **UOsm > 100 mOsm/kg** (ไม่เจือจางอย่างที่ควร)\n3. **Urine sodium > 30 – 40 mEq/L** ขณะกินเกลือปกติ\n4. **ปริมาตรปกติทางคลินิก** — ไม่บวม ไม่มีสัญญาณขาดน้ำ\n5. **การทำงานของต่อมไทรอยด์และต่อมหมวกไตปกติ** ← **ข้อนี้คือข้อที่คนลืมบ่อยที่สุด**\n6. **ไม่ได้ใช้ยาขับปัสสาวะ**\n- แล็บสนับสนุน: **กรดยูริกต่ำ (< 4 mg/dL) และ BUN ต่ำ** จากการเจือจางและการขับออกเพิ่ม\n\n**สาเหตุ SIADH 4 กลุ่ม**\n- **มะเร็ง** — **small cell lung cancer เป็นต้นแบบ** · มะเร็งศีรษะและคอ\n- **โรคปอด** — ปอดอักเสบ วัณโรค ฝีในปอด\n- **โรคระบบประสาท** — เลือดออกใต้เยื่อหุ้มสมอง เยื่อหุ้มสมองอักเสบ บาดเจ็บศีรษะ โรคหลอดเลือดสมอง\n- **ยา** — **carbamazepine · SSRI · cyclophosphamide · vincristine · opioid · ecstasy**\n\n**สาเหตุ euvolemic อื่นที่ต้องตัดออก**\n- **ไทรอยด์ต่ำรุนแรง**\n- **ภาวะพร่องฮอร์โมนต่อมหมวกไต** โดยเฉพาะ **secondary adrenal insufficiency จาก Sheehan syndrome** — **หญิงที่ตกเลือดหลังคลอด ต่อมใต้สมองขาดเลือด → ไม่มีน้ำนม ประจำเดือนไม่มา อ่อนเพลีย และโซเดียมต่ำ** · ที่นี่ **ACTH ต่ำ → คอร์ติซอลต่ำ แต่ aldosterone ยังปกติ (เพราะคุมด้วย RAAS) จึงไม่มีโพแทสเซียมสูง** ← จุดแยกจาก Addison\n- **Primary polydipsia · beer potomania** — **UOsm < 100**\n\n### 3 · Hypervolemic hyponatremia\n**บวมชัดเจน แต่ปริมาตรเลือดที่ไหลเวียนจริง (effective arterial blood volume) ต่ำ** → ร่างกายเข้าใจว่าขาดน้ำ → **RAAS และ ADH ทำงาน → กักทั้งเกลือและน้ำ แต่กักน้ำมากกว่า**\n- **หัวใจล้มเหลว · ตับแข็ง · nephrotic syndrome** — urine Na ต่ำ\n- **ไตวาย** — urine Na สูง เพราะไตควบคุมการขับโซเดียมไม่ได้\n- **การรักษาคือจำกัดน้ำและเกลือ + ยาขับปัสสาวะ + รักษาโรคต้นเหตุ** · **ห้ามให้ NSS เพราะจะยิ่งบวม**\n\n### โรคที่ต้องไม่พลาด — Adrenal insufficiency\n> **โซเดียมต่ำคู่กับโพแทสเซียมสูง ในผู้ป่วยที่ปริมาตรพร่องและความดันตกเวลาเปลี่ยนท่า** = **primary adrenal insufficiency (Addison)** จนกว่าจะพิสูจน์เป็นอย่างอื่น · มองหา **ผิวคล้ำขึ้น** (ACTH สูงกระตุ้นเมลานิน) · **กลไก: ขาด aldosterone → เสียโซเดียมและกักโพแทสเซียม** ร่วมกับ **ขาดคอร์ติซอล → ADH ไม่ถูกกด**\n>\n> **การรักษาคือ 0.9% NSS ปริมาณมาก ร่วมกับ hydrocortisone ทันที** — **เจาะเลือดเก็บคอร์ติซอลและ ACTH ไว้ก่อนให้ยา แต่ห้ามรอผลก่อนรักษา**\n\n### กับดักที่คนพลาดจริง\n- **วินิจฉัย SIADH โดยไม่ตรวจไทรอยด์และต่อมหมวกไต** — ทั้งสองโรคเลียนแบบ SIADH ได้ทุกประการ และการรักษาต่างกันสิ้นเชิง\n- **Cerebral salt wasting กับ SIADH แยกกันที่ปริมาตร** — CSW ปริมาตรพร่องจริงและ **ต้องให้เกลือและน้ำ** ส่วน SIADH ต้อง **จำกัดน้ำ** · ให้ผิดกลุ่มแล้วผู้ป่วยแย่ลง\n- **Sheehan syndrome ไม่มีโพแทสเซียมสูงและไม่มีผิวคล้ำ** ต่างจาก Addison", "pearls": ["Thiazide ทำให้โซเดียมต่ำในผู้สูงอายุบ่อยที่สุด — รักษาหลักคือหยุดยา", "เกณฑ์ SIADH ต้องตัดไทรอยด์ต่ำและต่อมหมวกไตบกพร่องออกก่อนเสมอ และต้องไม่ได้ใช้ยาขับปัสสาวะ", "SIADH มีกรดยูริกต่ำและ BUN ต่ำเป็นแล็บสนับสนุน", "โซเดียมต่ำ + โพแทสเซียมสูง + ปริมาตรพร่อง + ผิวคล้ำ = Addison — ให้ NSS กับ hydrocortisone ทันที", "Sheehan syndrome: ไม่มีน้ำนม ประจำเดือนไม่มา โซเดียมต่ำ แต่โพแทสเซียมปกติเพราะ aldosterone ยังดี", "แก้ปริมาตรใน hypovolemic hyponatremia แล้ว ADH จะดับทันที โซเดียมจึงพุ่งเร็วเกินได้ง่าย"], "items": [{"id": "N-MCQ-19", "kind": "mcq", "stem": "A 72-year-old woman presents with 3 days of vomiting and poor oral intake, now drowsy. Vital signs: PR 112/min, BP 92/58 mmHg lying and 74/48 mmHg sitting, dry mucous membranes, skin turgor decreased, JVP not visible. Laboratory results: sodium 105 mEq/L, potassium 3.4 mEq/L, chloride 72 mEq/L, bicarbonate 28 mEq/L, BUN 38 mg/dL, creatinine 1.4 mg/dL, serum osmolality 228 mOsm/kg, urine osmolality 620 mOsm/kg, urine sodium 8 mEq/L. She has no seizures. Which of the following is the most appropriate initial treatment?", "choices": ["Oral tolvaptan", "Fluid restriction to 800 mL per day", "Intravenous 3 percent hypertonic saline 150 mL bolus repeated until sodium reaches 130 mEq/L", "Intravenous furosemide plus potassium supplementation", "Intravenous 0.9 percent sodium chloride with frequent monitoring of serum sodium"], "answer": 4, "explain": "**ขั้นที่ 1 — ยืนยันว่าเป็น hypotonic hyponatraemia จริง**: serum osmolality 228 (ต่ำ) → **hypotonic** (ถ้า osmolality ปกติ/สูงต้องคิดถึง pseudohyponatraemia จาก hyperlipidaemia/hyperproteinaemia หรือ translocational จาก hyperglycaemia/mannitol)\n\n**ขั้นที่ 2 — ประเมิน volume status**: orthostatic hypotension, tachycardia, mucous membrane แห้ง, skin turgor ลด, **JVP มองไม่เห็น**, **BUN/Cr ratio สูง (38/1.4 ≈ 27)** → **hypovolaemic**\n\n**ขั้นที่ 3 — อ่าน urine indices ให้เข้ากับกลไก**: **urine Na 8 mEq/L (<20)** = ไตกำลัง **สงวน Na อย่างสุดความสามารถ** → ยืนยัน extrarenal loss (อาเจียน) และตัด SIADH ออก (SIADH จะมี **urine Na >30-40 ร่วมกับ euvolaemia**); **urine osmolality 620 (เข้มข้น)** อธิบายได้ด้วย **ADH ที่หลั่งจากการกระตุ้นของ baroreceptor (non-osmotic stimulus)** ซึ่งเป็นกลไกที่ทำให้ Na ต่ำลง\n\n**กลไกโดยรวม**: อาเจียนเสียทั้ง Na และน้ำ แต่ผู้ป่วยดื่มน้ำเปล่าชดเชย + **hypovolaemia กระตุ้น ADH อย่างแรง** (ร่างกายเลือกรักษาปริมาตรมากกว่ารักษาความเข้มข้น) → น้ำถูกเก็บไว้ → **dilutional hyponatraemia**; การอาเจียนยังทำให้เกิด **metabolic alkalosis (HCO3 28) และ hypokalaemia** ตรงกับโจทย์\n\n**การรักษา: ให้ 0.9% NaCl** — เมื่อแก้ volume depletion แล้ว **ADH stimulus หายไป → ไตขับน้ำส่วนเกินออกเองอย่างรวดเร็ว (water diuresis)** ซึ่งเป็นเหตุที่ทำให้ **Na อาจขึ้นเร็วเกินไป** จึงต้อง **ตรวจ Na ซ้ำทุก 2-4 ชั่วโมง** และพร้อมจะ **ชะลอด้วย 5% dextrose ± desmopressin** ถ้าขึ้นเร็วเกินขีด\n\n**ขีดจำกัดความเร็วที่ต้องจำ**: ไม่เกิน **8-10 mEq/L ใน 24 ชั่วโมง** (บางแนวทางแนะนำ ≤8 และในกลุ่มความเสี่ยงสูงคือ ≤6) เพราะการแก้เร็วเกินทำให้เกิด **osmotic demyelination syndrome (ODS)** — ความเสี่ยงสูงเป็นพิเศษใน **Na ต่ำเรื้อรังและรุนแรง, โรคพิษสุราเรื้อรัง, ทุพโภชนาการ, hypokalaemia, โรคตับ** ซึ่งผู้ป่วยรายนี้เข้าข่าย (Na 105 และ K ต่ำ)\n\nทำไมข้ออื่นผิด:\n- **3% hypertonic saline ตามที่เขียนใน choice นี้**: ผิดที่ **\"ซ้ำจนถึง 130 mEq/L\"** ซึ่งเป็นการยก Na ขึ้น 25 mEq/L = เกินขีดอย่างมหาศาล → ODS แน่นอน\n  *(ข้อควรรู้: ภาวะ drowsy ถือเป็น **moderately severe symptom** ซึ่งแนวทางยอมให้ **3% bolus 100-150 mL ครั้งเดียว** เพื่อยก Na ขึ้น 4-6 mEq/L ได้ — แต่ **isotonic saline ยังเป็นการรักษา \"ปริมาตรที่ขาด\" ซึ่งเป็นต้นเหตุ** และไม่ว่าจะใช้ทางใด **เพดาน 8-10 mEq/L ใน 24 ชม. ต้องไม่ถูกละเมิด**)\n- **Fluid restriction**: เป็นการรักษาของ **SIADH/euvolaemic hyponatraemia** — ใช้ในผู้ป่วย **hypovolaemic จะซ้ำเติม** ทำให้ perfusion แย่ลงและ AKI\n- **Furosemide + K**: loop diuretic ขับทั้ง Na และน้ำ → ยิ่ง volume ต่ำ (ใช้ใน **hypervolaemic hyponatraemia** เช่น HF/cirrhosis)\n- **Tolvaptan**: vasopressin V2 receptor antagonist ทำให้เกิด aquaresis — ใช้ใน euvolaemic/hypervolaemic hyponatraemia; **ห้ามใช้ใน hypovolaemia** และมีความเสี่ยงแก้ Na เร็วเกินไปจนเกิด ODS รวมถึง hepatotoxicity", "pearl": "อัลกอริทึม hyponatraemia: **osmolality → volume status → urine Na และ urine osmolality**. Urine Na <20 = extrarenal loss (อาเจียน ท้องเสีย เหงื่อ third space); Urine Na >20 ในผู้ที่ hypovolaemic = renal loss (diuretic, adrenal insufficiency, cerebral salt wasting, salt-losing nephropathy)", "topic": "Hypovolaemic hyponatraemia", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 81 – hyponatremia 105 แล้วมี vomiting → hyponatremia hypovolemia: ให้ NSS vs 3% NaCl", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (CVS ข้อ 3) – Hypertension มาด้วยซึม อ่อนแรง on thiazide Na 105 management", "MED31 MCQ ข้อ 32 – ผู้ป่วยมีแลป Na 100 กว่า Cl 70 กว่า BUN Cr สูง ควรให้อะไร (choice: Furosemide, 3%NaCl + Furosemide)", "MED30 MCQ ข้อ 44 – Na 112 มี hypovolemic event", "MED33 MCQ – Hypovolemic shock Na ต่ำ BUN Cr สูง → ให้ 3%", "MED35 FA MCQ ข้อ 17 – Na 114, K 4.1 ไม่ให้อะไร (choice: K supplement, 0.9% NaCl)", "MED30 สรุป – hypovolemic hyponatremia / euvolemic"], "nl": ["B9.2.5(2)", "B9.1.2(5)", "B9.4(2)"]}, {"id": "N-MCQ-20", "kind": "mcq", "stem": "A 66-year-old man with a 40 pack-year smoking history is found to have a right hilar mass on chest radiograph. He is admitted for confusion. Vital signs: PR 82/min, BP 124/78 mmHg, no oedema, JVP 3 cm above the sternal angle, moist mucous membranes, normal skin turgor. Laboratory results: sodium 116 mEq/L, potassium 4.0 mEq/L, BUN 8 mg/dL, creatinine 0.7 mg/dL, serum osmolality 248 mOsm/kg, urine osmolality 540 mOsm/kg, urine sodium 68 mEq/L, uric acid 2.1 mg/dL, TSH and morning cortisol normal. Which of the following is the most likely diagnosis and the most appropriate initial management?", "choices": ["Psychogenic polydipsia; fluid restriction and psychiatric referral", "Cerebral salt wasting; intravenous 0.9 percent saline with sodium supplementation", "Hypervolaemic hyponatraemia from heart failure; furosemide and fluid restriction", "Primary adrenal insufficiency; intravenous hydrocortisone and fluid resuscitation", "Syndrome of inappropriate antidiuretic hormone secretion from small cell lung carcinoma; fluid restriction with treatment of the underlying tumour"], "answer": 4, "explain": "กลไก: **small cell lung carcinoma (SCLC)** มีต้นกำเนิดจาก neuroendocrine cell จึง **สร้างและหลั่ง ADH (vasopressin) แบบ ectopic** โดยไม่ขึ้นกับ osmolality ปกติ → **SIADH**\n- ADH จับ **V2 receptor ที่ collecting duct** → เพิ่ม **aquaporin-2** → ดูดซึมน้ำกลับ → **น้ำคั่ง (water retention) โดยไม่ได้คั่ง Na** → **dilutional hyponatraemia ที่ euvolaemic**\n- ร่างกายชดเชยด้วยการ **ขับ Na ออก (ผ่าน ANP/BNP และ pressure natriuresis)** เพื่อไม่ให้ volume overload → จึงมี **urine Na สูง (>30-40)** และ **ไม่มี edema**\n\n**เกณฑ์วินิจฉัย SIADH (ตรงกับโจทย์ทุกข้อ)**\n1. **Hypotonic hyponatraemia** (Na 116, serum osm 248 <275)\n2. **Urine osmolality สูงไม่เหมาะสม >100 mOsm/kg** (540 — ไตควรขับปัสสาวะเจือจางเมื่อเลือดจาง แต่กลับเข้มข้น)\n3. **Urine Na >30-40 mEq/L** (68)\n4. **Euvolaemia ทางคลินิก** (ไม่มี edema, JVP ปกติ, mucous membrane ชุ่ม, BP ปกติ)\n5. **คัดสาเหตุอื่นออกแล้ว**: thyroid และ adrenal function ปกติ, ไม่ได้ใช้ diuretic, renal function ปกติ\n6. **เบาะแสเสริม: BUN ต่ำ (8) และ uric acid ต่ำ (2.1)** — ทั้งคู่ถูกเจือจางและขับออกมากขึ้นจาก volume expansion เล็กน้อย ซึ่งเป็น **hallmark ที่ช่วยแยก SIADH จาก hypovolaemic hyponatraemia** (ซึ่ง BUN และ uric acid จะ **สูง**)\n\n**การรักษา**: **จำกัดน้ำ (<800-1000 mL/วัน)** เป็นหลัก + **รักษามะเร็งต้นเหตุ** (SCLC ตอบสนองต่อเคมีบำบัดดี และ SIADH มักดีขึ้นตามการตอบสนองของมะเร็ง); ถ้า Na ไม่ขึ้นพิจารณา **เพิ่มเกลือ/โปรตีนในอาหาร, urea, loop diuretic ร่วมกับเกลือ, tolvaptan** (จำกัดการใช้เพราะราคาและความเสี่ยงแก้เร็วเกิน) และ **demeclocycline** (ใช้น้อยลง)\n- ถ้ามี **ชักหรือซึมรุนแรง** → ให้ **3% hypertonic saline 100-150 mL bolus** แล้วค่อยจำกัดน้ำ โดยยึดขีด **≤8-10 mEq/L/24 ชม.** เพื่อกัน ODS\n\nทำไมข้ออื่นผิด:\n- **Cerebral salt wasting (CSW)**: **แยกจาก SIADH ยากที่สุด** เพราะ urine Na สูงทั้งคู่ — จุดต่างคือ CSW ผู้ป่วย **hypovolaemic** (ปัสสาวะออกมาก, น้ำหนักลด, CVP ต่ำ, BUN/uric acid สูง) และเกิดในบริบท **โรคทางระบบประสาท โดยเฉพาะ subarachnoid haemorrhage** — โจทย์นี้ euvolaemic, BUN และ uric acid **ต่ำ** และมีก้อนที่ปอด จึงเป็น SIADH; ที่สำคัญการรักษาสวนทางกัน (CSW ต้องให้เกลือและน้ำ, SIADH ต้องจำกัดน้ำ) จึงต้องแยกให้ถูก\n- **Primary adrenal insufficiency**: จะมี **Na ต่ำ + K สูง** (aldosterone ขาด), hypotension, hyperpigmentation, eosinophilia และ **cortisol ต่ำ** — โจทย์ K 4.0 ปกติและ cortisol ปกติ\n- **Psychogenic polydipsia**: ดื่มน้ำมหาศาลเกินความสามารถในการขับ → **urine osmolality ต่ำมาก (<100) และปัสสาวะเจือจางปริมาณมาก** — ตรงข้ามกับ urine osm 540 ในโจทย์\n- **Hypervolaemic hyponatraemia จาก HF**: ต้องมี **edema, JVP สูง, crepitation, S3** และ **urine Na ต่ำ (<20)** เพราะไตสงวน Na — โจทย์ไม่มี edema และ urine Na สูง", "pearl": "สาเหตุ SIADH จำเป็น 5 กลุ่ม: **มะเร็ง (SCLC เป็นต้นแบบ), โรคปอด (pneumonia, TB), โรคระบบประสาท (stroke, meningitis, SAH, trauma), ยา (SSRI, carbamazepine, cyclophosphamide, vincristine, NSAID, desmopressin, MDMA) และหลังผ่าตัด/ปวด/คลื่นไส้**. Paraneoplastic syndrome ของ SCLC ที่ออกสอบบ่อย: **SIADH, Cushing จาก ectopic ACTH, Lambert-Eaton myasthenic syndrome, ภาวะทางระบบประสาทจาก anti-Hu**", "topic": "SIADH from small cell lung cancer", "src": "", "ref": ["MED35 ลงกองครั้งที่ 2 MCQ ข้อ 61 – Small cell lung cancer → SIADH", "MED32 MCQ ข้อ 5 – postpartum hemorrhage what cause hyponatremia → loss ACTH", "MED30 MCQ ข้อ 12 – Serum K 2.5 Type 2 DM → Primary adrenal insufficiency", "MED30 สรุป – hypovolemic hyponatremia / euvolemic / adrenal insufficiency", "MED31 past paper – ผู้ป่วยชายอายุ 27 ปี subarachnoid hemorrhage หลังผ่าตัด 3 วันแขนขวาอ่อนแรง (choice: vasospasm, hyponatremia)"], "nl": ["B9.2.5(2)", "B9.1.2(8)"]}, {"id": "N-OLD-050", "kind": "old", "stem": "A patient with vomiting for 3 days has Na 105 mEq/L, dry mucous membranes, flat neck veins and BP 90/60 mmHg without seizure or coma. What fluid should be given?", "choices": ["0.9% normal saline", "5% dextrose in water", "3% hypertonic saline", "0.45% saline", "Furosemide alone"], "answer": 0, "explain": "**Hypovolaemic hyponatraemia**: เสียทั้งน้ำและเกลือ ADH หลั่งเพื่อรักษาปริมาตร — **ให้ isotonic saline ก็แก้ได้ทั้งปริมาตรและโซเดียม** เพราะเมื่อปริมาตรกลับมา ADH จะถูกกดและไตขับน้ำส่วนเกินออก (ต้องระวังโซเดียมขึ้นเร็วเกินในจังหวะนี้); **3% NaCl สงวนไว้เมื่อมีอาการทางสมอง**", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 81", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)", "B9.1.2(5)"]}, {"id": "N-OLD-051", "kind": "old", "stem": "A hypertensive patient on hydrochlorothiazide presents with drowsiness and weakness with Na 105 mEq/L. What is the most appropriate management?", "choices": ["Give 3% saline rapidly to normalise sodium within 12 hours", "Stop the thiazide and correct sodium slowly, using hypertonic saline only if there are severe neurological symptoms", "Continue the thiazide and restrict fluid only", "Start desmopressin", "Give intravenous 5% dextrose"], "answer": 1, "explain": "**Thiazide-induced hyponatraemia** พบบ่อยในผู้สูงอายุหญิงและเกิดได้ในไม่กี่สัปดาห์แรก — กลไกคือรบกวนการเจือจางปัสสาวะที่ distal tubule โดยยังคงความสามารถในการเข้มข้นไว้; **หยุดยาเป็นการรักษาหลัก** และ **ห้ามแก้เกิน 8-10 mEq/L ใน 24 ชั่วโมง** (ในรายที่เสี่ยงสูงจำกัดที่ 6-8) เพราะเสี่ยง osmotic demyelination", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (CVS ข้อ 3)", "ref": [], "nl": ["B9.2.5(2)", "B9.4(1)", "B9.1.2(5)"]}, {"id": "N-OLD-053", "kind": "old", "stem": "A patient with hypovolaemic shock has Na 112 mEq/L with elevated BUN and creatinine. What is the initial treatment?", "choices": ["Isotonic saline resuscitation with frequent monitoring of serum sodium", "Tolvaptan", "Desmopressin", "Fluid restriction to 800 mL per day", "3% saline bolus regardless of symptoms"], "answer": 0, "explain": "ในภาวะช็อก **การกู้ปริมาตรมาก่อน** และ isotonic saline แก้โซเดียมไปพร้อมกัน; จุดที่ต้องระวังคือเมื่อปริมาตรกลับมาแล้ว ADH ถูกกดทันที ไตจะขับน้ำจำนวนมากทำให้ **โซเดียมขึ้นเร็วเกินกำหนด** — ถ้าขึ้นเร็วให้พิจารณาให้ D5W หรือ desmopressin เพื่อชะลอ", "pearl": "", "topic": "", "src": "MED30 MCQ ข้อ 44 / MED33 MCQ", "ref": [], "nl": ["B9.2.5(2)", "2.2.7", "B9.4(2)"]}, {"id": "N-OLD-055", "kind": "old", "stem": "A dehydrated patient has Na 122 mEq/L and K 5.8 mEq/L with postural hypotension. What is the most appropriate initial fluid?", "choices": ["3% saline", "Ringer lactate with added potassium", "0.9% normal saline", "5% dextrose in water", "0.45% saline with 5% dextrose"], "answer": 2, "explain": "โซเดียมต่ำคู่กับโพแทสเซียมสูงและปริมาตรพร่อง ให้นึกถึง **adrenal insufficiency** ด้วย — การให้ **isotonic saline** แก้ทั้งปริมาตร โซเดียม และช่วยลดโพแทสเซียมโดยการเจือจางและเพิ่มการขับที่ไต; ถ้าสงสัย adrenal crisis ให้ **hydrocortisone** หลังเก็บ cortisol", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 81", "ref": [], "nl": ["B9.2.5(2)", "2.2.15", "B9.4(2)"]}, {"id": "N-OLD-057", "kind": "old", "stem": "A patient with small cell lung cancer has Na 118 mEq/L, urine osmolality 600 mOsm/kg, urine sodium 60 mEq/L and clinical euvolaemia with normal thyroid and adrenal function. What is the diagnosis?", "choices": ["Congestive heart failure", "Hypovolaemic hyponatraemia", "Cerebral salt wasting", "Syndrome of inappropriate antidiuretic hormone secretion", "Primary polydipsia"], "answer": 3, "explain": "**SIADH**: euvolaemic hypotonic hyponatraemia + **urine osmolality สูงเกิน 100 (มัก > 300) และ urine Na > 40** ทั้งที่โซเดียมในเลือดต่ำ โดยไทรอยด์และต่อมหมวกไตปกติ; สาเหตุคลาสสิกคือ **small cell lung cancer, โรคปอด, โรคสมอง และยา (SSRI, carbamazepine, cyclophosphamide)** — รักษาโดยจำกัดน้ำและแก้ที่ต้นเหตุ", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 61", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "2.3.2"]}, {"id": "N-OLD-058", "kind": "old", "stem": "A woman with severe postpartum haemorrhage later develops fatigue, failure to lactate and hyponatraemia. What is the mechanism?", "choices": ["Renal salt wasting", "SIADH from pain", "Secondary adrenal insufficiency from pituitary infarction (Sheehan syndrome) with loss of ACTH", "Primary adrenal insufficiency from autoimmune adrenalitis", "Excess mineralocorticoid"], "answer": 2, "explain": "**Sheehan syndrome**: ต่อมใต้สมองส่วนหน้าขาดเลือดหลังตกเลือดหลังคลอด → ขาด ACTH ทำให้ **cortisol ต่ำ ซึ่งทำให้ ADH หลั่งมากขึ้นและขับน้ำอิสระไม่ได้ จึงเกิดโซเดียมต่ำ**; ต่างจาก primary adrenal insufficiency ตรงที่ **aldosterone ยังปกติ จึงไม่ค่อยมีโพแทสเซียมสูงและผิวไม่คล้ำ**", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 5", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(8)", "2.3.4"]}, {"id": "N-OLD-059", "kind": "old", "stem": "A patient with hyperpigmentation, postural hypotension, Na 128 mEq/L and K 5.9 mEq/L has which diagnosis?", "choices": ["Conn syndrome", "Primary adrenal insufficiency (Addison disease)", "Secondary adrenal insufficiency", "SIADH", "Diabetes insipidus"], "answer": 1, "explain": "**Primary adrenal insufficiency = ขาดทั้ง cortisol และ aldosterone** จึงได้ **Na ต่ำ + K สูง + ความดันตกเมื่อเปลี่ยนท่า + ผิวคล้ำ** (ACTH สูงกระตุ้น melanocyte); โพยเก่ามีข้อที่เฉลยสับสนกับ 'K 2.5' ซึ่งเข้าได้กับ **hyperaldosteronism มากกว่า** — ให้ยึดหลักว่า **Addison = K สูง, Conn = K ต่ำ**", "pearl": "", "topic": "", "src": "MED30 MCQ ข้อ 12 (โพยเฉลยสับสน — แก้ให้ตรงกลไก)", "ref": [], "nl": ["B9.2.5(2)", "2.3.4", "B9.1.2(8)"]}]}, {"id": "nephro-22-06", "title": "Hyponatremia — การรักษา เป้าการแก้ และ osmotic demyelination syndrome", "minutes": 10, "summary": "3% NaCl เมื่อมีอาการรุนแรง · เป้า 4-6 mEq/L ใน 1-2 ชม. แล้วไม่เกิน 6-8 ต่อ 24 ชม. · การลดกลับเมื่อแก้เกิน", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.4(2)", "B9.3(3)"], "md": "### หลักการที่ต้องแยกให้ขาด\n> **อาการรุนแรงเกิดจาก \"สมองบวม\" ซึ่งแก้ได้ด้วยการขึ้นโซเดียมเพียงเล็กน้อยและเร็ว** · ส่วน **อันตรายจากการรักษาคือ \"ODS\" ซึ่งเกิดจากการขึ้นโซเดียม \"มากเกินไปใน 24 ชั่วโมง\"**\n>\n> **สองอย่างนี้ไม่ขัดกัน** — **ขึ้นเร็วในชั่วโมงแรกเพื่อหยุดอาการได้ แต่ห้ามให้ยอดรวมของวันเกินเพดาน**\n\n### สูตรที่ใช้\n```\nปริมาณโซเดียมที่ต้องให้ (mEq) = TBW × (Na ที่ต้องการ − Na ปัจจุบัน)\n```\n- **TBW = น้ำหนัก × 0.6 (ชาย) / 0.5 (หญิง) / 0.45 (ผู้สูงอายุ)**\n- **3% NaCl มีโซเดียม 513 mEq/L (≈ 0.513 mEq/mL)**\n- **ประมาณคร่าว ๆ: 3% NaCl 1 mL/kg ขึ้นโซเดียมราว 1 mEq/L**\n- **สูตรทุกสูตรเป็นเพียงจุดเริ่มต้น — ต้องเจาะโซเดียมซ้ำเป็นระยะเสมอ ห้ามเชื่อสูตรแล้วปล่อยยาว**\n\n### เป้าการแก้ตามสไลด์\n\n| | **แนวทางสหรัฐอเมริกา** | **แนวทางยุโรป** |\n|---|---|---|\n| **เป้าในชั่วโมงแรก** | **ขึ้น 4 – 6 mEq/L ใน 1 – 2 ชั่วโมง** | **ขึ้น 5 mEq/L ใน 1 – 2 ชั่วโมง** |\n| **3% NaCl — อาการรุนแรง** | **100 mL IV ใน 10 นาที ให้ซ้ำได้ถึง 3 ครั้ง** | **150 mL IV ใน 20 นาที ให้ซ้ำได้ 2 – 3 ครั้ง** |\n| **3% NaCl — อาการปานกลาง** | **0.5 – 2 mL/kg/ชั่วโมง** | **150 mL ใน 20 นาที (ครั้งเดียว)** |\n| **ติดตามหลังให้** | **เจาะซ้ำทุก 4 – 6 ชั่วโมง ใน 24 ชั่วโมงแรก** | **เจาะซ้ำทุก 6 ชั่วโมง ใน 24 ชั่วโมงแรก** |\n\n**เพดานรวมของทั้งวัน** — หลังจากขึ้นเร็ว 4 – 6 mEq/L ในช่วงแรกแล้ว **ให้โซเดียมขึ้นรวมไม่เกิน 6 – 8 mEq/L ใน 24 ชั่วโมง** · ในผู้ป่วยเสี่ยงสูงบางแนวทางใช้ **ไม่เกิน 8 mEq/L ต่อวัน และไม่เกิน 18 mEq/L ใน 48 ชั่วโมง**\n\n### เมื่อแก้เกินเป้า — การลดกลับ (re-lowering)\n\n| | **สหรัฐอเมริกา** | **ยุโรป** |\n|---|---|---|\n| เมื่อไรถึงลดกลับ | **ถ้า Na เริ่มต้น > 120 ไม่ต้องลดกลับ** · **พิจารณาลดกลับถ้า Na เริ่มต้น < 120** และโซเดียมขึ้นเกิน **6 – 8 mEq/L ใน 24 ชั่วโมง** | **พิจารณาเฉพาะเมื่อขึ้นเกิน 10 mEq/L ใน 24 ชั่วโมง** |\n| ทำอย่างไร | ให้ **น้ำเปล่า (free water)** หรือ **desmopressin** | **น้ำเปล่า 10 mL/kg** หรือ **น้ำเปล่า 10 mL/kg ร่วมกับ desmopressin 2 mcg IV** |\n\n> **กลไกที่ต้องเข้าใจ** — เมื่อแก้ปริมาตรหรือหยุดยาต้นเหตุ **ADH จะดับลงทันที ไตจึงขับปัสสาวะเจือจางออกมามหาศาล (water diuresis) และโซเดียมพุ่งขึ้นเองโดยที่เรายังไม่ได้ให้เกลือเพิ่ม** — **สัญญาณเตือนคือปัสสาวะออกมากอย่างกะทันหัน** ให้เจาะโซเดียมทันที · **desmopressin ทำหน้าที่ \"เบรก\" การขับน้ำนี้**\n\n### Osmotic demyelination syndrome (ODS)\n**กลไก** — ในภาวะโซเดียมต่ำเรื้อรัง **เซลล์สมองขับออสโมลอินทรีย์ออกไปแล้ว** · เมื่อโซเดียมนอกเซลล์ขึ้นเร็ว **เซลล์ซึ่งไม่มีออสโมลเหลือจะเสียน้ำอย่างรุนแรงและเหี่ยว** → **ปลอกไมอีลินถูกทำลาย** โดยเฉพาะที่ **pons** (central pontine myelinolysis) และนอก pons\n\n**อาการ** — มักปรากฏ **ล่าช้า 2 – 6 วันหลังการแก้** เป็น **พูดไม่ชัด กลืนลำบาก อ่อนแรงทั้งสี่แขนขา (quadriparesis) · locked-in syndrome · ชัก · การเปลี่ยนแปลงพฤติกรรม** · **มักไม่ผันกลับ**\n\n**กลุ่มเสี่ยงสูงตามสไลด์**\n- **ผู้ป่วยปลูกถ่ายตับ**\n- **ผู้ติดสุราและผู้ขาดสารอาหาร**\n- **ผู้ที่มีโพแทสเซียมต่ำ**\n- **ผู้ป่วยแผลไฟไหม้**\n- **หญิงสูงอายุที่กิน thiazide**\n- **ผู้ที่ขาดออกซิเจน**\n- **โซเดียมต่ำรุนแรง โดยเฉพาะ < 105 mEq/L**\n\n### การรักษาตามสาเหตุ (เมื่อไม่มีอาการรุนแรง)\n| สาเหตุ | การรักษา |\n|---|---|\n| **Hypovolemic** | **0.9% NSS** แล้วเฝ้าระวังโซเดียมพุ่งเมื่อปริมาตรกลับมา |\n| **SIADH** | **จำกัดน้ำ 800 – 1,000 mL/วัน** เป็นหลัก · เสริมด้วย **เกลือแกงหรือ urea** · **tolvaptan (vaptan) ในรายที่เลือกแล้ว** · **รักษาต้นเหตุ** |\n| **Hypervolemic** | **จำกัดน้ำและเกลือ + ยาขับปัสสาวะ + รักษาโรคหลัก** · **ห้ามให้ NSS** |\n| **Thiazide** | **หยุดยา** แล้วแก้ช้า ๆ ใช้ 3% NaCl เฉพาะเมื่อมีอาการทางระบบประสาทรุนแรง |\n| **Primary polydipsia** | **จำกัดน้ำ** — โซเดียมมักขึ้นเองเร็วมากเมื่อหยุดดื่ม จึงต้องเฝ้าระวังแก้เกิน |\n\n### กับดักที่คนพลาดจริง\n- **ให้ NSS ในผู้ป่วย SIADH ทำให้โซเดียมต่ำลงอีก** — เพราะไตขับเกลือที่ให้ไปทิ้งแต่เก็บน้ำไว้ (ปัสสาวะเข้มข้นกว่าน้ำเกลือที่ให้) · **นี่เป็นข้อสอบคลาสสิก**\n- **แก้โพแทสเซียมก็ทำให้โซเดียมขึ้นด้วย** — เพราะ **โซเดียมในเลือด = (Na + K ที่แลกเปลี่ยนได้) ÷ TBW** · ผู้ป่วยที่โพแทสเซียมต่ำมากและได้ KCl ปริมาณมาก โซเดียมจะขึ้นเร็วกว่าที่คำนวณ **ต้องนับ KCl เข้าไปในเพดานด้วย**\n- **ไม่เจาะโซเดียมซ้ำถี่พอ** เป็นสาเหตุที่พบบ่อยที่สุดของการแก้เกิน\n- **ไม่บันทึกปริมาณปัสสาวะ** — ปัสสาวะที่ออกมากผิดปกติคือสัญญาณเตือนล่วงหน้าของโซเดียมที่กำลังจะพุ่ง", "pearls": ["มีอาการรุนแรงให้ 3% NaCl 100 mL ใน 10 นาที (ซ้ำได้ 3 ครั้ง) หรือ 150 mL ใน 20 นาทีตามแนวทางยุโรป", "เป้า: ขึ้น 4–6 mEq/L ใน 1–2 ชั่วโมงแรกเพื่อหยุดอาการ แล้วรวมทั้งวันไม่เกิน 6–8 mEq/L", "3% NaCl 1 mL/kg ขึ้นโซเดียมประมาณ 1 mEq/L", "ให้ NSS ใน SIADH ทำให้โซเดียมต่ำลงอีก เพราะไตขับเกลือทิ้งแต่เก็บน้ำไว้", "ปัสสาวะออกมากกะทันหันคือสัญญาณว่า ADH ดับและโซเดียมกำลังจะพุ่ง — เจาะทันทีและพิจารณา desmopressin", "การให้ KCl ก็ทำให้โซเดียมขึ้น ต้องนับรวมในเพดานของวันด้วย", "ODS ปรากฏช้า 2–6 วัน เป็นพูดไม่ชัด กลืนลำบาก อ่อนแรงสี่แขนขา และมักไม่ผันกลับ"], "items": [{"id": "N-MCQ-21", "kind": "mcq", "stem": "A 68-year-old woman with hypertension on hydrochlorothiazide for 6 months presents with 2 days of confusion and generalised weakness. She appears clinically euvolaemic to mildly hypovolaemic. Laboratory results: sodium 108 mEq/L, potassium 3.0 mEq/L, chloride 74 mEq/L, bicarbonate 27 mEq/L, serum osmolality 232 mOsm/kg, urine osmolality 430 mOsm/kg, urine sodium 42 mEq/L, uric acid 3.0 mg/dL. She has no seizures. In addition to stopping the hydrochlorothiazide, which of the following is the most important principle of her management?", "choices": ["Limit the rise in serum sodium to no more than 8 mEq/L in 24 hours and correct the hypokalaemia concurrently", "Give intravenous furosemide to promote free water excretion", "Correct the sodium to 130 mEq/L within the first 12 hours using 3 percent saline", "Start tolvaptan immediately to achieve rapid aquaresis", "Restrict fluid to 500 mL per day and avoid any intravenous sodium"], "answer": 0, "explain": "กลไกของ thiazide-induced hyponatraemia (ต่างจาก loop diuretic อย่างสำคัญ):\n- **Thiazide ออกฤทธิ์ที่ distal convoluted tubule ยับยั้ง NCC (Na-Cl cotransporter)** ซึ่งอยู่ **นอก** ส่วนที่สร้าง medullary concentration gradient\n- ดังนั้น thiazide **ทำให้เสีย Na แต่ \"ไม่\" ทำลายความสามารถในการทำให้ปัสสาวะเข้มข้น** (concentrating ability คงอยู่) → เมื่อผู้ป่วยดื่มน้ำ ไตยังเก็บน้ำได้ → **Na เจือจางลงมาก**\n- (ตรงข้ามกับ **loop diuretic** ที่ยับยั้ง NKCC2 ที่ thick ascending limb → ทำลาย countercurrent multiplier → ปัสสาวะเจือจาง → **เกิด hyponatraemia น้อยกว่า**)\n- เสริมด้วย **volume depletion เล็กน้อย → กระตุ้น ADH**, **hypokalaemia ทำให้ Na เคลื่อนเข้าเซลล์แลกกับ K** และผู้สูงอายุหญิงน้ำหนักน้อยมีความเสี่ยงสูงสุด\n\n**หัวใจของข้อนี้คือ \"ความเร็วในการแก้\"**: ผู้ป่วยมี **Na 108 แบบเรื้อรัง (เป็นมา 6 เดือนบนยา) + hypokalaemia + ผู้สูงอายุ** = **ความเสี่ยงสูงสุดของ osmotic demyelination syndrome (ODS)**\n\n**พยาธิกำเนิดของ ODS**: ในภาวะ hyponatraemia เรื้อรัง เซลล์สมอง **ขับ organic osmolyte (myo-inositol, taurine, glutamate) ออกเพื่อปรับตัว (adaptation)** ไม่ให้บวม — เมื่อ Na ภายนอกถูกยกขึ้นเร็ว เซลล์ **ไม่สามารถดึง osmolyte กลับเข้ามาทัน (ใช้เวลาหลายวัน)** → น้ำไหลออกจากเซลล์อย่างรวดเร็ว → **oligodendrocyte ตาย เกิด demyelination ที่ pons (central pontine myelinolysis) และนอก pons** → อาการเกิดช้า 2-6 วันหลังแก้: **dysarthria, dysphagia, quadriparesis, \"locked-in syndrome\", พฤติกรรมเปลี่ยน, ชัก** และมัก **ถาวร**\n\n**หลักการจัดการที่ถูกต้อง**\n1. **หยุด thiazide**\n2. **จำกัดการขึ้นของ Na ไม่เกิน 8 mEq/L ใน 24 ชั่วโมง** (ในกลุ่มความเสี่ยงสูงอาจใช้ ≤6) และไม่เกิน 18 mEq/L ใน 48 ชั่วโมง\n3. **แก้ hypokalaemia ไปพร้อมกัน** — สำคัญมากเพราะ (ก) hypokalaemia เองเป็นปัจจัยเสี่ยงของ ODS (ข) **การให้ KCl จะทำให้ Na ขึ้นเองด้วย** (K ที่เข้าเซลล์แลกกับ Na ที่ออกมา) จึงต้อง **นับ KCl เป็นส่วนหนึ่งของ \"effective osmole\" ที่จะดัน Na ขึ้น** มิฉะนั้นจะแก้เกินโดยไม่รู้ตัว\n4. **ตรวจ Na ซ้ำทุก 2-4 ชั่วโมงในช่วงแรก** และเตรียม **5% dextrose ± desmopressin (DDAVP clamp)** ไว้ลดความเร็วถ้าขึ้นเร็วเกิน\n5. ให้ **isotonic saline อย่างระมัดระวัง** เมื่อมี volume depletion — และระวัง **water diuresis ที่จะเกิดทันทีเมื่อ volume กลับมาปกติ** ซึ่งเป็นกลไกที่ทำให้ \"แก้เกิน\" บ่อยที่สุด\n\nทำไมข้ออื่นผิด:\n- **แก้ถึง 130 ใน 12 ชั่วโมงด้วย 3% saline**: เป็นการขึ้น 22 mEq/L ใน 12 ชั่วโมง = **เกินขีดอย่างมหาศาล → ODS แน่นอน**; 3% saline ใช้เฉพาะเมื่อมี **อาการรุนแรง (ชัก/โคม่า)** และให้เป็น bolus เล็กเพื่อยกเพียง 4-6 mEq/L เท่าที่อาการดีขึ้น\n- **จำกัดน้ำ 500 mL และห้ามให้ Na ทางหลอดเลือด**: ผู้ป่วยมีแนวโน้ม volume depleted — การจำกัดน้ำรุนแรงโดยไม่ให้เกลือจะทำให้ perfusion แย่และไม่แก้ปัญหา total body Na ที่ขาด\n- **Furosemide**: มีที่ใช้ร่วมกับเกลือใน SIADH ที่ดื้อ แต่ในผู้ป่วยที่เสีย Na จาก diuretic อยู่แล้วและมี **hypokalaemia** การให้ loop diuretic จะ **ซ้ำเติมทั้ง volume และ K**\n- **Tolvaptan ทันที**: ทำให้เกิด aquaresis อย่างแรงและ **ควบคุมความเร็วยาก → เสี่ยง overcorrection และ ODS สูง**; ยังมี hepatotoxicity และห้ามใช้ใน hypovolaemia", "pearl": "ถ้าแก้ Na เกินขีดไปแล้ว ให้ **\"ถอยกลับ\"** ทันทีด้วย **5% dextrose IV และ desmopressin** เพื่อดึง Na ลงมาในเป้า — การรู้เรื่องนี้เป็นจุดที่แยกระดับความเข้าใจในข้อสอบ MEQ", "topic": "Thiazide-induced hyponatraemia and the risk of overcorrection", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (CVS ข้อ 3) – Hypertension มาด้วยซึม อ่อนแรง on thiazide, Na 105 management (choice: Switch thiazide to enalapril, Na tap lifelong)", "MED33 MCQ – Na ต่ำให้ NSS หรือ 3%", "MED32 MCQ ข้อ 81 – Na 120 กว่าๆ (ต่ำ), K 5.8 (สูง) จะทำอะไรต่อ → 0.9% NSS load", "MED31 MCQ ข้อ 32 – ผู้ป่วยมีแลป Na 100 กว่า Cl 70 กว่า BUN Cr สูง ควรให้อะไร", "MED34 MCQ ครั้งที่ 4 ข้อ 17 – แก้ hyponatremia ด้วย 3% NaCl แล้วคนไข้ชัก เกิดจากอะไร", "MED32 MCQ ข้อ 53 – drug induced lupus : hydrochlorothiazide (ตัวอย่างผลข้างเคียงของ thiazide ที่ออกสอบ)"], "nl": ["B9.2.5(2)", "B9.4(1)"]}, {"id": "N-OLD-054", "kind": "old", "stem": "A patient has Na 114 mEq/L and K 4.1 mEq/L. Which treatment is NOT indicated?", "choices": ["Assessment of volume status", "Isotonic saline if hypovolaemic", "Measurement of urine osmolality", "Fluid restriction if SIADH is confirmed", "Potassium supplementation"], "answer": 4, "explain": "**โพแทสเซียม 4.1 คือค่าปกติ จึงไม่มีข้อบ่งชี้ให้เสริม** — และการให้โพแทสเซียมในผู้ที่โซเดียมต่ำมีผลเพิ่มโซเดียมในเลือดด้วย (ตามสมการ Adrogue-Madias โพแทสเซียมนับรวมเป็น osmole ที่ใช้แก้) จึงอาจทำให้แก้เร็วเกินโดยไม่ตั้งใจ", "pearl": "", "topic": "", "src": "MED35 FA MCQ ข้อ 17", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)"]}, {"id": "N-OLD-056", "kind": "old", "stem": "A patient with chronic hyponatraemia corrected rapidly with 3% saline develops dysarthria, quadriparesis and impaired consciousness several days later. What is the diagnosis?", "choices": ["Hepatic encephalopathy", "Wernicke encephalopathy", "Subarachnoid haemorrhage", "Cerebral oedema", "Osmotic demyelination syndrome"], "answer": 4, "explain": "**Osmotic demyelination (central pontine myelinolysis)** เกิดเมื่อแก้โซเดียมเรื้อรังเร็วเกินไป — สมองที่ปรับตัวแล้วสูญเสีย osmolyte จึงหดตัวและเยื่อไมอีลินถูกทำลาย อาการมักปรากฏ **2-6 วันหลังแก้** และอาจถาวร; กลุ่มเสี่ยงสูงคือผู้ติดสุรา ขาดสารอาหาร ตับแข็ง โพแทสเซียมต่ำ — จำกัดการแก้ไม่เกิน 8 mEq/L/วัน", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 17", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(5)", "B9.4(2)"]}]}, {"id": "nephro-22-07", "title": "Hypernatremia — เสียน้ำมากกว่าเกลือ และคนที่ดื่มน้ำเองไม่ได้", "minutes": 9, "summary": "แยกด้วย urine osmolality · เบาจืดชนิดกลางกับชนิดไต · คำนวณ free water deficit และอัตราแก้", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี (สไลด์ส่วนนี้เป็นแผนภูมิภาพและจบด้วย 'To be continued' — เนื้อหาเรียบเรียงเพิ่มจากตำราที่อาจารย์อ้างอิงคือ Comprehensive Clinical Nephrology และ Brenner & Rector)", "nl": ["B9.2.5(2)", "B9.1.2(5)", "B9.1.2(8)"], "md": "> **หมายเหตุเรื่องที่มา** — สไลด์คาบนี้ลง hyponatremia ไว้ละเอียดมาก ส่วน **hypernatremia อาจารย์วางเป็นแผนภูมิภาพหน้าเดียวแล้วเขียนว่า \"To be continued\"** หัวข้อนี้จึงเรียบเรียงจากโครงแผนภูมิของอาจารย์ร่วมกับตำราที่อ้างในสไลด์ เพื่อให้ตอบข้อสอบของคาบนี้ได้ครบ\n\n### หลักการ\n**Hypernatremia แปลว่าขาดน้ำเทียบกับเกลือเสมอ** และเนื่องจาก **ความกระหายน้ำเป็นกลไกป้องกันที่ทรงพลังมาก** → **คนที่ดื่มน้ำเองได้และรู้สึกกระหายน้ำปกติ แทบไม่มีทางเกิด hypernatremia** ฉะนั้นเมื่อเจอโซเดียมสูง ให้ถามทันทีว่า **ทำไมผู้ป่วยถึงดื่มน้ำชดเชยไม่ได้**\n\n**กลุ่มเสี่ยงคือคนที่เข้าถึงน้ำไม่ได้หรือไม่รู้สึกกระหาย** — **ผู้สูงอายุ · ผู้ป่วยติดเตียง · ผู้ป่วยที่ใส่ท่อช่วยหายใจ · ทารก · ผู้ที่มีความผิดปกติของศูนย์กระหายน้ำ (adipsia)**\n\n### ไล่ด้วย urine osmolality\n\n| UOsm | แปลว่า | คิดถึง |\n|---|---|---|\n| **> 600 – 800 mOsm/kg** | **ไตทำงานถูกต้อง กำลังเก็บน้ำเต็มที่** | **เสียน้ำนอกไต** — เหงื่อ ไข้ หายใจเร็ว ท้องเสียจากออสโมติก **หรือได้โซเดียมเข้าไป** (NaHCO₃, 3% NaCl, น้ำเกลือไฮเปอร์โทนิก) |\n| **300 – 600** | ไตเก็บน้ำได้บางส่วน | **osmotic diuresis** — น้ำตาลสูง · ยูเรียสูง · mannitol · **หรือเบาจืดบางส่วน** |\n| **< 300 (โดยเฉพาะ < 150)** | **ไตขับน้ำทิ้งทั้งที่ควรเก็บ** | **Diabetes insipidus** |\n\n**แยกเบาจืดสองชนิดด้วยการให้ desmopressin**\n\n| | **Central DI** | **Nephrogenic DI** |\n|---|---|---|\n| ปัญหาอยู่ที่ | **ต่อมใต้สมองสร้าง ADH ไม่พอ** | **ไตไม่ตอบสนอง ADH** |\n| **UOsm หลังให้ desmopressin** | **เพิ่มขึ้นมากกว่า 50%** | **แทบไม่เปลี่ยน (< 10%)** |\n| สาเหตุ | บาดเจ็บศีรษะ · ผ่าตัดต่อมใต้สมอง · เนื้องอก · **Sheehan** · การแทรกซึม | **ลิเทียม** · **แคลเซียมสูง** · **โพแทสเซียมต่ำ** · ไตเรื้อรัง · ทางพันธุกรรม |\n| รักษา | **desmopressin** | **แก้ต้นเหตุ · อาหารเกลือต่ำ · thiazide ± amiloride (ในผู้ที่ใช้ลิเทียม) · NSAIDs** |\n\n> **จุดที่ข้อสอบชอบ** — **thiazide ใช้รักษา nephrogenic DI** ฟังดูย้อนแย้ง แต่กลไกคือ **ทำให้ปริมาตรพร่องเล็กน้อย → PCT ดูดน้ำและเกลือกลับมากขึ้น → สารน้ำที่ไปถึง collecting duct ลดลง → ปัสสาวะออกน้อยลง**\n\n### การรักษา\n**1 · แก้ปริมาตรก่อนถ้าช็อก** — ให้ **0.9% NSS** จนระบบไหลเวียนคงที่ แม้จะเป็นสารน้ำที่โซเดียมสูงก็ตาม **เพราะชีวิตสำคัญกว่าตัวเลขโซเดียม**\n\n**2 · คำนวณ free water deficit**\n```\nFree water deficit (L) = TBW × [ (Na ปัจจุบัน ÷ 140) − 1 ]\n```\nแล้ว **บวกน้ำที่ยังเสียต่อเนื่อง (ongoing loss) และ insensible loss ราว 1 ลิตรต่อวัน** เข้าไปด้วย\n\n**3 · อัตราการแก้ — ใช้หลักกลับด้านกับ hyponatremia**\n- **เฉียบพลัน (< 48 ชั่วโมง)** — แก้ได้เร็วกว่า **ราว 1 mEq/L/ชั่วโมง**\n- **เรื้อรังหรือไม่ทราบเวลา** — **ห้ามลดเกิน 10 – 12 mEq/L ต่อ 24 ชั่วโมง** (หลายแนวทางใช้ **0.5 mEq/L/ชั่วโมง**)\n- > **อันตรายของการแก้เร็วเกินคือ \"สมองบวม\"** — ตรงข้ามกับ hyponatremia ที่แก้เร็วแล้วสมองเหี่ยว · เพราะในภาวะโซเดียมสูงเรื้อรัง **เซลล์สมองสะสมออสโมลไว้แล้ว** ถ้าลดโซเดียมนอกเซลล์เร็วเกิน น้ำจะทะลักเข้าเซลล์ → **ชักและสมองบวม**\n\n**4 · เลือกสารน้ำ** — **น้ำเปล่าทางปากหรือทางสายให้อาหารดีที่สุดถ้าทำได้** · ถ้าให้ทางหลอดเลือดดำใช้ **D5W** หรือ **0.45% NaCl** (ครึ่งหนึ่งของ 0.45% NaCl นับเป็น free water)\n\n### กับดักที่คนพลาดจริง\n- **ผู้ป่วยติดเตียงที่ได้อาหารทางสายโดยไม่ได้ให้น้ำเปล่าตาม** เป็นสาเหตุของ hypernatremia ในโรงพยาบาลที่พบบ่อยที่สุด\n- **ต้องเจาะโซเดียมซ้ำทุก 4 – 6 ชั่วโมง** เหมือนกับ hyponatremia\n- **อย่าลืมน้ำที่ยังเสียต่อเนื่อง** — คำนวณแต่ deficit อย่างเดียวแล้วโซเดียมไม่ลงเพราะยังเสียน้ำอยู่\n- **แคลเซียมสูงและโพแทสเซียมต่ำทำให้เกิด nephrogenic DI ได้** จึงต้องตรวจสองค่านี้ในผู้ป่วยปัสสาวะมาก", "pearls": ["คนที่กระหายน้ำปกติและดื่มน้ำเองได้แทบไม่เกิด hypernatremia — เจอเมื่อไรให้ถามว่าทำไมดื่มน้ำไม่ได้", "UOsm มากกว่า 600–800 = เสียน้ำนอกไตหรือได้เกลือเข้าไป · น้อยกว่า 300 = diabetes insipidus", "ให้ desmopressin แล้ว UOsm ขึ้นเกิน 50% = central DI · แทบไม่ขึ้น = nephrogenic DI", "Free water deficit = TBW × (Na ÷ 140 − 1) แล้วบวกน้ำที่ยังเสียต่อเนื่อง", "เรื้อรังห้ามลดโซเดียมเกิน 10–12 mEq/L ต่อวัน มิฉะนั้นสมองบวม (กลับด้านกับ ODS)", "Thiazide รักษา nephrogenic DI ได้เพราะทำให้ปริมาตรพร่องเล็กน้อยจนสารน้ำถึง collecting duct น้อยลง"], "items": [{"id": "NEPHRO-22-07-Q1", "kind": "own", "stem": "An 80-year-old bedbound man with advanced dementia receives nasogastric tube feeds without additional free water. Over 5 days he becomes lethargic. Sodium is 166 mEq/L, plasma osmolality 340 mOsm/kg, urine osmolality 780 mOsm/kg and urine output is 500 mL/day. Blood pressure is 118/70 mmHg. Which is the most appropriate management?", "choices": ["Give 3% hypertonic saline to correct the plasma osmolality toward normal", "Give rapid free water to normalise the sodium to 140 mEq/L within 6 hours", "Replace the free water deficit plus ongoing losses, lowering sodium by no more than 10 to 12 mEq/L per 24 hours", "Give intravenous furosemide to increase free water excretion", "Give desmopressin, because the concentrated urine indicates central diabetes insipidus"], "answer": 2, "explain": "**UOsm 780 mOsm/kg แสดงว่าไตตอบสนอง ADH ได้ถูกต้องและกำลังเก็บน้ำเต็มที่** — ปัญหาจึงไม่ได้อยู่ที่ไต แต่อยู่ที่ **ผู้ป่วยได้รับน้ำไม่พอ** (อาหารทางสายที่มีออสโมลสูงแต่ไม่มีน้ำเปล่าตาม ร่วมกับผู้ป่วยสมองเสื่อมที่บอกความกระหายน้ำไม่ได้) — **นี่คือสาเหตุ hypernatremia ในโรงพยาบาลที่พบบ่อยที่สุด**\n\n**การรักษาคือคำนวณ free water deficit = TBW × (Na ÷ 140 − 1) แล้วบวกน้ำที่ยังเสียต่อเนื่องและ insensible loss** ให้ทดแทนด้วยน้ำเปล่าทางสายให้อาหารหรือ D5W · **ภาวะนี้เป็นมา 5 วันจึงถือว่าเรื้อรัง ห้ามลดโซเดียมเกิน 10 – 12 mEq/L ต่อ 24 ชั่วโมง** เพราะเซลล์สมองสะสมออสโมลไว้แล้ว การลดเร็วเกินทำให้ **น้ำทะลักเข้าเซลล์จนสมองบวมและชัก**\n\n- **3% NaCl จะยิ่งเพิ่มโซเดียม** ซึ่งตรงข้ามกับสิ่งที่ต้องการโดยสิ้นเชิง\n- **Desmopressin ไม่มีที่ใช้** — UOsm ที่สูงถึง 780 พิสูจน์ว่า **ADH ทำงานอยู่แล้ว** ตรงข้ามกับเบาจืดซึ่ง UOsm จะต่ำกว่า 300\n- **แก้ให้ปกติภายใน 6 ชั่วโมง** คือการลดราว 26 mEq/L ในหกชั่วโมง ซึ่งเกินเพดานหลายเท่า → สมองบวม\n- **Furosemide ขับทั้งน้ำและเกลือ** ทำให้ปริมาตรพร่องลงอีกโดยไม่ได้แก้การขาดน้ำอิสระ", "pearl": "อาหารทางสายโดยไม่ให้น้ำเปล่าตามในผู้ป่วยติดเตียง = hypernatremia ในโรงพยาบาล — แก้ด้วย free water และลดโซเดียมไม่เกิน 10–12 mEq/L ต่อวัน", "topic": "Hypernatremia — เสียน้ำมากกว่าเกลือ และคนที่ดื่มน้ำเองไม่ได้", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)", "B9.1.2(5)"]}]}, {"id": "nephro-22-08", "title": "โพแทสเซียมและ hypokalemia", "minutes": 10, "summary": "98% อยู่ในเซลล์ · แยก shift ออกจากเสียจริง · ECG U wave · TPP และสาเหตุที่พบในไทย", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["2.2.15", "B9.2.5(2)", "3.1.12"], "md": "### สรีรวิทยาที่ต้องรู้ก่อน\n- **ประมาณ 98% ของโพแทสเซียมอยู่ในเซลล์ (ส่วนใหญ่ในกล้ามเนื้อลาย) มีเพียง 2% อยู่นอกเซลล์**\n- > **ผลที่ตามมา — ค่าในเลือดเปลี่ยนนิดเดียวสะท้อนการเปลี่ยนแปลงของคลังในร่างกายมหาศาล** และ **การขยับโพแทสเซียมเข้าออกเซลล์เพียงเล็กน้อยก็ทำให้ค่าในเลือดเปลี่ยนอย่างมาก** — นี่คือเหตุผลที่ต้องแยก **\"ย้ายเข้าเซลล์\" ออกจาก \"เสียไปจริง\"** ให้ได้ก่อนรักษา\n- **ไตขับโพแทสเซียมที่ principal cell ของ collecting duct** — **aldosterone เพิ่มการทำงานของ ENaC → โซเดียมเข้าเซลล์ → ลูเมนเป็นลบ → โพแทสเซียมถูกขับออกทาง ROMK** · ปัจจัยที่เพิ่มการขับ: **aldosterone สูง · สารน้ำและโซเดียมไหลผ่านมาก · ประจุลบที่ดูดกลับไม่ได้ (bicarbonate, ketone, penicillin ขนาดสูง)**\n\n### สาเหตุของ hypokalemia (K < 3.5 mEq/L) ตามที่อาจารย์จัดกลุ่ม\n\n**1 · Pseudohypokalemia** — **เม็ดเลือดขาวสูงมาก · ส่งตัวอย่างช้า · อุณหภูมิสูง** ทำให้เซลล์ดูดโพแทสเซียมเข้าไปในหลอด\n\n**2 · ย้ายเข้าเซลล์ (transcellular shift)**\n- **ภาวะเลือดเป็นด่าง**\n- **อินซูลิน** (รวมถึงหลังกินอาหารคาร์โบไฮเดรตสูง)\n- **ยากลุ่ม β₂-agonist** (salbutamol, terbutaline) และ **ภาวะเครียดที่ catecholamine สูง**\n- **Periodic paralysis** — **hypokalemic periodic paralysis** และ **thyrotoxic periodic paralysis**\n\n**3 · กินไม่พอ** — **อาหารคาร์โบไฮเดรตสูงแต่โปรตีนและผักต่ำ · อดอาหาร · กินดิน (clay ingestion)**\n\n**4 · เสียนอกไต** — **อาเจียน · ท้องเสีย · ยาระบาย · เหงื่อออกมาก**\n\n**5 · เสียทางไต** — **อาเจียน (ผ่านกลไก bicarbonaturia + hyperaldosteronism) · RTA · ยา · hyperaldosteronism · ภาวะที่ออกฤทธิ์คล้าย aldosterone**\n\n> **จุดที่คนสับสน — \"อาเจียน\" อยู่ทั้งสองกลุ่ม** เพราะโพแทสเซียมในน้ำย่อยกระเพาะมีน้อย · **กลไกหลักที่ทำให้โพแทสเซียมต่ำจากการอาเจียนคือทางไต** — เสียกรดไปทำให้เลือดเป็นด่าง **bicarbonate ที่ล้นออกมาในท่อไตเป็นประจูลบที่ดูดกลับไม่ได้** ประกอบกับ **ปริมาตรพร่องกระตุ้น aldosterone** ทั้งสองอย่างเร่งการขับโพแทสเซียม\n\n**สาเหตุที่พบบ่อยในไทยและออกสอบ**\n- **Thyrotoxic periodic paralysis (TPP)** — **ชายเอเชียอายุน้อย** อ่อนแรงกล้ามเนื้อต้นแขนต้นขาเฉียบพลัน **มักตื่นมาแล้วขยับไม่ได้ หรือหลังกินอาหารแป้งมากและออกกำลังหนัก** · **โพแทสเซียมรวมในร่างกายปกติ เป็นการย้ายเข้าเซลล์ล้วน ๆ** (ฮอร์โมนไทรอยด์เพิ่มการทำงานของ Na⁺-K⁺-ATPase) · **ต้องส่ง TSH และ free T4 ทุกราย** · **รักษาด้วยการเติมโพแทสเซียมอย่างระมัดระวังร่วมกับ propranolol และรักษาไทรอยด์เป็นพิษ** · **ระวังโพแทสเซียมเด้งสูงเกิน (rebound hyperkalemia) เมื่อยาหมดฤทธิ์และโพแทสเซียมไหลกลับออกจากเซลล์**\n- **Renal tubular acidosis ชนิดที่ 1 และ 2** — โพแทสเซียมต่ำร่วมกับ **normal anion gap metabolic acidosis**\n- **Leptospirosis** — **ทำลายท่อไตส่วนต้นจนเกิดการเสียโพแทสเซียมทางไต** ร่วมกับ **AKI ชนิดที่ปัสสาวะยังออก (non-oliguric)** · เป็นลักษณะเด่นที่ช่วยแยกจากสาเหตุอื่นในผู้ป่วยไข้จากเขตร้อน\n- **Amphotericin B** — ทำให้เกิด **distal RTA และเสียทั้งโพแทสเซียมและแมกนีเซียมทางไต**\n- **แมกนีเซียมต่ำ** — **โพแทสเซียมต่ำที่ดื้อการแก้** (ดูคาบ 05)\n\n### อาการ\n| ระบบ | อาการ |\n|---|---|\n| **หัวใจ** ⚠️ | **หัวใจเต้นผิดจังหวะ** · **ECG: ST ตก · T แบนหรือหัวกลับ · U wave เด่น · QU ยาว** · PAC, PVC · หัวใจเต้นช้าแบบ sinus หรือ junctional · **AV block · VT และ VF** · ความดันสูงขึ้น · **เสียชีวิตเฉียบพลัน** |\n| **กล้ามเนื้อ** | ตะคริว ปวดกล้ามเนื้อ ชา **กล้ามเนื้ออ่อนแรงต้นแขนต้นขา** · **อัมพาต** · **rhabdomyolysis** |\n| **ทางเดินอาหาร** | **ลำไส้อืด ท้องผูก** · ทำให้ hepatic encephalopathy แย่ลง |\n| **ไต** | **nephrogenic DI** (จึงปัสสาวะมาก) · **เมตะบอลิกแอลคาโลซิส** · กระเพาะปัสสาวะไม่บีบตัว · **hypokalemic nephropathy** |\n| **เมตะบอลิก** | น้ำตาลในเลือดสูงขึ้น (อินซูลินหลั่งลดลง) |\n| **การหายใจ** | **กล้ามเนื้อหายใจอ่อนแรงจนเกิดกรดจากการหายใจ** |\n\n> **ข้อสังเกตที่ออกสอบ — hypokalemia ออกอาการที่กล้ามเนื้อและหัวใจเป็นหลัก ไม่ค่อยทำให้ชักหรือซึม** ต่างจาก **โซเดียมต่ำ แคลเซียมต่ำ แมกนีเซียมต่ำ และน้ำตาลต่ำ ซึ่งทำให้ชักได้ทั้งหมด**\n\n### การรักษา — ตามกลไก\n| กลไก | ปริมาณที่ต้องเติม (ตามสไลด์) |\n|---|---|\n| **ย้ายเข้าเซลล์** | **60 – 120 mEq ทางปาก** — ระวังเด้งสูงเกิน |\n| **เสียนอกไต** | **100 – 300 mEq ทางปาก ± ทางหลอดเลือดดำ** |\n| **เสียทางไต** | **อาจต้องมากกว่า 300 mEq** |\n\n**หลักปฏิบัติ**\n- **ประมาณคร่าว ๆ: โพแทสเซียมในเลือดที่ต่ำลงทุก 1 mEq/L สะท้อนการพร่องราว 200 – 400 mEq**\n- **ให้ทางปากเป็นหลักเมื่อทำได้** เพราะปลอดภัยกว่า\n- **ทางหลอดเลือดดำส่วนปลาย ไม่ควรเกิน 10 mEq/ชั่วโมง และความเข้มข้นไม่เกิน 40 mEq/L** (เจ็บและทำให้หลอดเลือดอักเสบ) · **เกินกว่านี้ต้องให้ทางเส้นกลางพร้อมมอนิเตอร์คลื่นไฟฟ้าหัวใจ**\n- **แก้แมกนีเซียมพร้อมกันเสมอ**\n- **ห้ามผสมโพแทสเซียมในสารละลายที่มีน้ำตาล** ในระยะแก้เร่งด่วน เพราะน้ำตาลกระตุ้นอินซูลินซึ่งจะดันโพแทสเซียมเข้าเซลล์เพิ่ม", "pearls": ["98% ของโพแทสเซียมอยู่ในเซลล์ — ต้องแยก 'ย้ายเข้าเซลล์' ออกจาก 'เสียไปจริง' ก่อนรักษา", "ECG ของ hypokalemia: ST ตก · T แบนหรือหัวกลับ · U wave เด่น · QU ยาว", "ชายเอเชียอายุน้อย อ่อนแรงต้นแขนต้นขาหลังกินแป้งมาก K ต่ำมาก = thyrotoxic periodic paralysis ต้องส่ง TSH และ free T4", "TPP เป็นการย้ายเข้าเซลล์ล้วน ๆ โพแทสเซียมรวมปกติ จึงเสี่ยง rebound hyperkalemia ถ้าเติมมากเกิน", "อาเจียนทำให้ K ต่ำผ่านทางไตเป็นหลัก (bicarbonaturia + aldosterone) ไม่ใช่เพราะ K ในน้ำย่อย", "Leptospirosis ทำให้ K ต่ำจากท่อไตส่วนต้นเสียหาย ร่วมกับ AKI แบบปัสสาวะยังออก", "Hypokalemia ไม่ค่อยทำให้ชักหรือซึม ต่างจาก Na, Ca, Mg และน้ำตาลที่ต่ำ", "ให้ KCl ทางเส้นปลายไม่เกิน 10 mEq/ชม. และไม่เกิน 40 mEq/L — เกินกว่านี้ต้องเส้นกลางและมอนิเตอร์"], "items": [{"id": "N-MCQ-22", "kind": "mcq", "stem": "A 28-year-old Thai man is brought to the emergency department with sudden symmetrical weakness of both legs and proximal arms on waking. He had eaten a large carbohydrate-rich meal the night before. He reports 3 months of weight loss, heat intolerance and palpitations. Vital signs: PR 118/min, BP 138/72 mmHg. Examination shows motor power grade 2 proximally and grade 4 distally, normal sensation and normal sphincter tone with depressed deep tendon reflexes. Laboratory results: potassium 1.9 mEq/L, magnesium 2.0 mg/dL, phosphate 1.8 mg/dL, bicarbonate 24 mEq/L, spot urine potassium 8 mEq/L, TSH less than 0.01 mIU/L with elevated free T3 and free T4. Which of the following best explains his hypokalaemia?", "choices": ["Total body potassium depletion from poor dietary intake", "Transcellular shift of potassium into cells driven by increased Na-K ATPase activity", "Renal potassium wasting from mineralocorticoid excess", "Gastrointestinal potassium loss from occult diarrhoea", "Distal renal tubular acidosis with renal potassium loss"], "answer": 1, "explain": "กลไก: **thyrotoxic periodic paralysis (TPP)** — พบมากในชายเอเชีย (ไทย จีน ญี่ปุ่น) อายุ 20-40 ปี ซึ่งเป็นเหตุผลว่าทำไมข้อสอบไทยออกซ้ำ\n\n**สรีรวิทยา**: thyroid hormone **เพิ่มจำนวนและการทำงานของ Na-K ATPase** ที่เยื่อหุ้มเซลล์กล้ามเนื้อโดยตรง และยังเพิ่มความไวต่อ **β-adrenergic stimulation และ insulin** → ปั๊ม K จากเลือดเข้าเซลล์อย่างมหาศาล\n- **ตัวกระตุ้นที่พบบ่อย**: **อาหารคาร์โบไฮเดรตสูง (insulin หลั่ง → shift K เข้าเซลล์)**, การออกกำลังกายหนักแล้วพัก, ความเครียด, การได้รับ glucose/insulin, steroid, β-agonist — ตรงกับโจทย์ที่กินอาหารแป้งมื้อใหญ่ตอนกลางคืนแล้วตื่นมาอ่อนแรง\n- อาการ: **อ่อนแรง proximal มากกว่า distal, symmetrical, sensory และ sphincter ปกติ, DTR ลดลง** — กล้ามเนื้อหายใจและ bulbar มักไม่ถูกกระทบแต่เกิดได้ในรายรุนแรง\n\n**หลักฐานว่าเป็น \"shift\" ไม่ใช่ \"ขาดจริง\" (total body deficit)** — จุดตัดสินของข้อนี้:\n1. **Spot urine K ต่ำ (8 mEq/L)** → ไตไม่ได้ทิ้ง K (ถ้าเป็น renal loss จะสูง)\n2. **ไม่มี metabolic alkalosis หรือ acidosis** (HCO3 24 ปกติ) → ตัด vomiting, diuretic, RTA, hyperaldosteronism\n3. มี **hypophosphataemia ร่วม** — เป็น marker คลาสสิกของ intracellular shift (PO4 เข้าเซลล์พร้อม K)\n4. มีภาวะ **thyrotoxicosis ชัดเจน**\n\n**ความสำคัญทางการรักษา (นี่คือเหตุผลที่ต้องแยกให้ออก)**\n- เนื่องจาก **K ทั้งตัวไม่ได้ขาด เพียงแต่ย้ายที่** → การให้ KCl ปริมาณมากเกินจะทำให้เกิด **rebound hyperkalaemia** เมื่อ K ไหลกลับออกจากเซลล์ → **arrhythmia**\n- จึงให้ **KCl ขนาดระมัดระวัง (เช่น 10 mEq/hr) พร้อม monitor ECG และ K บ่อยๆ**\n- **ห้ามให้ glucose-containing fluid** เพราะจะกระตุ้น insulin → shift K เข้าเซลล์มากขึ้น (จุดพลาดที่พบบ่อย)\n- **ยาที่ตรงกลไกที่สุดคือ non-selective β-blocker (propranolol ขนาดสูง)** ซึ่งยับยั้ง β-mediated Na-K ATPase activation → หยุดการ shift และช่วยอาการ thyrotoxic ด้วย\n- **การรักษาที่แท้จริงคือรักษา thyrotoxicosis** (thionamide ± definitive therapy) — ถ้าควบคุมไทรอยด์ได้ อัมพาตจะไม่กลับมาอีก\n\nทำไมข้ออื่นผิด:\n- **Mineralocorticoid excess**: จะมี **hypertension ชัดเจน + metabolic alkalosis + urine K สูง** (hyperaldosteronism, Cushing, liquorice) — โจทย์ urine K ต่ำและ HCO3 ปกติ\n- **GI loss จากท้องเสีย**: จะมี **normal anion gap metabolic acidosis (HCO3 ต่ำ)** และประวัติถ่ายเหลว — ไม่มีในโจทย์\n- **ขาดจากอาหาร**: ไตปรับลดการขับ K ได้ดีมาก การขาดจากอาหารลำพังแทบไม่ทำให้ K ต่ำถึง 1.9 และไม่เกิดเฉียบพลันข้ามคืน\n- **Distal RTA**: จะมี **normal anion gap metabolic acidosis, urine pH สูงไม่เหมาะสม (>5.5), urine K สูง** และมักมีนิ่ว/nephrocalcinosis — HCO3 ในโจทย์ปกติ", "pearl": "แยก TPP จาก **familial hypokalaemic periodic paralysis** ด้วย **ภาวะไทรอยด์** (TPP มี thyrotoxicosis, มักไม่มีประวัติครอบครัว, เกิดในวัยผู้ใหญ่) — ข้อสอบเก่าถามตรงๆว่า \"main mechanism of hypokalemia in hyperthyroidism\" → **K shift**", "topic": "Thyrotoxic periodic paralysis – transcellular potassium shift", "src": "", "ref": ["MED33 MCQ ข้อ 88 – Main mechanism of hypokalemia in hyperthyroidism → K shift", "MED33 MCQ – K ต่ำ thyroid สูง : K shift", "MED32 MEQ – แปลผล: TSH ต่ำ, Hypokalemia → วินิจฉัย muscle weakness from hypokalemia, subclinical hyperthyroidism", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 21 – HypoK กลับจาก party อย่างอื่นปกติหมด หายพอให้ KCl ถาม cause", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 67 – T3 ต่ำ T4 normal TSH ต่ำ K ต่ำ (1.9) management ไงดี", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 36 – Electrolyte ตัวไหนที่ไม่ทำให้ชัก → hypoK", "MED31 MCQ ข้อ 54 / MED30 – Ans hypokalemia"], "nl": ["B9.1.2(4)", "B9.2.5(2)"]}, {"id": "N-OLD-060", "kind": "old", "stem": "What is the main mechanism of hypokalaemia in thyrotoxic periodic paralysis?", "choices": ["Transcellular shift of potassium into cells driven by increased Na-K-ATPase activity", "Gastrointestinal potassium loss", "Redistribution from metabolic acidosis", "Renal potassium wasting", "Inadequate dietary intake"], "answer": 0, "explain": "**Thyroid hormone เพิ่มจำนวนและการทำงานของ Na-K-ATPase และเพิ่มความไวต่อ beta-adrenergic** ทำให้โพแทสเซียมเคลื่อนเข้าเซลล์ — โพแทสเซียมรวมในร่างกายยังปกติ จึงต้อง **ให้ทดแทนอย่างระมัดระวังเพราะเสี่ยง rebound hyperkalaemia** และให้ **non-selective beta-blocker (propranolol)** ซึ่งแก้กลไกได้ตรงที่สุด", "pearl": "", "topic": "", "src": "MED33 MCQ ข้อ 88", "ref": [], "nl": ["B9.1.2(4)", "B9.2.5(2)", "2.3.4"]}, {"id": "N-OLD-061", "kind": "old", "stem": "A young Asian man wakes with proximal muscle weakness. K 1.9 mEq/L, TSH suppressed with high free T4. What is the management?", "choices": ["Insulin and glucose infusion", "Careful potassium replacement with propranolol and definitive treatment of thyrotoxicosis", "Salbutamol nebulisation", "Sodium bicarbonate infusion", "Aggressive high-dose potassium infusion until potassium exceeds 5"], "answer": 1, "explain": "**Thyrotoxic periodic paralysis** — ชายเอเชียวัยหนุ่ม อ่อนแรงหลังกินอาหารแป้งสูงหรือออกกำลังกาย; ให้โพแทสเซียมอย่างระมัดระวัง (มักตอบสนองเร็วเมื่อได้เพียงเล็กน้อย) ร่วมกับ **propranolol ซึ่งหยุดการเคลื่อนเข้าเซลล์**; **ห้ามให้ insulin/glucose หรือ salbutamol เพราะจะยิ่งดันโพแทสเซียมเข้าเซลล์**", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 67", "ref": [], "nl": ["B9.2.5(2)", "2.3.4", "B9.4(2)"]}, {"id": "N-OLD-062", "kind": "old", "stem": "A young man develops transient weakness with K 2.6 mEq/L after a large carbohydrate meal and alcohol at a party, with normal acid-base status and rapid recovery after potassium replacement. What is the mechanism?", "choices": ["Gastrointestinal loss from diarrhoea", "Renal potassium wasting from hyperaldosteronism", "Transcellular potassium shift driven by insulin and catecholamines", "Diuretic abuse", "Renal tubular acidosis type 1"], "answer": 2, "explain": "อาหารคาร์โบไฮเดรตสูงกระตุ้นอินซูลิน และแอลกอฮอล์/ความเครียดกระตุ้น catecholamine — ทั้งสองดันโพแทสเซียมเข้าเซลล์; เบาะแสที่บ่งว่าเป็นการ shift ไม่ใช่การเสียจริงคือ **หายเร็วเมื่อได้โพแทสเซียมเพียงเล็กน้อยและกรด-ด่างปกติ** (ถ้าเสียทางไตจะมี urine K สูงต่อเนื่อง)", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 21", "ref": [], "nl": ["B9.1.2(4)", "B9.2.5(2)"]}, {"id": "N-OLD-067", "kind": "old", "stem": "By which mechanism does leptospirosis cause hypokalaemia?", "choices": ["Redistribution from alkalosis alone", "Transcellular shift into cells", "Renal potassium wasting from tubular dysfunction (impaired sodium reabsorption in the proximal tubule)", "Poor dietary intake", "Gastrointestinal loss"], "answer": 2, "explain": "**Leptospirosis ทำให้เกิด non-oliguric AKI ที่มีลักษณะเฉพาะคือโพแทสเซียมต่ำ** จากการที่เชื้อรบกวนการดูดกลับโซเดียมที่ท่อไตส่วนต้น ทำให้โซเดียมไปถึงท่อส่วนปลายมากและแลกกับการขับโพแทสเซียมทิ้ง — เป็นเบาะแสช่วยแยกจากไตวายสาเหตุอื่นที่มักโพแทสเซียมสูง", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (ID ข้อ 6)", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(3)", "2.3.1"]}, {"id": "N-OLD-070", "kind": "old", "stem": "Which ECG change is characteristic of hypokalaemia?", "choices": ["Delta waves", "Tall peaked T waves", "Short QT interval", "Electrical alternans", "Flattened T waves with prominent U waves and ST depression"], "answer": 4, "explain": "**Hypokalaemia: T แบน, U wave เด่น, ST ยุบ และ QT ดูยาวขึ้น (จริง ๆ คือ QU)** เสี่ยงต่อ ventricular arrhythmia โดยเฉพาะเมื่อใช้ digoxin ร่วมด้วย; จำคู่กับ **hyperkalaemia = T แหลมสูง** และ **hypocalcaemia = QT ยาว**", "pearl": "", "topic": "", "src": "MED35 Formative SAQ ข้อ 5 / MED30 SAQ ข้อ 2", "ref": [], "nl": ["3.1.12", "B9.2.5(2)"]}, {"id": "N-OLD-071", "kind": "old", "stem": "A patient has proximal muscle weakness with K 2.4 mEq/L and a suppressed TSH. What is the complete diagnosis?", "choices": ["Hypothyroid myopathy", "Hypokalaemic muscle weakness from thyrotoxicosis (thyrotoxic periodic paralysis)", "Polymyositis", "Myasthenia gravis", "Guillain-Barre syndrome"], "answer": 1, "explain": "**อ่อนแรงส่วนต้น + โพแทสเซียมต่ำ + TSH ถูกกด = thyrotoxic periodic paralysis**; รักษาภาวะเฉียบพลันด้วยโพแทสเซียมขนาดน้อยและ propranolol แล้ว **รักษาไทรอยด์ให้หายขาดจึงจะไม่กลับเป็นซ้ำ**", "pearl": "", "topic": "", "src": "MED32 MEQ", "ref": [], "nl": ["B9.2.5(2)", "2.3.4", "2.1.22"]}]}, {"id": "nephro-22-09", "title": "Hyperkalemia — ลำดับการรักษาที่ห้ามสลับ", "minutes": 10, "summary": "แคลเซียมป้องกันหัวใจก่อน → ดันเข้าเซลล์ → เอาออกจากร่างกาย · และยาที่ไม่ได้ลดโพแทสเซียมเลย", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี (สไลด์ส่วน hyperkalemia เป็นภาพ ECG และจบด้วย 'To be continued' — เนื้อหาเรียบเรียงเพิ่มจากตำราที่อาจารย์อ้างอิงคือ Brenner & Rector และ Goldman-Cecil Medicine)", "nl": ["2.2.15", "B9.2.5(2)", "3.1.12"], "md": "> **หมายเหตุเรื่องที่มา** — สไลด์ของคาบนี้จบที่ hypokalemia แล้วเขียนว่า **\"Next topic... To be continued\"** โดยมีภาพ ECG ของ hyperkalemia ไว้เทียบ · หัวข้อนี้จึงเรียบเรียงจากตำราที่อาจารย์อ้างอิง เพื่อให้ครอบคลุมข้อสอบของคาบนี้\n\n### สาเหตุ — ไล่สามกลุ่มเสมอ\n\n**1 · Pseudohyperkalemia — ต้องตัดออกก่อนถ้าผู้ป่วยไม่มีอาการและ ECG ปกติ**\n- **รัดสายรัดแขนนานหรือกำมือซ้ำ ๆ ขณะเจาะ** · **เม็ดเลือดแดงแตกในหลอด (hemolysis)** · **เกล็ดเลือดสูงมากกว่า 500,000 หรือเม็ดเลือดขาวสูงมากกว่า 100,000**\n- **ยืนยันด้วยการเจาะซ้ำแบบไม่รัดแขนและส่งเป็น plasma (หลอดเฮพาริน) แทน serum**\n\n**2 · ย้ายออกจากเซลล์**\n- **ภาวะเลือดเป็นกรดชนิด non-organic** (โดยเฉพาะ mineral acid) · **ขาดอินซูลินและน้ำตาลสูง (DKA, HHS)**\n- **ยากลุ่ม β-blocker โดยเฉพาะชนิดไม่จำเพาะ** · **digoxin เป็นพิษ** (ยับยั้ง Na⁺-K⁺-ATPase)\n- **เนื้อเยื่อสลาย** — **tumor lysis · rhabdomyolysis · แผลไฟไหม้ · เลือดออกในทางเดินอาหาร**\n- **Succinylcholine** · **hyperkalemic periodic paralysis** (อ่อนแรงเป็นพัก ๆ หลังมื้ออาหารหรือหลังพักจากการออกกำลัง โดยที่ไตปกติ)\n\n**3 · ขับออกทางไตได้น้อยลง — พบบ่อยที่สุด**\n- **ไตวายเฉียบพลันและเรื้อรัง** (โดยเฉพาะ **GFR < 20 – 30**)\n- **ยา** — **ACEI, ARB · spironolactone, eplerenone, amiloride, triamterene · NSAIDs · trimethoprim (ปิด ENaC เหมือน amiloride) · heparin (กด aldosterone) · calcineurin inhibitor**\n- **Hypoaldosteronism** — **Addison disease** · **type 4 RTA (hyporeninemic hypoaldosteronism)** ซึ่งพบบ่อยใน **เบาหวานที่มีโรคไต**\n\n> **โพแทสเซียมสูงที่รุนแรงมักเกิดจากหลายปัจจัยพร้อมกัน** — เช่น **ผู้ป่วย CKD ที่ได้ ACEI ร่วมกับ NSAIDs และขาดน้ำ** · เจอโพแทสเซียมสูงให้ **ทบทวนรายการยาทั้งหมดทุกครั้ง**\n\n### ECG — เรียงตามความรุนแรง\n| ระดับโดยประมาณ | ลักษณะ |\n|---|---|\n| **5.5 – 6.5** | **T สูงแหลม ฐานแคบ (peaked T)** โดยเฉพาะที่ลีด precordial |\n| **6.5 – 7.5** | **PR ยาว · P แบนลงจนหายไป** |\n| **7.0 – 8.0** | **QRS กว้างขึ้น** |\n| **> 8.0** | **QRS รวมกับ T เป็น sine wave → VF หรือ asystole** |\n\n> **คำเตือนที่สำคัญที่สุด — ECG ที่ปกติไม่ได้แปลว่าปลอดภัย** ผู้ป่วยบางรายโพแทสเซียมสูงมากโดย ECG แทบไม่เปลี่ยน แล้วเกิดหัวใจหยุดเต้นทันที · **ให้ตัดสินจากระดับโพแทสเซียม อัตราการเพิ่มขึ้น และบริบท ไม่ใช่รอให้ ECG ผิดปกติก่อน**\n\n### การรักษา — สามขั้นตามลำดับ ห้ามสลับ\n\n**ขั้นที่ 1 · ป้องกันหัวใจ (ทำทันทีเมื่อมี ECG เปลี่ยนแปลงหรือ K > 6.5)**\n- **10% calcium gluconate 10 – 20 mL IV ใน 2 – 3 นาที** (หรือ calcium chloride ทางเส้นกลาง)\n- **กลไก: ยกระดับ threshold potential ของเซลล์กล้ามเนื้อหัวใจให้ห่างจาก resting potential ที่ถูก depolarize ไว้ → เสถียรภาพกลับมา**\n- **ไม่ได้ลดระดับโพแทสเซียมแม้แต่น้อย** · ออกฤทธิ์ใน **1 – 3 นาที อยู่ได้ 30 – 60 นาที** · **ให้ซ้ำได้ถ้า ECG ยังผิดปกติ**\n- **ผู้ป่วยที่ได้ digoxin ให้ช้า ๆ เจือจางใน 20 – 30 นาที** เพราะแคลเซียมเสริมพิษ digoxin\n\n**ขั้นที่ 2 · ดันโพแทสเซียมเข้าเซลล์ (ชั่วคราว ซื้อเวลา)**\n| วิธี | ขนาด | เริ่มออกฤทธิ์ | ลด K ได้ |\n|---|---|---|---|\n| **อินซูลิน + กลูโคส** | **RI 10 units IV ร่วมกับ 50% glucose 50 mL** | 15 – 30 นาที | **0.5 – 1.2 mEq/L** |\n| **β₂-agonist พ่น** | **salbutamol 10 – 20 mg พ่น** (สูงกว่าขนาดรักษาหอบมาก) | 30 นาที | **0.5 – 1 mEq/L** |\n| **NaHCO₃** | เฉพาะเมื่อมี **metabolic acidosis** ร่วม | ช้า | **ไม่แนะนำให้ใช้เดี่ยว ๆ ได้ผลน้อย** |\n\n- **ต้องเจาะน้ำตาลติดตามหลังให้อินซูลิน** เพราะน้ำตาลต่ำเป็นภาวะแทรกซ้อนที่พบบ่อย โดยเฉพาะในผู้ป่วยไตเสื่อม\n\n**ขั้นที่ 3 · เอาโพแทสเซียมออกจากร่างกายจริง (ขั้นเดียวที่แก้ปัญหา)**\n- **ยาขับปัสสาวะกลุ่ม loop** — ใช้ได้เมื่อไตยังทำงานและปริมาตรพอ\n- **สารจับโพแทสเซียมในลำไส้** — **patiromer, sodium zirconium cyclosilicate** (ตัวหลังออกฤทธิ์ค่อนข้างเร็ว) · **sodium polystyrene sulfonate ออกฤทธิ์ช้าและมีรายงานลำไส้ตาย จึงไม่ใช้ในภาวะฉุกเฉิน**\n- **ฟอกเลือด** — **วิธีที่ได้ผลแน่นอนที่สุด** · ใช้เมื่อ **ไตวาย ไม่ตอบสนองการรักษา หรือมีการสลายเนื้อเยื่อต่อเนื่อง**\n- **หยุดยาที่เป็นต้นเหตุทุกตัว และงดอาหารโพแทสเซียมสูง**\n\n### กับดักที่คนพลาดจริง\n- **ให้อินซูลินหรือ salbutamol ก่อนแคลเซียมในผู้ป่วยที่ ECG ผิดปกติแล้ว** — ยาสองตัวนั้นใช้เวลา 15 – 30 นาที ซึ่งอาจไม่ทัน\n- **ให้แคลเซียมแล้วคิดว่าจบ** — แคลเซียมไม่ได้ลดโพแทสเซียมเลย ต้องมีขั้นที่ 2 และ 3 ตามเสมอ\n- **ยาที่ \"ไม่ได้ลดโพแทสเซียม\"** ที่ข้อสอบชอบถาม — **calcium gluconate (ป้องกันหัวใจเท่านั้น)** · **spironolactone, amiloride, triamterene (ทำให้สูงขึ้น)** · **ACEI/ARB, NSAIDs, trimethoprim, heparin, β-blocker (ทำให้สูงขึ้น)**\n- **ลืมว่าโพแทสเซียมจะเด้งกลับ** หลังฤทธิ์อินซูลินและ β-agonist หมด — **ต้องเจาะซ้ำที่ 2 – 4 ชั่วโมง** และวางแผนขั้นที่ 3 ไว้ล่วงหน้าเสมอ", "pearls": ["ลำดับห้ามสลับ: แคลเซียมป้องกันหัวใจ → อินซูลิน/กลูโคสกับ salbutamol ดันเข้าเซลล์ → loop diuretic, สารจับ หรือฟอกเลือดเอาออกจริง", "Calcium gluconate ไม่ได้ลดโพแทสเซียมเลย แค่ทำให้หัวใจเสถียร 30–60 นาที", "ECG ปกติไม่ได้แปลว่าปลอดภัย — หัวใจหยุดเต้นได้โดย ECG แทบไม่เปลี่ยน", "ECG เรียงตามระดับ: T สูงแหลม → P หาย PR ยาว → QRS กว้าง → sine wave", "อินซูลินกับ salbutamol ออกฤทธิ์ชั่วคราว ต้องเจาะซ้ำที่ 2–4 ชั่วโมงเพราะโพแทสเซียมจะเด้งกลับ", "ยาที่ทำให้โพแทสเซียมสูง: ACEI/ARB · spironolactone/amiloride/triamterene · NSAIDs · trimethoprim · heparin · β-blocker", "Type 4 RTA (hyporeninemic hypoaldosteronism) พบบ่อยในเบาหวานที่มีโรคไต"], "items": [{"id": "N-MCQ-23", "kind": "mcq", "stem": "A 64-year-old man with chronic kidney disease stage 4 presents with generalised weakness. He recently started ibuprofen for knee pain and takes enalapril and spironolactone. Vital signs: PR 48/min, BP 142/86 mmHg. Laboratory results: potassium 7.4 mEq/L, bicarbonate 17 mEq/L, creatinine 3.6 mg/dL. ECG shows tall peaked T waves, a widened QRS complex of 140 milliseconds and absent P waves. Which of the following should be given FIRST?", "choices": ["Nebulised salbutamol", "Regular insulin with intravenous dextrose", "Intravenous 10 percent calcium gluconate", "Oral sodium polystyrene sulfonate", "Urgent haemodialysis"], "answer": 2, "explain": "กลไกของพิษจาก hyperkalaemia: K ภายนอกเซลล์สูง → **resting membrane potential ของ cardiomyocyte ลดความเป็นลบลง (depolarise)** → Na channel จำนวนมาก **inactivate** → การนำไฟฟ้าช้าลงและ excitability ลด → ลำดับการเปลี่ยนบน ECG: **tall peaked T → PR ยาว → P wave หายไป → QRS กว้าง → sine wave → asystole/VF**\nผู้ป่วยรายนี้อยู่ในระยะ **อันตรายถึงชีวิต (QRS กว้าง + P หาย + bradycardia 48)**\n\n**ลำดับการรักษาต้องเรียงตาม \"สิ่งที่ช่วยชีวิตเร็วที่สุด\"**\n1. **Calcium gluconate IV (ให้ก่อนทุกอย่าง)** — **ไม่ได้ลดระดับ K เลย** แต่ **เพิ่ม threshold potential ของเซลล์กล้ามเนื้อหัวใจ** ทำให้ช่องว่างระหว่าง resting potential กับ threshold กลับมากขึ้น → **stabilise membrane และย้อน ECG change ได้ภายใน 1-3 นาที** ฤทธิ์อยู่ 30-60 นาที (ใช้ calcium chloride ในภาวะวิกฤตเพราะมี elemental Ca มากกว่า แต่ต้องให้ทางเส้นใหญ่)\n2. **Shift K เข้าเซลล์** (onset 15-30 นาที)\n   - **Regular insulin 10 units + 25-50 g dextrose** (กระตุ้น Na-K ATPase) — ลด K ได้ 0.5-1.2 mEq/L; ต้องตาม glucose เพราะ **hypoglycaemia เป็นผลข้างเคียงที่พบบ่อยและเกิดช้าได้ถึง 6 ชม.**\n   - **Nebulised salbutamol ขนาดสูง (10-20 mg)** (β2 กระตุ้น Na-K ATPase) — เสริมฤทธิ์กับ insulin; ประมาณ 20-40% ของผู้ป่วยไม่ตอบสนอง จึงไม่ใช้เดี่ยว\n   - **NaHCO3** มีประโยชน์จำกัด ใช้เมื่อมี **metabolic acidosis ร่วม** (ผู้ป่วยนี้ HCO3 17)\n3. **ขับ K ออกจากร่างกาย** (onset ช้าแต่เป็นการแก้ที่แท้จริง)\n   - **loop diuretic** ถ้ายังมี urine output\n   - **potassium binder: patiromer, sodium zirconium cyclosilicate (onset เร็วกว่าและปลอดภัยกว่า), sodium polystyrene sulfonate** (SPS ออกฤทธิ์ช้า หลักฐานจำกัด และสัมพันธ์กับ **colonic necrosis** โดยเฉพาะเมื่อใช้ร่วมกับ sorbitol)\n   - **Haemodialysis** = วิธีที่ได้ผลแน่นอนที่สุด ใช้เมื่อมี **CKD ระยะท้าย/AKI, K สูงรุนแรง หรือดื้อต่อการรักษา** (ผู้ป่วยรายนี้ CKD stage 4 + K 7.4 มีแนวโน้มต้องฟอก — แต่ต้องใช้เวลาเตรียม จึงไม่ใช่สิ่งที่ให้ \"ก่อน\")\n4. **หยุดและแก้ต้นเหตุ** — ในโจทย์ชัดเจน: **NSAID (ibuprofen) + ACEI (enalapril) + MRA (spironolactone)** คือสามประสานที่ทำให้เกิด hyperkalaemia และ AKI ในผู้ป่วย CKD (\"triple whammy\"); ต้องหยุดทั้งหมด จำกัด K ในอาหาร และทบทวน trimethoprim/heparin/β-blocker\n\nทำไมข้ออื่นไม่ใช่ \"อันดับแรก\":\n- **Insulin + dextrose / salbutamol**: จำเป็นแต่ **onset 15-30 นาที** ซึ่งนานเกินไปสำหรับหัวใจที่ QRS กว้างและ P หายแล้ว\n- **SPS oral**: ออกฤทธิ์เป็นชั่วโมง และไม่ใช่การรักษาภาวะฉุกเฉิน\n- **Haemodialysis**: เป็นการรักษาที่ดีที่สุดเชิง definitive แต่ต้องเตรียมสาย/เครื่อง — ระหว่างนั้นผู้ป่วยอาจ cardiac arrest ถ้าไม่ให้ calcium ก่อน\n\n**ข้อควรรู้เพิ่ม**: ถ้าผู้ป่วยกิน **digoxin** ต้องให้ calcium อย่างระมัดระวัง (เคยเชื่อว่าเสี่ยง \"stone heart\" — ปัจจุบันหลักฐานไม่หนัก แต่ยังควรให้ช้าๆ)", "pearl": "**Pseudohyperkalaemia** ต้องคัดก่อนลงมือในผู้ป่วยที่ไม่มี ECG เปลี่ยนและไม่มีเหตุ: เจาะยาก/รัดแขนนาน/กำมือ, haemolysis ในหลอด, **thrombocytosis หรือ leukocytosis รุนแรง** → ส่ง **plasma potassium** ซ้ำ", "topic": "Hyperkalaemia with ECG changes – order of treatment", "src": "", "ref": ["MED32 MCQ ข้อ 32 – EKG เจอ tall peak T-wave → 10% calcium gluconate, 7.5% NaHCO3", "MED34 ข้อสอบ MED ครั้งที่ 3 SAQ ข้อ 8 – คนไข้ CKD ได้ยา nephrotoxic 2 ตัว ให้รูป EKG แปลผล tall peak T → hyperkalemia", "MED31 MCQ ข้อ 35 – อะไรไม่ช่วย treat hyperkalemia", "MED31 MCQ ข้อ 26 – คนไข้ AML ไปทำ chemotherapy แล้ว hyperkalemia", "MED30 SAQ ข้อ 2 – Hyperkalemia", "MED28 MED421 ข้อ 28 – กินข้าวมื้อใหญ่แล้วอ่อนเพลีย → Hyperkalemia", "MED33 MEQ ข้อ 2 – Drug induced rhabdomyolysis with AKI complicated with hyperkalemia and hyperphosphatemia"], "nl": ["2.2.15", "B9.2.5(2)", "3.1.12"]}, {"id": "N-MCQ-24", "kind": "mcq", "stem": "A 70-year-old man with chronic kidney disease stage 4 has a serum potassium of 6.4 mEq/L without ECG changes. Which of the following measures would NOT help to lower his serum potassium?", "choices": ["Intravenous regular insulin with dextrose", "Sodium zirconium cyclosilicate", "Spironolactone", "Nebulised salbutamol at high dose", "Intravenous furosemide in a patient who still produces urine"], "answer": 2, "explain": "กลไกของแต่ละมาตรการ (จำเป็นตารางจะตอบได้ทุกรูปแบบคำถาม)\n\n| มาตรการ | กลไก | ผลต่อ K |\n|---|---|---|\n| **Spironolactone** | **MRA — บล็อก mineralocorticoid receptor ที่ collecting duct → ลด ENaC และ ROMK → ไตขับ K ได้น้อยลง** | **เพิ่ม K (ทำให้แย่ลง)** |\n| **SZC / patiromer / SPS** | จับ K ในลำไส้ ขับออกทางอุจจาระ | ลด (ขับออกจากร่างกาย) |\n| **Insulin + dextrose** | กระตุ้น Na-K ATPase → shift K เข้าเซลล์ | ลดชั่วคราว |\n| **Salbutamol ขนาดสูง** | β2 กระตุ้น Na-K ATPase → shift K เข้าเซลล์ | ลดชั่วคราว |\n| **Furosemide** | ยับยั้ง NKCC2 → Na ถึง distal มากขึ้น → เพิ่ม flow และ **เพิ่มการขับ K** | ลด (ขับออกจากร่างกาย) |\n\n→ **spironolactone เป็นยาที่ \"ทำให้ K สูงขึ้น\"** จึงเป็นคำตอบของข้อที่ถามว่า \"ไม่ช่วย\"\n\n**ยาและภาวะที่ต้องทบทวนทุกครั้งที่พบ hyperkalaemia** (ออกสอบเป็นข้อ \"ข้อใดไม่ช่วย/ข้อใดเป็นสาเหตุ\"):\n- **RAS blockade**: ACEI, ARB, aliskiren, **MRA (spironolactone, eplerenone)**\n- **K-sparing diuretic**: amiloride, triamterene\n- **NSAID** (ลด prostaglandin → ลด renin → ลด aldosterone และลด GFR)\n- **Trimethoprim และ pentamidine** (บล็อก ENaC คล้าย amiloride)\n- **Calcineurin inhibitor** (cyclosporine, tacrolimus)\n- **Heparin** (กดการสร้าง aldosterone)\n- **Non-selective β-blocker และ digoxin overdose** (ขัดการ shift K เข้าเซลล์)\n- **Potassium supplement, เกลือลดโซเดียม (potassium chloride substitute), น้ำผลไม้/ผลไม้สูง K**\n- ภาวะ: **CKD/AKI, hypoaldosteronism (รวม type 4 RTA ในเบาหวาน), adrenal insufficiency, tissue breakdown (rhabdomyolysis, tumour lysis, haemolysis, burn), metabolic acidosis, insulin deficiency**\n\n**ข้อควรระวังเรื่องความสมดุล**: RAS blockade และ MRA **ลด mortality ใน HFrEF และชะลอ CKD progression** จึงไม่ใช่ว่าต้องหยุดถาวรทุกครั้ง — แนวทางปัจจุบันให้ **ใช้ potassium binder ระยะยาว (patiromer/SZC) เพื่อให้คงยาที่ช่วยชีวิตไว้ได้** ร่วมกับการคุมอาหารและติดตาม K", "pearl": "ข้อสอบชอบถามกลับด้าน: \"ยาใดทำให้ K สูง\" → **ACEI/ARB, MRA, NSAID, trimethoprim, heparin, β-blocker, digoxin toxicity**; \"ยาใดทำให้ K ต่ำ\" → **thiazide, loop diuretic, insulin, β2-agonist, amphotericin B, steroid, laxative**", "topic": "Which measure does NOT lower serum potassium", "src": "", "ref": ["MED31 MCQ ข้อ 35 – อะไรไม่ช่วย treat hyperkalemia", "MED32 MCQ ข้อ 29 – creatinine rising หลังได้ diclofenac ยาอะไรให้ต่อได้ (diclofenac, metformin, ACEI)", "MED32 MCQ ข้อ 32 – EKG tall peak T → 10% calcium gluconate, 7.5% NaHCO3", "MED30 MCQ ข้อ 12 – Serum K 2.5 Type 2 DM → Primary adrenal insufficiency", "MED30 สรุป Renal – hyperkalemia : volume"], "nl": ["2.2.15", "B9.4(2)"]}, {"id": "N-OLD-064", "kind": "old", "stem": "An ECG shows tall peaked T waves in a patient with CKD. What is the first drug to give and why?", "choices": ["Sodium bicarbonate to shift potassium", "Intravenous calcium gluconate to stabilise the cardiac membrane", "Insulin with dextrose because it works fastest", "Oral potassium binder as first-line", "Furosemide as the only necessary treatment"], "answer": 1, "explain": "ลำดับการรักษา hyperkalaemia: **(1) คงเสถียรภาพเยื่อหุ้มเซลล์หัวใจด้วยแคลเซียม** (ออกฤทธิ์ใน 1-3 นาที ไม่ลดระดับโพแทสเซียม) **(2) ย้ายเข้าเซลล์** ด้วย insulin+glucose, salbutamol และ bicarbonate เมื่อมีภาวะเลือดเป็นกรด **(3) กำจัดออก** ด้วยยาจับโพแทสเซียม ยาขับปัสสาวะ หรือฟอกเลือด", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 32", "ref": [], "nl": ["2.2.15", "B9.2.5(2)", "3.1.12"]}, {"id": "N-OLD-065", "kind": "old", "stem": "Which drug does NOT lower serum potassium?", "choices": ["Furosemide", "Sodium polystyrene sulfonate", "Insulin with dextrose", "Salbutamol nebulisation", "Spironolactone"], "answer": 4, "explain": "**Spironolactone เป็น potassium-sparing diuretic จึงทำให้โพแทสเซียมสูงขึ้น** เช่นเดียวกับ ACEI/ARB, NSAID, trimethoprim, heparin และ beta-blocker; ยาที่ลดโพแทสเซียมคือกลุ่มที่ดันเข้าเซลล์และกลุ่มที่ขับออก", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 35", "ref": [], "nl": ["2.2.15", "B9.4(1)", "B9.4(2)"]}, {"id": "N-OLD-066", "kind": "old", "stem": "A patient develops episodic weakness after a large meal with K 6.2 mEq/L and normal renal function. What is the likely diagnosis?", "choices": ["Hyperkalaemic periodic paralysis", "Hypokalaemic periodic paralysis", "Thyrotoxic periodic paralysis", "Guillain-Barre syndrome", "Myasthenia gravis"], "answer": 0, "explain": "**Hyperkalaemic periodic paralysis** เป็นโรคทางพันธุกรรมของช่อง sodium (SCN4A) อาการอ่อนแรงเป็นพัก ๆ ถูกกระตุ้นด้วยการพัก หลังออกกำลังกาย อาหารที่มีโพแทสเซียมสูง หรือความเย็น; แก้ด้วยการกระตุ้นการเคลื่อนโพแทสเซียมเข้าเซลล์ (salbutamol, คาร์โบไฮเดรต) — ตรงข้ามกับ hypokalaemic form", "pearl": "", "topic": "", "src": "MED28 MED421 Medicine I ข้อ 28", "ref": [], "nl": ["B9.2.5(2)", "B9.1.2(4)", "2.1.22"]}, {"id": "N-OLD-069", "kind": "old", "stem": "A CKD patient on two nephrotoxic drugs has an ECG showing tall peaked T waves with sinus tachycardia and narrow QRS. What is the interpretation and immediate treatment?", "choices": ["Hypokalaemia — give potassium chloride", "Acute myocardial infarction — arrange PCI", "Hyperkalaemia — give intravenous calcium gluconate then insulin with dextrose", "Pericarditis — give NSAID", "Normal ECG — no treatment"], "answer": 2, "explain": "T สูงแหลมฐานแคบในผู้ป่วย CKD ที่ได้ยาที่เป็นพิษต่อไต (เช่น NSAID ร่วมกับ ACEI/ARB หรือ trimethoprim) = **hyperkalaemia** ให้แคลเซียมก่อนแล้วย้ายโพแทสเซียมเข้าเซลล์ พร้อม **หยุดยาต้นเหตุและจำกัดอาหารโพแทสเซียมสูง**", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 3 SAQ ข้อ 8", "ref": [], "nl": ["2.2.15", "3.1.12", "B9.2.7(2)"]}]}], "date": "พฤ. 1 ต.ค."}], "label": "Nephro", "thai": "ระบบไตและสมดุลเกลือแร่", "accent": {"light": "#14585f", "soft": "#e4eef0", "ink": "#0f464b", "dark": "#58b3b8", "darkSoft": "#10262a", "darkInk": "#8ad2d6"}}]</script>

/* ---------- tiny markdown (เหมือน drill.html) ---------- */
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(t){return esc(t)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");}
function md(src){
  var lines=String(src==null?"":src).split("\n"),out=[],i=0,para=[];
  function flushPara(){if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[];}}
  function flushTable(){
    var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
    if(!rows.length)return;
    var cells=rows.map(function(r){return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});});
    var hasSep=cells.length>1&&cells[1].every(function(c){return /^:?-{2,}:?$/.test(c);});
    var head=cells[0],body=hasSep?cells.slice(2):cells.slice(1);
    var h="<div class='tablewrap'><table><thead><tr>"+head.map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr></thead><tbody>";
    body.forEach(function(r){h+="<tr>"+r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>";});
    out.push(h+"</tbody></table></div>");
  }
  function flushList(ordered){
    var tag=ordered?"ol":"ul",items=[];
    while(i<lines.length){
      var m=ordered?lines[i].match(/^\s*\d+[.)]\s+(.*)$/):lines[i].match(/^\s*[-•]\s+(.*)$/);
      if(!m)break;
      var txt=m[1];i++;
      while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*[-•]\s/.test(lines[i])&&!/^\s*\d+[.)]\s/.test(lines[i])&&!/^\s*\|/.test(lines[i])){txt+=" "+lines[i].trim();i++;}
      items.push("<li>"+inline(txt)+"</li>");
    }
    out.push("<"+tag+">"+items.join("")+"</"+tag+">");
  }
  while(i<lines.length){
    var L=lines[i];
    if(/^\s*>\s?/.test(L)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      flushPara();out.push("<div class='callout'>"+md(q.join("\n"))+"</div>");continue;}
    if(/^\s*####\s+/.test(L)){flushPara();out.push("<h4>"+inline(L.replace(/^\s*####\s+/,""))+"</h4>");i++;continue;}
    if(/^\s*###\s+/.test(L)){flushPara();out.push("<h3>"+inline(L.replace(/^\s*###\s+/,""))+"</h3>");i++;continue;}
    if(/^\s*\|/.test(L)){flushPara();flushTable();continue;}
    if(/^\s*[-•]\s+/.test(L)){flushPara();flushList(false);continue;}
    if(/^\s*\d+[.)]\s+/.test(L)){flushPara();flushList(true);continue;}
    if(!L.trim()){flushPara();i++;continue;}
    para.push(L.trim());i++;
  }
  flushPara();return out.join("");
}

/* ---------- data helpers ---------- */
function course(){return COURSES.filter(function(c){return c.set===state.course;})[0]||COURSES[0];}
function lectures(){return course().lectures;}
function lecOf(id){return lectures().filter(function(l){return l.lec===id;})[0];}
function secOf(lec,id){return (lec?lec.sections:[]).filter(function(s){return s.id===id;})[0];}
function allSections(){var o=[];lectures().forEach(function(l){l.sections.forEach(function(s){o.push({lec:l,sec:s});});});return o;}
function secStat(sec){
  var n=sec.items.length,a=0,ok=0;
  sec.items.forEach(function(it){var v=state.ans[it.id];if(v!=null){a++;if(v===it.answer)ok++;}});
  return {n:n,answered:a,correct:ok,read:!!state.done[sec.id],
          complete:!!state.done[sec.id]&&(n===0||a===n)};
}
function courseProgress(){
  var all=allSections(),done=0;
  all.forEach(function(x){if(secStat(x.sec).complete)done++;});
  return {done:done,total:all.length,pct:all.length?Math.round(done*100/all.length):0};
}
function letter(i){return "ABCDE".charAt(i)||String(i+1);}
function nlChips(codes){
  if(!codes||!codes.length)return "";
  return codes.map(function(c){var e=NL[c];
    return "<span class='chip nl' title='"+esc(e?(e.section+" · หน้า "+e.page):"")+"'>NL "+esc(c)+(e?" · "+esc(e.title):"")+"</span>";}).join(" ");
}

function darkNow(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark")return true; if(t==="light")return false;
  try{return window.matchMedia("(prefers-color-scheme:dark)").matches;}catch(e){return false;}
}
function applyAccent(c){
  var a=c.accent||{},d=darkNow(),r=document.documentElement.style;
  var acc=d?a.dark:a.light, soft=d?a.darkSoft:a.soft, ink=d?a.darkInk:a.ink;
  if(acc)r.setProperty("--accent",acc); if(soft)r.setProperty("--accent-soft",soft);
  if(ink)r.setProperty("--accent-ink",ink);
}
function renderMast(){
  var c=course();
