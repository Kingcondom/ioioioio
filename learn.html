ตอนเช้าเป็นลักษณะของโรคไต** ต่างจากขาบวมเย็นๆของโรคหัวใจ), บวมมากขึ้นเร็วไหม, น้ำหนักเพิ่มกี่กิโลกรัม\n\n**ประวัติการติดเชื้อนำ (สำคัญที่สุดในข้อนี้)**\n- **เจ็บคอเมื่อไรแน่ ห่างจากปัสสาวะสีผิดปกติกี่วัน** (latent period 1-3 สัปดาห์สำหรับ pharyngitis, 3-6 สัปดาห์สำหรับ skin infection)\n- **มีแผลที่ผิวหนัง ตุ่มหนอง พุพอง (impetigo) หรือไม่**\n- ได้ยาปฏิชีวนะอะไร ครบไหม, มีคนในบ้านเจ็บคอพร้อมกันหรือไม่\n\n**อาการเพื่อแยกโรคอื่น**\n- **ปวดข้อ ผื่นแพ้แสง ผมร่วง แผลในปาก ตาแห้งปากแห้ง** (SLE/lupus nephritis)\n- **ไอเป็นเลือด เลือดกำเดา ไซนัสอักเสบเรื้อรัง หูอื้อ** (ANCA-associated vasculitis, anti-GBM/pulmonary-renal syndrome)\n- **ปัสสาวะเป็นเลือดพร้อมกับการติดเชื้อทางเดินหายใจทันที (1-3 วัน)** (IgA nephropathy — synpharyngitic)\n- ผื่นจุดเลือดที่ขา ปวดท้อง ปวดข้อ (IgA vasculitis/Henoch-Schönlein purpura)\n- ไข้เรื้อรัง น้ำหนักลด เสียงหัวใจผิดปกติ (infective endocarditis-associated GN)\n- ประวัติตับอักเสบบี/ซี, HIV, ซิฟิลิส, ใช้สารเสพติดทางหลอดเลือด\n\n**ประวัติอื่น**\n- **ประวัติความดันโลหิตสูงเดิม** (เพื่อแยกว่า HT นี้เพิ่งเกิดหรือเป็นมานาน), เคยตรวจปัสสาวะผิดปกติมาก่อนไหม\n- โรคประจำตัว เบาหวาน, ยาที่ใช้ (**NSAID ที่ซื้อกินเอง**, ยาสมุนไพร, ยาชุด), แพ้ยา\n- ประวัติครอบครัว: โรคไต, ไตวายต้องฟอกเลือด, หูหนวก (Alport syndrome), ปัสสาวะเป็นเลือด\n- สูบบุหรี่ ดื่มแอลกอฮอล์ อาชีพ"}, {"q": "2. จงระบุการตรวจร่างกายเพิ่มเติมที่สำคัญ", "a": "- **วัด BP ซ้ำด้วยวิธีมาตรฐานและวัดทั้งสองแขน (หรือ 4 extremities)** — ยืนยันระดับและคัด aortic pathology\n- **ตรวจ fundus อย่างละเอียด** — หา **hypertensive retinopathy (flame haemorrhage, cotton wool spot, papilledema)** เพื่อแยก hypertensive emergency และประเมินว่า HT เป็นเฉียบพลันหรือเรื้อรัง\n- **ประเมินสถานะสารน้ำให้ครบ**: JVP, ชั่งน้ำหนัก, periorbital/pretibial/presacral edema, ascites (shifting dullness, fluid thrill), ฟังปอดหา crepitation และ pleural effusion\n- **CVS**: PMI (ในโจทย์อยู่ที่ 6th ICS = cardiomegaly), S3/S4 gallop, murmur (คัด infective endocarditis), **pericardial friction rub** (uraemic pericarditis)\n- **Abdomen**: คลำไตและตับม้าม, **CVA tenderness**, คลำหา **bladder distension และกระเพาะปัสสาวะโป่ง**, ฟัง **abdominal/renal bruit** (renal artery stenosis)\n- **ผิวหนังและเยื่อเมือก**: **หาแผลติดเชื้อที่ผิวหนัง/impetigo ที่เป็นต้นเหตุ**, malar rash, photosensitivity, **palpable purpura ที่ขา (vasculitis)**, oral ulcer, alopecia, livedo reticularis\n- **ข้อ**: บวม แดง ร้อน กดเจ็บ (SLE, vasculitis)\n- **ต่อมน้ำเหลืองและต่อมทอนซิล**\n- **Neuro**: ระดับความรู้สึกตัว, focal deficit, ตรวจหา **hypertensive encephalopathy**"}, {"q": "3. จงเขียน Problem list", "a": "1. Acute occipital headache 3 hours\n2. **Severe hypertension (BP 180/106 mmHg) — newly recognised**\n3. **Gross haematuria (tea/cola-coloured urine) without frothiness 2 days**\n4. Oliguria (ปริมาณปัสสาวะลดลง)\n5. Periorbital puffiness with bilateral pitting oedema 1+ (mild volume overload)\n6. Recent pharyngitis 2 weeks ago (**latent period เข้ากับ post-infectious GN**)\n7. Cardiomegaly (PMI displaced to 6th ICS)\n8. Overweight (BMI 27 kg/m2)"}, {"q": "4. จง differential diagnosis 3 โรค พร้อมเหตุผล", "a": "1. **Acute post-streptococcal glomerulonephritis (APSGN)** — **น่าจะเป็นที่สุด**: latent period 2 สัปดาห์หลังเจ็บคอ, **nephritic picture** (gross haematuria ไม่มีฟอง + HT + oliguria + edema เล็กน้อย) ในผู้ใหญ่อายุน้อย\n2. **IgA nephropathy** — เป็น glomerulonephritis ที่พบบ่อยที่สุดทั่วโลก มาด้วย gross haematuria ได้; จุดแยกคือ **เกิด \"พร้อม\" การติดเชื้อทางเดินหายใจ (synpharyngitic, 1-3 วัน) ไม่ใช่หลัง 1-3 สัปดาห์** และ **complement ปกติ**\n3. **Lupus nephritis** — ต้องคัดในผู้ป่วยทุกรายที่มี nephritic syndrome; จะมี **C3 และ C4 ต่ำทั้งคู่**, ANA/anti-dsDNA positive และอาการหลายระบบ (ผื่น ปวดข้อ cytopenia)\n4. **Rapidly progressive glomerulonephritis (crescentic GN)** จาก ANCA-associated vasculitis หรือ anti-GBM disease — ต้องนึกถึงเสมอเพราะ **ถ้าพลาดจะเสียไตถาวรใน 2-3 สัปดาห์**; จะมี Cr ขึ้นเร็วต่อเนื่องและอาการปอด/ไซนัสร่วม\n5. **Membranoproliferative glomerulonephritis / C3 glomerulopathy** — C3 ต่ำนานเกิน 8 สัปดาห์\n6. **Infective endocarditis-associated glomerulonephritis** — ไข้เรื้อรัง murmur, hemoculture positive\n7. **Hypertensive emergency with hypertensive nephropathy** — แต่ไม่อธิบาย gross haematuria ที่มี dysmorphic RBC"}, {"q": "5. ท่านจะส่งตรวจทางห้องปฏิบัติการอะไรบ้าง พร้อมเหตุผล (อย่างน้อย 5 อย่าง)", "a": "1. **Urine analysis พร้อมดู urine sediment ด้วยกล้อง (สำคัญที่สุด)** — คาดว่าพบ **proteinuria 1-2+, RBC จำนวนมากที่เป็น dysmorphic RBC/acanthocyte, RBC cast** และอาจมี WBC บ้าง; **การมี RBC cast ยืนยันว่าเลือดออกจาก glomerulus**\n2. **Urine protein-to-creatinine ratio (UPCR)** — ปริมาณ proteinuria (คาดว่า sub-nephrotic <3 g/g ซึ่งเข้ากับ nephritic)\n3. **BUN, creatinine, electrolytes, bicarbonate** — ประเมินระดับ renal impairment, **hyperkalaemia และ metabolic acidosis** ที่ต้องแก้เร่งด่วน\n4. **ASO titre และ anti-DNase B** — **หลักฐานการติดเชื้อ streptococcus ที่ผ่านมา** (throat culture มักกลับเป็นลบแล้วเพราะผ่านไป 2 สัปดาห์และได้ยามา)\n5. **Complement C3 และ C4** — **คาดว่า C3 ต่ำ C4 ปกติ** ซึ่งเป็นลายเซ็นของ **alternative pathway activation ใน APSGN** (ถ้า C3 และ C4 ต่ำทั้งคู่ → คิดถึง lupus nephritis/MPGN type I)\n6. **CBC** — ประเมินซีด (ถ้าซีดรุนแรงต้องคิดถึง RPGN/โรคระบบ), platelet, WBC\n7. **ANA, anti-dsDNA** — คัด SLE\n8. **ANCA (anti-MPO, anti-PR3) และ anti-GBM antibody** — คัด RPGN ซึ่งเป็นภาวะที่ต้องรักษาเร่งด่วน\n9. **HBsAg, anti-HCV, anti-HIV, VDRL** — คัด glomerulonephritis จากการติดเชื้อเรื้อรัง\n10. **Chest radiograph** — ประเมิน pulmonary congestion/cardiomegaly และคัด pulmonary haemorrhage (pulmonary-renal syndrome)\n11. **Renal ultrasonography** — ประเมินขนาดและ echogenicity ของไต (คัด CKD ที่มาอยู่แล้ว) และคัดการอุดกั้น\n12. **ECG** — ประเมิน LVH (บ่งว่า HT เป็นมานาน) และการเปลี่ยนแปลงจาก hyperkalaemia\n13. **พิจารณา renal biopsy** — เมื่อการวินิจฉัยไม่ชัด, **การทำงานของไตแย่ลงเร็ว (สงสัย RPGN)**, **C3 ไม่กลับเป็นปกติภายใน 8 สัปดาห์**, หรือ proteinuria/haematuria ไม่ดีขึ้นตามคาด"}, {"q": "6. จงให้ definitive diagnosis พร้อมเหตุผล และอธิบาย pathophysiology", "a": "**Definitive diagnosis: Acute post-streptococcal glomerulonephritis presenting with nephritic syndrome and severe hypertension**\n\n**เหตุผลที่สรุปได้**\n1. **Latent period 2 สัปดาห์** หลัง pharyngitis → เข้ากับระยะเวลาของ immune complex disease (ไม่ใช่ synpharyngitic แบบ IgA)\n2. **ภาพ nephritic ครบ**: gross haematuria สีน้ำล้างเนื้อ **ไม่มีฟอง**, proteinuria เพียง 1+ (sub-nephrotic), **oliguria, oedema และ hypertension**\n3. **ASO titre สูง** = หลักฐานการติดเชื้อ GAS ที่ผ่านมา\n4. **C3 ต่ำ โดย C4 ปกติ** = alternative complement pathway activation ซึ่งจำเพาะต่อ post-infectious GN (และ C3 glomerulopathy)\n5. ไม่มีลักษณะของโรคระบบอื่น (ไม่มีผื่น ปวดข้อ อาการปอด)\n\n**Pathophysiology (อธิบายเป็นลูกโซ่)**\n1. **Antigen**: nephritogenic strain ของ group A Streptococcus สร้างโปรตีน **NAPlr (nephritis-associated plasmin receptor)** และ **SPE-B (streptococcal pyrogenic exotoxin B)**\n2. **Immune complex formation**: antigen เหล่านี้ **เกาะที่ glomerulus (planted antigen)** แล้ว antibody มาจับ เกิด immune complex ในตำแหน่ง **subepithelial** (เห็นเป็น **\"hump\" บน electron microscopy** และ **\"starry sky\" pattern ของ C3/IgG บน immunofluorescence**)\n3. **Complement activation**: กระตุ้นผ่าน **alternative pathway (และ lectin pathway)** → **C3 ถูกใช้ไปจึงต่ำ ขณะที่ C4 ปกติ** → สร้าง C5a (chemotactic) และ membrane attack complex\n4. **Inflammation**: neutrophil และ monocyte แทรกซึมเข้า glomerulus เกิด **diffuse endocapillary proliferative glomerulonephritis** → ผนัง capillary เสียหายและ capillary lumen ถูกเบียดแคบ\n5. **ผลทางสรีรวิทยา 2 สาย**\n   - **ผนัง capillary รั่ว** → RBC ลอดออกมา ถูกบีบผ่าน GBM และผ่าน osmotic stress ใน tubule → **dysmorphic RBC และ RBC cast** → ปัสสาวะสีน้ำล้างเนื้อ; protein รั่วบ้างแต่ไม่มาก (sub-nephrotic) เพราะพยาธิสภาพหลักคือการอักเสบ ไม่ใช่ podocyte injury\n   - **Capillary lumen ถูกเบียด + mesangial proliferation** → **GFR ลดลง** → (ก) **creatinine ขึ้น, oliguria** (ข) **Na และน้ำคั่ง** → **volume expansion → hypertension (เป็นเหตุของปวดศีรษะ) และ oedema** (กลไก edema ใน nephritic เป็นแบบ \"overfill\" ต่างจาก nephrotic ที่เป็น \"underfill/oncotic\")\n6. **การดำเนินโรค**: ในผู้ป่วยส่วนใหญ่ (โดยเฉพาะเด็ก) **หายเองได้ (self-limited)** — **C3 กลับเป็นปกติใน 6-8 สัปดาห์**, gross haematuria หายใน 1-2 สัปดาห์, proteinuria หายใน 3-6 เดือน, แต่ **microscopic haematuria อาจอยู่ได้ถึง 1-2 ปี**; ผู้ใหญ่มี prognosis ด้อยกว่าเด็กและอาจเหลือ HT/proteinuria เรื้อรัง"}, {"q": "7. จงให้แนวทางการรักษาและคำแนะนำแบบองค์รวม", "a": "**A. ควบคุมภาวะ volume overload และความดันโลหิต (แกนหลักของการรักษา)**\n- **จำกัดเกลือ (<2 g Na/วัน) และจำกัดน้ำ** ตามปริมาณปัสสาวะและสถานะสารน้ำ\n- **Loop diuretic (furosemide)** เป็นยาลดความดัน **ตัวเลือกแรก** เพราะพยาธิสภาพคือ **Na และน้ำคั่ง** — แก้ที่ต้นเหตุและลด edema ไปพร้อมกัน\n- เพิ่ม **CCB (เช่น amlodipine) หรือ vasodilator** ถ้า BP ยังสูง; **หลีกเลี่ยง ACEI/ARB ในระยะเฉียบพลันที่ GFR กำลังแย่และมีความเสี่ยง hyperkalaemia** (พิจารณาใช้ภายหลังเมื่อคงที่และมี proteinuria ค้าง)\n- ถ้ามี **hypertensive emergency (encephalopathy, pulmonary oedema, papilledema)** → ให้ยาทางหลอดเลือดดำและลด MAP **ไม่เกิน 25% ในชั่วโมงแรก**\n- **ชั่งน้ำหนักทุกวัน บันทึก I/O และวัด BP เป็นระยะ**\n\n**B. กำจัดเชื้อต้นเหตุ**\n- **Penicillin V oral 10 วัน หรือ benzathine penicillin G IM ครั้งเดียว** (ถ้าแพ้ penicillin ใช้ macrolide) — **ไม่เปลี่ยนการดำเนินโรคของไตที่เกิดขึ้นแล้ว** แต่ **กำจัดเชื้อและลดการแพร่ไปสู่ผู้อื่น**\n- **คัดกรองและรักษาผู้สัมผัสใกล้ชิดที่มีอาการ**\n\n**C. ติดตามและจัดการภาวะแทรกซ้อน**\n- ติดตาม **Cr, K, bicarbonate, urine output** อย่างใกล้ชิด\n- **แก้ hyperkalaemia และ metabolic acidosis** ตามความรุนแรง\n- เฝ้าระวัง **pulmonary oedema, hypertensive encephalopathy และ AKI ที่ต้องฟอกเลือด (ตาม AEIOU)**\n- **ไม่ให้ corticosteroid หรือ immunosuppressant เป็นกิจวัตร** — พิจารณาเฉพาะเมื่อมีหลักฐานของ **crescentic/RPGN** บน biopsy\n\n**D. ติดตามระยะยาว (ส่วนที่มักถูกลืมแต่ได้คะแนน)**\n- **ตรวจ C3 ซ้ำที่ 6-8 สัปดาห์** — ถ้ายังต่ำต้องสงสัย **C3 glomerulopathy/MPGN** และพิจารณา biopsy\n- **ติดตาม BP, UA และ creatinine เป็นระยะอย่างน้อย 1-2 ปี** เพราะอาจเหลือ microscopic haematuria, proteinuria หรือ HT เรื้อรัง → ถ้ามี proteinuria ค้างให้เริ่ม **ACEI/ARB** เพื่อชะลอการเสื่อม\n- ให้คำแนะนำเรื่อง **การคุมน้ำหนัก (BMI 27)** และปรับพฤติกรรมลดความเสี่ยง CKD/CV ในระยะยาว\n\n**E. คำแนะนำแก่ผู้ป่วยและครอบครัว**\n- อธิบายว่าโรคนี้ **ส่วนใหญ่ดีขึ้นเองภายในไม่กี่สัปดาห์** แต่ต้องติดตามเพราะมีส่วนน้อยที่กลายเป็นเรื้อรัง\n- **อาการที่ต้องกลับมาพบแพทย์ทันที**: ปัสสาวะออกน้อยลงมาก, บวมมากขึ้นเร็ว, น้ำหนักขึ้น >2 กก.ใน 2-3 วัน, เหนื่อยนอนราบไม่ได้, ปวดศีรษะรุนแรง ตาพร่า ซึมลง ชัก\n- **หลีกเลี่ยง NSAID และยาชุด/ยาสมุนไพรที่ไม่ทราบส่วนประกอบ** โดยเด็ดขาด\n- เน้นการรักษาเจ็บคอจากเชื้อสเตรปโตคอคคัสอย่างถูกต้องในอนาคต และดูแลสุขอนามัยของแผลที่ผิวหนัง\n- **ย้ำเรื่องการมาตามนัด** เพื่อตรวจปัสสาวะและความดันซ้ำ"}], "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MEQ – ผู้ชายไทยอายุ 30 ปี ปวดศีรษะ 3 ชั่วโมงก่อนมารพ. (Q1 ซักประวัติ Q2 ตรวจร่างกาย Q3 problem list Q4 DDx 3 โรค Q5 ส่งแลป 5 อย่าง + เหตุผล Q6 definite diagnosis Q7 management) → Dx acute poststreptococcal glomerulonephritis, tx antihypertensive drug; โจทย์ให้ UA proteinuria 1+ rbc wbc, ASO titer ขึ้น, low C3 normal C4", "MED31 OSCE ข้อ 9 – urine RBC 50-100 protein trace → Dysmorphic RBC, doughnut cell; DDx: post streptococcal GN, IgA nephropathy, RPGN", "MED29 SAQ – Acute post streptococcal glomerulonephritis, IgA nephropathy, Rapidly Progressive Glomerulonephritis", "MED31 MCQ ข้อ 13 – red urine suspected glomerular disease ไม่ควรเจออะไร → clot urine"], "nl": ["B9.2.2(3)", "2.2.4", "2.3.14(2)"], "_kind": "meq", "_set": "nephro"}, {"id": "N-MEQ-03", "part": "MEQ", "lec": "14", "lecture": "Nephrotic / Nephritic syndrome (อ.ฉันทิศา)", "topic": "Nephrotic syndrome from lupus nephritis", "vignette": "ผู้ป่วยหญิงไทยอายุ 28 ปี มาโรงพยาบาลด้วยอาการบวมรอบตาและขาบวมสองข้าง 3 สัปดาห์\nPI:\n- 3 สัปดาห์ก่อน ตื่นนอนมาพบว่าหน้าและรอบตาบวม ตอนบ่ายยุบลงแต่ขาเริ่มบวมแทน\n- 2 สัปดาห์ก่อน ขาบวมมากขึ้นถึงหน้าแข้งทั้งสองข้าง น้ำหนักเพิ่ม 5 กิโลกรัม\n- **ปัสสาวะเป็นฟองเยอะ ต้องกดชักโครก 2 ครั้ง**\n- ปฏิเสธอาการแสบขัด ไม่มีปัสสาวะเป็นเลือด ปริมาณปัสสาวะปกติ\nประวัติเพิ่มเติมจากการซักอย่างละเอียด: **มีผื่นแดงที่โหนกแก้มสองข้างเมื่อออกแดด ปวดข้อนิ้วมือทั้งสองข้างเป็นๆหายๆ 6 เดือน ผมร่วงมากขึ้น** ไม่มีแผลในปาก ไม่มีข้อนิ้วผิดรูป ไม่ได้กินยาใดเป็นประจำ ไม่มีประวัติแท้งบุตร\nPE: V/S BT 37.3 C, PR 88/min, RR 20/min, BP 148/92 mmHg, BW 62 kg (เดิม 57 kg)\nGA: alert, mild pale, ไม่เหลือง\nSkin: malar rash ข้ามสันจมูก ไม่มี discoid lesion, ไม่มี purpura\nHEENT: periorbital puffiness, JVP 4 cm, ไม่มี oral ulcer\nCVS/RS: normal S1 S2, ไม่มี murmur, ปอด clear\nAbd: soft, shifting dullness positive เล็กน้อย\nExt: pitting edema 3+ ถึงระดับหน้าแข้งทั้งสองข้าง, ไม่มี joint deformity, MCP และ PIP กดเจ็บเล็กน้อยไม่บวม\nLab: CBC Hb 10.2 g/dL, Hct 31%, WBC 3,400/mm3 (N 68%, L 26%), platelet 118,000/mm3\nBUN 22 mg/dL, creatinine 1.3 mg/dL, albumin 2.1 g/dL, total cholesterol 368 mg/dL, triglyceride 260 mg/dL\nUA: spgr 1.020, protein 4+, glucose negative, RBC 30-50/HPF (dysmorphic), WBC 5-10/HPF, **oval fat bodies และ RBC cast**\nUPCR 6.8 g/g", "questions": [{"q": "1. จงเขียน problem list และบอกกลุ่มอาการ (syndrome) ที่ผู้ป่วยมี", "a": "**Problem list**\n1. **Nephrotic syndrome**: heavy proteinuria (UPCR 6.8 g/g, protein 4+), hypoalbuminaemia (albumin 2.1), generalised oedema พร้อม ascites, hyperlipidaemia (cholesterol 368)\n2. **พร้อมกับลักษณะของ nephritic**: **dysmorphic RBC 30-50/HPF ร่วมกับ RBC cast** และ hypertension (148/92) และ creatinine เริ่มสูง (1.3)\n   → รวมเป็น **\"nephritic-nephrotic overlap\"** ซึ่งบ่งถึง **proliferative glomerulonephritis**\n3. **Normochromic anaemia (Hb 10.2)**\n4. **Leukopenia (WBC 3,400) และ thrombocytopenia (platelet 118,000)** = cytopenia หลายสาย\n5. **Malar rash with photosensitivity**\n6. **Non-erosive symmetrical polyarthralgia ที่ MCP และ PIP 6 เดือน**\n7. ผมร่วง (non-scarring alopecia)\n8. Mild renal impairment (Cr 1.3)\n9. Hypertension\n\n**กลุ่มอาการ**: ผู้ป่วยมี **nephrotic syndrome ที่มีลักษณะ nephritic ร่วม ในบริบทของโรคระบบหลายอวัยวะ** — ชี้ไปที่ **systemic lupus erythematosus with lupus nephritis** อย่างชัดเจน"}, {"q": "2. จง differential diagnosis 3 โรค พร้อมจุดแยก", "a": "1. **Lupus nephritis (น่าจะเป็นที่สุด)** — มี **เกณฑ์ของ SLE หลายข้อ**: malar rash + photosensitivity, non-erosive arthritis, **leukopenia และ thrombocytopenia**, **renal involvement (proteinuria >0.5 g/day และ RBC cast)**; ลักษณะ nephritic-nephrotic overlap เข้ากับ **class III/IV (proliferative)** หรือ **class V ที่มี proliferative ร่วม**; คาดว่า **C3 และ C4 ต่ำทั้งคู่ ร่วมกับ ANA และ anti-dsDNA positive**\n2. **Primary membranous nephropathy** — เป็นสาเหตุ nephrotic ที่พบบ่อยในผู้ใหญ่ แต่จะเป็น **nephrotic \"บริสุทธิ์\"** (**ไม่มี RBC cast**, sediment ค่อนข้าง bland), **complement ปกติ**, ไม่มีอาการนอกไต และตรวจพบ **anti-PLA2R antibody**; ต้องคัดว่าเป็น secondary membranous จาก SLE (class V), HBV, มะเร็ง หรือยา\n3. **Membranoproliferative glomerulonephritis (MPGN) / C3 glomerulopathy** — ให้ภาพ nephritic-nephrotic overlap ได้เหมือนกันและ **C3 ต่ำ**; จุดแยกคือ **C4 มักปกติใน C3 glomerulopathy** และไม่มีอาการของ SLE; ต้องคัด **HCV, cryoglobulinaemia, monoclonal gammopathy**\n4. **Minimal change disease / FSGS** — เป็น nephrotic บริสุทธิ์ **ไม่มี RBC cast** และไม่มีอาการนอกไต\n5. **IgA nephropathy** — haematuria เป็นแกนแต่ proteinuria มัก sub-nephrotic และไม่มีอาการระบบ\n6. **Diabetic nephropathy** — ต้องมีประวัติเบาหวานนานและมักมี retinopathy ร่วม (ผู้ป่วยอายุ 28 ไม่มีประวัติเบาหวาน)\n7. ภาวะอื่นที่ต้องคัด: **HBV/HCV/HIV-associated nephropathy, amyloidosis, multiple myeloma (ไม่เข้ากับอายุ), thrombotic microangiopathy**"}, {"q": "3. ท่านจะส่งตรวจอะไรเพิ่มเติม พร้อมเหตุผล", "a": "**เพื่อยืนยัน SLE และประเมินความรุนแรง**\n1. **ANA (immunofluorescence) และ anti-dsDNA** — ANA เป็นการคัดกรอง (sensitivity สูง) และ **anti-dsDNA สัมพันธ์กับ lupus nephritis และ disease activity**\n2. **Complement C3 และ C4** — **คาดว่าต่ำทั้งคู่** (classical pathway activation) และใช้ติดตาม activity\n3. **Anti-Sm, anti-Ro (SSA), anti-La (SSB), anti-RNP** — ช่วยจำแนกและประเมินความเสี่ยงต่อทารกในอนาคต (anti-Ro กับ neonatal lupus/congenital heart block)\n4. **Antiphospholipid antibody: lupus anticoagulant, anti-cardiolipin, anti-beta2-glycoprotein I** — สำคัญเพราะเพิ่มความเสี่ยง **thrombosis** ซึ่งซ้อนทับกับภาวะ hypercoagulable ของ nephrotic syndrome\n5. **Direct Coombs test, reticulocyte count, LDH, haptoglobin** — คัด **autoimmune haemolytic anaemia** ที่อธิบายภาวะซีด\n6. **ESR, CRP** — ESR มักสูงใน SLE active ขณะที่ **CRP มักไม่สูงมาก (ถ้า CRP สูงชัดต้องคิดถึงการติดเชื้อร่วม)**\n\n**เพื่อประเมินไตและวางแผนการรักษา**\n7. **Renal biopsy — จำเป็นและเป็นหัวใจของการรักษา** เพื่อ **จำแนก ISN/RPS class (I-VI)**, ประเมิน **activity index และ chronicity index** ซึ่ง **กำหนดสูตรยากดภูมิคุ้มกันและพยากรณ์โรค** (ก่อนทำต้องตรวจ coagulogram, platelet, ควบคุมความดันและทำ ultrasound ไต)\n8. **24-hour urine protein หรือ UPCR ซ้ำ** เพื่อเป็น baseline ในการติดตามการตอบสนอง\n9. **Renal ultrasonography** — ประเมินขนาดและ echogenicity (คัด chronicity) และคัดการอุดกั้น\n10. **Electrolytes, Ca, PO4, uric acid, bicarbonate**\n\n**เพื่อประเมินภาวะแทรกซ้อนและคัดโรคร่วม**\n11. **Chest radiograph และ echocardiography** — คัด serositis (pleural/pericardial effusion), pulmonary involvement\n12. **HBsAg, anti-HBc, anti-HBs, anti-HCV, anti-HIV, VDRL, และ screening วัณโรค (CXR, IGRA/TST)** — **จำเป็นก่อนเริ่มยากดภูมิคุ้มกัน** (ความเสี่ยง HBV reactivation และ TB reactivation)\n13. **Fundus examination และ baseline ophthalmologic exam** — ก่อนเริ่ม **hydroxychloroquine** (เฝ้าระวัง retinopathy)\n14. **Lipid profile, fasting glucose/HbA1c** — baseline ก่อน steroid และเพราะ nephrotic ทำให้ไขมันสูง\n15. **Urine culture** และคัดการติดเชื้อ — ผู้ป่วย nephrotic + SLE เสี่ยงติดเชื้อสูง และต้องแน่ใจก่อนให้ยากดภูมิ\n16. **Vitamin D และ bone density (baseline)** — ก่อน steroid ระยะยาว\n17. **Pregnancy test และปรึกษาเรื่องการคุมกำเนิด** — สำคัญมากเพราะยาหลายตัว (cyclophosphamide, MMF, ACEI/ARB) เป็น teratogen"}, {"q": "4. จงให้ definitive diagnosis (สมมติว่าผล ANA positive 1:640, anti-dsDNA positive, C3 และ C4 ต่ำ, renal biopsy = diffuse proliferative glomerulonephritis with subepithelial deposits) และวางแผนการรักษา", "a": "**Definitive diagnosis: Systemic lupus erythematosus with lupus nephritis ISN/RPS class IV (diffuse proliferative) with membranous features (class IV + V), presenting as nephritic-nephrotic syndrome**\n\n**A. การรักษาโรคไตจาก lupus (immunosuppressive therapy)**\n**ระยะเหนี่ยวนำการสงบของโรค (induction, ประมาณ 6 เดือน)**\n- **Corticosteroid**: IV methylprednisolone pulse ในรายที่รุนแรง ตามด้วย **prednisolone ชนิดรับประทานแล้วลดขนาดลงอย่างรวดเร็วเท่าที่ทำได้** (แนวโน้มปัจจุบันคือใช้ steroid ขนาดต่ำลงเพื่อลดพิษระยะยาว)\n- **ร่วมกับยากดภูมิคุ้มกันตัวหลัก** เลือกอย่างใดอย่างหนึ่ง\n  - **Mycophenolate mofetil (MMF)** — ประสิทธิภาพเทียบเท่า cyclophosphamide และ **ไม่ทำให้เป็นหมัน** จึงเหมาะกับผู้ป่วยหญิงวัยเจริญพันธุ์รายนี้\n  - **Cyclophosphamide** (low-dose Euro-Lupus regimen) — ใช้ในรายรุนแรง; ต้องให้คำปรึกษาเรื่อง **gonadal toxicity/ภาวะมีบุตรยาก** และพิจารณาการเก็บรักษาภาวะเจริญพันธุ์ (รวมถึง GnRH agonist)\n  - พิจารณา **เพิ่มยาตัวที่สาม** ตามแนวทางปัจจุบัน: **belimumab** หรือ **voclosporin/calcineurin inhibitor** ซึ่งเพิ่มอัตราการสงบของโรคไต\n- **Hydroxychloroquine** — ให้ในผู้ป่วย SLE **ทุกราย**: ลด flare, ลด thrombosis, ลด organ damage และเพิ่มการรอดชีวิต (ติดตามจักษุแพทย์)\n\n**ระยะคงการสงบ (maintenance ≥3 ปี)**: **MMF หรือ azathioprine** ขนาดต่ำร่วมกับ hydroxychloroquine และ steroid ขนาดต่ำสุดหรือหยุดได้\n\n**B. การรักษาสนับสนุนทางไต (เพิ่มผลลัพธ์ไม่น้อยกว่ายากดภูมิ)**\n- **ACEI หรือ ARB** เพื่อ **ลด proteinuria และคุมความดัน** (เป้า BP <130/80; ระวัง K และ Cr; **ต้องคุมกำเนิดเพราะเป็น teratogen**)\n- พิจารณา **SGLT2 inhibitor** เพื่อชะลอการเสื่อมของไตในผู้ที่มี proteinuria ค้างและไตเสื่อม\n- **จำกัดเกลือ <2 g Na/วัน**, **loop diuretic** เพื่อลด oedema (ชั่งน้ำหนักทุกวัน, เลี่ยงการลดน้ำเร็วเกินจนเกิด AKI)\n- **Statin** สำหรับ hyperlipidaemia ของ nephrotic syndrome\n\n**C. ป้องกันภาวะแทรกซ้อนของ nephrotic syndrome**\n- **ประเมินความเสี่ยง thromboembolism**: albumin 2.1 g/dL = ความเสี่ยงสูง; พิจารณา **anticoagulation** โดยเฉพาะถ้ามี **antiphospholipid antibody positive** หรือมีปัจจัยเสี่ยงอื่น; เฝ้าระวัง **renal vein thrombosis** (ปวดสีข้างเฉียบพลัน + gross haematuria + Cr ขึ้น) และ DVT/PE\n- **ป้องกันการติดเชื้อ**: ผู้ป่วยเสีย IgG และ complement factor B ทางปัสสาวะ ร่วมกับได้ยากดภูมิ → **ฉีดวัคซีนไข้หวัดใหญ่และ pneumococcal (ก่อนเริ่มยากดภูมิถ้าทำได้; หลีกเลี่ยง live vaccine ระหว่างกดภูมิ)**, พิจารณา **PCP prophylaxis (cotrimoxazole)** เมื่อได้ steroid ขนาดสูงร่วมยากดภูมิ, **ประเมินและรักษา latent TB**, และเฝ้าระวัง **HBV reactivation**\n- **ป้องกัน steroid-induced osteoporosis**: calcium และ vitamin D, ประเมิน bone density, พิจารณา bisphosphonate (โดยคำนึงถึงแผนการตั้งครรภ์)\n- ป้องกัน **gastritis/peptic ulcer** เมื่อใช้ steroid ร่วม NSAID (และควรหลีกเลี่ยง NSAID ในผู้ป่วยโรคไต)\n\n**D. คำแนะนำและการติดตาม**\n- **หลีกเลี่ยงแสงแดดและใช้ครีมกันแดด SPF สูงทุกวัน** (UV กระตุ้น apoptosis ของ keratinocyte → เปิดเผย nuclear antigen → กระตุ้น flare)\n- **งดสูบบุหรี่** (ลดประสิทธิภาพของ hydroxychloroquine และเพิ่มความเสี่ยง CV)\n- **การวางแผนการตั้งครรภ์**: ต้อง **คุมโรคให้สงบอย่างน้อย 6 เดือนก่อนตั้งครรภ์**, เปลี่ยนยาที่เป็น teratogen (หยุด MMF, cyclophosphamide, ACEI/ARB), คงการใช้ hydroxychloroquine, และดูแลร่วมกับสูติแพทย์ความเสี่ยงสูง\n- **ติดตาม**: UPCR, creatinine/eGFR, UA, CBC, C3/C4 และ anti-dsDNA เป็นระยะเพื่อประเมินการตอบสนองและ flare; ติดตามพิษของยา (CBC, LFT)\n- **ให้ความรู้เรื่องอาการเตือนของ flare และของการติดเชื้อ** และย้ำความสำคัญของการกินยาต่อเนื่องและการมาตามนัด (adherence เป็นปัจจัยทำนายผลลัพธ์ที่สำคัญที่สุดอย่างหนึ่งใน lupus nephritis)"}], "ref": ["MED35 ลงกองครั้งที่ 2 OSCE – hx taking both leg swelling: บวมรอบตา + บวมขาสองข้าง ฉี่เป็นฟองเยอะ กดชักโครกสองครั้ง สรุปมีผื่นแพ้แสง + ปวดข้อนิ้ว; ซักตาม approach generalized edema ddx other causes: HF, cirrhosis, hypothyroidism, malnutrition, medication; ส่งตรวจ UA", "MED35 ลงกองครั้งที่ 2 SAQ – UA lupus nephritis: เห็นอะไรในเยี่ยว (oval fat bodies), Dx lupus nephritis", "MED31 OSCE ข้อ 1 – SLE with lupus nephritis + แปลผล UA (protein 3+, RBC 30-50 → proteinuria, hematuria)", "MED32 OSCE ข้อ 6 – แปลผล UA: WBC ขึ้น, proteinuria, microscopic hematuria, albuminuria → Dx lupus nephritis, glomerulonephritis", "MED32 MCQ – อาการของ renal ตรงกับ SLE criteria diagnosis = lab 1, clinical 3 (SLE, RA, AIHA)", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 53 – ให้อาการ SLE ใช้ยาอะไร → Hydroxychloroquine", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 82 – เป็น SLE มี WBC 4200 มีฉี่ฟอง มีไข้ ควรรักษาอะไรก่อน"], "nl": ["2.3.13-3(15)", "B9.2.2(4)", "2.3.14(12)"], "_kind": "meq", "_set": "nephro"}], "osce": [{"id": "N-OSCE-02", "part": "OSCE/SAQ", "lec": "14", "lecture": "Nephrotic / Nephritic syndrome (อ.ฉันทิศา)", "topic": "OSCE – History taking of generalised oedema", "station": "OSCE (พูดในห้อง) 4 นาที + เขียนตอบ 1 นาที", "instruction": "จงซักประวัติผู้ป่วยจำลอง หญิงอายุ 28 ปี มาด้วยอาการบวมรอบตาและขาบวมสองข้าง 3 สัปดาห์ และเมื่อหมดเวลาจงบอกว่าท่านจะส่งตรวจอะไรเพิ่มเติม 1 อย่างที่สำคัญที่สุด", "answer": "**ขั้นเตรียม**: แนะนำตัว ขออนุญาต ถามชื่อ-อายุ-อาชีพ สร้างความไว้วางใจ และถามคำถามปลายเปิดก่อน\n\n**1. วิเคราะห์อาการบวม (หัวใจของสถานีนี้)**\n- **เริ่มบวมที่ไหนก่อน** — **บวมรอบตาตอนเช้าแล้วยุบตอนบ่าย = ลักษณะของโรคไต** (เนื้อเยื่อรอบตาหลวม แรงดันต่ำ ของเหลวสะสมตอนนอนราบ); **บวมขาตอนเย็นเพิ่มขึ้น = โรคหัวใจ/หลอดเลือดดำ**\n- **บวมข้างเดียวหรือสองข้าง** — ข้างเดียวให้คิดถึง DVT, lymphoedema, cellulitis\n- บวมลุกลามเร็วแค่ไหน, **น้ำหนักเพิ่มกี่กิโลกรัมในกี่วัน**, บวมที่ท้อง (ascites), บวมที่อัณฑะ/แคม, บวมหลังมือและหน้า\n- **กดบุ๋มหรือไม่ (pitting)**, เจ็บหรือไม่ (เจ็บ → inflammatory/DVT)\n\n**2. อาการที่ชี้ไปที่ \"ไต\" (สำคัญที่สุด)**\n- **ปัสสาวะเป็นฟองเยอะหรือไม่ ต้องกดชักโครกหลายครั้งไหม** = เบาะแสของ heavy proteinuria (คำถามที่เป็นกุญแจของข้อสอบข้อนี้)\n- **สีปัสสาวะ** — สีน้ำล้างเนื้อ/โคล่า (glomerular haematuria), มีลิ่มเลือดไหม\n- ปริมาณปัสสาวะลดลงไหม, ปัสสาวะกลางคืนบ่อยขึ้นไหม\n- แสบขัด ปัสสาวะบ่อย ไข้ ปวดสีข้าง (UTI/pyelonephritis)\n\n**3. ซักเพื่อแยกสาเหตุอื่นของ generalised oedema ให้ครบ (approach ที่อาจารย์ให้คะแนน)**\n- **Heart failure**: เหนื่อยเวลาออกแรง, **นอนราบไม่ได้ (orthopnoea) ใช้หมอนกี่ใบ**, **ตื่นมาหอบกลางคืน (PND)**, ใจสั่น เจ็บหน้าอก\n- **Liver disease/cirrhosis**: ตัวตาเหลือง ท้องโต เส้นเลือดขอดที่ผนังหน้าท้อง อาเจียนเป็นเลือด ถ่ายดำ สับสน/มือสั่น, **ประวัติดื่มสุรา ไวรัสตับอักเสบ การรับเลือด**\n- **Hypothyroidism**: ขี้หนาว น้ำหนักขึ้น ท้องผูก ผิวแห้ง ผมร่วง เสียงแหบ เชื่องช้า ประจำเดือนมากผิดปกติ\n- **Malnutrition / protein-losing enteropathy**: กินได้น้อย น้ำหนักลด ท้องเสียเรื้อรัง อุจจาระมีไขมัน\n- **ยา**: **amlodipine/CCB (ขาบวม), NSAID, corticosteroid, ยาฮอร์โมน/ยาคุม, pioglitazone, gabapentin, ยาชุด/ยาสมุนไพร/ยาลูกกลอน**\n- **DVT/venous insufficiency**: บวมข้างเดียว ปวดน่อง เคยนอนนิ่งนาน เดินทางไกล ผ่าตัด ตั้งครรภ์\n- **การตั้งครรภ์** และภาวะ preeclampsia (ถ้าอยู่ในวัยเจริญพันธุ์)\n\n**4. ซักหาโรคระบบที่เป็นต้นเหตุ (เป็นจุดที่ทำให้ได้การวินิจฉัยในเคสนี้)**\n- **SLE**: **ผื่นที่โหนกแก้ม ผื่นแพ้แสงแดด ปวดข้อนิ้วมือเป็นๆหายๆ ผมร่วง แผลในปาก ไข้เรื้อรัง ซีด นิ้วซีดเขียวเวลาอากาศเย็น (Raynaud) ประวัติแท้งซ้ำ**\n- **เบาหวาน**: ระยะเวลาที่เป็น, การคุมน้ำตาล, **เคยตรวจตาแล้วมี retinopathy ไหม** (ถ้ามี retinopathy สนับสนุน diabetic nephropathy)\n- **ความดันโลหิตสูง**\n- **การติดเชื้อเรื้อรัง**: ไวรัสตับอักเสบบี/ซี, HIV, ซิฟิลิส, มาลาเรีย, พฤติกรรมเสี่ยง\n- **มะเร็ง** (secondary membranous, amyloidosis): น้ำหนักลด เบื่ออาหาร ก้อน ต่อมน้ำเหลืองโต เหงื่อออกกลางคืน, **ปวดกระดูกในผู้สูงอายุ (myeloma)**\n- **การติดเชื้อนำ**: เจ็บคอหรือแผลที่ผิวหนังก่อนหน้านี้ **นานเท่าไร** (แยก post-streptococcal GN จาก IgA nephropathy)\n\n**5. ประวัติอื่น**: โรคประจำตัว, ยาที่ใช้และแพ้ยา, ประวัติครอบครัว (โรคไต ไตวายต้องฟอกเลือด หูหนวก), การสูบบุหรี่ ดื่มสุรา ใช้สารเสพติด, อาชีพและการสัมผัสสารพิษ/โลหะหนัก\n\n**6. ปิดท้าย**: สรุปให้ผู้ป่วยฟัง เปิดโอกาสให้ถาม และ **อย่าลืมพูดว่าจะส่งตรวจอะไร** (ข้อสอบ OSCE มักหักคะแนนข้อนี้)\n\n**การส่งตรวจที่สำคัญที่สุด 1 อย่าง: Urine analysis พร้อมการดู urine sediment ด้วยกล้องจุลทรรศน์**\n- **เหตุผล**: เป็นการตรวจที่ทำได้ทันที ราคาถูก และ **แยกสาเหตุของ generalised oedema ได้ทรงพลังที่สุด** — ถ้าพบ **proteinuria มากพร้อม oval fat body** → nephrotic; ถ้าพบ **dysmorphic RBC และ RBC cast** → nephritic/glomerulonephritis; ถ้าปัสสาวะปกติ → ให้มองหาสาเหตุจากหัวใจ ตับ ไทรอยด์ หรือโภชนาการแทน\n\n*(ถ้าให้ตอบเพิ่ม: UPCR, serum albumin และ total protein, BUN/Cr/electrolytes, lipid profile, CBC, ANA/anti-dsDNA/C3/C4, LFT, TSH, HBsAg/anti-HCV/anti-HIV, chest radiograph และ renal ultrasonography)*", "ref": ["MED35 ลงกองครั้งที่ 2 OSCE – hx taking both leg swelling: บวมรอบตา + บวมขาสองข้าง ฉี่เป็นฟองเยอะ กดชักโครกสองครั้ง; สรุปไปๆมาๆ มีผื่นแพ้แสง + ปวดข้อนิ้ว; ไม่มียาอะไรกิน ไม่มีข้อนิ้วผิดรูป ไม่มีผมร่วง; ซักตาม approach generalized edema ddx other causes: HF, cirrhosis, hypothyroidism, malnutrition/enteric, medication; ถามว่าส่งตรวจอะไรต่อ 1 อย่าง → UA (with urine sediment)", "MED32 MCQ ข้อ 25 – Generalized edema weight loss UA ไม่มี cast ไม่มี sediment protein 2.5 ใน 24 hr urine ถามว่า proteinuria จากอะไร", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 50 – Foamy urine → nephrotic syndrome", "MED34 โพย – ตอนสอบ OSCE อ่านคำถามดีๆ ซักประวัติตรวจร่างกายเสร็จอย่าลืมพูดส่ง lab investigation"], "nl": ["2.1.39", "2.3.14(12)", "B9.2.2(4)"], "_kind": "meq", "_set": "nephro"}], "sections": [{"id": "nephro-14-01", "title": "กำแพงกรองของโกลเมอรูลัส — 3 ชั้น และสิ่งที่เกิดขึ้นเมื่อมันพัง", "minutes": 8, "summary": "ทำไมคนปกติไม่มีโปรตีนและเม็ดเลือดแดงในปัสสาวะ และพังตรงไหนถึงได้อาการแบบไหน", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.1.2(2)", "2.3.14(2)", "B9.2.2(4)"], "md": "ทุกอย่างในคาบนี้ต่อยอดมาจากประโยคเดียว — **น้ำกรองผ่านได้ แต่โปรตีนกับเม็ดเลือดแดงผ่านไม่ได้** เพราะมีกำแพง 3 ชั้นเรียงกันอยู่ พอรู้ว่าชั้นไหนพัง จะเดาอาการและพยาธิสภาพได้เกือบหมด\n\n### กำแพงกรอง 3 ชั้น (glomerular filtration barrier)\n\n| ชั้น | โครงสร้าง | หน้าที่ในการกั้น |\n|---|---|---|\n| **1. Glomerular endothelial cell** | เซลล์บุหลอดเลือดที่มีรูพรุน (fenestrae) คลุมด้วย glycocalyx ประจุลบ | **กั้นด้วยประจุ (anionic charge barrier)** — ผลักโปรตีนประจุลบอย่าง albumin ไม่ให้เข้าใกล้ |\n| **2. Glomerular basement membrane (GBM)** | extracellular matrix — **type IV collagen, laminin, fibronectin** | กั้นด้วย **ขนาด** และมีประจุลบเสริม เป็นชั้นที่แข็งแรงเชิงกลที่สุด |\n| **3. Glomerular epithelial cell (podocyte)** | **foot process** ประสานกันเป็น **filtration slit diaphragm** | ด่านสุดท้าย กั้นโมเลกุลใหญ่ และเป็นชั้นที่เสียหายในโรคที่ทำให้โปรตีนรั่วมากที่สุด |\n\n> **กลไกที่ต้องไล่ให้ได้** — albumin หนัก 69 kDa และ **มีประจุลบ** จึงถูกกั้นทั้งด้วยขนาดและด้วยประจุ ฉะนั้น **ถ้าเสียเฉพาะประจุ** โปรตีนที่รั่วออกมาจะเป็น **albumin เป็นหลัก (selective proteinuria)** แต่ **ถ้าโครงสร้างพังจริง** จะรั่วทุกขนาดรวมถึง immunoglobulin (**non-selective**)\n\n### พังแล้วได้อะไร — แยกเป็นสองกลุ่มอาการเสมอ\n\n**กลุ่มที่ 1 · เสียความสามารถในการกั้น (loss of barrier)**\n- **Proteinuria** → **ปัสสาวะเป็นฟอง (foamy urine)** และ **บวมทั้งตัว (generalized edema)**\n- **Hematuria** → **microscopic** หรือ **macroscopic hematuria**\n\n**กลุ่มที่ 2 · อัตราการกรองลดลง (decreased eGFR)**\n- **Azotemia** — BUN/Cr ขึ้น\n- **Oliguria** — ปัสสาวะออกน้อย\n- **Salt/water retention** → **บวม** และ **ความดันโลหิตสูง**\n\n**เม็ดเลือดแดงออกมาได้อย่างไร** — GBM ต้องมี **รอยฉีกขาด** เม็ดเลือดแดงจึงเบียดผ่านออกมาได้ ระหว่างที่บีบผ่านรูแคบและเดินทางต่อไปตาม tubule ที่ความเข้มข้นและ pH เปลี่ยนไปมา เยื่อหุ้มเซลล์จึงเสียรูป กลายเป็น **dysmorphic RBC** และถ้าหลุดออกมาพร้อมกันมาก ๆ ใน tubule ก็จับกับ Tamm–Horsfall protein เป็น **RBC cast** — สองอย่างนี้จึงเป็น \"ลายเซ็น\" ว่าเลือดมาจากโกลเมอรูลัส ไม่ใช่จากทางเดินปัสสาวะส่วนล่าง\n\n### กับดักที่คนพลาดจริง\n- **บวมของ nephrotic กับบวมของ nephritic คนละกลไก** — nephrotic บวมเพราะ **albumin ต่ำ → oncotic pressure ตก** (และ Na คั่งจาก ENaC ที่ถูกกระตุ้นโดยตรง) ส่วน nephritic บวมเพราะ **GFR ตก → Na/น้ำคั่ง** จึงมาพร้อม **ความดันสูง** เสมอ ซึ่ง nephrotic ล้วน ๆ มักไม่มี\n- **\"ไตพัง\" ไม่เท่ากับ \"โกลเมอรูลัสพัง\"** — ATN, AIN, obstruction ก็ทำให้ Cr ขึ้นได้ แต่จะ **ไม่มี dysmorphic RBC/RBC cast และโปรตีนไม่ถึงระดับ glomerular** ต้องดูตะกอนปัสสาวะทุกครั้งก่อนสรุป\n\n### ที่อาจารย์เน้นในสไลด์\nอาจารย์เปิดคาบด้วยรูป 3 ชั้นนี้แล้วย้ำว่า **ให้จำเป็นคู่: \"loss of barrier\" กับ \"decreased eGFR\"** เพราะทุกกลุ่มอาการที่จะเรียนต่อไปคือส่วนผสมของสองอย่างนี้ในสัดส่วนต่างกัน — nephrotic คือ loss of barrier เด่น, nephritic คือ decreased eGFR เด่นและมี barrier รั่วร่วมด้วย", "pearls": ["ประจุลบอยู่ที่ endothelium และ GBM ส่วน slit diaphragm ของ podocyte กั้นด้วยขนาด — เสียประจุอย่างเดียวได้ selective albuminuria (MCD) เสียโครงสร้างได้ non-selective", "Dysmorphic RBC และ RBC cast แปลว่าเลือดมาจากโกลเมอรูลัส ไม่ต้องส่องกล้องกระเพาะปัสสาวะ", "บวม + ความดันสูง + ปัสสาวะออกน้อย = กลุ่ม decreased eGFR (nephritic) · บวม + ฟอง + albumin ต่ำ = กลุ่ม loss of barrier (nephrotic)"], "items": [{"id": "NEPHRO-14-01-Q1", "kind": "own", "stem": "Which component of the glomerular filtration barrier is chiefly responsible for the anionic charge barrier that repels albumin?", "choices": ["The fenestrated glomerular endothelial cell and its negatively charged glycocalyx", "The type IV collagen scaffold of the glomerular basement membrane, which excludes molecules purely by size", "The slit diaphragm between podocyte foot processes, which is electrically neutral", "The mesangial cell, which phagocytoses circulating immune complexes", "The parietal epithelium of Bowman capsule, which reabsorbs filtered albumin"], "answer": 0, "explain": "**ชั้นในสุดของกำแพงกรองคือ endothelial cell ที่มีรูพรุนและคลุมด้วย glycocalyx ประจุลบ** — นี่คือ *charge barrier* ที่ผลัก albumin (ประจุลบ, 69 kDa) ไม่ให้เข้าใกล้รูกรองตั้งแต่ต้น\n\n- **GBM (type IV collagen, laminin, fibronectin)** กั้นด้วย **ขนาด** เป็นหลักและมีประจุลบเสริม — ไม่ใช่ตัวหลักของ charge barrier และข้อความที่ว่ากั้น \"purely by size\" ก็ไม่ถูก\n- **Slit diaphragm** ของ podocyte เป็นด่านสุดท้ายที่กั้นด้วยขนาด **ไม่ใช่ electrically neutral** แต่ก็ไม่ใช่แหล่งประจุลบหลัก\n- **Mesangial cell** ทำหน้าที่ค้ำโครงสร้างและกลืนกินสิ่งแปลกปลอม **อยู่นอกเส้นทางการกรอง**\n- **Parietal epithelium ของ Bowman capsule ไม่ดูดกลับ albumin** — การดูดกลับโปรตีนที่รั่วออกมาเกิดที่ **proximal tubule** ต่างหาก", "pearl": "Charge barrier อยู่ที่ endothelium + GBM · size barrier อยู่ที่ slit diaphragm — เสียประจุได้ albumin รั่วอย่างเดียว เสียโครงสร้างได้โปรตีนรั่วทุกขนาด", "topic": "กำแพงกรองของโกลเมอรูลัส — 3 ชั้น และสิ่งที่เกิดขึ้นเมื่อมันพัง", "src": "", "ref": [], "nl": ["B9.1.2(2)", "B9.2.2(4)"]}, {"id": "NEPHRO-14-01-Q2", "kind": "own", "stem": "A 24-year-old man has cola-coloured urine. Microscopy shows red cells with blebs and vesicles, more than 5 percent acanthocytes, and occasional red cell casts. Which mechanism best explains the abnormal red cell shapes?", "choices": ["Red cells are mechanically abraded by a stone moving down the ureter", "Red cells are lysed by urease-producing bacteria in an infected bladder", "The patient has hereditary spherocytosis and the abnormal cells are filtered intact from plasma", "The specimen is contaminated and the cells are degenerating squamous epithelial cells", "Red cells are deformed as they squeeze through gaps in the glomerular basement membrane and are then osmotically stressed along the tubule"], "answer": 4, "explain": "**Dysmorphic RBC เกิดจากสองแรงกระทำต่อกัน** — (1) เม็ดเลือดแดงต้อง **เบียดผ่านรอยฉีกของ GBM** ซึ่งบิดเยื่อหุ้มเซลล์จนเกิดตุ่มและถุง (**acanthocyte** คือรูปแบบที่จำเพาะที่สุด) และ (2) ระหว่างเดินทางตาม tubule ต้องเจอ **osmolality และ pH ที่แกว่งมาก** ทำให้เสียรูปซ้ำ · การมี **RBC cast** ยิ่งยืนยันว่าเม็ดเลือดแดงอยู่ใน tubule นานพอจะจับกับ Tamm–Horsfall protein\n\n- **นิ่วในท่อไต** ทำให้เลือดออกจากเยื่อบุทางเดินปัสสาวะ เม็ดเลือดแดงจะ **รูปร่างปกติ (isomorphic)** และ **ไม่มี RBC cast** แต่อาจมีลิ่มเลือด\n- **แบคทีเรียที่สลายเม็ดเลือดแดง** จะมาพร้อม **pyuria และ bacteriuria** ไม่ใช่ acanthocyte\n- **Hereditary spherocytosis** เม็ดเลือดแดงผิดรูปอยู่ในกระแสเลือด แต่ **โกลเมอรูลัสปกติไม่กรองเม็ดเลือดแดงออกมาเลย** จึงอธิบาย hematuria ไม่ได้\n- **Squamous epithelial cell** บอกแค่ว่าเก็บปัสสาวะไม่สะอาด **ไม่ใช่เม็ดเลือดแดง** และไม่ทำให้ปัสสาวะสีโคล่า", "pearl": "Acanthocyte เกิน 5% หรือ RBC cast แม้อันเดียว = เลือดออกจากโกลเมอรูลัส ให้หยุดตามหาสาเหตุในทางเดินปัสสาวะส่วนล่าง", "topic": "กำแพงกรองของโกลเมอรูลัส — 3 ชั้น และสิ่งที่เกิดขึ้นเมื่อมันพัง", "src": "", "ref": [], "nl": ["2.1.43", "B9.3(2)", "3.1.6"]}]}, {"id": "nephro-14-02", "title": "วัดโปรตีนในปัสสาวะ — dipstick, SSA, 24 ชั่วโมง และ UPCR", "minutes": 9, "summary": "แต่ละวิธีวัดอะไรได้และพลาดอะไร กับดักใหญ่คือ dipstick ตรวจจับเฉพาะ albumin", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.3(2)", "3.1.6", "2.3.14(12)"], "md": "แบ่งวิธีวัดเป็นสองกลุ่ม — **กึ่งปริมาณ (semi-quantitative)** ใช้คัดกรอง และ **เชิงปริมาณ (quantitative)** ใช้ยืนยันและติดตาม\n\n### กลุ่มที่ 1 · กึ่งปริมาณ\n\n**Urine dipstick** — อาศัยหลักการ *protein error of pH indicator* คือโปรตีนไปจับกับสีบ่งชี้แล้วทำให้เปลี่ยนสี **แต่ปฏิกิริยานี้ไวต่อโปรตีนที่มีประจุลบ จึงตรวจจับได้แทบเฉพาะ albumin**\n\n| Dipstick | Urine protein (mg/dL) |\n|---|---|\n| Negative | 0 |\n| Trace | 15 – 30 |\n| **1+** | 30 – 100 |\n| **2+** | 100 – 300 |\n| **3+** | 300 – 1,000 |\n| **4+** | **> 1,000** |\n\n**Turbidometric test (sulfosalicylic acid, SSA)** — ผสม **ปัสสาวะ : SSA = 1 : 3** กรดจะทำให้โปรตีน**ทุกชนิด**ตกตะกอนเป็นความขุ่น จึงจับ **light chain ได้ด้วย**\n\n| Urine turbidity | Urine protein (mg/dL) |\n|---|---|\n| 0 | 0 |\n| Trace | 1 – 10 |\n| **1+** | 15 – 30 |\n| **2+** | 40 – 100 |\n| **3+** | 150 – 350 |\n| **4+** | **> 500** |\n\n> **กับดักข้อสอบที่ออกทุกปี** — **dipstick ลบ แต่ SSA บวก** หรือ **dipstick ลบ แต่โปรตีน 24 ชั่วโมงสูง** แปลว่าโปรตีนที่รั่วออกมา **ไม่ใช่ albumin** ให้คิดถึง **light chain (Bence Jones protein) จาก multiple myeloma** ทันที\n\n### กลุ่มที่ 2 · เชิงปริมาณ\n\n**เก็บปัสสาวะ 24 ชั่วโมง** — ยังเป็นมาตรฐาน แต่ผิดพลาดง่ายเพราะเก็บไม่ครบ **จึงต้องตรวจ urine creatinine ในถังเดียวกันเพื่อพิสูจน์ว่าเก็บครบจริง**\n\n| เพศ | Urine creatinine ที่คาดว่าจะได้ |\n|---|---|\n| หญิง | **15 – 20 mg/kg/วัน** |\n| ชาย | **20 – 25 mg/kg/วัน** |\n\nถ้าค่าที่ได้ต่ำกว่านี้มาก แปลว่า **เก็บปัสสาวะไม่ครบ** ตัวเลขโปรตีนที่รายงานจะ **ต่ำกว่าความจริง** ห้ามเอาไปแปลผล\n\n**Urine protein-creatinine ratio (UPCR)** — เก็บปัสสาวะครั้งเดียว หารด้วย creatinine ในตัวอย่างเดียวกันเพื่อหักล้างความเข้มข้นของปัสสาวะ **ค่า UPCR (g/g) ประมาณโปรตีน 24 ชั่วโมงเป็นกรัม/วันได้โดยตรง** เช่น UPCR 3.5 g/g ≈ 3.5 g/วัน · สะดวกและทำซ้ำได้จึงใช้ติดตามผลการรักษาได้ดีกว่า\n\n### ลำดับที่ควรส่งในผู้ป่วยบวม + ปัสสาวะเป็นฟอง\n1. **Urinalysis (dipstick + ดูตะกอนด้วยกล้อง)** — ราคาถูก ได้คำตอบทันทีว่าโปรตีนรั่วจริงไหม และมี **dysmorphic RBC, RBC cast, oval fat body** หรือไม่\n2. **ยืนยันเชิงปริมาณ** ด้วย **UPCR** หรือโปรตีน 24 ชั่วโมง\n3. **Serum albumin, lipid profile, Cr/eGFR** เพื่อเติมเกณฑ์ nephrotic ให้ครบ\n4. ค่อยตามด้วยการค้นหาสาเหตุทุติยภูมิและพิจารณาเจาะชิ้นเนื้อไต\n\n### กับดักที่คนพลาดจริง\n- **Dipstick บวกไม่ได้แปลว่าเป็นโรคไตเสมอ** — ปัสสาวะเข้มข้นมาก, pH ด่างจัด, มีเลือดหรือหนองปน, หรือมีสารทึบรังสี ล้วนให้ผลบวกลวง **ต้องยืนยันซ้ำเสมอ**\n- **Dipstick ลบไม่ได้ตัดโรคไต** — นอกจาก light chain แล้ว **microalbuminuria ในเบาหวานระยะแรกก็ต่ำกว่าเกณฑ์ที่ dipstick จับได้** ต้องส่ง urine albumin-creatinine ratio (ACR) ต่างหาก\n- **อย่าตัดสิน nephrotic จาก dipstick 4+ อย่างเดียว** — 4+ แปลว่า > 1,000 mg/dL ซึ่งขึ้นกับว่าปัสสาวะเข้มข้นแค่ไหน **ต้องมีตัวเลขเชิงปริมาณเสมอ**\n\n### ที่อาจารย์เน้นในสไลด์\nอาจารย์วางตาราง dipstick กับตาราง SSA **ไว้คู่กันในสไลด์เดียว** เพื่อให้เห็นว่า **เกณฑ์ตัวเลขของสองวิธีไม่เท่ากัน** (4+ ของ dipstick = >1,000 mg/dL แต่ 4+ ของ SSA = >500 mg/dL) และย้ำว่าประโยชน์ที่แท้จริงของ SSA คือ **ใช้จับโปรตีนที่ไม่ใช่ albumin** ซึ่ง dipstick มองไม่เห็น", "pearls": ["Dipstick จับได้แทบเฉพาะ albumin — dipstick ลบแต่โปรตีน 24 ชั่วโมงสูง ให้คิดถึง light chain จาก multiple myeloma ทันที", "SSA ผสมปัสสาวะต่อกรด 1:3 ตกตะกอนโปรตีนทุกชนิด จึงเป็นตัวจับ Bence Jones protein ข้างเตียง", "เก็บปัสสาวะ 24 ชั่วโมงต้องดู urine creatinine คู่เสมอ (หญิง 15–20 ชาย 20–25 mg/kg/วัน) ไม่งั้นไม่รู้ว่าเก็บครบไหม", "UPCR หน่วย g/g ประมาณโปรตีนกรัมต่อวันได้เลย ใช้ติดตามสะดวกกว่าเก็บ 24 ชั่วโมง"], "items": [{"id": "N-MCQ-08", "kind": "mcq", "stem": "A 46-year-old woman presents with 3 weeks of periorbital puffiness in the morning, bilateral leg oedema and frothy urine. Urine analysis shows specific gravity 1.020, protein 4+, glucose negative, RBC 0-2/HPF, WBC 0-1/HPF, and oval fat bodies with a Maltese cross appearance under polarised light. Serum albumin is 2.4 g/dL and total cholesterol 340 mg/dL. Which investigation is most appropriate to quantify the severity of her proteinuria in routine practice?", "choices": ["Serum protein electrophoresis", "Creatinine clearance calculated from the Cockcroft-Gault equation", "Urine protein-to-creatinine ratio from a first-morning voided specimen", "Repeat urine dipstick for protein on three consecutive days", "Renal ultrasonography with Doppler study"], "answer": 2, "explain": "หลักการ: dipstick บอกได้แค่ **กึ่งปริมาณ (semi-quantitative)** และถูกรบกวนมากจาก **ความเข้มข้นของปัสสาวะ** (ปัสสาวะเข้มข้นทำให้ดูมากเกินจริง, เจือจางทำให้ดูน้อยเกินจริง) นอกจากนี้ dipstick ตรวจจับ **albumin เป็นหลัก** จึงอาจพลาด **light chain (Bence Jones protein)** ใน multiple myeloma\n\n**Urine protein-to-creatinine ratio (UPCR)** แก้ปัญหานี้ด้วยการ **หารด้วย creatinine** — เนื่องจาก creatinine ถูกขับในอัตราที่ค่อนข้างคงที่ การหารจึง **ชดเชยความเข้มข้นของปัสสาวะโดยอัตโนมัติ** → ค่าที่ได้ (g/g creatinine) **สัมพันธ์ใกล้เคียงกับ 24-hour urine protein (g/day)** แต่ **สะดวกกว่า ไม่มีปัญหาการเก็บไม่ครบ 24 ชั่วโมง** ซึ่งเป็นข้อผิดพลาดที่พบบ่อยที่สุดของการเก็บปัสสาวะ 24 ชม.\n- ใช้ **first-morning specimen** เพื่อตัด **orthostatic (postural) proteinuria** ออกไป\n- UPCR >3-3.5 g/g = nephrotic range; >0.2 g/g = abnormal\n\nทำไมข้ออื่นผิด:\n- **Dipstick ซ้ำ 3 วัน**: ยังเป็นการตรวจกึ่งปริมาณ ไม่ได้ค่าเชิงปริมาณที่ใช้ติดตามการรักษา (แต่การยืนยันว่า persistent ก็มีประโยชน์ในกรณี transient proteinuria)\n- **Serum protein electrophoresis**: ใช้คัด **monoclonal gammopathy/multiple myeloma** ซึ่งเป็น **สาเหตุ** ของ nephrotic syndrome ที่ต้องคัดในผู้สูงอายุ — แต่ **ไม่ใช่การวัดปริมาณ proteinuria**\n- **Renal ultrasonography with Doppler**: ประเมินขนาดไต, echogenicity, การอุดกั้น และ renal vein thrombosis (ภาวะแทรกซ้อนสำคัญของ nephrotic syndrome) — มีประโยชน์ **แต่ไม่วัด proteinuria**\n- **Creatinine clearance (Cockcroft-Gault)**: ประเมิน **GFR** ไม่ใช่ proteinuria; และการประเมิน GFR ด้วยสูตรนี้ใน nephrotic syndrome ยังไม่น่าเชื่อถือเพราะน้ำหนักเปลี่ยนจาก edema\n\n**ขั้นต่อไปหลังยืนยันปริมาณ**: หาสาเหตุ — ตรวจ **glucose/HbA1c (diabetic nephropathy), ANA/anti-dsDNA/complement (lupus), HBsAg, anti-HCV, anti-HIV, VDRL, serum/urine protein electrophoresis + free light chain, anti-PLA2R (primary membranous)** และพิจารณา **renal biopsy** ในผู้ใหญ่เกือบทุกรายที่ไม่มีสาเหตุชัดเจน", "pearl": "**Oval fat body / Maltese cross** บน polarised light และ **fatty cast** เป็นลักษณะเฉพาะของ nephrotic range proteinuria — ออกทั้ง MCQ และ SAQ แปลผล UA ทุกปี", "topic": "Quantifying proteinuria", "src": "", "ref": ["MED34 MCQ ครั้งที่ 4 ข้อ 93 – เป็น nephrotic ส่งตรวจไร → UPCR", "MED34 FA – UPCR", "MED32 MCQ ข้อ 41 – Foamy urine, edema, oval fat bodies → nephrotic syndrome", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 50 – Foamy urine → nephrotic syndrome", "MED32 OSCE – ให้รูป urine sediment: oval fat body, dysmorphic RBC", "MED33 MCQ – Fatty cast : nephrotic syndrome", "MED30 SAQ – 1. Fatty cast 2. Nephrotic syndrome"], "nl": ["B9.3(2)", "3.1.6", "2.3.14(12)"]}, {"id": "N-OLD-018", "kind": "old", "stem": "Which test is most appropriate to quantify proteinuria in a patient with suspected nephrotic syndrome?", "choices": ["Urine specific gravity", "Serum albumin alone", "Serum creatinine alone", "Urine dipstick alone", "Spot urine protein-to-creatinine ratio (or 24-hour urine protein)"], "answer": 4, "explain": "**UPCR จากปัสสาวะครั้งเดียว (หน่วย g/g) สัมพันธ์ดีกับปริมาณโปรตีนต่อวัน** และสะดวกกว่าการเก็บ 24 ชั่วโมง; **dipstick บอกได้แค่คร่าว ๆ ขึ้นกับความเข้มข้นของปัสสาวะ และตรวจไม่พบ light chain หรือ microalbumin**", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 93 / MED34 FA MCQ", "ref": [], "nl": ["B9.3(2)", "3.1.6", "2.3.14(12)"]}, {"id": "N-OLD-032", "kind": "old", "stem": "A patient presents with periorbital and bilateral leg oedema with very foamy urine. Which investigation should be ordered first?", "choices": ["CT abdomen", "Liver biopsy", "Thyroid ultrasound", "Echocardiography", "Urinalysis with urine sediment examination"], "answer": 4, "explain": "**บวมทั่วตัว ต้องแยกสาเหตุจากไต หัวใจ ตับ ไทรอยด์ และภาวะขาดสารอาหาร** — **ปัสสาวะเป็นฟองมากบ่งชี้โปรตีนรั่ว** จึงเริ่มด้วย urinalysis พร้อมส่อง sediment ตามด้วย UPCR, albumin, creatinine; ถ้า UA ไม่มีโปรตีนจึงค่อยไล่หาสาเหตุนอกไต", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 OSCE", "ref": [], "nl": ["2.1.39", "B9.3(2)", "3.1.6"]}]}, {"id": "nephro-14-03", "title": "แยกชนิดของ proteinuria — ชั่วคราวหรือถาวร และมาจากกลไกไหน", "minutes": 8, "summary": "functional · orthostatic · overflow · tubular · glomerular — ปริมาณโปรตีนบอกกลไกได้เกือบหมด", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.3(2)", "2.3.14(12)", "2.3.2"], "md": "เจอโปรตีนในปัสสาวะแล้ว **อย่าเพิ่งวินิจฉัยโรคไต** — ต้องไล่ก่อนว่าเป็นชั่วคราวหรือถาวร และถ้าถาวรมาจากกลไกไหน **ตัวเลขปริมาณโปรตีนเป็นเบาะแสที่ดีที่สุด**\n\n### Transient proteinuria — ตรวจซ้ำแล้วหายไป\n\n| ชนิด | ปริมาณ | ลักษณะเด่น |\n|---|---|---|\n| **Functional** | **< 1 – 2 g/วัน** | ตะกอนปัสสาวะสะอาด (bland) · เกิดตอน **เครียด ออกกำลังหนัก ไข้ ติดเชื้อทางเดินปัสสาวะ หัวใจล้มเหลว** |\n| **Orthostatic** | **< 1 g/วัน** | **บวกตอนยืน ลบตอนนอน** — พบในวัยรุ่นผอมสูง พยากรณ์โรคดีมาก |\n\n**กลไก** — ภาวะเหล่านี้เพิ่ม **glomerular hemodynamic stress** ชั่วคราว (angiotensin II, norepinephrine สูงขึ้น ทำให้ efferent arteriole หดตัว ความดันในโกลเมอรูลัสสูงขึ้น) โปรตีนจึงรั่วมากกว่าปกติโดยที่**ไม่มีรอยโรคจริง** พอปัจจัยกระตุ้นหายไปโปรตีนก็หาย\n\n> **วิธีพิสูจน์ orthostatic proteinuria** — ให้ปัสสาวะทิ้งก่อนนอน แล้ว **เก็บปัสสาวะแรกตื่นทันทีที่ยังไม่ลุกเดิน** ถ้าโปรตีนลบ แต่ตัวอย่างกลางวันบวก = orthostatic **ไม่ต้องสืบค้นต่อ ไม่ต้องเจาะไต**\n\n### Persistent proteinuria — ตรวจซ้ำแล้วยังอยู่\n\n| ชนิด | ปริมาณ | กลไก | ตัวอย่าง |\n|---|---|---|---|\n| **Overflow** | หลากหลาย มัก **dipstick ลบ** | โปรตีนเล็กในเลือดสูงจนล้นความสามารถดูดกลับของ proximal tubule | **Light chain Ig — multiple myeloma** · **Lysozyme — AML** · **Myoglobin — rhabdomyolysis** · **Hemoglobin — hemolysis** |\n| **Tubular** | **< 1 – 2 g/วัน** | proximal tubule เสียหาย ดูดโปรตีนเล็ก (β2-microglobulin) กลับไม่ได้ | **ATN, AIN, chronic tubulointerstitial nephritis, ความดันโลหิตสูง** |\n| **Glomerular** | ตั้งแต่ **subnephrotic จนถึง > 3.5 g/วัน** | กำแพงกรองรั่ว | โรคโกลเมอรูลัสทุกชนิดในคาบนี้ |\n\n### วิธีคิดที่ใช้ได้จริงข้างเตียง\n1. **โปรตีน > 3.5 g/วัน = glomerular แทบแน่นอน** — tubular และ functional ไม่เคยขึ้นไปถึงระดับนี้\n2. **โปรตีน 1 – 2 g/วัน + ตะกอนสะอาด** — เป็นได้ทั้ง tubular, functional และ glomerular ระยะแรก ต้องดูบริบทและตรวจซ้ำ\n3. **โปรตีนสูงแต่ dipstick ลบ = overflow** จนกว่าจะพิสูจน์เป็นอย่างอื่น → ส่ง **SSA, serum/urine protein electrophoresis, serum free light chain**\n4. **มี dysmorphic RBC หรือ RBC cast ร่วมด้วย = glomerular** ไม่ว่าโปรตีนจะเท่าไร\n\n### กับดักที่คนพลาดจริง\n- **ผู้สูงอายุ + ซีด + ไตวาย + โปรตีนสูงแต่ dipstick ลบ + normal anion gap acidosis + K ต่ำ** = ภาพของ **multiple myeloma ที่ทำให้ proximal tubule เสียหายแบบ Fanconi** — ข้อนี้ออกสอบซ้ำ ๆ และคนมักตอบ chronic glomerulonephritis ผิด\n- **Tubular proteinuria ไม่ทำให้บวม** เพราะโปรตีนที่เสียน้อยเกินกว่าจะกด serum albumin ลงได้ ถ้าคนไข้บวมชัดต้องมองหา glomerular\n- **หัวใจล้มเหลวทำให้โปรตีนรั่วได้จริง** อย่ารีบสรุปว่าเป็นโรคไตปฐมภูมิในคนไข้ที่ decompensate อยู่ — รักษาให้ compensate แล้วตรวจซ้ำ", "pearls": ["โปรตีนเกิน 3.5 g/วัน = glomerular แทบแน่นอน · tubular กับ functional ไม่เคยเกิน 1–2 g/วัน", "Orthostatic proteinuria พิสูจน์ด้วยปัสสาวะแรกตื่นก่อนลุกเดิน — ลบตอนนอน บวกตอนยืน แล้วจบ ไม่ต้องเจาะไต", "โปรตีนมากแต่ dipstick ลบ = overflow (light chain) ต้องส่ง SPEP/UPEP และ serum free light chain", "Overflow ที่พบบ่อยสี่ตัว: light chain (MM), lysozyme (AML), myoglobin (rhabdomyolysis), hemoglobin (hemolysis)"], "items": [{"id": "N-OLD-028", "kind": "old", "stem": "A patient with generalised oedema has 2.5 g proteinuria per day with a bland urine sediment. Which mechanism of proteinuria is most likely?", "choices": ["Glomerular proteinuria from increased glomerular permeability", "Post-renal proteinuria from bleeding", "Tubular proteinuria from impaired reabsorption", "Overflow proteinuria from light chains", "Functional proteinuria from exercise"], "answer": 0, "explain": "**แยกกลไกของโปรตีนรั่ว 4 แบบ**: glomerular (ปริมาณมาก มัก > 2 g/วัน เป็น albumin เด่น), tubular (< 2 g/วัน, beta-2 microglobulin), overflow (light chain, myoglobin — dipstick มักลบ), และ functional/orthostatic (น้อยกว่า 1 g/วัน หายเองเมื่อพัก) — เคสนี้เข้าได้กับ glomerular", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 25", "ref": [], "nl": ["B9.3(2)", "2.3.14(12)", "3.1.6"]}, {"id": "N-OLD-025", "kind": "old", "stem": "A 65-year-old man has 3 months of malaise, Hct 25 percent, BUN/Cr 22/1.8 mg/dL, K 3.0 mEq/L, HCO3 18 mEq/L and 24-hour urine protein 3 g with a negative dipstick for albumin. What is the most likely diagnosis?", "choices": ["Chronic glomerulonephritis", "Minimal change disease", "Multiple myeloma with light chain (cast) nephropathy", "Diabetic nephropathy", "Analgesic nephropathy"], "answer": 2, "explain": "**เบาะแสคือโปรตีนในปัสสาวะปริมาณมากแต่ dipstick ลบ** — dipstick ตรวจจับเฉพาะ albumin จึงพลาด **light chain (Bence Jones protein)**; ร่วมกับซีด ไตวาย และ **normal anion gap acidosis กับ hypokalaemia จาก proximal tubular damage (Fanconi-like)** ให้คิดถึง myeloma", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["2.3.2", "B9.3(2)", "B9.2.7(2)"]}]}, {"id": "nephro-14-04", "title": "ปัสสาวะสีแดง — ไล่จนได้ว่าเลือดออกจากโกลเมอรูลัสหรือไม่", "minutes": 9, "summary": "แผนภูมิ dipstick → ปั่นดูน้ำใส → แยก glomerular ออกจาก non-glomerular hematuria", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["2.1.43", "B9.3(2)", "3.1.6"], "md": "ปัสสาวะสีแดงไม่ได้แปลว่ามีเลือดเสมอ อาจารย์ให้ไล่เป็นขั้นตายตัว **สามขั้น**\n\n### ขั้นที่ 1 · dipstick บวกหรือลบ\n\n**Dipstick ลบ** = ไม่มี heme เลย สีแดงมาจากสารอื่น\n- **Rifampin** (และ phenazopyridine, methyldopa)\n- **Porphyrin** (porphyria — ปัสสาวะคล้ำขึ้นเมื่อตั้งทิ้งไว้โดนแสง)\n- **สีผสมอาหารและอาหาร** เช่น บีทรูท แบล็กเบอร์รี\n\n### ขั้นที่ 2 · dipstick บวก → **ปั่นปัสสาวะแล้วดูน้ำส่วนบน (supernatant)**\n\n> **หลักการ** — dipstick จับ **heme** ซึ่งมีทั้งใน hemoglobin, myoglobin และในเม็ดเลือดแดง **ถ้าเป็นเม็ดเลือดแดงจริง เม็ดเลือดจะตกตะกอนลงก้นหลอด น้ำส่วนบนจะใส**\n\n| น้ำส่วนบนหลังปั่น | แปลว่า | คิดถึง |\n|---|---|---|\n| **ใส** + ตะกอนมีเม็ดเลือดแดง | **Hematuria จริง** | ไปขั้นที่ 3 |\n| **แดง** (ไม่มีเม็ดเลือดแดงในตะกอน) | มี heme ละลายอยู่ในน้ำปัสสาวะ | **Myoglobinuria** (rhabdomyolysis — CK สูง) หรือ **Hemoglobinuria** (intravascular hemolysis — serum haptoglobin ต่ำ, ซีรัมสีชมพู) |\n\n### ขั้นที่ 3 · เป็น hematuria จริง → glomerular หรือ non-glomerular\n\n| | **Glomerular hematuria** | **Non-glomerular hematuria** |\n|---|---|---|\n| สีปัสสาวะ | **แดงคล้ำ ขุ่นควัน หรือสีโคล่า (coca-cola)** | **แดงสดหรือชมพู** |\n| ลิ่มเลือด | **ไม่มี** | **อาจมี** |\n| โปรตีน | **> 500 mg/วัน** | **< 500 mg/วัน** |\n| รูปร่างเม็ดเลือดแดง | **Dysmorphic RBC** | **รูปร่างปกติ (isomorphic)** |\n| RBC cast | **มี** | **ไม่มี** |\n\n**เกณฑ์ตัวเลขที่ต้องจำ**\n- **Hematuria = เม็ดเลือดแดง ≥ 3 /HPF** ในปัสสาวะที่ปั่นแล้ว\n- เข้าเกณฑ์ **glomerular** เมื่อมีข้อใดข้อหนึ่ง\n  1. **RBC cast** — พบแม้อันเดียวก็นับ\n  2. **Dysmorphic RBC** — **เสียรูปแบบ microcystic มากกว่า 50%** หรือ **acanthocyte มากกว่า 5%**\n\n**ทำไมสีถึงต่างกัน** — เลือดจากโกลเมอรูลัสอยู่ใน tubule นาน เจอ **pH เป็นกรด** ทำให้ hemoglobin กลายเป็น **methemoglobin สีน้ำตาลคล้ำเหมือนโคล่า** และเพราะเลือดออกทีละน้อยกระจายตัวใน tubule จึง **ไม่จับเป็นลิ่ม** ส่วนเลือดจากกระเพาะปัสสาวะหรือท่อไตออกมาเป็นก้อนในที่โล่ง จึง **แดงสดและจับลิ่มได้**\n\n### วินิจฉัยแยกโรคเมื่อเป็น glomerular hematuria\n- **Post-streptococcal GN** — มีการติดเชื้อนำ 1–3 สัปดาห์ **C3 ต่ำ**\n- **IgA nephropathy** — ปัสสาวะเป็นเลือด **พร้อมกับ** การติดเชื้อทางเดินหายใจ (synpharyngitic) **complement ปกติ**\n- **RPGN** — ไตวายเร็วเป็นวันถึงสัปดาห์ **ต้องเจาะชิ้นเนื้อไตด่วน**\n- **Lupus nephritis** · **thin basement membrane disease** · **Alport syndrome**\n\n### กับดักที่คนพลาดจริง\n- **ประจำเดือนปนเปื้อน** เป็นสาเหตุอันดับต้น ๆ ของ hematuria ผลบวกลวง — ให้เก็บซ้ำหลังหมดประจำเดือน 1 สัปดาห์\n- **เม็ดเลือดแดงเยอะมากแต่ไม่มี pyuria** ให้คิดถึงโกลเมอรูลัส ไม่ใช่การติดเชื้อ — **การติดเชื้อต้องมีเม็ดเลือดขาวด้วยเสมอ**\n- **อายุมากกว่า 40 ปีที่มี hematuria แบบ non-glomerular** ต้องสืบค้นหา **มะเร็งทางเดินปัสสาวะ** ด้วย CT urography และส่องกล้องกระเพาะปัสสาวะ **อย่าหยุดแค่บอกว่าไม่ใช่โรคโกลเมอรูลัส**\n- **Dysmorphic RBC ต้องดูจากปัสสาวะสด** ถ้าตั้งทิ้งไว้นานเม็ดเลือดแดงปกติก็เสียรูปได้ กลายเป็นผลบวกลวง\n\n### ที่อาจารย์เน้นในสไลด์\nอาจารย์วาดแผนภูมิ **\"Red urine → dipstick → ปั่นดู supernatant\"** ไว้เป็นหน้าเดียวจบ และเน้นตัวเลขสองตัวคือ **acanthocyte > 5%** และ **distorted microcystic RBC > 50%** ว่าเป็นเกณฑ์ที่ใช้ตัดสินจริงในห้องปฏิบัติการ ไม่ใช่แค่ \"เห็นเม็ดเลือดแดงรูปร่างแปลก ๆ\"", "pearls": ["ปัสสาวะแดง + dipstick บวก ให้ปั่นดูน้ำส่วนบนก่อนเสมอ — น้ำใสคือ hematuria จริง น้ำแดงคือ myoglobin หรือ hemoglobin", "สีโคล่า ไม่มีลิ่มเลือด โปรตีนเกิน 500 mg/วัน dysmorphic RBC และ RBC cast = glomerular ทั้งชุด", "เกณฑ์ตัวเลข: acanthocyte > 5% หรือ distorted microcystic RBC > 50% หรือ RBC cast แม้อันเดียว", "Hematuria แบบ non-glomerular ในคนอายุเกิน 40 ปี ต้องตัดมะเร็งทางเดินปัสสาวะออกเสมอ"], "items": [{"id": "N-MCQ-11", "kind": "mcq", "stem": "A 30-year-old woman presents with red-coloured urine. You suspect a glomerular source of bleeding. Which of the following findings would argue AGAINST a glomerular origin?", "choices": ["Red blood cell casts in the urinary sediment", "Dysmorphic red blood cells on phase-contrast microscopy", "Associated proteinuria of 1 gram per day", "Uniform red discolouration throughout the entire urinary stream", "Blood clots passed in the urine"], "answer": 4, "explain": "กลไกที่ใช้ตัดสิน: เลือดที่ออกจาก **glomerulus** ต้องผ่าน **glomerular basement membrane ที่มีรูเล็กมาก** แล้วเดินทางผ่าน **tubule ที่มี osmolality และ pH เปลี่ยนแปลงรุนแรง** → RBC ถูกบีบและเสียรูป (**dysmorphic, acanthocyte, doughnut cell**) และอาจถูกห่อด้วย **Tamm-Horsfall protein เกิดเป็น RBC cast**\n\nที่สำคัญคือ **tubular fluid มี urokinase และ Tamm-Horsfall protein ซึ่งยับยั้งการแข็งตัวของเลือด** → **เลือดจาก glomerulus จะไม่เกิดลิ่ม (clot)**\n→ ดังนั้น **การมี blood clot ในปัสสาวะบ่งชี้ว่าเลือดออกจากทางเดินปัสสาวะส่วนล่างหรือ ureter/กระเพาะปัสสาวะ/ต่อมลูกหมาก (non-glomerular)** ไม่ใช่จาก glomerulus = คำตอบ\n\nทำไมข้ออื่นสนับสนุน glomerular origin:\n- **Dysmorphic RBC (>80% หรือพบ acanthocyte >5%)**: เกิดจากการถูกบีบผ่าน GBM และ osmotic stress ใน tubule — เป็นตัวบ่งชี้ที่ดีที่สุดอย่างหนึ่ง\n- **RBC cast**: **จำเพาะเกือบสมบูรณ์ (pathognomonic)** ต่อ glomerulonephritis เพราะ cast ก่อตัวได้เฉพาะใน tubule\n- **Proteinuria 1 g/day**: เลือดออกจากทางเดินปัสสาวะส่วนล่างทำให้ protein ในปัสสาวะขึ้นเพียงเล็กน้อย — **proteinuria ที่มีนัยสำคัญร่วมกับ hematuria บ่งถึงโรคที่ glomerulus**\n- **สีแดงสม่ำเสมอทั้งสาย (total haematuria)**: บ่งว่าเลือดผสมมาตั้งแต่ต้นทาง (ไตหรือ ureter); ถ้าเป็น **initial haematuria** (แดงตอนต้น) ชี้ urethra, **terminal haematuria** (แดงตอนปลาย) ชี้ bladder neck/prostate\n\n**แนวทางต่อไป**: ถ้าภาพเป็น **non-glomerular** โดยเฉพาะผู้ป่วยอายุ >40 ปี, สูบบุหรี่, สัมผัสสีย้อม/aromatic amine → ต้องคัด **urothelial carcinoma** ด้วย **cystoscopy + CT urography**; ถ้าเป็น **glomerular** → ตรวจ complement, ANA, ANCA, anti-GBM, serology ไวรัส และพิจารณา renal biopsy\n\n**สาเหตุที่ทำให้ปัสสาวะแดงแต่ \"ไม่ใช่เลือด\" (pseudohaematuria)** ที่ต้องแยกด้วย dipstick + microscopy: **myoglobinuria (rhabdomyolysis), haemoglobinuria (intravascular hemolysis), porphyria, beetroot, rifampicin, phenazopyridine, nitrofurantoin** — dipstick บวกแต่ **ไม่เห็น RBC ใต้กล้อง** ชี้ไปที่ myoglobin/hemoglobin", "pearl": "ชุดคำ \"**smoking + painless gross haematuria**\" = ต้องคิดถึง **bladder cancer** → investigation of choice คือ **cystoscopy** (ออกใน MED34 ครั้งที่ 4 ข้อ 4 และ MED35 ข้อ 35)", "topic": "Glomerular versus non-glomerular haematuria", "src": "", "ref": ["MED31 MCQ ข้อ 13 – red urine suspected glomerular disease ไม่ควรเจออะไร → Clot urine", "MED31 OSCE ข้อ 9 – ผู้ป่วยหญิง urine RBC 50-100 protein trace glucose neg WBC 0-1 พบอะไรใน UA → Dysmorphic RBC, doughnut cell", "MED34 MCQ ครั้งที่ 4 ข้อ 4 – Smoking, hematuria what investigate for definite dx → Cystoscope", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 35 – ฉี่เป็นเลือด มี UGIB → UA cast crystal / MRA renal artery", "MED33 MCQ – ผู้หญิงผลตรวจทุกอย่างปกติ เจอ RBC ใน UA 20-30"], "nl": ["B9.3(2)", "2.1.43", "3.1.6"]}, {"id": "N-OLD-026", "kind": "old", "stem": "Red blood cells in the urine with dysmorphic forms and red cell casts indicate bleeding from which site?", "choices": ["The ureter", "The bladder", "The glomerulus", "The prostate", "The urethra"], "answer": 2, "explain": "**Dysmorphic RBC และ RBC cast = glomerular haematuria** เพราะเม็ดเลือดแดงถูกบีบผ่านผนัง glomerulus และถูกหล่อในท่อไต; ถ้าเป็นเลือดจากทางเดินปัสสาวะส่วนล่างจะเป็น **เม็ดเลือดแดงรูปร่างปกติและอาจมีลิ่มเลือด**", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 91", "ref": [], "nl": ["B9.3(2)", "2.1.43", "3.1.6"]}, {"id": "N-OLD-027", "kind": "old", "stem": "Which finding argues AGAINST a glomerular source of haematuria?", "choices": ["Red blood cell casts", "Brown or cola-coloured urine", "Blood clots in the urine", "Dysmorphic red blood cells", "Coexisting proteinuria more than 500 mg per day"], "answer": 2, "explain": "**ลิ่มเลือดในปัสสาวะบ่งว่าเลือดออกจากทางเดินปัสสาวะ (non-glomerular)** — ปัสสาวะจาก glomerulus จะมีสารยับยั้งการแข็งตัวจากท่อไตทำให้ไม่จับเป็นลิ่ม และมักเป็นสีน้ำล้างเนื้อหรือสีโคล่า; เลือดออกที่มีลิ่มในผู้สูงอายุที่สูบบุหรี่ต้องนึกถึงมะเร็งทางเดินปัสสาวะ", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 13", "ref": [], "nl": ["B9.3(2)", "2.1.43", "B9.2.4-3(2)"]}, {"id": "N-OLD-030", "kind": "old", "stem": "Urinalysis shows RBC 50-100/HPF with dysmorphic forms, trace protein, no glucose and WBC 0-1/HPF. Which set of differential diagnoses is most appropriate?", "choices": ["Acute tubular necrosis, prerenal azotaemia and obstruction", "Urinary tract infection, urolithiasis and bladder cancer", "Post-streptococcal glomerulonephritis, IgA nephropathy and rapidly progressive glomerulonephritis", "Renal tubular acidosis, Fanconi syndrome and Bartter syndrome", "Nephrotic syndrome, amyloidosis and diabetic nephropathy"], "answer": 2, "explain": "**Dysmorphic RBC โดยไม่มี pyuria = glomerular disease** วินิจฉัยแยกโรคหลักคือ APSGN (C3 ต่ำ ประวัติติดเชื้อนำ), **IgA nephropathy (ปัสสาวะเป็นเลือดพร้อมกับการติดเชื้อทางเดินหายใจ ไม่ต้องรอ 2 สัปดาห์)** และ RPGN (ไตวายเร็วภายในวัน-สัปดาห์ ต้องเจาะชิ้นเนื้อไตด่วน)", "pearl": "", "topic": "", "src": "MED31 OSCE ข้อ 9", "ref": [], "nl": ["B9.3(2)", "2.3.14(2)", "3.1.6"]}]}, {"id": "nephro-14-05", "title": "Step approach — 6 คำถาม และกลุ่มอาการทางโกลเมอรูลัส 5 แบบ", "minutes": 10, "summary": "โครงคิดหลักของคาบนี้ พร้อมเกณฑ์วินิจฉัยและตารางเทียบ nephrotic กับ nephritic", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["2.3.14(12)", "2.3.14(2)", "B9.2.2(4)", "2.1.39"], "md": "นี่คือโครงที่อาจารย์ใช้ทั้งคาบ — **ถามซ้ำ 6 คำถามนี้ทุกครั้งที่เจอผู้ป่วยสงสัยโรคโกลเมอรูลัส**\n\n### 6 คำถามตามลำดับ\n1. **Is this glomerular disease?** → มี **glomerular hematuria และ/หรือ glomerular proteinuria** หรือไม่\n2. **What's the glomerular syndrome?** → จัดเข้ากลุ่มอาการ 1 ใน 5\n3. **What's the morphological diagnosis?** → MCD · FSGS · MN · deposition disease · ANCA · anti-GBM\n4. **Is this primary or secondary?** → **primary = renal limited** · **secondary = มีโรคระบบอื่นอยู่เบื้องหลัง**\n5. **What are the proper investigations?**\n6. **What are the proper treatments?**\n\n> **ข้อ 4 สำคัญที่สุดในเวชปฏิบัติ** — เพราะถ้าเป็น secondary การรักษาคือ **รักษาโรคต้นเหตุ** (หยุดยา รักษามะเร็ง รักษาการติดเชื้อ) ไม่ใช่ให้ยากดภูมิคุ้มกัน การให้ steroid กับ MN ที่เกิดจากมะเร็งโดยไม่หามะเร็งก่อนคือความผิดพลาดที่อันตราย\n\n### กลุ่มอาการทั้ง 5 และเกณฑ์\n\n**1 · Asymptomatic urinary abnormality**\n- **Isolated proteinuria 130 mg – 3 g/วัน** และ/หรือ\n- **Hematuria** — dysmorphic RBC **> 2 /HPF** ในปัสสาวะที่ปั่นแล้ว หรือ **RBC cast > 1**\n\n**2 · Nephrotic syndrome** (ต้องครบทั้งชุด)\n- **Proteinuria > 3.5 g/วัน**\n- **บวม (edema)**\n- **Hypoalbuminemia < 3.5 g/dL**\n- **Hypercholesterolemia > 200 mg/dL**\n- **Lipiduria** — **oval fat body หรือ fatty cast** (ส่องด้วย polarised light เห็นเป็น **Maltese cross**)\n\n**3 · Nephritic syndrome**\n- **Glomerular hematuria** (dysmorphic RBC / RBC cast)\n- **Proteinuria < 3 g/วัน**\n- **Azotemia**\n- **บวม**\n- **Oliguria หรือ AKI**\n- **ความดันโลหิตสูงที่เพิ่งเกิดขึ้น**\n\n**4 · Rapidly progressive glomerulonephritis (RPGN)**\n- **Acute GN ที่มี crescent จำนวนมาก — มักมากกว่า 30 – 50% ของโกลเมอรูลัส**\n- **ไตเสื่อมเร็ว — โดยทั่วไป GFR ลดลง 50% ภายใน 3 เดือน**\n\n**5 · Chronic glomerulonephritis (CGN)**\n- **ไตเสื่อมช้า ๆ นานกว่า 3 เดือน**\n- **Proteinuria > 3 g/วัน และ/หรือ glomerular hematuria**\n- **ความดันโลหิตสูง**\n- **ไตขนาดเล็ก หรือมี glomerulosclerosis รุนแรง**\n\n### ตารางเทียบ nephrotic กับ nephritic\n\n| ลักษณะ | **Nephrotic syndrome** | **Nephritic syndrome** |\n|---|---|---|\n| บวม | **++++** | ++ |\n| ความดันโลหิตสูง | **ไม่มี** | **มี** |\n| น้ำท่วมปอด | มักไม่มี | **อาจมี** |\n| ปัสสาวะเป็นฟอง / proteinuria | **++++** | ++ |\n| Serum albumin | **ต่ำ** | ปกติหรือต่ำเล็กน้อย |\n| Glomerular hematuria | **ไม่มี** | **มี** |\n| Oliguria / AKI | มักไม่มี | **มี** |\n\n### โรคไหนออกมาเป็นกลุ่มอาการไหน\n\n| โรค | Nephrotic | Nephritic |\n|---|---|---|\n| **Minimal change disease (MCD)** | **++++** | – |\n| **Membranous nephropathy (MN)** | **++++** | + |\n| **Focal segmental glomerulosclerosis (FSGS)** | +++ | ++ |\n| **Mesangial proliferative GN** (IgA nephropathy, lupus nephritis) | ++ | ++ |\n| **Membranoproliferative GN (MPGN)** | ++ | **+++** |\n| **Severe GN** (IgA nephropathy, lupus nephritis) | ++ | **+++** |\n| **Crescentic GN** | + | **++++** |\n\n> อ่านตารางนี้เป็นสเปกตรัม — **ยิ่งโรคทำให้เซลล์แบ่งตัวและอักเสบมาก (proliferative/crescentic) ยิ่งออกทาง nephritic** · **ยิ่งโรครบกวนเฉพาะ podocyte โดยไม่อักเสบ ยิ่งออกทาง nephrotic**\n\n### กับดักที่คนพลาดจริง\n- **Nephrotic ไม่ใช่แค่ \"โปรตีนเกิน 3.5\"** — ต้องมี hypoalbuminemia ด้วย ถ้าโปรตีนรั่วมากแต่ albumin ยังปกติ เรียก **nephrotic-range proteinuria เฉย ๆ** (พบใน FSGS ทุติยภูมิจากอ้วนและใน diabetic nephropathy ระยะแรก)\n- **ภาวะแทรกซ้อนของ nephrotic มาจากการเสียโปรตีนหลายชนิด ไม่ใช่แค่ albumin** — เสีย **antithrombin III → ลิ่มเลือดอุดตัน โดยเฉพาะ renal vein thrombosis ใน MN** · เสีย **immunoglobulin → ติดเชื้อ โดยเฉพาะ pneumococcus** · เสีย **vitamin D-binding protein** และ **transferrin**\n- **สองกลุ่มอาการทับซ้อนกันได้** โดยเฉพาะ FSGS, IgA nephropathy และ lupus nephritis — เจอคนไข้ที่มีทั้งโปรตีนเยอะและเม็ดเลือดแดงเยอะ **อย่าพยายามยัดเข้ากล่องเดียว แต่ให้คิดถึงโรคที่อยู่กลางตาราง**\n\n### ที่อาจารย์เน้นในสไลด์\nอาจารย์วางสไลด์ 6 คำถามนี้ซ้ำเป็นสไลด์คั่นทุกครั้งก่อนขึ้นหัวข้อใหม่ แล้วค่อยไฮไลต์ว่ากำลังตอบคำถามข้อไหนอยู่ — **ให้ใช้โครงนี้เป็นแผนที่ของทั้งคาบ** และจำตาราง **\"โรค × ++++\" ** ไว้ เพราะเป็นตัวเชื่อมระหว่างกลุ่มอาการที่เห็นข้างเตียงกับพยาธิสภาพที่จะเจอในชิ้นเนื้อไต", "pearls": ["เกณฑ์ nephrotic ครบชุด: โปรตีน > 3.5 g/วัน + บวม + albumin < 3.5 g/dL + cholesterol > 200 mg/dL + lipiduria (oval fat body/fatty cast)", "ความดันโลหิตสูงกับ glomerular hematuria คือสองตัวที่แยก nephritic ออกจาก nephrotic ได้เร็วที่สุด", "RPGN = crescent มากกว่า 30–50% และ GFR ตกครึ่งหนึ่งภายใน 3 เดือน — เจอเมื่อไรต้องเจาะไตด่วน", "ภาวะแทรกซ้อน nephrotic มาจากโปรตีนที่เสียไป: antithrombin III (ลิ่มเลือด) · immunoglobulin (ติดเชื้อ) · vitamin D-binding protein · transferrin", "ถามให้ครบ 6 คำถาม โดยเฉพาะข้อ 'primary หรือ secondary' เพราะมันเปลี่ยนการรักษาทั้งหมด"], "items": [{"id": "N-MCQ-07", "kind": "mcq", "stem": "Which of the following is NOT part of the diagnostic criteria for nephrotic syndrome?", "choices": ["Microscopic haematuria with dysmorphic red blood cells", "Hyperlipidaemia", "Serum albumin less than 3.0 grams per decilitre", "Generalised pitting oedema", "Proteinuria greater than 3.5 grams per 1.73 square metres per day"], "answer": 0, "explain": "กลไกแกนของ nephrotic syndrome: ความเสียหายของ **glomerular filtration barrier ที่ชั้น podocyte** (foot process effacement, ความผิดปกติของ nephrin/podocin, การสูญเสีย negative charge ของ glomerular basement membrane) → **รั่ว protein ออกมหาศาลโดยที่ \"ไม่มีการอักเสบที่ทำลาย capillary wall\"**\n\nผลที่ตามมาเป็นลูกโซ่ = องค์ประกอบของ tetrad\n1. **Heavy proteinuria >3.5 g/1.73 m2/day** (ในเด็กใช้ >40 mg/m2/hr หรือ UPCR >2-3)\n2. **Hypoalbuminaemia** (albumin <3.0 g/dL) จากการสูญเสียเกินกว่าตับจะสร้างชดเชย\n3. **Oedema** — จาก oncotic pressure ที่ลด (underfill) ร่วมกับ **การดูดซึม Na กลับที่ไตเพิ่มขึ้นโดยตรงจากการกระตุ้น ENaC (overfill)** ซึ่งเป็นกลไกที่สำคัญกว่าในผู้ใหญ่จำนวนมาก\n4. **Hyperlipidaemia** — ตับเพิ่มการสร้าง lipoprotein เพื่อชดเชย oncotic pressure ที่ลด ร่วมกับ **การสูญเสีย lipoprotein lipase regulator ทางปัสสาวะ** → LDL และ cholesterol สูง\n\n**Microscopic haematuria ที่มี dysmorphic RBC และ RBC cast เป็นลักษณะของ \"nephritic\" ไม่ใช่ \"nephrotic\"** — เพราะ nephritic เกิดจาก **การอักเสบ (inflammation) ที่ทำลายผนัง glomerular capillary** ทำให้เม็ดเลือดแดงลอดออกมาและถูกบีบจนเสียรูป (dysmorphic) ขณะผ่าน tubule → คำตอบที่ \"ไม่ใช่\"\n\n**ตารางแยก nephrotic vs nephritic (high-yield)**\n| | **Nephrotic** | **Nephritic** |\n|---|---|---|\n| กลไก | podocyte injury, non-inflammatory | **inflammation/proliferation** |\n| Proteinuria | **>3.5 g/day** | <3.5 g/day (sub-nephrotic) |\n| ปัสสาวะ | **oval fat body, fatty/waxy cast** | **dysmorphic RBC, RBC cast** |\n| ความดัน | ปกติหรือสูงเล็กน้อย | **สูง** |\n| GFR | มักปกติในระยะแรก | **ลดลง (azotemia), oliguria** |\n| ตัวอย่างโรค | MCD, FSGS, membranous, diabetic nephropathy, amyloid | PSGN, IgA nephropathy, lupus nephritis, RPGN, anti-GBM |\n\nภาวะแทรกซ้อนของ nephrotic ที่ออกสอบ: **hypercoagulable state (เสีย antithrombin III ทางปัสสาวะ → renal vein thrombosis, DVT/PE)**, **การติดเชื้อ** (เสีย IgG และ complement factor B → เสี่ยง encapsulated organism, spontaneous bacterial peritonitis), **vitamin D deficiency** (เสีย vitamin D binding protein), **anemia** (เสีย transferrin/EPO), **AKI**, และ **hypothyroidism** (เสีย thyroxine-binding globulin)", "pearl": "บางโรคมาเป็น **nephritic-nephrotic overlap** (เช่น lupus nephritis class IV, membranoproliferative GN, diffuse proliferative GN) — เจอ proteinuria หนักร่วมกับ dysmorphic RBC/RBC cast ได้ จึงต้องอ่าน UA ให้ครบทุกองค์ประกอบ ไม่ฟันธงจากข้อเดียว", "topic": "Criteria for nephrotic syndrome", "src": "", "ref": ["MED28 MED421 Medicine I ข้อ 48 – Which of the following is NOT included in the criteria for diagnosis of nephrotic syndrome? (มี choice Hematuria)", "MED32 MCQ – ลักษณะที่ common ของ nephrotic syndrome → Ans: ascites", "MED31 MCQ ข้อ 13 – red urine suspected glomerular disease ไม่ควรเจออะไร → Clot urine", "MED32 MCQ ข้อ 41 – Foamy urine, edema, oval fat bodies → nephrotic syndrome"], "nl": ["B9.2.2(4)", "2.3.14(12)"]}, {"id": "N-OLD-016", "kind": "old", "stem": "Which of the following is NOT part of the diagnostic criteria for nephrotic syndrome?", "choices": ["Haematuria", "Generalised oedema", "Proteinuria more than 3.5 g per day", "Hypoalbuminaemia", "Hyperlipidaemia"], "answer": 0, "explain": "**เกณฑ์ nephrotic syndrome**: โปรตีนในปัสสาวะ > 3.5 g/วัน/1.73 m2, albumin ต่ำ, บวม และไขมันในเลือดสูงพร้อม lipiduria; **hematuria เป็นลักษณะของ nephritic syndrome** (RBC cast, ความดันสูง, GFR ตก) — ถ้าเจอทั้งสองแบบให้คิดถึงโรคที่คาบเกี่ยว เช่น lupus nephritis หรือ membranoproliferative GN", "pearl": "", "topic": "", "src": "MED28 MED421 Medicine I ข้อ 48", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "B9.3(2)"]}, {"id": "N-OLD-017", "kind": "old", "stem": "A patient has foamy urine, periorbital oedema and urine microscopy showing oval fat bodies and fatty casts. What is the diagnosis?", "choices": ["Acute glomerulonephritis", "Nephrotic syndrome", "Urinary tract infection", "Renal tubular acidosis", "Acute tubular necrosis"], "answer": 1, "explain": "**ฟองในปัสสาวะ + บวม + oval fat body/fatty cast (ภายใต้ polarised light เห็นเป็น Maltese cross) = nephrotic syndrome**; ไขมันรั่วออกมาเพราะตับสร้าง lipoprotein เพิ่มขึ้นเพื่อชดเชย albumin ที่ต่ำ", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 50 / MED32 MCQ", "ref": [], "nl": ["B9.2.2(4)", "B9.3(2)", "3.1.6"]}, {"id": "N-OLD-019", "kind": "old", "stem": "Which complication is characteristic of nephrotic syndrome?", "choices": ["Hyperkalaemia from aldosterone deficiency", "Polycythaemia from erythropoietin excess", "Metabolic alkalosis from chloride loss", "Venous thromboembolism from urinary loss of antithrombin III", "Hypercalcaemia from PTH excess"], "answer": 3, "explain": "**Nephrotic syndrome ทำให้เสียโปรตีนหลายชนิดทางปัสสาวะ** — antithrombin III (→ ลิ่มเลือด โดยเฉพาะ renal vein thrombosis ใน membranous nephropathy), immunoglobulin (→ ติดเชื้อ เช่น pneumococcus), vitamin D-binding protein และ transferrin", "pearl": "", "topic": "", "src": "MED32 MCQ", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "2.1.39"]}]}, {"id": "nephro-14-06", "title": "Minimal change disease — nephrotic ที่ชิ้นเนื้อดูปกติ", "minutes": 9, "summary": "โรค nephrotic อันดับหนึ่งของเด็ก ตอบสนอง steroid ดีมาก แต่ต้องมองหาสาเหตุทุติยภูมิในผู้ใหญ่", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.2.2(4)", "2.3.14(12)", "2.1.39"], "md": "**กลไก** — เชื่อว่าเป็นโรคของ **podocyte** ที่ถูกรบกวนด้วยปัจจัยที่ไหลเวียนในเลือด (circulating permeability factor จาก T cell ที่ผิดปกติ และในบางรายมี **แอนติบอดีต่อ nephrin**) ทำให้ **foot process แบนราบไปทั้งหมด (diffuse effacement)** และ **เสียประจุลบ** โปรตีนจึงรั่วออกมาอย่างมหาศาล **แต่ไม่มีการอักเสบ ไม่มีการแบ่งตัวของเซลล์ และไม่มี immune complex มาเกาะ** — นี่คือเหตุผลที่ชิ้นเนื้อดู \"ปกติ\" ใต้กล้องธรรมดา และเป็นเหตุผลที่**ไม่มีความดันสูง ไม่มีเลือดในปัสสาวะ และ Cr ไม่ขึ้น**\n\n### ใครเป็น\n- **เด็กมากกว่าผู้ใหญ่ · ชายมากกว่าหญิง**\n- **70% ของกลุ่มอาการ nephrotic ในเด็กอายุน้อยกว่า 10 ปี**\n- **10 – 15% ของผู้ใหญ่**\n- ในผู้ใหญ่มีการกระจายแบบ **bimodal** — พบมากในเด็กเล็กและกลับมาพบมากอีกครั้งในผู้สูงอายุ\n\n### ภาพทางคลินิก\n- **เกิดขึ้นเร็วทันที (abrupt onset)** — คนไข้มักบอกวันที่เริ่มบวมได้\n- **โปรตีนรั่วมาก (heavy proteinuria)**\n- **Hypoalbuminemia < 3.0 g/dL**\n- **Hyperlipidemia**\n- **แทบไม่มีอาการของ glomerulonephritis** — ไม่ค่อยมีความดันสูง ไม่ค่อยมีเลือดในปัสสาวะ Cr ไม่ค่อยขึ้น\n\n### สาเหตุทุติยภูมิที่ต้องถามทุกราย\n\n| กลุ่ม | ตัวอย่าง |\n|---|---|\n| **การติดเชื้อ** | ไวรัส · ปรสิต |\n| **ยา** | **NSAIDs** · gold · lithium · interferon · ampicillin · rifampin |\n| **มะเร็ง** | **Hodgkin lymphoma** (คลาสสิกที่สุด) · lymphoma/leukemia · solid tumor |\n| **ภูมิแพ้** | อาหาร · ฝุ่น · ผึ้งต่อย · เกสร · poison ivy/oak · dermatitis herpetiformis |\n| **โรคอื่น** | SLE · หลังปลูกถ่ายเซลล์ต้นกำเนิดเม็ดเลือด |\n\n### พยาธิสภาพ — จำสามบรรทัด\n\n| | สิ่งที่เห็น |\n|---|---|\n| **LM** | **ปกติ ไม่มีพยาธิสภาพจำเพาะ** |\n| **IF** | **ไม่ติดสีอะไรเลย (no staining)** |\n| **EM** | **Diffuse fusion (effacement) ของ foot process · ไม่มี electron dense deposit** |\n\n### การรักษา (KDIGO)\n- **Prednisolone 1 mg/kg/วัน (สูงสุด 80 mg) วันละครั้ง** หรือ **2 mg/kg (สูงสุด 120 mg) วันเว้นวัน** *(เกรด 2C)*\n- ให้ **steroid ขนาดสูงอย่างน้อย 4 สัปดาห์** และ **นานที่สุดไม่เกิน 16 สัปดาห์** ถ้ายังไม่ complete remission *(2C)*\n- **ลดขนาดยาอย่างช้า ๆ (5 – 10 mg ต่อสัปดาห์) รวมระยะเวลาได้ถึง 6 เดือนหลัง remission**\n\n> **หมายเหตุให้ทันสมัย** — สไลด์อ้าง **KDIGO 2012** ฉบับปัจจุบันคือ **KDIGO 2021** ซึ่ง **ขนาดและระยะเวลาของ steroid ยังเหมือนเดิม** แต่เพิ่มทางเลือกให้ชัดขึ้นในรายที่ **กลับเป็นซ้ำบ่อยหรือพึ่ง steroid** ได้แก่ **cyclophosphamide, calcineurin inhibitor, mycophenolate หรือ rituximab** เพื่อลดผลข้างเคียงสะสมจาก steroid — ตอบข้อสอบตามสไลด์ได้ แต่ให้รู้ทางเลือกกลุ่มนี้ไว้ด้วย\n\n### กับดักที่คนพลาดจริง\n- **เด็กที่เข้าได้กับ MCD ไม่ต้องเจาะไตก่อน** — ให้ steroid ไปเลย เจาะเมื่อ **ไม่ตอบสนอง** หรือมีลักษณะผิดแผน (อายุน้อยกว่า 1 ปีหรือมากกว่า 12 ปี ความดันสูง เลือดในปัสสาวะมาก Cr ขึ้น C3 ต่ำ) · **ผู้ใหญ่ต้องเจาะเสมอ** เพราะสาเหตุกระจายกว่ามาก\n- **ผู้ใหญ่ที่เป็น MCD ต้องคัดกรอง Hodgkin lymphoma และถามยา NSAIDs ทุกราย**\n- **NSAIDs ทำให้เกิด MCD ร่วมกับ acute interstitial nephritis พร้อมกันได้** จึงเป็นรายที่ **มีทั้ง nephrotic และ Cr ขึ้น** ผิดจาก MCD ทั่วไป\n- **Cr ที่ขึ้นระหว่างรักษา MCD ไม่ได้แปลว่าโรคกำเริบเสมอ** — ต้องแยก **ภาวะขาดน้ำจากยาขับปัสสาวะ**, **renal vein thrombosis** และ **acute interstitial nephritis จากยา** (เบาะแส: **ปัสสาวะมีเม็ดเลือดขาวโดยเพาะเชื้อไม่ขึ้น และมี WBC cast**)", "pearls": ["MCD = LM ปกติ · IF ไม่ติดสี · EM foot process effacement ทั่วทั้งหมด ไม่มี deposit", "เด็กเข้าเกณฑ์ MCD ให้ steroid ได้เลยไม่ต้องเจาะไต แต่ผู้ใหญ่ต้องเจาะทุกราย", "ผู้ใหญ่เป็น MCD ให้มองหา Hodgkin lymphoma และ NSAIDs เสมอ", "Steroid ขนาดสูงอย่างน้อย 4 สัปดาห์ สูงสุด 16 สัปดาห์ แล้วลดช้า ๆ 5–10 mg/สัปดาห์ นานถึง 6 เดือน", "กำลังรักษา MCD แล้ว Cr ขึ้น + sterile pyuria + WBC cast = acute interstitial nephritis จากยา ไม่ใช่โรคกำเริบ"], "items": [{"id": "N-MCQ-12", "kind": "mcq", "stem": "A 20-year-old man presents with 1 week of rapidly progressive periorbital and leg oedema. Urine protein is 4+ with a urine protein-to-creatinine ratio of 9 g/g, serum albumin 1.8 g/dL, total cholesterol 420 mg/dL, creatinine 0.9 mg/dL, and urine microscopy shows no red cells and no casts apart from occasional fatty casts. Complement levels, ANA, HBsAg, anti-HCV and anti-HIV are all negative. He is started on prednisolone 1 mg/kg/day. Two days later he develops sudden right flank pain, gross haematuria and a rise in creatinine to 2.1 mg/dL. Which of the following is the most likely explanation?", "choices": ["Acute kidney injury from intravascular volume depletion after diuresis", "Obstructive uropathy from a ureteric calculus", "Transformation to rapidly progressive glomerulonephritis", "Renal vein thrombosis related to the hypercoagulable state of nephrotic syndrome", "Steroid-induced acute interstitial nephritis"], "answer": 3, "explain": "กลไก: ภาพแรกเข้าได้กับ **minimal change disease (MCD)** — nephrotic รุนแรงที่ onset เร็ว, **renal function ปกติ**, **ปัสสาวะไม่มี RBC/cast (bland sediment)**, serology ลบทั้งหมด, และพบในคนอายุน้อย (MCD เป็นสาเหตุ nephrotic ที่พบบ่อยที่สุดในเด็ก และพบได้ราว 10-15% ในผู้ใหญ่) เกิดจาก **podocyte foot process effacement** โดยไม่เห็นความผิดปกติบน light microscopy (จึงชื่อ \"minimal change\")\n\n**ภาวะ hypercoagulable ของ nephrotic syndrome** เกิดจากหลายกลไกรวมกัน:\n1. **สูญเสีย antithrombin III ทางปัสสาวะ** (MW ใกล้ albumin) → heparin cofactor ลด\n2. **สูญเสีย protein S, plasminogen** และมี **ระดับ protein C/free protein S ที่ผิดปกติ**\n3. **ตับสร้าง fibrinogen, factor V, VIII, vWF เพิ่ม** (เช่นเดียวกับที่สร้าง lipoprotein เพิ่ม)\n4. **platelet hyperaggregability** (จาก hypoalbuminaemia ทำให้ free arachidonic acid สูง และจาก hyperlipidaemia)\n5. **haemoconcentration** จากการใช้ diuretic และ intravascular volume depletion\n→ ความเสี่ยงสูงสุดเมื่อ **albumin <2.0-2.5 g/dL** และสูงเป็นพิเศษใน **membranous nephropathy** แต่เกิดได้ในทุกชนิด\n\n**Renal vein thrombosis (RVT)** จึงมาด้วย **triad: ปวดสีข้างเฉียบพลัน + gross haematuria + การทำงานของไตแย่ลงเฉียบพลัน** (อาจมี proteinuria เพิ่มขึ้นและขนาดไตโตขึ้น) → ยืนยันด้วย **CT venography / MR venography / Doppler ultrasound** และรักษาด้วย **anticoagulation**\n\nทำไมข้ออื่นผิด:\n- **Steroid-induced AIN**: AIN เกิดจากยาเช่น NSAID, PPI, β-lactam, rifampicin, allopurinol — **corticosteroid เป็นการ \"รักษา\" AIN ไม่ใช่สาเหตุ**; และ AIN จะมี **pyuria, WBC cast, eosinophiluria** ไม่ใช่ปวดสีข้างเฉียบพลันกับ gross haematuria\n- **เปลี่ยนเป็น RPGN**: RPGN ดำเนินเป็นสัปดาห์-เดือนโดยมี **dysmorphic RBC, RBC cast, crescent บน biopsy** — MCD **ไม่** เปลี่ยนเป็น RPGN และ bland sediment เดิมของผู้ป่วยขัดกับสิ่งนี้\n- **นิ่วอุดกั้น ureter**: ให้ปวดสีข้างและ haematuria ได้จริง (เป็น distractor ที่ดี) แต่จะมี **ปวดแบบ colicky ร้าวลงขาหนีบ** และ **ไม่อธิบายว่าทำไมเกิดในบริบท nephrotic ที่ albumin 1.8**; การวินิจฉัยต้องเห็นนิ่ว/hydronephrosis\n- **Contrast-induced ATN**: โจทย์ไม่มีประวัติได้รับสารทึบรังสี และ ATN ไม่ทำให้ **ปวดสีข้างเฉียบพลันกับ gross haematuria**\n\nภาวะแทรกซ้อนอื่นของ nephrotic ที่ต้องเฝ้าระวัง: **การติดเชื้อ** (เสีย IgG และ complement factor B → pneumococcus, spontaneous bacterial peritonitis), **AKI จาก intravascular volume depletion**, **ภาวะขาดวิตามิน D และ hypocalcaemia**, **anaemia**, **hypothyroidism** และ **accelerated atherosclerosis**", "pearl": "MCD ในผู้ใหญ่: ต้องคัด **secondary cause** ทุกราย — **NSAID, lithium, interferon, Hodgkin lymphoma และมะเร็งทางโลหิตวิทยา**; ตอบสนองต่อ steroid ดีมาก (>80%) แต่ **relapse บ่อย**", "topic": "Minimal change disease and its complications", "src": "", "ref": ["MED35 ลงกองครั้งที่ 2 MCQ ข้อ 66 – 20 yo male heavy proteinuria (nephrotic-range) → Minimal change disease", "MED32 MCQ ข้อ 39 – มาด้วยบวม Dx เป็น minimal change disease ตรวจอีกใน 2 สัปดาห์ไตวาย เป็นไร (choice: RPGN, ...)", "MED32 MCQ ข้อ 21 – Pt. Minimal change disease ให้ steroid น่าจะตอบ AIN", "MED31 past paper – A 37 year old man with generalized edema, albumin 2.8, UA 3+ protein without significant RBC or WBC, scars in linear pattern on arms → heroin abuse (FSGS)"], "nl": ["B9.2.2(4)", "2.3.14(12)"]}, {"id": "N-OLD-021", "kind": "old", "stem": "A 20-year-old man has sudden onset generalised oedema with nephrotic-range proteinuria, normal renal function and no haematuria. What is the most likely diagnosis?", "choices": ["Amyloidosis", "IgA nephropathy", "Membranous nephropathy", "Minimal change disease", "Focal segmental glomerulosclerosis"], "answer": 3, "explain": "**Minimal change disease**: เกิดเร็ว บวมมาก โปรตีนรั่วแบบ selective ไตทำงานปกติ พบบ่อยที่สุดในเด็กและยังพบได้ในผู้ใหญ่วัยหนุ่มสาว; **ตอบสนองต่อสเตียรอยด์ดีมาก** — กล้องจุลทรรศน์ธรรมดาปกติ ต้องใช้ electron microscopy เห็น foot process effacement", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 66", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)"]}, {"id": "N-OLD-022", "kind": "old", "stem": "A patient with minimal change disease on high-dose prednisolone develops acute kidney injury 2 weeks later with sterile pyuria and WBC casts. What is the most likely cause?", "choices": ["Rapidly progressive glomerulonephritis", "Post-renal obstruction", "Acute interstitial nephritis from a concurrent drug", "Renal vein thrombosis", "Contrast-induced nephropathy"], "answer": 2, "explain": "**Sterile pyuria + WBC cast + ไตวายเฉียบพลันหลังได้ยา = acute interstitial nephritis** (ยาที่พบบ่อย: NSAID, PPI, beta-lactam, sulfonamide) — eosinophil ในปัสสาวะช่วยสนับสนุนแต่ความไวต่ำ; รักษาโดย **หยุดยาต้นเหตุ** และพิจารณาสเตียรอยด์เมื่อไตไม่ฟื้น", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 39 และข้อ 21", "ref": [], "nl": ["2.3.14-3(8)", "B9.2.7(1)", "B9.3(2)"]}]}, {"id": "nephro-14-07", "title": "Focal segmental glomerulosclerosis — เมื่อ podocyte หายไปจริง ๆ", "minutes": 9, "summary": "สเปกตรัมกว้างตั้งแต่โปรตีนเล็กน้อยถึงมหาศาล แยก primary ออกจาก secondary ให้ได้ก่อนให้ยากดภูมิ", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.1"], "md": "**กลไก** — ต่างจาก MCD ตรงที่ **podocyte ตายและหลุดออกไปจริง** เมื่อ podocyte หายไปบางจุด ผนังหลอดเลือดฝอยส่วนนั้นจะยึดติดกับ Bowman capsule แล้ว **กลายเป็นแผลเป็น (sclerosis)** — ชื่อโรคจึงบอกลักษณะครบ: **focal = เป็นบางโกลเมอรูลัส** และ **segmental = เป็นบางส่วนของโกลเมอรูลัสนั้น**\n\n> **ผลของการเป็นแค่บางจุด** — ถ้าเข็มเจาะไตดูดเนื้อมาได้น้อยหรือเจาะไม่โดนบริเวณที่เป็น **จะรายงานผลออกมาเป็น MCD ได้** นี่คือเหตุผลที่ **MCD ที่ไม่ตอบสนอง steroid มักกลายเป็น FSGS ที่เจาะพลาด**\n\n### ภาพทางคลินิก — กว้างกว่า MCD มาก\n- **เริ่มได้ทั้งเฉียบพลันและค่อยเป็นค่อยไป**\n- **ปริมาณโปรตีนหลากหลาย** ตั้งแต่ **non-nephrotic 1 – 2 g/วัน** จนถึง **มากกว่า 10 g/วัน**\n- **เข้าเกณฑ์ nephrotic syndrome 60 – 75%**\n- **ความดันโลหิตสูง 45 – 65%**\n- **Microscopic hematuria 30 – 50%**\n- **การทำงานของไตบกพร่อง 25 – 50%**\n\n**สังเกตว่าทั้งความดันสูง เลือดในปัสสาวะ และ Cr ที่ขึ้น พบได้บ่อยใน FSGS** ซึ่งเป็นสามอย่างที่ MCD แทบไม่มี — นี่คือจุดแยกข้างเตียงที่ใช้ได้จริง\n\n### สาเหตุทุติยภูมิ — แบ่งตามกลไก 3 กลุ่ม\n\n| กลุ่ม | สาเหตุ |\n|---|---|\n| **1. ไวรัส** | **HIV** (collapsing FSGS — HIVAN) · CMV · อาจเป็น parvovirus B19 |\n| **2. ยา** | **Pamidronate** · **interferon** · **anabolic steroid** · (และ **heroin ฉีดเข้าหลอดเลือดดำ**) |\n| **3. ภาระการกรองเกินตัว** — glomerulomegaly / จำนวน nephron ลดลง | **อ้วนมาก (morbid obesity)** · sickle cell disease · โรคหัวใจพิการแต่กำเนิดชนิดเขียว · โรคปอดที่ทำให้ขาดออกซิเจนเรื้อรัง · **ไตข้างเดียวแต่กำเนิด** · oligomeganephronia · reflux nephropathy · หลัง focal cortical necrosis · **หลังตัดไตออกหนึ่งข้าง** |\n\n**กลไกของกลุ่มที่ 3 ต้องเข้าใจ** — เมื่อ nephron เหลือน้อยลงหรือร่างกายใหญ่เกินไป nephron ที่เหลือต้อง **hyperfiltration** ความดันในโกลเมอรูลัสสูงขึ้นเรื้อรัง podocyte ยืดจนเสียหายและหลุดออกไป **นี่คือเหตุผลที่การรักษากลุ่มนี้คือลดความดันในโกลเมอรูลัสด้วย ACEI/ARB และลดน้ำหนัก ไม่ใช่ steroid**\n\n### พยาธิสภาพ\n\n| | สิ่งที่เห็น |\n|---|---|\n| **LM** | **Segmental sclerosis** — ชนิดที่พบบ่อยที่สุดคือ **NOS (not
