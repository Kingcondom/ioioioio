ฟ้าแบบสัมพันธ์กับคลื่นหัวใจ (synchronised cardioversion) ทันที ไม่ใช่ให้ยา**\n- คำถามที่ต้องตอบให้ได้คือ **\"จังหวะที่ผิดเป็นเหตุ หรือเป็นผล\"** — คนไข้ติดเชื้อรุนแรงที่หัวใจเต้นเร็ว การช็อกไฟฟ้าไม่ช่วย เพราะจังหวะเร็วเป็น **ผล** ของช็อก ส่วนคนที่ AF เต้น 150−180 แล้วความดันตกโดยไม่มีเหตุอื่น จังหวะนั้นเป็น **เหตุ**\n- **AF ยังทำให้เกิดลิ่มเลือดหลุดจากหัวใจห้องบนซ้ายไปอุดหลอดเลือดสมอง** จึงเป็นกลไกของอัมพาตเฉียบพลันที่มาพร้อมกัน\n\n### เป้าหมายของการประคองการไหลเวียน\n| เป้าหมาย | ตัวเลข |\n|---|---|\n| **ความดันแดง** | **MAP 65−70 mmHg** |\n| **CO และการส่งออกซิเจน** | **ติดตามแนวโน้มการตอบสนอง และ SvO₂** |\n| **ลักเตท** | **ลดลงอย่างน้อย 20% ใน 2 ชั่วโมง สัมพันธ์กับอัตราตายในโรงพยาบาลที่ลดลง** |\n| **การไหลเวียนระดับจุลภาค** | ประเมินด้วย **OPS imaging** (ยังเป็นงานวิจัยเป็นหลัก) |\n\n### สี่ระยะของการรักษา — จำด้วยอักษรย่อ **SOSD**\n| ระยะ | ทำอะไร |\n|---|---|\n| **Salvage** | **ทำให้ความดันขึ้นมาถึงระดับต่ำสุดที่ยอมรับได้ และทำหัตถการช่วยชีวิต** |\n| **Optimization** | **ทำให้ออกซิเจนเพียงพอ ปรับ CO, SvO₂ และลักเตทให้ดีที่สุด** |\n| **Stabilization** | **ประคองอวัยวะ และลดภาวะแทรกซ้อน** |\n| **De-escalation** | **ถอนยาที่ออกฤทธิ์ต่อหลอดเลือด และทำให้สมดุลสารน้ำติดลบ** |\n\n> **ระยะที่คนมักลืมคือ de-escalation** — สารน้ำที่ช่วยชีวิตในวันแรก กลายเป็นภาระในวันที่สาม การ **ถอนยาและขับน้ำส่วนเกินออก** เป็นส่วนหนึ่งของการรักษา ไม่ใช่เรื่องที่ค่อยว่ากันทีหลัง\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยกหัวข้อ **\"Specific Causes of Shock Requiring Tailored Intervention\"** ออกมาต่างหาก พร้อมทำเครื่องหมายดอกจัน เพื่อย้ำว่าการประคองอย่างเดียวไม่พอในบางสาเหตุ\n- สไลด์ให้เป้าหมาย **MAP 65−70 mmHg** และ **ลักเตทลดลง 20% ใน 2 ชั่วโมง** เป็นตัวเลขที่จับต้องได้ อ้างอิง **N Engl J Med 2013;369:1726-34**\n- สไลด์ปิดท้ายด้วยแผนภาพ **สี่ระยะ Salvage → Optimization → Stabilization → De-escalation** ซึ่งเป็นกรอบที่ใช้สื่อสารกับทีมได้ว่าตอนนี้คนไข้อยู่ระยะไหน\n", "pearls": ["อะดรีนาลีน 0.5 mg เข้ากล้ามที่ต้นขาด้านหน้าข้าง คือยาตัวแรกของ anaphylaxis — ยาแก้แพ้และสเตียรอยด์เป็นแค่ตัวเสริม", "ก่อนกลับบ้านต้องได้อะดรีนาลีนชนิดพกพาพร้อมแผนปฏิบัติ เพราะอาจเกิดปฏิกิริยาสองระลอก", "จังหวะหัวใจที่ผิดเป็นเหตุหรือเป็นผล — ถ้าเป็นเหตุให้ช็อกไฟฟ้าทันที", "เป้าหมาย MAP 65−70 mmHg และลักเตทลดลงอย่างน้อย 20% ใน 2 ชั่วโมง", "สี่ระยะ SOSD — Salvage, Optimization, Stabilization, De-escalation และอย่าลืมระยะสุดท้าย"], "items": [{"id": "C-MCQ-07", "kind": "mcq", "stem": "A 34-year-old woman develops generalised urticaria, hoarseness, wheezing and light-headedness 10 minutes after eating shellfish at dinner. Vital signs: PR 124/min, BP 78/44 mmHg, RR 28/min, SpO2 92% on room air. There is peri-oral oedema and diffuse expiratory wheeze. Which of the following is the most appropriate immediate treatment?", "choices": ["Intravenous hydrocortisone 200 mg", "Intravenous chlorpheniramine 10 mg", "Nebulised salbutamol 2.5 mg", "Intramuscular adrenaline 0.5 mg into the anterolateral thigh", "Intravenous ranitidine 50 mg"], "answer": 3, "explain": "กลไก: anaphylaxis = **type I (IgE-mediated) hypersensitivity** → mast cell/basophil degranulation ปล่อย histamine, tryptase, leukotriene, PAF → (1) systemic vasodilation + (2) increased capillary permeability (plasma leak ออกจาก intravascular ได้ถึง 35% ในไม่กี่นาที) + (3) bronchoconstriction + (4) mucosal edema\n\nเหตุผลที่ต้องเป็น **adrenaline IM**:\n- **α1**: vasoconstriction → แก้ vasodilation และลด mucosal/laryngeal edema (ช่วยชีวิตจาก airway obstruction)\n- **β1**: เพิ่ม inotropy/chronotropy → เพิ่ม cardiac output\n- **β2**: bronchodilation + **ยับยั้ง mast cell mediator release เพิ่มเติม** (หยุดวงจร)\nเป็นยาตัวเดียวที่แก้ได้ทุกกลไกพร้อมกัน และ **เป็นยาเดียวที่ลด mortality**\n\nตำแหน่ง **anterolateral thigh (vastus lateralis) IM** ดูดซึมเร็วและ peak สูงกว่า SC หรือ IM ที่ deltoid; ขนาดผู้ใหญ่ 0.3-0.5 mg (1:1000) ซ้ำได้ทุก 5-15 นาที\n\nทำไมข้ออื่นผิด — ทุกข้อเป็น \"adjunct\" ที่ถูกต้องแต่ **ไม่ใช่ immediate**:\n- **Antihistamine (H1)**: แก้เฉพาะ cutaneous symptoms (ผื่น คัน) **ไม่แก้ hypotension ไม่แก้ airway** และออกฤทธิ์ช้า — การให้ antihistamine ก่อน adrenaline คือสาเหตุการตายที่ป้องกันได้ที่พบบ่อยสุด\n- **Steroid**: onset 4-6 ชม. อาจช่วยลด protracted/biphasic reaction (หลักฐานไม่หนัก) ไม่ช่วยใน acute phase เลย\n- **Nebulised salbutamol**: แก้ bronchospasm เฉยๆ ไม่แก้ vasodilation, ไม่แก้ laryngeal edema\n- **H2 blocker**: adjunct ต่อ urticaria เท่านั้น\n\nหลังให้ adrenaline: นอนราบยกขา, ให้ **IV isotonic crystalloid 1-2 L เร็ว** (เพราะมี distributive + capillary leak), O2, เฝ้าระวัง biphasic reaction 4-12 ชม., และก่อนกลับบ้าน **สั่ง adrenaline autoinjector + ส่งปรึกษา allergist**", "pearl": "Anaphylactic shock = **distributive shock**; ถ้าให้ adrenaline IM 2-3 ครั้งแล้วยังไม่ขึ้น ให้เปลี่ยนเป็น **adrenaline IV infusion** ไม่ใช่ IV bolus (เสี่ยง arrhythmia); ผู้ป่วยที่กิน β-blocker อยู่อาจดื้อ adrenaline → พิจารณา glucagon", "topic": "Anaphylactic shock – initial management", "src": "", "ref": ["MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 28 – หญิงไป dinner เกิดผื่น asthma attack BP 80/50 initial management", "MED33 MCQ – กินข้าว > ผื่นขึ้น > Anaphylaxis > treat โดย Adrenaline IM", "MED30 SAQ ข้อ 11 – Anaphylactic shock → Distributive shock", "MED31 MCQ ข้อ 85 – รักษา anaphylaxis → adrenaline", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 2-3 – Urticaria / Anaphylaxis → hypersensitivity type 1"], "nl": ["2.2.7", "B7.2.5(4)", "B7.4(6)"]}, {"id": "C-OLD-24", "kind": "old", "stem": "A woman develops generalised urticaria, wheeze and BP 80/50 mmHg minutes after dinner. What is the most appropriate initial treatment?", "choices": ["Intramuscular adrenaline into the anterolateral thigh", "Intravenous ranitidine", "Intravenous hydrocortisone alone", "Nebulised salbutamol alone", "Intravenous chlorpheniramine"], "answer": 0, "explain": "**Adrenaline IM คือยาแรกเสมอ** — ยาแก้แพ้ H1/H2 และสเตียรอยด์เป็นเพียงยาเสริมที่ออกฤทธิ์ช้า ไม่แก้ความดันตกหรือทางเดินหายใจบวม; ให้พร้อมกับนอนราบยกขาสูง ออกซิเจน และสารน้ำปริมาณมาก", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 28 / MED33 MCQ / MED31 MCQ", "ref": [], "nl": ["2.2.7", "B4.2.2(12)", "B7.4(6)"]}, {"id": "C-OLD-25", "kind": "old", "stem": "Urticaria and anaphylaxis are which type of hypersensitivity reaction?", "choices": ["Type II (cytotoxic)", "Type III (immune complex)", "Non-immune idiosyncratic reaction", "Type IV (delayed, cell-mediated)", "Type I (IgE-mediated)"], "answer": 4, "explain": "**Type I** — IgE บนผิว mast cell จับ allergen แล้วปล่อย histamine และ mediator อื่นทันทีภายในนาที ทำให้หลอดเลือดขยาย รั่ว และหลอดลมตีบ", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 2-3 / MED34 MCQ ครั้งที่ 4", "ref": [], "nl": ["B4.2.2(12)", "2.2.7", "2.3.12(12)"]}, {"id": "C-OLD-26", "kind": "old", "stem": "A patient who survived anaphylactic shock is being discharged. What is the most important item to provide?", "choices": ["A daily corticosteroid prescription", "A medical certificate to avoid work", "A daily antihistamine prescription", "Routine skin testing to all foods before discharge", "An adrenaline auto-injector with training and a written action plan"], "answer": 4, "explain": "**ต้องจ่ายปากกา adrenaline พร้อมสอนใช้และเขียน action plan** เพราะปฏิกิริยาครั้งหน้าอาจเร็วและรุนแรงกว่าเดิม; ยาแก้แพ้กินทุกวันไม่ป้องกัน anaphylaxis และอาจกลบอาการเตือน", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 45", "ref": [], "nl": ["2.2.7", "B4.2.2(12)"]}, {"id": "C-MCQ-09", "kind": "mcq", "stem": "A 72-year-old man presents with 2 days of worsening dyspnoea and confusion. Vital signs: PR 132/min irregularly irregular, BP 80/58 mmHg, RR 28/min, SpO2 88% on room air. He has cool mottled extremities with capillary refill of 5 seconds, JVP 8 cm above the sternal angle, bibasilar crepitations to the mid zones and an S3 gallop. Chest radiograph shows cardiomegaly with bilateral perihilar opacities. Serum lactate 5.0 mmol/L, creatinine rising from 0.9 to 1.9 mg/dL. Which of the following best describes the type of shock and the most appropriate immediate intervention?", "choices": ["Obstructive shock; immediate needle pericardiocentesis", "Hypovolaemic shock; rapid infusion of 30 mL/kg crystalloid", "Distributive shock; intravenous norepinephrine plus broad-spectrum antibiotics", "Cardiogenic shock; urgent synchronised cardioversion or rate control with haemodynamic support", "Cardiogenic shock; high-dose intravenous beta-blocker for rate control"], "answer": 3, "explain": "กลไก: ภาพคือ **cardiogenic shock** — หัวใจเป็นตัวปัญหาเอง → CO ต่ำ ขณะที่ **filling pressure สูงทั้งสองข้าง**\nหลักฐานในโจทย์ที่ครบชุด:\n- ปลายน้ำ hypoperfusion: มือเท้าเย็น, mottled, capillary refill 5 วินาที, confusion, lactate 5, Cr ขึ้น (**cardiorenal**)\n- ต้นน้ำคั่ง: **JVP สูง + crepitation + S3 + pulmonary edema บน CXR** → LV failure (ต่างจาก tamponade ที่ปอด clear)\n- ตัวกระตุ้น: **AF with rapid ventricular response 132/min** — อัตราเร็วทำให้ diastolic filling time สั้นลง + เสีย atrial contribution (ประมาณ 20-30% ของ filling) → stroke volume ตก และ **myocardial oxygen demand เพิ่มขณะ coronary perfusion ลด** เกิดวงจรเลวลง\n\nการรักษาที่ตรงกลไก = **เอา arrhythmia ออก**: unstable tachyarrhythmia → **synchronised cardioversion** (หรือคุม rate ด้วยยาที่ไม่กด inotropy เช่น IV digoxin/amiodarone) พร้อม support ด้วย **inotrope/vasopressor (norepinephrine ± dobutamine)** และ NIV\n\nทำไมข้ออื่นผิด:\n- **Hypovolemic + 30 mL/kg**: JVP สูงและปอดท่วมอยู่แล้ว ให้ volume จะทำให้ pulmonary edema แย่ทันที — นี่คือกับดักที่อันตรายที่สุด\n- **Distributive/septic**: distributive จะมือเท้า **อุ่น** + wide pulse pressure + SVR ต่ำ และไม่มี S3/pulmonary edema แบบนี้ (โจทย์ไม่มีไข้ มี narrow pulse pressure)\n- **Obstructive + pericardiocentesis**: tamponade จะ **ปอด clear** + pulsus paradoxus + muffled heart sound; เคสนี้มี crepitation เต็มและ S3\n- **High-dose IV beta-blocker**: ใน **decompensated HF ที่ shock อยู่** การให้ BB IV ขนาดสูงจะกด inotropy → CO ตกฮวบ อาจถึงแก่ชีวิต (BB มีที่ใช้เมื่อ euvolemic/compensated แล้วเท่านั้น)", "pearl": "แยก cardiogenic จาก tamponade/PE ด้วย **ปอด**: cardiogenic = crepitation + S3 + pulmonary edema; obstructive = ปอด clear + JVP สูง. แยกจาก hypovolemic ด้วย **JVP/IVC**", "topic": "Cardiogenic shock from tachyarrhythmia", "src": "", "ref": ["MED34 MCQ ครั้งที่ 4 ข้อ 19 – Cardiomegaly c HR 130 (irregular) come with shock → cardiogenic shock", "MED31 MCQ ข้อ 61 – Hypotension, pulse เร็ว (irregular) → cardiogenic shock", "MED32 MCQ ข้อ 13 – PR 130 (irregular) → cardioembolic / cardiogenic shock", "MED30 MCQ ข้อ 65 – Shock ในข้อนี้เกิดจากอะไร → Cardiogenic shock"], "nl": ["2.2.7", "B7.2.5(5)", "2.3.9(1)"]}, {"id": "C-OLD-21", "kind": "old", "stem": "A hypotensive patient has an irregularly irregular tachycardia at 150/min, elevated JVP and cold clammy skin. Which is the most appropriate immediate treatment?", "choices": ["Intravenous metoprolol bolus", "Synchronised cardioversion", "Intravenous adrenaline infusion", "Rapid infusion of 2 litres of normal saline", "Observation with oxygen only"], "answer": 1, "explain": "**Tachyarrhythmia ที่ทำให้เกิด shock = unstable → synchronised cardioversion ทันที** (AF/atrial flutter/SVT/VT ที่มีชีพจร) ห้ามเสียเวลาลองยาก่อน; **ห้ามให้ beta-blocker ทางหลอดเลือดดำในผู้ที่ความดันตก** เพราะจะยิ่งกดการบีบตัว", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 61 / MED30 MCQ ข้อ 65 / MED31 MCQ ข้อ 69", "ref": [], "nl": ["2.2.7", "B7.2.5(5)", "2.3.9(1)"]}, {"id": "C-OLD-22", "kind": "old", "stem": "A 72-year-old man with atrial fibrillation at 130/min develops acute hemiparesis and hypotension. What is the most likely mechanism of the neurological event?", "choices": ["Cardioembolism from the left atrium", "Hypoperfusion watershed infarction from hypovolaemia", "Intracerebral haemorrhage from hypertension", "Carotid dissection", "Small-vessel lacunar infarction"], "answer": 0, "explain": "**AF ทำให้เลือดคั่งใน left atrial appendage เกิดลิ่มเลือดแล้วหลุดไปอุดหลอดเลือดสมอง** เป็นกลไกหลักของ stroke ในผู้ป่วย AF จึงต้องประเมิน **CHA2DS2-VASc** และให้ยาต้านการแข็งตัวของเลือดเมื่อเข้าเกณฑ์", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 13", "ref": [], "nl": ["2.3.9(1)", "2.3.9-3(3)", "B7.2.5(5)"]}]}], "meq": [{"id": "C-MEQ-05", "part": "MEQ", "lec": "10", "lecture": "Shock (AL) (อ.เจตวรงค์)", "topic": "Undifferentiated shock – systematic approach", "vignette": "ผู้ป่วยชายไทยอายุ 58 ปี ถูกนำมาส่งห้องฉุกเฉินด้วยอาการซึมลง 3 ชั่วโมง\nU/D: DM type 2, BPH\nPI: 3 วันก่อน มีไข้ หนาวสั่น ปัสสาวะแสบขัด ปัสสาวะกะปริบกะปรอย\n1 วันก่อน ปวดเอวด้านขวา อาเจียน 4-5 ครั้ง รับประทานอาหารและน้ำได้น้อย\n3 ชั่วโมงก่อน ซึมลง เรียกแล้วลืมตาแต่พูดสับสน\nPE: V/S BT 39.2 C, PR 126/min, RR 30/min, BP 78/42 mmHg, SpO2 94% room air\nGA: drowsy, E3V4M6, ผิวแห้ง, ปลายมือปลายเท้า **อุ่น** capillary refill 2 วินาที\nHEENT: dry mucous membrane, JVP ไม่สูง (2 cm above sternal angle)\nHeart: tachycardia, no murmur, no gallop; RS: clear both lungs\nAbd: right CVA tenderness positive; Ext: no edema\nLab: WBC 19,200/mm3 (N 88%), Hct 38%, platelet 118,000/mm3, BUN 58 mg/dL, Cr 2.4 mg/dL (baseline 1.0), Na 132 mEq/L, K 4.4 mEq/L, HCO3 16 mEq/L, lactate 4.6 mmol/L, UA: WBC 50-100/HPF, nitrite positive, WBC cast seen", "questions": [{"q": "1. จงบอกว่าผู้ป่วยมี shock ชนิดใด และใช้ข้อมูลใดในการตัดสิน", "a": "**Septic shock (distributive shock) ร่วมกับ hypovolemia**\n\n**ข้อมูลที่สนับสนุน distributive shock**\n- **ปลายมือปลายเท้าอุ่น, capillary refill 2 วินาที** (\"warm shock\") → **SVR ต่ำ** ซึ่งแยกจาก low-output shock (hypovolemic/cardiogenic) ที่ปลายมือเท้าจะ **เย็น**\n- **Diastolic BP ต่ำเด่น (78/42)** เข้ากับ systemic vascular resistance ที่ต่ำจาก vasodilation\n- มีแหล่งติดเชื้อชัดเจน (**acute pyelonephritis**: ไข้สูง หนาวสั่น CVA tenderness, UA มี pyuria + nitrite positive + **WBC cast** ซึ่งบ่ง renal parenchymal involvement) ร่วมกับ leukocytosis, thrombocytopenia และ **lactate 4.6** (>2 mmol/L)\n- มี **organ dysfunction**: AKI (Cr 2.4 จาก baseline 1.0), altered mental status, metabolic acidosis\n\n**ข้อมูลที่บ่งว่ามี hypovolemia ร่วม (สำคัญต่อการรักษา)**\n- อาเจียนและกินน้ำได้น้อย, **ผิวแห้ง, mucous membrane แห้ง, JVP ไม่สูง (2 cm)**, BUN/Cr ratio สูงขึ้นเข้าทาง prerenal (58/2.4 ≈ 24, >20) → มี prerenal component ร่วม\n→ ดังนั้น **ตอบสนองดีต่อ fluid resuscitation** และต้องให้น้ำก่อน/พร้อมกับการประเมินความจำเป็นของ vasopressor\n\n**นิยามที่ควรระบุ**: septic shock (Sepsis-3) = **sepsis ที่ต้องใช้ vasopressor เพื่อคง MAP ≥65 mmHg ร่วมกับ (และ) lactate >2 mmol/L แม้ได้รับสารน้ำเพียงพอแล้ว**"}, {"q": "2. จง differential diagnosis ของ shock ในผู้ป่วยรายนี้และเหตุผลที่ตัดออก", "a": "1. **Septic shock จาก acute pyelonephritis (สาเหตุที่เป็นไปได้มากที่สุด)** — ไข้สูง, CVA tenderness, pyuria + WBC cast, leukocytosis, lactate สูง, warm extremities\n2. **Hypovolemic shock จาก GI loss และกินได้น้อย** — มีองค์ประกอบนี้ร่วมจริง (JVP ต่ำ, แห้ง) แต่ **ลำพังไม่อธิบายไข้ 39.2 C, leukocytosis และปลายมือเท้าอุ่น** (hypovolemic ต้องปลายมือเท้าเย็น SVR สูง)\n3. **Cardiogenic shock** — **ตัดออกเพราะ** JVP ไม่สูง, ปอด clear, ไม่มี S3/gallop, ไม่มี crepitation, ปลายมือเท้าอุ่น (cardiogenic จะเย็นและคั่งน้ำ)\n4. **Obstructive shock (PE / tamponade / tension pneumothorax)** — **ตัดออกเพราะ** JVP ไม่สูง (ทุกภาวะนี้ JVP ต้องสูง), ไม่มี pulsus paradoxus, breath sound เท่ากันทั้งสองข้าง, SpO2 94% ไม่ hypoxemic มาก\n5. **Adrenal insufficiency / adrenal crisis** — ต้องคิดถึงในผู้ป่วยช็อกที่ดื้อต่อ fluid และ vasopressor โดยเฉพาะถ้ามีประวัติใช้ steroid, Na ต่ำ K สูง, eosinophilia; เคสนี้ K 4.4 ปกติและมีแหล่งติดเชื้อชัดเจนจึงโอกาสน้อย แต่ถ้า refractory ต้องพิจารณา\n6. **DKA / hyperglycemic emergency** — ผู้ป่วยเป็น DM และมี HCO3 16 ร่วมกับซึมลง; ต้องส่ง **capillary blood glucose, serum ketone/urine ketone, anion gap และ ABG** เพื่อคัดออก (การติดเชื้อเป็น precipitating factor ที่พบบ่อยที่สุดของ DKA)"}, {"q": "3. จงวางแผนการรักษาใน 1 ชั่วโมงแรก (hour-1 bundle)", "a": "**Hour-1 bundle ของ sepsis/septic shock — ทำพร้อมกัน ไม่ใช่ทำตามลำดับ**\n1. **วัด serum lactate** (และวัดซ้ำใน 2-4 ชม. ถ้าค่าแรก >2 mmol/L เพื่อติดตามการตอบสนอง)\n2. **เจาะ hemoculture ≥2 sets ก่อนให้ยาปฏิชีวนะ** (พร้อม urine culture, และเก็บสิ่งส่งตรวจจากแหล่งที่สงสัย) — แต่ **ห้ามให้การเจาะเลือดทำให้ antibiotic ช้าเกิน 45 นาที**\n3. **ให้ยาปฏิชีวนะ broad-spectrum ทางหลอดเลือดดำโดยเร็วที่สุด** — ครอบคลุม gram-negative bacilli ของทางเดินปัสสาวะ (เช่น **ceftriaxone** หรือถ้าเสี่ยง ESBL/เคยได้ยาบ่อย/นอน รพ. พิจารณา **ertapenem/meropenem ± การครอบคลุม enterococci**) แล้ว **de-escalate ตามผล culture**; **ทุก 1 ชั่วโมงที่ให้ยาช้าลง mortality เพิ่มขึ้น**\n4. **ให้ crystalloid 30 mL/kg ภายใน 3 ชั่วโมงแรก** (ผู้ป่วยนี้มี hypovolemia ชัด จึงได้ประโยชน์เต็มที่) — ใช้ **balanced crystalloid** และประเมินการตอบสนองซ้ำๆ (dynamic assessment: passive leg raise, IVC variation, stroke volume variation, urine output, lactate clearance, capillary refill)\n5. **เริ่ม vasopressor (norepinephrine) เป้า MAP ≥65 mmHg** ถ้า BP ยังต่ำระหว่างหรือหลังให้สารน้ำ — ไม่ต้องรอให้ให้สารน้ำครบจึงเริ่ม ถ้า MAP ต่ำมาก\n\n**การดูแลอื่นในชั่วโมงแรก**\n- O2 เป้า SpO2 >94%, monitor ECG/BP ต่อเนื่อง, เปิด IV line 2 เส้น, พิจารณา central line เมื่อต้องใช้ vasopressor นาน\n- **ตรวจ capillary blood glucose ทันที** และคัด DKA (serum/urine ketone, anion gap, ABG)\n- ส่ง CBC, coagulogram, electrolytes, BUN/Cr, LFT, ABG, UA/urine culture\n- **Source control**: ultrasound/CT ไตและทางเดินปัสสาวะเพื่อหา **obstruction, pyonephrosis หรือ renal/perinephric abscess** — ถ้ามีการอุดกั้นต้อง **ระบายทางเดินปัสสาวะอย่างเร่งด่วน (percutaneous nephrostomy หรือ ureteric stent)** เพราะยาปฏิชีวนะลำพังจะไม่หาย (ผู้ป่วยมี BPH เป็นปัจจัยเสี่ยงของการอุดกั้น)\n- **ตรวจ per rectal examination ประเมินต่อมลูกหมาก** (prostatitis/abscess เป็นแหล่งติดเชื้อซ้ำซากในชายสูงอายุ)\n- ใส่สายสวนปัสสาวะเพื่อวัด urine output, บันทึก I/O\n- พิจารณา **hydrocortisone** เมื่อยังต้องใช้ vasopressor ขนาดสูงต่อเนื่อง\n- ปรับขนาดยาตาม renal function และหลีกเลี่ยง nephrotoxin (NSAID, contrast ที่ไม่จำเป็น)"}, {"q": "4. ให้สารน้ำ 30 mL/kg และ norepinephrine แล้ว MAP ขึ้นเป็น 70 mmHg แต่ urine output ยังน้อยกว่า 0.3 mL/kg/hr 6 ชั่วโมง Cr ขึ้นเป็น 3.2 mg/dL และ K 6.2 mEq/L จงประเมินและวางแผนต่อ", "a": "**การประเมิน: Septic AKI (sepsis-associated acute kidney injury, KDIGO stage 3) ร่วมกับ hyperkalemia**\nกลไก: ผสมกันระหว่าง (ก) **prerenal/hypoperfusion** จาก shock (ข) **inflammatory microvascular dysfunction และ tubular injury (ATN)** จาก sepsis (ค) **venous congestion** ถ้าให้สารน้ำมากเกิน และ (ง) ความเป็นไปได้ของ **obstructive uropathy** จาก BPH\n\n**แผนการดูแล**\n1. **รักษา hyperkalemia ทันที (K 6.2)** — เรียงตามกลไก\n   - **ทำ ECG ทันที** ดู peaked T wave, PR ยาว, QRS กว้าง\n   - **IV 10% calcium gluconate** → stabilize cardiac membrane (ไม่ลด K แต่กัน arrhythmia)\n   - **Regular insulin + glucose** (และ/หรือ **nebulized salbutamol ขนาดสูง**) → **shift K เข้าเซลล์**\n   - **NaHCO3** พิจารณาเมื่อมี metabolic acidosis ร่วม\n   - **ขับ K ออกจากร่างกาย**: loop diuretic ถ้ายังมี urine output พอ, **potassium binder (sodium polystyrene sulfonate / patiromer / SZC)**; ถ้า **refractory → hemodialysis**\n   - **หยุดยาและสารที่เพิ่ม K**: ACEI/ARB, MRA, NSAID, potassium supplement, trimethoprim\n2. **ประเมินและแก้ภาวะอุดกั้นอย่างเร่งด่วน** — **ultrasound ไตและกระเพาะปัสสาวะ** (ดู hydronephrosis, residual urine, นิ่ว, abscess); ถ้ามีการอุดกั้น → ระบาย (Foley/nephrostomy/stent) นี่คือสาเหตุที่ **แก้ไขได้** และมักถูกมองข้าม\n3. **ประเมินสถานะสารน้ำซ้ำด้วยวิธี dynamic** (POCUS: IVC, B-line ที่ปอด, การทำงานของหัวใจ; passive leg raise) — **อย่าให้สารน้ำเพิ่มแบบอัตโนมัติ** เพราะ fluid overload ในระยะนี้ทำให้ **renal venous congestion และ pulmonary edema** ซ้ำเติม AKI\n4. **ตรวจ urine sediment และดัชนีแยก prerenal vs ATN**: **muddy brown granular cast** สนับสนุน ATN; FENa (ในผู้ที่ไม่ได้รับ diuretic), urine Na, urine osmolality\n5. **หลีกเลี่ยง nephrotoxin และปรับขนาดยาทุกตัวตาม renal function** (รวมถึงขนาด antibiotic — แต่ **ห้ามลดขนาดจนต่ำกว่าระดับรักษาในช่วงแรกของ sepsis**)\n6. **ทบทวน source control ซ้ำ**: ถ้าไข้ไม่ลงหรือ lactate ไม่ลดใน 48-72 ชม. ต้องสงสัย abscess/obstruction/เชื้อดื้อยา → **ส่ง CT และทบทวนสูตรยาตามผล culture**\n7. **ข้อบ่งชี้เร่งด่วนของการบำบัดทดแทนไต (จำ \"AEIOU\")**: **A**cidosis ที่แก้ไม่ได้, **E**lectrolyte (hyperkalemia ที่ดื้อต่อการรักษา), **I**ntoxication, **O**verload (volume ที่ดื้อต่อ diuretic ทำให้ pulmonary edema), **U**remia (encephalopathy, pericarditis, bleeding)\n8. **ปรึกษา nephrologist และ urologist** และวางแผนติดตามการทำงานของไตระยะยาว (ผู้ป่วยมี DM อยู่แล้ว เสี่ยงเป็น CKD ต่อเนื่องหลัง AKI)"}], "ref": ["MED31 past paper – A 75 year old woman with fever, leukocyte 13,000/ul, UA 20-25 leukocytes/HPF, urine and blood culture growing E. coli → Sepsis terminology", "MED31 past paper – ผู้ป่วยชายอายุ 40 ปี septic shock 6 ชั่วโมงหลังเข้ารับการรักษาพบว่าไม่มี urine, Cr 1.5 จงประมาณค่า GFR", "MED34 FA MCQ – Patient develops shock 2 days after starting antibiotics → Septic shock", "MED32 MEQ – WBC cast → UTI / pyelonephritis", "MED32 MCQ ข้อ 18 – Acute pyelonephritis ไข้ไม่ลง ตรวจ u/s เจอ abscess → continue ceftriaxone + drainage", "MED30 MCQ ข้อ 5 – คนไข้มา ICU ด้วย confusion BT 38.5 BP 80/50 PR 140 Na 122 BUN 45 Cr 1.7 → choices: acute pyelonephritis, AGN, AIN, ATN"], "nl": ["2.2.7", "B7.2.5(4)", "B7.4(6)"], "_kind": "meq", "_set": "cardio"}], "osce": [], "date": "อ. 22 ก.ย."}], "label": "Cardio", "thai": "ระบบหัวใจและหลอดเลือด", "accent": {"light": "#8c1d2f", "soft": "#f6e9eb", "ink": "#6e1624", "dark": "#e0697a", "darkSoft": "#2c1a1f", "darkInk": "#f0a3ae"}}, {"set": "chest", "title": "Chest · ระบบการหายใจและทรวงอก", "intro": "เริ่มจากสองคาบของ อ.ศิวพร — วัณโรคปอด และการแปลผลก๊าซในเลือดแดง — เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับคลังข้อสอบ MED28–MED35 และข้อใหม่ของชุด Chest จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบวัณโรคแล้วไปฝึก **MEQ** และ **OSCE/SAQ** ต่อได้เลย\n\nคาบที่เหลือของชุด Chest (เยื่อหุ้มปอด/respiratory failure · CXR และโรคจากการทำงาน · pneumonia/asthma/COPD) ยังไม่ได้ทำบทเรียน แต่ข้อสอบมีอยู่ครบใน drill.html แล้ว", "lectures": [{"lec": "03", "title": "Pulmonary tuberculosis", "subtitle": "เชื้อและการติดต่อ · LTBI กับวัณโรคระยะแสดงอาการ · ภาพรังสี · การวินิจฉัยทางห้องปฏิบัติการ · สูตรยาและผลข้างเคียง · วัณโรคในภาวะพิเศษและวัณโรคดื้อยา", "objectives": ["อธิบายการติดต่อทางอากาศของวัณโรคและวางมาตรการป้องกันการแพร่เชื้อในโรงพยาบาลได้", "แยก **latent TB infection** ออกจาก **active TB disease** และรู้ว่าใครควรได้รับการตรวจและรักษา LTBI", "เลือกส่งตรวจทางห้องปฏิบัติการได้ถูกลำดับ — AFB smear · molecular test · culture/DST — และแปลผลได้", "สั่งสูตรยา 2HRZE/4HR ได้ถูกขนาดและระยะเวลา รู้ว่าอวัยวะไหนต้องรักษานานกว่าและกรณีใดต้องให้ steroid", "จับผลข้างเคียงของยาวัณโรคที่ต้องหยุดยาทันที แยกจากผลข้างเคียงที่ให้ยาต่อได้", "ปรับการรักษาในผู้ป่วยไตเสื่อม โรคตับ ตั้งครรภ์ และผู้ติดเชื้อเอชไอวี รวมถึงจังหวะเริ่มยาต้านไวรัส", "นิยามวัณโรคดื้อยาแต่ละแบบและวางแผนติดตามการรักษาได้"], "meq": [{"id": "CH-MEQ-01", "part": "MEQ", "lec": "03", "lecture": "Pulmonary tuberculosis / ABG (อ.ศิวพร)", "topic": "Active pulmonary tuberculosis — diagnosis, regimen and contact management", "vignette": "ผู้ป่วยชายไทยอายุ 46 ปี อาชีพขับรถสองแถว มาโรงพยาบาลด้วยอาการไอเรื้อรัง 6 สัปดาห์ก่อนมาโรงพยาบาล\nPI: ไอมีเสมหะสีขาวปนเหลือง 6 สัปดาห์ 2 สัปดาห์หลังมีเสมหะปนเลือดสดเล็กน้อยวันละ 2-3 ครั้ง มีไข้ต่ำๆ ตอนบ่าย เหงื่อออกกลางคืนจนต้องเปลี่ยนเสื้อ น้ำหนักลด 6 กิโลกรัมใน 2 เดือน เบื่ออาหาร ไม่มีเจ็บหน้าอก ไม่เหนื่อยขณะพัก\nU/D: DM type 2 วินิจฉัย 5 ปี, ไม่เคยตรวจ HIV\nยาเดิม: metformin (500) 1x2 pc\nประวัติอื่น: สูบบุหรี่ 20 มวน/วัน 25 ปี, ดื่มสุราสังสรรค์, อาศัยอยู่กับภรรยาและหลานอายุ 3 ขวบในบ้านไม้ห้องเดียว ไม่มีประวัติคนในบ้านเป็นวัณโรค\nPE: GA: ผอม looks chronically ill, not pale, no jaundice\nV/S: BT 37.8 C, PR 96/min, RR 22/min, BP 112/70 mmHg, SpO2 96% room air, BW 48 kg (เดิม 54 kg), Ht 168 cm\nHEENT: no cervical lymphadenopathy, oral cavity: no thrush\nLung: coarse crackles at right upper lung field, no wheezing\nHeart: normal S1 S2, no murmur; Abdomen: soft, liver and spleen not palpable; Extremities: no edema, no clubbing\nLab: Hb 10.8 g/dL, WBC 8,900 /uL (N 66%, L 26%), Plt 380,000 /uL, Cr 0.9 mg/dL, AST 32 / ALT 28 U/L, FBS 186 mg/dL, HbA1c 9.2%\nCXR: right upper lobe heterogeneous infiltration with a thick-walled cavity 2.5 cm, no pleural effusion", "questions": [{"q": "1. จงให้การวินิจฉัยที่น่าจะเป็นมากที่สุด พร้อมบอกข้อมูลสนับสนุนจากประวัติ ตรวจร่างกาย และภาพรังสี", "a": "**การวินิจฉัย: Active pulmonary tuberculosis (ผู้ป่วยเบาหวานที่ควบคุมไม่ดี)**\n\n**ข้อมูลสนับสนุนจากประวัติ (constitutional + respiratory symptoms ของ TB)**\n- **ไอเรื้อรัง ≥ 2 สัปดาห์** (6 สัปดาห์) — เกณฑ์คัดกรองหลักของประเทศไทย\n- **ไอเป็นเลือด (haemoptysis)** — จากการกัดกร่อนหลอดเลือดในผนังโพรง (Rasmussen aneurysm ในรายรุนแรง)\n- **ไข้ต่ำ ๆ ตอนบ่าย + เหงื่อออกกลางคืน + น้ำหนักลด 6 กก. + เบื่ออาหาร** = classic constitutional symptoms จาก **TNF-α / IL-1 ที่หลั่งจาก granulomatous inflammation**\n- **ปัจจัยเสี่ยง**: **เบาหวานคุมไม่ได้ (HbA1c 9.2%)** ทำให้ **neutrophil chemotaxis, phagocytosis และ Th1 response บกพร่อง** → เพิ่มความเสี่ยง TB ~3 เท่า; **สูบบุหรี่จัด** ทำลาย mucociliary clearance และ macrophage function; **อาชีพขับรถสองแถว** = สัมผัสคนหนาแน่นในที่อากาศถ่ายเทไม่ดี\n\n**ตรวจร่างกาย**: ผอมลง, ไข้ต่ำ, **crackles ที่ปอดขวาบน**\n\n**ภาพรังสี — จุดชี้ขาด**: **right upper lobe infiltration + thick-walled cavity**\n> **ทำไม TB ชอบปอดกลีบบน**: บริเวณ apical/posterior segment ของ upper lobe และ superior segment ของ lower lobe มี **ventilation/perfusion ratio สูง → PO2 สูง** ซึ่งเหมาะกับเชื้อ **obligate aerobe** อย่าง *M. tuberculosis* และมี **lymphatic drainage น้อย** ทำให้กำจัดเชื้อได้ช้า\n\n**Lab สนับสนุน**: **anaemia of chronic disease** (Hb 10.8), **thrombocytosis** (380,000) เป็น acute-phase response, WBC มักปกติ (ต่างจากปอดอักเสบแบคทีเรียทั่วไป) — **WBC ปกติในผู้ป่วยไอเป็นเลือดที่มี cavity เป็นเบาะแสสำคัญ**"}, {"q": "2. จงส่งตรวจเพื่อยืนยันการวินิจฉัย พร้อมบอกเหตุผลของแต่ละอย่าง", "a": "**การตรวจเพื่อยืนยัน (ต้องได้เชื้อหรือสารพันธุกรรมของเชื้อ)**\n\n| การตรวจ | เหตุผล / จุดเด่น |\n|---|---|\n| **Xpert MTB/RIF (Ultra) จากเสมหะ** — **ทำเป็นอันดับแรกตามแนวทาง WHO/ประเทศไทย** | รู้ผลใน **~2 ชั่วโมง**, ไวกว่า smear มาก (โดยเฉพาะ smear-negative และผู้ติดเชื้อ HIV), และ **บอก rifampicin resistance ได้ทันที** |\n| **Sputum AFB smear (Ziehl-Neelsen หรือ fluorochrome) อย่างน้อย 2 ตัวอย่าง** รวมเสมหะตอนเช้า | ถูก เร็ว และ **บอกความสามารถในการแพร่เชื้อ** (smear-positive = แพร่เชื้อสูง ต้องแยกผู้ป่วย) |\n| **Sputum culture (solid Löwenstein-Jensen หรือ liquid MGIT) + drug susceptibility test** | **มาตรฐานอ้างอิง (gold standard)** ไวที่สุด และจำเป็นสำหรับ **DST** — MGIT ~2 สัปดาห์, solid media 3-8 สัปดาห์ |\n| **HIV testing (พร้อม counselling)** | **ต้องตรวจในผู้ป่วยวัณโรคทุกราย** เพราะเปลี่ยนทั้งการรักษา (เวลาเริ่ม ART, ปฏิกิริยาระหว่าง rifampicin กับยาต้านไวรัส) และพยากรณ์โรค |\n\n**การตรวจประกอบก่อนเริ่มยา (baseline)**\n- **LFT** (INH, RIF, PZA เป็นพิษต่อตับ) — รายนี้ AST/ALT ปกติ\n- **Cr/eGFR** (ปรับขนาด EMB, PZA)\n- **Visual acuity + colour vision (Ishihara)** ก่อนให้ **ethambutol** เพราะเสี่ยง optic neuritis\n- **Uric acid** (PZA ทำให้สูงขึ้น)\n- **น้ำหนักตัว** — ใช้คำนวณขนาดยาและติดตามการตอบสนอง\n- **ควบคุมเบาหวานให้ดีขึ้น** และตรวจ HbA1c ซ้ำ (rifampicin เร่งการเผาผลาญ sulfonylurea → น้ำตาลอาจสูงขึ้น)"}, {"q": "3. จงวางแผนการรักษาด้วยยาต้านวัณโรค พร้อมบอกขนาดยาโดยประมาณและระยะเวลา", "a": "**สูตรมาตรฐานสำหรับ drug-susceptible pulmonary TB: 2HRZE / 4HR (รวม 6 เดือน)**\n\n| ระยะ | ยา | ระยะเวลา |\n|---|---|---|\n| **Intensive phase** | **Isoniazid (H) + Rifampicin (R) + Pyrazinamide (Z) + Ethambutol (E)** | **2 เดือน** |\n| **Continuation phase** | **Isoniazid + Rifampicin** | **4 เดือน** |\n\n**ขนาดยาผู้ใหญ่ (น้ำหนัก 48 กก.)** — ให้วันละครั้ง ท้องว่าง\n- **Isoniazid 5 mg/kg** (≈ 250-300 mg) — สูงสุด 300 mg\n- **Rifampicin 10 mg/kg** (≈ 450-600 mg; น้ำหนัก < 50 กก. มักให้ 450 mg)\n- **Pyrazinamide 25 mg/kg** (≈ 1,200 mg)\n- **Ethambutol 15-20 mg/kg** (≈ 800 mg)\n- **Pyridoxine (vitamin B6) 10-25 mg/วัน** — **ต้องให้ในรายนี้** เพราะ **เบาหวาน** เป็นกลุ่มเสี่ยงต่อ **INH-induced peripheral neuropathy** (INH แย่งการทำงานของ pyridoxal phosphate)\n\n**เหตุผลเชิงกลไกที่ต้องใช้ยาหลายตัวและนาน**\n- **ใช้หลายตัว**: ในโพรงมีเชื้อ ~10⁸-10⁹ ตัว ซึ่ง **มีเชื้อกลายพันธุ์ดื้อยาแต่ละตัวอยู่แล้วตามธรรมชาติ** (INH ~1 ใน 10⁶, RIF ~1 ใน 10⁸) — ให้ยาตัวเดียวจึงเท่ากับคัดเลือกเชื้อดื้อยา\n- **ใช้นาน**: เชื้อกลุ่ม **persister/dormant** แบ่งตัวช้ามาก **rifampicin และ pyrazinamide เป็นยา sterilising** ที่ฆ่ากลุ่มนี้ได้ (PZA ทำงานได้ดีใน **สภาพเป็นกรดภายใน macrophage/บริเวณอักเสบ** จึงใช้แค่ 2 เดือนแรกที่การอักเสบยังมาก)\n\n**ผลข้างเคียงที่ต้องเตือนผู้ป่วย**\n- **Rifampicin**: **ปัสสาวะ/น้ำตา/เหงื่อสีส้มแดง** (บอกล่วงหน้าเพื่อไม่ให้หยุดยาเอง), เป็น **enzyme inducer แรง** → ลดระดับยาคุมกำเนิด, warfarin, ยาต้านไวรัส, sulfonylurea\n- **INH**: ตับอักเสบ, peripheral neuropathy, drug-induced lupus\n- **PZA**: ตับอักเสบ, **hyperuricaemia/ปวดข้อ**\n- **EMB**: **optic neuritis (สูญเสียการมองเห็นสีแดง-เขียว)** — ให้หยุดยาและพบแพทย์ทันทีถ้าตามัว"}, {"q": "4. ควรแยกผู้ป่วยอย่างไร และจะจัดการผู้สัมผัสในบ้านอย่างไร (ภรรยา และหลานอายุ 3 ขวบ)", "a": "**การแยกผู้ป่วย (airborne precautions)**\n- **กลไกการแพร่**: **droplet nuclei ขนาด 1-5 ไมครอน** ลอยในอากาศได้นานเป็นชั่วโมง เข้าถึงถุงลมโดยตรง → **ไม่ใช่ droplet ธรรมดา จึงใช้ surgical mask ป้องกันผู้สัมผัสไม่ได้**\n- **ลำดับความสำคัญของมาตรการ (hierarchy of controls)**\n 1. **Administrative**: คัดแยกผู้ป่วยไอเรื้อรังตั้งแต่จุดคัดกรอง, เริ่มยาเร็ว (**การรักษาที่ได้ผลคือมาตรการควบคุมการแพร่ที่ดีที่สุด**)\n 2. **Environmental**: **ห้องแยกความดันลบ ≥ 6-12 air changes/hour**, ถ้าไม่มีให้ใช้ห้องแยกที่ **เปิดหน้าต่าง อากาศถ่ายเทดี** และแสงแดดส่องถึง (UV ฆ่าเชื้อ)\n 3. **Personal**: **ผู้ป่วยใส่ surgical mask** (กันละอองที่ออกจากตัว), **บุคลากรใส่ N95** (กันการสูดละอองเข้า) — จำสลับกันไม่ได้\n- **ระยะเวลา**: จนกว่าจะ (1) **ได้ยาต้านวัณโรคที่เหมาะสม ≥ 2 สัปดาห์** (2) **อาการทางคลินิกดีขึ้น** และ (3) **AFB smear เป็นลบ 3 ครั้งติดต่อกัน** (เกณฑ์เข้มในกรณี MDR หรือมีผู้สัมผัสภูมิคุ้มกันต่ำ)\n\n**การจัดการผู้สัมผัสในบ้าน (contact investigation)**\n**ทุกคนที่อยู่ร่วมบ้าน ต้องได้รับการคัดกรองอาการ + CXR**\n\n| ผู้สัมผัส | แนวทาง |\n|---|---|\n| **ภรรยา (ผู้ใหญ่)** | ซักอาการ + **CXR**; ถ้าไม่มีอาการและ CXR ปกติ → ตรวจ **TST หรือ IGRA**; ถ้าบวก = **LTBI** → พิจารณารักษา (3HP, 4R, 3HR หรือ 6H) **หลังจากตัด active disease แล้วเท่านั้น**; ควรตรวจ HIV และเบาหวานด้วย |\n| **หลานอายุ 3 ขวบ** | **กลุ่มเสี่ยงสูงที่สุด** — เด็ก < 5 ปี มีโอกาสลุกลามเป็น **miliary TB และ TB meningitis** สูงมากหลังติดเชื้อ<br>• ประเมินอาการ + **CXR** + TST/IGRA<br>• **ถ้าไม่มี active TB → ต้องให้ยาป้องกัน (TB preventive therapy) ทันที แม้ TST จะยังลบ** เพราะภูมิยังไม่ตอบสนอง (anergy/ยังไม่ถึงเวลา) แล้วตรวจ TST ซ้ำที่ 8-12 สัปดาห์<br>• สูตรที่ใช้: **isoniazid 10 mg/kg/วัน 6-9 เดือน** หรือ **3HR/3HP ตามอายุและความพร้อม** พร้อม **pyridoxine** |\n\n**อื่น ๆ**: แจ้งเป็นโรคที่ต้องรายงาน, ขึ้นทะเบียนในระบบ **DOTS (directly observed therapy)** เพื่อให้กินยาครบ — การกินยาไม่ครบคือสาเหตุหลักของ **MDR-TB**"}, {"q": "5. จะติดตามการรักษาอย่างไร และถ้า sputum AFB ยังเป็นบวกเมื่อครบ intensive phase 2 เดือน จะทำอย่างไร", "a": "**การติดตามระหว่างการรักษา**\n\n| สิ่งที่ติดตาม | ความถี่ | เหตุผล |\n|---|---|---|\n| **Sputum AFB smear (± culture)** | **สิ้นเดือนที่ 2, 5 และ 6** | เป็นตัวชี้วัดหลักของการตอบสนอง และนิยาม treatment failure |\n| **น้ำหนักตัว** | ทุกครั้งที่มาตรวจ | เพิ่มขึ้น = ตอบสนองดี และใช้ปรับขนาดยา |\n| **อาการทางคลินิก** | ทุกครั้ง | ไข้ลด ไอลด เหงื่อกลางคืนหาย ภายใน 2-4 สัปดาห์ |\n| **LFT** | เมื่อมีอาการ (เบื่ออาหาร คลื่นไส้ ตัวเหลือง ปวดชายโครงขวา) หรือเป็นระยะในกลุ่มเสี่ยง | **Drug-induced hepatitis**: หยุดยาเมื่อ **ALT > 3 เท่าของค่าปกติร่วมกับมีอาการ** หรือ **> 5 เท่าแม้ไม่มีอาการ** |\n| **การมองเห็นและการแยกสี** | ทุกเดือนขณะได้ EMB | Optic neuritis |\n| **น้ำตาลในเลือด** | สม่ำเสมอ | **rifampicin เหนี่ยวนำ CYP → ลดระดับ sulfonylurea**; และเบาหวานที่คุมไม่ได้ทำให้ TB ตอบสนองช้า |\n| **CXR** | เมื่อสิ้นสุดการรักษา (ไม่ใช้ตัดสินระหว่างทาง) | รอยโรคทางรังสีหายช้ากว่าอาการเสมอ **ห้ามใช้ CXR เพียงอย่างเดียวตัดสินว่าล้มเหลว** |\n\n**ถ้า sputum AFB ยังบวกเมื่อครบ 2 เดือน**\n\n**ขั้นตอนที่ถูกต้อง**\n1. **ทบทวนความสม่ำเสมอในการกินยา (adherence)** — สาเหตุอันดับหนึ่ง; ตรวจสอบผ่านระบบ DOTS, ถามตรง ๆ อย่างไม่ตัดสิน, ดูสีปัสสาวะส้มจาก rifampicin\n2. **ส่ง sputum culture + drug susceptibility test และ Xpert MTB/RIF ซ้ำ** เพื่อดู **drug resistance** — นี่คือสิ่งที่ต้องทำเสมอ\n3. **ทบทวนขนาดยาเทียบกับน้ำหนัก** (ได้ยาน้อยเกินไปหรือไม่) และภาวะที่ทำให้ดูดซึมยาไม่ดี (เบาหวาน, ท้องเสียเรื้อรัง, กินยาพร้อมอาหาร)\n4. **ตรวจ HIV ซ้ำ/ประเมินภูมิคุ้มกัน** และควบคุมเบาหวานให้ดี\n5. **ถ้าเชื้อยังไวต่อยา (DST ปกติ)** → **ยืดระยะ intensive phase ออกไปอีก 1 เดือน** และตรวจเสมหะซ้ำ (ผู้ป่วยที่มีโพรงขนาดใหญ่และเชื้อมากมักเปลี่ยนเป็นลบช้า) พร้อมย้ำ DOTS\n\n**กฎเหล็กที่ออกสอบเสมอ**\n> **ห้ามเติมยาตัวเดียวเข้าไปในสูตรที่กำลังล้มเหลวเด็ดขาด (never add a single drug to a failing regimen)** เพราะเท่ากับให้ยาเดี่ยวต่อเชื้อที่ดื้อสูตรเดิม → สร้าง **MDR/XDR-TB**\n> ถ้าสงสัย MDR ต้องเปลี่ยนเป็น **สูตรใหม่ที่มียาที่คาดว่ายังได้ผลอย่างน้อย 4-5 ตัวพร้อมกัน** และส่งต่อผู้เชี่ยวชาญ\n\n**หมายเหตุสำคัญ**: **smear บวกอาจเป็นเชื้อที่ตายแล้ว** (ย้อมติดกรดได้แม้ตาย) — ดังนั้น **culture** จึงเป็นตัวตัดสินจริงว่าล้มเหลวหรือไม่ นิยาม **treatment failure = culture ยังบวกที่เดือนที่ 5 ขึ้นไป**"}], "ref": ["MED35 สอบลงกองครั้งที่ 1 — MEQ pulmonary TB", "MED33 MEQ วัณโรคปอด", "MED31 past paper loop C&D — TB"], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.1.33", "3.1.9"], "_kind": "meq", "_set": "chest"}], "osce": [{"id": "CH-OSCE-05", "part": "OSCE/SAQ", "lec": "03", "lecture": "Pulmonary tuberculosis / ABG (อ.ศิวพร)", "topic": "SAQ – Sputum smear interpretation: Gram stain and acid-fast bacilli", "station": "SAQ (เขียนตอบ) 5 นาที — สถานีกล้องจุลทรรศน์/ภาพสไลด์", "instruction": "สถานีนี้มีภาพสไลด์เสมหะของผู้ป่วย 2 ราย\n\n**ผู้ป่วยรายที่ 1**: ชายไทยอายุ 65 ปี ไข้สูงหนาวสั่น 2 วัน ไอมีเสมหะสีสนิม เจ็บหน้าอกขวาเวลาหายใจ CXR: right lower lobe consolidation with air bronchogram\nภาพย้อมสีแกรมจากเสมหะ (กำลังขยาย 1000 เท่า): พบ **epithelial cell < 10 เซลล์/LPF, neutrophil > 25 เซลล์/LPF** และพบ **gram-positive cocci รูปร่างคล้ายหัวหอกเรียงตัวเป็นคู่ (lancet-shaped diplococci)** จำนวนมากอยู่ภายในและรอบ neutrophil\n\n**ผู้ป่วยรายที่ 2**: หญิงไทยอายุ 38 ปี ไอเรื้อรัง 2 เดือน มีเสมหะปนเลือด น้ำหนักลด เหงื่อออกกลางคืน CXR: left upper lobe infiltration with cavity\nภาพย้อมสี Ziehl-Neelsen จากเสมหะ (กำลังขยาย 1000 เท่า): พบ **แท่งสีแดงเรียวโค้งเล็กน้อย บางตัวเรียงตัวคล้ายเส้นเชือก (cording)** บนพื้นสีน้ำเงิน นับได้ประมาณ **5 ตัวต่อ 1 oil field**\n\nจงตอบคำถามต่อไปนี้\n5.1 จงบอกว่าเสมหะของผู้ป่วยรายที่ 1 มีคุณภาพเพียงพอต่อการแปลผลหรือไม่ พร้อมเหตุผล (2 คะแนน)\n5.2 เชื้อก่อโรคของผู้ป่วยรายที่ 1 คืออะไร และจะให้ยาอะไร (3 คะแนน)\n5.3 จงรายงานผลสไลด์ของผู้ป่วยรายที่ 2 ตามระบบการรายงานมาตรฐาน และให้การวินิจฉัย (3 คะแนน)\n5.4 ข้อจำกัดของการย้อมสีทนกรดคืออะไร (2 คะแนน)", "answer": "**5.1 คุณภาพของเสมหะผู้ป่วยรายที่ 1**\n\n**เพียงพอต่อการแปลผล (adequate specimen)**\n\n**เกณฑ์คุณภาพเสมหะ (Bartlett / Murray-Washington criteria) ประเมินที่กำลังขยายต่ำ (LPF, ×100)**\n- **Squamous epithelial cell < 10 เซลล์/LPF** ✔ (รายนี้ < 10)\n- **Polymorphonuclear neutrophil > 25 เซลล์/LPF** ✔ (รายนี้ > 25)\n\n**เหตุผลเชิงกลไก**: **squamous epithelial cell มาจากช่องปากและคอหอย** ไม่ได้มาจากทางเดินหายใจส่วนล่าง การพบมากแปลว่าตัวอย่างเป็น **น้ำลายที่ปนเปื้อนเชื้อประจำถิ่นในช่องปาก** ซึ่งจะทำให้แปลผลผิดพลาดและเพาะขึ้นเชื้อที่ไม่ใช่สาเหตุของโรค ส่วน **neutrophil จำนวนมากบ่งชี้ว่ามีการอักเสบจากทางเดินหายใจส่วนล่างจริง**\n\n> **หมายเหตุสำคัญ**: เกณฑ์นี้ใช้กับ **การย้อมแกรมและการเพาะเชื้อแบคทีเรียทั่วไป** เท่านั้น — **ไม่ใช้กับตัวอย่างสำหรับตรวจวัณโรค, Legionella, เชื้อรา หรือไวรัส** ซึ่งตัวอย่างที่มีเซลล์เยื่อบุปนก็ยังส่งตรวจได้\n\n**5.2 เชื้อก่อโรคและการรักษาของผู้ป่วยรายที่ 1**\n\n**เชื้อ: *Streptococcus pneumoniae* (pneumococcus)**\n\n**หลักฐานที่ประกอบกัน**\n- **Gram-positive, lancet-shaped diplococci** — รูปร่างจำเพาะมาก (อาจเห็นเป็นวงใสรอบตัวเชื้อจาก **polysaccharide capsule**)\n- **เสมหะสีสนิม (rusty sputum)** — เกิดจาก **เม็ดเลือดแดงที่รั่วเข้าถุงลมแล้วถูกย่อยสลาย** ในระยะ red hepatisation\n- **ไข้สูงหนาวสั่นเฉียบพลัน + lobar consolidation ที่มี air bronchogram** — รูปแบบคลาสสิกของ lobar pneumonia\n\n**การรักษา**\n| สถานการณ์ | ยาที่เลือก |\n|---|---|\n| **ผู้ป่วยนอกที่แข็งแรงดี** | **Amoxicillin ขนาดสูง 1 g วันละ 3 ครั้ง** |\n| **ผู้ป่วยในที่ไม่รุนแรง (ward)** | **Ceftriaxone 1-2 g IV วันละครั้ง ร่วมกับ azithromycin** หรือ **respiratory fluoroquinolone เดี่ยว (levofloxacin 750 mg)** |\n| **Severe CAP (ICU)** | **Beta-lactam + macrolide เสมอ (การรักษาแบบผสม)** |\n| **แพ้ penicillin รุนแรง** | **Respiratory fluoroquinolone** |\n\n**กลไกและประเด็นที่ต้องรู้**: pneumococcus ดื้อ penicillin ผ่าน **การเปลี่ยนแปลงของ penicillin-binding protein (ไม่ใช่ beta-lactamase)** → **การเติม clavulanate จึงไม่ช่วยแก้การดื้อ** แต่การใช้ **ขนาดยาที่สูงขึ้น** เอาชนะได้ในเชื้อที่ดื้อระดับกลาง\n**ระยะเวลารักษา**: **อย่างน้อย 5 วัน และต้องไม่มีไข้ ≥ 48 ชั่วโมง พร้อมสัญญาณชีพคงที่ก่อนหยุดยา**\n**การป้องกัน**: **วัคซีนนิวโมคอคคัส** ในผู้สูงอายุและกลุ่มเสี่ยง\n\n**5.3 การรายงานผลสไลด์ของผู้ป่วยรายที่ 2 และการวินิจฉัย**\n\n**การรายงาน: \"AFB smear positive 2+ (ประมาณ 5 ตัว/oil immersion field)\"**\n\n**ระบบรายงานมาตรฐาน (WHO/IUATLD) สำหรับการย้อม Ziehl-Neelsen ที่กำลังขยาย 1000 เท่า (oil immersion field, ตรวจ 100 fields)**\n\n| จำนวนที่พบ | รายงานเป็น |\n|---|---|\n| ไม่พบใน 100 fields | **Negative** |\n| **1-9 ตัวใน 100 fields** | **รายงานจำนวนที่พบจริง (scanty)** |\n| **10-99 ตัวใน 100 fields** | **1+** |\n| **1-10 ตัวต่อ 1 field** (ตรวจอย่างน้อย 50 fields) | **2+** ← **รายนี้** |\n| **มากกว่า 10 ตัวต่อ 1 field** (ตรวจอย่างน้อย 20 fields) | **3+** |\n\n**การแปลผลและการวินิจฉัย: Active pulmonary tuberculosis (smear-positive)**\n- ลักษณะ **แท่งเรียวโค้งสีแดงบนพื้นน้ำเงิน** = **acid-fast bacilli** — ผนังเซลล์มี **mycolic acid** ปริมาณมาก ทำให้จับสี carbol fuchsin ไว้ได้แม้ล้างด้วย **acid-alcohol** (จึงเรียก \"ทนกรด\")\n- **การเรียงตัวคล้ายเส้นเชือก (serpentine cording)** สัมพันธ์กับ **cord factor (trehalose-6,6'-dimycolate)** ซึ่งเป็น **ปัจจัยก่อโรคของ *M. tuberculosis*** และช่วยแยกจาก NTM หลายชนิดได้ในระดับหนึ่ง\n- ประวัติ **ไอเรื้อรัง 2 เดือน + ไอเป็นเลือด + น้ำหนักลด + เหงื่อออกกลางคืน + โพรงที่ปอดกลีบบนซ้าย** สอดคล้องอย่างยิ่ง\n\n**ความสำคัญทางคลินิกของระดับ smear**: **ยิ่งระดับสูง ยิ่งมีเชื้อมากและแพร่เชื้อได้มาก** → ต้อง **แยกผู้ป่วยแบบ airborne precaution** (ห้องแยกความดันลบหรือห้องอากาศถ่ายเทดี, **ผู้ป่วยใส่ surgical mask / บุคลากรใส่ N95**) และ **สอบสวนผู้สัมผัสอย่างเร่งด่วน**\n\n**ขั้นตอนต่อไป**: ส่ง **Xpert MTB/RIF (Ultra)** เพื่อยืนยันว่าเป็น *M. tuberculosis* จริงและดูการดื้อ rifampicin, ส่ง **culture + DST**, **ตรวจ HIV**, ตรวจ baseline LFT/Cr/การมองเห็น แล้ว **เริ่มสูตร 2HRZE/4HR พร้อม pyridoxine** และขึ้นทะเบียน DOTS\n\n**5.4 ข้อจำกัดของการย้อมสีทนกรด**\n\n1. **ความไวต่ำ** — ต้องมีเชื้ออย่างน้อยประมาณ **5,000-10,000 ตัวต่อมิลลิลิตรของเสมหะ** จึงจะตรวจพบ ทำให้ **ตรวจพบเพียง 50-60% ของผู้ป่วยวัณโรคปอดที่เพาะเชื้อขึ้น** → **smear เป็นลบไม่ตัดโรค** โดยเฉพาะใน **ผู้ติดเชื้อ HIV, เด็ก, วัณโรคนอกปอด และรอยโรคที่ไม่มีโพรง**\n\n2. **ความจำเพาะจำกัด — แยกชนิดของเชื้อไม่ได้** การย้อมบอกได้เพียงว่าเป็น **แบคทีเรียทนกรด** ซึ่งรวมถึง **nontuberculous mycobacteria (NTM) เช่น *M. avium* complex, *M. abscessus*** และเชื้อทนกรดบางส่วนอื่น (*Nocardia* ติดสีทนกรดแบบอ่อน, *Rhodococcus*) → **ต้องยืนยันชนิดด้วย culture หรือ molecular test**\n\n3. **แยกเชื้อเป็นกับเชื้อตายไม่ได้** — เชื้อที่ตายแล้วยังคงย้อมติดสีทนกรด ทำให้ **smear อาจยังบวกระหว่างการรักษาที่ได้ผลดี** → **ห้ามใช้ smear เพียงอย่างเดียวตัดสินว่าการรักษาล้มเหลว ต้องใช้ culture**\n\n4. **ไม่บอกความไวต่อยา** — ต้องอาศัย **culture + drug susceptibility test หรือ molecular test (Xpert MTB/RIF, line probe assay)**\n\n5. **ขึ้นกับคุณภาพตัวอย่างและผู้อ่าน** — ต้องเป็น **เสมหะจริงไม่ใช่น้ำลาย**, ควรเก็บอย่างน้อย 2 ตัวอย่างรวมตัวอย่างตอนเช้า, และ **ใช้เวลาอ่านนาน** (การย้อมด้วย **fluorochrome (auramine-rhodamine)** อ่านเร็วกว่าและไวกว่า ZN ประมาณ 10% จึงเป็นวิธีที่ WHO แนะนำเมื่อมีกล้อง LED)\n\n> ด้วยข้อจำกัดเหล่านี้ **WHO จึงแนะนำให้ใช้ Xpert MTB/RIF (Ultra) เป็นการตรวจเริ่มต้นแทน smear** ในผู้ที่สงสัยวัณโรค เพราะไวกว่ามาก รู้ผลใน ~2 ชั่วโมง และบอกการดื้อ rifampicin ได้ทันที", "ref": ["MED35 สอบลงกองครั้งที่ 1 — OSCE/SAQ sputum smear", "MED32 SAQ AFB smear", "MED30 SAQ gram stain sputum"], "nl": ["3.1.9", "2.3.10(5)", "2.3.4(20)"], "_kind": "meq", "_set": "chest"}], "sections": [{"id": "chest-03-01", "title": "เชื้อ การติดต่อ และการป้องกันการแพร่เชื้อ", "minutes": 7, "summary": "ทำไมวัณโรคติดทางอากาศ และมาตรการที่ต้องทำในวันแรกที่รับผู้ป่วยไว้", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### ตัวเชื้อ\n*Mycobacterium tuberculosis* อยู่ใน **M. tuberculosis complex** เป็นแบคทีเรีย **รูปแท่ง ไม่เคลื่อนที่ ต้องการออกซิเจน (aerobe) และโตช้ามาก** ขนาดหนา 0.3 µm ยาว 1–5 µm ผนังเซลล์มีไขมัน (mycolic acid) สูง จึงย้อมติดสีทนกรด และเป็นเหตุผลที่ **เชื้อชอบบริเวณที่มีออกซิเจนสูง เช่น ปอดกลีบบน**\n\n**ความทนทานของเชื้อ (ตัวเลขจากสไลด์)**\n- ในเสมหะแห้งที่ไม่ถูกแสงแดด อยู่ได้นานถึง **6 เดือน**\n- **แสงแดดฆ่าเชื้อในเสมหะใช้เวลา 20–30 ชั่วโมง**\n- **รังสีอัลตราไวโอเลตฆ่าได้ภายใน 1–2 นาที**\n- **ความร้อน 60 °C นาน 20 นาที** ทำลายเชื้อได้\n\n### การติดต่อ — airborne ไม่ใช่ droplet\n- ผู้ป่วย **ไอ จาม หัวเราะ หรือร้องเพลง** ปล่อย **droplet nuclei ขนาด 1–5 µm** ซึ่ง **ลอยในอากาศได้ราว 30 นาที** (ละอองใหญ่ตกลงพื้นเร็วและไม่ใช่ตัวแพร่เชื้อหลัก)\n- **ต้องสัมผัสใกล้ชิดเป็นเวลานาน** จึงติด — การเดินผ่านกันไม่ค่อยทำให้ติด\n- **เซลล์เป้าหมายคือ alveolar macrophage** ผลลัพธ์ของการติดเชื้อขึ้นกับภูมิคุ้มกันของผู้รับและความรุนแรงของเชื้อ\n\n### สิ่งที่ต้องสั่งทันทีเมื่อรับผู้ป่วยสงสัยวัณโรคปอดไว้ในโรงพยาบาล\n1. **แยกผู้ป่วยในห้องความดันลบ (airborne isolation)** — ถ้าไม่มี ให้ห้องแยกที่ระบายอากาศดี\n2. **บุคลากรใส่ N95 respirator** (surgical mask ของบุคลากรไม่พอ เพราะกันอนุภาคขนาด 1–5 µm ไม่ได้) และให้ **ผู้ป่วยใส่ surgical mask** เมื่อออกจากห้องหรือมีคนเข้าเยี่ยม\n3. เปิดการระบายอากาศ/ใช้ UV germicidal irradiation ตามที่มี\n4. เก็บเสมหะส่งตรวจก่อนเริ่มยา และเริ่มยาให้เร็ว — **การรักษาที่ได้ผลคือมาตรการควบคุมการแพร่เชื้อที่ดีที่สุด**\n5. คัดกรองผู้สัมผัสร่วมบ้าน โดยเฉพาะ **เด็กอายุน้อยกว่า 5 ปี ผู้ติดเชื้อเอชไอวี และผู้ที่ได้ยากดภูมิคุ้มกัน**\n\n> **กับดักที่ออกสอบ** — การล้างมือ ถุงมือ เสื้อกาวน์ และ **การล้างจาน/แยกภาชนะ ไม่ได้ช่วยป้องกันวัณโรค** เพราะไม่ใช่โรคติดต่อทางสัมผัสหรือทางเดินอาหาร\n", "pearls": ["วัณโรคติดทาง airborne ผ่าน droplet nuclei 1–5 µm ที่ลอยอยู่ได้ราว 30 นาที", "บุคลากรต้องใส่ N95 · ผู้ป่วยใส่ surgical mask · ห้องความดันลบ", "แยกภาชนะและอุปกรณ์กินอาหารไม่ได้ช่วยอะไร"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-MCQ-08", "kind": "mcq", "stem": "Which statement best describes how Mycobacterium tuberculosis is transmitted, and what is the most effective single measure to interrupt transmission in a hospital?", "choices": ["Ingestion of contaminated food or milk; pasteurisation of dairy products", "Large respiratory droplets over 5 micrometres that fall within 1 metre; surgical masks for all visitors", "Airborne droplet nuclei 1-5 micrometres that remain suspended in air; prompt identification and effective treatment of infectious cases", "Percutaneous inoculation through needlestick injury; sharps disposal protocols", "Direct contact with contaminated surfaces; alcohol-based hand rub"], "answer": 2, "explain": "**กลไกการแพร่เชื้อ**: เมื่อผู้ป่วยไอ จาม พูด หรือร้องเพลง จะปล่อยละอองที่ระเหยน้ำออกจนเหลือ **droplet nuclei ขนาด 1-5 ไมครอน** ซึ่ง\n- **ลอยในอากาศได้นานหลายชั่วโมง** และกระจายไปตามกระแสลมทั่วห้อง\n- **เล็กพอที่จะผ่านลงไปถึง alveoli** ได้โดยตรง (ละอองใหญ่จะติดที่ทางเดินหายใจส่วนบนและถูกกำจัด)\n→ ดังนั้นวัณโรคจึงเป็น **airborne** ไม่ใช่ droplet และ **การอยู่ห่างกันเกิน 1 เมตรไม่เพียงพอ**\n\n**ลำดับชั้นของการป้องกัน (hierarchy of controls)**\n1. **Administrative control — ได้ผลมากที่สุด**: **คัดกรองและวินิจฉัยเร็ว แยกผู้ป่วยทันที และเริ่มการรักษาที่ได้ผล** เพราะ **ผู้ป่วยที่ได้ยาที่เชื้อไวจะลดการแพร่เชื้อลงอย่างมากภายใน 2 สัปดาห์** — การรักษาคือมาตรการควบคุมการติดเชื้อที่ทรงพลังที่สุด\n2. **Environmental control**: **ห้องความดันลบ 6-12 ACH**, การระบายอากาศตามธรรมชาติ (เปิดหน้าต่าง — ใช้ได้ดีในบริบทไทย), **UV germicidal irradiation**\n3. **Personal protective equipment — ชั้นสุดท้าย**: **บุคลากรใส่ N95** (ต้องทำ fit test); **ผู้ป่วยใส่ surgical mask** เมื่อออกจากห้อง (เพื่อดักละอองที่ต้นทาง — ไม่ใช้ N95 กับผู้ป่วยเพราะมี exhalation valve ในบางรุ่นและหายใจลำบาก)\n\n**ปัจจัยที่เพิ่มการแพร่**: เสมหะ **AFB smear บวก**, มี **cavity**, ไอมาก, **ยังไม่ได้รับการรักษา**, พื้นที่แออัดและระบายอากาศไม่ดี, ระยะเวลาสัมผัสนาน\n\nทำไมข้ออื่นผิด: การแพร่แบบ droplet ใหญ่คือ influenza/pertussis; contact คือ MRSA/C. difficile; **Mycobacterium bovis** ต่างหากที่ติดจากนมไม่ผ่านการฆ่าเชื้อ (ไม่ใช่ M. tuberculosis); และวัณโรคไม่ติดทางเข็มตำในทางปฏิบัติ", "pearl": "เกณฑ์ยุติการแยกผู้ป่วยวัณโรคปอดในโรงพยาบาล: **ได้ยาที่เหมาะสมอย่างน้อย 2 สัปดาห์ + อาการทางคลินิกดีขึ้น + AFB smear ลบ 3 ครั้งจากคนละวัน** (และต้องไม่สงสัย MDR-TB ซึ่งต้องรอ culture conversion)", "topic": "Mechanism of tuberculosis transmission and infection control", "src": "", "ref": ["MED35 MEQ (สอบลงกอง) ข้อ 7 – บอกวิธีแพร่กระจายของเชื้อวัณโรค → Air borne", "MED32 MCQ ข้อ 28, 32, 60 – คนไข้ TB ให้นอนห้องแบบไหน ต้องใส่ mask ไหม → negative pressure room", "MED32 MCQ ข้อ 8 – ถ้าเป็น TB ควรแยกจากคนอื่นกี่สัปดาห์", "MED34 FA MCQ (Infection ข้อ 15) – ถามการ transmission ของเชื้อ"], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-08", "kind": "old", "stem": "A patient with newly diagnosed smear-positive pulmonary tuberculosis is admitted. Which admission arrangement is most appropriate?", "choices": ["Admit to a positive-pressure isolation room with staff wearing surgical masks", "Admit to a negative-pressure isolation room and have all staff wear an N95 respirator", "Admit to a general ward with contact precautions and gowns", "Admit to a general ward and have the patient wear a surgical mask only", "No isolation is needed once anti-tuberculous drugs have been started"], "answer": 1, "explain": "วัณโรคปอดแพร่ทาง **airborne (droplet nuclei ขนาด 1-5 ไมครอน ลอยในอากาศได้นาน)** → ต้องใช้ **airborne precautions: ห้องแยกความดันลบ (negative pressure) ที่มีการระบายอากาศ 6-12 ACH และบุคลากรใส่ N95**\n\nความเข้าใจผิดที่ออกสอบ: **positive pressure ใช้ป้องกันผู้ป่วยภูมิคุ้มกันต่ำจากสิ่งแวดล้อม** ไม่ใช่ป้องกันการแพร่เชื้อออก; **ผู้ป่วยเองใส่ surgical mask** เมื่อต้องออกจากห้อง (ไม่ใช่ N95)\n\nการแยกจะยุติเมื่อ **ได้รับยาอย่างน้อย 2 สัปดาห์ + อาการดีขึ้น + AFB smear ลบ 3 ครั้งติดต่อกัน** (และต้องไม่สงสัย MDR)", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 60 – คนไข้ TB positive ต้องให้อยู่ในวอร์ดไหน → negative pressure room; MED32 MCQ ข้อ 28 และ 32 – คนไข้ TB ให้นอนห้องแบบไหน ต้องใส่ mask ไหม; MED32 MCQ ข้อ 8 – ถ้าเป็น TB ควรแยกจากคนอื่นกี่สัปดาห์", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}]}, {"id": "chest-03-02", "title": "ธรรมชาติของโรค — primary, latent และ reactivation", "minutes": 8, "summary": "ตัวเลข 5% + 5% และกลไก granuloma ที่เป็น type IV hypersensitivity", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### หลังสูดเชื้อเข้าไปเกิดอะไรขึ้น\nเชื้อถูก alveolar macrophage กลืนและถูกพาไปที่ **ต่อมน้ำเหลืองขั้วปอด** ภูมิคุ้มกันชนิดเซลล์ใช้เวลา **3–8 สัปดาห์** จึงสร้าง **granuloma** ล้อมเชื้อไว้ — ปฏิกิริยานี้คือ **type IV (delayed) hypersensitivity** ซึ่งเป็นเหตุผลที่ tuberculin skin test เพิ่งบวกหลังติดเชื้อไปแล้วหลายสัปดาห์\n\nพยาธิสภาพคือ **granulomatous inflammation ที่มี epithelioid macrophage, Langhans giant cell, lymphocyte และ caseous necrosis อยู่ตรงกลาง**\n\n### ตัวเลขที่ต้องจำ\n- ผู้ติดเชื้อ **ราว 5% เป็นวัณโรคภายใน 2 ปีแรก** และอีก **ราว 5% เป็นในภายหลัง** ที่เหลือคุมเชื้อไว้ได้เป็น **latent TB infection**\n- **วัณโรคที่ไม่ได้รักษา เสียชีวิตราว 50–65% ใน 5 ปี · ยังป่วยเรื้อรังราว 25% · หายเองราว 25%**\n\n### Primary TB disease\nเกิดเมื่อภูมิคุ้มกันคุมไม่อยู่ตั้งแต่แรก มักพบในเด็กและผู้ที่ภูมิคุ้มกันต่ำ\n- **Ghon focus** = รอยโรคปฐมภูมิ มักอยู่ **ใต้เยื่อหุ้มปอด บริเวณปอดส่วนกลางถึงล่าง** (บริเวณที่ลมเข้ามากที่สุด)\n- **Ghon complex** = Ghon focus + **ต่อมน้ำเหลืองขั้วปอดโต**\n- ภาพที่พบ: TB pneumonia · ต่อมน้ำเหลืองในช่องอกโต · **middle lobe syndrome** จากต่อมกดหลอดลม · ปอดแฟบ\n- ต่อมน้ำเหลืองที่แตกเข้าโครงสร้างข้างเคียง → **TB pericarditis · TB pleuritis · miliary TB (เมื่อแตกเข้าหลอดเลือด)**\n\n### Reactivation (post-primary/secondary) TB\nเชื้อที่หลับอยู่กลับมาแบ่งตัวเมื่อภูมิคุ้มกันตก หรือได้รับเชื้อซ้ำ\n- **ตำแหน่งคลาสสิก: apical และ posterior segment ของปอดกลีบบน หรือ superior segment ของกลีบล่าง** (บริเวณที่ออกซิเจนสูงที่สุด) และพบ **สองข้างได้บ่อย**\n- **โพรง (cavity) ผนังบาง ขอบในเรียบ และมักไม่มีระดับน้ำ–อากาศ** (ต่างจากฝีในปอดที่ผนังหนาและมี air–fluid level)\n- แพร่ไปกลีบอื่นทาง **transbronchial spread** จึงพบรอยโรคกลีบบนข้างหนึ่งกับกลีบล่างอีกข้างพร้อมกัน\n- ผลระยะยาว: **bronchiectasis (มักไม่มีอาการ) · bronchostenosis จากพังผืด · ปอดแฟบและ middle lobe syndrome**\n\n### ใครเสี่ยงต่อการกลายเป็นวัณโรคระยะแสดงอาการ (จากสไลด์)\n| กลุ่มที่มีโรคหรือภาวะเสี่ยง | กลุ่มประชากรเสี่ยง |\n|---|---|\n| **ผู้ติดเชื้อเอชไอวี** · **เบาหวาน** · ได้ยากดภูมิคุ้มกัน (มะเร็ง ปลูกถ่ายอวัยวะ SLE) | **ผู้สัมผัสผู้ป่วยวัณโรค โดยเฉพาะเด็กอายุน้อยกว่า 5 ปี** และผู้สัมผัสวัณโรคดื้อยา |\n| **COPD และผู้สูบบุหรี่** · **silicosis** · โรคไตเรื้อรัง | ผู้สูงอายุ โดยเฉพาะผู้ป่วยเรื้อรัง ติดเตียง ติดบ้าน |\n| **ผ่าตัดกระเพาะ/ตัดต่อลำไส้** · ทุพโภชนาการ | **ผู้ต้องขังและบุคลากรในเรือนจำ · บุคลากรสาธารณสุข** |\n| ติดสุราและสารเสพติด · **เคยเป็นวัณโรคมาก่อน** | แรงงานย้ายถิ่นจากประเทศที่มีความชุกสูง · ผู้อยู่ในที่แออัด · คนไร้ที่อยู่อาศัย |\n", "pearls": ["ติดเชื้อแล้ว 5% เป็นโรคใน 2 ปีแรก และอีก 5% เป็นภายหลัง", "Ghon focus อยู่ใต้เยื่อหุ้มปอดส่วนกลาง–ล่าง แต่ reactivation อยู่ยอดปอด", "โพรงวัณโรคผนังบาง ขอบในเรียบ ไม่มีระดับน้ำ-อากาศ", "granuloma ของวัณโรคคือปฏิกิริยา type IV hypersensitivity"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-10", "kind": "old", "stem": "Reactivation pulmonary tuberculosis in an immunocompetent adult most characteristically involves which part of the lung, and why?", "choices": ["Right middle lobe, because of its narrow bronchus", "Basal segments of the lower lobes, because of gravity-dependent ventilation", "Peripheral subpleural regions of both lower lobes, because of higher perfusion", "Lingula, because of poor lymphatic drainage", "Apical and posterior segments of the upper lobes, because of the higher oxygen tension there"], "answer": 4, "explain": "**M. tuberculosis เป็น obligate aerobe** → เจริญได้ดีที่สุดในบริเวณที่มี **oxygen tension สูงและ perfusion ต่ำ** ซึ่งคือ **apical/posterior segment ของ upper lobe และ superior segment ของ lower lobe**\n\nแยกจาก **primary TB** ที่มักอยู่ที่ **middle/lower zone** พร้อม hilar lymphadenopathy (Ghon complex)\n\nลักษณะบน CXR ของ reactivation: **fibronodular opacity, cavitation, volume loss ที่ปอดส่วนบน**", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 18 – TB → Apex of lung", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.3.20"]}, {"id": "CH-MCQ-05", "kind": "mcq", "stem": "A 45-year-old man with diabetes presents with 6 weeks of fever, weight loss and progressive dyspnoea. Chest radiograph shows innumerable uniform 2 mm nodules evenly distributed throughout both lungs. He is confused on examination. Which of the following is the most appropriate combination of investigations?", "choices": ["Serial chest radiographs for 4 weeks before any invasive test", "Bronchoscopy with bronchoalveolar lavage for Pneumocystis only", "High-resolution CT of the chest only", "Sputum and blood for mycobacterial culture, fundoscopy for choroidal tubercles and lumbar puncture", "Sputum culture alone and observation"], "answer": 3, "explain": "**Miliary TB = การแพร่กระจายของเชื้อทางกระแสเลือดไปทั่วร่างกาย** ชื่อมาจากลักษณะ **nodule เล็ก 1-3 มม. กระจายสม่ำเสมอทั้งสองปอดเหมือนเมล็ดข้าวฟ่าง (millet seed)**\n\n**กลุ่มเสี่ยง**: **เบาหวาน, HIV, ผู้สูงอายุ, เด็กเล็ก, ผู้ได้ยากดภูมิ/anti-TNF, ไตวาย, ทุพโภชนาการ, ตั้งครรภ์/หลังคลอด**\n\n**หลักการสืบค้น: เมื่อกระจายทางเลือด ต้องหาเชื้อจากหลายอวัยวะพร้อมกัน**\n1. **Sputum AFB/culture/molecular test** — แม้ CXR จะไม่มี cavity ก็ควรส่ง\n2. **Blood culture สำหรับ mycobacteria** — มีความไวสูงเป็นพิเศษในผู้ติดเชื้อ HIV\n3. **Fundoscopy หา choroidal tubercle** — เป็นสิ่งตรวจที่ **ทำได้ทันที ไม่รุกล้ำ และค่อนข้างจำเพาะ**\n4. **Lumbar puncture** — เพราะ **miliary TB ร่วมกับ TB meningitis ได้บ่อยมาก** และผู้ป่วยรายนี้ **สับสน** ซึ่งเป็นข้อบ่งชี้ชัดเจน (ควรถ่ายภาพสมองก่อนถ้ามี focal deficit หรือ papilloedema)\n5. อื่นๆตามอาการ: **bone marrow และ liver biopsy** (ให้ผลบวกสูงในรายที่หาไม่เจอจากที่อื่น), ปัสสาวะ, น้ำในเยื่อหุ้มต่างๆ\n\n**อย่ารอผลก่อนเริ่มรักษา**: miliary TB มี mortality สูง → **เริ่มยาต้านวัณโรคเชิงประจักษ์เมื่อภาพทางคลินิกเข้าได้** และเพิ่ม **steroid เมื่อมี meningitis หรือ pericarditis ร่วม**\n\nทำไมข้ออื่นผิด: การส่งเสมหะอย่างเดียวมีความไวต่ำใน miliary TB (มักไม่มี cavity เชื้อจึงน้อย); CT ช่วยเห็นรอยโรคแต่ไม่ให้การวินิจฉัยจุลชีววิทยา; PCP ให้ **ground-glass** ไม่ใช่ miliary nodule; การเฝ้าดู 4 สัปดาห์คือการปล่อยให้ผู้ป่วยเสียชีวิต", "pearl": "DDx ของ **miliary pattern** บน CXR: **TB, เชื้อรากระจาย (histoplasmosis, cryptococcosis), มะเร็งแพร่กระจาย (thyroid, renal cell, melanoma), silicosis, sarcoidosis และ hypersensitivity pneumonitis**", "topic": "Miliary tuberculosis", "src": "", "ref": ["MED32 MCQ ข้อ 32 – ให้อาการ extrapulmonary TB ทำยังไงดี", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 53 – ตัด ileum ไปตรวจ biopsy เจอ granulomatous inflammation → TB", "MED34 MCQ ครั้งที่ 4 ข้อ 76 – Terminal ileum thickening + lymphadenopathy → TB", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (GI ข้อ 2) – ascites low SAAG high protein → TB peritoneal"], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.1.1"]}]}, {"id": "chest-03-03", "title": "Latent TB infection และการดูแลผู้สัมผัส", "minutes": 7, "summary": "ใครควรตรวจ ใครควรรักษา และสูตรยาป้องกัน", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "**LTBI = มีเชื้ออยู่ในร่างกายโดยที่ร่างกายคุมไว้ได้** — ไม่มีอาการ **ภาพรังสีปกติ (หรือมีเพียงรอยหินปูนเก่า) เสมหะตรวจไม่พบเชื้อ และไม่แพร่เชื้อ**\n\n### หลักการที่ห้ามลืม\n> **ต้องตัดวัณโรคระยะแสดงอาการออกให้ได้ก่อนเสมอ** — ซักอาการ (ไอเกิน 2 สัปดาห์ ไข้ เหงื่อออกกลางคืน น้ำหนักลด) และ **ถ่ายภาพรังสีทรวงอก** ถ้ามีอาการหรือภาพผิดปกติต้องส่งเสมหะก่อน เพราะ **การให้ยาป้องกันตัวเดียวในผู้ที่เป็นวัณโรคจริงจะทำให้เกิดเชื้อดื้อยา**\n\n### ใครควรได้รับการตรวจ LTBI (ตรวจเมื่อพร้อมจะรักษาเท่านั้น)\n- **ผู้สัมผัสร่วมบ้านของผู้ป่วยวัณโรคปอด** โดยเฉพาะ **เด็กอายุน้อยกว่า 5 ปี**\n- **ผู้ติดเชื้อเอชไอวี**\n- ผู้ที่กำลังจะได้รับ **ยากดภูมิคุ้มกัน โดยเฉพาะ anti-TNF**, ผู้ปลูกถ่ายอวัยวะ, ผู้ฟอกไต\n- บุคลากรสาธารณสุขและกลุ่มประชากรเสี่ยงตามบริบท\n\n**เครื่องมือ** — **TST (tuberculin skin test)** หรือ **IGRA** · IGRA ไม่ถูกรบกวนจากวัคซีน BCG จึงเหมาะกับผู้ที่เคยฉีด BCG · **ทั้งสองอย่างแยก LTBI ออกจาก active TB ไม่ได้** และผลลบไม่ตัดโรคในผู้ที่ภูมิคุ้มกันต่ำ\n\n### สูตรยาป้องกัน (เลือกได้ตามบริบท)\n| สูตร | รายละเอียด | ข้อดี |\n|---|---|---|\n| **3HP** | isoniazid + rifapentine สัปดาห์ละครั้ง 12 ครั้ง | สั้น ผู้ป่วยทำสำเร็จสูง |\n| **4R** | rifampicin ทุกวัน 4 เดือน | ตับอักเสบน้อยกว่า H |\n| **3HR** | isoniazid + rifampicin ทุกวัน 3 เดือน | ใช้ในเด็กได้ดี |\n| **6H หรือ 9H** | isoniazid ทุกวัน 6–9 เดือน | ใช้ได้เมื่อมีข้อจำกัดเรื่อง rifamycin |\n\n- **ให้ pyridoxine (vitamin B6) ร่วมด้วยเมื่อใช้ isoniazid** ในผู้ที่เสี่ยงต่อปลายประสาทอักเสบ (เบาหวาน ไตวาย ติดสุรา ตั้งครรภ์ ผู้ติดเชื้อเอชไอวี ทุพโภชนาการ)\n- **ผู้สัมผัสวัณโรคดื้อยาต้องปรึกษาผู้เชี่ยวชาญ** ไม่ใช้สูตรมาตรฐาน\n- ก่อนเริ่มยาให้ประเมินตับ (โดยเฉพาะผู้สูงอายุและผู้ดื่มสุรา) และเตือนอาการตับอักเสบ\n", "pearls": ["ก่อนรักษา LTBI ต้องตัด active TB ออกให้ได้ด้วยอาการและภาพรังสี มิฉะนั้นจะสร้างเชื้อดื้อยา", "TST/IGRA แยก latent ออกจาก active ไม่ได้ และ IGRA ไม่ถูกรบกวนด้วย BCG", "สูตรสั้น 3HP หรือ 4R ให้ผลดีกว่าการกิน isoniazid ยาว ๆ เพราะผู้ป่วยกินครบมากกว่า"], "nl": ["B6.2.2(8)", "3.1.11"], "items": [{"id": "CH-MCQ-01", "kind": "mcq", "stem": "A 28-year-old healthy woman is the household contact of her father, who has just been diagnosed with smear-positive pulmonary tuberculosis. She is asymptomatic with a normal chest radiograph. An interferon-gamma release assay is positive. She is not pregnant, has normal liver function and takes no medication. Which of the following is the most appropriate management?", "choices": ["Start the standard four-drug regimen for active tuberculosis", "Treat for latent tuberculosis infection after active disease has been excluded", "Give BCG vaccination now", "Observe without treatment and repeat the chest radiograph in 1 year", "Start isoniazid only if she develops cough or fever"], "answer": 1, "explain": "**แยกแนวคิดให้ชัด: latent TB infection (LTBI) ไม่ใช่โรค แต่คือการมีเชื้อที่ร่างกายควบคุมไว้ได้**\n\n| | **LTBI** | **Active TB** |\n|---|---|---|\n| อาการ | **ไม่มี** | ไอเรื้อรัง ไข้ เหงื่อกลางคืน น้ำหนักลด |\n| CXR | **ปกติ** | ผิดปกติ (infiltrate, cavity) |\n| แพร่เชื้อ | **ไม่แพร่** | แพร่ได้ |\n| การรักษา | **ยาตัวเดียวหรือสองตัว ระยะสั้น** | **สูตร 4 ตัว 6 เดือน** |\n\n**ลำดับที่ถูกต้อง**: (1) **คัด active disease ให้แน่ใจก่อนเสมอ** ด้วยอาการ + CXR (± ส่งเสมหะถ้ามีเบาะแส) เพราะการให้ยาตัวเดียวในผู้ที่เป็น active TB จะ **สร้างเชื้อดื้อยา** (2) เมื่อแน่ใจว่าเป็น LTBI จึงรักษา\n\n**สูตร LTBI ที่ใช้ปัจจุบัน**: **3HP (isoniazid + rifapentine สัปดาห์ละครั้ง 12 ครั้ง)**, **4R (rifampicin 4 เดือน)**, **3HR (3 เดือน)** หรือ **6-9H (isoniazid 6-9 เดือน)** — สูตรที่มี rifamycin สั้นกว่าและผู้ป่วยกินครบมากกว่า\n\n**กลุ่มที่ควรคัดกรองและรักษา LTBI**: ผู้สัมผัสใกล้ชิดผู้ป่วย TB, **ผู้ติดเชื้อ HIV**, ผู้ที่จะได้รับ **anti-TNF หรือยากดภูมิ**, ผู้ป่วยฟอกไต, ผู้รับการปลูกถ่ายอวัยวะ, silicosis\n\nทำไมข้ออื่นผิด\n- **สูตร 4 ตัว**: เกินความจำเป็นและมีพิษมากกว่าใน LTBI\n- **สังเกตอาการเฉยๆ**: **ความเสี่ยงกลายเป็น active สูงสุดใน 2 ปีแรกหลังสัมผัส** การรักษา LTBI ลดความเสี่ยงได้ 60-90%\n- **BCG**: ป้องกัน **disseminated TB และ TB meningitis ในเด็กเล็ก** ไม่มีที่ใช้ในผู้ใหญ่ที่ติดเชื้อแล้ว\n- **รอจนมีอาการ**: คือปล่อยให้เป็นโรคและแพร่เชื้อ", "pearl": "**IGRA เหนือกว่า TST ในผู้ที่เคยฉีด BCG** เพราะไม่ข้ามปฏิกิริยากับ BCG และ NTM ส่วนใหญ่; ทั้งสองวิธี **แยก latent จาก active ไม่ได้** และ **ผลลบไม่ตัดโรค** โดยเฉพาะในผู้ที่ภูมิคุ้มกันต่ำ", "topic": "Latent tuberculosis infection in a household contact", "src": "", "ref": ["MED32 MCQ ข้อ 19 – คนไหนเสี่ยง MDR TB → close contact MDR TB", "MED32 MCQ ข้อ 32 – ให้อาการ extrapulmonary TB ทำยังไงดี (ไม่ต้อง admit, admit ห้องแยก, face mask)", "MED35 MEQ – ซักประวัติปฏิเสธประวัติครอบครัวเป็นวัณโรค และบอกวิธีแพร่กระจายของเชื้อวัณโรค"], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.11"]}]}, {"id": "chest-03-04", "title": "อาการและภาพรังสีทรวงอก", "minutes": 6, "summary": "อาการที่ต้องคัดกรอง และรูปแบบภาพรังสีที่ต้องแยกให้ออก", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### อาการที่ใช้คัดกรอง\n- **ทั่วกาย** — น้ำหนักลดโดยไม่ตั้งใจ เบื่ออาหาร **เหงื่อออกกลางคืน** ไข้ อ่อนเพลีย\n- **ทางปอด** — **ไอนานเกิน 2–3 สัปดาห์** ไอเป็นเลือด เจ็บหน้าอก\nผู้ป่วยที่มี **อาการอย่างใดอย่างหนึ่งร่วมกับปัจจัยเสี่ยง ต้องถ่ายภาพรังสีทรวงอกและส่งเสมหะเสมอ**\n\n### รูปแบบภาพรังสีที่ต้องแยก\n| รูปแบบ | ลักษณะ |\n|---|---|\n| **Latent TB** | ภาพรังสีปกติ หรือเห็นเพียง **หินปูนเล็ก ๆ (Ghon focus) และต่อมน้ำเหลืองที่มีหินปูน** |\n| **Primary TB** | ฝ้าที่ปอดกลีบกลาง–ล่าง + **ต่อมน้ำเหลืองขั้วปอดหรือ mediastinum โต** ± น้ำในเยื่อหุ้มปอด |\n| **Reactivation TB** | **ฝ้าและโพรงที่ apical/posterior segment ของกลีบบน หรือ superior segment ของกลีบล่าง** มักมี fibrosis และดึงรั้งโครงสร้าง |\n| **Miliary TB** | **ตุ่มเล็กกระจายทั่วปอดสองข้างขนาดราว 1 mm** (โตได้ถึง 2–3 mm ถ้าไม่รักษา) — **เมื่อรักษาแล้วจางหายเร็วและไม่ทิ้งหินปูน** |\n| **ผลตามหลัง** | bronchiectasis · **middle lobe syndrome** · พังผืดดึงรั้ง · aspergilloma ในโพรงเก่า |\n\n**Miliary TB** เกิดจากเชื้อกระจายทางกระแสเลือด — ผู้ป่วยมีไข้เรื้อรัง ผอมลง ตับม้ามโต อาจมี **choroidal tubercle ที่จอตา** (ตรวจตาช่วยวินิจฉัยได้เร็ว) และ **ต้องเจาะน้ำไขสันหลังเมื่อมีอาการทางระบบประสาท เพราะมักมีเยื่อหุ้มสมองอักเสบร่วม**\n\n> ภาพรังสีทรวงอก **ไวแต่ไม่จำเพาะ** — ผู้ป่วยเอชไอวีที่ CD4 ต่ำอาจมีภาพผิดปกติแบบไม่ตรงแบบ (ฝ้ากลีบล่าง ต่อมน้ำเหลืองโต ไม่มีโพรง) หรือ **ภาพปกติทั้งที่เสมหะพบเชื้อ** จึงต้องส่งเสมหะทุกรายที่สงสัย\n", "pearls": ["ไอเกิน 2 สัปดาห์ + น้ำหนักลด + เหงื่อออกกลางคืน = ส่ง CXR และเสมหะ", "Reactivation อยู่ยอดปอด · primary อยู่กลีบกลาง-ล่างพร้อมต่อมน้ำเหลืองโต", "Miliary TB: ตุ่ม 1 mm ทั่วปอดสองข้าง หายแล้วไม่ทิ้งหินปูน และต้องมองหาเยื่อหุ้มสมองอักเสบ", "ผู้ติดเชื้อเอชไอวีที่ CD4 ต่ำ ภาพรังสีอาจปกติทั้งที่เสมหะพบเชื้อ"], "nl": ["B6.2.2(8)", "2.1.32", "2.1.33"], "items": [{"id": "CH-OLD-11", "kind": "old", "stem": "A 34-year-old man with HIV infection who has never received antiretroviral therapy presents with 3 weeks of dry cough and progressive exertional dyspnoea. CD4 count is 125 cells/microlitre. Chest radiograph shows bilateral perihilar ground-glass opacities. Which organism is most likely responsible?", "choices": ["Cryptococcus neoformans", "Streptococcus pneumoniae", "Mycobacterium avium complex", "Pneumocystis jirovecii", "Mycobacterium tuberculosis"], "answer": 3, "explain": "**PCP (Pneumocystis jirovecii pneumonia)** เกิดเมื่อ **CD4 < 200** โดยลักษณะคลาสสิกคือ **ไอแห้ง เหนื่อยเพิ่มขึ้นช้าๆ เป็นสัปดาห์ ไข้ต่ำ** และ **ฟังปอดมักปกติ** ขณะที่ **hypoxaemia รุนแรงและแย่ลงเมื่อออกแรง (exercise desaturation)** ร่วมกับ **LDH สูง**\nCXR: **bilateral perihilar ground-glass/reticular opacity** (อาจปกติได้ในระยะแรก)\n\nรักษาด้วย **cotrimoxazole ขนาดสูง 21 วัน** และ **เพิ่ม corticosteroid เมื่อ PaO2 <70 mmHg หรือ A-a gradient >35 mmHg** เพราะการตายของเชื้อกระตุ้นการอักเสบจนออกซิเจนแย่ลง\n\nเทียบกับ **CD4 500 ที่ยังสูง → เชื้อที่พบบ่อยที่สุดยังเป็น Streptococcus pneumoniae** เหมือนคนทั่วไป", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 14 และ ลงกองครั้งที่ 2 ข้อ 81 – HIV CD4 125/low CD4, CXR ground-glass → PCP; MED32 MCQ ข้อ 4 – HIV CD4 200 เป็น pneumonia; MED34 FA MCQ ข้อ 7 / MED32 ข้อ 16 – HIV CD4 500 → Streptococcus pneumoniae", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "2.3.3-3(5)"]}]}, {"id": "chest-03-05", "title": "การวินิจฉัยทางห้องปฏิบัติการ", "minutes": 9, "summary": "เก็บเสมหะให้ถูก · AFB · molecular test · culture ซึ่งยังเป็น gold standard", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### การเก็บเสมหะ (ข้อสอบชอบถาม)\n- **ต้องเป็นเสมหะจากปอด ไม่ใช่น้ำลาย**\n- **เก็บ 3 ตัวอย่าง คนละวัน** และ **เสมหะตอนเช้าหลังตื่นนอนดีที่สุด** (ดีกว่าการกระตุ้นเสมหะ)\n- **เก็บก่อนเริ่มยาเสมอ**\n- ผู้ที่ไอไม่มีเสมหะ ใช้ **induced sputum, gastric washing (เด็ก) หรือส่องกล้องหลอดลมล้าง (BAL)**\n\n### ลำดับการตรวจ\n| การตรวจ | รายละเอียด | จุดเด่น / ข้อจำกัด |\n|---|---|---|\n| **AFB smear** — Ziehl–Neelsen หรือ Kinyoun | ย้อมสีทนกรด เห็นแท่งสีแดงบนพื้นน้ำเงิน | **เร็วและถูก ใช้ประเมินการแพร่เชื้อ** แต่ **ต้องมีเชื้อ ~5,000–10,000 ตัว/มล.** จึงบวก และ **แยก MTB จาก NTM ไม่ได้** |\n| **Fluorochrome (auramine O)** | เชื้อเรืองเป็นแท่งสีเหลือง อ่านที่กำลังขยายต่ำ (500x) | **อ่านเร็วกว่าและไวกว่า ZN** แต่ต้องยืนยันต่อ |\n| **Molecular / rapid DST** — **Xpert MTB/RIF**, line probe assay (HAIN), **TB-LAMP** | ตรวจ DNA ของเชื้อพร้อมบอกการดื้อ **rifampicin** ได้ในไม่กี่ชั่วโมง | **WHO แนะนำเป็นการตรวจเริ่มต้น** · ไวกว่า smear · ใช้ยืนยัน MTB และคัดกรอง MDR ได้เลย |\n| **Culture** — solid media **2–8 สัปดาห์** · liquid media **1–6 สัปดาห์** | อาหารเลี้ยงเชื้อไขมันสูง | **gold standard ของการวินิจฉัย** ไวที่สุด (พบได้ที่ ~10–100 ตัว/มล.) และ **จำเป็นสำหรับ phenotypic DST** |\n| **Urine LAM** | ตรวจแอนติเจน lipoarabinomannan ในปัสสาวะ | ใช้ในผู้ติดเชื้อ **เอชไอวีที่ CD4 < 100** และสงสัยวัณโรค |\n| **พยาธิวิทยาชิ้นเนื้อ** | granuloma + caseous necrosis | ใช้กับวัณโรคนอกปอด |\n\n> **ส่งเพาะเชื้อทุกตัวอย่างเสมอ แม้ smear เป็นลบ** และเชื้อที่แยกได้ครั้งแรกต้องส่งทดสอบความไวต่อยาแนวที่หนึ่ง (H, R, E, Z)\n\n### การจัดประเภทผู้ป่วยตามแนวทางประเทศไทย\n- **Bacteriologically confirmed TB (B+)** — ตรวจพบเชื้อจาก **smear, culture หรือการตรวจอณูชีววิทยาที่ WHO รับรอง** (Xpert MTB/RIF, LPA, TB-LAMP)\n- **Clinically diagnosed TB (B−)** — ตรวจไม่พบเชื้อหรือไม่ได้ส่งตรวจ แต่ **อาการ ภาพรังสี หรือพยาธิวิทยาเข้าได้ และแพทย์ตัดสินใจรักษา**\n\n### อัลกอริทึมการวินิจฉัยจากสไลด์\nคัดกรองอาการ → **ถ่ายภาพรังสีทรวงอก** → ถ้าผิดปกติเข้าได้กับวัณโรค → **ส่งเสมหะ AFB smear ร่วมกับ molecular test (Xpert MTB/RIF)** →\n- **MTB not detected** — แพทย์พิจารณาตามคลินิก (อาจเป็น clinically diagnosed TB)\n- **MTB detected ไม่ดื้อยา** → **DS-TB** รักษาสูตรมาตรฐาน\n- **RR/MDR** → ส่ง second-line molecular และ culture ต่อ → แยกเป็น **MDR/RR ที่ยังไวต่อ FQ** หรือ **ดื้อ FQ → phenotypic DST (Bdq, Lzd) → pre-XDR / XDR-TB**\n- **ดื้อ isoniazid (Hr)** → ส่ง second-line molecular + culture → **Hr-TB** หรือ Hr ที่ดื้อ FQ ร่วม\n", "pearls": ["เก็บเสมหะ 3 ตัวอย่าง คนละวัน ตอนเช้า ก่อนเริ่มยา", "Culture ยังเป็น gold standard และจำเป็นสำหรับ DST — solid 2–8 สัปดาห์ liquid 1–6 สัปดาห์", "AFB smear แยก MTB จาก NTM ไม่ได้ ต้องใช้ molecular หรือ culture", "Xpert MTB/RIF บอกทั้งเชื้อและการดื้อ rifampicin ได้ในไม่กี่ชั่วโมง"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-09", "kind": "old", "stem": "Which investigation is the gold standard for the diagnosis of pulmonary tuberculosis?", "choices": ["Sputum acid-fast bacilli smear", "Chest radiograph showing upper lobe cavitation", "Tuberculin skin test", "Mycobacterial culture of sputum", "Xpert MTB/RIF (molecular) assay"], "answer": 3, "explain": "**Culture เป็น gold standard** เพราะ (ก) ไวที่สุด ตรวจพบได้ที่ **10-100 เชื้อ/mL** เทียบกับ smear ที่ต้องการ **5,000-10,000 เชื้อ/mL** (ข) **ให้ผลความไวต่อยา (drug susceptibility)** (ค) ระบุสปีชีส์ได้ (แยก NTM)\nข้อเสียคือ **ช้า 2-6 สัปดาห์** (liquid media เร็วกว่า solid)\n\n**Xpert MTB/RIF** เป็นการตรวจเริ่มต้นที่แนะนำในปัจจุบันเพราะรู้ผลใน 2 ชั่วโมงและบอก rifampicin resistance ได้ แต่ **ไม่แทน culture** สำหรับการดูความไวต่อยาตัวอื่นและติดตามการรักษา\n\n**AFB smear** ราคาถูกและบอกความสามารถในการแพร่เชื้อ แต่ไวต่ำและ **แยกจาก NTM ไม่ได้**", "pearl": "", "topic": "", "src": "MED34 MCQ ครั้งที่ 4 ข้อ 73 – Gold standard TB (choice: gene expert, AFB, fluid culture)", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.9"]}]}, {"id": "chest-03-06", "title": "สูตรยาและระยะเวลาการรักษา", "minutes": 8, "summary": "2HRZE/4HR · อวัยวะไหนต้องนานกว่า · และกรณีที่ต้องให้ steroid", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### ยาแนวที่หนึ่ง\n**Isoniazid (H) · Rifampicin (R) · Pyrazinamide (Z) · Ethambutol (E)** (และ streptomycin (S) ซึ่งปัจจุบันใช้น้อยลง)\n\n**สูตรมาตรฐานของวัณโรครายใหม่ = 2HRZE / 4HR**\n- **ระยะเข้มข้น (intensive phase) 2 เดือน — HRZE** เพื่อฆ่าเชื้อที่แบ่งตัวเร็วและลดการแพร่เชื้อ\n- **ระยะต่อเนื่อง (continuation phase) 4 เดือน — HR** เพื่อกำจัดเชื้อที่แบ่งตัวช้าและกันการกลับเป็นซ้ำ\n- **ปรับสูตรเมื่อผล DST ออก** หรือเมื่อผู้ป่วยทนยาตัวใดไม่ได้\n\n### ระยะเวลาตามอวัยวะ และการให้ corticosteroid (ตารางจากสไลด์)\n\n| ตำแหน่ง | ระยะเวลา (เดือน) | Corticosteroid |\n|---|---|---|\n| ต่อมน้ำเหลือง | 6 | ไม่แนะนำ |\n| เยื่อหุ้มปอด | 6 | ไม่แนะนำ |\n| **เยื่อหุ้มหัวใจ** | 6 | **บางราย** |\n| **เยื่อหุ้มสมองและ tuberculoma** | **> 12** | **ให้ทุกราย** |\n| **กระดูกและข้อ** | **9–12** | ไม่แนะนำ |\n| ระบบทางเดินปัสสาวะ | 6 | ไม่แนะนำ |\n| Disseminated TB | แล้วแต่อวัยวะเด่น | แล้วแต่อวัยวะ |\n\n**ขนาด prednisolone ใน TB meningitis (เริ่มตั้งแต่สัปดาห์แรกของการรักษา)**\n**40–60 มก./วัน นาน 2–4 สัปดาห์ → 30 มก./วัน นาน 2 สัปดาห์ → 15 มก./วัน นาน 2 สัปดาห์ → 5 มก./วัน นาน 1–2 สัปดาห์**\n\n### TB meningitis — จุดที่ต้องจำเพิ่ม\n- น้ำไขสันหลัง: **เซลล์เด่น lymphocyte (ระยะแรกอาจเป็น neutrophil) · โปรตีนสูงมาก · น้ำตาลต่ำ** · ความดันเปิดสูง\n- **ส่ง Xpert MTB/RIF จากน้ำไขสันหลัง** ช่วยวินิจฉัยได้เร็วกว่าการเพาะเชื้อ แต่ผลลบไม่ตัดโรค\n- **ต้องเริ่มยาทันทีเมื่อสงสัย** และ **ให้ corticosteroid ทุกราย** เพราะลดอัตราตายชัดเจน\n\n### เรื่องการกินยา\n- กินยา **วันละครั้ง ตอนท้องว่างก่อนอาหาร 1 ชั่วโมง** จะดูดซึมดีที่สุด — ถ้าคลื่นไส้มากให้กินพร้อมอาหารมื้อเล็กหรือก่อนนอนแทน\n- **DOT (directly observed therapy)** — มีผู้สังเกตการกลืนยาทุกครั้ง เป็นวิธีที่ดีที่สุดในการทำให้กินยาครบ **ลดการกลับเป็นซ้ำและลดการเกิดเชื้อดื้อยา** ต้องใช้เสมอในสูตรที่ให้ยาแบบเป็นช่วง\n", "pearls": ["สูตรมาตรฐาน 2HRZE/4HR · เยื่อหุ้มสมองนานกว่า 12 เดือนและให้ steroid ทุกราย · กระดูกและข้อ 9–12 เดือน", "TB meningitis: CSF lymphocyte เด่น โปรตีนสูง น้ำตาลต่ำ — เริ่มยาทันทีเมื่อสงสัย", "DOT คือมาตรการที่ลดการกลับเป็นซ้ำและเชื้อดื้อยาได้จริง"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-MCQ-03", "kind": "mcq", "stem": "A 32-year-old man presents with 3 weeks of headache, low-grade fever and progressive drowsiness, followed by a left sixth cranial nerve palsy. Lumbar puncture shows opening pressure 28 cmH2O, clear but slightly xanthochromic fluid, WBC 220 cells/microlitre with 85 percent lymphocytes, protein 180 mg/dL and CSF glucose 28 mg/dL with simultaneous blood glucose 100 mg/dL. Which diagnosis is most likely, and which adjunctive treatment improves survival?", "choices": ["Carcinomatous meningitis; adjunctive intrathecal chemotherapy", "Cryptococcal meningitis; adjunctive serial lumbar punctures only", "Bacterial meningitis; adjunctive corticosteroid", "Tuberculous meningitis; adjunctive corticosteroid", "Viral meningoencephalitis; adjunctive acyclovir"], "answer": 3, "explain": "**อ่าน CSF profile ให้เป็นคือหัวใจ**\n\n| | **Bacterial** | **TB** | **Viral** | **Cryptococcal** |\n|---|---|---|---|---|\n| เซลล์ | **PMN เด่น พันๆ** | **lymphocyte เด่น 100-500** | lymphocyte, <500 | lymphocyte น้อย-ปานกลาง |\n| Protein | สูงมาก | **สูงมาก (>100)** | ปกติ-สูงเล็กน้อย | สูง |\n| Glucose | **ต่ำมาก** | **ต่ำ (<50% ของเลือด)** | **ปกติ** | ต่ำ |\n| Opening pressure | สูง | สูง | ปกติ-สูงเล็กน้อย | **สูงมาก** |\n\nเคสนี้: **lymphocyte เด่น + protein สูงมาก + glucose ต่ำ (28/100 = 28%) + ดำเนินโรคเป็นสัปดาห์ + cranial nerve palsy** = **TB meningitis**\n\n**กลไกที่อธิบายอาการ**: การอักเสบเกิดที่ **basal meninges** → (1) **หุ้ม cranial nerve** โดยเฉพาะ **CN VI (พบบ่อยที่สุด), III, VII** (2) **อุดทางเดินน้ำไขสันหลัง → hydrocephalus และความดันในกะโหลกสูง** (3) **vasculitis ของหลอดเลือดที่ฐานสมอง → infarction**\n\n**Corticosteroid (dexamethasone) ลด mortality อย่างมีนัยสำคัญ** ในผู้ป่วย TB meningitis ทุกระดับความรุนแรง โดยลดการอักเสบและภาวะแทรกซ้อนจาก vasculitis/hydrocephalus — เป็นหนึ่งในไม่กี่โรคที่ **steroid ช่วยชีวิต**\n\nการรักษาอื่น: ยาต้านวัณโรคสูตรมาตรฐานแต่ **ระยะเวลานาน 9-12 เดือน**; **ส่ง CSF AFB, culture, molecular test (Xpert MTB/RIF Ultra) และเจาะน้ำปริมาณมากจะเพิ่มความไว**; อย่าลืม **ตรวจ HIV**\n\nทำไมข้ออื่นผิด\n- **Cryptococcal**: opening pressure มักสูงกว่านี้มากและตรวจพบ **India ink / cryptococcal antigen บวก**; รักษาด้วย amphotericin B + flucytosine และ **ต้องเจาะระบายน้ำซ้ำ**\n- **Bacterial**: ดำเนินโรคเป็นชั่วโมง-วัน, **PMN เด่น**\n- **Viral**: **glucose ปกติ** และ protein ไม่สูงขนาดนี้\n- **Carcinomatous**: ต้องมีมะเร็งเดิมและ cytology บวก", "pearl": "**การเริ่ม ART ในผู้ป่วย HIV ที่มี TB meningitis ควรเลื่อนไปประมาณ 4-8 สัปดาห์** (ต่างจาก TB ที่อื่นซึ่งเริ่มใน 2 สัปดาห์เมื่อ CD4 ต่ำ) เพราะ **paradoxical IRIS ในสมองอันตรายถึงชีวิต**", "topic": "Tuberculous meningitis – CSF profile and adjunctive therapy", "src": "", "ref": ["MED33 OSCE ข้อ 3 – Meningitis (TB/Crypto จาก unsafe sex): high opening pressure, increase WBC with lymphocyte predominance, high protein, low sugar → Tuberculous meningitis", "MED31 past paper – ผู้ป่วยชายไทย 30 ปี ปวดศีรษะ 2 สัปดาห์ oral candidiasis, LP 12 cmH2O wbc 5 lymphocyte, encapsulated budding yeast → Cryptococcal meningitis", "MED32 OSCE – TB meningitis, CSF PCR for TB", "MED31 MCQ – ตอบ TB meningitis"], "nl": ["B6.2.2(8)", "2.3.4(20)", "3.1.7"]}]}, {"id": "chest-03-07", "title": "ผลข้างเคียงของยาวัณโรคและการติดตามการรักษา", "minutes": 10, "summary": "อะไรต้องหยุดยาทันที อะไรให้ยาต่อได้ และตารางติดตาม 6 เดือน", "source": "สไลด์ อ.ศิวพร เลิศพงศ์พิรุฬห์ — Pulmonary Tuberculosis 2025", "md": "### สิ่งที่ต้องบอกผู้ป่วยให้กลับมาพบแพทย์ทันที\n**ผื่น · คลื่นไส้อาเจียน เบื่ออาหาร ปวดท้อง · ปัสสาวะสีเข้มตลอด · อ่อนเพลียมาก · ชาปลายมือปลายเท้าที่ไม่หาย**\n\n### ผลข้างเคียงรุนแรง — ต้องหยุดยาที่เป็นสาเหตุและปรึกษาผู้เชี่ยวชาญ\n| อาการ | ยาที่เป็นสาเหตุ | การจัดการ |\n|---|---|---|\n| **ผื่นทั้งแบบคันและไม่คัน** | **H, R, Z (ได้ทุกตัว)** | **หยุดยาวัณโรค** |\n| **ดีซ่าน / ตับอักเสบ** (ไม่พบสาเหตุอื่น) | **H, R, Z** | **หยุดยาวัณโรค** |\n| **สับสน** (โดยเฉพาะเมื่อมีตับอักเสบร่วม) | ยาวัณโรคเกือบทุกตัว | หยุดยาวัณโรค |\n| **การมองเห็นบกพร่อง / ตาบอดสี** | **Ethambutol** | **หยุด ethambutol** |\n| **ช็อก ผื่น purpura เกล็ดเลือดต่ำ ไตวายเฉียบพลัน** | **Rifampicin** | **หยุด rifampicin ถาวร** |\n| หูหนวก · เวียนศีรษะ (vertigo, nystagmus) · ปัสสาวะออกน้อย ไตวาย | **Streptomycin** | หยุด streptomycin |\n\n### ผลข้างเคียงไม่รุนแรง — ให้ยาต่อได้ เพียงตรวจสอบขนาดยา\n| อาการ | ยา | การจัดการ |\n|---|---|---|\n| เบื่ออาหาร คลื่นไส้ ปวดท้อง | **Z, R, H** | กินยาพร้อมอาหารปริมาณน้อยหรือก่อนนอน กลืนช้า ๆ จิบน้ำตาม |\n| **ปวดข้อ (ไม่มีข้ออักเสบรุนแรง)** | **Z > E** | **NSAIDs หรือ paracetamol** — เกิดจาก **pyrazinamide ทำให้กรดยูริกสูง** |\n| **ชา แสบ เจ็บปลายมือปลายเท้า** | **H** | **pyridoxine (B6) 50–75 มก./วัน** (ป้องกันด้วย 10–25 มก./วัน ในผู้เสี่ยง) |\n| ง่วงนอน | H | ให้ยาก่อนนอน |\n| **ปัสสาวะ น้ำตา เหงื่อ สีส้มแดง** | **R** | **ไม่ต้องทำอะไร — บอกผู้ป่วยล่วงหน้าและเตือนเรื่องคอนแทกต์เลนส์** |\n| อาการคล้ายไข้หวัดใหญ่ | R | พิจารณาหยุดยาถ้าอาการรุนแรง |\n\n### ตับอักเสบจากยาวัณโรค — แนวทางที่ใช้จริง\n- หยุดยาที่มีพิษต่อตับเมื่อ **ALT > 3 เท่าของค่าปกติร่วมกับอาการ** หรือ **ALT > 5 เท่าแม้ไม่มีอาการ** หรือ **bilirubin สูงขึ้น**\n- ระหว่างรอ ถ้าผู้ป่วยยังต้องรักษา ให้ใช้สูตรที่ไม่มีพิษต่อตับชั่วคราว (เช่น E + FQ ± aminoglycoside)\n- เมื่อเอนไซม์กลับสู่ปกติ **ค่อย ๆ เติมยาทีละตัว (rechallenge)** โดยทั่วไปเริ่ม R ก่อน ตามด้วย H และมักไม่กลับไปใช้ Z ถ้าตับอักเสบรุนแรง\n- **Rifampicin ทำให้ bilirubin สูงแบบไม่ใช่ตับอักเสบได้** (แย่งการจับกับตัวขนส่งที่ตับ) — แยกจากตับอักเสบจริงด้วย ALT ที่ยังปกติ\n\n### การติดตามระหว่างรักษา (ตารางจากสไลด์)\n| การตรวจ | ก่อนเริ่ม | ตามระยะ |\n|---|---|---|\n| อาการทางคลินิกและ **ชั่งน้ำหนัก** | ✓ | **ทุกเดือนจนครบ 6 เดือน** (ใช้ปรับขนาดยาด้วย) |\n| **AFB smear** | ✓ | **สิ้นเดือนที่ 2 · เดือนที่ 5 · เดือนที่ 6** (และเดือนที่ 3 ถ้าเดือนที่ 2 ยังบวก) |\n| การตรวจอณูชีววิทยา / เพาะเชื้อ + DST | ✓ | **เมื่อ AFB ยังบวกที่สิ้นเดือนที่ 2 หรือเดือนที่ 5** |\n| **ภาพรังสีทรวงอก** | ✓ | เดือนที่ 2 และเดือนที่ 6 |\n| **HIV test** | ✓ | — |\n| **LFT** | ✓ | เมื่อมีอาการ · เฝ้าระวังถี่ในผู้เสี่ยง (อายุ > 60 ปี ดื่มสุรา โรคตับ ไวรัสตับอักเสบเรื้อรัง เอชไอวี ทุพโภชนาการ ตั้งครรภ์) |\n| **BUN/Cr** | ✓ | ผู้ป่วยโรคไตหรือเสี่ยงไตวาย |\n| **ตรวจการมองเห็น** | ✓ | ผู้สูงอายุหรือมีความผิดปกติของสายตาเดิม |\n\n**ความหมายของผลเสมหะที่สิ้นเดือนที่ 2**\n- **ลบ** → เข้าสู่ระยะต่อเนื่อง 4HR ตามปกติ\n- **ยังบวก** → **ไม่ใช่การยืดระยะเข้มข้นโดยอัตโนมัติ** แต่ต้อง **ทบทวนการกินยา (adherence) ส่งเพาะเชื้อและตรวจความไวต่อยาซ้ำ** แล้วตรวจ AFB ซ้ำที่เดือนที่ 3\n\n### ขาดยาระหว่างการรักษา (loss to follow-up)\n- **ขาดยาในระยะเข้มข้น < 14 วัน** → ให้ยาต่อจนครบ **แต่ถ้าทำให้ระยะเข้มข้นยาวเกิน 3 เดือนนับจากเริ่มรักษา ให้เริ่มนับการรักษาใหม่**\n- **ขาดยาในระยะเข้มข้น ≥ 14 วัน** → **เริ่มการรักษาใหม่**\n- **ขาดยาในระยะต่อเนื่อง โดยได้ยาไปแล้ว ≥ 80%** → ให้ยาต่อจนครบตามความเหมาะสม\n- **ได้ยาไป < 80% และขาดยา < 3 เดือน** → ให้ยาต่อจนครบ แต่ถ้ารวมแล้วนานเกิน 9 เดือนให้เริ่มใหม่ตั้งแต่ระยะเข้มข้น\n- **ได้ยาไป < 80% และขาดยา ≥ 3 เดือน** → **เริ่มการรักษาใหม่ พร้อมส่ง AFB smear เพาะเชื้อ และตรวจอณูชีววิทยาเพื่อยืนยันว่าไม่ดื้อยา**\n", "pearls": ["ผื่น ดีซ่าน/ตับอักเสบ สับสน ตามัว ช็อก = หยุดยาทันที · คลื่นไส้ ปวดข้อ ชา ปัสสาวะสีส้ม = ให้ยาต่อได้", "Ethambutol → optic neuritis · Isoniazid → ปลายประสาทอักเสบ ป้องกันด้วย pyridoxine · Pyrazinamide → กรดยูริกสูงและปวดข้อ · Rifampicin → สารคัดหลั่งสีส้มแดง", "AFB ยังบวกสิ้นเดือนที่ 2 = ทบทวนการกินยาและส่งเพาะเชื้อ/DST ไม่ใช่ยืดระยะเข้มข้นเฉย ๆ", "ขาดยาระยะเข้มข้นตั้งแต่ 14 วันขึ้นไป = เริ่มการรักษาใหม่"], "nl": ["B6.2.2(8)", "2.3.4(20)"], "items": [{"id": "CH-OLD-02", "kind": "old", "stem": "A patient receiving the 2HRZE/4HR anti-tuberculous regimen develops painless blurring of vision in both eyes with impaired colour discrimination after several weeks of treatment. There is no eye redness or pain. Which of the following is the most appropriate action?", "choices": ["Stop isoniazid and refer to an ophthalmologist", "Stop rifampicin and refer to an ophthalmologist", "Continue the same regimen and refer to an ophthalmologist", "Stop ethambutol and refer to an ophthalmologist", "Stop pyrazinamide and refer to an ophthalmologist"], "answer": 3, "explain": "**Ethambutol → retrobulbar (optic) neuritis** ซึ่งเป็น dose- และ duration-dependent: ตามัวสองข้าง, **เสียการมองเห็นสีแดง-เขียวก่อน**, central scotoma, ตาไม่แดงไม่เจ็บ\n\nต้อง **หยุดทันที** เพราะถ้าหยุดเร็วมักกลับเป็นปกติ แต่ถ้าปล่อยไว้อาจเสียถาวร; ควรตรวจ **visual acuity และ colour vision เป็น baseline** ก่อนเริ่มยา และปรับขนาดตามการทำงานของไต", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D – ผู้ป่วยวัณโรครับสูตร 2HRZE/4HR แล้วตามัวสองข้าง ไม่เจ็บตา ไม่ตาแดง", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-05", "kind": "old", "stem": "Which anti-tuberculous drug causes peripheral neuropathy, and what is given to prevent it?", "choices": ["Streptomycin; prevented by magnesium", "Ethambutol; prevented by thiamine (vitamin B1)", "Isoniazid; prevented by pyridoxine (vitamin B6)", "Pyrazinamide; prevented by allopurinol", "Rifampicin; prevented by folic acid"], "answer": 2, "explain": "**Isoniazid** จับกับ **pyridoxal phosphate** และเร่งการขับ pyridoxine ทางปัสสาวะ → **pyridoxine deficiency → peripheral neuropathy** (ชาปลายมือปลายเท้าแบบ stocking-glove)\n\nกลุ่มเสี่ยงที่ต้องให้ **pyridoxine 10-25 mg/day ป้องกัน**: เบาหวาน, ไตวาย, ติดสุรา, ทุพโภชนาการ, ตั้งครรภ์และให้นมบุตร, HIV, ผู้สูงอายุ\n\nINH ยังทำให้เกิด **hepatitis** (อายุมากเสี่ยงขึ้น), drug-induced lupus และ **INH overdose → ชักที่ดื้อต่อยากันชัก ต้องแก้ด้วย pyridoxine ขนาดสูง**", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 5 และ 41 – ยา TB ที่ทำให้ peripheral neuropathy → Isoniazid", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-03", "kind": "old", "stem": "Which anti-tuberculous drug most characteristically causes hyperuricaemia and may precipitate an acute gouty attack?", "choices": ["Pyrazinamide", "Streptomycin", "Isoniazid", "Levofloxacin", "Rifampicin"], "answer": 0, "explain": "**Pyrazinamide** และ metabolite (pyrazinoic acid) **ยับยั้งการขับกรดยูริกที่ proximal tubule (URAT1)** → hyperuricaemia และ arthralgia; **ethambutol ก็ทำให้กรดยูริกสูงได้แต่น้อยกว่า** (โพยเก่าตอบเป็นคู่ pyrazinamide + ethambutol)\n\nอาการปวดข้อจาก PZA มักเป็น **arthralgia ที่ไม่ใช่ gout จริง** และ **ไม่ต้องหยุดยา** — ให้ยาแก้ปวดและติดตาม; ถ้าเป็น gout แท้จึงรักษาตามปกติ", "pearl": "", "topic": "", "src": "MED33 MCQ – ยา TB ปวดข้อเป็น gout เกิดจาก pyrazinamide (ตอบชอย pyrazinamide + ethambutol); MED33 MCQ ข้อ 72", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)", "B5.2.5(1)"]}, {"id": "CH-OLD-04", "kind": "old", "stem": "A patient completing anti-tuberculous therapy notices that his urine, tears and sweat have turned orange-red. He feels well and liver function tests are normal. Which drug is responsible?", "choices": ["Ethambutol", "Rifampicin", "Streptomycin", "Pyrazinamide", "Isoniazid"], "answer": 1, "explain": "**Rifampicin** ทำให้สารคัดหลั่งทุกชนิดเป็นสีส้มแดง — **ไม่เป็นอันตราย** แต่ต้องบอกผู้ป่วยล่วงหน้าเพื่อไม่ให้ตกใจและหยุดยาเอง (และเตือนผู้ใส่คอนแทคเลนส์ชนิดนิ่มว่าจะติดสี)\n\nผลข้างเคียงอื่นของ rifampicin ที่ออกสอบ: **flu-like syndrome**, cholestatic hepatitis, thrombocytopenia และที่สำคัญคือเป็น **CYP450 inducer แรง** → ลดระดับ warfarin, ยาคุมกำเนิด, ARV, azole, corticosteroid", "pearl": "", "topic": "", "src": "MED28 MED421 ข้อ 23 – urine turns orange after TB regimen → Rifampicin; MED28 ข้อ 88 – side effects of rifampicin include flu-like symptoms; MED31 MCQ ข้อ 5", "ref": [], "nl": ["B6.2.2(8)", "2.3.4(20)"]}, {"id": "CH-OLD-01", "kind": "old", "stem": "A 30-year-old previously healthy woman with smear-positive pulmonary tuberculosis was started on isoniazid, rifampicin, pyrazinamide and ethambuto
