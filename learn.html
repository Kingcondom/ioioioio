: "Which drug used in systemic lupus erythematosus requires periodic ophthalmologic screening because of the risk of irreversible maculopathy?", "choices": ["Azathioprine", "Prednisolone", "Hydroxyurea", "Hydroxychloroquine", "Mycophenolate mofetil"], "answer": 3, "explain": "โพยเก่าเขียนชื่อยาเป็น 'hydroxyurea' ซึ่ง **ผิด** — ยาที่ทำให้เกิด **bull's-eye maculopathy คือ hydroxychloroquine** ต้องตรวจตาพื้นฐานในปีแรกและตรวจทุกปีหลังใช้ครบ 5 ปี (เร็วกว่านั้นถ้าขนาด > 5 mg/kg/วัน หรือมีโรคไต) ด้วย visual field และ OCT; ส่วนสเตียรอยด์ทำให้เกิดต้อกระจกและต้อหิน ซึ่งเป็นคนละภาวะ", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 2 'Maculopathy ห้ามให้ยา — a. Hydroxyurea'", "ref": [], "nl": ["2.3.13-3(15)", "B5.4(3)"]}, {"id": "AIR-MCQ-48", "kind": "mcq", "stem": "A 34-year-old woman with SLE who has received prednisolone 30–60 mg daily for 2 years develops progressive right groin pain, worse on weight bearing, for 6 weeks. Range of motion of the hip is painful at the extremes but the joint is not hot or swollen. ESR 20 mm/hr. Plain radiograph of the hip is normal. Which of the following is the most appropriate next investigation?", "choices": ["Magnetic resonance imaging of both hips", "Hip joint aspiration for culture", "Dual-energy X-ray absorptiometry", "Bone scan of the whole skeleton as the definitive test", "Repeat plain radiograph in 3 months"], "answer": 0, "explain": "**ปวดขาหนีบเมื่อลงน้ำหนัก ในผู้ที่ได้สเตียรอยด์ขนาดสูงนาน = osteonecrosis (avascular necrosis) ของหัวกระดูกต้นขา จนกว่าจะพิสูจน์เป็นอื่น** — สเตียรอยด์และแอลกอฮอล์เป็นสาเหตุที่พบบ่อยที่สุดในผู้ใหญ่ (กลไก: ไขมันในไขกระดูกโตขึ้นและ microthrombosis ทำให้ความดันในกระดูกสูงและเลือดไปเลี้ยงลดลง) และ SLE เองก็เพิ่มความเสี่ยง โดยเฉพาะเมื่อมี antiphospholipid antibody\n\n**ฟิล์มธรรมดาปกติในระยะแรกเสมอ** (กว่าจะเห็น crescent sign หรือหัวกระดูกยุบคือสายแล้ว) — **MRI คือการตรวจที่ไวและจำเพาะที่สุด** และต้องถ่าย **ทั้งสองข้าง** เพราะเป็นสองข้างได้ถึง 50–80% แม้อีกข้างยังไม่ปวด\n\n**เหตุผลที่ต้องรีบ** — ถ้าจับได้ก่อนหัวกระดูกยุบ (pre-collapse) ยังมีทางเลือกรักษาข้อไว้ได้ เช่น ลดการลงน้ำหนัก ลดสเตียรอยด์ให้ต่ำที่สุด core decompression; เมื่อยุบแล้วมักจบที่การเปลี่ยนข้อสะโพก\n\n**ทำไมข้ออื่นผิด** — การรอถ่ายฟิล์มซ้ำอีก 3 เดือนปล่อยให้โรคเข้าสู่ระยะยุบ; bone scan ไวน้อยกว่า MRI ในระยะแรก; การเจาะข้อเหมาะกับข้อติดเชื้อซึ่งจะมีไข้ ข้อบวมร้อน; DXA ประเมินกระดูกพรุนซึ่งเป็นคนละภาวะ (แม้ผู้ป่วยรายนี้ควรได้รับการประเมินด้วยก็ตาม)", "pearl": "ปวดสะโพกในคนกินสเตียรอยด์นาน + ฟิล์มปกติ = **ส่ง MRI สองข้างหา osteonecrosis** อย่ารอฟิล์มซ้ำ", "topic": "Glucocorticoid complications — osteonecrosis", "src": "", "ref": ["MED32 โพย MCQ ภาวะแทรกซ้อนของสเตียรอยด์", "Harrison 21st ed., Osteonecrosis"], "nl": ["2.3.13-3(8)", "2.3.13-3(15)", "B5.2.5(2)"]}, {"id": "AIR-OLD-44", "kind": "old", "stem": "A 34-year-old woman with SLE on long-term high-dose prednisolone develops progressive right groin pain on weight bearing. Hip radiograph is normal. What is the most appropriate next investigation?", "choices": ["Hip joint aspiration", "Serum uric acid", "Repeat plain radiograph in 3 months", "MRI of both hips", "Bone mineral density"], "answer": 3, "explain": "**Osteonecrosis ของหัวกระดูกต้นขาจากสเตียรอยด์** — ฟิล์มธรรมดาปกติในระยะแรกเสมอ **MRI ไวที่สุดและต้องถ่ายทั้งสองข้าง** เพราะเป็นสองข้างได้ 50-80%; ถ้าจับได้ก่อนหัวกระดูกยุบยังมีทางรักษาข้อไว้ได้", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย ภาวะแทรกซ้อนของสเตียรอยด์ (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(8)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-12", "kind": "old", "stem": "A woman with SLE has been on prednisolone for 3 years and now presents in pregnancy with fasting plasma glucose 138 mg/dL and HbA1c 7.2% at 8 weeks of gestation. How should her hyperglycemia be classified?", "choices": ["Gestational diabetes mellitus", "Pre-existing (overt) diabetes mellitus detected in pregnancy, likely glucocorticoid-induced", "Stress hyperglycemia from pregnancy", "Impaired fasting glucose", "Type 1 diabetes mellitus"], "answer": 1, "explain": "โพยเก่าตอบว่า **ไม่ใช่ gestational DM แต่เป็นเบาหวานที่มีอยู่ก่อน** — เพราะตรวจพบ **ตั้งแต่ไตรมาสแรกและค่าถึงเกณฑ์เบาหวานทั่วไป (FPG ≥ 126 หรือ HbA1c ≥ 6.5%)** GDM ตามนิยามคือความผิดปกติที่ตรวจพบครั้งแรกในไตรมาสที่ 2-3 และค่าต่ำกว่าเกณฑ์เบาหวานชัดเจน; สเตียรอยด์ระยะยาวทำให้ดื้ออินซูลินและเป็นสาเหตุที่พบบ่อยในผู้ป่วยโรคภูมิต้านตนเอง", "pearl": "", "topic": "", "src": "MED34 โพย MCQ 'ข้อคนท้อง gestational diabetes เป็น SLE ใช้ Prednisolone 3 ปี ตอบ DM type 2'", "ref": [], "nl": ["2.3.13-3(15)"]}]}, {"id": "air-33-06", "title": "Systemic sclerosis และ Raynaud phenomenon", "minutes": 8, "summary": "แยก limited กับ diffuse · แอนติบอดีทำนายภาวะแทรกซ้อน · renal crisis คือภาวะฉุกเฉิน", "nl": ["B4.2.2-3(9)", "2.3.13"], "md": "### สองรูปแบบใหญ่\n| | **Limited cutaneous (CREST)** | **Diffuse cutaneous** |\n|---|---|---|\n| ผิวแข็ง | ปลายมือถึงข้อศอก/เข่า และใบหน้า | **ลามเหนือข้อศอก เข่า และลำตัว** |\n| ดำเนินโรค | ช้า Raynaud มานานหลายปีก่อน | เร็ว ผิวแข็งภายในเดือน–ปี |\n| แอนติบอดี | **anti-centromere** | **anti-Scl-70** หรือ **anti-RNA polymerase III** |\n| ภาวะแทรกซ้อนเด่น | **pulmonary arterial hypertension** | **ILD และ scleroderma renal crisis** |\n\nCREST = Calcinosis · Raynaud · Esophageal dysmotility · Sclerodactyly · Telangiectasia\n\n### Raynaud — แยกปฐมภูมิจากทุติยภูมิ\n| | ปฐมภูมิ | ทุติยภูมิ |\n|---|---|---|\n| อายุเริ่ม | วัยรุ่น–20 ต้น ๆ | **> 30–40 ปี** |\n| ความรุนแรง | สมมาตร ไม่มีแผล | **ไม่สมมาตร มีแผลหรือเนื้อตายที่ปลายนิ้ว** |\n| ANA | ลบ | **บวก** |\n| **Nailfold capillaroscopy** | ปกติ | **capillary ขยายผิดรูปและหายไปเป็นหย่อม** |\n\n**เครื่องมือที่แยกได้ดีที่สุดคือ nailfold capillaroscopy ร่วมกับ ANA** — ผู้ที่มี Raynaud เริ่มตอนอายุมาก มีแผลที่ปลายนิ้ว หรือ capillary ผิดปกติ ต้องตามหาโรคเนื้อเยื่อเกี่ยวพันเสมอ\n\nการดูแล Raynaud: ให้ความอบอุ่น เลิกบุหรี่ หลีกเลี่ยงยาหดหลอดเลือด (**β-blocker ที่ไม่เลือก, ergot, sympathomimetic**) · ยาอันดับแรกคือ **dihydropyridine calcium channel blocker (nifedipine, amlodipine)** · แผลที่ปลายนิ้วอาจต้องใช้ PDE-5 inhibitor, iloprost หรือ bosentan เพื่อป้องกันแผลใหม่\n\n### Scleroderma renal crisis — ภาวะฉุกเฉิน\n- **ความดันโลหิตสูงขึ้นอย่างรวดเร็ว + ไตวายเฉียบพลัน + microangiopathic hemolytic anemia (schistocyte) และเกล็ดเลือดต่ำ** อาจมี papilledema, ชัก หรือปอดบวมน้ำ\n- ปัจจัยเสี่ยง: **diffuse SSc ระยะแรก · anti-RNA polymerase III · และการได้ corticosteroid ขนาด ≥ 15 mg/วัน** — นี่คือเหตุผลที่ **หลีกเลี่ยง steroid ขนาดสูงในผู้ป่วย systemic sclerosis**\n- **การรักษาคือ ACE inhibitor ขนาดสูง (captopril ปรับขึ้นเร็ว) ทันที** และให้ต่อแม้ครีแอตินินจะสูงขึ้นในช่วงแรกหรือแม้ต้องฟอกไตชั่วคราว — **ห้ามใช้ยาลดความดันกลุ่มอื่นแทน ARB ก็ไม่ใช่ยาที่พิสูจน์แล้ว**\n- อวัยวะอื่นที่ต้องเฝ้าระวังทุกปี: **ILD (PFT + HRCT)** และ **PAH (echocardiogram)** · GERD รุนแรงให้ PPI ขนาดสูง · dysphagia จาก esophageal dysmotility\n\n### ที่อาจารย์เน้นในสไลด์ (SLE and systemic autoimmune diseases)\n\n**เห็นผิวแข็งอย่าเพิ่งเรียกสเกลอโรเดอร์มา** — ต้องแยก **scleroderma-like disorders** ออกก่อน: **nephrogenic systemic fibrosis (NSF) · eosinophilic fasciitis · scleredema diabeticorum · scleromyxedema · porphyria · lichen sclerosus · GVHD · diabetic cheiroarthropathy**\n\n**การแบ่งกลุ่มของ scleroderma**\n- **Localized** — **morphea** และ **linear scleroderma** (ผิวเฉพาะที่ ไม่มีอวัยวะภายใน)\n- **Systemic sclerosis** — **limited (lcSSc) · diffuse (dcSSc) · sine scleroderma (มีอวัยวะภายในโดยผิวไม่แข็ง) · overlap** (สไลด์ระบุสัดส่วน dcSSc 78% · lcSSc 12% · sine 1% · overlap 43% — รวมเกิน 100% เพราะกลุ่ม overlap ถูกนับซ้ำกับกลุ่มอื่น)\n- **CREST = Calcinosis · Raynaud's · Esophageal dysmotility · Sclerodactyly · Telangiectasia**\n- เกณฑ์จำแนกโรคใช้ **2013 ACR/EULAR ซึ่งวินิจฉัยเมื่อได้ ≥ 9 คะแนน**\n\n**แอนติบอดีพร้อมความชุก (ตัวเลขจากสไลด์)**\n| แอนติบอดี | ANA pattern | ความชุก | กลุ่มผิวหนัง | อาการที่ต้องเฝ้าระวัง |\n|---|---|---|---|---|\n| **Anti-topoisomerase I (Scl-70)** | speckled, homogeneous, nucleolar | **9.4–42%** | **diffuse** | **interstitial lung disease** |\n| **Anti-centromere (ACA)** | discrete speckled | **20–40%** | **limited** | **pulmonary arterial hypertension** |\n| **Anti-RNA polymerase III** | speckled ± nucleolar | **11%** | **diffuse** | **scleroderma renal crisis** |\n\nทุกกลุ่มพบ **myositis/arthritis** และ **esophageal dysmotility (GERD)** ร่วมได้\n\n**Raynaud's phenomenon — สามสีตามลำดับ: ขาว (หลอดเลือดหดเกร็ง) → เขียวคล้ำ (cyanosis) → แดง (reactive hyperaemia)**\n\n| | **Primary RP** | **Secondary RP** |\n|---|---|---|\n| หลอดเลือด | **ปกติ** | **vasculopathy** |\n| ผู้ป่วย | **วัยรุ่นหญิง มีประวัติครอบครัว** | **มักอายุมากกว่า 40 ปี** |\n| ลักษณะการกำเริบ | **สมมาตรสองข้าง** | **ไม่สมมาตร** |\n| ตัวกระตุ้น | ความเย็นและความเครียดทางอารมณ์ | ความเย็น |\n| ภาวะแทรกซ้อน | ไม่มี · **ครบสามสีและกลับเป็นปกติทุกครั้ง** | **แผลและเนื้อตายที่ปลายนิ้ว** |\n| ลักษณะภูมิคุ้มกัน | **ไม่มี** | **มี autoimmune feature และแล็บผิดปกติ** |\n\n**ผิวหนังที่ต้องรู้จัก** — **edematous phase (มือบวมตึงระยะแรก) · skin thickening · digital pitting scar · calcinosis cutis · telangiectasia · poikiloderma**\n**Nailfold capillary ที่ผิดปกติ** — **giant loop · เลือดออก (hemorrhage) · และ capillary หายเป็นหย่อม (drop out)**\n\n**การรักษาแยกตามปัญหา**\n| ปัญหา | ยา |\n|---|---|\n| **Raynaud** | เลี่ยงความเย็น · **ยาขยายหลอดเลือดกลุ่ม CCB (amlodipine, nifedipine)** · **PDE-5 inhibitor** · **IV iloprost เมื่อรุนแรง** · fluoxetine |\n| **ผิวแข็ง** | **methotrexate, mycophenolate mofetil** |\n| **GERD** | **PPI ขนาดสูง + ยาเพิ่มการเคลื่อนไหวของทางเดินอาหาร** |\n| **Scleroderma renal crisis** | **ACE inhibitor** |\n| **PAH** | endothelin receptor antagonist · PDE-5 inhibitor · riociguat · prostanoid (epoprostenol, iloprost, treprostinil) |\n| **ILD** | **steroid ขนาดต่ำ + cyclophosphamide หรือ mycophenolate mofetil** |\n", "pearls": ["Anti-centromere → PAH (limited) · anti-Scl-70 → ILD · anti-RNA pol III → renal crisis (diffuse)", "Raynaud + ANA บวก + capillaroscopy ผิดปกติ = ทุติยภูมิ ต้องตามหา CTD", "Scleroderma renal crisis รักษาด้วย ACE inhibitor ทันที และเลี่ยง steroid ขนาดสูงในผู้ป่วย SSc"], "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "items": [{"id": "AIR-MCQ-38", "kind": "mcq", "stem": "A 45-year-old woman has 1 year of Raynaud phenomenon, thickening of the skin of the fingers extending to the forearms, and fine inspiratory crackles at both lung bases. ANA by immunofluorescence is reported negative at the screening dilution. Which of the following is the most appropriate next investigation?", "choices": ["Anti-double-stranded DNA antibody", "Anti-histone antibody", "Rheumatoid factor", "Erythrocyte sedimentation rate alone", "Anti-topoisomerase I (anti-Scl-70) and anticentromere antibody testing with high-resolution CT of the chest"], "answer": 4, "explain": "**อาการทางคลินิกมาก่อนแอนติบอดีเสมอ** — Raynaud + skin thickening ที่ลามเหนือข้อมือ + crackles ที่ฐานปอด = **diffuse cutaneous systemic sclerosis ที่มี interstitial lung disease** ซึ่งเป็นสาเหตุการตายอันดับหนึ่งของโรคนี้\n\n**ANA ที่รายงานว่า 'ลบ' ไม่ตัดโรคออก** เพราะบางห้องปฏิบัติการใช้วิธีหรือ dilution ที่ไวไม่พอ และ nucleolar/centromere pattern อาจถูกอ่านพลาด จึงต้องส่ง **antibody จำเพาะ** ต่อ\n\n| Antibody | สัมพันธ์กับ |\n|---|---|\n| **Anti-Scl-70 (topoisomerase I)** | **diffuse cutaneous SSc + interstitial lung disease** |\n| **Anticentromere** | **limited cutaneous SSc (CREST) + pulmonary arterial hypertension** |\n| Anti-RNA polymerase III | ผิวหนังหนาเร็ว + **scleroderma renal crisis** + มะเร็งร่วม |\n\nและต้องประเมินอวัยวะเสมอ: **HRCT + PFT (FVC, DLCO)** สำหรับปอด, **echocardiography** สำหรับ pulmonary hypertension, วัดความดันโลหิตเองที่บ้านเพื่อจับ renal crisis\n\n**ทำไมข้ออื่นผิด** — anti-dsDNA สำหรับ SLE, RF สำหรับ RA (บวกได้หลายโรคจึงไม่ช่วย), anti-histone สำหรับ drug-induced lupus, ESR อย่างเดียวไม่จำเพาะและไม่บอกอวัยวะที่ถูกทำลาย", "pearl": "Scleroderma: **Scl-70 → ปอด (ILD) · centromere → ความดันปอดสูง · RNA pol III → renal crisis**; ANA ลบไม่ตัดโรคออกเมื่อคลินิกชัด", "topic": "Systemic sclerosis — autoantibody testing", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 1 'Systemic sclerosis ฟังปอดได้บางอย่าง ANA negative ตรวจอะไรเพิ่ม'", "EULAR SSc recommendations 2017"], "nl": ["B4.2.2-3(9)", "B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-34", "kind": "old", "stem": "A patient with features of systemic sclerosis has a negative ANA on the standard screening assay. Which test should be sent next?", "choices": ["Anti-double-stranded DNA", "Erythrocyte sedimentation rate", "Anti-histone antibody", "Anti-topoisomerase I (anti-Scl-70) and anticentromere antibodies", "Rheumatoid factor"], "answer": 3, "explain": "โพยเก่าให้ตัวเลือก ESR / anti-dsDNA / RF — ทั้งสามไม่ช่วยวินิจฉัย systemic sclerosis; **ANA ที่ลบไม่ตัดโรคออกเมื่อคลินิกชัด** ต้องส่ง **antibody จำเพาะ**: anti-Scl-70 (สัมพันธ์กับ ILD), anticentromere (limited SSc, ความดันปอดสูง), anti-RNA polymerase III (renal crisis) และประเมินอวัยวะด้วย HRCT, PFT, echocardiography", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 1 'อาการ Systemic sclerosis ฟังปอดได้อะไรซักอย่าง ANA negative ตรวจอะไรเพิ่ม — a. ESR b. Anti-dsDNA c. Anti-Rheumatoid factor'", "ref": [], "nl": ["B4.2.2-3(9)", "B5.3(5)", "2.3.13-3(15)"]}, {"id": "AIR-MCQ-39", "kind": "mcq", "stem": "A 49-year-old woman with diffuse systemic sclerosis for 8 months, recently given prednisolone 20 mg daily for arthralgia, presents with headache and blurred vision. BP 220/130 mmHg, creatinine 3.2 mg/dL (was 0.9 mg/dL), platelet 88,000/mm3, blood smear shows schistocytes, urinalysis shows mild proteinuria without casts. Which of the following is the most appropriate treatment?", "choices": ["Start pulse methylprednisolone and cyclophosphamide", "Start plasma exchange for thrombotic thrombocytopenic purpura", "Start a short-acting ACE inhibitor such as captopril and titrate rapidly", "Start amlodipine and arrange outpatient follow-up in 1 week", "Start intravenous nitroprusside and avoid ACE inhibitors because creatinine is rising"], "answer": 2, "explain": "**Scleroderma renal crisis (SRC) = ความดันสูงวิกฤต + ไตวายเฉียบพลัน + microangiopathic hemolytic anemia** ในผู้ป่วย diffuse SSc ระยะแรก ปัจจัยกระตุ้นที่สำคัญที่สุดคือ **corticosteroid ตั้งแต่ 15 mg/วันขึ้นไป** (จึงต้องเลี่ยงสเตียรอยด์ขนาดสูงใน SSc)\n\n**กลไก** — intimal proliferation ของหลอดเลือดแดงเล็กในไต → ไตขาดเลือด → **renin หลั่งพุ่ง** → angiotensin II สูงมาก → ความดันพุ่งและหลอดเลือดฝอยถูกทำลายจนเม็ดเลือดแดงแตก\n\n**การรักษา** — **ACE inhibitor ออกฤทธิ์สั้น (captopril) คือยาที่เปลี่ยนโรคนี้จากอัตราตายเกือบ 100% ให้รอดได้** ปรับขนาดขึ้นเร็วทุก 4–8 ชั่วโมงจนคุมความดัน **ห้ามหยุดยาเพียงเพราะ creatinine สูงขึ้นในช่วงแรก** ซึ่งเป็นสิ่งที่คาดไว้อยู่แล้ว ผู้ป่วยบางรายต้องฟอกไตชั่วคราวแล้วไตฟื้นภายหลัง\n\n**ทำไมข้ออื่นผิด** — ยาลดความดันกลุ่มอื่นไม่แก้กลไก renin-angiotensin; สเตียรอยด์/cyclophosphamide ยิ่งกระตุ้นหรือไม่ช่วย; ภาพ MAHA ที่นี่มาจาก SRC ไม่ใช่ TTP (TTP จะไม่มีความดันสูงวิกฤตนำและ ADAMTS13 ต่ำมาก); การนัดผู้ป่วยนอกในภาวะ hypertensive emergency คือความผิดพลาดร้ายแรง", "pearl": "SSc + ความดันพุ่ง + Cr ขึ้น + schistocyte = **scleroderma renal crisis → captopril ทันที และห้ามหยุดแม้ Cr จะขึ้น**", "topic": "Scleroderma renal crisis", "src": "", "ref": ["MED32 โพย MCQ systemic sclerosis", "EULAR SSc recommendations 2017"], "nl": ["B4.2.2-3(9)", "2.3.13-3(15)"]}, {"id": "AIR-OLD-35", "kind": "old", "stem": "A patient with diffuse systemic sclerosis recently started on prednisolone develops blood pressure 210/120 mmHg, acute kidney injury and schistocytes on blood smear. Which drug should be started immediately?", "choices": ["Captopril", "Labetalol", "Nifedipine", "Hydralazine", "Furosemide"], "answer": 0, "explain": "**Scleroderma renal crisis** เกิดจาก renin-angiotensin ที่ถูกกระตุ้นอย่างรุนแรง — **ACE inhibitor ออกฤทธิ์สั้น (captopril) คือยาที่ช่วยชีวิต** ปรับขนาดขึ้นเร็วทุก 4-8 ชั่วโมง **ห้ามหยุดแม้ creatinine จะสูงขึ้นในช่วงแรก**; **สเตียรอยด์ตั้งแต่ 15 mg/วันขึ้นไปเป็นตัวกระตุ้นสำคัญ** จึงควรเลี่ยงใน SSc", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย systemic sclerosis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B4.2.2-3(9)", "2.3.13-3(15)"]}, {"id": "AIR-MCQ-40", "kind": "mcq", "stem": "A 20-year-old woman reports that her fingers turn white then blue then red in cold air, symmetrically in both hands, for 4 years. There is no digital ulcer or pitting scar, peripheral pulses are normal, ANA is negative and nailfold capillaroscopy is normal. Which of the following is the most appropriate management?", "choices": ["Immediate treatment with intravenous iloprost", "Start warfarin to prevent digital thrombosis", "Refer for urgent digital sympathectomy", "Reassurance with cold avoidance and smoking avoidance; drug therapy only if symptoms interfere with daily life", "Start high-dose corticosteroid to prevent progression to systemic sclerosis"], "answer": 3, "explain": "**แยก primary จาก secondary Raynaud คือคำถามหลักเสมอ เพราะ secondary แปลว่ามีโรคเนื้อเยื่อเกี่ยวพันซ่อนอยู่และเสี่ยงนิ้วขาดเลือด**\n\n| | **Primary** | **Secondary** |\n|---|---|---|\n| อายุที่เริ่ม | **< 30 ปี** | > 30 ปี |\n| ความสมมาตร | **สองข้างเท่ากัน** | ไม่สมมาตรได้ |\n| แผล/รอยบุ๋มปลายนิ้ว | **ไม่มี** | **มี** |\n| ANA | **ลบ** | บวก (Scl-70, centromere) |\n| **Nailfold capillaroscopy** | **ปกติ** | **หลอดเลือดโป่ง/หาย (megacapillary, dropout)** |\n| อาการอื่น | ไม่มี | ผิวหนังหนา ข้ออักเสบ กลืนติด |\n\nเคสนี้เข้าเกณฑ์ primary ทุกข้อ → **รักษาแบบไม่ใช้ยา**: หลีกเลี่ยงความเย็น ใส่ถุงมือ เลิกบุหรี่ เลี่ยงยาหดหลอดเลือด (เช่น beta-blocker, ยาแก้หวัดที่มี pseudoephedrine, ergotamine) และจัดการความเครียด ถ้าอาการรบกวนชีวิตจึงให้ **dihydropyridine calcium channel blocker (nifedipine)** เป็นยาตัวแรก\n\n**ทำไมข้ออื่นผิด** — iloprost ทางหลอดเลือดดำสงวนไว้สำหรับ **digital ulcer หรือ critical ischemia** ใน secondary Raynaud; สเตียรอยด์ไม่ป้องกันการเกิด SSc และมีโทษ; sympathectomy เป็นทางเลือกท้าย ๆ ของรายที่ดื้อการรักษา; warfarin ไม่มีบทบาทเพราะพยาธิกำเนิดคือ vasospasm ไม่ใช่ลิ่มเลือด", "pearl": "Primary Raynaud: **อายุน้อย สองข้างเท่ากัน ไม่มีแผลปลายนิ้ว ANA ลบ capillaroscopy ปกติ → ไม่ต้องใช้ยา**", "topic": "Raynaud phenomenon — primary versus secondary", "src": "", "ref": ["MED31 โพย MCQ Raynaud", "EULAR/ACR SSc-related vasculopathy guidance"], "nl": ["B4.2.2-3(9)", "2.1.50"]}]}, {"id": "air-33-07", "title": "กล้ามเนื้ออักเสบ และกล้ามเนื้อเป็นพิษจากยา", "minutes": 8, "summary": "อ่อนแรงต้นแขนต้นขาแบบสมมาตร + เอนไซม์สูง — และอย่าลืมว่า AST สูงอาจมาจากกล้ามเนื้อ", "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22"], "md": "### ภาพทางคลินิก\n- **อ่อนแรงกล้ามเนื้อต้นแขนต้นขาสองข้างแบบสมมาตร ค่อยเป็นค่อยไปเป็นสัปดาห์–เดือน** — ลุกจากเก้าอี้ ขึ้นบันได หวีผมลำบาก โดย **ไม่ชา** (ถ้าชาให้คิดถึงโรคเส้นประสาท)\n- **ปวดกล้ามเนื้อเป็นอาการรอง** — ผู้ป่วยจำนวนมากไม่ปวดเลย จุดสำคัญคืออ่อนแรง\n- **Dermatomyositis** มีผื่นจำเพาะ: **heliotrope rash (ผื่นม่วงรอบเบ้าตา) · Gottron papule บนข้อนิ้ว · shawl sign · mechanic's hand**\n- ต้องมองหาภาวะร่วม: **ILD (โดยเฉพาะกลุ่ม anti-synthetase/anti-Jo-1) · กลืนลำบากจากกล้ามเนื้อคอหอย · กล้ามเนื้อหัวใจอักเสบ**\n- **Dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็ง** (รังไข่ ปอด ตับอ่อน กระเพาะอาหาร ลำไส้ใหญ่ โพรงหลังจมูก) จึง **ต้องคัดกรองมะเร็งตามอายุและอาการเสมอ**\n\n### การตรวจ\n1. **CK** (มักสูงหลายพันถึงหลายหมื่น) · **AST/ALT, LDH, aldolase สูงตามได้**\n   > **AST สูงโดยที่ ALP, GGT และ bilirubin ปกติ ในผู้ป่วยที่อ่อนแรงกล้ามเนื้อ = เอนไซม์มาจากกล้ามเนื้อไม่ใช่ตับ — ให้ส่ง CK ก่อนจะไปตามหาโรคตับ**\n2. **EMG** — ลักษณะ myopathic · **MRI ของกล้ามเนื้อ** ช่วยเลือกตำแหน่งตัดชิ้นเนื้อ\n3. **การตัดชิ้นเนื้อกล้ามเนื้อยังเป็นการยืนยันมาตรฐาน** (dermatomyositis มีอาการทางผิวหนังจำเพาะอาจไม่ต้องตัด)\n4. **Myositis-specific antibody** — anti-Jo-1 และกลุ่ม anti-synthetase (ILD, mechanic's hand, Raynaud) · anti-Mi-2 (ผื่นเด่น ตอบสนองดี) · **anti-TIF1-γ และ anti-NXP2 (สัมพันธ์กับมะเร็ง)** · anti-MDA5 (ILD รุนแรงและแผลที่ผิวหนัง)\n5. รักษาด้วย **corticosteroid ขนาดสูงเป็นอันดับแรก** แล้วเติมยากดภูมิคุ้มกัน (methotrexate, azathioprine, mycophenolate, IVIG ในรายรุนแรงหรือกลืนลำบาก)\n\n### กล้ามเนื้อเป็นพิษจากสแตติน\n- อาการที่พบบ่อยที่สุดคือ **ปวดเมื่อยกล้ามเนื้อโดย CK ปกติหรือสูงเล็กน้อย** — จัดการโดยหยุดยาชั่วคราวแล้วลองยาตัวใหม่หรือขนาดใหม่ (rechallenge)\n- **ขั้นแรกที่ควรทำเมื่อมีอาการกล้ามเนื้อคือ ส่ง CK** เพื่อแยกกลุ่มที่อันตราย\n- **ตรวจ TSH ด้วยเสมอ** เพราะภาวะไทรอยด์ต่ำทำให้ปวดกล้ามเนื้อและ CK สูงได้ และเพิ่มความเสี่ยงต่อพิษของสแตติน\n- **CK > 10 เท่าของค่าปกติ หรือมีปัสสาวะสีเข้มและไตวาย = rhabdomyolysis** ต้องหยุดยาทันทีและให้สารน้ำ\n- **Statin-associated immune-mediated necrotizing myopathy (IMNM)** — อ่อนแรงและ CK สูงมาก **ที่ไม่ดีขึ้นหลังหยุดยา** ตรวจพบ **anti-HMGCR antibody** ต้องรักษาด้วยยากดภูมิคุ้มกัน\n- ปัจจัยเสี่ยง: อายุมาก ตัวเล็ก ไตหรือตับเสื่อม ใช้ร่วมกับ **fibrate (gemfibrozil), macrolide, azole, ciclosporin** และการดื่มสุรา\n\n### ที่อาจารย์เน้นในสไลด์\n\n- **IIM พบราว 5 ต่อล้านประชากร** · DM และ PM พบในหญิงมากกว่าชาย แต่ **IBM พบในชายมากกว่า**\n- แบ่งเป็น **JDM · DM · PM · IBM · กลุ่มที่สัมพันธ์กับมะเร็ง (paraneoplastic) · กลุ่มที่ซ้อนทับกับโรคเนื้อเยื่อเกี่ยวพันอื่น (overlap syndrome)**\n- เกณฑ์ที่ใช้อ้างอิงคือ **Bohan and Peter (1975)** — อ่อนแรงต้นแขนต้นขาแบบสมมาตร · เอนไซม์กล้ามเนื้อสูง · EMG แบบ myopathic · ชิ้นเนื้อเข้าได้ · ผื่นจำเพาะของ DM — และ **Dalakas (1991)** ที่เพิ่มรายละเอียดทางพยาธิวิทยา\n\n**ผื่นของ dermatomyositis แบ่ง 3 ระดับ**\n| ระดับ | รอยโรค |\n|---|---|\n| **Pathognomonic** | **Gottron papules** และ **heliotrope rash** |\n| **Characteristic** | Gottron sign · **shawl sign · V sign · holster sign** · **mechanic's hand** · periungual erythema · nail-fold telangiectasia · cuticular overgrowth · poikiloderma vasculare atrophicans · ผื่นแพ้แสง |\n| **Non-specific** | calcinosis cutis · erythroderma · vesiculobullous · ichthyosis · ผมร่วง · leukocytoclastic vasculitis · livedo reticularis · panniculitis · lipodystrophy |\n\n### ที่อาจารย์เน้นในสไลด์ (SLE and systemic autoimmune diseases)\n\n**เกณฑ์ Bohan and Peter — 5 ข้อ ที่ยังใช้สอบกันอยู่**\n1. **กล้ามเนื้อ** — อ่อนแรงต้นแขนต้นขาแบบสมมาตร ค่อยเป็นค่อยไปเป็นสัปดาห์ถึงเดือน ± กลืนลำบากหรือกะบังลมอ่อนแรง\n2. **เอนไซม์กล้ามเนื้อสูง** — CK, aldolase, AST, ALT และ/หรือ LDH\n3. **EMG** — motor unit เล็ก แอมพลิจูดต่ำ polyphasic, fibrillation potential, positive sharp wave, insertional activity เพิ่ม\n4. **ชิ้นเนื้อกล้ามเนื้อ** — myofiber necrosis, phagocytosis, regeneration, ขนาดเส้นใยไม่เท่ากัน และมีเซลล์อักเสบแทรก\n5. **ผิวหนัง** — **heliotrope rash** ร่วมกับหนังตาบวม และ **Gottron's sign**\n\n**ครบ 4/5 = definite · 3/5 = probable · 2/5 = possible**\nเกณฑ์ใหม่ **2017 EULAR/ACR** ใช้คะแนน — **ไม่มีชิ้นเนื้อ: possible > 5.3 · probable > 5.5 · definite > 7.5** และ **มีชิ้นเนื้อ: > 6.5 · > 6.7 · > 8.7** ตามลำดับ\n\n**แยกสี่ชนิดให้ออก**\n| | **DM** | **PM** | **IBM** | **NAM / IMNM** |\n|---|---|---|---|---|\n| อายุที่เริ่ม | **< 16 และ > 40** | ~40 | **> 45** | ~40 |\n| ระยะเวลาดำเนินโรค | สัปดาห์–เดือน | สัปดาห์–เดือน | **เดือน–ปี (ช้าที่สุด)** | **วัน–สัปดาห์ (เร็วที่สุด)** |\n| กล้ามเนื้อที่จับ | ต้นแขนต้นขา | ต้นแขนต้นขา | **งอนิ้ว/ข้อมือ และ quadriceps · CK สูงเล็กน้อย** | **ต้นแขนต้นขา ปวด · CK สูงมาก** |\n| สมมาตร | ใช่ | ใช่ | **ไม่สมมาตร** | ใช่ |\n| อาการทางระบบประสาท | ไม่มี | ไม่มี | **มี** | ไม่มี |\n| ชิ้นเนื้อ | **perimysial/perivascular · CD4 และ B cell · perifascicular atrophy · MAC ที่ capillary** | **endomysial · CD8 + macrophage** | **endomysial · rim vacuole · tubulofilament** | **เส้นใยตายโดยมีเซลล์อักเสบน้อย · macrophage · MAC ที่ sarcolemma** |\n| MSA | **Mi-2, MDA5, ARS, TIF1-γ, NXP2, SAE** | antisynthetase, SRP | **cN-1A** | **SRP, HMGCR** |\n\n**สองสิ่งที่ทำให้ผู้ป่วยเสียชีวิต — ILD (อาจเป็นสาเหตุการตาย) และมะเร็งที่พบร่วม**\nจึงต้อง **คัดกรองมะเร็งตามอายุและเพศ พร้อม “ตรวจ ENT ให้ครบ” เพื่อมองหามะเร็งโพรงหลังจมูก** ซึ่งพบบ่อยในคนไทยและเอเชีย\n\n**การรักษา** — **prednisolone 0.5–1 มก./กก./วัน** เป็นหลัก · **กล้ามเนื้ออักเสบ: methotrexate หรือ azathioprine** · **ILD: cyclophosphamide, mycophenolate หรือ calcineurin inhibitor**\n\n**ผื่นที่ต้องเรียกชื่อให้ถูก** — **Gottron's papules และ Gottron's sign · heliotrope · V-sign (คอด้านหน้า) · shawl sign (บ่าและหลังส่วนบน) · holster sign (ด้านข้างสะโพก) · sleeve sign (ด้านนอกต้นแขน)** และ **แผลที่ผิวหนัง (cutaneous ulceration)** ซึ่งสัมพันธ์กับ **anti-MDA5** และ ILD ที่รุนแรง\n", "pearls": ["อ่อนแรงต้นแขนต้นขาแบบสมมาตรโดยไม่ชา = myopathy ให้ส่ง CK", "AST สูงแต่ ALP/GGT ปกติ ให้คิดถึงกล้ามเนื้อก่อนตับ", "Dermatomyositis ในผู้ใหญ่ต้องคัดกรองมะเร็ง", "อาการกล้ามเนื้อจากสแตติน: ส่ง CK และ TSH ก่อนเสมอ · ไม่ดีขึ้นหลังหยุดยาให้คิดถึง IMNM", "Gottron papules และ heliotrope rash เป็น pathognomonic ส่วน shawl/V/holster sign และ mechanic's hand เป็น characteristic"], "source": "สไลด์ อ.โชคชัย — SLE and systemic autoimmune disease (ส่วน IIM) · สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "items": [{"id": "AIR-MCQ-41", "kind": "mcq", "stem": "A 52-year-old woman has 3 months of progressive difficulty climbing stairs and combing her hair, without pain. PE: symmetric proximal muscle weakness grade 3/5, violaceous rash over the eyelids and scaly erythematous papules over the knuckles. Lab: creatine kinase 4,200 U/L, AST 180 U/L, ALT 120 U/L. Which of the following is the most appropriate next step in addition to starting treatment?", "choices": ["Serum uric acid and joint aspiration", "Bone mineral density as the first priority", "Age-appropriate malignancy screening, because dermatomyositis is strongly associated with occult cancer", "Nerve conduction study to confirm peripheral neuropathy", "Liver biopsy to evaluate the raised transaminases"], "answer": 2, "explain": "**กล้ามเนื้ออ่อนแรงส่วนต้นทั้งสองข้างแบบค่อยเป็นค่อยไป ไม่ปวด + CK สูงมาก + ผื่น heliotrope (เปลือกตาสีม่วง) และ Gottron papules (ที่ข้อนิ้ว) = dermatomyositis**\n\n**จุดที่ต้องทำเสมอคือค้นหามะเร็งแฝง** — dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งอย่างมีนัยสำคัญ (ราว 15–25% โดยเฉพาะ 1–3 ปีแรกหลังวินิจฉัย): รังไข่ ปอด ตับอ่อน กระเพาะอาหาร ลำไส้ใหญ่ และ **nasopharyngeal carcinoma ซึ่งพบมากในคนเอเชีย** จึงต้องตรวจตามอายุและเพศ + CT ทรวงอกและช่องท้อง + ตรวจโพรงหลังจมูก\n\n**จุดที่พลาดบ่อย** — AST/ALT ที่สูงในเคสนี้ **มาจากกล้ามเนื้อ ไม่ใช่ตับ** (transaminase อยู่ในกล้ามเนื้อลายด้วย) ให้ยืนยันด้วย CK, aldolase และ GGT ที่ปกติ ก่อนจะไปเจาะตับโดยไม่จำเป็น\n\n**การประเมินอื่น** — myositis-specific antibody (anti-Jo-1 = antisynthetase syndrome ที่มี ILD, mechanic's hands, ข้ออักเสบ; anti-MDA5 = ผิวหนังเด่นแต่ ILD รุนแรง), EMG, MRI กล้ามเนื้อหรือชิ้นเนื้อ และประเมินการกลืนกับปอด\n\n**ทำไมข้ออื่นผิด** — nerve conduction study ใช้แยกโรคเส้นประสาทซึ่งจะอ่อนแรงส่วนปลายและมีอาการชา; uric acid/เจาะข้อไม่เกี่ยว; BMD สำคัญเมื่อเริ่มสเตียรอยด์แต่ไม่ใช่ลำดับแรก", "pearl": "อ่อนแรงส่วนต้น + CK สูง + heliotrope/Gottron = dermatomyositis → **ต้องคัดกรองมะเร็ง**; AST/ALT ที่สูงอาจมาจากกล้ามเนื้อ ไม่ใช่ตับ", "topic": "Inflammatory myopathy", "src": "", "ref": ["MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "Harrison 21st ed., Inflammatory Myopathies"], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22", "2.1.26"]}, {"id": "AIR-OLD-38", "kind": "old", "stem": "A 55-year-old woman has proximal muscle weakness, a violaceous periorbital rash and scaly papules over the knuckles. Apart from treating the myositis, what must not be missed?", "choices": ["Screening for an underlying malignancy", "Screening for iron deficiency", "Screening for hepatitis A", "Screening for diabetes mellitus", "Screening for osteoporosis before treatment"], "answer": 0, "explain": "**Dermatomyositis ในผู้ใหญ่สัมพันธ์กับมะเร็งแฝงราว 15-25%** โดยเฉพาะ 1-3 ปีแรก — ไทย/เอเชียต้องระวัง **nasopharyngeal carcinoma** เป็นพิเศษ ร่วมกับรังไข่ ปอด กระเพาะอาหาร ลำไส้ใหญ่ ตับอ่อน; ประเมินตามอายุและเพศ + CT ทรวงอก-ช่องท้อง-อุ้งเชิงกราน + ตรวจโพรงหลังจมูก และอย่าลืมประเมิน **ILD และการกลืน**", "pearl": "", "topic": "", "src": "ต่อยอดจากโพย MED33 (inflammatory myopathy) เขียนใหม่เป็นตัวเลือก", "ref": [], "nl": ["B5.2.2-3(2)", "2.3.13-3(10)", "2.1.22"]}, {"id": "AIR-OLD-37", "kind": "old", "stem": "A patient has proximal muscle weakness with AST 1,000 U/L but normal ALT, ALP and GGT. What is the most appropriate next investigation?", "choices": ["Serum ammonia", "Liver biopsy", "Creatine kinase", "Hepatitis serology", "Abdominal ultrasound"], "answer": 2, "explain": "**AST อยู่ในกล้ามเนื้อลายด้วย** จึงสูงได้จากโรคกล้ามเนื้อโดยที่ตับปกติ — เบาะแสคือ **ALP และ GGT ปกติ** และมีอาการอ่อนแรงส่วนต้น ให้ยืนยันด้วย **CK (และ aldolase)** ก่อนจะไปสืบค้นตับหรือเจาะตับโดยไม่จำเป็น", "pearl": "", "topic": "", "src": "MED33 โพย MCQ 'Myalgia AST สูงเป็น 1000 ALT ปกติ investigation: CPK'", "ref": [], "nl": ["2.1.22", "2.1.26", "B5.2.5-3(1)"]}, {"id": "AIR-MCQ-42", "kind": "mcq", "stem": "A 58-year-old man with dyslipidemia on simvastatin 40 mg daily for 6 months complains of symmetric aching of the thigh and shoulder muscles for 3 weeks, without weakness or dark urine. Which of the following is the most appropriate initial investigation?", "choices": ["Serum myoglobin only", "Muscle biopsy", "Electromyography", "Serum creatine kinase", "Anti-HMG-CoA reductase antibody as the first test"], "answer": 3, "explain": "**ปวดกล้ามเนื้อในผู้ที่กิน statin ต้องวัด CK ก่อนเสมอ** เพราะ CK เป็นตัวแยกกลุ่มอาการและกำหนดการจัดการทั้งหมด\n\n| ภาวะ | CK | การจัดการ |\n|---|---|---|\n| Myalgia (พบบ่อยที่สุด) | **ปกติหรือสูงเล็กน้อย** | หยุด statin ชั่วคราว 2–4 สัปดาห์ ดูว่าอาการหายไหม แล้วลองยาตัวอื่น/ขนาดต่ำ/วันเว้นวัน |\n| Myopathy | สูง > 10 เท่า ULN | หยุดยา หาสาเหตุร่วม |\n| **Rhabdomyolysis** | **> 40 เท่า ULN + ปัสสาวะสีเข้ม + ไตวาย** | **หยุดทันที ให้สารน้ำเข้มข้น** |\n| Immune-mediated necrotizing myopathy | สูงมากและ **ไม่ดีขึ้นหลังหยุดยา** | **anti-HMGCR antibody บวก** ต้องใช้ยากดภูมิ |\n\n**ปัจจัยที่เพิ่มความเสี่ยง** — อายุมาก ตัวเล็ก ไตหรือตับบกพร่อง ไทรอยด์ต่ำ (ต้องตรวจ TSH เสมอ) วิตามินดีต่ำ ออกกำลังหนัก และยาที่ยับยั้ง CYP3A4 เช่น **clarithromycin, itraconazole, ciclosporin, gemfibrozil, น้ำเกรปฟรุต** โดย simvastatin ไวต่อปฏิกิริยาเหล่านี้มากเป็นพิเศษ\n\n**ทำไมข้ออื่นผิด** — EMG และชิ้นเนื้อกล้ามเนื้อสงวนไว้เมื่อ CK สูงต่อเนื่องหรือมีอ่อนแรงจริงหลังหยุดยา; anti-HMGCR ตรวจเมื่ออาการไม่หายหลังหยุดยา; myoglobin ไม่ไวและไม่จำเพาะเท่า CK", "pearl": "ปวดกล้ามเนื้อ + กิน statin = **ส่ง CK ก่อน** และมองหายาที่ยับยั้ง CYP3A4 ร่วมด้วยเสมอ", "topic": "Statin-associated muscle symptoms", "src": "", "ref": ["MED33 โพย Rheumato ข้อ 5 'ปวดกล้ามเนื้อ มี dyslipidemia กินยา statin ควรส่งตรวจอะไร — CPK level'", "ACC/AHA statin safety statement"], "nl": ["2.1.26", "2.3.13-3(7)", "B5.2.5-3(1)"]}, {"id": "AIR-OLD-36", "kind": "old", "stem": "A 58-year-old man on simvastatin complains of symmetric proximal muscle aching. Which investigation should be ordered first?", "choices": ["Electromyography", "Nerve conduction study", "Serum aldolase only", "Serum creatine kinase", "Muscle biopsy"], "answer": 3, "explain": "โพยเก่าตอบ **CPK (creatine kinase)** — เป็นตัวแยกระหว่าง myalgia (CK ปกติ), myopathy (CK สูง > 10 เท่า), **rhabdomyolysis** (CK สูงมาก + ปัสสาวะสีเข้ม + ไตวาย) และ immune-mediated necrotizing myopathy (CK สูงและไม่ดีขึ้นหลังหยุดยา → ส่ง anti-HMGCR); อย่าลืมตรวจ **TSH** และทบทวนยาที่ยับยั้ง CYP3A4 เช่น clarithromycin, itraconazole, gemfibrozil", "pearl": "", "topic": "", "src": "MED33 โพย Rheumato ข้อ 5 'มาด้วยอาการปวดกล้ามเนื้อ มี dyslipidemia กินยา statin ควรส่งตรวจอะไร — a. CPK Level'", "ref": [], "nl": ["2.1.26", "2.3.13-3(7)", "B5.2.5-3(1)"]}]}, {"id": "air-33-07b", "title": "Sjögren's syndrome", "summary": "ตาแห้งปากแห้งที่ต้องพิสูจน์ด้วยตัวเลข และความเสี่ยงมะเร็งต่อมน้ำเหลือง", "minutes": 6, "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "md": "### ภาพรวม\n- **Primary Sjögren** = เป็นเอง · **Secondary Sjögren** = พบร่วมกับโรคเนื้อเยื่อเกี่ยวพันอื่น โดยเฉพาะ **RA และ SLE**\n- พบใน **หญิงมากกว่าชายราว 20:1** และ **เริ่มช่วงอายุ 50–60 ปี** ซึ่งแก่กว่า SLE ชัดเจน\n- **อาการของต่อมมีท่อ** — **ตาแห้ง ปากแห้ง (sicca)** และ **ต่อมน้ำลายโต** (parotid/submandibular)\n- **อาการนอกต่อม** — ปวดข้อ Raynaud ผื่น purpura ปลายประสาทอักเสบ **interstitial lung disease** **renal tubular acidosis ชนิดที่ 1** และตับอักเสบจากภูมิคุ้มกัน\n- **ความเสี่ยงที่ต้องเฝ้าระวังตลอดชีวิตคือมะเร็งต่อมน้ำเหลือง (โดยเฉพาะ MALT lymphoma)** — สัญญาณเตือนคือ **ต่อมน้ำลายโตข้างเดียวที่โตขึ้นเรื่อย ๆ ต่อมน้ำเหลืองโต C4 ต่ำ cryoglobulin บวก และ purpura**\n\n### เกณฑ์จำแนกโรค ACR-EULAR 2017\nใช้กับผู้ที่ **มีอาการตาแห้งหรือปากแห้งอย่างน้อยหนึ่งอาการ หรือมีอาการทางระบบที่ชวนให้คิดถึงโรคนี้**\n\n| ข้อ | รายละเอียด | คะแนน |\n|---|---|---|\n| **Focus score ≥ 1** | ชิ้นเนื้อต่อมน้ำลายที่ริมฝีปาก พบกลุ่มเซลล์โมโนนิวเคลียร์ **≥ 50 เซลล์ ต่อพื้นที่ 4 ตร.มม.** | **3** |\n| **Anti-SSA (Ro) บวก** | นับเฉพาะ **anti-Ro60** — **anti-Ro52 เดี่ยว ๆ ไม่จำเพาะ** | **3** |\n| **Ocular staining score ≥ 5** | ย้อม fluorescein และ lissamine green (คะแนน 0–12) | 1 |\n| **Schirmer test ≤ 5 มม./5 นาที** | วัดการสร้างน้ำตา | 1 |\n| **น้ำลายที่ไหลเองโดยไม่กระตุ้น ≤ 0.1 มล./นาที** | เก็บน้ำลายอย่างน้อย 5 นาที | 1 |\n\n**รวม ≥ 4 คะแนน = เข้าเกณฑ์**\n\n**ข้อที่ต้องตัดออกก่อน (exclusion)** — **การติดเชื้อไวรัสตับอักเสบซีที่ยังแอคทีฟ · เคยฉายรังสีบริเวณคอ · sarcoidosis · GVHD · การใช้ยาต้านโคลิเนอร์จิก · และ IgG4-related disease**\n\n> **สองข้อที่ให้ 3 คะแนนคือ focus score และ anti-Ro60** — ผู้ป่วยที่ไม่มีทั้งสองข้อนี้ จะเก็บคะแนนจากการตรวจตาและน้ำลายให้ครบ 4 ได้ยาก นี่คือเหตุผลที่ **ปากแห้งตาแห้งอย่างเดียวไม่พอที่จะบอกว่าเป็น Sjögren**\n\n### การรักษา\n- **ดูแลช่องปากและตรวจฟันสม่ำเสมอ** — น้ำลายน้อยทำให้ฟันผุลุกลามเร็วมาก\n- **สารหล่อลื่นเฉพาะที่** — น้ำตาเทียม น้ำลายเทียม และสารหล่อลื่นช่องคลอด\n- **Muscarinic agonist — pilocarpine** (หรือ cevimeline) เมื่ออาการแห้งรบกวนมาก\n- **ยากดภูมิคุ้มกันใช้เฉพาะเมื่อมีอาการนอกต่อมที่กระทบอวัยวะสำคัญ** ไม่ใช่ใช้เพื่อรักษาอาการแห้ง\n- **hydroxychloroquine** ช่วยเรื่องปวดข้อและอ่อนเพลีย\n", "pearls": ["Sjögren: หญิง:ชาย ราว 20:1 เริ่มอายุ 50–60 ปี", "เกณฑ์ 2017 ให้ focus score ≥ 1 และ anti-Ro60 อย่างละ 3 คะแนน รวม ≥ 4 จึงเข้าเกณฑ์ — anti-Ro52 เดี่ยว ๆ ไม่นับ", "ต้องตัด HCV ที่ยังแอคทีฟ IgG4-RD sarcoidosis GVHD และยาต้านโคลิเนอร์จิกออกก่อน", "ต่อมน้ำลายโตข้างเดียวที่โตขึ้นเรื่อย ๆ + C4 ต่ำ + cryoglobulin = ระวัง MALT lymphoma"], "nl": ["B5.2.2-3(5)", "2.3.13"], "items": [{"id": "AIR-33-07B-Q1", "kind": "own", "stem": "A 54-year-old woman reports 2 years of gritty eyes and a dry mouth that forces her to sip water while eating. Schirmer test is 3 mm in 5 minutes bilaterally and unstimulated salivary flow is 0.05 mL/min. ANA is 1:320 fine speckled, anti-Ro52 is positive, anti-Ro60 and anti-La are negative, rheumatoid factor is negative. Which of the following is the most appropriate next step?", "choices": ["Repeat the ANA in 12 weeks; a rising titre would confirm the diagnosis", "Start pilocarpine and hydroxychloroquine and make no further diagnostic effort, as the classification has no bearing on care", "Order a parotid sialogram, which has replaced biopsy in the 2017 ACR-EULAR criteria", "Perform a minor labial salivary gland biopsy, since her current score is below the classification threshold and a focus score would carry 3 points", "Classify her as primary Sjögren syndrome now, because a positive anti-Ro52 antibody scores 3 points"], "answer": 3, "explain": "นับคะแนนตามเกณฑ์ **ACR-EULAR 2017** ของผู้ป่วยรายนี้ — **Schirmer ≤ 5 มม./5 นาที = 1 คะแนน** และ **น้ำลายที่ไหลเอง ≤ 0.1 มล./นาที = 1 คะแนน** รวมได้เพียง **2 คะแนน** ยังไม่ถึงเกณฑ์ที่ต้องได้ **≥ 4**\n\n**anti-Ro52 เดี่ยว ๆ ไม่นับ** เกณฑ์ระบุชัดว่าให้คะแนนเฉพาะ **anti-Ro60** (anti-Ro52 พบได้ในโรคอื่นหลายโรค เช่น myositis และโรคตับอักเสบจากภูมิคุ้มกัน จึงไม่จำเพาะ) ดังนั้นข้อที่จะทำให้ได้คะแนนเพิ่มอย่างมีความหมายคือ **การตัดชิ้นเนื้อต่อมน้ำลายที่ริมฝีปาก ซึ่ง focus score ≥ 1 ให้ 3 คะแนน** และจะทำให้รวมเป็น 5 คะแนน\n\nระหว่างนี้ยังต้อง **ตัดสาเหตุอื่นของอาการแห้ง** — ไวรัสตับอักเสบซีที่ยังแอคทีฟ, IgG4-related disease, sarcoidosis, GVHD, ประวัติฉายรังสีบริเวณคอ และ **ยาต้านโคลิเนอร์จิก** (ยาแก้แพ้ ยาต้านซึมเศร้า ยาคลายกังวล) ซึ่งเป็นสาเหตุที่พบบ่อยที่สุดของปากแห้งในผู้สูงอายุ\n\n**ทำไมข้ออื่นผิด**\n- การรักษาตามอาการอย่างเดียวโดยไม่วินิจฉัยให้ชัด ทำให้พลาดการเฝ้าระวัง **อาการนอกต่อมและมะเร็งต่อมน้ำเหลือง**\n- **sialogram ไม่ได้อยู่ในเกณฑ์ 2017**\n- **ไทเตอร์ ANA ไม่ได้ใช้ติดตามหรือยืนยันโรคนี้**", "pearl": "ในเกณฑ์ Sjögren 2017 มีเพียง focus score ≥ 1 และ anti-Ro60 ที่ให้ 3 คะแนน — anti-Ro52 เดี่ยว ๆ ไม่นับ", "topic": "Sjögren's syndrome", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.3.13"]}, {"id": "AIR-33-07B-Q2", "kind": "own", "stem": "A 58-year-old woman with primary Sjögren syndrome of 8 years returns with a firm, progressively enlarging left parotid swelling for 3 months, new palpable purpura on both legs, and cervical lymphadenopathy. Laboratory tests show C4 0.06 g/L (low), positive cryoglobulins and a monoclonal IgM kappa band. Which of the following is the most likely diagnosis?", "choices": ["IgG4-related disease involving the salivary gland", "Acute bacterial parotitis from reduced salivary flow", "Mucosa-associated lymphoid tissue (MALT) lymphoma arising in the parotid gland", "Reactivation of Sjögren-related glandular inflammation, treatable with a short course of prednisolone", "Sarcoidosis with parotid involvement (Heerfordt syndrome)"], "answer": 2, "explain": "ผู้ป่วย Sjögren มีความเสี่ยงต่อ **มะเร็งต่อมน้ำเหลือง โดยเฉพาะ MALT lymphoma ของต่อมน้ำลาย** สูงกว่าประชากรทั่วไปหลายเท่า และโจทย์รายนี้มี **ปัจจัยทำนายครบชุด**: **ต่อมน้ำลายโตข้างเดียวที่โตขึ้นเรื่อย ๆ · purpura ที่คลำได้ · ต่อมน้ำเหลืองโต · C4 ต่ำ · cryoglobulin บวก · และมี monoclonal band** ทั้งหมดนี้คือสัญญาณเตือนที่ต้อง **ตัดชิ้นเนื้อต่อมน้ำลายหรือต่อมน้ำเหลืองเพื่อวินิจฉัยทันที**\n\n**ทำไมข้ออื่นผิด**\n- **ต่อมน้ำลายอักเสบจากแบคทีเรีย** เกิดเฉียบพลัน เจ็บมาก บวมแดงร้อน และมีหนองไหลจากท่อ ไม่ใช่ก้อนแข็งที่ค่อย ๆ โตใน 3 เดือน\n- **การกำเริบของตัวโรคเอง** ไม่ทำให้เกิด monoclonal band และไม่อธิบายต่อมน้ำเหลืองโตร่วมกับ C4 ต่ำและ cryoglobulin — การให้สเตียรอยด์ไปก่อนโดยไม่ตัดชิ้นเนื้อจะทำให้การวินิจฉัยมะเร็งล่าช้าและอ่านผลยากขึ้น\n- **IgG4-related disease** มักโตหลายต่อมทั้งสองข้าง ระดับ IgG4 สูง และไม่ทำให้ C4 ต่ำร่วมกับ cryoglobulin แบบนี้\n- **Sarcoidosis** (Heerfordt) มีไข้ ม่านตาอักเสบ อัมพาตเส้นประสาทใบหน้า และต่อมน้ำเหลืองขั้วปอดโต ซึ่งไม่มีในโจทย์", "pearl": "Sjögren + ต่อมน้ำลายโตข้างเดียวที่โตขึ้นเรื่อย ๆ + C4 ต่ำ + cryoglobulin + purpura = สงสัย MALT lymphoma ต้องตัดชิ้นเนื้อ", "topic": "Sjögren's syndrome", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.3.13"]}]}, {"id": "air-33-07c", "title": "MCTD และ UCTD — เมื่ออาการยังไม่เข้าโรคใดโรคหนึ่ง", "summary": "นิยามที่ต่างกันสามคำ: MCTD · overlap syndrome · UCTD", "minutes": 6, "source": "สไลด์ อ.พรรณนิภา บุปผาเรณู (หน่วยโรคข้อและรูมาติสซั่ม รพ.ราชวิถี) — SLE and systemic autoimmune diseases 2567", "md": "### Mixed connective tissue disease (MCTD)\nโรคที่มี **ลักษณะผสมของ SSc, SLE, IIM และ RA** โดยมี **anti-U1RNP ไทเตอร์สูง** เป็นตัวยึด\n\n**เกณฑ์ Alarcón-Segovia** (ใช้ง่ายและออกสอบบ่อยที่สุด)\n- **ทางซีรัมวิทยา: anti-U1RNP มากกว่า 1:1,000** *และ*\n- **ทางคลินิก ต้องมีอย่างน้อย 3 ใน 5 ข้อ** — **synovitis · Raynaud's phenomenon · มือบวม (puffy hands) · myositis · sclerodactyly**\n\n- **ANA บวกเกือบ 100%** ของผู้ป่วย และมักเป็น **coarse speckled**\n- **รักษาเหมือน SLE แต่พยากรณ์โรคดีกว่า** — สิ่งที่ต้องเฝ้าระวังระยะยาวคือ **pulmonary arterial hypertension และ ILD**\n\n> **MCTD ไม่ใช่ overlap syndrome** — **overlap syndrome คือผู้ป่วยที่เข้าเกณฑ์ของโรคหนึ่งเต็มรูปแบบ แล้วมีอาการของอีกโรคหนึ่งที่อธิบายด้วยโรคแรกไม่ได้** ส่วน MCTD เป็นกลุ่มอาการเฉพาะของตัวเองที่ผูกกับ anti-U1RNP\n\n### Undifferentiated connective tissue disease (UCTD)\n- **มีอาการและผลเลือดของโรคเนื้อเยื่อเกี่ยวพัน แต่ยังไม่เข้าเกณฑ์ของโรคใดเลย**\n- **Stable UCTD** — อยู่แบบนี้ได้นานกว่า 2–3 ปีโดยไม่กลายเป็นโรคใดชัดเจน (เป็นกลุ่มส่วนใหญ่)\n- **Evolving UCTD ราวร้อยละ 30 จะกลายเป็นโรคที่ชัดเจนในภายหลัง** โดยสัดส่วนจากสไลด์คือ\n\n| กลายเป็น | สัดส่วน |\n|---|---|\n| **RA** | **38%** |\n| **Sjögren** | **19%** |\n| **SLE** | **12%** |\n| **MCTD** | **11%** |\n| SSc | 8% |\n| IIM | 2% |\n\n**สิ่งที่ต้องทำกับผู้ป่วย UCTD คือติดตามเป็นระยะ ไม่ใช่รีบตั้งชื่อโรค** — ตรวจอาการใหม่ ปัสสาวะ และเม็ดเลือดเป็นระยะ ให้การรักษาตามอาการ (HCQ ช่วยได้ในหลายราย) และบอกผู้ป่วยว่าอาการใดที่ต้องรีบกลับมาพบแพทย์\n\n### สรุปสามคำให้ไม่สับสน\n| คำ | ความหมาย |\n|---|---|\n| **MCTD** | มี **anti-U1RNP ไทเตอร์สูง** + กลุ่มอาการจำเพาะ (Raynaud, puffy hands, synovitis, myositis, sclerodactyly) |\n| **Overlap syndrome** | **เข้าเกณฑ์โรคหนึ่งครบ + มีอาการของอีกโรคที่อธิบายไม่ได้ด้วยโรคแรก** |\n| **UCTD** | มีอาการและแอนติบอดี **แต่ยังไม่เข้าเกณฑ์โรคใดเลย** |\n", "pearls": ["MCTD = anti-U1RNP > 1:1,000 + อย่างน้อย 3 ใน 5 (synovitis, Raynaud, puffy hands, myositis, sclerodactyly)", "MCTD รักษาเหมือน SLE พยากรณ์ดีกว่า แต่ต้องเฝ้าระวัง PAH และ ILD", "UCTD ราว 30% กลายเป็นโรคชัดเจน โดยกลายเป็น RA มากที่สุด"], "nl": ["B5.2.2-3(5)", "2.3.13"], "items": [{"id": "AIR-33-07C-Q1", "kind": "own", "stem": "A 30-year-old woman presents with polyarthritis for 3 weeks together with Raynaud phenomenon and sclerodactyly. ANA is positive at 1:160 speckled, anti-RNP is positive and anti-Sm is negative. Hand radiographs are normal. What is the most likely diagnosis?", "choices": ["Systemic lupus erythematosus (SLE)", "Overlap syndrome", "Undifferentiated connective tissue disease (UCTD)", "Systemic sclerosis (SSc)", "Mixed connective tissue disease (MCTD)"], "answer": 4, "explain": "ผู้ป่วยมีสามข้อจากห้าข้อทางคลินิกของ **Alarcón-Segovia** — **synovitis (ข้ออักเสบหลายข้อ) · Raynaud's phenomenon · sclerodactyly** ร่วมกับ **anti-U1RNP บวก** จึงเข้าได้กับ **MCTD** มากที่สุด (ในทางปฏิบัติควรยืนยันไทเตอร์ของ anti-U1RNP ว่าสูงจริงตามเกณฑ์)\n\n**ทำไมข้ออื่นผิด**\n- **SLE** — ไม่มีอาการเด่นของลูปัส (ผื่นปีกผีเสื้อ แผลในปาก ไตอักเสบ เม็ดเลือดต่ำ) **anti-Sm ลบ** และ sclerodactyly ไม่ใช่ลักษณะของ SLE\n- **SSc** — ผิวแข็งจำกัดอยู่แค่ปลายนิ้วโดยไม่มี anti-centromere หรือ anti-Scl-70 และการมีข้ออักเสบเด่นร่วมกับ anti-RNP ชี้ไปทาง MCTD มากกว่า\n- **UCTD** — ใช้เรียกผู้ที่ **ยังไม่เข้าเกณฑ์ของโรคใดเลย** แต่รายนี้เข้าเกณฑ์ MCTD แล้ว\n- **Overlap syndrome** — ต้อง **เข้าเกณฑ์ของโรคหนึ่งอย่างครบถ้วนก่อน** แล้วจึงมีอาการของอีกโรคหนึ่งเพิ่ม ซึ่งผู้ป่วยรายนี้ไม่เข้าเกณฑ์เต็มของ SLE หรือ SSc เลย", "pearl": "Raynaud + puffy hands/sclerodactyly + ข้ออักเสบ + anti-U1RNP = MCTD ไม่ใช่ overlap syndrome", "topic": "MCTD และ UCTD — เมื่ออาการยังไม่เข้าโรคใดโรคหนึ่ง", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.3.13"]}, {"id": "AIR-33-07C-Q2", "kind": "own", "stem": "A 41-year-old woman has had Raynaud phenomenon, arthralgia and a positive ANA (1:160 speckled) for 3 years. She has never had a rash, oral ulcer, serositis, nephritis, cytopenia, sclerodactyly or muscle weakness; anti-dsDNA, anti-Sm, anti-RNP, anti-Ro/La, anti-Scl-70 and anti-centromere are all negative, and complement levels are normal. Which of the following statements about her condition is most accurate?", "choices": ["Because she has remained undifferentiated for 3 years, no further follow-up is required", "She has undifferentiated connective tissue disease; about 30% of such patients evolve into a defined disease over time, most often rheumatoid arthritis, so she needs periodic reassessment", "Nailfold capillaroscopy is contraindicated as it cannot distinguish primary from secondary Raynaud phenomenon", "She should be treated empirically with cyclophosphamide to prevent progression to systemic lupus erythematosus", "A positive ANA at this titre with Raynaud phenomenon is sufficient to classify her as having SLE"], "answer": 1, "explain": "ผู้ป่วยมีอาการและแอนติบอดีของโรคเนื้อเยื่อเกี่ยวพัน **แต่ไม่เข้าเกณฑ์ของโรคใดเลย** = **undifferentiated connective tissue disease (UCTD)** ตามสไลด์ **ราวร้อยละ 30 เป็น evolving UCTD ที่กลายเป็นโรคชัดเจนในภายหลัง โดยกลายเป็น RA มากที่สุด (38%) รองลงมาคือ Sjögren (19%), SLE (12%), MCTD (11%), SSc (8%) และ IIM (2%)** ที่เหลือเป็น **stable UCTD** ซึ่งอยู่แบบนี้ได้นานหลายปี\n\nการดูแลคือ **ติดตามเป็นระยะ** — ถามอาการใหม่ ตรวจปัสสาวะและ CBC และสอนผู้ป่วยว่าอาการใดต้องรีบกลับมา (ผื่นแพ้แสง แผลในปาก บวม ปัสสาวะเป็นฟอง ไข้เรื้อรัง แผลที่ปลายนิ้ว) ให้การรักษาตามอาการ โดย **hydroxychloroquine** ช่วยเรื่องปวดข้อและอ่อนเพลียได้\n\n**ทำไมข้ออื่นผิด**\n- **ห้ามให้ cyclophosphamide เพื่อ “ป้องกัน”** — พิษของยาสูงมากและไม่มีข้อบ่งชี้เมื่อไม่มีอวัยวะสำคัญถูกทำลาย\n- **ANA บวกร่วมกับ Raynaud ไม่พอจะเรียกว่า SLE** ต้องมีอาการทางคลินิกและคะแนนรวมถึงเกณฑ์\n- **ยังต้องติดตามต่อ** เพราะการเปลี่ยนเป็นโรคชัดเจนเกิดได้หลังหลายปี\n- **Nailfold capillaroscopy เป็นเครื่องมือที่ช่วยแยก primary ออกจาก secondary Raynaud ได้ดีที่สุด** ควรทำ ไม่ใช่ข้อห้าม", "pearl": "UCTD = มีอาการและแอนติบอดีแต่ไม่เข้าเกณฑ์โรคใด · ราว 30% กลายเป็นโรคชัดเจน (RA มากที่สุด) จึงต้องนัดติดตาม", "topic": "MCTD และ UCTD — เมื่ออาการยังไม่เข้าโรคใดโรคหนึ่ง", "src": "", "ref": [], "nl": ["B5.2.2-3(5)", "2.3.13"]}]}, {"id": "air-33-08", "title": "Polymyalgia rheumatica และ giant cell arteritis", "minutes": 6, "summary": "ปวดไหล่สะโพกในผู้สูงอายุ และอาการทางตาที่ต้องให้ steroid ทันที", "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)"], "md": "### Polymyalgia rheumatica (PMR)\n- **อายุ > 50 ปีเสมอ** — ปวดและ **ฝืด** ที่ **ไหล่และสะโพกสองข้าง** ตอนเช้านานกว่า 45–60 นาที ยกแขนลำบากเพราะเจ็บ **ไม่ใช่อ่อนแรงจริง** (CK ปกติ ต่างจาก myositis)\n- ESR/CRP สูงชัดเจน · อาจมีไข้ต่ำ น้ำหนักลด\n- **ตอบสนองต่อ prednisolone 12.5–25 mg/วัน อย่างรวดเร็วภายใน 2–3 วัน** — ถ้าไม่ดีขึ้นชัดเจนให้ทบทวนการวินิจฉัย (RA ในผู้สูงอายุ, myositis, ไทรอยด์ต่ำ, มะเร็ง, การติดเชื้อ)\n- ค่อย ๆ ลดยาในเวลาราว 1–2 ปี และเสริมแคลเซียม วิตามินดี และยาป้องกันกระดูกพรุน\n\n### Giant cell arteritis (GCA)\n- เกิดร่วมกับ PMR ได้ราวร้อยละ 15–20 (และผู้ป่วย GCA ราวครึ่งหนึ่งมีอาการ PMR)\n- อาการเตือน: **ปวดศีรษะบริเวณขมับที่เพิ่งเกิดใหม่ · หนังศีรษะกดเจ็บ (หวีผมแล้วเจ็บ) · ขากรรไกรล้าขณะเคี้ยว (jaw claudication) · ตามัวหรือมองไม่เห็นชั่วคราว** · คลำหลอดเลือดขมับได้แข็งและคดเคี้ยว ชีพจรเบา\n- **ภาวะแทรกซ้อนที่กลัวที่สุดคือ ตาบอดถาวรจาก anterior ischemic optic neuropathy ซึ่งป้องกันได้ด้วยการให้ steroid ทันที**\n\n> **ถ้าสงสัย GCA ให้เริ่ม corticosteroid ทันทีโดยไม่ต้องรอผลชิ้นเนื้อ** — prednisolone 40–60 mg/วัน หรือ **methylprednisolone ทางหลอดเลือดดำเมื่อมีอาการทางตาแล้ว** จากนั้นจึง **ตัดชิ้นเนื้อ temporal artery ภายใน 1–2 สัปดาห์** (ผลยังบวกได้เพราะรอยโรคอยู่นาน) หรือทำอัลตราซาวด์หลอดเลือดขมับหา **halo sign**\n- ชิ้นเนื้อควรยาวพอ (≥ 1–2 ซม.) เพราะรอยโรคเป็น **skip lesion** · **ผลลบไม่ตัดโรค** ถ้าภาพทางคลินิกชัด\n- ยาลดการใช้ steroid: **tocilizumab (anti-IL-6)** · ให้ aspirin ขนาดต่ำพิจารณาเป็นรายบุคคล\n", "pearls": ["PMR: ปวดฝืดไหล่และสะโพกสองข้างในคน > 50 ปี CK ปกติ ตอบสนอง prednisolone ขนาดต่ำใน 2–3 วัน", "สงสัย GCA ให้ steroid ทันที อย่ารอผลชิ้นเนื้อ", "ชิ้นเนื้อ temporal artery ผลลบไม่ตัดโรค เพราะเป็น skip lesion"], "items": [{"id": "AIR-MCQ-43", "kind": "mcq", "stem": "A 72-year-old woman has 6 weeks of severe aching and morning stiffness of both shoulders and hips lasting 2 hours, with fatigue and low-grade fever. For 5 days she has had a new right temporal headache, scalp tenderness and pain in the jaw while chewing. ESR is 92 mm/hr. Vision is currently normal. Which of the following is the most appropriate immediate management?", "choices": ["Start NSAID and physiotherapy for polymyalgia rheumatica", "Arrange temporal artery biopsy first and start corticosteroid only after the result", "Start low-dose prednisolone 15 mg daily and review in 2 weeks", "Start high-dose corticosteroid immediately and arrange temporal artery biopsy or vascular imaging without delaying treatment", "Start methotrexate as the initial treatment"], "answer": 3, "explain": "**Jaw claudication + ปวดศีรษะขมับใหม่ + หนังศีรษะกดเจ็บ + ESR สูงมาก ในผู้สูงอายุ = giant cell arteritis (GCA) ซึ่งเป็นภาวะฉุกเฉินทางตา** — หลอดเลือด ophthalmic/posterior ciliary อุดตันทำให้ **ตาบอดถาวรภายในไม่กี่ชั่วโมงถึงวัน และเมื่อบอดแล้วแก้ไม่ได้**\n\n**หลักการที่ต้องจำ: ให้สเตียรอยด์ก่อน ตรวจยืนยันตามหลัง** — prednisolone 40–60 mg/วัน (หรือ pulse methylprednisolone ถ้ามีอาการทางตาแล้ว) แล้วค่อยทำ **temporal artery biopsy ภายใน 1–2 สัปดาห์** ซึ่งยังให้ผลบวกได้ แม้เริ่มสเตียรอยด์ไปแล้ว (skip lesion ทำให้ผลลบไม่ตัดโรค จึงตัดชิ้นยาว ≥ 1 ซม.) หรือใช้ **ultrasound หา halo sign**\n\n**ความสัมพันธ์กับ PMR** — ผู้ป่วย PMR (ปวดเมื่อยไหล่และสะโพกสองข้าง ฝืดเช้านาน ESR สูง ตอบสนองดีมากต่อ prednisolone 12.5–25 mg/วัน) ประมาณ 15% มี GCA ร่วม และผู้ป่วย GCA ราวครึ่งหนึ่งมีอาการ PMR — **ต้องถามอาการทางตาและ jaw claudication ทุกครั้งที่เจอ PMR**\n\n**ทำไมข้ออื่นผิด** — การรอผลชิ้นเนื้อคือเหตุผลอันดับหนึ่งที่ผู้ป่วยตาบอด; ขนาด 15 mg เหมาะกับ PMR เพียงอย่างเดียวและไม่พอสำหรับ GCA; NSAID ไม่ป้องกันตาบอด; methotrexate/tocilizumab เป็นยาช่วยลดสเตียรอยด์ ไม่ใช่ยาเริ่มต้น", "pearl": "ผู้สูงอายุ + ปวดขมับ + **jaw claudication** + ESR สูง = GCA → **ให้สเตียรอยด์ทันที อย่ารอ biopsy**", "topic": "Polymyalgia rheumatica and giant cell arteritis", "src": "", "ref": ["MED32 โพย MCQ temporal arteritis", "EULAR large vessel vasculitis recommendations 2018"], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.26", "2.1.1"]}, {"id": "AIR-OLD-39", "kind": "old", "stem": "A 72-year-old woman has new temporal headache, scalp tenderness, jaw claudication and ESR 95 mm/hr. Vision is normal. What should be done first?", "choices": ["Arrange temporal artery biopsy and wait for the result before treatment", "Start high-dose corticosteroid immediately, then arrange temporal artery biopsy", "Start an NSAID and review in 1 week", "Arrange CT brain and treat only if abnormal", "Start low-dose prednisolone 10 mg daily"], "answer": 1, "explain": "**Giant cell arteritis เป็นภาวะฉุกเฉินทางตา** — ตาบอดถาวรเกิดได้ภายในไม่กี่ชั่วโมงถึงวัน จึง **ให้สเตียรอยด์ก่อน แล้วค่อยตัดชิ้นเนื้อภายใน 1-2 สัปดาห์** ซึ่งยังให้ผลบวกได้; **jaw claudication เป็นอาการที่มี likelihood ratio สูงที่สุด** ของโรคนี้", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย temporal arteritis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.1"]}, {"id": "AIR-OLD-46", "kind": "old", "stem": "A 68-year-old woman has 2 months of bilateral shoulder and hip girdle aching with prolonged morning stiffness, ESR 88 mm/hr, normal creatine kinase and no true weakness on testing. What is the most likely diagnosis and treatment?", "choices": ["Polymyositis; high-dose prednisolone plus methotrexate", "Hypothyroid myopathy; levothyroxine", "Fibromyalgia; exercise and amitriptyline", "Osteoarthritis of both shoulders; NSAID", "Polymyalgia rheumatica; low-dose prednisolone 12.5-25 mg daily with a dramatic response expected"], "answer": 4, "explain": "**PMR: ปวดเมื่อยไหล่และสะโพกสองข้าง ฝืดเช้านาน ESR สูงมาก แต่ CK ปกติและไม่มีอ่อนแรงจริง** (ขยับไม่ไหวเพราะเจ็บ ไม่ใช่แรงตก) — ตอบสนองต่อ prednisolone ขนาดต่ำอย่างรวดเร็วภายใน 24-72 ชั่วโมง (ถ้าไม่ตอบสนองให้ทบทวนการวินิจฉัย); **ต้องถามอาการของ giant cell arteritis ทุกครั้ง** เพราะพบร่วมกันได้ ~15%", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย PMR/GCA (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.1.26", "B5.2.2-3(2b)", "2.3.13-3(16)"]}]}, {"id": "air-33-09", "title": "หลอดเลือดอักเสบ — ANCA-associated และ IgA vasculitis", "minutes": 8, "summary": "ผื่นจ้ำนูนคลำได้ + ไตอักเสบ = vasculitis จนกว่าจะพิสูจน์เป็นอย่างอื่น", "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.3.13-3(2)"], "md": "**Palpable purpura** (จ้ำเลือดที่นูนคลำได้ ไม่จางเมื่อกด) คือสัญญาณของ **small-vessel vasculitis** ให้ประเมินอวัยวะภายในทันที โดยเฉพาะ **ไต (urinalysis หา dysmorphic RBC และ RBC cast) และปอด**\n\n### ANCA-associated vasculitis\n| | **GPA** (Wegener) | **MPA** | **EGPA** (Churg–Strauss) |\n|---|---|---|---|\n| ANCA | **PR3 (c-ANCA)** | **MPO (p-ANCA)** | MPO (บวกราว 40%) |\n| ลักษณะเด่น | **ทางเดินหายใจส่วนบน** — ไซนัสอักเสบเรื้อรัง น้ำมูกปนเลือด **แผลในจมูก จมูกยุบเป็นอานม้า** ก้อนในปอดที่เป็นโพรง | ไตอักเสบรุนแรง **เลือดออกในถุงลม** ไม่ค่อยมีอาการทางเดินหายใจส่วนบน | **หืดที่คุมยาก · eosinophil สูงมาก · เส้นประสาทอักเสบ (mononeuritis multiplex)** |\n| ไต | **pauci-immune crescentic GN** | เหมือนกัน | พบน้อยกว่า |\n\n**สัญญาณที่ต้องรีบที่สุด — pulmonary–renal syndrome**: ไอเป็นเลือด ภาพปอดฝ้าสองข้าง Hb ลดลง ร่วมกับ **creatinine ขึ้นเร็วและปัสสาวะมีเม็ดเลือดแดงผิดรูป**\n- ส่ง **ANCA (PR3/MPO), anti-GBM, ANA, complement, urinalysis + sediment, CXR/CT** และ **เจาะชิ้นเนื้อไตเพื่อยืนยันและบอกความรุนแรง**\n- **การรักษาระยะเหนี่ยวนำ** — **corticosteroid ขนาดสูง ร่วมกับ rituximab หรือ cyclophosphamide** · เพิ่ม **plasma exchange** เมื่อมีเลือดออกในถุงลมรุนแรงหรือไตวายรุนแรงมาก · ตามด้วยการรักษาต่อเนื่องด้วย rituximab หรือ azathioprine\n- อย่าลืม **PJP prophylaxis** และคัดกรองการติดเชื้อก่อนเริ่มยา\n\n### IgA vasculitis (Henoch–Schönlein purpura)\n- **สี่อาการหลัก**: **palpable purpura ที่ขาและก้น · ปวดข้อ · ปวดท้อง (เสี่ยง intussusception ในเด็ก) · ไตอักเสบ**\n- พบในเด็กบ่อยกว่าแต่ **ในผู้ใหญ่โรคไตรุนแรงกว่า** · มักตามหลังการติดเชื้อทางเดินหายใจส่วนบน\n- ชิ้นเนื้อพบ **IgA deposit ในผนังหลอดเลือด** (ไตเหมือน IgA nephropathy) · **complement ปกติ** ซึ่งช่วยแยกจาก SLE และ cryoglobulinemia\n- ส่วนใหญ่ **หายเองภายใน 4–8 สัปดาห์** — รักษาตามอาการและ **ติดตามปัสสาวะและความดันโลหิตต่ออีกอย่างน้อย 6 เดือน** · ให้ corticosteroid เมื่อปวดท้องรุนแรงหรือไตอักเสบรุนแรง\n", "pearls": ["Palpable purpura = small-vessel vasculitis → ตรวจปัสสาวะทันที", "PR3/c-ANCA + ทางเดินหายใจส่วนบน + ก้อนปอดเป็นโพรง = GPA", "หืดคุมยาก + eosinophil สูง + ปลายประสาทอักเสบ = EGPA", "IgA vasculitis: complement ปกติ ส่วนใหญ่หายเอง แต่ต้องตามปัสสาวะและความดัน 6 เดือน"], "items": [{"id": "AIR-MCQ-44", "kind": "mcq", "stem": "A 56-year-old man has 2 months of chronic sinusitis with bloody nasal discharge, then develops hemoptysis and acute kidney injury. Lab: creatinine 3.8 mg/dL, urinalysis protein 2+, dysmorphic RBC with red cell casts. CXR shows bilateral nodular infiltrates, some with cavitation. Which of the following is the most likely diagnosis?", "choices": ["Systemic lupus erythematosus with lupus nephritis", "Community-acquired pneumonia with acute tubular necrosis", "Granulomatosis with polyangiitis (ANCA-associated vasculitis)", "Pulmonary tuberculosis with tuberculous glomerulonephritis", "Goodpasture disease from anti-glomerular basement membrane antibody"], "answer": 2, "explain": "**Pulmonary–renal syndrome = เลือดออกในปอด + glomerulonephritis พร้อมกัน** วินิจฉัยแยกโรคหลักมี 3 กลุ่ม: ANCA-associated vasculitis, anti-GBM disease (Goodpasture) และ SLE\n\n**สิ่งที่ชี้ไปที่ granulomatosis with polyangiitis (GPA) ในเคสนี้คือ 'ทางเดินหายใจส่วนบน'** — ไซนัสอักเสบเรื้อรัง เลือดออกทางจมูก แผลในจมูก จมูกยุบ (saddle nose) ร่วมกับ **nodule ที่ปอดซึ่งเป็นโพรงได้** ซึ่ง anti-GBM และ SLE ไม่ทำ\n\n| | **GPA** | **Anti-GBM** | **SLE** |\n|---|---|---|---|\n| ทางเดินหายใจส่วนบน | **เป็นเด่น** | ไม่เป็น | ไม่เป็น |\n| ปอด | **nodule/cavity, DAH** | DAH | pleuritis |\n| แอนติบอดี | **c-ANCA (anti-PR3)** | **anti-GBM** | ANA, anti-dsDNA, **C3/C4 ต่ำ** |\n| ชิ้นเนื้อไต | pauci-immune crescentic GN | **linear IgG** | **full-house immune complex** |\n\n**การรักษา** — เป็นภาวะคุกคามอวัยวะ ต้อง induction ด้วย **สเตียรอยด์ขนาดสูง + rituximab หรือ cyclophosphamide** และพิจารณา plasma exchange ในรายที่ creatinine สูงมากหรือมี DAH รุนแรง — ยิ่งเริ่มช้า ยิ่งเสียไตถาวร\n\n**ทำไมข้ออื่นผิด** — วัณโรคมีโพรงที่ปอดได้แต่ไม่ทำให้เกิด RBC cast และ AFB จะช่วยแยก; Goodpasture ไม่เข้าไซนัส; SLE มักมี complement ต่ำและอาการหลายระบบอื่น; ปอดบวมธรรมดาไม่ทำให้เกิด glomerulonephritis", "pearl": "**ไซนัสเรื้อรัง + ปอดเป็นโพรง + ไตอักเสบ = GPA (c-ANCA/PR3)** — pulmonary-renal syndrome ต้องรีบให้ยากดภูมิ", "topic": "ANCA-associated vasculitis", "src": "", "ref": ["MED34 โพย MCQ vasculitis", "EULAR/ERA-EDTA ANCA-associated vasculitis recommendations 2022"], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)", "2.1.1"]}, {"id": "AIR-OLD-41", "kind": "old", "stem": "A 56-year-old man with chronic sinusitis and bloody nasal discharge develops hemoptysis, cavitating lung nodules and glomerulonephritis with red cell casts. Which antibody is most likely to be positive?", "choices": ["Anti-glomerular basement membrane antibody", "Anti-proteinase 3 (c-ANCA)", "Anti-centromere antibody", "Anti-double-stranded DNA", "Anti-mitochondrial antibody"], "answer": 1, "explain": "**ทางเดินหายใจส่วนบน + ปอดเป็นโพรง + ไตอักเสบ = granulomatosis with polyangiitis → c-ANCA (anti-PR3)**; anti-GBM (Goodpasture) ไม่เข้าไซนัสและไม่ทำให้เกิดโพรงในปอด; SLE จะมี complement ต่ำและอาการหลายระบบอื่น — เป็น **pulmonary-renal syndrome** ที่ต้องรีบให้สเตียรอยด์ขนาดสูงร่วมกับ rituximab หรือ cyclophosphamide", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย vasculitis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(2b)", "2.3.13-3(16)"]}, {"id": "AIR-MCQ-45", "kind": "mcq", "stem": "A 19-year-old man develops palpable purpura over both lower legs and buttocks 1 week after an upper respiratory tract infection, together with colicky abdominal pain and pain in both ankles. Lab: platelet 320,000/mm3, normal coagulation, urinalysis shows RBC 20–30/HPF with protein 1+. Which of the following is the most likely diagnosis?", "choices": ["Immune thrombocytopenia", "Meningococcemia", "Disseminated intravascular coagulation", "Acute rheumatic fever", "IgA vasculitis (Henoch-Schonlein purpura)"], "answer": 4, "explain": "**Tetrad ของ IgA vasculitis: palpable purpura ที่ขาและก้น (บริเวณที่แรงดันน้ำหนักสูง) + ปวดข้อ + ปวดท้อง + ไตอักเสบ** หลังติดเชื้อทางเดินหายใจส่วนบน — เป็น small-vessel vasculitis จากการสะสม **IgA immune complex**\n\n**จุดตัดสินที่โจทย์ให้มาคือ 'purpura ที่คลำได้นูน ร่วมกับเกล็ดเลือดปกติ'**\n- **คลำได้นูน = มีการอักเสบของผนังหลอดเลือด (vasculitis)**\n- **เกล็ดเลือดปกติและการแข็งตัวปกติ = ไม่ใช่ ITP หรือ DIC** ซึ่งจ้ำจะราบ\n\n**สิ่งที่ต้องเฝ้าระวัง** — ภาวะแทรกซ้อนที่กำหนดพยากรณ์โรคคือ **ไต** (IgA nephropathy แบบเดียวกัน) ต้องตรวจปัสสาวะและความดันเป็นระยะหลายเดือน และในเด็กต้องระวัง **intussusception** จากผนังลำไส้บวม\n\n**การรักษา** — ส่วนใหญ่หายเอง ให้ประคับประคองและ NSAID สำหรับปวดข้อ (ระวังเมื่อมีไตอักเสบ); สเตียรอยด์ใช้เมื่อปวดท้องรุนแรงหรือมีไตอักเสบมาก\n\n**ทำไมข้ออื่นผิด** — meningococcemia ป่วยหนักและ purpura ลามเร็วพร้อม shock; acute rheumatic fever ให้ข้ออักเสบย้ายที่ + หัวใจอักเสบ + erythema marginatum ไม่ใช่ purpura นูน", "pearl": "**Palpable purpura + เกล็ดเลือดปกติ = vasculitis**; ที่ขา/ก้น + ปวดท้อง + ปัสสาวะมีเลือด หลังเป็นหวัด = IgA vasculitis", "topic": "IgA vasculitis (Henoch-Schonlein purpura)", "src": "", "ref": ["MED32 โพย MCQ purpura", "Harrison 21st ed., The Vasculitis Syndromes"], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"]}, {"id": "AIR-OLD-40", "kind": "old", "stem": "A 19-year-old man has palpable purpura over both legs and buttocks, colicky abdominal pain, arthralgia and hematuria one week after an upper respiratory infection. Platelet count and coagulation tests are normal. What is the diagnosis?", "choices": ["Disseminated intravascular coagulation", "IgA vasculitis (Henoch-Schonlein purpura)", "Acute rheumatic fever", "Meningococcemia", "Immune thrombocytopenia"], "answer": 1, "explain": "**Palpable purpura + เกล็ดเลือดปกติ = vasculitis ไม่ใช่ความผิดปกติของเกล็ดเลือด**; tetrad ของ IgA vasculitis คือ purpura ที่ขาและก้น + ปวดข้อ + ปวดท้อง + ไตอักเสบ — **ไตเป็นตัวกำหนดพยากรณ์โรค** ต้องตรวจปัสสาวะและความดันเป็นระยะหลายเดือน", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED32 โพย purpura (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.3.13-3(2)", "B5.2.2-3(2b)", "2.1.50"]}]}, {"id": "air-33-10", "title": "Rheumatoid arthritis — วินิจฉัยเร็ว รักษาเร็ว", "minutes": 9, "summary": "หน้าต่างเวลา 3 เดือนแรก · methotrexate เป็นยาหลัก · และพิษที่ต้องเฝ้าระวัง", "nl": ["B5.2.2-3(4)", "2.3.13-3(12)", "B5.4(3)"], "md": "### วินิจฉัย\n- **ข้ออักเสบสมมาตรของข้อเล็ก** — **MCP, PIP, ข้อมือ, MTP** · **ฝืดตอนเช้ามากกว่า 1 ชั่วโมง** · **ไม่จับ DIP**\n- ตรวจพบ **บวมนุ่มมีน้ำ กดเจ็บ MCP squeeze test บวก** · ระยะท้ายพบ ulnar deviation, swan-neck, boutonnière\n- แล็บ: **RF และ anti-CCP** (anti-CCP จำเพาะกว่าและทำนายโรคที่กร่อนกระดูก) · ESR/CRP สูง · **ภาพรังสีเห็น marginal erosion และ periarticular osteopenia** (แต่ระยะแรกภาพปกติ — **อย่ารอ erosion ก่อนเริ่มรักษา**) · อัลตราซาวด์หรือ MRI ช่วยจับ synovitis ระยะแรก\n- อาการนอกข้อ: rheumatoid nodule, ILD, scleritis, **Felty syndrome**, ภาวะโลหิตจางเรื้อรัง, **ความเสี่ยงโรคหัวใจและหลอดเลือดเพิ่มขึ้นชัดเจน**\n\n### หลักการรักษา\n> **Window of opportunity** — เริ่ม DMARD ภายใน **3 เดือนแรก** ให้ผลระยะยาวดีที่สุด NSAIDs และ steroid เพียงคุมอาการ **ไม่ชะลอการกร่อนของข้อ** จึงห้ามใช้เดี่ยว ๆ เป็นการรักษาหลัก\n\n1. **Methotrexate คือยาหลัก (anchor drug)** — เริ่ม 7.5–15 mg **สัปดาห์ละครั้ง** ปรับขึ้นถึง 20–25 mg/สัปดาห์ **ร่วมกับ folic acid 5 mg/สัปดาห์** (คนละวันกับ MTX) เพื่อลดพิษ\n2. ใช้ **steroid ขนาดต่ำเป็นสะพาน (bridging)** ระหว่างรอ DMARD ออกฤทธิ์ (6–12 สัปดาห์) แล้วลดลง\n3. รักษาแบบ **treat-to-target** — ประเมินด้วย DAS28 ทุก 1–3 เดือน เป้าหมายคือโรคสงบหรือ low disease activity\n4. ไม่ถึงเป้า → เพิ่ม conventional DMARD อื่น (sulfasalazine, hydroxychloroquine, leflunomide) หรือเริ่ม **biologic (anti-TNF, tocilizumab, abatacept, rituximab) หรือ JAK inhibitor**\n\n### พิษที่ต้องเฝ้าระวัง\n- **Methotrexate** — กดไขกระดูก · ตับอักเสบ · **แผลในปาก** · **pneumonitis (ไข้ ไอแห้ง หอบ ฝ้าสองข้าง เกิดได้ทุกเวลา ต้องหยุดยาทันทีและให้ steroid)** · **ห้ามในหญิงตั้งครรภ์และต้องคุมกำเนิด** · ระวังในผู้ที่ไตเสื่อม (ขับทางไต) · **ห้ามใช้ร่วมกับ cotrimoxazole** เพราะเสริมฤทธิ์ยับยั้ง folate ทำให้เกิด pancytopenia\n  - ติดตาม **CBC, Cr, LFT ทุก 2–4 สัปดาห์ช่วงแรก แล้วทุก 3 เดือน** · งดสุรา\n- **ก่อนเริ่ม anti-TNF ต้องคัดกรอง latent TB (TST/IGRA + CXR) และไวรัสตับอักเสบบีเสมอ** — ถ้าพบ latent TB ต้องรักษาก่อนหรือพร้อมกันตามแนวทาง (isoniazid) เพราะ TNF จำเป็นต่อการคง granuloma\n- **Hydroxychloroquine** ตรวจตา · **Sulfasalazine** ตรวจ CBC และ LFT · **Leflunomide** ตับและความดัน\n\n### ที่อาจารย์เน้นในสไลด์\n\n**กลไกที่ต้องเล่าให้ได้** — APC นำเสนอแอนติเจนผ่าน MHC II ให้ CD4 T cell → กระตุ้น B cell และ macrophage → **TNF-α, IL-1, IL-6** ทำให้ synoviocyte สร้าง **MMP** ย่อยกระดูกอ่อน กระตุ้น **osteoclast** ให้กร่อนกระดูก และสร้าง **acute phase response (CRP, ESR สูง)** พร้อมอาการทั่วกาย (อ่อนเพลีย ไข้ ผอมลง) — นี่คือเหตุผลที่ยาชีวภาพเล็งไปที่ TNF, IL-6 และ B cell\n\n**ข้อที่ RA ชอบจับ** — ข้อเล็กของมือและแขนส่วนบนเป็นหลัก (มือ ข้อมือ ข้อศอก ไหล่) ตามด้วยเท้า ข้อเท้า เข่า สะโพก · **แกนกลางจับเฉพาะ C-spine** (ระวัง atlantoaxial subluxation ก่อนใส่ท่อช่วยหายใจ)\n\n**เกณฑ์ ACR/EULAR — คะแนนที่ต้องจำ (รวม ≥ 6 = definite RA)**\n\n| หมวด | เกณฑ์ | คะแนน |\n|---|---|---|\n| **ข้อที่บวมหรือกดเจ็บ** | ข้อกลาง–ใหญ่ 1 ข้อ | 0 |\n| | ข้อกลาง–ใหญ่ 2–10 ข้อ | 1 |\n| | **ข้อเล็ก 1–3 ข้อ** (รวมข้อมือ) | 2 |\n| | ข้อเล็ก 4–10 ข้อ | 3 |\n| | **> 10 ข้อ (ต้องมีข้อเล็กอย่างน้อย 1)** | **5** |\n| **ซีรัมวิทยา** | RF และ ACPA ลบ | 0 |\n| | บวกไทเตอร์ต่ำ (< 3 เท่าของค่าปกติ) | 2 |\n| | **บวกไทเตอร์สูง (> 3 เท่า)** | **3** |\n| **ระยะเวลาของ synovitis** | < 6 สัปดาห์ | 0 |\n| | **≥ 6 สัปดาห์** | 1 |\n| **Acute phase reactant** | CRP และ ESR ปกติ | 0 |\n| | **CRP หรือ ESR ผิดปกติ** | 1 |\n\n**ไม่นับ DIP, CMC ด้านนิ้วหัวแม่มือ และ MTP ที่ 1** เพราะเป็นข้อของข้อเสื่อมและเกาต์ — จุดนี้เป็นกับดักที่ออกสอบบ่อย\n", "pearls": ["RA จับ MCP/PIP/ข้อมือ ฝืดเช้า > 1 ชั่วโมง ไม่จับ DIP", "เริ่ม DMARD ภายใน 3 เดือนแรก — methotrexate สัปดาห์ละครั้ง + folic acid", "MTX + cotrimoxazole = pancytopenia · MTX pneumonitis ต้องหยุดยาทันที", "ก่อน anti-TNF ต้องคัดกรองวัณโรคแฝงและไวรัสตับอักเสบบี", "เกณฑ์ ACR/EULAR ไม่นับ DIP, CMC ของนิ้วหัวแม่มือ และ MTP ที่ 1", "คะแนนรวม ≥ 6 = definite RA · ข้อเล็ก > 10 ข้อ ได้ 5 คะแนนเดียวก็เกือบครบแล้ว"], "source": "สไลด์ อ.โชคชัย — SLE and systemic autoimmune disease (ส่วน RA)", "items": [{"id": "AIR-MCQ-46", "kind": "mcq", "stem": "A 44-year-old woman has had symmetric swelling of the metacarpophalangeal and wrist joints with 90 minutes of morning stiffness for 10 weeks. RF and anti-CCP are positive, ESR 48 mm/hr, and radiographs show no erosion yet. Which of the following is the most appropriate management?", "choices": ["Start a biologic agent as first-line therapy in all newly diagnosed patients", "Start long-term prednisolone 10 mg daily as the sole therapy", "Start methotrexate with folic acid promptly, using a short course of corticosteroid as a bridge", "Wait for radiographic erosions to appear before starting any disease-modifying therapy", "Start NSAID alone and reassess in 6 months before considering a DMARD"], "answer": 2, "explain": "**RA ทำลายข้ออย่างถาวรเร็วที่สุดใน 2 ปีแรก จึงมีแนวคิด 'window of opportunity' — ต้องเริ่ม DMARD ภายใน 3 เดือนแรกของอาการ ไม่ใช่รอให้เห็น erosion**\n\n**Methotrexate คือ anchor drug** เริ่ม 7.5–15 mg **สัปดาห์ละครั้ง** (ห้ามให้ทุกวัน — เป็นความผิดพลาดที่ทำให้เสียชีวิตได้) ร่วมกับ **folic acid** เพื่อลดแผลในปาก คลื่นไส้ และพิษต่อตับ ติดตาม CBC, LFT, creatinine ทุก 2–4 สัปดาห์ในช่วงแรก **ห้ามใช้ในหญิงตั้งครรภ์หรือวางแผนมีบุตร (teratogen)** และเลี่ยงเมื่อดื่มสุราหนักหรือมีโรคตับ\n\n**Corticosteroid ใช้เป็น 'สะพาน'** ขนาดต่ำระยะสั้นระหว่างรอ methotrexate ออกฤทธิ์ (6–12 สัปดาห์) แล้วลดลงจนหยุด ไม่ใช่ยาหลักระยะยาว\n\n**ก่อนให้ biologic (anti-TNF) ต้องคัดกรอง latent TB (IGRA/TST + CXR) และไวรัสตับอักเสบบีเสมอ** เพราะเสี่ยง reactivation\n\n**ทำไมข้ออื่นผิด** — NSAID ลดปวดแต่ไม่หยุดการทำลายข้อ; biologic ไม่ใช่ first line ตามแนวทางเมื่อยังไม่ได้ลอง conventional DMARD (และราคาสูง); การรอ erosion คือการรอให้เกิดความพิการถาวร; สเตียรอยด์เดี่ยวระยะยาวทำให้กระดูกพรุน เบาหวาน ติดเชื้อ", "pearl": "RA: **เริ่ม methotrexate สัปดาห์ละครั้ง + folic acid ให้เร็วที่สุด** ใช้สเตียรอยด์เป็นสะพาน และคัดกรอง TB/HBV ก่อน biologic", "topic": "Early rheumatoid arthritis — treatment", "src": "", "ref": ["MED33 โพย MCQ RA treatment", "ACR RA Treatment Guideline 2021; EULAR 2022"], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "B5.4(3)", "B5.3(5)"]}, {"id": "AIR-OLD-28", "kind": "old", "stem": "A 46-year-old woman has symmetric swelling of the MCP and PIP joints of both hands with morning stiffness of more than 30 minutes for 4 months. What is the most likely diagnosis?", "choices": ["Rheumatoid arthritis", "Reactive arthritis", "Gouty arthritis", "Septic arthritis", "Osteoarthritis"], "answer": 0, "explain": "**ข้อเล็กสองข้างสมมาตร + ฝืดเช้านาน + เป็นเรื้อรังเกิน 6 สัปดาห์ = RA**; โพยเก่าใช้เกณฑ์ 'morning stiffness > 30 นาที' แต่เกณฑ์ ACR/EULAR 2010 ให้น้ำหนักกับ **จำนวนและขนาดของข้อที่บวม ระยะเวลา ≥ 6 สัปดาห์ RF/anti-CCP และ ESR/CRP** — ฝืดเช้าเป็นเพียงลักษณะประกอบที่บ่งว่าเป็น inflammatory", "pearl": "", "topic": "", "src": "MED33 โพย MCQ ข้อ 4 'Morning stiffness more than 30 minutes — a. Rheumatoid arthritis b. Reactive arthritis' และ Joint ข้อ 2", "ref": [], "nl": ["2.3.13-3(12)", "B5.2.2-3(4)", "2.1.27"]}, {"id": "AIR-OLD-42", "kind": "old", "stem": "Which conventional DMARD is the anchor drug for newly diagnosed rheumatoid arthritis, and how is it given?", "choices": ["Prednisolone 10 mg daily as monotherapy", "Methotrexate, given once weekly with folic acid supplementation", "Allopurinol 100 mg daily", "Colchicine 0.6 mg twice daily", "Methotrexate, given once daily with folic acid"], "answer": 1, "explain": "**Methotrexate สัปดาห์ละครั้ง** (การสั่งเป็นทุกวันเป็นความผิดพลาดที่ทำให้เกิด pancytopenia และเสียชีวิตได้) ร่วมกับ **folic acid** เพื่อลดแผลในปากและพิษต่อตับ; ติดตาม CBC, LFT, creatinine; **ห้ามในหญิงตั้งครรภ์**; สเตียรอยด์ใช้เป็นสะพานระยะสั้นเท่านั้น", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED33 โพย RA treatment (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.13-3(12)"]}, {"id": "AIR-MCQ-47", "kind": "mcq", "stem": "A 50-year-old woman with rheumatoid arthritis on methotrexate 15 mg weekly for 2 years presents with fever, cough and progressive dyspnea for 2 weeks. CXR shows diffuse interstitial infiltrates. Lab: WBC 3,200/mm3, platelet 98,000/mm3, AST/ALT 95/110 U/L, creatinine 1.0 mg/dL. Which of the following is the most appropriate immediate management?", "choices": ["Give folic acid only and repeat the chest radiograph in 1 month", "Start an anti-TNF agent immediately to control the underlying disease", "Increase methotrexate because the arthritis is likely flaring", "Continue methotrexate and add an inhaled corticosteroid", "Stop methotrexate, evaluate for both opportunistic infection and methotrexate pneumonitis, and give folinic acid if cytopenia is significant"], "answer": 4, "explain": "**ผู้ป่วย RA ที่ใช้ methotrexate แล้วมีไข้ + ฝ้าในปอด ต้องแยกสองภาวะที่ต้องหยุดยาทั้งคู่**\n1. **Methotrexate pneumonitis** — hypersensitivity ต่อยา เกิดได้ทุกช่วงเวลา มาด้วยไอแห้ง เหนื่อย ไข้ ฝ้า interstitial\n2. **การติดเชื้อฉวยโอกาส** — PCP, วัณโรค, เชื้อรา จากภาวะภูมิคุ้มกันต่ำ (ยิ่งถ้าใช้สเตียรอยด์ร่วม)\n\nทั้งสองอย่างจัดการเริ่มต้นเหมือนกันคือ **หยุด methotrexate ทันที ให้ออกซิเจน ส่งตรวจหาเชื้อ (sputum, BAL) และให้ยาปฏิชีวนะครอบคลุมจนกว่าจะตัดการติดเชื้อออก**\n\n**พิษอื่นของ methotrexate** — กดไขกระดูก (เม็ดเลือดขาวและเกล็ดเลือดต่ำอย่างในเคสนี้ ให้ **folinic acid/leucovorin** ช่วยกู้), ตับอักเสบและพังผืด, แผลในปาก, คลื่นไส้ ความเสี่ยงสูงขึ้นเมื่อไตเสื่อม ใช้ร่วมกับ **trimethoprim-sulfamethoxazole** (เสริมฤทธิ์ต้าน folate จนเกิด pancytopenia ได้), NSAID ขนาดสูง หรือลืมกินโฟลิก\n\n**ทำไมข้ออื่นผิด** — การใช้ยาต่อหรือเพิ่มขนาดในภาวะนี้อันตรายถึงชีวิต; ให้โฟลิกแล้วรออีกเดือนช้าเกินไปเมื่อมีทั้งฝ้าปอดและเม็ดเลือดต่ำ; การเริ่ม anti-TNF ขณะสงสัยติดเชื้อเป็นข้อห้าม", "pearl": "Methotrexate: ไข้ + ฝ้าปอด = **หยุดยา แล้วแยก pneumonitis กับการติดเชื้อฉวยโอกาสเสมอ**; ระวังคู่กับ TMP-SMX เพราะเสี่ยง pancytopenia", "topic": "Methotrexate toxicity", "src": "", "ref": ["MED34 โพย MCQ methotrexate toxicity", "ACR RA Guideline 2021"], "nl": ["B5.4(3)", "2.3.3-3(5)", "2.3.13-3(12)"]}, {"id": "AIR-OLD-47", "kind": "old", "stem": "A patient with rheumatoid arthritis on methotrexate develops fever, dry cough and diffuse interstitial infiltrates with leukopenia. What should be done first?", "choices": ["Stop methotrexate and evaluate for both opportunistic infection and drug-induced pneumonitis", "Add an NSAID and observe", "Increase the methotrexate dose for a presumed flare", "Give folic acid and continue the same dose", "Start an anti-TNF agent immediately"], "answer": 0, "explain": "**หยุด methotrexate ทันที** แล้วแยกสองภาวะที่ต้องหยุดยาทั้งคู่: **methotrexate pneumonitis** กับ **การติดเชื้อฉวยโอกาส (PCP, TB, เชื้อรา)** ให้ยาปฏิชีวนะครอบคลุมจนกว่าจะตัดการติดเชื้อออก และให้ **folinic acid** เมื่อมี cytopenia ชัดเจน — **ห้ามเริ่ม biologic ขณะสงสัยติดเชื้อ**", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย methotrexate toxicity (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.3-3(5)"]}, {"id": "AIR-OLD-43", "kind": "old", "stem": "Before starting an anti-TNF biologic agent in rheumatoid arthritis, which screening is mandatory?", "choices": ["Latent tuberculosis (chest radiograph plus tuberculin skin test or IGRA) and hepatitis B and C serology", "Thyroid function test only", "Echocardiography in all patients only", "Serum uric acid and synovial fluid analysis", "Bone mineral density only"], "answer": 0, "explain": "**Anti-TNF ทำให้ latent TB กำเริบเป็นวัณโรคแพร่กระจาย และทำให้ไวรัสตับอักเสบบี reactivate จนตับวาย** จึงต้องคัดกรองก่อนเสมอ; นอกจากนี้ต้องประเมินการติดเชื้อที่ยังรักษาไม่หาย ประวัติมะเร็ง และภาวะหัวใจล้มเหลว (anti-TNF ทำให้แย่ลง) และควรฉีดวัคซีนเชื้อตายให้ครบก่อนเริ่มยา", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย biologic therapy (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.4(3)", "2.3.3-3(5)", "2.3.13-3(12)"]}]}, {"id": "air-33-11", "title": "Axial spondyloarthritis", "minutes": 5, "summary": "ปวดหลังแบบอักเสบในคนอายุน้อย — ขยับแล้วดีขึ้น พักแล้วแย่ลง", "nl": ["B5.2.2-3(3)", "2.3.13-3(13)"], "md": "### ปวดหลังแบบอักเสบ (inflammatory back pain) — เกณฑ์ที่ต้องจำ\n- เริ่มก่อน **อายุ 45 ปี** · เป็นมานาน **> 3 เดือน** · **ค่อยเป็นค่อยไป**\n- **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก** · **ปวดตอนกลางคืนจนตื่น และดีขึ้นเมื่อลุกเดิน** · **ฝืดตอนเช้า > 30 นาที**\n- ตรวจร่างกาย: การเคลื่อนไหวของกระดูกสันหลังลดลง (**Schober test**) การขยายของทรวงอกลดลง กดเจ็บข้อ sacroiliac\n\n### เบาะแสนอกกระดูกสันหลัง\n**Enthesitis (เอ็นร้อยหวาย ฝ่าเท้า) · dactylitis · uveitis ด้านหน้าเฉียบพลัน · สะเก็ดเงิน · โรคลำไส้อักเสบเรื้อรัง (IBD)** และประวัติครอบครัว\n\n### การตรวจ\n- **ภาพรังสีเชิงกรานหา sacroiliitis เป็นอันดับแรก** — ระยะท้ายเห็น **syndesmophyte และ bamboo spine**\n- **ถ้าภาพรังสีปกติแต่ยังสงสัยมาก ให้ทำ MRI ของ sacroiliac joint** ซึ่งเห็น **bone marrow edema** ได้ตั้งแต่ระยะที่ยังไม่เห็นในภาพรังสี (non-radiographic axSpA)\n- **HLA-B27 ช่วยสนับสนุนแต่ไม่ใช่การวินิจฉัย** (คนปกติก็บวกได้) · CRP อาจปกติ\n- อย่าสั่ง MRI กระดูกสันหลังส่วนเอวเป็นอันดับแรกโดยไม่ประเมิน sacroiliac joint\n\n### การรักษา\n1. **กายภาพบำบัดและการออกกำลังกายอย่างสม่ำเสมอเป็นหัวใจ** — ช่วยคงท่าทางและการเคลื่อนไหว\n2. **NSAIDs อย่างต่อเนื่องเป็นยาอันดับแรก**\n3. ไม่ตอบสนอง → **anti-TNF หรือ anti-IL-17 (secukinumab)** — **conventional DMARD เช่น methotrexate และ sulfasalazine ไม่ได้ผลกับโรคที่แกนกลาง** ใช้ได้เฉพาะข้อส่วนปลาย\n4. เลิกบุหรี่ · ประเมินกระดูกพรุนซึ่งพบร่วมบ่อย · เฝ้าระวังกระดูกสันหลังหักแม้อุบัติเหตุเบา\n", "pearls": ["ปวดหลังที่ดีขึ้นเมื่อขยับและปวดจนตื่นกลางคืน = inflammatory back pain", "ภาพรังสีปกติแต่สงสัยมาก ให้ทำ MRI ของ sacroiliac joint", "Methotrexate ไม่ได้ผลกับโรคแกนกลาง — ใช้ NSAIDs แล้วต่อด้วย anti-TNF"], "items": [{"id": "AIR-MCQ-49", "kind": "mcq", "stem": "A 27-year-old man has had low back pain for 18 months. The pain wakes him in the second half of the night, is associated with more than 45 minutes of morning stiffness, improves with exercise and worsens with rest. He had one episode of painful red eye with photophobia last year. Which of the following is the most appropriate initial management after confirming sacroiliitis?", "choices": ["Bed rest for 2 weeks and opioid analgesia", "Methotrexate as first-line therapy for axial disease", "Systemic corticosteroid as long-term maintenance therapy", "Regular exercise and physiotherapy with a full-dose NSAID, escalating to a biologic if the response is inadequate", "Lumbar spine surgery"], "answer": 3, "explain": "**Inflammatory back pain แยกจาก mechanical back pain ด้วย 5 ข้อ**: เริ่มก่อนอายุ 45, ค่อยเป็นค่อยไป, **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก**, **ตื่นกลางดึกช่วงครึ่งหลัง**, ข้อฝืดเช้านานเกิน 30 นาที — เคสนี้เข้าทุกข้อ และมี **acute anterior uveitis** ซึ่งเป็นอาการนอกข้อที่พบบ่อยที่สุดของ spondyloarthritis (สัมพันธ์กับ HLA-B27)\n\n**การรักษา**\n1. **ออกกำลังกายและกายภาพบำบัดสม่ำเสมอ เป็นรากฐานที่สำคัญที่สุด** เพื่อรักษาพิสัยการเคลื่อนไหวและป้องกันหลังยึดติด\n2. **NSAID ขนาดเต็ม** เป็นยาตัวแรก (ตอบสนองดีมากจนใช้ช่วยวินิจฉัยได้) ลองอย่างน้อย 2 ตัว ตัวละ 2–4 สัปดาห์\n3. ถ้ายังคุมไม่ได้ → **anti-TNF หรือ anti-IL-17** (คัดกรอง TB/HBV ก่อน)\n\n**ข้อที่ออกสอบบ่อย** — **conventional DMARD เช่น methotrexate และ sulfasalazine ไม่ได้ผลกับโรคแกนกลาง (axial)** ใช้ได้เฉพาะเมื่อมีข้อส่วนปลายอักเสบร่วม\n\n**ทำไมข้ออื่นผิด** — การนอนพักทำให้อาการแย่ลงและเร่งการยึดติด; สเตียรอยด์ระบบระยะยาวไม่มีประโยชน์ในโรคแกนกลางและมีโทษ; การผ่าตัดสงวนไว้สำหรับความผิดรูปรุนแรงหรือกระดูกหัก", "pearl": "Inflammatory back pain (ดีขึ้นเมื่อขยับ ตื่นกลางดึก ฝืดเช้านาน) + uveitis = axial SpA → **ออกกำลังกาย + NSAID เต็มขนาด; methotrexate ไม่ช่วยโรคแกนกลาง**", "topic": "Axial spondyloarthritis", "src": "", "ref": ["MED31 โพย MCQ ankylosing spondylitis", "ASAS-EULAR axial SpA recommendations 2022"], "nl": ["B5.2.2-3(3)", "2.3.13-3(13)", "2.1.26"]}, {"id": "AIR-OLD-45", "kind": "old", "stem": "A 27-year-old man has chronic low back pain that improves with exercise, wakes him in the early morning, with morning stiffness of 1 hour and a past episode of acute anterior uveitis. What is the most likely diagnosis?", "choices": ["Mechanical low back pain", "Lumbar disc herniation", "Axial spondyloarthritis (ankylosing spondylitis)", "Vertebral compression fracture", "Fibromyalgia"], "answer": 2, "explain": "**Inflammatory back pain**: อายุน้อยกว่า 45, ค่อยเป็นค่อยไป, **ดีขึ้นเมื่อขยับ แย่ลงเมื่อพัก**, ตื่นกลางดึกช่วงครึ่งหลัง, ฝืดเช้า > 30 นาที + **uveitis** ซึ่งเป็นอาการนอกข้อที่พบบ่อยที่สุด (สัมพันธ์กับ HLA-B27); รักษาด้วย **ออกกำลังกาย + NSAID เต็มขนาด** และ anti-TNF/anti-IL-17 เมื่อไม่ตอบสนอง — **methotrexate ไม่ได้ผลกับโรคแกนกลาง**", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED31 โพย ankylosing spondylitis (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["B5.2.2-3(3)", "2.3.13-3(13)", "2.1.26"]}]}, {"id": "air-33-12", "title": "ไข้ ผื่น ปวดข้อ — Still disease และโรคเลียนแบบ", "minutes": 6, "summary": "วินิจฉัยแยกโรคเมื่อไข้ไม่ทราบสาเหตุร่วมกับข้ออักเสบ", "nl": ["2.1.1", "2.3.13"], "md": "### Adult-onset Still disease (AOSD)\n- **ไข้สูงเป็นแบบ quotidian** (สูงลอยวันละ 1–2 ครั้ง มักช่วงเย็น แล้วลงเป็นปกติ) ติดต่อกันหลายสัปดาห์\n- **ผื่นสีส้มแซลมอน (evanescent salmon-coloured rash)** ที่ขึ้นพร้อมไข้แล้วจางหายไปเมื่อไข้ลง\n- **ข้ออักเสบหรือปวดข้อ** · **เจ็บคอ** เป็นอาการนำที่พบบ่อยและมักถูกมองข้าม · ต่อมน้ำเหลืองโต ตับม้ามโต\n- แล็บ: **เม็ดเลือดขาวสูงมากโดยเด่น neutrophil · ESR/CRP สูงมาก · ferritin สูงผิดปกติ (มักเกิน 5 เท่าของค่าปกติ) · ANA และ RF ลบ** · ตับอักเสบเล็กน้อย\n- **เป็นการวินิจฉัยแยกโรค** — ต้องตัด **การติดเชื้อ (hemoculture, เยื่อบุหัวใจอักเสบ, วัณโรค, ไวรัส) มะเร็งต่อมน้ำเหลือง และโรคภูมิต้านตนเองอื่น** ให้ได้ก่อนเสมอ ใช้เกณฑ์ Yamaguchi ช่วย\n- ภาวะแทรกซ้อนที่อันตรายคือ **macrophage activation syndrome** — ไข้ไม่ลด **เม็ดเลือดต่ำลงทุกสาย ferritin สูงมาก ไตรกลีเซอไรด์สูง fibrinogen ต่ำ** ต้องรีบรักษาด้วย steroid ขนาดสูง ± anakinra\n- รักษา: NSAIDs ในรายเบา · **corticosteroid เป็นหลัก** · methotrexate ช่วยลด steroid · **anti-IL-1 (anakinra) หรือ anti-IL-6 (tocilizumab)** ในรายดื้อ\n\n### ต้องแยกจากอะไรบ้าง\n| กลุ่มอาการ | เบาะแส |\n|---|---|\n| **การติดเชื้อไวรัสเฉียบพลัน (HIV acute retroviral syndrome, dengue, chikungunya, parvovirus B19, rubella)** | **ไข้ ผื่น ปวดข้อ ต่อมน้ำเหลืองโต แผลในปาก ในคนหนุ่มสาว — ต้องซักประวัติเสี่ยงและตรวจ HIV (ใช้ HIV RNA หรือ 4th-generation antigen/antibody เพราะ antibody อย่างเดียวอาจยังลบ)** · parvovirus ทำให้ปวดข้อเหมือน RA แต่หายเอง · chikungunya ปวดข้อรุนแรงและอาจเรื้อรังเป็นเดือน |\n| **เยื่อบุหัวใจอักเสบติดเชื้อ** | ไข้ + เสียงฟู่ใหม่ + emboli — ต้องเจาะ hemoculture ก่อนให้ยา |\n| **มะเร็งเม็ดเลือดและต่อมน้ำเหลือง** | น้ำหนักลด เหงื่อออกกลางคืน ต่อมน้ำเหลืองโตแข็งไม่เจ็บ LDH สูง |\n| **SLE** | ANA/anti-dsDNA บวก complement ต่ำ ปัสสาวะผิดปกติ |\n| **ไข้จากยา** | สัมพันธ์กับการเริ่มยา eosinophilia |\n", "pearls": ["ไข้สูงลอยรายวัน + ผื่นส้มแซลมอนที่มาพร้อมไข้ + ferritin สูงมาก + ANA/RF ลบ = AOSD", "AOSD เป็นการวินิจฉัยแยกโรค ต้องตัดการติดเชื้อและมะเร็งก่อนเสมอ", "คนหนุ่มสาวที่มีไข้ ผื่น ปวดข้อ ต่อมน้ำเหลืองโต ต้องนึกถึง acute HIV และตรวจด้วยวิธีที่จับระยะแรกได้"], "items": [{"id": "AIR-MCQ-50", "kind": "mcq", "stem": "A 28-year-old woman has 3 weeks of daily fever spiking to 39.5 C in the evening, a salmon-coloured evanescent rash appearing with the fever, sore throat, and arthralgia of the wrists and knees. Lab: WBC 19,000/mm3 with 88% neutrophils, ferritin 8,400 ng/mL, ESR 95 mm/hr, ANA and RF negative, blood cultures negative twice, echocardiography normal. Which of the following is the most likely diagnosis?", "choices": ["Adult-onset Still disease", "Rheumatoid arthritis with extra-articular features", "Infective endocarditis", "Acute leukemia", "Systemic lupus erythematosus"], "answer": 0, "explain": "**ไข้สูงเป็นเวลาเดิมทุกวัน + ผื่นสีปลาแซลมอนที่โผล่พร้อมไข้แล้วหายไป + เจ็บคอ + ปวดข้อ + เม็ดเลือดขาวสูงชนิด neutrophil + ferritin สูงลิ่ว + ANA/RF ลบ = adult-onset Still disease (AOSD)**\n\n**Ferritin ที่สูงเกิน 5 เท่าของค่าปกติ มีความไวสูงมากสำหรับ AOSD** (ยิ่งจำเพาะขึ้นเมื่อ glycosylated ferritin ต่ำกว่า 20%) เพราะเป็น autoinflammatory ที่ IL-1, IL-6 และ IL-18 สูง\n\n**AOSD เป็นการวินิจฉัยแบบตัดโรคอื่นออกก่อน (Yamaguchi criteria)** — ต้องตัดการติดเชื้อ (โดยเฉพาะ **infective endocarditis, วัณโรค, ไวรัส**), มะเร็ง (**ลิมโฟมาและมะเร็งเม็ดเลือดขาว**) และโรคภูมิต้านตนเองอื่นออกให้หมดก่อน ซึ่งโจทย์ทำให้แล้วด้วยการเพาะเชื้อและ echocardiography\n\n**ภาวะแทรกซ้อนที่ต้องระวังคือ macrophage activation syndrome** — ไข้ไม่ลด เม็ดเลือดต่ำลงทุกซีรีส์ ferritin พุ่งสูงขึ้นอีก ไตรกลีเซอไรด์สูง fibrinogen ต่ำ ตับวาย ต้องรีบให้สเตียรอยด์ขนาดสูง\n\n**การรักษา** — NSAID ในรายที่ไม่รุนแรง, สเตียรอยด์เป็นหลัก, ตามด้วย methotrexate หรือยาต้าน IL-1/IL-6 ในรายที่ต้องพึ่งสเตียรอยด์", "pearl": "ไข้รายวัน + ผื่นแซลมอนตามไข้ + เจ็บคอ + **ferritin สูงมาก + ANA/RF ลบ = AOSD** แต่ต้องตัดติดเชื้อและมะเร็งออกก่อนเสมอ", "topic": "Adult-onset
