otherwise specified)** |\n| **IF** | **ปกติ หรือติด IgM, C1q และ C3 เฉพาะบริเวณที่เป็นแผลเป็น** (เป็นการดักจับแบบ nonspecific ไม่ใช่ immune complex จริง) |\n| **EM** | **ดูขอบเขตของ foot process effacement** — **primary มัก effacement แพร่กระจายทั้งหมด** ส่วน **secondary มัก effacement เป็นหย่อม ๆ** |\n\n> **จุดแยก primary กับ secondary ที่ใช้ตัดสินการรักษา** — **primary FSGS** มักมาแบบ **เฉียบพลัน โปรตีนมาก albumin ต่ำ ครบเกณฑ์ nephrotic และ EM effacement ทั้งหมด → ให้ยากดภูมิคุ้มกัน** ส่วน **secondary FSGS** มักมาแบบ **ค่อยเป็นค่อยไป โปรตีนน้อยกว่า albumin มักปกติ และ EM effacement เป็นหย่อม → รักษาที่ต้นเหตุ + ACEI/ARB ไม่ให้ steroid**\n\n### กับดักที่คนพลาดจริง\n- **โปรตีนรั่วระดับ nephrotic แต่ albumin ปกติ** เป็นภาพคลาสสิกของ **secondary FSGS จากความอ้วน** — ให้ steroid ไปก็ไม่ได้ผลและได้ผลข้างเคียงฟรี\n- **ผู้ป่วย HIV ที่โปรตีนรั่วมากและอัลตราซาวด์เห็น \"ไตโตทั้งสองข้างและ echo เพิ่มขึ้น\"** = **HIVAN (collapsing FSGS)** — ผิดจากโรคไตเรื้อรังทั่วไปที่ไตมักเล็กลง · **การรักษาหลักคือยาต้านไวรัส**\n- **รอยแผลเป็นเป็นเส้นตามแนวหลอดเลือดที่แขน** = การฉีดสารเสพติดเข้าหลอดเลือดดำ → นึกถึง **heroin-associated nephropathy ซึ่งมักเป็น FSGS** และต้อง **คัดกรอง HIV, ไวรัสตับอักเสบบีและซี รวมถึงลิ้นหัวใจอักเสบติดเชื้อ** เสมอ\n- **FSGS กลับเป็นซ้ำในไตที่ปลูกถ่ายได้เร็วมาก (เป็นชั่วโมงถึงวัน)** ซึ่งเป็นหลักฐานสนับสนุนว่ามี circulating factor จริง", "pearls": ["FSGS ต่างจาก MCD ตรงที่มีความดันสูง เลือดในปัสสาวะ และ Cr ขึ้นได้บ่อย (30–65%)", "เจาะไตได้ผลเป็น MCD แต่ไม่ตอบสนอง steroid ให้สงสัย FSGS ที่เจาะพลาดบริเวณรอยโรค", "Primary FSGS: เฉียบพลัน + ครบเกณฑ์ nephrotic + EM effacement ทั้งหมด → ให้ยากดภูมิ · Secondary: ค่อยเป็นค่อยไป + albumin ปกติ + effacement เป็นหย่อม → รักษาต้นเหตุ + ACEI/ARB", "HIV + โปรตีนมหาศาล + ไตโตสองข้าง echo เพิ่ม = HIVAN (collapsing FSGS) รักษาด้วยยาต้านไวรัส", "อ้วนมาก ไตข้างเดียว หรือหลังตัดไต ทำให้เกิด FSGS จาก hyperfiltration — รักษาด้วยการลดความดันในโกลเมอรูลัส ไม่ใช่ steroid"], "items": [{"id": "N-MCQ-09", "kind": "mcq", "stem": "A 25-year-old man is evaluated for swelling of the feet and legs. He has a 5-year history of HIV infection and has refused antiretroviral therapy. Vital signs: temperature normal, BP 138/84 mmHg, PR 86/min, RR 20/min, BMI 23. Cardiopulmonary and abdominal examinations are normal. There is 2+ presacral and 3+ bilateral lower extremity oedema. Laboratory studies: CD4 count 140 cells/microlitre, HIV RNA 120,000 copies/mL, HBsAg negative, anti-HCV negative, VDRL negative, ANA negative, BUN/creatinine 18/1.5 mg/dL, urine examination protein 4+ with RBC 2-3/HPF and WBC 2-3/HPF, 24-hour urine protein 12 grams. Renal ultrasonography shows bilaterally enlarged kidneys with increased echogenicity. Which of the following is the most likely diagnosis?", "choices": ["Minimal change disease", "IgA nephropathy", "Collapsing focal segmental glomerulosclerosis", "Membranous nephropathy", "Post-infectious glomerulonephritis"], "answer": 2, "explain": "กลไก: **HIV-associated nephropathy (HIVAN)** ลักษณะทางพยาธิวิทยาคือ **collapsing focal segmental glomerulosclerosis (collapsing FSGS)** ร่วมกับ **microcystic tubular dilatation** และ **tubulointerstitial inflammation**\n- ไวรัส HIV เข้า podocyte และ tubular epithelial cell โดยตรง, **ยีน nef และ vpr** ทำให้ podocyte สูญเสีย differentiation, เกิด proliferation และ collapse ของ glomerular capillary tuft\n- พบมากใน **ผู้ที่มีเชื้อสายแอฟริกัน** ซึ่งสัมพันธ์กับ **APOL1 risk allele (G1/G2)**\n- เกิดใน **ผู้ที่ CD4 ต่ำและ viral load สูง ไม่ได้รับ ART** → ตรงกับโจทย์ (CD4 140, viral load 120,000, ปฏิเสธการรักษา)\n\nเบาะแสที่ \"ชี้\" HIVAN ในโจทย์:\n1. **Proteinuria หนักมาก 12 g/day** (massive, มักเกิน 10 g)\n2. **Renal insufficiency ดำเนินเร็ว** (Cr 1.5 และมีแนวโน้มแย่ลง)\n3. **ไตโตทั้งสองข้างและ echogenicity สูง** — ลักษณะค่อนข้างจำเพาะของ HIVAN (โรค nephrotic อื่นไตมักขนาดปกติ)\n4. **ไม่มี hypertension เด่น** แม้มี nephrotic รุนแรง\n5. serology อื่นลบทั้งหมด (ตัด HBV-related membranous, HCV-related MPGN, lupus, syphilis)\n\nทำไมข้ออื่นผิด:\n- **IgA nephropathy**: มาเป็น **nephritic** (gross haematuria หลังติดเชื้อทางเดินหายใจบน \"synpharyngitic\", dysmorphic RBC, RBC cast) โดย proteinuria มัก sub-nephrotic; ไตขนาดปกติ\n- **Post-infectious GN**: เกิด **1-3 สัปดาห์หลังการติดเชื้อ** (strep) ด้วยภาพ nephritic เฉียบพลัน (HT, cola-coloured urine, oliguria, **low C3**) ไม่ใช่ nephrotic 12 g\n- **Membranous nephropathy**: เป็นสาเหตุ nephrotic ที่พบบ่อยในผู้ใหญ่วัยกลาง-สูงอายุ; ใน HIV พบได้แต่น้อยกว่า และมักสัมพันธ์กับ **HBV co-infection (โจทย์ HBsAg ลบ)**; ไตขนาดปกติ และมักมี anti-PLA2R ในรูปแบบ primary\n- **Minimal change disease**: พบมากในเด็ก, onset เฉียบพลันมาก, **ไตขนาดปกติ, renal function ปกติ**, ตอบสนองต่อ steroid ดีมาก — ไม่เข้ากับไตโต echogenic และ Cr ขึ้น\n\nการรักษา: **เริ่ม ART ทันที** (เป็นการรักษาหลักที่เปลี่ยน prognosis), **ACEI/ARB** ลด proteinuria และชะลอการเสื่อม, พิจารณา **corticosteroid** ในบางราย, และดูแลตามหลัก CKD", "pearl": "ใน HIV ที่มีโรคไต ต้องแยก 3 กลุ่ม: **(1) HIVAN (collapsing FSGS) (2) HIV-immune complex kidney disease (3) โรคไตจากยา** เช่น **tenofovir disoproxil fumarate → proximal tubulopathy/Fanconi syndrome** และ **indinavir/atazanavir → crystalluria/นิ่ว**", "topic": "HIV-associated nephropathy", "src": "", "ref": ["MED31 past paper loop C&D – A 25 year-old man with 5 year history of HIV refused treatment, 24-hr urine protein 12 g, U/S bilaterally enlarged kidneys with increased density (เฉลยในโพยเขียนกำกับว่า HIV nephropathy)", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 66 – 20 yo male, heavy proteinuria (nephrotic-range) → Minimal change disease", "MED34 MCQ ครั้งที่ 4 ข้อ 90 – Nephrotic ตอบ membranous nephropathy", "MED32 MCQ ข้อ 80 – lab มี protein positive, RBC positive → Ans: Membranous"], "nl": ["B9.2.2(4)", "2.3.14(12)"]}, {"id": "N-OLD-023", "kind": "old", "stem": "A 25-year-old man with untreated HIV has 24-hour urine protein 12 g and ultrasound showing bilaterally enlarged echogenic kidneys. What is the most likely lesion?", "choices": ["Post-infectious glomerulonephritis", "Minimal change disease", "Membranous nephropathy", "Collapsing focal segmental glomerulosclerosis (HIV-associated nephropathy)", "Amyloidosis"], "answer": 3, "explain": "**HIVAN**: โปรตีนรั่วมาก ไตวายเร็ว และ **ไตโตทั้งสองข้างทั้งที่การทำงานแย่ลง** (ต่างจากโรคไตเรื้อรังอื่นที่ไตเล็ก) พบมากในผู้มีเชื้อสายแอฟริกัน (APOL1) — การรักษาหลักคือ **เริ่มยาต้านไวรัสทันที** ร่วมกับ ACEI/ARB", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.1"]}, {"id": "N-OLD-024", "kind": "old", "stem": "A 37-year-old man with generalised oedema, albumin 2.8 g/dL, urine protein 3+ without significant RBC or WBC, and linear scars over the arms has which likely underlying cause?", "choices": ["Minimal change disease", "Membranous nephropathy from hepatitis B", "Diabetic nephropathy", "Focal segmental glomerulosclerosis related to intravenous drug use", "Acute post-streptococcal glomerulonephritis"], "answer": 3, "explain": "รอยแผลเป็นตามแนวเส้นเลือดบ่งชี้การฉีดสารเสพติดเข้าหลอดเลือดดำ — **heroin-associated nephropathy มักเป็น FSGS** (ต้องคัดกรอง HIV, ไวรัสตับอักเสบบีและซี, และ endocarditis ร่วมด้วยเสมอ)", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.1"]}]}, {"id": "nephro-14-08", "title": "Membranous nephropathy — nephrotic ของผู้ใหญ่ที่ต้องตามหามะเร็ง", "minutes": 9, "summary": "Subepithelial deposit กับ spike · กฎสามส่วน · ลิ่มเลือดอุดตันที่พบบ่อยที่สุดในกลุ่มโรคไต", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.2"], "md": "**กลไก** — แอนติบอดี (ที่พบบ่อยที่สุดคือ **anti-PLA2R**) จับกับแอนติเจนบนผิว podocyte **ด้านที่หันออกนอกหลอดเลือด** เกิดเป็น immune complex สะสมอยู่ **ใต้ podocyte เหนือ GBM = subepithelial** ตำแหน่งนี้สำคัญมาก เพราะ **complement ที่ถูกกระตุ้น (C5b-9) ทำร้าย podocyte ได้โดยตรง แต่เซลล์อักเสบในกระแสเลือดเข้าไม่ถึง** เนื่องจากถูก GBM กั้นไว้\n\n> **นี่คือเหตุผลที่ MN เป็นโรคที่ \"โปรตีนรั่วมากแต่ไม่อักเสบ\"** — จึงมาแบบ **ตะกอนปัสสาวะสะอาด ไม่มีความดันสูงชัดเจน และการทำงานของไตปกติหรือลดลงเล็กน้อย** ต่างจากโรคที่ deposit อยู่ **ใต้ endothelium (subendothelial)** อย่าง lupus class IV ซึ่งเซลล์อักเสบเข้าถึงได้เต็มที่จึงออกมาเป็น nephritic รุนแรง\n\n### ใครเป็น\n- **ผู้ใหญ่อายุมากกว่า 40 ปี (พบมากช่วง 30 – 50 ปี)**\n- **ชาย : หญิง = 2 – 3 : 1**\n- เป็นสาเหตุอันดับต้นของ nephrotic syndrome ในผู้ใหญ่ที่ไม่ได้เป็นเบาหวาน\n\n### ภาพทางคลินิก\n- **มากกว่า 80% มีโปรตีนมากกว่า 3 g/วัน**\n- **เริ่มแบบค่อยเป็นค่อยไปเกือบทุกราย (insidious onset)**\n- **ตะกอนปัสสาวะสะอาด (bland urine sediment)**\n- **Microscopic hematuria เล็กน้อย 30 – 40%**\n- **ความดันโลหิตสูง 15 – 55%**\n- **การทำงานของไตปกติหรือลดลงเล็กน้อย**\n- **Hypoalbuminemia · LDL และ VLDL สูง**\n- **ลิ่มเลือดอุดตัน — renal vein thrombosis, PE, DVT**\n- **ความเสี่ยงมะเร็งเพิ่มขึ้นตามอายุ**\n\n**กฎสามส่วน (rule of thirds) ของธรรมชาติโรค** — **หายเองประมาณ 30% · คงที่ 30% · ดำเนินโรคแย่ลง 30%** จึงเป็นเหตุผลที่**ไม่ได้ให้ยากดภูมิคุ้มกันทุกราย** แต่ให้เฉพาะรายที่เสี่ยงสูง\n\n### สาเหตุทุติยภูมิ — ต้องไล่ให้ครบก่อนเรียกว่า primary\n\n| กลุ่ม | ตัวอย่าง |\n|---|---|\n| **การติดเชื้อ** | **HBV, HCV, HIV** · ปรสิต (filariasis, schistosomiasis, malaria) · โรคเรื้อน · ซิฟิลิส |\n| **มะเร็ง** | **solid tumor — ปอด 26% · ต่อมลูกหมาก 15% · โรคเลือด 14% · ลำไส้ใหญ่ 11%** · mesothelioma · melanoma |\n| **โรคภูมิต้านตนเอง** | **SLE (class V)** · thyroiditis · เบาหวาน · rheumatoid arthritis · **Sjögren syndrome** · dermatomyositis · MCTD · ankylosing spondylitis · IgG4-related disease |\n| **ยาและสารพิษ** | **NSAIDs และ COX-2 inhibitor** · gold · **d-penicillamine** · captopril · anti-TNFα · **ปรอท** · lithium · formaldehyde |\n| **Alloimmune** | graft versus host disease · MN ที่เกิดใหม่ในไตปลูกถ่าย |\n\n### พยาธิสภาพ\n\n| | สิ่งที่เห็น |\n|---|---|\n| **LM** | **GBM หนาตัวทั่วทั้งหมด (diffuse thickening)** · ย้อม silver เห็น **spike appearance** — คือเนื้อ GBM ที่งอกแทรกขึ้นมาระหว่างก้อน deposit |\n| **IF** | **IgG และ C3 ติดเป็นเม็ดละเอียดตลอดแนวผนังหลอดเลือดฝอย (diffuse granular capillary wall staining)** |\n| **EM** | **Subepithelial electron dense deposit** |\n\n### การสืบค้นที่ต้องทำ (แนวทาง KDIGO 2021)\n- **ตรวจ anti-PLA2R antibody ในเลือด** — ถ้าบวกร่วมกับภาพทางคลินิกที่เข้าได้ **บางรายไม่จำเป็นต้องเจาะไต** และใช้ระดับแอนติบอดีติดตามการตอบสนองต่อการรักษาได้\n- **คัดกรองมะเร็งตามอายุและเพศ** — โดยเฉพาะ **anti-PLA2R ลบ** ซึ่งเพิ่มโอกาสเป็น secondary\n- **ตรวจ HBsAg, anti-HCV, anti-HIV, ANA และทบทวนรายการยา (โดยเฉพาะ NSAIDs)**\n\n> **ข้อที่สไลด์ยังไม่ได้ลงรายละเอียด** — anti-PLA2R เป็นเครื่องมือมาตรฐานของ **KDIGO 2021** ที่เปลี่ยนเวชปฏิบัติไปมาก (พบบวกราว 70 – 80% ของ primary MN) และปัจจุบัน **rituximab เป็นทางเลือกแรกของ primary MN ที่เสี่ยงปานกลางถึงสูง** แทนสูตร cyclophosphamide สลับ steroid แบบเดิม\n\n### กับดักที่คนพลาดจริง\n- **ผู้ใหญ่อายุมากที่เป็น nephrotic + microscopic hematuria ต้องตามหามะเร็งเสมอ** — MN เป็นชนิดที่สัมพันธ์กับมะเร็งมากที่สุด และมะเร็งอาจเจอหลังวินิจฉัยโรคไตเป็นเดือนถึงปี\n- **Renal vein thrombosis พบใน MN บ่อยที่สุดในบรรดาโรค nephrotic ทั้งหมด** — สงสัยเมื่อมี **ปวดสีข้างเฉียบพลัน ปัสสาวะเป็นเลือดมากขึ้น หรือ Cr สูงขึ้นทันที** ให้ส่ง CT venography\n- **อย่ารีบให้ยากดภูมิคุ้มกัน** เพราะหายเองได้ 30% — ให้การรักษาประคับประคอง (ACEI/ARB, ควบคุมความดัน, statin, ลดเกลือ) ก่อน แล้วประเมินความเสี่ยงซ้ำ\n- **MN จาก SLE คือ class V** ต้องแยกออกจาก primary MN ให้ได้ เพราะแนวทางรักษาต่างกัน — เบาะแสคือ **IF ติดแบบ full house และมี deposit ที่ mesangium ร่วมด้วย**", "pearls": ["MN: LM เห็น GBM หนาและ spike · IF เห็น IgG กับ C3 เป็นเม็ดตลอดแนวผนัง · EM เห็น subepithelial deposit", "Deposit อยู่ subepithelial เซลล์อักเสบเข้าไม่ถึง จึงโปรตีนรั่วมากแต่ตะกอนปัสสาวะสะอาด", "กฎสามส่วน: หายเอง 30% คงที่ 30% แย่ลง 30% — จึงไม่ให้ยากดภูมิทุกราย", "ผู้ใหญ่อายุมากเป็น MN ต้องคัดกรองมะเร็ง โดยเฉพาะปอด ต่อมลูกหมาก โรคเลือด และลำไส้ใหญ่", "MN เป็นโรคที่เกิด renal vein thrombosis บ่อยที่สุด — ปวดสีข้าง + เลือดในปัสสาวะมากขึ้น + Cr ขึ้นทันที ให้นึกถึง"], "items": [{"id": "N-OLD-020", "kind": "old", "stem": "A 55-year-old man with nephrotic syndrome and microscopic haematuria is found to have an underlying solid organ malignancy. Which glomerular lesion is most likely?", "choices": ["Minimal change disease", "Post-streptococcal glomerulonephritis", "IgA nephropathy", "Membranous nephropathy", "Thin basement membrane disease"], "answer": 3, "explain": "**Membranous nephropathy เป็นสาเหตุ nephrotic ที่พบบ่อยในผู้ใหญ่และสัมพันธ์กับสาเหตุทุติยภูมิ** — มะเร็ง (ปอด ลำไส้ใหญ่ เต้านม), ไวรัสตับอักเสบบี, SLE, ยา (NSAID, penicillamine); ชนิดปฐมภูมิตรวจพบ **anti-PLA2R antibody**", "pearl": "", "topic": "", "src": "MED32 MCQ ข้อ 80 / MED34 MCQ ครั้งที่ 4 ข้อ 9", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.2"]}, {"id": "NEPHRO-14-08-Q1", "kind": "own", "stem": "A 58-year-old man has 6 months of progressive leg swelling. Urine protein is 6 g/day with a bland sediment, albumin 2.4 g/dL and creatinine 1.0 mg/dL. Kidney biopsy shows diffuse thickening of the capillary walls with silver-positive spikes, granular IgG and C3 along the capillary wall on immunofluorescence, and subepithelial electron dense deposits. Which investigation is most important to perform next?", "choices": ["Serum ANCA and pulse cyclophosphamide without further testing", "Serum anti-PLA2R antibody together with age-appropriate malignancy screening and viral serology", "Repeat kidney biopsy in 6 weeks to look for crescents", "Anti-GBM antibody and urgent plasma exchange", "Renal artery duplex ultrasound to exclude renal artery stenosis"], "answer": 1, "explain": "ภาพชิ้นเนื้อ (**GBM หนา + spike, IgG/C3 แบบ granular ตามผนัง, subepithelial deposit**) คือ **membranous nephropathy** เต็มรูปแบบ · คำถามถัดไปตามโครง 6 ข้อของคาบนี้คือ **\"primary หรือ secondary\"** จึงต้องส่ง **anti-PLA2R** (บวกราว 70–80% ของ primary) พร้อม **คัดกรองมะเร็งตามอายุและเพศ** และ **serology ของ HBV/HCV/HIV กับ ANA** — ถ้า anti-PLA2R ลบ โอกาสเป็น secondary สูงขึ้นมาก จึงต้องตามหาต้นเหตุให้เจอก่อนตัดสินใจให้ยากดภูมิคุ้มกัน\n\n- **Anti-GBM + plasma exchange** ใช้กับ **anti-GBM disease** ซึ่งมาแบบ **RPGN** ไตวายเร็วและมี crescent ไม่ใช่ nephrotic ที่ตะกอนสะอาดและ Cr ปกติ\n- **ANCA + cyclophosphamide** ใช้กับ **pauci-immune crescentic GN** ซึ่ง **IF แทบไม่ติดสี** ตรงข้ามกับผู้ป่วยรายนี้ที่ติด IgG/C3 ชัดเจน\n- **เจาะชิ้นเนื้อซ้ำ** ไม่มีประโยชน์ เพราะได้การวินิจฉัยทางพยาธิวิทยาครบแล้ว สิ่งที่ยังขาดคือสาเหตุ\n- **Renal artery stenosis** ทำให้ความดันสูงและไตเสื่อม **ไม่ทำให้โปรตีนรั่วระดับ nephrotic และไม่มี deposit**", "pearl": "เจอ MN ในชิ้นเนื้อแล้วงานยังไม่จบ — ต้องส่ง anti-PLA2R และคัดกรองมะเร็ง ไวรัส และยา เพื่อตอบว่า primary หรือ secondary ก่อนเลือกการรักษา", "topic": "Membranous nephropathy — nephrotic ของผู้ใหญ่ที่ต้องตามหามะเร็ง", "src": "", "ref": [], "nl": ["B9.2.2(4)", "2.3.14(12)", "2.3.2"]}]}, {"id": "nephro-14-09", "title": "IgA nephropathy — เลือดในปัสสาวะพร้อมกับการติดเชื้อ", "minutes": 8, "summary": "โรคโกลเมอรูลัสปฐมภูมิที่พบบ่อยที่สุดในโลก จุดตัดสินคือ synpharyngitic hematuria กับ complement ปกติ", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["2.3.14(2)", "2.1.43", "2.3.14-3(1)"], "md": "**กลไก** — ผู้ป่วยสร้าง **IgA1 ที่ขาดน้ำตาล galactose (galactose-deficient IgA1)** ร่างกายมองว่าแปลกปลอมจึงสร้าง **IgG ต่อต้าน** เกิดเป็น immune complex ลอยในกระแสเลือดแล้วไป **ตกค้างที่ mesangium** กระตุ้น mesangial cell ให้แบ่งตัวและหลั่งสารอักเสบ · เนื่องจาก **IgA1 ส่วนใหญ่ผลิตที่เยื่อบุ (mucosa)** เมื่อมีการติดเชื้อที่เยื่อบุ การผลิตจะพุ่งขึ้น **ภายใน 1 – 2 วัน** — นี่คือที่มาของคำว่า **synpharyngitic hematuria**\n\n> **เปรียบเทียบให้ชัด** — **IgA nephropathy เลือดออก \"พร้อมกับ\" การติดเชื้อ (1–2 วัน) เพราะแอนติบอดีมีอยู่แล้ว** ส่วน **APSGN เลือดออก \"หลัง\" การติดเชื้อ 1–3 สัปดาห์ เพราะต้องรอเวลาสร้างแอนติบอดีและก่อ immune complex** · และ **IgA nephropathy complement ปกติ** แต่ **APSGN C3 ต่ำ**\n\n### ภาพทางคลินิก — สเปกตรัมกว้างมาก\n\n| อาการ | ความถี่ |\n|---|---|\n| **ปัสสาวะเป็นเลือดตาเห็นซ้ำ ๆ กระตุ้นด้วยการติดเชื้อเยื่อบุ (synpharyngitic)** | **40 – 50%** |\n| **Microscopic hematuria ร่วมกับหรือไม่มีโปรตีนรั่ว** | **30 – 40%** |\n| **Nephrotic syndrome** | **5%** |\n| **RPGN** | **น้อยกว่า 10%** |\n\n### สาเหตุทุติยภูมิ (secondary IgA nephropathy)\n\n| กลุ่มโรค | ตัวอย่าง |\n|---|---|\n| **โรคข้อและภูมิต้านตนเอง** | **Ankylosing spondylitis** · rheumatoid arthritis · Reiter syndrome · uveitis |\n| **โรคทางเดินอาหาร** | **Celiac disease** |\n| **โรคตับ** | **ตับแข็งจากสุรา** · ตับแข็งที่ไม่ได้เกิดจากสุรา · โรคตับจากพยาธิใบไม้ |\n| **โรคปอด** | Sarcoidosis |\n| **โรคผิวหนัง** | Dermatitis herpetiformis |\n| **การติดเชื้อ** | **HIV** · ไวรัสตับอักเสบบี (ในพื้นที่ระบาด) |\n\n**โรคตับเป็นสาเหตุทุติยภูมิที่สำคัญ** เพราะตับเป็นอวัยวะหลักที่กำจัด IgA complex ออกจากกระแสเลือด เมื่อตับแข็งการกำจัดลดลง IgA จึงไปตกที่ mesangium มากขึ้น\n\n### พยาธิสภาพ\n\n| | สิ่งที่เห็น |\n|---|---|\n| **LM** | **Mesangial expansion และ hypercellularity** |\n| **IF** | **IgA ติดที่ mesangium** ← **ข้อวินิจฉัย ต้องมีเสมอ** |\n| **EM** | **Electron dense deposit ที่ mesangium** |\n\n### การรักษา (KDIGO)\n- **ACEI หรือ ARB ระยะยาว** เมื่อ **โปรตีนมากกว่า 1 g/วัน** และปรับขนาดขึ้นตามความดันที่ทนได้ *(1B)*\n- **ปรับ ACEI/ARB ขึ้นจนโปรตีนน้อยกว่า 1 g/วัน** *(2C)*\n- **น้ำมันปลา** เมื่อโปรตีนยังมากกว่า 1 g/วัน หลังการรักษาประคับประคองเต็มที่ 3 – 6 เดือน *(2D)*\n- **Corticosteroid 6 เดือน** เมื่อโปรตีนยังมากกว่า 1 g/วัน หลังการรักษาประคับประคองเต็มที่ 3 – 6 เดือน **และ GFR มากกว่า 50 mL/min/1.73 m²** *(2C)*\n\n> **หมายเหตุให้ทันสมัย** — สไลด์อ้าง **KDIGO 2012** ฉบับ **KDIGO 2021** เปลี่ยนไปสามเรื่องที่ควรรู้: (1) **เป้าความดันเข้มขึ้นเป็น systolic < 120 mmHg** (2) **ระวัง steroid มากขึ้น** เพราะการศึกษา **STOP-IgAN และ TESTING** พบผลข้างเคียงรุนแรงโดยเฉพาะการติดเชื้อ จึงให้เฉพาะรายที่เสี่ยงสูงและคุยความเสี่ยงกับผู้ป่วยก่อน และ (3) **น้ำมันปลามีหลักฐานอ่อนลง** ขณะที่ **SGLT2 inhibitor กลายเป็นการรักษาประคับประคองมาตรฐานของโรคไตเรื้อรังที่มีโปรตีนรั่ว** — ตอบข้อสอบตามสไลด์ได้ แต่ให้รู้ไว้ว่าเวชปฏิบัติจริงเปลี่ยนแล้ว\n\n### กับดักที่คนพลาดจริง\n- **\"ติดเชื้อทางเดินหายใจแล้วปัสสาวะเป็นเลือด\" ต้องถามว่าห่างกันกี่วัน** — นี่คือคำถามเดียวที่แยก IgA nephropathy ออกจาก APSGN ได้เร็วที่สุด และเป็นข้อที่ออกสอบซ้ำที่สุดของคาบนี้\n- **complement ปกติไม่ได้ตัดโรคโกลเมอรูลัสออก** — IgA nephropathy, anti-GBM disease และ ANCA vasculitis ล้วน **complement ปกติ** ส่วนกลุ่มที่ **C3 ต่ำ** คือ APSGN, lupus nephritis (C3 และ C4 ต่ำทั้งคู่), MPGN และ endocarditis-associated GN\n- **IgA nephropathy ไม่ใช่โรคไม่ร้ายแรงเสมอไป** — ราว 20 – 40% ดำเนินไปสู่ไตวายระยะสุดท้ายใน 20 ปี ตัวทำนายที่แย่คือ **โปรตีนมากกว่า 1 g/วันต่อเนื่อง ความดันสูง Cr สูงตั้งแต่แรก และพังผืดใน interstitium**\n- **Henoch–Schönlein purpura (IgA vasculitis) คือโรคเดียวกันในรูปแบบทั่วร่างกาย** — ผื่นจ้ำเลือดที่ขา ปวดข้อ ปวดท้อง ร่วมกับไตอักเสบ IgA", "pearls": ["IgA nephropathy = synpharyngitic hematuria (เลือดออกภายใน 1–2 วันของการติดเชื้อ) + complement ปกติ · APSGN = ทิ้งช่วง 1–3 สัปดาห์ + C3 ต่ำ", "ข้อวินิจฉัยคือ IF ติด IgA ที่ mesangium — ไม่มีอันนี้วินิจฉัยไม่ได้", "ตับแข็งทำให้เกิด secondary IgA nephropathy เพราะตับกำจัด IgA complex ไม่ได้", "เป้าการรักษาคือกด ACEI/ARB จนโปรตีนน้อยกว่า 1 g/วัน ก่อนจะคิดถึง steroid", "กลุ่ม C3 ต่ำ: APSGN · lupus nephritis · MPGN · endocarditis — กลุ่ม complement ปกติ: IgA nephropathy · anti-GBM · ANCA"], "items": [{"id": "N-OLD-033", "kind": "old", "stem": "Which feature best distinguishes IgA nephropathy from post-streptococcal glomerulonephritis?", "choices": ["Haematuria occurring within 1-2 days of an upper respiratory infection with normal complement levels", "Haematuria 2 weeks after pharyngitis with low C3", "Nephrotic-range proteinuria with hypoalbuminaemia", "Positive ANCA with pulmonary haemorrhage", "Sterile pyuria with WBC casts"], "answer": 0, "explain": "**IgA nephropathy = synpharyngitic haematuria** ปัสสาวะเป็นเลือดพร้อม ๆ กับการติดเชื้อทางเดินหายใจ (ภายใน 1-2 วัน) และ **complement ปกติ**; ส่วน APSGN ทิ้งช่วง 1-3 สัปดาห์และ **C3 ต่ำชั่วคราว** — สองข้อนี้แยกกันด้วย 'ระยะเวลา' และ 'complement'", "pearl": "", "topic": "", "src": "MED29 SAQ", "ref": [], "nl": ["2.3.14(2)", "B9.2.2(3)", "2.3.14-3(1)"]}, {"id": "NEPHRO-14-09-Q1", "kind": "own", "stem": "A 29-year-old man with biopsy-proven IgA nephropathy has blood pressure 138/86 mmHg, creatinine 1.1 mg/dL with eGFR 82 mL/min/1.73 m2, and urine protein 1.8 g/day on no medication. Which is the most appropriate initial management?", "choices": ["Start prophylactic penicillin to prevent further episodes of macroscopic haematuria", "Observe without treatment because proteinuria below 3.5 g/day carries no risk of progression", "Start an ACE inhibitor or ARB and titrate the dose upwards aiming to reduce proteinuria below 1 g/day", "Perform tonsillectomy, as this reliably induces remission in IgA nephropathy", "Start high-dose prednisolone 1 mg/kg/day immediately for 6 months"], "answer": 2, "explain": "**โปรตีนมากกว่า 1 g/วันคือตัวทำนายการดำเนินโรคที่แข็งแรงที่สุดของ IgA nephropathy** แนวทาง KDIGO จึงให้เริ่มด้วย **ACEI หรือ ARB ระยะยาวและปรับขนาดขึ้นจนโปรตีนต่ำกว่า 1 g/วัน** ควบคู่กับการคุมความดัน · กลไกคือลดความดันใน glomerulus ผ่านการขยาย efferent arteriole ซึ่งลดทั้งแรงกลที่ทำร้าย podocyte และปริมาณโปรตีนที่ผ่านออกมา\n\n- **Steroid ขนาดสูงทันที** เร็วเกินไป — จะพิจารณาเมื่อ **โปรตีนยังเกิน 1 g/วันหลังการรักษาประคับประคองเต็มที่ 3–6 เดือน และ GFR ยังมากกว่า 50** เท่านั้น และการศึกษา **STOP-IgAN/TESTING** ชี้ว่าผลข้างเคียงจากการติดเชื้อสูง\n- **Penicillin ป้องกัน** ไม่มีที่ใช้ — การติดเชื้อเป็นเพียงตัวกระตุ้นการผลิต IgA ไม่ใช่สาเหตุที่กำจัดได้ด้วยยาปฏิชีวนะ (ต่างจาก APSGN ที่ให้ยาฆ่าเชื้อเพื่อกำจัด streptococcus)\n- **ตัดต่อมทอนซิล** หลักฐานยังขัดแย้งกันและจำกัดอยู่ในบางประเทศ **ไม่ใช่การรักษามาตรฐาน**\n- **การเฝ้าดูเฉย ๆ ผิด** — ความเชื่อว่าต้องถึง 3.5 g/วันจึงจะเสี่ยงนั้นไม่จริง **เกณฑ์ที่ใช้ตัดสินใน IgA nephropathy คือ 1 g/วัน**", "pearl": "ใน IgA nephropathy ตัวเลขที่ต้องจำคือ 1 กรัมต่อวัน — เกินเมื่อไรให้ ACEI/ARB และปรับขึ้นจนต่ำกว่านั้น", "topic": "IgA nephropathy — เลือดในปัสสาวะพร้อมกับการติดเชื้อ", "src": "", "ref": [], "nl": ["2.3.14(2)", "2.3.14-3(1)"]}]}, {"id": "nephro-14-10", "title": "Acute post-streptococcal glomerulonephritis — ต้นแบบของ nephritic syndrome", "minutes": 9, "summary": "ทิ้งช่วงหลังติดเชื้อ · C3 ต่ำชั่วคราว · hump ใต้ epithelium · ยาฆ่าเชื้อไม่ได้รักษาไตที่อักเสบแล้ว", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["B9.2.2(3)", "2.3.14(2)", "2.2.4"], "md": "**กลไก** — เชื้อ **nephritogenic streptococcus** ปล่อยแอนติเจน (NAPlr และ SPE B) ที่ไปเกาะค้างในโกลเมอรูลัส **ร่างกายต้องใช้เวลา 1 – 3 สัปดาห์สร้างแอนติบอดี** แล้วจึงเกิด immune complex ในตำแหน่งนั้น กระตุ้น **complement ทาง alternative pathway** → **C3 ต่ำแต่ C4 ปกติ** และดึงเม็ดเลือดขาว neutrophil เข้ามาอุด capillary lumen → **GFR ตก → น้ำและเกลือคั่ง → ความดันสูงและบวม**\n\n> **ระยะฟักตัวคือหัวใจของการวินิจฉัย** — **หลังติดเชื้อที่ผิวหนัง 4 – 6 สัปดาห์** · **หลังคออักเสบ 2 – 4 สัปดาห์** · ภาพทางคลินิกของ nephritic เองมักปรากฏภายในเวลาน้อยกว่า 2 สัปดาห์หลังเริ่มมีอาการ\n\n### ภาพทางคลินิก\n\n| อาการ | ความถี่ |\n|---|---|\n| **ปัสสาวะเป็นเลือด** (microscopic เกือบ 100%) | **100%** |\n| **บวมและภาวะน้ำเกิน จนถึงหัวใจล้มเหลว** | **80 – 90%** |\n| **ความดันโลหิตสูง** | **60 – 80%** |\n| **ปัสสาวะออกน้อย** | **10 – 58%** |\n| **โปรตีนระดับ nephrotic** (พบไม่บ่อย) | **20%** |\n\n### การตรวจทางห้องปฏิบัติการ\n\n**Complement**\n- **ต่ำใน 90% ของผู้ป่วย**\n- **C3 และ CH50 ลดลงภายใน 2 สัปดาห์**\n- **C4 มักปกติ** (เพราะกระตุ้นทาง alternative pathway)\n- **กลับมาปกติภายใน 8 – 10 สัปดาห์** ← **ข้อนี้สำคัญมาก ถ้าเกิน 12 สัปดาห์แล้ว C3 ยังต่ำ ต้องเปลี่ยนไปคิดถึง MPGN, C3 glomerulopathy หรือ lupus nephritis และควรเจาะชิ้นเนื้อไต**\n\n**แอนติบอดีต่อ streptococcus**\n- **Anti-streptolysin O (ASO) บวก 30%** — ไวต่อการติดเชื้อที่คอ แต่ **ไขมันที่ผิวหนังยับยั้ง streptolysin O จึงมักลบในผู้ที่ติดเชื้อทางผิวหนัง**\n- **Anti-DNase B บวก 70%** — **ไวกว่ามากโดยเฉพาะเมื่อติดเชื้อที่ผิวหนัง**\n\n### พยาธิสภาพ\n\n| | สิ่งที่เห็น |\n|---|---|\n| **LM** | **Exudative GN** — endocapillary proliferative GN ที่มี **neutrophil แทรกเต็มไปหมด** |\n| **IF** | **IgG และ C3 ติดเป็นเม็ดหยาบ (coarse granular)** — ลาย \"starry sky\" |\n| **EM** | **Subepithelial electron dense deposit ขนาดใหญ่รูปโหนก = \"hump\"** |\n\n> **เทียบกับ MN ให้ชัด** — **ทั้งคู่ deposit อยู่ subepithelial** แต่ **APSGN เป็นก้อนใหญ่กระจัดกระจาย (hump) และมีการอักเสบเต็มที่** ขณะที่ **MN เป็นเม็ดเล็กสม่ำเสมอตลอดแนวและไม่มีการอักเสบ** — ความต่างนี้อธิบายว่าทำไมโรคหนึ่งออกมาเป็น nephritic และอีกโรคออกมาเป็น nephrotic\n\n### การรักษา\n- **ยาปฏิชีวนะ — penicillin หรือ erythromycin**\n  - **เป้าหมายคือกำจัดเชื้อ streptococcus และป้องกันการแพร่เชื้อ nephritogenic strain ไปสู่คนใกล้ชิด**\n  - **ยาปฏิชีวนะช่วยแก้ไตอักเสบที่เกิดแล้วไม่ได้** เพราะ **immune complex ก่อตัวขึ้นเรียบร้อยแล้ว** ← จุดที่ข้อสอบชอบถาม\n- **การรักษาประคับประคองคือหลัก** — **จำกัดเกลือและน้ำ · ยาขับปัสสาวะกลุ่ม loop · ยาลดความดัน** จนกว่า GFR จะฟื้น\n- **Pulse IV methylprednisolone** พิจารณาเฉพาะรายที่มาแบบ **RPGN** โดยอนุมานจากโรค crescentic GN อื่น ๆ — **ยังไม่มีหลักฐานจากการศึกษาแบบสุ่ม**\n\n**พยากรณ์โรค** — **เด็กหายเกือบทั้งหมด** ปัสสาวะออกดีขึ้นใน 1 สัปดาห์ Cr กลับปกติใน 3 – 4 สัปดาห์ แต่ **microscopic hematuria อาจอยู่นานถึง 1 – 2 ปี ซึ่งเป็นเรื่องปกติ ไม่ต้องตกใจ** · ผู้ใหญ่โดยเฉพาะผู้สูงอายุพยากรณ์โรคแย่กว่า\n\n### กับดักที่คนพลาดจริง\n- **ความดันสูงใน APSGN เกิดจากน้ำเกิน ไม่ใช่หลอดเลือดหดตัว** — การรักษาหลักจึงเป็น **ยาขับปัสสาวะและจำกัดเกลือ** ไม่ใช่เร่งให้ยาขยายหลอดเลือดอย่างเดียว · ในเด็กที่ความดันสูงมากอาจมาด้วย **ชักจาก hypertensive encephalopathy** ซึ่งเป็นภาวะฉุกเฉิน\n- **ASO ลบไม่ตัดโรค** โดยเฉพาะถ้าติดเชื้อมาจากผิวหนัง — ต้องส่ง **anti-DNase B**\n- **C3 ที่ยังต่ำเกิน 8 – 10 สัปดาห์ผิดปกติ** ต้องหาโรคอื่น อย่าปล่อยไว้ว่าเป็น APSGN ที่หายช้า\n- **อย่าให้ steroid ใน APSGN ทั่วไป** — โรคหายเองได้ การให้ยากดภูมิคุ้มกันมีแต่โทษ ยกเว้นรายที่มาเป็น RPGN จริง ๆ\n\n### ที่อาจารย์เน้นในสไลด์\nอาจารย์ย้ำสองประโยคในสไลด์การรักษาว่า **ยาปฏิชีวนะมีไว้ \"resolve streptococcal infection and prevent the spread\"** และ **\"antibiotics are of little help for reversing GN\"** — ให้จำคู่กันไว้ เพราะข้อสอบมักให้เลือกว่าจะให้ยาปฏิชีวนะเพื่ออะไร", "pearls": ["ระยะฟักตัว: หลังติดเชื้อผิวหนัง 4–6 สัปดาห์ หลังคออักเสบ 2–4 สัปดาห์ — ถ้าเลือดออกพร้อมการติดเชื้อให้คิด IgA nephropathy แทน", "C3 และ CH50 ต่ำแต่ C4 ปกติ (alternative pathway) และต้องกลับมาปกติภายใน 8–10 สัปดาห์ ถ้าไม่กลับให้เจาะไต", "ติดเชื้อที่ผิวหนังให้ส่ง anti-DNase B (บวก 70%) เพราะ ASO มักลบ (บวกแค่ 30%)", "EM เห็น hump ใต้ epithelium · IF ติด IgG กับ C3 เป็นเม็ดหยาบ · LM เห็น neutrophil เต็มไปหมด", "ยาปฏิชีวนะให้เพื่อกำจัดเชื้อและกันแพร่ ไม่ได้ทำให้ไตที่อักเสบแล้วดีขึ้น — การรักษาหลักคือขับปัสสาวะและจำกัดเกลือ"], "items": [{"id": "N-MCQ-10", "kind": "mcq", "stem": "A 30-year-old man presents with occipital headache for 3 hours. Two weeks earlier he had fever and sore throat. Two days ago he noticed dark cola-coloured urine without frothiness and without dysuria. Vital signs: BT 37.0 C, PR 84/min, RR 18/min, BP 180/106 mmHg, BMI 27 kg/m2. Examination shows no pale conjunctivae, no injected pharynx, no CVA tenderness, no rash and no oedema. Laboratory results: urine analysis protein 1+, RBC 30-50/HPF with dysmorphic forms and occasional RBC casts, WBC 2-3/HPF; anti-streptolysin O titre elevated; C3 low with normal C4; creatinine 1.3 mg/dL. Which of the following is the most likely diagnosis and the most important immediate management?", "choices": ["Acute post-streptococcal glomerulonephritis; control blood pressure and restrict salt and water", "Acute pyelonephritis; start intravenous ceftriaxone", "Rapidly progressive glomerulonephritis from anti-GBM disease; start plasma exchange", "IgA nephropathy; start high-dose corticosteroid immediately", "Nephrotic syndrome from minimal change disease; start prednisolone 1 mg/kg/day"], "answer": 0, "explain": "กลไก: **APSGN** เป็น **immune complex-mediated glomerulonephritis** — antigen ของ nephritogenic strain ของ group A Streptococcus (**NAPlr, SPE-B**) จับกับ antibody เกิด immune complex ที่เกาะ **subepithelial (hump) ใน glomerulus** → **กระตุ้น complement ทาง alternative pathway** → neutrophil แทรกซึม เกิด **endocapillary proliferation** → ทำลายผนัง capillary\n\nผลตามมา = **nephritic syndrome**\n- **ผนัง capillary รั่ว** → **dysmorphic RBC และ RBC cast** → ปัสสาวะสีโคล่า/น้ำล้างเนื้อ **โดยไม่มีฟอง** (proteinuria แค่ sub-nephrotic)\n- **GFR ลด** → Cr ขึ้น, **Na และน้ำคั่ง** → **hypertension** (ซึ่งเป็นสาเหตุของปวดศีรษะในโจทย์) และ edema\n- **oliguria**\n\n**หลักฐานทางแลปที่เป็นลายเซ็น**: **ASO titer สูง (ยืนยันการติดเชื้อ strep ที่ผ่านมา) ร่วมกับ C3 ต่ำ แต่ C4 ปกติ** — เพราะกระตุ้น **alternative pathway** (ถ้าเป็น classical pathway เช่น lupus nephritis หรือ MPGN type I จะ **C3 และ C4 ต่ำทั้งคู่**) จุดนี้เป็น high-yield ที่แยกโรคได้\n- ระยะเวลา **latent period 1-3 สัปดาห์หลัง pharyngitis** (3-6 สัปดาห์ถ้าเป็นที่ผิวหนัง) — ต่างจาก IgA nephropathy ที่เกิด **พร้อม** การติดเชื้อ (synpharyngitic, 1-3 วัน)\n- **C3 จะกลับเป็นปกติภายใน 6-8 สัปดาห์** — ถ้าไม่กลับ ต้องคิดถึง C3 glomerulopathy/MPGN\n\n**การรักษา (เป็น supportive เพราะส่วนใหญ่หายเอง)**\n1. **ควบคุมความดันโลหิต** — loop diuretic เป็นตัวเลือกแรกเพราะเหตุคือ Na/water retention; เพิ่ม CCB/vasodilator ตามความจำเป็น\n2. **จำกัดเกลือและน้ำ**\n3. **กำจัดเชื้อ**: penicillin (ไม่เปลี่ยนการดำเนินโรคของไตแต่ลดการแพร่เชื้อ)\n4. ติดตาม renal function, urine output, K และเฝ้าระวังภาวะแทรกซ้อน (hypertensive encephalopathy, pulmonary edema, AKI ที่ต้องฟอกเลือด)\n5. **ไม่ให้ steroid เป็นกิจวัตร** — พิจารณาเฉพาะเมื่อมีลักษณะ RPGN (crescentic GN)\n\nทำไมข้ออื่นผิด:\n- **IgA nephropathy + steroid ทันที**: timing ไม่เข้า (IgA เกิดพร้อมการติดเชื้อ), **C3 ปกติใน IgA** และ ASO ไม่สูง; การให้ steroid ขนาดสูงทันทีไม่ใช่แนวทาง (ต้องควบคุม BP/proteinuria ด้วย RAS blockade ก่อน)\n- **Anti-GBM disease + plasma exchange**: จะมาด้วย **RPGN (Cr เพิ่มเร็วเป็นวัน-สัปดาห์) ± pulmonary hemorrhage** และตรวจพบ **anti-GBM antibody, linear IgG deposition**; ASO สูงและ C3 ต่ำไม่เข้า\n- **Acute pyelonephritis**: ต้องมี **ไข้ หนาวสั่น CVA tenderness pyuria WBC cast** — โจทย์ระบุว่าไม่มีไข้ ไม่มี CVA tenderness และ WBC ในปัสสาวะ 2-3 ตัวเท่านั้น\n- **Minimal change disease**: เป็น **nephrotic** (ฟองเยอะ, protein 3-4+, albumin ต่ำ, edema เด่น) — โจทย์เป็นภาพ nephritic ชัดเจน (protein แค่ 1+, RBC เด่น, HT, Cr ขึ้น) และ **ไม่มีฟองในปัสสาวะ**", "pearl": "แยก **nephritic ที่ C3 ต่ำ**: APSGN (C3 ต่ำ C4 ปกติ, หายเอง), lupus nephritis (C3 **และ** C4 ต่ำ, ANA/anti-dsDNA positive), MPGN/C3 glomerulopathy (C3 ต่ำนานเกิน 8 สัปดาห์), infective endocarditis-associated GN (มีไข้เรื้อรัง murmur hemoculture positive)", "topic": "Acute post-streptococcal glomerulonephritis", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 FA MEQ – ผู้ชายไทยอายุ 30 ปี ปวดศีรษะ 3 ชั่วโมงก่อนมารพ., 2 wk PTA มีไข้เจ็บคอ, 2 d PTA ปัสสาวะเป็นสีน้ำล้างเนื้อ ไม่มีฟอง ไม่แสบขัด, BP 180/106, UA proteinuria 1+ RBC WBC, ASO titer ขึ้น, low C3 normal C4 → Dx acute poststreptococcal glomerulonephritis, tx antihypertensive drug", "MED31 OSCE ข้อ 9 – ผู้ป่วยหญิง urine RBC 50-100, protein trace → Dysmorphic RBC, doughnut cell, DDx: Post streptococcal glomerulonephritis, IgA nephropathy, RPGN", "MED29 SAQ – Acute post streptococcal glomerulonephritis, IgA nephropathy, Rapidly Progressive Glomerulonephritis", "MED34 MCQ ครั้งที่ 4 ข้อ 91 – มี RBC ตอบ glomerulonephritis"], "nl": ["B9.2.2(3)", "2.3.14(2)"]}, {"id": "N-OLD-029", "kind": "old", "stem": "A 30-year-old man has headache and cola-coloured urine 2 weeks after pharyngitis, with BP 180/110 mmHg, periorbital oedema, RBC casts and low C3. What is the diagnosis and treatment?", "choices": ["Nephrotic syndrome; high-dose steroid", "IgA nephropathy; immediate immunosuppression", "Acute pyelonephritis; intravenous antibiotics", "Acute post-streptococcal glomerulonephritis; salt and water restriction with antihypertensive therapy and penicillin for residual infection", "Renal artery stenosis; angioplasty"], "answer": 3, "explain": "**APSGN**: อาการเกิดหลังคออักเสบ 1-3 สัปดาห์ (หรือหลังผิวหนังติดเชื้อ 3-6 สัปดาห์) มาด้วย nephritic syndrome พร้อม **C3 ต่ำที่กลับเป็นปกติภายใน 8 สัปดาห์** และ ASO สูง; รักษาแบบประคับประคอง — จำกัดเกลือและน้ำ ให้ยาลดความดัน/ยาขับปัสสาวะ และให้ยาปฏิชีวนะกำจัดเชื้อที่เหลือ **ไม่ใช่ยากดภูมิ**", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 FA MEQ", "ref": [], "nl": ["B9.2.2(3)", "2.3.14(2)", "2.2.4"]}]}, {"id": "nephro-14-11", "title": "Lupus nephritis — จัดชั้น ISN/RPS แล้วรักษาตามชั้น", "minutes": 10, "summary": "โรคเดียวที่แสดงออกได้ทุกกลุ่มอาการ · เกณฑ์ ACR 2012 · ข้อบ่งชี้เจาะไต · การรักษาแยกตาม class", "source": "สไลด์ อ.ฉันทิศา อารยางกูร — Approach to glomerular disease (หน่วยโรคไต รพ.ราชวิถี)", "nl": ["2.3.13-3(15)", "B5.2.2-3(5)", "2.3.14(12)", "2.3.14(2)"], "md": "**กลไก (ตามสไลด์ 5 ขั้น)**\n1. **เสีย self-tolerance** — กำจัดเซลล์ที่ตายแบบ apoptosis ได้ไม่ดี **แอนติเจนจากนิวเคลียสจึงโผล่ออกมา** ถูก dendritic cell จับเข้าไปและกระตุ้นผ่าน **TLR7/TLR9** ภายในเซลล์ แล้วนำเสนอต่อ autoreactive T cell (แสงอัลตราไวโอเลตเร่งกระบวนการนี้จึงมี photosensitivity)\n2. **สร้าง autoantibody** — T cell ช่วย B cell ผลิตแอนติบอดีปริมาณมาก เกิดเป็น **immune complex (IC)**\n3. **IC ตกค้างในเนื้อเยื่อ** — กำจัดไม่ทัน จึงไปสะสมที่ **ไตและผิวหนัง**\n4. **อักเสบจาก IC** — กระตุ้น **complement ทาง classical pathway (จึง C3 และ C4 ต่ำทั้งคู่)** และกระตุ้น macrophage กับ neutrophil ผ่าน Fc receptor\n5. **พังผืดและความเสียหายถาวร** — cytokine ที่ก่อการอักเสบและพังผืดทำให้เนื้อไตเสียอย่างถาวร\n\n> **ตำแหน่งที่ IC ไปเกาะเป็นตัวกำหนดว่าจะออกมาเป็นกลุ่มอาการไหน** — **subendothelial (class III, IV) อยู่ด้านที่สัมผัสกระแสเลือด เซลล์อักเสบเข้าถึงได้เต็มที่ → nephritic รุนแรง ไตวายเร็ว** · **subepithelial (class V) ถูก GBM กั้น เซลล์อักเสบเข้าไม่ถึง → nephrotic ตะกอนสะอาด**\n\n### ภาพทางคลินิก — แสดงออกได้ทุกแบบ\n\n**Glomerular syndrome**\n\n| อาการ | ความถี่ |\n|---|---|\n| **Proteinuria** | **100%** |\n| **Microscopic hematuria** | **80%** |\n| **การทำงานของไตบกพร่อง** | **40 – 80%** |\n| **Nephrotic syndrome** | **45 – 65%** |\n| **RPGN** | **30%** |\n| **ความดันโลหิตสูง** | **15 – 50%** |\n| **Macroscopic hematuria** | **1 – 2%** |\n\n**Vascular syndrome** — **ลิ่มเลือดอุดตันหลอดเลือดดำหรือแดงของไต** (สัมพันธ์กับ antiphospholipid antibody)\n\n**Tubular abnormality** — **renal tubular acidosis** · **hyperkalemia 15%**\n\n### เกณฑ์ ACR 2012 ว่ามีไตอักเสบจากลูปัส\n- **Spot urine protein/creatinine ratio > 0.5** หรือ\n- **ตะกอนปัสสาวะที่ยัง active** — **เม็ดเลือดแดง > 5/HPF** หรือ **เม็ดเลือดขาว > 5/HPF โดยไม่มีการติดเชื้อ** หรือ **cellular cast ที่เป็น RBC cast หรือ WBC cast**\n\n### ข้อบ่งชี้ในการเจาะชิ้นเนื้อไต\n- **Cr สูงขึ้นโดยไม่มีสาเหตุอื่นที่อธิบายได้**\n- **ยืนยันแล้วว่าโปรตีนมากกว่า 1.0 g/24 ชั่วโมง**\n- **ตรวจอย่างน้อย 2 ครั้งในระยะเวลาสั้น ๆ แล้วพบ**\n  - **โปรตีน ≥ 0.5 g/24 ชั่วโมง ร่วมกับ hematuria ≥ 5 RBC/HPF** หรือ\n  - **โปรตีน ≥ 0.5 g/24 ชั่วโมง ร่วมกับ cellular cast**\n\n### การจัดชั้นตาม ISN/RPS\n\n| Class | ชื่อ | ตำแหน่ง deposit | จุดตัดสิน |\n|---|---|---|---|\n| **I** | Minimal mesangial | **Mesangium** (เห็นเฉพาะ IF/EM) | LM ปกติ |\n| **II** | Mesangial proliferative | **Mesangium** | **มี mesangial hypercellularity** |\n| **III** | **Focal** lupus nephritis | **Subendothelial** | **โกลเมอรูลัสที่เป็น < 50%** |\n| **IV** | **Diffuse** lupus nephritis | **Subendothelial** | **โกลเมอรูลัสที่เป็น ≥ 50%** |\n| **V** | **Membranous** lupus nephritis | **Subepithelial และ intramembranous** | ภาพเหมือน MN |\n| **VI** | Advanced sclerosing | – | **Global glomerulosclerosis > 90%** |\n\n**ภาพทางพยาธิวิทยาที่จำเพาะของลูปัส**\n- **IF ติดแบบ \"full house\"** — **IgG, IgA, IgM ร่วมกับ C1q และ C3** ครบทุกตัว และยัง **ติดตามแนว tubular basement membrane และหลอดเลือด** ด้วย ← **ไม่มีโรคอื่นทำแบบนี้**\n- **EM** — **electron dense deposit ที่ subendothelium** หรือที่ **mesangium** อย่างชัดเจน\n\n### การรักษาตาม class\n\n| Class | การรักษา |\n|---|---|\n| **I** | **ไม่ต้องรักษาทางไต** — ปัสสาวะปกติหรือผิดปกติเล็กน้อย |\n| **II** | **รักษาตามอาการนอกไต** · หลักฐานยังน้อย ถ้าโปรตีน **> 1 – 2 g/วัน** ให้ **prednisolone ระยะสั้น 6 – 8 สัปดาห์** |\n| **III และ IV** (proliferative) | **Prednisolone 0.5 – 1 mg/kg/วัน ร่วมกับยากดภูมิคุ้มกันตัวอื่น** |\n| **V** (membranous) | **Prednisolone 0.5 – 1 mg/kg/วัน ร่วมกับยากดภูมิคุ้มกันตัวอื่น** |\n| **VI** | **รักษาประคับประคองอย่างเดียว** — เนื้อไตเป็นแผลเป็นไปแล้ว ให้ยากดภูมิคุ้มกันมีแต่โทษ |\n\n> **หมายเหตุให้ทันสมัย** — ยากดภูมิคุ้มกันที่ใช้คู่กับ steroid ใน class III/IV/V ปัจจุบันคือ **mycophenolate mofetil** หรือ **cyclophosphamide ขนาดต่ำแบบ Euro-Lupus** และแนวทางใหม่ (KDIGO 2024) แนะนำ **การรักษาสามตัวตั้งแต่ต้น** โดยเพิ่ม **belimumab** หรือ **voclosporin** เข้าไป พร้อมทั้งให้ **hydroxychloroquine กับผู้ป่วยลูปัสทุกราย** ที่ไม่มีข้อห้าม\n\n### กับดักที่คนพลาดจริง\n- **ผู้ป่วยลูปัสทุกรายต้องตรวจปัสสาวะทุกครั้งที่มาตรวจ** — ไตอักเสบระยะแรก **ไม่มีอาการเลย** กว่าจะบวมหรือ Cr ขึ้นก็มักเสียเนื้อไตไปแล้ว\n- **ลูปัสทำให้ C3 และ C4 ต่ำทั้งคู่** ต่างจาก **APSGN ที่ C3 ต่ำแต่ C4 ปกติ** — ใช้แยกได้เร็วข้างเตียง\n- **class เปลี่ยนไปมาได้ระหว่างดำเนินโรค** — ถ้าภาพทางคลินิกเปลี่ยน (เช่น จาก nephrotic กลายเป็นไตวายเร็ว) **ต้องเจาะซ้ำ** ไม่ใช่รักษาตามผลเดิม\n- **หญิงสาวที่มีผื่นแพ้แสงและปวดข้อ แล้วมีทั้งโปรตีนและเม็ดเลือดแดงในปัสสาวะ** — วินิจฉัยคือ **lupus nephritis** และขั้นต่อไปคือ **ส่ง ANA, anti-dsDNA, C3, C4 แล้วเจาะชิ้นเนื้อไตเพื่อจัด class** เพราะ **การรักษาขึ้นกับ class ทั้งหมด**", "pearls": ["Full house IF (IgG + IgA + IgM + C1q + C3) คือลายเซ็นของ lupus nephritis ไม่มีโรคอื่นทำแบบนี้", "Class III กับ IV แยกกันที่สัดส่วนโกลเมอรูลัสที่เป็น — น้อยกว่า 50% คือ III ตั้งแต่ 50% ขึ้นไปคือ IV", "Subendothelial deposit (III, IV) = nephritic รุนแรง · subepithelial deposit (V) = nephrotic ตะกอนสะอาด", "ลูปัส C3 และ C4 ต่ำทั้งคู่ (classical pathway) ส่วน APSGN C3 ต่ำแต่ C4 ปกติ (alternative pathway)", "เกณฑ์เจาะไต: Cr ขึ้นโดยไม่มีสาเหตุอื่น หรือโปรตีนเกิน 1 g/วัน หรือโปรตีนตั้งแต่ 0.5 g/วันร่วมกับ hematuria หรือ cellular cast", "Class I ไม่ต้องรักษา · Class VI ประคับประคองอย่างเดียว · ให้ยากดภูมิคุ้มกันเฉพาะ III, IV, V"], "items": [{"id": "N-OLD-031", "kind": "old", "stem": "A young woman with a photosensitive rash and arthritis has urine protein 3+ with RBC 30-50/HPF. What is the most likely diagnosis and the next step?", "choices": ["Post-streptococcal glomerulonephritis; observe", "Lupus nephritis; send ANA, anti-dsDNA, complement levels and arrange renal biopsy", "Urinary tract infection; treat with antibiotics", "Minimal change disease; start steroid without biopsy", "Renal stone; arrange CT KUB"], "answer": 1, "explain": "**ผื่นแพ้แสง + ปวดข้อ + ไตอักเสบ = SLE** ต้องส่ง ANA, anti-dsDNA, C3/C4 และ **เจาะชิ้นเนื้อไตเพื่อจัดชั้น (class I-VI) เพราะ class เป็นตัวกำหนดการรักษา** โดย class III/IV ต้อง induction ด้วยสเตียรอยด์ขนาดสูงร่วมกับ mycophenolate หรือ cyclophosphamide", "pearl": "", "topic": "", "src": "MED31 OSCE ข้อ 1 / MED32 OSCE ข้อ 6 / MED35 ลงกองครั้งที่ 2", "ref": [], "nl": ["2.3.13-3(15)", "B9.2.2(4)", "B9.3(2)"]}, {"id": "NEPHRO-14-11-Q1", "kind": "own", "stem": "A 24-year-old woman with SLE has creatinine rising from 0.8 to 1.9 mg/dL over 6 weeks, urine protein 2.8 g/day, 30 red cells/HPF with red cell casts, and low C3 and C4. Kidney biopsy shows endocapillary proliferation involving 70 percent of glomeruli with subendothelial deposits and full house immunofluorescence. Which ISN/RPS class and initial treatment are correct?", "choices": ["Class V membranous lupus nephritis — an ACE inhibitor and a statin without immunosuppression", "Class VI advanced sclerosing lupus nephritis — supportive treatment and preparation for dialysis", "Class III focal lupus nephritis — hydroxychloroquine alone with close monitoring", "Class II mesangial proliferative lupus nephritis — a short 6 to 8 week course of prednisolone", "Class IV diffuse lupus nephritis — prednisolone 0.5 to 1 mg/kg/day combined with another immunosuppressive agent"], "answer": 4, "explain": "**Endocapillary proliferation ที่ 70% ของโกลเมอรูลัส (≥ 50%) ร่วมกับ subendothelial deposit = class IV (diffuse)** · การที่ deposit อยู่ **ด้านที่สัมผัสกระแสเลือด** ทำให้เซลล์อักเสบเข้าถึงได้เต็มที่ จึงออกมาเป็น **nephritic รุนแรง ไตวายเร็ว มี RBC cast และ complement ต่ำทั้ง C3 และ C4** · **class III และ IV คือกลุ่ม proliferative ที่ต้องให้ prednisolone 0.5–1 mg/kg/วัน ร่วมกับยากดภูมิคุ้มกันตัวอื่น** (ปัจจุบันคือ mycophenolate หรือ cyclophosphamide ขนาดต่ำ)\n\n- **Class III** ใช้เกณฑ์เดียวกันแต่ **โกลเมอรูลัสที่เป็นต้องน้อยกว่า 50%** — รายนี้ 70% จึงเป็น IV · และ **hydroxychloroquine อย่างเดียวไม่พอสำหรับ proliferative lupus nephritis** (ถึงแม้จะต้องให้ทุกรายเป็นพื้นฐาน)\n- **Class V** deposit อยู่ **subepithelial** และมาแบบ **nephrotic ตะกอนสะอาด** ไม่ใช่ RBC cast กับไตวายเร็ว — และ class V เองก็ยังต้องให้ยากดภูมิคุ้มกัน ไม่ใช่ ACEI กับ statin เท่านั้น\n- **Class II** จำกัดอยู่ที่ **mesangium** LM ไม่มี endocapillary proliferation และไม่ทำให้ Cr พุ่ง\n- **Class VI** ต้องมี **global glomerulosclerosis > 90%** ซึ่งเป็นแผลเป็นถาวร รายนี้เป็นการอักเสบที่ยังรักษาให้กลับคืนได้ **การไปประคับประคองเฉย ๆ จะทำให้เสียไตโดยไม่จำเป็น**", "pearl": "เห็น proliferative lupus nephritis ให้นับสัดส่วนโกลเมอรูลัสก่อน — ต่ำกว่า 50% คือ class III ตั้งแต่ 50% ขึ้นไปคือ class IV แต่ทั้งคู่รักษาเหมือนกันคือ steroid ร่วมกับยากดภูมิคุ้มกัน", "topic": "Lupus nephritis — จัดชั้น ISN/RPS แล้วรักษาตามชั้น", "src": "", "ref": [], "nl": ["2.3.13-3(15)", "2.3.14(2)", "2.3.14(12)"]}]}], "date": "พฤ. 24 ก.ย."}, {"lec": "22", "title": "Fluid and Electrolyte — Dysnatremia และ Dyskalemia", "subtitle": "ช่องของเหลวและ osmolality · ADH · hyponatremia และ ODS · hypernatremia · hypokalemia · hyperkalemia", "objectives": ["บอกสัดส่วน **TBW, ICF, ECF** ตามเพศและวัย และใช้คำนวณในสูตรของคาบนี้ได้ถูกต้อง", "แยก **osmolality ออกจาก tonicity** และบอกได้ว่าสารใดเป็น effective osmole", "อธิบายการควบคุม ADH ทั้งทาง **osmotic และ non-osmotic** และเหตุผลที่ปริมาตรชนะความเข้มข้นเสมอ", "ไล่ hyponatremia ตาม **5 ขั้นตอน** และตัด **pseudohyponatremia กับ translocational hyponatremia** ออกได้", "แยกสาเหตุ hyponatremia ตามปริมาตร ใช้ **เกณฑ์ SIADH** ได้ครบ และไม่พลาด **ภาวะต่อมหมวกไตบกพร่อง**", "กำหนดเป้าการแก้โซเดียมได้ถูก — **4–6 mEq/L ในชั่วโมงแรก และไม่เกิน 6–8 mEq/L ต่อ 24 ชั่วโมง** พร้อมรู้วิธีลดกลับเมื่อแก้เกิน", "บอกกลุ่มเสี่ยงและอาการของ **osmotic demyelination syndrome** ได้", "เข้าหา hypernatremia ด้วย **urine osmolality** และแยก **central กับ nephrogenic DI** ได้", "แยก hypokalemia ที่เกิดจาก **การย้ายเข้าเซลล์** ออกจาก **การเสียจริง** และรู้จัก **thyrotoxic periodic paralysis** กับ **leptospirosis**", "เรียงลำดับการรักษา hyperkalemia ได้ถูก — **แคลเซียม → ดันเข้าเซลล์ → เอาออกจากร่างกาย** และรู้ว่ายาใดไม่ได้ลดโพแทสเซียม"], "meq": [], "osce": [{"id": "N-OSCE-04", "part": "OSCE/SAQ", "lec": "22", "lecture": "Fluid electrolytes: Dysnatremia & Dyskalemia (อ.ชุมพล) / Acute kidney injury (อ.วรรณิยา)", "topic": "SAQ – Interpretation of arterial blood gas and electrolytes in AKI", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ผู้ป่วยชายอายุ 56 ปี มีภาวะ acute kidney injury ให้ผลการตรวจต่อไปนี้\nABG (room air): pH 7.25, PaCO2 26 mmHg, PaO2 92 mmHg, HCO3 11 mEq/L, O2 saturation 97 percent\nElectrolytes: Na 138, K 6.2, Cl 102 mEq/L, albumin 4.0 g/dL\nBUN 62 mg/dL, creatinine 6.4 mg/dL, glucose 104 mg/dL, lactate 1.8 mmol/L\n(ก) จงแปลผล ABG อย่างเป็นระบบ พร้อมแสดงการคำนวณ\n(ข) anion gap เป็นเท่าไร และบ่งบอกอะไร\n(ค) จงบอกการวินิจฉัยความผิดปกติของกรด-ด่าง\n(ง) จงให้การรักษาที่ต้องทำทันที", "answer": "**(ก) การแปลผล ABG อย่างเป็นระบบ (ต้องแสดงทุกขั้นตอน)**\n\n**ขั้นที่ 1 — ดู pH: acidaemia หรือ alkalaemia**\n- **pH 7.25 < 7.35 → acidaemia**\n\n**ขั้นที่ 2 — หา primary disorder**\n- **HCO3 11 mEq/L (ต่ำมาก, ปกติ 22-26)** → เข้ากับ **metabolic acidosis**\n- PaCO2 26 mmHg ต่ำ → ไม่สามารถเป็นสาเหตุของ acidaemia ได้ (CO2 ต่ำทำให้เป็นด่าง) → ยืนยันว่า **primary = metabolic acidosis**\n\n**ขั้นที่ 3 — ประเมินการชดเชยของระบบหายใจด้วย Winter's formula**\n- **Expected PaCO2 = 1.5 × HCO3 + 8 ± 2**\n- = (1.5 × 11) + 8 ± 2 = **16.5 + 8 = 24.5 ± 2 → ช่วง 22.5 ถึง 26.5 mmHg**\n- **PaCO2 ที่วัดได้ = 26 mmHg → อยู่ในช่วงที่คาดหวัง**\n→ **มีการชดเชยทางระบบหายใจอย่างเหมาะสม (appropriate respiratory compensation)** ไม่มี respiratory disorder ซ้อน\n  - (ถ้า PaCO2 **สูงกว่า** ช่วงที่คาด = มี **respiratory acidosis ซ้อน**; ถ้า **ต่ำกว่า** = มี **respiratory alkalosis ซ้อน**)\n\n**ขั้นที่ 4 — ประเมิน oxygenation**\n- PaO2 92 mmHg, O2 sat 97% บน room air → **oxygenation ปกติ ไม่มี hypoxaemia**\n\n**(ข) การคำนวณ anion gap**\n- **Anion gap (AG) = Na − (Cl + HCO3) = 138 − (102 + 11) = 138 − 113 = 25 mEq/L**\n- ค่าปกติประมาณ **12 ± 2 mEq/L** (ถ้าห้องปฏิบัติการรายงาน K ร่วมด้วยจะใช้ค่าปกติสูงกว่า)\n- **Albumin 4.0 g/dL = ปกติ** จึงไม่ต้องปรับค่า (ถ้า albumin ต่ำ ต้อง **corrected AG = AG + 2.5 × (4.0 − albumin ที่วัดได้)** เพราะ albumin เป็น unmeasured anion หลัก — ถ้าไม่ปรับจะพลาด high AG acidosis ในผู้ป่วยที่ albumin ต่ำ)\n- **AG 25 → สูงชัดเจน = high anion gap metabolic acidosis (HAGMA)**\n\n**ประเมินว่ามีความผิดปกติอื่นซ้อนหรือไม่ด้วย delta ratio**\n- **ΔAG = 25 − 12 = 13**; **ΔHCO3 = 24 − 11 = 13**\n- **Delta ratio (ΔAG/ΔHCO3) = 13/13 = 1.0**\n- ตีความ: **ประมาณ 1-2 = pure high AG metabolic acidosis** (ถ้า **<1** = มี **normal AG (hyperchloraemic) acidosis ซ้อน**; ถ้า **>2** = มี **metabolic alkalosis ซ้อน**)\n→ **เป็น high anion gap metabolic acidosis แบบเดี่ยว (simple)**\n\n**(ค) การวินิจฉัย: Simple high anion gap metabolic acidosis with appropriate respiratory compensation, due to uraemic acidosis from acute kidney injury, accompanied by severe hyperkalaemia**\n\n**กลไก**: ใน AKI ไตไม่สามารถ\n1. **ขับ fixed acid (sulfate, phosphate, hippurate, organic anion) ที่เกิดจากเมตาบอลิซึมของโปรตีน** → สะสมเป็น **unmeasured anion → AG สูง**\n2. **สร้าง bicarbonate กลับคืน (regenerate) และขับ H+ ในรูป ammonium (NH4+)** ได้เพียงพอ → HCO3 ลดลง\n→ เกิด **uraemic acidosis** ซึ่งเป็น HAGMA; ร่วมกับ **hyperkalaemia** เพราะขับ K ไม่ได้และ **acidosis ผลักให้ K ออกจากเซลล์**\n\n**การคัดสาเหตุอื่นของ HAGMA (จำด้วย \"GOLD MARK\")**: **G**lycols (ethylene glycol, propylene glycol), **O**xoproline (paracetamol เรื้อรัง), **L**-lactate, **D**-lactate, **M**ethanol, **A**spirin (salicylate), **R**enal failure, **K**etoacidosis\n- ในโจทย์นี้: **lactate 1.8 (ปกติ) → ตัด lactic acidosis**; **glucose 104 และไม่มีประวัติเบาหวาน → ตัด DKA** (ควรส่ง ketone ยืนยันถ้าสงสัย); ไม่มีประวัติกินสารพิษ → **สาเหตุคือ renal failure**\n- ถ้าสงสัย **toxic alcohol** ต้องคำนวณ **osmolal gap** = measured osm − calculated osm [2Na + glucose/18 + BUN/2.8] (ถ้า >10-15 mOsm/kg สนับสนุน methanol/ethylene glycol)\n\n**(ง) การรักษาที่ต้องทำทันที**\n\n**1. แก้ hyperkalaemia (K 6.2) เป็นลำดับแรก — สิ่งที่ฆ่าผู้ป่วยได้เร็วที่สุด**\n- **ทำ ECG ทันที** (ดู peaked T wave, PR ยาว, P หาย, QRS กว้าง)\n- **IV 10% calcium gluconate** → stabilise myocardial membrane (onset 1-3 นาที)\n- **Regular insulin + dextrose** และ/หรือ **nebulised salbutamol ขนาดสูง** → shift K เข้าเซลล์\n- **IV NaHCO3** — **เหมาะเป็นพิเศษในผู้ป่วยรายนี้เพราะมี severe metabolic acidosis ร่วม** (ช่วยทั้งแก้กรดและ shift K)\n- **Potassium binder** เพื่อขับ K ออกจากร่างกาย; **loop diuretic** ถ้ายังมีปัสสาวะ\n- **หยุดยาและสารที่เพิ่ม K**: ACEI/ARB, MRA, NSAID, trimethoprim, potassium supplement, heparin; งดอาหารที่มี K สูง\n\n**2. แก้ metabolic acidosis**\n- **IV NaHCO3** พิจารณาเมื่อ **pH < 7.1-7.2 หรือ HCO3 < 12-15** (ผู้ป่วยรายนี้ HCO3 11 เข้าเกณฑ์)\n- **ข้อควรระวังของ bicarbonate**: **Na และน้ำเกิน (ซ้ำเติม volume overload), hypokalaemia หลังแก้, hypocalcaemia (ลด ionised calcium), paradoxical intracellular acidosis, ทำ oxyhaemoglobin dissociation curve เลื่อนซ้าย** — ดังนั้นให้เท่าที่จำเป็นและติดตาม ABG ซ้ำ\n\n**3. จัดการ AKI ควบคู่**\n- **หาและแก้สาเหตุของ AKI**: ประเมินสถานะสารน้ำ (prerenal), **คลำกระเพาะปัสสาวะและทำ ultrasound เพื่อคัดการอุดกั้น (postrenal)**, **อ่าน urine sediment เพื่อประเมิน intrinsic** (muddy brown granular cast = ATN, RBC cast = GN, WBC cast = AIN/pyelonephritis), ส่ง CK ถ้าสงสัย rhabdomyolysis\n- **หยุด nephrotoxin ทุกชนิด** และปรับขนาดยาทุกตัวตาม renal function\n- ให้สารน้ำหรือจำกัดน้ำตามสถานะสารน้ำ (ประเมินด้วยวิธี dynamic ไม่ใช่ให้น้ำอัตโนมัติ)\n\n**4. พิจารณาการบำบัดทดแทนไตอย่างเร่งด่วน (ปรึกษา nephrologist)**\n- ผู้ป่วยมีข้อบ่งชี้ตาม **\"AEIOU\"** หลายข้อแล้ว: **A**cidosis รุนแรงที่แก้ด้วยยาได้ชั่วคราว, **E**lectrolyte คือ hyperkalaemia รุนแรงในผู้ที่ไตวาย, และต้องประเมิน **O**verload และ **U**raemia ร่วม\n- **monitor ECG และ electrolyte ซ้ำอย่างใกล้ชิด** ระหว่างรอและหลังการรักษา", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 2 SAQ ข้อ 1 – แปลผล ABG + dx (ผู้ป่วยชาย u/d COPD, DM: pH 7.1, PO2 55, PCO2 64, HCO3 24)", "MED33 SAQ ข้อ 3 – Acute respiratory acidosis with metabolic compensation (three diseases possible)", "MED30 MCQ ข้อ 49 – Ans. Simple wide anion gap metabolic acidosis (แต่ในโพยเก่าเฉลย Metabolic acidosis)", "MED29 โพย – Anion gap = Na - Cl - HCO3 : ปกติ = 12", "MED35 LMS – A 56-year-old diabetic man: wide anion gap (anion gap 47) + delta HCO3, ratio >2 → mixed wide anion gap and metabolic alkalosis; Winter's formula compensation", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 44 – คำนวณ ABG onset 6 hr pH 7.3 paCO2 60 HCO3 26 → Acute respiratory acidosis with metabolic compensation", "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 16 – ABG ตอบไร CO2 predicted ไม่เข้าเกณฑ์ → metabolic acidosis with respiratory acidosis", "MED34 ข้อสอบ MED ครั้งที่ 2 MCQ (KUB ข้อ 1) – Diarrhea ABG: pH 7.15 PCO2 36 HCO3 15"], "nl": ["B9.1.2(6)", "3.3.17", "B9.2.7(1)"], "_kind": "meq", "_set": "nephro"}, {"id": "N-OSCE-05", "part": "OSCE/SAQ", "lec": "22", "lecture": "Fluid electrolytes: Dysnatremia & Dyskalemia (อ.ชุมพล)", "topic": "SAQ – ECG of hyperkalaemia in CKD on nephrotoxic drugs", "station": "SAQ (เขียนตอบ) 5 นาที", "instruction": "ผู้ป่วยชายอายุ 64 ปี มีประวัติ chronic kidney disease และได้รับยาที่เป็นพิษต่อไต 2 ชนิด (ibuprofen และ enalapril) มาด้วยอาการอ่อนเพลียทั้งตัว ให้ ECG ซึ่งพบ rate 120-125/min สม่ำเสมอ มี P wave นำ QRS ทุกตัว PR 200 ms QRS แคบ 90 ms และมี tall peaked T wave ฐานแคบที่ lead V2-V5\n(ก) จงแปลผล ECG อย่างเป็นระบบ\n(ข) จงให้การวินิจฉัยภาวะที่เป็นสาเหตุ\n(ค) จงอธิบายลำดับการเปลี่ยนแปลงของ ECG ตามความรุนแรงของภาวะนี้\n(ง) จงให้การรักษาตามลำดับพร้อมกลไกของยาแต่ละตัว", "answer": "**(ก) การแปลผล ECG อย่างเป็นระบบ**\n1. **Rate**: 120-125 beats/min → **tachycardia**\n2. **Rhythm**: **normal sinus tachycardia** (มี P wave นำ QRS ทุกตัว สม่ำเสมอ)\n3. **Axis**: normal axis\n4. **Intervals**: **PR 200 ms (ขอบบนของค่าปกติ — เริ่มยาว)**, **QRS 90 ms (narrow/ยังปกติ)**, QT ปกติหรือสั้นลง\n5. **P wave**: ยังเห็นอยู่ชัดเจน (แอมพลิจูดยังไม่ลดลง)\n6. **Chamber enlargement**: ไม่ชัด\n7. **ST-T change**: **tall peaked T wave ที่มีฐานแคบและปลายแหลม (narrow-based, symmetrical, \"tented\") ที่ lead V2-V5**\n8. **Q wave**: ไม่มี pathological Q wave\n\n**Interpretation: sinus tachycardia with tall peaked T waves and borderline PR prolongation เข้าได้กับ hyperkalaemia (ระยะต้นถึงปานกลาง)**\n\n*(ข้อควรแยก: **tall T wave** ยังพบใน **hyperacute phase ของ STEMI** (ฐานกว้างกว่า ไม่สมมาตร มักอยู่ใน territory เดียวกัน และมักมี reciprocal change) และใน **early repolarization/normal variant** ซึ่ง T wave ฐานกว้างและไม่มี PR prolongation)*\n\n**(ข) การวินิจฉัย: Hyperkalaemia in a patient with chronic kidney disease precipitated by nephrotoxic drugs (ibuprofen และ enalapril)**\n\n**กลไกที่ยาทั้งสองตัวทำให้ K สูง**\n- **NSAID (ibuprofen)**: ยับยั้ง prostaglandin → (1) **afferent arteriole หดตัว → GFR ลด → ขับ K ได้น้อยลง** (2) **ลด renin → ลด aldosterone → ลดการขับ K ที่ collecting duct**\n- **ACEI (enalapril)**: **ยับยั้ง angiotensin II → ลด aldosterone** โดยตรง → ลดการขับ K; และ **ขยาย efferent arteriole → ลดความดันใน glomerulus → GFR ลด**\n- ผู้ป่วยมี **CKD อยู่เดิม** ซึ่งความสามารถในการขับ K สำรองเหลือน้อยแล้ว → รวมกันเป็น **\"triple whammy\"** (ถ้ามี diuretic ร่วมด้วย) ซึ่งเป็นสาเหตุ AKI และ hyperkalaemia ที่พบบ่อยที่สุดในเวชปฏิบัติ\n\n**(ค) ลำดับการเปลี่ยนแปลงของ ECG ตามความรุนแรง (ต้องจำเรียงลำดับ)**\n\n| ระดับ K (โดยคร่าว) | การเปลี่ยนแปลงบน ECG | กลไก |\n|---|---|---|\n| **5.5-6.5 mEq/L** | **Tall peaked (tented) T wave ฐานแคบ, QT สั้นลง** | การ repolarisation เร็วขึ้นเพราะ K conductance เพิ่ม |\n| **6.5-7.5** | **PR interval ยาว, P wave แอมพลิจูดลดลงและกว้างขึ้น** | การนำไฟฟ้าใน atrium และ AV node ช้าลง |\n| **7.0-8.0** | **P wave หายไป (\"sine-P\"), QRS เริ่มกว้าง** | atrium หยุดตอบสนอง (atrial standstill) |\n| **>8.0** | **QRS กว้างมากจนรวมกับ T wave เป็น \"sine wave\" pattern**, bundle branch block, fascicular block | Na channel inactivation อย่างกว้างขวาง |\n| **วิกฤต** | **VF, idioventricular rhythm, asystole** | การนำไฟฟ้าล้มเหลวทั้งระบบ |\n\n**กลไกรวบยอด**: K นอกเซลล์สูง → **resting membrane potential ลดความเป็นลบลง (depolarise)** → **Na channel จำนวนมากอยู่ในสภาพ inactivated** → **excitability และความเร็วการนำไฟฟ้าลดลง** ขณะที่ **K conductance เพิ่มทำให้ repolarisation เร็ว (T แหลม, QT สั้น)**\n*(ข้อควรจำสำคัญ: **ระดับ K ไม่สัมพันธ์กับ ECG อย่างแน่นอน** — ผู้ป่วยบางรายมี K 7 แต่ ECG เกือบปกติ และบางรายมี K 6 แต่เกิด arrhythmia; **อัตราการเพิ่มขึ้นของ K มีผลมากกว่าค่าที่วัดได้** ดังนั้น **ECG ที่ปกติไม่ได้แปลว่าปลอดภัย**)*\n\n**(ง) การรักษาตามลำดับพร้อมกลไก**\n\n**ลำดับ 1 — Stabilise membrane (onset 1-3 นาที, ฤทธิ์ 30-60 นาที)**\n- **IV 10% calcium gluconate 10-20 mL ช้าๆ** (หรือ calcium chloride ทางเส้นใหญ่ในภาวะวิกฤต)\n- **กลไก**: **ยก threshold potential ให้เป็นลบน้อยลง** ทำให้ช่องว่างระหว่าง resting potential กับ threshold กลับมากขึ้น → **ลด excitability ของ myocardium และย้อน ECG change**\n- **สำคัญ: ไม่ลดระดับ K เลย** — เป็นเพียงการ \"กันหัวใจหยุด\" ระหว่างรอยาอื่น; ให้ซ้ำได้ถ้า ECG ยังไม่ดีขึ้น; ระวังในผู้ที่ใช้ digoxin (ให้ช้าๆ)\n\n**ลำดับ 2 — Shift K เข้าเซลล์ (onset 15-30 นาที, ฤทธิ์ 2-6 ชั่วโมง)**\n- **Regular insulin 10 units IV + 50% glucose 50 mL (หรือ dextrose infusion)**\n  **กลไก**: insulin กระตุ้น **Na-K ATPase** ที่เยื่อหุ้มเซลล์ (โดยเฉพาะกล้ามเนื้อลาย) → ปั๊ม K เข้าเซลล์; ลด K ได้ **0.5-1.2 mEq/L**\n  **ข้อควรระวัง**: **hypoglycaemia เป็นผลข้างเคียงที่พบบ่อยและเกิดได้ช้าถึง 6 ชั่วโมง โดยเฉพาะในผู้ป่วย CKD ที่ insulin clearance ลดลง** → ต้องติดตามน้ำตาลต่อเนื่อง\n- **Nebulised salbutamol ขนาดสูง (10-20 mg)**\n  **กลไก**: **β2-adrenergic stimulation → เพิ่ม cAMP → กระตุ้น Na-K ATPase** → shift K เข้าเซลล์; **เสริมฤทธิ์กับ insulin**\n  **ข้อควรระวัง**: tachycardia, มือสั่น, และ **ประมาณ 20-40% ของผู้ป่วยไม่ตอบสนอง** จึงไม่ใช้เดี่ยว\n- **IV NaHCO3** — **ให้เมื่อมี metabolic acidosis ร่วม**\n  **กลไก**: การแก้กรดทำให้ **H+ ออกจากเซลล์และ K เข้าเซลล์แลกกัน**; ประโยชน์จำกัดถ้าไม่มี acidosis และทำให้เกิด Na/volume overload\n\n**ลำดับ 3 — ขับ K ออกจากร่างกาย (การแก้ที่แท้จริง)**\n- **Loop diuretic (furosemide)** ถ้ายังมีปัสสาวะ — **กลไก**: ยับยั้ง NKCC2 → เพิ่ม distal Na delivery และ tubular flow → **เพิ่มการขับ K**; ต้องประเมินสถานะสารน้ำก่อน\n- **Potassium binder**: **sodium zirconium cyclosilicate (SZC) หรือ patiromer** (onset เร็วกว่าและปลอดภัยกว่า) — **กลไก**: จับ K ในทางเดินอาหารและขับออกทางอุจจาระ; **sodium polystyrene sulfonate (SPS)** ออกฤทธิ์ช้า หลักฐานจำกัด และสัมพันธ์กับ **colonic necrosis** โดยเฉพาะเมื่อใช้ร่วมกับ sorbitol\n- **Haemodialysis** — **วิธีที่ได้ผลแน่นอนและเร็วที่สุดในการเอา K ออก**; ข้อบ่งชี้: **K สูงรุนแรง, ดื้อต่อการรักษาทางยา, ผู้ป่วยไตวายที่ oliguric/anuric** หรือมีข้อบ่งชี้อื่นตาม AEIOU\n\n**ลำดับ 4 — แก้ต้นเหตุและป้องกันการเกิดซ้ำ (ส่วนที่มักถูกลืมแต่สำคัญที่สุดในระยะยาว)**\n- **หยุด ibuprofen ทันทีและห้ามใช้ NSAID ถาวรในผู้ป่วย CKD**\n- **หยุดหรือพัก enalapril** แล้วประเมินการเริ่มใหม่อย่างระมัดระวังเมื่อ K และ Cr กลับมาคงที่ (เพราะ ACEI มีประโยชน์ในการชะลอ CKD — แนวทางปัจจุบันสนับสนุนการ **ใช้ potassium binder ระยะยาวเพื่อคงยาที่ช่วยชีวิตไว้** แทนการหยุดถาวร)\n- **ทบทวนยาอื่นที่เพิ่ม K**: MRA, K-sparing diuretic, trimethoprim, heparin, β-blocker, potassium supplement และ **เกลือลดโซเดียมที่มี potassium chloride**\n- **ให้คำแนะนำเรื่องอาหารที่มี K สูง** (กล้วย ส้ม มะละกอ มะเขือเทศ ผักใบเขียวเข้ม ถั่ว น้ำผลไม้ น้ำมะพร้าว)\n- **ติดตาม K, Cr และ ECG ซ้ำ** และนัดติดตามใกล้ชิด\n\n*(ตรวจเพิ่มเติมที่ควรทำ: คัด **pseudohyperkalaemia** ถ้า ECG ไม่เข้ากับระดับ K (เจาะยาก รัดแขนนาน กำมือ haemolysis thrombocytosis leukocytosis) → ส่ง plasma potassium ซ้ำ)*", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 3 SAQ ข้อ 8 – คนไข้ CKD ได้ยา nephrotoxic 2 ตัว ให้รูป EKG ให้แปลผล tall peak T กับ dx hyperkalemia: rate 120-125 bpm, normal sinus tachycardia, p wave presented, narrow QRS complex, tall peak t wave", "MED32 MCQ ข้อ 32 – EKG เจอ tall peak T-wave → 10% calcium gluconate, 7.5% NaHCO3", "MED35 Formative SAQ ข้อ 5 – EKG: อ่าน ECG บอกโรค คิดว่าน่าจะ tall peak T hyperK", "MED30 SAQ ข้อ 2 – Hyperkalemia", "MED29 SAQ – EKG: Acute pericarditis, AV block, Hyperkalemia, MI", "MED31 MCQ ข้อ 35 – อะไรไม่ช่วย treat hyperkalemia", "MED32 MCQ ข้อ 29 – creatinine rising หลังได้ diclofenac ยาอะไรให้ต่อได้"], "nl": ["2.2.15", "3.1.12", "B9.2.7(2)"], "_kind": "meq", "_set": "nephro"}], "sections": [{"id": "nephro-22-01", "title": "ช่องของเหลวในร่างกาย — ตัวเลขที่ต้องใช้คำนวณทั้งคาบ", "minutes": 7, "summary": "TBW 60% · ICF สองในสาม · ECF หนึ่งในสาม · และเหตุผลที่โซเดียมอยู่นอกเซลล์ ส่วนโพแทสเซียมอยู่ในเซลล์", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.1.2(4)", "B9.2.5(2)", "B9.3(3)"], "md": "ทุกสูตรในคาบนี้ตั้งอยู่บนตัวเลขชุดเดียว — จำให้แม่นแล้วคำนวณได้หมด\n\n### สัดส่วนมาตรฐาน (ชายไม่อ้วน น้ำหนัก 70 กก.)\n- **Total body water (TBW) = 60% ของน้ำหนักตัว**\n  - **Intracellular fluid (ICF) = 2/3 ของ TBW**\n  - **Extracellular fluid (ECF) = 1/3 ของ TBW**\n    - **Interstitial fluid = 3/4 ของ ECF**\n    - **Intravascular fluid = 1/4 ของ ECF**\n- **ปริมาตรเลือดทั้งหมด = 7% ของน้ำหนักตัว ≈ 5 ลิตร** (พลาสมา 60% + เม็ดเลือดแดง 40%)\n\n### TBW ไม่เท่ากันทุกคน\n**TBW แปรผันตามมวลกล้ามเนื้อ และแปรผกผันกับไขมัน** (ไขมันอุ้มน้ำน้อย) จึงต่างกันตามเพศและวัย\n\n| กลุ่ม | TBW |\n|---|---|\n| ทารกแรกเกิด | **75%** |\n| ทารก | **70%** |\n| **ชายผู้ใหญ่** | **60%** |\n| **หญิงผู้ใหญ่** | **50 – 55%** |\n| **ผู้สูงอายุ** | **45%** |\n\n> **ทำไมต้องจำ** — ทุกสูตรของคาบนี้ (ปริมาณโซเดียมที่ต้องให้, free water deficit, การประมาณว่าโซเดียมจะขึ้นเท่าไร) **คูณด้วย TBW ทั้งสิ้น** · **ถ้าใช้ 0.6 กับหญิงสูงอายุจะคำนวณผิดไปมากจนแก้โซเดียมเร็วเกินและเสี่ยง ODS** — ข้อสอบชอบให้โจทย์เป็นหญิงสูงอายุด้วยเหตุผลนี้\n\n### สารละลายอยู่คนละฝั่งกัน (หน่วย mOsm/L)\n\n| สาร | นอกเซลล์ (ECF) | ในเซลล์ (ICF) |\n|---|---|---|\n| **โซเดียม** | **~140** | **14** |\n| **โพแทสเซียม** | **~4** | **140** |\n| คลอไรด์ | ~106 | 4 |\n| ไบคาร์บอเนต | ~24 | 10 |\n| แมกนีเซียม | 0.8 | **20** |\n| ฟอสเฟต | 2 (อนินทรีย์) | **11 (อินทรีย์)** |\n| **Osmolar activity รวม** | **~281** | **~281** |\n\n**สองเรื่องที่ทำให้เป็นแบบนี้**\n1. **Na⁺/K⁺-ATPase** — สูบโซเดียมออกและดึงโพแทสเซียมเข้าตลอดเวลา ทำให้ **โซเดียมเป็นสารหลักที่กำหนดปริมาตรนอกเซลล์ ส่วนโพแทสเซียมกำหนดปริมาตรในเซลล์**\n2. **Gibbs–Donnan effect** — โปรตีนประจุลบในพลาสมาที่ผ่านผนังหลอดเลือดไม่ได้ ดึงประจุบวกไว้ฝั่งเดียวกัน\n\n> **ข้อสรุปที่ใช้ทั้งคาบ** — **osmolality สองฝั่งเท่ากันเสมอ** เพราะน้ำวิ่งผ่าน **aquaporin** ได้อิสระจนกว่าจะสมดุล · ฉะนั้น **การเปลี่ยนแปลงของโซเดียมในเลือดสะท้อนปริมาณน้ำ ไม่ใช่ปริมาณโซเดียม**\n\n### ให้สารน้ำต่างชนิดแล้วไปอยู่ตรงไหน\n| ให้อะไร | ผลต่อปริมาตร | ผลต่อ POsm |\n|---|---|---|\n| **น้ำเปล่า (free water)** | **กระจายเข้าทั้ง ICF และ ECF ตามสัดส่วนเดิม (ICF ได้มากกว่า)** | **ลดลง → hyponatremia** |\n| **0.9% NSS (isotonic)** | **ขยายเฉพาะ ECF · ICF ไม่เปลี่ยน** | **ไม่เปลี่ยน** |\n| **3% NaCl (hypertonic)** | **ECF ขยาย และดึงน้ำออกจาก ICF → ICF หดลง** | **เพิ่มขึ้น** |\n\n**นี่คือเหตุผลที่**\n- ให้ NSS แก้ปริมาตรได้ดีแต่แก้โซเดียมต่ำได้ช้า เพราะไม่ได้ดึงน้ำออกจากเซลล์\n- ให้ 3% NaCl ได้ผลเร็วในสมองบวม เพราะ **ดึงน้ำออกจากเซลล์สมองโดยตรง**\n- ให้ D5W (ซึ่งกลายเป็นน้ำเปล่าหลังน้ำตาลถูกใช้) เป็นการให้ free water ล้วน ๆ", "pearls": ["TBW ชาย 60% · หญิง 50–55% · ผู้สูงอายุ 45% — ใช้ผิดค่าทำให้คำนวณโซเดียมผิดและแก้เร็วเกิน", "ICF สองในสามของ TBW · ECF หนึ่งในสาม โดย interstitial 3 ส่วนต่อ intravascular 1 ส่วน", "Na⁺/K⁺-ATPase ทำให้โซเดียมคุมปริมาตรนอกเซลล์ และโพแทสเซียมคุมปริมาตรในเซลล์", "น้ำเปล่ากระจายทุกช่อง · NSS ขยายเฉพาะ ECF · 3% NaCl ดึงน้ำออกจากเซลล์"], "items": [{"id": "NEPHRO-22-01-Q1", "kind": "own", "stem": "A 72-year-old woman weighing 50 kg requires calculation of her total body water before sodium correction is planned. Which estimate should be used, and why does it matter?", "choices": ["About 60 percent of body weight (roughly 30 L), because 60 percent is the standard figure for all adults regardless of age or sex", "About 33 percent of body weight (roughly 17 L), because only the extracellular compartment is relevant to sodium correction", "Total body water does not need to be estimated, because sodium correction formulas depend only on the sodium deficit", "About 45 percent of body weight (roughly 22 L), because total body water falls with age and is lower in women, and overestimating it leads to overly rapid sodium correction", "About 70 percent of body weight (roughly 35 L), because total body water rises with age as lean mass is replaced by fat"], "answer": 3, "explain": "**TBW แปรผันตามมวลกล้ามเนื้อและแปรผกผันกับไขมัน** ผู้หญิงมีสัดส่วนไขมันมากกว่าและผู้สูงอายุมีมวลกล้ามเนื้อลดลง **หญิงสูงอายุจึงใช้ประมาณ 45%** → 50 × 0.45 ≈ **22 ลิตร**\n\n**ทำไมจึงสำคัญ** — สูตรทั้งหมดของคาบนี้คูณด้วย TBW เช่น **ปริมาณโซเดียมที่ต้องให้ = TBW × (Na ที่ต้องการ − Na ปัจจุบัน)** · **ถ้าใช้ 30 ลิตรแทน 22 ลิตร จะคำนวณว่าต้องให้โซเดียมมากกว่าความจริงราวหนึ่งในสาม → โซเดียมขึ้นเร็วเกินเป้า → เสี่ยง osmotic demyelination syndrome** ซึ่งหญิงสูงอายุที่กิน thiazide เป็นกลุ่มเสี่ยงสูงอยู่แล้ว\n\n- **60%** เป็นค่าของ **ชายผู้ใหญ่ที่ไม่อ้วน** ไม่ใช่ค่ามาตรฐานของทุกคน\n- **70%** เป็นค่าของ **ทารก** — TBW **ลดลง** ตามอายุ ไม่ใช่เพิ่มขึ้น\n- **ECF อย่างเดียวใช้ไม่ได้** เพราะโซเดียมที่ให้เข้าไปกระจายและดึงน้ำจากทุกช่อง สูตรจึงใช้ **TBW ทั้งหมด**\n- **ข้ามการประมาณ TBW ไม่ได้** เพราะไม่มีสูตรไหนในหัวข้อนี้ที่ไม่ใช้ TBW", "pearl": "หญิงสูงอายุใช้ TBW ประมาณ 45% ของน้ำหนักตัว — ใช้ 0.6 กับคนกลุ่มนี้คือสูตรสำเร็จของการแก้โซเดียมเร็วเกิน", "topic": "ช่องของเหลวในร่างกาย — ตัวเลขที่ต้องใช้คำนวณทั้งคาบ", "src": "", "ref": [], "nl": ["B9.2.5(2)", "B9.4(2)"]}]}, {"id": "nephro-22-02", "title": "Osmolality, tonicity และ effective osmole", "minutes": 8, "summary": "สูตร POsm · สารที่ดึงน้ำได้จริงกับสารที่ผ่านเยื่อหุ้มเซลล์ไปเฉย ๆ · สมองปรับตัวอย่างไร", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.3(3)", "B9.2.5(2)", "B9.1.2(5)"], "md": "### นิยามที่ต้องแยกให้ออก\n| คำ | ความหมาย |\n|---|---|\n| **Osmolarity** | จำนวนออสโมลต่อสารละลาย **1 ลิตร** |\n| **Osmolality** | จำนวนออสโมลต่อตัวทำละลาย **1 กิโลกรัม** (mOsm/kg H₂O) · **ปกติ 280 – 295** |\n| **Tonicity (effective osmolality)** | **เฉพาะออสโมลที่ผ่านเยื่อหุ้มเซลล์ไม่ได้ จึงดึงน้ำข้ามเยื่อได้จริง** |\n\n> **Osmolality ไม่เท่ากับ tonicity** — นี่คือแก่นของหัวข้อนี้\n\n**สูตรคำนวณ**\n```\nPOsm = 2 × (Na + K) + กลูโคส/18 + BUN/2.8\n```\nในทางปฏิบัติ **BUN มีส่วนร่วมน้อยกว่า 5 mOsm/kg** และ K ก็น้อย จึงประมาณได้ว่า **POsm ≈ 2 × โซเดียมในเลือด**\n\n### Effective เทียบกับ ineffective osmole\n| **Effective osmole** (ผ่านเยื่อไม่ได้ → ดึงน้ำได้จริง) | **Ineffective osmole** (ผ่านเยื่อได้ → ไม่ดึงน้ำ) |\n|---|---|\n| **โซเดียมและเกลือของมัน** | **Urea (BUN)** |\n| **กลูโคสเมื่ออินซูลินไม่พอ** | **เอทานอล** |\n| **Mannitol** | **Ethylene glycol** |\n| **Glycine, maltose** (จากน้ำยาล้างระหว่างผ่าตัด) | **Isopropyl alcohol, methanol** |\n\n**ผลที่ตามมาทางคลินิก**\n- **ผู้ป่วยไตวายที่ BUN สูงมาก มี osmolality สูงก็จริง แต่ tonicity ปกติ** — ยูเรียเข้าเซลล์ได้ จึงไม่ทำให้เซลล์เหี่ยว **ไม่ต้องรักษาว่าเป็น hypertonic**\n- **ผู้ป่วยเมาเอทานอลมี osmolal gap กว้าง แต่เซลล์ไม่เหี่ยว** ด้วยเหตุผลเดียวกัน\n- **น้ำตาลสูงดึงน้ำออกจากเซลล์จริง** จึงทำให้โซเดียมในเลือดเจือจางลง (translocational hyponatremia) — จะกล่าวถึงในหัวข้อถัดไป\n\n### สมองปรับตัวอย่างไร — กลไกที่อธิบายทั้ง ODS และสมองบวม\nสมองอยู่ในกะโหลกที่ขยายไม่ได้ จึงต้องปรับปริมาตรเซลล์ให้เร็วที่สุด\n\n**เมื่อโซเดียมตกเฉียบพลัน (hyponatremia)** → น้ำไหลเข้าเซลล์สมอง → **สมองบวม** → สมองตอบสนองด้วย **volume regulatory decrease** คือ **ขับโพแทสเซียมและคลอไรด์ออกจากเซลล์ก่อน (เป็นชั่วโมง) ตามด้วยออสโมลอินทรีย์ เช่น myoinositol, กลูตาเมต, ทอรีน (ใช้เวลา 24 – 48 ชั่วโมง)**\n\n**เมื่อโซเดียมสูงเฉียบพลัน (hypernatremia)** → น้ำออกจากเซลล์ → **สมองหด** → สมองตอบสนองด้วย **volume regulatory increase** คือ **สะสมอิเล็กโทรไลต์และออสโมลอินทรีย์เข้าเซลล์**\n\n> **นี่คือเหตุผลที่ \"เฉียบพลัน\" กับ \"เรื้อรัง\" เปลี่ยนการรักษาทั้งหมด**\n> - **เฉียบพลัน (< 48 ชั่วโมง)** — สมองยังปรับตัวไม่ทัน **อาการรุนแรงจากสมองบวม** และ **แก้เร็วได้ปลอดภัยกว่า**\n> - **เรื้อรัง (> 48 ชั่วโมง)** — สมองขับออสโมลออกไปแล้ว **จึงมีอาการน้อยแม้โซเดียมต่ำมาก** แต่ **ถ้าแก้เร็ว เซลล์สมองที่ไม่มีออสโมลเหลือจะเหี่ยวอย่างรุนแรง → osmotic demyelination syndrome**\n\n### กับดักที่คนพลาดจริง\n- **อย่าตกใจกับ osmolality ที่สูงจาก BUN** — ดู tonicity เสมอ\n- **Osmolal gap = osmolality ที่วัดได้ − ที่คำนวณได้ · ปกติ < 10** · ถ้ากว้างให้คิดถึง **methanol, ethylene glycol, เอทานอล, mannitol และ isopropyl alcohol**\n- **ผู้ป่วยที่โซเดียมต่ำมากแต่ดูสบายดี แปลว่าเรื้อรัง** ซึ่งเป็นกลุ่มที่ **อันตรายที่สุดเวลาแก้** ไม่ใช่กลุ่มที่ปลอดภัย", "pearls": ["POsm = 2(Na + K) + กลูโคส/18 + BUN/2.8 ≈ 2 × Na", "Urea และเอทานอลเป็น ineffective osmole — เพิ่ม osmolality แต่ไม่ดึงน้ำ ไม่ทำให้เซลล์เหี่ยว", "สมองขับโพแทสเซียมและคลอไรด์ออกใน 2–3 ชั่วโมง แล้วขับออสโมลอินทรีย์ใน 24–48 ชั่วโมง", "โซเดียมต่ำมากแต่ผู้ป่วยดูสบายดี = เรื้อรัง = กลุ่มที่เสี่ยง ODS มากที่สุดเวลาแก้", "Osmolal gap ปกติน้อยกว่า 10 — กว้างให้คิดถึง methanol, ethylene glycol และแอลกอฮอล์อื่น"], "items": [{"id": "NEPHRO-22-02-Q1", "kind": "own", "stem": "A 64-year-old man on haemodialysis has a measured plasma osmolality of 320 mOsm/kg with sodium 138 mEq/L, glucose 95 mg/dL and BUN 110 mg/dL. He is alert with no focal deficit. Which statement is correct?", "choices": ["The osmolal gap is wide, which confirms toxic alcohol ingestion", "Urea is an effective osmole, so his brain cells are shrunken and he is at risk of intracranial haemorrhage", "The measured osmolality is erroneous because it exceeds the calculated value", "His effective osmolality (tonicity) is normal because urea crosses cell membranes freely and does not shift water", "He has true hypertonicity and should receive free water urgently to lower the osmolality"], "answer": 3, "explain": "คำนวณได้ **POsm = 2(138) + 95/18 + 110/2.8 = 276 + 5.3 + 39.3 ≈ 320 mOsm/kg** — **ตรงกับค่าที่วัดได้ ไม่มี osmolal gap** และ **ส่วนที่ทำให้สูงคือยูเรียเกือบทั้งหมด (39 จาก 320)**\n\n**ยูเรียเป็น ineffective osmole** เพราะผ่านเยื่อหุ้มเซลล์ได้อิสระ จึงกระจายเท่ากันทั้งในและนอกเซลล์ **ไม่สร้างแรงดึงน้ำข้ามเยื่อ** · **tonicity ที่แท้จริง ≈ 2 × Na = 276 ซึ่งปกติ** ผู้ป่วยจึงรู้สึกตัวดี ไม่มีอาการทางสมอง และ **ไม่ต้องรักษาภาวะ hypertonic**\n\n- **ให้น้ำเปล่าเร่งด่วน** จะทำให้ **โซเดียมเจือจางลงจนเกิด hyponatremia** โดยไม่ได้แก้อะไร\n- **ค่าที่วัดไม่ผิด** — ค่าที่วัดได้ตรงกับที่คำนวณพอดี ซึ่งยืนยันว่าถูกต้อง\n- **ยูเรียไม่ใช่ effective osmole** จึงไม่ทำให้เซลล์สมองเหี่ยว (ตรงข้ามกับ **โซเดียม กลูโคส และ mannitol**)\n- **ไม่มี osmolal gap** ในรายนี้ จึงสรุปเรื่องแอลกอฮอล์พิษไม่ได้ — osmolal gap คือ **ค่าที่วัดลบค่าที่คำนวณ** ซึ่งที่นี่เท่ากับศูนย์", "pearl": "BUN สูงทำให้ osmolality สูงแต่ tonicity ปกติ — ดู effective osmolality (≈ 2 × Na) เสมอ ไม่ใช่ตัวเลข osmolality ดิบ", "topic": "Osmolality, tonicity และ effective osmole", "src": "", "ref": [], "nl": ["B9.3(3)", "B9.2.5(2)"]}]}, {"id": "nephro-22-03", "title": "ADH — ตัวคุมน้ำ และสิ่งที่กระตุ้นมันนอกเหนือจากความเข้มข้น", "minutes": 8, "summary": "Osmoreceptor กับ baroreceptor · เกณฑ์ของความกระหายน้ำสูงกว่าเกณฑ์ของ ADH · คลื่นไส้คือตัวกระตุ้นที่แรงที่สุด", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.1.2(8)", "B9.1.2(5)", "B9.2.5(2)"], "md": "**โซเดียมในเลือดถูกกำหนดโดยปริมาณน้ำ ไม่ใช่ปริมาณโซเดียม** และสิ่งที่คุมน้ำมีสองอย่างเท่านั้นคือ **ADH (vasopressin) กับความกระหายน้ำ**\n\n### สมดุลน้ำปกติ\n**น้ำเข้า** — น้ำดื่ม (แปรผัน) + น้ำในอาหาร **0.5 – 1 ลิตร** + น้ำจากเมตะบอลิซึม **0.25 – 0.4 ลิตร** · รวมราว **2 – 2.5 ลิตรต่อวัน**\n\n**น้ำออก**\n- **Sensible loss — ปัสสาวะ** ซึ่ง **แปรผันตามปริมาณสารที่ต้องขับ และแปรผันตามความสามารถในการทำให้ปัสสาวะเข้มข้น**\n- **Insensible loss** — อุจจาระ **100 mL** · ผิวหนัง **300 – 400 mL** · ลมหายใจ **300 – 400 mL**\n\n> **ตัวอย่างที่อาจารย์ยกในสไลด์** — ถ้าต้องขับสาร **600 mOsm ต่อวัน** และไตทำให้ปัสสาวะเข้มข้นได้สูงสุด **1,200 mOsm/kg** → **ปัสสาวะขั้นต่ำ = 600 ÷ 1,200 = 0.5 ลิตร** ฉะนั้น **ต้องดื่มน้ำอย่างน้อย 500 mL จึงจะไม่ขาดน้ำ** · กลับกัน **คนที่กินโปรตีนและเกลือน้อยมาก (เช่น beer potomania หรือ tea-and-toast diet) มีสารให้ขับน้อย จึงขับน้ำได้น้อยตามไปด้วย และเกิดโซเดียมต่ำได้แม้ดื่มน้ำไม่มากนัก**\n\n### ตัวกระตุ้น ADH สองระบบ\n\n**1 · Osmotic stimuli (osmoreceptor ที่ไฮโปทาลามัส)** — ไวมาก ตอบสนองต่อการเปลี่ยนแปลง osmolality เพียง 1 – 2%\n\n> **จุดที่อาจารย์เน้นในสไลด์** — **เกณฑ์ของ ADH ต่ำกว่าเกณฑ์ของความกระหายน้ำ** · ADH เริ่มหลั่งเมื่อ osmolality แตะราว **280 – 285** ซึ่งเป็นจุดที่ปัสสาวะเริ่มเข้มข้นขึ้น ส่วน **ความกระหายน้ำเริ่มที่ราว 290 – 295 ซึ่งเป็นจุดที่ไตทำให้ปัสสาวะเข้มข้นสุดแล้ว** — แปลว่า **ร่างกายใช้ไตประหยัดน้ำก่อน แล้วค่อยสั่งให้ดื่มน้ำเป็นด่านสุดท้าย**\n>\n> อีกข้อ — **UOsm แปรผกผันกับปริมาณปัสสาวะ** และ **การเปลี่ยนแปลงของ ADH ที่ระดับต่ำมีผลต่อปริมาณปัสสาวะมากกว่าที่ระดับสูง** (กราฟชันตรงช่วงต้น)\n\n**2 · Non-osmotic stimuli** — ทำงานผ่าน **baroreceptor** และตัวกระตุ้นอื่น\n\n| ตัวกระตุ้น | หมายเหตุ |\n|---|---|\n| **ปริมาตรเลือดหรือความดันลดลง** | ต้องลดลงราว **5 – 10%** จึงเริ่มมีผล แต่เมื่อมีผลแล้วจะ **แรงกว่าสัญญาณ osmotic** |\n| **คลื่นไส้** | **แรงที่สุดในบรรดาตัวกระตุ้นที่ไม่ใช่ osmotic** |\n| ความเจ็บปวด ความเครียด | |\n| **น้ำตาลในเลือดต่ำ** | |\n| **RAAS · angiotensin II** | |\n| **ภาวะพร่องออกซิเจนและคาร์บอนไดออกไซด์คั่ง** | |\n| **ยา** | carbamazepine, SSRI, cyclophosphamide, opioid, ecstasy, vincristine |\n\n> **สัญญาณจากปริมาตรไม่ได้ทำลายการควบคุมตาม osmolality แต่ไป \"เลื่อน set point และเปลี่ยนความชัน\" ของการหลั่ง ADH ตามสัดส่วนของปริมาตรที่เสียไป** — นี่คือเหตุผลที่ **ผู้ป่วยขาดน้ำจะกักน้ำไว้จนโซเดียมต่ำได้ ทั้งที่โซเดียมต่ำควรจะกด ADH** · **ร่างกายเลือกรักษาปริมาตรก่อนความเข้มข้นเสมอ**\n\n### กลไกทำให้ปัสสาวะเจือจางและเข้มข้น\n- **ทำให้เจือจางได้** ต้องมีครบสามอย่าง — **(1) ส่งสารน้ำถึง diluting segment ได้พอ** (ต้องมี GFR พอ) **(2) TAL และ DCT ดูดเกลือออกจากน้ำได้โดยที่น้ำตามไม่ได้** และ **(3) ADH ต้องถูกกด**\n- **ทำให้เข้มข้นได้** ต้องมี — **medullary interstitium ที่เข้มข้น (สร้างโดย countercurrent multiplier ที่ TAL และการหมุนเวียนของยูเรีย)** และ **ADH ที่เปิด aquaporin-2 ที่ collecting duct**\n\n**ข้อนี้อธิบายกลไกของโรคได้หลายอย่าง** — ยา thiazide ออกฤทธิ์ที่ DCT ซึ่งเป็น diluting segment **จึงรบกวนการทำให้ปัสสาวะเจือจางโดยไม่กระทบการทำให้เข้มข้น → โซเดียมต่ำ** ขณะที่ **loop diuretic ทำลาย medullary gradient จึงรบกวนการทำให้เข้มข้นด้วย → ไม่ค่อยทำให้โซเดียมต่ำ**", "pearls": ["โซเดียมในเลือดบอกปริมาณน้ำ ไม่ได้บอกปริมาณโซเดียมในร่างกาย", "เกณฑ์ ADH (280–285) ต่ำกว่าเกณฑ์ความกระหายน้ำ (290–295) — ไตประหยัดน้ำก่อน แล้วค่อยสั่งให้ดื่ม", "คลื่นไส้คือตัวกระตุ้น ADH ที่ไม่ใช่ osmotic ที่แรงที่สุด", "ปริมาตรที่พร่องชนะความเข้มข้นเสมอ — ร่างกายยอมให้โซเดียมต่ำเพื่อรักษาปริมาตร", "Thiazide ทำให้โซเดียมต่ำเพราะรบกวนการเจือจางที่ DCT แต่ยังทำให้ปัสสาวะเข้มข้นได้ ส่วน loop diuretic ทำลาย gradient จึงไม่ค่อยทำให้โซเดียมต่ำ"], "items": [{"id": "NEPHRO-22-03-Q1", "kind": "own", "stem": "A 58-year-old woman is admitted with 2 days of vomiting from gastroenteritis. She has been drinking plain water. Sodium is 124 mEq/L, plasma osmolality 258 mOsm/kg, urine osmolality 580 mOsm/kg and urine sodium 12 mEq/L. She has dry mucous membranes and postural hypotension. Why is her urine inappropriately concentrated despite a low plasma osmolality?", "choices": ["Her osmoreceptors are destroyed, so ADH is secreted autonomously regardless of any stimulus", "Plain water ingestion directly stimulates ADH release through gastric stretch receptors", "The kidney has lost its medullary concentration gradient, which forces the urine osmolality upward", "This pattern proves SIADH, because the urine osmolality is above 100 mOsm/kg", "Hypovolaemia and nausea are both powerful non-osmotic stimuli to ADH release, and volume defence overrides osmotic suppression"], "answer": 4, "explain": "ผู้ป่วยมี **สองตัวกระตุ้น ADH ที่ไม่ใช่ osmotic พร้อมกัน** — **ปริมาตรพร่องจากการอาเจียน** (ปากแห้ง ความดันตกเวลาเปลี่ยนท่า) และ **คลื่นไส้ ซึ่งสไลด์ระบุว่าเป็นตัวกระตุ้นที่แรงที่สุดในกลุ่มนี้** · **สัญญาณจากปริมาตรจะเลื่อน set point ของ ADH จนชนะการกดตาม osmolality** ร่างกายจึงกักน้ำไว้ทั้งที่โซเดียมต่ำอยู่แล้ว — **ร่างกายเลือกรักษาปริมาตรก่อนความเข้มข้นเสมอ**\n\n- **Osmoreceptor ไม่ได้ถูกทำลาย** — มันยังทำงานปกติ เพียงแต่ถูกสัญญาณจากปริมาตรกลบ\n- **การเสีย medullary gradient จะทำให้ปัสสาวะ *เจือจาง* ไม่ใช่เข้มข้น**\n- **ไม่ใช่ SIADH** — จุดแยกสำคัญคือ **urine sodium 12 mEq/L ซึ่งต่ำ** บ่งว่าไตกำลังหวงโซเดียมเพราะปริมาตรพร่อง · **SIADH ต้อง euvolemic และ urine sodium มักสูงกว่า 30 – 40 mEq/L** · UOsm > 100 พบได้ในทั้งสองภาวะ จึงแยกไม่ได้ด้วยตัวเดียว\n- **การดื่มน้ำ *กด* ADH** ไม่ได้กระตุ้น", "pearl": "UOsm สูงในคนโซเดียมต่ำ ให้ดู urine sodium ต่อ — ต่ำแปลว่าปริมาตรพร่อง (ADH จาก baroreceptor) สูงแปลว่า SIADH", "topic": "ADH — ตัวคุมน้ำ และสิ่งที่กระตุ้นมันนอกเหนือจากความเข้มข้น", "src": "", "ref": [], "nl": ["B9.1.2(8)", "B9.2.5(2)", "B9.1.2(5)"]}]}, {"id": "nephro-22-04", "title": "Hyponatremia — ไล่ 5 ขั้น และตัดของปลอมออกก่อน", "minutes": 9, "summary": "ยืนยัน osmolality → ดู UOsm → ประเมินปริมาตร → ดูความรุนแรง → จึงค่อยรักษา", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electrolyte: Dysnatremia and Dyskalemia · หน่วยโรคไต รพ.ราชวิถี", "nl": ["B9.2.5(2)", "B9.3(3)", "B9.1.2(5)"], "md": "**Hyponatremia คือความผิดปกติของอิเล็กโทรไลต์ที่พบบ่อยที่สุดในโรงพยาบาล** อาจารย์วางลำดับไว้ **5 ขั้น** — ห้ามข้าม\n\n### ขั้นที่ 1 · ยืนยัน serum osmolality ก่อน\n\n| POsm | เรียกว่า | แปลว่า |\n|---|---|---|\n| **< 275 – 280** | **Hypotonic (true) hyponatremia** | **น้ำเกินจริง → ไปขั้นที่ 2** |\n| **275 – 290 (ปกติ)** | **Isotonic — pseudohyponatremia** | **ของปลอม** |\n| **> 290** | **Hypertonic — translocational** | **มีสารดึงน้ำออกจากเซลล์** |\n\n**Pseudohyponatremia (isotonic)** — เกิดจาก **ส่วนที่เป็นของแข็งในพลาสมาเพิ่มขึ้น** ทำให้น้ำต่อปริมาตรลดลง ค่าโซเดียมที่วัดด้วยวิธีเจือจาง (indirect ISE) จึงต่ำเทียม\n- **ไตรกลีเซอไรด์ > 1,000 mg/dL** · **โปรตีน > 10 g/dL** (multiple myeloma, IVIG) · LP-x ใน cholestasis\n- **ยืนยันด้วยการวัด direct ISE (ไม่เจือจาง) ซึ่งจะได้ค่าปกติ** — สไลด์เขียนว่า **indirect ISE < direct ISE**\n- **ไม่ต้องรักษาโซเดียม ให้รักษาสาเหตุ**\n\n**Translocational (hypertonic)** — **น้ำตาลสูง** หรือ **mannitol, glycine, maltose** ดึงน้ำออกจากเซลล์มาเจือจางโซเดียม\n- **สูตรแก้: บวก 1.6 – 2.4 mEq/L ต่อกลูโคสที่เกิน 100 mg/dL ทุก ๆ 100**\n- **osmolality จริงไม่ได้ต่ำ** การรักษาคือ **แก้น้ำตาล ไม่ใช่ให้เกลือเข้มข้น**\n\n### ขั้นที่ 2 · ดู urine osmolality\n| UOsm | แปลว่า |\n|---|---|\n| **< 100 mOsm/kg** | **ADH ถูกกดอย่างถูกต้อง ไตเจือจางปัสสาวะได้เต็มที่** → **น้ำเข้ามากเกินความสามารถขับ** เช่น **primary polydipsia · beer potomania · tea-and-toast diet** |\n| **> 100 mOsm/kg** | **มีฤทธิ์ ADH อยู่** (เหมาะสมหรือไม่เหมาะสมก็ตาม) → **ไปขั้นที่ 3** |\n\n### ขั้นที่ 3 · ประเมินปริมาตร แล้วดู urine sodium ควบคู่\n\n| ปริมาตร | Urine Na | คิดถึง |\n|---|---|---|\n| **พร่อง (hypovolemic)** | **< 20 – 30** | เสียทางลำไส้ (อาเจียน ท้องเสีย) · เสียทางผิวหนัง · third spacing |\n| **พร่อง** | **> 30 – 40** | **ยาขับปัสสาวะ · ภาวะต่อมหมวกไตบกพร่อง · cerebral salt wasting · โรคไตที่เสียเกลือ** |\n| **ปกติ (euvolemic)** | **> 30 – 40** | **SIADH** · ไทรอยด์ต่ำ · ต่อมหมวกไตบกพร่อง |\n| **เกิน (hypervolemic)** | **< 20 – 30** | **หัวใจล้มเหลว · ตับแข็ง · nephrotic syndrome** (ปริมาตรเลือดที่ไหลเวียนจริงต่ำ ไตจึงหวงโซเดียม) |\n| **เกิน** | **> 30 – 40** | **ไตวาย** (ไตขับโซเดียมออกเองไม่ได้ควบคุม) |\n\n> **ข้อควรระวัง — ถ้าผู้ป่วยเพิ่งได้ยาขับปัสสาวะ urine sodium ใช้แปลผลไม่ได้** ให้ใช้ **fractional excretion of urea (< 35% = ปริมาตรพร่อง)** แทน\n\n### ขั้นที่ 4 · ประเมินความรุนแรงจาก \"อาการ\" ไม่ใช่ตัวเลข\n| ระดับ | อาการ |\n|---|---|\n| **รุนแรง (severe)** | **อาเจียน · ซึมลงมาก · ชัก · โคม่า (GCS ≤ 8) · หายใจล้มเหลว** — **ต้องให้ 3% NaCl ทันที** |\n| **ปานกลาง (moderate)** | คลื่นไส้โดยไม่อาเจียน · สับสน · ปวดศีรษะ |\n| **น้อย** | ไม่มีอาการ หรือมีเพียงเดินเซ ล้มง่าย สมาธิสั้น (พบในผู้สูงอายุที่โซเดียมต่ำเรื้อรัง) |\n\n**ต้องระบุด้วยว่าเฉียบพลันหรือเรื้อรัง** — **เฉียบพลัน < 48 ชั่วโมง** (สมองยังไม่ปรับตัว เสี่ยงสมองบวม) · **เรื้อรัง > 48 ชั่วโมง หรือไม่ทราบเวลา** (ให้ถือว่าเรื้อรังไว้ก่อนเสมอ เสี่ยง ODS เวลาแก้)\n\n**กลุ่มเสี่ยงสมองบวมเฉียบพลันตามสไลด์** — **หญิงวัยมีประจำเดือนหลังผ่าตัด · หญิงสูงอายุที่กิน thiazide · ผู้ป่วยจิตเวชที่ดื่มน้ำมาก · เด็ก · ผู้ที่ขาดออกซิเจน · นักวิ่งมาราธอน**\n\n### ขั้นที่ 5 · จึงค่อยเลือกการรักษา (หัวข้อถัดไป)\n\n### กับดักที่คนพลาดจริง\n- **ข้ามขั้นที่ 1 แล้วรีบให้เกลือ** ในผู้ป่วยที่จริง ๆ เป็น pseudohyponatremia หรือน้ำตาลสูง\n- **ประเมินปริมาตรจากการตรวจร่างกายอย่างเดียวแม่นยำต่ำ** — ต้องใช้ urine sodium และ FEurea ช่วยเสมอ\n- **โซเดียมต่ำระดับเดียวกันอาจไม่มีอาการเลยหรือชักได้** ขึ้นกับว่าเกิดเร็วแค่ไหน — **ตัวเลขไม่ใช่ตัวตัดสินความเร่งด่วน**", "pearls": ["ไล่ 5 ขั้น: ยืนยัน osmolality → UOsm ≷ 100 → ปริมาตร + urine sodium → ความรุนแรงจากอาการ → รักษา", "TG เกิน 1,000 หรือโปรตีนเกิน 10 g/dL = pseudohyponatremia ยืนยันด้วย direct ISE", "น้ำตาลสูง: บวกโซเดียม 1.6–2.4 ต่อกลูโคสที่เกิน 100 ทุก 100 — รักษาน้ำตาล ไม่ใช่ให้เกลือ", "UOsm น้อยกว่า 100 = น้ำเข้ามากเกิน (polydipsia, beer potomania) · มากกว่า 100 = มีฤทธิ์ ADH", "เพิ่งได้ยาขับปัสสาวะ urine sodium ใช้ไม่ได้ ให้ใช้ FEurea น้อยกว่า 35% แทน", "ไม่ทราบว่าเกิดมานานแค่ไหน ให้ถือว่าเรื้อรังไว้ก่อนเสมอ"], "items": [{"id": "N-OLD-052", "kind": "old", "stem": "Before choosing therapy for hyponatraemia, which assessment is most important?", "choices": ["Serum creatinine alone", "Urine output alone", "Serum potassium alone", "Volume status together with serum and urine osmolality and urine sodium", "Blood pressure alone"], "answer": 3, "explain": "**อัลกอริทึม hyponatraemia**: ตรวจ serum osmolality ก่อน (แยก pseudo/translocational) → ถ้าเป็น hypotonic ให้ประเมิน **volume status** → ใช้ **urine osmolality (< 100 = ดื่มน้ำมาก/เบียร์) และ urine sodium (< 20 = ปริมาตรพร่องจริง, > 40 = SIADH หรือเสียเกลือทางไต)** แล้วจึงเลือกการรักษา", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 32", "ref": [], "nl": ["B9.3(3)", "B9.2.5(2)", "B9.3(2)"]}, {"id": "N-OLD-068", "kind": "old", "stem": "A patient has Na 130 mEq/L with plasma glucose 600 mg/dL. How should the sodium be interpreted?", "choices": ["Translocational hyponatraemia — corrected sodium is about 138 mEq/L", "Laboratory error", "True hypotonic hyponatraemia requiring hypertonic saline", "Pseudohyponatraemia from hyperlipidaemia", "SIADH"], "answer": 0, "explain": "**น้ำตาลสูงดึงน้ำออกจากเซลล์ทำให้โซเดียมเจือจาง** — แก้ค่าโดยบวก **1.6-2.4 mEq/L ต่อกลูโคสที่เกิน 100 mg/dL ทุก 100** (600-100 = 500 → บวกประมาณ 8-12) จึงเป็นโซเดียมปกติ; **osmolality จริงไม่ต่ำ** การรักษาคือแก้น้ำตาลไม่ใช่ให้ hypertonic saline", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 54", "ref": [], "nl": ["B9.2.5(2)", "B9.3(3)", "2.3.4"]}, {"id": "N-OLD-063", "kind": "old", "stem": "Which electrolyte abnormality is LEAST likely to cause seizures or altered consciousness?", "choices": ["Hypocalcaemia", "Hypokalaemia", "Hypoglycaemia", "Hypomagnesaemia", "Hyponatraemia"], "answer": 1, "explain": "**Hypokalaemia ออกอาการที่กล้ามเนื้อลายและหัวใจเป็นหลัก** (อ่อนแรง ตะคริว ท้องอืด หัวใจเต้นผิดจังหวะ U wave) ไม่ค่อยทำให้ชักหรือซึม; ตรงข้ามกับ **โซเดียมต่ำ แคลเซียมต่ำ แมกนีเซียมต่ำ และน้ำตาลต่ำ ซึ่งทำให้ชักได้ทั้งหมด**", "pearl": "", "topic": "", "src": "MED35 ลงกองครั้งที่ 2 MCQ ข้อ 36 / MED32 MCQ", "ref": [], "nl": ["B9.2.5(2)", "B9.3(5)"]}]}, {"id": "nephro-22-05", "title": "Hyponatremia — สาเหตุแยกตามปริมาตร และเกณฑ์ SIADH", "minutes": 10, "summary": "hypovolemic · euvolemic · hypervolemic และโรคที่ต้องไม่พลาดคือ adrenal insufficiency", "source": "สไลด์ อ.ชุมพล สันติศิริพัฒน์ — Fluid and Electro
