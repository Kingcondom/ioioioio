 Still disease versus infection", "src": "", "ref": ["MED34 โพย MCQ ไข้ไม่ทราบสาเหตุ", "Yamaguchi criteria; Harrison 21st ed."], "nl": ["2.1.1", "2.1.27", "2.1.50", "2.3.13-3(12)"]}, {"id": "AIR-OLD-50", "kind": "old", "stem": "A 28-year-old woman has daily evening fever for 3 weeks, an evanescent salmon-coloured rash, sore throat, arthralgia, neutrophilic leukocytosis and ferritin 8,000 ng/mL, with negative ANA, RF and blood cultures. What is the most likely diagnosis?", "choices": ["Adult-onset Still disease", "Systemic lupus erythematosus", "Infective endocarditis", "Lymphoma", "Rheumatoid arthritis"], "answer": 0, "explain": "**ไข้รายวัน + ผื่นสีปลาแซลมอนที่มาพร้อมไข้ + เจ็บคอ + เม็ดเลือดขาวสูงชนิด neutrophil + ferritin สูงมาก + ANA/RF ลบ = adult-onset Still disease** ซึ่งเป็นการวินิจฉัยแบบตัดโรคอื่นออก (ต้องตัดการติดเชื้อ โดยเฉพาะ endocarditis และวัณโรค กับมะเร็งต่อมน้ำเหลืองออกก่อน); ระวังภาวะแทรกซ้อน **macrophage activation syndrome** เมื่อเม็ดเลือดต่ำลงทุกซีรีส์และ ferritin พุ่งขึ้นอีก", "pearl": "", "topic": "", "src": "ต่อยอดจาก MED34 โพย ไข้ไม่ทราบสาเหตุ (เขียนใหม่เป็นตัวเลือก)", "ref": [], "nl": ["2.1.1", "2.1.27", "2.1.50"]}, {"id": "AIR-OLD-13", "kind": "old", "stem": "A 20-year-old man presents with fever, arthralgia, a maculopapular rash over the trunk and extremities, and swelling with warmth and limited movement of both knees, ankles and elbows. Hct 40%, WBC 3,500/mm3 (N 45%, L 50%, atypical lymphocyte 5%), platelet 45,000/mm3. What is the most likely diagnosis?", "choices": ["Acute gouty arthritis", "Septic arthritis", "Chikungunya virus infection", "Systemic lupus erythematosus", "Rickettsial infection"], "answer": 2, "explain": "**ไข้ + ผื่น + ปวดข้อหลายข้อสมมาตร + เม็ดเลือดขาวต่ำ + เกล็ดเลือดต่ำ + atypical lymphocyte = ไวรัส (chikungunya หรือ dengue)** ไม่ใช่เก๊าท์ซึ่งไม่ทำให้เม็ดเลือดต่ำและมักเป็นข้อเดียวในชายที่มีปัจจัยเสี่ยง; chikungunya เด่นที่ **ปวดข้อรุนแรงหลายข้อและอาจปวดต่อเนื่องเป็นเดือน** ส่วน dengue เด่นที่ไข้สูง ปวดเมื่อย และเกล็ดเลือดต่ำมากกว่า", "pearl": "", "topic": "", "src": "MED34 โพย MCQ '20 year old man fever, arthralgia, rash ... Diag? A. Chikungunya B. Acute gout C. Rickettsia'", "ref": [], "nl": ["2.1.27", "2.1.1", "2.1.50"]}]}], "date": "TBD — แก้ใน config.lectures"}], "label": "AIR", "thai": "ภูมิแพ้ ภูมิคุ้มกัน และโรคข้อรูมาติก", "accent": {"light": "#8a5a12", "soft": "#f4ecdd", "ink": "#6d460c", "dark": "#d9ab63", "darkSoft": "#241d12", "darkInk": "#ecc98f"}}, {"set": "cardio", "title": "Cardio · ระบบหัวใจและหลอดเลือด", "intro": "เริ่มจากสองคาบของ อ.เจตวรงค์ — คาบ 04 Inflammatory MyoPericardial Syndrome ที่รวมเยื่อหุ้มหัวใจอักเสบ กล้ามเนื้อหัวใจอักเสบ น้ำในเยื่อหุ้มหัวใจ ภาวะบีบรัดหัวใจ และภาวะเยื่อหุ้มหัวใจรัดตัวไว้เป็นเรื่องเดียวกัน และคาบ 10 Circulatory Shock ที่ต่อยอดกันพอดี เพราะ tamponade กับ obstructive shock คือเรื่องเดียวกันคนละมุม เนื้อหาเรียบเรียงจากสไลด์บรรยายจริง ร่วมกับ Harrison's ฉบับที่ 21 และแนวทาง ESC ที่อาจารย์อ้างอิงไว้ จบแต่ละหัวข้อมีข้อสอบเช็คความเข้าใจจากคลัง MED28–MED35 และข้อใหม่ของชุด Cardio ทันที", "howto": "**วิธีใช้** — อ่านเนื้อหาให้จบแล้วตอบข้อสอบท้ายหัวข้อ ระบบเฉลยพร้อมคำอธิบายกลไกทันทีที่ตอบ · ตอบครบทุกข้อแล้วหัวข้อจะถูกทำเครื่องหมายว่าเรียนจบ · ข้อที่ตอบผิดรวมอยู่ในแท็บ **ทบทวนข้อที่ผิด** · จบคาบแล้วไปฝึก **MEQ** ต่อได้เลย\n\n**ลำดับที่แนะนำ** — เรียนคาบ 04 ก่อนคาบ 10 เพราะกลไกที่ว่าเยื่อหุ้มหัวใจ *จำกัดปริมาตรรวมของหัวใจ* คือรากของทั้ง **pulsus paradoxus** และ **obstructive shock** · เมื่อถึงคาบ 10 ให้ยึดสมการ **DO₂ = CO × CaO₂** เป็นแกน แล้วชนิดของช็อกจะไม่ใช่การท่องจำ แต่เป็นผลของการที่ตัวแปรใดตัวแปรหนึ่งพังไป\n\nคาบที่เหลือของชุด Cardio (ischemic heart disease · AF · ไข้รูมาติกและลิ้นหัวใจ · หัวใจเต้นผิดจังหวะและ EKG · ความดันสูงและหัวใจล้มเหลว) ยังไม่ได้ทำบทเรียน แต่ข้อสอบมีอยู่ครบใน drill.html แล้ว", "lectures": [{"lec": "04", "title": "Inflammatory MyoPericardial Syndrome (IMPS)", "subtitle": "เยื่อหุ้มหัวใจอักเสบ · น้ำในเยื่อหุ้มหัวใจและภาวะบีบรัดหัวใจ · ภาวะเยื่อหุ้มหัวใจรัดตัว · กล้ามเนื้อหัวใจอักเสบ", "objectives": ["อธิบายโครงสร้างและหน้าที่ของเยื่อหุ้มหัวใจ และเชื่อมโยงกับกลไกของ **tamponade** และ **constriction** ได้", "แยกคำในสเปกตรัม IMPS — **pericarditis · myopericarditis · perimyocarditis · myocarditis** และจัดระยะตามระยะเวลาได้", "วินิจฉัย **acute pericarditis** ตามเกณฑ์ และ **แยกออกจาก STEMI ด้วย ECG** ได้", "วางแผนการรักษาเยื่อหุ้มหัวใจอักเสบ รวมถึงบทบาทของ **colchicine** และข้อจำกัดในหญิงตั้งครรภ์และหลังกล้ามเนื้อหัวใจตาย", "ไล่สาเหตุจำเพาะที่พบในบ้านเรา โดยเฉพาะ **วัณโรค ยูรีเมีย หลังกล้ามเนื้อหัวใจตาย และมะเร็ง** พร้อมแปลผลน้ำที่เจาะได้", "อธิบายกลไกของ **cardiac tamponade และ pulsus paradoxus** และบอกได้ว่าอะไรคือสิ่งที่ **ห้ามทำ**", "ตัดสินใจได้ว่าเมื่อไรต้องเจาะระบายน้ำทันที และเมื่อไรเลื่อนได้ โดยใช้เกณฑ์ความเสี่ยง", "แยก **constrictive pericarditis ออกจาก restrictive cardiomyopathy** ด้วยการตรวจร่างกาย เอคโค่ และการสวนหัวใจ", "วินิจฉัย **myocarditis** ตามเกณฑ์ CMR/EMB และรู้จักชนิดจำเพาะที่เปลี่ยนการรักษา — **fulminant, giant cell, eosinophilic, ICI และหลังวัคซีน**"], "sections": [{"id": "cardio-04-01", "title": "เยื่อหุ้มหัวใจ — โครงสร้าง หน้าที่ และคำว่า IMPS", "minutes": 8, "summary": "ตัวเลขพื้นฐานที่อธิบายได้ทั้ง tamponade และ constriction", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.1.2(2)", "B7.2.2-3(3)", "B7.2.2-3(4)"], "md": "### ผนังหัวใจสามชั้น\n**Epicardium** (ชั้นนอกที่ปกป้อง) · **Myocardium** (ชั้นกล้ามเนื้อตรงกลาง) · **Endocardium** (ชั้นในบาง ๆ)\nคาบนี้พูดถึงการอักเสบของสองชั้นนอกสุด — **กล้ามเนื้อหัวใจ (myocarditis)** และ **เยื่อหุ้มหัวใจ (pericarditis)** ซึ่งมักเกิดร่วมกัน\n\n### เยื่อหุ้มหัวใจประกอบด้วยอะไร\nเป็นเยื่อ **2 ชั้น** ที่มี **mesothelial cell, คอลลาเจน และเส้นใยอิลาสติน**\n- **Visceral (epicardium)** — ชั้นในบาง ๆ แบบ serosa แนบติดผิวหัวใจ\n- **Parietal** — ชั้นนอกที่ **เหนียวและเป็นพังผืด (fibrous)**\n\n**ตัวเลขที่ต้องจำ**\n- **น้ำในช่องเยื่อหุ้มหัวใจปกติ 15−50 mL**\n- **ความดันในช่องเยื่อหุ้มหัวใจปกติ −5 mmHg ตอนหายใจเข้า ถึง +5 mmHg ตอนหายใจออก**\n\n> **ทำไมสองตัวเลขนี้จึงอธิบายทุกอย่าง** — ช่องนี้ปกติแทบไม่มีที่ว่าง และ **เยื่อหุ้มหัวใจชั้นนอกยืดได้น้อยในระยะสั้น** ดังนั้นน้ำที่เพิ่มขึ้นเพียง **100−200 mL อย่างรวดเร็ว** (เช่นเลือดออกจากอุบัติเหตุ) ก็ดันความดันขึ้นจนหัวใจคลายตัวไม่ได้ ในขณะที่น้ำที่ค่อย ๆ สะสมเป็นเดือนอาจถึง **1−2 ลิตรโดยยังไม่เกิด tamponade** เพราะเยื่อหุ้มมีเวลายืดตัว — **อัตราการสะสมสำคัญกว่าปริมาณ**\n\n### หน้าที่ของเยื่อหุ้มหัวใจ (สไลด์แบ่งไว้ 5 กลุ่ม)\n\n| กลุ่ม | หน้าที่ |\n|---|---|\n| **Mechanical** | **จำกัดการขยายตัวของหัวใจในระยะสั้น** · ทำให้ห้องหัวใจทั้งสี่ทำงานสัมพันธ์กัน (**chamber coupling and interaction**) · รักษาความสัมพันธ์ความดัน-ปริมาตรของแต่ละห้อง |\n| **Reflex** | ปรับระบบไหลเวียนผ่าน **neuroreceptor, mechanoreceptor และ chemoreceptor** |\n| **Membranous / serosal** | **หล่อลื่นลดแรงเสียดทาน** · กระจายแรงโน้มถ่วง แรงดันน้ำ และแรงเฉื่อยให้เท่ากัน · **เป็นเกราะกั้นการติดเชื้อ** |\n| **Metabolic** | vasomotor · ปรับการส่งสัญญาณซิมพาเทติกและแรงบีบตัว · fibrinolytic · immunologic |\n| **Ligamentous** | **จำกัดการเคลื่อนที่ของหัวใจ** · หักล้างผลของการหายใจและการเปลี่ยนท่าทาง |\n\n**ข้อที่ 1 ในกลุ่ม mechanical คือหัวใจของทั้งคาบ** — การที่เยื่อหุ้มหัวใจ \"จำกัดปริมาตรรวมของหัวใจ\" ทำให้ห้องซ้ายและขวา **แย่งที่กัน (ventricular interdependence)** ซึ่งเป็นกลไกเบื้องหลังทั้ง **pulsus paradoxus ใน tamponade** และ **การเปลี่ยนแปลงตามการหายใจใน constriction**\n\n### IMPS — Inflammatory MyoPericardial Syndrome\nเป็น **คำร่ม (umbrella term)** ที่รวมกลุ่มอาการอักเสบของกล้ามเนื้อหัวใจและเยื่อหุ้มหัวใจไว้ด้วยกัน เพราะในทางปฏิบัติสองโรคนี้ **ทับซ้อนกันบ่อยมากจนแยกไม่ขาด**\n\n### ระบาดวิทยา\n| | อุบัติการณ์ | ใครเป็น |\n|---|---|---|\n| **Acute myocarditis** | **6.3−8.6 ต่อประชากรแสนคน** | **ผู้ชายและคนอายุน้อย** |\n| **Acute pericarditis** | **3−32 รายต่อแสนคน-ปี** | ผู้ชายและคนอายุน้อย · **เป็น 5% ของผู้ป่วยเจ็บหน้าอกที่มาห้องฉุกเฉิน** |\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์วางโครงทั้งคาบไว้ว่า **Basis → Presentation → Diagnosis → Therapy → Prognosis → Complication** ใช้ลำดับนี้ทบทวนได้เลย\n- สไลด์แสดงกราฟ **pressure-volume ของ LV และ RV ก่อนและหลังตัดเยื่อหุ้มหัวใจ** (Hoit BD et al. Circ Res 1991) เพื่อพิสูจน์ว่า **เยื่อหุ้มหัวใจมีผลจำกัดการเติมเลือดของหัวใจจริง** — หลังตัดออก กราฟเลื่อนไปทางขวา คือห้องหัวใจเติมเลือดได้มากขึ้นที่ความดันเท่าเดิม\n- สไลด์ย้ำว่า **5% ของผู้ป่วยเจ็บหน้าอกในห้องฉุกเฉินเป็น acute pericarditis** ซึ่งเป็นตัวเลขที่เตือนว่าอย่ามองข้ามโรคนี้เวลาไล่ chest pain\n", "pearls": ["น้ำในเยื่อหุ้มหัวใจปกติ 15−50 mL · ความดัน −5 ถึง +5 mmHg ตามการหายใจ", "อัตราการสะสมของน้ำสำคัญกว่าปริมาณ — 150 mL เร็ว ๆ ทำให้ tamponade ได้ แต่ 1 ลิตรช้า ๆ อาจไม่เป็น", "เยื่อหุ้มหัวใจจำกัดปริมาตรรวมของหัวใจ → ห้องซ้ายขวาแย่งที่กัน = รากของ pulsus paradoxus และ constriction", "Acute pericarditis เป็น 5% ของผู้ป่วยเจ็บหน้าอกที่ห้องฉุกเฉิน"], "items": [{"id": "CARDIO-04-01-Q1", "kind": "own", "stem": "A 24-year-old man sustains a stab wound to the left chest. He is hypotensive with distended neck veins and muffled heart sounds. Bedside echocardiography shows only about 150 mL of pericardial fluid. In contrast, a 60-year-old woman with metastatic breast cancer has 1,200 mL of pericardial fluid on echocardiography but is haemodynamically stable. Which factor best explains this difference?", "choices": ["The rate at which the fluid accumulated relative to the compliance of the pericardium", "The difference in left ventricular ejection fraction between the two patients", "The protein and lactate dehydrogenase content of the pericardial fluid", "The presence of pericardial calcification in the trauma patient", "The absolute volume of pericardial fluid present"], "answer": 0, "explain": "**กลไก** — เยื่อหุ้มหัวใจชั้นนอกเป็นพังผืดที่ **ยืดได้น้อยในระยะสั้นแต่ยืดได้ถ้ามีเวลา** ความสัมพันธ์ระหว่างปริมาตรกับความดันในช่องเยื่อหุ้มหัวใจจึงเป็นเส้นโค้งที่ **ชันมากในช่วงแรกเมื่อน้ำมาเร็ว** — เลือดที่ออกเพียง 100−200 mL จากบาดแผลทะลุจะดันความดันในช่องขึ้นจนเท่ากับความดันคลายตัวของห้องหัวใจ เกิด tamponade ทันที ตรงกันข้าม น้ำที่ค่อย ๆ สะสมเป็นสัปดาห์ถึงเดือนทำให้เยื่อหุ้มหัวใจ **ค่อย ๆ ยืดและเพิ่ม compliance** จึงรองรับได้ถึงหนึ่งถึงสองลิตรโดยความดันยังไม่ขึ้นมาก\n\nสไลด์สรุปไว้ว่าอาการของการกดหัวใจขึ้นกับสามอย่าง: **ปริมาณน้ำ · อัตราการสะสม · คุณสมบัติความยืดหยุ่นของเยื่อหุ้มหัวใจ** โดยอัตราการสะสมเป็นตัวชี้ขาดในทางคลินิก\n\n**ทำไมตัวลวงจึงผิด**\n- *ปริมาตรสัมบูรณ์* — เป็นคำตอบที่ตรงข้ามกับข้อเท็จจริงในโจทย์ คนที่มีน้ำมากกว่าถึง 8 เท่ากลับสบายดี\n- *โปรตีนและ LDH ในน้ำ* — บอกว่าเป็น exudate หรือ transudate ซึ่งช่วยหาสาเหตุ แต่ไม่เกี่ยวกับการเกิด tamponade\n- *หินปูนที่เยื่อหุ้มหัวใจ* — เป็นลักษณะของ **constrictive pericarditis** ที่ใช้เวลาหลายปี ไม่ใช่ของคนไข้บาดเจ็บเฉียบพลัน\n- *ความแตกต่างของ LVEF* — tamponade เป็นปัญหาของ **การคลายตัวและการเติมเลือด (diastolic filling)** ไม่ใช่การบีบตัว คนไข้ tamponade ส่วนใหญ่มี EF ปกติหรือสูงด้วยซ้ำ", "pearl": "เลือดออกเร็ว 150 mL ทำให้ tamponade ได้ · น้ำสะสมช้า 1 ลิตรอาจยังสบายดี — อัตราสำคัญกว่าปริมาณ", "topic": "เยื่อหุ้มหัวใจ — โครงสร้าง หน้าที่ และคำว่า IMPS", "src": "", "ref": [], "nl": ["B7.2.3(1)", "2.2.2"]}]}, {"id": "cardio-04-02", "title": "สเปกตรัมและการจัดระยะของ IMPS", "minutes": 8, "summary": "myopericarditis กับ perimyocarditis ต่างกันตรงไหน และคำว่า fulminant ใช้เมื่อไร", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "B7.2.2-3(4)", "2.3.9-3(6)"], "md": "### เส้นเดียวกัน สองปลาย\nโรคนี้ไม่ได้แยกเป็นสองโรคขาดจากกัน แต่เป็น **สเปกตรัมต่อเนื่อง** ที่มีสองปลาย\n\n**Myocarditis ←── Perimyocarditis ─── Myopericarditis ──→ Pericarditis**\n\n| คำ | หมายความว่า | สิ่งที่เด่น |\n|---|---|---|\n| **Pericarditis** | อักเสบเฉพาะเยื่อหุ้มหัวใจ | เจ็บหน้าอกแบบ pleuritic · **troponin ปกติ** |\n| **Myopericarditis** | ทับซ้อนกัน แต่ **เยื่อหุ้มหัวใจเด่นกว่า** | ภาพทางคลินิกเป็น pericarditis · **troponin ขึ้นแต่การบีบตัวยังปกติ** |\n| **Perimyocarditis** | ทับซ้อนกัน แต่ **กล้ามเนื้อหัวใจเด่นกว่า** | **การบีบตัวเสีย มี wall motion ผิดปกติ** ร่วมกับมีเยื่อหุ้มอักเสบ |\n| **Myocarditis** | อักเสบเฉพาะกล้ามเนื้อหัวใจ | เจ็บหน้าอกแบบ infarct-like · หัวใจล้มเหลว · หัวใจเต้นผิดจังหวะ |\n\n> **ตัวแยกในทางปฏิบัติคือ \"การบีบตัวของหัวใจ\"** — ถ้าภาพคลินิกเป็นเยื่อหุ้มหัวใจอักเสบชัดเจนแต่ **troponin ขึ้นโดยที่ LVEF และ wall motion ยังปกติ** เรียก **myopericarditis** ซึ่ง **พยากรณ์โรคดี** แต่ถ้า **การบีบตัวเสียไปด้วย** กลายเป็น **perimyocarditis** ซึ่งต้องเฝ้าระวังหัวใจล้มเหลวและหัวใจเต้นผิดจังหวะ\n\n### จัดระยะตามระยะเวลา (ใช้เหมือนกันทั้งสองโรค)\n| ระยะ | ระยะเวลาของอาการ |\n|---|---|\n| **Acute** | **≤ 4 สัปดาห์** |\n| **Subacute / incessant** | **> 4 สัปดาห์ ถึง ≤ 3 เดือน** |\n| **Chronic** | **> 3 เดือน** |\n\n### คำจำเพาะของ myocarditis ที่ต้องแยกให้ออก\n**Fulminant myocarditis**\n- **เริ่มเฉียบพลัน ร่วมกับระบบไหลเวียนไม่เสถียร จนต้องใช้ยากระตุ้นหัวใจ (inotrope) หรือเครื่องพยุงการไหลเวียน (mechanical circulatory support)**\n- นี่คือคำนิยาม — **ไม่ได้ขึ้นกับว่า EF ต่ำเท่าไร แต่ขึ้นกับว่าต้องใช้เครื่องพยุงหรือไม่**\n\n**Complicated myocarditis**\n- Acute myocarditis **ร่วมกับอย่างน้อย 1 ข้อ** ต่อไปนี้\n  - **LVEF < 50%** จากคลื่นเสียงสะท้อนหัวใจ\n  - **Sustained ventricular arrhythmia**\n  - **Advanced heart block**\n  - **หัวใจล้มเหลว**\n  - **ช็อกจากหัวใจ**\n\n**Inflammatory cardiomyopathy**\n- **Chronic myocarditis ที่มีการทำงานของหัวใจเสียและมีการปรับรูปของห้องหัวใจ (ventricular remodelling)** แสดงออกเป็น **hypokinetic cardiomyopathy ซึ่งจะโตหรือไม่โตก็ได้** และอาจมีหรือไม่มีจุดกำเนิดหัวใจเต้นผิดจังหวะ\n\n### คำที่ใช้บอกผลลัพธ์\n| คำ | ความหมาย |\n|---|---|\n| **Recurrent** | มีอาการหรือโรคกลับมาใหม่ **หลังจากเคยสงบทางคลินิกแล้ว** |\n| **Remission without residuals** | อาการหาย **และ ECG ตัวชี้วัดทางชีวภาพ และภาพถ่าย (echo, CMR) กลับเป็นปกติทั้งหมด** |\n| **Remission with residuals** | อาการหายแล้ว แต่ **ยังมีความผิดปกติค้างอยู่** ใน ECG ตัวชี้วัด หรือภาพถ่าย |\n\n> **ทำไมต้องแยก \"remission with residuals\"** — เพราะคนกลุ่มนี้คือคนที่ **LGE ยังค้างอยู่ใน CMR หรือ EF ยังไม่กลับมาเต็ม** ซึ่งเป็นกลุ่มที่ต้องติดตามยาวและเป็นกลุ่มเสี่ยงต่อ **dilated cardiomyopathy และการเสียชีวิตเฉียบพลัน** ในอนาคต\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์วางแผนภาพสเปกตรัมไว้ชัดว่า **Perimyocarditis = predominant myocarditis** และ **Myopericarditis = predominant pericarditis** ซึ่งเป็นจุดที่คนสับสนบ่อยที่สุดเพราะชื่อคล้ายกันมาก\n- สไลด์แสดง **spectrum of myocarditis presentations and outcomes** โดยขนาดของรูปสัมพันธ์กับความถี่ — ปลายที่พบบ่อยที่สุดคือ **เจ็บหน้าอกโดยไม่มีหัวใจล้มเหลวและหายเป็นปกติ** ส่วนปลายที่พบน้อยแต่ร้ายแรงคือ **ช็อกจากหัวใจ หัวใจหยุดเต้น dilated cardiomyopathy และเสียชีวิต**\n- คำว่า **fulminant** ในสไลด์ผูกกับ **\"requiring inotropes or mechanical circulatory support\"** เสมอ ไม่ใช่ผูกกับตัวเลข EF\n", "pearls": ["Myopericarditis = เยื่อหุ้มเด่น troponin ขึ้นแต่ EF ปกติ · Perimyocarditis = กล้ามเนื้อเด่น การบีบตัวเสีย", "Fulminant นิยามด้วยการต้องใช้ inotrope หรือเครื่องพยุงการไหลเวียน ไม่ใช่ตัวเลข EF", "Complicated myocarditis = EF <50% หรือ sustained VT หรือ advanced AV block หรือ HF หรือช็อก", "Acute ≤4 สัปดาห์ · subacute >4 สัปดาห์ถึง 3 เดือน · chronic >3 เดือน"], "items": [{"id": "C-OLD-14", "kind": "old", "stem": "A young man has chest pain and an ECG with widespread ST elevation. Troponin-I is markedly elevated but coronary angiography shows normal coronary arteries and echocardiography shows mildly reduced left ventricular function. What is the most likely diagnosis?", "choices": ["Acute rheumatic carditis", "Takotsubo cardiomyopathy", "Type 1 myocardial infarction", "Myopericarditis", "Prinzmetal angina"], "answer": 3, "explain": "**Pericarditis ที่มี troponin สูงและการบีบตัวลดลง = myopericarditis** (การอักเสบลามเข้ากล้ามเนื้อหัวใจชั้นนอก) หลอดเลือดหัวใจปกติจึงไม่ใช่ MI; การรักษายังเป็น NSAID + colchicine แต่ **ต้องงดออกกำลังกายหนักอย่างน้อย 3-6 เดือน** และติดตาม EF", "pearl": "", "topic": "", "src": "MED33 MCQ loop E+F", "ref": [], "nl": ["B7.2.2-3(3)", "B7.2.2-3(4)", "2.3.9-3(6)"]}]}, {"id": "cardio-04-03", "title": "เยื่อหุ้มหัวใจอักเสบเฉียบพลัน — อาการ ECG และเกณฑ์วินิจฉัย", "minutes": 11, "summary": "สี่เกณฑ์ที่ต้องท่อง และวิธีไม่พลาด STEMI", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "B7.3(3)", "2.1.35", "3.1.12"], "md": "### อาการ\n**เจ็บหน้าอก — พบมากกว่า 80% ของผู้ป่วย**\n- **ตำแหน่ง** — หลังกระดูกอก หรือด้านหน้าซ้าย\n- **ร้าวไป** — คอ ไหล่ แขน (ร้าวไป **ขอบสะบัก (trapezius ridge)** เป็นลักษณะที่จำเพาะมาก เพราะเส้นประสาท phrenic เลี้ยงทั้งเยื่อหุ้มหัวใจและบริเวณนั้น)\n- **ลักษณะ** — **เจ็บแหลม แปลบ เปลี่ยนตามการหายใจ (pleuritic)**\n- **ท่าทาง** — **แย่ลงเวลานอนราบ ดีขึ้นเวลานั่งโน้มตัวไปข้างหน้า** — ข้อนี้เป็นลักษณะที่ช่วยแยกจากกล้ามเนื้อหัวใจขาดเลือดได้ดีที่สุดข้อหนึ่ง\n\n**อาการอื่น**\n- **เหนื่อย** — พบบ่อยกว่าในผู้สูงอายุ\n- **เสียงเสียดสีเยื่อหุ้มหัวใจ (pericardial friction rub) — พบราว 33%** เป็นเสียงหยาบ ๆ สามจังหวะ ฟังได้ดีที่สุดที่ขอบล่างซ้ายของกระดูกอกขณะผู้ป่วยโน้มตัวไปหน้าและกลั้นหายใจออก · **เสียงนี้มาแล้วหายได้ในเวลาไม่กี่ชั่วโมง** จึงต้องฟังซ้ำ\n- **น้ำในเยื่อหุ้มหัวใจ — พบราว 60%**\n\n### เกณฑ์วินิจฉัย (ตามที่สไลด์วางไว้)\n> **Definite = อาการทางคลินิกเข้าได้ + มีเกณฑ์เสริม \"มากกว่า 1 ข้อ\"**\n> **Possible = อาการทางคลินิกเข้าได้ + มีเกณฑ์เสริม 1 ข้อ**\n\n**เกณฑ์เสริม 4 กลุ่ม**\n| กลุ่ม | สิ่งที่ตรวจพบ |\n|---|---|\n| **Clinical** | **Pericardial friction rub** |\n| **ECG** | **PR depression และ ST ยกขึ้นเป็นบริเวณกว้าง (widespread)** |\n| **Biomarker** | **CRP สูงขึ้น** |\n| **Imaging** | **น้ำในเยื่อหุ้มหัวใจที่เกิดใหม่หรือมากขึ้น** · **บวมน้ำของเยื่อหุ้มหัวใจหรือ LGE จาก CMR** |\n\n### ECG — จุดที่แยก pericarditis ออกจาก STEMI\n**สิ่งที่พบใน pericarditis**\n- **ST ยกขึ้นแบบเว้า (concave, \"หน้ายิ้ม\") กระจายทั่วไปหลายบริเวณ ไม่จำกัดตามแนวหลอดเลือดเส้นใดเส้นหนึ่ง**\n- **PR depression** — ค่อนข้างจำเพาะ เกิดจากการอักเสบของกล้ามเนื้อหัวใจห้องบน\n- **ใน aVR กลับทิศ — ST depression ร่วมกับ PR elevation**\n- ไม่มี **reciprocal ST depression** ในบริเวณตรงข้าม (ยกเว้น aVR และบางครั้ง V1)\n- ไม่มีการเกิด **Q wave** และไม่มีการสูญเสีย R wave\n\n**ระยะของ ECG ใน pericarditis (4 ระยะคลาสสิก)**\n1. **ST ยกขึ้นทั่วไป + PR depression** (วันแรก ๆ)\n2. **ST และ PR กลับสู่แนวปกติ** (ปลายสัปดาห์แรก)\n3. **T inversion กระจายทั่วไป**\n4. **กลับเป็นปกติ** (อาจใช้เวลาเป็นสัปดาห์ถึงเดือน)\n\n| | **Acute pericarditis** | **STEMI** |\n|---|---|---|\n| รูปร่าง ST | **เว้า (concave)** | **นูน (convex) หรือยกแบบ tombstone** |\n| การกระจาย | **กว้าง ข้ามแนวหลอดเลือด** | **ตามแนวหลอดเลือดเส้นเดียว** |\n| Reciprocal change | **ไม่มี (ยกเว้น aVR)** | **มีชัดเจน** |\n| PR segment | **กด (ยกใน aVR)** | ปกติ |\n| Q wave / R ลดลง | ไม่มี | **มีตามเวลา** |\n| การดำเนินของ T | **T กลับหัวหลัง ST ลงมาปกติแล้ว** | **T กลับหัวขณะ ST ยังยกอยู่** |\n| ลักษณะเจ็บ | **เปลี่ยนตามท่าและการหายใจ** | **แน่น กดทับ ไม่เปลี่ยนตามท่า** |\n\n> **กับดักที่อันตรายที่สุดของหัวข้อนี้** — ผู้ป่วยที่มี **ST ยกเฉพาะบางบริเวณ ร่วมกับ reciprocal ST depression และ troponin สูง คือกล้ามเนื้อหัวใจตายจนกว่าจะพิสูจน์เป็นอย่างอื่น** การวินิจฉัยผิดเป็น pericarditis แล้วให้ NSAID แทนการเปิดหลอดเลือด เป็นความผิดพลาดที่ทำให้ผู้ป่วยเสียชีวิตได้\n\n### การตรวจเพิ่มเติมพื้นฐาน\n**ECG · CXR · เอคโค่ · CBC, CRP/ESR, troponin, ครีแอตินิน, การทำงานของตับ, การทำงานของไทรอยด์** และหาสาเหตุตามบริบท (**HIV, วัณโรค, โรคภูมิต้านตนเอง**)\n- **Troponin ที่สูงขึ้น แปลว่ามีกล้ามเนื้อหัวใจร่วมด้วย → ยกระดับเป็น myopericarditis** ต้องส่งเอคโค่ประเมินการบีบตัวและรับไว้ในโรงพยาบาล\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ใช้แผนภาพเกณฑ์วินิจฉัยแบบ **Definite / Possible / Unlikely-rejected** เหมือนกันทั้ง pericarditis และ myocarditis ต่างกันแค่ว่าของ pericarditis นับ **จำนวนเกณฑ์เสริม** ส่วนของ myocarditis ต้องการ **CMR หรือ EMB**\n- สไลด์ระบุตัวเลขไว้ครบ: **เจ็บหน้าอก > 80% · friction rub 33% · pericardial effusion 60%**\n- สไลด์ให้ **เกณฑ์เสริมสี่กลุ่ม (clinical, ECG, biomarker, imaging)** ไว้ในหน้าเดียว — ท่องสี่กลุ่มนี้ตอบได้ทั้งข้อวินิจฉัยและข้อ \"จะส่งตรวจอะไรต่อ\"\n", "pearls": ["Pericarditis definite = อาการเข้าได้ + เกณฑ์เสริมมากกว่า 1 ข้อ · possible = เกณฑ์เสริม 1 ข้อ", "เกณฑ์เสริมสี่กลุ่ม — friction rub · PR depression กับ ST ยกกว้าง · CRP สูง · effusion หรือ LGE", "aVR กลับทิศเสมอ: ST กดลงและ PR ยกขึ้น — เป็นเบาะแสที่ช่วยยืนยัน", "ST ยกเฉพาะที่ + reciprocal depression + troponin สูง = STEMI จนกว่าจะพิสูจน์เป็นอย่างอื่น", "Troponin ขึ้นใน pericarditis แปลว่ามีกล้ามเนื้อหัวใจร่วมด้วย = myopericarditis"], "items": [{"id": "C-OLD-01", "kind": "old", "stem": "A 35-year-old man has sharp retrosternal chest pain for 2 days that is worse when lying flat and on deep inspiration, and is relieved by sitting up and leaning forward. What is the most likely diagnosis?", "choices": ["Gastro-oesophageal reflux disease", "Aortic dissection", "Acute myocardial infarction", "Pulmonary embolism", "Acute pericarditis"], "answer": 4, "explain": "**เจ็บหน้าอกที่ดีขึ้นเมื่อนั่งเอนตัวไปข้างหน้าและแย่ลงเมื่อนอนราบ = pericarditis** เพราะท่านั่งโน้มตัวลดการสัมผัสระหว่าง parietal กับ visceral pericardium; MI เจ็บแน่นไม่สัมพันธ์กับท่าและการหายใจ ส่วน aortic dissection เจ็บฉีกขาดร้าวไปหลังทันทีทันใด", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 2 – MCQ 100 ข้อ (CVS ข้อ 1)", "ref": [], "nl": ["B7.2.2-3(3)", "2.3.9-3(6)", "2.1.35"]}, {"id": "C-OLD-03", "kind": "old", "stem": "A patient with pleuritic chest pain relieved by sitting forward has an ECG showing widespread concave ST elevation with PR depression, and a scratchy triphasic sound at the left lower sternal border. What is the diagnosis?", "choices": ["Anterior STEMI", "Left ventricular hypertrophy with strain", "Brugada syndrome", "Acute pericarditis", "Early repolarisation"], "answer": 3, "explain": "**ST ยกเป็นวงกว้างแบบเว้า (concave) + PR depression + pericardial friction rub = acute pericarditis**; STEMI จะยกเฉพาะ lead ที่เลี้ยงด้วยหลอดเลือดเส้นเดียวและมี reciprocal ST depression; early repolarisation พบในคนหนุ่มไม่มีอาการและไม่มี PR depression", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 13", "ref": [], "nl": ["B7.2.2-3(3)", "B7.3(3)", "3.1.12"]}, {"id": "C-OLD-04", "kind": "old", "stem": "An ECG shows ST elevation in all leads except aVR, where there is ST depression with PR elevation. What is the most likely diagnosis?", "choices": ["Ventricular aneurysm", "Acute pericarditis", "Left bundle branch block", "Extensive anterior myocardial infarction", "Hyperkalaemia"], "answer": 1, "explain": "**ST ยกทุก lead ยกเว้น aVR (ที่กลับด้าน) เป็นลายเซ็นของ pericarditis** เพราะเยื่อหุ้มหัวใจอักเสบทั่วทั้งใบ ไม่ได้จำกัดตามแขนงหลอดเลือด; ถ้ามี troponin สูงร่วมด้วยเรียก **myopericarditis** ซึ่งเป็นตัวเลือกที่โพยบางรุ่นใส่ไว้", "pearl": "", "topic": "", "src": "MED30 MCQ ข้อ 60 / MED33 MCQ / MED32 MCQ ข้อ 2", "ref": [], "nl": ["B7.2.2-3(3)", "B7.3(3)", "3.1.12"]}, {"id": "C-OLD-10", "kind": "old", "stem": "A patient with a pleural effusion has an ECG showing ST elevation in leads V1 to V4 with reciprocal ST depression inferiorly and elevated troponin. What is the most likely cause of the ECG change?", "choices": ["Anterior wall myocardial infarction", "Acute pericarditis", "Left ventricular hypertrophy", "Cardiac tamponade", "Pulmonary embolism"], "answer": 0, "explain": "**ST ยกเฉพาะ V1-V4 พร้อม reciprocal change = การอุดตันของ LAD (anterior wall MI)** ไม่ใช่ tamponade ซึ่งให้ low voltage กับ electrical alternans และไม่ใช่ pericarditis ซึ่งยกทั่วไปแบบเว้าโดยไม่มี reciprocal change", "pearl": "", "topic": "", "src": "MED33 MCQ ข้อ 92", "ref": [], "nl": ["2.2.1", "B7.2.6(1)", "B7.3(3)"]}]}, {"id": "cardio-04-04", "title": "การรักษาเยื่อหุ้มหัวใจอักเสบ — และทำไมต้องมี colchicine", "minutes": 9, "summary": "ยาสองตัวคู่กันเสมอ สเตียรอยด์เป็นทางเลือกสุดท้าย", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "B5.4(1)", "2.3.9-3(6)"], "md": "### สองเสาหลักของการรักษา\n\n**1. ไม่ใช้ยา — การจำกัดกิจกรรม**\n> สไลด์ระบุไว้ว่า **ให้จำกัดกิจกรรมทางกายไม่ให้เกินระดับนั่ง ๆ นอน ๆ (beyond sedentary activities) จนกว่าอาการจะหายและเข้าสู่ภาวะสงบทางคลินิก พร้อมกับตัวชี้วัดการอักเสบกลับเป็นปกติ**\n\n- นักกีฬาให้งดแข่งขันอย่างน้อย **3 เดือน** และกลับมาเล่นได้เมื่ออาการหาย CRP ปกติ ECG และเอคโค่กลับเป็นปกติ\n- **ถ้ามีกล้ามเนื้อหัวใจอักเสบร่วมด้วย ข้อนี้สำคัญยิ่งกว่า** เพราะการออกแรงระหว่างที่กล้ามเนื้อหัวใจยังอักเสบเพิ่มความเสี่ยงต่อ **หัวใจเต้นผิดจังหวะร้ายแรงและการเสียชีวิตเฉียบพลัน**\n\n**2. ยา — ยาต้านการอักเสบคู่กับ colchicine เสมอ**\n\n| ยา | ขนาดที่ใช้บ่อย | ระยะเวลา |\n|---|---|---|\n| **Aspirin ขนาดสูง** | **750−1,000 mg ทุก 8 ชม.** | 1−2 สัปดาห์ แล้วค่อย ๆ ลด |\n| **หรือ Ibuprofen** | **600 mg ทุก 8 ชม.** | 1−2 สัปดาห์ แล้วค่อย ๆ ลด |\n| **Colchicine (ให้ควบเสมอ)** | **0.5 mg วันละ 2 ครั้ง** (ถ้าน้ำหนัก < 70 กก. หรือทนยาไม่ได้ ให้ **0.5 mg วันละครั้ง**) | **3 เดือนในครั้งแรก · 6 เดือนในรายที่กลับเป็นซ้ำ** |\n\n- **ให้ยาลดกรดกลุ่ม PPI คุมกระเพาะ** ร่วมด้วยเมื่อใช้ NSAID ขนาดสูง\n- **ลดขนาดยาเมื่ออาการหายและ CRP กลับเป็นปกติแล้ว** ไม่ใช่ลดตามจำนวนวัน\n\n> **ทำไม colchicine จึงเป็นพระเอกของหัวข้อนี้** — ยาตัวนี้ **ลดอัตราการกลับเป็นซ้ำลงราวครึ่งหนึ่ง** ซึ่งเป็นปัญหาหลักของโรคนี้ (กลับเป็นซ้ำ 15−30% ถ้าไม่ได้ colchicine) ข้อสอบจึงชอบถามว่าการรักษาที่เหมาะสมที่สุดคืออะไร และคำตอบเกือบทุกครั้งคือ **\"ยาต้านการอักเสบ + colchicine\" ไม่ใช่ยาต้านการอักเสบอย่างเดียว**\n\n**3. สเตียรอยด์ — เป็นทางเลือกลำดับหลัง ไม่ใช่ลำดับแรก**\n- ใช้เมื่อ **ใช้ NSAID ไม่ได้ (ตั้งครรภ์ ไตวาย มีแผลในกระเพาะ) · ไม่ตอบสนอง · หรือมีข้อบ่งชี้จำเพาะ** เช่นโรคภูมิต้านตนเองที่เป็นต้นเหตุ\n- ขนาดต่ำ **prednisolone 0.2−0.5 mg/kg/วัน** แล้วลดลงช้า ๆ\n- **เหตุผลที่ไม่ใช้เป็นลำดับแรก — สเตียรอยด์เพิ่มอัตราการกลับเป็นซ้ำ** และทำให้เชื้อในกลุ่มที่ยังไม่ตัดการติดเชื้อออก (โดยเฉพาะ **วัณโรค**) แย่ลง\n\n**4. รายที่กลับเป็นซ้ำและดื้อยา**\nให้ยาเดิมนานขึ้น + colchicine 6 เดือน · ถ้ายังไม่ได้ผลจึงพิจารณา **ยากลุ่มชีวภาพที่ต้าน IL-1 (anakinra, rilonacept)** หรือ **การผ่าตัดเยื่อหุ้มหัวใจออก** ในรายที่ดื้อจริง ๆ\n\n### สถานการณ์พิเศษที่เปลี่ยนการเลือกยา\n| สถานการณ์ | สิ่งที่ต่างออกไป |\n|---|---|\n| **ตั้งครรภ์** | **NSAID ใช้ได้เฉพาะไตรมาสแรกถึงก่อน 20 สัปดาห์** (หลังจากนั้นทำให้ **ductus arteriosus ปิดก่อนกำหนด**) · **สเตียรอยด์ขนาดต่ำใช้ได้** · **colchicine ห้ามใช้** |\n| **หลังกล้ามเนื้อหัวใจตาย** | **เลือก aspirin เป็นหลัก** — หลีกเลี่ยง NSAID ตัวอื่นและสเตียรอยด์ขนาดสูงในระยะแรก เพราะรบกวนการสมานของกล้ามเนื้อหัวใจ |\n| **ไตวายระยะสุดท้าย** | **ฟอกเลือดให้เข้มข้นขึ้นคือการรักษาหลัก** ข้อมูลของ NSAID และสเตียรอยด์มีน้อย |\n| **วัณโรค** | ต้องให้ยาต้านวัณโรค **ห้ามให้สเตียรอยด์เดี่ยว ๆ โดยไม่คุมเชื้อ** |\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แยกการรักษาเป็นสองขา **non-pharmacological กับ pharmacological** โดยขาที่ไม่ใช้ยาคือ **การจำกัดกิจกรรม** และย้ำเกณฑ์การกลับไปออกแรงว่า **ต้องรออาการหายและตัวชี้วัดการอักเสบกลับเป็นปกติ** ไม่ใช่แค่หายเจ็บ\n- สไลด์ระบุว่าผู้ป่วยกลุ่ม **post-MI pericarditis และ pericarditis จากมะเร็ง ให้ยาต้านการอักเสบเหมือน viral/idiopathic pericarditis** แต่ต้องรักษาโรคต้นเหตุควบคู่ไปด้วย\n- สไลด์ระบุขา **surgical therapy** ของเยื่อหุ้มหัวใจไว้สามอย่างคือ **surgical pericardiocentesis · pericardiotomy/pericardial window · pericardiectomy**\n", "pearls": ["ยาลำดับแรกคือ ASA หรือ NSAID ขนาดสูง 'คู่กับ' colchicine เสมอ — colchicine ลดการกลับเป็นซ้ำราวครึ่งหนึ่ง", "Colchicine 3 เดือนในครั้งแรก 6 เดือนในรายกลับเป็นซ้ำ · ลดยาตาม CRP ไม่ใช่ตามจำนวนวัน", "สเตียรอยด์เป็นลำดับหลัง เพราะเพิ่มการกลับเป็นซ้ำและทำให้วัณโรคแย่ลง", "ตั้งครรภ์: NSAID ได้ถึงก่อน 20 สัปดาห์ · สเตียรอยด์ขนาดต่ำได้ · colchicine ห้ามใช้", "จำกัดกิจกรรมจนอาการหายและ CRP ปกติ — สำคัญมากถ้ามีกล้ามเนื้อหัวใจอักเสบร่วม"], "items": [{"id": "C-MCQ-01", "kind": "mcq", "stem": "A 38-year-old man presents with 3 days of sharp retrosternal chest pain that worsens when he lies flat and on deep inspiration, and is relieved by sitting up and leaning forward. He had an upper respiratory tract infection 10 days ago. Vital signs: BT 37.8 C, PR 96/min, BP 118/74 mmHg, RR 20/min. A scratchy triphasic sound is heard at the left lower sternal border, loudest at end-expiration while sitting forward. ECG shows widespread concave-upward ST elevation with PR-segment depression in II, III, aVF and V2-V6, with ST depression and PR elevation in aVR. Troponin-I is minimally elevated. Echocardiogram: normal LV systolic function, no pericardial effusion, no regional wall motion abnormality. Which of the following is the most appropriate initial treatment?", "choices": ["Urgent echo-guided pericardiocentesis", "Intravenous furosemide plus nitroglycerine", "Emergency coronary angiography with primary PCI", "High-dose aspirin plus colchicine", "Prednisolone 1 mg/kg/day"], "answer": 3, "explain": "กลไก: เยื่อหุ้มหัวใจอักเสบจาก viral/idiopathic ทำให้เกิด inflammation ของ parietal+visceral pericardium → เจ็บแบบ pleuritic (เพราะ parietal pericardium รับ sensory จาก phrenic nerve) ดีขึ้นเมื่อโน้มตัวไปหน้า (ลด stretch) และได้ friction rub. ECG ที่เป็น **diffuse concave ST elevation ร่วมกับ PR depression** และ **PR elevation + ST depression ใน aVR** คือ signature ของ pericarditis เพราะกระแสอักเสบกินชั้น subepicardium ทั่วหัวใจ ไม่ได้จำกัดตาม coronary territory จึง **ไม่มี reciprocal change** และ **ไม่มี regional WMA** บน echo\n\nรักษา first-line = **NSAID ขนาดสูง (ASA 750-1000 mg q8h หรือ ibuprofen 600 mg q8h) + colchicine 0.5 mg/day (BW<70 kg) หรือ bid** — colchicine ลด recurrence ได้ประมาณครึ่งหนึ่ง (COPE/CORP/ICAP trials) ถือเป็น high-yield ที่ออกสอบซ้ำ\n\nทำไมข้ออื่นผิด:\n- **Prednisolone**: ได้ผลเร็วจริง แต่ steroid เพิ่ม recurrence rate ชัดเจน → สงวนไว้เมื่อมี contraindication ต่อ NSAID, เป็น autoimmune/uremic pericarditis หรือ refractory\n- **Primary PCI**: ตัดด้วยกลไก — ST elevation กระจายทุก territory + PR depression + no reciprocal change + echo ไม่มี WMA + trop ขึ้นน้อย ไม่เข้ากับ plaque rupture occlusion (ข้อนี้คือจุดหลอกที่ทำคนพลาดบ่อยสุด)\n- **Pericardiocentesis**: ใช้เมื่อมี effusion + hemodynamic compromise (tamponade) — เคสนี้ echo ไม่มี effusion เลย ไม่มีข้อบ่งชี้และเสี่ยงเปล่า\n- **Furosemide + NTG**: ใช้ใน cardiogenic pulmonary edema — เคสนี้ปอด clear, EF ปกติ", "pearl": "trop ขึ้นเล็กน้อย + ST elevation ทั่ว = myopericarditis ยังรักษาแบบ pericarditis แต่ **ห้ามออกกำลังกายหนัก** และต้องตาม EF; ถ้า EF ตก = myocarditis เด่น ต้อง admit", "topic": "Acute pericarditis – first-line treatment", "src": "", "ref": ["MED34 ข้อสอบ MED ครั้งที่ 4 (LS loop B) MCQ ข้อ 7 – First line tx pericarditis (pleuritic chest pain, better when leaning forward)", "MED33 MCQ loop E+F ข้อ 'ECG ตอบ myopericarditis'", "MED30 MCQ ข้อ 60 – EKG ST elevate ทุก lead ยกเว้น aVR → Pericarditis", "MED31 MCQ ข้อ 13 – EKG QRS สูงหลาย lead นั่งโน้มตัวไปหน้าแล้วดีขึ้น → Pericarditis"], "nl": ["B7.2.2-3(3)", "2.3.9-3(6)", "2.1.35"]}, {"id": "C-OLD-02", "kind": "old", "stem": "A 38-year-old man with acute pericarditis after a viral illness has no effusion and normal cardiac function. Which of the following is the most appropriate first-line treatment?", "choices": ["Anticoagulation with warfarin", "Systemic corticosteroid alone", "High-dose aspirin or an NSAID plus colchicine", "Colchicine alone", "Intravenous antibiotics"], "answer": 2, "explain": "โพยเก่าให้เลือกระหว่าง 'colchicine alone' กับ 'ASA + colchicine' — **คำตอบคือ NSAID/aspirin ร่วมกับ colchicine** (ESC 2015) colchicine ลดอาการและลดการกลับเป็นซ้ำได้ราวครึ่งหนึ่ง; **สเตียรอยด์เพิ่มการกลับเป็นซ้ำ** ใช้เมื่อมีข้อห้ามหรือเป็นจากโรคภูมิต้านตนเอง และ **ห้ามให้ยาต้านการแข็งตัวของเลือดโดยไม่จำเป็น** เพราะเสี่ยง hemopericardium", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 4 (LS loop B) MCQ ข้อ 7", "ref": [], "nl": ["B7.2.2-3(3)", "2.3.9-3(6)", "B5.4(1)"]}]}, {"id": "cardio-04-05", "title": "สาเหตุจำเพาะของเยื่อหุ้มหัวใจอักเสบ", "minutes": 11, "summary": "วัณโรค ยูรีเมีย หลังกล้ามเนื้อหัวใจตาย และมะเร็ง — สี่ตัวที่ต้องแยกให้ออกในบ้านเรา", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "2.3.4(20)", "2.3.2", "2.2.1"], "md": "### รายการสาเหตุตามที่สไลด์จัดไว้\n| หมวด | ตัวอย่าง |\n|---|---|\n| **I. ติดเชื้อ** | **ไวรัส** — Coxsackie A และ B, influenza, adenovirus, HIV · **แบคทีเรีย** — staphylococcus, pneumococcus, **วัณโรค** · **เชื้อรา** — candida · **ปรสิต** — อะมีบา |\n| **II. ภูมิต้านตนเอง** | **SLE** · **lupus จากยา (hydralazine, procainamide)** · รูมาตอยด์ · **post cardiac injury syndrome** — Dressler หลังกล้ามเนื้อหัวใจตาย, postcardiotomy |\n| **III. มะเร็ง** | **mesothelioma ปฐมภูมิ** · **แพร่กระจายมา** · ลุกลามโดยตรงจากก้อนข้างเคียง |\n| **IV. รังสีรักษา** | |\n| **V. ไตวาย (ยูรีเมีย)** | |\n| **VI. อุบัติเหตุ** | ทะลุ (ถูกแทง ถูกยิง) · ไม่ทะลุ (กระแทกพวงมาลัย) |\n| **VII. ไม่ทราบสาเหตุ (idiopathic)** | **พบบ่อยที่สุดในประเทศพัฒนาแล้ว — ส่วนใหญ่เชื่อว่าเป็นไวรัสที่ตรวจไม่พบ** |\n\n> **บริบทไทยต่างจากตำราตะวันตก** — ในบ้านเราต้อง **คิดถึงวัณโรคเสมอ** โดยเฉพาะเมื่อมีน้ำในเยื่อหุ้มหัวใจปริมาณมาก ดำเนินโรคช้า มีไข้ต่ำ ๆ น้ำหนักลด หรือมีวัณโรคที่อื่นร่วมด้วย\n\n### 1. วัณโรคเยื่อหุ้มหัวใจ\n- **มักมาด้วยน้ำในเยื่อหุ้มหัวใจ** ไม่ใช่แบบแห้ง\n- **ระดับความมั่นใจในการวินิจฉัย (ตามสไลด์)**\n  - **Definite** — **พบเชื้อในน้ำหรือชิ้นเนื้อ**\n  - **Probable** — **น้ำเป็น exudate ที่มีลิมโฟไซต์เด่น ร่วมกับ IFN-γ, ADA หรือ lysozyme สูง**\n  - **Presumptive** — **อยู่ในพื้นที่ที่มีโรคชุกและตอบสนองต่อการรักษา**\n- **การรักษา — 2HRZE/4−7HR**\n- **การให้ urokinase เข้าช่องเยื่อหุ้มหัวใจ ร่วมกับ prednisolone เสริมนาน 6 สัปดาห์ อาจช่วยป้องกันการเกิด constriction**\n- **แนะนำให้ผ่าตัดเยื่อหุ้มหัวใจออก ถ้าอาการไม่ดีขึ้นหรือแย่ลงหลังรักษาไปแล้ว 4−8 สัปดาห์**\n\n> **วัณโรคคือสาเหตุอันดับต้นของ constrictive pericarditis ในบ้านเรา** — จึงเป็นเหตุผลที่ต้องรีบวินิจฉัยและพิจารณาสเตียรอยด์เสริม\n\n### 2. ไตวายระยะสุดท้าย — สไลด์แยกไว้ 3 แบบ\n| แบบ | เวลาที่เกิด | กลไก |\n|---|---|---|\n| **Uremic pericarditis** | **ก่อนเริ่มฟอกเลือด หรือภายใน 8 สัปดาห์หลังเริ่มฟอก** | **สารพิษจากยูรีเมียคั่ง** · มักมีน้ำปริมาณปานกลางถึงมาก |\n| **\"Dialysis\" pericarditis** | **หลังเริ่มฟอกเลือดไปแล้วเกิน 8 สัปดาห์** | ฟอกไม่พอ หรือปัจจัยอื่น |\n| **Constrictive pericarditis** | ระยะท้าย | พังผืดรัดหัวใจ |\n\n- **การฟอกเลือดให้เข้มข้นขึ้นได้ผลดีใน uremic pericarditis**\n- ในคนที่ **ฟอกอยู่แล้ว การเพิ่มความเข้มข้นได้ผลน้อยกว่า แต่ยังเป็นการรักษาหลัก**\n- **ข้อมูลของ NSAID และสเตียรอยด์ในกลุ่มนี้มีน้อยมาก**\n\n### 3. หลังกล้ามเนื้อหัวใจตาย — แยกสองแบบ\n| | **Early post-MI pericarditis** | **Late (Dressler syndrome)** |\n|---|---|---|\n| **เวลา** | **1−3 วันหลัง MI** | **1 สัปดาห์ถึงไม่กี่เดือนหลัง MI** |\n| **เสี่ยงเมื่อ** | **MI ขนาดใหญ่ ทะลุผนัง · ไม่ได้เปิดหลอดเลือด หรือเปิดช้า/ไม่สำเร็จ** | MI ขนาดใหญ่ |\n| **ความชุก** | พบได้บ่อย | **พบน้อยมาก < 1%** |\n| **อาการ** | **มักไม่มีอาการ** | **มีไข้ และเจ็บหน้าอกแบบ pleuritic** |\n| **ECG** | **มักไม่แสดง ECG แบบ pericarditis ทั่วไป** — เห็นเพียง **ST ยกขึ้นซ้ำเล็กน้อยในบริเวณเดิม** และ **T wave เปลี่ยนแปลงผิดแบบ (T ตั้งค้างอยู่ หรือ T ที่กลับหัวกลับมาตั้งเร็วผิดปกติ)** | **มักแสดง ECG แบบ pericarditis ทั่วไป** |\n| **Tamponade** | **พบน้อย เว้นแต่ผนังหัวใจแตก** | **มีน้ำบ่อย แต่ tamponade พบไม่บ่อย** |\n\n> **จุดที่ต้องระวังที่สุด** — ผู้ป่วยหลัง MI ที่เกิด **tamponade เฉียบพลัน ต้องนึกถึงผนังหัวใจแตก (free wall rupture) ก่อนเสมอ** ไม่ใช่เยื่อหุ้มหัวใจอักเสบธรรมดา เพราะเป็นภาวะที่ต้องผ่าตัดฉุกเฉิน\n\n### 4. มะเร็ง\n- **แพร่กระจายมาทางกระแสเลือด** — **ปอดและเต้านมพบบ่อยที่สุด** ตามด้วย lymphoma, leukemia, melanoma, หลอดอาหาร\n- การรักษา: **ให้ยาต้านมะเร็งที่เหมาะสม · ระบายน้ำถ้ามีข้อบ่งชี้ (แนะนำให้คาสายระบายไว้นาน) · ทำ pericardial window หรือขยายด้วยบอลลูน · หยอดยาเคมีหรือสารทำให้เยื่อติดกันเข้าช่อง · ฉายรังสีในมะเร็งที่ไวต่อรังสี (lymphoma, leukemia) · การรักษาแบบประคับประคอง**\n\n### 5. อื่น ๆ ที่สไลด์กล่าวถึง\n- **รังสีรักษา** — เกิดได้ทุกรูปแบบ และ **constrictive pericarditis ใช้เวลา 2−20 ปีจึงปรากฏ**\n- **ไทรอยด์ต่ำรุนแรง** — **พบน้ำในเยื่อหุ้มหัวใจ 25−35% ของผู้ป่วย** · น้ำมี **คอเลสเตอรอลสูง (ลักษณะ \"gold paint\")** · **ดีขึ้นเมื่อให้ฮอร์โมนไทรอยด์ทดแทน**\n- **การตั้งครรภ์** — **หญิงตั้งครรภ์สุขภาพดีมีน้ำปริมาณไม่สำคัญได้ถึง 40%** และการตั้งครรภ์ไม่ได้ทำให้โรคแย่ลง\n- **โรคภูมิต้านตนเอง** — **SLE พบบ่อยที่สุด** · **constriction พบน้อย และถ้าพบมักเป็นจากรูมาตอยด์** · สัมพันธ์กับ **ความรุนแรงของโรคขณะนั้น** จึงรักษาที่โรคต้นเหตุ\n- **ถุงน้ำเยื่อหุ้มหัวใจ (pericardial cyst)** — พบน้อย ไม่ร้ายแรง อยู่ที่มุม cardiophrenic ซ้ายหรือขวา **ไม่ต้องผ่าตัดถ้าไม่มีอาการ**\n- **เยื่อหุ้มหัวใจไม่มีแต่กำเนิด** — พบน้อยมาก ถ้าขาดบางส่วนด้านซ้ายสัมพันธ์กับ **ASD, ลิ้นเอออร์ติกสองแฉก** · มักไม่มีอาการ แต่หัวใจอาจเลื่อนไปติดในช่องที่ขาดหรือหลอดเลือดใหญ่บิด ทำให้ **เจ็บหน้าอก เป็นลม หรือเสียชีวิตเฉียบพลัน** · **ภาพรังสีเห็นเงาหัวใจเลื่อนไปทางซ้ายและขอบหัวใจซ้ายยืดยาว**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ของวัณโรคให้ระดับความมั่นใจสามระดับ (**definite / probable / presumptive**) ซึ่งเป็นกรอบที่ใช้ได้จริงในบ้านเรา เพราะการเพาะเชื้อจากน้ำเยื่อหุ้มหัวใจได้ผลบวกไม่บ่อย\n- สไลด์แยก **uremic กับ dialysis pericarditis ด้วยเส้นแบ่ง 8 สัปดาห์หลังเริ่มฟอกเลือด** ซึ่งเป็นตัวเลขที่ออกสอบได้ตรง\n- สไลด์ย้ำว่า **colchicine ห้ามใช้ในหญิงตั้งครรภ์** และ **NSAID ใช้ได้เฉพาะก่อน 20 สัปดาห์** เพราะทำให้ **ductus arteriosus ตีบ**\n", "pearls": ["วัณโรคเยื่อหุ้มหัวใจ: definite = เจอเชื้อ · probable = lymphocytic exudate + ADA/IFN-γ สูง · presumptive = พื้นที่ชุก + ตอบสนองการรักษา", "Uremic pericarditis เกิดก่อนฟอกหรือภายใน 8 สัปดาห์แรก · หลัง 8 สัปดาห์เรียก dialysis pericarditis", "Tamponade เฉียบพลันหลัง MI = นึกถึงผนังหัวใจแตกก่อนเสมอ", "Dressler syndrome พบน้อยกว่า 1% มาด้วยไข้และเจ็บแบบ pleuritic 1 สัปดาห์ถึงหลายเดือนหลัง MI", "ไทรอยด์ต่ำรุนแรงมีน้ำเยื่อหุ้มหัวใจ 25−35% น้ำมีคอเลสเตอรอลสูงแบบ gold paint และหายเมื่อให้ฮอร์โมนทดแทน"], "items": [{"id": "CARDIO-04-05-Q1", "kind": "own", "stem": "A 44-year-old man from an area where tuberculosis is endemic has 6 weeks of low-grade fever, weight loss and progressive dyspnoea. Echocardiography shows a large circumferential pericardial effusion. Pericardiocentesis yields straw-coloured fluid with a lymphocyte-predominant exudate, protein ratio 0.7, adenosine deaminase 78 IU/L and a negative acid-fast smear; culture is pending. Which of the following best describes this case, and what is the appropriate management?", "choices": ["Probable tuberculous pericarditis — start 2HRZE/4-7HR with adjunctive prednisolone", "Idiopathic viral pericarditis — treat with high-dose aspirin plus colchicine alone", "Malignant pericardial effusion — arrange pericardial window and cytology before any therapy", "Uraemic pericarditis — intensify dialysis and avoid antituberculous therapy", "Definite tuberculous pericarditis — start 2HRZE/4-7HR and withhold steroid until culture returns"], "answer": 0, "explain": "**กลไกและการจัดระดับ** — สไลด์แบ่งความมั่นใจของการวินิจฉัยวัณโรคเยื่อหุ้มหัวใจเป็นสามระดับ คนไข้รายนี้ **ยังไม่พบเชื้อในน้ำหรือชิ้นเนื้อ** จึงยังไม่ใช่ definite แต่มี **exudate ที่ลิมโฟไซต์เด่น ร่วมกับ ADA สูงถึง 78 IU/L (จุดตัดที่สไลด์ให้ไว้คือ 40 IU/L)** ซึ่งเข้าเกณฑ์ **probable tuberculous pericarditis** พอดี และเป็นเกณฑ์ที่ออกแบบมาให้ **เริ่มการรักษาได้เลยโดยไม่ต้องรอผลเพาะเชื้อ** ซึ่งมักใช้เวลาหลายสัปดาห์และให้ผลบวกไม่บ่อย\n\n**สูตรยาคือ 2HRZE/4−7HR** และสไลด์ระบุว่า **prednisolone เสริมนาน 6 สัปดาห์ (ร่วมกับการให้ urokinase เข้าช่องเยื่อหุ้มหัวใจในบางราย) อาจช่วยป้องกันการเกิด constriction** ซึ่งเป็นภาวะแทรกซ้อนที่ทำให้ต้องผ่าตัดในภายหลัง\n\n**ทำไมตัวลวงจึงผิด**\n- *Definite* — คำว่า definite สงวนไว้สำหรับ **พบเชื้อในน้ำหรือชิ้นเนื้อเท่านั้น** และการ **ถือสเตียรอยด์ไว้รอผลเพาะเชื้อ** ทำให้เสียโอกาสป้องกัน constriction (สเตียรอยด์ปลอดภัยเมื่อ **ให้ควบกับยาต้านวัณโรค** สิ่งที่อันตรายคือให้สเตียรอยด์เดี่ยว ๆ โดยไม่คุมเชื้อ)\n- *มะเร็ง* — เป็นไปได้ในเชิงทฤษฎี แต่ **ADA ที่สูงขนาดนี้ร่วมกับลิมโฟไซต์เด่นและบริบทพื้นที่ชุก ชี้ไปที่วัณโรคชัดเจน** และการรอทำ window ก่อนเริ่มยาทำให้เสียเวลา\n- *Idiopathic viral* — ดำเนินโรคช้าถึง 6 สัปดาห์ มีไข้และน้ำหนักลด ไม่เข้ากับ viral pericarditis ซึ่งมักหายเองใน 1−2 สัปดาห์ และการให้ ASA + colchicine อย่างเดียวจะปล่อยให้วัณโรคลุกลาม\n- *Uremic* — ไม่มีข้อมูลว่าไตวาย และไม่อธิบาย ADA ที่สูง", "pearl": "Lymphocytic exudate + ADA สูงในพื้นที่วัณโรคชุก = probable TB pericarditis เริ่มยาได้เลย พร้อมสเตียรอยด์เสริมกันพังผืดรัด", "topic": "สาเหตุจำเพาะของเยื่อหุ้มหัวใจอักเสบ", "src": "", "ref": [], "nl": ["2.3.4(20)", "B7.2.2-3(3)", "3.1.7"]}, {"id": "CARDIO-04-05-Q2", "kind": "own", "stem": "A 66-year-old man had a large anterior ST-elevation myocardial infarction 2 days ago; reperfusion was delayed. He now has pleuritic chest pain and a pericardial friction rub. Blood pressure is 128/76 mmHg and echocardiography shows a trivial pericardial effusion with no tamponade physiology. Which of the following is the most appropriate anti-inflammatory management?", "choices": ["High-dose aspirin, with colchicine added", "High-dose ibuprofen plus colchicine", "No anti-inflammatory therapy; proceed directly to pericardiocentesis", "Oral prednisolone 1 mg/kg/day tapered over 4 weeks", "Indomethacin plus a proton pump inhibitor"], "answer": 0, "explain": "**กลไก** — นี่คือ **early post-MI pericarditis** (เกิด 1−3 วันหลัง MI ขนาดใหญ่ที่ทะลุผนังและเปิดหลอดเลือดช้า ตรงกับที่สไลด์ระบุปัจจัยเสี่ยงไว้) สไลด์ระบุว่าให้ **การรักษาด้านยาเหมือน viral/idiopathic pericarditis** คือยาต้านการอักเสบคู่กับ colchicine แต่ **การเลือกตัวยามีข้อจำกัดเฉพาะของช่วงหลัง MI**\n\n**ทำไมต้องเป็น aspirin** — ในระยะแรกหลังกล้ามเนื้อหัวใจตาย กล้ามเนื้อกำลังสมานตัว **NSAID ตัวอื่นและสเตียรอยด์ขนาดสูงรบกวนการสร้างแผลเป็น** เพิ่มความเสี่ยงของ **การบางตัวของผนังและการแตกของผนังหัวใจ** และ NSAID ที่ไม่ใช่ aspirin ยังเพิ่มเหตุการณ์ทางหัวใจและหลอดเลือด ส่วน **aspirin เป็นยาที่ผู้ป่วยต้องได้อยู่แล้วหลัง MI** จึงเพียงเพิ่มขนาดขึ้นเป็นขนาดต้านการอักเสบ\n\n**ทำไมตัวลวงจึงผิด**\n- *Ibuprofen + colchicine* — colchicine ถูก แต่ **ibuprofen เป็น NSAID ที่ควรเลี่ยงในระยะแรกหลัง MI** และยังลดฤทธิ์ต้านเกล็ดเลือดของ aspirin ด้วย\n- *Prednisolone 1 mg/kg* — สเตียรอยด์ขนาดสูงเป็นสิ่งที่ควรเลี่ยงที่สุดในระยะนี้ และสเตียรอยด์ยัง **เพิ่มอัตราการกลับเป็นซ้ำ** ของเยื่อหุ้มหัวใจอักเสบโดยทั่วไป\n- *Indomethacin* — เป็น NSAID ที่ **ลดการไหลเวียนเลือดหลอดเลือดหัวใจ** จึงเป็นตัวที่ควรเลี่ยงเป็นพิเศษหลัง MI\n- *ไปเจาะระบายเลย* — น้ำมีปริมาณเล็กน้อยและไม่มีสรีรวิทยาของ tamponade จึงไม่มีข้อบ่งชี้ (และถ้าเกิด tamponade จริงหลัง MI ต้องนึกถึง **ผนังหัวใจแตก** ซึ่งต้องผ่าตัด ไม่ใช่แค่เจาะ)", "pearl": "Early post-MI pericarditis เลือก aspirin ขนาดสูง + colchicine — เลี่ยง NSAID ตัวอื่นและสเตียรอยด์ขนาดสูงเพราะรบกวนการสมานของกล้ามเนื้อหัวใจ", "topic": "สาเหตุจำเพาะของเยื่อหุ้มหัวใจอักเสบ", "src": "", "ref": [], "nl": ["B7.2.2-3(3)", "2.2.1", "B5.4(1)"]}]}, {"id": "cardio-04-06", "title": "น้ำในเยื่อหุ้มหัวใจ — ชนิด การแบ่งระดับ และการแปลผลน้ำ", "minutes": 8, "summary": "แบ่งระดับด้วยมิลลิเมตร ไม่ใช่มิลลิลิตร และน้ำบอกสาเหตุได้", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "3.3.23", "3.1.7", "2.3.4(20)"], "md": "### ชนิดของน้ำ\n| ชนิด | ลักษณะและสาเหตุ |\n|---|---|\n| **Serous** | ใส · เป็น **transudate** — เช่น **หัวใจล้มเหลว** |\n| **Suppurative** | **เป็นหนอง** — ติดเชื้อแบคทีเรีย มีเศษเซลล์และเม็ดเลือดขาวจำนวนมาก |\n| **Hemorrhagic** | **เป็นเลือด** — เกิดได้กับเยื่อหุ้มหัวใจอักเสบทุกชนิด **โดยเฉพาะการติดเชื้อและมะเร็ง** |\n| **Serosanguinous** | ใสปนเลือด |\n\n### สาเหตุ\n**โรคใดก็ตามที่มาเกี่ยวข้องกับเยื่อหุ้มหัวใจ** ทำให้มีน้ำได้ทั้งนั้น แต่ที่สไลด์ทำเครื่องหมายดาวไว้คือ\n- **การติดเชื้อ / มะเร็ง / การอักเสบ**\n- **หลังผ่าตัดหัวใจ — เกิดได้ตั้งแต่หลายสัปดาห์ถึงไม่กี่เดือนหลังผ่า**\n- **ภาวะคั่งน้ำรุนแรงในระบบไหลเวียน**\n- **พบโดยบังเอิญในคนสุขภาพดีที่ไม่มีอาการ**\n\n### การแบ่งระดับด้วยเอคโค่ — วัดเป็น \"มิลลิเมตร\" ของช่องว่าง\nวัด **ช่องว่างปลอดเสียงสะท้อน (echo-free space) ในช่วงคลายตัว (diastole)**\n\n| ระดับ | ขนาด |\n|---|---|\n| **Trivial** | **เห็นเฉพาะตอนหัวใจบีบตัว (systole) เท่านั้น** |\n| **Small** | **< 10 mm** |\n| **Moderate** | **10−20 mm** |\n| **Large** | **> 20 mm** |\n| **Very large** | **> 25 mm** |\n\n**หลักการอ่านเพิ่มเติม**\n- **น้ำที่มีความสำคัญ จะเห็นช่องว่างปลอดเสียงสะท้อนแยกระหว่างเยื่อหุ้มชั้นนอกและชั้นในตลอดทั้งรอบการเต้นของหัวใจ** (ไม่ใช่เห็นเฉพาะช่วง systole)\n- **น้ำปริมาณน้อยจะปรากฏที่ด้านหลังล่างของ LV ก่อน** แล้วจึงลามไปด้านหน้า ด้านข้าง และหลังห้องบนซ้าย\n- **ปริมาณน้ำที่มากไม่เท่ากับ tamponade** — ต้องดูสรีรวิทยา ไม่ใช่ขนาด\n\n### การแปลผลน้ำที่เจาะได้\n- **มักมีลิมโฟไซต์เด่น**\n- **ส่วนใหญ่เป็น exudate**\n- **น้ำที่เป็นเลือด (sanguineous) ไม่จำเพาะ** — บอกสาเหตุไม่ได้ด้วยตัวเอง\n- **น้ำเหลืองปนไขมัน (chylous)** — เกิดหลัง **บาดเจ็บหรือผ่าตัดโดนท่อน้ำเหลือง thoracic duct หรือเนื้องอกอุดกั้น**\n- **น้ำที่มีคอเลสเตอรอลสูงจนดูเหมือน \"สีทอง\" (gold paint)** — **ไทรอยด์ต่ำ**\n\n**ถ้าสงสัยวัณโรค ให้ส่งสี่อย่างนี้**\n> **unstimulated interferon-gamma (uIFN-γ) · adenosine deaminase (ADA) จุดตัด 40 IU/L · lysozyme · PCR**\n\n### แนวทางการส่งตรวจภาพ\n- **ภาพรังสีทรวงอกผิดปกติต่อเมื่อมีน้ำอย่างน้อยระดับปานกลาง** — เห็นเป็น **เงาหัวใจโตทรงขวดน้ำ (flask-like / water-bottle)** · ปอดดูเลือดน้อย (oligemic)\n- **ท่าด้านข้างเห็น fat pad sign** — เส้นโปร่งแสงอย่างน้อย **2 mm ระหว่างผนังทรวงอกกับผิวหน้าหัวใจ** จากการที่น้ำแยกไขมันของ epicardium ออกจากไขมันเมดิแอสตินัมด้านหน้า\n- **เอคโค่คือการตรวจที่ยืนยันและบอกสรีรวิทยาได้** — จึงเป็นขั้นตอนถัดไปเสมอเมื่อสงสัย\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้ **จุดตัดของ ADA ที่ 40 IU/L** และรายการสี่อย่างที่ต้องส่งเมื่อสงสัยวัณโรคไว้ครบในหน้าเดียว\n- สไลด์ระบุลักษณะ **\"gold paint\" ของน้ำที่มีคอเลสเตอรอลสูงในภาวะไทรอยด์ต่ำ** ซึ่งเป็นภาพจำที่ออกสอบได้\n- สไลด์อธิบาย **fat pad sign** ว่าเป็นเส้นโปร่งแสง **อย่างน้อย 2 mm** ในภาพท่าด้านข้าง\n", "pearls": ["แบ่งระดับน้ำด้วยช่องว่างตอน diastole: small <10 mm · moderate 10−20 mm · large >20 mm · very large >25 mm", "ปริมาณน้ำมากไม่เท่ากับ tamponade — ต้องดูสรีรวิทยา", "สงสัยวัณโรคส่ง uIFN-γ, ADA (จุดตัด 40 IU/L), lysozyme และ PCR", "น้ำคอเลสเตอรอลสูงสีทอง = ไทรอยด์ต่ำ · น้ำเหลืองปนไขมัน = ท่อน้ำเหลืองบาดเจ็บหรือถูกอุดกั้น", "CXR ผิดปกติต่อเมื่อมีน้ำอย่างน้อยปานกลาง — เงาทรงขวดน้ำ และ fat pad sign ≥2 mm ในท่าด้านข้าง"], "items": [{"id": "C-OLD-15", "kind": "old", "stem": "A dyspnoeic patient has a chest radiograph showing an enlarged globular 'water-bottle' cardiac silhouette with clear lung fields. What is the most appropriate next step?", "choices": ["Immediate thrombolysis", "Echocardiography, and pericardiocentesis if there is tamponade physiology", "Start intravenous furosemide and observe", "Start broad-spectrum antibiotics alone", "Insert an intercostal chest drain"], "answer": 1, "explain": "**เงาหัวใจโตเป็นทรงขวดน้ำ + ปอดใส = pericardial effusion** ต้องยืนยันด้วย echocardiography ซึ่งบอกได้ทั้งปริมาณน้ำและสัญญาณของ tamponade (RA/RV collapse, IVC ไม่ยุบ) ถ้ามีให้เจาะระบายทันที; ภาพรังสีอย่างเดียวแยก effusion จากหัวใจโตจริงไม่ได้", "pearl": "", "topic": "", "src": "MED32 OSCE ข้อ 1 / MED32 SAQ / MED31 OSCE ข้อ 3", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "3.3.23"]}, {"id": "C-OLD-17", "kind": "old", "stem": "Which finding on pericardial fluid analysis most suggests a tuberculous rather than a malignant pericardial effusion?", "choices": ["Transudate with low protein and low LDH", "Lymphocyte-predominant exudate with high adenosine deaminase", "Purulent fluid with gram-positive cocci", "Milky fluid with high triglyceride", "Bloody fluid with positive cytology"], "answer": 1, "explain": "**TB pericarditis ให้ exudate ที่ lymphocyte เด่นและ ADA สูง** (เกณฑ์ที่ใช้บ่อยคือ > 40 U/L) ซึ่งสำคัญมากในประเทศไทยเพราะเป็นสาเหตุที่รักษาแล้วหายและป้องกัน constriction ได้; น้ำที่ cytology บวกบ่งมะเร็ง ส่วนน้ำเป็นหนองบ่ง purulent pericarditis", "pearl": "", "topic": "", "src": "MED30 สรุป Cardio (หน้า 272-277) + โพย MED31 (pericardial effusion workup)", "ref": [], "nl": ["B7.2.2-3(3)", "2.3.4(20)", "3.1.7"]}]}, {"id": "cardio-04-07", "title": "Cardiac tamponade — พยาธิสรีรวิทยาและ pulsus paradoxus", "minutes": 11, "summary": "ไล่กลไกให้ได้ แล้ว Beck's triad กับ pulsus paradoxus จะอธิบายตัวเอง", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.3(1)", "2.2.2", "B7.1.2(2)", "2.2.7"], "md": "### ไล่กลไกเป็นลูกโซ่\n**น้ำสะสมภายใต้ความดันสูง**\n→ **ความดันในช่องเยื่อหุ้มหัวใจสูงขึ้นจนความดันคลายตัวของทุกห้องหัวใจเท่ากันหมด (equalization) โดยเท่ากับความดันในช่องเยื่อหุ้มหัวใจ ซึ่งมักอยู่ราว 20−25 mmHg**\n→ **ความดันเติมเลือดข้ามผนัง (transmural filling pressure) ลดลง** — เพราะความดันภายนอกห้องหัวใจสูงขึ้นมาหักล้าง\n→ **ปริมาตรปลายคลายตัวของหัวใจเล็กลง = preload ลดลง**\n→ **ปริมาตรเลือดที่บีบออกต่อครั้ง (stroke volume) ลดลง**\n→ **ปริมาณเลือดที่หัวใจสูบต่อนาที (cardiac output) ลดลง**\n\n**ผลที่ออกมาเป็นสองด้านพร้อมกัน**\n| ด้านไปข้างหน้า (CO ต่ำ) | ด้านย้อนกลับ (ความดันดำสูง) |\n|---|---|\n| **ความดันต่ำ ช็อก** · **หัวใจเต้นเร็วชดเชย** | **หลอดเลือดดำคอโป่ง · ตับโต · ท้องมาน · บวม** |\n\n> **หัวใจของกลไก — tamponade เป็นปัญหาของ \"การเติมเลือด\" ไม่ใช่ \"การบีบตัว\"** การบีบตัว (EF) มักปกติหรือดีกว่าปกติด้วยซ้ำ นี่คือเหตุผลที่ **ยาเพิ่มแรงบีบหัวใจช่วยได้น้อยมาก และยาขับปัสสาวะกับยาขยายหลอดเลือดเป็นสิ่งต้องห้าม** เพราะยิ่งลด preload ที่เหลือน้อยอยู่แล้ว\n\n### ชนิดของช็อก\n**Tamponade = obstructive shock** — เหมือนกับ **ลิ่มเลือดอุดกั้นปอดขนาดใหญ่และ tension pneumothorax** คือมีสิ่งขัดขวางการไหลเวียนเชิงกล ไม่ใช่ปัญหาของกล้ามเนื้อหัวใจเองหรือปริมาตรเลือดในร่างกาย\n\n### อาการและอาการแสดง\n- **อาการของโรคต้นเหตุ** และ **เจ็บหน้าอกถ้ามีเยื่อหุ้มหัวใจอักเสบ**\n- **เหนื่อยหอบ** ทั้งที่ **ปอดโล่ง ไม่มีน้ำคั่งในปอด** (สไลด์ระบุว่ากลไกยังไม่ชัดเจน) และ **ผู้ป่วยสบายขึ้นเมื่อนั่งโน้มไปข้างหน้า**\n- **Beck's triad**\n  1. **ความดันโลหิตต่ำ**\n  2. **เสียงหัวใจเบาลง (distant heart sounds)**\n  3. **JVP สูง** — สไลด์ระบุว่าข้อนี้บ่งชี้ว่าเป็น **tamponade ที่รุนแรง**\n\n> **ข้อควรระวัง** — Beck's triad ครบทั้งสามข้อ **พบในผู้ป่วยส่วนน้อยเท่านั้น** และมักเป็นระยะท้าย · **ผู้ป่วยที่เสียเลือดมากอาจไม่มี JVP สูง** เพราะปริมาตรเลือดในร่างกายต่ำ (**low-pressure tamponade**) จึงอย่ารอให้ครบสามข้อจึงจะวินิจฉัย\n\n### Pulsus paradoxus — กลไกที่ต้องอธิบายได้\n> **นิยาม: ความดันซิสโตลิกลดลงมากกว่า 10 mmHg ขณะหายใจเข้า**\n> **วิธีวัด: ใช้เครื่องวัดความดันแบบปรอท ค่อย ๆ ปล่อยลม ฟังจุดที่ได้ยินเสียง Korotkoff เฉพาะช่วงหายใจออก เทียบกับจุดที่ได้ยินทุกจังหวะการเต้น ผลต่างคือค่าที่ต้องการ**\n\n**กลไกสามชั้นตามที่สไลด์อธิบาย**\n1. **ปกติเมื่อหายใจเข้า เลือดดำกลับเข้าหัวใจขวามากขึ้นและความดันหลอดเลือดดำลดลง** — นี่คือสรีรวิทยาปกติ\n2. **ใน tamponade ปริมาตรรวมของหัวใจถูกตรึงไว้** ดังนั้นเมื่อหัวใจขวารับเลือดมากขึ้นตอนหายใจเข้า **ผนังกั้นห้องหัวใจจึงถูกดันเบนไปทางซ้ายมากผิดปกติ ไปเบียดห้องซ้าย** ทำให้ **LV รับเลือดได้น้อยลง → stroke volume ลดลง** (นี่คือ **ventricular interdependence** ที่ถูกขยายให้เด่นชัด)\n3. **afterload ของ LV เพิ่มขึ้น** จากการที่ **ความดันลบในช่องอกถูกส่งผ่านไปยังหลอดเลือดเอออร์ตา** และจาก **แรงดึงที่เยื่อหุ้มหัวใจเมื่อกะบังลมเคลื่อนลง**\n\n**สาเหตุอื่นของ pulsus paradoxus** — สไลด์ระบุไว้สองอย่างคือ **constrictive pericarditis และลิ่มเลือดอุดกั้นปอด** (ในเวชปฏิบัติยังพบใน **หอบหืดหรือ COPD กำเริบรุนแรง** จากความดันในช่องอกที่แกว่งมาก)\n\n> **ข้อยกเว้นสำคัญที่สไลด์เน้น** — **ผู้ป่วยที่มีเลือดไหลย้อนเข้าช่องเยื่อหุ้มหัวใจจากหลอดเลือดเอออร์ตาฉีกขาด (aortic dissection) อาจเกิด tamponade โดยไม่มี pulsus paradoxus** เพราะลิ้นเอออร์ติกถูกทำลายและมีการไหลย้อน · ภาวะอื่นที่ไม่พบ pulsus paradoxus ได้แก่ **ผนังกั้นห้องหัวใจรั่ว หัวใจห้องล่างซ้ายโตมาก หรือความดันปลายคลายตัวของ LV สูงมากอยู่ก่อน**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์อธิบายลูกโซ่ของ tamponade เป็นขั้น ๆ จาก **effusion → equalize ความดันทุกห้องกับช่องเยื่อหุ้มหัวใจที่ 20−25 mmHg → transmural filling pressure ลด → ปริมาตรหัวใจเล็กลง → SV ลด** ให้ท่องลูกโซ่นี้แล้วจะตอบข้อกลไกได้ทุกแบบ\n- สไลด์ระบุว่า **JVP ที่สูงบ่งชี้ว่าเป็น tamponade ที่รุนแรงแล้ว**\n- สไลด์แยกกลไกของ pulsus paradoxus ออกเป็นข้อ ๆ รวมถึงข้อที่คนมักลืมคือ **afterload ที่เพิ่มขึ้นจากความดันลบในช่องอกและแรงดึงจากกะบังลม**\n", "pearls": ["Tamponade คือปัญหาการเติมเลือด ไม่ใช่การบีบตัว — ห้ามให้ยาขับปัสสาวะและยาขยายหลอดเลือด", "ความดันคลายตัวทุกห้องเท่ากันหมดที่ราว 20−25 mmHg คือหัวใจของกลไก", "Tamponade = obstructive shock เช่นเดียวกับ PE ขนาดใหญ่และ tension pneumothorax", "Pulsus paradoxus = ซิสโตลิกตกเกิน 10 mmHg ตอนหายใจเข้า จากผนังกั้นเบนไปซ้ายเบียด LV", "Aortic dissection ที่เลือดย้อนเข้าเยื่อหุ้มหัวใจ อาจเกิด tamponade โดยไม่มี pulsus paradoxus"], "items": [{"id": "C-OLD-06", "kind": "old", "stem": "A patient has muffled heart sounds, hypotension and distended neck veins, then develops shock. What type of shock is this?", "choices": ["Distributive shock", "Neurogenic shock", "Obstructive shock", "Hypovolaemic shock", "Cardiogenic shock from pump failure"], "answer": 2, "explain": "**Beck triad = cardiac tamponade → obstructive shock** เพราะน้ำในถุงหุ้มหัวใจขัดขวางการคลายตัวและการเติมเลือดของหัวใจห้องล่าง (preload ตก) ทั้งที่กล้ามเนื้อหัวใจเองยังบีบตัวได้ดี; กลุ่ม obstructive ยังรวม tension pneumothorax และ massive pulmonary embolism", "pearl": "", "topic": "", "src": "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 7 / MED34 FA MCQ ข้อ 10", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "2.2.7"]}, {"id": "C-OLD-08", "kind": "old", "stem": "A patient with known pericardial effusion becomes hypotensive with BP 80/50 mmHg, pulse 120/min, and distended neck veins that do not collapse on inspiration. Which physical sign best supports tamponade physiology?", "choices": ["Pulsus alternans", "Pulsus paradoxus — an inspiratory fall in systolic pressure of more than 10 mmHg", "Bounding pulse with wide pulse pressure", "Collapsing pulse with head bobbing", "Kussmaul sign with a rapid y descent"], "answer": 1, "explain": "**Pulsus paradoxus** เกิดจาก ventricular interdependence: เมื่อหายใจเข้า เลือดกลับเข้าห้องขวามากขึ้น ผนังกั้นห้องหัวใจถูกดันไปทางซ้ายในถุงที่ขยายไม่ได้ → stroke volume ซ้ายลด ความดันช่วงหายใจเข้าจึงตกเกิน 10 mmHg; **Kussmaul sign เด่นใน constrictive pericarditis** ไม่ใช่ tamponade", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D (A 28 year-old female with acute pericarditis, electrical alternans)", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "B7.1.2(2)"]}, {"id": "C-OLD-09", "kind": "old", "stem": "In cardiac tamponade, echocardiography shows right atrial and right ventricular diastolic collapse. Which mechanism best explains the haemodynamic compromise?", "choices": ["Fixed obstruction of the left ventricular outflow tract", "Raised intrapericardial pressure impairs diastolic filling, with ventricular interdependence across the septum", "Loss of myocardial contractility from ischaemia", "Severe systemic vasodilatation from cytokine release", "Acute valvular regurgitation causing volume overload"], "answer": 1, "explain": "หัวใจอยู่ในถุงที่ยืดไม่ทัน — **ความดันในถุงสูงกว่าความดันในห้องหัวใจช่วงคลายตัว จึงกดห้องที่ผนังบางที่สุด (RA แล้ว RV) ยุบลงในช่วง diastole** ปริมาตรรวมในถุงคงที่ ทำให้ห้องซ้ายและขวาต้องแย่งพื้นที่กัน (ventricular interdependence) จนเกิด pulsus paradoxus", "pearl": "", "topic": "", "src": "MED34 ข้อสอบ MED ครั้งที่ 4 MCQ ข้อ 30", "ref": [], "nl": ["B7.2.3(1)", "B7.1.2(2)", "2.2.2"]}, {"id": "C-MCQ-02", "kind": "mcq", "stem": "A 28-year-old woman with acute pericarditis returns with progressive dyspnea. Vital signs: PR 122/min, BP 84/62 mmHg, RR 26/min. Neck veins are distended to the angle of the jaw and do not collapse on inspiration. Heart sounds are distant. ECG now shows beat-to-beat variation of QRS amplitude (electrical alternans). Which of the following additional physical findings is most likely to be present?", "choices": ["Bibasilar fine crepitations in both lower lung fields", "Hyperdynamic apical impulse displaced laterally", "Loud S3 gallop at the apex", "Wide pulse pressure with bounding peripheral pulses", "Inspiratory fall in systolic blood pressure of more than 10 mmHg"], "answer": 4, "explain": "กลไก: effusion ทำให้ intrapericardial pressure สูงเท่ากันทุก chamber (pressure equalization) → pericardium กลายเป็น fixed-volume box ดังนั้น RV กับ LV ต้อง **แย่งพื้นที่กัน (interventricular interdependence)**\n\nช่วง inspiration: intrathoracic pressure ลบมากขึ้น → venous return เข้า RV เพิ่ม → RV โป่ง → septum ดันไปเบียด LV → LV filling ลด → stroke volume ลด → **systolic BP ตกลง >10 mmHg = pulsus paradoxus** (จริงๆคือ exaggeration ของสรีรวิทยาปกติ ไม่ใช่ paradox)\n\nElectrical alternans = หัวใจแกว่ง (swinging heart) ในถุงน้ำ ทำให้แกนไฟฟ้าเปลี่ยนสลับ beat ต่อ beat — specific มากสำหรับ large effusion with tamponade\n\nทำไมข้ออื่นผิด:\n- **S3 gallop**: เกิดจาก rapid ventricular filling ใน volume-overloaded ventricle (HF, severe MR) — ใน tamponade ventricle **filling ไม่ได้** จึงไม่มี S3; ตรงข้ามกับกลไกเลย\n- **Bibasilar crepitation**: tamponade คือ **obstructive** ไม่ใช่ LV failure → ปอดมักจะ clear (จุดนี้เอามาแยก tamponade ออกจาก LV failure / doxorubicin cardiomyopathy ในข้อสอบบ่อย)\n- **Hyperdynamic displaced apex**: บ่งถึง LV volume overload/dilated cardiomyopathy; tamponade จะคลำ apex ไม่ชัดเพราะมีน้ำคั่น\n- **Wide pulse pressure**: เข้ากับ AR/thyrotoxicosis/anemia — tamponade มี **narrow pulse pressure** เพราะ stroke volume ต่ำ", "pearl": "Beck triad (hypotension + distended neck veins + muffled heart sounds) ครบทั้ง 3 พบจริงแค่ส่วนน้อย; **pulsus paradoxus + JVP ไม่ยุบตอนหายใจเข้า** sensitive กว่า. ข้อสอบชอบถามว่า shock ชนิดไหน → **obstructive shock**", "topic": "Cardiac tamponade – additional physical finding", "src": "", "ref": ["MED31 past paper loop C&D – A 28 year-old female with acute pericarditis develops jugular venous obstruction and hypotension. The ECG shows electrical alternans", "MED34 FA MCQ ข้อ 4 – EKG Electrical alternans → Cardiac tamponade", "MED35 สอบลงกองครั้งที่ 1 MCQ ข้อ 7 – Beck triad → Obstructive shock", "MED30 SAQ ข้อ 6 – Beck triad → Cardiac tamponade"], "nl": ["B7.2.3(1)", "2.2.2", "2.1.34"]}]}, {"id": "cardio-04-08", "title": "Tamponade — การวินิจฉัย การเลือกจังหวะเจาะ และสิ่งที่ห้ามทำ", "minutes": 10, "summary": "ECG สองอย่าง เอคโค่สี่อย่าง และคะแนนที่ใช้ตัดสินว่าเจาะเลยหรือรอได้", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.3(1)", "2.2.2", "3.3.23", "3.1.12"], "md": "### ECG\n| สิ่งที่พบ | ความหมาย |\n|---|---|\n| **Low voltage** | **ไวแต่ไม่จำเพาะ** — ขึ้นกับ **ปริมาณน้ำ** และ **ความสามารถนำไฟฟ้าของน้ำ** (น้ำกั้นสัญญาณไฟฟ้าจากหัวใจถึงผิวหนัง) |\n| **Electrical alternans** | **จำเพาะกว่าแต่ไวน้อยกว่า** — **ขนาดของ QRS สลับสูงต่ำทีละจังหวะ** เกิดจาก **หัวใจแกว่งไปมาในถุงน้ำ (swinging heart)** · พบได้ในภาวะอื่นด้วยเช่น **PSVT ความดันโลหิตสูง และภาวะขาดเลือด** |\n\n> **สามอย่างรวมกันคือภาพจำของข้อสอบ — sinus tachycardia + low voltage + electrical alternans = tamponade**\n\n### ภาพรังสีทรวงอก\n**ผิดปกติต่อเมื่อมีน้ำอย่างน้อยปานกลาง** — **เงาหัวใจโตทรงขวดน้ำ** · **fat pad sign ในท่าด้านข้าง** · **ปอดดูเลือดน้อย**\n> **จุดที่ใช้แยกจากหัวใจล้มเหลวได้ดี — เงาหัวใจโตมากแต่ \"ปอดโล่ง\" ไม่มีน้ำคั่งในปอด** ถ้าหัวใจโตจากหัวใจล้มเหลวมักเห็นการคั่งของเลือดในปอดร่วมด้วย\n\n### เอคโค่ — การตรวจที่ตัดสิน\n**สิ่งที่มองหา (เรียงตามลำดับที่ความดันในช่องเยื่อหุ้มหัวใจสูงขึ้น)**\n1. **ห้องบนขวายุบตัวในช่วงปลายคลายตัว (right atrial collapse)** — **ไวที่สุด** เกิดก่อน (ถ้ายุบนานเกิน 1 ใน 3 ของรอบการเต้น ยิ่งจำเพาะ)\n2. **ห้องล่างขวายุบตัวในช่วงต้นคลายตัว (right ventricular diastolic collapse)** — **จำเพาะกว่า**\n3. **IVC ขยายและไม่ยุบตามการหายใจ** — บ่งชี้ความดันหลอดเลือดดำสูง\n4. **การแปรผันของความเร็วการไหลผ่านลิ้นตามการหายใจมากผิดปกติ** — ลิ้นไตรคัสปิดเพิ่มขึ้นตอนหายใจเข้า ลิ้นไมทรัลลดลง (เป็นภาพเอคโค่ของ pulsus paradoxus)\n5. **หัวใจแกว่งในถุงน้ำ (swinging heart)**\n\n> **หลักที่ต้องยึด — tamponade เป็นการวินิจฉัยทางคลินิกร่วมกับสรีรวิทยา ไม่ใช่วินิจฉัยจากขนาดน้ำ** คนไข้ที่น้ำน้อยแต่มาเร็วอาจเป็น tamponade ส่วนคนไข้ที่น้ำมากแต่สะสมช้าอาจยังสบายดี\n\n### จะเจาะเลยหรือรอได้ — คะแนนคัดกรองในสไลด์\nสไลด์ยกตารางให้คะแนนจาก **สาเหตุ + อาการทางคลินิก + ภาพถ่าย** โดย **คะแนนรวมมากกว่า 6 ถือว่าเสี่ยงสูง**\n- ตัวอย่างที่ให้คะแนนสูง: **มะเร็ง 2 · วัณโรค 2 · นอนราบไม่ได้ (orthopnoea) 3 · น้ำปริมาณมากรอบหัวใจ 3 · pulsus paradoxus > 10 mmHg 2 · อาการแย่ลงเร็ว 2 · ห้องบนซ้ายยุบ 2 · ห้องล่างขวายุบ 1.5 · IVC ขยายไม่ยุบ 1.5**\n- ตัวอย่างที่ให้คะแนน **ติดลบ** (คือลดความเร่งด่วน): **ไทรอยด์ผิดปกติ −1 · โรคภูมิต้านตนเองของระบบ −1 · โรคดำเนินช้า**\n\n**การใช้งานตามที่สไลด์วางไว้**\n> **คนไข้ที่วินิจฉัย tamponade ชัดเจนแล้ว → ถ้าคะแนนความเสี่ยงสูง (>6) ให้ทำการเจาะระบายน้ำ · ถ้าไม่เข้าเกณฑ์เสี่ยงสูง สามารถเลื่อนการเจาะออกไปและให้ยาต้านการอักเสบแบบคาดการณ์ก่อนได้ แล้วติดตามอาการ ถ้าไม่ดีขึ้นจึงทำ pericardial window**\n\n**แนวทางที่ใช้เจาะ** — สไลด์แสดงสามทาง: **parasternal · substernal (subxiphoid) · apical** และปัจจุบัน **ใช้เอคโค่นำทางเสมอเมื่อทำได้** เพราะปลอดภัยกว่าการอาศัยจุดกายวิภาคอย่างเดียว\n\n### สิ่งที่ \"ห้ามทำ\" — และเหตุผลเชิงกลไก\n| ห้ามทำ | เพราะ |\n|---|---|\n| **ยาขับปัสสาวะ** | ลด preload ที่หัวใจต้องใช้ฝืนความดันในถุงน้ำ → **ความดันตกทันที** |\n| **ยาขยายหลอดเลือด (รวมไนเตรต)** | ลด preload และความดันเลือดที่ยังพอเลี้ยงอวัยวะอยู่ |\n| **ใส่ท่อช่วยหายใจและให้ความดันบวก ถ้ายังไม่ได้ระบายน้ำ** | **ความดันบวกในช่องอกลดเลือดดำที่กลับเข้าหัวใจ → อาจหัวใจหยุดเต้นทันทีหลังใส่ท่อ** — ถ้าจำเป็นต้องใส่ ควรเตรียมเจาะระบายให้พร้อมก่อน |\n\n**สิ่งที่ควรทำระหว่างรอเจาะ** — **ให้สารน้ำทางหลอดเลือดเพื่อประคองความดัน** (ช่วยได้จริงในรายที่ปริมาตรเลือดต่ำ) และ **รีบระบายน้ำ ซึ่งเป็นการรักษาที่แท้จริงเพียงอย่างเดียว**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์อธิบาย **low voltage** ว่าขึ้นกับสองอย่างคือ **ปริมาณน้ำ และความสามารถนำไฟฟ้าของน้ำนั้น** ซึ่งเป็นเหตุผลที่ค่านี้ไม่จำเพาะ\n- สไลด์อธิบาย **electrical alternans** ว่าเกิดจาก **การแกว่งของหัวใจ** และย้ำว่าพบใน **PSVT ความดันโลหิตสูง และภาวะขาดเลือด** ได้ด้วย\n- สไลด์ให้ **ตารางคะแนนคัดกรองเต็มหน้า พร้อมจุดตัดที่คะแนนรวม > 6** และมีเส้นทาง **\"postpone pericardiocentesis + empiric anti-inflammatory therapy\"** สำหรับคนที่ไม่เข้าเกณฑ์เสี่ยงสูง ซึ่งเป็นแนวคิดที่ใหม่กว่าการเจาะทุกรายที่มีน้ำมาก\n", "pearls": ["Sinus tachycardia + low voltage + electrical alternans = tamponade", "เอคโค่: ห้องบนขวายุบไวที่สุด · ห้องล่างขวายุบตอนต้น diastole จำเพาะกว่า · IVC ขยายไม่ยุบ", "เงาหัวใจโตมากแต่ปอดโล่ง แยก tamponade ออกจากหัวใจล้มเหลวได้", "คะแนนความเสี่ยงรวม > 6 = เจาะระบาย · ต่ำกว่านั้นเลื่อนได้และให้ยาต้านการอักเสบก่อน", "ห้ามให้ยาขับปัสสาวะและยาขยายหลอดเลือด · ระวังหัวใจหยุดเต้นหลังใส่ท่อช่วยหายใจถ้ายังไม่ระบายน้ำ"], "items": [{"id": "C-OLD-05", "kind": "old", "stem": "An ECG shows beat-to-beat variation in the amplitude of the QRS complexes (electrical alternans) with sinus tachycardia and low voltage. What is the most likely diagnosis?", "choices": ["Wolff-Parkinson-White syndrome", "Atrial fibrillation", "Hypertrophic cardiomyopathy", "Cardiac tamponade", "Ventricular bigeminy"], "answer": 3, "explain": "**Electrical alternans = หัวใจแกว่งไปมาในถุงน้ำ** ทำให้แกนไฟฟ้าเปลี่ยนทุกจังหวะ พบร่วมกับ **low voltage และ sinus tachycardia** เป็นสามอย่างคลาสสิกของ pericardial effusion ขนาดใหญ่/tamponade", "pearl": "", "topic": "", "src": "MED34 FA MCQ ข้อ 4", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "B7.3(3)"]}, {"id": "C-OLD-07", "kind": "old", "stem": "A hypotensive patient has an ECG with low voltage and electrical alternans, and echocardiography shows a large pericardial effusion with right atrial collapse. What is the most appropriate immediate management?", "choices": ["Intravenous furosemide", "Intravenous beta-blocker", "Urgent echo-guided pericardiocentesis", "Start warfarin", "Immediate coronary angiography"], "answer": 2, "explain": "**Tamponade ที่มีความดันตกต้องระบายน้ำออกทันที** โดยเจาะใต้ลิ้นปี่ภายใต้การนำด้วยอัลตราซาวด์ ระหว่างรอให้สารน้ำเพื่อประคอง preload; **ห้ามให้ยาขับปัสสาวะหรือยาลดการบีบตัวของหัวใจ** เพราะจะยิ่งลด preload และทำให้ความดันตกลงอีก", "pearl": "", "topic": "", "src": "MED31 MCQ ข้อ 28 และข้อ 36", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "3.3.23"]}, {"id": "C-MCQ-03", "kind": "mcq", "stem": "A 40-year-old woman with breast cancer (T2N1M0) presents with dyspnea progressing over 3 days. She completed 6 cycles of cyclophosphamide, doxorubicin and fluorouracil 6 months ago. She has no pleuritic chest pain. Vital signs: BP 80/60 mmHg with a 14 mmHg inspiratory fall in systolic pressure, PR 120/min. Jugular venous pressure is elevated to 10 cm. Lungs are clear on auscultation. There is trace pitting edema of both legs. Chest radiograph shows cardiomegaly with a globular heart, no pleural effusion and no pulmonary infiltrate. Which of the following is the most likely diagnosis?", "choices": ["Pericardial tamponade from malignant pericardial effusion", "Doxorubicin-induced dilated cardiomyopathy", "Acute pulmonary embolism", "Tension pneumothorax", "Superior vena cava syndrome"], "answer": 0, "explain": "กลไกที่ใช้ตัดสิน: ทั้ง tamponade และ anthracycline cardiomyopathy ทำให้ **JVP สูง + cardiomegaly + hypotension** ได้เหมือนกัน จุดแยกอยู่ที่ **ปอด**\n\n- **Tamponade** = obstructive, ขัดที่ diastolic filling ของทั้งสอง ventricle พร้อมกัน → เลือดไม่เข้าหัวใจ แต่ก็ **ไม่คั่งในปอดด้วย** → ปอด clear + pulsus paradoxus + narrow pulse pressure + globular/water-bottle heart\n- **Doxorubicin cardiomyopathy** = LV systolic failure → LVEDP สูง ย้อนไป pulmonary capillary → **ต้องมี crepitation / pulmonary congestion บน CXR** และมักมี S3\n\nเคสนี้: ปอด clear + pulsus paradoxus 14 mmHg + ไม่มี pulmonary infiltrate → **tamponade** (malignant pericardial effusion พบบ่อยใน breast CA, lung CA, lymphoma)\n\nทำไมข้ออื่นผิด:\n- **Doxorubicin cardiomyopathy**: ตัดด้วย clear lungs + pulsus paradoxus (ไม่ใช่ feature ของ systolic HF). Anthracycline toxicity เกิดจาก topoisomerase-2β inhibition → ROS ทำลาย cardiomyocyte, dose-dependent (>450-550 mg/m2) — ถ้าเป็นจริง CXR จะมี pulmonary edema\n- **PE**: ให้ hypotension + JVP สูงได้ (obstructive เหมือนกัน) แต่มักมี pleuritic pain, hypoxemia เด่น, CXR มักปกติ **ไม่มี cardiomegaly** และ ไม่มี pulsus paradoxus ชัด\n- **SVC syndrome**: คอ/หน้าบวม, distended chest wall vein, JVP สูงแบบ **ไม่ pulsatile และไม่เปลี่ยนตามหายใจ** แต่ไม่ทำให้ hypotension + cardiomegaly\n- **Tension pneumothorax**: ต้องมี unilateral absent breath sound + hyperresonance + trachea shift — โจทย์บอก breath sound ปกติทั้งสองข้าง", "pearl": "ถ้าโจทย์มี **JVP สูง + ปอด clear** ให้คิด obstructive (tamponade, PE, constrictive pericarditis) หรือ RV failure เสมอ; ถ้า **JVP สูง + ปอดมี crackle** ให้คิด LV failure", "topic": "Post-chemotherapy dyspnea – tamponade vs anthracycline cardiomyopathy", "src": "", "ref": ["MED31 past paper loop C&D – ผู้ป่วยหญิง 40 ปี breast cancer T2N1M0 หลัง CAF chemotherapy, JVP elevated 10 cm, lungs clear → Pericardial tamponade", "MED32 MCQ ข้อ 64 – ได้ chemo มี doxorubicin → doxorubicin induced cardiomyopathy", "MED34 FA MCQ ข้อ 10 – chemotherapy ตัวไหนทำให้เกิด cardiomyopathy → Doxorubicin"], "nl": ["B7.2.3(1)", "2.2.2", "B7.2.5(2)"]}, {"id": "C-OLD-12", "kind": "old", "stem": "A 40-year-old woman with breast cancer treated with a CAF regimen 6 months ago presents with dyspnoea, BP 80/60 mmHg, JVP elevated 10 cm, clear lungs and cardiomegaly on chest radiograph. What is the most likely diagnosis?", "choices": ["Doxorubicin-induced dilated cardiomyopathy", "Superior vena cava obstruction", "Pulmonary embolism", "Constrictive pericarditis", "Pericardial effusion with tamponade"], "answer": 4, "explain": "**ปอดใส + JVP สูง + ความดันตก + เงาหัวใจโต = มีน้ำในถุงหุ้มหัวใจจนกดหัวใจ** ซึ่งพบบ่อยจากมะเร็งแพร่กระจายมาที่เยื่อหุ้มหัวใจ; ถ้าเป็น **doxorubicin cardiomyopathy** จะมีปอดบวมน้ำและ EF ต่ำ ไม่ใช่ปอดใส — ข้อนี้โพยจงใจวางสองตัวเลือกนี้คู่กัน ให้ดูที่ 'ปอดใส'", "pearl": "", "topic": "", "src": "MED31 past paper loop C&D", "ref": [], "nl": ["B7.2.3(1)", "2.2.2", "2.3.2"]}]}, {"id": "cardio-04-09", "title": "Constrictive pericarditis — กลไกและการตรวจร่างกาย", "minutes": 9, "summary": "หัวใจถูกกล่องแข็งหุ้ม — สามสัญญาณที่ตรวจเจอข้างเตียง", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "B7.1.2(2)", "2.3.9(5)", "2.3.4(20)"], "md": "### เป็นอะไรและเกิดเมื่อไร\n- **เป็นระยะสุดท้ายของกระบวนการอักเสบที่เยื่อหุ้มหัวใจ**\n- **มักใช้เวลาเป็นปีกว่าจะเกิด**\n- พยาธิสภาพคือ **พังผืด หินปูน และการยึดติดกันของเยื่อหุ้มหัวใจ** จนกลายเป็นกล่องแข็งหุ้มหัวใจไว้\n- สาเหตุในบ้านเรา: **วัณโรคเป็นอันดับต้น** · อื่น ๆ คือ **หลังผ่าตัดหัวใจ · หลังฉายรังสี (ใช้เวลา 2−20 ปี) · ไตวาย · รูมาตอยด์ · ไม่ทราบสาเหตุ**\n\n### กลไกหลักที่ต้องเข้าใจก่อนอย่างอื่น\n> **เยื่อหุ้มหัวใจที่หนาแข็ง ทำให้การเปลี่ยนแปลงความดันจากการหายใจในช่องอก ส่งผ่านเข้าไปถึงห้องหัวใจไม่ได้**\n\nผลที่ตามมาเป็นทอด ๆ\n1. **ปกติเมื่อหายใจเข้า ความดันลบในช่องอกจะส่งผ่านไปถึงห้องหัวใจซ้ายและหลอดเลือดปอด ทำให้เลือดไหลจากปอดเข้าสู่ LV ได้ดี** — ในภาวะรัดตัว การส่งผ่านนี้หายไป\n2. **ห้องหัวใจซ้ายจึงเติมเลือดได้น้อยลงตอนหายใจเข้า** ขณะที่ **ห้องขวายังได้เลือดดำเพิ่มขึ้นตามปกติ**\n3. **ปริมาตรรวมถูกตรึงด้วยกล่องแข็ง → ห้องซ้ายและขวาแย่งที่กันชัดเจน (enhanced ventricular interdependence)**\n4. **การเติมเลือดในช่วงต้นคลายตัวเร็วผิดปกติ แล้วหยุดกึกเมื่อชนผนังกล่อง** — เป็นที่มาของทั้ง **pericardial knock** และลักษณะ **\"dip-and-plateau\" หรือ \"square root sign\"** ในการสวนหัวใจ\n\n### อาการ\n- **อาการของหัวใจซีกขวาล้มเหลวเด่นที่สุด** — **ขาบวม ตับคั่งเลือด ลุกลามเป็นท้องมาน บวมทั้งตัว ตัวเหลืองจากตับแข็งจากหัวใจ (cardiac cirrhosis)**\n- **อาการของหัวใจซีกซ้าย** — เหนื่อย ไอ **นอนราบไม่ได้และตื่นมาหอบกลางคืน**\n- **ระยะท้าย — ผลของ CO ที่ต่ำเรื้อรังเด่นขึ้น: อ่อนเพลีย กล้ามเนื้อลีบ ผอมแห้ง (cachexia)**\n- **น้ำในช่องเยื่อหุ้มปอดกลับเป็นซ้ำ และเป็นลม**\n\n> **กับดักที่พบบ่อยที่สุดในเวชปฏิบัติ** — ผู้ป่วยมาด้วย **ท้องมาน ขาบวม ตับโต ตัวเหลือง** จึงถูกวินิจฉัยเป็น **ตับแข็ง** และรักษาผิดทางอยู่นาน **ตัวแยกคือ JVP** — ตับแข็งไม่ทำให้ JVP สูง แต่ constriction ทำให้ JVP สูงเสมอ **ดังนั้นคนไข้ท้องมานทุกคนต้องดูหลอดเลือดดำที่คอ**\n\n### สามสัญญาณข้างเตียงที่ต้องตรวจให้เป็น\n**1. JVP สูง ร่วมกับ y descent ที่เด่นและยุบลงเร็วมาก**\n- เพราะ **ช่วงต้นคลายตัวเลือดไหลเข้าห้องล่างเร็วมาก** (กล่องแข็งยังไม่ขวางในช่วงแรก) แล้วจึงหยุดกึก\n\n**2. Kussmaul's sign**\n- **การที่ JVP ไม่ลดลงตามปกติเมื่อหายใจเข้า** (สไลด์อธิบายว่าเป็นการสูญเสียการเพิ่มขึ้นของเลือดดำที่กลับเข้าหัวใจขวาตามปกติขณะหายใจเข้า ทั้งที่การไหลผ่านลิ้นไตรคัสปิดเพิ่มขึ้น)\n- **พบใน constriction · RV infarction · restrictive cardiomyopathy — แต่โดยทั่วไป \"ไม่พบ\" ใน tamponade**\n\n**3. Pericardial knock**\n- **เสียงในช่วงต้นคลายตัว ฟังได้ดีที่สุดที่ขอบซ้ายของกระดูกอกและ/หรือยอดหัวใจ**\n- **ตรงกับจังหวะที่การเติมเลือดของห้องล่างหยุดลงอย่างกะทันหัน**\n- เสียงนี้ **ดังและมาเร็วกว่า S3 ปกติ**\n\n**อื่น ๆ** — **S2 แยกกว้าง** · **เสียงฟู่จากลิ้นไตรคัสปิดรั่ว** · **pulsus paradoxus พบราว 1 ใน 3 ของผู้ป่วย**\n\n### การตรวจเบื้องต้น\n- **ECG — ไม่จำเพาะ**: T wave ผิดปกติ ไฟฟ้าต่ำ ห้องบนซ้ายโต **หัวใจห้องบนเต้นพลิ้ว (AF)**\n- **ภาพรังสีทรวงอก** — อาจเห็นน้ำในเยื่อหุ้มปอด และ **หินปูนเกาะเยื่อหุ้มหัวใจ ซึ่งชี้ไปที่วัณโรคอย่างมากในบริบทไทย**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์ให้ประโยคกลไกไว้สั้น ๆ ประโยคเดียวคือ **\"failure of transmission of intrathoracic respiratory pressure changes to the cardiac chambers through thickened pericardium\"** — ถ้าจำประโยคนี้ได้ จะไล่อธิบายทุกสัญญาณของ constriction ได้เอง\n- สไลด์ระบุว่า **pericardial knock ตรงกับ \"early, abrupt cessation of ventricular filling\"**\n- สไลด์ให้ตัวเลข **pulsus paradoxus พบใน 1 ใน 3 ของผู้ป่วย constriction** ซึ่งเตือนว่าอาการนี้ไม่ได้มีเฉพาะใน tamponade\n- สไลด์แสดงภาพ **หินปูนเกาะเยื่อหุ้มหัวใจ (calcified pericardium)** เต็มหนึ่งหน้า\n", "pearls": ["กลไกเดียวที่ต้องจำ — เยื่อหุ้มที่หนาแข็งกันไม่ให้ความดันจากการหายใจส่งผ่านเข้าห้องหัวใจ", "คนไข้ท้องมาน ขาบวม ตับโต ที่ JVP สูง ต้องคิดถึง constriction ไม่ใช่ตับแข็ง", "JVP สูงพร้อม y descent เด่นและยุบเร็ว · Kussmaul's sign · pericardial knock", "Kussmaul's sign พบใน constriction, RV infarction และ restrictive CM แต่ไม่พบใน tamponade", "หินปูนเกาะเยื่อหุ้มหัวใจในบ้านเราชี้ไปที่วัณโรค · หลังฉายรังสีใช้เวลา 2−20 ปี"], "items": [{"id": "C-OLD-16", "kind": "old", "stem": "Which physical finding is characteristic of constrictive pericarditis rather than cardiac tamponade?", "choices": ["Pulsus paradoxus greater than 10 mmHg", "Muffled heart sounds with electrical alternans", "Continuous machinery murmur", "Pericardial knock with Kussmaul sign and a prominent y descent", "Bounding pulse with wide pulse pressure"], "answer": 3, "explain": "**Constrictive pericarditis**: เยื่อหุ้มหัวใจหนาแข็ง เลือดไหลเข้าเร็วตอนต้น diastole แล้วหยุดกึก → ได้ยิน **pericardial knock**, **y descent ชัน** และ **Kussmaul sign** (JVP สูงขึ้นเมื่อหายใจเข้า); ต่างจาก tamponade ที่ y descent หายไปและมี pulsus paradoxus เด่น", "pearl": "", "topic": "", "src": "MED30 สรุป Cardio (หน้า 272-277)", "ref": [], "nl": ["B7.2.2-3(3)", "2.3.9-3(6)", "B7.1.2(2)"]}]}, {"id": "cardio-04-10", "title": "แยก constriction จาก restriction และการรักษา", "minutes": 10, "summary": "คำเดียวที่ตัดสินคือ discordance — และผ่าตัดคือการรักษาที่แท้จริง", "source": "สไลด์ อ.เจตวรงค์ (Jaidwarong Thanakitcharu, M.D.) หน่วยโรคหัวใจ รพ.ราชวิถี — Inflammatory MyoPericardial Syndrome", "nl": ["B7.2.2-3(3)", "3.3.23", "B7.1.2(2)", "2.3.9(5)"], "md": "### ทำไมสองโรคนี้จึงแยกยาก\nทั้งคู่ให้ภาพเหมือนกันหมด — **JVP สูง ท้องมาน ขาบวม หัวใจไม่โต EF ปกติ และมีปัญหาการคลายตัว** แต่ **การรักษาต่างกันสิ้นเชิง: constriction ผ่าตัดแล้วหายได้ ส่วน restriction ผ่าตัดไม่ช่วย**\n\n> **หลักคิดเดียวที่ใช้แยกได้ทุกการตรวจ**\n> **Constriction = ปัญหาอยู่ \"นอก\" หัวใจ** → หัวใจเองยังดี แต่ถูกกล่องหุ้ม → **การหายใจส่งผลต่างกันระหว่างซ้ายกับขวา → เกิด \"discordance\" และการแย่งที่กัน**\n> **Restriction = ปัญหาอยู่ \"ใน\" เนื้อกล้ามเนื้อหัวใจ** (แอมีลอยด์ พังผืด เหล็กสะสม) → **ทั้งสองห้องแข็งเหมือนกัน การหายใจส่งผลไปทางเดียวกัน → \"concordance\"**\n\n### ตารางแยก\n\n| | **Constrictive pericarditis** | **Restrictive cardiomyopathy** |\n|---|---|---|\n| **การสวนหัวใจ (ตัวตัดสิน)** | **พื้นที่ใต้กราฟความดัน RV และ LV เปลี่ยนไปคนละทางตามการหายใจ — หายใจเข้า RV เพิ่ม LV ลด = discordance** | **เปลี่ยนไปทางเดียวกัน (ขนานกัน) = concordance** |\n| **Square root / dip-and-plateau** | **มี** | **มีเช่นกัน — ข้อนี้แยกไม่ได้** |\n| **Mitral E ตามการหายใจ** | **เพิ่มขึ้น ≥ 25% ตอนหายใจออก** | **แปรผันน้อยกว่า 10%** |\n| **Hepatic vein** | **การไหลย้อนในช่วงคลายตัวเพิ่มขึ้นตอนหายใจออก** | ไหลย้อนเพิ่มตอนหายใจเข้า |\n| **TDI e′ ที่ medial annulus** | **สูงขึ้น (มักเกิน 8 cm/s)** — เรียกว่า **annulus paradoxus** | **ต่ำลง** |\n| **เทียบ e′ ข้างกับกลาง** | **e′ ด้านข้างต่ำกว่าด้านกลาง = annulus reversus** | e′ ด้านข้างสูงกว่าด้านกลาง (ตามปกติ) |\n| **Strain** | **circumferential strain, torsion และ early diastolic untwisting ลดลง · longitudinal strain ยังคงอยู่** | **longitudinal strain ลดลง · circumferential strain และ untwisting ยังคงอยู่** |\n| **ความหนาของเยื่อหุ้มหัวใจ** | **หนา ≥ 3 mm มีหินปูน** (ดูได้ดีที่สุดด้วย **TEE** หรือ CT) | ปกติ |\n| **NT-proBNP** | มักสูงไม่มาก | มักสูงมาก |\n| **สิ่งอื่นที่ช่วย** | ผนังกั้นห้องเบนตอนต้นคลายตัว · **IVC ขยายไม่ยุบ** · **ลิ้นพัลโมนารีเปิดก่อนกำหนด** จากความดัน RV ที่สูงในช่วงต้นคลายตัว | ผนังหัวใจหนา · ห้องบนโตมากทั้งสองข้าง · ลิ้นรั่วจากการแทรกของสาร |\n\n> **จำคำว่า annulus paradoxus และ annulus reversus ให้ได้** — ใน constriction เนื้อกล้ามเนื้อหัวใจยังดี แต่ถูกรัดจากด้านข้าง ทำให้ **การเคลื่อนตัวตามแนวยาวที่ผนังกั้น (medial) ยังดีหรือดีขึ้นด้วยซ้ำ ในขณะที่ด้านข้าง (lateral) ถูกเยื่อหุ้มที่แข็งตรึงไว้** จึงเกิดภาพกลับด้านจากคนปกติ\n\n### ข้อควรระวังเรื่องความแม่นยำ (สไลด์ระบุไว้)\n- **ผู้ป่วย constriction ถึง 20% ไม่แสดงการเปลี่ยนแปลงตามการหายใจแบบทั่วไป**\n- **การลด preload (เอียงหัวสูง หรือให้นั่ง) ช่วยเผยการเปลี่ยนแปลงที่ซ่อนอยู่ให้เห็นได้**\n- **ภาวะที่ทำให้ mitral inflow แปรผันตามการหายใจคล้าย constriction** — **COPD · กล้ามเนื้อหัวใจห้องขวาตาย · ลิ่มเลือดอุดกั้นปอด · น้ำในช่องเยื่อหุ้มปอด** ต้องแยกด้วยอาการและภาพถ่าย\n- **ตัวแยก COPD ออกจาก constriction คือการไหลใน SVC** — **ใน COPD การไหลไปข้างหน้าใน SVC เพิ่มขึ้นขณะหายใจเข้า ส่วนใน constriction ไม่เพิ่ม**\n\n### การรักษา\n**1. การผ่าตัดเยื่อหุ้มหัวใจออก (pericardiectomy) = การรักษาที่แท้จริง**\n- **อัตราตายระหว่างผ่าตัด 2−20%** ซึ่งสูงมาก จึงต้องเลือกจังหวะให้ดี — **ผ่าตัดเร็วในรายที่ยังไม่มีกล้ามเนื้อหัวใจเสียหายและยังไม่ผอมแห้ง ให้ผลดีกว่า**\n\n**2. การรักษาด้วยยาเป็นการประคับประคอง**\n- **ยาขับปัสสาวะและจำกัดเกลือ** เพื่อลดภาวะน้ำเกิน\n- **หลีกเลี่ยงยาที่ทำให้หัวใจเต้นช้า** (beta-blocker, non-dihydropyridine CCB) เพราะ **ปริมาตรที่บีบออกต่อครั้งถูกตรึงไว้แล้ว ปริมาณเลือดต่อนาทีจึงพึ่งอัตราการเต้นหัวใจเป็นหลัก**\n- **AF ที่เต้นเร็ว → ใช้ digoxin**\n\n**3. Transient constriction — กลุ่มที่ไม่ต้องผ่าตัด**\n> สไลด์ระบุว่า **ความเข้มของ late gadolinium enhancement ร่วมกับเยื่อหุ้มหัวใจหนา ≥ 3 mm ทำนายว่าจะตอบสนองต่อยาต้านการอักเสบและภาวะรัดตัวหายได้**\n- ให้ยา **นาน 6 เดือนหรือมากกว่า ขนาดเดียวกับที่ใช้ใน recurrent pericarditis**\n- สไลด์วางเส้นทางไว้ว่า **ถ้ามีเยื่อหุ้มหัวใจอักเสบร่วมด้วย ให้ลองยาต้านการอักเสบแบบคาดการณ์อย่างน้อย 3−6 เดือนก่อน ถ้าภาวะรัดตัวยังคงอยู่จึงส่งผ่าตัด**\n\n### ที่อาจารย์เน้นในสไลด์\n- สไลด์แสดงกราฟการสวนหัวใจสองแบบคู่กัน พร้อมคำบรรยายว่า **ใน constriction \"During inspiration the RV pressure curve area increases, whereas the LV pressure curve area decreases\"** ส่วนอีกภาพคือ **\"No evidence of enhanced ventricular interdependence; changes in LV and RV pressure curve areas are parallel\"** — สองประโยคนี้คือคำตอบของข้อสอบที่ถามว่าอะไรแยกสองโรคนี้ได้ดีที่สุด\n- สไลด์ให้จุดตัดของ **mitral E เพิ่มขึ้น ≥ 25% ตอนหายใจออก** และ **mitral E deceleration time มักน้อยกว่า 160 ms**\n- สไลด์เตือนว่า **TEE เห็นความหนาและหินปูนของเยื่อหุ้มหัวใจได้ดีที่สุด** ในบรรดาการตรวจด้วยคลื่นเสียง\n", "pearls": ["การสวนหัวใจ: discordance ของพื้นที่ใต้กราฟ RV/LV ตามการหายใจ = constriction · concordance = restriction", "Square root sign มีได้ทั้งสองโรค แยกไม่ได้ด้วยตัวมันเอง", "Annulus paradoxus (medial e′ สูง) และ annulus reversus (lateral ต่ำกว่า medial) = constriction", "Constriction: longitudinal strain ยังอยู่ circumferential เสีย · restriction กลับกัน", "ผ่าตัดเยื่อหุ้มหัวใจออกคือการรักษาที่แท้จริง แต่ตายระหว่างผ่าตัด 2−20% · เลี่ยงยาที่ทำให้หัวใจเต้นช้า"], "items": [{"id": "C-MCQ-05", "kind": "mcq", "stem": "A 55-year-old man with previously treated tuberculous pericarditis presents with 6 months of progressive abdominal distension and leg oedema. He denies orthopnoea. Vital signs: PR 92/min regular, BP 106/70 mmHg. JVP is elevated and rises further on inspiration. An early diastolic high-pitched sound is heard at the apex. The liver is enlarged, there is ascites and 3+ pitting oedema. Lungs are clear. Chest radiograph shows pericardial calcification and a normal-sized heart. Which of the following findings best supports the diagnosis of constrictive pericarditis rather than restrictive cardiomyopathy?", "choices": ["Presence of low-voltage QRS complexes in all leads", "Discordant respiratory variation of right and left ventricular systolic pressures on cardiac catheterisation", "Symmetrical left ventricular wall thickening with sparkling myocardial texture on echocardiography", "Reduced left ventricular ejection fraction of 35%", "Markedly elevated serum NT-proBNP level"], "answer": 1, "explain": "กลไกแกน: constriction คือ pericardium หนา/แข็ง/calcified → **แยกหัวใจออกจาก intrathoracic pressure (dissociation)** และบังคับให้ RV+LV อยู่ใน fixed total volume\n\nผลที่ตามมา 2 อย่างที่เป็น hallmark:\n1. **Ventricular interdependence** → inspiration: venous return เข้า RV เพิ่ม แต่ total volume คงที่ → **RV systolic pressure ขึ้น ขณะที่ LV systolic pressure ลง = discordance** (ใน restrictive cardiomyopathy pericardium ปกติ แรงดัน intrathoracic ส่งผ่านได้ปกติ → RV กับ LV ขึ้นลง **concordant** พร้อมกัน)\n2. **Kussmaul sign** (JVP สูงขึ้นตอนหายใจเข้า) และ **pericardial knock** (early diastolic sound จาก filling หยุดทันทีเมื่อชน pericardium ที่แข็ง) → ตรงกับโจทย์\n\nทำไมข้ออื่นผิด:\n- **NT-proBNP สูงมาก**: ใน constriction myocardium ถูก \"หุ้ม\" ไม่ได้ stretch มาก → BNP มักขึ้น **น้อยกว่า** restrictive cardiomyopathy ซึ่ง myocardium เองผิดปกติและถูก stretch เต็มที่ (ใช้แยกได้ แต่ทิศทางตรงข้ามกับที่ choice บอก — นี่คือจุดหลอก)\n- **Symmetrical LV thickening + sparkling texture**: นี่คือ **cardiac amyloidosis** = restrictive cardiomyopathy ไม่ใช่ constriction (ใน constriction ผนัง LV หนาปกติ)\n- **LVEF 35%**: ทั้งสองโรคเป็น **diastolic** dysfunction โดย EF มักจะยังปกติ; EF ตกบ่งถึง dilated cardiomyopathy มากกว่า\n- **Low voltage ทุก lead**: non-specific — พบได้ทั้งใน constriction, amyloid, pericardial effusion, COPD, obesity จึงแยกสองโรคนี้ไม่ได้", "pearl": "Constriction รักษาหายขาดได้ด้วย **pericardiectomy** ขณะที่ restrictive cardiomyopathy รักษาที่โรคต้นเหตุ
